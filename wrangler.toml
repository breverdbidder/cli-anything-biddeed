[vars]
# Non-secret config here. Secrets live in encrypted CF Worker secret bindings:
#   ROUTER_PROXY_KEY — set via: wrangler secret put ROUTER_PROXY_KEY
#     (value = vault.router_proxy_key in Supabase; authenticates /chat/api to
#     the anthropic-proxy edge function, which routes through the in-Postgres
#     Smart Router (Gemini Flash first) instead of calling api.anthropic.com
#     directly. See COST-FIX-5.)
#   ANTHROPIC_KEY — RETIRED as of COST-FIX-5, no longer read by src/worker.js.
#     Remove via: wrangler secret delete ANTHROPIC_KEY (after confirming
#     ROUTER_PROXY_KEY is deployed and /chat/api is verified working).
