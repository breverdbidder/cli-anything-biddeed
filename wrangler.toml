name = "worker-damp-snowflake-cead"
main = "src/worker.js"
compatibility_date = "2024-01-01"
account_id = "83ab3f2fbbabd1a9b01a018fb4efe219"
routes = [
  { pattern = "biddeed.ai/*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/buy-report*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/discover*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/security*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/disclaimer*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/terms*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/privacy*", zone_name = "biddeed.ai" },
  { pattern = "biddeed.ai/data-retention*", zone_name = "biddeed.ai" },
]

# LAUNCH-A (#20035): rate limiting (/chat/api 30/60s, /chat/lead 5/60s,
# /auctions 60/60s, /subscribe*+/buy-report* 20/60s, all per-IP) is enforced
# in src/worker.js via a per-isolate in-Worker counter, not a `ratelimits`
# binding here — verified live that Cloudflare's dedicated Rate Limiting
# binding always returns success:true on this Free-plan account (both the
# legacy unsafe.bindings and current GA config paths on biddeed-mcp-
# production), matching an open, unresolved Cloudflare community report.

[vars]
# Non-secret config here. Secrets live in encrypted CF Worker secret bindings:
#   GEMINI_API_KEY — OPTIONAL. set via: wrangler secret put GEMINI_API_KEY
#     /chat/api routes free-tier chat users (chat_rate_check_v2 tier='free')
#     to Gemini Flash directly when this is bound; unset = every tier falls
#     through to ROUTER_PROXY_KEY, so chat keeps working with zero config
#     either way.
#   ROUTER_PROXY_KEY — REQUIRED. set via: wrangler secret put ROUTER_PROXY_KEY
#     (value = vault.router_proxy_key). /chat/api routes every non-free-tier
#     request through the anthropic-proxy Supabase edge function (Claude Max
#     OAuth tier 1, Gemini fallback tier 2 — see
#     supabase/functions/anthropic-proxy/README.md). The Worker never calls
#     api.anthropic.com directly and ANTHROPIC_KEY is retired — it is no
#     longer read anywhere in src/worker.js.
#
#     ⚠ DEPLOY ORDERING — read before pushing this file or src/worker.js:
#     2026-07-31 incident (COST-FIX-5, a751682f) shipped this exact switch
#     without provisioning ROUTER_PROXY_KEY as a CF Worker secret first.
#     deploy-worker.yml auto-deploys on push to main touching this file or
#     src/worker.js, so the missing secret went straight to prod as
#     "Missing ROUTER_PROXY_KEY binding" on every /chat/api call. Before
#     merging: run `wrangler secret put ROUTER_PROXY_KEY` (and on
#     wrangler-staging.toml too) and smoke-test /chat/api end-to-end.
#   POSTHOG_PROJECT_KEY — OPTIONAL. set via: .github/workflows/set-posthog-worker-secret.yml
#     (workflow_dispatch; pulls vault.posthog_project_key, never printed).
#     captureError() in src/worker.js posts unhandled exceptions to PostHog's
#     capture API as $exception events. Unset = captureError() no-ops silently
#     (unlike ROUTER_PROXY_KEY above, this one is safe to deploy before
#     provisioning — error reporting is best-effort, never load-bearing).
