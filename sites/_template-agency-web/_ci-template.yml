name: "__AGENCY_NAME_PLACEHOLDER__ Web CI"

on:
  push:
    paths: ['sites/__SLUG_PLACEHOLDER__-web/**']
    branches: [main]
  pull_request:
    paths: ['sites/__SLUG_PLACEHOLDER__-web/**']

defaults:
  run:
    working-directory: sites/__SLUG_PLACEHOLDER__-web

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sites/__SLUG_PLACEHOLDER__-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_DOMAIN: __SITE_DOMAIN_PLACEHOLDER__
