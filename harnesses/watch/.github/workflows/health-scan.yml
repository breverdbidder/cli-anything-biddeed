name: Watch Health Scan

on:
  schedule:
    - cron: '0 7 * * *'  # 2 AM EST = 7 AM UTC
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - biddeed-ai
          - biddeed-ai-ui
          - cli-anything-biddeed
          - zonewise-scraper-v4
          - zonewise-web
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/${{ matrix.repo }}
          token: ${{ secrets.PAT4 }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Run health scan
        run: npx tsx ${{ github.workspace }}/../cli-anything-biddeed/harnesses/watch/src/health-scan.ts
        env:
          SCAN_TYPE: nightly
          REPO_NAME: ${{ matrix.repo }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
