[options]
; Non-secret template. DB host/user/password come from the odoo service's environment
; (HOST/USER/PASSWORD, handled by the official odoo:18 entrypoint) — this file
; intentionally does not set db_host/db_user/db_password.
;
; deploy-odoo.yml copies this file to infra/odoo/odoo.local.conf on the box (gitignored,
; never rsynced from git — see .gitignore) and appends a generated
; `admin_passwd = <secret>` line before `docker compose up -d`. docker-compose.yml
; mounts odoo.local.conf, not this file, into the container.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
list_db = False
proxy_mode = True
workers = 2
max_cron_threads = 1
longpolling_port = 8072
without_demo = all
