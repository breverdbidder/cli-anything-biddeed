name: 'Claude Code Runner'
description: 'Run Claude Code on GHA runner - no Hetzner SSH needed'
inputs:
  prompt:
    description: 'The prompt to send to Claude Code'
    required: true
  repo:
    description: 'Repository to clone and work in'
    required: false
    default: 'breverdbidder/cli-anything-biddeed'
  gh_pat:
    description: 'GitHub PAT for repo access'
    required: true
  claude_oauth_b64:
    description: 'Base64-encoded Claude OAuth token'
    required: true
  timeout_minutes:
    description: 'Max runtime in minutes'
    required: false
    default: '90'
  extra_env:
    description: 'Extra environment variables as KEY=VALUE lines'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3

    - name: Setup workspace
      shell: bash
      env:
        GH_PAT: ${{ inputs.gh_pat }}
        REPO: ${{ inputs.repo }}
      run: |
        git config --global user.email "claude@biddeed.ai"
        git config --global user.name "Claude-Code"
        git clone "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" /tmp/workspace
        cd /tmp/workspace
        git config user.email "claude@biddeed.ai"
        git config user.name "Claude-Code"

    - name: Configure Claude Code permissions
      shell: bash
      run: |
        mkdir -p /tmp/workspace/.claude
        cat > /tmp/workspace/.claude/settings.json << 'SETTINGS'
        {
          "permissions": {
            "allow": ["Bash(*)", "Write(*)", "Edit(*)", "Read(*)", "mcp__*"],
            "deny": []
          }
        }
        SETTINGS

    - name: Preflight OAuth check
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN_B64: ${{ inputs.claude_oauth_b64 }}
      run: |
        # HONESTY GATE: Verify OAuth before launching session.
        # Catches the "1-second exit, ghost success" failure mode.
        export CLAUDE_CODE_OAUTH_TOKEN=$(echo "$CLAUDE_CODE_OAUTH_TOKEN_B64" | base64 -d 2>/dev/null)
        if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
          echo "::error::CLAUDE_CODE_OAUTH_TOKEN_B64 secret is empty or undecodable"
          exit 78
        fi
        # Quick auth probe: 5-second smoke test
        cd /tmp/workspace
        PROBE_OUT=$(timeout 15 claude --print --dangerously-skip-permissions "say OK" 2>&1 || true)
        if echo "$PROBE_OUT" | grep -qiE "401|invalid bearer|authentication_error|failed to authenticate"; then
          echo "::error::Claude Code OAuth REJECTED (401 Invalid bearer token). Refresh CLAUDE_CODE_OAUTH_TOKEN_B64 secret."
          echo "Probe output: $PROBE_OUT"
          exit 77
        fi
        echo "✅ OAuth preflight passed"

    - name: Run Claude Code
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN_B64: ${{ inputs.claude_oauth_b64 }}
        GH_PAT: ${{ inputs.gh_pat }}
        EXTRA_ENV: ${{ inputs.extra_env }}
      run: |
        set -o pipefail
        # Decode OAuth
        export CLAUDE_CODE_OAUTH_TOKEN=$(echo "$CLAUDE_CODE_OAUTH_TOKEN_B64" | base64 -d)

        # Set extra env vars
        if [ -n "$EXTRA_ENV" ]; then
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< "$EXTRA_ENV"
        fi

        cd /tmp/workspace
        git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ inputs.repo }}.git"

        # HONESTY: capture actual exit code, do NOT mask with || true
        START=$(date +%s)
        set +e
        timeout $((60 * ${{ inputs.timeout_minutes }})) claude --print --dangerously-skip-permissions "${{ inputs.prompt }}"
        CC_EXIT=$?
        set -e
        END=$(date +%s)
        DURATION=$((END - START))

        echo "::notice::Claude Code exited with code $CC_EXIT after ${DURATION}s"

        # Detect ghost-success: <10s + exit 0 = almost certainly auth/setup failure
        if [ $CC_EXIT -eq 0 ] && [ $DURATION -lt 10 ]; then
          echo "::error::Claude Code exited 0 in ${DURATION}s — suspicious ghost success. Treating as failure."
          CC_EXIT=99
        fi

        # Push any partial work — but don't mask the original failure
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "WIP: summit partial progress (CC exit=$CC_EXIT)" || true
          git push origin main || echo "::warning::push failed"
        else
          echo "::notice::No changes to commit"
        fi

        # Honest exit
        exit $CC_EXIT
