name: CC Runner — GHA-only (no Hetzner)
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers (REQUIRED)'
        required: true
        type: string
concurrency:
  group: cc-ghonly-${{ inputs.issues }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty issues input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then echo "::error::Empty issues input"; exit 1; fi
          echo "::notice::GHA-only CC for issues: ${{ inputs.issues }}"
  run-cc:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FULL }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python + Playwright dependencies
        run: |
          pip install --quiet -r requirements.txt playwright
          playwright install --with-deps chromium
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Fetch issue brief
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          gh issue view ${{ matrix.issue }} --repo ${{ github.repository }} --json title,body \
            -q '"# " + .title + "\n\n" + .body' > /tmp/prompt.md
          echo "----- BRIEF -----"; cat /tmp/prompt.md
      - name: Run Claude Code (in-runner, OAuth token, NO Hetzner, retry on 5xx)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_USERNAME: ${{ secrets.REALFORECLOSE_USERNAME }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        run: |
          set +e
          unset ANTHROPIC_API_KEY
          PROMPT="$(cat /tmp/prompt.md)"
          for attempt in 1 2 3; do
            echo "=== claude -p attempt $attempt ==="
            claude -p "$PROMPT" --dangerously-skip-permissions --output-format text > /tmp/cc.log 2>&1
            CC_EXIT=$?
            tail -c 2000 /tmp/cc.log
            BYTES=$(wc -c < /tmp/cc.log)
            echo "attempt=$attempt exit=$CC_EXIT bytes=$BYTES"
            echo "$attempt" > /tmp/cc_attempt.txt
            if [ "$CC_EXIT" -eq 0 ] && [ "$BYTES" -ge 50 ]; then echo "CC OK"; exit 0; fi
            if grep -qiE 'API Error: 5[0-9][0-9]|server error|overloaded|rate.?limit|timeout' /tmp/cc.log; then
              echo "transient error; retrying in 25s"; sleep 25; continue
            fi
            # Weekly/session usage-cap messages ("You've hit your weekly limit · resets 1pm (UTC)",
            # "Spending cap reached resets 1pm") are transient on a known clock, not a hard failure.
            # If the printed reset time falls within this job's 360-minute ceiling, sleep to it and retry
            # instead of burning the whole 6h window on a same-second exit (see issue #18065).
            if grep -qiE "weekly limit|spending cap|usage limit|session limit" /tmp/cc.log; then
              RESET_STR=$(grep -ioE '[0-9]{1,2}(:[0-9]{2})?\s*(am|pm)' /tmp/cc.log | head -1)
              RESET_HOUR=$(echo "$RESET_STR" | grep -oE '^[0-9]{1,2}')
              RESET_AMPM=$(echo "$RESET_STR" | grep -oiE 'am|pm' | tr '[:upper:]' '[:lower:]')
              if [ -n "$RESET_HOUR" ] && [ -n "$RESET_AMPM" ]; then
                H24=$RESET_HOUR
                if [ "$RESET_AMPM" = "pm" ] && [ "$RESET_HOUR" -ne 12 ]; then H24=$((RESET_HOUR + 12)); fi
                if [ "$RESET_AMPM" = "am" ] && [ "$RESET_HOUR" -eq 12 ]; then H24=0; fi
                NOW_EPOCH=$(date -u +%s)
                TARGET_EPOCH=$(date -u -d "today ${H24}:00" +%s)
                if [ "$TARGET_EPOCH" -le "$NOW_EPOCH" ]; then TARGET_EPOCH=$(date -u -d "tomorrow ${H24}:00" +%s); fi
                WAIT=$((TARGET_EPOCH - NOW_EPOCH + 60))
                MAX_WAIT=$((300 * 60))
                if [ "$WAIT" -le "$MAX_WAIT" ]; then
                  echo "usage limit hit, reset ~${H24}:00 UTC — sleeping ${WAIT}s then retrying"
                  sleep "$WAIT"
                  continue
                fi
                echo "::error::usage-limit reset (${RESET_STR} UTC) is more than 5h away — cannot wait within job budget"; exit 1
              fi
            fi
            echo "::error::claude -p failed (exit=$CC_EXIT, non-transient)"; exit 1
          done
          echo "::error::claude -p failed after 3 attempts (transient)"; exit 1
      - name: Commit changes
        if: always()
        run: |
          git config user.name "cc-ghonly-bot"
          git config user.email "cc@biddeed.ai"
          git add -A
          if git diff --cached --quiet; then echo "No file changes"; exit 0; fi
          git commit -m "CC GHA-only: issue ${{ matrix.issue }} (run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "push OK on attempt $attempt"; exit 0; fi
            echo "push rejected (attempt $attempt) — likely concurrent shard push to main; rebasing and retrying"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebase conflict — aborting rebase, work stays committed locally only (will be lost when runner is torn down)"
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::push failed after 5 attempts — commit not persisted to origin/main"
          exit 1
      - name: Post run breadcrumb to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          ATTEMPT="$(cat /tmp/cc_attempt.txt 2>/dev/null)"
          ATTEMPT="${ATTEMPT:-unknown}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment ${{ matrix.issue }} --repo ${{ github.repository }} \
            --body "CC GHA-only run finished — attempt ${ATTEMPT}, conclusion **${{ job.status }}**, run: ${RUN_URL}"
