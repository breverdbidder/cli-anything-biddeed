name: CC Runner — GHA-only (no Hetzner)
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers (REQUIRED)'
        required: true
        type: string
concurrency:
  group: cc-ghonly-${{ inputs.issues }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty issues input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then echo "::error::Empty issues input"; exit 1; fi
          echo "::notice::GHA-only CC for issues: ${{ inputs.issues }}"
  run-cc:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FULL }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code + supabase CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Fetch issue brief
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          gh issue view ${{ matrix.issue }} --repo ${{ github.repository }} --json title,body \
            -q '"# " + .title + "\n\n" + .body' > /tmp/prompt.md
          echo "----- BRIEF -----"; cat /tmp/prompt.md
      - name: Run Claude Code (in-runner, OAuth, NO Hetzner)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          set -o pipefail
          unset ANTHROPIC_API_KEY
          PROMPT="$(cat /tmp/prompt.md)"
          claude -p "$PROMPT" --dangerously-skip-permissions --output-format text 2>&1 | tee /tmp/cc.log
          BYTES=$(wc -c < /tmp/cc.log)
          echo "cc_output_bytes=$BYTES"
          if [ "$BYTES" -lt 50 ]; then echo "::error::Ghost-success guard: <50 bytes output"; exit 1; fi
      - name: Commit changes
        if: always()
        run: |
          git config user.name "cc-ghonly-bot"
          git config user.email "cc@biddeed.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes"
          else
            git commit -m "CC GHA-only: issue ${{ matrix.issue }} (run ${{ github.run_id }})"
            git push
          fi
