name: PropZone Intel — Nightly Scraper

on:
  schedule:
    - cron: '0 8 * * *'   # 3 AM EST (UTC-5) = 08:00 UTC
  workflow_dispatch:
    inputs:
      city:
        description: 'City to scrape (default: all Brevard cities)'
        required: false
        default: ''
      compare_only:
        description: 'Skip scrape, run gap comparison only'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g tsx typescript
          npm install

      - name: Scrape Satellite Beach (primary)
        if: github.event.inputs.compare_only != 'true' && (github.event.inputs.city == '' || github.event.inputs.city == 'satellite-beach')
        run: |
          npx tsx src/agents/propzone_intel.ts scrape satellite-beach
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scrape Melbourne
        if: github.event.inputs.compare_only != 'true' && (github.event.inputs.city == '' || github.event.inputs.city == 'melbourne')
        run: |
          npx tsx src/agents/propzone_intel.ts scrape melbourne
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scrape Palm Bay
        if: github.event.inputs.compare_only != 'true' && (github.event.inputs.city == '' || github.event.inputs.city == 'palm-bay')
        run: |
          npx tsx src/agents/propzone_intel.ts scrape palm-bay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scrape Cocoa
        if: github.event.inputs.compare_only != 'true' && (github.event.inputs.city == '' || github.event.inputs.city == 'cocoa')
        run: |
          npx tsx src/agents/propzone_intel.ts scrape cocoa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scrape Titusville
        if: github.event.inputs.compare_only != 'true' && (github.event.inputs.city == '' || github.event.inputs.city == 'titusville')
        run: |
          npx tsx src/agents/propzone_intel.ts scrape titusville
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  compare-gaps:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          pip install httpx

      - name: Run gap comparison vs ZoneWise
        id: gap_report
        run: |
          python3 - <<'PYEOF'
          import os, json, httpx

          supabase_url = os.environ["SUPABASE_URL"]
          supabase_key = os.environ["SUPABASE_KEY"]

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
          }

          # Fields we compare between systems
          compare_fields = [
              "zone_code", "max_height", "max_stories", "far",
              "lot_coverage", "residential_density", "max_units",
          ]

          # Count propzone_intel records
          r = httpx.get(
              f"{supabase_url}/rest/v1/propzone_intel",
              headers={**headers, "Prefer": "count=exact"},
              params={"select": "parcel_id", "limit": 0},
          )
          pz_count = int(r.headers.get("content-range", "0/0").split("/")[-1])

          # Count zoning_assignments records
          r2 = httpx.get(
              f"{supabase_url}/rest/v1/zoning_assignments",
              headers={**headers, "Prefer": "count=exact"},
              params={"select": "parcel_id", "limit": 0},
          )
          zw_count = int(r2.headers.get("content-range", "0/0").split("/")[-1])

          # Sample gap: PropZone records missing in ZoneWise
          r3 = httpx.get(
              f"{supabase_url}/rest/v1/propzone_intel",
              headers=headers,
              params={"select": "parcel_id,zone_code,max_height,far", "limit": 1000},
          )
          pz_records = r3.json() if r3.status_code == 200 else []

          missing_height = sum(1 for p in pz_records if p.get("max_height") is None)
          missing_far    = sum(1 for p in pz_records if p.get("far") is None)
          missing_zone   = sum(1 for p in pz_records if p.get("zone_code") is None)

          gap_count = missing_height + missing_far + missing_zone

          report = {
              "propzone_total": pz_count,
              "zonewise_total": zw_count,
              "sample_size": len(pz_records),
              "gaps": {
                  "missing_height": missing_height,
                  "missing_far": missing_far,
                  "missing_zone_code": missing_zone,
                  "total_field_gaps": gap_count,
              }
          }

          print(json.dumps(report, indent=2))

          # Write to env for Telegram step
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GAP_COUNT={gap_count}\n")
              f.write(f"PZ_TOTAL={pz_count}\n")
              f.write(f"ZW_TOTAL={zw_count}\n")
          PYEOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Notify Telegram — gap report
        run: |
          python3 - <<'PYEOF'
          import os, httpx

          token   = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Telegram not configured, skipping")
              exit(0)

          gap_count = os.environ.get("GAP_COUNT", "?")
          pz_total  = os.environ.get("PZ_TOTAL", "?")
          zw_total  = os.environ.get("ZW_TOTAL", "?")

          msg = (
              f"*PropZone Intel* — Nightly Report\n"
              f"PropZone records: {pz_total}\n"
              f"ZoneWise records: {zw_total}\n"
              f"Field gaps found: {gap_count}\n"
              f"Run: https://github.com/${{{{ github.repository }}}}/actions/runs/${{{{ github.run_id }}}}"
          )

          httpx.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"},
          )
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GAP_COUNT: ${{ env.GAP_COUNT }}
          PZ_TOTAL: ${{ env.PZ_TOTAL }}
          ZW_TOTAL: ${{ env.ZW_TOTAL }}

      - name: Upload gap report artifact
        uses: actions/upload-artifact@v4
        with:
          name: propzone-gap-report-${{ github.run_number }}
          path: propzone-output/
          retention-days: 30
          if-no-files-found: ignore
