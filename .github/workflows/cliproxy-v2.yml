name: cliproxy probe v2 — no set -e, just functional tests
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH + test cliproxy
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          set +e

          echo "=== A: container basics ==="
          $SSH 'docker ps --format "{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}" | grep cliproxy'

          echo
          echo "=== B: env vars inside container (key names only) ==="
          $SSH 'docker exec biddeed-cliproxy env 2>/dev/null | awk -F= "{ if(\$1 ~ /KEY|TOKEN|SECRET|URL|MODEL|PROVIDER|PORT|HOST/) print \$1 }" | sort -u'

          echo
          echo "=== C: health + routes ==="
          $SSH 'curl -sS -o /dev/null -w "GET /: %{http_code}\n" -m 5 http://127.0.0.1:8317/'
          $SSH 'curl -sS -o /dev/null -w "GET /health: %{http_code}\n" -m 5 http://127.0.0.1:8317/health'
          $SSH 'curl -sS -o /dev/null -w "GET /v1/models: %{http_code}\n" -m 5 http://127.0.0.1:8317/v1/models'
          $SSH 'curl -sS -m 5 http://127.0.0.1:8317/v1/models 2>&1 | head -c 600'
          echo

          echo
          echo "=== D: list cliproxy container files — config location ==="
          $SSH 'docker exec biddeed-cliproxy sh -c "ls -la /app 2>/dev/null; echo ---; ls -la / 2>/dev/null; echo ---; find / -name \"*.yaml\" -o -name \"*.yml\" -o -name \"config.json\" 2>/dev/null | grep -v proc | head -20"'

          echo
          echo "=== E: Anthropic-format call to cliproxy ==="
          RESP=$($SSH 'curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: dummy" \
            -H "anthropic-version: 2023-06-01" \
            -d "{\"model\":\"claude-sonnet-4-20250514\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with only the literal CLIPROXY_OK\"}]}" \
            -m 30 http://127.0.0.1:8317/v1/messages')
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500
          echo

          echo
          echo "=== F: claude -p via ANTHROPIC_BASE_URL=cliproxy ==="
          $SSH 'bash -c "export ANTHROPIC_BASE_URL=http://127.0.0.1:8317; export ANTHROPIC_API_KEY=dummy-cliproxy; claude -p \"reply only CLAUDE_VIA_CLIPROXY_OK\" --allowedTools Read 2>&1 | tail -15"'

          echo "=== END ==="
