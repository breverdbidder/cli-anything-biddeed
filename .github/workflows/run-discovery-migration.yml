name: Discovery Migration (one-shot)
on:
  push:
    paths:
      - '.github/workflows/run-discovery-migration.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client dnsutils > /dev/null 2>&1
      
      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          
          # Resolve IPv4
          POOLER_IP=$(dig +short aws-0-us-east-1.pooler.supabase.com A | head -1)
          echo "Pooler IPv4: $POOLER_IP"
          
          DIRECT_IP=$(dig +short db.mocerqjnksmhcjzxrewo.supabase.co A | head -1)
          echo "Direct IPv4: $DIRECT_IP"
          
          # Attempt 1: Session pooler
          if PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "${POOLER_IP}" -p 5432 \
            -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
            -f migrations/20260327_discovery_results.sql 2>/tmp/pg1.log; then
            echo "✅ Migration via session pooler"
            exit 0
          fi
          echo "Session pooler failed: $(cat /tmp/pg1.log)"
          
          # Attempt 2: Transaction pooler
          if PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "${POOLER_IP}" -p 6543 \
            -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
            -f migrations/20260327_discovery_results.sql 2>/tmp/pg2.log; then
            echo "✅ Migration via transaction pooler"
            exit 0
          fi
          echo "Transaction pooler failed: $(cat /tmp/pg2.log)"
          
          # Attempt 3: Direct
          if [ -n "$DIRECT_IP" ]; then
            if PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
              -h "${DIRECT_IP}" -p 5432 \
              -U postgres -d postgres \
              -f migrations/20260327_discovery_results.sql 2>/tmp/pg3.log; then
              echo "✅ Migration via direct connection"
              exit 0
            fi
            echo "Direct failed: $(cat /tmp/pg3.log)"
          fi
          
          echo "❌ All methods failed"
          exit 1
      
      - name: Verify
        env:
          SRK: ${{ secrets.SUPABASE_KEY }}
        run: |
          sleep 5
          curl -sf \
            "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/discovery_results?select=id&limit=1" \
            -H "apikey: ${SRK}" \
            -H "Authorization: Bearer ${SRK}" && echo "✅ Table verified" || echo "⚠️ Needs schema cache refresh"
