name: Run Discovery Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run SQL Migration via pooler
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          
          # Force IPv4 resolution and use session pooler (port 5432)
          POOLER_IP=$(dig +short aws-0-us-east-1.pooler.supabase.com A | head -1)
          echo "Pooler IP: $POOLER_IP"
          
          echo "Trying session pooler (port 5432)..."
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "$POOLER_IP" \
            -p 5432 \
            -U "postgres.mocerqjnksmhcjzxrewo" \
            -d postgres \
            -f migrations/20260327_discovery_results.sql && echo "✅ Session pooler worked" && exit 0
          
          echo "Trying transaction pooler (port 6543)..."
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "$POOLER_IP" \
            -p 6543 \
            -U "postgres.mocerqjnksmhcjzxrewo" \
            -d postgres \
            -f migrations/20260327_discovery_results.sql && echo "✅ Transaction pooler worked" && exit 0
            
          echo "Trying direct with IPv4..."
          DIRECT_IP=$(dig +short db.mocerqjnksmhcjzxrewo.supabase.co A | head -1)
          echo "Direct IP: $DIRECT_IP"
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h "$DIRECT_IP" \
            -p 5432 \
            -U postgres \
            -d postgres \
            -f migrations/20260327_discovery_results.sql && echo "✅ Direct worked" && exit 0
          
          echo "❌ All connection methods failed"
          exit 1
          
      - name: Verify table
        env:
          SRK: ${{ secrets.SUPABASE_KEY }}
        run: |
          sleep 3
          HTTP=$(curl -s -o /tmp/verify.json -w "%{http_code}" \
            "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/discovery_results?select=id&limit=1" \
            -H "apikey: ${SRK}" \
            -H "Authorization: Bearer ${SRK}")
          
          echo "HTTP: $HTTP"
          cat /tmp/verify.json
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ discovery_results table VERIFIED"
          else
            echo "⚠️ HTTP $HTTP — schema cache may need refresh. Table likely exists."
          fi
