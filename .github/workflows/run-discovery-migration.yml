name: Run Discovery Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run SQL Migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          
          # Try direct connection (not pooler)
          echo "Trying direct DB connection..."
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 \
            -U postgres \
            -d postgres \
            -f migrations/20260327_discovery_results.sql
          
          echo "✅ Migration complete"
          
      - name: Verify table
        env:
          SRK: ${{ secrets.SUPABASE_KEY }}
        run: |
          RESULT=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/discovery_results?select=id&limit=1" \
            -H "apikey: ${SRK}" \
            -H "Authorization: Bearer ${SRK}")
          
          if [ "$RESULT" = "200" ]; then
            echo "✅ discovery_results table verified"
          else
            echo "⚠️ Table check returned HTTP $RESULT (may need schema cache refresh)"
            echo "Waiting 5s and retrying..."
            sleep 5
            curl -s \
              "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/discovery_results?select=id&limit=1" \
              -H "apikey: ${SRK}" \
              -H "Authorization: Bearer ${SRK}"
          fi
