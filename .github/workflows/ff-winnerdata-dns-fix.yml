name: FF Winner Data DNS Fix (one-off)
# ff.winnerdataai.com resolved NOTHING when tested live 2026-08-24 right
# after a successful `wrangler deploy` of workers/winnerdata-ff (route
# pattern ff.winnerdataai.com/* is already declared in wrangler.toml) --
# a Cloudflare Worker route only intercepts traffic for a hostname that
# already has a DNS record proxied through Cloudflare. This creates that
# record if missing.
#
# FIXED 2026-08-30: the original create_dummy_a step reported "success"
# on every run regardless of what Cloudflare actually returned -- it
# echoed the API response but never checked it. Three runs on 2026-08-24
# all showed green while the record was never created (confirmed live via
# Cloudflare's own DoH resolver returning NXDOMAIN on 2026-08-30, six days
# later). This revision parses the actual Cloudflare response ("success"
# field + "errors" array) and fails the step if the API call did not
# really succeed, then independently re-queries DNS after creation and
# fails if it still doesn't resolve -- a real check, not a checkmark.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list_zone | list_records | create_dummy_a'
        required: true
        default: 'list_zone'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Mask token
        run: echo "::add-mask::${CF_API_TOKEN}"

      - name: Resolve zone id for winnerdataai.com
        id: zone
        run: |
          RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=winnerdataai.com" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          echo "$RESP" | python3 -m json.tool
          ZONE_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ZONE_ID" ]; then
            echo "::error::winnerdataai.com is not a zone on this Cloudflare account (CF_API_TOKEN). Cannot proceed."
            exit 1
          fi

      - name: Check token permissions
        run: |
          RESP=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          echo "$RESP" | python3 -m json.tool

      - name: List existing DNS records
        if: ${{ inputs.action == 'list_records' || inputs.action == 'create_dummy_a' }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | python3 -m json.tool

      - name: Create placeholder proxied A record for ff.winnerdataai.com
        if: ${{ inputs.action == 'create_dummy_a' }}
        run: |
          RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"type":"A","name":"ff.winnerdataai.com","content":"192.0.2.1","proxied":true,"ttl":1}')
          echo "$RESP" | python3 -m json.tool
          SUCCESS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('success'))")
          if [ "$SUCCESS" != "True" ]; then
            echo "::error::Cloudflare rejected the DNS record creation. See the printed response above for the exact error(s) -- do not assume this step worked without reading them."
            exit 1
          fi
          echo "Cloudflare confirmed the record was created (API success=true)."

      - name: Verify DNS actually resolves now -- real check, not a checkmark
        if: ${{ inputs.action == 'create_dummy_a' }}
        run: |
          for i in 1 2 3 4 5 6; do
            RESP=$(curl -s -H "accept: application/dns-json" --resolve cloudflare-dns.com:443:1.1.1.1 \
              "https://cloudflare-dns.com/dns-query?name=ff.winnerdataai.com&type=A")
            echo "attempt $i: $RESP"
            STATUS=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('Status'))" 2>/dev/null || echo "parse_error")
            if [ "$STATUS" = "0" ]; then
              echo "CONFIRMED: ff.winnerdataai.com now resolves (DNS Status 0 = NOERROR)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::ff.winnerdataai.com still does not resolve (last DNS Status: $STATUS) after 6 checks over 60s. The record creation step may have reported success but propagation has not happened, or something else is wrong -- do not report this as fixed."
          exit 1
