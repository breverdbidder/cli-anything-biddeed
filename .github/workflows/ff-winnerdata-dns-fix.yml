name: FF Winner Data DNS Fix (one-off)
# ff.winnerdataai.com resolved NOTHING when tested live 2026-08-24 right
# after a successful `wrangler deploy` of workers/winnerdata-ff (route
# pattern ff.winnerdataai.com/* is already declared in wrangler.toml) --
# a Cloudflare Worker route only intercepts traffic for a hostname that
# already has a DNS record proxied through Cloudflare. This creates that
# record if missing. Read-only by default (action=list); create_dummy_a
# adds a proxied 192.0.2.1 (TEST-NET, non-routable) placeholder A record --
# the Worker route handles the request at the edge, the "content" IP is
# never actually dialed. Same credential (CF_API_TOKEN) and DNS-op pattern
# already established in cf-dns-op.yml / fix-biddeed-dns.yml.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list_zone | list_records | create_dummy_a'
        required: true
        default: 'list_zone'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Mask token
        run: echo "::add-mask::${CF_API_TOKEN}"

      - name: Resolve zone id for winnerdataai.com
        id: zone
        run: |
          RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=winnerdataai.com" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          echo "$RESP" | python3 -m json.tool
          ZONE_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$ZONE_ID" ]; then
            echo "::error::winnerdataai.com is not a zone on this Cloudflare account (CF_API_TOKEN). Cannot proceed."
            exit 1
          fi

      - name: List existing DNS records
        if: ${{ inputs.action == 'list_records' || inputs.action == 'create_dummy_a' }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | python3 -m json.tool

      - name: Create placeholder proxied A record for ff.winnerdataai.com
        if: ${{ inputs.action == 'create_dummy_a' }}
        run: |
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"type":"A","name":"ff.winnerdataai.com","content":"192.0.2.1","proxied":true,"ttl":1}')
          echo "$RESP"
