name: Gold Standard SHARD-6 (highlands, st_lucie) — run 6288

on:
  workflow_dispatch: {}

concurrency:
  group: gold-standard-shard6-highlands-stlucie-run6288
  cancel-in-progress: false

jobs:
  apply-fixes:
    name: "Run highlands F + st_lucie C/D/I fix script + verify"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run shard6_run6288_highlands_stlucie_fix.py
        run: python3 scripts/shard6_run6288_highlands_stlucie_fix.py

      - name: Verify — pencil_dod_evaluate_county for highlands + st_lucie
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error, datetime

          SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}

          summary = ['## SHARD-6 run6288 (highlands, st_lucie) Verification',
                     f'**Timestamp:** {datetime.datetime.now(datetime.timezone.utc).isoformat()}',
                     f'**dispatch_id:** 5fa42352-4a49-40b4-9548-8ed140b2d4bc', '',
                     '| County | Pass | Total | Letters |', '|--------|------|-------|---------|']

          for county in ['highlands', 'st_lucie']:
              body = json.dumps({'p_county': county}).encode()
              req = urllib.request.Request(f'{BASE}/rpc/pencil_dod_evaluate_county', data=body, method='POST')
              for k, v in H.items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      ev = json.loads(resp.read())
                      letters = [l for l in 'ABCDEFGHIJ' if isinstance(ev.get(l), dict) and ev[l].get('pass')]
                      failing = [l for l in 'ABCDEFGHIJ' if isinstance(ev.get(l), dict) and not ev[l].get('pass')]
                      summary.append(f"| {county} | {len(letters)} | 10 | pass: {' '.join(letters)} fail: {' '.join(failing)} |")
                      print(f"{county}: {json.dumps(ev)}")
              except Exception as ex:
                  summary.append(f'| {county} | ERR | ERR | {str(ex)[:60]} |')

          print('\n'.join(summary))
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write('\n'.join(summary) + '\n')
          PYEOF
