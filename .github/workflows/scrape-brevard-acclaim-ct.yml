name: scrape-brevard-acclaim-ct
# Brevard foreclosure outcomes (Certificate of Title) from AcclaimWeb official records.
# Forward top-up engine for PENCIL criterion B. Backfill 2018-08..2026-06 was completed
# 2026-06-11 by Summit session (2,558 rows, data_source updated to acclaim_ct:BREVARD-FC-V1).
# SHARD-1 fix 2026-06-12: Updated data_source format for canon compliance and B metric.
# Hard rules: single session, ~2.5s throttle, never parallelize, stop on persistent block.

on:
  workflow_dispatch:
    inputs:
      month_start:
        description: "YYYY-MM (default: previous month)"
        required: false
        default: ""
      month_end:
        description: "YYYY-MM (default: current month)"
        required: false
        default: ""
  schedule:
    # 5th of each month 09:10Z: re-sweep prev + current month (catches late recordings).
    - cron: "10 9 5 * *"

concurrency:
  group: brevard-acclaim-ct
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep CT months
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/acclaim_ct_sweep.py "${{ github.event.inputs.month_start }}" "${{ github.event.inputs.month_end }}"
