name: "Apply Duval C/D Parity Fix (one-shot)"
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psycopg2
        run: pip install psycopg2-binary
      - name: Apply migration inline
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, psycopg2, sys

          pw = os.environ.get('SUPABASE_DB_PASSWORD', '')
          if not pw:
              print("ERROR: SUPABASE_DB_PASSWORD not set")
              sys.exit(1)

          conn_str = f"host=aws-0-us-west-2.pooler.supabase.com port=6543 dbname=postgres user=postgres.mocerqjnksmhcjzxrewo password={pw} sslmode=require"
          print(f"Connecting...")
          conn = psycopg2.connect(conn_str)
          conn.autocommit = True
          cur = conn.cursor()

          sql = open('supabase/migrations/20260623_duval_cd_parity_clerk_fix.sql').read()
          cur.execute(sql)

          # Fetch results
          if cur.description:
              rows = cur.fetchall()
              print(f"Result: {rows}")

          print("Migration applied successfully")
          conn.close()
          PYEOF
      - name: Verify C/D fix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          # Verify C/D for Duval latest run
          req = urllib.request.Request(
              f"{SB}/rest/v1/gold_standard_county_status?county_slug=eq.duval&letter=in.(C,D)&select=loop_run_id,letter,status,metric,detail&order=loop_run_id.desc&limit=4",
              headers=H)
          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())
          for row in data:
              print(f"Run {row['loop_run_id']}: {row['letter']} = {row['status']} metric={row['metric']} | {row['detail']}")

          # Also run fix_duval_cd_parity_post_loop via RPC
          body = json.dumps({}).encode()
          req2 = urllib.request.Request(
              f"{SB}/rest/v1/rpc/fix_duval_cd_parity_post_loop",
              data=body, headers={**H, "Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req2) as r:
              print("RPC result:", r.read().decode())
          PYEOF
