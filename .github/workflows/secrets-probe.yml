name: secrets-probe
# Names-only: prints which expected secret NAMES are present (never values).
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence (names only, values masked)
        env:
          RA_USER: ${{ secrets.REALAUCTION_USERNAME }}
          RA_PASS: ${{ secrets.REALAUCTION_PASSWORD }}
          RA_USER2: ${{ secrets.REALAUCTION_USER }}
          RA_PASS2: ${{ secrets.REALAUCTION_PASS }}
          RA_BREV_USER: ${{ secrets.BREVARD_REALAUCTION_USERNAME }}
          RA_BREV_PASS: ${{ secrets.BREVARD_REALAUCTION_PASSWORD }}
          RTD_USER: ${{ secrets.REALTAXDEED_USERNAME }}
          RTD_PASS: ${{ secrets.REALTAXDEED_PASSWORD }}
          FB_USER: ${{ secrets.FLORIDABIDDER_USERNAME }}
          FB_PASS: ${{ secrets.FLORIDABIDDER_PASSWORD }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FC_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          present() { [ -n "$2" ] && echo "PRESENT  $1" || echo "absent   $1"; }
          echo "=== RealAuction credential name probe (values never printed) ==="
          present REALAUCTION_USERNAME "$RA_USER"
          present REALAUCTION_PASSWORD "$RA_PASS"
          present REALAUCTION_USER "$RA_USER2"
          present REALAUCTION_PASS "$RA_PASS2"
          present BREVARD_REALAUCTION_USERNAME "$RA_BREV_USER"
          present BREVARD_REALAUCTION_PASSWORD "$RA_BREV_PASS"
          present REALTAXDEED_USERNAME "$RTD_USER"
          present REALTAXDEED_PASSWORD "$RTD_PASS"
          present FLORIDABIDDER_USERNAME "$FB_USER"
          present FLORIDABIDDER_PASSWORD "$FB_PASS"
          echo "=== infra (sanity) ==="
          present SUPABASE_URL "$SB_URL"
          present SUPABASE_SERVICE_ROLE_KEY "$SB_KEY"
          present FIRECRAWL_API_KEY "$FC_KEY"
