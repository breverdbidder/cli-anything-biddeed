name: cliproxy diag
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: diag
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          echo "=== in-container api-key lines (masked) ==="
          $SSH "docker exec biddeed-cliproxy sh -c 'grep -n api-key /data/config.yaml | head -6'" | sed -E 's/(AQ\.[A-Za-z0-9]{3})[A-Za-z0-9._-]+/\1***/g; s/(sk-[A-Za-z0-9]{3})[A-Za-z0-9._-]+/\1***/g'
          echo "=== docker logs tail 40 (masked) ==="
          $SSH "docker logs --tail 40 biddeed-cliproxy 2>&1" | sed -E 's/(AQ\.[A-Za-z0-9]{3})[A-Za-z0-9._-]+/\1***/g'
          echo "=== route via alias gemini-flash ==="
          $SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: dummy' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"say ROUTE_OK\"}]}' -m 40 http://127.0.0.1:8317/v1/messages"
          echo
          echo "=== route via name gemini-2.5-flash ==="
          $SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: dummy' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-2.5-flash\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"say ROUTE_OK\"}]}' -m 40 http://127.0.0.1:8317/v1/messages"
          echo
          echo "=== control: claude-sonnet ==="
          $SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: dummy' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"claude-sonnet\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"say CTRL_OK\"}]}' -m 40 http://127.0.0.1:8317/v1/messages"
          echo
          echo "=== END ==="
