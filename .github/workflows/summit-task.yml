name: "SUMMIT: Task from Issue"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number to execute'
        required: true
        type: string
      session_hours:
        description: 'Max session duration (hours)'
        required: false
        default: '4'
        type: string

jobs:
  summit-dispatch:
    name: "🏔️ SUMMIT Task Dispatch"
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute on SUMMIT
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SESSION_HOURS: ${{ inputs.session_hours }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GITHUB_TOKEN,SUPABASE_KEY,ISSUE_NUMBER,SESSION_HOURS
          command_timeout: 240m
          script: |
            set -e
            echo "=== SUMMIT Task Dispatch ==="
            echo "Issue: #${ISSUE_NUMBER}"
            echo "Max session: ${SESSION_HOURS}h"
            
            # Prep: ensure repo exists and is owned by claude
            REPO_DIR="/home/claude/cli-anything-biddeed"
            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/breverdbidder/cli-anything-biddeed.git "$REPO_DIR"
            fi
            chown -R claude:claude "$REPO_DIR"
            
            # Find claude binary
            CLAUDE_BIN=$(which claude 2>/dev/null || find /usr/local/bin /usr/bin /home/claude/.npm-global/bin /root/.npm-global/bin -name claude -type f 2>/dev/null | head -1)
            echo "Claude binary: ${CLAUDE_BIN:-NOT FOUND}"
            
            # Pull latest as claude user
            su - claude -c "cd ${REPO_DIR} && git pull origin main 2>&1" || true
            
            echo "=== Starting Claude Code session ==="
            
            # Run CC as claude user with explicit PATH
            su - claude -c "
              export PATH=/usr/local/bin:/usr/bin:/home/claude/.npm-global/bin:/home/claude/.local/bin:\$PATH
              cd ${REPO_DIR}
              
              timeout ${SESSION_HOURS}h claude --auto \
                'Read GitHub issue #${ISSUE_NUMBER} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${ISSUE_NUMBER}.
                 Follow CLAUDE.md directives. Load TODO.md if present.
                 Read specs/PLATFORM-SKILLS-ADOPTION.md for full spec.
                 Execute Phase 1 tasks from the issue checklist autonomously.
                 Run migrations/20260328_platform_skills_eval.sql against Supabase.
                 Convert each skill candidate to .claude/skills/ format.
                 Commit frequently. Push results. Update issue with progress.
                 Session budget: 10 dollars max. Honesty Protocol enforced.' \
                2>&1 || echo 'CC session ended (timeout or error)'
            "
            
            echo "=== SUMMIT Task Complete ==="
