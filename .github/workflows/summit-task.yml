name: "SUMMIT: Task from Issue"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number to execute'
        required: true
        type: string
      session_hours:
        description: 'Max session duration (hours)'
        required: false
        default: '4'
        type: string

jobs:
  summit-dispatch:
    name: "🏔️ SUMMIT Task Dispatch"
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute on SUMMIT
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SESSION_HOURS: ${{ inputs.session_hours }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ISSUE_NUMBER,SESSION_HOURS
          timeout: 60s
          command_timeout: 240m
          script: |
            set -e
            echo "=== SUMMIT Task Dispatch ==="
            echo "Issue: #${ISSUE_NUMBER}"
            echo "Max session: ${SESSION_HOURS}h"
            
            # Use same repo path as autoloop
            REPO_DIR="/opt/biddeed/cli-anything-biddeed"
            mkdir -p /opt/biddeed
            if [ ! -d "${REPO_DIR}/.git" ]; then
              git clone https://github.com/breverdbidder/cli-anything-biddeed.git "${REPO_DIR}"
            fi
            cd "${REPO_DIR}"
            git pull origin main --ff-only 2>&1 | tail -3 || { git reset --hard HEAD && git clean -fd && git pull origin main; }
            
            echo "=== Starting Claude Code session ==="
            
            IS_SANDBOX=1 claude -p \
              "Read GitHub issue #${ISSUE_NUMBER} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${ISSUE_NUMBER}.
               Follow CLAUDE.md directives. Load TODO.md if present.
               Read specs/PLATFORM-SKILLS-ADOPTION.md for full spec.
               Execute Phase 1 tasks from the issue checklist autonomously.
               Run migrations/20260328_platform_skills_eval.sql against Supabase.
               Convert each skill candidate to .claude/skills/ format.
               Commit frequently. Push results. Update issue with progress.
               Session budget: 10 dollars max. Honesty Protocol enforced." \
              --dangerously-skip-permissions 2>&1 || echo "CC session ended"
            
            echo "=== SUMMIT Task Complete ==="
