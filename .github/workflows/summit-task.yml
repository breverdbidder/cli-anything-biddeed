name: "SUMMIT: Task from Issue"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number to execute'
        required: true
        type: string
      timeout_minutes:
        description: 'Max session duration (minutes)'
        required: false
        default: '90'
        type: string

jobs:
  summit-dispatch:
    name: "🏔️ SUMMIT Task #${{ inputs.issue_number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute via Claude Runner
        uses: ./.github/actions/claude-runner
        with:
          prompt: |
            Read GitHub issue #${{ inputs.issue_number }} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${{ inputs.issue_number }}.
            Follow CLAUDE.md directives. Load TODO.md if present.
            Read specs/PLATFORM-SKILLS-ADOPTION.md for full spec.
            Execute Phase 1 tasks from the issue checklist autonomously.
            Run migrations/20260328_platform_skills_eval.sql against Supabase.
            Convert each skill candidate to .claude/skills/ format.
            Commit frequently. Push results. Update issue with progress.
            Session budget: 10 dollars max. Honesty Protocol enforced.
          gh_pat: ${{ secrets.GH_PAT }}
          claude_oauth_b64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
