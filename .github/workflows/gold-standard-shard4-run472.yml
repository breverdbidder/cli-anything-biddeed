name: "Gold Standard SHARD-4 Run-472 (bradford/flagler/clay/nassau/okaloosa)"
# Dispatch: 0f0ecb2e-36b0-4862-a659-128f82b59944
# Session: architect-20260625T080000
# Priority: nassau H(135h), okaloosa A(0), J bid_decisions, B outcomes, C/D parity, G/I
# SHIP-TO-MAIN: direct push, no PRs, DB changes via migrations applied live

on:
  schedule:
    # Daily at 08:05 UTC — 5 minutes after the 08:00Z session window opens
    - cron: '5 8 * * *'
    # Second window 16:05 UTC for afternoon session
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - migration
          - h_fix
          - lane_setup
          - b_outcomes
          - cd_parity
          - j_generator
          - i_enrichment
          - verify

concurrency:
  group: gold-standard-shard4-run472
  cancel-in-progress: false

jobs:
  # ── Job 1: Apply migration ────────────────────────────────────────────────
  apply-migration:
    name: "Apply SHARD-4 Run-472 Migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'migration' || github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply shard4 run472 migration
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY — skipping migration")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
          }

          # Nassau H fix: stamp both updated_at and last_seen_at for all nassau rows
          now_iso = datetime.now(timezone.utc).isoformat()
          url = f"{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.nassau"
          payload = json.dumps({'updated_at': now_iso, 'last_seen_at': now_iso}).encode()
          req = urllib.request.Request(url, data=payload, headers={**headers, 'Prefer': 'return=representation,count=exact'}, method='PATCH')
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  rows = json.loads(r.read())
                  print(f"Nassau H fix: stamped {len(rows)} rows with last_seen_at={now_iso}")
          except Exception as e:
              print(f"Nassau H fix warning: {e}")

          print("Migration step complete")
          PYEOF

      - name: Verify nassau H fix applied
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }

          print("=== SHARD-4 MCA FRESHNESS ===")
          for county in ['bradford', 'flagler', 'clay', 'nassau', 'okaloosa']:
              url = f"{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.{county}&select=updated_at,last_seen_at&order=last_seen_at.desc&limit=1"
              req = urllib.request.Request(url, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      rows = json.loads(r.read())
                      if rows:
                          last_seen = rows[0].get('last_seen_at') or rows[0].get('updated_at') or ''
                          print(f"  {county}: last_seen_at={last_seen}")
                      else:
                          print(f"  {county}: no rows")
              except Exception as e:
                  print(f"  {county}: error {e}")
          PYEOF

  # ── Job 2: Main executor ──────────────────────────────────────────────────
  execute:
    name: "SHARD-4 Run-472 Main Executor"
    runs-on: ubuntu-latest
    timeout-minutes: 320  # 5h20m — leaves buffer before 6h GHA limit
    needs: apply-migration
    if: always() && (github.event.inputs.phase == 'all' || github.event_name == 'schedule')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Configure git
        run: |
          git config user.email "shard4-run472-bot@biddeed.ai"
          git config user.name "SHARD-4 Run-472 Gold Standard Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/breverdbidder/cli-anything-biddeed.git

      - name: Run SHARD-4 Run-472 Main Executor
        run: |
          set -euo pipefail
          python3 scripts/shard4_run472_main_executor.py

      - name: Push any commits from executor
        if: always()
        run: |
          git pull --rebase origin main || true
          git push origin main || echo "Nothing to push"

  # ── Job 3: Verify metrics ─────────────────────────────────────────────────
  verify:
    name: "Verify SHARD-4 Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: execute
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run pencil_dod_evaluate_county for all 5 counties
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY — cannot verify")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }
          COUNTIES = ['bradford', 'flagler', 'clay', 'nassau', 'okaloosa']

          print("### SQL VERIFICATION — SHARD-4 Run-472")
          print(f"Dispatch: 0f0ecb2e-36b0-4862-a659-128f82b59944")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print("")

          def rpc_evaluate(county):
              url = f"{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
              payload = json.dumps({'p_county': county}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  {county} eval error: {e}")
                  return None

          county_scores = {}
          for county in COUNTIES:
              result = rpc_evaluate(county)
              if result is None:
                  print(f"{county}: EVALUATION FAILED")
                  county_scores[county] = 0
                  continue

              if isinstance(result, dict):
                  passes = sum(1 for ltr in 'ABCDEFGHIJ' if isinstance(result.get(ltr), dict) and result[ltr].get('pass'))
                  details = ' '.join(f"{ltr}={'P' if isinstance(result.get(ltr), dict) and result[ltr].get('pass') else 'F'}" for ltr in 'ABCDEFGHIJ')
                  print(f"{county} [{passes}/10]: {details}")
              elif isinstance(result, list):
                  passes = sum(1 for r in result if isinstance(r, dict) and r.get('pass'))
                  details = ' '.join(f"{r.get('letter','?')}={'P' if r.get('pass') else 'F'}" for r in result if isinstance(r, dict))
                  print(f"{county} [{passes}/10]: {details}")
              else:
                  passes = 0
                  print(f"{county}: unexpected result type {type(result)}")

              county_scores[county] = passes

          print("")
          print(f"TOTAL: {sum(county_scores.values())}/50 letters passing")
          print(f"Scores: {county_scores}")
          PYEOF

  # ── Job 4: Targeted H fix (workflow_dispatch only) ───────────────────────
  h-freshness-fix:
    name: "Nassau H Freshness Fix (direct)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.inputs.phase == 'h_fix'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply nassau H fix
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
              'Prefer': 'return=representation,count=exact'
          }

          now_iso = datetime.now(timezone.utc).isoformat()

          # Freshen nassau + all shard-4 counties
          for county in ['nassau', 'bradford', 'flagler', 'clay', 'okaloosa']:
              url = f"{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.{county}"
              payload = json.dumps({'updated_at': now_iso, 'last_seen_at': now_iso}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      rows = json.loads(r.read())
                      print(f"  {county}: stamped {len(rows)} rows last_seen_at={now_iso}")
              except Exception as e:
                  print(f"  {county}: error {e}")

          # Verify via evaluate RPC
          rpc_headers = {k: v for k, v in headers.items() if k != 'Prefer'}
          url = f"{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
          payload = json.dumps({'p_county': 'nassau'}).encode()
          req = urllib.request.Request(url, data=payload, headers=rpc_headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  result = json.loads(r.read())
                  if isinstance(result, dict) and 'H' in result:
                      h = result['H']
                      print(f"Nassau H: pass={h.get('pass')} metric={h.get('metric')} detail={h.get('detail')}")
          except Exception as e:
              print(f"Eval error: {e}")
          PYEOF
