name: "Duval AJAX login probe v2"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet httpx
      - name: Probe AJAX login with session nav
        env:
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import httpx, re, os
          HOST = "https://duval.realforeclose.com"
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"

          def try_login_flow(label, pre_nav_url=None):
              print(f"\n=== {label} ===")
              client = httpx.Client(follow_redirects=True, timeout=30.0, headers={'User-Agent': UA})
              # Step 1: Splash (always)
              r1 = client.get(f"{HOST}/index.cfm")
              print(f"  Splash: HTTP {r1.status_code}, cookies={list(client.cookies.keys())}")
              # Step 2: Optional pre-nav
              if pre_nav_url:
                  r_pre = client.get(pre_nav_url)
                  t = re.search(r'<title>([^<]+)</title>', r_pre.text, re.IGNORECASE)
                  print(f"  Pre-nav ({pre_nav_url[-40:]}): HTTP {r_pre.status_code}, title={t.group(1) if t else 'N/A'}")
              # Step 3: AJAX login (exact logform.js params)
              ajax_data = {'ZACTION': 'AJAX', 'ZMETHOD': 'LOGIN', 'func': 'LOGIN',
                           'USERNAME': EMAIL, 'USERPASS': PW}
              r2 = client.post(f"{HOST}/index.cfm", data=ajax_data,
                               headers={'X-Requested-With': 'XMLHttpRequest',
                                        'Accept': 'application/json, text/javascript, */*; q=0.01',
                                        'Content-Type': 'application/x-www-form-urlencoded'})
              ct = r2.headers.get('content-type', '')
              body = r2.text.strip()
              print(f"  AJAX login: HTTP {r2.status_code}, CT={ct}, body={body[:200]!r}")
              # Step 4: GET PREVIEW
              r4 = client.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE=06%2F24%2F2026")
              t2 = re.search(r'<title>([^<]+)</title>', r4.text, re.IGNORECASE)
              n = len(re.findall(r'<div\s+id="AITEM_\d+"', r4.text))
              print(f"  PREVIEW: HTTP {r4.status_code}, title={t2.group(1) if t2 else 'N/A'}, AITEM={n}")
              return n > 0

          # Test 1: splash only → AJAX login
          try_login_flow("No pre-nav")

          # Test 2: splash → USER/CALENDAR → AJAX login (simulates splashMenuBottom click)
          try_login_flow("Via USER/CALENDAR",
                         f"{HOST}/index.cfm?zaction=USER&Zmethod=CALENDAR")

          # Test 3: splash → AUCTION/PREVIEW → AJAX login
          try_login_flow("Via AUCTION/PREVIEW",
                         f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE=06%2F24%2F2026")

          # Test 4: splash → HOME/START (splashMenuTop) → AJAX login
          try_login_flow("Via HOME/START",
                         f"{HOST}/index.cfm?zaction=HOME&Zmethod=START")
          PYEOF
