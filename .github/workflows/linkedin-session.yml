name: LinkedIn Session Capture
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install playwright pynacl requests
          playwright install chromium
      
      - name: Capture LinkedIn session
        env:
          LI_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LI_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import asyncio, os, json, base64, requests, time, re

          EMAIL = os.environ["LI_EMAIL"]
          PASSWORD = os.environ["LI_PASSWORD"]
          PAT = os.environ.get("GH_PAT", "")
          BOT = os.environ.get("TELEGRAM_BOT", "")
          CHAT = os.environ.get("TELEGRAM_CHAT", "")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")

          def tg_send(msg):
              if BOT and CHAT:
                  requests.post(f"https://api.telegram.org/bot{BOT}/sendMessage",
                      data={"chat_id": CHAT, "text": msg, "parse_mode": "Markdown"})

          def tg_get_pin(timeout=300):
              """Poll Telegram for a 6-digit PIN reply."""
              # Get current update_id to ignore old messages
              r = requests.get(f"https://api.telegram.org/bot{BOT}/getUpdates", params={"limit": 1, "offset": -1})
              updates = r.json().get("result", [])
              last_id = updates[-1]["update_id"] if updates else 0
              
              start = time.time()
              while time.time() - start < timeout:
                  r = requests.get(f"https://api.telegram.org/bot{BOT}/getUpdates",
                      params={"offset": last_id + 1, "timeout": 15})
                  for update in r.json().get("result", []):
                      last_id = update["update_id"]
                      msg = update.get("message", {})
                      text = msg.get("text", "").strip()
                      chat_id = str(msg.get("chat", {}).get("id", ""))
                      if chat_id == CHAT and re.match(r"^\d{6}$", text):
                          return text
                  time.sleep(3)
              return None

          def store_secret(name, value):
              from nacl import encoding, public
              headers = {"Authorization": f"token {PAT}", "Content-Type": "application/json"}
              r = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=headers)
              pub_data = r.json()
              pk = public.PublicKey(pub_data["key"].encode(), encoding.Base64Encoder())
              encrypted = base64.b64encode(public.SealedBox(pk).encrypt(value.encode())).decode()
              r = requests.put(f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  headers=headers, json={"encrypted_value": encrypted, "key_id": pub_data["key_id"]})
              return r.status_code in [201, 204]

          async def run():
              from playwright.async_api import async_playwright
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  context = await browser.new_context()
                  page = await context.new_page()

                  # Login
                  print("Navigating to LinkedIn login...")
                  await page.goto("https://www.linkedin.com/login", timeout=60000)
                  await page.wait_for_timeout(3000)
                  await page.fill("#username", EMAIL)
                  await page.fill("#password", PASSWORD)
                  await page.click('button[type="submit"]')
                  await page.wait_for_timeout(8000)

                  url = page.url
                  print(f"Post-login URL: {url}")

                  # Handle PIN challenge
                  if "checkpoint" in url or "challenge" in url:
                      tg_send("🔐 *LinkedIn Session Capture*\nPIN sent to your email.\n\n*Reply to this message with the 6-digit PIN.*\nWaiting 5 minutes...")
                      print("Challenge detected. Polling Telegram for PIN...")
                      
                      pin = tg_get_pin(timeout=300)
                      if not pin:
                          tg_send("❌ Timeout — no PIN received in 5 minutes.")
                          print("Timeout waiting for PIN")
                          await browser.close()
                          return
                      
                      print(f"Got PIN from Telegram: {pin}")
                      tg_send(f"Got PIN `{pin}`. Submitting...")
                      
                      try:
                          await page.fill('input[name="pin"]', pin)
                          await page.click('button[type="submit"]')
                          await page.wait_for_timeout(8000)
                          url = page.url
                          print(f"Post-PIN URL: {url}")
                      except Exception as e:
                          print(f"PIN submit error: {e}")
                          # Try alternative selectors
                          try:
                              inputs = await page.query_selector_all('input[type="text"]')
                              if inputs:
                                  await inputs[0].fill(pin)
                                  buttons = await page.query_selector_all('button[type="submit"]')
                                  if buttons:
                                      await buttons[-1].click()
                                      await page.wait_for_timeout(8000)
                                      url = page.url
                          except Exception as e2:
                              print(f"Fallback failed: {e2}")

                  # Try to get to feed if not there yet
                  if "feed" not in page.url and "checkpoint" not in page.url:
                      try:
                          await page.goto("https://www.linkedin.com/feed/", timeout=30000)
                          await page.wait_for_timeout(3000)
                      except:
                          pass

                  # Capture cookies
                  cookies = await context.cookies()
                  li_at = next((c["value"] for c in cookies if c["name"] == "li_at"), None)

                  if li_at:
                      print(f"✅ li_at captured ({len(li_at)} chars)")
                      
                      # Store as secrets
                      if PAT:
                          s1 = store_secret("LINKEDIN_LI_AT", li_at)
                          session_json = json.dumps({"cookies": [
                              {"name": c["name"], "value": c["value"], "domain": c["domain"],
                               "path": c.get("path","/"), "secure": c.get("secure",False)}
                              for c in cookies if c["domain"] and "linkedin" in c["domain"]
                          ]})
                          s2 = store_secret("LINKEDIN_SESSION_JSON", session_json)
                          print(f"Secrets stored: LI_AT={s1}, SESSION={s2}")
                      
                      tg_send(f"✅ *LinkedIn Session Captured!*\n`li_at` stored as GitHub secret.\nLinkedIn scraper ready for daily use.")
                  else:
                      print("❌ No li_at cookie")
                      all_cookies = [c["name"] for c in cookies]
                      print(f"Cookies: {all_cookies}")
                      await page.screenshot(path="linkedin_debug.png")
                      tg_send(f"❌ *Failed* — no li_at cookie.\nPage: {page.url[:60]}\nCookies: {', '.join(all_cookies[:10])}")

                  await browser.close()

          asyncio.run(run())
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: linkedin_debug.png
          retention-days: 1
