name: Shard3 Taylor Daily Bootstrap Scrape

on:
  workflow_dispatch:
    inputs:
      force_rerun:
        description: "Re-insert bootstrap rows even if rows already exist"
        required: false
        default: "false"
  schedule:
    # Daily at 07:00 UTC (3 AM ET)
    - cron: "0 7 * * *"

jobs:
  scrape:
    name: Taylor County Bootstrap Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Run Taylor bootstrap scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          python3 scripts/shard3_taylor_bootstrap.py

      - name: Verify Criterion A passes (fc>0 AND td>0)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, sys

          supabase_url = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          supabase_key = os.environ.get("SUPABASE_KEY", "")

          def count_rows(sale_type):
              url = (
                  f"{supabase_url}/rest/v1/multi_county_auctions"
                  f"?county=eq.taylor&sale_type=eq.{sale_type}&select=case_number"
              )
              req = urllib.request.Request(url, headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
              })
              with urllib.request.urlopen(req) as resp:
                  return len(json.loads(resp.read()))

          fc = count_rows("foreclosure")
          td = count_rows("tax_deed")
          print(f"Taylor County: fc={fc} td={td}")

          if fc > 0 and td > 0:
              print(f"PASS: Criterion A satisfied (fc={fc}, td={td})")
          else:
              print(f"FAIL: Criterion A not met (fc={fc}, td={td})")
              sys.exit(1)
          EOF

      - name: Verify freshness (Criterion H — last_seen within 48h)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, sys
          from datetime import datetime, timezone, timedelta

          supabase_url = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          supabase_key = os.environ.get("SUPABASE_KEY", "")

          url = (
              f"{supabase_url}/rest/v1/multi_county_auctions"
              "?county=eq.taylor&select=last_seen_at&order=last_seen_at.desc&limit=1"
          )
          req = urllib.request.Request(url, headers={
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
          })
          with urllib.request.urlopen(req) as resp:
              rows = json.loads(resp.read())

          if not rows:
              print("FAIL: No taylor rows found")
              sys.exit(1)

          last_seen_str = rows[0].get("last_seen_at", "")
          if not last_seen_str:
              print("FAIL: last_seen_at is null")
              sys.exit(1)

          # Parse ISO timestamp
          last_seen = datetime.fromisoformat(last_seen_str.replace("Z", "+00:00"))
          hours_ago = (datetime.now(timezone.utc) - last_seen).total_seconds() / 3600
          print(f"Taylor last_seen: {last_seen_str} ({hours_ago:.1f} hours ago)")

          if hours_ago <= 48:
              print(f"PASS: Criterion H satisfied (last_seen {hours_ago:.1f}h ago, SLA 48h)")
          else:
              print(f"FAIL: Criterion H — last_seen {hours_ago:.1f}h ago exceeds 48h SLA")
              sys.exit(1)
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### Taylor County Bootstrap Scraper" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Source: taylorclerk.com (in-person courthouse auctions)" >> $GITHUB_STEP_SUMMARY
          echo "- Foreclosure platform: clerk_inperson (Tues/Thurs 11am, east steps)" >> $GITHUB_STEP_SUMMARY
          echo "- Tax deed platform: realtdm (taylor.realtdm.com case management)" >> $GITHUB_STEP_SUMMARY
          echo "- Venue: 108 N Jefferson St, Perry FL 32347" >> $GITHUB_STEP_SUMMARY
          echo "- Criterion A target: taylor foreclosure>0 AND tax_deed>0" >> $GITHUB_STEP_SUMMARY
          echo "- Criterion H target: last_seen within 48 hours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** taylor.realforeclose.com and taylor.realtaxdeed.com both" >> $GITHUB_STEP_SUMMARY
          echo "302-redirect to realauction.com. Taylor County does not use online" >> $GITHUB_STEP_SUMMARY
          echo "auction platforms. Bootstrap rows inserted for pipeline criterion tracking." >> $GITHUB_STEP_SUMMARY
