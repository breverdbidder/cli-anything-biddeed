name: "Summit: Brevard 85% — Full County Spatial Join"
on:
  workflow_dispatch: {}

jobs:
  conquer:
    name: "85% Safeguard Run V2"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx shapely --break-system-packages
      - name: "Execute 85% Conquest V2"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: python scripts/brevard_85_percent_v2.py

