name: "Summit: DesignWise S1 Complete — V1.2.0 Full Sprint"
on:
  workflow_dispatch: {}

jobs:
  s1-complete:
    name: "S1: CLI + 13 Agents + Schema + Eval + Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute S1 Completion on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            echo "=== [1/6] Setup claude user ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Update Claude Code ==="
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            which claude && claude --version || echo "Claude Code not in PATH, checking npm global"
            ls -la /home/claude/.npm-global/bin/claude 2>/dev/null || ls -la /usr/local/bin/claude 2>/dev/null || echo "WARN: claude binary not found"

            echo "=== [3/6] Setup auth token ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Clone/Pull Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed
            echo "Repo ready. Last commit:"
            git log --oneline -3

            echo "=== [5/6] Run Claude Code — S1 Complete ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'MISSION: Complete DesignWise Squad Sprint 1 to 100%.

              STEP 0 — READ THE DISPATCH DOC (MANDATORY FIRST ACTION)
              Read this file completely before doing anything else:
              cat docs/plans/DESIGNWISE-S1-DISPATCH.md

              This file contains:
              - Exact list of 19 files that EXIST (do not recreate)
              - Exact list of files that are MISSING (create these)
              - 9 execution steps with file specs, method signatures, and commit messages
              - Verification checklist (8 checks before Telegram)
              - Failure handling protocol

              THEN also read:
              cat CLAUDE.md
              cat docs/plans/DESIGNWISE-SPEC.md | head -200
              ls -la designwise/agent-harness/cli_anything/designwise/core/
              ls -la designwise/tests/

              EXECUTION RULES:
              1. Follow the 9 steps in DESIGNWISE-S1-DISPATCH.md IN ORDER
              2. Commit after EACH step — never batch
              3. Use git config user.email ci@biddeed.ai and user.name BidDeed-CI
              4. Git remote: https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              5. Push to main after each commit
              6. For Supabase tables: try direct SQL via psql or pg npm package first. Connection: postgresql://postgres.mocerqjnksmhcjzxrewo:[service_role_key]@aws-0-us-east-1.pooler.supabase.com:6543/postgres. If that fails, create the migration SQL file and note it needs manual run.
              7. Run ALL 8 verification checks from Step 9 before sending Telegram
              8. NEVER claim 100% if any verification fails — send partial status instead
              9. If context window hits 50%, stop and commit what you have, send partial Telegram

              COST DISCIPLINE: No pip installs over 50MB. No Docker pulls. Use what is on the system.
              NEVER-LIE: If a table creation fails, say it failed. If a test imports fail, say why.

              GO. Execute Step 0 through Step 9. Push results. Send Telegram.'
            "

            echo "=== [6/6] Session complete ==="
