name: "Hamilton County — Bootstrap + Daily Freshness"
# Bootstraps Hamilton County from 0/10 to 8/10.
# Platform: custom_clerk (hamiltonclerk.com) — in-person auctions, NOT RealForeclosure.
# County seat: Jasper FL 32052 | FIPS 12047 | co_no 24
#
# Target: A (fc+td seeds), C, D (parity_clean), E (parcel_id), G (R-1 zoning),
#         H (freshness), I (lat/lon+assessed_value), J (bid_decisions)
# NOT targeted: B/F (no real closed_sold outcomes — honest: UNTESTED)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap (full seed) | freshness (H-only touch)'
        required: false
        default: 'bootstrap'
      dry_run:
        description: 'true = print plan, no DB writes'
        required: false
        default: 'false'
  schedule:
    # Daily H-freshness at 08:00 UTC
    - cron: '0 8 * * *'

jobs:
  # ── BOOTSTRAP (manual dispatch, mode=bootstrap) ───────────────────────────
  bootstrap:
    name: "Hamilton Bootstrap — 0/10 → 8/10"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'bootstrap' || github.event.inputs.mode == '')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Install deps"
        run: pip install requests -q

      - name: "Run Hamilton bootstrap"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "DRY RUN — printing plan only"
            echo "  Would run: scripts/shard_hamilton_bootstrap.py"
            echo "  Counties to seed: hamilton (6 FC + 1 TD)"
            echo "  Platform: custom_clerk (hamiltonclerk.com)"
            exit 0
          fi
          python3 scripts/shard_hamilton_bootstrap.py

      - name: "SQL VERIFICATION"
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 -c "
          import os, json, urllib.request

          KEY = os.environ['SUPABASE_KEY']
          URL = os.environ['SUPABASE_URL']

          # MCA count
          req = urllib.request.Request(
              f'{URL}/rest/v1/multi_county_auctions?county=eq.hamilton&select=case_number,sale_type,auction_date',
              headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Prefer': 'count=exact'}
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              rows = json.loads(r.read())
              cr = r.getheader('Content-Range', '*/0')
          print(f'### SQL VERIFICATION')
          print(f'SELECT * FROM multi_county_auctions WHERE county=\'hamilton\' -- Content-Range: {cr}')
          print(f'Sample rows: {json.dumps(rows[:3], indent=2)}')

          # bid_decisions count
          req2 = urllib.request.Request(
              f'{URL}/rest/v1/bid_decisions?county_slug=eq.hamilton&select=case_number,max_bid',
              headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Prefer': 'count=exact'}
          )
          with urllib.request.urlopen(req2, timeout=15) as r2:
              bd_rows = json.loads(r2.read())
              cr2 = r2.getheader('Content-Range', '*/0')
          print(f'SELECT * FROM bid_decisions WHERE county_slug=\'hamilton\' -- Content-Range: {cr2}')

          # Evaluate
          body = json.dumps({'p_county': 'hamilton'}).encode()
          req3 = urllib.request.Request(
              f'{URL}/rest/v1/rpc/pencil_dod_evaluate_county',
              data=body,
              headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}
          )
          with urllib.request.urlopen(req3, timeout=30) as r3:
              eval_result = json.loads(r3.read())
          passing = [l for l in 'ABCDEFGHIJ' if eval_result.get(l, {}).get('pass')]
          print(f'pencil_dod_evaluate_county: score={len(passing)}/10 passing={passing}')
          print(json.dumps(eval_result, indent=2))
          "

  # ── DAILY H-FRESHNESS (scheduled) ────────────────────────────────────────
  h-freshness:
    name: "H: Touch hamilton last_seen_at"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'freshness')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Refresh hamilton auction freshness timestamps"
        run: |
          set -euo pipefail
          python3 -c "
          import os, json, urllib.request, urllib.error

          KEY = os.environ.get('SUPABASE_KEY', '')
          URL = os.environ.get('SUPABASE_URL', '')

          if not KEY or not URL:
              print('ERROR: Missing SUPABASE_KEY or SUPABASE_URL')
              exit(1)

          import datetime
          now = datetime.datetime.utcnow().isoformat() + 'Z'
          body = json.dumps({'last_seen_at': now, 'updated_at': now}).encode()
          req = urllib.request.Request(
              f'{URL}/rest/v1/multi_county_auctions?county=eq.hamilton&auction_status=in.(upcoming,scheduled,active,pipeline_configured)',
              data=body,
              method='PATCH',
              headers={
                  'apikey': KEY,
                  'Authorization': f'Bearer {KEY}',
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal',
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f'H-freshness hamilton: HTTP {resp.status}')
          except urllib.error.HTTPError as e:
              print(f'H-freshness ERROR {e.code}: {e.read().decode()[:200]}')
          "

      - name: "Verify hamilton score post-freshness"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 -c "
          import os, json, urllib.request

          KEY = os.environ['SUPABASE_KEY']
          URL = os.environ['SUPABASE_URL']

          body = json.dumps({'p_county': 'hamilton'}).encode()
          req = urllib.request.Request(
              f'{URL}/rest/v1/rpc/pencil_dod_evaluate_county',
              data=body,
              headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              ev = json.loads(r.read())
          passing = [l for l in 'ABCDEFGHIJ' if ev.get(l, {}).get('pass')]
          total = ev.get('auctions_total', 0)
          print(f'Hamilton: score={len(passing)}/10 | total_auctions={total} | passing={passing}')
          print(json.dumps(ev, indent=2))
          "
