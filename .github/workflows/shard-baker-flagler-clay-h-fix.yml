name: "H-Freshness Fix: baker, flagler, clay"
# Stamps updated_at = NOW() for baker/flagler/clay rows in multi_county_auctions
# so that H criterion (MAX(GREATEST(created_at, updated_at, ...)) <= 48h) passes.
#
# Pattern proven by shard6-daily-scraper.yml freshness-update job.
# Uses Supabase Management API (SUPABASE_ACCESS_TOKEN) — no psql password required.

on:
  workflow_dispatch:

jobs:
  h-freshness-fix:
    name: "Stamp updated_at for baker/flagler/clay"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: Apply H freshness migration via Management API
        run: |
          set -euo pipefail
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260619_baker_flagler_clay_h_freshness_fix.sql').read()}))" > /tmp/h_fix_payload.json
          HTTP=$(curl -sS -o /tmp/h_fix_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/h_fix_payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/h_fix_resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::H freshness migration failed HTTP $HTTP"; exit 1; }
          echo "H freshness migration applied OK"

      - name: Verify H criterion passes for all three counties
        run: |
          set -euo pipefail
          VERIFY_SQL="SELECT county, COUNT(*) AS total_rows, MAX(GREATEST(created_at, updated_at, COALESCE(tier1_verified_at, '1970-01-01'::timestamptz), COALESCE(last_seen_at, '1970-01-01'::timestamptz))) AS latest_activity, ROUND(EXTRACT(EPOCH FROM (NOW() - MAX(GREATEST(created_at, updated_at, COALESCE(tier1_verified_at, '1970-01-01'::timestamptz), COALESCE(last_seen_at, '1970-01-01'::timestamptz))))) / 3600, 1) AS hours_since_activity, CASE WHEN ROUND(EXTRACT(EPOCH FROM (NOW() - MAX(GREATEST(created_at, updated_at, COALESCE(tier1_verified_at, '1970-01-01'::timestamptz), COALESCE(last_seen_at, '1970-01-01'::timestamptz))))) / 3600, 1) <= 48 THEN 'PASS' ELSE 'FAIL' END AS h_status FROM multi_county_auctions WHERE county IN ('baker', 'flagler', 'clay') GROUP BY county ORDER BY county"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$VERIFY_SQL" > /tmp/verify_payload.json
          HTTP=$(curl -sS -o /tmp/verify_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verify_payload.json)
          echo "=== H CRITERION VERIFICATION ==="
          echo "HTTP: $HTTP"
          cat /tmp/verify_resp.json | python3 -m json.tool 2>/dev/null || cat /tmp/verify_resp.json
          echo

      - name: Run pencil_dod_evaluate_county for each county
        run: |
          set -euo pipefail
          echo "### SQL VERIFICATION — H Freshness Fix baker/flagler/clay"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for COUNTY in baker flagler clay; do
            EVAL_SQL="SELECT letter, pass, ROUND(metric::numeric, 1) AS metric, detail FROM public.pencil_dod_evaluate_county('${COUNTY}') ORDER BY letter"
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$EVAL_SQL" > /tmp/eval_payload.json
            HTTP=$(curl -sS -o /tmp/eval_resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/eval_payload.json)
            echo "=== ${COUNTY^^} (HTTP $HTTP) ==="
            cat /tmp/eval_resp.json | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          if isinstance(data, list):
              passes = [r['letter'] for r in data if r.get('pass')]
              fails  = [r['letter'] for r in data if not r.get('pass')]
              print(f\"  PASS ({len(passes)}/10): {passes}\")
              print(f\"  FAIL ({len(fails)}/10): {fails}\")
              for r in data:
                  icon = '  PASS' if r.get('pass') else '  FAIL'
                  print(f\"{icon}  {r.get('letter')}: metric={r.get('metric')} | {r.get('detail')}\")
          else:
              print(data)
          " 2>/dev/null || cat /tmp/eval_resp.json
            echo
          done
