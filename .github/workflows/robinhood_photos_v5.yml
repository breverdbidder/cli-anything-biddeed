name: Robinhood Photos v5

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/rh_v5 && mkdir -p /tmp/rh_v5
          cd /tmp/rh_v5

          cat > scrape.py <<'PY'
          import asyncio, json, re, hashlib, time
          from pathlib import Path
          import urllib.request, urllib.parse

          OUT = Path('/tmp/rh_v5')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          def http_get(url, timeout=25, headers=None):
              hdrs = {'User-Agent': UA}
              if headers: hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              return urllib.request.urlopen(req, timeout=timeout)

          # ============================================================
          # STAGE 1: BCPAO — public parcel photo + property card
          # ============================================================
          async def bcpao_pull(page):
              urls = set()
              try:
                  # BCPAO search by address
                  await page.goto("https://www.bcpao.us/PropertySearch/", wait_until="domcontentloaded", timeout=45000)
                  await asyncio.sleep(3)
                  # Try address search
                  try:
                      sel = await page.query_selector("input#txtAddress, input[name*='Address'], input#Address")
                      if sel:
                          await sel.fill("4087 Robinhood")
                          await asyncio.sleep(1)
                          # Submit
                          submit = await page.query_selector("button[type=submit], input[type=submit]")
                          if submit:
                              await submit.click()
                              await asyncio.sleep(4)
                  except: pass

                  html1 = await page.content()
                  Path('/tmp/rh_v5/bcpao_search.html').write_text(html1, errors='replace')
                  print(f"  BCPAO search: {len(html1)}b", flush=True)

                  # Extract parcel ID from search results
                  m = re.search(r'(?:parcel|account)[^<]*?(\d{2}[\s-]\d{2}[\s-]\d{2}[\s-]\d{2}[\s-]\d{2}[\s-]\d{6}\.\d+)', html1, re.I)
                  if not m:
                      m = re.search(r'(\d{2}-\d{2}-\d{2}-\d{2}-\d{2}-\d{6}\.\d{2,3})', html1)
                  parcel_id = m.group(1) if m else None
                  print(f"  Parcel ID: {parcel_id}", flush=True)

                  # Try direct parcel page with a guess
                  for pid_pattern in [
                      "27%202200%20DY%200002.00",  # legal: S 32 T 26 R 37 SUBID DY -> common encoded form
                      parcel_id,
                  ]:
                      if not pid_pattern: continue
                      try:
                          tgt = f"https://www.bcpao.us/PropertySearch/#/parcel/{pid_pattern}"
                          await page.goto(tgt, wait_until="domcontentloaded", timeout=20000)
                          await asyncio.sleep(3)
                          h = await page.content()
                          if len(h) > 30000:
                              Path(f'/tmp/rh_v5/bcpao_parcel.html').write_text(h, errors='replace')
                              print(f"  BCPAO parcel page: {len(h)}b", flush=True)
                              # Find photos
                              for pat in [
                                  r'https://[^"\\\']+?bcpao[^"\\\']+?\.jpg',
                                  r'/PropertySearch/[^"\\\']+?\.jpg',
                                  r'src=["\']([^"\']+?\.jpg)["\']',
                                  r'background-image:[^;]+?url\(["\']?([^"\')]+?\.jpg)',
                              ]:
                                  for u in re.findall(pat, h):
                                      if isinstance(u, str):
                                          if u.startswith('/'):
                                              u = 'https://www.bcpao.us' + u
                                          if 'bcpao' in u.lower() or 'parcel' in u.lower():
                                              urls.add(u)
                              break
                      except Exception as e:
                          print(f"  BCPAO parcel err: {str(e)[:80]}", flush=True)

                  print(f"  BCPAO URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  BCPAO err: {e}", flush=True)
              return list(urls)

          # ============================================================
          # STAGE 2: Direct image scraping from aggregator pages
          # Save the FULL HTML for later inspection
          # ============================================================
          async def aggregator_pull(page):
              urls = set()
              targets = [
                  ("realtor", "https://www.realtor.com/realestateandhomes-detail/4087-Robinhood-Dr_Melbourne_FL_32935_M50330-58462"),
                  ("realtor2", "https://www.realtor.com/realestateandhomes-detail/4087-Robinhood-Dr_Melbourne_FL_32935"),
                  ("homesnap", "https://www.homesnap.com/Florida/Melbourne/4087-Robinhood-Dr"),
                  ("homesnap2", "https://www.homesnap.com/4087-Robinhood-Drive/Melbourne/Florida/32935"),
                  ("estately", "https://www.estately.com/listings/florida/melbourne/32935/4087-robinhood-dr"),
                  ("homes", "https://www.homes.com/property/4087-robinhood-dr-melbourne-fl/"),
                  ("homes2", "https://www.homes.com/property/4087-robinhood-dr-melbourne-fl-32935/"),
                  ("movoto", "https://www.movoto.com/melbourne-fl/4087-robinhood-dr-melbourne-fl-32935-153_953113800/for-sale/"),
                  ("compass", "https://www.compass.com/listing/4087-robinhood-drive-melbourne-fl-32935"),
                  ("trulia", "https://www.trulia.com/p/fl/melbourne/4087-robinhood-dr-melbourne-fl-32935--2087500770"),
                  ("rocket", "https://www.rocket.com/homes/melbourne-fl-32935/4087-robinhood-dr"),
                  ("propertyshark", "https://www.propertyshark.com/mason/Property/4087-Robinhood-Dr-Melbourne-FL-32935"),
                  ("redfin_search", "https://www.redfin.com/stingray/api/gis-search?location=4087+Robinhood+Dr+Melbourne+FL"),
              ]
              for name, url in targets:
                  try:
                      await page.goto(url, wait_until="domcontentloaded", timeout=18000)
                      await asyncio.sleep(2)
                      html = await page.content()
                      Path(f'/tmp/rh_v5/{name}.html').write_text(html, errors='replace')
                      n = len(html)
                      found = set()
                      for pat in [
                          r'https://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                          r'https://ssl\.cdn-redfin\.com/photo/[^"\s\'\\]+?\.jpg',
                          r'https://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?(?:_h|_w)\d+[^"\s\'\\]*?\.jpg',
                          r'https://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?\.jpg',
                          r'https://[a-z0-9.\-]+\.cloudfront\.net/[^"\s\'\\]+?(?:photo|listing)[^"\s\'\\]+?\.jpg',
                          r'https://images\.[a-z0-9.\-]+/listings/[^"\s\'\\]+?\.jpg',
                          r'https://thumbs\.[a-z0-9.\-]+/[^"\s\'\\]+?\.jpg',
                          r'"large_url":\s*"([^"]+\.jpg)"',
                          r'"image_url":\s*"([^"]+\.jpg)"',
                          r'"photoUrl":\s*"([^"]+\.jpg)"',
                          r'"src":\s*"(https?://[^"]+\.jpg)"',
                          r'<meta[^>]+property="og:image"[^>]+content="([^"]+\.jpg)',
                      ]:
                          for u in re.findall(pat, html):
                              if isinstance(u, tuple): u = u[0]
                              if 'logo' in u.lower() or 'icon' in u.lower(): continue
                              found.add(u)
                      print(f"  {name}: {n}b -> {len(found)} imgs", flush=True)
                      urls.update(found)
                  except Exception as e:
                      print(f"  {name} err: {str(e)[:60]}", flush=True)
              return urls

          # ============================================================
          # STAGE 3: Wayback Machine — broader URL patterns
          # ============================================================
          def wayback_search():
              urls = set()
              import urllib.parse
              patterns = [
                  "*zillow.com/homedetails/*4087*Robinhood*",
                  "*zillow.com*4087*Robinhood*Melbourne*",
                  "*redfin.com*4087-Robinhood*",
                  "*realtor.com*4087-Robinhood*",
                  "*trulia.com*4087*robinhood*",
                  "*homes.com*4087*robinhood*",
                  "*movoto.com*4087*robinhood*",
              ]
              for p in patterns:
                  try:
                      cdx_url = f"https://web.archive.org/cdx/search/cdx?url={urllib.parse.quote(p)}&matchType=domain&output=json&limit=80"
                      with http_get(cdx_url, timeout=40) as r:
                          data = json.loads(r.read())
                      print(f"  CDX [{p[:50]}]: {len(data)-1 if len(data)>0 else 0}", flush=True)
                      for row in data[1:8]:  # try first 8 per pattern
                          ts, orig, mime = row[1], row[2], row[3]
                          snap_url = f"https://web.archive.org/web/{ts}/{orig}"
                          try:
                              with http_get(snap_url, timeout=25) as r2:
                                  html = r2.read().decode('utf-8', errors='replace')
                              for pat2 in [
                                  r'https://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                                  r'https://ssl\.cdn-redfin\.com/photo/[^"\s\'\\]+?\.jpg',
                                  r'https://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?\.jpg',
                                  r'/web/\d+im_/https?://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                                  r'/web/\d+im_/https?://ssl\.cdn-redfin\.com/[^"\s\'\\]+?\.jpg',
                                  r'/web/\d+im_/https?://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?\.jpg',
                              ]:
                                  for u in re.findall(pat2, html):
                                      if u.startswith('/web/'):
                                          u = 'https://web.archive.org' + u
                                      urls.add(u)
                              print(f"    {ts}: {len(html)}b html, total imgs now {len(urls)}", flush=True)
                          except Exception as e:
                              print(f"    snap err: {str(e)[:50]}", flush=True)
                  except Exception as e:
                      print(f"  CDX err: {str(e)[:80]}", flush=True)
                  time.sleep(0.5)
              return urls

          async def main():
              from playwright.async_api import async_playwright
              all_urls = set()

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                  )
                  page = await ctx.new_page()

                  print("=== Stage 1: BCPAO ===", flush=True)
                  bcpao_urls = await bcpao_pull(page)
                  all_urls.update(bcpao_urls)

                  print("\n=== Stage 2: Aggregators ===", flush=True)
                  agg_urls = await aggregator_pull(page)
                  all_urls.update(agg_urls)

                  await browser.close()

              print("\n=== Stage 3: Wayback ===", flush=True)
              wb_urls = wayback_search()
              all_urls.update(wb_urls)

              print(f"\n=== Total unique URLs: {len(all_urls)} ===", flush=True)
              good = []
              for u in all_urls:
                  ulow = u.lower()
                  if any(s in ulow for s in ['logo', 'icon', 'sprite', 'avatar', 'placeholder', 'tracking', 'pixel.gif', 'spinner', 'loading']):
                      continue
                  if u.endswith('.svg'): continue
                  if 'thumb' in ulow and 'large' not in ulow and 'big' not in ulow:
                      continue
                  good.append(u)
              print(f"After filter: {len(good)}", flush=True)
              for u in good[:30]:
                  print(f"  {u[:160]}", flush=True)

              # Download
              downloaded = []
              for i, url in enumerate(good[:50], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"v5_{i:02d}_{h}.jpg"
                      with http_get(url, timeout=25, headers={'Referer': 'https://web.archive.org/'}) as r:
                          data = r.read()
                      if len(data) > 8000:
                          (OUT / fname).write_bytes(data)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                          print(f"  [{i}] {len(data)}b -> {fname}", flush=True)
                      else:
                          print(f"  [{i}] {len(data)}b too small", flush=True)
                  except Exception as e:
                      print(f"  [{i}] FAIL: {str(e)[:60]}", flush=True)

              with open(OUT/'manifest.json','w') as f:
                  json.dump({'all_urls': list(all_urls), 'downloaded': downloaded}, f, indent=2)
              print(f"\n>>> Downloaded {len(downloaded)} photos", flush=True)

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/rh_v5/ | head -40
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/rh_v5/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos_v5
          path: /tmp/results/
          retention-days: 90
