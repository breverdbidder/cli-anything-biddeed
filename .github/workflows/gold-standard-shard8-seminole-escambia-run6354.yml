name: "SHARD-8 run6354 Daily Maintenance (seminole + escambia)"
# Gold Standard maintenance — dispatch_id c49e2d4d-0bc3-4698-bc71-b2779f0ff852
#
# Seminole: 9/10 → target 10/10 (only I fails, 93.0%)
# Escambia: 6/10 → target 7/10 (C/D/G/I fail; G structurally blocked)
#
# Daily 14:00 UTC — offset from escambia-run6148 (13:30 UTC) to avoid conflicts.
# All scripts are idempotent gap-finders: safe to re-run daily as new rows land.

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: shard8-seminole-escambia-run6354-daily
  cancel-in-progress: false

jobs:
  run-executor:
    name: "Seminole + Escambia I/C/D/J fixes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run shard-8 executor
        run: python3 scripts/shard8_seminole_escambia_run6354.py

  evaluate:
    name: "Evaluate seminole + escambia metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [run-executor]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Run pencil_dod_evaluate_county for both counties
        run: |
          set -euo pipefail
          python3 -c "
          import os, json, urllib.request

          supa_url = os.environ['SUPABASE_URL']
          supa_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def evaluate(county):
              payload = json.dumps({'p_county': county}).encode()
              url = f'{supa_url}/rest/v1/rpc/pencil_dod_evaluate_county'
              req = urllib.request.Request(url, data=payload, method='POST')
              req.add_header('apikey', supa_key)
              req.add_header('Authorization', f'Bearer {supa_key}')
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read())

          for county in ['seminole', 'escambia']:
              ev = evaluate(county)
              passes = sum(1 for k in 'ABCDEFGHIJ' if isinstance(ev.get(k), dict) and ev[k].get('pass'))
              print(f'{county}: {passes}/10 PASS')
              for letter in 'ABCDEFGHIJ':
                  d = ev.get(letter, {})
                  if isinstance(d, dict):
                      status = 'PASS' if d.get('pass') else 'FAIL'
                      print(f'  {letter}: {status} metric={d.get(\"metric\")} {str(d.get(\"detail\",\"\"))[:80]}')
          "
