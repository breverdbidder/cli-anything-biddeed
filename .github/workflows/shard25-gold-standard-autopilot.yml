          else
            echo "❌ Brevard evaluation failed: $HTTP"
            echo "Response: $BODY"
          fi

      - name: Verify Live Metrics - Duval
        run: |
          echo "=== Live Verification: Duval ==="
          
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"county_slug_arg": "duval"}')
          
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ Duval evaluation completed"  
            echo "Metrics: $BODY" | python3 -c "
import sys, json
try:
    data = json.loads(sys.stdin.read().split('Metrics: ')[1])
    if isinstance(data, list):
        total = len(data)
