name: SHARD 25 Gold Standard Autopilot
# Session: GOLD STANDARD AUTOPILOT-BD run 25
# Counties: brevard, duval  
# Authority: CLAUDE.md autonomous operations + pre-authorized supplementary litmus

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - analysis_only
          - execute_all
          - verify_only
        default: 'execute_all'

jobs:
  shard25_execution:
    name: "Execute Gold Standard Fixes"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Session Info
        run: |
          echo "=== SHARD 25 - GOLD STANDARD AUTOPILOT ==="
          echo "Session: GOLD STANDARD AUTOPILOT-BD run 25"
          echo "Counties: brevard, duval"  
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Authority: CLAUDE.md autonomous operations"
          echo "Dispatch ID: d0008011-c671-4eb3-b5eb-69f501499fe8"

      - name: Apply Migration
        if: github.event.inputs.mode == 'execute_all'
        run: |
          echo "=== Applying Migration: 20260614_duval_brevard_gold_standard.sql ==="
          
          if [ ! -f "supabase/migrations/20260614_duval_brevard_gold_standard.sql" ]; then
            echo "❌ Migration file not found"
            exit 1
          fi
          
          SQL=$(cat supabase/migrations/20260614_duval_brevard_gold_standard.sql)
          echo "Migration loaded: $(echo "$SQL" | wc -l) lines"
          
          echo "Executing via Supabase Management API..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_MGMT_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}")
          
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          echo "$BODY"
          
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
            echo "✅ Migration succeeded"
          else
            echo "⚠️ Management API response: $HTTP"
            echo "Continuing with execution (migration may already be applied)"
          fi

      - name: Execute J Generator - Brevard
        if: github.event.inputs.mode == 'execute_all'
        run: |
          echo "=== J Generator: Brevard ==="
          
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/generate_bid_decisions_batch" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_county_slug": "brevard", "batch_size": 500}')
          
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          echo "Response: $BODY"
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ Brevard J generator executed"
          else
            echo "⚠️ J generator response: $HTTP"
          fi

      - name: Execute J Generator - Duval  
        if: github.event.inputs.mode == 'execute_all'
        run: |
          echo "=== J Generator: Duval ==="
          
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/generate_bid_decisions_batch" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_county_slug": "duval", "batch_size": 500}')
          
          HTTP=$(echo "$RESP" | tail -1)  
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          echo "Response: $BODY"
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ Duval J generator executed"
          else
            echo "⚠️ J generator response: $HTTP"
          fi

      - name: Execute C/D Parity Fix - Brevard
        if: github.event.inputs.mode == 'execute_all'
        run: |
          echo "=== C/D Parity Fix: Brevard (with clerk litmus) ==="
          
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/update_parity_status_batch" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_county_slug": "brevard", "use_clerk_records": true, "batch_size": 200}')
          
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"  
          echo "Response: $BODY"
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ Brevard C/D parity fix executed"
          else
            echo "⚠️ Parity fix response: $HTTP"
          fi

      - name: Execute C/D Parity Fix - Duval
        if: github.event.inputs.mode == 'execute_all' 
        run: |
          echo "=== C/D Parity Fix: Duval (with clerk litmus) ==="
          
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/update_parity_status_batch" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_county_slug": "duval", "use_clerk_records": true, "batch_size": 200}')
          
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1) 
          echo "HTTP: $HTTP"
          echo "Response: $BODY"
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ Duval C/D parity fix executed"
          else
            echo "⚠️ Parity fix response: $HTTP"
          fi

      - name: Verify Live Metrics - Brevard
        run: |
          echo "=== Live Verification: Brevard ==="
          
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"county_slug_arg": "brevard"}')
          
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          
          if [ "$HTTP" = "200" ]; then
            echo "✅ Brevard evaluation completed"
            echo "Metrics: $BODY" | python3 -c "
