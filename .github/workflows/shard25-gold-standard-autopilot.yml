try:
    data = json.loads(sys.stdin.read().split('Metrics: ')[1])
    if isinstance(data, list):
        total = len(data)
        passing = sum(1 for item in data if item.get('pass', False))
        print(f'Score: {passing}/{total}')
        for item in data:
            letter = item.get('letter', '?')
            metric = item.get('metric', 'N/A') 
            status = '✅' if item.get('pass', False) else '❌'
            print(f'  {letter}: {status} {metric}')
    else:
        print(f'Data: {data}')
except Exception as e:
    print(f'Parse error: {e}')
