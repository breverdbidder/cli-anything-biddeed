name: Sprint 1 — Wire Dify RAG + Tools + Supabase
on:
  workflow_dispatch:
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Execute Sprint 1
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "" | base64 -d > /tmp/sprint1.py
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no /tmp/sprint1.py root@$HETZNER_IP:/tmp/sprint1.py
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 root@$HETZNER_IP "SUPA_KEY='$SUPABASE_KEY' SUPA_ANON='$SUPABASE_ANON_KEY' DIFY_KEY='$DIFY_API_KEY' python3 /tmp/sprint1.py"
