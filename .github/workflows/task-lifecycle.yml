name: Task Lifecycle — Auto-Complete & Auto-Create

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min
  workflow_dispatch:
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Task lifecycle engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, json, os, re
          from datetime import datetime, timezone, timedelta

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID", "")
          GH_PAT = os.environ.get("GH_PAT", "")
          EVENT = os.environ.get("TRIGGER_EVENT", "")
          WF_NAME = os.environ.get("TRIGGER_WORKFLOW", "")
          WF_CONCLUSION = os.environ.get("TRIGGER_CONCLUSION", "")
          WF_RUN_ID = os.environ.get("TRIGGER_RUN_ID", "")
          WF_RUN_URL = os.environ.get("TRIGGER_RUN_URL", "")

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json", "Prefer": "return=representation"}
          gh_h = {"Authorization": f"token {GH_PAT}"} if GH_PAT else {}
          EST = timezone(timedelta(hours=-4))
          NOW = datetime.now(EST)
          TODAY = NOW.strftime("%Y-%m-%d")
          notifications = []

          def tg(msg):
              if TG_TOKEN and TG_CHAT:
                  try:
                      requests.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id": TG_CHAT, "text": msg}, timeout=10)
                  except: pass

          def get_open_tasks():
              try:
                  r = requests.get(f"{SB_URL}/rest/v1/nexus_tasks?status=in.(queued,running,dispatched,blocked)&order=priority.asc",
                      headers=sb_h, timeout=10)
                  return r.json() if r.status_code == 200 else []
              except: return []

          def update_task(task_id, updates):
              try:
                  updates["updated_at"] = datetime.now(timezone.utc).isoformat()
                  r = requests.patch(f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.{task_id}",
                      headers=sb_h, json=updates, timeout=10)
                  return r.status_code in (200, 204)
              except: return False

          def create_task(task):
              try:
                  r = requests.post(f"{SB_URL}/rest/v1/nexus_tasks", headers=sb_h, json=task, timeout=10)
                  return r.status_code in (200, 201)
              except: return False

          # ============================================================
          # MODE 1: WORKFLOW_RUN TRIGGER — immediate reaction
          # ============================================================
          if EVENT == "workflow_run" and WF_NAME:
              open_tasks = get_open_tasks()
              
              # Check if any running task has a matching GHA run
              for t in open_tasks:
                  gha_url = t.get("gha_run_url", "") or ""
                  tid = t.get("task_id", "")
                  
                  # Match by run URL or by workflow name keywords
                  matched = False
                  if WF_RUN_URL and gha_url and WF_RUN_ID in gha_url:
                      matched = True
                  
                  if matched:
                      if WF_CONCLUSION == "success":
                          update_task(tid, {"status": "success", "completed_at": datetime.now(timezone.utc).isoformat(),
                              "result_summary": f"GHA run {WF_RUN_ID} succeeded"})
                          msg = f"✅ TASK COMPLETE: {tid}\n{t.get('description','')[:80]}\nRun: {WF_RUN_URL}"
                          tg(msg)
                          print(msg)
                      elif WF_CONCLUSION == "failure":
                          update_task(tid, {"status": "failed", "error_message": f"GHA run {WF_RUN_ID} failed",
                              "gha_run_url": WF_RUN_URL})
                          msg = f"❌ TASK FAILED: {tid}\n{t.get('description','')[:80]}\nRun: {WF_RUN_URL}"
                          tg(msg)
                          print(msg)

          # ============================================================
          # MODE 2: SCHEDULED — patrol for stale tasks + auto-escalate
          # ============================================================
          if EVENT in ("schedule", "workflow_dispatch"):
              open_tasks = get_open_tasks()
              
              # --- STALE DETECTION ---
              for t in open_tasks:
                  tid = t.get("task_id", "")
                  created = t.get("created_at", "")
                  status = t.get("status", "")
                  priority = t.get("priority", "P3")
                  sla = t.get("sla_deadline")
                  escalation = t.get("escalation_count", 0) or 0
                  
                  if not created: continue
                  try:
                      created_dt = datetime.fromisoformat(created.replace("Z", "+00:00"))
                      age_hours = (datetime.now(timezone.utc) - created_dt).total_seconds() / 3600
                  except: continue

                  # P0 stale after 24h, P1 after 48h, P2 after 72h
                  stale_threshold = {"P0": 24, "P1": 48, "P2": 72, "P3": 168}.get(priority, 168)
                  
                  if age_hours > stale_threshold and status == "queued":
                      new_esc = escalation + 1
                      update_task(tid, {"escalation_count": new_esc, "last_escalated_at": datetime.now(timezone.utc).isoformat()})
                      
                      if new_esc <= 3:
                          msg = f"⚠️ STALE TASK #{new_esc}: {tid} [{priority}]\n{t.get('description','')[:80]}\nAge: {age_hours:.0f}h | Owner: {t.get('owner','?')}"
                          tg(msg)
                          print(msg)
                      elif new_esc == 4:
                          # Auto-escalate priority
                          new_pri = {"P2": "P1", "P1": "P0"}.get(priority, priority)
                          if new_pri != priority:
                              update_task(tid, {"priority": new_pri})
                              msg = f"🔺 AUTO-ESCALATED: {tid} {priority}→{new_pri}\n{t.get('description','')[:80]}"
                              tg(msg)
                              print(msg)

                  # --- SLA WARNING ---
                  if sla:
                      try:
                          deadline = datetime.fromisoformat(sla.replace("Z", "+00:00"))
                          days_left = (deadline - datetime.now(timezone.utc)).days
                          # Warn at 14d, 7d, 3d, 1d, 0d
                          if days_left in (14, 7, 3, 1, 0) and status != "success":
                              emoji = "🔴" if days_left <= 1 else "🟡" if days_left <= 7 else "🟠"
                              msg = f"{emoji} SLA WARNING: {tid} — {days_left} days left!\n{t.get('description','')[:80]}"
                              tg(msg)
                              print(msg)
                      except: pass

              # --- AUTO-CREATE: Detect new GHA failures not in nexus ---
              try:
                  repos = ["cli-anything-biddeed", "zonewise-web", "everest-nexus", "zonewise-gtm"]
                  existing_ids = {t.get("task_id","") for t in open_tasks}
                  
                  for repo in repos:
                      r = requests.get(
                          f"https://api.github.com/repos/breverdbidder/{repo}/actions/runs?status=failure&created=%3E{TODAY}T00:00:00Z&per_page=10",
                          headers=gh_h, timeout=10)
                      if r.status_code != 200: continue
                      
                      for run in r.json().get("workflow_runs", []):
                          run_id = str(run["id"])
                          wf_name = run.get("name", "unknown")[:60]
                          auto_tid = f"GHA-{run_id[-6:]}"
                          
                          # Skip if already tracked
                          if auto_tid in existing_ids: continue
                          # Skip self-referential (this workflow)
                          if "Task Lifecycle" in wf_name: continue
                          # Skip checkpoint/action-plan (they succeed)
                          if "Checkpoint" in wf_name or "Action Plan" in wf_name: continue
                          
                          created = create_task({
                              "task_id": auto_tid,
                              "description": f"GHA failure: {wf_name} in {repo}",
                              "priority": "P2",
                              "status": "queued",
                              "project": "ECOSYSTEM",
                              "owner": "claude_code",
                              "task_type": "engineering",
                              "gha_run_url": run.get("html_url", ""),
                              "triggered_by": "sentinel"
                          })
                          if created:
                              existing_ids.add(auto_tid)
                              print(f"🆕 Auto-created: {auto_tid} — {wf_name}")
              except Exception as e:
                  print(f"⚠️ Auto-create scan error: {e}")

              print(f"\n📊 Patrol complete: {len(open_tasks)} open tasks checked")

          PYSCRIPT
