name: Task Lifecycle — Auto-Complete & Auto-Create

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min
  workflow_dispatch:
  # 2026-09-03 (#19767): narrowed from workflows: ["*"] — that wildcard meant
  # a Task Lifecycle run per completed run of ANY of the ~660 workflow files
  # in this repo (measured: 23 runs in a single 5-minute window,
  # 2026-09-03 00:34:50-00:39:50 UTC, nearly all `skipped`/`cancelled`), and
  # starved workflow_dispatch queue capacity for unrelated runs (issue
  # #19764's dispatch returned HTTP 204 with no run created during the storm).
  # Mode 1 in the job body below (immediate task-complete/ghost-success/
  # Playwright-trigger reaction) only ever matches an open nexus_tasks row by
  # WF_RUN_URL == task.gha_run_url — i.e. it only ever does anything on a
  # completion of whichever workflow actually executed a dispatched SUMMIT
  # session. Per supabase/migrations/20260702_dispatch_hygiene_dod_sql_at_source.sql
  # (launch_claude_code_session, p_workflow) and docs/FLEET-LANE-ROUTING.md,
  # that is always one of the three workflows below — never one of the
  # hundreds of per-issue one-off workflows (close-stale-N.yml,
  # gold-standard-shard-N.yml, etc.), which are artifacts a session commits
  # as a side effect, not the session's own dispatch target. The Mode 2
  # scheduled patrol (every 30 min, below) independently covers stale-task
  # escalation and auto-create-from-failure across all 4 tracked repos
  # regardless of which workflow failed, so narrowing this list costs at most
  # 30 minutes of latency on Mode 1's instant-completion path for a task
  # dispatched through a workflow not listed here — not loss of function.
  workflow_run:
    workflows:
      - "CC Runner — GHA-only (no Hetzner)"
      - "Gemini Runner — T2/T3 grunt lane (no Hetzner, no Claude Code)"
      - "SUMMIT: Task from Issue"
    types: [completed]

concurrency:
  group: task-lifecycle-global
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name != 'workflow_run' ||
      (
        !contains(github.event.workflow_run.name, 'Task Lifecycle') &&
        !contains(github.event.workflow_run.name, 'Sentinel') &&
        !contains(github.event.workflow_run.name, 'Close Stale')
      )
    steps:
      - name: Task lifecycle engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, json, os, re
          from datetime import datetime, timezone, timedelta

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID", "")
          GH_PAT = os.environ.get("GH_PAT", "")
          EVENT = os.environ.get("TRIGGER_EVENT", "")
          WF_NAME = os.environ.get("TRIGGER_WORKFLOW", "")
          WF_CONCLUSION = os.environ.get("TRIGGER_CONCLUSION", "")
          WF_RUN_ID = os.environ.get("TRIGGER_RUN_ID", "")
          WF_RUN_URL = os.environ.get("TRIGGER_RUN_URL", "")

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json", "Prefer": "return=representation"}
          gh_h = {"Authorization": f"token {GH_PAT}"} if GH_PAT else {}
          EST = timezone(timedelta(hours=-4))
          NOW = datetime.now(EST)
          TODAY = NOW.strftime("%Y-%m-%d")
          notifications = []

          def tg(msg):
              if TG_TOKEN and TG_CHAT:
                  try:
                      requests.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                          json={"chat_id": TG_CHAT, "text": msg}, timeout=10)
                  except: pass

          def get_open_tasks():
              try:
                  r = requests.get(f"{SB_URL}/rest/v1/nexus_tasks?status=in.(queued,running,dispatched,blocked)&order=priority.asc",
                      headers=sb_h, timeout=10)
                  return r.json() if r.status_code == 200 else []
              except: return []

          def update_task(task_id, updates):
              try:
                  updates["updated_at"] = datetime.now(timezone.utc).isoformat()
                  r = requests.patch(f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.{task_id}",
                      headers=sb_h, json=updates, timeout=10)
                  return r.status_code in (200, 204)
              except: return False

          def create_task(task):
              try:
                  r = requests.post(f"{SB_URL}/rest/v1/nexus_tasks", headers=sb_h, json=task, timeout=10)
                  return r.status_code in (200, 201)
              except: return False

          # ============================================================
          # MODE 1: WORKFLOW_RUN TRIGGER — immediate reaction
          # ============================================================
          if EVENT == "workflow_run" and WF_NAME:
              open_tasks = get_open_tasks()
              
              # Check if any running task has a matching GHA run
              for t in open_tasks:
                  gha_url = t.get("gha_run_url", "") or ""
                  tid = t.get("task_id", "")
                  
                  # Match by run URL or by workflow name keywords
                  matched = False
                  if WF_RUN_URL and gha_url and WF_RUN_ID in gha_url:
                      matched = True
                  
                  if matched:
                      if WF_CONCLUSION == "success":
                          # ── OUTPUT GATE: check issue has real comments before marking success ──
                          _has_output = True
                          _issue_num = ""
                          _desc = t.get("description", "") or tid
                          import re as _re
                          _im = _re.search(r"[#](\d+)|issue[\s_]*(\d+)", _desc, _re.IGNORECASE)
                          if _im:
                              _issue_num = _im.group(1) or _im.group(2)
                          if _issue_num:
                              try:
                                  _cr = urllib.request.Request(f"https://api.github.com/repos/{REPO}/issues/{_issue_num}/comments?per_page=5",
                                      headers={"Authorization": f"token {GH_PAT}", "Accept": "application/vnd.github.v3+json"})
                                  _cc = json.loads(urllib.request.urlopen(_cr).read())
                                  _real = [c for c in _cc if "traycer" not in c.get("user",{}).get("login","") and "Sprint assigned" not in c.get("body","")[:20]]
                                  _has_output = len(_real) > 0
                              except:
                                  _has_output = True
                          if not _has_output:
                              update_task(tid, {"status": "failed", "error_message": f"GHOST SUCCESS: GHA passed but zero output on #{_issue_num}",
                                  "gha_run_url": WF_RUN_URL})
                              msg = f"⚠️ GHOST SUCCESS: {tid}\nGHA passed but zero output. #{_issue_num}\nRun: {WF_RUN_URL}"
                              tg(msg)
                              print(msg)
                          else:
                              # ── PW GATE: trigger Playwright for UI tasks ──
                              _ui_kw = ["chat","deploy","frontend","page","ui","html","competitor","stripe","split"]
                              if any(k in _desc.lower() for k in _ui_kw):
                                  try:
                                      _pw = json.dumps({"ref":"main","inputs":{"url":"https://zonewise.ai/chat-v2","selectors":".aui-root,textarea,[class*=grid]","max_attempts":"3","issue_number":_issue_num or ""}}).encode()
                                      urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{REPO}/actions/workflows/playwright-verify.yml/dispatches",
                                          data=_pw, headers={"Authorization":f"token {GH_PAT}","Accept":"application/vnd.github.v3+json","Content-Type":"application/json"}, method="POST"))
                                      print(f"  🎭 Playwright verify triggered for {tid}")
                                  except:
                                      pass
                              update_task(tid, {"status": "success", "completed_at": datetime.now(timezone.utc).isoformat(),
                                  "result_summary": f"GHA run {WF_RUN_ID} succeeded — output verified"})
                              msg = f"✅ TASK COMPLETE (verified): {tid}\n{t.get('description','')[:80]}\nRun: {WF_RUN_URL}"
                              tg(msg)
                              print(msg)
                      elif WF_CONCLUSION == "failure":
                          update_task(tid, {"status": "failed", "error_message": f"GHA run {WF_RUN_ID} failed",
                              "gha_run_url": WF_RUN_URL})
                          msg = f"❌ TASK FAILED: {tid}\n{t.get('description','')[:80]}\nRun: {WF_RUN_URL}"
                          tg(msg)
                          print(msg)

          # ============================================================
          # MODE 2: SCHEDULED — patrol for stale tasks + auto-escalate
          # ============================================================
          if EVENT in ("schedule", "workflow_dispatch"):
              open_tasks = get_open_tasks()
              
              # --- STALE DETECTION ---
              for t in open_tasks:
                  tid = t.get("task_id", "")
                  created = t.get("created_at", "")
                  status = t.get("status", "")
                  priority = t.get("priority", "P3")
                  sla = t.get("sla_deadline")
                  escalation = t.get("escalation_count", 0) or 0
                  
                  if not created: continue
                  try:
                      created_dt = datetime.fromisoformat(created.replace("Z", "+00:00"))
                      age_hours = (datetime.now(timezone.utc) - created_dt).total_seconds() / 3600
                  except: continue

                  # P0 stale after 24h, P1 after 48h, P2 after 72h
                  stale_threshold = {"P0": 24, "P1": 48, "P2": 72, "P3": 168}.get(priority, 168)
                  
                  if age_hours > stale_threshold and status == "queued":
                      new_esc = escalation + 1
                      update_task(tid, {"escalation_count": new_esc, "last_escalated_at": datetime.now(timezone.utc).isoformat()})
                      
                      if new_esc <= 3:
                          msg = f"⚠️ STALE TASK #{new_esc}: {tid} [{priority}]\n{t.get('description','')[:80]}\nAge: {age_hours:.0f}h | Owner: {t.get('owner','?')}"
                          tg(msg)
                          print(msg)
                      elif new_esc == 4:
                          # Auto-escalate priority
                          new_pri = {"P2": "P1", "P1": "P0"}.get(priority, priority)
                          if new_pri != priority:
                              update_task(tid, {"priority": new_pri})
                              msg = f"🔺 AUTO-ESCALATED: {tid} {priority}→{new_pri}\n{t.get('description','')[:80]}"
                              tg(msg)
                              print(msg)

                  # --- SLA WARNING ---
                  if sla:
                      try:
                          deadline = datetime.fromisoformat(sla.replace("Z", "+00:00"))
                          days_left = (deadline - datetime.now(timezone.utc)).days
                          # Warn at 14d, 7d, 3d, 1d, 0d
                          if days_left in (14, 7, 3, 1, 0) and status != "success":
                              emoji = "🔴" if days_left <= 1 else "🟡" if days_left <= 7 else "🟠"
                              msg = f"{emoji} SLA WARNING: {tid} — {days_left} days left!\n{t.get('description','')[:80]}"
                              tg(msg)
                              print(msg)
                      except: pass

              # --- AUTO-CREATE: Detect new GHA failures not in nexus ---
              try:
                  repos = ["cli-anything-biddeed", "zonewise-web", "everest-nexus", "zonewise-gtm"]
                  existing_ids = {t.get("task_id","") for t in open_tasks}
                  
                  for repo in repos:
                      r = requests.get(
                          f"https://api.github.com/repos/breverdbidder/{repo}/actions/runs?status=failure&created=%3E{TODAY}T00:00:00Z&per_page=10",
                          headers=gh_h, timeout=10)
                      if r.status_code != 200: continue
                      
                      for run in r.json().get("workflow_runs", []):
                          run_id = str(run["id"])
                          wf_name = run.get("name", "unknown")[:60]
                          auto_tid = f"GHA-{run_id[-6:]}"
                          
                          # Skip if already tracked
                          if auto_tid in existing_ids: continue
                          # Skip meta/infrastructure workflows (noise — mirror ci-failure-agent IGNORE LIST)
                          skip_patterns = [
                              "Task Lifecycle", "Checkpoint", "Action Plan",
                              "Issue Triage Agent", "CI Failure Agent", "Ci Failure Agent",
                              "Everest Sentinel", "Daily Auto-Fixer", "Hetzner Watchdog",
                              "SUMMIT Verifier", "Continuous Executor", "Morning Executor",
                              "Sprint Parallel Executor", "Doc Sync Agent",
                          ]
                          if any(p in wf_name for p in skip_patterns): continue
                          
                          created = create_task({
                              "task_id": auto_tid,
                              "description": f"GHA failure: {wf_name} in {repo}",
                              "priority": "P2",
                              "status": "queued",
                              "project": "ECOSYSTEM",
                              "owner": "claude_code",
                              "task_type": "engineering",
                              "gha_run_url": run.get("html_url", ""),
                              "triggered_by": "sentinel"
                          })
                          if created:
                              existing_ids.add(auto_tid)
                              print(f"🆕 Auto-created: {auto_tid} — {wf_name}")
              except Exception as e:
                  print(f"⚠️ Auto-create scan error: {e}")

              print(f"\n📊 Patrol complete: {len(open_tasks)} open tasks checked")

          PYSCRIPT
