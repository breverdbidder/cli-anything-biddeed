name: Gold Standard SHARD-12 Lee County run6046

on:
  workflow_dispatch:

concurrency:
  group: gold-standard-shard12-lee-run6046
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Run shard-12 Lee main executor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/gold_standard_shard12_lee_run6046_main.py 2>&1 | tee /tmp/lee_run6046.log
          cat /tmp/lee_run6046.log >> "$GITHUB_STEP_SUMMARY"
