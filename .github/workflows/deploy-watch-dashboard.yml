name: Deploy Watch Dashboard
# DEPRECATED — Vercel exit 2026-09-05 (issue #20027, part of #19812 Vercel decommission).
# Push trigger removed to stop metered Vercel build minutes on every push touching this path;
# target Vercel project ("dashboard") is already paused. workflow_dispatch kept manual-only.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: harnesses/watch/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: harnesses/watch/dashboard

      - name: Build
        run: npm run build
        working-directory: harnesses/watch/dashboard
        env:
          VITE_SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel deploy --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ariel-shapira-s-projects \
            -e VITE_SUPABASE_URL=https://mocerqjnksmhcjzxrewo.supabase.co \
            -e "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
        working-directory: harnesses/watch/dashboard
