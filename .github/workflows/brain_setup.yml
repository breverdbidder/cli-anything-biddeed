name: Brain Setup and Transcript

on:
  workflow_dispatch:
    inputs:
      command:
        description: Type setup-brain or a YouTube URL
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          CMD="${{ github.event.inputs.command }}"
          echo "Command: $CMD"

          if [ "$CMD" = "setup-brain" ]; then
            echo "=== SETTING UP BRAIN VAULT ON HETZNER ==="
            sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} << 'SSHEOF'
              if [ -d /opt/biddeed-brain/.git ]; then
                cd /opt/biddeed-brain && git pull origin main
                echo "PULLED existing vault"
              else
                git clone https://'${GH_PAT}'@github.com/breverdbidder/biddeed-brain.git /opt/biddeed-brain
                echo "CLONED fresh vault"
              fi
              cd /opt/biddeed-brain
              git config user.name "BidDeed Bot"
              git config user.email "bot@biddeed.ai"
              echo '#!/bin/bash' > /opt/biddeed-brain/sync.sh
              echo 'cd /opt/biddeed-brain && git add -A && git diff --cached --quiet || git commit -m "auto-sync: $(date +%Y-%m-%d_%H:%M)" && git push origin main 2>/dev/null' >> /opt/biddeed-brain/sync.sh
              chmod +x /opt/biddeed-brain/sync.sh
              (crontab -l 2>/dev/null | grep -v biddeed-brain; echo "*/5 * * * * /opt/biddeed-brain/sync.sh >/dev/null 2>&1") | crontab -
              echo "=== VAULT FILES ==="
              ls -la /opt/biddeed-brain/
              echo "=== CRON ==="
              crontab -l | grep biddeed
              echo "=== DONE ==="
          SSHEOF
          else
            echo "Transcript: $CMD"
            echo "Use Claude chat with Supadata for transcripts."
          fi
