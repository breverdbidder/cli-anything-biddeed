name: "Gold Standard SHARD-4 run6253 Daily (pasco + suwannee)"
# dispatch_id: 2c5b3c77-d296-4c59-b08d-ede8091f9752
# Session: architect-20260724T160000
#
# pasco: 9/10 — only I failing (94.7%, 250/264, need 251+ for 95%)
# suwannee: 4/10 — B/C/D/F/I/J failing (14 total, 13 card_complete)
#
# SHIP-TO-MAIN: direct push, no PRs, DB changes via REST API calls in scripts
# WIRING MANDATE: every script is scheduled via this cron

on:
  schedule:
    # Daily 08:10 UTC (10 min after session window, offset from other shards)
    - cron: '10 8 * * *'
    # Afternoon window 16:10 UTC
    - cron: '10 16 * * *'
  workflow_dispatch: {}

concurrency:
  group: gold-standard-shard4-pasco-suwannee-run6253
  cancel-in-progress: false

jobs:
  # ── Job 1: pasco I batch 5 ─────────────────────────────────────────────────
  pasco-i-batch5:
    name: "pasco I: batch 5 card-completeness backfill"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pasco I batch 5 fix
        run: python3 scripts/gold_standard_shard4_pasco_i_batch5.py

  # ── Job 2: suwannee multi-letter fix ──────────────────────────────────────
  suwannee-multi-letter:
    name: "suwannee: diagnose + fix 14th auction (C/D/I)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run suwannee multi-letter fix
        run: python3 scripts/gold_standard_shard4_suwannee_multi_letter.py

  # ── Job 3: suwannee J generator ──────────────────────────────────────────
  suwannee-j-generator:
    name: "suwannee J: real bid_decisions generator"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [suwannee-multi-letter]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run suwannee J generator
        run: python3 scripts/gold_standard_shard4_suwannee_j_generator.py

  # ── Job 4: H freshness (stamp both counties) ───────────────────────────────
  h-freshness:
    name: "H: stamp pasco + suwannee last_seen_at"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Stamp last_seen_at for pasco + suwannee
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '').rstrip('/')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No credentials — skipping H freshness")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal',
          }
          now_iso = datetime.now(timezone.utc).isoformat()
          for county in ['pasco', 'suwannee']:
              url = f"{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.{county}"
              payload = json.dumps({'last_seen_at': now_iso}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      r.read()
                      print(f"  {county}: stamped last_seen_at={now_iso}")
              except Exception as e:
                  print(f"  {county}: H freshness warning: {e}")
          PYEOF

  # ── Job 5: Verification ────────────────────────────────────────────────────
  verify:
    name: "Verify: pencil_dod_evaluate_county for pasco + suwannee"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pasco-i-batch5, suwannee-multi-letter, suwannee-j-generator, h-freshness]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: "Run pencil_dod_evaluate_county for pasco and suwannee"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '').rstrip('/')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No credentials — cannot verify")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }

          def evaluate(county):
              url = f'{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county'
              payload = json.dumps({'p_county': county}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f'  {county} eval error: {e}')
                  return None

          print("### SQL VERIFICATION — SHARD-4 run6253 pasco+suwannee")
          print(f"dispatch_id: 2c5b3c77-d296-4c59-b08d-ede8091f9752")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print("")

          for county in ['pasco', 'suwannee']:
              ev = evaluate(county)
              if ev is None:
                  print(f"{county}: EVALUATION FAILED")
                  continue
              passes = sum(1 for k in 'ABCDEFGHIJ'
                           if isinstance(ev.get(k), dict) and ev[k].get('pass'))
              print(f"{county}: {passes}/10")
              print(f"  JSON: {json.dumps(ev)}")
              for letter in 'ABCDEFGHIJ':
                  d = ev.get(letter, {})
                  if isinstance(d, dict):
                      status = 'PASS' if d.get('pass') else 'FAIL'
                      print(f"  {letter}: {status} metric={d.get('metric')} {str(d.get('detail',''))[:80]}")
          PYEOF
