name: AgentShield — Weekly Security Scan

on:
  schedule:
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC (8AM EST)
  workflow_dispatch:
    inputs:
      min_severity:
        description: 'Minimum severity (critical, high, medium, low, info)'
        required: false
        default: 'medium'

jobs:
  setup-table:
    name: Ensure repo_security_grades table exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pg
      - name: Create table if not exists
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node migrations/run_migration.js migrations/20260401_repo_security_grades.sql

  scan:
    name: Scan ${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: setup-table
    strategy:
      fail-fast: false
      matrix:
        repo:
          - cli-anything-biddeed
          - brevard-bidder-scraper
          - zonewise-web
          - zonewise-desktop
          - everest-vault
          - hermes-agent
          - swimsquad-ai

    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/${{ matrix.repo }}
          token: ${{ secrets.GH_PAT }}
          path: repo
          sparse-checkout: .claude
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AgentShield
        run: npm install -g ecc-agentshield

      - name: Run AgentShield scan
        id: scan
        run: |
          MIN_SEV="${{ github.event.inputs.min_severity || 'medium' }}"

          # Run scan — exit code may be non-zero if findings exist
          set +e
          npx ecc-agentshield scan \
            --path repo/.claude \
            --format json \
            --min-severity "$MIN_SEV" \
            > /tmp/scan-result.json 2>/tmp/scan-stderr.txt
          set -e

          # Validate JSON; handle repos without .claude dir
          if ! python3 -c "import json,sys; json.load(open('/tmp/scan-result.json'))" 2>/dev/null; then
            echo "No valid JSON — .claude/ may not exist in ${{ matrix.repo }}"
            echo '{"score":{"grade":"N/A","numericScore":0},"summary":{"totalFindings":0,"critical":0,"high":0,"medium":0},"findings":[]}' > /tmp/scan-result.json
          fi

          python3 - <<'PYEOF'
          import json, os

          with open('/tmp/scan-result.json') as f:
              data = json.load(f)

          score = data.get('score', {})
          summary = data.get('summary', {})

          grade = score.get('grade', 'NA')
          numeric = score.get('numericScore', 0)
          critical = summary.get('critical', 0)
          high_count = summary.get('high', 0)
          medium = summary.get('medium', 0)
          total = summary.get('totalFindings', 0)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
              gh_out.write(f"grade={grade}\n")
              gh_out.write(f"score={numeric}\n")
              gh_out.write(f"critical={critical}\n")
              gh_out.write(f"high={high_count}\n")
              gh_out.write(f"medium={medium}\n")
              gh_out.write(f"total={total}\n")
              gh_out.write(f"alert={'true' if grade in ['C','D','F'] else 'false'}\n")

          print(f"Grade: {grade} ({numeric}/100)")
          print(f"Findings: {total} total — {critical} critical, {high_count} high, {medium} medium")
          PYEOF

      - name: Insert scan results into Supabase
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, os

          with open('/tmp/scan-result.json') as f:
              data = json.load(f)

          payload = {
              'repo_name': '${{ matrix.repo }}',
              'grade': '${{ steps.scan.outputs.grade }}',
              'score': int('${{ steps.scan.outputs.score }}' or 0),
              'critical_count': int('${{ steps.scan.outputs.critical }}' or 0),
              'high_count': int('${{ steps.scan.outputs.high }}' or 0),
              'medium_count': int('${{ steps.scan.outputs.medium }}' or 0),
              'findings_json': data.get('findings', [])
          }

          result = subprocess.run([
              'curl', '-s', '-X', 'POST',
              f"{os.environ['SUPABASE_URL']}/rest/v1/repo_security_grades",
              '-H', f"apikey: {os.environ['SUPABASE_KEY']}",
              '-H', f"Authorization: Bearer {os.environ['SUPABASE_KEY']}",
              '-H', 'Content-Type: application/json',
              '-H', 'Prefer: return=representation',
              '-d', json.dumps(payload)
          ], capture_output=True, text=True)

          print(result.stdout[:500])
          if result.returncode != 0:
              print("curl error:", result.stderr)
          PYEOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Telegram alert — grade C or below
        if: steps.scan.outputs.alert == 'true'
        run: |
          MESSAGE="🚨 *AgentShield Security Alert*%0A%0ARepo: \`${{ matrix.repo }}\`%0AGrade: *${{ steps.scan.outputs.grade }}* (${{ steps.scan.outputs.score }}/100)%0AFindings: ${{ steps.scan.outputs.total }} total — ${{ steps.scan.outputs.critical }} critical, ${{ steps.scan.outputs.high }} high, ${{ steps.scan.outputs.medium }} medium%0A%0AAction required → https://github.com/breverdbidder/${{ matrix.repo }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown" || true

      - name: Print scan summary
        run: |
          echo "============================================"
          echo "Repo:     ${{ matrix.repo }}"
          echo "Grade:    ${{ steps.scan.outputs.grade }} (${{ steps.scan.outputs.score }}/100)"
          echo "Findings: ${{ steps.scan.outputs.total }} total"
          echo "Critical: ${{ steps.scan.outputs.critical }}"
          echo "High:     ${{ steps.scan.outputs.high }}"
          echo "Medium:   ${{ steps.scan.outputs.medium }}"
          echo "============================================"

  digest:
    name: Weekly security digest
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - name: Query latest grades from Supabase
        run: |
          RESULT=$(curl -s "$SUPABASE_URL/rest/v1/repo_security_grades?select=repo_name,grade,score,critical_count,high_count,medium_count,scan_date&order=scan_date.desc&limit=50" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "=== AgentShield Weekly Security Digest ==="
          echo "$RESULT" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          seen = {}
          for r in rows:
              repo = r['repo_name']
              if repo not in seen:
                  seen[repo] = r
                  grade = r.get('grade','?')
                  score = r.get('score','?')
                  crit = r.get('critical_count', 0)
                  high = r.get('high_count', 0)
                  med = r.get('medium_count', 0)
                  flag = '🔴' if grade in ['C','D','F'] else '🟡' if grade == 'B' else '🟢'
                  print(f'{flag} {repo}: {grade} ({score}/100) — {crit}C/{high}H/{med}M')
          " || echo "Could not parse Supabase response"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
