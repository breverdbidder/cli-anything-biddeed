name: Security Scan Agent

on:
  pull_request:
    branches: [main, production]

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default --config p/secrets --config p/javascript --config p/typescript --config p/python \
            --json --output semgrep-results.json . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit
        if: hashFiles('package-lock.json') != ''
        run: npm audit --json > npm-audit.json || true
      - name: pip-audit
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt --format json > pip-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: |
            npm-audit.json
            pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  gate:
    needs: [semgrep, gitleaks, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: .
        continue-on-error: true

      - name: Evaluate findings
        id: eval
        run: |
          CRIT=0
          HIGH=0
          TOTAL=0
          if [ -f semgrep-results.json ]; then
            TOTAL=$(jq '.results | length' semgrep-results.json 2>/dev/null || echo 0)
            CRIT=$(jq '[.results[]? | select(.extra.severity=="ERROR")] | length' semgrep-results.json 2>/dev/null || echo 0)
            HIGH=$(jq '[.results[]? | select(.extra.severity=="WARNING")] | length' semgrep-results.json 2>/dev/null || echo 0)
          fi
          BLOCKED=false
          if [ "$CRIT" -gt 0 ]; then BLOCKED=true; fi
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const blocked = '${{ steps.eval.outputs.blocked }}' === 'true';
            const body = [
              '### 🔒 Security Scan Agent',
              '',
              `- Semgrep findings: ${{ steps.eval.outputs.total }} (critical: ${{ steps.eval.outputs.critical }}, high: ${{ steps.eval.outputs.high }})`,
              blocked ? '**BLOCKED — critical findings must be resolved before merge.**' : 'No critical findings — merge not blocked by this scan.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Log to Supabase security_scan_results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY not set on this repo — skipping Supabase log (non-blocking)."
            exit 0
          fi
          curl -s -X POST "$SUPABASE_URL/rest/v1/security_scan_results" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"pr_number\":${{ github.event.pull_request.number || 0 }},\"sha\":\"${{ github.sha }}\",\"semgrep_critical\":${{ steps.eval.outputs.critical }},\"semgrep_high\":${{ steps.eval.outputs.high }},\"semgrep_total\":${{ steps.eval.outputs.total }},\"blocked\":${{ steps.eval.outputs.blocked }}}"

      - name: Block merge if critical findings
        if: steps.eval.outputs.blocked == 'true'
        run: |
          echo "::error::Security Scan Agent found ${{ steps.eval.outputs.critical }} critical finding(s). Blocking."
          exit 1
