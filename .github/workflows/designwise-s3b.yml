name: "Summit: DesignWise S3B — ZoneWise-Web Core Pages + Reventure Heatmap"
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [designwise-s3b]
concurrency:
  group: designwise-s3b
  cancel-in-progress: true

jobs:
  s3b:
    name: "S3B: Explorer Heatmap + Pricing + Conversion Gate + Mobile"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Build Core Pages on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,GEMINI_API_KEY,SUPABASE_URL,SUPABASE_KEY,MAPBOX_TOKEN,SUPABASE_ANON_KEY
          script: |
            set -e
            echo "=== DesignWise S3B — zonewise-web — $(date) ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3

            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)

            mkdir -p /opt/biddeed
            git config --global --add safe.directory /opt/biddeed/zonewise-web
            git config --global --add safe.directory /opt/biddeed/reventure-clone-v2
            git config --global --add safe.directory /opt/biddeed/biddeed-housing-map
            cd /opt/biddeed
            rm -rf zonewise-web
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            cd zonewise-web
            npm ci 2>&1 | tail -5
            chown -R claude:claude /opt/biddeed/zonewise-web

            # Also clone reventure-clone-v2 and biddeed-housing-map for data reuse
            cd /opt/biddeed
            if [ ! -d reventure-clone-v2 ]; then
              git clone https://${GH_PAT}@github.com/breverdbidder/reventure-clone-v2.git 2>/dev/null || true
            fi
            if [ ! -d biddeed-housing-map ]; then
              git clone https://${GH_PAT}@github.com/breverdbidder/biddeed-housing-map.git 2>/dev/null || true
            fi
            chown -R claude:claude /opt/biddeed

            su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN' \
              && export NPM_CONFIG_PREFIX=/home/claude/.npm-global \
              && export PATH=/home/claude/.npm-global/bin:\$PATH \
              && export GH_PAT='$GH_PAT' \
              && export GEMINI_API_KEY='$GEMINI_API_KEY' \
              && export SUPABASE_URL='$SUPABASE_URL' \
              && export SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_KEY' \
              && export NEXT_PUBLIC_SUPABASE_URL='$SUPABASE_URL' \
              && export NEXT_PUBLIC_SUPABASE_ANON_KEY='$SUPABASE_ANON_KEY' \
              && export NEXT_PUBLIC_MAPBOX_TOKEN='$MAPBOX_TOKEN' \
              && export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN' \
              && export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID' \
              && cd /opt/biddeed/zonewise-web \
              && git config user.email ci@biddeed.ai \
              && git config user.name BidDeed-CI \
              && claude -p 'MISSION: DesignWise S3B — Build ZoneWise.AI Core Pages with Reventure-style Heatmap Lead Magnet.

            YOU ARE WORKING IN: /opt/biddeed/zonewise-web (Next.js app deployed on Vercel at zonewise.ai)
            REFERENCE DATA: /opt/biddeed/reventure-clone-v2 (Zillow CSV URLs + scripts) and /opt/biddeed/biddeed-housing-map (choropleth patterns + florida_market_data.json)

            READ: docs/plans/EXPLORER_V2_SPEC.md — this is the full architectural spec.
            READ: CLAUDE.md — project rules and brand requirements.

            EXISTING CODE (DO NOT REBUILD — extend these):
            - components/explorer/ExplorerV2.tsx (379 LOC) — split-screen layout + UpgradeModal + free click gate
            - components/explorer/ExplorerMap.tsx (442 LOC) — Mapbox GL with choropleth source/layer hooks + zoom-adaptive
            - components/explorer/ExplorerChat.tsx (249 LOC) — NLP chat panel with map sync
            - components/explorer/ExplorerMobileSheet.tsx (96 LOC) — basic bottom sheet
            - lib/explorer/constants.ts (127 LOC) — color stops, zoning labels, endpoints, free limits
            - lib/explorer/zillow.ts (69 LOC) — types + Brevard fallback metrics
            - app/api/explorer/zillow/route.ts (191 LOC) — server-side Zillow CSV fetch
            - app/api/explorer/chat/route.ts (97 LOC) — Claude API chat endpoint
            - app/(marketing)/pricing/page.tsx — current pricing (NEEDS FIX: wrong tiers)

            EXECUTE THESE 6 PHASES IN ORDER:

            PHASE 1 — DATA LAYER (Zillow + GeoJSON):
            - Create lib/explorer/choropleth.ts — fetch ZIP boundary GeoJSON from Census TIGER/Line or use a static FL ZIP boundaries GeoJSON
            - Update app/api/explorer/zillow/route.ts to fetch LIVE Zillow ZHVI CSV from: https://files.zillowstatic.com/research/public_csvs/zhvi/Zip_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv
            - Also fetch ZORI (rent): https://files.zillowstatic.com/research/public_csvs/zori/Zip_zori_uc_sfrcondomfr_sm_month.csv
            - Filter to Florida ZIPs (32xxx prefix), compute YoY change, merge into GeoJSON FeatureCollection
            - Cache with revalidate: 86400 (daily) — Zillow updates monthly
            - Reference: /opt/biddeed/reventure-clone-v2/scripts/download_zillow_curl.sh for URLs
            - Reference: /opt/biddeed/biddeed-housing-map/scripts/fetch_zillow_data.js for parse patterns
            - Commit: git add -A && git commit -m \"feat(explorer): P1 Zillow live data + ZIP GeoJSON choropleth layer\" && git push origin main

            PHASE 2 — MAP LAYERS (Choropleth + Parcels + Controls):
            - Create components/explorer/ChoroplethLayer.tsx — Mapbox fill layer colored by ZHVI/ZORI/YoY
            - Color scale: Red (declining >3% YoY) to Yellow (flat) to Green (rising >3% YoY)
            - Zoom-adaptive: choropleth visible zoom 9-12, parcels at zoom 15+, crossfade 13-14
            - Create components/explorer/ParcelIdentify.tsx — click popup with address, zoning, value, owner
            - Create components/explorer/LayerControls.tsx — toggle buttons: Parcels, Zoning, Heatmap, Flood, Satellite
            - Create components/explorer/ZoningLegend.tsx — color legend for RU/BU/PUD/AU/IU categories
            - Wire all into ExplorerMap.tsx as child components
            - Mapbox token already in env: process.env.NEXT_PUBLIC_MAPBOX_TOKEN
            - Commit: git add -A && git commit -m \"feat(explorer): P2 choropleth + parcel identify + layer controls + legend\" && git push origin main

            PHASE 3 — CONVERSION FUNNEL (Reventure Lead Magnet Pattern):
            - The choropleth heatmap is ALWAYS visible with NO login — this is the free lead magnet (like Reventure 200K visits/mo)
            - ExplorerV2 UpgradeModal already triggers after FREE_PARCEL_CLICKS (5) — verify it works
            - Create components/explorer/SearchChips.tsx — quick-action chips: Address, Zoning, Heatmap, Auction
            - Create lib/explorer/chat-actions.ts — flyTo(lat,lng), highlightParcel(id), filterZoning(prefix) from chat
            - Wire ExplorerChat bidirectionally with ExplorerMap via chat-actions
            - Add FREE_CHAT_MESSAGES limit (3 free, then gate) if not already implemented
            - Track events in Supabase conversion_funnel table: parcel_click, chat_message, upgrade_modal_shown, cta_clicked
            - Commit: git add -A && git commit -m \"feat(explorer): P3 conversion funnel + search chips + chat-map sync\" && git push origin main

            PHASE 4 — PRICING PAGE FIX:
            - Update app/(marketing)/pricing/page.tsx with CORRECT tiers:
              Free: 5 parcels/day, 3 chat msgs, choropleth heatmap always visible
              Starter $39/mo: 50 parcels/day, 20 chat msgs, zoning filters, CSV export
              Pro $99/mo: unlimited everything, API access, bulk analysis, MCP chatbot
            - Apply house brand: bg-[#020617] slate-950, Navy #1E3A5F cards, Orange #F59E0B CTA buttons, Inter font
            - Add monthly/annual toggle (annual = 2 months free)
            - CTA buttons link to Supabase Auth signup
            - Commit: git add -A && git commit -m \"feat(pricing): P4 fix tiers Free/Starter 39/Pro 99 + brand colors\" && git push origin main

            PHASE 5 — MOBILE BOTTOM SHEET:
            - Upgrade ExplorerMobileSheet.tsx with:
              Draggable snap points: collapsed 80px, half 50vh, full 90vh
              Parcel detail card when property selected
              Search bar at top with chip shortcuts
              Touch targets min 44x44px
            - Map full-screen on mobile (<768px)
            - Chat accessible via expanded bottom sheet
            - Commit: git add -A && git commit -m \"feat(explorer): P5 mobile bottom sheet upgrade + snap points\" && git push origin main

            PHASE 6 — BUILD + BRANDGUARD + DEPLOY:
            - Run: npm run build — MUST pass zero errors
            - Verify house brand: Navy #1E3A5F, Orange #F59E0B, Inter font, bg #020617
            - No other color schemes (no purple, no generic blue, no Tailwind defaults as primary)
            - git push to main triggers Vercel auto-deploy to zonewise.ai
            - After push, wait 60s then verify:
              curl -s -o /dev/null -w \"%{http_code}\" https://zonewise.ai/explorer (expect 200)
              curl -s -o /dev/null -w \"%{http_code}\" https://zonewise.ai/pricing (expect 200)
            - Send Telegram: curl -s -X POST \"https://api.telegram.org/bot${BIDDEED_BOT_TOKEN}/sendMessage\" -d chat_id=\"${BIDDEED_BOT_CHAT_ID}\" -d parse_mode=\"Markdown\" --data-urlencode \"text=S3B DESIGNWISE COMPLETE - Explorer heatmap LIVE at zonewise.ai/explorer - Pricing LIVE at zonewise.ai/pricing - 7 new components + 4 fixes - npm build: PASS\"

            RULES:
            - NEVER-LIE: verify each phase builds (npm run build) before moving to next
            - If Zillow CSV fetch fails: use fallback data from lib/explorer/zillow.ts BREVARD_FALLBACK_METRICS
            - If npm run build fails: fix the error, do not skip
            - House brand is NON-NEGOTIABLE: Navy #1E3A5F, Orange #F59E0B, Inter, bg #020617
            - Commit after EACH phase, not all at once
            - Push to main after each commit (Vercel auto-deploys)
            - If a phase fails after 3 attempts: commit what works, report failure in Telegram, move to next phase' --dangerously-skip-permissions"
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      - name: "Notify"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=*DesignWise S3B* — ${STATUS}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Scope: Explorer heatmap + pricing fix + conversion gate + mobile
          Target: zonewise.ai/explorer + zonewise.ai/pricing" || true
