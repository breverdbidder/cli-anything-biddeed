name: Fix SHARD-13 E-Letter (Parcel Linkage via Property Appraisers)

on:
  workflow_dispatch:
    inputs:
      max_cases_per_county:
        description: 'Maximum cases to process per county'
        required: false
        default: '50'
      target_counties:
        description: 'Counties to process (comma-separated, or "all")'
        required: false
        default: 'all'
  schedule:
    # Run twice weekly to maintain parcel linkage
    - cron: '0 10 * * 1,5'  # Monday and Friday 10 AM UTC

permissions:
  contents: read

jobs:
  fix-e-letter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --quiet httpx requests beautifulsoup4
      
      - name: Check current E-letter status
        id: check_status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "Checking current E-letter status for SHARD-13 counties..."
          
          counties=("palm_beach" "clay" "okaloosa" "gulf")
          failing_counties=()
          total_gaps=0
          
          for county in "${counties[@]}"; do
            echo "Checking $county..."
            
            resp=$(curl -sf \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
              -d "{\"county_slug_arg\": \"$county\"}")
            
            e_pass=$(echo "$resp" | jq -r '.[] | select(.letter == "E") | .pass')
            e_metric=$(echo "$resp" | jq -r '.[] | select(.letter == "E") | .metric')
            e_details=$(echo "$resp" | jq -r '.[] | select(.letter == "E") | .details')
            
            echo "  $county: E-pass=$e_pass, metric=$e_metric%"
            echo "  details: $e_details"
            
            if [ "$e_pass" = "false" ]; then
              failing_counties+=("$county")
              # Extract gap from details (parcel_linked=X of Y)
              gap=$(echo "$e_details" | grep -oP 'parcel_linked=\K\d+(?= of)' || echo 0)
              total=$(echo "$e_details" | grep -oP 'of \K\d+' || echo 1)
              missing=$((total - gap))
              total_gaps=$((total_gaps + missing))
            fi
          done
          
          echo "failing_counties=${failing_counties[*]}" >> "$GITHUB_OUTPUT"
          echo "total_gaps=$total_gaps" >> "$GITHUB_OUTPUT"
          echo "max_cases=${{ github.event.inputs.max_cases_per_county || '50' }}" >> "$GITHUB_OUTPUT"
          
          if [ ${#failing_counties[@]} -gt 0 ]; then
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${#failing_counties[@]} counties failing E-letter, ~$total_gaps parcel gaps total"
          else
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            echo "::notice::All SHARD-13 counties passing E-letter"
          fi
      
      - name: Execute parcel linkage fix
        if: steps.check_status.outputs.needs_fix == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_CASES: ${{ steps.check_status.outputs.max_cases }}
        run: |
          set -euo pipefail
          
          echo "::group::Running SHARD-13 parcel linkage fix"
          echo "Processing up to $MAX_CASES cases per county..."
          echo "Failing counties: ${{ steps.check_status.outputs.failing_counties }}"
          
          python scripts/shard13_parcel_linkage_fix.py
          echo "::endgroup::"
      
      - name: Verify E-letter improvements
        if: steps.check_status.outputs.needs_fix == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "::group::Verifying E-letter improvements"
          
          # Wait for database consistency
          echo "Waiting for database consistency..."
          sleep 15
          
          counties=("palm_beach" "clay" "okaloosa" "gulf")
          improved_counties=()
          
          for county in "${counties[@]}"; do
            resp=$(curl -sf \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
              -d "{\"county_slug_arg\": \"$county\"}")
            
            e_pass_after=$(echo "$resp" | jq -r '.[] | select(.letter == "E") | .pass')
            e_metric_after=$(echo "$resp" | jq -r '.[] | select(.letter == "E") | .metric')
            
            echo "$county: E-letter pass=$e_pass_after, metric=$e_metric_after%"
            
            if [ "$e_pass_after" = "true" ]; then
              improved_counties+=("$county")
            fi
          done
          
          echo "::notice::E-letter improvements: ${improved_counties[*]:-none}"
          
          # Check for any significant improvement (parcel IDs added)
          parcel_count_resp=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/multi_county_auctions?select=count&county=in.(palm_beach,clay,okaloosa,gulf)&parcel_id=not.is.null&parcel_match_method=eq.address_search")
          
          linked_count=$(echo "$parcel_count_resp" | jq '.[0].count // 0')
          echo "Total parcel IDs linked via address search: $linked_count"
          
          if [ ${#improved_counties[@]} -gt 0 ] || [ "$linked_count" -gt 0 ]; then
            echo "::notice::✅ SHARD-13 E-letter fix successful"
          else
            echo "::warning::⚠️ E-letter may need additional property appraiser integration work"
          fi
          
          echo "::endgroup::"
      
      - name: Create summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## SHARD-13 E-Letter Parcel Linkage Summary
          
          **Issue:** E-letter failures across all SHARD-13 counties (parcel linkage <95%)
          - palm_beach: E=83.4% (parcel_linked=23832 of 28562) 
          - clay: E=86.0% (parcel_linked=2387 of 2774)
          - okaloosa: E=74.9% (parcel_linked=1511 of 2018)
          - gulf: E=88.9% (parcel_linked=8 of 9)
          
          **Goal:** Link auction cases to parcel_ids via county property appraiser APIs  
          **Canon:** ≥95% parcel linkage required for E-letter pass
          
          **Fix Applied:** ${{ steps.check_status.outputs.needs_fix == 'true' && '✅ Yes' || '➖ Skipped (already passing)' }}
          
          **Pre-fix Status:**
          - Counties failing E-letter: ${{ steps.check_status.outputs.failing_counties || 'none' }}
          - Estimated parcel gaps: ~${{ steps.check_status.outputs.total_gaps }}
          
          **Strategy Applied:**
          - Property appraiser endpoint discovery per county
          - Address-based parcel ID matching via appraiser search APIs  
          - multi_county_auctions.parcel_id updates with confidence scoring
          - pencil_dod_evaluate_county verification
          
          **Next Steps:**
          - Pipeline runs twice weekly (Mon/Fri) to maintain linkage
          - Monitor E-letter metrics for sustained ≥95% compliance
          - Expand to additional property appraiser integrations as needed
          EOF