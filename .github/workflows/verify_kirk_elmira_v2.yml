name: Verify Kirk Elmira v2

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/vke && mkdir -p /tmp/vke
          cd /tmp/vke

          cat > scrape.py <<'PY'
          import asyncio, json, re, time
          from pathlib import Path
          OUT = Path('/tmp/vke')

          # Targets:
          # 1) 1107 KIRKLAND LLC as GRANTOR — find the $179K sale
          # 2) EVEREST CAPITAL OF BREVARD as GRANTOR for ELMIRA / PORT MALABAR UNIT 42 — find Elmira sale
          SEARCHES = [
              {"id": "kirkland_llc_grantor", "name": "1107 KIRKLAND LLC", "role": "GRANTOR",
               "from": "1/1/2019", "to": "12/31/2026", "filter": "COCOA MODERN MANORS"},
              {"id": "everest_grantor_recent", "name": "EVEREST CAPITAL OF BREVARD", "role": "GRANTOR",
               "from": "1/1/2023", "to": "12/31/2026", "filter": "(ELMIRA|PORT MALABAR UNIT 42|LT 12 BLK 1926)"},
              {"id": "shapira_mariam_grantor", "name": "SHAPIRA,MARIAM", "role": "GRANTOR",
               "from": "1/1/2023", "to": "12/31/2026", "filter": "."},
              {"id": "shapira_ariel_grantor", "name": "SHAPIRA,ARIEL", "role": "GRANTOR",
               "from": "1/1/2023", "to": "12/31/2026", "filter": "."},
              {"id": "property_360_brokerage", "name": "PROPERTY 360 INTERNATIONAL REALTY", "role": "GRANTEE",
               "from": "1/1/2018", "to": "12/31/2026", "filter": "."},
              {"id": "everest_grantor_all", "name": "EVEREST CAPITAL", "role": "GRANTOR",
               "from": "1/1/2024", "to": "12/31/2026", "filter": "."},
          ]

          async def search_acclaim(page, search):
              try:
                  print(f"\n=== {search['id']}: {search['name']} ({search['role']}) {search['from']}-{search['to']} ===", flush=True)
                  await page.goto(
                      "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                      wait_until="networkidle", timeout=60000,
                  )
                  await asyncio.sleep(2)
                  btn = page.locator("input[value='I accept the conditions above.']")
                  if await btn.count() > 0:
                      await btn.click()
                      await page.wait_for_load_state("networkidle")
                      await asyncio.sleep(2)
                  await page.wait_for_selector("input#SearchOnName", timeout=20000)
                  if search['role'] == "GRANTEE":
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                  await page.fill("input#SearchOnName", search['name'])
                  await page.fill("input#RecordDateFrom", search['from'])
                  await page.fill("input#RecordDateTo", search['to'])
                  await page.click("input#btnSearch")
                  await asyncio.sleep(4)
                  try:
                      await page.wait_for_selector("text=Select Names:", timeout=8000)
                      done = page.locator("input[type='submit'][value='Done']")
                      cnt = await done.count()
                      for i in range(cnt):
                          if await done.nth(i).is_visible():
                              await done.nth(i).click()
                              break
                  except: pass
                  await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=30000)
                  await asyncio.sleep(2)
                  async with page.expect_download(timeout=60000) as dl_info:
                      await page.click("a.csvButton#btnCsvButton")
                  download = await dl_info.value
                  csv_path = OUT / f"{search['id']}.csv"
                  await download.save_as(str(csv_path))
                  print(f"  saved: {csv_path.stat().st_size}b", flush=True)
                  return csv_path
              except Exception as e:
                  print(f"  ERR: {e}", flush=True)
                  return None

          def filter_csv(csv_path, filter_re):
              if not csv_path or not csv_path.exists(): return []
              import csv as csv_mod
              hits = []
              with open(csv_path, 'r', encoding='utf-8-sig', errors='replace') as f:
                  reader = csv_mod.DictReader(f)
                  for row in reader:
                      legal = (row.get('DocLegalDescription','') or '').upper()
                      if filter_re == "." or re.search(filter_re, legal):
                          hits.append(row)
              return hits

          async def main():
              from playwright.async_api import async_playwright
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  ctx = await browser.new_context(accept_downloads=True)
                  page = await ctx.new_page()
                  
                  for search in SEARCHES:
                      csv_path = await search_acclaim(page, search)
                      if csv_path:
                          hits = filter_csv(csv_path, search['filter'])
                          print(f"  filter '{search['filter']}': {len(hits)} hits", flush=True)
                          for h in hits[:15]:
                              party = h.get('Party','')
                              date = (h.get('RecordDate') or '')[:10]
                              name = (h.get('Name','') or '')[:30]
                              cross = (h.get('CrossPartyName','') or '')[:35]
                              dtype = h.get('DocTypeDescription','')
                              amt = h.get('Consideration','')
                              inst = h.get('InstrumentNumber','')
                              legal = (h.get('DocLegalDescription','') or '')[:80]
                              print(f"    [{party}] {date} | {name} ↔ {cross}", flush=True)
                              print(f"       {dtype} | ${amt} | Inst {inst}", flush=True)
                              print(f"       legal: {legal}", flush=True)
                      await asyncio.sleep(2)
                  
                  await browser.close()

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/vke/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/vke/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vke
          path: /tmp/results/
