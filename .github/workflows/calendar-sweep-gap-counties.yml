name: "Calendar Sweep — Gap Counties (Wave 2)"
# Sweeps 12 FL counties NOT in the original 30-dark-county list and NOT currently in DOD 42.
# Purpose: push DOD count from 42 → ≥50 distinct counties with upcoming auctions.
# Gap counties: columbia, gadsden, glades, hamilton, hardee, jefferson, lafayette,
#               levy, liberty, taylor, union, wakulla
#
# Uses same calendar_sweep_mca.py (v3.0) — no Firecrawl required.
# DOD query: SELECT COUNT(DISTINCT county) FROM multi_county_auctions
#            WHERE auction_date >= CURRENT_DATE
#            AND source_platform NOT IN ('propertyonion_orphan','po_api')
#            → target: >= 50 (currently 42)

on:
  workflow_dispatch:
    inputs:
      sale_type:
        description: 'foreclosure | tax_deed | both'
        required: false
        default: 'both'
      dry_run:
        description: 'true = skip upsert, log only'
        required: false
        default: 'false'

concurrency:
  group: calendar-sweep-gap-counties
  cancel-in-progress: false

jobs:
  # ── 1. BUILD MATRIX FROM SSOT ────────────────────────────────────────────────
  setup:
    name: "Build gap matrix from realauction_subdomains"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total:  ${{ steps.gen.outputs.total }}
    steps:
      - name: "Query realauction_subdomains for 12 gap counties"
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SALE_TYPE_IN: ${{ github.event.inputs.sale_type || 'both' }}
        run: |
          set -euo pipefail

          # 12 gap counties — in realauction_subdomains but not yet in DOD 42
          SLUGS="columbia,gadsden,glades,hamilton,hardee,jefferson,lafayette,levy,liberty,taylor,union,wakulla"

          STIN="${SALE_TYPE_IN:-both}"
          if [ "$STIN" = "both" ]; then
            ST_FILTER="platform=in.(realforeclose,realtaxdeed)"
          elif [ "$STIN" = "foreclosure" ]; then
            ST_FILTER="platform=eq.realforeclose"
          else
            ST_FILTER="platform=eq.realtaxdeed"
          fi

          URL="${SUPABASE_URL}/rest/v1/realauction_subdomains?is_active=eq.true&${ST_FILTER}&county_slug=in.(${SLUGS})&select=county_slug,sale_type,platform,base_url"
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "$URL")

          TOTAL=$(echo "$RESP" | jq 'length')
          echo "::notice::Found $TOTAL gap county+sale_type combos in realauction_subdomains"

          if [ "$TOTAL" = "0" ]; then
            echo "::warning::No gap counties found in realauction_subdomains — all 12 may not be registered yet"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(echo "$RESP" | jq -c '{include: [.[] | {
            county:    .county_slug,
            sale_type: .sale_type,
            platform:  .platform,
            base_url:  (.base_url // ("https://" + .county_slug + "." + .platform + ".com"))
          }]}')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"

  # ── 2. CALENDAR SWEEP ────────────────────────────────────────────────────────
  sweep:
    name: "Sweep ${{ matrix.county }}/${{ matrix.sale_type }}"
    needs: setup
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests

      - name: "Scrape calendar + preview → upsert to MCA"
        id: sweep
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY_SLUG:               ${{ matrix.county }}
          BASE_URL:                  ${{ matrix.base_url }}
          PLATFORM:                  ${{ matrix.platform }}
          SALE_TYPE:                 ${{ matrix.sale_type }}
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.county }} / ${{ matrix.sale_type }} ==="
          echo "  Base URL: ${{ matrix.base_url }}"

          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "DRY RUN — skipping script"
            exit 0
          fi

          EXIT=0; python .github/scripts/calendar_sweep_mca.py || EXIT=$?
          if [ "$EXIT" = "1" ]; then
            echo "  Retrying after 15s..."
            sleep 15
            EXIT=0; python .github/scripts/calendar_sweep_mca.py || EXIT=$?
          fi
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: "Verify: row count for ${{ matrix.county }}"
        if: steps.sweep.outputs.exit_code == '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          COUNTY="${{ matrix.county }}"
          TODAY=$(date -u +%Y-%m-%d)
          URL="${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.${COUNTY}&auction_date=gte.${TODAY}&select=auction_date,case_number&limit=3"
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "$URL")
          COUNT=$(echo "$RESP" | jq 'length')
          echo "### SQL VERIFICATION: ${COUNTY}" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT county, auction_date, case_number FROM multi_county_auctions WHERE county='${COUNTY}' AND auction_date >= '${TODAY}' LIMIT 3;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- rows returned: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" | jq '.' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::${COUNTY}: $COUNT upcoming rows in MCA"

  # ── 3. DOD VERIFICATION (REST API — no Management API 403) ───────────────────
  verify-dod:
    name: "DOD Verification"
    needs: [setup, sweep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: "Run DOD query via REST API"
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          # Fetch all upcoming county names (not distinct — count unique in Python)
          # Limit 10000 — far above expected row count, handles all 67 counties
          URL="${SUPABASE_URL}/rest/v1/multi_county_auctions?auction_date=gte.${TODAY}&source_platform=not.in.(propertyonion_orphan,po_api)&select=county&limit=10000"
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "$URL")

          COUNT=$(echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          counties = sorted(set(r['county'] for r in d))
          print(len(counties))
          print('\n'.join(counties), file=__import__('sys').stderr)
          " 2>/tmp/county_list)

          echo "### DOD VERIFICATION" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT COUNT(DISTINCT county) FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE auction_date >= '${TODAY}'" >> "$GITHUB_STEP_SUMMARY"
          echo "AND source_platform NOT IN ('propertyonion_orphan','po_api');" >> "$GITHUB_STEP_SUMMARY"
          echo "-- Result: $COUNT distinct counties" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### County list" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/county_list >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -ge 50 ] 2>/dev/null; then
            echo "::notice::DOD PASSED ✅ — $COUNT distinct counties >= 50"
            echo "### ✅ DOD PASSED: $COUNT >= 50 counties" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DOD NOT YET MET: $COUNT distinct counties (target >= 50)"
            echo "### ⚠️ DOD NOT MET: $COUNT / 50 counties" >> "$GITHUB_STEP_SUMMARY"
            NEED=$((50 - COUNT))
            echo "Need $NEED more counties. Remaining blocked (403 from GHA IPs):" >> "$GITHUB_STEP_SUMMARY"
            echo "bradford, calhoun, clay, flagler, gilchrist, hernando, martin, monroe," >> "$GITHUB_STEP_SUMMARY"
            echo "okaloosa, okeechobee, pasco, st_lucie, walton" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Per-county breakdown for the 12 gap counties
          echo "### Gap county row counts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for COUNTY in columbia gadsden glades hamilton hardee jefferson lafayette levy liberty taylor union wakulla; do
            CURL_RESP=$(curl -sf \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Prefer: count=exact" \
              -H "Range: 0-0" \
              "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.${COUNTY}&auction_date=gte.${TODAY}&select=county" 2>/dev/null)
            N=$(echo "$CURL_RESP" | jq 'length' 2>/dev/null || echo "0")
            echo "${COUNTY}: ${N} rows" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
