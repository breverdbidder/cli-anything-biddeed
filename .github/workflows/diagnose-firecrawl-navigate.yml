name: "Diagnose Firecrawl navigate + full chain"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet httpx
      - name: Probe navigate + full action chain
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import httpx, json, os

          FC    = os.environ['FIRECRAWL_API_KEY']
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          H     = {"Authorization": f"Bearer {FC}", "Content-Type": "application/json"}
          HOST  = "https://brevard.realforeclose.com"

          def try_payload(label, payload):
              r = httpx.post("https://api.firecrawl.dev/v1/scrape", headers=H, json=payload, timeout=60.0)
              print(f"\n=== {label} ===")
              if r.status_code == 200:
                  j = r.json()
                  html = (j.get('data') or {}).get('html', '')
                  has_aitem = 'AITEM_' in html
                  has_login = 'LogName' in html or 'Log In' in html
                  print(f"HTTP 200 OK: html_len={len(html)}, has_aitem={has_aitem}, has_login={has_login}")
              else:
                  # Print longer to see full error + action type list
                  print(f"HTTP {r.status_code}: {r.text[:1500]}")

          # 1. navigate with url
          try_payload("navigate with url", {
              "url": "https://example.com",
              "formats": ["html"],
              "actions": [{"type": "navigate", "url": "https://example.com/about"}],
          })

          # 2. goto action
          try_payload("goto action", {
              "url": "https://example.com",
              "formats": ["html"],
              "actions": [{"type": "goto", "url": "https://example.com/about"}],
          })

          # 3. js execute / eval
          try_payload("execute js", {
              "url": "https://example.com",
              "formats": ["html"],
              "actions": [{"type": "execute", "script": "document.title"}],
          })

          # 4. write alone (verify it works)
          try_payload("write alone (should work)", {
              "url": "https://example.com",
              "formats": ["html"],
              "actions": [{"type": "write", "selector": "body", "text": "test"}],
          })

          # 5. Full login chain WITHOUT navigate (redirect via loginurl param)
          # Strategy: set the initial URL to include loginurl pointing to preview page
          # so that after form submit, the site redirects to the preview page.
          # Only works if the site honors the loginurl redirect.
          DATE = "06/17/2026"
          import urllib.parse
          redirect_url = f"/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE={urllib.parse.quote(DATE)}"
          login_url_with_redirect = f"{HOST}/index.cfm?loginurl={urllib.parse.quote(redirect_url)}"
          try_payload(f"login chain with redirect param (no navigate)", {
              "url": login_url_with_redirect,
              "formats": ["html"],
              "actions": [
                  {"type": "wait", "milliseconds": 2000},
                  {"type": "write", "selector": "#LogName", "text": EMAIL},
                  {"type": "write", "selector": "#LogPass", "text": PW},
                  {"type": "click", "selector": "#LogButton"},
                  {"type": "wait", "milliseconds": 5000},
              ],
              "timeout": 90000,
          })

          # 6. Minimal "write + click" chain (no wait, no navigate)
          try_payload("write+click minimal", {
              "url": f"{HOST}/index.cfm",
              "formats": ["html"],
              "actions": [
                  {"type": "write", "selector": "#LogName", "text": EMAIL},
                  {"type": "write", "selector": "#LogPass", "text": PW},
                  {"type": "click", "selector": "#LogButton"},
              ],
              "timeout": 60000,
          })
          PYEOF
