name: "Create CMA Reports Table"
on:
  workflow_dispatch: {}
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create cma_reports table
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client -qq
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "CREATE TABLE IF NOT EXISTS cma_reports (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              parcel_id TEXT NOT NULL,
              hbu_scenarios JSONB NOT NULL,
              best_use TEXT,
              best_score INTEGER,
              max_bid_amount NUMERIC,
              computed_at TIMESTAMPTZ DEFAULT NOW(),
              UNIQUE(parcel_id)
            );"
          echo "Table created"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "SELECT COUNT(*) FROM cma_reports;"
