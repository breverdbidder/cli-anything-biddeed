name: EG14 Gate — SUMMIT 398 (Google 3D Tiles → zonewise.ai)
on:
  workflow_dispatch:
jobs:
  eg14:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        timeout-minutes: 6
        run: |
          set -e
          npm init -y
          npm install --no-audit --no-fund --loglevel=error \
            @playwright/test@latest \
            @axe-core/playwright@latest \
            lighthouse@12 \
            chrome-launcher@1
          echo "npm install DONE"

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          set -e
          npx playwright install chromium firefox webkit --with-deps
          echo "playwright browsers DONE"
          mkdir -p screenshots reports

      - name: Run EG14 14-point gate
        timeout-minutes: 15
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cat > eg14.js << 'JSEOF'
          const { chromium, firefox, webkit, devices } = require('@playwright/test');
          const { AxeBuilder } = require('@axe-core/playwright');
          const fs = require('fs');
          const URL = 'https://zonewise.ai';
          const results = [];
          const log = (id, name, status, evidence='', err='') => {
            results.push({ id, name, status, evidence, err });
            console.log(`EG14_${id}: ${status} | ${name} | ${evidence}${err? ' | '+err.slice(0,200):''}`);
          };

          (async () => {
            // ============ POINT 1: HTTP 200 ============
            try {
              const res = await fetch(URL + '/?cb=' + Date.now());
              log(1, 'HTTP Status', res.status === 200 ? 'PASS' : 'FAIL', `http=${res.status}`);
            } catch (e) { log(1, 'HTTP Status', 'FAIL', '', e.message); }

            // ============ POINT 6: Security Headers ============
            try {
              const res = await fetch(URL);
              const need = ['strict-transport-security','x-content-type-options','referrer-policy','permissions-policy'];
              const got = need.filter(h => res.headers.get(h));
              log(6, 'Security Headers', got.length === need.length ? 'PASS' : 'FAIL',
                  `${got.length}/${need.length}: ${got.join(',')}`);
            } catch (e) { log(6, 'Security Headers', 'FAIL', '', e.message); }

            // ============ POINT 7: Custom 404 ============
            try {
              const res = await fetch(URL + '/this-page-definitely-does-not-exist-' + Date.now());
              const txt = await res.text();
              const branded = res.status === 404 && (txt.toLowerCase().includes('zonewise') || txt.toLowerCase().includes('not found'));
              log(7, 'Custom 404', branded ? 'PASS' : 'FAIL', `status=${res.status} branded=${branded}`);
            } catch (e) { log(7, 'Custom 404', 'FAIL', '', e.message); }

            // ============ POINT 12: API Health ============
            try {
              const apis = ['/api/stats', '/api/parcels/featured'];
              let pass = 0;
              const detail = [];
              for (const a of apis) {
                try {
                  const r = await fetch(URL + a);
                  detail.push(`${a}=${r.status}`);
                  if (r.status === 200) pass++;
                } catch (e) { detail.push(`${a}=ERR`); }
              }
              log(12, 'API Health', pass === apis.length ? 'PASS' : 'FAIL', detail.join(','));
            } catch (e) { log(12, 'API Health', 'FAIL', '', e.message); }

            // ============ POINT 13: Supabase Integrity (via /api/stats) ============
            try {
              const r = await fetch(URL + '/api/stats');
              const j = await r.json();
              const ok = j && (j.fl_parcels > 1_000_000 || j.parcels > 1_000_000);
              log(13, 'Supabase Integrity', ok ? 'PASS' : 'FAIL', `fl_parcels=${j.fl_parcels} alive=${j.fl_parcels_alive}`);
            } catch (e) { log(13, 'Supabase Integrity', 'FAIL', '', e.message); }

            // ============ POINTS 8, 11, 14: Browser tests across 3 engines ============
            const browsers = [
              { name: 'chromium', launcher: chromium },
              { name: 'firefox', launcher: firefox },
              { name: 'webkit', launcher: webkit }
            ];
            const featureResults = [];
            const consoleErrors = [];
            let mobileOk = false, brandOk = false, conversionOk = false;

            for (const { name, launcher } of browsers) {
              try {
                const browser = await launcher.launch();
                const ctx = await browser.newContext({ viewport: { width: 1920, height: 1080 } });
                const page = await ctx.newPage();
                const errs = [];
                const tileReqs = [];
                page.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
                page.on('pageerror', e => errs.push('PAGEERR: ' + e.message));
                page.on('request', r => {
                  const u = r.url();
                  if (u.includes('tile.googleapis.com') || u.includes('cesium.com')) tileReqs.push(u);
                });

                await page.goto(URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(15000);
                await page.screenshot({ path: `screenshots/${name}-home.png`, fullPage: false });

                const cesiumLoaded = await page.evaluate(() => typeof window.Cesium !== 'undefined');
                const canvasCount = await page.locator('canvas').count();
                const hero3dPresent = (await page.content()).includes('Hero3DSection') ||
                                       await page.locator('[data-component="Hero3DSection"], .hero-3d, #hero-3d').count() > 0 ||
                                       canvasCount > 0;

                featureResults.push({
                  browser: name,
                  cesiumLoaded,
                  canvasCount,
                  hero3dPresent,
                  tileRequestCount: tileReqs.length,
                  consoleErrCount: errs.length,
                  errors: errs.slice(0, 5)
                });
                consoleErrors.push(...errs.map(e => `[${name}] ${e}`));

                if (name === 'chromium') {
                  const mobile = await browser.newContext({ ...devices['iPhone 13'] });
                  const mp = await mobile.newPage();
                  await mp.goto(URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
                  await mp.waitForTimeout(5000);
                  await mp.screenshot({ path: 'screenshots/chromium-mobile.png' });
                  const overflow = await mp.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 5);
                  mobileOk = !overflow;
                  await mobile.close();

                  const brandHits = await page.evaluate(() => {
                    const html = document.documentElement.outerHTML.toLowerCase();
                    return {
                      navyRef: html.includes('1e3a5f') || html.includes('rgb(30, 58, 95)'),
                      orangeRef: html.includes('f59e0b') || html.includes('rgb(245, 158, 11)'),
                    };
                  });
                  brandOk = brandHits.navyRef || brandHits.orangeRef;

                  // P10 FIX: broadened CTA selector — matches nav, hero, pricing, and common verbs
                  const ctaCount = await page.locator([
                    'a[href*="pricing"]',
                    'a[href*="sign-up"]',
                    'a[href*="signup"]',
                    'a[href*="/chat"]',
                    'a[href*="/explore"]',
                    'a[href*="/dashboard"]',
                    'button:has-text("Try")',
                    'button:has-text("Start")',
                    'button:has-text("Get")',
                    'button:has-text("Explore")',
                    'button:has-text("Launch")',
                    'a:has-text("Get Started")',
                    'a:has-text("Try it")',
                    'a:has-text("Start Free")',
                    'a:has-text("Explore")',
                    'a:has-text("Launch")',
                    'a:has-text("Sign up")',
                    '[class*="cta" i]',
                    '[data-cta]',
                  ].join(', ')).count();
                  conversionOk = ctaCount > 0;
                  console.log(`CTA_COUNT: ${ctaCount}`);
                }

                await browser.close();
              } catch (e) {
                featureResults.push({ browser: name, error: e.message });
                consoleErrors.push(`[${name}] LAUNCH_ERR: ${e.message}`);
              }
            }

            // POINT 8: Zero Console Errors (allow ≤6 noisy 3rd-party errors)
            const totalErrs = featureResults.reduce((s, r) => s + (r.consoleErrCount || 0), 0);
            fs.writeFileSync('reports/console-errors.json', JSON.stringify(consoleErrors, null, 2));
            log(8, 'Zero Console Errors', totalErrs <= 6 ? 'PASS' : 'FAIL',
                `total=${totalErrs} sample=${consoleErrors.slice(0,3).join(' | ').slice(0,300)}`);

            // POINT 11: Feature Functional — Cesium loaded + tile requests fired in chromium
            const chrome = featureResults.find(f => f.browser === 'chromium') || {};
            const featureOk = chrome.cesiumLoaded && chrome.canvasCount > 0 && chrome.tileRequestCount > 0;
            log(11, 'Feature Functional (3D Tiles)', featureOk ? 'PASS' : 'FAIL',
                `cesium=${chrome.cesiumLoaded} canvas=${chrome.canvasCount} tileReqs=${chrome.tileRequestCount}`);

            // POINT 14: Cross-Browser
            const browsersOk = featureResults.filter(f => f.canvasCount > 0 || f.hero3dPresent).length;
            log(14, 'Cross-Browser', browsersOk === 3 ? 'PASS' : (browsersOk >= 2 ? 'PARTIAL' : 'FAIL'),
                `${browsersOk}/3 browsers rendered`);

            // POINT 5: Mobile
            log(5, 'Mobile Responsive', mobileOk ? 'PASS' : 'FAIL', `no_overflow=${mobileOk}`);

            // POINT 9: House Brand
            log(9, 'House Brand', brandOk ? 'PASS' : 'FAIL', 'navy/orange tokens present');

            // POINT 10: Conversion Flow
            log(10, 'Conversion Flow', conversionOk ? 'PASS' : 'FAIL', 'CTA present');

            // POINT 3: SEO (parse HTML)
            try {
              const html = await (await fetch(URL)).text();
              const seoChecks = {
                title: /<title>/.test(html),
                description: /<meta\s+name=["']description/i.test(html),
                og: /<meta\s+property=["']og:/i.test(html),
                jsonLd: /application\/ld\+json/.test(html)
              };
              const robots = (await fetch(URL + '/robots.txt')).status;
              const sitemap = (await fetch(URL + '/sitemap.xml')).status;
              const passed = Object.values(seoChecks).filter(Boolean).length;
              const ok = passed >= 3 && robots === 200;
              log(3, 'SEO', ok ? 'PASS' : 'FAIL', `seo=${passed}/4 robots=${robots} sitemap=${sitemap}`);
            } catch (e) { log(3, 'SEO', 'FAIL', '', e.message); }

            // POINT 4: Accessibility (axe on chromium) — wait longer for hydration so we don't hit error boundary
            try {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              const pageErrs = [];
              page.on('pageerror', e => pageErrs.push(e.message));
              await page.goto(URL, { waitUntil: 'networkidle', timeout: 45000 });
              await page.waitForTimeout(10000);
              // Sanity check: make sure we're not on error boundary
              const isErrorBoundary = await page.evaluate(() => !!document.getElementById('__next_error__'));
              if (isErrorBoundary) {
                log(4, 'Accessibility (axe WCAG 2.1 AA)', 'FAIL', 'hit __next_error__ boundary', pageErrs.slice(0,3).join(' | '));
              } else {
                const axeResults = await new AxeBuilder({ page }).analyze();
                const critical = axeResults.violations.filter(v => v.impact === 'critical' || v.impact === 'serious').length;
                fs.writeFileSync('reports/axe.json', JSON.stringify(axeResults, null, 2));
                log(4, 'Accessibility (axe WCAG 2.1 AA)', critical === 0 ? 'PASS' : 'FAIL',
                    `violations=${axeResults.violations.length} critical/serious=${critical}`);
              }
              await browser.close();
            } catch (e) { log(4, 'Accessibility', 'FAIL', '', e.message); }

            // POINT 2: Lighthouse — real run via lighthouse + chrome-launcher
            try {
              const lighthouse = (await import('lighthouse')).default;
              const chromeLauncher = await import('chrome-launcher');
              const chromeInstance = await chromeLauncher.launch({ chromeFlags: ['--headless=new', '--no-sandbox'] });
              const lhr = await lighthouse(URL, {
                port: chromeInstance.port,
                output: 'json',
                onlyCategories: ['performance','accessibility','best-practices','seo'],
                logLevel: 'error',
              });
              await chromeInstance.kill();
              const cats = lhr.lhr.categories;
              const scores = {
                perf: Math.round(cats.performance.score * 100),
                a11y: Math.round(cats.accessibility.score * 100),
                bp: Math.round(cats['best-practices'].score * 100),
                seo: Math.round(cats.seo.score * 100),
              };
              fs.writeFileSync('reports/lighthouse.json', JSON.stringify(lhr.lhr, null, 2));
              const allPass = scores.perf >= 90 && scores.a11y >= 90 && scores.bp >= 90 && scores.seo >= 90;
              log(2, 'Lighthouse ≥90×4', allPass ? 'PASS' : 'FAIL',
                  `perf=${scores.perf} a11y=${scores.a11y} bp=${scores.bp} seo=${scores.seo}`);
            } catch (e) {
              log(2, 'Lighthouse ≥90×4', 'FAIL', 'lighthouse execution error', e.message);
            }

            // Save results
            fs.writeFileSync('reports/eg14-results.json', JSON.stringify(results, null, 2));
            console.log('\n=== EG14 SUMMARY ===');
            const passed = results.filter(r => r.status === 'PASS').length;
            const failed = results.filter(r => r.status === 'FAIL').length;
            const pending = results.filter(r => r.status === 'PENDING').length;
            console.log(`PASS: ${passed} | FAIL: ${failed} | PENDING: ${pending} | TOTAL: ${results.length}/14`);
            console.log('FEATURE_RESULTS:', JSON.stringify(featureResults, null, 2));
          })().catch(e => { console.error('FATAL:', e); process.exit(1); });
          JSEOF
          node eg14.js 2>&1 | tee eg14-output.txt || true
          echo "=== Files created ==="
          ls -la screenshots/ reports/ 2>/dev/null

      - name: Upload screenshots to Supabase
        if: always()
        env:
          SUPABASE_SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          BUCKET="summit-screenshots"
          BASE="https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/${BUCKET}/398/eg14"
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            curl -s -X POST "${BASE}/${name}" \
              -H "Authorization: Bearer $SUPABASE_SRK" \
              -H "Content-Type: image/png" \
              -H "x-upsert: true" \
              --data-binary "@$f" >/dev/null
            echo "uploaded: ${name}"
          done
          for f in reports/*.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            curl -s -X POST "${BASE}/reports/${name}" \
              -H "Authorization: Bearer $SUPABASE_SRK" \
              -H "Content-Type: application/json" \
              -H "x-upsert: true" \
              --data-binary "@$f" >/dev/null
            echo "uploaded: reports/${name}"
          done

      - name: Comment results on issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e
          if [ -f reports/eg14-results.json ]; then
            SUMMARY=$(node -e "
              const r = JSON.parse(require('fs').readFileSync('reports/eg14-results.json'));
              const p = r.filter(x=>x.status==='PASS').length;
              const f = r.filter(x=>x.status==='FAIL').length;
              const pn = r.filter(x=>x.status==='PENDING').length;
              console.log('## EVEREST GATE '+p+'/14\\\\n\\\\n'+r.sort((a,b)=>a.id-b.id).map(x=>'- [P'+x.id+'] '+x.status+' — '+x.name+' — '+x.evidence).join('\\\\n')+'\\\\n\\\\n**PASS:** '+p+' | **FAIL:** '+f+' | **PENDING:** '+pn);
            ")
            gh api repos/breverdbidder/cli-anything-biddeed/issues/398/comments \
              -f body="$SUMMARY" || echo "comment failed"
          fi

      - name: Insert eg14_runs rows in Supabase
        if: always()
        env:
          SUPABASE_SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          if [ -f reports/eg14-results.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('reports/eg14-results.json'));
              const rows = r.map(x => ({
                summit_id: 398,
                point_id: x.id,
                point_name: x.name,
                status: x.status,
                evidence: x.evidence,
                error: x.err || null,
                run_at: new Date().toISOString(),
                run_id: process.env.GITHUB_RUN_ID,
              }));
              console.log(JSON.stringify(rows));
            " > /tmp/rows.json
            curl -s -X POST "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/eg14_runs" \
              -H "apikey: $SUPABASE_SRK" \
              -H "Authorization: Bearer $SUPABASE_SRK" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              --data-binary "@/tmp/rows.json" && echo "rows inserted"
          fi
