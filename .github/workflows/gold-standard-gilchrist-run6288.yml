name: "Gold Standard SHARD-10 Run-6288 (gilchrist — E+I fix)"
# Dispatch: 28bd9542-c34b-42af-97c6-7ad3e8205808
# Issue: breverdbidder/cli-anything-biddeed#13938
# County: gilchrist — currently 8/10, E FAIL (57.1%) + I FAIL (42.9%)
# Root cause: 6 bare-stub foreclosure cases (CA* format) have no parcel_id
#   because RealAuction for gilchrist exposes only a generic qpublic link
#   per run-6148 (2026-07-24) confirmed live inspection.
# Fix: FL 8th Circuit case lookup → Gilchrist PA ArcGIS → parcel_id + geocode + zone

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - migration
          - fix
          - verify

concurrency:
  group: gold-standard-gilchrist-run6288
  cancel-in-progress: false

jobs:
  # ── Job 1: Apply defensive migration ─────────────────────────────────────
  apply-migration:
    name: "Apply gilchrist run-6288 migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'migration' || github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client 2>/dev/null || true

      - name: Apply gilchrist run-6288 migration via psql
        run: |
          set -euo pipefail
          REF="mocerqjnksmhcjzxrewo"
          MIGRATION_FILE="migrations/20260725_gilchrist_shard10_run6288_e_i_fix.sql"
          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "Migration file not found: $MIGRATION_FILE — skipping"
            exit 0
          fi
          for CONN in \
            "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"; do
            if psql "$CONN" -c "SELECT 1" > /dev/null 2>&1; then
              echo "Connected via pooler"
              psql "$CONN" -f "$MIGRATION_FILE" \
                && echo "Migration applied OK" \
                || echo "Migration had errors (may be idempotent re-run)"
              break
            fi
          done || echo "psql unavailable — fix script will apply via REST"

  # ── Job 2: Run E+I parcel linkage fix ────────────────────────────────────
  run-fix:
    name: "gilchrist E+I parcel linkage (run-6288)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apply-migration
    if: always() && (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'fix' || github.event_name == 'schedule')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Run gilchrist E+I parcel linkage fix
        run: |
          set -euo pipefail
          python3 scripts/gilchrist_run6288_e_i_parcel_linkage.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── Job 3: Verify E+I metrics ─────────────────────────────────────────────
  verify:
    name: "Verify gilchrist E+I metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: run-fix
    if: always() && (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'verify' || github.event_name == 'schedule')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate gilchrist via pencil_dod_evaluate_county
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY — cannot verify")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }

          print("### SQL VERIFICATION — SHARD-10 Run-6288 gilchrist")
          print(f"Dispatch: 28bd9542-c34b-42af-97c6-7ad3e8205808")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print("")

          url = f"{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
          payload = json.dumps({'p_county': 'gilchrist'}).encode()
          req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  result = json.loads(r.read())
          except Exception as e:
              print(f"Evaluation error: {e}")
              exit(1)

          if isinstance(result, dict):
              passes = sum(
                  1 for ltr in 'ABCDEFGHIJ'
                  if isinstance(result.get(ltr), dict) and result[ltr].get('pass')
              )
              print(f"gilchrist [{passes}/10]:")
              for ltr in 'ABCDEFGHIJ':
                  d = result.get(ltr)
                  if isinstance(d, dict):
                      status = 'PASS' if d.get('pass') else 'FAIL'
                      detail = d.get('detail', d.get('metric', ''))
                      print(f"  {ltr}: {status} — {detail}")
          elif isinstance(result, list):
              passes = sum(1 for r in result if isinstance(r, dict) and r.get('pass'))
              print(f"gilchrist [{passes}/10]:")
              for r in result:
                  if isinstance(r, dict):
                      status = 'PASS' if r.get('pass') else 'FAIL'
                      print(f"  {r.get('letter','?')}: {status} — {r.get('detail','')}")
          else:
              print(f"Unexpected result: {result}")
              passes = 0

          print("")
          print(f"E+I target: PASS (required for 10/10)")
          if passes >= 10:
              print("STATUS: 10/10 ACHIEVED")
          elif passes >= 8:
              print(f"STATUS: {passes}/10 — E/I still need work")
          else:
              print(f"STATUS: {passes}/10")
          PYEOF
