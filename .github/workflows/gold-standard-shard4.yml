name: "Gold Standard SHARD-4 Improvements"

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 8:00Z (start of GOLD STANDARD daily waves)
  workflow_dispatch:
    inputs:
      county:
        description: 'Specific county (citrus, st_johns, hendry, walton, lafayette)'
        required: false
        default: ''
      letters:
        description: 'Target letters (B,E,I)'
        required: false
        default: 'B,E,I'
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        default: 'false'

jobs:
  shard4-improvements:
    name: "SHARD-4 Gold Standard Session"
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4

      - name: Run shard-4 improvements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ARGS="--letters ${{ github.event.inputs.letters || 'B,E,I' }}"
          
          if [ -n "${{ github.event.inputs.county }}" ]; then
            ARGS="$ARGS --county ${{ github.event.inputs.county }}"
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN MODE: Would run improvements but no database writes"
            python scripts/verify_shard4_status.py
          else
            python scripts/shard4_gold_standard_improvements.py $ARGS
          fi

      - name: Verification report
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "=== POST-RUN VERIFICATION ===" 
          python scripts/verify_shard4_status.py
          
      - name: Commit any verification workflows created
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .github/workflows/gold-standard-*.yml
            git commit -m "feat: add county-specific gold standard verification workflows
            
            Generated by shard-4 autonomous session $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new verification workflows to commit"
          fi

      - name: Post session summary
        if: always()
        run: |
          echo "### SHARD-4 Gold Standard Session Results" >> $GITHUB_STEP_SUMMARY
          echo "**Counties:** citrus, st_johns, hendry, walton, lafayette" >> $GITHUB_STEP_SUMMARY
          echo "**Letters targeted:** ${{ github.event.inputs.letters || 'B,E,I' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verification status:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 /tmp/verification_output.txt || echo "No verification output captured" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY