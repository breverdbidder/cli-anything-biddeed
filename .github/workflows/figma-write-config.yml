name: Write Figma MCP Config
on:
  push:
    paths:
      - 'scripts/figma-trigger.txt'
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Write config via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 'python3 << PYEOF
import json, os, subprocess
config_path = "/home/claude/.claude.json"
cfg = {}
if os.path.exists(config_path):
    with open(config_path) as f:
        cfg = json.load(f)
if "mcpServers" not in cfg:
    cfg["mcpServers"] = {}
cfg["mcpServers"]["figma-remote-mcp"] = {"type": "url", "url": "https://mcp.figma.com/mcp"}
with open(config_path, "w") as f:
    json.dump(cfg, f, indent=2)
subprocess.run(["chown", "claude:claude", config_path])
print("DONE")
with open(config_path) as f:
    print(f.read())
PYEOF'
          TG_BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          curl -sf -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"✅ FIGMA MCP written to Hetzner ~/.claude.json\\nOAuth auto-prompts on first Claude Code use.\"}" || true
