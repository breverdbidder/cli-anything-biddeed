name: LinkedIn Extract Post
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'LinkedIn post URL'
        required: true
      push_supabase:
        description: 'Push to Supabase'
        required: false
        default: 'true'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install deps
        run: |
          pip install playwright pydantic aiohttp requests
          playwright install chromium
      
      - name: Extract LinkedIn post
        env:
          LI_SESSION: ${{ secrets.LINKEDIN_SESSION_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POST_URL: ${{ inputs.url }}
          PUSH_SUPABASE: ${{ inputs.push_supabase }}
          TELEGRAM_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          python3 << 'PYEOF2'
          import asyncio, os, json, sys
          sys.path.insert(0, 'linkedin/vendor')
          
          from linkedin_scraper.scrapers.post import PostScraperPublic
          
          URL = os.environ["POST_URL"]
          BOT = os.environ.get("TELEGRAM_BOT", "")
          CHAT = os.environ.get("TELEGRAM_CHAT", "")
          
          def tg(msg):
              if BOT and CHAT:
                  import requests as rq
                  rq.post(f"https://api.telegram.org/bot{BOT}/sendMessage",
                      data={"chat_id": CHAT, "text": msg, "parse_mode": "Markdown"})
          
          async def main():
              # Try meta extraction first
              result = await PostScraperPublic.extract_meta(URL)
              
              if result and len(result.get("text","")) > 50:
                  text = result["text"]
                  title = result.get("title", "LinkedIn Post")
                  print(f"Extracted {len(text)} chars via meta tags")
                  
                  # Supabase push
                  if os.environ.get("PUSH_SUPABASE") == "true":
                      sb_url = os.environ.get("SUPABASE_URL","")
                      sb_key = os.environ.get("SUPABASE_KEY","")
                      if sb_url and sb_key:
                          import requests as rq
                          row = {
                              "source": "linkedin",
                              "source_url": URL,
                              "content_type": "post", 
                              "title": title[:200],
                              "content": text,
                              "metadata": json.dumps({"image": result.get("image",""), "source": "meta_tags"}),
                              "mode": "linkedin_post"
                          }
                          r = rq.post(f"{sb_url}/rest/v1/discovery_results",
                              headers={"apikey": sb_key, "Authorization": f"Bearer {sb_key}", 
                                       "Content-Type": "application/json", "Prefer": "return=representation"},
                              json=row, timeout=10)
                          print(f"Supabase: {r.status_code}")
                  
                  # Telegram
                  preview = text[:500] + ("..." if len(text) > 500 else "")
                  tg(f"📋 *LinkedIn Post Extracted*\n\n{preview}\n\n🔗 {URL}")
              else:
                  # Full Playwright extraction
                  session_json = os.environ.get("LI_SESSION", "")
                  if not session_json:
                      tg(f"❌ LinkedIn extract failed — no session and meta tags insufficient\n{URL}")
                      return
                  
                  from playwright.async_api import async_playwright
                  async with async_playwright() as p:
                      browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                      session = json.loads(session_json)
                      context = await browser.new_context()
                      await context.add_cookies(session.get("cookies", []))
                      page = await context.new_page()
                      
                      from linkedin_scraper.scrapers.post import PostScraper
                      scraper = PostScraper(page)
                      post = await scraper.scrape(URL)
                      
                      if post.text:
                          preview = post.text[:500] + ("..." if len(post.text) > 500 else "")
                          tg(f"📋 *LinkedIn Post Extracted*\n\n{preview}\n\n🔗 {URL}")
                          print(f"Extracted {len(post.text)} chars via Playwright")
                      
                      await browser.close()
          
          asyncio.run(main())
          PYEOF2

