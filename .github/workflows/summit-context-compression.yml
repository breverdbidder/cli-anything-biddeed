name: Summit Context Compression
on:
  workflow_dispatch: {}
jobs:
  compress:
    name: Convert CLAUDE.md to Mermaid and YAML
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Execute on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -2
            claude --version 2>/dev/null
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token
            mkdir -p /opt/biddeed
            for REPO in cli-anything-biddeed biddeed-ai biddeed-ai-ui zonewise-web zonewise-scraper-v4; do
              if [ ! -d "/opt/biddeed/$REPO" ]; then
                cd /opt/biddeed
                git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/${REPO}.git"
              fi
              cd /opt/biddeed/$REPO
              git fetch origin main && git checkout main && git reset --hard origin/main
              chown -R claude:claude /opt/biddeed/$REPO
            done
            echo "=== Run Claude Code ==="
            su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'; export NPM_CONFIG_PREFIX=/home/claude/.npm-global; export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin; export GH_PAT='$GH_PAT'; cd /opt/biddeed/cli-anything-biddeed; claude --print --dangerously-skip-permissions 'CONTEXT COMPRESSION MIGRATION. Read docs/plans/CONTEXT-COMPRESSION-SPEC.md and docs/plans/CLAUDE-compressed-reference.md first. Then: (1) Replace cli-anything-biddeed CLAUDE.md with compressed version from reference. Fix GSTACK CEO Mode ASCII refs to Mermaid. Git config ci@biddeed.ai BidDeed-CI. Commit and push. (2) For each of biddeed-ai biddeed-ai-ui zonewise-web zonewise-scraper-v4 in /opt/biddeed/: read their CLAUDE.md, apply same Mermaid+YAML conversion rules, keep repo-specific content, commit+push each. (3) Convert any SKILL.md or HARNESS.md prose sections in cli-anything-biddeed. Rules: Mermaid for flows, YAML for state, NEVER ASCII, NEVER prose for structured data, ZERO info loss. Report char count before/after each file.' 2>&1 | tee /tmp/context-compression.log | tail -100"
            EXIT_CODE=${PIPESTATUS[0]}
            echo "=== Telegram ==="
            if [ $EXIT_CODE -eq 0 ]; then E="OK"; S="SUCCESS"; else E="FAIL"; S="FAILED exit $EXIT_CODE"; fi
            SUMMARY=$(tail -20 /tmp/context-compression.log 2>/dev/null | head -10 | tr '\n' ' ' | cut -c1-400)
            MSG="${E} Context Compression: ${S}. Repos: 5. ${SUMMARY}"
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null 2>&1 || true
            exit $EXIT_CODE
