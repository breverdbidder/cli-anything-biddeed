name: Discover RealAuction Calendar Dates

on:
  workflow_dispatch:
    inputs:
      sale_type:
        description: 'tax_deed | foreclosure | both'
        required: false
        default: 'both'
  schedule:
    - cron: '17 */6 * * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build county matrix from registry
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SALE_TYPE_IN: ${{ github.event.inputs.sale_type }}
        run: |
          set -euo pipefail
          STIN="${SALE_TYPE_IN:-both}"
          if [ "$STIN" = "both" ]; then ST="foreclosure,tax_deed"; else ST="$STIN"; fi
          URL="$SUPABASE_URL/rest/v1/realauction_subdomains?is_active=eq.true&platform=in.(realforeclose,realtaxdeed)&sale_type=in.(${ST})&select=county_slug,sale_type"
          RESP=$(curl -sf -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Accept: application/json" "$URL")
          M=$(echo "$RESP" | jq -c '{include: [.[] | {county: .county_slug, sale_type: .sale_type}]}')
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "::notice::matrix size $(echo "$RESP" | jq 'length')"

  discover:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --quiet requests crawl4ai
          crawl4ai-setup
      - name: Look up registry entry
        id: registry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY: ${{ matrix.county }}
          SALE_TYPE: ${{ matrix.sale_type }}
        run: |
          set -euo pipefail
          URL="$SUPABASE_URL/rest/v1/realauction_subdomains?county_slug=eq.${COUNTY}&sale_type=eq.${SALE_TYPE}&is_active=eq.true&limit=1"
          RESP=$(curl -sf -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Accept: application/json" "$URL")
          if [ "$(echo "$RESP" | jq 'length')" = "0" ]; then echo "::error::No registry row"; exit 1; fi
          FULL_BASE=$(echo "$RESP" | jq -r '.[0].base_url')
          PLATFORM=$(echo "$RESP" | jq -r '.[0].platform')
          if [ -z "$FULL_BASE" ] || [ "$FULL_BASE" = "null" ]; then FULL_BASE="https://${COUNTY}.${PLATFORM}.com"; fi
          ORIGIN=$(echo "$FULL_BASE" | sed -E 's|(https?://[^/]+).*|\1|')
          echo "base_url=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
      - name: Run discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          COUNTY_SLUG: ${{ matrix.county }}
          BASE_URL: ${{ steps.registry.outputs.base_url }}
          PLATFORM: ${{ steps.registry.outputs.platform }}
          SALE_TYPE: ${{ matrix.sale_type }}
        run: python .github/scripts/discover_auction_dates.py
