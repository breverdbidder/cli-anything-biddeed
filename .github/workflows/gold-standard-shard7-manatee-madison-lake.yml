name: Gold Standard SHARD-7 (manatee, madison, lake) — loop run 5153

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - evaluate
          - manatee_g
          - lake_e
          - lake_gi
          - lake_j
          - madison
  schedule:
    - cron: '0 8 * * *'   # 08:00Z daily — per 24/7 build cadence

concurrency:
  group: gold-standard-shard7-manatee-madison-lake
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests beautifulsoup4 lxml

      - name: Configure git
        run: |
          git config user.email "shard7-manatee-madison-lake-bot@biddeed.ai"
          git config user.name "SHARD-7 manatee/madison/lake Gold Standard Bot"

      - name: Pull latest main (before any work)
        run: |
          git pull --rebase origin main || git pull origin main

      - name: Run SHARD-7 master coordinator (manatee / madison / lake)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PHASE: ${{ github.event.inputs.phase || 'all' }}
        run: |
          set -euo pipefail
          python3 scripts/shard7_manatee_madison_lake_master.py 2>&1 | tee /tmp/shard7_mmm_master_output.txt
          cat /tmp/shard7_mmm_master_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Lake E — parcel linkage (dedicated pass)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'lake_e' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 scripts/lake_e_parcel_linkage.py 2>&1 | tee /tmp/lake_e_output.txt
          cat /tmp/lake_e_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Lake I — real ArcGIS zoning backfill (shard7_run3679)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'lake_gi' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 scripts/shard7_run3679_lake_i_real_zoning_backfill.py 2>&1 | tee /tmp/lake_i_output.txt
          cat /tmp/lake_i_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Lake G — zoning standards fix (shard7c)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'lake_gi' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 scripts/shard7c_lake_g_zoning_standards_fix.py 2>&1 | tee /tmp/lake_g_output.txt
          cat /tmp/lake_g_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Lake J — bid_decisions migration apply (INSERT WHERE NOT EXISTS)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'lake_j' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          python3 scripts/shard7_lake_j_migration_apply.py 2>&1 | tee /tmp/lake_j_output.txt
          cat /tmp/lake_j_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Manatee — zoning point-in-polygon (shard_manatee_i_zoning)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'manatee_g' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 scripts/shard_manatee_i_zoning.py 2>&1 | tee /tmp/manatee_i_output.txt
          cat /tmp/manatee_i_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify county metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, urllib.request, json, datetime

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}

          def rpc_call(fn, params):
              data = json.dumps(params).encode()
              req = urllib.request.Request(f'{BASE}/rpc/{fn}', data=data, headers=H, method='POST')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())

          counties = ['manatee', 'madison', 'lake']
          print('### SQL VERIFICATION — SHARD-7 manatee/madison/lake Evaluation')
          print(f'Timestamp: {datetime.datetime.now(datetime.timezone.utc).isoformat()}')

          for county in counties:
              try:
                  ev = rpc_call('pencil_dod_evaluate_county', {'county_slug_arg': county})
                  if isinstance(ev, list):
                      passes = [row['letter'] for row in ev if isinstance(row, dict) and row.get('pass')]
                      print(f'{county.upper()}: {len(passes)}/10 PASS — {passes}')
                      for row in ev:
                          if isinstance(row, dict):
                              status = 'PASS' if row.get('pass') else 'FAIL'
                              print(f\"  {row.get('letter')}: {status} metric={row.get('metric')} detail={row.get('detail','')}\")
                  else:
                      print(f'{county}: result format unexpected: {str(ev)[:200]}')
              except Exception as e:
                  print(f'{county}: evaluation failed: {e}')
          " 2>&1 | tee /tmp/shard7_verify_output.txt

          cat /tmp/shard7_verify_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Run gold_standard_loop + certify (only if session is solo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 -c "
          import os, urllib.request, json, time

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}

          def rpc_call(fn, params, timeout=300):
              data = json.dumps(params).encode()
              req = urllib.request.Request(f'{BASE}/rpc/{fn}', data=data, headers=H, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read())
              except Exception as e:
                  return -1, str(e)

          print('Running gold_standard_loop...')
          status, result = rpc_call('gold_standard_loop', {})
          print(f'loop: HTTP {status}')
          if status == 200:
              print(str(result)[:200])

          time.sleep(5)
          print('Running gold_standard_certify...')
          status2, result2 = rpc_call('gold_standard_certify', {}, timeout=120)
          print(f'certify: HTTP {status2}')
          if status2 == 200:
              print(str(result2)[:500])
          " 2>&1

      - name: Commit new scripts and session artifacts
        run: |
          set +e
          git pull --rebase origin main || git pull origin main
          git add scripts/shard7_manatee_madison_lake_master.py || true
          git add .github/workflows/gold-standard-shard7-manatee-madison-lake.yml || true
          git diff --cached --quiet || git commit -m "fix(gold-standard): SHARD-7 manatee/madison/lake master script + workflow (dispatch bc399d3b)"
          git push origin main || true
