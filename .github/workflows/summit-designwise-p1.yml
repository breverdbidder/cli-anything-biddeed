name: "Summit: DesignWise P1 — PostHog + TypeScript + Content"
on:
  workflow_dispatch: {}

jobs:
  p1-execute:
    name: "P1: Unblock Dependencies (3 streams)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute P1 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web
            echo "Last 3 commits:"
            git log --oneline -3

            echo "=== [5/6] Claude Code — P1 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='${OAUTH_TOKEN}'
              export SUPABASE_URL='${SUPABASE_URL}'
              export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='${GH_PAT}'
              export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
              export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'

              cd /opt/biddeed/zonewise-web

              claude --print --dangerously-skip-permissions 'MISSION: DesignWise Squad P1 — Unblock Dependencies. Read docs/plans/DESIGNWISE-TODO.md and docs/plans/DESIGNWISE-FIRE.md first. P0 is complete. PostHog key is in Vercel env NEXT_PUBLIC_POSTHOG_KEY. Staging files in docs/designwise-staging/p1/. Execute THREE streams: STREAM D (PostHog): bun add posthog-js, copy staging files to lib/posthog.ts and components/PostHogProvider.tsx, wire into layout.tsx wrapping children in PostHogProvider. STREAM A (TypeScript): remove ignoreBuildErrors:true from next.config.mjs, run tsc --noEmit, fix all TS errors, verify bun run build passes. STREAM B (Content): search for 298 KPI claim, verify against Supabase, replace with live counter or remove. Git config: ci@biddeed.ai / BidDeed-CI. Remote: https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git. Commit after each stream. Push to main. Update TODO.md marking completed tasks. BUILD GATE: bun run build must pass. Send Telegram when done. Cost max 10 dollars.'
            "

            echo "=== [6/6] Done ==="
