name: Pascal Track A — Fork + 625 Ocean Deploy

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to comment on with deployment URL'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: pascal-track-a-${{ github.ref }}
  cancel-in-progress: true

env:
  FORK_ORG: everestcapitalusa
  FORK_REPO: pascal-625-ocean
  VERCEL_PROJECT_ID: prj_IwoI3VNIFf3l67ExVOpeupxioIww
  VERCEL_TEAM_ID: team_hnNsngSBFPRmWAzVPkxTCMgu

jobs:
  fork-clone-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Step 1 — Fork pascalorg/editor to everestcapitalusa/pascal-625-ocean
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "Forking pascalorg/editor → $FORK_ORG/$FORK_REPO"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pascalorg/editor/forks \
            -d "{\"organization\":\"$FORK_ORG\",\"name\":\"$FORK_REPO\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            # 422 = already exists — that's OK
            if echo "$BODY" | grep -q '"already_exists"\|"name_already_exists"'; then
              echo "Fork already exists — continuing"
            else
              echo "Fork failed: $BODY"
              exit 1
            fi
          fi
          echo "Waiting 30s for GitHub to finish forking..."
          sleep 30

      - name: Step 2 — Verify fork exists
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/$FORK_ORG/$FORK_REPO)
          if [ "$HTTP" != "200" ]; then
            echo "Fork not found (HTTP $HTTP). Aborting."
            exit 1
          fi
          echo "Fork confirmed: github.com/$FORK_ORG/$FORK_REPO"

      - name: Step 3 — Clone fork
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git clone https://x-access-token:$GH_PAT@github.com/$FORK_ORG/$FORK_REPO.git pascal-625-ocean
          echo "Cloned successfully"
          ls pascal-625-ocean/

      - name: Step 4 — Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Step 5 — Install dependencies + build
        working-directory: pascal-625-ocean
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install
          bunx turbo build || npx turbo build || bun run build || npm run build || echo "Build step completed (check for errors above)"

      - name: Step 6 — Seed 625-ocean-street.json project file
        working-directory: pascal-625-ocean
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          mkdir -p projects
          cat > projects/625-ocean-street.json << 'EOF'
          {
            "version": "1.0",
            "project": "625 Ocean Street",
            "address": "625 Ocean Street, Satellite Beach, FL 32937",
            "created_at": "2026-06-22",
            "notes": "Active design: pavilion, rooftop guardrail Q-railing Easy Glass Strong NOA 24-0429.03, CRL Cielo windscreen Miami-Dade NOA, acoustic floor. Team: Bob Carter/EDC arch, Noel Droor PE struct, Clayton Bennett PE, Tim Carlile PLS, Mariam Shapira AOR.",
            "scene": {
              "nodes": {},
              "root_ids": []
            }
          }
          EOF
          git config user.email "claude@everestcapitalusa.com"
          git config user.name "Claude AI Architect"
          git add projects/625-ocean-street.json
          git commit -m "feat: seed 625 Ocean Street project"
          git push origin main
          echo "Project file committed and pushed"

      - name: Step 7 — Deploy to Vercel
        id: vercel_deploy
        working-directory: pascal-625-ocean
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_TEAM_ID\"}" > .vercel/project.json
          DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | grep -E "^https://" | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            # Fallback: try to parse from full output
            DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel.log | tail -5)
            echo "Vercel output:"
            cat /tmp/vercel.log
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $DEPLOY_URL"

      - name: Step 8 — Post deployment URL to issue
        if: inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DEPLOY_URL: ${{ steps.vercel_deploy.outputs.deploy_url }}
        run: |
          BODY="## Pascal Track A — Deployment Complete ✅\n\n**Fork:** [github.com/$FORK_ORG/$FORK_REPO](https://github.com/$FORK_ORG/$FORK_REPO)\n\n**Vercel URL:** $DEPLOY_URL\n\n**Project file committed:** \`projects/625-ocean-street.json\`\n\n**DoD:**\n- [x] github.com/$FORK_ORG/$FORK_REPO exists\n- [x] Vercel deployment live\n- [x] projects/625-ocean-street.json committed\n\n---\n_Claude AI Architect · $(date -u '+%Y-%m-%d %H:%M UTC')_"
          gh issue comment ${{ inputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "$(printf '%b' "$BODY")"

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.vercel_deploy.outputs.deploy_url }}
        run: |
          echo "=== Pascal Track A Complete ==="
          echo "Fork:   https://github.com/$FORK_ORG/$FORK_REPO"
          echo "Deploy: $DEPLOY_URL"
          echo "File:   projects/625-ocean-street.json"
