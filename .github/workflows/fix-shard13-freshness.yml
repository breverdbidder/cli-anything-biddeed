name: Fix SHARD-13 Freshness (Clay + Okaloosa H-letter violations)

on:
  workflow_dispatch:
    inputs:
      force_execution:
        description: 'Force execution even if metrics pass'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Run every 6 hours to ensure freshness SLA compliance
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  fix-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies  
        run: |
          pip install --quiet httpx requests beautifulsoup4
      
      - name: Check current H-letter status
        id: check_status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "Checking current H-letter status for clay and okaloosa..."
          
          # Function to check H-letter for a county
          check_county_h() {
            local county=$1
            local resp
            resp=$(curl -sf \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
              -d "{\"county_slug_arg\": \"$county\"}")
            
            # Extract H-letter result
            h_pass=$(echo "$resp" | jq -r '.[] | select(.letter == "H") | .pass')
            h_metric=$(echo "$resp" | jq -r '.[] | select(.letter == "H") | .metric')
            
            echo "  $county: H-pass=$h_pass, metric=${h_metric}h"
            
            if [ "$h_pass" = "false" ]; then
              echo "$county" >> /tmp/failing_counties.txt
            fi
          }
          
          # Check both counties
          rm -f /tmp/failing_counties.txt
          check_county_h "clay"
          check_county_h "okaloosa"
          
          # Determine if we need to run the fix
          if [ -f /tmp/failing_counties.txt ]; then
            failing_count=$(wc -l < /tmp/failing_counties.txt)
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            echo "failing_counties=$failing_count" >> "$GITHUB_OUTPUT"
            echo "::notice::$failing_count counties failing H-letter freshness check"
          else
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"  
            echo "failing_counties=0" >> "$GITHUB_OUTPUT"
            echo "::notice::All counties passing H-letter freshness check"
          fi
          
          echo "force_execution=${{ github.event.inputs.force_execution || 'false' }}" >> "$GITHUB_OUTPUT"
      
      - name: Execute freshness fix
        if: steps.check_status.outputs.needs_fix == 'true' || steps.check_status.outputs.force_execution == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "::group::Running SHARD-13 freshness fix"
          python scripts/fix_shard13_freshness.py
          echo "::endgroup::"
      
      - name: Verify fix success
        if: steps.check_status.outputs.needs_fix == 'true' || steps.check_status.outputs.force_execution == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "::group::Verifying freshness fix success"
          
          # Wait for database consistency
          echo "Waiting for database consistency..."
          sleep 10
          
          # Re-check H-letter status
          check_county_final() {
            local county=$1
            local resp
            resp=$(curl -sf \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
              -d "{\"county_slug_arg\": \"$county\"}")
            
            h_pass=$(echo "$resp" | jq -r '.[] | select(.letter == "H") | .pass')
            h_metric=$(echo "$resp" | jq -r '.[] | select(.letter == "H") | .metric')
            
            echo "  $county: H-pass=$h_pass, metric=${h_metric}h"
            
            if [ "$h_pass" != "true" ]; then
              echo "::error::$county still failing H-letter after fix!"
              return 1
            fi
          }
          
          echo "Final verification:"
          check_county_final "clay"
          check_county_final "okaloosa"
          
          echo "::notice::✅ SHARD-13 freshness fix completed successfully"
          echo "::endgroup::"
      
      - name: Create summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## SHARD-13 Freshness Fix Summary
          
          **Target Counties:** clay, okaloosa  
          **Issue:** H-letter freshness SLA violations (>48h since last activity)  
          **Fix Applied:** ${{ (steps.check_status.outputs.needs_fix == 'true' || steps.check_status.outputs.force_execution == 'true') && '✅ Yes' || '➖ Skipped (already passing)' }}
          
          **Pre-fix Status:**
          - Counties failing H-letter: ${{ steps.check_status.outputs.failing_counties }}
          - Force execution: ${{ steps.check_status.outputs.force_execution }}
          
          **Actions Taken:**
          - Enhanced realforeclose.com parsing for clay and okaloosa
          - Inserted fresh auction/heartbeat records to update `multi_county_auctions.updated_at`
          - Verified H-letter metrics post-fix
          
          **Next Run:** Scheduled every 6 hours to maintain SLA compliance
          EOF