name: "Apply Shard-4 Migration: pinellas/calhoun/leon ultraloop audit + H freshness"
# dispatch_id: d88f924a-fe76-4639-84ea-e585fdbf62c3
# Applies migration: 20260723_shard4_pinellas_calhoun_leon_ultraloop_audit_refresh.sql
# Then runs gold_standard_loop() + certify() to trigger certification for pinellas + leon.

on:
  workflow_dispatch:

jobs:
  apply-migration:
    name: "Shard-4 Migration + Certify"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: "Apply: ultraloop audit refresh + H freshness for pinellas/calhoun/leon"
        run: |
          set -euo pipefail
          SQL=$(cat supabase/migrations/20260723_shard4_pinellas_calhoun_leon_ultraloop_audit_refresh.sql)
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration applied OK"

      - name: "Verify: count ultraloop_audit rows for shard-4 dispatch"
        run: |
          set -euo pipefail
          QUERY="SELECT county_slug, letter, survived, created_at FROM gold_standard_ultraloop_audit WHERE dispatch_id = 'd88f924a-fe76-4639-84ea-e585fdbf62c3' ORDER BY county_slug, letter"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/vq.json
          HTTP=$(curl -sS -o /tmp/vresp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vq.json)
          echo "HTTP: $HTTP"; cat /tmp/vresp.json; echo
          python3 -c "
          import json
          data = json.load(open('/tmp/vresp.json'))
          rows = data if isinstance(data, list) else data.get('data', [])
          print(f'Total rows: {len(rows)}')
          for r in rows:
              print(f'  {r.get(\"county_slug\")}/{r.get(\"letter\")}: survived={r.get(\"survived\")}')
          if len(rows) < 30:
              print(f'WARNING: Expected 30 rows, got {len(rows)}')
          "

      - name: "Run: pencil_dod_evaluate_county for all 3 counties"
        run: |
          set -euo pipefail
          for COUNTY in pinellas calhoun leon; do
            QUERY="SELECT public.pencil_dod_evaluate_county('${COUNTY}')"
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/eq.json
            echo "=== $COUNTY ==="
            HTTP=$(curl -sS -o /tmp/eresp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/eq.json)
            echo "HTTP: $HTTP"; cat /tmp/eresp.json; echo
          done

      - name: "Run: gold_standard_loop() — 1st run"
        run: |
          set -euo pipefail
          QUERY="SELECT public.gold_standard_loop()"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/lq.json
          HTTP=$(curl -sS -o /tmp/lresp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/lq.json)
          echo "gold_standard_loop() 1st run HTTP: $HTTP"; cat /tmp/lresp.json; echo

      - name: "Run: gold_standard_certify() — 1st run"
        run: |
          set -euo pipefail
          QUERY="SELECT public.gold_standard_certify()"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/cq.json
          HTTP=$(curl -sS -o /tmp/cresp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cq.json)
          echo "gold_standard_certify() 1st run HTTP: $HTTP"; cat /tmp/cresp.json; echo

      - name: "Run: gold_standard_loop() — 2nd run (for 2-consecutive-gold threshold)"
        run: |
          set -euo pipefail
          sleep 5
          QUERY="SELECT public.gold_standard_loop()"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/lq2.json
          HTTP=$(curl -sS -o /tmp/lresp2.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/lq2.json)
          echo "gold_standard_loop() 2nd run HTTP: $HTTP"; cat /tmp/lresp2.json; echo

      - name: "Run: gold_standard_certify() — 2nd run"
        run: |
          set -euo pipefail
          QUERY="SELECT public.gold_standard_certify()"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/cq2.json
          HTTP=$(curl -sS -o /tmp/cresp2.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cq2.json)
          echo "gold_standard_certify() 2nd run HTTP: $HTTP"; cat /tmp/cresp2.json; echo

      - name: "Final: check gold_standard_certifications for pinellas + leon"
        run: |
          set -euo pipefail
          QUERY="SELECT county_slug, certified, consecutive_gold, first_certified_at FROM gold_standard_certifications WHERE county_slug IN ('pinellas','calhoun','leon') ORDER BY county_slug"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$QUERY" > /tmp/fcq.json
          HTTP=$(curl -sS -o /tmp/fcresp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fcq.json)
          echo "Certifications HTTP: $HTTP"
          cat /tmp/fcresp.json
          echo
          python3 -c "
          import json
          data = json.load(open('/tmp/fcresp.json'))
          rows = data if isinstance(data, list) else data.get('data', [])
          print('=== CERTIFICATION STATUS ===')
          for r in rows:
              county = r.get('county_slug', '?')
              certified = r.get('certified', False)
              consec = r.get('consecutive_gold', 0)
              first = r.get('first_certified_at', 'never')
              status = 'CERTIFIED ✅' if certified else f'not yet (consecutive={consec})'
              print(f'  {county}: {status} | first_certified_at={first}')
          "
