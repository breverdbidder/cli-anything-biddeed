name: "ZONE-011: Fix Envelope Conquest — Titusville, Cocoa, Cocoa Beach"

on:
  workflow_dispatch:
    inputs:
      prefixes:
        description: 'Comma-separated prefixes to process (default: 21,22,24)'
        required: false
        default: '21,22,24'
        type: string
  push:
    branches: [main]
    paths:
      - 'envelope/agent-harness/agents/scout/zoning_scout.js'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

jobs:
  # ────────────────────────────────────────────────────
  # Run per-municipality in parallel (3x jobs)
  # ────────────────────────────────────────────────────
  conquer:
    name: "Conquer ${{ matrix.name }} (prefix ${{ matrix.prefix }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - prefix: "21"
            name: "titusville"
            city_filter: "TITUSVILLE"
          - prefix: "22"
            name: "cocoa"
            city_filter: "COCOA"
          - prefix: "24"
            name: "cocoa_beach"
            city_filter: "COCOA BEACH"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Run Envelope Pipeline: ${{ matrix.name }}"
        id: pipeline
        env:
          PREFIX: ${{ matrix.prefix }}
          MUNICIPALITY: ${{ matrix.name }}
          CITY_FILTER: ${{ matrix.city_filter }}
        run: |
          set -e
          cd envelope/agent-harness

          mkdir -p data/envelope-3d

          echo "=== ZONE-011: $MUNICIPALITY (prefix $PREFIX) ==="

          # Step 1: Scout — get zone codes + setbacks
          echo "--- Step 1: Zoning Scout ---"
          node agents/scout/zoning_scout.js \
            --municipality "$MUNICIPALITY" \
            --output "data/envelope-3d/zoning_${PREFIX}.jsonl" || {
            echo "Scout failed, trying Supabase fallback..."
            # Scout falls back automatically to parcel_zones
          }

          SCOUT_LINES=$(wc -l < "data/envelope-3d/zoning_${PREFIX}.jsonl" 2>/dev/null || echo 0)
          echo "Scout output: $SCOUT_LINES parcels"

          if [ "$SCOUT_LINES" -lt 10 ]; then
            echo "ERROR: Scout produced too few records ($SCOUT_LINES). Aborting."
            exit 1
          fi

          # Step 2: Surveyor — get parcel geometry from BCPAO
          echo "--- Step 2: Parcel Surveyor ---"
          node agents/surveyor/parcel_surveyor.js \
            --municipality "$MUNICIPALITY" \
            --output "data/envelope-3d/geometry_${PREFIX}.jsonl" || {
            echo "Surveyor error (non-fatal)"
          }

          SURVEY_LINES=$(wc -l < "data/envelope-3d/geometry_${PREFIX}.jsonl" 2>/dev/null || echo 0)
          echo "Surveyor output: $SURVEY_LINES parcels"

          # Step 3: Architect — compute envelope
          echo "--- Step 3: Envelope Architect ---"
          node agents/architect/envelope_compute.js \
            --zoning "data/envelope-3d/zoning_${PREFIX}.jsonl" \
            --geometry "data/envelope-3d/geometry_${PREFIX}.jsonl" \
            --output "data/envelope-3d/envelopes_${PREFIX}.jsonl" || {
            echo "Architect error (non-fatal)"
          }

          ARCH_LINES=$(wc -l < "data/envelope-3d/envelopes_${PREFIX}.jsonl" 2>/dev/null || echo 0)
          echo "Architect output: $ARCH_LINES envelopes"

          # Step 4: Inspector — QA gate (uses --input flag per qa_inspector.js constructor)
          echo "--- Step 4: QA Inspector ---"
          node agents/inspector/qa_inspector.js \
            --input "data/envelope-3d/envelopes_${PREFIX}.jsonl" || {
            echo "Inspector warning (non-fatal, continuing to load)"
          }

          # Step 5: Loader — upsert to envelope_cache
          echo "--- Step 5: Supabase Loader ---"
          node agents/loader/supabase_loader.js \
            --input "data/envelope-3d/envelopes_${PREFIX}.jsonl" \
            --table "envelope_cache" || {
            echo "Loader error"
            exit 1
          }

          echo "=== Pipeline complete for $MUNICIPALITY ==="

      - name: "Verify coverage: ${{ matrix.name }}"
        if: always()
        env:
          PREFIX: ${{ matrix.prefix }}
          MUNICIPALITY: ${{ matrix.name }}
        run: |
          python3 << 'PYEOF'
          import os, urllib.request, json

          sb_url = os.environ.get("SUPABASE_URL", "")
          sb_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          prefix = os.environ["PREFIX"]
          muni = os.environ["MUNICIPALITY"]

          if not sb_url or not sb_key:
              print(f"No Supabase creds — skipping coverage check")
              exit(0)

          def count_rows(table):
              url = f"{sb_url}/rest/v1/{table}?select=parcel_id&parcel_id=like.{prefix}*&limit=0"
              req = urllib.request.Request(url, headers={
                  "apikey": sb_key, "Authorization": f"Bearer {sb_key}", "Prefer": "count=exact"
              })
              try:
                  resp = urllib.request.urlopen(req)
                  cr = resp.getheader("content-range", "0/0")
                  return int(cr.split("/")[-1]) if "/" in cr else 0
              except Exception as e:
                  print(f"  Count error ({table}): {e}")
                  return 0

          zones = count_rows("parcel_zones")
          cached = count_rows("envelope_cache")
          pct = (cached / zones * 100) if zones > 0 else 0
          icon = "✅" if pct >= 85 else "🟡" if pct >= 50 else "🔴"
          print(f"{icon} {muni} (prefix {prefix}): {cached:,}/{zones:,} = {pct:.1f}%")

          # Telegram
          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if tg_token and tg_chat:
              msg = f"{icon} ZONE-011: {muni} envelope conquest = {pct:.1f}% ({cached:,}/{zones:,})"
              data = f"chat_id={tg_chat}&text={msg}".encode()
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage", data=data
                  ))
              except: pass
          PYEOF

  # ────────────────────────────────────────────────────
  # Final coverage report after all 3 cities done
  # ────────────────────────────────────────────────────
  report:
    name: "ZONE-011 Final Report"
    needs: conquer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Coverage report + Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, urllib.request

          sb_url = os.environ.get("SUPABASE_URL", "")
          sb_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")

          TARGET_PREFIXES = {
              "21": "titusville",
              "22": "cocoa",
              "24": "cocoa_beach",
          }

          def count_rows(table, prefix):
              url = f"{sb_url}/rest/v1/{table}?select=parcel_id&parcel_id=like.{prefix}*&limit=0"
              req = urllib.request.Request(url, headers={
                  "apikey": sb_key, "Authorization": f"Bearer {sb_key}", "Prefer": "count=exact"
              })
              try:
                  resp = urllib.request.urlopen(req)
                  cr = resp.getheader("content-range", "0/0")
                  return int(cr.split("/")[-1]) if "/" in cr else 0
              except:
                  return 0

          lines = ["🏔️ ZONE-011 — Envelope Conquest Fix Results\n"]
          all_met = True
          for prefix, muni in TARGET_PREFIXES.items():
              if not sb_url:
                  lines.append(f"⚠️ {muni}: No Supabase creds")
                  continue
              zones = count_rows("parcel_zones", prefix)
              cached = count_rows("envelope_cache", prefix)
              pct = (cached / zones * 100) if zones > 0 else 0
              icon = "✅" if pct >= 85 else "🟡" if pct >= 50 else "🔴"
              if pct < 85:
                  all_met = False
              lines.append(f"{icon} {muni} ({prefix}): {cached:,}/{zones:,} = {pct:.1f}%")

          lines.append(f"\nTarget: 85%+ per city")
          lines.append(f"Status: {'ALL MET ✅' if all_met else 'PARTIAL — re-run needed'}")

          report = "\n".join(lines)
          print(report)

          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if tg_token and tg_chat:
              msg = report.replace("\n", "%0A")
              data = f"chat_id={tg_chat}&text={msg}".encode()
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage", data=data
                  ))
              except: pass

          # Comment on issue #32
          gh_token = os.environ.get("GH_TOKEN", "")
          if gh_token:
              comment = report + "\n\nFixes applied:\n- `zoning_scout.js` cocoa prefix bug (23→22)\n- Added GIS endpoints for titusville/cocoa/cocoa_beach\n- Added FL municipal zone codes (B-1..B-4, I-1, I-2, R-series)\n- Added FL pattern fallback for unknown codes"
              body = {"body": comment}
              import json
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/32/comments",
                  data=data,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Content-Type": "application/json",
                      "Accept": "application/vnd.github.v3+json",
                  }
              )
              try:
                  urllib.request.urlopen(req)
                  print("Issue #32 comment posted")
              except Exception as e:
                  print(f"Comment failed: {e}")
          PYEOF
