name: SSH Fix - Unblock Termux

on:
  workflow_dispatch:

jobs:
  fix-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose and fix SSH access
        uses: appleboy/ssh-action@v1
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== SSHD STATUS ==="
            systemctl status sshd --no-pager | head -10

            echo ""
            echo "=== FAIL2BAN STATUS ==="
            if command -v fail2ban-client &>/dev/null; then
              fail2ban-client status sshd 2>&1 || echo "No sshd jail"
              echo "--- Banned IPs ---"
              fail2ban-client status sshd 2>&1 | grep "Banned IP" || true
              echo "--- UNBANNING ALL ---"
              fail2ban-client unban --all 2>&1 || echo "Unban failed or no bans"
            else
              echo "fail2ban not installed"
            fi

            echo ""
            echo "=== UFW STATUS ==="
            if command -v ufw &>/dev/null; then
              ufw status verbose 2>&1
              # Ensure SSH is allowed
              ufw allow 22/tcp 2>&1 || true
            else
              echo "ufw not installed"
            fi

            echo ""
            echo "=== IPTABLES SSH RULES ==="
            iptables -L INPUT -n --line-numbers 2>&1 | grep -i "22\|ssh\|DROP\|REJECT" || echo "No SSH-specific rules"

            echo ""
            echo "=== SSHD CONFIG ==="
            grep -E "^(Port|ListenAddress|PermitRootLogin|MaxStartups|MaxSessions|AllowUsers|DenyUsers|AddressFamily)" /etc/ssh/sshd_config 2>&1 || echo "Default config"

            echo ""
            echo "=== ACTIVE CONNECTIONS ==="
            ss -tlnp | grep :22

            echo ""
            echo "=== HOSTS.DENY ==="
            cat /etc/hosts.deny 2>/dev/null | grep -v "^#" | grep -v "^$" || echo "Empty or not present"

            echo ""
            echo "=== DENYHOSTS ==="
            if [ -f /etc/hosts.deny ]; then
              # Remove any entries blocking SSH
              sed -i '/sshd/d' /etc/hosts.deny 2>/dev/null && echo "Cleaned hosts.deny" || true
            fi

            echo ""
            echo "=== RESTARTING SSHD ==="
            systemctl restart sshd
            echo "SSHD restarted"

            echo ""
            echo "=== FINAL STATUS ==="
            ss -tlnp | grep :22
            echo "DONE - Try SSH again"
