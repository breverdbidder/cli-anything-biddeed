name: "SHARD Liberty County Clerk Foreclosure/Tax-Deed Scraper"
# Real, unauthenticated, server-rendered clerk pages — no WAF, no login.
# liberty.realforeclose.com / liberty.realtaxdeed.com are confirmed NOT
# provisioned RealAuction tenants for Liberty (generic shell page, zero
# occurrences of "liberty" in response body, sample listings are from
# Maryland/NJ counties). Real source is the Liberty County Clerk's own
# site — foreclosure sales are held in-person at 11:00 AM on the
# courthouse front steps (same in-person pattern as Brevard/Lake/Hernando).
#
# Sources:
#   https://libertyclerk.com/courts/foreclosure-sales/
#   https://libertyclerk.com/courts/tax-deeds/
# Investigated + wired: 2026-07-03

on:
  schedule:
    - cron: '30 8 * * *'   # daily 08:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse only, no DB writes)'
        required: false
        default: 'false'

jobs:
  scrape:
    name: "Scrape Liberty Clerk foreclosure + tax-deed calendars"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Scrape + upsert real auction entries"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            python3 scripts/shard_liberty_clerk_scraper.py --dry-run
          else
            python3 scripts/shard_liberty_clerk_scraper.py
          fi

      - name: "Verify: row count for liberty"
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.liberty&select=case_number,sale_type,auction_date&limit=10")
          COUNT=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$RESP")
          echo "### SQL VERIFICATION: liberty auctions" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT case_number, sale_type, auction_date FROM multi_county_auctions WHERE county='liberty' LIMIT 10;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- sample rows: $RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::liberty: $COUNT sample rows verified present"
