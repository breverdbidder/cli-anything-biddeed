name: "Stripe Setup — Products + Prices + Webhook → Supabase"
# Zero-HITL: creates 4 BidDeed products, monthly/annual/S5-metered prices,
# registers webhook at biddeed.ai/api/stripe/webhook, updates stripe_products table.
# Table creation handled inside stripe-setup.js via Supabase Management API.
#
# Surface to Ariel ONLY if STRIPE_SECRET_KEY missing from secrets.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — skip Stripe API calls, only verify secrets present"
        required: false
        default: "false"
        type: string

jobs:
  # ── P1: Create Stripe objects + update Supabase ─────────────────────────────
  stripe-create:
    name: "P1 — Stripe API + Supabase"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard — STRIPE_SECRET_KEY must be set
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "${STRIPE_SECRET_KEY}" ]; then
            echo "::error::STRIPE_SECRET_KEY secret is not set. Add it at Settings → Secrets → Actions."
            exit 1
          fi
          FIRST6=$(echo "${STRIPE_SECRET_KEY}" | cut -c1-6)
          echo "STRIPE_SECRET_KEY present (first 6 chars: ${FIRST6}...)"

      - name: Install stripe SDK
        run: npm install stripe --no-save

      - name: Run stripe-setup.js
        if: ${{ inputs.dry_run != 'true' }}
        env:
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/stripe-setup.js 2>&1 | tee /tmp/stripe-setup.log

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "DRY_RUN=true — secrets verified, Stripe API calls skipped."

      - name: Store STRIPE_WEBHOOK_SECRET
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          if [ -f /tmp/stripe_webhook_secret ]; then
            SECRET=$(cat /tmp/stripe_webhook_secret)
            echo "$SECRET" | gh secret set STRIPE_WEBHOOK_SECRET \
              --repo breverdbidder/cli-anything-biddeed && \
              echo "✅ STRIPE_WEBHOOK_SECRET stored in GitHub Secrets" || \
              echo "::warning::gh secret set failed — copy STRIPE_WEBHOOK_SECRET from the log above manually"
          else
            echo "::warning::/tmp/stripe_webhook_secret not found — check stripe-setup.js output"
          fi

  # ── P2: SHIP GATE verification ──────────────────────────────────────────────
  verify:
    name: "P2 — SHIP GATE verification"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: stripe-create
    if: ${{ inputs.dry_run != 'true' }}
    steps:
      - name: Query stripe_products
        run: |
          ROWS=$(curl -sf \
            "${{ secrets.SUPABASE_URL }}/rest/v1/stripe_products?select=tier_id,product_id,stripe_price_id_monthly,stripe_price_id_annual,stripe_s5_price_id,live_mode&order=tier_id" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          echo "### SQL VERIFICATION"
          echo '```'
          echo "SELECT tier_id, product_id, stripe_price_id_monthly, stripe_s5_price_id FROM stripe_products ORDER BY tier_id;"
          echo ""
          echo "$ROWS" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          pending = [r for r in rows if r.get('product_id','PENDING') == 'PENDING']
          for r in rows:
            print(f\"  {r['tier_id']:<12} prod={r['product_id']}  monthly={r['stripe_price_id_monthly']}  s5={r['stripe_s5_price_id']}\")
          print()
          if pending:
            print(f'FAIL: {len(pending)} tiers still PENDING: {[r[\"tier_id\"] for r in pending]}')
            sys.exit(1)
          print('PASS: All 4 tiers have real prod_xxx IDs')
          print(f'Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)')
          "
          echo '```'
