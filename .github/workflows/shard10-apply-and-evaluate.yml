name: "Shard-10: Apply volusia+hamilton migrations and evaluate"
# dispatch_id: 056047c1-7d6b-4a2b-8122-831715b1b406
# Issue: #13506
# Applies:
#   migrations/20260723_volusia_g_i_zoning_real_substrate.sql
#   migrations/20260723_hamilton_i_property_card_enrichment.sql
# Then runs pencil_dod_evaluate_county for volusia + hamilton
# and posts results back to issue #13506.

on:
  workflow_dispatch:

jobs:
  apply-and-evaluate:
    name: "Apply shard-10 migrations + evaluate"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SB_URL: ${{ secrets.SUPABASE_URL }}
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: mocerqjnksmhcjzxrewo
      GH_TOKEN: ${{ secrets.GH_PAT_FULL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/issue-13506-20260723-1601

      - name: "Migration 1: Volusia G+I zoning substrate"
        run: |
          set -euo pipefail
          echo "=== 20260723_volusia_g_i_zoning_real_substrate.sql ==="
          python3 -c "
          import json, sys
          sql = open('migrations/20260723_volusia_g_i_zoning_real_substrate.sql').read()
          print(json.dumps({'query': sql}))
          " > /tmp/vol_payload.json
          HTTP=$(curl -sS -o /tmp/vol_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vol_payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/vol_resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Volusia migration failed HTTP $HTTP"; exit 1; }
          echo "Volusia migration OK"

      - name: "Migration 2: Hamilton I property card enrichment"
        run: |
          set -euo pipefail
          echo "=== 20260723_hamilton_i_property_card_enrichment.sql ==="
          python3 -c "
          import json, sys
          sql = open('migrations/20260723_hamilton_i_property_card_enrichment.sql').read()
          print(json.dumps({'query': sql}))
          " > /tmp/ham_payload.json
          HTTP=$(curl -sS -o /tmp/ham_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ham_payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/ham_resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Hamilton migration failed HTTP $HTTP"; exit 1; }
          echo "Hamilton migration OK"

      - name: "Evaluate volusia + hamilton"
        id: evaluate
        run: |
          set -euo pipefail

          rpc() {
            local county="$1"
            local sql="SELECT public.pencil_dod_evaluate_county('${county}');"
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/eval_payload.json
            HTTP=$(curl -sS -o /tmp/eval_resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/eval_payload.json)
            echo "Evaluate ${county} HTTP: $HTTP"
            cat /tmp/eval_resp.json
            echo
          }

          rpc volusia  | tee /tmp/volusia_eval.json
          rpc hamilton | tee /tmp/hamilton_eval.json

      - name: "Run shard10 hamilton enrichment script"
        continue-on-error: true
        run: |
          python3 scripts/shard10_hamilton_i_audit_and_enrichment.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "Run volusia GIS harvest"
        continue-on-error: true
        run: |
          python3 scripts/shard10_volusia_g_i_real_gis_harvest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "Final evaluation after script runs"
        id: final_eval
        run: |
          set -euo pipefail

          rpc() {
            local county="$1"
            local sql="SELECT public.pencil_dod_evaluate_county('${county}');"
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/eval_payload.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/eval_payload.json
          }

          echo "VOLUSIA_AFTER=$(rpc volusia)" >> $GITHUB_OUTPUT
          echo "HAMILTON_AFTER=$(rpc hamilton)" >> $GITHUB_OUTPUT

      - name: "Post results to issue #13506"
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VOLUSIA_AFTER='${{ steps.final_eval.outputs.VOLUSIA_AFTER }}'
          HAMILTON_AFTER='${{ steps.final_eval.outputs.HAMILTON_AFTER }}'

          BODY="## SHARD-10 Applied + Evaluated — ${NOW}

          dispatch_id: 056047c1-7d6b-4a2b-8122-831715b1b406

          ### Migrations Applied
          - \`migrations/20260723_volusia_g_i_zoning_real_substrate.sql\` ✅
          - \`migrations/20260723_hamilton_i_property_card_enrichment.sql\` ✅

          ### Evaluator Results (post-migration)

          **Volusia:**
          \`\`\`json
          ${VOLUSIA_AFTER}
          \`\`\`

          **Hamilton:**
          \`\`\`json
          ${HAMILTON_AFTER}
          \`\`\`

          ### SQL VERIFICATION
          \`\`\`sql
          SELECT public.pencil_dod_evaluate_county('volusia');
          SELECT public.pencil_dod_evaluate_county('hamilton');
          \`\`\`

          GHA run: \${{ github.run_id }}
          "

          gh issue comment 13506 \
            --repo breverdbidder/cli-anything-biddeed \
            --body "$BODY"
