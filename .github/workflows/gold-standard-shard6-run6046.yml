name: "Gold Standard SHARD-6 run-6046: walton/okeechobee/gulf"

# dispatch_id: fd6f48d0-e8ef-411f-93ad-e77c345ae5ff
# Counties: walton (G fails), okeechobee (C/D/I fail), gulf (H/structural fail)
#
# WIRING MANDATE: This workflow executes the migration, runs pencil_dod_evaluate_county,
# and reports before/after JSON as required by VERIFICATION PROTOCOL.
#
# Structural blockers (no fix possible):
#   gulf B/F: OCRS Cloudflare Turnstile (sitekey 0x4AAAAAAAR0Af-5MfzdbO3p) — verified 4th firing
#   gulf C/D/E: 3 null-parcel cases (232019CA000060, 232024CA000072, 232024CC000157) — ceiling 78.6%
#   gulf I: 7/14=50% — ceiling without human action (PSJ PDF, 3 null-parcel, 2 addressless)
#   okeechobee I residual: 4 rows blocked (Turnstile/CAPTCHA/GIS) — sessions 1-3 exhausted

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/20260723_gold_standard_shard6_walton_okeechobee_gulf.sql'

concurrency:
  group: gold-standard-shard6-run6046
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: "Apply migration + evaluate walton/okeechobee/gulf"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: "BEFORE: pencil_dod_evaluate_county for all 3 counties"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, httpx, json

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          SB_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SB_KEY = os.environ.get('SUPABASE_KEY', '')
          MGMT = f"https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          MGMT_H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          RPC_H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          client = httpx.Client(timeout=120)

          print("=== BEFORE MIGRATION: pencil_dod_evaluate_county ===")
          for county in ["walton", "okeechobee", "gulf"]:
              r = client.post(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
                              headers=RPC_H,
                              json={"p_county": county})
              result = r.json() if r.status_code in (200, 201) else {"error": r.status_code}
              total = sum(1 for l in "ABCDEFGHIJ" if isinstance(result.get(l), dict) and result[l].get("pass"))
              print(f"\n{county} BEFORE ({total}/10):")
              print(json.dumps(result, indent=2, default=str))
          PYEOF

      - name: "Apply migration: 20260723_gold_standard_shard6_walton_okeechobee_gulf.sql"
        run: |
          set -euo pipefail
          SQL=$(cat migrations/20260723_gold_standard_shard6_walton_okeechobee_gulf.sql)
          python3 - <<PYEOF
          import os, httpx, json

          TOKEN = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          MGMT = "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          with open("migrations/20260723_gold_standard_shard6_walton_okeechobee_gulf.sql") as f:
              sql = f.read()

          r = httpx.post(MGMT, headers=H, json={"query": sql}, timeout=120)
          print(f"Migration HTTP: {r.status_code}")
          try:
              result = r.json()
              if isinstance(result, list):
                  for row in result[:20]:
                      print(" ", row)
              else:
                  print(json.dumps(result, indent=2, default=str)[:2000])
          except Exception as e:
              print(f"Parse error: {e}")
              print(r.text[:1000])

          if r.status_code not in (200, 201):
              import sys
              sys.exit(1)

          print("Migration applied successfully.")
          PYEOF

      - name: "AFTER: pencil_dod_evaluate_county + write session summary"
        run: |
          python3 - <<'PYEOF'
          import os, httpx, json
          from datetime import datetime, timezone

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          SB_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SB_KEY = os.environ.get('SUPABASE_KEY', '')
          MGMT = f"https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          MGMT_H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          RPC_H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          client = httpx.Client(timeout=120)
          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          print("=== AFTER MIGRATION: pencil_dod_evaluate_county ===")
          after_results = {}
          for county in ["walton", "okeechobee", "gulf"]:
              r = client.post(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
                              headers=RPC_H,
                              json={"p_county": county})
              result = r.json() if r.status_code in (200, 201) else {"error": r.status_code}
              after_results[county] = result
              total = sum(1 for l in "ABCDEFGHIJ" if isinstance(result.get(l), dict) and result[l].get("pass"))
              print(f"\n{county} AFTER ({total}/10):")
              print(json.dumps(result, indent=2, default=str))

          # Verification summary
          print("\n\n=== SQL VERIFICATION ===")
          print(f"-- Run timestamp: {now_utc}")
          print(f"-- dispatch_id: fd6f48d0-e8ef-411f-93ad-e77c345ae5ff")

          r = client.post(MGMT, headers=MGMT_H, json={"query": """
            SELECT
              lower(county) AS county,
              COUNT(*) AS total,
              COUNT(*) FILTER (WHERE parity_status = 'matched_clean') AS matched_clean,
              ROUND(100.0 * COUNT(*) FILTER (WHERE parity_status = 'matched_clean') / NULLIF(COUNT(*),0), 1) AS pct_c,
              MAX(last_seen_at) AS latest_last_seen,
              ROUND(EXTRACT(EPOCH FROM (NOW() - MAX(last_seen_at))) / 3600, 1) AS h_hours
            FROM multi_county_auctions
            WHERE lower(county) IN ('walton', 'okeechobee', 'gulf')
            GROUP BY lower(county)
            ORDER BY lower(county)
          """}, timeout=60)
          print("\n-- C/D parity + H freshness verification:")
          for row in (r.json() if r.status_code in (200,201) else []):
              print(f"   {row}")

          # Ultraloop audit check
          r2 = client.post(MGMT, headers=MGMT_H, json={"query": """
            SELECT county_slug, letter, survived, created_at
            FROM gold_standard_ultraloop_audit
            WHERE dispatch_id = 'fd6f48d0-e8ef-411f-93ad-e77c345ae5ff'
            ORDER BY county_slug, letter
          """}, timeout=30)
          print("\n-- Ultraloop audit rows for this dispatch:")
          for row in (r2.json() if r2.status_code in (200,201) else []):
              print(f"   {row}")

          # Print final scoreboard summary
          print("\n\n=== FINAL SCOREBOARD ===")
          for county in ["walton", "okeechobee", "gulf"]:
              result = after_results[county]
              passing = [l for l in "ABCDEFGHIJ" if isinstance(result.get(l), dict) and result[l].get("pass")]
              failing = [l for l in "ABCDEFGHIJ" if not (isinstance(result.get(l), dict) and result[l].get("pass"))]
              total = len(passing)
              print(f"  {county}: {total}/10 | PASS={','.join(passing)} | FAIL={','.join(failing)}")
              for l in failing:
                  item = result.get(l, {})
                  if isinstance(item, dict):
                      print(f"    {l}: {item.get('metric')} [{item.get('detail','')}]")
          PYEOF

      - name: "Walton G: ArcGIS zoning backfill for new parcels"
        run: |
          python3 - <<'PYEOF'
          import os, httpx, json, time
          from datetime import datetime, date, timezone

          SB_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SB_KEY = os.environ.get('SUPABASE_KEY', '')
          RPC_H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          client = httpx.Client(timeout=60)

          # Get walton rows that need parcel_zones (card not complete, density G failing)
          # walton uses EnerGov ArcGIS: services1.arcgis.com/TaXHPwWfIMuzJ7Ov
          ENERG0V_BASE = "https://services1.arcgis.com/TaXHPwWfIMuzJ7Ov/arcgis/rest/services/EnerGov/FeatureServer"
          ENERG0V_PARCELS = f"{ENERG0V_BASE}/4/query"
          ENERG0V_ZONING  = f"{ENERG0V_BASE}/19/query"

          DISPATCH_ID = "fd6f48d0-e8ef-411f-93ad-e77c345ae5ff"

          WALTON_JURS = {
              1333: "Unincorporated Walton County",
              842:  "DeFuniak Springs",
              861:  "Freeport",
              1146: "Paxton",
          }

          CATEGORY_MAP = {
              "Rural Low Density": "residential",
              "Rural Residential": "residential",
              "Rural Village": "mixed",
              "General Agriculture": "agricultural",
              "Residential Preservation": "residential",
              "Conservation": "conservation",
              "Coastal Center": "mixed",
              "Village Mixed Use": "mixed",
              "Municipal": "deferred",
              "Commercial": "commercial",
              "Industrial": "industrial",
              "Planned Unit Development": "mixed",
              "PUD": "mixed",
          }

          def sb_get(table, params):
              qs = "&".join(f"{k}={v}" for k,v in params.items())
              r = client.get(f"{SB_URL}/rest/v1/{table}?{qs}", headers=RPC_H)
              return r.json() if r.status_code in (200, 201) else []

          def sb_patch(table, fq, body):
              r = client.patch(f"{SB_URL}/rest/v1/{table}?{fq}",
                               json=body,
                               headers={**RPC_H, "Prefer": "return=minimal"})
              return r.status_code

          def sb_post(table, body, prefer="return=minimal"):
              r = client.post(f"{SB_URL}/rest/v1/{table}",
                              json=body,
                              headers={**RPC_H, "Prefer": prefer})
              return r.status_code, r.text[:200]

          # Get walton MCA rows needing parcel_zones
          # (rows with parcel_id but not in parcel_zones for walton jurs)
          existing_pz = sb_get("parcel_zones", {
              "select": "parcel_id",
              "jurisdiction_id": "in.(1333,842,861,1146)",
              "limit": "500"
          })
          already_zoned = {r["parcel_id"] for r in existing_pz}
          print(f"walton parcel_zones already present: {len(already_zoned)}")

          # Get walton auctions with parcel_id not yet zoned
          walton_rows = sb_get("multi_county_auctions", {
              "select": "id,case_number,parcel_id,latitude,longitude,assessed_value,market_value,property_address",
              "county": "eq.walton",
              "parcel_id": "not.is.null",
              "limit": "100"
          })
          unzoned = [r for r in walton_rows if r.get("parcel_id") and r["parcel_id"] not in already_zoned
                     and r.get("parcel_id") not in ("MULTIPLE PARCELS", "TIMESHARE", "Property Appraiser")]
          print(f"walton rows needing parcel_zones: {len(unzoned)}")

          if not unzoned:
              print("All walton parcels already zoned — G should be 100%. Nothing to do.")
              exit(0)

          def fetch_arcgis_zone(lat, lon):
              try:
                  r = client.get(ENERG0V_ZONING, params={
                      "geometry": f"{lon},{lat}",
                      "geometryType": "esriGeometryPoint",
                      "spatialRel": "esriSpatialRelIntersects",
                      "outFields": "ZONE_CLASS",
                      "inSR": "4326",
                      "f": "json"
                  }, timeout=15,
                  headers={"User-Agent": "BidDeed-Shard6/1.0; contact:ariel@everestcapitalusa.com"})
                  features = r.json().get("features", [])
                  if features:
                      return (features[0].get("attributes", {}).get("ZONE_CLASS") or "").strip() or None
              except Exception as e:
                  print(f"    EnerGov Zoning error for ({lat},{lon}): {e}")
              return None

          def fetch_arcgis_parcel(parcel_id):
              try:
                  r = client.get(ENERG0V_PARCELS, params={
                      "where": f"PARCELNO='{parcel_id}'",
                      "outFields": "PARCELNO,OWNER_NAME,APPRAISED_VALUE,JUST_VALUE",
                      "returnGeometry": "true",
                      "geometryType": "esriGeometryPolygon",
                      "outSR": "4326",
                      "f": "json"
                  }, timeout=15,
                  headers={"User-Agent": "BidDeed-Shard6/1.0; contact:ariel@everestcapitalusa.com"})
                  features = r.json().get("features", [])
                  if not features:
                      return None
                  feat = features[0]
                  geo = feat.get("geometry", {})
                  rings = geo.get("rings", [])
                  if not rings:
                      return None
                  flat = [pt for ring in rings for pt in ring]
                  centroid_lon = sum(p[0] for p in flat) / len(flat)
                  centroid_lat = sum(p[1] for p in flat) / len(flat)
                  attrs = feat.get("attributes", {})
                  def _to_num(v):
                      try:
                          return float(v) if v not in (None, "", "0") else None
                      except (TypeError, ValueError):
                          return None
                  return {
                      "centroid_lat": centroid_lat,
                      "centroid_lon": centroid_lon,
                      "assessed_value": _to_num(attrs.get("APPRAISED_VALUE")),
                      "market_value": _to_num(attrs.get("JUST_VALUE")),
                  }
              except Exception as e:
                  print(f"    EnerGov Parcels error for {parcel_id}: {e}")
              return None

          def ensure_zoning_district(jur_id, zone_code):
              existing = sb_get("zoning_districts", {
                  "select": "id",
                  "jurisdiction_id": f"eq.{jur_id}",
                  "code": f"eq.{zone_code}",
                  "limit": "1"
              })
              if existing:
                  return existing[0]["id"]
              category = CATEGORY_MAP.get(zone_code, "residential")
              status, resp = sb_post("zoning_districts", {
                  "jurisdiction_id": jur_id,
                  "code": zone_code,
                  "name": zone_code,
                  "category": category,
                  "ordinance_section": "2018-29",
                  "description": f"walton_enerGov_arcgis/shard6_run6046_{DISPATCH_ID[:8]}"
              }, prefer="resolution=merge-duplicates,return=representation")
              if status in (200, 201):
                  rows = json.loads(resp) if isinstance(resp, str) else []
                  if rows:
                      return rows[0]["id"] if isinstance(rows, list) else None
              return None

          zoned_new = 0
          geo_filled = 0
          value_filled = 0

          for row in unzoned[:20]:  # process up to 20 new unzoned rows
              pid = row.get("parcel_id")
              if not pid:
                  continue
              print(f"  Processing {row['case_number']} parcel={pid}")
              time.sleep(0.3)  # rate limit

              lat = row.get("latitude")
              lon = row.get("longitude")
              aval = row.get("assessed_value")
              mval = row.get("market_value")

              # If no geo, fetch from ArcGIS
              if not lat or not lon:
                  parcel_info = fetch_arcgis_parcel(pid)
                  if parcel_info:
                      lat = parcel_info["centroid_lat"]
                      lon = parcel_info["centroid_lon"]
                      patch = {"updated_at": "now()", "latitude": lat, "longitude": lon}
                      if not aval and parcel_info.get("assessed_value"):
                          patch["assessed_value"] = parcel_info["assessed_value"]
                          value_filled += 1
                      if not mval and parcel_info.get("market_value"):
                          patch["market_value"] = parcel_info["market_value"]
                      sb_patch("multi_county_auctions", f"id=eq.{row['id']}", patch)
                      geo_filled += 1
                      print(f"    geo filled: ({lat:.6f},{lon:.6f})")
                  else:
                      print(f"    SKIP: no parcel info from EnerGov for {pid}")
                      continue

              if not lat or not lon:
                  print(f"    SKIP: no lat/lon available for {pid}")
                  continue

              zone_class = fetch_arcgis_zone(lat, lon)
              print(f"    zone={zone_class!r}")
              if not zone_class:
                  continue

              jur_id = 842 if zone_class == "Municipal" else 1333

              try:
                  ensure_zoning_district(jur_id, zone_class)
                  status, resp = sb_post("parcel_zones", {
                      "parcel_id": pid,
                      "tax_account": pid,
                      "jurisdiction_id": jur_id,
                      "zone_code": zone_class,
                      "source": f"walton_enerGov_arcgis/shard6_run6046_{date.today().isoformat()}",
                      "effective_date": "2018-12-11",
                  }, prefer="resolution=ignore-duplicates,return=minimal")
                  already_zoned.add(pid)
                  zoned_new += 1
                  print(f"    parcel_zones inserted: {pid} -> jur={jur_id} zone={zone_class}")
              except Exception as e:
                  print(f"    ERROR zoning {pid}: {e}")

              time.sleep(0.2)

          print(f"\nwalton G fix: zoned_new={zoned_new} geo_filled={geo_filled} value_filled={value_filled}")

          if unzoned and zoned_new == 0 and geo_filled == 0:
              print("WARNING: Processed unzoned rows but wrote 0 — check EnerGov endpoint availability")
          PYEOF

      - name: "FINAL: pencil_dod_evaluate_county after all fixes"
        run: |
          python3 - <<'PYEOF'
          import os, httpx, json
          from datetime import datetime, timezone

          SB_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SB_KEY = os.environ.get('SUPABASE_KEY', '')
          RPC_H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          client = httpx.Client(timeout=120)
          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          print(f"### SQL VERIFICATION — SHARD-6 run-6046")
          print(f"Timestamp UTC: {now_utc}")
          print(f"dispatch_id: fd6f48d0-e8ef-411f-93ad-e77c345ae5ff")
          print()

          final = {}
          for county in ["walton", "okeechobee", "gulf"]:
              r = client.post(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
                              headers=RPC_H,
                              json={"p_county": county})
              result = r.json() if r.status_code in (200, 201) else {"error": r.status_code}
              final[county] = result
              passing = [l for l in "ABCDEFGHIJ" if isinstance(result.get(l), dict) and result[l].get("pass")]
              failing = [l for l in "ABCDEFGHIJ" if not (isinstance(result.get(l), dict) and result[l].get("pass"))]
              total = len(passing)
              print(f"SELECT public.pencil_dod_evaluate_county('{county}');")
              print(f"-- {county}: {total}/10")
              print(json.dumps(result, indent=2, default=str))
              print()

          print("=== SCOREBOARD ===")
          for county in ["walton", "okeechobee", "gulf"]:
              result = final[county]
              passing = [l for l in "ABCDEFGHIJ" if isinstance(result.get(l), dict) and result[l].get("pass")]
              failing = [l for l in "ABCDEFGHIJ" if not (isinstance(result.get(l), dict) and result[l].get("pass"))]
              total = len(passing)
              print(f"  {county}: {total}/10 | PASS=[{','.join(passing)}] | FAIL=[{','.join(failing)}]")
          PYEOF
