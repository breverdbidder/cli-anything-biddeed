name: Apply worker palette sweep (one-shot)

# Dispatch-only: src/worker.js is 770 KB, too large to push through
# the Git Data API from the session that authored the mapping, so the
# deterministic mapping script is committed instead and this workflow applies
# it on the branch it is dispatched on, verifies the file still parses, and
# pushes the result as a commit on that same branch. The script is idempotent
# (exits 0 with "already applied" on a second run) and asserts that zero
# off-palette literals remain. Later passes are separate scripts selected by
# the `script` input; every script stays in the repo as the record of its
# mapping.
on:
  workflow_dispatch:
    inputs:
      script:
        description: script under scripts/ui-audit/ to apply to src/worker.js
        default: apply_worker_palette.py
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply ${{ inputs.script }} to src/worker.js
        run: python3 "scripts/ui-audit/${{ inputs.script }}" src/worker.js
      - name: Worker still parses
        run: node --check src/worker.js
      - name: Commit + push onto ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/worker.js; then echo "no change"; exit 0; fi
          git add src/worker.js
          git commit -m "fix(palette): apply scripts/ui-audit/${{ inputs.script }} to src/worker.js" \
            -m "Deterministic, idempotent rewrite applied by the apply-worker-palette workflow (src/worker.js is too large to push through the Git Data API from the authoring session). See the script's docstring for what and why." \
            -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01JzwC1tRbEaNuh1o4vvoCpV"
          git push origin HEAD:${{ github.ref_name }}
