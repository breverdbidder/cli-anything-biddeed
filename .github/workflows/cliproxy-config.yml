name: cliproxy config inspect — why connection reset
on:
  workflow_dispatch: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SSH
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: config.yaml contents (redact API keys) ==="
          $SSH 'docker exec biddeed-cliproxy cat /data/config.yaml 2>&1 | sed -E "s/(api[_-]?key|token|secret)[[:space:]]*[:=][[:space:]]*[^[:space:]]+/\1: <REDACTED>/gi"'

          echo
          echo "=== B: what port is cliproxy actually listening on inside container ==="
          $SSH 'docker exec biddeed-cliproxy sh -c "netstat -tlnp 2>/dev/null || ss -tlnp 2>/dev/null" 2>&1 | head -20'

          echo
          echo "=== C: process table inside cliproxy ==="
          $SSH 'docker exec biddeed-cliproxy sh -c "ps auxf 2>/dev/null || ps -ef 2>/dev/null" 2>&1 | head -20'

          echo
          echo "=== D: recent container logs (last 80 lines) ==="
          $SSH 'docker logs --tail 80 biddeed-cliproxy 2>&1 | tail -80'

          echo "=== END ==="
