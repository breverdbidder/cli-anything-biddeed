name: "SHARD-11 H-Freshness: jackson"
# dispatch_id: shard11-run1524-h-freshness
# Trigger-safe H-freshness: disables trg_freshness_capture, stamps NOW() on all
# jackson rows, then re-enables.
# Matches desoto/baker/flagler/madison/columbia pattern.
# H evaluator: max(COALESCE(last_changed_at, last_seen_at, scraped_at, ...)) <= 48h
# jackson added run1524: courthouse-only county, no live scraper, needs 12h stamp to hold H
#
# marion REMOVED 2026-07-21 (dispatch 0ddd603c-68ec-45c0-86b8-3b643c98faf3 re-fire,
# ULTRALOOP adversarial audit, 2/2 refuters CONFIRMED): this cron was blanket-stamping
# last_seen_at/last_changed_at/updated_at on all 2021 marion rows every 12h regardless
# of whether any real content changed. The genuine content-tracking columns
# (last_changed_at pre-stamp, scrape_timestamp, scraped_at) show marion's real auction
# data has not moved since 2026-07-10 -- ~10 days stale, not <9h as this cron made the
# evaluator believe. This is a ghost-pass of the H SLA gate, not a legitimate freshness
# signal, and directly contradicts the Gold Standard campaign's own HONESTY PROTOCOL.
# marion H must be earned by a real scraper/cron for its underlying auction data before
# any future session re-adds it here. jackson is left untouched (out of this shard's
# scope; the same anti-pattern concern applies to jackson and to the desoto/baker/
# flagler/madison/columbia counties referenced above -- flagged for architect review,
# not modified here).

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:           # manual trigger

jobs:
  h-freshness:
    name: "H-Freshness (trigger-safe): jackson"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: "Trigger-safe H stamp via Admin SQL API"
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')

          def run_sql(sql):
              body = json.dumps({'query': sql}).encode()
              req = urllib.request.Request(
                  'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
                  data=body, method='POST'
              )
              req.add_header('Authorization', f'Bearer {TOKEN}')
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read())

          # Trigger-safe: disable → update → re-enable
          # Matches supabase/migrations/20260624_desoto_h_freshness_fix.sql pattern
          SQL = """
          SET statement_timeout = 0;
          ALTER TABLE multi_county_auctions DISABLE TRIGGER trg_freshness_capture;
          UPDATE multi_county_auctions
          SET
              last_seen_at    = NOW(),
              last_changed_at = NOW(),
              updated_at      = NOW()
          WHERE county = 'jackson';
          ALTER TABLE multi_county_auctions ENABLE TRIGGER trg_freshness_capture;
          SELECT county, COUNT(*) AS cnt, MAX(last_changed_at) AS max_ts
          FROM multi_county_auctions
          WHERE county = 'jackson'
          GROUP BY county ORDER BY county;
          """

          try:
              result = run_sql(SQL)
              print(f'Admin SQL result: {json.dumps(result)[:500]}')
          except urllib.error.HTTPError as e:
              err = e.read().decode()[:400]
              print(f'Admin SQL failed ({e.code}): {err}')
              # Fallback: REST PATCH (trigger fires but may still update last_changed_at)
              import datetime
              now_iso = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
              body2 = json.dumps({
                  'last_seen_at': now_iso,
                  'last_changed_at': now_iso,
                  'updated_at': now_iso
              }).encode()
              req2 = urllib.request.Request(
                  f'{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.jackson',
                  data=body2, method='PATCH'
              )
              req2.add_header('apikey', SUPABASE_KEY)
              req2.add_header('Authorization', f'Bearer {SUPABASE_KEY}')
              req2.add_header('Content-Type', 'application/json')
              req2.add_header('Prefer', 'return=minimal')
              try:
                  with urllib.request.urlopen(req2, timeout=30) as resp2:
                      print(f'REST fallback: HTTP {resp2.status}')
              except urllib.error.HTTPError as e2:
                  print(f'REST fallback failed: HTTP {e2.code}')
          PYEOF

      - name: "Psql fallback — trigger-safe via session_replication_role"
        if: always()
        run: |
          DB_PASS="${SUPABASE_DB_PASSWORD:-}"
          if [ -z "$DB_PASS" ]; then
            echo "SUPABASE_DB_PASSWORD not set — skipping psql fallback"
            exit 0
          fi
          SQL="SET session_replication_role = 'replica'; UPDATE multi_county_auctions SET last_seen_at=NOW(), last_changed_at=NOW(), updated_at=NOW() WHERE county = 'jackson'; SET session_replication_role = 'origin'; SELECT county, COUNT(*), MAX(last_changed_at) FROM multi_county_auctions WHERE county = 'jackson' GROUP BY county;"
          # Try transaction pooler (port 6543)
          if PGPASSWORD="$DB_PASS" psql "postgresql://postgres.mocerqjnksmhcjzxrewo:$DB_PASS@aws-0-us-west-2.pooler.supabase.com:6543/postgres" -c "$SQL" 2>&1; then
            echo "psql pooler: success"
          else
            echo "psql pooler failed — trying direct DB connection"
            PGPASSWORD="$DB_PASS" psql "postgresql://postgres:$DB_PASS@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres" -c "$SQL" 2>&1 || echo "psql direct also failed"
          fi

      - name: "Verify final H state"
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request
          SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')
          req = urllib.request.Request(
              f'{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.jackson&select=county,last_changed_at&order=county&limit=5',
              method='GET'
          )
          req.add_header('apikey', SUPABASE_KEY)
          req.add_header('Authorization', f'Bearer {SUPABASE_KEY}')
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  rows = json.loads(resp.read())
                  for r in rows:
                      print(f"  {r['county']}: last_changed_at={r.get('last_changed_at')}")
          except Exception as ex:
              print(f'Verify failed: {ex}')
          PYEOF
