name: Hetzner OAuth Refresh
# Apr 20 2026: non-browser OAuth refresh using the refreshToken already on disk.
# Uses client_id 9d1c250a-e61b-44d9-88ed-5944d1962f5e (Claude Code public PKCE client),
# posts refresh_token grant to Anthropic's token endpoint FROM HETZNER so that
# any IP-binding sticks to the runner's network context.
#
# Known risk: Cloudflare WAF has been 403-ing this refresh for some headless
# Linux VPSes (see anthropics/claude-code#47754). Try both token endpoints.
# Never prints token values.

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH to Hetzner and perform OAuth refresh
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Step 1: Backup current credentials ==="
          $SSH "cp -fv /root/.claude/.credentials.json /root/.claude/.credentials.json.pre-refresh.\$(date +%s) 2>&1" || true

          echo "=== Step 2: Extract refresh_token length (value stays on Hetzner) ==="
          $SSH "jq -r '.claudeAiOauth.refreshToken | length' /root/.claude/.credentials.json"

          echo "=== Step 3: POST to console.anthropic.com/v1/oauth/token (endpoint A) ==="
          # Heredoc keeps the refresh_token on the Hetzner side and never echoes it to GHA logs.
          # Captures HTTP status separately, only prints redacted response keys on success.
          $SSH 'bash -s' <<'REMOTE_A'
            set -eo pipefail
            REFRESH=$(jq -r '.claudeAiOauth.refreshToken' /root/.claude/.credentials.json)
            CLIENT_ID='9d1c250a-e61b-44d9-88ed-5944d1962f5e'
            PAYLOAD=$(jq -n --arg rt "$REFRESH" --arg cid "$CLIENT_ID" \
              '{grant_type:"refresh_token", refresh_token:$rt, client_id:$cid, scope:"user:profile user:inference user:sessions:claude_code user:mcp_servers"}')
            HTTP_CODE=$(curl -sS -o /tmp/oauth-resp-a.json -w '%{http_code}' \
              -X POST 'https://console.anthropic.com/v1/oauth/token' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'anthropic-beta: oauth-2025-04-20' \
              -H 'User-Agent: claude-code/2.1.104 (cli)' \
              -d "$PAYLOAD") || true
            echo "endpoint_a_http_code=$HTTP_CODE"
            echo "endpoint_a_resp_size=$(wc -c < /tmp/oauth-resp-a.json)"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "endpoint_a_result=SUCCESS"
              jq 'to_entries | map({k: .key, vtype: (.value | type), vlen: (.value | tostring | length)})' /tmp/oauth-resp-a.json || true
            else
              echo "endpoint_a_result=FAIL"
              echo "--- error body (first 300 chars) ---"
              head -c 300 /tmp/oauth-resp-a.json || true
              echo ""
            fi
          REMOTE_A

          echo ""
          echo "=== Step 4: If A failed, try platform.claude.com/v1/oauth/token (endpoint B) ==="
          $SSH 'bash -s' <<'REMOTE_B'
            set -eo pipefail
            if [ -f /tmp/oauth-resp-a.json ] && grep -q access_token /tmp/oauth-resp-a.json 2>/dev/null; then
              echo "endpoint_b_skipped=endpoint_a_succeeded"
              exit 0
            fi
            REFRESH=$(jq -r '.claudeAiOauth.refreshToken' /root/.claude/.credentials.json)
            CLIENT_ID='9d1c250a-e61b-44d9-88ed-5944d1962f5e'
            PAYLOAD=$(jq -n --arg rt "$REFRESH" --arg cid "$CLIENT_ID" \
              '{grant_type:"refresh_token", refresh_token:$rt, client_id:$cid, scope:"user:profile user:inference user:sessions:claude_code user:mcp_servers"}')
            HTTP_CODE=$(curl -sS -o /tmp/oauth-resp-b.json -w '%{http_code}' \
              -X POST 'https://platform.claude.com/v1/oauth/token' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'anthropic-beta: oauth-2025-04-20' \
              -H 'User-Agent: claude-code/2.1.104 (cli)' \
              -d "$PAYLOAD") || true
            echo "endpoint_b_http_code=$HTTP_CODE"
            echo "endpoint_b_resp_size=$(wc -c < /tmp/oauth-resp-b.json 2>/dev/null || echo 0)"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "endpoint_b_result=SUCCESS"
              jq 'to_entries | map({k: .key, vtype: (.value | type), vlen: (.value | tostring | length)})' /tmp/oauth-resp-b.json || true
            else
              echo "endpoint_b_result=FAIL"
              echo "--- error body (first 300 chars) ---"
              head -c 300 /tmp/oauth-resp-b.json || true
              echo ""
            fi
          REMOTE_B

          echo ""
          echo "=== Step 5: Rebuild .credentials.json from fresh token (if any endpoint succeeded) ==="
          $SSH 'bash -s' <<'REMOTE_APPLY'
            set -eo pipefail
            SRC=""
            if [ -f /tmp/oauth-resp-a.json ] && jq -e .access_token /tmp/oauth-resp-a.json >/dev/null 2>&1; then
              SRC=/tmp/oauth-resp-a.json
            elif [ -f /tmp/oauth-resp-b.json ] && jq -e .access_token /tmp/oauth-resp-b.json >/dev/null 2>&1; then
              SRC=/tmp/oauth-resp-b.json
            fi
            if [ -z "$SRC" ]; then
              echo "apply_result=NO_FRESH_TOKEN_AVAILABLE"
              exit 0
            fi
            echo "apply_source=$SRC"
            # Compute expiresAt ms from expires_in seconds
            EXPIRES_IN=$(jq -r '.expires_in // 3600' "$SRC")
            NOW_MS=$(($(date +%s) * 1000))
            EXPIRES_AT=$((NOW_MS + EXPIRES_IN * 1000))
            echo "new_expires_at_ms=$EXPIRES_AT"
            echo "new_expires_at_human=$(date -d @$((EXPIRES_AT/1000)) -u +%Y-%m-%dT%H:%M:%SZ)"
            # Preserve existing scopes / subscriptionType / rateLimitTier, substitute new tokens
            jq --slurpfile fresh "$SRC" --argjson expat "$EXPIRES_AT" '
              .claudeAiOauth.accessToken  = $fresh[0].access_token |
              .claudeAiOauth.refreshToken = ($fresh[0].refresh_token // .claudeAiOauth.refreshToken) |
              .claudeAiOauth.expiresAt    = $expat
            ' /root/.claude/.credentials.json > /tmp/creds-new.json
            # Verify the new file parses + has our expected keys
            jq 'to_entries | map({k: .key, vtype: (.value | type), vlen: (.value | tostring | length)})' /tmp/creds-new.json
            # Atomic swap
            install -m 600 /tmp/creds-new.json /root/.claude/.credentials.json
            rm -f /tmp/creds-new.json /tmp/oauth-resp-a.json /tmp/oauth-resp-b.json
            # Sync to summit user
            mkdir -p /home/summit/.claude
            cp -fv /root/.claude/.credentials.json /home/summit/.claude/.credentials.json
            cp -fv /root/.claude/.credentials.json /home/summit/.claude/credentials.json
            chown -R summit:summit /home/summit/.claude/.credentials.json /home/summit/.claude/credentials.json
            chmod 600 /home/summit/.claude/.credentials.json /home/summit/.claude/credentials.json
            echo "apply_result=SUCCESS"
            stat -c 'root:   mtime=%y size=%s' /root/.claude/.credentials.json
            stat -c 'summit: mtime=%y size=%s' /home/summit/.claude/.credentials.json
          REMOTE_APPLY

          echo ""
          echo "=== Step 6: Validate new creds with trivial claude -p ==="
          $SSH "sudo -u summit HOME=/home/summit timeout 60 claude -p 'Reply with exactly one word: ping' --model claude-sonnet-4-6 --max-turns 1 2>&1 | tail -10" || echo "claude -p validation: NONZERO EXIT"

          echo ""
          echo "=== Step 7: Final credentials mtime ==="
          $SSH "stat -c 'root:   mtime=%y size=%s' /root/.claude/.credentials.json"
          $SSH "stat -c 'summit: mtime=%y size=%s' /home/summit/.claude/.credentials.json"
