name: centroid-watchdog
# TEMPORARY — self-destructs on DoD.
#
# LAUNCH-E (#20039, 2026-09-05): slowed */20 -> every 2h at :11 (offset off
# the :00/:15/:30/:45 stampede marks) to cut DB restart load before launch.
# Revert to a tighter cadence after 2026-09-10 if centroid enrichment still
# needs active watchdog coverage.

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install deps
        run: pip install requests --quiet

      - name: Watch + auto-heal + self-destruct on DoD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.EVEREST_GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: breverdbidder/cli-anything-biddeed
        run: |
          python3 - <<'PYEOF'
          import os, requests, base64
          from datetime import datetime, timezone

          SB_URL  = os.environ["SUPABASE_URL"]
          SB_KEY  = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          GH_TOK  = os.environ.get("GH_TOKEN","")
          TG_BOT  = os.environ.get("TELEGRAM_BOT_TOKEN","")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID","")
          REPO    = os.environ["REPO"]
          SB_HDRS = {"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}",
                     "Content-Type":"application/json","Prefer":"return=minimal"}
          GH_HDRS = {"Authorization":f"Bearer {GH_TOK}","Accept":"application/vnd.github+json"}

          def tg(msg):
              if not TG_BOT or not TG_CHAT: return
              try: requests.post(f"https://api.telegram.org/bot{TG_BOT}/sendMessage",
                                 json={"chat_id":TG_CHAT,"text":msg,"parse_mode":"Markdown"},timeout=10)
              except: pass

          def dispatch():
              r = requests.post(
                  f"https://api.github.com/repos/{REPO}/actions/workflows/centroid-fdor-bulk.yml/dispatches",
                  headers=GH_HDRS, json={"ref":"main","inputs":{}}, timeout=15)
              return r.status_code

          def self_destruct():
              path = ".github/workflows/centroid-watchdog.yml"
              r = requests.get(f"https://api.github.com/repos/{REPO}/contents/{path}",
                               headers=GH_HDRS, timeout=15)
              if r.status_code != 200: return
              sha = r.json().get("sha")
              dead = "# centroid-watchdog RETIRED — DoD achieved\non:\n  workflow_dispatch: {}\njobs:\n  noop:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo retired\n"
              requests.put(f"https://api.github.com/repos/{REPO}/contents/{path}",
                           headers=GH_HDRS,
                           json={"message":"chore: retire centroid-watchdog — DoD achieved",
                                 "content":base64.b64encode(dead.encode()).decode(),
                                 "sha":sha,"branch":"main"}, timeout=15)

          # Pull state
          rows = requests.get(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                              headers={"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}"},
                              params={"select":"co_no,county_name,status,centroids_done,total_parcels,updated_at",
                                      "order":"co_no.asc"}).json()

          done    = [x for x in rows if x["status"]=="done"]
          errors  = [x for x in rows if x["status"]=="error"]
          running = [x for x in rows if x["status"]=="running"]
          pending = [x for x in rows if x["status"]=="pending"]
          tw = sum(x["centroids_done"] or 0 for x in rows)
          tp = sum(x["total_parcels"]  or 0 for x in rows)
          pct = tw/tp*100 if tp else 0

          print(f"done={len(done)}/67 running={len(running)} pending={len(pending)} errors={len(errors)} written={tw:,} ({pct:.1f}%)")

          # DoD check
          if len(done) == 67 and tw >= 9_500_000:
              print("DOD ACHIEVED")
              tg(f"🏆 *CENTROID ENRICHMENT COMPLETE*\n67/67 counties ✅\n{tw:,} centroids\nWatchdog retiring.")
              self_destruct()
              exit(0)

          # Auto-heal errors — NEVER zero centroids_done, preserve resume progress
          if errors:
              err_cos = [e["co_no"] for e in errors]
              print(f"AUTO-HEAL {len(errors)} errors: {err_cos}")
              requests.patch(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                             headers=SB_HDRS, params={"status":"eq.error"},
                             json={"status":"pending","error_msg":None,"updated_at":"now()"})
              http = dispatch()
              print(f"REDISPATCH → HTTP {http}")
              tg(f"🔄 *Centroid Watchdog*\nHealed {len(errors)} errors: {err_cos}\nRedispatch → {http}\n{tw:,}/{tp:,} ({pct:.1f}%)")

          # No runners + pending → redispatch
          elif not running and pending:
              print(f"NO RUNNERS {len(pending)} pending — redispatching")
              http = dispatch()
              tg(f"🔄 *Watchdog Redispatch*\n{len(pending)} pending, no runners → {http}")

          # Stall detection
          elif running:
              now = datetime.now(timezone.utc)
              stalled = []
              for r in running:
                  try:
                      dt = datetime.fromisoformat(r["updated_at"].replace("Z","+00:00"))
                      age = (now-dt).total_seconds()/60
                      if age > 40: stalled.append((r["co_no"],r["county_name"],round(age)))
                  except: pass
              if stalled:
                  print(f"STALL: {stalled}")
                  tg(f"⚠️ *Stall Detected*\n"+"\n".join(f"[{c}] {n} {m}min" for c,n,m in stalled))
                  http = dispatch()
                  print(f"REDISPATCH stalled → {http}")
              else:
                  print(f"NOMINAL {len(running)} running {pct:.1f}%")
          PYEOF
