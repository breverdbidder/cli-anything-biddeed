name: centroid-watchdog
# TEMPORARY — self-destructs on DoD. Do not extend scope.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install deps
        run: pip install requests --quiet

      - name: Watch + auto-heal + self-destruct on DoD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.EVEREST_GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: breverdbidder/cli-anything-biddeed
        run: |
          python3 - <<'PYEOF'
          import os, requests, json
          from datetime import datetime, timezone

          SB_URL  = os.environ["SUPABASE_URL"]
          SB_KEY  = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          GH_TOK  = os.environ.get("GH_TOKEN","")
          TG_BOT  = os.environ.get("TELEGRAM_BOT_TOKEN","")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID","")
          REPO    = os.environ["REPO"]
          SB_HDRS = {"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}",
                     "Content-Type":"application/json","Prefer":"return=minimal"}
          GH_HDRS = {"Authorization":f"Bearer {GH_TOK}","Accept":"application/vnd.github+json"}

          def tg(msg):
              if not TG_BOT or not TG_CHAT: return
              try: requests.post(f"https://api.telegram.org/bot{TG_BOT}/sendMessage",
                                 json={"chat_id":TG_CHAT,"text":msg,"parse_mode":"Markdown"},timeout=10)
              except: pass

          def dispatch_harvest():
              r = requests.post(
                  f"https://api.github.com/repos/{REPO}/actions/workflows/centroid-fdor-bulk.yml/dispatches",
                  headers=GH_HDRS, json={"ref":"main","inputs":{}}, timeout=15)
              return r.status_code

          def self_destruct():
              """Replace this file with dispatch-only version — kills the cron permanently."""
              import base64
              path = ".github/workflows/centroid-watchdog.yml"
              # Get current SHA for the file
              r = requests.get(f"https://api.github.com/repos/{REPO}/contents/{path}",
                               headers=GH_HDRS, timeout=15)
              if r.status_code != 200:
                  print(f"self_destruct: could not get file SHA: {r.status_code}")
                  return
              file_sha = r.json().get("sha")
              dead_yaml = "# centroid-watchdog RETIRED — DoD achieved\n# Cron disabled. Task complete.\non:\n  workflow_dispatch: {}\njobs:\n  noop:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo 'DoD achieved. This workflow is retired.'\n"
              payload = {
                  "message": "chore(centroid): retire watchdog — DoD 67/67 achieved",
                  "content": base64.b64encode(dead_yaml.encode()).decode(),
                  "sha": file_sha,
                  "branch": "main"
              }
              r2 = requests.put(f"https://api.github.com/repos/{REPO}/contents/{path}",
                                headers=GH_HDRS, json=payload, timeout=15)
              print(f"self_destruct commit → HTTP {r2.status_code}")
              return r2.status_code

          # ── Pull state ──────────────────────────────────────────────────────
          rows = requests.get(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                              headers={"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}"},
                              params={"select":"co_no,county_name,status,centroids_done,total_parcels,updated_at",
                                      "order":"co_no.asc"}).json()

          done    = [x for x in rows if x["status"]=="done"]
          errors  = [x for x in rows if x["status"]=="error"]
          running = [x for x in rows if x["status"]=="running"]
          pending = [x for x in rows if x["status"]=="pending"]
          tw = sum(x["centroids_done"] or 0 for x in rows)
          tp = sum(x["total_parcels"]  or 0 for x in rows)
          pct = tw/tp*100 if tp else 0

          print(f"done={len(done)}/67 running={len(running)} pending={len(pending)} errors={len(errors)} written={tw:,} ({pct:.1f}%)")

          # ── DoD check — verify then self-destruct ───────────────────────────
          if len(done) == 67 and tw >= 9_500_000:
              print("DOD ACHIEVED — firing Telegram + self-destructing cron")
              tg(f"🏆 *CENTROID ENRICHMENT COMPLETE*\n67/67 counties ✅\n{tw:,} centroids written\nDoD verified. Watchdog retiring.")
              code = self_destruct()
              print(f"Watchdog self-destruct: HTTP {code}")
              exit(0)

          # ── Auto-heal errors ────────────────────────────────────────────────
          if errors:
              err_cos = [e["co_no"] for e in errors]
              print(f"AUTO-HEAL: {len(errors)} errors → pending: {err_cos}")
              requests.patch(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                             headers=SB_HDRS, params={"status":"eq.error"},
                             json={"status":"pending","error_msg":None,
                                   "centroids_done":0,"updated_at":"now()"})
              http = dispatch_harvest()
              print(f"REDISPATCH → HTTP {http}")
              tg(f"🔄 *Centroid Watchdog*\nAuto-healed {len(errors)} errors: {err_cos}\nRedispatched → HTTP {http}\n{tw:,}/{tp:,} ({pct:.1f}%)")

          # ── No runners + pending remain → redispatch ────────────────────────
          elif not running and pending:
              print(f"NO RUNNERS, {len(pending)} pending — redispatching")
              http = dispatch_harvest()
              print(f"REDISPATCH → HTTP {http}")
              tg(f"🔄 *Centroid Watchdog — Redispatch*\nNo runners, {len(pending)} pending\n→ HTTP {http}")

          # ── Stall detection ─────────────────────────────────────────────────
          elif running:
              now = datetime.now(timezone.utc)
              stalled = []
              for r in running:
                  try:
                      dt = datetime.fromisoformat(r["updated_at"].replace("Z","+00:00"))
                      age = (now-dt).total_seconds()/60
                      if age > 30: stalled.append((r["co_no"],r["county_name"],round(age)))
                  except: pass
              if stalled:
                  print(f"STALL: {stalled}")
                  tg(f"⚠️ *Centroid Watchdog — Stall*\n" +
                     "\n".join(f"co_no={c} {n} stalled {m}min" for c,n,m in stalled))
              else:
                  print(f"NOMINAL — {len(running)} running, {pct:.1f}% complete")
          PYEOF
