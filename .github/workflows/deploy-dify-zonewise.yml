name: "Deploy ZoneWise Dify to Hetzner"

on:
  workflow_dispatch: {}

jobs:
  deploy-dify:
    name: "Deploy Dify ZoneWise"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: SSH Pre-flight + Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e

            echo "=== Pre-flight checks ==="
            free -h
            df -h /
            nproc
            docker ps -a 2>/dev/null | head -10 || echo "Docker not yet running"

            RAM_MB=$(free -m | awk '/Mem:/{print $2}')
            CPU=$(nproc)
            DISK=$(df / | awk 'NR==2{print int($4/1024/1024)}')
            echo "RAM: ${RAM_MB}MB | CPU: ${CPU} | Disk: ${DISK}GB free"

            if [ "${RAM_MB}" -lt 3500 ]; then echo "ERROR: need 4GB RAM, have ${RAM_MB}MB"; exit 1; fi
            if [ "${CPU}" -lt 2 ]; then echo "ERROR: need 2 CPU"; exit 1; fi
            if [ "${DISK}" -lt 10 ]; then echo "ERROR: need 10GB disk"; exit 1; fi
            echo "✅ Resources OK (${RAM_MB}MB RAM)"

            echo ""
            echo "=== Handle port 3100 conflict ==="
            if ss -tlnp | grep -q ':3100 '; then
              echo "Port 3100 is in use — checking what's running:"
              ss -tlnp | grep ':3100'
              # Stop paperclip deploy server if it's occupying port 3100
              if docker ps --format '{{.Names}} {{.Ports}}' | grep -q '3100'; then
                CONFLICT_CONTAINER=$(docker ps --format '{{.Names}} {{.Ports}}' | grep '3100' | awk '{print $1}')
                echo "Stopping container: ${CONFLICT_CONTAINER}"
                docker stop "${CONFLICT_CONTAINER}" || true
                echo "✅ Port 3100 freed"
              fi
            else
              echo "Port 3100 is free"
            fi

            echo ""
            echo "=== Docker setup ==="
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker && systemctl start docker
            fi
            docker --version

            echo ""
            echo "=== Clone ZoneWise Dify ==="
            if [ -d /opt/dify-zonewise ]; then
              cd /opt/dify-zonewise
              git pull origin main 2>/dev/null || git pull origin master 2>/dev/null || true
            else
              git clone --depth 1 https://github.com/breverdbidder/dify-zonewise.git /opt/dify-zonewise \
                || git clone --depth 1 https://github.com/langgenius/dify.git /opt/dify-zonewise
            fi
            cd /opt/dify-zonewise/docker

            echo ""
            echo "=== Configure .env ==="
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            SECRET=$(openssl rand -hex 32)
            sed -i "s/SECRET_KEY=.*/SECRET_KEY=${SECRET}/" .env
            grep -q "^INIT_PASSWORD=" .env && sed -i "s/^INIT_PASSWORD=.*/INIT_PASSWORD=zonewise2026/" .env || echo "INIT_PASSWORD=zonewise2026" >> .env
            grep -q "^CONSOLE_WEB_URL=" .env && sed -i "s|^CONSOLE_WEB_URL=.*|CONSOLE_WEB_URL=http://87.99.129.125:3100|" .env || echo "CONSOLE_WEB_URL=http://87.99.129.125:3100" >> .env
            grep -q "^VECTOR_STORE=" .env && sed -i "s/^VECTOR_STORE=.*/VECTOR_STORE=pgvector/" .env || echo "VECTOR_STORE=pgvector" >> .env

            echo ""
            echo "=== Configure nginx port 3100 ==="
            if grep -q "80:80" docker-compose.yaml 2>/dev/null; then
              sed -i 's/80:80/3100:80/g' docker-compose.yaml
              echo "→ Port mapped 3100:80 in docker-compose.yaml"
            elif grep -q "listen 80" nginx/nginx.conf 2>/dev/null; then
              sed -i 's/listen 80/listen 3100/g' nginx/nginx.conf
              echo "→ nginx.conf updated to port 3100"
            else
              echo "→ No port config found to update (may already be correct)"
            fi

            echo ""
            echo "=== Deploy via Docker Compose ==="
            docker compose pull 2>&1 | tail -5 || true
            docker compose up -d

            echo ""
            echo "=== Waiting 90s for startup ==="
            sleep 90

            echo ""
            echo "=== Verify ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100 2>/dev/null || echo "000")
            echo "HTTP status: ${HTTP_CODE}"
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | head -15

            if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "301" ] || [ "${HTTP_CODE}" = "302" ]; then
              echo ""
              echo "✅ DONE: curl http://87.99.129.125:3100 returns HTML"
              echo "   Admin password: zonewise2026"
            else
              echo "⚠️ HTTP ${HTTP_CODE} — checking logs"
              docker compose logs --tail=30 nginx || true
              exit 1
            fi

      - name: Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          MSG="${EMOJI} Dify ZoneWise: ${STATUS}%0AURL: http://87.99.129.125:3100%0AIssue: %2386"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MSG}" > /dev/null 2>&1 || true
