name: "MCP Build + Deploy — biddeed-mcp + zonewise-mcp"
# Phase 3 deployment: DB migrations → npm publish → beta seed → SHIP GATE
# Zero-HITL. Surface to Ariel ONLY if: Stripe S5 price ID missing, WorkOS key missing, NPM_TOKEN missing.

on:
  workflow_dispatch:
    inputs:
      skip_npm_publish:
        description: "Skip npm publish (schema/migration only)"
        required: false
        default: "false"
        type: string
      skip_beta_seed:
        description: "Skip beta invite seeding"
        required: false
        default: "false"
        type: string
      dry_run:
        description: "Dry run — skip all writes, validate only"
        required: false
        default: "false"
        type: string

jobs:
  # ── P1: Apply DB migrations ──────────────────────────────────────────────────
  migrate:
    name: "P1 — MCP core tables migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply mcp_core_tables migration via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail  # -e removed: verify step catches failures
          PROJECT_REF="mocerqjnksmhcjzxrewo"
          SQL=$(cat supabase/migrations/20260623_mcp_core_tables.sql)
          echo "=== Applying mcp_core_tables via Supabase Management API ==="
          HTTP_CODE=$(curl -s -o /tmp/mgmt_resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
            2>&1) || HTTP_CODE="curl_error"
          echo "  Management API HTTP: ${HTTP_CODE}"
          cat /tmp/mgmt_resp.json 2>/dev/null | head -5 || true
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "✅ Management API accepted migration (HTTP ${HTTP_CODE})"
          else
            echo "⚠️  Management API returned ${HTTP_CODE} — attempting psql fallback"
            DB_PASS="${{ secrets.SUPABASE_DB_PASSWORD }}"
            if [ -n "$DB_PASS" ]; then
              sudo apt-get install -y postgresql-client -qq 2>/dev/null
              PGPASSWORD="$DB_PASS" psql \
                "postgresql://postgres.${PROJECT_REF}:${DB_PASS}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
                -f supabase/migrations/20260623_mcp_core_tables.sql 2>&1 || \
              PGPASSWORD="$DB_PASS" psql \
                "postgresql://postgres:${DB_PASS}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
                -f supabase/migrations/20260623_mcp_core_tables.sql 2>&1 || \
              echo "::warning::psql fallback also failed — verify step will catch if tables missing"
            else
              echo "::warning::SUPABASE_DB_PASSWORD not set — skipping psql fallback. Verify step will confirm if Management API succeeded."
            fi
          fi

      - name: Verify tables accessible
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for TABLE in mcp_api_keys billing_events beta_invites taxi_meter_streams taxi_meter_tools; do
            RESP=$(curl -s -o /tmp/resp.json -w "%{http_code}" "${SUPABASE_URL}/rest/v1/${TABLE}?limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}")
            if [ "$RESP" = "200" ]; then
              echo "✅ ${TABLE} accessible (HTTP 200)"
            else
              echo "::error::${TABLE} returned HTTP $RESP"
              cat /tmp/resp.json || true
              exit 1
            fi
          done

          echo ""
          echo "=== taxi_meter_streams seed ==="
          curl -sf "${SUPABASE_URL}/rest/v1/taxi_meter_streams?select=stream_id,name,unit_price_usd,gate_tier&order=stream_id" \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" | python3 -m json.tool

          echo ""
          echo "=== taxi_meter_tools count ==="
          curl -sf "${SUPABASE_URL}/rest/v1/taxi_meter_tools?select=count&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Prefer: count=exact" -o /dev/null -w "Tool count header: %{header_json}\n"

  # ── P2: Build + lint packages ────────────────────────────────────────────────
  build:
    name: "P2 — Build + validate packages"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install biddeed-mcp deps
        working-directory: packages/biddeed-mcp
        run: npm install

      - name: Install zonewise-mcp deps
        working-directory: packages/zonewise-mcp
        run: npm install

      - name: Validate tool schemas
        working-directory: packages/biddeed-mcp
        run: |
          node -e "
          import('./src/tools/discovery.js').then(m => {
            const tools = m.schemas;
            console.log('discovery tools:', tools.map(t => t.name).join(', '));
            tools.forEach(t => {
              if (!t.name || !t.description || !t.inputSchema) throw new Error('Invalid schema: ' + t.name);
            });
          }).then(() => import('./src/tools/qualification.js')).then(m => {
            console.log('qualification tools:', m.schemas.map(t => t.name).join(', '));
          }).then(() => import('./src/tools/fusion.js')).then(m => {
            console.log('fusion tools:', m.schemas.map(t => t.name).join(', '));
          }).then(() => {
            console.log('✅ All tool schemas valid');
          }).catch(e => { console.error(e); process.exit(1); });
          "

      - name: Check bin is executable
        run: |
          ls -la packages/biddeed-mcp/bin/
          ls -la packages/zonewise-mcp/bin/

  # ── P3: Publish to npm ───────────────────────────────────────────────────────
  publish:
    name: "P3 — npm publish"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: ${{ github.event.inputs.skip_npm_publish != 'true' && github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Guard — NPM_TOKEN required
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN not set. Add it at Settings → Secrets → Actions."
            echo "Get it at https://www.npmjs.com/settings/<username>/tokens"
            exit 1
          fi
          echo "NPM_TOKEN present"

      - name: Publish biddeed-mcp
        working-directory: packages/biddeed-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install
          # Check if version already published
          PUBLISHED=$(npm view biddeed-mcp version 2>/dev/null || echo "NOT_PUBLISHED")
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" = "$PKG_VER" ]; then
            echo "⚠️  biddeed-mcp@$PKG_VER already published — skipping"
          else
            npm publish --access public
            echo "✅ biddeed-mcp@$PKG_VER published to npm"
          fi

      - name: Publish zonewise-mcp
        working-directory: packages/zonewise-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install
          PUBLISHED=$(npm view zonewise-mcp version 2>/dev/null || echo "NOT_PUBLISHED")
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" = "$PKG_VER" ]; then
            echo "⚠️  zonewise-mcp@$PKG_VER already published — skipping"
          else
            npm publish --access public
            echo "✅ zonewise-mcp@$PKG_VER published to npm"
          fi

      - name: Verify packages on npm
        run: |
          sleep 30  # npm propagation delay
          BIDDEED=$(npm view biddeed-mcp version 2>/dev/null || echo "NOT_FOUND")
          ZONEWISE=$(npm view zonewise-mcp version 2>/dev/null || echo "NOT_FOUND")
          echo "biddeed-mcp on npm: $BIDDEED"
          echo "zonewise-mcp on npm: $ZONEWISE"
          [ "$BIDDEED" != "NOT_FOUND" ] && echo "✅ biddeed-mcp live on npm" || echo "::warning::biddeed-mcp not yet visible (propagation delay)"
          [ "$ZONEWISE" != "NOT_FOUND" ] && echo "✅ zonewise-mcp live on npm" || echo "::warning::zonewise-mcp not yet visible"

  # ── P4: Seed beta invites ────────────────────────────────────────────────────
  beta-seed:
    name: "P4 — Beta invites seed"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: migrate
    if: ${{ github.event.inputs.skip_beta_seed != 'true' && github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Seed wave1_brevard_duval cohort
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
        run: node scripts/seed-beta-invites.js 2>&1 | tee /tmp/beta-seed.log

      - name: Upload seed log
        if: always()
        run: |
          echo "=== Beta seed output ==="
          cat /tmp/beta-seed.log || true

  # ── P5: SHIP GATE verification ───────────────────────────────────────────────
  verify:
    name: "P5 — SHIP GATE"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [migrate, beta-seed]
    if: always()
    steps:
      - name: SQL VERIFICATION
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "### SQL VERIFICATION"
          echo "\`\`\`"
          echo "SELECT 'taxi_meter_streams' as tbl, count(*) FROM taxi_meter_streams;"
          echo "SELECT 'taxi_meter_tools'   as tbl, count(*) FROM taxi_meter_tools;"
          echo "SELECT 'beta_invites'       as tbl, count(*) FROM beta_invites;"
          echo "SELECT 'mcp_api_keys'       as tbl, count(*) FROM mcp_api_keys;"
          echo ""

          for TABLE in taxi_meter_streams taxi_meter_tools beta_invites mcp_api_keys; do
            COUNT=$(curl -sf \
              "${SUPABASE_URL}/rest/v1/${TABLE}?select=id" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Prefer: count=exact" \
              -o /dev/null -w "%{header_json}" | python3 -c "
          import sys, json
          h = json.load(sys.stdin)
          cr = h.get('content-range', ['?/?'])[0]
          print(cr.split('/')[-1] if '/' in cr else '?')
          " 2>/dev/null || echo "?")
            echo "  ${TABLE}: ${COUNT} rows"
          done

          echo "\`\`\`"
          echo ""

          # Verify at least 6 streams seeded
          STREAM_COUNT=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/taxi_meter_streams?select=id" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Prefer: count=exact" \
            -o /dev/null -w "%{header_json}" | python3 -c "
          import sys, json
          h = json.load(sys.stdin)
          cr = h.get('content-range', ['0/0'])[0]
          print(int(cr.split('/')[-1]))
          " 2>/dev/null || echo "0")

          if [ "$STREAM_COUNT" -lt 6 ]; then
            echo "::error::SHIP GATE FAIL: Expected 6+ taxi_meter_streams, found $STREAM_COUNT"
            exit 1
          fi

          echo "✅ SHIP GATE PASS: All MCP tables present, $STREAM_COUNT revenue streams seeded"
          echo ""
          echo "=== npx install instructions ==="
          echo ""
          echo 'Add to Claude Desktop mcpServers config:'
          echo '{'
          echo '  "biddeed": {'
          echo '    "command": "npx",'
          echo '    "args": ["-y", "biddeed-mcp"],'
          echo '    "env": { "BIDDEED_API_KEY": "bd_live_..." }'
          echo '  },'
          echo '  "zonewise": {'
          echo '    "command": "npx",'
          echo '    "args": ["-y", "zonewise-mcp"],'
          echo '    "env": { "BIDDEED_API_KEY": "zw_live_..." }'
          echo '  }'
          echo '}'
