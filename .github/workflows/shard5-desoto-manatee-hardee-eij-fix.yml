name: "SHARD-5 EIJ Fix: desoto, manatee, hardee (run 10418)"
# dispatch_id: 6c72855f-36c8-4af1-9d35-ffe85a48918d
# Purpose: Fix E (parcel linkage), I (property card), C/D (parity), J (bid_decisions)
#   for desoto, manatee, hardee counties — the 3 shard-5 counties in GS loop run 10418.
#
# Root cause: new auctions scraped without parcel linkage / enrichment, causing
#   frozen-numerator regression against growing denominator. Proven pattern.
#
# WIRING MANDATE (2026-06-10): scheduled daily so the fix recurs as new auctions arrive.
# Per PARALLEL-FLEET RULES: only touches desoto, manatee, hardee rows.

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC daily (runs after 08:00Z shard dispatch)
  workflow_dispatch:
    inputs:
      counties:
        description: "Counties to process (comma-separated, default: desoto,manatee,hardee)"
        required: false
        default: "desoto,manatee,hardee"

jobs:
  eij-fix:
    name: "E/I/C/D/J enrichment: desoto, manatee, hardee"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install dependencies"
        run: pip install --quiet httpx requests

      - name: "SET statement_timeout=0 + run EIJ enrichment pipeline"
        run: |
          set -euo pipefail
          echo "=== Starting SHARD-5 EIJ Fix ==="
          echo "dispatch_id: 6c72855f-36c8-4af1-9d35-ffe85a48918d"
          echo "counties: desoto, manatee, hardee"
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 scripts/shard5_desoto_manatee_hardee_eij_fix.py 2>&1 | tee /tmp/eij_output.txt

          EXIT=${PIPESTATUS[0]}
          echo "Script exit code: $EXIT"

          echo "### SHARD-5 EIJ Fix Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 /tmp/eij_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT

      - name: "Verify: pencil_dod_evaluate_county for all 3 counties"
        if: always()
        run: |
          set -uo pipefail
          SB_URL="${SUPABASE_URL}"
          SB_KEY="${SUPABASE_SERVICE_ROLE_KEY}"

          echo "### SQL VERIFICATION: desoto, manatee, hardee" >> "$GITHUB_STEP_SUMMARY"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

          for COUNTY in desoto manatee hardee; do
            echo "=== ${COUNTY} ===" | tee -a /tmp/verify.txt
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### ${COUNTY}" >> "$GITHUB_STEP_SUMMARY"

            for PARAM in p_county county_slug_arg county_slug p_county_slug; do
              RESP=$(curl -sf -X POST "${SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
                -H "apikey: ${SB_KEY}" \
                -H "Authorization: Bearer ${SB_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"${PARAM}\": \"${COUNTY}\"}" 2>/dev/null) || RESP=""

              if [ -n "$RESP" ] && echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); exit(0 if isinstance(d,(dict,list)) else 1)" 2>/dev/null; then
                echo "$RESP" | tee -a /tmp/verify.txt
                echo '```json' >> "$GITHUB_STEP_SUMMARY"
                echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Row Counts" >> "$GITHUB_STEP_SUMMARY"

          for COUNTY in desoto manatee hardee; do
            TOTAL=$(curl -sf "${SB_URL}/rest/v1/multi_county_auctions?select=count&county=eq.${COUNTY}&head=true" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              -H "Prefer: count=exact" -I 2>/dev/null | tr -d '\r' | sed -n 's/content-range: 0-0\/\(.*\)/\1/p') || TOTAL="unknown"

            LINKED=$(curl -sf "${SB_URL}/rest/v1/multi_county_auctions?select=count&county=eq.${COUNTY}&parcel_id=not.is.null&head=true" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              -H "Prefer: count=exact" -I 2>/dev/null | tr -d '\r' | sed -n 's/content-range: 0-0\/\(.*\)/\1/p') || LINKED="unknown"

            J_COUNT=$(curl -sf "${SB_URL}/rest/v1/bid_decisions?select=count&county_slug=eq.${COUNTY}&head=true" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              -H "Prefer: count=exact" -I 2>/dev/null | tr -d '\r' | sed -n 's/content-range: 0-0\/\(.*\)/\1/p') || J_COUNT="unknown"

            echo "- ${COUNTY}: total_mca=${TOTAL} parcel_linked=${LINKED} bid_decisions=${J_COUNT}" >> "$GITHUB_STEP_SUMMARY"
            echo "${COUNTY}: total_mca=${TOTAL} parcel_linked=${LINKED} bid_decisions=${J_COUNT}"
          done

      - name: "Session checkpoint: update gold_standard_campaign"
        if: always()
        run: |
          set -uo pipefail
          SB_URL="${SUPABASE_URL}"
          SB_KEY="${SUPABASE_SERVICE_ROLE_KEY}"

          DISPATCH_SQL="SELECT id FROM summit_chat_dispatch WHERE state='processing' ORDER BY updated_at DESC LIMIT 1"

          curl -sf -X POST "${SB_URL}/rest/v1/rpc/exec_sql" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"UPDATE public.gold_standard_campaign SET exit_reason='timeout', session_end_at=now() WHERE dispatch_id=(${DISPATCH_SQL}) AND exit_reason IS NULL\"}" || true

          echo "Checkpoint written to gold_standard_campaign"
