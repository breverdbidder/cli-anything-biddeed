name: cc claude workspace
on: { workflow_dispatch: {} }
jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: make claude-owned login workspace
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          mkdir -p /home/claude/projects/auth-setup
          printf '# Auth setup\nRun: claude setup-token  (or type /login)\n' > /home/claude/projects/auth-setup/README.md
          mkdir -p /home/claude/.claude/projects/-home-claude-projects-auth-setup
          chown -R claude:claude /home/claude/projects /home/claude/.claude
          echo "workspace=$(ls -ld /home/claude/projects/auth-setup)"
          echo "tile=$(ls -ld /home/claude/.claude/projects/-home-claude-projects-auth-setup)"
          echo "service_user=$(ps -o user= -p $(systemctl show -p MainPID --value claudecodeui@claude))"
          echo END
          REMOTE
