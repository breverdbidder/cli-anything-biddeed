name: "SHARD2 AJAX RealForeclose/RealTaxDeed harvest (pinellas + santa_rosa)"
# Wires scripts/shard2_run2450_ajax_realforeclose_harvest.py to a recurring
# executor (WIRING MANDATE — a scraper with no schedule is dead code).
#
# Dynamically queries multi_county_auctions for distinct auction_date values
# on pinellas/santa_rosa rows that aren't matched_clean yet, harvests both the
# realforeclose.com (foreclosure) and realtaxdeed.com (tax deed) AJAX
# endpoints for those dates into realforeclose_aids, then re-runs the
# canonical matcher refresh_shard2_cd_tier1_v1() to promote parity_status.
#
# Shipped 2026-07-03 (SHARD-14 RUN2753 santa_rosa C/D fix — manual run moved
# C/D 69.8%->92.1%; this workflow keeps it current as new auction dates land).

on:
  schedule:
    - cron: "30 9 * * *"   # daily 09:30Z
  workflow_dispatch: {}

concurrency: {group: shard2-ajax-realforeclose-harvest, cancel-in-progress: false}

jobs:
  harvest:
    name: "Harvest AJAX aids + rematch"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build target dates + harvest + rematch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys, urllib.request

          SB = os.environ["SUPABASE_URL"]
          KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          H = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          def get(path):
              req = urllib.request.Request(f"{SB}/rest/v1/{path}", headers=H)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          COUNTIES = [
              ("pinellas", "pinellas", "realforeclose.com"),
              ("santarosa", "santa_rosa", "realforeclose.com"),
              ("santarosa", "santa_rosa", "realtaxdeed.com"),
          ]

          targets = []
          for subdomain, slug, platform in COUNTIES:
              rows = get(
                  "multi_county_auctions?select=auction_date"
                  f"&county=eq.{slug}&parity_status=neq.matched_clean"
                  "&auction_date=not.is.null"
              )
              dates = sorted({r["auction_date"] for r in rows})
              if not dates:
                  print(f"{slug}/{platform}: no unmatched dated rows, skipping")
                  continue
              mdy = [f"{d[5:7]}/{d[8:10]}/{d[0:4]}" for d in dates]
              targets.append({
                  "subdomain": subdomain, "county_slug": slug,
                  "platform_domain": platform, "dates": mdy,
              })
              print(f"{slug}/{platform}: {len(mdy)} target dates")

          if not targets:
              print("Nothing to harvest today.")
              sys.exit(0)

          rc = subprocess.run(
              [sys.executable, "scripts/shard2_run2450_ajax_realforeclose_harvest.py",
               json.dumps(targets)],
              check=False,
          )
          if rc.returncode != 0:
              sys.exit(rc.returncode)

          req = urllib.request.Request(
              f"{SB}/rest/v1/rpc/refresh_shard2_cd_tier1_v1",
              data=b"{}", method="POST",
              headers={**H, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              print("refresh_shard2_cd_tier1_v1:", r.read().decode())
          PYEOF
