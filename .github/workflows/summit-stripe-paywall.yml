name: "SUMMIT P0: Wire Stripe paywall to zonewise.ai/chat"
# Issue: breverdbidder/cli-anything-biddeed#93
#
# Implements a 3-free-lookup freemium paywall for zonewise.ai/chat:
#   1. Run Supabase migration (paywall_sessions table)
#   2. SSH to Hetzner — write paywall files into zonewise-web checkout
#   3. Install stripe npm package
#   4. Patch app/api/explorer/chat/route.ts to check paywall before LLM call
#   5. Build + restart (pm2 / next start)
#   6. Smoke test: 4th lookup returns { paywall: true }
#
# Paywall flow:
#   Free: 3 lookups per session (tracked via X-Session-Id header → Supabase)
#   Blocked: HTTP 402 { paywall: true, checkoutUrl: "/api/stripe/checkout" }
#   Upgrade: Stripe Checkout → $15/mo subscription → webhook sets is_pro=true
#   Post-pay: session is_pro=true → unlimited lookups

on:
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip Supabase migration (if table already exists)"
        required: false
        default: "false"
      dry_run:
        description: "Dry run — write files but skip build+restart"
        required: false
        default: "false"

jobs:
  # ─── Phase 1: Supabase migration ────────────────────────────────────────────
  migrate:
    name: "P1 — Supabase migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.skip_migration != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run paywall migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          PSQL="psql -h aws-0-us-west-2.pooler.supabase.com -p 5432 -U postgres.mocerqjnksmhcjzxrewo -d postgres --no-password"

          echo "=== Running paywall migration ==="
          $PSQL -f migrations/20260330_stripe_paywall.sql && echo "✅ Migration OK" || {
            echo "Pooler failed — trying direct connection"
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h db.mocerqjnksmhcjzxrewo.supabase.co \
              -p 5432 -U postgres -d postgres \
              --no-password \
              -f migrations/20260330_stripe_paywall.sql
          }

      - name: Verify table exists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          RESULT=$(curl -sf \
            "$SUPABASE_URL/rest/v1/paywall_sessions?limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null -w "%{http_code}")
          [ "$RESULT" = "200" ] && echo "✅ paywall_sessions table accessible" || \
            echo "⚠️  Table check returned HTTP $RESULT (may still be OK)"

  # ─── Phase 2: Deploy to Hetzner ─────────────────────────────────────────────
  deploy:
    name: "P2 — Deploy paywall to Hetzner"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: migrate
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: "Write paywall files + patch chat route + build"
        uses: appleboy/ssh-action@v1.2.0
        env:
          STRIPE_SECRET_KEY:      ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:  ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          DRY_RUN:                ${{ inputs.dry_run }}
          NEXT_PUBLIC_URL:        "https://zonewise.ai"
        with:
          host:    87.99.129.125
          username: claude
          key:     ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 55m
          envs: STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PUBLISHABLE_KEY,SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,DRY_RUN,NEXT_PUBLIC_URL
          script: |
            set -euo pipefail
            echo "=== SUMMIT P0: Stripe paywall deploy ==="

            # ── Locate zonewise-web ──────────────────────────────────────────
            ZW_DIR=""
            for d in /home/claude/zonewise-web /opt/zonewise-web /var/www/zonewise-web; do
              [ -d "$d" ] && ZW_DIR="$d" && break
            done

            if [ -z "$ZW_DIR" ]; then
              echo "zonewise-web not found — cloning fresh"
              cd /home/claude
              git clone "https://$GH_PAT@github.com/breverdbidder/zonewise-web.git" zonewise-web
              ZW_DIR="/home/claude/zonewise-web"
            fi

            cd "$ZW_DIR"
            echo "Working in $ZW_DIR"

            # Pull latest
            git fetch origin && git reset --hard origin/main || true

            # ── P1: Write lib/stripe/paywall.ts ──────────────────────────────
            mkdir -p lib/stripe
            cat > lib/stripe/paywall.ts << 'PAYWALL_EOF'
import { createClient } from '@supabase/supabase-js';

const FREE_LOOKUPS = 3;

const supabase = createClient(
  process.env.SUPABASE_URL!,
  process.env.SUPABASE_SERVICE_ROLE_KEY!
);

export interface PaywallResult {
  allowed: boolean;
  lookupCount: number;
  isPro: boolean;
  lookupsRemaining: number;
}

export async function checkAndIncrementLookup(sessionId: string): Promise<PaywallResult> {
  const { data: existing } = await supabase
    .from('paywall_sessions')
    .select('lookup_count, is_pro')
    .eq('session_id', sessionId)
    .single();

  const isPro = existing?.is_pro ?? false;
  const currentCount = existing?.lookup_count ?? 0;

  if (isPro) {
    await supabase.from('paywall_sessions').upsert({
      session_id: sessionId,
      lookup_count: currentCount + 1,
      is_pro: true,
      last_lookup_at: new Date().toISOString(),
    }, { onConflict: 'session_id' });
    return { allowed: true, lookupCount: currentCount + 1, isPro: true, lookupsRemaining: Infinity };
  }

  if (currentCount >= FREE_LOOKUPS) {
    return { allowed: false, lookupCount: currentCount, isPro: false, lookupsRemaining: 0 };
  }

  const newCount = currentCount + 1;
  await supabase.from('paywall_sessions').upsert({
    session_id: sessionId,
    lookup_count: newCount,
    is_pro: false,
    last_lookup_at: new Date().toISOString(),
  }, { onConflict: 'session_id' });

  return { allowed: true, lookupCount: newCount, isPro: false, lookupsRemaining: FREE_LOOKUPS - newCount };
}

export async function activateProSession(
  sessionId: string,
  stripeCustomerId: string,
  stripeSubId: string
): Promise<void> {
  await supabase.from('paywall_sessions').upsert({
    session_id: sessionId,
    is_pro: true,
    stripe_customer_id: stripeCustomerId,
    stripe_sub_id: stripeSubId,
    pro_since: new Date().toISOString(),
  }, { onConflict: 'session_id' });
}
PAYWALL_EOF
            echo "✅ lib/stripe/paywall.ts written"

