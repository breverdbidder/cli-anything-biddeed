name: probe-google-state
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH probe for existing Google auth on Hetzner
        env:
          HETZNER_IP:      ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== gcloud CLI installed? ==="
          $SSH "which gcloud && gcloud version 2>&1 | head -3 || echo NOT-INSTALLED"
          echo ""
          echo "=== gcloud authenticated accounts ==="
          $SSH "gcloud auth list 2>&1 | head -10 || echo no-gcloud"
          echo ""
          echo "=== gcloud current project ==="
          $SSH "gcloud config get-value project 2>/dev/null || echo no-project-set"
          echo ""
          echo "=== ALL *.json files that look like service account keys (type=service_account) ==="
          $SSH "find / -name '*.json' -size -10k -readable 2>/dev/null | head -50 | while read f; do
            if head -c 500 \"\$f\" 2>/dev/null | grep -q 'service_account' 2>/dev/null; then
              client_email=\$(python3 -c \"import json; print(json.load(open('\$f')).get('client_email',''))\" 2>/dev/null || echo unknown)
              project_id=\$(python3 -c \"import json; print(json.load(open('\$f')).get('project_id',''))\" 2>/dev/null || echo unknown)
              echo \"  FOUND: \$f  project=\$project_id  client_email=\$client_email\"
            fi
          done"
          echo ""
          echo "=== Application Default Credentials (gcloud auth application-default login) ==="
          $SSH "ls -la /root/.config/gcloud/application_default_credentials.json /home/summit/.config/gcloud/application_default_credentials.json 2>/dev/null || echo none-found"
          echo ""
          echo "=== gcloud list service accounts in zonewise-ai (if authenticated) ==="
          $SSH "gcloud iam service-accounts list --project=zonewise-ai 2>&1 | head -10 || echo cannot-list"
          echo ""
          echo "=== APIs enabled on zonewise-ai project ==="
          $SSH "gcloud services list --enabled --project=zonewise-ai 2>&1 | head -20 || echo cannot-list"
