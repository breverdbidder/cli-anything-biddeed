name: "Deploy WATCH_TOKEN to Hetzner"
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set WATCH_TOKEN on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 60s
          script: |
            TOKEN="${{ secrets.WATCH_TOKEN }}"

            # Root user
            grep -q WATCH_TOKEN /root/.bashrc 2>/dev/null && sed -i '/WATCH_TOKEN/d' /root/.bashrc
            echo "export WATCH_TOKEN=\"$TOKEN\"" >> /root/.bashrc
            echo "Root: WATCH_TOKEN set"

            # Claude user
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            grep -q WATCH_TOKEN /home/claude/.bashrc 2>/dev/null && sed -i '/WATCH_TOKEN/d' /home/claude/.bashrc
            echo "export WATCH_TOKEN=\"$TOKEN\"" >> /home/claude/.bashrc
            chown claude:claude /home/claude/.bashrc
            echo "Claude user: WATCH_TOKEN set"

            # Also add to zonewise .env for completeness
            grep -q WATCH_TOKEN /opt/zonewise-desktop/.env 2>/dev/null || echo "WATCH_TOKEN=$TOKEN" >> /opt/zonewise-desktop/.env

            # Verify
            source /root/.bashrc
            echo "Verify root: ${WATCH_TOKEN:0:10}..."
            su - claude -c 'source ~/.bashrc && echo "Verify claude: ${WATCH_TOKEN:0:10}..."'
            echo "DONE"
