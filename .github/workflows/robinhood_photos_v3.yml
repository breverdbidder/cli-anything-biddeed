name: Robinhood Photos v3

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/rh_v3 && mkdir -p /tmp/rh_v3
          cd /tmp/rh_v3

          cat > scrape.py <<'PY'
          import asyncio, json, re, hashlib, time
          from pathlib import Path
          import urllib.request, urllib.parse

          OUT = Path('/tmp/rh_v3')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          def http_get(url, timeout=20, headers=None):
              hdrs = {'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.9'}
              if headers: hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              return urllib.request.urlopen(req, timeout=timeout)

          # ======================================================
          # STAGE 1: Get the Zillow zpid via autocomplete API (less bot-blocked)
          # ======================================================
          def find_zillow_zpid():
              try:
                  url = "https://www.zillow.com/search/GetSearchPageState.htm?searchQueryState=" + urllib.parse.quote(json.dumps({
                      "pagination": {},
                      "usersSearchTerm": "4087 Robinhood Dr Melbourne FL 32935",
                      "isMapVisible": False,
                      "filterState": {},
                      "isListVisible": True,
                  }))
                  print(f"  Try search API...", flush=True)
                  with http_get(url, timeout=15) as r:
                      txt = r.read().decode('utf-8', errors='replace')
                  print(f"    got {len(txt)} bytes", flush=True)
                  m = re.search(r'(\d{8,12})_zpid', txt)
                  if m:
                      print(f"    zpid: {m.group(1)}", flush=True)
                      return m.group(1)
              except Exception as e:
                  print(f"    err: {str(e)[:100]}", flush=True)
              return None

          # ======================================================
          # STAGE 2: Wayback CDX for ALL Zillow snapshots of 4087 Robinhood
          # ======================================================
          def wayback_cdx_all():
              snaps = []
              patterns = [
                  "zillow.com/homedetails/4087-Robinhood*",
                  "zillow.com/homes/4087-Robinhood*",
                  "redfin.com/FL/Melbourne/4087-Robinhood*",
                  "realtor.com/realestateandhomes-detail/4087-Robinhood*",
                  "trulia.com/p/fl/melbourne/4087-robinhood*",
                  "homes.com/property/4087-robinhood*",
                  "movoto.com/4087-robinhood*",
              ]
              for p in patterns:
                  for retry in range(3):
                      try:
                          url = f"https://web.archive.org/cdx/search/cdx?url={urllib.parse.quote(p)}&output=json&limit=80"
                          with http_get(url, timeout=25) as r:
                              data = json.loads(r.read())
                          if len(data) > 1:
                              for row in data[1:]:
                                  snaps.append((row[1], row[2], row[3]))  # ts, orig, mime
                          print(f"  CDX [{p[:50]}]: {len(data)-1} rows", flush=True)
                          break
                      except Exception as e:
                          if retry < 2:
                              time.sleep(3)
                              continue
                          print(f"  CDX err [{p[:30]}]: {str(e)[:60]}", flush=True)
              return snaps

          def wayback_fetch_html(ts, orig_url):
              snap_url = f"https://web.archive.org/web/{ts}/{orig_url}"
              try:
                  with http_get(snap_url, timeout=30) as r:
                      return r.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return None

          def extract_image_urls(html):
              urls = set()
              if not html: return urls
              for pat in [
                  # Zillow
                  r'https://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                  r'/web/\d+(?:im_)?/https://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                  # Redfin
                  r'https://ssl\.cdn-redfin\.com/photo/[^"\s\'\\]+?\.jpg',
                  r'https://[a-z0-9.\-]+\.cdn-redfin\.com/[^"\s\'\\]+?\.jpg',
                  # Realtor / rdcpix
                  r'https://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?\.jpg',
                  # Trulia
                  r'https://www\.trulia\.com/pictures/[^"\s\'\\]+?\.jpg',
                  r'https://thumbs\.trulia[^"\s\'\\]+?\.jpg',
                  r'https://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpeg',
                  # Generic listing photos
                  r'https://images\.[a-z0-9.\-]+/listings/[^"\s\'\\]+?\.jpg',
                  # Wayback-rewritten
                  r'/web/\d+im_/https://[^"\s\'\\]+?(?:rdcpix|redfin|zillow|trulia)[^"\s\'\\]+?\.jpg',
              ]:
                  for u in re.findall(pat, html):
                      if u.startswith('/web/'):
                          u = 'https://web.archive.org' + u
                      urls.add(u)
              return urls

          # ======================================================
          # MAIN
          # ======================================================
          all_urls = set()
          source_log = []

          # Stage 1: Direct zpid lookup
          print("=== Stage 1: Zillow zpid lookup ===", flush=True)
          zpid = find_zillow_zpid()
          if zpid:
              print(f"  zpid resolved: {zpid}", flush=True)

          # Stage 2: Wayback CDX
          print("\n=== Stage 2: Wayback CDX ===", flush=True)
          snaps = wayback_cdx_all()
          # Save snaps for debugging
          (OUT / 'snapshots.json').write_text(json.dumps(snaps, default=str, indent=2))
          print(f"  Total snapshots: {len(snaps)}", flush=True)

          if snaps:
              # Sort by timestamp, dedupe by URL
              seen = set()
              unique_snaps = []
              for ts, orig, mime in sorted(snaps):
                  if orig not in seen:
                      seen.add(orig)
                      unique_snaps.append((ts, orig, mime))
              print(f"  Unique snapshot URLs: {len(unique_snaps)}", flush=True)

              # Fetch each (HTML only, skip image mime)
              for i, (ts, orig, mime) in enumerate(unique_snaps[:25]):
                  if 'image' in str(mime).lower():
                      # direct image URL preserved on wayback
                      all_urls.add(f"https://web.archive.org/web/{ts}/{orig}")
                      continue
                  html = wayback_fetch_html(ts, orig)
                  if html and len(html) > 5000:
                      found = extract_image_urls(html)
                      print(f"  [{i+1}] {ts} {orig[:60]} -> {len(found)} imgs ({len(html)}b)", flush=True)
                      all_urls.update(found)
                      source_log.append({'snap': f"{ts}/{orig}", 'imgs': len(found)})
                      # Save first useful HTML for debugging
                      if len(found) > 0 and not (OUT / 'sample_snap.html').exists():
                          (OUT / 'sample_snap.html').write_text(html, errors='replace')
                  else:
                      print(f"  [{i+1}] {ts} {orig[:60]} -> empty/too small", flush=True)
                  time.sleep(0.5)

          # Stage 3: Try Realtor/Redfin via Playwright (proxied through Hetzner)
          print(f"\n=== Stage 3: Live aggregators via Playwright ===", flush=True)
          async def playwright_pull():
              from playwright.async_api import async_playwright
              urls = set()
              targets = [
                  "https://www.realtor.com/realestateandhomes-detail/4087-Robinhood-Dr_Melbourne_FL_32935",
                  "https://www.movoto.com/melbourne-fl/4087-robinhood-dr-melbourne-fl-32935-153_953113800/for-sale/",
                  "https://www.estately.com/listings/florida/melbourne/32935/4087-robinhood-dr",
                  "https://www.trulia.com/p/fl/melbourne/4087-robinhood-dr-melbourne-fl-32935--2087500770",
                  "https://www.homesnap.com/Florida/Melbourne/4087-Robinhood-Dr",
              ]
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
                  ctx = await browser.new_context(viewport={"width": 1600, "height": 1200}, user_agent=UA)
                  page = await ctx.new_page()
                  for tgt in targets:
                      try:
                          await page.goto(tgt, wait_until="domcontentloaded", timeout=20000)
                          await asyncio.sleep(2)
                          html = await page.content()
                          n = len(html)
                          found = extract_image_urls(html)
                          print(f"  {tgt[:70]} {n}b -> {len(found)} imgs", flush=True)
                          urls.update(found)
                      except Exception as e:
                          print(f"  {tgt[:70]} ERR: {str(e)[:60]}", flush=True)
                  await browser.close()
              return urls

          all_urls.update(asyncio.run(playwright_pull()))

          # Dedupe & filter
          uniq = list(all_urls)
          # Filter for likely property images
          good = []
          for u in uniq:
              ulow = u.lower()
              if any(s in ulow for s in ['logo', 'icon', 'sprite', 'avatar', 'placeholder', 'tracking', 'pixel.gif']):
                  continue
              if 'thumb' in ulow and 'large' not in ulow and 'big' not in ulow:
                  continue
              good.append(u)

          print(f"\n=== {len(uniq)} unique URLs, {len(good)} after filter ===", flush=True)

          # Download
          downloaded = []
          for i, url in enumerate(good[:40], 1):
              try:
                  h = hashlib.md5(url.encode()).hexdigest()[:8]
                  fname = f"{i:02d}_robinhood_{h}.jpg"
                  fpath = OUT / fname
                  ref = url.split('/')[2] if '://' in url else 'https://www.zillow.com/'
                  with http_get(url, timeout=25, headers={'Referer': f'https://{ref}/'}) as r:
                      data = r.read()
                  if len(data) > 8000:
                      fpath.write_bytes(data)
                      downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                      print(f"  [{i}] {len(data)}b -> {fname}", flush=True)
                  else:
                      print(f"  [{i}] too small {len(data)}b", flush=True)
              except Exception as e:
                  print(f"  [{i}] FAIL: {str(e)[:60]}", flush=True)

          (OUT / 'manifest.json').write_text(json.dumps({
              'all_urls': len(uniq), 'good': len(good), 'downloaded': len(downloaded),
              'snapshots': len(snaps), 'sources': source_log,
          }, indent=2))
          print(f"\n>>> {len(downloaded)} photos downloaded", flush=True)
          PY

          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/rh_v3/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/rh_v3/ /tmp/results/ || true
          ls -la /tmp/results/rh_v3/ 2>/dev/null || echo "no results"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos_v3
          path: /tmp/results/
          retention-days: 90
