name: "SHARD-13 Calhoun I: parcel zone re-link + enrichment"
# dispatch_id: 61ea7d8f-c9ca-401a-80ec-222b16502886
# Fixes I-criterion regression: daily clerk harvest adds new calhoun auction rows
# without zone-linking, dropping card_complete. This workflow re-links parcel_zones
# for any calhoun row that gained a parcel_id but lacks a zone entry, and fills
# missing property_address/lat/lon/assessed_value from FL GIO statewide cadastral.
#
# Run: daily 06:15 UTC (30 min after calhoun-clerk-harvest.yml at 05:45 UTC)

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  calhoun-i-relink:
    name: "Calhoun I: zone re-link and enrichment"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet requests

      - name: Run calhoun I re-link
        run: |
          set -euo pipefail
          EXIT=0
          python3 scripts/shard13_calhoun_i_relink.py || EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_STEP_SUMMARY"
          # exit 2 = no new work needed -- not a failure
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "2" ]; then
            exit "$EXIT"
          fi

      - name: "Verify: pencil_dod_evaluate_county calhoun"
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_county": "calhoun"}')
          echo "### SQL VERIFICATION: calhoun" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP"
          # Check I metric
          I_PASS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('I',{}).get('pass',False))")
          if [ "$I_PASS" = "False" ]; then
            echo "::warning::Calhoun I is still FAIL after re-link -- may need manual investigation"
          fi
