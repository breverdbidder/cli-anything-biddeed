name: "realTDM Discovery Scan — clerk tax-deed portal (read-only)"
# SHARD-3 run2886, 2026-07-04. RealAuction has migrated several FL counties'
# tax-deed case management to {county}.realtdm.com/public/cases/list, a live
# public clerk-of-court case-search portal. scripts/realtdm_harvester.py
# fetches it and reports coverage/match stats against multi_county_auctions.
# Read-only: reports for human/session review, never writes to the database
# (an --apply-parity mode was tried and adversarially rejected the same
# session -- see supabase/migrations/20260704_shard3_manatee_realtdm_tax_deed_backfill.sql).

on:
  workflow_dispatch:
    inputs:
      county:
        description: 'County slug'
        required: true
        type: choice
        options:
          - charlotte
          - highlands
          - liberty
          - manatee
          - volusia
  schedule:
    - cron: '0 9 * * 3'  # Wednesdays 09:00 UTC — dry-run sweep, all 5 shard-3 counties

concurrency:
  group: realtdm-harvest-${{ github.event.inputs.county || 'scheduled-sweep' }}
  cancel-in-progress: false

jobs:
  harvest:
    name: "realTDM ${{ github.event.inputs.county || 'scheduled sweep' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run realtdm harvester (dispatched county)
        if: github.event.inputs.county != ''
        run: python3 scripts/realtdm_harvester.py --county "${{ github.event.inputs.county }}"

      - name: Run realtdm harvester (scheduled dry-run sweep)
        if: github.event.inputs.county == ''
        run: |
          for c in charlotte highlands liberty manatee volusia; do
            echo "::group::$c"
            python3 scripts/realtdm_harvester.py --county "$c" || true
            echo "::endgroup::"
          done
