name: Set PostHog Worker Secret

# One-off/idempotent provisioning: pulls posthog_project_key out of the
# Supabase vault and writes it as an encrypted Cloudflare Worker secret
# (POSTHOG_PROJECT_KEY) on the production biddeed.ai worker. Per
# CLAUDE.md CREDENTIAL HANDLING (GTM-22D): the fetch and the wrangler
# write happen in the SAME masked GHA step — the value is never printed,
# never returned to a chat/agent context, and never reused elsewhere.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch posthog_project_key from vault and set as Worker secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg q "SELECT vault_secret('posthog_project_key') AS v;" '{query: $q}')
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: cli-anything-biddeed-cc/1.0" \
            -d "$payload")
          value=$(echo "$resp" | jq -r '.[0].v // empty')
          if [ -z "$value" ]; then
            echo "::error::posthog_project_key not returned from vault_secret() — check vault contents"
            exit 1
          fi
          echo "::add-mask::$value"
          echo "$value" | npx wrangler secret put POSTHOG_PROJECT_KEY
