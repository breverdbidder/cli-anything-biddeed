name: Hetzner Server Reboot

on:
  workflow_dispatch:

jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try Hetzner Cloud API reboot
        env:
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          echo "=== Attempt 1: Hetzner Cloud API ==="
          # Try using HETZNER_PASSWORD as Cloud API token
          SERVERS=$(curl -sf -H "Authorization: Bearer ${HETZNER_PASSWORD}" \
            "https://api.hetzner.cloud/v1/servers" 2>&1) || echo "Cloud API failed: not a token"
          echo "$SERVERS" | head -5
          
          if echo "$SERVERS" | grep -q '"servers"'; then
            echo "Cloud API works! Finding server..."
            SERVER_ID=$(echo "$SERVERS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for s in data.get('servers', []):
              for ip in s.get('public_net', {}).get('ipv4', {}).get('ip', ''), s.get('public_net', {}).get('floating_ips', []):
                  pass
              ip = s.get('public_net', {}).get('ipv4', {}).get('ip', '')
              print(f'ID={s[\"id\"]} Name={s[\"name\"]} IP={ip} Status={s[\"status\"]}')
              if '${HETZNER_IP}' in str(ip) or '87.99.129.125' in str(ip):
                  print(f'MATCH: {s[\"id\"]}')
          ")
            echo "$SERVER_ID"
            
            # Extract matched server ID and reboot
            MATCHED=$(echo "$SERVER_ID" | grep MATCH | head -1 | awk '{print $2}')
            if [ -n "$MATCHED" ]; then
              echo "Rebooting server $MATCHED..."
              curl -sf -X POST -H "Authorization: Bearer ${HETZNER_PASSWORD}" \
                "https://api.hetzner.cloud/v1/servers/${MATCHED}/actions/reboot" 2>&1
              echo "Reboot command sent!"
            fi
          else
            echo "=== Attempt 2: Hetzner Robot API ==="
            # Try Robot API - needs server number from IP
            # First try to find server by IP
            curl -sf -u "root:${HETZNER_PASSWORD}" \
              "https://robot-ws.your-server.de/server" 2>&1 | head -5 || echo "Robot API also failed"
            
            # Try with common Robot auth patterns
            curl -sf -u "#${HETZNER_IP}:${HETZNER_PASSWORD}" \
              "https://robot-ws.your-server.de/server" 2>&1 | head -5 || echo "Robot pattern 2 failed"
          fi
          
          echo ""
          echo "=== Attempt 3: SSH with password ==="
          sudo apt-get install -y sshpass > /dev/null 2>&1
          timeout 15 sshpass -p "${HETZNER_PASSWORD}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            root@87.99.129.125 "echo SSH_ALIVE; uptime" 2>&1 || echo "SSH with password also timed out"
