name: scrape-brevard-realtdm
# Brevard RealTDM public case list: per-case status + SURPLUS BALANCES + account->case map.
# Decoded 2026-06-11 Summit session. No auth, not IP-blocked, polite 2s throttle.
on:
  workflow_dispatch:
    inputs:
      date_start: {description: "MM/DD/YYYY (default 45d back)", required: false, default: ""}
      date_stop:  {description: "MM/DD/YYYY (default 60d fwd)",  required: false, default: ""}
  schedule:
    - cron: "30 8 * * 1,4"   # Mon+Thu 08:30Z (Thu = after Brevard TD sale days)
concurrency: {group: brevard-realtdm, cancel-in-progress: false}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Sweep RealTDM cases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/realtdm_cases_sweep.py "${{ github.event.inputs.date_start }}" "${{ github.event.inputs.date_stop }}"
