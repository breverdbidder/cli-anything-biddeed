name: "Install Playwright MCP on Hetzner"
on:
  workflow_dispatch: {}
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Install on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            echo "=== Installing Playwright MCP on Hetzner ==="
            
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH="/home/claude/.npm-global/bin:$PATH"
            
            # Install Playwright MCP + browser deps
            npm install -g @playwright/mcp@latest 2>&1 | tail -5
            npx playwright install chromium --with-deps 2>&1 | tail -10
            
            # Register MCP for Claude Code (project-wide)
            mkdir -p /opt/biddeed
            cd /opt/biddeed
            
            # Add to Claude Code MCP config
            su - claude -c "claude mcp add --scope user playwright npx @playwright/mcp@latest" 2>&1 || true
            
            # Also add to .claude.json directly as backup
            CLAUDE_JSON="/home/claude/.claude.json"
            if [ -f "$CLAUDE_JSON" ]; then
              python3 -c "
import json
with open('$CLAUDE_JSON') as f:
    d = json.load(f)
if 'mcpServers' not in d:
    d['mcpServers'] = {}
d['mcpServers']['playwright'] = {
    'type': 'stdio',
    'command': 'npx',
    'args': ['-y', '@playwright/mcp@latest']
}
with open('$CLAUDE_JSON', 'w') as f:
    json.dump(d, f, indent=2)
print('✅ Added Playwright MCP to .claude.json')
"
            else
              echo '{"mcpServers":{"playwright":{"type":"stdio","command":"npx","args":["-y","@playwright/mcp@latest"]}}}' > "$CLAUDE_JSON"
              echo "✅ Created .claude.json with Playwright MCP"
            fi
            chown claude:claude "$CLAUDE_JSON"
            
            # Also add to CLAUDE.md so Claude Code knows about it
            for repo in zonewise-web cli-anything-biddeed; do
              if [ -d "/opt/biddeed/$repo" ]; then
                CLAUDE_MD="/opt/biddeed/$repo/CLAUDE.md"
                if [ -f "$CLAUDE_MD" ] && ! grep -q "playwright" "$CLAUDE_MD"; then
                  echo "" >> "$CLAUDE_MD"
                  echo "## Playwright MCP" >> "$CLAUDE_MD"
                  echo "Playwright MCP is available. Use it for browser verification:" >> "$CLAUDE_MD"
                  echo '- "Use playwright mcp to open zonewise.ai/explorer and verify the map loads"' >> "$CLAUDE_MD"
                  echo '- "Take a screenshot of zonewise.ai/pricing and verify 3 tiers show"' >> "$CLAUDE_MD"
                  echo '- "Navigate to /explorer, wait 10s, verify no ErrorBoundary shown"' >> "$CLAUDE_MD"
                fi
              fi
            done
            
            # Verify
            echo ""
            echo "=== Verification ==="
            which npx && echo "✅ npx available"
            npx @playwright/mcp@latest --help 2>&1 | head -3 || echo "MCP installed (no --help flag)"
            npx playwright --version 2>&1
            cat "$CLAUDE_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'✅ MCP servers: {list(d.get(\"mcpServers\",{}).keys())}')"
            echo "✅ Playwright MCP installed and configured"

      - name: "Notify"
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=🎭 *Playwright MCP*: ${{ job.status }}
          Installed @playwright/mcp + Chromium on Hetzner
          Registered in Claude Code MCP config
          Claude Code can now drive real browsers" || true
