name: Close Stale Issue #115 — GHA-044084 Resolved

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-stale-115.yml'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark GHA-044084 done in nexus_tasks and close issue #115
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="breverdbidder/cli-anything-biddeed"

          # 1. Mark GHA-044084 as done in nexus_tasks
          SB_PAYLOAD=$(jq -n \
            --arg ts "$TIMESTAMP" \
            '{status:"done",completed_at:$ts,result_summary:"Stale task — root cause fixed by #114 (labels + skip_patterns). No current failure.",updated_at:$ts}')

          SB_RESULT=$(curl -s -o /tmp/sb_out.txt -w "%{http_code}" -X PATCH \
            "${SUPABASE_URL}/rest/v1/nexus_tasks?task_id=eq.GHA-044084" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$SB_PAYLOAD")
          echo "Supabase update: $SB_RESULT — $(cat /tmp/sb_out.txt | head -c 200)"

          # 2. Comment on issue #115
          COMMENT_BODY=$(jq -n '{body:"## Root Cause Analysis — VERIFIED\n\n**Finding:** GHA-044084 is a stale nexus_task created before commit `06391cd9` (issue #114) was deployed.\n\n**Current state:** Issue Triage Agent is operational. No active failure. GHA-044084 marked `done` in nexus_tasks.\n\n**No workflow changes needed.** Closing as resolved."}')

          GH_COMMENT=$(curl -s -o /tmp/gh_comment.txt -w "%{http_code}" -X POST \
            "https://api.github.com/repos/${REPO}/issues/115/comments" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_BODY")
          echo "Comment: $GH_COMMENT"

          # 3. Close issue #115
          GH_CLOSE=$(curl -s -o /tmp/gh_close.txt -w "%{http_code}" -X PATCH \
            "https://api.github.com/repos/${REPO}/issues/115" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed","state_reason":"completed"}')
          echo "Close issue: $GH_CLOSE"
