name: Platform Skills Eval Migration
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          export PGSSLMODE=require
          PROJECT_REF="mocerqjnksmhcjzxrewo"

          echo "=== Trying multiple Supabase connection patterns ==="

          SUCCESS=0

          # Try all pooler + direct connection patterns
          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_KEY}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_KEY}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE_CONN=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE_CONN"
            if psql "$CONN" -c "SELECT 1" 2>&1; then
              echo "Connected! Running migration..."
              psql "$CONN" -f migrations/20260328_platform_skills_eval.sql
              echo "=== Verifying tables ==="
              psql "$CONN" -c "
                SELECT 'skills_eval_results' AS tbl, COUNT(*) FROM skills_eval_results
                UNION ALL
                SELECT 'skills_adoption_log', COUNT(*) FROM skills_adoption_log;
              "
              echo "Migration complete. VERIFIED."
              SUCCESS=1
              break
            fi
          done

          if [ "$SUCCESS" = "0" ]; then
            echo "WARN: All direct psql attempts failed. Will try via Hetzner SSH."
          fi

      - name: Run migration via Hetzner SSH (fallback)
        if: success() || failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          envs: SUPABASE_DB_PASSWORD
          script: |
            set -e
            PROJECT_REF="mocerqjnksmhcjzxrewo"
            RAW_URL="https://raw.githubusercontent.com/breverdbidder/cli-anything-biddeed/main/migrations/20260328_platform_skills_eval.sql"
            curl -sf "$RAW_URL" -o /tmp/platform_skills_migration.sql
            echo "Migration SQL downloaded ($(wc -l < /tmp/platform_skills_migration.sql) lines)"
            which psql 2>/dev/null || apt-get install -y postgresql-client -q
            export PGSSLMODE=require
            SUCCESS=0
            for CONN in "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"; do
              echo "Hetzner trying: $(echo $CONN | sed 's|:[^:@]*@|:***@|g')"
              if psql "$CONN" -c "SELECT 1" 2>/dev/null; then
                psql "$CONN" -f /tmp/platform_skills_migration.sql
                psql "$CONN" -c "SELECT table_name FROM information_schema.tables WHERE table_name IN ('skills_eval_results','skills_adoption_log') ORDER BY 1;"
                echo "MIGRATION VERIFIED FROM HETZNER"
                SUCCESS=1
                break
              fi
            done
            if [ "$SUCCESS" = "0" ]; then
              echo "BLOCKER: All connection attempts failed from GHA and Hetzner."
              echo "Fix: Supabase Dashboard → Settings → Database → Reset Password → update SUPABASE_DB_PASSWORD secret"
              exit 1
            fi
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
