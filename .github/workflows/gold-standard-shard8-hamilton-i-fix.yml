name: "GS Shard-8: Hamilton I parcel_zones fix (dispatch 0d016197)"

on:
  workflow_dispatch:

concurrency:
  group: gold-standard-shard8-hamilton-i
  cancel-in-progress: false

jobs:
  hamilton-i-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "BEFORE — pencil_dod_evaluate_county hamilton"
        run: |
          set -euo pipefail
          echo "=== BEFORE STATE ==="
          python3 -c "
          import json
          q = \"SET statement_timeout = 0; SELECT public.pencil_dod_evaluate_county('hamilton') AS result;\"
          print(json.dumps({'query': q}))
          " > /tmp/before.json
          HTTP=$(curl -sS -o /tmp/before_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/before.json)
          echo "HTTP: $HTTP"
          cat /tmp/before_resp.json | python3 -m json.tool 2>/dev/null || cat /tmp/before_resp.json

      - name: "Apply Hamilton I parcel_zones migration v2"
        run: |
          set -euo pipefail
          echo "=== Applying 20260731_gold_standard_shard8_hamilton_i_parcel_zones_v2.sql ==="
          python3 -c "
          import json, sys
          sql = open('migrations/20260731_gold_standard_shard8_hamilton_i_parcel_zones_v2.sql').read()
          # Remove single-line comments for API compatibility
          lines = [l for l in sql.splitlines() if not l.strip().startswith('--')]
          sql_clean = '\n'.join(lines)
          print(json.dumps({'query': sql_clean}))
          " > /tmp/migration.json
          HTTP=$(curl -sS -o /tmp/migration_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/migration.json)
          echo "HTTP: $HTTP"
          cat /tmp/migration_resp.json | python3 -m json.tool 2>/dev/null || cat /tmp/migration_resp.json
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }

      - name: "AFTER — pencil_dod_evaluate_county hamilton"
        run: |
          set -euo pipefail
          echo "=== AFTER STATE ==="
          python3 -c "
          import json
          q = \"SET statement_timeout = 0; SELECT public.pencil_dod_evaluate_county('hamilton') AS result;\"
          print(json.dumps({'query': q}))
          " > /tmp/after.json
          HTTP=$(curl -sS -o /tmp/after_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/after.json)
          echo "HTTP: $HTTP"
          cat /tmp/after_resp.json | python3 -m json.tool 2>/dev/null || cat /tmp/after_resp.json

      - name: "SQL VERIFICATION — parcel_zones written"
        run: |
          set -euo pipefail
          python3 -c "
          import json
          q = '''SET statement_timeout = 0;
          SELECT pz.parcel_id, pz.zone_code, pz.source, pz.confidence_score, j.name AS jurisdiction
          FROM parcel_zones pz
          JOIN jurisdictions j ON j.id = pz.jurisdiction_id
          WHERE lower(j.county) = 'hamilton'
            AND pz.parcel_id IN (''4427-000'',''4421-000'',''4680-000'',''1005-130'',''3478-450'',''8282-000'')
          ORDER BY pz.parcel_id;'''
          print(json.dumps({'query': q}))
          " > /tmp/verify.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verify.json | python3 -m json.tool 2>/dev/null

      - name: "Update ULTRALOOP audit row to survived=true if metric improved"
        run: |
          set -euo pipefail
          python3 -c "
          import json
          q = '''SET statement_timeout = 0;
          UPDATE gold_standard_ultraloop_audit
          SET survived = true
          WHERE dispatch_id = '0d016197-9839-4dd1-9374-f99ac5e24954'
            AND county_slug = 'hamilton'
            AND letter = 'I'
            AND survived = false
            AND EXISTS (
              SELECT 1 FROM parcel_zones pz
              JOIN jurisdictions j ON j.id = pz.jurisdiction_id
              WHERE lower(j.county) = 'hamilton'
                AND pz.parcel_id IN (''4427-000'',''4421-000'',''4680-000'',''1005-130'',''3478-450'',''8282-000'')
            );
          SELECT dispatch_id, letter, survived, created_at
          FROM gold_standard_ultraloop_audit
          WHERE dispatch_id = '0d016197-9839-4dd1-9374-f99ac5e24954'
          ORDER BY created_at;'''
          print(json.dumps({'query': q}))
          " > /tmp/audit.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/audit.json | python3 -m json.tool 2>/dev/null
