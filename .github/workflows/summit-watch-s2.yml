name: "Summit: Watch Session 2 - Hooks + Scanner"
on:
  workflow_dispatch: {}

jobs:
  session2:
    name: "Hook Installer + Health Scanner"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute Session 2 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -2
            claude --version 2>/dev/null

            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main && git checkout main && git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed

            echo "=== Run Claude Code Session 2 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'You are executing Session 2 of the Claude Watch (Everest Edition) build plan.

              READ docs/plans/WATCH-SPEC.md and docs/plans/WATCH-PLAN.md FIRST.
              READ harnesses/watch/ to see what Session 1 already built.

              Execute all steps in Session 2 of PLAN.md:

              1. Create src/types.ts with shared TypeScript types (HookPayload, LogicFile, HealthScanResult)
              2. Create src/utils/classify.ts - file classification patterns adapted from NirDiamant/claude-watch brain-scanner.ts (MIT). ZERO execSync, ZERO child_process.
              3. Create src/utils/hash.ts - SHA-256 hashing utility
              4. Create src/health-scan.ts - walks project directory using fs only, classifies files, computes hashes, inserts to watch_health via Supabase REST API. Reads SCAN_TYPE, REPO_NAME, SUPABASE_URL, SUPABASE_SERVICE_KEY from env.
              5. Create src/install-hooks.ts - CLI tool to add/remove watch hooks in .claude/settings.json. Supports --global and --remove flags. Hook command: curl -sf -X POST SUPABASE_URL/functions/v1/watch-ingest with Bearer WATCH_TOKEN from env. Fire-and-forget (background with &).
              6. Update package.json with build scripts
              7. Test health scanner against THIS repo (cli-anything-biddeed) by running it
              8. Test hook installer by running it on a temp directory
              9. Git config: user.email ci@biddeed.ai, user.name BidDeed-CI
              10. Git push: git remote set-url origin https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git

              CRITICAL: Zero execSync or child_process in ANY source file. Only fs, path, crypto, https built-ins.
              Verify health scanner produces real results before committing.' \
              2>&1 | tee /tmp/watch-session2.log | tail -100
            "

            EXIT_CODE=${PIPESTATUS[0]}

            echo "=== Telegram ==="
            if [ $EXIT_CODE -eq 0 ]; then E="✅"; S="SUCCESS"; else E="❌"; S="FAILED (exit $EXIT_CODE)"; fi
            SUMMARY=$(tail -20 /tmp/watch-session2.log 2>/dev/null | head -10 | tr '\n' ' ' | cut -c1-400)
            MSG="${E} Watch Session 2: ${S}%0A%0ARepo: cli-anything-biddeed%0ATarget: harnesses/watch/src/%0A%0A${SUMMARY}"
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null 2>&1 || true
            exit $EXIT_CODE
