name: "Summit: Watch Session 2 - Hooks + Scanner"
on:
  workflow_dispatch: {}

jobs:
  session2:
    name: "Hook Installer + Health Scanner"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute Session 2 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== [1/5] Setup claude user ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/5] Update Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null

            echo "=== [3/5] Setup auth + pull repo ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main && git checkout main && git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed

            echo "=== [4/5] Run Claude Code Session 2 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'You are executing Session 2 of the Claude Watch (Everest Edition) build plan.

              READ docs/plans/WATCH-SPEC.md and docs/plans/WATCH-PLAN.md FIRST.
              Also READ harnesses/watch/ to see what Session 1 already built.

              Session 2 GOALS (from PLAN.md):
              1. Create shared types at harnesses/watch/src/types.ts (if not already complete)
              2. Create file classification utilities at harnesses/watch/src/utils/classify.ts
                 - Adapt patterns from NirDiamant/claude-watch brain-scanner.ts (MIT license)
                 - PROMPT_PATTERNS, RULES_PATTERNS, CONFIG_PATTERNS, DOCS_PATTERNS, STATE_PATTERNS
                 - CONTENT_SIGNALS (NEVER, ALWAYS, MUST density)
                 - SKIP_DIRS, INTERESTING_DIRS
                 - CRITICAL: ZERO execSync, ZERO child_process imports anywhere
              3. Create SHA-256 hash utility at harnesses/watch/src/utils/hash.ts
              4. Create health scanner at harnesses/watch/src/health-scan.ts
                 - Reads env: SCAN_TYPE, REPO_NAME, SUPABASE_URL, SUPABASE_SERVICE_KEY
                 - Walks current directory using fs.readdirSync only (NO shell commands)
                 - Classifies files, computes SHA-256 hash per file
                 - Inserts results into watch_health via Supabase REST API
                 - Reports count of scanned files
              5. Create hook installer at harnesses/watch/src/install-hooks.ts
                 - CLI flags: --global, --remove
                 - Reads/writes .claude/settings.json
                 - Adds PostToolUse, Notification, Stop hooks with fire-and-forget curl
                 - Hook target: Supabase Edge Function URL
                 - Idempotent (checks if hooks exist before adding)
                 - Warns if WATCH_TOKEN env var not set
              6. Validate health scanner by running it against THIS repo and checking Supabase
              7. Git config: git config user.email ci@biddeed.ai and git config user.name BidDeed-CI
              8. Git push: git remote set-url origin https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              9. Commit with message: feat(watch): Session 2 - hook installer + health scanner

              CRITICAL RULES:
              - ZERO execSync or child_process anywhere in source code
              - Use only Node.js built-ins: fs, path, crypto, https
              - Verify health scanner works with real DB query after running it
              - One attempt per approach, no retry loops
              - SUPABASE_URL and SUPABASE_SERVICE_KEY are in env vars' \
              2>&1 | tee /tmp/watch-session2.log | tail -100
            "

            EXIT_CODE=${PIPESTATUS[0]}

            echo "=== [5/5] Telegram Report ==="
            if [ $EXIT_CODE -eq 0 ]; then EMOJI="✅"; STATUS="SUCCESS"
            else EMOJI="❌"; STATUS="FAILED (exit $EXIT_CODE)"; fi

            SUMMARY=$(tail -20 /tmp/watch-session2.log 2>/dev/null | head -10 | tr '\n' ' ' | cut -c1-400)
            MSG="${EMOJI} Watch Session 2: ${STATUS}%0A%0AHook installer + Health scanner%0A%0A${SUMMARY}"

            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null 2>&1 || true

            exit $EXIT_CODE
