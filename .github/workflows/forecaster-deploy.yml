name: "Deploy Forecaster to Hetzner"

on:
  push:
    paths:
      - 'forecaster/**'
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test after deploy'
        required: false
        type: boolean
        default: true

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  deploy:
    name: "💰 Deploy Forecaster"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "1️⃣ Deploy to Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              cd /opt/biddeed
              git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
            fi
            cd ${{ env.REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main
            echo "📦 Pulled: $(git log --oneline -1)"

            test -f forecaster/agent.py       || { echo "❌ Missing agent.py"; exit 1; }
            test -f forecaster/CLAUDE.md      || { echo "❌ Missing CLAUDE.md"; exit 1; }
            test -f forecaster/eval/eval.json || { echo "❌ Missing eval.json"; exit 1; }

            pip install httpx --quiet --break-system-packages 2>/dev/null || true
            mkdir -p forecaster/eval_outputs
            echo "✅ Forecaster deployed"

      - name: "2️⃣ Smoke test"
        if: github.event.inputs.smoke_test != 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"

            echo "🧪 Smoke test: $85K medium_rehab forecast"
            python3 -m forecaster.agent forecast \
              --budget 85000 --template medium_rehab --arv 280000 \
              --json 2>/dev/null > forecaster/eval_outputs/smoke_test.json || true

            if [ -f forecaster/eval_outputs/smoke_test.json ]; then
              python3 -c "
            import json
            d = json.load(open('forecaster/eval_outputs/smoke_test.json'))
            stages = list(d.get('stages', {}).keys())
            fc = d.get('stages', {}).get('forecast', {})
            sc = d.get('stages', {}).get('scenarios', {})
            print(f'✅ {len(stages)} stages: {stages}')
            print(f'   Forecast: \${fc.get(\"total_forecast\", 0):,.0f}')
            print(f'   Variance: {fc.get(\"variance_pct\", 0):.1%}')
            print(f'   Best: \${sc.get(\"best_case\", {}).get(\"total\", 0):,.0f}')
            print(f'   Worst: \${sc.get(\"worst_case\", {}).get(\"total\", 0):,.0f}')
            bc = sc.get('base_case', {})
            if bc.get('max_bid_at_this_cost'):
                print(f'   Max bid at base cost: \${bc[\"max_bid_at_this_cost\"]:,.0f}')
              " 2>&1 || echo "⚠️ Smoke test JSON parse failed"
            else
              echo "❌ No output"
            fi

      - name: "3️⃣ Status check"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            python3 -m forecaster.agent status 2>&1

      - name: "4️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            STATUS="${{ job.status }}"
            EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
            COMMIT=$(cd ${{ env.REPO_PATH }} && git log --oneline -1)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              -d "text=${EMOJI} <b>Forecaster Deploy</b>: ${STATUS}
            Commit: ${COMMIT}
            Server: Hetzner" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 💰 Forecaster Deploy
          **Status:** ${{ job.status }}
          **Server:** Hetzner everest-dispatch
          **Smoke Test:** ${{ github.event.inputs.smoke_test != 'false' && 'Yes' || 'Skipped' }}
          EOF
