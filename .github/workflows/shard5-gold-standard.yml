name: SHARD-5 Gold Standard Execution
on:
  workflow_dispatch:
    inputs:
      county:
        description: 'County to process (or "all" for all SHARD-5 counties)'
        required: true
        default: 'broward'
        type: choice
        options:
          - broward
          - st_johns  
          - jackson
          - bradford
          - levy
          - all
      task:
        description: 'Task to execute (brevard sprint order)'
        required: true
        default: 'cd_parity'
        type: choice
        options:
          - cd_parity
          - j_generator
          - verification
          - full_pipeline
  schedule:
    # Run daily at 08:00Z per fleet schedule
    - cron: '0 8 * * *'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  shard5-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6-hour budget per brief
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Validate environment
      run: |
        echo "SUPABASE_URL: ${{ env.SUPABASE_URL }}"
        echo "SUPABASE_KEY available: ${{ secrets.SUPABASE_KEY != '' }}"
        python -c "import httpx, json, os; print('Dependencies OK')"
    
    - name: Execute C/D Parity Improvements
      if: ${{ github.event.inputs.task == 'cd_parity' || github.event.inputs.task == 'full_pipeline' || github.event_name == 'schedule' }}
      run: |
        echo "🎯 BREVARD SPRINT ORDER #1: C/D Root Cause"
        if [ "${{ github.event.inputs.county }}" == "all" ] || [ "${{ github.event_name }}" == "schedule" ]; then
          python scripts/shard5_parity_improvements.py --all-counties
        else
          python scripts/shard5_parity_improvements.py --county ${{ github.event.inputs.county }}
        fi
    
    - name: Execute J Generator (Bid Decisions)  
      if: ${{ github.event.inputs.task == 'j_generator' || github.event.inputs.task == 'full_pipeline' || github.event_name == 'schedule' }}
      run: |
        echo "🎯 BREVARD SPRINT ORDER #2: J Generator"
        if [ "${{ github.event.inputs.county }}" == "all" ] || [ "${{ github.event_name }}" == "schedule" ]; then
          python scripts/shard5_deal_thesis.py --all-counties
        else
          python scripts/shard5_deal_thesis.py --county ${{ github.event.inputs.county }}
        fi
    
    - name: Run Verification Protocol
      if: ${{ github.event.inputs.task == 'verification' || github.event.inputs.task == 'full_pipeline' || github.event_name == 'schedule' }}
      run: |
        echo "📊 VERIFICATION PROTOCOL"
        python scripts/verify_shard5_status.py
    
    - name: Post-execution audit
      if: always()
      run: |
        echo "🔍 SHARD-5 Session Complete"
        echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        echo "Task: ${{ github.event.inputs.task || 'scheduled_full_pipeline' }}"
        echo "County: ${{ github.event.inputs.county || 'all' }}"
        echo "Status: ${{ job.status }}"
        
        # Log basic metrics for brief compliance
        echo "Next steps: Run pencil_dod_evaluate_county() in production environment"
        echo "Ship-to-main mandate: This workflow commits directly to main branch"
    
    - name: Handle failures
      if: failure()
      run: |
        echo "❌ SHARD-5 execution failed"
        echo "Check logs above for specific error details"
        echo "Common issues: database connectivity, environment variables"
        exit 1