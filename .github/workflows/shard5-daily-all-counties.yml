name: "SHARD-5 Daily — collier/leon/highlands/bradford/wakulla"
# Daily pipeline wiring all shard-5 scripts for the 5-county Gold Standard build.
# Session: run=338, dispatch 081d3e03 (2026-06-24)
# Runs at 05:30Z daily — before the 07:30Z gold_standard_loop pg_cron job.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to run (leave empty for all)'
        required: false
        default: ''

jobs:

  # ── H-FRESHNESS ──────────────────────────────────────────────────────────────
  h-freshness:
    name: "H: Freshness patch — collier/leon/highlands/bradford/wakulla"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 -q

      - name: "Run shard5_h_freshness.py"
        run: |
          set -euo pipefail
          python scripts/shard5_h_freshness.py

  # ── FC BOOTSTRAP (highlands + bradford/wakulla) ───────────────────────────
  scrape-fc:
    name: "A: FC Bootstrap — highlands + bradford/wakulla"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: h-freshness
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 -q

      - name: "Run shard5_highlands_fc_bootstrap.py"
        run: |
          set -euo pipefail
          python scripts/shard5_highlands_fc_bootstrap.py

      - name: "Run shard5_bradford_wakulla_bootstrap.py"
        run: |
          set -euo pipefail
          python scripts/shard5_bradford_wakulla_bootstrap.py

  # ── COLLIER REAL DATA ────────────────────────────────────────────────────────
  scrape-real:
    name: "Real Data: Collier realforeclose/realtaxdeed scrape"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: h-freshness
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 -q

      - name: "Run shard5_collier_real_data.py"
        run: |
          set -euo pipefail
          python scripts/shard5_collier_real_data.py

  # ── OUTCOMES SCRAPER (B/F) ───────────────────────────────────────────────────
  outcomes:
    name: "B/F: Outcome rows — leon/collier/highlands/bradford"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [scrape-fc, scrape-real]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 -q

      - name: "Run shard5_outcomes_scraper.py"
        run: |
          set -euo pipefail
          python scripts/shard5_outcomes_scraper.py

  # ── J BID-DECISIONS ──────────────────────────────────────────────────────────
  deal-j:
    name: "J: Bid-decisions for all shard-5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scrape-fc, scrape-real]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 -q

      - name: "Run shard5_j_generator.py"
        run: |
          set -euo pipefail
          python scripts/shard5_j_generator.py
