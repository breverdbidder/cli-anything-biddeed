name: Claude Code

# v5 (2026-08-13): skip 'opened' trigger for label:summit issues (architect
# triage of issue #19037 fleet-wide stall). SUMMIT-dispatched issues are
# machine-created with '@claude' in the body and already get a dedicated
# workflow_dispatch run on cc-runner-ghonly.yml a minute later. Without this
# guard, EVERY SUMMIT issue fired a second, unwanted session here that shares
# the same CLAUDE_CODE_OAUTH_TOKEN Max-plan spending cap as the real 6h runner
# AND, if it ever got quota, would push a side-branch/PR — directly violating
# the SHIP-TO-MAIN MANDATE the real runner operates under. Verified via
# gha_dispatch: run 31680155340 (issue #19037, 2026-08-13T08:00Z) burned a job
# in 35s with "Spending cap reached resets 1pm" and posted a scary but
# meaningless "Claude encountered an error" comment, while the real run
# (31680207431, cc-runner-ghonly.yml) worked correctly in parallel. Sibling
# SUMMIT issues #19038-19040 hit the identical pattern the same morning.
# v4 (2026-06-09): mode fix — workflow_dispatch events require 'agent' mode
# (tag mode only handles issue/comment events; dispatch lane was structurally
# broken since v3 regardless of token validity). OAuth-only auth unchanged.
# v3 (2026-05-28): OAuth-only auth restored.
# Previous v2 used anthropic_api_key which violated Max-plan-only architecture.
# This file will return 401 until CLAUDE_CODE_OAUTH_TOKEN is refreshed
# (run `claude login` locally + update GitHub repo secret).
# That is the CORRECT fail-safe state — no metered billing escape hatch.
#
# direct_prompt parameter retained from v2 fix (the action's actual input name).

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process manually'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude-code:
    if: |
      (github.event_name == 'issues' && (
        (github.event.action == 'labeled' && (github.event.label.name == 'claude-code' || github.event.label.name == 'coder')) ||
        (github.event.action == 'opened' && contains(github.event.issue.body, '@claude') && !contains(github.event.issue.labels.*.name, 'summit'))
      )) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && 'agent' || 'tag' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-4-6
          direct_prompt: |
            Process the GitHub issue that triggered this workflow.

            Workflow:
            1. Read CLAUDE.md for autonomous-scope directives. Read TODO.md if present.
            2. If the task involves county expansion, read docs/plans/COUNTY-EXPANSION-CLAUDE.md.
            3. Execute the work end-to-end. Commit frequently with descriptive messages.
            4. Run any available tests. Push to a new branch.
            5. Open a PR with a summary of changes. Link it back to the originating issue.
            6. Do NOT wait for human feedback. Do NOT ask permission for actions covered by CLAUDE.md autonomous-scope rules.

            If you hit a true blocker after 3 retry attempts, comment on the issue with:
            "BLOCKED: <issue>. Tried: <attempts>. Recommend: <solution>. Approve?"
