name: Claude Code

# v2 (2026-05-28 fix):
#   - Switched auth from claude_code_oauth_token to anthropic_api_key
#     (OAuth token in CLAUDE_CODE_OAUTH_TOKEN was returning 401 Invalid creds;
#      refresh required — when refreshed, swap the auth line back).
#   - Corrected 'prompt:' to 'direct_prompt:' (correct parameter name per
#     anthropics/claude-code-action@beta's actual input list).
#
# Cost note: anthropic_api_key uses metered billing, NOT Max-plan unlimited.
# Refresh CLAUDE_CODE_OAUTH_TOKEN ASAP to switch back to Max-plan auth.

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process manually'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude-code:
    if: |
      (github.event_name == 'issues' && (
        (github.event.action == 'labeled' && (github.event.label.name == 'claude-code' || github.event.label.name == 'coder')) ||
        (github.event.action == 'opened' && contains(github.event.issue.body, '@claude'))
      )) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Process the GitHub issue that triggered this workflow.

            Workflow:
            1. Read CLAUDE.md for autonomous-scope directives. Read TODO.md if present.
            2. If the task involves county expansion, read docs/plans/COUNTY-EXPANSION-CLAUDE.md.
            3. Execute the work end-to-end. Commit frequently with descriptive messages.
            4. Run any available tests. Push to a new branch.
            5. Open a PR with a summary of changes. Link it back to the originating issue.
            6. Do NOT wait for human feedback. Do NOT ask permission for actions covered by CLAUDE.md autonomous-scope rules.

            If you hit a true blocker after 3 retry attempts, comment on the issue with:
            "BLOCKED: <issue>. Tried: <attempts>. Recommend: <solution>. Approve?"
