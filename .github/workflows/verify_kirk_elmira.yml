name: Verify Kirkland & Elmira

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          cd /opt/brevard-bidder-scraper
          
          cat > /tmp/verify/scrape.py <<'PY'
          import sys, os, json, csv, urllib.parse, urllib.request, time, re
          sys.path.insert(0, '/opt/brevard-bidder-scraper')
          from src.scrapers.acclaimweb_scraper import AcclaimWebScraper
          
          OUT = '/tmp/verify'
          os.makedirs(OUT, exist_ok=True)
          
          scraper = AcclaimWebScraper()
          
          # Search 1: 1107 KIRKLAND LLC as GRANTOR (post-purchase sales)
          # Search 2: Donna M McCarthy as GRANTOR (Elmira pre-Everest sale)
          # Search 3: Everest Capital as GRANTOR with "ELMIRA" in legal
          
          searches = [
              {"id": "kirkland_llc_grantor", "name": "1107 KIRKLAND LLC", "ptype": "Grantor",
               "from": "01/01/2019", "to": "12/31/2026"},
              {"id": "mccarthy_grantor", "name": "MCCARTHY,DONNA", "ptype": "Grantor",
               "from": "01/01/2018", "to": "12/31/2025"},
              {"id": "everest_brevard_grantor", "name": "EVEREST CAPITAL OF BREVARD", "ptype": "Grantor",
               "from": "01/01/2024", "to": "12/31/2026"},
              # Also search for property360 since that's Mariam's brokerage
              {"id": "property360_brokerage", "name": "PROPERTY 360", "ptype": "Both",
               "from": "01/01/2018", "to": "12/31/2026"},
          ]
          
          for s in searches:
              print(f"\n=== {s['id']}: {s['name']} ({s['ptype']}) ===", flush=True)
              try:
                  data = scraper.search_by_party(
                      party_name=s['name'],
                      party_type=s['ptype'],
                      date_from=s['from'],
                      date_to=s['to']
                  )
                  fname = f"{OUT}/{s['id']}.csv"
                  with open(fname, 'w') as f:
                      f.write(data)
                  size = len(data)
                  lines = data.count('\n')
                  print(f"  saved: {size}b, ~{lines} rows", flush=True)
                  
                  # Show first 5 rows of csv
                  reader = csv.DictReader(data.splitlines())
                  count = 0
                  for row in reader:
                      legal = (row.get('DocLegalDescription','') or '').upper()
                      # Filter for relevant ones
                      if s['id'] == 'kirkland_llc_grantor' or 'ELMIRA' in legal or 'COCOA MODERN' in legal or 'MELBOURNE' in legal.upper():
                          print(f"    [{row.get('Party')}] {row.get('RecordDate','')[:10]} | {row.get('Name','')[:25]} ↔ {row.get('CrossPartyName','')[:30]}", flush=True)
                          print(f"       {row.get('DocTypeDescription')} | ${row.get('Consideration')} | Inst {row.get('InstrumentNumber')}", flush=True)
                          print(f"       legal: {legal[:90]}", flush=True)
                          count += 1
                          if count >= 15: break
              except Exception as e:
                  print(f"  ERR: {e}", flush=True)
              time.sleep(2)
          
          # Also do a direct address-based search for ELMIRA
          print(f"\n=== Search legal description for ELMIRA ===", flush=True)
          # Use scraper's underlying search for legal description if available
          # Otherwise fall back to grantor scan + filter
          PY
          
          source venv/bin/activate 2>/dev/null || true
          export PYTHONPATH=/opt/brevard-bidder-scraper:$PYTHONPATH
          python3 /tmp/verify/scrape.py 2>&1 | tee /tmp/verify/run.log
          echo "---"
          ls -la /tmp/verify/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/verify/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kirk_elmira_verify
          path: /tmp/results/
