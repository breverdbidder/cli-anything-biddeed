name: "SUMMIT #180: Playwright Verify S1 (Post-Passover)"

on:
  schedule:
    - cron: '0 14 7 4 *'
  workflow_dispatch: {}

jobs:
  dispatch-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Playwright verification
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/dispatch-gha.yml/dispatches" \
            -d '{"ref":"main","inputs":{"prompt":"SUMMIT #180 Playwright Visual QA. Read issue #180 for checklist. Install playwright. Navigate zonewise.ai, simulate 5 county clicks, screenshot each state. Navigate /dashboard, screenshot split-screen. Mobile 375x812. Upload screenshots to Supabase storage. Check shadcn data attributes. Verify tables exist. Comment on issue #180 with results.","repo":"breverdbidder/zonewise-web","timeout":"30"}}'
          echo "Dispatched"
