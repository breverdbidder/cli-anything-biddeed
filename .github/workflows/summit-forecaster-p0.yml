name: "Summit: Forecaster P0 — Claude Code Auto Session"

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Max session minutes'
        required: false
        default: '45'
      dry_run:
        description: 'Dry run (show prompt only, no Claude Code)'
        required: false
        type: boolean
        default: false

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  summit:
    name: "⛰️ Summit: Forecaster P0"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "1️⃣ Preflight"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              cd /opt/biddeed
              git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
            fi
            cd ${{ env.REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main
            echo "📦 HEAD: $(git log --oneline -1)"

            command -v claude &>/dev/null || npm install -g @anthropic-ai/claude-code
            claude --version 2>/dev/null || true

            test -f forecaster/agent.py       && echo "✅ agent.py"
            test -f forecaster/CLAUDE.md      && echo "✅ CLAUDE.md"
            test -f forecaster/eval/eval.json && echo "✅ eval.json"
            python3 -c "import httpx; print(f'✅ httpx {httpx.__version__}')" || pip install httpx --break-system-packages
            echo "✅ Preflight complete"

      - name: "2️⃣ Upload prompt"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cat > /opt/biddeed/forecaster-p0-prompt.md << 'PROMPTEOF'
            You are working on the Cost Forecaster agent in /opt/biddeed/cli-anything-biddeed/forecaster/

            Read forecaster/CLAUDE.md FIRST. It is your root directive.

            ## SESSION GOAL

            Create Supabase tables, add persistence (--save), add spend logging (update-spend), and wire historical data query. 4 phases, 4 commits.

            ## PHASE 1: CREATE SUPABASE TABLES

            Create two tables using curl to the Supabase REST API or as a migration SQL file.

            Table 1: rehab_projects — id, parcel_id, project_name, template, total_budget, total_spent, total_forecast, variance_pct, status, start_date, projected_weeks, arv, alerts_json (JSONB), scenarios_json (JSONB), created_at, updated_at. Indexes on parcel_id and status.

            Table 2: rehab_spend_log — id, project_id (FK to rehab_projects), parcel_id, category, amount, description, vendor, receipt_url, spend_date, created_at. Indexes on project_id and parcel_id.

            If exec_sql RPC is unavailable, create forecaster/migrations/001_create_tables.sql and move on.

            Verify: Query tables to confirm existence.

            COMMIT: `git add -A && git commit -m "feat(forecaster): Supabase tables rehab_projects + rehab_spend_log" && git push origin main`

            ## PHASE 2: ADD --save FLAG

            Modify forecast subcommand in agent.py:
            1. Add --save flag to argparse
            2. When --save passed, upsert result to rehab_projects table after pipeline runs
            3. Map: parcel_id, template, total_budget, total_spent (from velocity.total_spent), total_forecast, variance_pct, arv, alerts_json, scenarios_json, status='ACTIVE'
            4. Use existing supabase_upsert() function

            Verify: Run with --save and confirm row in Supabase.

            COMMIT: `git add -A && git commit -m "feat(forecaster): --save flag persists forecast to Supabase" && git push origin main`

            ## PHASE 3: ADD update-spend SUBCOMMAND

            Add new subcommand to agent.py:
            `python3 -m forecaster.agent update-spend --parcel "..." --category kitchen --amount 4500 --vendor "Home Depot" --description "Cabinets"`

            1. Argparse: --parcel (required), --category (required), --amount (required), --vendor, --description, --date
            2. Insert to rehab_spend_log via Supabase REST POST
            3. After insert, query total spent for this parcel and print summary to stderr
            4. Validate category against template categories — warn if unknown but still insert

            COMMIT: `git add -A && git commit -m "feat(forecaster): update-spend subcommand for expense tracking" && git push origin main`

            ## PHASE 4: WIRE HISTORY + SMOKE TEST

            Improve stage_history():
            1. Query rehab_projects WHERE status='COMPLETED' for avg costs
            2. Also query historical_auctions for repair_estimate data as fallback
            3. Calculate real avg_final_cost, avg_overrun_pct if data exists
            4. Keep Brevard pattern defaults as fallback when no data

            Smoke test:
            1. `python3 -m forecaster.agent forecast --budget 85000 --template medium_rehab --arv 280000 --json 2>/dev/null > forecaster/eval_outputs/smoke_test.json`
            2. Validate JSON output
            3. `python3 -m forecaster.agent status 2>&1`
            4. Run eval if available: `python3 scripts/eval_runner.py --eval-file forecaster/eval/eval.json --outputs-dir forecaster/eval_outputs/ || true`

            COMMIT: `git add -A && git commit -m "feat(forecaster): historical query + smoke test $(date +%Y%m%d)" && git push origin main`

            ## RULES

            - You are autonomous. The human is not available. Never ask questions.
            - ONE commit per phase. Push after each. 4 total commits expected.
            - All print() → sys.stderr. Only --json output on stdout. ALREADY correct — don't break it.
            - All httpx.Client() uses headers=UA. ALREADY correct — don't break it.
            - If Supabase exec_sql unavailable, create SQL migration file and move on.
            - Context at 50% → stop and push. No /compact.
            - Targeted changes only. No full-file refactors.
            - No new deps beyond httpx. Don't touch eval.json.
            - Budget: under $5.
            PROMPTEOF

            wc -c /opt/biddeed/forecaster-p0-prompt.md
            echo "✅ Prompt uploaded"

      - name: "3️⃣ Execute Claude Code auto-mode"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: ${{ github.event.inputs.max_minutes || '45' }}m
          script: |
            export ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            cd ${{ env.REPO_PATH }}

            git config user.email "claude@biddeed.ai"
            git config user.name "Claude Code (Forecaster P0)"
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git

            PROMPT=$(cat /opt/biddeed/forecaster-p0-prompt.md)
            LOG="forecaster/eval/summit_p0_$(date +%Y%m%d_%H%M%S).log"

            echo "⛰️ Summit: Forecaster P0 | $(date) | Max: ${{ github.event.inputs.max_minutes || '45' }}m"
            claude -p "$PROMPT" --dangerously-skip-permissions 2>&1 | tee "$LOG" || true
            echo "⏰ Session ended: $(date)"

            git add -A
            git diff --cached --quiet || {
              git commit -m "summit(forecaster): P0 session complete $(date +%Y%m%d_%H%M%S)"
              git push origin main
            } || true

            COMMITS=$(git log --oneline --since="1 hour ago" --grep="forecaster" | wc -l)
            echo "📊 Commits this session: $COMMITS"

      - name: "4️⃣ Post-session verify"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"

            echo "=== Post-Session Verification ==="

            echo "--- JSON validity ---"
            python3 -m forecaster.agent forecast --budget 85000 --template medium_rehab --arv 280000 --json 2>/dev/null \
              | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            stages=list(d.get('stages',{}).keys())
            fc=d.get('stages',{}).get('forecast',{})
            sc=d.get('stages',{}).get('scenarios',{})
            print(f'✅ JSON valid | {len(stages)} stages')
            print(f'   Forecast: \${fc.get(\"total_forecast\",0):,.0f}')
            print(f'   Best: \${sc.get(\"best_case\",{}).get(\"total\",0):,.0f}')
            print(f'   Worst: \${sc.get(\"worst_case\",{}).get(\"total\",0):,.0f}')
            " 2>&1 || echo "❌ JSON broken"

            echo "--- Connectivity ---"
            python3 -m forecaster.agent status 2>&1

            echo "--- Session commits ---"
            git log --oneline --since="2 hours ago" --grep="forecaster" 2>/dev/null | head -10

      - name: "5️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            cd ${{ env.REPO_PATH }}
            STATUS="${{ job.status }}"
            EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
            COMMITS=$(git log --oneline --since="2 hours ago" --grep="forecaster" | wc -l)
            HEAD=$(git log --oneline -1)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              -d "text=${EMOJI} <b>Summit: Forecaster P0</b>
            Status: ${STATUS}
            Commits: ${COMMITS}
            HEAD: ${HEAD}
            Server: Hetzner
            Mode: Claude Code auto" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ⛰️ Summit: Forecaster P0
          **Status:** ${{ job.status }}
          **Server:** Hetzner everest-dispatch
          **Mode:** Claude Code auto (${{ github.event.inputs.max_minutes || '45' }}m max)

          ### Expected Commits
          1. \`feat(forecaster): Supabase tables rehab_projects + rehab_spend_log\`
          2. \`feat(forecaster): --save flag persists forecast to Supabase\`
          3. \`feat(forecaster): update-spend subcommand for expense tracking\`
          4. \`feat(forecaster): historical query + smoke test\`
          EOF
