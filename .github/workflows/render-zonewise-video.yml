name: Render ZoneWise Demo Video (v2)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition to render"
        required: false
        default: "ZoneWiseDemo"
        type: choice
        options:
          - ZoneWiseDemo
          - ZoneWiseHook

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-video
          path: zonewise-video-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: zonewise-video-src/package-lock.json

      - name: Install dependencies
        working-directory: zonewise-video-src
        run: npm ci

      - name: Install Chrome for Remotion
        working-directory: zonewise-video-src
        run: npx remotion browser ensure

      - name: Render full video
        working-directory: zonewise-video-src
        run: |
          mkdir -p out
          npx remotion render src/index.ts ${{ github.event.inputs.composition || 'ZoneWiseDemo' }} out/zonewise-demo.mp4 \
            --fps=30 \
            --width=1920 \
            --height=1080 \
            --concurrency=4 \
            --log=verbose

      - name: Render hook clip (15s)
        if: ${{ github.event.inputs.composition != 'ZoneWiseHook' }}
        working-directory: zonewise-video-src
        run: |
          npx remotion render src/index.ts ZoneWiseHook out/hook.mp4 \
            --fps=30 \
            --width=1920 \
            --height=1080

      - name: Install ffmpeg + convert hook to GIF
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -i zonewise-video-src/out/hook.mp4 \
            -vf "fps=15,scale=1280:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            zonewise-video-src/out/hook.gif || echo "GIF conversion failed, skipping"

      - name: Upload MP4 to Supabase Storage
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/edp-screenshots/video/zonewise-demo.mp4" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: video/mp4" \
            --data-binary @zonewise-video-src/out/zonewise-demo.mp4 \
            -o /tmp/upload-video.json
          cat /tmp/upload-video.json

      - name: Upload GIF to Supabase Storage
        run: |
          if [ -f "zonewise-video-src/out/hook.gif" ]; then
            curl -s -X POST \
              "${{ secrets.SUPABASE_URL }}/storage/v1/object/edp-screenshots/video/hook.gif" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
              -H "Content-Type: image/gif" \
              --data-binary @zonewise-video-src/out/hook.gif \
              -o /tmp/upload-gif.json
            cat /tmp/upload-gif.json
          fi

      - name: Comment on issue #196
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const supabaseUrl = '${{ secrets.SUPABASE_URL }}';
            const videoUrl = `${supabaseUrl}/storage/v1/object/public/edp-screenshots/video/zonewise-demo.mp4`;
            const gifUrl = `${supabaseUrl}/storage/v1/object/public/edp-screenshots/video/hook.gif`;
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 196,
              body: `## 🎬 ZoneWise Demo Video — RENDERED

**Full 3-min video (MP4, 1920×1080 @30fps):**
${videoUrl}

**Hook clip GIF (first 15s, social media):**
${gifUrl}

### Scene breakdown
| # | Scene | Frames | Duration |
|---|-------|--------|----------|
| 1 | Hook — 3D house, FOR AUCTION sign | 0-450 | 0:00-0:15 |
| 2 | The Problem — spreadsheet vs choropleth | 450-1350 | 0:15-0:45 |
| 3 | 12-Step Pipeline — staggered cards | 1350-2700 | 0:45-1:30 |
| 4 | Product Demo — dashboard + chat | 2700-3900 | 1:30-2:15 |
| 5 | The Moat — TextScramble + pyramid | 3900-4950 | 2:15-2:45 |
| 6 | CTA — particle burst + fade to black | 4950-5400 | 2:45-3:00 |

**Stack:** Remotion 4.0 + React 18 + Three.js + @react-three/fiber
**Source:** https://github.com/breverdbidder/zonewise-video
**GHA Run:** ${runUrl}

Audio (ElevenLabs voiceover) — post-Passover V2.
`
            });

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zonewise-video-${{ github.sha }}
          path: |
            zonewise-video-src/out/zonewise-demo.mp4
            zonewise-video-src/out/hook.gif
          retention-days: 30
