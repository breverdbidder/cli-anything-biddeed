name: "Gold Standard SHARD-10 — glades + gilchrist (b88eb871)"
# dispatch_id: b88eb871-d591-4bee-ba54-cd8975d486b5
# glades:    8/10 — C/D structurally blocked (5+ sessions confirmed)
# gilchrist: 6/10 — C/D/I/J each 83.3% (1 unmatched/incomplete row)
# SHIP-TO-MAIN: yes — runs on main, commits verification data back

on:
  workflow_dispatch: {}
  schedule:
    # Daily 08:00Z, 16:00Z, 00:00Z — matches 3-wave fleet cadence
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
    - cron: "0 0 * * *"

concurrency:
  group: gold-standard-shard10-glades-gilchrist
  cancel-in-progress: false

jobs:
  shard10-glades-gilchrist:
    name: "SHARD-10 Gold Standard — glades + gilchrist"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run glades + gilchrist fix
        run: |
          set -euo pipefail
          echo "=== SHARD-10: glades + gilchrist (dispatch b88eb871) ==="
          python3 scripts/shard10_glades_gilchrist_b88eb871.py

      - name: Verify pencil_dod for both counties
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          H = {
              "apikey": SB_KEY,
              "Authorization": f"Bearer {SB_KEY}",
              "Content-Type": "application/json",
          }

          total_score = 0
          for county in ["glades", "gilchrist"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(
                  f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
                  data=body, headers=H, method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  score = len(passed)
                  total_score += score
                  star = "★ GOLD" if score == 10 else ""
                  print(f"  {county}: {score}/10 {star}")
                  if failed:
                      print(f"    FAILING: {failed}")
                  for l in "ABCDEFGHIJ":
                      ld = ev.get(l, {})
                      print(f"    {l}: {'PASS' if ld.get('pass') else 'FAIL'} "
                            f"metric={ld.get('metric')} detail={ld.get('detail','')}")
                  print(f"  RAW: {json.dumps(ev)}")
              except Exception as e:
                  print(f"  {county}: ERROR {e}")

          print(f"\nSHARD-10 total: {total_score}/20")
          PYEOF

      - name: H freshness touch (keep SLA green)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          H = {
              "apikey": SB_KEY,
              "Authorization": f"Bearer {SB_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=minimal",
          }
          now_utc = datetime.now(timezone.utc).isoformat()

          for county in ["glades", "gilchrist"]:
              qs = urllib.parse.urlencode({"county": f"eq.{county}"})
              url = f"{SB_URL}/rest/v1/multi_county_auctions?{qs}"
              req = urllib.request.Request(
                  url, data=json.dumps({"last_seen_at": now_utc}).encode(),
                  headers=H, method="PATCH"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      r.read()
                  print(f"  {county}: H freshness touched (last_seen_at={now_utc[:19]})")
              except Exception as e:
                  print(f"  {county}: H freshness FAILED: {e}")
          PYEOF
