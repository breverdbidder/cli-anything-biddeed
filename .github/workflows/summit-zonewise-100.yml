name: "Summit: ZoneWise Brevard 100% Completion"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run (all, melbourne, usecode, normalize, dedup)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - melbourne
          - usecode
          - normalize
          - dedup

jobs:
  # Phase 1: Melbourne gap fill (10,626 missing parcels)
  melbourne-gap-fill:
    name: "P1: Melbourne Gap Fill (10,626)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'melbourne' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: "Fill Melbourne 10,626 gap"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/melbourne_gap_fill_v2.py

  # Phase 2: USE_CODE gap fill (Melbourne Village 683 + Unincorporated 19,303)
  usecode-gap-fill:
    name: "P2: USE_CODE Fill (19,986)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [melbourne-gap-fill]
    if: |
      always() &&
      (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'usecode') &&
      (needs.melbourne-gap-fill.result == 'success' || needs.melbourne-gap-fill.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: "Fill Melbourne Village + Unincorporated"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/usecode_gap_fill_final.py

  # Phase 3: Normalize jurisdictions (22 → 17 canonical)
  normalize-jurisdictions:
    name: "P3: Normalize Jurisdictions (22→17)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [usecode-gap-fill]
    if: |
      always() &&
      (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'normalize') &&
      (needs.usecode-gap-fill.result == 'success' || needs.usecode-gap-fill.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: "Normalize unincorporated jurisdictions"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/normalize_jurisdictions.py

  # Phase 4: Dedup + Validate (fix over-counts, final verification)
  dedup-validate:
    name: "P4: Dedup + Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [normalize-jurisdictions]
    if: |
      always() &&
      (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'dedup') &&
      (needs.normalize-jurisdictions.result == 'success' || needs.normalize-jurisdictions.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: "Dedup orphan rows + final COUNT(*) verification"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/dedup_and_validate.py
