name: SHARD-9 Gold Standard Executor

on:
  schedule:
    - cron: "0 8 * * *"  # Daily at 08:00Z (matches session schedule)
  workflow_dispatch:
    inputs:
      counties:
        description: 'Counties to process (comma-separated)'
        required: false
        default: 'lee,alachua,nassau,dixie,taylor'
      phase:
        description: 'Phase to run (all, verification-only)'
        required: false
        default: 'all'

jobs:
  shard9-gold-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour ceiling (matches autonomous session limit)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install httpx
          
      - name: Configure git for commits
        run: |
          git config --global user.name "SHARD-9 Gold Standard Bot"
          git config --global user.email "shard9-bot@biddeed.ai"
          
      - name: Execute SHARD-9 Gold Standard Improvements
        if: inputs.phase != 'verification-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🚀 Starting SHARD-9 Gold Standard improvements..."
          echo "Target counties: lee, alachua, nassau, dixie, taylor"
          echo "Session start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          python3 scripts/shard9_gold_standard_improvements.py
          
      - name: Execute Verification Protocol
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "🔍 Running verification protocol..."
          echo "Verification start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          # Run verification and capture SQL proof
          python3 scripts/shard9_verification_protocol.py | tee verification_output.txt
          
          # Extract SQL verification block for issue comment
          if [ -f verification_output.txt ]; then
            echo "📄 Verification output captured"
            grep -A 50 "### SQL VERIFICATION" verification_output.txt > sql_verification.md || echo "No SQL verification block found"
          fi
          
      - name: Commit any generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Committing generated files..."
            git add .
            git commit -m "feat: SHARD-9 Gold Standard session results

          Session: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Counties: lee, alachua, nassau, dixie, taylor
          
          Generated by automated SHARD-9 executor
          
          🤖 Generated with Claude Code" || echo "No changes to commit"
            
            git push origin main
          else
            echo "No changes to commit"
          fi
          
      - name: Report session completion
        if: always()
        run: |
          echo "✅ SHARD-9 Gold Standard session completed"
          echo "Session end: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Workflow status: ${{ job.status }}"