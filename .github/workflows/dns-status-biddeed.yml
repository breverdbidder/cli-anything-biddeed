name: Cloudflare DNS Op (status.biddeed.ai)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list | create_cname | delete'
        required: true
        default: 'list'
      record_id:
        description: 'DNS record id (required for delete)'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ZONE_ID: dcb6876f057e0bb88be181d6e8d0dcbc
      ACTION: ${{ inputs.action }}
      RECORD_ID: ${{ inputs.record_id }}
      RECORD_NAME: status.biddeed.ai
      RECORD_CONTENT: breverdbidder.github.io
    steps:
      - name: Mask token
        run: echo "::add-mask::${CF_API_TOKEN}"
      - name: List records
        if: ${{ inputs.action == 'list' }}
        run: |
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?per_page=100&name=${RECORD_NAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" | python3 -m json.tool
      - name: Create CNAME record (DNS-only, not proxied)
        if: ${{ inputs.action == 'create_cname' }}
        run: |
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c "import json,os; print(json.dumps({'type':'CNAME','name':os.environ['RECORD_NAME'],'content':os.environ['RECORD_CONTENT'],'proxied': False,'ttl':300}))")")
          echo "$RESP"
      - name: Delete record
        if: ${{ inputs.action == 'delete' }}
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json"
