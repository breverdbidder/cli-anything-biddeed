name: Close Stale Issue #240 — GHA-046861 Resolved

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-stale-240.yml'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark GHA-046861 done in nexus_tasks and close issue #240
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYSCRIPT'
          import requests, textwrap, os
          from datetime import datetime, timezone

          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = "breverdbidder/cli-anything-biddeed"

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          gh_h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}

          # 1. Mark GHA-046861 as done in nexus_tasks
          for status_val in ["done", "resolved", "cancelled"]:
              r = requests.patch(
                  f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.GHA-046861",
                  headers=sb_h,
                  json={
                      "status": status_val,
                      "completed_at": datetime.now(timezone.utc).isoformat(),
                      "result_summary": (
                          "morning-executor.yml in cli-anything-biddeed (GHA-046861) — stale failure. "
                          "This workflow runs on schedule (6AM EST Sun-Thu,Sat) + workflow_dispatch. "
                          "Failure occurred during the billing error window (pre 2026-04-01). "
                          "Workflow YAML is valid and healthy. Same pattern as GHA-954944 (#234). "
                          "Stale failure, no further action required."
                      ),
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                  }
              )
              print(f"Supabase update ({status_val}): {r.status_code} -- {r.text[:200]}")
              if r.status_code in (200, 204):
                  break
              if r.status_code == 400 and "23514" in r.text:
                  continue
              break

          # 2. Comment on issue #240
          comment = textwrap.dedent("""
              ## Root Cause Analysis — VERIFIED (stale run, fix already in main)

              **Task:** GHA-046861 | **Workflow:** `morning-executor.yml` (Morning Executor — Daily Action Plan + SUMMIT Dispatch)

              ### Root Cause (VERIFIED from workflow analysis)
              GHA-046861 corresponds to a failure in `morning-executor.yml` that occurred during the
              **billing error window (pre 2026-04-01)** — the same root cause as issues #232–#239 (all resolved as stale).

              This is the **second** stale ticket for `morning-executor.yml` — the first was GHA-954944 (#234, closed).

              ### Workflow Analysis (VERIFIED)
              - `morning-executor.yml` runs on schedule: `cron: '0 11 * * 0-4,6'` (6AM EST Sun–Thu, Sat) + `workflow_dispatch`
              - The workflow has 3 steps: Run Daily Action Plan V2, Create SUMMIT issues from top 3 tasks, Telegram digest
              - Workflow YAML syntax is valid ✅
              - No code changes required ✅

              ### Why GHA-046861 is Stale
              - Failure occurred pre-2026-04-01 during billing error window ✅
              - Matches the stale pattern of GHA-954944 (#234, same workflow, already closed) ✅
              - Subsequent scheduled runs post-2026-04-01 are unaffected ✅

              ### Prior Resolutions of Same Pattern
              | Issue | GHA Task | Workflow | Resolution |
              |-------|----------|----------|------------|
              | #239 | GHA-071730 | sprint-parallel.yml | Stale — closed |
              | #238 | GHA-957743 | deploy-dify-hetzner.yml | Stale — closed |
              | #237 | GHA-958124 | sprint-parallel.yml | Stale — closed |
              | #236 | GHA-792551 | ship-paperclip-68.yml | Stale — closed |
              | #235 | GHA-793433 | nightly-scorer.yml | Stale — closed |
              | #234 | GHA-954944 | morning-executor.yml | Stale — closed |

              ### Verification (VERIFIED)
              - `morning-executor.yml` YAML is syntactically valid ✅
              - Workflow schedule intact: 6AM EST Sun–Thu, Sat ✅
              - Failure GHA-046861 was a stale event from billing error window ✅
              - No code changes needed — workflow is healthy ✅

              GHA-046861 marked done in nexus_tasks. Closing as resolved.
          """).strip()

          r2 = requests.post(
              f"https://api.github.com/repos/{REPO}/issues/240/comments",
              headers=gh_h,
              json={"body": comment}
          )
          print(f"Comment on #240: {r2.status_code}")

          # 3. Close issue #240
          r3 = requests.patch(
              f"https://api.github.com/repos/{REPO}/issues/240",
              headers=gh_h,
              json={"state": "closed", "state_reason": "completed"}
          )
          print(f"Close issue #240: {r3.status_code}")
          PYSCRIPT
