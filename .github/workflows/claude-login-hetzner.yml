name: "🔑 Claude Code Login on Hetzner (interactive)"

on:
  workflow_dispatch: {}

env:
  HETZNER_HOST: 87.99.129.125

jobs:
  login:
    name: "🔑 Login"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Install expect + attempt login"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          script: |
            apt-get install -y expect > /dev/null 2>&1 || true

            # Try to get the login URL using script to capture pseudo-terminal output
            LOGFILE="/tmp/claude_login_$(date +%s).log"

            # Use script command to simulate a TTY
            script -q -c "IS_SANDBOX=1 claude login 2>&1" "$LOGFILE" < /dev/null &
            SCRIPT_PID=$!

            # Wait for URL to appear
            AUTH_URL=""
            for i in $(seq 1 30); do
              sleep 2
              AUTH_URL=$(grep -oP 'https://[^\s\x1b]+' "$LOGFILE" 2>/dev/null | grep -i "auth\|login\|claude\|anthropic" | head -1)
              if [ -n "$AUTH_URL" ]; then
                break
              fi
              # Also check for any https URL
              AUTH_URL=$(grep -oP 'https://[^\s\x1b"]+' "$LOGFILE" 2>/dev/null | head -1)
              if [ -n "$AUTH_URL" ]; then
                break
              fi
            done

            kill $SCRIPT_PID 2>/dev/null || true

            if [ -n "$AUTH_URL" ]; then
              echo "🔗 Auth URL: $AUTH_URL"
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d "parse_mode=HTML" \
                -d "text=🔑 <b>Claude Code Login — Hetzner</b>

            Open this link to authorize:
            <a href=\"$AUTH_URL\">$AUTH_URL</a>

            One-time setup. After this, all summits run on Max plan forever." \
                > /dev/null 2>&1
              echo "📱 Auth URL sent to Telegram"

              # Wait for auth to complete (up to 5 min)
              echo "⏳ Waiting for you to click the link..."
              for j in $(seq 1 150); do
                sleep 2
                if IS_SANDBOX=1 claude -p "say AUTHENTICATED" --dangerously-skip-permissions 2>&1 | grep -q "AUTHENTICATED"; then
                  echo "✅ AUTHENTICATED — Max plan active on Hetzner!"
                  curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                    -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                    -d "text=✅ Claude Code authenticated on Hetzner! Max plan active. Firing all 4 summits now..." \
                    > /dev/null 2>&1

                  # AUTO-FIRE ALL 4 SUMMITS
                  echo "🚀 Auto-firing summits..."
                  for summit in summit-enricher-p0 summit-forecaster-p0 summit-trendpredictor-p0 summit-sitemanager-p0; do
                    curl -s -X POST \
                      "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/${summit}.yml/dispatches" \
                      -H "Authorization: token ${{ secrets.GH_PAT }}" \
                      -H "Accept: application/vnd.github.v3+json" \
                      -d '{"ref":"main","inputs":{"max_minutes":"45","dry_run":"false"}}'
                    echo "  ✅ Fired $summit"
                  done
                  exit 0
                fi
              done
              echo "⏰ Timeout waiting for auth. Click the Telegram link and re-run this workflow."
            else
              echo "❌ Could not capture auth URL"
              echo "=== Log output ==="
              cat "$LOGFILE" | strings | head -30
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d "text=⚠️ Could not capture Claude Code login URL automatically.

            SSH into Hetzner and run:
            IS_SANDBOX=1 claude login" \
                > /dev/null 2>&1
            fi

      - name: Summary
        if: always()
        run: |
          echo "## 🔑 Claude Code Login" >> $GITHUB_STEP_SUMMARY
          echo "Auth URL sent to Telegram. Click to authorize." >> $GITHUB_STEP_SUMMARY
          echo "After auth, all 4 summits auto-fire." >> $GITHUB_STEP_SUMMARY
