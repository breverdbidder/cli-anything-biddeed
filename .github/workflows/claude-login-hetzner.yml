name: Claude Login on Hetzner
on:
  workflow_dispatch:

jobs:
  login:
    name: Claude Login
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login and send URL to Telegram
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          TG_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          pip install requests -q
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          SSH="ssh -i ~/.ssh/hetzner -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@87.99.129.125"

          CHECK=$($SSH "claude auth status 2>&1" || true)
          if echo "$CHECK" | grep -q '"loggedIn": true'; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=Already logged in"
            exit 0
          fi

          $SSH "rm -f /root/.claude/.credentials.json 2>/dev/null" || true
          $SSH "BROWSER=echo DISPLAY= TERM=dumb timeout 30 claude auth login > /tmp/cc_login.txt 2>&1" || true

          AUTH_URL=$($SSH "python3 -c \"import re; t=open('/tmp/cc_login.txt').read(); m=re.search(r'(https://claude\\.ai/oauth/authorize\\S+)',t); print(m.group(1) if m else '')\"" | tr -d '\r\n')

          echo "URL length: ${#AUTH_URL}"
          if [ -z "$AUTH_URL" ]; then
            RAW=$($SSH "cat /tmp/cc_login.txt 2>/dev/null | head -5")
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=No URL found: $RAW"
            exit 1
          fi

          python3 -c "
import requests, sys
url = sys.argv[1]
bot = sys.argv[2]
chat = sys.argv[3]
msg = f'TAP TO LOG IN CLAUDE ON HETZNER:\n\n{url}\n\nYou have 3 min.'
requests.post(f'https://api.telegram.org/bot{bot}/sendMessage', json={'chat_id': chat, 'text': msg, 'disable_web_page_preview': True})
print(f'Sent ({len(url)} chars)')
" "$AUTH_URL" "$TG_BOT" "$TG_CHAT"

          for i in $(seq 1 12); do
            sleep 15
            STATUS=$($SSH "claude auth status 2>&1" || true)
            if echo "$STATUS" | grep -q '"loggedIn": true'; then
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=LOGGED IN! Claude Code on Hetzner authenticated with Max plan."
              exit 0
            fi
            echo "Poll $i/12..."
          done
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=Timed out. Re-run for fresh link."
