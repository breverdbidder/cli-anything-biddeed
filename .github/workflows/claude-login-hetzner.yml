name: "Claude Login on Hetzner"

on:
  workflow_dispatch: {}

jobs:
  login:
    name: "🔑 Claude Login"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Setup SSH + Login + Telegram"
        env:
          HETZNER_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          
          SSH="ssh -tt -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          
          # First check if already logged in
          CHECK=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
            "IS_SANDBOX=1 claude -p 'hi' --dangerously-skip-permissions 2>&1" | strings | head -3 || true)
          echo "Auth check: $CHECK"
          
          if echo "$CHECK" | grep -qiv "not logged\|login\|credit\|error\|balance" && [ -n "$CHECK" ]; then
            echo "✅ Already logged in!"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" -d "text=✅ Claude already logged in on Hetzner! Say summit."
            exit 0
          fi
          
          # Run claude login via forced TTY, capture output to remote file
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 << 'REMOTE'
            export IS_SANDBOX=1
            # Use script to capture TTY output
            script -qfc "timeout 20 claude login" /tmp/claude_login.log || true
            # Also try: claude login in background piping to file
            cat /tmp/claude_login.log | strings > /tmp/claude_login_clean.txt 2>/dev/null || true
          REMOTE
          
          # Fetch the cleaned output
          OUTPUT=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
            "cat /tmp/claude_login_clean.txt 2>/dev/null" || true)
          echo "Login output: $OUTPUT"
          
          # Extract URL — try multiple patterns
          AUTH_URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9./?=&_:-]+' | grep -i "auth\|login\|code\|claude" | head -1)
          [ -z "$AUTH_URL" ] && AUTH_URL=$(echo "$OUTPUT" | grep -oP 'https://[a-zA-Z0-9./?=&_:-]+' | head -1)
          
          if [ -n "$AUTH_URL" ]; then
            echo "🔗 Found: $AUTH_URL"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true" \
              -d "text=🔑 <b>TAP TO LOGIN CLAUDE</b>%0A%0A${AUTH_URL}%0A%0ATap → Approve → done forever."
          else
            echo "❌ No URL found. Sending raw output."
            # Send whatever we got for debugging
            SNIPPET=$(echo "$OUTPUT" | head -30 | head -c 500)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=❌ No login URL found. Raw output:%0A${SNIPPET:0:400}"
            exit 1
          fi
          
          # Poll for 3 minutes
          for i in $(seq 1 12); do
            sleep 15
            echo "Poll $i..."
            R=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
              "IS_SANDBOX=1 claude -p 'hi' --dangerously-skip-permissions 2>&1" | strings | head -3 || true)
            if echo "$R" | grep -qiv "not logged\|login\|credit\|error" && [ -n "$R" ]; then
              echo "✅ Confirmed!"
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
                -d "chat_id=${TG_CHAT}" \
                -d "text=✅ CLAUDE LOGIN SUCCESS! All 4 agents ready. Say summit."
              exit 0
            fi
          done
          echo "⏰ Timed out"

      - name: Summary
        if: always()
        run: echo "## 🔑 Claude Login" >> $GITHUB_STEP_SUMMARY
