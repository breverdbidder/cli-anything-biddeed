name: "Claude Login on Hetzner"

on:
  workflow_dispatch: {}

jobs:
  login:
    name: "\U0001F511 Claude Login"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Login and send URL to Telegram"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -t -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          TG_BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"

          # 1. Check if already logged in
          CHECK=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "claude auth status 2>&1" || true)
          echo "Auth: $CHECK"
          if echo "$CHECK" | grep -q '"loggedIn": true'; then
            echo "Already logged in!"
            ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "systemctl restart agentremote-executor" || true
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" -d "text=✅ Claude already logged in!"
            exit 0
          fi

          # 2. Run login with script(1) for TTY on Hetzner in background
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "
            rm -f /tmp/claude_auth_url.txt /tmp/claude_login.log
            nohup script -qfc 'timeout 180 claude login' /tmp/claude_login.log > /dev/null 2>&1 &
            echo \$!
          "
          
          echo "Login started with TTY. Waiting for URL..."
          sleep 15

          # 3. Grab URL from log
          for attempt in 1 2 3 4; do
            AUTH_URL=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "
              cat /tmp/claude_login.log 2>/dev/null | strings | grep -oP 'https://[a-zA-Z0-9./?=&_:%-]+' | head -1
            " | tr -d '\r\n' || true)
            echo "Attempt $attempt URL: '$AUTH_URL'"
            if [ -n "$AUTH_URL" ]; then break; fi
            sleep 5
          done

          if [ -z "$AUTH_URL" ]; then
            DEBUG=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "cat /tmp/claude_login.log 2>/dev/null | strings | tail -20" || true)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" -d "text=❌ No URL captured. Log: ${DEBUG:0:400}"
            exit 1
          fi

          # 4. Send URL to Telegram
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=🔑 <b>TAP TO LOG IN CLAUDE ON HETZNER</b>%0A%0A👇 One tap, done forever:%0A${AUTH_URL}%0A%0ABot auto-upgrades to Claude Max after you approve."

          # 5. Poll for success (3 min)
          for i in $(seq 1 12); do
            sleep 15
            echo "Poll $i/12..."
            STATUS=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "claude auth status 2>&1" || true)
            if echo "$STATUS" | grep -q '"loggedIn": true'; then
              echo "Login confirmed!"
              ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "systemctl restart agentremote-executor" || true
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
                -d "chat_id=${TG_CHAT}" -d "text=✅ LOGGED IN! AgentRemote upgraded to Claude Max."
              exit 0
            fi
          done
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" -d "text=⏰ Timed out. Re-run for fresh link."
