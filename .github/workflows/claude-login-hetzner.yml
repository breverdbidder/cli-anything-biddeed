name: "Claude Login on Hetzner"

on:
  workflow_dispatch: {}

jobs:
  login:
    name: "\U0001F511 Claude Login"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Login and send URL to Telegram"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          TG_BOT="${{ secrets.BIDDEED_BOT_TOKEN }}"
          TG_CHAT="${{ secrets.BIDDEED_BOT_CHAT_ID }}"

          # Check auth first
          CHECK=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "claude auth status 2>&1" || true)
          if echo "$CHECK" | grep -q '"loggedIn": true'; then
            ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "systemctl restart agentremote-executor" || true
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" -d "text=✅ Already logged in!"
            exit 0
          fi

          # Try multiple approaches to get the login URL
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "
            rm -f /tmp/claude_url.txt

            # Approach 1: BROWSER=echo forces URL to stdout
            echo '=== Approach 1: BROWSER=echo ==='
            BROWSER=echo DISPLAY= timeout 15 claude login 2>&1 | tee /tmp/cl_approach1.log || true

            # Approach 2: claude auth login
            echo '=== Approach 2: claude auth login ==='
            BROWSER=echo DISPLAY= timeout 15 claude auth login 2>&1 | tee /tmp/cl_approach2.log || true

            # Approach 3: Just pipe to file 
            echo '=== Approach 3: raw ==='
            TERM=dumb BROWSER=echo DISPLAY= timeout 15 claude login 2>&1 | strings | tee /tmp/cl_approach3.log || true

            # Extract URL from any approach
            for f in /tmp/cl_approach1.log /tmp/cl_approach2.log /tmp/cl_approach3.log; do
              URL=\$(cat \$f 2>/dev/null | strings | grep -oP 'https://[a-zA-Z0-9./?=&_:%-]+' | grep -i 'anthropic\|claude\|oauth\|login\|console' | head -1)
              if [ -n \"\$URL\" ]; then
                echo \"\$URL\" > /tmp/claude_url.txt
                echo \"FOUND in \$f: \$URL\"
                break
              fi
            done

            # Also check if any URL at all
            if [ ! -s /tmp/claude_url.txt ]; then
              for f in /tmp/cl_approach1.log /tmp/cl_approach2.log /tmp/cl_approach3.log; do
                URL=\$(cat \$f 2>/dev/null | strings | grep -oP 'https://[^\s]+' | head -1)
                if [ -n \"\$URL\" ]; then
                  echo \"\$URL\" > /tmp/claude_url.txt
                  echo \"FOUND (any URL) in \$f: \$URL\"
                  break
                fi
              done
            fi

            echo '=== All logs ==='
            for f in /tmp/cl_approach1.log /tmp/cl_approach2.log /tmp/cl_approach3.log; do
              echo \"--- \$f ---\"
              cat \$f 2>/dev/null | strings | head -10
            done
          " 2>&1 | tee /tmp/hetzner_login_output.txt

          # Extract URL
          AUTH_URL=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "cat /tmp/claude_url.txt 2>/dev/null" | tr -d '\r\n' || true)
          echo "Final URL: '$AUTH_URL'"

          if [ -z "$AUTH_URL" ]; then
            # Send raw output for debugging
            DEBUG=$(cat /tmp/hetzner_login_output.txt | tail -30 | head -20)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" -d "text=❌ No login URL found. Raw output: ${DEBUG:0:500}"
            exit 1
          fi

          # Send URL
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=🔑 <b>TAP TO LOG IN CLAUDE ON HETZNER</b>%0A%0A${AUTH_URL}%0A%0ABot auto-upgrades to Claude Max after you approve."

          # Poll
          for i in $(seq 1 12); do
            sleep 15
            STATUS=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "claude auth status 2>&1" || true)
            if echo "$STATUS" | grep -q '"loggedIn": true'; then
              ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "systemctl restart agentremote-executor" || true
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
                -d "chat_id=${TG_CHAT}" -d "text=✅ LOGGED IN! AgentRemote upgraded to Claude Max."
              exit 0
            fi
          done
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" -d "text=⏰ Timed out. Re-run for fresh link."
