name: "Claude Login on Hetzner"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - setup_termius_key
          - check_login_status

jobs:
  action:
    name: "🔑 ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Generate Termius key + send to Telegram"
        if: github.event.inputs.action == 'setup_termius_key'
        run: |
          SSH="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          
          # Generate new ed25519 key on the server
          $SSH << 'REMOTE'
          ssh-keygen -t ed25519 -f /tmp/termius_key -N "" -C "ariel@termius" -q
          cat /tmp/termius_key.pub >> ~/.ssh/authorized_keys
          echo "✅ Public key added to authorized_keys"
          REMOTE
          
          # Fetch private key
          PRIVKEY=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "cat /tmp/termius_key")
          
          # Send private key to Telegram as a document
          echo "$PRIVKEY" > /tmp/hetzner_termius_key
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@/tmp/hetzner_termius_key;filename=hetzner_termius_key" \
            -F "caption=🔑 Hetzner SSH Key for Termius

          STEPS:
          1. Save this file to your phone
          2. Open Termius → Keychain → + → Import from file
          3. Select this file
          4. Edit 'Everest Dispatch' host → change auth to this key
          5. Connect → run: IS_SANDBOX=1 claude login
          6. Open the URL it shows → Approve
          7. Done forever — say summit"
          
          # Also send the key as text in case file download doesn't work
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=If the file doesn't work, copy this entire key into Termius Keychain:

          $PRIVKEY"
          
          # Cleanup
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "rm -f /tmp/termius_key /tmp/termius_key.pub"
          rm -f /tmp/hetzner_termius_key
          
          echo "✅ Key generated, installed, and sent to Telegram"

      - name: "Check login status"
        if: github.event.inputs.action == 'check_login_status'
        run: |
          SSH="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          
          RESULT=$($SSH "IS_SANDBOX=1 claude -p 'Say hello' --dangerously-skip-permissions 2>&1" | strings | head -5 || true)
          echo "Result: $RESULT"
          
          if echo "$RESULT" | grep -qi "not logged\|login\|credit"; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=❌ Not logged in yet. SSH in and run: IS_SANDBOX=1 claude login"
          else
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=✅ Claude is logged in! Say summit to fire all 4 agents."
          fi

      - name: Summary
        if: always()
        run: echo "## 🔑 ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
