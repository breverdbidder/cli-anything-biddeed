name: "Claude Login on Hetzner"

on:
  workflow_dispatch: {}

jobs:
  login:
    name: "🔑 Claude Login"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "1️⃣ Setup SSH"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null

      - name: "2️⃣ Login + send URL to Telegram"
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SSH="ssh -t -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          
          # Create a login script on the server
          $SSH "cat > /tmp/claude_login.sh << 'SCRIPT'
          #!/bin/bash
          export IS_SANDBOX=1
          
          # Run claude login, capture output to file
          script -q -c 'claude login' /tmp/claude_login_output.txt &
          LOGIN_PID=\$!
          
          # Wait up to 30s for the URL to appear in the output
          for i in \$(seq 1 30); do
            sleep 1
            if grep -q 'http' /tmp/claude_login_output.txt 2>/dev/null; then
              URL=\$(grep -oP 'https://[^\s\x1b]+' /tmp/claude_login_output.txt | head -1 | sed 's/\x1b\[[0-9;]*m//g')
              if [ -n \"\$URL\" ]; then
                echo \"AUTH_URL=\$URL\" > /tmp/claude_auth_url.txt
                echo \"Found URL: \$URL\"
                break
              fi
            fi
          done
          
          # Keep process alive for 3 more minutes for user to approve
          sleep 180
          kill \$LOGIN_PID 2>/dev/null || true
          SCRIPT
          chmod +x /tmp/claude_login.sh"
          
          # Run the login script in background on server
          ssh -f -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
            "nohup bash /tmp/claude_login.sh > /tmp/claude_login_full.log 2>&1 &"
          
          echo "⏳ Waiting 15s for URL to appear..."
          sleep 15
          
          # Fetch the URL
          AUTH_URL=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
            "cat /tmp/claude_auth_url.txt 2>/dev/null | grep AUTH_URL | cut -d= -f2-" || true)
          
          if [ -z "$AUTH_URL" ]; then
            # Try reading raw output and extracting URL
            RAW=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
              "cat /tmp/claude_login_output.txt 2>/dev/null | strings | grep -oP 'https://[a-zA-Z0-9./?=&_-]+' | head -1" || true)
            AUTH_URL="$RAW"
          fi
          
          if [ -z "$AUTH_URL" ]; then
            # Send debug info
            DEBUG=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 \
              "cat /tmp/claude_login_output.txt 2>/dev/null | strings | tail -20" || true)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=❌ Could not extract login URL. Debug output: ${DEBUG:0:500}"
            echo "❌ No URL found"
            exit 1
          fi
          
          echo "🔗 URL: $AUTH_URL"
          
          # Send to Telegram
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=🔑 <b>TAP TO LOGIN CLAUDE ON HETZNER</b>

          👇 Open this link and approve:
          ${AUTH_URL}

          After approving → all 4 agents run on Max plan at \$0 forever.
          ⏳ Verifying for 3 minutes..."
          
          echo "📱 Sent to Telegram. Waiting for approval..."

      - name: "3️⃣ Wait for approval"
        run: |
          SSH="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          
          for i in $(seq 1 12); do
            sleep 15
            echo "Check $i/12..."
            
            RESULT=$($SSH "IS_SANDBOX=1 claude -p 'hi' --dangerously-skip-permissions 2>&1 | strings | head -3" || true)
            echo "  > $RESULT"
            
            if echo "$RESULT" | grep -qiv "not logged\|login\|credit\|error"; then
              if [ -n "$RESULT" ] && ! echo "$RESULT" | grep -qi "not logged"; then
                echo "✅ Logged in!"
                
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                  -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                  -d "parse_mode=HTML" \
                  -d "text=✅ <b>CLAUDE LOGIN SUCCESS!</b>

          Max plan active on Hetzner. All 4 agents ready.
          Go to Claude chat → say <b>summit</b>"
                exit 0
              fi
            fi
          done
          
          echo "⏰ Timed out"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=⏰ Login timed out. Re-run the workflow and tap the link faster."

      - name: Summary
        if: always()
        run: echo "## 🔑 Claude Login" >> $GITHUB_STEP_SUMMARY
