name: Claude Login on Hetzner
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          TG_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          SSH="ssh -i ~/.ssh/hetzner -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@87.99.129.125"
          $SSH "rm -f /root/.claude/.credentials.json 2>/dev/null" || true
          $SSH "BROWSER=echo DISPLAY= TERM=dumb timeout 30 claude auth login > /tmp/cc_login.txt 2>&1" || true
          AUTH_URL=$($SSH "grep -oP 'https://claude\.ai/oauth/authorize\\S+' /tmp/cc_login.txt | head -1" | tr -d '\r\n')
          if [ -z "$AUTH_URL" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=No URL found"
            exit 1
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -H "Content-Type: application/json" -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"TAP TO LOGIN CLAUDE ON HETZNER:\n\n${AUTH_URL}\n\n3 min window.\",\"disable_web_page_preview\":true}"
          for i in $(seq 1 12); do
            sleep 15
            STATUS=$($SSH "claude auth status 2>&1" || true)
            if echo "$STATUS" | grep -q '"loggedIn": true'; then
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=LOGGED IN Max plan active"
              exit 0
            fi
          done
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" -d "chat_id=${TG_CHAT}" -d "text=Timed out. Re-run."
