name: "Apply: realforeclose_aids_patch_v2 (Duval opening_bid)"
# One-shot migration to generalize realforeclose_aids_to_mca_patch:
# - Adds p_county_slug param (fixes Duval drain step 5)
# - Adds Pass 0: opening_bid fill from judgment_amount
# Auto-triggers on push to main when the migration file changes.
# Can also be run manually.

on:
  push:
    paths:
      - "supabase/migrations/20260623_realforeclose_aids_patch_v2.sql"
    branches: [main]
  workflow_dispatch:

jobs:
  apply:
    name: "Apply realforeclose_aids_patch_v2"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: Apply migration
        run: |
          set -euo pipefail
          echo "=== 20260623_realforeclose_aids_patch_v2.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260623_realforeclose_aids_patch_v2.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration OK"

      - name: Verify function signature updated
        run: |
          set -uo pipefail
          python3 -c "
          import json, sys
          sql = '''
          SELECT proname, pg_get_function_arguments(oid) AS args
          FROM pg_proc
          WHERE proname = 'realforeclose_aids_to_mca_patch'
          ORDER BY oid DESC
          LIMIT 3;
          '''
          print(json.dumps({'query': sql}))
          " > /tmp/vq.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vq.json
          echo

      - name: Run patch for existing Duval aids
        run: |
          set -uo pipefail
          python3 -c "
          import json
          sql = \"SELECT realforeclose_aids_to_mca_patch(NULL::bigint, 'duval') AS rows_updated;\"
          print(json.dumps({'query': sql}))
          " > /tmp/patch.json
          HTTP=$(curl -sS -o /tmp/patch_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/patch.json)
          echo "Patch HTTP: $HTTP"; cat /tmp/patch_resp.json; echo

      - name: DoD check - count remaining NULL opening_bids
        run: |
          set -uo pipefail
          python3 -c "
          import json
          sql = '''
          SELECT COUNT(*) AS null_opening_bids
          FROM multi_county_auctions
          WHERE county = 'duval'
            AND source_platform = 'realforeclose'
            AND auction_date >= CURRENT_DATE
            AND opening_bid IS NULL;
          '''
          print(json.dumps({'query': sql}))
          " > /tmp/dod.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dod.json
          echo
