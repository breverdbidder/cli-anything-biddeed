name: Decrypt Dify Gemini key v2 + install in cliproxy + smoke
on:
  workflow_dispatch: {}
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SSH + decrypt + install + smoke
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          SCP="scp -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
          set +e

          TENANT_ID="09209873-c6be-42d1-86cb-364624f23fe4"

          echo "=== A: pull encrypted blob from postgres into Hetzner temp file ==="
          $SSH "docker exec docker-db_postgres-1 psql -U postgres -d dify -tAc \"SELECT encrypted_config FROM provider_credentials WHERE provider_name = 'langgenius/gemini/google' LIMIT 1;\" > /root/.tmp_blob.json"
          $SSH 'wc -c /root/.tmp_blob.json && head -c 100 /root/.tmp_blob.json'
          echo

          echo
          echo "=== B: copy decrypt script to Hetzner ==="
          $SCP scripts/dify_decrypt.py root@${HETZNER_IP}:/root/.tmp_decrypt.py
          $SSH 'ls -la /root/.tmp_decrypt.py /root/.tmp_blob.json'

          echo
          echo "=== C: copy script + blob into docker-api-1 and run ==="
          $SSH "docker cp /root/.tmp_decrypt.py docker-api-1:/tmp/decrypt.py"
          $SSH "docker cp /root/.tmp_blob.json docker-api-1:/tmp/blob.json"
          $SSH "docker exec docker-api-1 sh -c 'cd /app/api && python /tmp/decrypt.py ${TENANT_ID} 2>&1 | tail -10'"

          echo
          echo "=== D: pull plaintext key back to Hetzner host (NOT to GHA log) ==="
          $SSH "docker cp docker-api-1:/tmp/plain.txt /root/.tmp_plain.txt 2>&1 | tail -3"
          $SSH 'ls -la /root/.tmp_plain.txt 2>&1; wc -c /root/.tmp_plain.txt 2>&1; head -c 4 /root/.tmp_plain.txt'
          echo
          $SSH 'head -c 4 /root/.tmp_plain.txt | grep -q "^AIza" && echo "✓ valid Gemini key format" || echo "✗ not a Gemini key format"'

          echo
          echo "=== E: install key into cliproxy config (sed in-place, value never echoed) ==="
          $SSH "bash -c '
            CFG=/opt/cliproxy-gateway/config.yaml
            cp \$CFG \${CFG}.bak.predify.\$(date +%s)
            KEY=\$(cat /root/.tmp_plain.txt)
            python3 -c \"
import re
with open(\\\"\$CFG\\\") as f: c = f.read()
new = re.sub(r\\\"(gemini-api-key:\\s*\\n\\s*-\\s*api-key:\\s*)\\S+\\\", r\\\"\\g<1>\$KEY\\\", c, count=1)
with open(\\\"\$CFG\\\", \\\"w\\\") as f: f.write(new)
print(\\\"config patched\\\")
\"
            unset KEY
          '"
          $SSH 'grep -A1 "^gemini-api-key:" /opt/cliproxy-gateway/config.yaml | head -3 | sed -E "s/(api-key:\s*).*/\1<redacted>/"'

          echo
          echo "=== F: WIPE temp files containing the key ==="
          $SSH 'shred -u /root/.tmp_plain.txt 2>/dev/null || rm -f /root/.tmp_plain.txt; rm -f /root/.tmp_blob.json /root/.tmp_decrypt.py; docker exec docker-api-1 sh -c "rm -f /tmp/plain.txt /tmp/blob.json /tmp/decrypt.py"; ls /root/.tmp_* 2>&1 | head -3'

          echo
          echo "=== G: restart cliproxy ==="
          $SSH 'docker restart biddeed-cliproxy && sleep 4 && docker logs --tail 5 biddeed-cliproxy 2>&1 | grep -v "no space"'

          echo
          echo "=== H: smoke test — Anthropic format → gemini-flash via cliproxy ==="
          CP_KEY="biddeed-gw-77dc6c9df0e5088057c28d1f94d3fef791961fbb409da85f"
          RESP=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with PATH_Y_OK\"}]}' -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500

          echo
          echo "=== I: claude -p via cliproxy (real test) ==="
          $SSH "ANTHROPIC_BASE_URL=http://127.0.0.1:8317 ANTHROPIC_API_KEY=${CP_KEY} claude -p 'reply only with CLAUDE_PATH_Y_OK and nothing else' --model claude-sonnet-4-20250514 --allowedTools Read 2>&1 | tail -15"

          echo "=== END ==="
