name: install-mcp-direct

# Pure-shell install of hybrid-PM MCP stack on Hetzner.
# Bypasses claude-runner.sh entirely. No OAuth dependency, no LLM interpretation.
# SSH from ubuntu-latest → Hetzner as root → run install-mcp-hetzner.sh → capture output.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable set -x in install script'
        required: false
        default: 'false'

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH to Hetzner and run install
        env:
          HETZNER_IP:      ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT:          ${{ secrets.GH_PAT }}
          VERBOSE:         ${{ github.event.inputs.verbose }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Fetch install script from private repo via GH_PAT ==="
          curl -fsSL \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/breverdbidder/everest-hybrid-pm/contents/scripts/install-mcp-hetzner.sh" \
            -o /tmp/install.sh

          echo "=== Script fetched: $(wc -l < /tmp/install.sh) lines, $(wc -c < /tmp/install.sh) bytes ==="

          echo "=== SCP to Hetzner ==="
          scp -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/install.sh root@${HETZNER_IP}:/opt/everest/scripts/install-mcp-hetzner.sh
          $SSH "mkdir -p /opt/everest/scripts && chmod +x /opt/everest/scripts/install-mcp-hetzner.sh"

          echo "=== Execute install on Hetzner ==="
          set +e
          if [ "$VERBOSE" = "true" ]; then
            $SSH "bash -x /opt/everest/scripts/install-mcp-hetzner.sh" 2>&1 | tee /tmp/install-output.log
          else
            $SSH "bash /opt/everest/scripts/install-mcp-hetzner.sh" 2>&1 | tee /tmp/install-output.log
          fi
          RC=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "=== INSTALL EXIT CODE: ${RC} ==="
          echo "=== Output size: $(wc -c < /tmp/install-output.log) bytes ==="
          echo ""
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/install-output.log

          # Contract: 0 = full ok, 1 = partial (missing secrets, expected), 2 = hard fail
          if [ "$RC" = "0" ]; then
            echo "::notice::Install complete, all MCPs registered"
          elif [ "$RC" = "1" ]; then
            echo "::notice::Partial install — missing vault secrets (expected). Add secrets and re-run."
          else
            echo "::error::Install failed with exit code $RC"
            exit $RC
          fi

      - name: Write state to Supabase (honesty log)
        if: always()
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_STATUS:                ${{ job.status }}
          RUN_ID:                    ${{ github.run_id }}
        run: |
          tail_escaped=$(tail -40 /tmp/install-output.log 2>/dev/null | jq -Rs . || echo '""')
          curl -fsS -X POST \
            "${SUPABASE_URL}/rest/v1/honesty_violations" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{
              \"domain\": \"install_mcp_direct\",
              \"claim\": \"install-mcp-direct workflow run ${RUN_ID} status=${JOB_STATUS}\",
              \"tag_used\": \"VERIFIED\",
              \"actual_truth\": ${tail_escaped},
              \"severity\": \"low\",
              \"session_source\": \"chat-2026-04-17-hybrid-pm-install\",
              \"corrective_action\": \"Audit log of install output tail\",
              \"resolved\": true
            }" > /dev/null || true
