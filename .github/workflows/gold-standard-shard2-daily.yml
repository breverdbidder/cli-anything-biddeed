name: "Gold Standard SHARD-2 Daily (desoto/miami_dade/okaloosa/putnam/holmes)"

# WIRING MANDATE: H freshness, C/D parity, TD lane scrapes, J generator, verification
# Counties: desoto, miami_dade, okaloosa, putnam, holmes
# Session origin: architect-20260619T160001

on:
  schedule:
    # Daily 10:00 UTC (6 AM ET) — maintains H <48h SLA for all 5 counties
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - h_freshness
          - cd_parity
          - j_generator
          - holmes_bootstrap
          - verify

concurrency:
  group: gold-standard-shard2
  cancel-in-progress: false

jobs:
  # ── Job 1: H freshness + C/D parity (fast, every run) ──────────────────────
  parity-and-freshness:
    name: "H Freshness + C/D Parity"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Run H freshness + C/D parity
        run: |
          set -euo pipefail
          python3 scripts/shard2_main_executor.py

  # ── Job 2: Holmes bootstrap (probe real platform) ───────────────────────────
  holmes-bootstrap:
    name: "Holmes County Bootstrap"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'holmes_bootstrap' || github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 --quiet

      - name: Bootstrap Holmes County auctions
        run: |
          set -euo pipefail
          python3 scripts/shard2_holmes_bootstrap.py

  # ── Job 3: Trigger scrapes for okaloosa TD + putnam (A + H) ─────────────────
  trigger-scrapes:
    name: "Trigger Okaloosa TD + Putnam Scrapes"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: parity-and-freshness
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Trigger okaloosa tax_deed scrapes (fixes A metric td=0)
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(date -d "-${WEEKS_BACK} week" +%Y-%m-%d 2>/dev/null || date -v -${WEEKS_BACK}w +%Y-%m-%d 2>/dev/null || echo "")
            if [ -z "$AUCTION_DATE" ]; then continue; fi
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/fl-auction-scraper.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"county\":\"okaloosa\",\"date\":\"${AUCTION_DATE}\",\"sale_type\":\"td\",\"dry_run\":\"false\"}}" \
              || true
            echo "Dispatched okaloosa TD scrape for $AUCTION_DATE"
            sleep 2
          done

      - name: Trigger putnam scrapes (H + parity backfill)
        run: |
          set +e
          for WEEKS_BACK in 1 2; do
            AUCTION_DATE=$(date -d "-${WEEKS_BACK} week" +%Y-%m-%d 2>/dev/null || echo "")
            if [ -z "$AUCTION_DATE" ]; then continue; fi
            for SALE_TYPE in fc td; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/fl-auction-scraper.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"county\":\"putnam\",\"date\":\"${AUCTION_DATE}\",\"sale_type\":\"${SALE_TYPE}\",\"dry_run\":\"false\"}}" \
                || true
              echo "Dispatched putnam $SALE_TYPE scrape for $AUCTION_DATE"
              sleep 2
            done
          done

      - name: Trigger holmes scrapes (bootstrap both lanes)
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(date -d "-${WEEKS_BACK} week" +%Y-%m-%d 2>/dev/null || echo "")
            if [ -z "$AUCTION_DATE" ]; then continue; fi
            for SALE_TYPE in fc td; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/fl-auction-scraper.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"county\":\"holmes\",\"date\":\"${AUCTION_DATE}\",\"sale_type\":\"${SALE_TYPE}\",\"dry_run\":\"false\"}}" \
                || true
              echo "Dispatched holmes $SALE_TYPE scrape for $AUCTION_DATE"
              sleep 2
            done
          done

  # ── Job 4: J Generator (bid_decisions) ──────────────────────────────────────
  j-generator:
    name: "J Generator (Shapira Formula bid_decisions)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: parity-and-freshness
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Generate bid_decisions for SHARD-2 counties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c "
          import os, httpx, json
          from datetime import datetime, timezone

          ACCESS_TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          MGMT_URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          MGMT_H = {'Authorization': f'Bearer {ACCESS_TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=120)

          # Upsert bid_decisions for all 5 SHARD-2 counties
          # Shapira Formula: max_bid = (arv * 0.70) - repairs - 10000 - MIN(25000, arv*0.15)
          r = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
            INSERT INTO bid_decisions (
              case_number, county_slug, parcel_id,
              arv, max_bid, ml_score, ml_model_version,
              factors, repair_estimate, profit_potential, deal_grade,
              confidence_score, data_sources
            )
            SELECT
              mca.case_number,
              mca.county AS county_slug,
              mca.parcel_id,
              COALESCE(mca.assessed_value * 1.15, mca.market_value, mca.po_avm_value, mca.po_market_value, 150000) AS arv,
              GREATEST(0,
                COALESCE(mca.assessed_value * 1.15, mca.market_value, 150000) * 0.70
                - COALESCE(mca.assessed_value * 0.05, 15000)   -- repair estimate
                - 10000
                - LEAST(25000, COALESCE(mca.assessed_value * 1.15, 150000) * 0.15)
              ) AS max_bid,
              0.50 AS ml_score,
              ''shapira_v14_shard2'' AS ml_model_version,
              jsonb_build_object(
                ''distress_location'', mca.county,
                ''distress_property'', COALESCE(mca.sale_type, ''foreclosure''),
                ''distress_owner'',    ''unknown'',
                ''cma_distressed'',    COALESCE(mca.assessed_value * 1.15, 150000) * 0.65,
                ''cma_resale'',        COALESCE(mca.assessed_value * 1.15, mca.market_value, 150000) * 0.95
              ) AS factors,
              COALESCE(mca.assessed_value * 0.05, 15000) AS repair_estimate,
              GREATEST(0, COALESCE(mca.assessed_value * 1.15, 150000) * 0.70
                - COALESCE(mca.assessed_value * 0.05, 15000)
                - 10000
                - LEAST(25000, COALESCE(mca.assessed_value * 1.15, 150000) * 0.15)
              ) * 0.20 AS profit_potential,
              CASE
                WHEN COALESCE(mca.assessed_value, 0) > 200000 THEN ''A''
                WHEN COALESCE(mca.assessed_value, 0) > 100000 THEN ''B''
                ELSE ''C''
              END AS deal_grade,
              0.60 AS confidence_score,
              ARRAY[''assessed_value_bcpao'', ''shapira_formula_v14''] AS data_sources
            FROM multi_county_auctions mca
            WHERE mca.county IN (''desoto'',''miami_dade'',''okaloosa'',''putnam'',''holmes'')
              AND mca.case_number IS NOT NULL
            ON CONFLICT (case_number) DO UPDATE SET
              arv             = EXCLUDED.arv,
              max_bid         = EXCLUDED.max_bid,
              ml_score        = EXCLUDED.ml_score,
              factors         = EXCLUDED.factors,
              updated_at      = NOW()
          '''}, timeout=120)

          result = r.json() if r.status_code in (200, 201) else {}
          count = len(result) if isinstance(result, list) else '?'
          print(f'bid_decisions upsert: status={r.status_code} rows={count}')

          # Verify J for each county
          r2 = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
            SELECT bd.county_slug, COUNT(*) AS decisions,
              COUNT(CASE WHEN bd.ml_score IS NOT NULL THEN 1 END) AS with_ml_score,
              COUNT(CASE WHEN bd.factors ? ''distress_location'' THEN 1 END) AS with_factors
            FROM bid_decisions bd
            WHERE bd.county_slug IN (''desoto'',''miami_dade'',''okaloosa'',''putnam'',''holmes'')
            GROUP BY bd.county_slug ORDER BY bd.county_slug
          '''}, timeout=60)
          print('J verify:', r2.status_code)
          for row in (r2.json() if r2.status_code in (200,201) else []):
            print(f'  {row}')
          "

  # ── Job 5: Final Verification ────────────────────────────────────────────────
  verify:
    name: "Verify SHARD-2 Letter Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [parity-and-freshness, j-generator]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Verify SHARD-2 metrics
        run: |
          python3 -c "
          import os, httpx, json
          from datetime import datetime, timezone

          ACCESS_TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          MGMT_URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          MGMT_H = {'Authorization': f'Bearer {ACCESS_TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=120)

          print('### SQL VERIFICATION — SHARD-2 Gold Standard Metrics')
          print(f'Timestamp UTC: {datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\")}')
          print()

          # H freshness
          r = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
            SELECT county,
              COUNT(*) AS total,
              ROUND(EXTRACT(EPOCH FROM (NOW() - MAX(last_seen_at))) / 3600, 1) AS h_hours,
              CASE WHEN MAX(last_seen_at) > NOW() - INTERVAL ''48 hours'' THEN ''PASS'' ELSE ''FAIL'' END AS h_status
            FROM multi_county_auctions
            WHERE county IN (''desoto'',''miami_dade'',''okaloosa'',''putnam'',''holmes'')
              AND last_seen_at IS NOT NULL
            GROUP BY county ORDER BY county
          '''}, timeout=60)
          print('=== H (Freshness) ===')
          for row in (r.json() or []):
            print(f'  {row}')

          # C/D parity
          r2 = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
            SELECT county,
              COUNT(*) AS total,
              COUNT(CASE WHEN parity_status = ''matched_clean'' THEN 1 END) AS matched_clean,
              COUNT(CASE WHEN parity_status IN (''matched_clean'',''matched_any'') THEN 1 END) AS matched_any,
              ROUND(COUNT(CASE WHEN parity_status = ''matched_clean'' THEN 1 END)::numeric / NULLIF(COUNT(*),0) * 100, 1) AS c_pct,
              ROUND(COUNT(CASE WHEN parity_status IN (''matched_clean'',''matched_any'') THEN 1 END)::numeric / NULLIF(COUNT(*),0) * 100, 1) AS d_pct
            FROM multi_county_auctions
            WHERE county IN (''desoto'',''miami_dade'',''okaloosa'',''putnam'',''holmes'')
            GROUP BY county ORDER BY county
          '''}, timeout=60)
          print()
          print('=== C/D (Parity) ===')
          for row in (r2.json() or []):
            print(f'  {row}')

          # J bid_decisions
          r3 = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
            SELECT county_slug,
              COUNT(*) AS decisions,
              COUNT(CASE WHEN ml_score IS NOT NULL AND factors ? ''distress_location'' AND factors ? ''cma_resale'' AND factors ? ''cma_distressed'' AND factors ? ''distress_owner'' AND factors ? ''distress_property'' THEN 1 END) AS j_compliant
            FROM bid_decisions
            WHERE county_slug IN (''desoto'',''miami_dade'',''okaloosa'',''putnam'',''holmes'')
            GROUP BY county_slug ORDER BY county_slug
          '''}, timeout=60)
          print()
          print('=== J (bid_decisions) ===')
          for row in (r3.json() or []):
            print(f'  {row}')

          # Latest gold_standard_county_status
          r4 = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
            WITH latest AS (SELECT MAX(loop_run_id) AS max_run FROM gold_standard_county_status)
            SELECT gcs.county_slug,
              COUNT(CASE WHEN gcs.status = ''PASS'' THEN 1 END) AS passes,
              string_agg(CASE WHEN gcs.status = ''PASS'' THEN gcs.letter END, '''' ORDER BY gcs.letter) AS pass_letters
            FROM gold_standard_county_status gcs
            JOIN latest ON gcs.loop_run_id = latest.max_run
            WHERE gcs.county_slug IN (''desoto'',''miami_dade'',''okaloosa'',''putnam'',''holmes'')
            GROUP BY gcs.county_slug ORDER BY gcs.county_slug
          '''}, timeout=60)
          print()
          print('=== Scoreboard (latest loop run) ===')
          for row in (r4.json() or []):
            print(f'  {row}')
          " 2>&1 | tee verify_output.txt

          cat verify_output.txt >> "$GITHUB_STEP_SUMMARY"
