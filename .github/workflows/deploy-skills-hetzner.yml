name: Deploy Skills to Hetzner

on:
  repository_dispatch:
    types: [deploy-skills]
  workflow_dispatch:
    inputs:
      skill_name:
        description: 'Specific skill to deploy (blank = all)'
        required: false
        default: ''

env:
  HETZNER_HOST: 87.99.129.125
  SKILLS_TARGET: /root/.claude/skills
  SKILLS_REPO: breverdbidder/claude-skills-library

jobs:
  deploy-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          token: ${{ secrets.GH_PAT }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Determine targets
        id: skills
        run: |
          SKILL="${{ github.event.inputs.skill_name || github.event.client_payload.skill_name || '' }}"
          if [ -n "$SKILL" ]; then
            echo "targets=$SKILL" >> $GITHUB_OUTPUT
            echo "mode=single" >> $GITHUB_OUTPUT
            echo "🎯 Single skill: $SKILL"
          else
            echo "targets=all" >> $GITHUB_OUTPUT
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "🎯 Deploying ALL skills"
          fi

      - name: Deploy to Hetzner
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"
          SCP_CMD="scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -r"

          $SSH_CMD "mkdir -p ${{ env.SKILLS_TARGET }}"

          if [ "${{ steps.skills.outputs.mode }}" = "single" ]; then
            SKILL="${{ steps.skills.outputs.targets }}"
            if [ -d "skills/$SKILL" ]; then
              echo "📦 Deploying: $SKILL"
              $SCP_CMD skills/$SKILL root@${{ env.HETZNER_HOST }}:${{ env.SKILLS_TARGET }}/
            else
              echo "❌ Skill not found: skills/$SKILL"
              exit 1
            fi
          else
            echo "📦 Deploying all skills..."
            for skill_dir in skills/*/; do
              skill_name=$(basename "$skill_dir")
              echo "  → $skill_name"
              $SCP_CMD "$skill_dir" root@${{ env.HETZNER_HOST }}:${{ env.SKILLS_TARGET }}/
            done
          fi

      - name: Verify deployment
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"

          echo "=== Deployed Skills ==="
          DEPLOYED=$($SSH_CMD "find ${{ env.SKILLS_TARGET }}/ -maxdepth 2 \( -name 'SKILL.md' -o -name 'skill.md' \) -exec dirname {} \;" | while read d; do basename "$d"; done | sort)
          echo "$DEPLOYED"
          COUNT=$(echo "$DEPLOYED" | wc -l)
          echo "✅ Total: $COUNT skills on Hetzner"

          # Verify animated-ui specifically
          $SSH_CMD "test -f ${{ env.SKILLS_TARGET }}/animated-ui/SKILL.md && echo '✅ animated-ui: LIVE' || echo '⚠️ animated-ui: MISSING'"

      - name: Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          MSG="$EMOJI Skills Deploy: $STATUS%0ATarget: Hetzner everest-dispatch%0AMode: ${{ steps.skills.outputs.mode }}%0ASkills: ${{ steps.skills.outputs.targets }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" > /dev/null 2>&1 || true
