name: RealAuction Multi-County Scraper

on:
  workflow_dispatch:
    inputs:
      county_slug:
        description: 'County slug (e.g. osceola, polk, volusia, marion, hillsborough)'
        required: true
      auction_date:
        description: 'Auction date YYYY-MM-DD'
        required: true
      sale_type:
        description: 'Sale type'
        required: false
        default: 'tax_deed'
        type: choice
        options:
          - tax_deed
          - foreclosure
      max_pages:
        description: 'Max pages to scrape'
        required: false
        default: '15'

concurrency:
  group: scrape-realauction-${{ github.event.inputs.county_slug }}-${{ github.event.inputs.auction_date }}-${{ github.event.inputs.sale_type }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install --quiet requests

      - name: Look up county in realauction_subdomains registry
        id: registry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY: ${{ github.event.inputs.county_slug }}
          SALE_TYPE: ${{ github.event.inputs.sale_type }}
        run: |
          set -euo pipefail

          # Query public.realauction_subdomains via PostgREST
          URL="$SUPABASE_URL/rest/v1/realauction_subdomains?county_slug=eq.${COUNTY}&sale_type=eq.${SALE_TYPE}&is_active=eq.true&limit=1"
          RESP=$(curl -sf \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json" \
            "$URL")

          COUNT=$(echo "$RESP" | jq 'length')
          if [ "$COUNT" = "0" ]; then
            echo "::error::No registry row for county=$COUNTY sale_type=$SALE_TYPE in public.realauction_subdomains"
            echo "Hint: Check the registry with SELECT * FROM public.realauction_subdomains WHERE county_slug='$COUNTY';"
            exit 1
          fi

          # Extract registry fields
          FULL_BASE=$(echo "$RESP" | jq -r '.[0].base_url')
          PLATFORM=$(echo "$RESP" | jq -r '.[0].platform')
          SUBDOMAIN=$(echo "$RESP" | jq -r '.[0].subdomain')

          # Strip query+path to get origin only — scraper appends its own path
          ORIGIN=$(echo "$FULL_BASE" | sed -E 's|(https?://[^/]+).*|\1|')

          echo "base_url=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

          echo "::notice::Registry hit: county=$COUNTY sale_type=$SALE_TYPE → $ORIGIN (platform=$PLATFORM)"
          echo "Full registry row:"
          echo "$RESP" | jq '.[0]'

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          COUNTY_SLUG: ${{ github.event.inputs.county_slug }}
          BASE_URL: ${{ steps.registry.outputs.base_url }}
          PLATFORM: ${{ steps.registry.outputs.platform }}
          SALE_TYPE: ${{ github.event.inputs.sale_type }}
          AUCTION_DATE: ${{ github.event.inputs.auction_date }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: python .github/scripts/scrape_realauction_county.py

      - name: Summarize scrape result
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY: ${{ github.event.inputs.county_slug }}
          SALE_TYPE: ${{ github.event.inputs.sale_type }}
          AUCTION_DATE: ${{ github.event.inputs.auction_date }}
        run: |
          set +e
          # Fetch the most recent scrape_runs row for this triple
          URL="$SUPABASE_URL/rest/v1/scrape_runs?source=eq.${COUNTY}_realtaxdeed&auction_date=eq.${AUCTION_DATE}&order=id.desc&limit=1"
          RESP=$(curl -sf -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" "$URL")
          if [ -n "$RESP" ] && [ "$(echo "$RESP" | jq 'length')" != "0" ]; then
            echo "## Scrape Summary"  >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json"           >> "$GITHUB_STEP_SUMMARY"
            echo "$RESP" | jq '.[0] | {id, status, rows_in, rows_inserted, duration: (.finished_at), notes: (.notes | fromjson? | {parser, total_cards, canon_breakdown})}' >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`"               >> "$GITHUB_STEP_SUMMARY"
          fi
