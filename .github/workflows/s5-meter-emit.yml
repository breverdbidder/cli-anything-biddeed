name: "S5 Meter Emission — billing_events -> Stripe Billing Meter"
# Zero-HITL: aggregates billing_events (stream_id='s5') per bd_key per hourly window and
# emits usage to the Stripe Billing Meter API, logging every attempt to s5_meter_emissions.
# Idempotent — safe to re-run (UNIQUE usage_source_ref + Stripe identifier dedupe).
#
# Surface to Ariel ONLY if STRIPE_SECRET_KEY missing/invalid.

on:
  workflow_dispatch: {}
  schedule:
    # LAUNCH-E (#20039, 2026-09-05): :15 -> :19, off the :00/:15/:30/:45
    # stampede marks (still hourly).
    - cron: '19 * * * *'

jobs:
  emit:
    name: "Emit S5 usage to Stripe Billing Meter"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install stripe SDK
        run: npm install stripe --no-save

      - name: Run s5-meter-emit.js
        env:
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
        run: |
          set -o pipefail
          node scripts/s5-meter-emit.js 2>&1 | tee /tmp/s5-meter-emit.log
