name: "Gold Standard SHARD-10 Run-651 (nassau/pinellas/putnam/sumter)"
# Dispatch: 447b32e4-948c-47ef-914e-a2f09da4191d
# Session: architect-20260626T000000
# Counties: nassau, pinellas, putnam, sumter
# Migration: migrations/20260626_shard10_nassau_pinellas_putnam_sumter.sql
# SHIP-TO-MAIN: direct push, no PRs, DB changes via migrations applied live

on:
  schedule:
    # Daily at 08:10 UTC
    - cron: '10 8 * * *'
    # Second window 16:10 UTC for afternoon session
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - migration
          - coordinator
          - verify

concurrency:
  group: gold-standard-shard10-run651
  cancel-in-progress: false

jobs:
  # ── Job 1: Apply migration ────────────────────────────────────────────────
  apply-migration:
    name: "Apply SHARD-10 Run-651 Migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'migration' || github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client 2>/dev/null || true

      - name: Apply migration via psql (nassau/pinellas/putnam/sumter schema changes)
        run: |
          set -euo pipefail
          REF="mocerqjnksmhcjzxrewo"
          MIGRATION_FILE="migrations/20260626_shard10_nassau_pinellas_putnam_sumter.sql"
          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "Migration file not found: $MIGRATION_FILE — skipping psql step"
            exit 0
          fi
          # Try both transaction and session pooler
          for CONN in \
            "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"; do
            if psql "$CONN" -c "SELECT 1" > /dev/null 2>&1; then
              echo "Connected via $CONN"
              psql "$CONN" -f "$MIGRATION_FILE" \
                && echo "Migration applied OK" \
                || echo "Migration had errors (may be idempotent re-run)"
              break
            fi
          done || echo "psql unavailable — REST-only mode (coordinator will apply via RPC)"

      - name: H freshness stamp via REST API (fallback migration path)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY — skipping H freshness stamp")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
          }

          now_iso = datetime.now(timezone.utc).isoformat()
          for county in ['nassau', 'pinellas', 'putnam', 'sumter']:
              url = f"{SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.{county}"
              payload = json.dumps({'updated_at': now_iso, 'last_seen_at': now_iso}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      r.read()
                      print(f"  {county}: H freshness stamped last_seen_at={now_iso}")
              except Exception as e:
                  print(f"  {county}: H freshness warning: {e}")

          print("H freshness stamp complete")
          PYEOF

      - name: Verify H freshness applied
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }

          print("=== SHARD-10 MCA FRESHNESS ===")
          for county in ['nassau', 'pinellas', 'putnam', 'sumter']:
              url = (
                  f"{SUPABASE_URL}/rest/v1/multi_county_auctions"
                  f"?county=eq.{county}&select=updated_at,last_seen_at"
                  f"&order=last_seen_at.desc&limit=1"
              )
              req = urllib.request.Request(url, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      rows = json.loads(r.read())
                      if rows:
                          last_seen = rows[0].get('last_seen_at') or rows[0].get('updated_at') or ''
                          print(f"  {county}: last_seen_at={last_seen}")
                      else:
                          print(f"  {county}: no rows")
              except Exception as e:
                  print(f"  {county}: error {e}")
          PYEOF

  # ── Job 2: Run coordinator ────────────────────────────────────────────────
  run-coordinator:
    name: "SHARD-10 Run-651 Coordinator"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: apply-migration
    if: always() && (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'coordinator' || github.event_name == 'schedule')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Configure git
        run: |
          git config user.email "shard10-run651-bot@biddeed.ai"
          git config user.name "SHARD-10 Run-651 Gold Standard Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/breverdbidder/cli-anything-biddeed.git

      - name: Run SHARD-10 Master Coordinator
        run: |
          set -euo pipefail
          python3 scripts/shard10_master_coordinator.py

      - name: Push any commits from coordinator
        if: always()
        run: |
          git pull --rebase origin main || true
          git push origin main || echo "Nothing to push"

  # ── Job 3: Verify metrics ─────────────────────────────────────────────────
  verify:
    name: "Verify SHARD-10 Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: run-coordinator
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate all 4 counties via pencil_dod_evaluate_county
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY — cannot verify")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }
          COUNTIES = ['nassau', 'pinellas', 'putnam', 'sumter']

          print("### SQL VERIFICATION — SHARD-10 Run-651")
          print(f"Dispatch: 447b32e4-948c-47ef-914e-a2f09da4191d")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print("")

          def rpc_evaluate(county):
              url = f"{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
              payload = json.dumps({'county_slug_arg': county}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  {county} eval error: {e}")
                  return None

          county_scores = {}
          for county in COUNTIES:
              result = rpc_evaluate(county)
              if result is None:
                  print(f"{county}: EVALUATION FAILED")
                  county_scores[county] = 0
                  continue

              if isinstance(result, dict):
                  passes = sum(
                      1 for ltr in 'ABCDEFGHIJ'
                      if isinstance(result.get(ltr), dict) and result[ltr].get('pass')
                  )
                  details = ' '.join(
                      f"{ltr}={'P' if isinstance(result.get(ltr), dict) and result[ltr].get('pass') else 'F'}"
                      for ltr in 'ABCDEFGHIJ'
                  )
                  print(f"{county} [{passes}/10]: {details}")
              elif isinstance(result, list):
                  passes = sum(1 for r in result if isinstance(r, dict) and r.get('pass'))
                  details = ' '.join(
                      f"{r.get('letter','?')}={'P' if r.get('pass') else 'F'}"
                      for r in result if isinstance(r, dict)
                  )
                  print(f"{county} [{passes}/10]: {details}")
              else:
                  passes = 0
                  print(f"{county}: unexpected result type {type(result)}")

              county_scores[county] = passes

          print("")
          total = sum(county_scores.values())
          print(f"TOTAL: {total}/40 letters passing")
          print(f"Scores: {county_scores}")
          PYEOF
