name: "Hetzner: CC OAuth + codedb (tap-to-auth)"
on:
  workflow_dispatch:
    inputs:
      install_codedb:
        description: 'Also install codedb?'
        type: boolean
        default: true
      use_setup_token:
        description: 'Use setup-token (1yr) vs auth login (8hr)'
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Full Hetzner Setup
        uses: appleboy/ssh-action@v1.2.0
        env:
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          PAT: ${{ secrets.GH_PAT }}
          INSTALL_CODEDB: ${{ inputs.install_codedb }}
          USE_SETUP_TOKEN: ${{ inputs.use_setup_token }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 18m
          envs: TG_TOKEN,TG_CHAT,PAT,ANTHROPIC_KEY,INSTALL_CODEDB,USE_SETUP_TOKEN
          script: |
            set -e
            export TG_TOKEN TG_CHAT PAT ANTHROPIC_KEY INSTALL_CODEDB USE_SETUP_TOKEN

            tg_send() {
              curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT}" -d "parse_mode=Markdown" \
                --data-urlencode "text=$1" >/dev/null 2>&1 || true
            }

            tg_button() {
              curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\":\"${TG_CHAT}\",\"parse_mode\":\"Markdown\",\"text\":\"$1\",\"reply_markup\":{\"inline_keyboard\":[[{\"text\":\"🔑 TAP TO LOGIN (5 min window)\",\"url\":\"$2\"}]]}}" >/dev/null 2>&1 || true
            }

            echo "════════════════════════════════════════"
            echo "  Hetzner Full Setup"
            echo "════════════════════════════════════════"

            # ── Phase 1: Install codedb ──
            if [ "$INSTALL_CODEDB" = "true" ]; then
              echo ">>> Installing codedb..."
              export CODEDB_NO_TELEMETRY=1
              curl -fsSL https://codedb.codegraff.com/install.sh | sh || true
              export PATH="$HOME/bin:$PATH"
              
              # Add to bashrc if not there
              grep -q 'CODEDB_NO_TELEMETRY' ~/.bashrc 2>/dev/null || \
                echo 'export CODEDB_NO_TELEMETRY=1' >> ~/.bashrc
              grep -q 'HOME/bin' ~/.bashrc 2>/dev/null || \
                echo 'export PATH="$HOME/bin:$PATH"' >> ~/.bashrc
              
              CODEDB_VER=$(codedb --version 2>/dev/null || echo "install failed")
              echo "codedb: $CODEDB_VER"
              
              # Pre-index repos if they exist
              for repo in cli-anything-biddeed zonewise-web biddeed-ai everest-nexus assistant-ui-zonewise; do
                RPATH="$HOME/repos/$repo"
                if [ -d "$RPATH" ]; then
                  echo "Indexing $repo..."
                  cd "$RPATH"
                  timeout 30 codedb snapshot . 2>/dev/null && echo "  ✓ snapshot created" || echo "  ⚠ snapshot skipped"
                  cd ~
                fi
              done
            fi

            # ── Phase 2: Check CC auth ──
            echo ">>> Checking Claude Code..."
            CC_VER=$(claude --version 2>&1 || echo "NOT_INSTALLED")
            echo "Claude Code: $CC_VER"

            if [ "$CC_VER" = "NOT_INSTALLED" ]; then
              echo "Installing Claude Code..."
              npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
              CC_VER=$(claude --version 2>&1)
            fi

            AUTH=$(claude auth status 2>&1 || true)
            echo "Auth status: $AUTH"

            if echo "$AUTH" | grep -qi "logged in"; then
              tg_send "✅ *Hetzner Setup Complete*

            CC: $CC_VER — Already authenticated
            codedb: $(codedb --version 2>/dev/null || echo 'N/A')

            All systems go. SUMMIT ready to dispatch."
              exit 0
            fi

            # ── Phase 3: OAuth — setup-token or auth login ──
            rm -f /tmp/cl-flush.txt
            
            AUTH_CMD="claude auth login"
            if [ "$USE_SETUP_TOKEN" = "true" ]; then
              AUTH_CMD="claude setup-token"
            fi
            echo ">>> Running: $AUTH_CMD"

            # Background: monitor for URL and send to Telegram
            (
              SENT=false
              for i in $(seq 1 300); do  # 5 minutes of monitoring
                sleep 1
                if [ -f /tmp/cl-flush.txt ]; then
                  URL=$(grep -oP 'https://claude\.ai\S+' /tmp/cl-flush.txt 2>/dev/null | head -1)
                  if [ -n "$URL" ] && [ "$SENT" = false ]; then
                    SENT=true
                    echo "CAPTURED URL at ${i}s: $URL"
                    
                    tg_button "🔐 *CC OAuth — Tap NOW*

            Token type: $([ \"$USE_SETUP_TOKEN\" = true ] && echo '1-YEAR setup-token' || echo '8hr session')
            Server: Hetzner ($CC_VER)
            Window: *5 minutes*

            After tapping, wait 30s for confirmation." "$URL"
                    
                    # Also post to GitHub issue as backup
                    curl -sf -X POST \
                      -H "Authorization: token ${PAT}" \
                      -H "Content-Type: application/json" \
                      "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/1/comments" \
                      -d "{\"body\":\"🔑 CC OAuth URL ($(date -u +%H:%M)UTC):\\n${URL}\"}" >/dev/null 2>&1 || true
                  fi
                fi
              done
            ) &
            URL_PID=$!

            # Run auth command with script for TTY emulation
            TERM=dumb script -f -q /tmp/cl-flush.txt -c "$AUTH_CMD" &
            AUTH_PID=$!

            # Poll for auth success (5 min = 60 polls x 5s)
            AUTHED=false
            for i in $(seq 1 60); do
              sleep 5
              STATUS=$(claude auth status 2>&1 || true)
              if echo "$STATUS" | grep -qi "logged in"; then
                AUTHED=true
                echo "✅ AUTH SUCCESS after $((i*5))s"
                
                # If setup-token, capture the token from output
                if [ "$USE_SETUP_TOKEN" = "true" ] && [ -f /tmp/cl-flush.txt ]; then
                  TOKEN=$(grep -oP 'sk-ant-oat01-\S+' /tmp/cl-flush.txt 2>/dev/null | head -1)
                  if [ -n "$TOKEN" ]; then
                    # Save as env var for persistence
                    grep -q 'CLAUDE_CODE_OAUTH_TOKEN' ~/.bashrc 2>/dev/null && \
                      sed -i '/CLAUDE_CODE_OAUTH_TOKEN/d' ~/.bashrc
                    echo "export CLAUDE_CODE_OAUTH_TOKEN=\"$TOKEN\"" >> ~/.bashrc
                    chmod 600 ~/.bashrc
                    echo "✅ 1-year token saved to ~/.bashrc"
                  fi
                fi
                
                break
              fi
              echo "  Poll $i/60: waiting..."
            done

            kill $AUTH_PID $URL_PID 2>/dev/null || true

            # ── Phase 4: Fallback to API key ──
            if [ "$AUTHED" = false ]; then
              echo ">>> OAuth timed out. Setting up API key fallback..."
              if [ -n "$ANTHROPIC_KEY" ]; then
                chmod 600 ~/.bashrc
                
                # Bypass onboarding
                python3 -c "
            import json
            try:
                with open('/root/.claude.json') as f: cfg = json.load(f)
            except: cfg = {}
            cfg['hasCompletedOnboarding'] = True
            cfg['lastOnboardingVersion'] = '$(claude --version 2>/dev/null | head -1)'
            with open('/root/.claude.json','w') as f: json.dump(cfg, f, indent=2)
            " 2>/dev/null || true
                
                tg_send "⚠️ *OAuth timed out* — API key fallback activated.

            CC will work but uses API billing (not Max subscription).
            Re-run workflow and tap the link within 5 min for Max auth.
            
            codedb: $(codedb --version 2>/dev/null || echo 'N/A')"
              else
                tg_send "❌ *OAuth failed, no API key fallback.*
            Re-run and tap the Telegram link within 5 min."
              fi
              exit 1
            fi

            # ── Phase 5: Final report ──
            tg_send "✅ *Hetzner Fully Configured*

            🔐 CC: $CC_VER — Authenticated $([ \"$USE_SETUP_TOKEN\" = true ] && echo '(1yr token)' || echo '(session)')
            📦 codedb: $(codedb --version 2>/dev/null || echo 'not installed')
            🔍 Repos indexed: $(ls ~/repos/*/codedb.snapshot 2>/dev/null | wc -l)/5

            SESSION HYGIENE 5/5 ready. SUMMIT can dispatch."
