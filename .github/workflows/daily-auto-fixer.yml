name: "Daily Auto-Fixer (6:01 AM EDT)"

on:
  schedule:
    - cron: '1 10 * * *'  # 6:01 AM EDT = 10:01 UTC (switch to 11:01 Nov)
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install requests --break-system-packages -q

      - name: Auto-fix open items
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          python3 << 'PYSCRIPT'
          import requests, json, os
          from datetime import datetime, timezone, timedelta

          GH = os.environ["GH_PAT"]
          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID", "")
          gh_h = {"Authorization": f"token {GH}", "Accept": "application/vnd.github.v3+json"}
          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          EST = timezone(timedelta(hours=-4))
          NOW = datetime.now(EST)
          TODAY = NOW.strftime("%Y-%m-%d")
          fixes = []
          errors = []

          # === FIX 1: Disable stale/broken GHA workflows ===
          # Workflows that have failed 5+ times in a row are noise — disable them
          repos = ["cli-anything-biddeed", "brevard-bidder-scraper", "everest-nexus", "zonewise-web", "cliproxy-gateway"]
          stale_wf_fixed = 0
          for repo in repos:
              try:
                  runs = requests.get(
                      f"https://api.github.com/repos/breverdbidder/{repo}/actions/runs?per_page=100&status=failure",
                      headers=gh_h, timeout=15
                  ).json().get("workflow_runs", [])
                  
                  # Count failures per workflow
                  wf_fails = {}
                  for r in runs:
                      wf_name = r.get("name", "?")
                      wf_fails[wf_name] = wf_fails.get(wf_name, 0) + 1
                  
                  # Log chronic failures (5+ in a row) but don't disable — just report
                  for wf, count in wf_fails.items():
                      if count >= 5:
                          fixes.append(f"⚠️ {repo}/{wf}: {count} failures")
                          # Auto-disable if 10+ failures
                          if count >= 10:
                              try:
                                  wf_list = requests.get(f"https://api.github.com/repos/breverdbidder/{repo}/actions/workflows?per_page=100", headers=gh_h, timeout=10).json().get("workflows", [])
                                  for w in wf_list:
                                      if w["name"] == wf_name and w["state"] == "active":
                                          dr = requests.put(f"https://api.github.com/repos/breverdbidder/{repo}/actions/workflows/{w['id']}/disable", headers=gh_h, timeout=10)
                                          if dr.status_code == 204: fixes.append(f"🔧 DISABLED {repo}/{wf_name}")
                                          break
                              except: pass
                          stale_wf_fixed += 1
              except Exception as e:
                  errors.append(f"GHA scan {repo}: {e}")

          # === FIX 2: Check and report honesty violations ===
          open_violations = []
          try:
              r = requests.get(
                  f"{SB_URL}/rest/v1/honesty_violations?resolved=eq.false&order=severity.asc",
                  headers=sb_h, timeout=10
              )
              if r.status_code == 200:
                  open_violations = r.json()
                  for v in open_violations:
                      fixes.append(f"🔴 HONESTY [{v['severity']}] {v['domain']}: {v['claim'][:50]}")
          except Exception as e:
              errors.append(f"Honesty query: {e}")

          # === FIX 3: Check nexus P0 tasks not acted on in 24h ===
          stale_p0 = []
          try:
              r = requests.get(
                  f"{SB_URL}/rest/v1/nexus_tasks?priority=eq.P0&status=in.(queued,running,dispatched)&order=created_at.asc",
                  headers=sb_h, timeout=10
              )
              if r.status_code == 200:
                  for t in r.json():
                      created = t.get("created_at", "")
                      if created:
                          age_hrs = (datetime.now(timezone.utc) - datetime.fromisoformat(created.replace("Z", "+00:00"))).total_seconds() / 3600
                          if age_hrs > 24:
                              fixes.append(f"🟡 P0 stale ({int(age_hrs)}h): {t.get('description', '?')[:50]}")
                              stale_p0.append(t)
          except Exception as e:
              errors.append(f"P0 query: {e}")

          # === FIX 4: Re-run failed Sentinel if it's down ===
          try:
              sentinel_runs = requests.get(
                  f"https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/sentinel.yml/runs?per_page=3",
                  headers=gh_h, timeout=15
              ).json().get("workflow_runs", [])
              
              all_failed = all(r.get("conclusion") == "failure" for r in sentinel_runs[:3]) if sentinel_runs else False
              if all_failed:
                  fixes.append("🔧 Sentinel down 3x — retriggering")
                  requests.post(
                      f"https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/sentinel.yml/dispatches",
                      headers=gh_h, json={"ref": "main"}, timeout=10
                  )
          except Exception as e:
              errors.append(f"Sentinel check: {e}")

          # === BUILD REPORT ===
          report = f"🔧 AUTO-FIXER — {NOW.strftime('%A %b %d, %I:%M %p')}

"
          
          if not fixes and not errors:
              report += "✅ All clear. No open violations, no stale P0s, no chronic GHA failures.
"
          else:
              if open_violations:
                  report += f"🔴 {len(open_violations)} honesty violation(s) open
"
              if stale_p0:
                  report += f"🟡 {len(stale_p0)} P0 task(s) stale >24h
"
              if stale_wf_fixed:
                  report += f"⚠️ {stale_wf_fixed} workflow(s) with 5+ failures
"
              report += "
Details:
"
              for f in fixes[:15]:  # Cap at 15 to avoid Telegram limit
                  report += f"  {f}
"
              if len(fixes) > 15:
                  report += f"  ... and {len(fixes)-15} more
"
          
          if errors:
              report += f"
❌ Errors: {len(errors)}
"
              for e in errors[:5]:
                  report += f"  {e}
"

          print(report)

          # === SEND TO TELEGRAM ===
          if TG_TOKEN and TG_CHAT:
              try:
                  # Truncate to Telegram limit (4096 chars)
                  msg = report[:4000]
                  r = requests.post(
                      f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                      json={"chat_id": TG_CHAT, "text": msg, "parse_mode": "HTML"},
                      timeout=10
                  )
                  print(f"
{'✅' if r.status_code == 200 else '❌'} Telegram: {r.status_code}")
              except Exception as e:
                  print(f"
❌ Telegram: {e}")

          # === LOG TO SUPABASE ===
          try:
              requests.post(
                  f"{SB_URL}/rest/v1/daily_action_plans",
                  headers=sb_h,
                  json={"date": TODAY, "rank": 0, "domain": "SYSTEM",
                        "task": f"Auto-fixer: {len(fixes)} items, {len(errors)} errors",
                        "reason": report[:500]},
                  timeout=10
              )
              print("✅ Supabase logged")
          except Exception as e:
              print(f"❌ Supabase: {e}")

          PYSCRIPT
