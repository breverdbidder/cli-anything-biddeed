name: Close Stale Issue #139 — GHA-883640 Resolved

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-stale-139.yml'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark GHA-883640 done in nexus_tasks and close issue #139
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, os, textwrap
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "breverdbidder/cli-anything-biddeed"

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          gh_h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}

          # 1. Mark GHA-883640 as done in nexus_tasks
          for status_val in ["done", "resolved", "cancelled"]:
              r = requests.patch(
                  f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.GHA-883640",
                  headers=sb_h,
                  json={
                      "status": status_val,
                      "completed_at": datetime.now(timezone.utc).isoformat(),
                      "result_summary": (
                          "summit-chat-v2-verify.yml YAML parse failure diagnosed and fixed. "
                          "Template literal lines at column-0 inside JS heredoc caused GitHub's "
                          "YAML parser to terminate the block scalar early. Fixed in commit e9a0cd97 "
                          "by indenting all column-0 template literal lines to 12 spaces. "
                          "No failures after fix was pushed at 2026-03-31T17:25Z. Verified."
                      ),
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                  }
              )
              print(f"Supabase update ({status_val}): {r.status_code} -- {r.text[:200]}")
              if r.status_code in (200, 204):
                  break
              if r.status_code == 400 and "23514" in r.text:
                  continue
              break

          # 2. Ensure issue #139 is closed
          r3 = requests.patch(
              f"https://api.github.com/repos/{REPO}/issues/139",
              headers=gh_h,
              json={"state": "closed", "state_reason": "completed"}
          )
          print(f"Close issue #139: {r3.status_code}")
          PYSCRIPT
