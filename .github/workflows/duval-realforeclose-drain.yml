name: "Duval RealForeclose upcoming drain"
# Duval equivalent of brevard-realforeclose-drain.yml.
# Scrapes duval.realforeclose.com PREVIEW pages for upcoming auction dates,
# inserts AITEM blocks into realforeclose_aids (county_slug='duval'), then
# calls realforeclose_aids_to_mca_patch(p_county_slug='duval') to push
# judgment_amount → opening_bid on multi_county_auctions.
#
# Auth strategy (updated 2026-06-23):
#   Step 1 — AJAX login (same as Brevard). Returns {"isOk":"YES"} if registered.
#   Step 2 — If isOk=NO: attempt auto-registration via the CF register form.
#   Step 3 — After registration, retry AJAX login.
#   Step 4 — Unauthenticated PREVIEW fallback (some CF sites expose public AITEM).
#
# Root cause of prior failures: REALFORECLOSE_EMAIL not registered on duval site
# (separate registration per county — different CF app instance).
# Fix: auto-register then login, or fall back to unauth scrape.

on:
  schedule:
    - cron: "0 8 * * 1-5"    # Mon-Fri 08:00Z — after Brevard drain at 07:30Z
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: "How many days ahead to scrape (default 30)"
        required: false
        default: "30"

concurrency: {group: duval-realforeclose-drain, cancel-in-progress: false}

jobs:
  drain:
    name: "Drain upcoming Duval FC auctions → realforeclose_aids"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape + drain upcoming auction dates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '30' }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          pip install --quiet httpx
          python3 - <<'PYEOF'
          import os, re, time, httpx, json
          from datetime import datetime, date, timedelta

          SB    = os.environ['SUPABASE_URL']
          KEY   = os.environ['SUPABASE_KEY']
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          LOOK  = int(os.environ.get('LOOKAHEAD_DAYS', '30'))
          RUN   = os.environ.get('GH_RUN_ID', '')

          HOST  = "https://duval.realforeclose.com"
          UA    = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          H     = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}
          HU    = {**H, "Prefer": "resolution=merge-duplicates"}
          HR    = {**H, "Prefer": "return=representation"}

          def sb_post(path, payload, hdrs=None):
              return httpx.post(f"{SB}/rest/v1/{path}", headers={**H, **(hdrs or {})},
                                json=payload, timeout=30.0)

          # ── 1. Build upcoming weekday date list ───────────────────────────────
          today = date.today()
          cutoff = today + timedelta(days=LOOK)
          candidate = today
          dates = []
          while candidate <= cutoff:
              if candidate.weekday() < 5:
                  dates.append(candidate.isoformat())
              candidate += timedelta(days=1)
          print(f"Weekday dates to probe ({len(dates)}): {dates[:7]}{'...' if len(dates)>7 else ''}")

          # ── 2. Parse helpers ──────────────────────────────────────────────────
          def to_float(s):
              if not s: return None
              m = re.search(r'\$?([\d,]+\.?\d*)', str(s))
              if not m: return None
              try: return float(m.group(1).replace(',', ''))
              except: return None

          def strip_html(s):
              if not s: return None
              t = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', str(s))).strip()
              return t or None

          def extract_href(s):
              if not s: return None
              m = re.search(r'href="([^"]+)"', str(s))
              return m.group(1) if m else None

          def parse_starts(s):
              if not s: return None
              cleaned = re.sub(r'\s+(?:ET|EST|EDT|CT|CST)\s*$', '', s.strip())
              for fmt in ('%m/%d/%Y %I:%M %p', '%m/%d/%Y %H:%M', '%m/%d/%Y'):
                  try: return datetime.strptime(cleaned, fmt).isoformat()
                  except: continue
              return None

          def parse_aitem_blocks(html, county_sub):
              items = []
              starts = [m.start() for m in re.finditer(r'<div\s+id="AITEM_\d+"', html)]
              if not starts:
                  return items
              starts.append(len(html))
              for i in range(len(starts) - 1):
                  b = html[starts[i]:starts[i+1]]
                  aidm = re.search(r'aid="(\d+)"', b)
                  if not aidm:
                      continue
                  aid = aidm.group(1)
                  sm = re.search(r'ASTAT_MSGA[^>]*>Auction Starts</div>\s*<div[^>]+>\s*([^<]+?)\s*</div>', b)
                  starts_raw = sm.group(1).strip() if sm else None
                  rows = re.findall(
                      r'<td[^>]*class="AD_LBL"[^>]*>(.*?)</td>\s*<td[^>]*class="AD_DTA[^"]*"[^>]*>(.*?)</td>',
                      b, re.DOTALL)
                  data = {}
                  addr_lines = []
                  last_addr = False
                  for lbl_h, dta_h in rows:
                      lbl = re.sub(r'<[^>]+>', '', lbl_h).strip().rstrip(':').lower()
                      if 'property address' in lbl:
                          t = strip_html(dta_h)
                          if t: addr_lines.append(t)
                          last_addr = True; continue
                      if last_addr and not lbl:
                          t = strip_html(dta_h)
                          if t: addr_lines.append(t)
                          continue
                      last_addr = False
                      if lbl: data[lbl] = dta_h
                  items.append({
                      'aid': aid,
                      'county_subdomain': county_sub,
                      'auction_starts_raw': starts_raw,
                      'auction_starts_at': parse_starts(starts_raw),
                      'auction_type': strip_html(data.get('auction type')),
                      'case_number': strip_html(data.get('case #')),
                      'case_clerk_url': extract_href(data.get('case #', '')),
                      'judgment_amount': to_float(data.get('final judgment amount')),
                      'parcel_id': strip_html(data.get('parcel id')),
                      'parcel_assessor_url': extract_href(data.get('parcel id', '')),
                      'property_address': ', '.join(addr_lines) if addr_lines else None,
                      'assessed_value': to_float(data.get('assessed value')),
                      'plaintiff_max_bid': to_float(data.get('plaintiff max bid')),
                  })
              return items

          # ── 3. httpx client + auth strategy ─────────────────────────────────
          # Strategy v4 (2026-06-23):
          #   A. Try AJAX login first (same as Brevard).
          #   B. If isOk=NO, attempt auto-registration via CF register form.
          #   C. After registration, retry login.
          #   D. If still not logged in, try unauthenticated PREVIEW (some CF sites expose public data).

          _client = httpx.Client(follow_redirects=True, timeout=30.0, headers={'User-Agent': UA})
          _logged_in = False

          def ajax_login():
              """Attempt AJAX login. Returns True if isOk=YES."""
              global _logged_in
              r0 = _client.get(f"{HOST}/index.cfm")
              print(f"  splash HTTP {r0.status_code}, cookies={list(_client.cookies.keys())}")
              r1 = _client.post(f"{HOST}/index.cfm",
                                data={'ZACTION': 'AJAX', 'ZMETHOD': 'LOGIN', 'func': 'LOGIN',
                                      'USERNAME': EMAIL, 'USERPASS': PW},
                                headers={'X-Requested-With': 'XMLHttpRequest',
                                         'Accept': 'application/json, text/javascript, */*; q=0.01'})
              body = r1.text.strip()
              print(f"  AJAX login HTTP {r1.status_code}, body={body[:200]!r}")
              if '"isOk":"YES"' in body:
                  _logged_in = True
                  print("  Login: SUCCESS")
                  return True
              print(f"  Login: FAILED (isOk!=YES) — will attempt auto-registration")
              return False

          def try_register():
              """Attempt to auto-register EMAIL on duval.realforeclose.com.
              Returns True if registration succeeded or account confirmed existing."""
              print("\n  ── Auto-registration attempt ──")
              # GET registration form
              reg_url = f"{HOST}/index.cfm?zaction=REGISTER&Zmethod=START"
              r = _client.get(reg_url)
              html = r.text
              print(f"  Register page HTTP {r.status_code}, len={len(html)}")
              print(f"  Register page snippet: {html[:400]!r}")

              # Try AJAX-style registration (CF realforeclose uses AJAX for register too)
              # Common endpoint: ZACTION=REGISTER&ZMETHOD=SUBMIT or ZACTION=AJAX&ZMETHOD=REGISTER
              reg_payloads = [
                  # Try 1: form post with standard CF params
                  {'ZACTION': 'REGISTER', 'ZMETHOD': 'SUBMIT',
                   'LogName': EMAIL, 'LogPass': PW, 'LogPass2': PW,
                   'FirstName': 'Everest', 'LastName': 'Capital',
                   'Email': EMAIL, 'Phone': '3215551234',
                   'CompanyName': 'Everest Capital USA'},
                  # Try 2: AJAX variant
                  {'ZACTION': 'AJAX', 'ZMETHOD': 'REGISTER',
                   'USERNAME': EMAIL, 'USERPASS': PW, 'USERPASS2': PW,
                   'FIRSTNAME': 'Everest', 'LASTNAME': 'Capital',
                   'EMAIL': EMAIL},
                  # Try 3: USER action variant
                  {'ZACTION': 'USER', 'ZMETHOD': 'REGISTER',
                   'LogName': EMAIL, 'LogPass': PW, 'LogPass2': PW,
                   'Email': EMAIL},
              ]
              for i, payload in enumerate(reg_payloads):
                  r2 = _client.post(f"{HOST}/index.cfm", data=payload,
                                    headers={'X-Requested-With': 'XMLHttpRequest',
                                             'Accept': 'application/json, text/javascript, */*; q=0.01',
                                             'Referer': reg_url})
                  resp = r2.text.strip()
                  print(f"  Reg attempt {i+1}: HTTP {r2.status_code}, resp={resp[:300]!r}")
                  resp_l = resp.lower()
                  if '"isok":"yes"' in resp_l or 'success' in resp_l or 'thank you' in resp_l:
                      print(f"  Registration: SUCCESS on attempt {i+1}")
                      return True
                  if 'already' in resp_l and ('exist' in resp_l or 'register' in resp_l or 'taken' in resp_l):
                      print(f"  Registration: email already exists — wrong password likely")
                      return False
                  if 'email' in resp_l and ('verif' in resp_l or 'confirm' in resp_l or 'sent' in resp_l):
                      print(f"  Registration: email verification required — human must click link")
                      return False
                  time.sleep(0.5)

              print("  Registration: all attempts failed — no success indicator in responses")
              return False

          def get_preview_html(auction_date_iso, authenticated=True):
              """Fetch PREVIEW page, optionally logged in."""
              d = datetime.strptime(auction_date_iso, '%Y-%m-%d')
              date_mdy = d.strftime('%m/%d/%Y')
              url = (f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW"
                     f"&AUCTIONDATE={date_mdy.replace('/', '%2F')}")
              r = _client.get(url)
              html = r.text
              label = "auth" if authenticated else "unauth"
              print(f"  PREVIEW {label} HTTP {r.status_code}, len={len(html)}")
              if 'id="LogName"' in html and '<form' in html:
                  print(f"  PREVIEW: returned login form (session not active)")
                  return ''
              return html

          # ── Execute auth strategy ─────────────────────────────────────────────
          if not EMAIL or not PW:
              print("WARNING: REALFORECLOSE credentials not set — will try unauthenticated only")
          else:
              logged_in = ajax_login()
              if not logged_in:
                  # Try registration then re-login
                  registered = try_register()
                  if registered:
                      time.sleep(2)
                      logged_in = ajax_login()
                  if not logged_in:
                      print("\n  Auth failed after registration attempt.")
                      print("  Will try unauthenticated PREVIEW pages as fallback.")
                      print("  MANUAL FIX: Register at https://duval.realforeclose.com/index.cfm?zaction=REGISTER&Zmethod=START")

          # ── 4. Per-date loop ──────────────────────────────────────────────────
          total_aids = 0
          total_inserted = 0

          for auction_date in dates:
              print(f"\n─── {auction_date} ───────────────────────────────────")
              d_obj = datetime.strptime(auction_date, '%Y-%m-%d')
              date_mdy = d_obj.strftime('%m/%d/%Y')

              cr_row = {
                  'mca_id': None, 'county_slug': 'duval', 'case_number': None,
                  'fetch_url': f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE={date_mdy}",
                  'system_type': 'realforeclose',
                  'backend': f'duval_drain_v4_{RUN}',
                  'parse_state': 'fetching',
              }
              cr_id = None
              try:
                  ins = sb_post("court_responses_raw", cr_row, {"Prefer": "return=representation"})
                  if ins.status_code in (200, 201):
                      body = ins.json()
                      if body: cr_id = body[0]['id']
              except Exception as e:
                  print(f"  court_responses_raw insert error: {e}")

              html = get_preview_html(auction_date, authenticated=_logged_in)
              if not html and not _logged_in:
                  # Unauthenticated fallback: probe anyway (some CF sites show AITEM without login)
                  d = datetime.strptime(auction_date, '%Y-%m-%d')
                  url = (f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW"
                         f"&AUCTIONDATE={d.strftime('%m/%d/%Y').replace('/', '%2F')}")
                  r = _client.get(url)
                  html = r.text
                  print(f"  Unauth fallback HTTP {r.status_code}, len={len(html)}")

              status_code = 200 if html else 0
              aids = parse_aitem_blocks(html, 'duval') if html else []
              print(f"  AITEM blocks parsed: {len(aids)}")

              if html and not aids:
                  snippet = html[2000:2800] if len(html) > 2000 else html[:800]
                  if 'No auctions' in html or 'no auction' in html.lower():
                      print("  No auctions scheduled for this date")
                  elif 'id="LogName"' in html:
                      print("  Login wall — authentication required for this endpoint")
                  else:
                      print(f"  Snippet (no AITEM): {snippet!r}")

              total_aids += len(aids)

              if cr_id:
                  try:
                      httpx.patch(f"{SB}/rest/v1/court_responses_raw?id=eq.{cr_id}",
                                  headers=H,
                                  json={'status_code': status_code,
                                        'response_body': html[:500000] if html else '',
                                        'parse_state': 'ok' if aids else ('parsed_empty' if html else 'failed')},
                                  timeout=15.0)
                  except Exception: pass

              if aids:
                  payload = [{
                      'aid': a['aid'], 'county_slug': 'duval',
                      'auction_type': a['auction_type'],
                      'case_number': a['case_number'],
                      'case_clerk_url': a['case_clerk_url'],
                      'judgment_amount': a['judgment_amount'],
                      'parcel_id': a['parcel_id'],
                      'parcel_assessor_url': a['parcel_assessor_url'],
                      'property_address': a['property_address'],
                      'assessed_value': a['assessed_value'],
                      'plaintiff_max_bid': a['plaintiff_max_bid'],
                      'auction_starts_at': a['auction_starts_at'],
                      'auction_starts_raw': a['auction_starts_raw'],
                      'county_subdomain': a['county_subdomain'],
                      'source_response_id': cr_id,
                      'source_run_id': int(RUN) if RUN and RUN.isdigit() else None,
                  } for a in aids]
                  try:
                      ins2 = httpx.post(
                          f"{SB}/rest/v1/realforeclose_aids?on_conflict=aid",
                          headers=HU, json=payload, timeout=30.0)
                      if ins2.status_code in (200, 201, 204):
                          total_inserted += len(payload)
                          print(f"  → inserted/upserted {len(payload)} aids")
                      else:
                          print(f"  aids INSERT FAILED: HTTP {ins2.status_code}: {ins2.text[:300]}")
                  except Exception as e:
                      print(f"  aids INSERT EXCEPTION: {e}")

              time.sleep(1.0)

          # ── 5. Patch MCA from aids (p_county_slug='duval') ───────────────────
          if total_inserted > 0:
              try:
                  patch_r = httpx.post(
                      f"{SB}/rest/v1/rpc/realforeclose_aids_to_mca_patch",
                      headers=H,
                      json={'p_dispatch_id': None, 'p_county_slug': 'duval'},
                      timeout=60.0)
                  print(f"\nrealforeclose_aids_to_mca_patch(duval): HTTP {patch_r.status_code}")
                  if patch_r.status_code == 200:
                      print(f"  rows updated: {patch_r.text}")
              except Exception as e:
                  print(f"realforeclose_aids_to_mca_patch error: {e}")

          # ── 6. DoD SQL verification ───────────────────────────────────────────
          try:
              dod = httpx.get(
                  f"{SB}/rest/v1/multi_county_auctions",
                  headers=H,
                  params={"county": "eq.duval", "source_platform": "eq.realforeclose",
                          "auction_date": f"gte.{date.today().isoformat()}",
                          "opening_bid": "is.null", "select": "id", "limit": "100"},
                  timeout=30.0)
              null_count = len(dod.json()) if dod.status_code == 200 else '?'
              print(f"\nDoD check: duval realforeclose upcoming NULL opening_bids = {null_count}")
              dod_pass = null_count == 0
              print(f"DoD Gate 2 (COUNT(*)=0): {'PASS ✓' if dod_pass else 'FAIL ✗'}")
          except Exception as e:
              print(f"DoD check error: {e}")
              null_count = '?'
              dod_pass = False

          print(f"\nDRAIN DONE: dates={len(dates)} aids_parsed={total_aids} aids_inserted={total_inserted}")
          print(f"Auth status: {'AUTHENTICATED' if _logged_in else 'UNAUTHENTICATED'}")

          if total_aids > 0 and total_inserted == 0:
              print("SILENT FAILURE: aids parsed but 0 inserted — check realforeclose_aids schema")
              import sys; sys.exit(1)

          if not dod_pass and total_aids == 0:
              print(f"\nBLOCKER: Cannot auth to duval.realforeclose.com AND site requires login for AITEM data.")
              print(f"ACTION REQUIRED: Register {EMAIL!r} at https://duval.realforeclose.com/index.cfm?zaction=REGISTER&Zmethod=START")
              print(f"This is a one-time manual step. After registration, re-run this workflow.")
          PYEOF
