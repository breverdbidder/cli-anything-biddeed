name: "Duval RealForeclose upcoming drain"
# Duval equivalent of brevard-realforeclose-drain.yml.
# Scrapes duval.realforeclose.com PREVIEW pages for upcoming auction dates,
# inserts AITEM blocks into realforeclose_aids (county_slug='duval'), then
# calls realforeclose_aids_to_mca_patch(p_county_slug='duval') to push
# judgment_amount → opening_bid on multi_county_auctions.

on:
  schedule:
    - cron: "0 8 * * 1-5"    # Mon-Fri 08:00Z — after Brevard drain at 07:30Z
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: "How many days ahead to scrape (default 30)"
        required: false
        default: "30"

concurrency: {group: duval-realforeclose-drain, cancel-in-progress: false}

jobs:
  drain:
    name: "Drain upcoming Duval FC auctions → realforeclose_aids"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet httpx

      - name: Scrape + drain upcoming auction dates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '30' }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, time, httpx
          from datetime import datetime, date, timedelta, timezone

          SB    = os.environ['SUPABASE_URL']
          KEY   = os.environ['SUPABASE_KEY']
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          FC    = os.environ.get('FIRECRAWL_API_KEY', '')
          LOOK  = int(os.environ.get('LOOKAHEAD_DAYS', '30'))
          RUN   = os.environ.get('GH_RUN_ID', '')

          HOST  = "https://duval.realforeclose.com"
          H     = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}
          HU    = {**H, "Prefer": "resolution=merge-duplicates"}
          HR    = {**H, "Prefer": "return=representation"}

          def sb_get(path, params=None):
              return httpx.get(f"{SB}/rest/v1/{path}", headers=H, params=params, timeout=20.0)

          def sb_post(path, payload, hdrs=None):
              return httpx.post(f"{SB}/rest/v1/{path}", headers={**H, **(hdrs or {})},
                                json=payload, timeout=30.0)

          # ── 1. Discover upcoming Duval foreclosure auction dates ──────────────
          today = date.today()
          cutoff = today + timedelta(days=LOOK)
          candidate = today
          dates = []
          while candidate <= cutoff:
              if candidate.weekday() < 5:  # Mon=0 … Fri=4
                  dates.append(candidate.isoformat())
              candidate += timedelta(days=1)
          print(f"Weekday dates to probe ({len(dates)}): {dates[:7]}{'...' if len(dates)>7 else ''}")

          # ── 2. Helpers ────────────────────────────────────────────────────────
          def to_float(s):
              if not s: return None
              m = re.search(r'\$?([\d,]+\.?\d*)', str(s))
              if not m: return None
              try: return float(m.group(1).replace(',', ''))
              except: return None

          def strip_html(s):
              if not s: return None
              t = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', str(s))).strip()
              return t or None

          def extract_href(s):
              if not s: return None
              m = re.search(r'href="([^"]+)"', str(s))
              return m.group(1) if m else None

          def parse_starts(s):
              if not s: return None
              cleaned = re.sub(r'\s+(?:ET|EST|EDT|CT|CST)\s*$', '', s.strip())
              for fmt in ('%m/%d/%Y %I:%M %p', '%m/%d/%Y %H:%M', '%m/%d/%Y'):
                  try: return datetime.strptime(cleaned, fmt).isoformat()
                  except: continue
              return None

          def parse_aitem_blocks(html, county_sub):
              items = []
              starts = [m.start() for m in re.finditer(r'<div\s+id="AITEM_\d+"', html)]
              if not starts:
                  return items
              starts.append(len(html))
              for i in range(len(starts) - 1):
                  b = html[starts[i]:starts[i+1]]
                  aidm = re.search(r'aid="(\d+)"', b)
                  if not aidm:
                      continue
                  aid = aidm.group(1)
                  sm = re.search(r'ASTAT_MSGA[^>]*>Auction Starts</div>\s*<div[^>]+>\s*([^<]+?)\s*</div>', b)
                  starts_raw = sm.group(1).strip() if sm else None
                  rows = re.findall(
                      r'<td[^>]*class="AD_LBL"[^>]*>(.*?)</td>\s*<td[^>]*class="AD_DTA[^"]*"[^>]*>(.*?)</td>',
                      b, re.DOTALL)
                  data = {}
                  addr_lines = []
                  last_addr = False
                  for lbl_h, dta_h in rows:
                      lbl = re.sub(r'<[^>]+>', '', lbl_h).strip().rstrip(':').lower()
                      if 'property address' in lbl:
                          t = strip_html(dta_h)
                          if t: addr_lines.append(t)
                          last_addr = True; continue
                      if last_addr and not lbl:
                          t = strip_html(dta_h)
                          if t: addr_lines.append(t)
                          continue
                      last_addr = False
                      if lbl: data[lbl] = dta_h
                  items.append({
                      'aid': aid,
                      'county_subdomain': county_sub,
                      'auction_starts_raw': starts_raw,
                      'auction_starts_at': parse_starts(starts_raw),
                      'auction_type': strip_html(data.get('auction type')),
                      'case_number': strip_html(data.get('case #')),
                      'case_clerk_url': extract_href(data.get('case #', '')),
                      'judgment_amount': to_float(data.get('final judgment amount')),
                      'parcel_id': strip_html(data.get('parcel id')),
                      'parcel_assessor_url': extract_href(data.get('parcel id', '')),
                      'property_address': ', '.join(addr_lines) if addr_lines else None,
                      'assessed_value': to_float(data.get('assessed value')),
                      'plaintiff_max_bid': to_float(data.get('plaintiff max bid')),
                  })
              return items

          # ── 3. Scrape: try direct httpx first, fall back to Firecrawl ──────────
          # Direct httpx uses ColdFusion form POST (same pattern as diagnose workflow).
          # Firecrawl is the fallback for IP-blocked sites (needs residential proxies).
          # If Firecrawl returns 402 (out of credits), direct httpx is the only path.
          FH = {"Authorization": f"Bearer {FC}", "Content-Type": "application/json"}
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"

          def extract_form_fields(html):
              """Extract all input fields from the first form; return {name: value} dict."""
              form_m = re.search(r'<form[^>]*>(.*?)</form>', html, re.DOTALL|re.IGNORECASE)
              if not form_m:
                  return {}, None
              form_html = form_m.group(0)
              action_m = re.search(r'action=["\']([^"\']*)["\']', form_html, re.IGNORECASE)
              form_action = action_m.group(1) if action_m else '/index.cfm'
              if not form_action.startswith('http'):
                  form_action = HOST + '/' + form_action.lstrip('/')
              fields = {}
              for tag in re.findall(r'<input[^>]+>', form_html, re.IGNORECASE):
                  name_m = re.search(r'\bname=["\']([^"\']+)["\']', tag, re.IGNORECASE)
                  val_m  = re.search(r'\bvalue=["\']([^"\']*)["\']', tag, re.IGNORECASE)
                  if name_m:
                      fields[name_m.group(1)] = val_m.group(1) if val_m else ''
              return fields, form_action

          def httpx_scrape_preview(auction_date_iso, is_first=False):
              """Direct ColdFusion form login + PREVIEW fetch. Returns (status, html)."""
              if not EMAIL or not PW:
                  return 0, ''
              d = datetime.strptime(auction_date_iso, '%Y-%m-%d')
              date_mdy = d.strftime('%m/%d/%Y')
              preview_url = (f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW"
                             f"&AUCTIONDATE={date_mdy.replace('/', '%2F')}")
              try:
                  client = httpx.Client(
                      follow_redirects=True, timeout=30.0,
                      headers={'User-Agent': UA})
                  r0 = client.get(f"{HOST}/index.cfm")
                  if r0.status_code != 200:
                      print(f"  httpx: login page HTTP {r0.status_code} — site may block datacenter IPs")
                      return r0.status_code, ''
                  title_m = re.search(r'<title>([^<]+)</title>', r0.text, re.IGNORECASE)
                  fields, form_action = extract_form_fields(r0.text)
                  if is_first:
                      print(f"  httpx: login page title={title_m.group(1) if title_m else 'N/A'}")
                      safe = {k: v for k, v in fields.items() if 'pass' not in k.lower()}
                      print(f"  httpx: form action={form_action}, fields={list(safe.keys())}")
                  # Splash page detection: no LogName field → follow links/redirects to login
                  if not fields or 'LogName' not in fields:
                      # Look for a link to the auction/login area
                      link_m = re.search(
                          r'href=["\']([^"\']*(?:zaction=AUCTION|LogOn|Login|index\.cfm)[^"\']*)["\']',
                          r0.text, re.IGNORECASE)
                      if link_m:
                          next_url = link_m.group(1)
                          if not next_url.startswith('http'):
                              next_url = HOST + '/' + next_url.lstrip('/')
                          print(f"  httpx: splash page detected, following link to {next_url}")
                          r0 = client.get(next_url)
                          fields, form_action = extract_form_fields(r0.text)
                          if is_first:
                              t2 = re.search(r'<title>([^<]+)</title>', r0.text, re.IGNORECASE)
                              safe2 = {k: v for k, v in fields.items() if 'pass' not in k.lower()}
                              print(f"  httpx: after follow title={t2.group(1) if t2 else 'N/A'}, fields={list(safe2.keys())}")
                      else:
                          # Try known RealForeclose login URL pattern directly
                          login_url = f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE=06/24/2026"
                          print(f"  httpx: no link found, trying known login URL")
                          # Just print the first form we find on the AUCTION CALENDAR
                          r_cal = client.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=CALENDAR")
                          fields, form_action = extract_form_fields(r_cal.text)
                          if is_first:
                              t_cal = re.search(r'<title>([^<]+)</title>', r_cal.text, re.IGNORECASE)
                              safe_c = {k: v for k, v in fields.items() if 'pass' not in k.lower()}
                              print(f"  httpx: calendar title={t_cal.group(1) if t_cal else 'N/A'}, fields={list(safe_c.keys())}")
                          if not fields or 'LogName' not in fields:
                              print("  httpx: cannot find login form — aborting direct approach")
                              return 0, ''
                  form_data = {**fields, 'LogName': EMAIL, 'LogPass': PW}
                  r1 = client.post(form_action, data=form_data)
                  if r1.status_code not in (200, 302):
                      print(f"  httpx: login POST HTTP {r1.status_code}")
                      return r1.status_code, ''
                  # Check: if LogName input still present → login failed
                  if 'id="LogName"' in r1.text or 'name="LogName"' in r1.text:
                      print("  httpx: login failed — LogName field still in response")
                      if is_first:
                          print(f"  httpx: response snippet: {r1.text[500:1000]!r}")
                      return 401, ''
                  if is_first:
                      title_m2 = re.search(r'<title>([^<]+)</title>', r1.text, re.IGNORECASE)
                      print(f"  httpx: post-login title={title_m2.group(1) if title_m2 else 'N/A'}")
                  r2 = client.get(preview_url)
                  print(f"  httpx: PREVIEW HTTP {r2.status_code}, len={len(r2.text)}")
                  if is_first:
                      title_m3 = re.search(r'<title>([^<]+)</title>', r2.text, re.IGNORECASE)
                      print(f"  httpx: PREVIEW title={title_m3.group(1) if title_m3 else 'N/A'}")
                  return r2.status_code, r2.text
              except Exception as e:
                  print(f"  httpx error: {e}")
                  return 0, ''

          _httpx_first = True

          def fc_scrape_preview(auction_date_iso):
              d = datetime.strptime(auction_date_iso, '%Y-%m-%d')
              date_mdy = d.strftime('%m/%d/%Y')
              preview_path = f"/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE={date_mdy.replace('/', '%2F')}"
              preview_url  = f"{HOST}{preview_path}"

              if not FC:
                  print("  WARNING: FIRECRAWL_API_KEY not set")
                  return 0, ''
              if not EMAIL or not PW:
                  print("  WARNING: no credentials — unauthenticated (AITEM blocks will be empty)")

              def js_str(s): return s.replace('\\', '\\\\').replace("'", "\\'")

              # Duval has a splash/disclaimer page at /index.cfm that must be clicked through
              # before the login form appears. We click any visible submit button, wait, then
              # look for and fill the LogName/LogPass fields.
              payload = {
                  "url": f"{HOST}/index.cfm",
                  "formats": ["html"],
                  "actions": [
                      {"type": "wait", "milliseconds": 2000},
                      # Click through splash page (try common selectors for "Enter"/"I Agree")
                      {"type": "executeJavascript", "script":
                          "(document.querySelector('input[type=\"submit\"]') || "
                          " document.querySelector('button[type=\"submit\"]') || "
                          " document.querySelector('#btnEnter') || "
                          " document.querySelector('a.enterBtn') || "
                          " document.querySelector('.enterBtn') || {click:()=>{}}).click()"},
                      {"type": "wait", "milliseconds": 3000},
                      # Now fill login credentials (may now be on login page)
                      {"type": "executeJavascript", "script":
                          f"document.getElementById('LogName') && (document.getElementById('LogName').value='{js_str(EMAIL)}')"},
                      {"type": "executeJavascript", "script":
                          f"document.getElementById('LogPass') && (document.getElementById('LogPass').value='{js_str(PW)}')"},
                      {"type": "click", "selector": "#LogButton"},
                      {"type": "wait", "milliseconds": 5000},
                      # Navigate to preview page via JS
                      {"type": "executeJavascript", "script":
                          f"window.location.href='{preview_url}'"},
                      {"type": "wait", "milliseconds": 12000},
                  ],
                  "timeout": 120000,
              }
              try:
                  resp = httpx.post('https://api.firecrawl.dev/v1/scrape',
                                    headers=FH, json=payload, timeout=120.0)
                  if resp.status_code != 200:
                      print(f"  Firecrawl HTTP {resp.status_code}: {resp.text[:400]}")
                      return resp.status_code, ''
                  j = resp.json()
                  html = (j.get('data') or {}).get('html', '')
                  return 200, html
              except Exception as e:
                  print(f"  Firecrawl error: {e}")
                  return 0, ''

          def scrape_preview(auction_date_iso):
              """Try direct httpx first; fall back to Firecrawl if httpx is blocked (403)."""
              global _httpx_first
              print("  → trying direct httpx")
              sc, html = httpx_scrape_preview(auction_date_iso, is_first=_httpx_first)
              _httpx_first = False
              if sc == 200 and html:
                  return sc, html
              if sc == 403:
                  print("  → httpx blocked (403 — datacenter IP), falling back to Firecrawl")
              elif sc == 401:
                  print("  → httpx login failed, falling back to Firecrawl")
              elif sc != 200:
                  print(f"  → httpx returned {sc}, falling back to Firecrawl")
              print("  → trying Firecrawl")
              return fc_scrape_preview(auction_date_iso)

          # ── 4. Per-date loop ──────────────────────────────────────────────────
          total_aids = 0
          total_inserted = 0

          for auction_date in dates:
              print(f"\n─── {auction_date} ───────────────────────────────────")
              d_obj = datetime.strptime(auction_date, '%Y-%m-%d')
              date_mdy = d_obj.strftime('%m/%d/%Y')

              cr_row = {
                  'mca_id': None, 'county_slug': 'duval', 'case_number': None,
                  'fetch_url': f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE={date_mdy}",
                  'system_type': 'realforeclose',
                  'backend': f'duval_drain_fc_v1_{RUN}',
                  'parse_state': 'fetching',
              }
              cr_id = None
              try:
                  ins = sb_post("court_responses_raw", cr_row, HR)
                  if ins.status_code in (200, 201):
                      body = ins.json()
                      if body: cr_id = body[0]['id']
              except Exception as e:
                  print(f"  court_responses_raw insert error: {e}")

              status_code, html = scrape_preview(auction_date)
              print(f"  HTTP {status_code}, html_len={len(html)}")

              aids = parse_aitem_blocks(html, 'duval') if html else []
              print(f"  AITEM blocks parsed: {len(aids)}")

              if html and not aids:
                  if '<input' in html and 'LogName' in html and '<form' in html:
                      print("  NOTE: Login form detected — authentication may have failed")
                      print(f"  HTML snippet: {html[:600]!r}")
                  elif 'Log In' in html:
                      print("  NOTE: 'Log In' in HTML (likely nav bar) — login may be fine")
                      print(f"  HTML snippet: {html[:600]!r}")
                  elif 'No auctions' in html or 'no auction' in html.lower():
                      print("  No auctions scheduled for this date")
                  else:
                      print(f"  HTML snippet: {html[:500]!r}")

              total_aids += len(aids)

              if cr_id:
                  patch = {
                      'status_code': status_code,
                      'response_body': html[:500000] if html else '',
                      'parse_state': 'ok' if aids else ('parsed_empty' if html else 'failed'),
                  }
                  try:
                      httpx.patch(f"{SB}/rest/v1/court_responses_raw?id=eq.{cr_id}",
                                  headers=H, json=patch, timeout=15.0)
                  except Exception: pass

              if aids:
                  payload = [{
                      'aid': a['aid'], 'county_slug': 'duval',
                      'auction_type': a['auction_type'],
                      'case_number': a['case_number'],
                      'case_clerk_url': a['case_clerk_url'],
                      'judgment_amount': a['judgment_amount'],
                      'parcel_id': a['parcel_id'],
                      'parcel_assessor_url': a['parcel_assessor_url'],
                      'property_address': a['property_address'],
                      'assessed_value': a['assessed_value'],
                      'plaintiff_max_bid': a['plaintiff_max_bid'],
                      'auction_starts_at': a['auction_starts_at'],
                      'auction_starts_raw': a['auction_starts_raw'],
                      'county_subdomain': a['county_subdomain'],
                      'source_response_id': cr_id,
                      'source_run_id': int(RUN) if RUN and RUN.isdigit() else None,
                  } for a in aids]
                  try:
                      ins2 = httpx.post(
                          f"{SB}/rest/v1/realforeclose_aids?on_conflict=aid",
                          headers=HU, json=payload, timeout=30.0)
                      if ins2.status_code in (200, 201, 204):
                          total_inserted += len(payload)
                          print(f"  → inserted/upserted {len(payload)} aids")
                      else:
                          print(f"  aids INSERT FAILED: HTTP {ins2.status_code}: {ins2.text[:300]}")
                  except Exception as e:
                      print(f"  aids INSERT EXCEPTION: {e}")

              time.sleep(1.5)

          # ── 5. Patch MCA from aids (p_county_slug='duval') ───────────────────
          if total_inserted > 0:
              try:
                  patch_r = httpx.post(
                      f"{SB}/rest/v1/rpc/realforeclose_aids_to_mca_patch",
                      headers=H,
                      json={'p_dispatch_id': None, 'p_county_slug': 'duval'},
                      timeout=60.0)
                  print(f"\nrealforeclose_aids_to_mca_patch(duval): HTTP {patch_r.status_code}")
                  if patch_r.status_code == 200:
                      print(f"  rows updated: {patch_r.text}")
              except Exception as e:
                  print(f"realforeclose_aids_to_mca_patch error: {e}")

          print(f"\nDRAIN DONE: dates={len(dates)} aids_parsed={total_aids} aids_inserted={total_inserted}")

          if total_aids > 0 and total_inserted == 0:
              print("SILENT FAILURE: aids parsed but 0 inserted — check realforeclose_aids schema")
              import sys; sys.exit(1)
          PYEOF
