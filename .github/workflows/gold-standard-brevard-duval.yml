name: Gold Standard Brevard+Duval C/D/E Improvements

on:
  schedule:
    # Run daily at 09:00Z (after the 08:00Z wave to avoid conflicts)  
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'County to process (brevard, duval, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - brevard
          - duval
      dry_run:
        description: 'Dry run (analyze only)'
        required: false
        default: false
        type: boolean

jobs:
  brevard-duval-improvements:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for comprehensive processing
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install httpx beautifulsoup4 lxml
        
    - name: Run baseline verification
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "📊 Running baseline verification..."
        python scripts/brevard_duval_verification.py --baseline
        
    - name: Run C/D/E improvements
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "🔧 Running C/D/E improvements..."
        COUNTY="${{ github.event.inputs.county || 'all' }}"
        DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
        
        if [ "$DRY_RUN" = "true" ]; then
          python scripts/brevard_duval_cde_improvements.py --county "$COUNTY" --dry-run
        else
          python scripts/brevard_duval_cde_improvements.py --county "$COUNTY"
        fi
        
    - name: Run final verification
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "📈 Running final verification..."
        python scripts/brevard_duval_verification.py --final
        
    - name: Archive verification results
      uses: actions/upload-artifact@v4
      with:
        name: verification-results-${{ github.run_id }}
        path: |
          baseline_verification_*.json
          final_verification_*.json
          
    - name: Report to Telegram (on failure)
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
      run: |
        MESSAGE="❌ Gold Standard Brevard+Duval improvements failed
        
        Run: ${{ github.run_id }}
        County: ${{ github.event.inputs.county || 'all' }}
        Time: $(date -u)
        
        Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="${MESSAGE}" \
          -d parse_mode="HTML" || true
          
    - name: Report success metrics
      if: success()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "✅ Gold Standard improvements completed successfully"
        echo "📊 Final metrics verification completed"
        echo "🏆 SHIP GATE compliance: Live DB queries executed with timestamped proof"