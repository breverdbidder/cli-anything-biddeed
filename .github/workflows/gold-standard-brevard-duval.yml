name: Gold Standard Brevard & Duval Pipeline

on:
  schedule:
    # Run every 4 hours during business hours to maintain freshness
    - cron: '0 8,12,16,20 * * *'  # 8am, 12pm, 4pm, 8pm UTC
  workflow_dispatch:
    inputs:
      target_county:
        description: 'County to process'
        required: true
        default: 'both'
        type: choice
        options:
          - brevard
          - duval
          - both
      operation:
        description: 'Operation to perform'
        required: true
        default: 'full_pipeline'
        type: choice
        options:
          - full_pipeline
          - j_generator_only
          - parity_only
          - verify_only
      batch_size:
        description: 'Batch size for processing'
        required: false
        default: '100'
        type: string

jobs:
  brevard-improvements:
    if: github.event.inputs.target_county == 'brevard' || github.event.inputs.target_county == 'both' || github.event.schedule
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Run Brevard C/D Parity Improvement
      if: github.event.inputs.operation != 'j_generator_only'
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🎯 Brevard Sprint Priority 1: C/D Parity Improvement"
        python3 scripts/cd_parity_brevard_clerk.py \
          --county brevard \
          --batch-size ${{ github.event.inputs.batch_size || '500' }}
        
        echo "📊 Auditing results..."
        python3 scripts/cd_parity_brevard_clerk.py \
          --county brevard \
          --audit-only
    
    - name: Run Brevard J Generator
      if: github.event.inputs.operation != 'parity_only'
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🎯 Brevard Sprint Priority 2: J Generator"
        python3 scripts/j_generator_duval_brevard.py \
          brevard \
          --batch-size ${{ github.event.inputs.batch_size || '100' }}
    
    - name: Verify Brevard Metrics
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🔍 Verifying Brevard Letter Improvements"
        python3 -c "
        import os
        import requests
        import json
        
        SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
        SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_KEY')
        
        if SUPABASE_KEY:
            headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': f'Bearer {SUPABASE_KEY}',
                'Content-Type': 'application/json'
            }
            
            try:
                response = requests.post(
                    f'{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county',
                    headers=headers,
                    json={'county_slug_arg': 'brevard'},
                    timeout=60
                )
                
                if response.status_code == 200:
                    results = response.json()
                    print('✅ Brevard Fresh Metrics:')
                    for result in results:
                        letter = result.get('letter', '?')
                        metric = result.get('metric')
                        status = '✅' if result.get('pass') else '❌'
                        print(f'  {letter}: {status} {metric}')
                else:
                    print(f'❌ Verification failed: {response.status_code}')
            except Exception as e:
                print(f'❌ Verification error: {e}')
        else:
            print('⚠️ No database credentials - skipping verification')
        "

  duval-improvements:
    if: github.event.inputs.target_county == 'duval' || github.event.inputs.target_county == 'both' || github.event.schedule
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Apply Duval Infrastructure Migration
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🏗️ Duval Sprint Priority 1: Infrastructure Setup"
        python3 apply_migration.py
    
    - name: Run Duval J Generator
      if: github.event.inputs.operation != 'parity_only'
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🎯 Duval J Generator (Infrastructure Fix)"
        python3 scripts/j_generator_duval_brevard.py \
          duval \
          --batch-size ${{ github.event.inputs.batch_size || '100' }}
    
    - name: Verify Duval Metrics
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🔍 Verifying Duval Letter Improvements"
        python3 -c "
        import os
        import requests
        
        SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
        SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_KEY')
        
        if SUPABASE_KEY:
            headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': f'Bearer {SUPABASE_KEY}',
                'Content-Type': 'application/json'
            }
            
            try:
                response = requests.post(
                    f'{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county',
                    headers=headers,
                    json={'county_slug_arg': 'duval'},
                    timeout=60
                )
                
                if response.status_code == 200:
                    results = response.json()
                    print('✅ Duval Fresh Metrics:')
                    for result in results:
                        letter = result.get('letter', '?')
                        metric = result.get('metric')
                        status = '✅' if result.get('pass') else '❌'
                        print(f'  {letter}: {status} {metric}')
                        
                    # Check J letter specifically
                    j_result = next((r for r in results if r.get('letter') == 'J'), None)
                    if j_result:
                        j_metric = j_result.get('metric', 0)
                        print(f'\n🎯 Duval J Letter: {j_metric}% (expected improvement from 0.0%)')
                else:
                    print(f'❌ Verification failed: {response.status_code}')
            except Exception as e:
                print(f'❌ Verification error: {e}')
        else:
            print('⚠️ No database credentials - skipping verification')
        "

  gold-standard-certification-check:
    needs: [brevard-improvements, duval-improvements]
    if: always() && (github.event.inputs.operation == 'full_pipeline' || github.event.schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Check Certification Status
      env:
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      run: |
        echo "🏆 Checking Gold Standard Certification Status"
        python3 -c "
        import os
        import requests
        
        SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
        SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_KEY')
        
        if SUPABASE_KEY:
            headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': f'Bearer {SUPABASE_KEY}',
                'Content-Type': 'application/json'
            }
            
            for county in ['brevard', 'duval']:
                try:
                    # Get fresh evaluation
                    response = requests.post(
                        f'{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county',
                        headers=headers,
                        json={'county_slug_arg': county},
                        timeout=60
                    )
                    
                    if response.status_code == 200:
                        results = response.json()
                        pass_count = sum(1 for r in results if r.get('pass', False))
                        total_letters = len(results)
                        
                        print(f'\n📊 {county.upper()} FINAL STATUS: {pass_count}/{total_letters}')
                        
                        if pass_count >= 10:
                            print(f'🏆 {county.upper()} ACHIEVED GOLD STANDARD CERTIFICATION!')
                        elif pass_count >= 8:
                            print(f'🥈 {county.upper()} nearing certification ({pass_count}/10)')
                        else:
                            print(f'🔧 {county.upper()} needs more work ({pass_count}/10)')
                            
                        # Show failing letters for next session
                        failing = [r.get('letter') for r in results if not r.get('pass', False)]
                        if failing:
                            print(f'   Failing: {', '.join(failing)}')
                        
                except Exception as e:
                    print(f'❌ Error checking {county}: {e}')
        else:
            print('⚠️ No database credentials - skipping certification check')
        "
    
    - name: Update Session Log
      if: always()
      run: |
        echo "📝 Session completed: $(date)"
        echo "🎯 Target counties: brevard, duval"
        echo "⚡ Operation: ${{ github.event.inputs.operation || 'scheduled_pipeline' }}"
        echo "🔄 Next scheduled run: $(date -d '+4 hours')"