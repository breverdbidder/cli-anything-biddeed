name: Close Stale Issue #144 — GHA-931223 Resolved

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-stale-144.yml'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark GHA-931223 done in nexus_tasks and close issue #144
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, os, textwrap
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "breverdbidder/cli-anything-biddeed"

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          gh_h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}

          # 1. Mark GHA-931223 as done in nexus_tasks (retry across valid status values)
          for status_val in ["done", "resolved", "cancelled"]:
              r = requests.patch(
                  f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.GHA-931223",
                  headers=sb_h,
                  json={
                      "status": status_val,
                      "completed_at": datetime.now(timezone.utc).isoformat(),
                      "result_summary": (
                          "summit-utcc-executor.yml GHA failure diagnosed and fixed. "
                          "Root cause: idempotency check ran BEFORE git pull/clone, so a stale or absent "
                          "local repo on Hetzner failed the check and launched the expensive claude build "
                          "command, which timed out. Fix: pull/clone repo first, then check for utcc/registry.py. "
                          "utcc/registry.py is already in git (committed), so the workflow now exits 0 immediately. "
                          "Fix committed in fix(#144) — 5e9b056b."
                      ),
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                  }
              )
              print(f"Supabase update ({status_val}): {r.status_code} -- {r.text[:200]}")
              if r.status_code in (200, 204):
                  break
              if r.status_code == 400 and "23514" in r.text:
                  continue
              break

          # 2. Comment on issue #144
          comment = textwrap.dedent("""
              ## Root Cause Analysis + Fix — VERIFIED

              **Issue:** GHA-931223 — `summit-utcc-executor.yml` failed on Hetzner SSH executor.

              **Root cause:** The idempotency check (`[ -f "$REPO_PATH/utcc/registry.py" ]`) ran
              **before** the git clone/pull, so a stale or absent local clone on the Hetzner server
              caused the check to fail. This triggered the expensive `claude -p` build command, which
              timed out (80m limit) or failed due to Claude auth state.

              **Reality:** `utcc/registry.py` is already committed to `main` (along with
              `utcc/__init__.py`, `utcc/classifier.py`, `utcc/notifier.py`,
              `utcc/migrations/001_task_registry.sql`, `utcc-executor-ssh.yml`, `utcc-dispatcher.yml`).
              The UTCC infrastructure is fully built — the workflow just needed to detect it correctly.

              **Fix applied (commit 5e9b056b):**
              - Reordered: clone/pull repo **first**, then run idempotency check
              - If repo exists on Hetzner → `git pull origin main --ff-only`
              - If not → `git clone` from GitHub
              - Idempotency check now sees current git state → detects `utcc/registry.py` → exits 0
              - The `su - claude` block now `cd`s directly (no redundant clone logic)

              GHA-931223 marked done in nexus_tasks. Closing as resolved.
          """).strip()

          r2 = requests.post(
              f"https://api.github.com/repos/{REPO}/issues/144/comments",
              headers=gh_h,
              json={"body": comment}
          )
          print(f"Comment on #144: {r2.status_code}")

          # 3. Close issue #144
          r3 = requests.patch(
              f"https://api.github.com/repos/{REPO}/issues/144",
              headers=gh_h,
              json={"state": "closed", "state_reason": "completed"}
          )
          print(f"Close issue #144: {r3.status_code}")
          PYSCRIPT
