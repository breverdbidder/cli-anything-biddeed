name: "SHARD-8: Brevard I — AcclaimWeb 45-Case Retry"
# Retries AcclaimWeb Lis-Pendens -> GIS parcel linkage for the 45 clerk_brevard
# cases that were unresolved after the 3rd firing (dispatch 09f985fc, Jul 30).
#
# 3rd firing residual:
#   ~25 cases: no parseable LT/BLK/PB/PG in legal description (condo/metes-and-bounds)
#   ~12-20 cases: transient AcclaimWeb HTTP 521 outage (may now be retryable)
#
# This script adds UNIT/CONDO pattern matching and retries the HTTP 521 batch.
# Each new resolution writes parcel_id + property_address + lat/lon + assessed_value
# to multi_county_auctions, advancing both letter I (card_complete) and letter E
# (parcel_linked).
#
# Hard rules (from scrape-brevard-acclaim-ct.yml):
#   - Single AcclaimWeb session, 2.5s throttle, never parallelize
#   - Do NOT fabricate addresses for vacant land
#   - Per-row PATCH only (bulk upsert NOT NULL constraint breaks this table)
#
# dispatch_id: c6b5fdd6-b4a0-4da7-aa46-f104f222ac7d (shard-8 session)

on:
  workflow_dispatch: {}

concurrency:
  group: shard8-brevard-acclaim-45
  cancel-in-progress: false

jobs:
  retry:
    name: "Brevard AcclaimWeb 45-Case Retry"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet httpx

      - name: Run AcclaimWeb 45-case retry
        run: |
          set -euo pipefail
          python3 scripts/brevard_acclaim_45_retry.py 2>&1 | tee /tmp/acclaim_retry.log

      - name: Verify brevard I metric after retry
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, urllib.request, os
          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          if not token:
              print("No SUPABASE_ACCESS_TOKEN — skipping Management API verify")
              exit(0)
          ref = "mocerqjnksmhcjzxrewo"
          query = "SET statement_timeout = 0; SELECT public.pencil_dod_evaluate_county('brevard')"
          body = json.dumps({"query": query}).encode()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/query",
              data=body, method="POST"
          )
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Content-Type", "application/json")
          with urllib.request.urlopen(req, timeout=60) as resp:
              result = json.loads(resp.read())
          print("=== pencil_dod_evaluate_county('brevard') ===")
          print(json.dumps(result, indent=2, default=str))
          EOF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Post summary
        if: always()
        run: |
          echo "## SHARD-8 Brevard AcclaimWeb 45-Case Retry" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 /tmp/acclaim_retry.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
