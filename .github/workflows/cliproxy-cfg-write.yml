name: cliproxy cfg write
on:
  workflow_dispatch: {}
jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: write gemini key
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SVC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          SB_URL="https://mocerqjnksmhcjzxrewo.supabase.co"
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          KEY=$(curl -s -X POST "$SB_URL/rest/v1/rpc/get_router_gemini_key" -H "apikey: $SVC" -H "Authorization: Bearer $SVC" -H "Content-Type: application/json" -d '{}' | tr -d '"')
          if [ ${#KEY} -lt 20 ]; then echo "ERR key fetch failed len=${#KEY}"; exit 1; fi
          echo "key ok prefix ${KEY:0:6} len ${#KEY}"
          echo "" | base64 -d > /tmp/remote.sh
          $SSH "GKEY='$KEY' bash -s" < /tmp/remote.sh
          echo "=== verify gemini route (alias gemini-flash) ==="
          $SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: dummy' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"reply only ROUTE_OK\"}]}' -m 40 http://127.0.0.1:8317/v1/messages" | head -c 800
          echo
          echo "=== done ==="
