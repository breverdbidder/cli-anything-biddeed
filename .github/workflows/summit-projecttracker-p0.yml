name: "Summit: ProjectTracker P0 — Claude Code Auto Session"

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Max session minutes'
        required: false
        default: '45'
      dry_run:
        description: 'Dry run'
        required: false
        type: boolean
        default: false

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  summit:
    name: "⛰️ Summit: ProjectTracker P0"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "1️⃣ Preflight"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            [ -d "${{ env.REPO_PATH }}/.git" ] || { cd /opt/biddeed; git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git; }
            cd ${{ env.REPO_PATH }} && git fetch origin main && git reset --hard origin/main
            echo "📦 $(git log --oneline -1)"
            command -v claude &>/dev/null || npm install -g @anthropic-ai/claude-code
            test -f projecttracker/agent.py && echo "✅ agent.py"
            test -f projecttracker/CLAUDE.md && echo "✅ CLAUDE.md"
            python3 -c "import httpx" || pip install httpx --break-system-packages
            echo "✅ Preflight complete"

      - name: "2️⃣ Upload prompt"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            test -f projecttracker/prompts/summit-p0.md && echo "✅ Prompt in repo"
            cp projecttracker/prompts/summit-p0.md /opt/biddeed/projecttracker-p0-prompt.md

      - name: "3️⃣ Execute Claude Code"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: ${{ github.event.inputs.max_minutes || '45' }}m
          script: |
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            cd ${{ env.REPO_PATH }}
            git config user.email "claude@biddeed.ai"
            git config user.name "Claude Code (ProjectTracker P0)"
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git

            PROMPT_FILE=/opt/biddeed/projecttracker-p0-prompt.md
            LOG="projecttracker/eval/summit_p0_$(date +%Y%m%d_%H%M%S).log"
            mkdir -p projecttracker/eval projecttracker/eval_outputs

            echo "⛰️ Summit: ProjectTracker P0 | $(date)"
            IS_SANDBOX=1 claude -p "$(cat $PROMPT_FILE)" --dangerously-skip-permissions 2>&1 | tee "$LOG" || true
            echo "⏰ Done: $(date)"

            git add -A
            git diff --cached --quiet || {
              git commit -m "summit(projecttracker): P0 session complete $(date +%Y%m%d_%H%M%S)"
              git push origin main
            } || true
            echo "📊 Commits: $(git log --oneline --since='1 hour ago' --grep='projecttracker' | wc -l)"

      - name: "4️⃣ Verify"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"

            python3 -m projecttracker.agent report --project PRJ-TEST01 --budget 85000 --json 2>/dev/null \
              | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            print(f'✅ Health: {d.get(\"project_health_score\",\"?\")}/100 ({d.get(\"health_label\")})')
            print(f'   Budget: {d.get(\"budget\",{}).get(\"budget_health\")} | CPI: {d.get(\"budget\",{}).get(\"cpi\")}')
            print(f'   Actions: {d.get(\"action_count\")} | Risks: {d.get(\"risk_count\")}')
            " 2>&1 || echo "❌ JSON broken"

            echo "=== Commits ==="
            git log --oneline --since="2 hours ago" --grep="projecttracker" | head -10

      - name: "5️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            cd ${{ env.REPO_PATH }}
            COMMITS=$(git log --oneline --since="2 hours ago" --grep="projecttracker" | wc -l)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "parse_mode=HTML" \
              -d "text=$( [ '${{ job.status }}' = 'success' ] && echo '✅' || echo '❌' ) <b>Summit: ProjectTracker P0</b>
            Status: ${{ job.status }}
            Commits: ${COMMITS}
            Server: Hetzner" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOFSUM
          ## ⛰️ Summit: ProjectTracker P0
          **Status:** ${{ job.status }}
          ### Expected Commits
          1. \`feat(projecttracker): Supabase tables — 5 project tracking tables\`
          2. \`feat(projecttracker): --save persistence to Supabase\`
          3. \`feat(projecttracker): cross-agent integration with forecaster + sitemanager\`
          4. \`feat(projecttracker): Telegram alerts + smoke test\`
          EOFSUM
