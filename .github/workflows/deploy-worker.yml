name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - src/worker.js
      - wrangler.toml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Palette gate BEFORE the deploy. biddeed-web runs scripts/palette-gate.mjs
      # on every PR and again inside its production deploy, so an off-canon colour
      # cannot reach /, /radar or /support. This repo had no equivalent, so on
      # 2026-09-06 src/worker.js was converted to a retired palette and deployed
      # with nothing failing -- leaving biddeed.ai two-toned: canon blue on the
      # gated repo's routes, cream/terracotta on /chat, /counties, /county/*,
      # /blog, /deal/*, /reels. The missing referee WAS the bug. Same canon list
      # as biddeed-web's gate; a palette change means changing both repos in the
      # same reviewed change.
      - name: Palette gate (src/worker.js may only carry the canon palette)
        run: python3 scripts/ui-audit/palette_gate_worker.py src/worker.js

      - name: Deploy worker
        run: npx wrangler deploy --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # GTM-7 (#20056): /r/:code must never 404 a real click. 20 sequential
      # hits on 3 known-live codes, 100% must be 302 -> /deal/... A single
      # miss fails this deploy (gate, not a warning) -- this is the class of
      # check that would have caught the DB-blip 404 this issue was filed
      # against.
      - name: Smoke test — /r/:code short-link redirects (GTM-7 #20056)
        run: |
          set -euo pipefail
          codes=(F5oeMD 1BrNFC D7qXFD)
          fail=0
          for code in "${codes[@]}"; do
            hits=0
            for i in $(seq 1 20); do
              resp=$(curl -s -D - -o /dev/null --max-time 10 "https://biddeed.ai/r/${code}" || true)
              status=$(printf '%s' "$resp" | head -1 | awk '{print $2}')
              location=$(printf '%s' "$resp" | grep -i '^location:' | tr -d '\r')
              if [ "$status" = "302" ] && echo "$location" | grep -q '/deal/'; then
                hits=$((hits + 1))
              else
                echo "MISS code=${code} attempt=${i} status=${status:-000} location=${location}"
                fail=1
              fi
            done
            echo "code=${code}: ${hits}/20 hit 302 -> /deal/..."
          done
          if [ "$fail" -ne 0 ]; then
            echo "GTM-7 smoke test FAILED — /r/:code did not return 100% 302 -> /deal/..."
            exit 1
          fi
          echo "GTM-7 smoke test passed — 100% 302 across all codes"

      # Brand rename (#20058): "Shapira Max Bid" -> "SIGNAL$ Max Bid" everywhere
      # a human can read it. Home + the 3 deal pages named in #20053's own
      # canonical smoke test must show the new term and must never regress
      # back to the retired one.
      - name: Smoke test — SIGNAL$ Max Bid brand check (#20058)
        run: |
          set -euo pipefail
          pages=(
            "https://biddeed.ai/"
            "https://biddeed.ai/deal/polk/2024ca000341000000"
            "https://biddeed.ai/deal/lee/2026000141"
            "https://biddeed.ai/deal/broward/cace-24-008115"
          )
          fail=0
          for url in "${pages[@]}"; do
            body=$(curl -s --max-time 15 "$url" || true)
            if echo "$body" | grep -qi "Shapira Max Bid"; then
              echo "FAIL: ${url} still contains the retired term 'Shapira Max Bid'"
              fail=1
            fi
            if ! echo "$body" | grep -q 'SIGNAL\$ Max Bid'; then
              echo "FAIL: ${url} does not contain 'SIGNAL\$ Max Bid'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "#20058 brand smoke test FAILED"
            exit 1
          fi
          echo "#20058 brand smoke test passed — SIGNAL\$ Max Bid present, Shapira Max Bid absent on all 4 pages"

      # Label parity (#20087, M9): the reel overlay CTA and the secondary
      # reel-view-link both say "See this deal" -- the retired "View property"
      # label must never reappear on /reels/:code.
      - name: Smoke test — reel CTA label parity (#20087)
        run: |
          set -euo pipefail
          codes=(O7EPH7 F5oeMD)
          fail=0
          for code in "${codes[@]}"; do
            body=$(curl -s --max-time 15 "https://biddeed.ai/reels/${code}" || true)
            seen=$(echo "$body" | grep -o "See this deal" | wc -l) || true
            retired=$(echo "$body" | grep -o "View property" | wc -l) || true
            if [ "$seen" -ne 2 ]; then
              echo "FAIL: /reels/${code} has ${seen}x 'See this deal' (expected 2)"
              fail=1
            fi
            if [ "$retired" -ne 0 ]; then
              echo "FAIL: /reels/${code} still has ${retired}x 'View property'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "#20087 reel CTA label parity smoke test FAILED"
            exit 1
          fi
          echo "#20087 reel CTA label parity smoke test passed — 2x 'See this deal', 0x 'View property'"
