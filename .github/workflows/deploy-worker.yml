name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - src/worker.js
      - wrangler.toml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        run: npx wrangler deploy --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
