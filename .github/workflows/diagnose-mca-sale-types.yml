name: "Diagnose MCA sale_type breakdown"
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
    steps:
      - run: |
          q() { python3 -c "import json,sys; print(json.dumps({'query':sys.argv[1]}))" "$1" > /tmp/q.json
            echo "=== $2 ==="
            curl -sS -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json; echo; }
          q "SELECT sale_type, auction_status, COUNT(*) n FROM multi_county_auctions WHERE county='brevard' AND parity_status='mca_only' GROUP BY sale_type, auction_status ORDER BY n DESC" "mca_only sale_type+status"
          q "SELECT sale_type, COUNT(*) n FROM multi_county_auctions WHERE county='brevard' GROUP BY sale_type ORDER BY n DESC" "all brevard sale_type"
          q "SELECT sale_type, parity_status, COUNT(*) n FROM multi_county_auctions WHERE county='brevard' GROUP BY sale_type, parity_status ORDER BY sale_type, n DESC" "brevard parity by sale_type"
          q "SELECT COUNT(*) n FROM realforeclose_aids WHERE county_slug='brevard'" "brevard aids count"
          q "SELECT COUNT(*) n FROM court_responses_raw WHERE county_slug='brevard' AND system_type='realforeclose'" "brevard court_responses"
