name: CF Purge Cache
on:
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT:  ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # List zones to find everestcapitalusa.com
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=everestcapitalusa.com" \
            -o /tmp/zones.json
          ZONE_ID=$(python3 -c "import json; d=json.load(open('/tmp/zones.json')); r=d.get('result',[]); print(r[0]['id'] if r else '')")
          echo "Zone: $ZONE_ID"
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -d '{"purge_everything":true}' | python3 -m json.tool
          fi
