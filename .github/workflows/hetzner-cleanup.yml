name: Hetzner Disk Cleanup (one-off)
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH cleanup
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== BEFORE ==="
          $SSH "df -h / && echo '---' && du -sh /root/summit-* 2>/dev/null | sort -h | tail -30 && echo '---' && du -sh /root/.cache /root/.npm /var/log /tmp 2>/dev/null"

          echo ""
          echo "=== CLEANUP ==="
          $SSH "cd /root && ls -d summit-* 2>/dev/null | head -50 && echo '---removing---' && rm -rf /root/summit-[0-9]* && rm -rf /root/.cache/* && rm -rf /tmp/* && apt-get clean 2>/dev/null && journalctl --vacuum-time=1d 2>/dev/null && echo 'cleanup done'"

          echo ""
          echo "=== AFTER ==="
          $SSH "df -h / && echo '---' && ls -la /root/.claude/ 2>/dev/null"

