name: "Summit: Consolidate Zoning → Single Source of Truth"
on:
  workflow_dispatch: {}
jobs:
  consolidate:
    name: "Merge zoning_assignments → sample_properties"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client -qq

      - name: Test DB connection
        run: |
          # Try direct host first
          echo "Trying direct connection..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
            -c "SELECT 'connected' as status, current_timestamp;" 2>&1 || true
          
          # Try session pooler  
          echo "Trying session pooler..."
          psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            -c "SELECT 'pooler connected' as status;" 2>&1 || true
          
          # Try transaction pooler
          echo "Trying transaction pooler..."
          psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
            -c "SELECT 'txn pooler connected' as status;" 2>&1 || true

      - name: Run consolidation
        run: |
          # Use whichever connection works
          for CONNSTR in \
            "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"; do
            
            echo "Testing: ${CONNSTR:0:60}..."
            if psql "$CONNSTR" -c "SELECT 1;" > /dev/null 2>&1; then
              echo "✅ Connected!"
              
              echo "=== BEFORE ==="
              psql "$CONNSTR" -c "
                SELECT COUNT(*) as total, COUNT(zone_code) as with_zone,
                  ROUND(COUNT(zone_code)::numeric / COUNT(*) * 100, 1) as pct
                FROM sample_properties;"
              
              echo "=== Adding columns ==="
              psql "$CONNSTR" -c "
                ALTER TABLE sample_properties
                  ADD COLUMN IF NOT EXISTS zone_source TEXT,
                  ADD COLUMN IF NOT EXISTS zone_confidence TEXT,
                  ADD COLUMN IF NOT EXISTS zone_synced_at TIMESTAMPTZ;"
              
              echo "=== Creating ims_permits table ==="
              psql "$CONNSTR" -c "
                CREATE TABLE IF NOT EXISTS ims_permits (
                  id SERIAL PRIMARY KEY, record_number TEXT UNIQUE NOT NULL,
                  permit_type TEXT, permit_subtype TEXT, milestone TEXT,
                  address TEXT, city TEXT DEFAULT 'Palm Bay', county TEXT DEFAULT 'Brevard',
                  applicant TEXT, description TEXT, scraped_at TIMESTAMPTZ DEFAULT now());
                CREATE INDEX IF NOT EXISTS idx_ims_address ON ims_permits(address);
                CREATE INDEX IF NOT EXISTS idx_ims_type ON ims_permits(permit_type);
                CREATE INDEX IF NOT EXISTS idx_ims_milestone ON ims_permits(milestone);"

              echo "=== Merging zone_codes ==="
              psql "$CONNSTR" -c "
                WITH clean_za AS (
                  SELECT DISTINCT ON (parcel_id)
                    parcel_id,
                    CASE
                      WHEN zone_code LIKE '% - %' THEN TRIM(split_part(zone_code, ' - ', 1))
                      WHEN zone_code LIKE '% (%' THEN TRIM(split_part(zone_code, ' (', 1))
                      WHEN length(zone_code) > 20 THEN NULL
                      ELSE TRIM(zone_code)
                    END AS clean_zone,
                    photo_url
                  FROM zoning_assignments
                  WHERE county = 'brevard' AND zone_code IS NOT NULL AND length(zone_code) <= 20
                  ORDER BY parcel_id, zone_updated_at DESC NULLS LAST
                )
                UPDATE sample_properties sp SET
                  zone_code = cza.clean_zone,
                  zone_source = 'gis_conquest',
                  zone_confidence = 'HIGH',
                  zone_synced_at = NOW(),
                  photo_url = COALESCE(sp.photo_url, cza.photo_url)
                FROM clean_za cza
                WHERE sp.parcel_id = cza.parcel_id AND cza.clean_zone IS NOT NULL;"
              
              echo "=== AFTER ==="
              psql "$CONNSTR" -c "
                SELECT COUNT(*) as total, COUNT(zone_code) as with_zone,
                  ROUND(COUNT(zone_code)::numeric / COUNT(*) * 100, 1) as pct,
                  COUNT(zone_source) as with_source
                FROM sample_properties;"
              
              echo "=== BY CITY ==="
              psql "$CONNSTR" -c "
                SELECT TRIM(city) as city, COUNT(*) as total,
                  COUNT(zone_code) as zoned,
                  ROUND(COUNT(zone_code)::numeric / COUNT(*) * 100, 1) as pct
                FROM sample_properties GROUP BY TRIM(city) ORDER BY total DESC LIMIT 25;"
              
              echo "=== ims_permits count ==="
              psql "$CONNSTR" -c "SELECT COUNT(*) FROM ims_permits;"
              
              echo "✅ CONSOLIDATION COMPLETE"
              exit 0
            fi
          done
          echo "❌ All connection methods failed"
          exit 1

      - name: Report to Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🗃️ Zoning consolidation ${{ job.status }}. Check GHA logs for BEFORE/AFTER." > /dev/null
