name: cc diag one
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: raw capture single district
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=40 root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          echo "=== p_1332 bytes: $(wc -c < /home/claude/p_1332.txt 2>/dev/null) ==="
          su - claude -c "timeout 300 claude -p \"\$(cat /home/claude/p_1332.txt)\" --allowedTools WebSearch WebFetch --output-format text" </dev/null > /home/claude/raw_1332.txt 2>&1
          echo "=== exit $? ; raw bytes: $(wc -c < /home/claude/raw_1332.txt) ==="
          echo "=== RAW START ==="
          head -c 2500 /home/claude/raw_1332.txt
          echo ""
          echo "=== RAW END ==="
          REMOTE
