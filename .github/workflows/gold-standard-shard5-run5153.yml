name: "Gold Standard Shard-5 Run-5153: calhoun + taylor fixes"
# Applies fixes for calhoun (I re-fix, G diagnosis) and taylor (C/D promotion, I enrichment).
# dispatch_id: 0e84dad2-f52e-4eea-9126-a234235c3ed6
# WIRING MANDATE: this workflow is the executor for shard5_run5153_calhoun_taylor_fixes.py
# and supabase/migrations/20260719_shard5_calhoun_taylor_i_cd_fix.sql

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/20260719_shard5_calhoun_taylor_i_cd_fix.sql'
      - 'scripts/shard5_run5153_calhoun_taylor_fixes.py'
      - '.github/workflows/gold-standard-shard5-run5153.yml'
    branches:
      - main
      - 'claude/issue-12797*'

jobs:
  apply-fixes:
    name: "Shard-5 Run-5153: calhoun + taylor I/CD fixes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: "Apply migration: 20260719_shard5_calhoun_taylor_i_cd_fix.sql"
        run: |
          set -euo pipefail
          echo "=== Applying 20260719_shard5_calhoun_taylor_i_cd_fix.sql ==="
          python3 -c "
          import json, sys
          sql = open('supabase/migrations/20260719_shard5_calhoun_taylor_i_cd_fix.sql').read()
          print(json.dumps({'query': sql}))
          " > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration OK"

      - name: "Run shard5_run5153_calhoun_taylor_fixes.py"
        run: |
          set -euo pipefail
          python3 scripts/shard5_run5153_calhoun_taylor_fixes.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "Verify: pencil_dod_evaluate_county for all 3 counties"
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }

          rq "volusia evaluation" "SELECT public.pencil_dod_evaluate_county('volusia')"
          rq "calhoun evaluation" "SELECT public.pencil_dod_evaluate_county('calhoun')"
          rq "taylor evaluation"  "SELECT public.pencil_dod_evaluate_county('taylor')"

          rq "calhoun card_complete" \
            "SELECT COUNT(*) AS total, SUM(CASE WHEN property_address IS NOT NULL AND latitude IS NOT NULL AND parcel_id IS NOT NULL AND (assessed_value IS NOT NULL OR market_value IS NOT NULL) THEN 1 ELSE 0 END) AS card_complete FROM multi_county_auctions WHERE county='calhoun'"

          rq "taylor parity" \
            "SELECT parity_status, COUNT(*) AS n FROM multi_county_auctions WHERE county='taylor' GROUP BY parity_status"

          rq "taylor card_complete" \
            "SELECT COUNT(*) AS total, SUM(CASE WHEN property_address IS NOT NULL AND latitude IS NOT NULL AND parcel_id IS NOT NULL AND (assessed_value IS NOT NULL OR market_value IS NOT NULL) THEN 1 ELSE 0 END) AS card_complete FROM multi_county_auctions WHERE county='taylor'"

          rq "calhoun parcel_zones" \
            "SELECT COUNT(*) AS n FROM parcel_zones pz JOIN multi_county_auctions m ON m.parcel_id = pz.parcel_id WHERE m.county = 'calhoun'"

          rq "taylor parcel_zones" \
            "SELECT COUNT(*) AS n FROM parcel_zones pz JOIN multi_county_auctions m ON m.parcel_id = pz.parcel_id WHERE m.county = 'taylor'"

          rq "ultraloop audit rows for this dispatch" \
            "SELECT county_slug, letter, survived, created_at FROM gold_standard_ultraloop_audit WHERE dispatch_id = '0e84dad2-f52e-4eea-9126-a234235c3ed6' ORDER BY county_slug, letter"
