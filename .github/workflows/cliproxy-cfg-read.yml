name: cliproxy cfg read
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: read
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          echo "=== config.yaml (masked) ==="
          $SSH 'docker exec biddeed-cliproxy cat /data/config.yaml' | sed -E 's/(AQ\.[A-Za-z0-9._-]+|AIza[A-Za-z0-9._-]+|sk-[A-Za-z0-9._-]+|eyJ[A-Za-z0-9._-]+|[A-Za-z0-9._-]{30,})/__REDACTED__/g'
          echo "=== END ==="
