name: Dify internal test — SSH to Hetzner, call dify-api via internal docker + nginx host header
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and probe dify internal
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== A: docker network / dify-api internal IP ==="
          $SSH 'docker ps --format "table {{.Names}}\t{{.Ports}}" | grep -E "dify|nginx"'
          $SSH 'docker inspect docker-api-1 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d[0][\"NetworkSettings\"][\"Networks\"],indent=2))" 2>&1 | head -20 || echo "inspect failed"'

          echo
          echo "=== B: nginx config — vhosts and upstreams ==="
          $SSH 'docker exec $(docker ps -q -f name=nginx | head -1) cat /etc/nginx/conf.d/default.conf 2>&1 | head -80 || find /etc/nginx -name "*.conf" -exec cat {} \; 2>&1 | head -80'

          echo
          echo "=== C: direct curl to dify-api container by container IP ==="
          $SSH '
            API_IP=$(docker inspect docker-api-1 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); nets=d[0][\"NetworkSettings\"][\"Networks\"]; print(list(nets.values())[0][\"IPAddress\"])" 2>/dev/null)
            echo "dify-api container IP: $API_IP"
            if [ -n "$API_IP" ]; then
              curl -sS -o /dev/null -w "direct dify-api 5001/health: %{http_code}\n" -m 5 "http://${API_IP}:5001/health"
              curl -sS -o /dev/null -w "direct dify-api 5001/console/api: %{http_code}\n" -m 5 "http://${API_IP}:5001/console/api"
            fi
          '

          echo
          echo "=== D: nginx on port 80 with Host header (chat.zonewise.ai) ==="
          $SSH "curl -sS -o /dev/null -w 'HOST=chat.zonewise.ai  80/: %{http_code}\n' -H 'Host: chat.zonewise.ai' -m 5 http://localhost/"
          $SSH "curl -sS -o /dev/null -w 'HOST=chat.zonewise.ai  443/: %{http_code}\n' -k -H 'Host: chat.zonewise.ai' -m 5 https://localhost/"

          echo
          echo "=== E: try chat-messages via nginx with Host header ==="
          RESP=$($SSH "curl -sS -X POST \
            -H 'Host: chat.zonewise.ai' \
            -H 'Authorization: Bearer ${DIFY_API_KEY}' \
            -H 'Content-Type: application/json' \
            -d '{\"inputs\":{},\"query\":\"reply only with GEMINI_VIA_DIFY_OK\",\"response_mode\":\"blocking\",\"user\":\"smoke\"}' \
            -m 30 http://localhost/v1/chat-messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 500
          echo

          echo
          echo "=== F: try via https with -k ==="
          RESP2=$($SSH "curl -sS -k -X POST \
            -H 'Host: chat.zonewise.ai' \
            -H 'Authorization: Bearer ${DIFY_API_KEY}' \
            -H 'Content-Type: application/json' \
            -d '{\"inputs\":{},\"query\":\"reply only with OK\",\"response_mode\":\"blocking\",\"user\":\"smoke\"}' \
            -m 30 https://localhost/v1/chat-messages 2>&1")
          echo "len: ${#RESP2}"
          echo "$RESP2" | head -c 500

          echo "=== END ==="
