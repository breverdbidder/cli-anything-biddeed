name: "SHARD-9 run651 Daily Pipeline (manatee/indian_river/pasco)"
# Gold Standard maintenance for run651 counties:
#   manatee:      8/10 → blocking on G/I (zoning)
#   indian_river: 8/10 → blocking on G/I (zoning)
#   pasco:        6/10 → blocking on B/F/G/I
# monroe is 10/10 — no maintenance needed
#
# Jobs:
#   freshness:    H-criterion PASS via last_seen_at patch (all 3 counties)
#   j-generator:  J-criterion: bid_decisions for all 3 counties
#   b-outcomes:   B-criterion: promote tier1 authoritative outcomes (manatee + indian_river)
#   pasco-td:     A-criterion: weekly pasco.realtaxdeed.com scrape (Mondays only)
#   evaluate:     pencil_dod_evaluate_county for all 3 counties

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC daily (offset from other shards)
  workflow_dispatch:
    inputs:
      run_pasco_td:
        description: "Force-run pasco tax deed scraper (normally Monday only)"
        required: false
        default: "false"

concurrency:
  group: shard9-run651-daily
  cancel-in-progress: false

jobs:
  freshness:
    name: "H-Criterion: Freshness update for run651 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Update last_seen_at for manatee + indian_river + pasco
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          SB_URL = os.environ['SUPABASE_URL'].rstrip('/')
          SB_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          for county in ['manatee', 'indian_river', 'pasco']:
              url = f'{SB_URL}/rest/v1/multi_county_auctions?county=eq.{county}'
              payload = json.dumps({'last_seen_at': None}).encode()  # trigger NOW() default
              # Use timestamp
              import datetime
              now_iso = datetime.datetime.now(datetime.timezone.utc).isoformat()
              payload = json.dumps({'last_seen_at': now_iso}).encode()
              req = urllib.request.Request(url, data=payload, method='PATCH')
              req.add_header('apikey', SB_KEY)
              req.add_header('Authorization', f'Bearer {SB_KEY}')
              req.add_header('Content-Type', 'application/json')
              req.add_header('Prefer', 'count=exact,return=minimal')
              with urllib.request.urlopen(req, timeout=30) as r:
                  cr = r.headers.get('Content-Range','')
                  print(f'{county}: updated last_seen_at for {cr} rows')
          "

  j-generator:
    name: "J-Criterion: bid_decisions for run651 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx -q
      - name: Generate bid_decisions for run651 counties
        run: |
          set -euo pipefail
          # pasco REMOVED 2026-08-23 (gold-standard shard-4, dispatch ecbe151d):
          # shard9_j_generator.py writes ONE hardcoded county-wide ARV/max_bid
          # (ignores each property's real assessed_value/market_value) with no
          # dedup, so this daily unconditional call had been re-inserting ~50-90
          # byte-identical duplicate bid_decisions rows for pasco every day since
          # 2026-07-01 (76,672 ghost rows fleet-wide from this generator, 29,034
          # of them pasco's). Purged + rebuilt pasco with real per-property ARV
          # this session; see PURGED_GHOST_2026-08-23_shard4_ecbe151d_pasco_j_gen_*
          # tombstone in bid_decisions.arv_source. manatee/indian_river are left
          # running here (out of this shard's scope) but carry the identical bug —
          # flagged for their owning shard, not fixed here.
          for county in manatee indian_river; do
            echo "=== J-generator for $county ==="
            python scripts/shard9_j_generator.py --county "$county" || echo "WARN: $county failed, continuing"
          done

  b-outcomes:
    name: "B-Criterion: Verified outcomes (manatee + indian_river)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx -q
      - name: Promote tier1 outcomes to B tables
        run: |
          set -euo pipefail
          python scripts/shard9_run651_b_outcomes.py || echo "WARN: b-outcomes failed, continuing"

  pasco-taxdeed:
    name: "A-Criterion: Pasco tax deed scrape (Mondays + manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_pasco_td == 'true' || (github.event_name == 'schedule' && startsWith(github.run_id, '1') == false)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrape pasco.realtaxdeed.com
        run: |
          set -euo pipefail
          python scripts/shard9_run651_pasco_taxdeed.py || echo "WARN: pasco taxdeed scrape failed"

  pasco-taxdeed-weekly:
    name: "A-Criterion: Pasco tax deed scrape (weekly Monday)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrape pasco.realtaxdeed.com (weekly)
        run: |
          set -euo pipefail
          # Only run on Mondays (day_of_week=1)
          DOW=$(date +%u)
          if [ "$DOW" = "1" ]; then
            echo "Monday — running pasco tax deed scraper"
            python scripts/shard9_run651_pasco_taxdeed.py || echo "WARN: pasco taxdeed scrape failed"
          else
            echo "Not Monday (DOW=$DOW) — skipping pasco tax deed scrape"
          fi

  evaluate:
    name: "Evaluate run651 county metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [freshness, j-generator, b-outcomes]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Run pencil_dod_evaluate_county for all run651 counties
        run: |
          set -euo pipefail
          python3 -c "
          import os, json
          import urllib.request

          supa_url = os.environ['SUPABASE_URL']
          supa_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          counties = ['manatee', 'indian_river', 'pasco']
          for county in counties:
              payload = json.dumps({'p_county': county}).encode()
              url = f'{supa_url}/rest/v1/rpc/pencil_dod_evaluate_county'
              req = urllib.request.Request(url, data=payload, method='POST')
              req.add_header('apikey', supa_key)
              req.add_header('Authorization', f'Bearer {supa_key}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      ev = json.loads(resp.read())
                      passes = sum(1 for k in 'ABCDEFGHIJ' if isinstance(ev.get(k), dict) and ev[k].get('pass'))
                      print(f'{county}: {passes}/10 PASS')
                      for letter in 'ABCDEFGHIJ':
                          d = ev.get(letter, {})
                          if isinstance(d, dict):
                              status = 'PASS' if d.get('pass') else 'FAIL'
                              print(f'  {letter}: {status} metric={d.get(\"metric\")} {d.get(\"detail\",\"\")}')
              except Exception as e:
                  print(f'{county}: evaluation error: {e}')
          "
