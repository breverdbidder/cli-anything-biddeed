name: gtm-friday-memo

# GTM-2 (issue #20031) -- Friday memo generator: renders
# docs/gtm/memos/YYYY-MM-DD.md from public.v_gspi_daily /
# finance.v_gtm_unit_economics / winnerdata.v_variant_scoreboard /
# public.spi_daily (read-only), commits it, and posts it as a comment on
# the tracking issue. No external channels (no Telegram/SMS/Slack) per the
# intent doc's guardrail #6.
#
# Cron is UTC and fixed at 22:00, which is 18:00 ET during EDT (Mar-Nov).
# During EST (Nov-Mar) this drifts to 17:00 ET -- same known DST limitation
# every other fixed-UTC-cron workflow in this repo has (e.g.
# biddeed-daily-digest.yml); not fixed here for consistency with that
# existing, accepted pattern.
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to render (defaults to current_date from the DB)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

env:
  TRACKING_ISSUE: 20031

jobs:
  memo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Render Friday memo
        id: render
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          OUT_PATH=$(python3 scripts/gtm/gspi_report.py memo $ARGS)
          echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"

      - name: Commit memo
        run: |
          set -euo pipefail
          git config user.name "everest-bot"
          git config user.email "bot@everestcapital.usa"
          git add "${{ steps.render.outputs.path }}"
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "gtm: Friday memo $(basename ${{ steps.render.outputs.path }} .md)"
            git push
          fi

      - name: Post memo as issue comment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            cat "${{ steps.render.outputs.path }}"
            echo ""
            echo "---"
            echo "_Generated by gtm-friday-memo ($RUN_URL)._"
          } > /tmp/memo_comment.md
          gh issue comment "$TRACKING_ISSUE" --repo "${{ github.repository }}" --body-file /tmp/memo_comment.md
