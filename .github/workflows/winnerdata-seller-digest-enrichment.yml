# ── winnerdata-seller-digest-enrichment.yml ──────────────────────────────────
# Pre-approval enrichment + PDF render for seller_digest batches (issue #19619).
#
# This workflow is dispatched automatically by the winnerdata-daily-winner-ff-digest
# build job immediately after the build step completes and lead rows are persisted.
# It runs BEFORE Ariel approves the batch -- the whole point is that Ariel sees
# real PDFs before deciding to approve.
#
# Pipeline: build (persist leads) → THIS WORKFLOW (enrich + PDF) → Ariel approves → send
#
# Two jobs:
#   1. enrich: scripts/seller_digest_enrichment.py
#      - Skip-trace via Tracerfy (name + prior-owned-address anchor)
#      - DNC scrub before writing any phone/email
#      - Updates ff_batches.enrichment_status (running → complete/failed)
#   2. render: scripts/seller_digest_pdf_render.py
#      - Runs only after enrich succeeds (needs: [enrich])
#      - Applies content-safety gate (same BANNED_TERMS as nine-case flow)
#      - Blocks contact fields for leads with incomplete DNC status
#      - Uploads PDFs as GHA artifact (retention: 90 days)
#      - Updates ff_batches.pdf_render_status
#
# Note: this workflow was staged in docs/ by Claude Code (GitHub App cannot write .github/workflows/ directly)
# and activated here by Claude AI chat on 2026-08-30.
# ───────────────────────────────────────────────────────────────────────

name: winnerdata-seller-digest-enrichment

on:
  workflow_dispatch:
    inputs:
      batch_date:
        description: 'YYYY-MM-DD batch date'
        required: true
      force_refresh:
        description: 'Re-run paid vendor lookups even for already-complete rows'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: winnerdata-seller-digest-enrichment-${{ github.event.inputs.batch_date }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Run seller_digest enrichment
        env:
          BATCH_DATE: ${{ github.event.inputs.batch_date }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh == 'true' && '1' || '0' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
        run: |
          python scripts/seller_digest_enrichment.py

  render:
    needs: [enrich]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install chromium for PDF rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser

      - name: Render seller_digest Fact Finder PDFs
        env:
          BATCH_DATE: ${{ github.event.inputs.batch_date }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python scripts/seller_digest_pdf_render.py --batch-date "${{ github.event.inputs.batch_date }}"

      - name: Upload PDFs + manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-digest-ff-${{ github.event.inputs.batch_date }}
          path: |
            winnerdata/batches/${{ github.event.inputs.batch_date }}/seller_digest/**
          if-no-files-found: warn
          retention-days: 90
