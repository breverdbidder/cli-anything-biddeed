name: "Gold Standard SHARD-11 run4870 — highlands + st_lucie"
# dispatch_id: c7a1fa1a-c246-477c-80b0-aaa93b75e4c0
# Session: architect-20260718T160000
# highlands: 8/10 → target 10/10 (C/D failing at 81.7%)
# st_lucie:  6/10 → target 10/10 (C/D/E/I failing)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'County to fix (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - highlands
          - st_lucie
          - verify_only
  schedule:
    # Daily at 10:00Z, 18:00Z, 02:00Z — offset from 08:00/16:00/00:00 main fleet
    - cron: '0 10 * * *'
    - cron: '0 18 * * *'
    - cron: '0 2 * * *'

concurrency:
  group: gold-standard-shard11-highlands-stlucie-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  shard11-gold-standard:
    name: "SHARD-11 run4870 — ${{ github.event.inputs.target || 'all' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 340

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx 2>/dev/null || true

      - name: Baseline evaluation
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          SB_URL = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          for county in ["highlands", "st_lucie"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  print(f"BASELINE {county}: {len(passed)}/10 | PASS={passed} FAIL={failed}")
                  for l in "ABCDEFGHIJ":
                      ld = ev.get(l, {})
                      print(f"  {l}: {'PASS' if ld.get('pass') else 'FAIL'} metric={ld.get('metric')}")
              except Exception as e:
                  print(f"{county}: ERROR {e}")
          PYEOF

      - name: Run highlands + st_lucie fix (all)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == '' || !github.event.inputs.target }}
        run: |
          set -euo pipefail
          echo "=== SHARD-11 run4870: highlands + st_lucie ==="
          python3 scripts/shard11_highlands_stlucie_run4870.py
          echo "Fix script completed"

      - name: Run highlands fix only
        if: ${{ github.event.inputs.target == 'highlands' }}
        run: |
          set -euo pipefail
          echo "=== SHARD-11 run4870: highlands only ==="
          python3 scripts/shard11_highlands_stlucie_run4870.py
          echo "Highlands fix completed"

      - name: Run st_lucie fix only
        if: ${{ github.event.inputs.target == 'st_lucie' }}
        run: |
          set -euo pipefail
          echo "=== SHARD-11 run4870: st_lucie only ==="
          python3 scripts/shard11_highlands_stlucie_run4870.py
          echo "St_lucie fix completed"

      - name: Final verification — both counties
        if: ${{ always() && github.event.inputs.target != 'verify_only' }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          SB_URL = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          print("=== FINAL VERIFICATION ===")
          for county in ["highlands", "st_lucie"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  star = "GOLD 10/10" if len(passed) == 10 else f"{len(passed)}/10"
                  print(f"FINAL {county}: {star} | PASS={passed} FAIL={failed}")
                  for l in "ABCDEFGHIJ":
                      ld = ev.get(l, {})
                      print(f"  {l}: {'PASS' if ld.get('pass') else 'FAIL'} metric={ld.get('metric')} detail={ld.get('detail','')}")
              except Exception as e:
                  print(f"{county}: ERROR {e}")
          PYEOF

      - name: Verify-only
        if: ${{ github.event.inputs.target == 'verify_only' }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          SB_URL = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          for county in ["highlands", "st_lucie"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  print(f"{county}: {len(passed)}/10 | FAIL={failed}")
                  print(f"  Raw: {json.dumps(ev)}")
              except Exception as e:
                  print(f"{county}: ERROR {e}")
          PYEOF
