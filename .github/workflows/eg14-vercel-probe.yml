name: EG14 Reality Check (Point 11 — Feature Functional)
on:
  workflow_dispatch:
    inputs:
      url:
        default: 'https://zonewise.ai'
jobs:
  reality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup
        run: |
          npm init -y
          npm install --silent playwright @playwright/test 2>&1 | tail -3
          npx playwright install --with-deps chromium 2>&1 | tail -5
      - name: Reality check
        env:
          URL: ${{ inputs.url }}
        run: |
          cat > /tmp/reality.mjs <<'JS'
          import { chromium } from 'playwright';
          const URL = process.env.URL || 'https://zonewise.ai';
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ viewport: { width: 1920, height: 1080 } });
          const page = await ctx.newPage();
          const consoleErrors = [];
          const networkErrors = [];
          const tileRequests = [];
          const cesiumReqs = [];
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text().slice(0, 200)); });
          page.on('pageerror', e => consoleErrors.push('PAGEERROR: ' + e.message.slice(0, 200)));
          page.on('requestfailed', req => networkErrors.push(req.url().slice(0, 150) + ' :: ' + (req.failure()?.errorText || '')));
          page.on('request', req => {
            const u = req.url();
            if (u.includes('tile.googleapis.com')) tileRequests.push(u.slice(0, 150));
            if (u.includes('cesium')) cesiumReqs.push(u.slice(0, 100));
          });
          console.log('NAV: ' + URL);
          const resp = await page.goto(URL, { waitUntil: 'networkidle', timeout: 60000 });
          console.log('HTTP: ' + resp.status());
          console.log('TITLE: ' + (await page.title()).slice(0, 80));
          // Wait for hero
          await page.waitForTimeout(8000); // give cesium time to mount + load tiles
          // Look for canvas (cesium uses canvas)
          const canvases = await page.$$('canvas');
          console.log('CANVASES_FOUND: ' + canvases.length);
          // Look for hero3d component markers
          const heroExists = await page.evaluate(() => {
            return !!document.querySelector('[class*="Hero3D"], [data-component*="hero3d" i], [class*="hero-3d"]');
          });
          console.log('HERO3D_DOM: ' + heroExists);
          // Check for "AIzaSy" anywhere in window globals or current scripts
          const keyInWindow = await page.evaluate(() => {
            const scripts = document.scripts;
            for (let i = 0; i < scripts.length; i++) {
              if (scripts[i].textContent && scripts[i].textContent.match(/AIzaSy[A-Za-z0-9_-]+/)) {
                return scripts[i].textContent.match(/AIzaSy[A-Za-z0-9_-]+/)[0];
              }
            }
            return null;
          });
          console.log('KEY_IN_SCRIPTS: ' + keyInWindow);
          // Screenshot
          await page.screenshot({ path: '/tmp/reality-full.png', fullPage: false });
          console.log('SCREENSHOT_BYTES: ' + (await import('fs')).statSync('/tmp/reality-full.png').size);
          console.log('CONSOLE_ERRORS: ' + consoleErrors.length);
          consoleErrors.slice(0, 10).forEach((e, i) => console.log('  ERR' + i + ': ' + e));
          console.log('NETWORK_ERRORS: ' + networkErrors.length);
          networkErrors.slice(0, 10).forEach((e, i) => console.log('  NET' + i + ': ' + e));
          console.log('TILE_REQUESTS: ' + tileRequests.length);
          tileRequests.slice(0, 5).forEach(t => console.log('  TILE: ' + t));
          console.log('CESIUM_REQUESTS: ' + cesiumReqs.length);
          cesiumReqs.slice(0, 5).forEach(t => console.log('  CES: ' + t));
          await browser.close();
          // Verdict
          const pass = canvases.length >= 1 && tileRequests.length > 0 && consoleErrors.length === 0;
          console.log('REALITY_PASS: ' + pass);
          process.exit(pass ? 0 : 1);
          JS
          node /tmp/reality.mjs || echo "REALITY_FAIL"
      - name: Upload screenshot to Supabase
        if: always()
        env:
          SBT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -f /tmp/reality-full.png ]; then
            # Upload via Supabase Storage REST
            curl -s -X POST               -H "Authorization: Bearer $SBT"               -H "Content-Type: image/png"               --data-binary "@/tmp/reality-full.png"               "https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/summit-screenshots/398/eg14/reality-check-$(date +%s).png"               -w "
UPLOAD:%{http_code}
"
            echo "Public URL: https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/public/summit-screenshots/398/eg14/"
          fi
