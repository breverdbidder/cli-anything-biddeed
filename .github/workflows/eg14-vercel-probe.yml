name: EG14 Reality Check
on:
  workflow_dispatch:
    inputs:
      url:
        default: 'https://zonewise.ai'
jobs:
  reality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm pkg set type=module
          npm install --silent playwright
          npx playwright install --with-deps chromium 2>&1 | tail -3
      - name: Run reality check
        env:
          URL: ${{ inputs.url }}
        run: node scripts/eg14-reality.mjs
      - name: Upload screenshot to Supabase
        if: always()
        env:
          SBT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -f /tmp/reality.png ]; then
            TS=$(date +%s)
            curl -s -X POST \
              -H "Authorization: Bearer $SBT" \
              -H "Content-Type: image/png" \
              --data-binary "@/tmp/reality.png" \
              "https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/summit-screenshots/398/eg14/reality-${TS}.png" \
              -w "\nUPLOAD:%{http_code}\n"
            echo "URL: https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/public/summit-screenshots/398/eg14/reality-${TS}.png"
          fi
