name: EG14 Vercel Env Probe + Set
on:
  workflow_dispatch:
jobs:
  probe-set:
    runs-on: ubuntu-latest
    steps:
      - name: Run probe
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cat > /tmp/probe.py <<'PYE'
          import os, json, urllib.request
          TOKEN=os.environ['VERCEL_TOKEN']
          KEY=os.environ['GOOGLE_API_KEY']
          PROJECT='prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E'
          H={'Authorization':f'Bearer {TOKEN}','Content-Type':'application/json'}
          # List
          req=urllib.request.Request(f'https://api.vercel.com/v9/projects/{PROJECT}/env?decrypt=true',headers=H)
          envs=json.loads(urllib.request.urlopen(req).read()).get('envs',[])
          for e in envs:
              k=e.get('key','').upper()
              if 'GOOGLE' in k or 'CESIUM' in k or 'MAPBOX' in k:
                  print(f"BEFORE: {e['key']} targets={e.get('target',[])} val={(e.get('value') or '')[:12]}...")
          has=any(e['key']=='NEXT_PUBLIC_GOOGLE_API_KEY' and 'production' in e.get('target',[]) for e in envs)
          val=next((e['value'] for e in envs if e['key']=='NEXT_PUBLIC_GOOGLE_API_KEY' and 'production' in e.get('target',[])),'')
          print(f'NPUB_PRESENT_BEFORE: {has}')
          print(f'NPUB_MATCHES: {val==KEY}')
          # Upsert
          body={'key':'NEXT_PUBLIC_GOOGLE_API_KEY','value':KEY,'type':'plain','target':['production','preview','development']}
          req2=urllib.request.Request(f'https://api.vercel.com/v10/projects/{PROJECT}/env?upsert=true',data=json.dumps(body).encode(),headers=H,method='POST')
          try:
              r=json.loads(urllib.request.urlopen(req2).read())
              print(f"UPSERT: OK created={r.get('created') is not None}")
          except urllib.error.HTTPError as e:
              print(f"UPSERT_ERR: {e.code} {e.read().decode()[:200]}")
          # Verify
          envs2=json.loads(urllib.request.urlopen(urllib.request.Request(f'https://api.vercel.com/v9/projects/{PROJECT}/env?decrypt=true',headers=H)).read()).get('envs',[])
          for e in envs2:
              if e['key']=='NEXT_PUBLIC_GOOGLE_API_KEY':
                  print(f"AFTER: targets={e.get('target',[])} val={(e.get('value') or '')[:12]}...")
          # Latest deploy
          req3=urllib.request.Request(f'https://api.vercel.com/v6/deployments?projectId={PROJECT}&target=production&limit=1',headers=H)
          deps=json.loads(urllib.request.urlopen(req3).read()).get('deployments',[])
          for d in deps[:1]:
              print(f"LATEST_DEPLOY: url={d.get('url')} state={d.get('state')} created={d.get('created')}")
          PYE
          python3 /tmp/probe.py
