name: EG14 Deploy Status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cat > /tmp/q.py <<'PY'
          import os, json, urllib.request
          T=os.environ['VERCEL_TOKEN']
          P='prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E'
          H={'Authorization':f'Bearer {T}'}
          # Latest 5 prod deploys
          deps=json.loads(urllib.request.urlopen(urllib.request.Request(f'https://api.vercel.com/v6/deployments?projectId={P}&target=production&limit=5',headers=H)).read())
          for d in deps.get('deployments',[]):
              print(f"DEP: {d.get('uid')} state={d.get('state')} url={d.get('url')} created={d.get('created')}")
          # Aliases on zonewise.ai
          al=json.loads(urllib.request.urlopen(urllib.request.Request('https://api.vercel.com/v4/aliases?domain=zonewise.ai&limit=5',headers=H)).read())
          for a in al.get('aliases',[]):
              print(f"ALIAS: {a.get('alias')} → deployment={a.get('deploymentId')} created={a.get('created')}")
          PY
          python3 /tmp/q.py
