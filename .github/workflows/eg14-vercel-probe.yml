name: Probe Tile API
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "=== Raw ==="
          curl -s -w "http=%{http_code}
" "https://tile.googleapis.com/v1/3dtiles/root.json?key=$KEY" -o /tmp/a.txt
          head -c 400 /tmp/a.txt
          echo ""
          echo "=== With Referer ==="
          curl -s -w "http=%{http_code}
" -H "Referer: https://zonewise.ai/" "https://tile.googleapis.com/v1/3dtiles/root.json?key=$KEY" -o /tmp/b.txt
          head -c 400 /tmp/b.txt
