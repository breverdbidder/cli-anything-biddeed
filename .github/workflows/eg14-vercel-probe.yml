name: EG14 Reality Check
on:
  workflow_dispatch:
    inputs:
      url:
        default: 'https://zonewise.ai'
jobs:
  reality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --silent playwright@1.48.0
          npx playwright install --with-deps chromium 2>&1 | tail -3
      - name: Run reality check
        env:
          URL: ${{ inputs.url }}
        run: |
          cp scripts/eg14-reality.mjs /tmp/pw/reality.mjs
          cd /tmp/pw && node reality.mjs || echo "REALITY_RC=$?"
      - name: Upload screenshots to Supabase via service role
        if: always()
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TS=$(date +%s)
          for f in r5 r15 r30; do
            if [ -f /tmp/$f.png ]; then
              curl -s -X POST \
                -H "Authorization: Bearer $SRK" \
                -H "apikey: $SRK" \
                -H "Content-Type: image/png" \
                -H "x-upsert: true" \
                --data-binary "@/tmp/$f.png" \
                "https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/summit-screenshots/398/eg14/${f}-${TS}.png" \
                -w "${f} HTTP:%{http_code}\n" -o /tmp/up_${f}.json
              cat /tmp/up_${f}.json
              echo " → https://mocerqjnksmhcjzxrewo.supabase.co/storage/v1/object/public/summit-screenshots/398/eg14/${f}-${TS}.png"
            fi
          done
