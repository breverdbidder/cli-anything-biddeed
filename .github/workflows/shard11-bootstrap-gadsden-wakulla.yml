name: SHARD-11 Bootstrap Gadsden & Wakulla

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if counties already have data'
        required: false
        default: 'false'
  schedule:
    # Run once daily at 06:00 UTC to check/bootstrap 0/10 counties
    - cron: '0 6 * * *'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max for complete bootstrap
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx

      - name: Pre-check county status
        id: precheck
        run: |
          echo "Checking if bootstrap is needed..."
          # Run a quick evaluation to see current status
          python3 -c "
          import os, sys, httpx, json
          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}
          
          client = httpx.Client(timeout=30)
          
          # Check gadsden status
          try:
              r = client.post(f'{url}/rest/v1/rpc/pencil_dod_evaluate_county',
                             headers=headers, json={'county_slug_arg': 'gadsden'})
              gadsden_passes = 0 
              if r.status_code == 200:
                  for letter in r.json():
                      if letter.get('pass'): gadsden_passes += 1
              print(f'gadsden_passes={gadsden_passes}')
              
              # Check wakulla status  
              r = client.post(f'{url}/rest/v1/rpc/pencil_dod_evaluate_county',
                             headers=headers, json={'county_slug_arg': 'wakulla'})
              wakulla_passes = 0
              if r.status_code == 200:
                  for letter in r.json():
                      if letter.get('pass'): wakulla_passes += 1
              print(f'wakulla_passes={wakulla_passes}')
              
              # Determine if bootstrap needed
              force = '${{ inputs.force_run }}' == 'true'
              needed = gadsden_passes == 0 or wakulla_passes == 0 or force
              print(f'bootstrap_needed={str(needed).lower()}')
              
          except Exception as e:
              print(f'Error in precheck: {e}', file=sys.stderr)
              print('bootstrap_needed=true')  # Err on side of caution
          " >> $GITHUB_OUTPUT

      - name: Run bootstrap
        if: steps.precheck.outputs.bootstrap_needed == 'true'
        run: |
          echo "=== SHARD-11 BOOTSTRAP: GADSDEN & WAKULLA ==="
          echo "Moving 0/10 counties to functioning pipelines"
          echo ""
          
          python3 scripts/shard11_bootstrap_gadsden_wakulla.py

      - name: Verify bootstrap results
        if: steps.precheck.outputs.bootstrap_needed == 'true' 
        run: |
          echo "=== POST-BOOTSTRAP VERIFICATION ==="
          
          if [ -f /tmp/shard11_bootstrap_results.json ]; then
            echo "Bootstrap results:"
            cat /tmp/shard11_bootstrap_results.json | jq -r '
              .verification // {} | to_entries[] | 
              "  \(.key): \(.value.pass_count // "ERROR")/10 letters passing"
            '
            
            # Check if any improvements occurred
            IMPROVED=$(cat /tmp/shard11_bootstrap_results.json | jq -r '
              [.verification // {} | to_entries[] | .value.improvement // false] | any
            ')
            
            if [ "$IMPROVED" = "true" ]; then
              echo "✅ Bootstrap successful - counties improved"
              exit 0
            else
              echo "⚠️ Bootstrap completed but no improvements detected"
              exit 1  
            fi
          else
            echo "❌ No bootstrap results file found"
            exit 1
          fi

      - name: Skip notification
        if: steps.precheck.outputs.bootstrap_needed == 'false'
        run: |
          echo "✅ Bootstrap not needed - counties already functional"
          echo "Gadsden passes: ${{ steps.precheck.outputs.gadsden_passes }}/10"
          echo "Wakulla passes: ${{ steps.precheck.outputs.wakulla_passes }}/10"