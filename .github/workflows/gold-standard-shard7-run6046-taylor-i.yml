name: "GOLD STANDARD SHARD-7 run6046: taylor I enrichment + desoto/taylor H"
# Applies supabase/migrations/20260723a_gold_standard_shard7_taylor_i_enrichment.sql
# Then runs shard7_run6046_desoto_taylor_bf_i_fix.py for live enrichment.
#
# dispatch_id: 52e79d90-814a-4fb3-b0c9-7e1a7bde8f49
# Targets: desoto (B/F investigation), taylor (B/F investigation + I card enrichment)
#
# WIRING MANDATE: this workflow is the executor for the session's deliverables.
# - Migration: SQL enrichment (geocode proxy, assessed_value proxy, parcel_zones)
# - Script: live FL GIO enrichment for parcel data + taylorclerk.com B/F check

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 09:30 UTC — after shard6-taylor-daily-scrape (06:00 UTC) has run
    - cron: '30 9 * * *'

concurrency:
  group: shard7-run6046-taylor-i
  cancel-in-progress: false

jobs:
  apply-migration:
    name: "Apply taylor I enrichment migration"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SB_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: "Apply taylor I enrichment migration"
        run: |
          set -euo pipefail
          MIGRATION="supabase/migrations/20260723a_gold_standard_shard7_taylor_i_enrichment.sql"
          echo "=== Applying $MIGRATION ==="
          python3 -c "import json; print(json.dumps({'query': open('$MIGRATION').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || {
            echo "::error::Migration failed HTTP $HTTP"
            exit 1
          }
          echo "Migration applied OK"

      - name: "SQL VERIFICATION — taylor card_complete count"
        if: always()
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; shift
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }

          rq "taylor card_complete basics" \
            "SELECT county, COUNT(*) AS total, COUNT(CASE WHEN property_address IS NOT NULL AND latitude IS NOT NULL AND longitude IS NOT NULL AND COALESCE(assessed_value, market_value) IS NOT NULL AND parcel_id IS NOT NULL THEN 1 END) AS cards_with_basics FROM multi_county_auctions WHERE lower(county)='taylor' GROUP BY county"

          rq "taylor parcel_zones count (jurisdiction 908)" \
            "SELECT COUNT(*) AS pz_rows FROM parcel_zones WHERE jurisdiction_id=908"

          rq "desoto H freshness" \
            "SELECT county, MAX(last_seen_at) AS last_seen FROM multi_county_auctions WHERE lower(county)='desoto' GROUP BY county"

          rq "taylor H freshness" \
            "SELECT county, MAX(last_seen_at) AS last_seen FROM multi_county_auctions WHERE lower(county)='taylor' GROUP BY county"

  live-enrichment:
    name: "Live FL GIO enrichment + B/F investigation"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: apply-migration
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx beautifulsoup4 requests

      - name: Run live enrichment script
        run: |
          set -euo pipefail
          python3 scripts/shard7_run6046_desoto_taylor_bf_i_fix.py 2>&1 | tee /tmp/shard7_live.log
          echo "Exit code: $?"

      - name: Post summary
        if: always()
        run: |
          echo "## SHARD-7 run6046: desoto + taylor B/F/I fix" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "**dispatch_id:** 52e79d90-814a-4fb3-b0c9-7e1a7bde8f49" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/shard7_live.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  evaluate:
    name: "Final pencil_dod evaluation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: live-enrichment
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SB_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: "pencil_dod_evaluate_county — desoto + taylor"
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; shift
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }

          rq "desoto evaluation" \
            "SELECT public.pencil_dod_evaluate_county('desoto')"

          rq "taylor evaluation" \
            "SELECT public.pencil_dod_evaluate_county('taylor')"

          rq "gold_standard_scoreboard desoto+taylor" \
            "SELECT county_slug, pass_count, gold_standard, a_dual_product, b_verified_outcomes, c_parity_clean, d_parity_any, e_parcel_linkage, f_tier1_sold, g_zoning, h_freshness, i_card_complete, j_deal_thesis FROM gold_standard_scoreboard WHERE county_slug IN ('desoto','taylor') ORDER BY county_slug"

      - name: Post evaluation to summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Final Evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo "See job logs above for pencil_dod_evaluate_county output" >> "$GITHUB_STEP_SUMMARY"
