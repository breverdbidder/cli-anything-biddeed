name: Add gemini-2.5-pro to cliproxy + smoke test
on:
  workflow_dispatch: {}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH + patch config + restart + smoke
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e
          CFG=/opt/cliproxy-gateway/config.yaml
          CP_KEY="biddeed-gw-77dc6c9df0e5088057c28d1f94d3fef791961fbb409da85f"

          echo "=== A: current gemini models in config ==="
          $SSH "grep -A6 '^gemini-api-key:' ${CFG}"

          echo
          echo "=== B: add gemini-2.5-pro as a new model entry (with alias gemini-pro) ==="
          $SSH "cp ${CFG} ${CFG}.bak.addpro.\$(date +%s)"
          # The current gemini-api-key block ends with gemini-flash-preview. Append gemini-2.5-pro
          # using sed to insert after the "- name: \"gemini-2.5-flash-preview-04-17\"" line
          $SSH "sed -i '/gemini-flash-preview/a\\      - name: \"gemini-2.5-pro\"\\n        alias: \"gemini-pro\"' ${CFG}"
          $SSH "grep -A10 '^gemini-api-key:' ${CFG}"

          echo
          echo "=== C: restart cliproxy ==="
          $SSH "docker restart biddeed-cliproxy && sleep 4"
          $SSH 'docker logs --tail 5 biddeed-cliproxy 2>&1 | grep -v "no space"'

          echo
          echo "=== D: smoke test 1 — direct curl Anthropic format with model=gemini-pro ==="
          RESP=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-pro\",\"max_tokens\":80,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly this JSON and nothing else: {\\\"ok\\\":true,\\\"tier\\\":\\\"pro\\\"}\"}]}' -m 60 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500
          echo

          echo
          echo "=== E: claude -p via cliproxy → gemini-pro (real agentic smoke) ==="
          $SSH "ANTHROPIC_BASE_URL=http://127.0.0.1:8317 ANTHROPIC_API_KEY=${CP_KEY} claude -p 'reply only with CLAUDE_GEMINI_PRO_OK and nothing else' --model gemini-pro --allowedTools Read 2>&1 | tail -15"

          echo "=== END ==="
