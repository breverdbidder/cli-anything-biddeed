name: centroid-sequential-final

on:
  workflow_dispatch:
    inputs:
      co_no_override:
        description: "Single co_no (blank = all pending)"
        required: false
        default: ""

jobs:
  harvest-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install deps
        run: pip install requests --quiet

      - name: Sequential harvest one county one connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CO_NO_OVERRIDE: ${{ github.event.inputs.co_no_override }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time, sys

          SB_URL  = os.environ["SUPABASE_URL"]
          SB_KEY  = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          SB_HDRS = {"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}",
                     "Content-Type":"application/json","Prefer":"return=minimal"}
          FS = ("https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest"
                "/services/Florida_Statewide_Parcel_Centroid_Version/FeatureServer/0/query")
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          PAGE=2000; RETRIES=6; BATCH=500

          arc = requests.Session()
          arc.headers.update({"User-Agent":UA,"Accept":"application/json","Referer":"https://www.arcgis.com/"})

          def get_pending():
              override = os.environ.get("CO_NO_OVERRIDE","").strip()
              if override:
                  params={"co_no":f"eq.{override}","select":"co_no,county_name","status":"eq.pending"}
              else:
                  params={"status":"eq.pending","select":"co_no,county_name","order":"total_parcels.asc"}
              return requests.get(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                                  headers={"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}"},
                                  params=params).json()

          def patch(co, p):
              requests.patch(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                             headers=SB_HDRS,params={"co_no":f"eq.{co}"},json=p)

          def stage(rows):
              seen={r["parcel_id"]:r for r in rows}
              r=requests.post(f"{SB_URL}/rest/v1/rpc/stage_centroids",
                              headers={**SB_HDRS,"Prefer":"return=representation"},
                              json={"rows":list(seen.values())},timeout=60)
              if r.status_code not in (200,201):
                  raise RuntimeError(f"stage {r.status_code}: {r.text[:200]}")

          def oid_range(co):
              for a in range(RETRIES):
                  try:
                      r=arc.get(FS,params={"where":f"CO_NO={co}","outFields":"OBJECTID",
                          "returnGeometry":"false",
                          "outStatistics":'[{"statisticType":"min","onStatisticField":"OBJECTID","outStatisticFieldName":"min_oid"},{"statisticType":"max","onStatisticField":"OBJECTID","outStatisticFieldName":"max_oid"}]',
                          "f":"json"},timeout=60)
                      d=r.json()
                      if "features" in d and d["features"]:
                          at=d["features"][0]["attributes"]
                          return at.get("min_oid"),at.get("max_oid")
                      raise RuntimeError(str(d.get("error","no features")))
                  except Exception as e:
                      if a==RETRIES-1: raise
                      time.sleep(min(120,4**a))

          def fetch(co,mn,mx):
              for a in range(RETRIES):
                  try:
                      r=arc.get(FS,params={
                          "where":f"CO_NO={co} AND OBJECTID>={mn} AND OBJECTID<={mx}",
                          "outFields":"PARCEL_ID,OBJECTID","returnGeometry":"true",
                          "resultRecordCount":PAGE,"outSR":"4326","f":"json"},timeout=120)
                      d=r.json()
                      if "error" in d: raise RuntimeError(str(d["error"]))
                      return d.get("features",[])
                  except Exception as e:
                      if a==RETRIES-1: raise
                      time.sleep(min(120,4**a))

          def process(co,name):
              print(f"
>>> [{co}] {name}")
              patch(co,{"status":"running","started_at":"now()","error_msg":None})
              tw=0; batch=[]
              try:
                  mn,mx=oid_range(co)
                  if mn is None:
                      patch(co,{"status":"done","centroids_done":0,"completed_at":"now()","updated_at":"now()"})
                      return True
                  print(f"[{co}] OID {mn}..{mx}")
                  cursor=mn
                  while cursor<=mx:
                      end=cursor+20000
                      feats=fetch(co,cursor,end)
                      for f in feats:
                          g=f.get("geometry"); pid=f.get("attributes",{}).get("PARCEL_ID")
                          if not pid or not g: continue
                          lng,lat=g.get("x"),g.get("y")
                          if None in (lng,lat): continue
                          if not(-90<=lat<=90) or not(-180<=lng<=180): continue
                          batch.append({"parcel_id":pid,"co_no":co,
                                        "centroid_lat":round(lat,7),"centroid_lng":round(lng,7)})
                          if len(batch)>=BATCH:
                              stage(batch); tw+=len(batch); batch=[]
                      cursor=(max(f["attributes"]["OBJECTID"] for f in feats)+1) if feats else end+1
                      print(f"  [{co}] cursor={cursor} staged={tw}")
                      if tw%10000<BATCH: patch(co,{"centroids_done":tw,"updated_at":"now()"})
                      time.sleep(0.5)
                  if batch: stage(batch); tw+=len(batch)
                  patch(co,{"status":"done","centroids_done":tw,"completed_at":"now()","updated_at":"now()"})
                  print(f"<<< [{co}] {name} DONE {tw:,}")
                  return True
              except Exception as e:
                  patch(co,{"status":"error","error_msg":str(e)[:500],"updated_at":"now()"})
                  print(f"<<< [{co}] ERROR: {e}",file=sys.stderr)
                  return False

          counties = get_pending()
          print(f"Processing {len(counties)} counties sequentially")
          for c in counties:
              process(c["co_no"],c["county_name"])
              time.sleep(2)

          rows=requests.get(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                            headers={"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}"},
                            params={"select":"status"}).json()
          done=sum(1 for r in rows if r["status"]=="done")
          print(f"
SCOREBOARD: {done}/67 done")
          if done==67:
              print("ALL 67 DONE — merging staging to fl_parcels")
              r=requests.post(f"{SB_URL}/rest/v1/rpc/merge_staged_centroids",
                              headers={**SB_HDRS,"Prefer":"return=representation"},
                              json={},timeout=600)
              print(f"MERGE HTTP {r.status_code} — DoD ACHIEVED")
          PYEOF
