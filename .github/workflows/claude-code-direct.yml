name: Claude Code Direct — Parallel SUMMITs
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers'
        required: true
        default: '171,172'
jobs:
  run-claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
    steps:
      - name: Run Claude Code on Hetzner for issue ${{ matrix.issue }}
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Check if Claude Code CLI installed ==="
          $SSH "which claude || npm ls -g @anthropic-ai/claude-code 2>/dev/null || echo NOT_INSTALLED"

          echo "=== Install Claude Code if needed ==="
          $SSH "which claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code"

          echo "=== Setup workspace ==="
          $SSH "mkdir -p /root/summit-${ISSUE} && cd /root/summit-${ISSUE} && \
            (test -d cli-anything-biddeed/.git && cd cli-anything-biddeed && git pull || \
            git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git)"

          echo "=== Run Claude Code on SUMMIT #${ISSUE} ==="
          $SSH "cd /root/summit-${ISSUE}/cli-anything-biddeed && \
            export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}' && \
            claude -p 'Read GitHub issue #${ISSUE} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${ISSUE}. Execute ALL tasks listed in the issue body. Follow CLAUDE.md directives. Commit and push results. Zero human-in-the-loop. Report completion by commenting on the issue.' \
            --allowedTools 'Bash(*)' 'Read' 'Write' 'Edit' \
            2>&1 | tail -100"

          echo "=== SUMMIT #${ISSUE} COMPLETE ==="
