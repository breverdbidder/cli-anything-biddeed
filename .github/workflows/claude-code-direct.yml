name: Claude Code Direct — Parallel SUMMITs
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers (REQUIRED, no default — empty = hard fail)'
        required: true
        type: string
jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty or missing issues input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then
            echo "::error::Empty 'issues' input. Dispatch rejected."
            exit 1
          fi
          echo "::notice::SUMMIT dispatch received issues input: ${{ inputs.issues }}"
  run-claude-code:
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Validate issue input
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
          ALLOW_PLACEHOLDER: ${{ vars.ALLOW_PLACEHOLDER }}
        run: |
          set -e
          if [ -z "${ISSUE// /}" ]; then
            echo "::error::Empty issue number passed to workflow."
            exit 1
          fi
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number '$ISSUE' is not a positive integer."
            exit 1
          fi
          if [ "$ISSUE" = "379" ] && [ "${ALLOW_PLACEHOLDER:-0}" != "1" ]; then
            echo "::error::Refusing to run against dead placeholder issue #379."
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/iss.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/$ISSUE")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Issue #$ISSUE does not exist (HTTP $STATUS)."
            exit 1
          fi
          STATE=$(jq -r .state /tmp/iss.json)
          if [ "$STATE" != "open" ]; then
            echo "::error::Issue #$ISSUE is not open (state=$STATE)."
            exit 1
          fi
          echo "✅ Issue #$ISSUE validated."

      - name: Announce dispatch target
        run: |
          echo "::notice::SUMMIT dispatching against issue(s): ${{ inputs.issues }} → matrix element ${{ matrix.issue }}"

      - name: Run Claude Code on Hetzner for issue ${{ matrix.issue }}
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_SESSION_JSON: ${{ secrets.LINKEDIN_SESSION_JSON }}
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ISSUE: ${{ matrix.issue }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes root@${HETZNER_IP}"
          SCP="scp -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "=== Build prompt from issue body + all comments ==="
          curl -s -H "Authorization: token $GH_PAT" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}" | jq -r '.body' > /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "---" >> /tmp/prompt.txt
          curl -s -H "Authorization: token $GH_PAT" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}/comments?per_page=100" | jq -r '.[] | "\n---COMMENT by " + .user.login + " @ " + .created_at + "---\n" + (.body // "")' >> /tmp/prompt.txt
          echo "Prompt bytes: $(wc -c < /tmp/prompt.txt)"

          echo "=== Upload prompt to Hetzner ==="
          $SCP /tmp/prompt.txt root@${HETZNER_IP}:/root/summit-${ISSUE}-prompt.txt

          echo "=== Setup workspace ==="
          $SSH "mkdir -p /root/summit-${ISSUE}/work && cd /root/summit-${ISSUE}/work && git config --global user.email 'claude-code@biddeed.ai' && git config --global user.name 'Claude Code'"

          echo "=== Verify Max OAuth alive ==="
          $SSH 'test -f /root/.claude/credentials.json || test -f /root/.claude/.credentials.json && echo "OAuth OK" || { echo "::error::No OAuth on Hetzner"; exit 1; }'

          echo "=== Ensure non-root summit user exists with OAuth creds ==="
          $SSH 'id summit >/dev/null 2>&1 || (useradd -m -s /bin/bash summit && echo "Created user summit"); mkdir -p /home/summit/.claude && cp -n /root/.claude/credentials.json /home/summit/.claude/credentials.json 2>/dev/null || cp -n /root/.claude/.credentials.json /home/summit/.claude/credentials.json 2>/dev/null || true; chown -R summit:summit /home/summit/.claude; chmod 600 /home/summit/.claude/credentials.json 2>/dev/null || true; mkdir -p /home/summit/summit-'"${ISSUE}"'/work && chown -R summit:summit /home/summit/summit-'"${ISSUE}"'; cp /root/summit-'"${ISSUE}"'-prompt.txt /home/summit/summit-'"${ISSUE}"'-prompt.txt && chown summit:summit /home/summit/summit-'"${ISSUE}"'-prompt.txt; which claude >/dev/null && echo "claude CLI: $(which claude)" || echo "::error::claude CLI not in PATH"'

          echo "=== Run Claude Code as summit user (Max OAuth only) ==="
          $SSH "sudo -u summit bash -lc 'cd /home/summit/summit-${ISSUE}/work && unset ANTHROPIC_API_KEY && export GH_TOKEN=${GH_PAT} && export SUPABASE_URL=${SUPABASE_URL} && export SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY} && export IS_SANDBOX=1 && timeout 6000 claude -p "\$(cat /home/summit/summit-${ISSUE}-prompt.txt)" --dangerously-skip-permissions --max-turns 200 2>&1 | tee /home/summit/summit-${ISSUE}-output.log'" || echo "::warning::claude -p exited non-zero"

          # Copy log back to /root for tail capture
          $SSH "cp /home/summit/summit-${ISSUE}-output.log /root/summit-${ISSUE}-output.log 2>/dev/null || true"

          echo "=== Capture output tail ==="
          $SSH "tail -c 8000 /root/summit-${ISSUE}-output.log" > /tmp/output_tail.txt 2>/dev/null || echo "(no output)" > /tmp/output_tail.txt

          echo "=== Post results comment to issue ==="
          jq -Rs --arg issue "$ISSUE" '{body: ("## 🤖 SUMMIT #" + $issue + " Execution Report\n\n**Runner:** GH Actions → Hetzner (Max OAuth)\n\n### Output tail (last 8KB)\n\n```\n" + .[-7500:] + "\n```\n")}' < /tmp/output_tail.txt > /tmp/result_comment.json
          curl -s -X POST -H "Authorization: token $GH_PAT" -H "Content-Type: application/json" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}/comments" --data @/tmp/result_comment.json -o /dev/null -w "Comment POST: %{http_code}\n"

          echo "=== SUMMIT #${ISSUE} COMPLETE ==="
