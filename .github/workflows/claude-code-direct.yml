name: Claude Code Direct — Parallel SUMMITs
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers (REQUIRED, no default — empty = hard fail)'
        required: true
        type: string
jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty or missing issues input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then
            echo "::error::Empty 'issues' input. Dispatch rejected."
            exit 1
          fi
          echo "::notice::SUMMIT dispatch received issues input: ${{ inputs.issues }}"
  run-claude-code:
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Checkout repo (for scripts/claude-runner.sh)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FULL }}
          fetch-depth: 1

      - name: Mark Summit as running in Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ISSUE: ${{ matrix.issue }}
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/summit_chat_dispatch?github_issue_number=eq.${ISSUE}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"workflow_run_id\":${{ github.run_id }},\"workflow_run_url\":\"${WORKFLOW_URL}\",\"state\":\"running\"}" \
            -o /tmp/patch_start.txt -w "Supabase PATCH (running): HTTP %{http_code}\n" || echo "WARN: Supabase PATCH running failed (non-fatal, continuing)"

      - name: Validate issue input
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
          ALLOW_PLACEHOLDER: ${{ vars.ALLOW_PLACEHOLDER }}
        run: |
          set -e
          if [ -z "${ISSUE// /}" ]; then
            echo "::error::Empty issue number."
            exit 1
          fi
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number '$ISSUE' is not a positive integer."
            exit 1
          fi
          if [ "$ISSUE" = "379" ] && [ "${ALLOW_PLACEHOLDER:-0}" != "1" ]; then
            echo "::error::Refusing to run against dead placeholder issue #379."
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/iss.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/$ISSUE")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Issue #$ISSUE does not exist (HTTP $STATUS)."
            exit 1
          fi
          STATE=$(jq -r .state /tmp/iss.json)
          if [ "$STATE" != "open" ]; then
            echo "::error::Issue #$ISSUE is not open (state=$STATE)."
            exit 1
          fi
          echo "✅ Issue #$ISSUE validated."

      - name: Announce dispatch target
        run: |
          echo "::notice::SUMMIT dispatching issue ${{ matrix.issue }}"

      - name: Run Claude Code on Hetzner for issue ${{ matrix.issue }}
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_PAT_FULL: ${{ secrets.GH_PAT_FULL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          ISSUE: ${{ matrix.issue }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes root@${HETZNER_IP}"
          SCP="scp -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "=== Build prompt from issue body + all comments ==="
          curl -s -H "Authorization: token $GH_PAT" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}" | jq -r '.body' > /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "---" >> /tmp/prompt.txt
          curl -s -H "Authorization: token $GH_PAT" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}/comments?per_page=100" | jq -r '.[] | "\n---COMMENT by " + .user.login + " @ " + .created_at + "---\n" + (.body // "")' >> /tmp/prompt.txt
          echo "Prompt bytes: $(wc -c < /tmp/prompt.txt)"

          echo "=== Upload prompt + runner script to Hetzner ==="
          $SCP /tmp/prompt.txt root@${HETZNER_IP}:/root/summit-${ISSUE}-prompt.txt
          $SCP scripts/claude-runner.sh root@${HETZNER_IP}:/root/claude-runner.sh

          echo "=== Setup summit user ==="
          $SSH "id summit >/dev/null 2>&1 || useradd -m -s /bin/bash summit"
          $SSH "mkdir -p /home/summit/.claude && SRC=\$(ls /root/.claude/.credentials.json /root/.claude/credentials.json 2>/dev/null | head -1) && if [ -z \"\$SRC\" ]; then echo \"::error::no root credentials.json found\"; exit 1; fi && cp -f \"\$SRC\" /home/summit/.claude/.credentials.json && cp -f \"\$SRC\" /home/summit/.claude/credentials.json && chown -R summit:summit /home/summit/.claude && chmod 600 /home/summit/.claude/.credentials.json /home/summit/.claude/credentials.json"
          $SSH "mkdir -p /home/summit/summit-${ISSUE}/work && chown -R summit:summit /home/summit/summit-${ISSUE}"
          $SSH "cp /root/summit-${ISSUE}-prompt.txt /home/summit/summit-${ISSUE}-prompt.txt && chown summit:summit /home/summit/summit-${ISSUE}-prompt.txt"
          $SSH "cp /root/claude-runner.sh /home/summit/claude-runner.sh && chown summit:summit /home/summit/claude-runner.sh && chmod +x /home/summit/claude-runner.sh"
          $SSH "which claude || echo NO_CLAUDE_CLI"

          echo "=== Diagnose claude binary permissions + fix for summit user ==="
          $SSH "ls -la \$(which claude) && readlink -f \$(which claude) && (file \$(which claude) 2>/dev/null || true)"
          $SSH "CLAUDE_BIN=\$(readlink -f \$(which claude)) && chmod a+rx \$CLAUDE_BIN && dirname \$CLAUDE_BIN | xargs -I{} find {} -type f -exec chmod a+r {} \\; 2>/dev/null || true"
          $SSH "CLAUDE_REAL=\$(readlink -f \$(which claude 2>/dev/null) 2>/dev/null); if echo \"\$CLAUDE_REAL\" | grep -q '^/root/'; then echo 'claude in /root — installing to /opt/claude for summit access'; npm install -g --prefix=/opt/claude @anthropic-ai/claude-code 2>&1 | tail -5 || true; ln -sf /opt/claude/bin/claude /usr/local/bin/claude; fi"
          $SSH "sudo -u summit which claude && sudo -u summit claude --version || echo 'summit still cannot run claude'"

          echo "=== Verify runtime path — Tier 1 Max OAuth PRIMARY, cliproxy fallback per cost-discipline ==="
          $SSH "test -f /home/summit/.claude/credentials.json && echo 'Max OAuth (Tier 1) — primary' || (docker ps --format '{{.Names}} {{.Status}}' | grep -q 'biddeed-cliproxy.*Up' && echo 'cliproxy Gemini (Tier 2) — fallback' || { echo '::error::No auth path available'; exit 1; })"

          echo "=== Extract cliproxy gateway key from Hetzner config (fallback use only) ==="
          CLIPROXY_KEY=$($SSH "grep -A1 '^api-keys:' /opt/cliproxy-gateway/config.yaml 2>/dev/null | tail -1 | sed 's/.*\"\\(.*\\)\".*/\\1/'" | tr -d '\r\n')
          echo "cliproxy key loaded: len=${#CLIPROXY_KEY}"

          echo "=== Launch claude -p as summit user ==="
          set -e
          $SSH "sudo -u summit env GH_PAT='${GH_PAT}' HETZNER_IP='${HETZNER_IP}' HETZNER_PASSWORD='${HETZNER_PASSWORD}' CLIPROXY_KEY='${CLIPROXY_KEY}' SUPABASE_URL='${SUPABASE_URL}' SUPABASE_SERVICE_ROLE_KEY='${SUPABASE_SERVICE_ROLE_KEY}' SUPABASE_ANON_KEY='${SUPABASE_ANON_KEY}' GH_PAT_FULL='${GH_PAT_FULL}' FIRECRAWL_API_KEY='${FIRECRAWL_API_KEY}' EXA_API_KEY='${EXA_API_KEY}' CF_API_TOKEN='${CF_API_TOKEN}' CF_ACCOUNT_ID='${CF_ACCOUNT_ID}' TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}' TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}' SUPADATA_API_KEY='${SUPADATA_API_KEY}' VERCEL_TOKEN='${VERCEL_TOKEN}' NEXT_PUBLIC_MAPBOX_TOKEN='${NEXT_PUBLIC_MAPBOX_TOKEN}' BIDDEED_BOT_TOKEN='${BIDDEED_BOT_TOKEN}' BIDDEED_BOT_CHAT_ID='${BIDDEED_BOT_CHAT_ID}' bash /home/summit/claude-runner.sh ${ISSUE}"
          RUNNER_EXIT=$?
          set +e

          # EXPANDED ghost-success detector per Apr16 Architect review
          GHOST_PATTERNS="Not logged in|fatal: could not read|fatal: repository not found|fatal: Authentication failed|exit code 128|exit status 128|rate limit exceeded|API request failed|Permission denied \(publickey\)|Invalid authentication credentials|authentication_error|waiting for your response|please confirm|should I install|Let me know if you need"
          if $SSH "grep -qE '$GHOST_PATTERNS' /home/summit/summit-${ISSUE}-output.log 2>/dev/null"; then
            MATCHED=$($SSH "grep -oE '$GHOST_PATTERNS' /home/summit/summit-${ISSUE}-output.log 2>/dev/null | head -1")
            echo "::error::GHOST SUCCESS DETECTED — pattern matched: '$MATCHED'. Runner exit code was $RUNNER_EXIT but critical failure detected. Forcing failure."
            exit 1
          fi

          # POSITIVE MARKER CHECK (Apr16 post-#511 hallucination fix)
          # Strict dispatches require explicit output marker to distinguish real execution from Gemini hallucination
          if grep -qE 'STRICT EXECUTE PROTOCOL|MANDATORY LAST LINE' /home/summit/summit-${ISSUE}-prompt.txt 2>/dev/null; then
            LAST_LINES=$($SSH "tail -20 /home/summit/summit-${ISSUE}-output.log 2>/dev/null")
            if ! echo "$LAST_LINES" | grep -qE 'PUSHED commit:[a-f0-9]{7,}|ERROR:|SUMMIT_NOOP:'; then
              echo "::error::STRICT PROTOCOL VIOLATION — no PUSHED/ERROR/NOOP marker in last 20 lines. Gemini likely hallucinated completion. Forcing failure."
              echo "Last 5 lines seen:"
              echo "$LAST_LINES" | tail -5
              exit 1
            fi
          fi

          if [ "$RUNNER_EXIT" != "0" ]; then
            echo "::error::claude runner exited with code $RUNNER_EXIT"
            exit $RUNNER_EXIT
          fi

          echo "=== Copy output log back for capture ==="
          $SSH "cp /home/summit/summit-${ISSUE}-output.log /root/summit-${ISSUE}-output.log 2>/dev/null || true"
          $SSH "tail -c 8000 /root/summit-${ISSUE}-output.log" > /tmp/output_tail.txt 2>/dev/null || echo "(no output)" > /tmp/output_tail.txt
          echo "Output tail bytes: $(wc -c < /tmp/output_tail.txt)"

          echo "=== Post results comment to issue ==="
          jq -Rs --arg issue "$ISSUE" '{body: ("## 🤖 SUMMIT #" + $issue + " Execution Report\n\n**Runner:** GH Actions → Hetzner (summit user, Tier 1 Max OAuth preferred)\n\n### Output tail (last 8KB)\n\n```\n" + .[-7500:] + "\n```\n")}' < /tmp/output_tail.txt > /tmp/result_comment.json
          curl -s -X POST -H "Authorization: token $GH_PAT" -H "Content-Type: application/json" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}/comments" --data @/tmp/result_comment.json -o /dev/null -w "Comment POST: %{http_code}\n"

          echo "=== SUMMIT #${ISSUE} COMPLETE ==="

      - name: Write terminal state to Supabase summit_chat_dispatch
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ISSUE: ${{ matrix.issue }}
          JOB_STATUS: ${{ job.status }}
        run: |
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # job.status is 'success', 'failure', or 'cancelled'
          case "$JOB_STATUS" in
            success)   NEW_STATE="awaiting_verification" ;;
            failure)   NEW_STATE="failed" ;;
            cancelled) NEW_STATE="failed" ;;
            *)         NEW_STATE="failed" ;;
          esac
          COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD=$(jq -nc --arg url "$WORKFLOW_URL" --arg state "$NEW_STATE" --arg completed "$COMPLETED_AT" --arg status "$JOB_STATUS" --arg run_id "${{ github.run_id }}" --arg issue "$ISSUE" '{workflow_run_id:($run_id|tonumber), workflow_run_url:$url, state:$state, completed_at:$completed, delivery_proof:{smoke_test:{gha_conclusion:$status, gha_run_id:($run_id|tonumber), gha_url:$url, issue_number:($issue|tonumber), verified_at:$completed}}, last_error:(if $status != "success" then "GHA job status: \($status)" else null end)}')
          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/summit_chat_dispatch?github_issue_number=eq.${ISSUE}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD" \
            -o /tmp/patch_resp.txt -w "Supabase PATCH (terminal): HTTP %{http_code}\n"
          cat /tmp/patch_resp.txt
          echo "Final state for issue ${ISSUE}: ${NEW_STATE}"
