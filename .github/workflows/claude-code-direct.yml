name: Claude Code Direct — Parallel SUMMITs
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers'
        required: true
        default: '379'
jobs:
  run-claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Run Claude Code on Hetzner for issue ${{ matrix.issue }}
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ISSUE: ${{ matrix.issue }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Setup workspace ==="
          $SSH "mkdir -p /root/summit-${ISSUE} && cd /root/summit-${ISSUE} &&             (test -d zonewise-web/.git && cd zonewise-web && git pull ||             git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git) &&             cd zonewise-web && git config user.email 'claude-code@biddeed.ai' && git config user.name 'Claude Code'"

          echo "=== Verify OAuth is alive (DO NOT delete credentials) ==="
          $SSH "test -f /root/.claude/credentials.json && echo 'OAuth credentials found' || test -f /root/.claude/.credentials.json && echo 'OAuth credentials found' || echo 'WARNING: No OAuth credentials'"

          echo "=== Run Claude Code on SUMMIT #${ISSUE} (using Max plan OAuth) ==="
          $SSH "cd /root/summit-${ISSUE}/zonewise-web &&             export SUPABASE_ACCESS_TOKEN='${SUPABASE_ACCESS_TOKEN}' &&             export GH_PAT='${GH_PAT}' &&             claude -p 'Read GitHub issue #${ISSUE} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${ISSUE} using: curl -s -H \"Authorization: token ${GH_PAT}\" https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE} | jq .body. Also read all comments: curl -s -H \"Authorization: token ${GH_PAT}\" https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE}/comments | jq .[].body. Then execute ALL tasks. Follow CLAUDE.md. Wire fl_parcels (9.4M rows) to the frontend. Commit and push frequently. Comment on the issue when done.'             --allowedTools 'Bash(*)' 'Read' 'Write' 'Edit'             2>&1 | tail -500" || echo "Claude Code session ended"

          echo "=== SUMMIT #${ISSUE} COMPLETE ==="
