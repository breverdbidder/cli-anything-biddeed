name: "Summit: AUTOLOOP HyperAgents Upgrade — Staged Eval + Diff Lineage"

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Max session minutes'
        required: false
        default: '60'
      dry_run:
        description: 'Dry run (show prompt only, no Claude Code)'
        required: false
        type: boolean
        default: false

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed
  BRANCH: feat/autoloop-hyperagents-upgrade

jobs:
  summit:
    name: "⛰️ Summit: AUTOLOOP HyperAgents Upgrade"
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "1️⃣ Preflight — pull repo + checkout branch"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              cd /opt/biddeed
              git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
            fi

            cd ${{ env.REPO_PATH }}
            git fetch origin
            git checkout ${{ env.BRANCH }} || git checkout -b ${{ env.BRANCH }} origin/${{ env.BRANCH }}
            git reset --hard origin/${{ env.BRANCH }}
            echo "📦 HEAD: $(git log --oneline -1)"

            # Verify Claude Code
            command -v claude &>/dev/null || npm install -g @anthropic-ai/claude-code
            claude --version 2>/dev/null || true

            # Verify AUTOLOOP structure
            test -f scripts/eval_runner.py && echo "✅ eval_runner.py"
            test -f AUTOLOOP.md            && echo "✅ AUTOLOOP.md"
            test -f specs/AUTOLOOP-HYPERAGENTS.md && echo "✅ AUTOLOOP-HYPERAGENTS.md spec"
            ls eval/*/eval.json 2>/dev/null && echo "✅ eval.json files found" || echo "⚠️ No eval.json files"

            echo "✅ Preflight complete"

      - name: "2️⃣ Upload prompt"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cat > /opt/biddeed/autoloop-hyperagents-prompt.md << 'PROMPTEOF'
            You are working on the cli-anything-biddeed AUTOLOOP system.

            Read specs/AUTOLOOP-HYPERAGENTS.md FIRST. It is your session directive — contains the full spec, implementation steps, verification checklist, and reference code from Meta's HyperAgents.

            Also read CLAUDE.md (root directive) and AUTOLOOP.md for existing context.

            ## SESSION GOAL

            Implement two HyperAgents-inspired upgrades to AUTOLOOP:
            1. Staged Eval Gating — run 5 of 25 assertions first, skip full eval if <4 pass
            2. Git Diff Lineage — save every SKILL.md mutation as .diff + archive.jsonl

            ## EXECUTION ORDER

            Follow the 12 implementation steps in specs/AUTOLOOP-HYPERAGENTS.md exactly:
            - Steps 1-5: Staged Eval Gating
            - Steps 6-12: Git Diff Lineage

            ## COMMIT PATTERN

            One commit per logical unit. Push after each commit:
            ```
            git add -A && git commit -m "feat(autoloop): <description>" && git push origin feat/autoloop-hyperagents-upgrade
            ```

            Expected commits:
            1. `feat(autoloop): add staged eval gating with 5-of-25 sampling`
            2. `test(autoloop): staged eval gating tests`
            3. `feat(autoloop): add git diff lineage tracking`
            4. `feat(autoloop): add rollback_to_ancestor utility`
            5. `test(autoloop): diff lineage tests`
            6. `docs(autoloop): update AUTOLOOP.md with new flow`

            ## RULES

            - You are autonomous. The human is not available. Never ask questions.
            - Use ONLY stdlib: difflib, hashlib, json, os, random, datetime. NO new pip deps.
            - Run existing tests after each change: `python3 -m pytest tests/ -x -q 2>&1 | tail -20`
            - If context window reaches 50%, stop and push what you have.
            - Do NOT refactor unrelated code. Targeted changes only.
            - Do NOT modify eval.json files.
            - Do NOT touch the GHA autoloop.yml workflow (that's a separate PR).
            - Branch: feat/autoloop-hyperagents-upgrade (already checked out).
            - Total session budget: under $5. Be efficient.

            ## VERIFICATION

            After all changes, run:
            ```bash
            # Verify staged eval
            python3 -c "
            from scripts.eval_runner import staged_eval
            result = staged_eval('eval/zonewise/eval.json', iteration=1)
            print(f'Staged: {result[\"pass_count\"]}/{result[\"total\"]} passed={result[\"passed\"]}')
            " 2>&1

            # Verify diff lineage
            python3 -c "
            from scripts.eval_runner import save_diff, load_archive
            diff_file = save_diff('zonewise', 1, 'old content', 'new content', 'PASS')
            print(f'Diff saved: {diff_file}')
            archive = load_archive('zonewise')
            print(f'Archive entries: {len(archive)}')
            " 2>&1

            # Existing tests still pass
            python3 -m pytest tests/ -x -q 2>&1 | tail -5
            ```
            PROMPTEOF

            wc -c /opt/biddeed/autoloop-hyperagents-prompt.md
            echo "✅ Prompt uploaded"

      - name: "3️⃣ Execute Claude Code auto-mode"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: ${{ github.event.inputs.max_minutes || '60' }}m
          envs: CLAUDE_CODE_OAUTH_TOKEN
          script: |
            cd ${{ env.REPO_PATH }}

            # Configure git for commits
            git config user.email "claude@biddeed.ai"
            git config user.name "Claude Code (AUTOLOOP HyperAgents)"
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git

            # OAuth token for Claude Code
            if [ -n "${{ secrets.CLAUDE_OAUTH_B64 }}" ]; then
              echo "${{ secrets.CLAUDE_OAUTH_B64 }}" | base64 -d > /tmp/claude-oauth-token
              export CLAUDE_CODE_OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            fi

            PROMPT_FILE=/opt/biddeed/autoloop-hyperagents-prompt.md
            LOG="specs/summit_autoloop_hyperagents_$(date +%Y%m%d_%H%M%S).log"

            echo "⛰️ Summit: AUTOLOOP HyperAgents | $(date) | Max: ${{ github.event.inputs.max_minutes || '60' }}m"
            IS_SANDBOX=1 claude -p "$(cat $PROMPT_FILE)" --dangerously-skip-permissions 2>&1 | tee "$LOG" || true
            echo "⏰ Session ended: $(date)"

            # Push any remaining changes
            git add -A
            git diff --cached --quiet || {
              git commit -m "summit(autoloop): HyperAgents upgrade session complete $(date +%Y%m%d_%H%M%S)"
              git push origin ${{ env.BRANCH }}
            } || true

            # Count commits from this session
            COMMITS=$(git log --oneline --since="2 hours ago" --grep="autoloop" | wc -l)
            echo "📊 Commits this session: $COMMITS"

      - name: "4️⃣ Post-session verify"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            git checkout ${{ env.BRANCH }}

            echo "=== Post-Session Verification ==="

            # 1. Check staged_eval function exists
            echo "--- Staged Eval ---"
            python3 -c "from scripts.eval_runner import staged_eval; print('✅ staged_eval importable')" 2>&1 || echo "❌ staged_eval not found"

            # 2. Check diff lineage functions exist
            echo "--- Diff Lineage ---"
            python3 -c "from scripts.eval_runner import save_diff, load_archive; print('✅ save_diff + load_archive importable')" 2>&1 || echo "❌ diff lineage functions not found"

            # 3. Check diff directory structure
            echo "--- Diff Directories ---"
            find eval/ -name "diffs" -type d 2>/dev/null && echo "✅ diffs/ dirs exist" || echo "⚠️ No diffs/ dirs yet"
            find eval/ -name "archive.jsonl" 2>/dev/null && echo "✅ archive.jsonl files exist" || echo "⚠️ No archive.jsonl yet"

            # 4. Run tests
            echo "--- Test Suite ---"
            python3 -m pytest tests/ -x -q 2>&1 | tail -10 || echo "⚠️ Tests had failures"

            # 5. Count new test files
            echo "--- New Tests ---"
            find eval/ -name "test_staged_eval*" -o -name "test_diff_lineage*" 2>/dev/null | head -10

            # 6. Session commits
            echo "--- Session Commits ---"
            git log --oneline --since="2 hours ago" 2>/dev/null | head -10

      - name: "5️⃣ Create PR"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}

            # Create PR via GitHub API
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/pulls" \
              -d '{
                "title": "feat(autoloop): HyperAgents-inspired staged eval gating + diff lineage",
                "body": "## What\nTwo patterns from Meta HyperAgents adapted for AUTOLOOP:\n1. **Staged eval gating**: Run 5 random assertions first, skip full 25 if <4 pass\n2. **Git diff lineage**: Save every SKILL.md mutation as .diff + archive.jsonl\n\n## Why\n- 60-75% token savings on bad mutations\n- Full mutation history with rollback to any ancestor\n\n## Reference\ngithub.com/facebookresearch/hyperagents\n\nDeployed by SUMMIT dispatch.",
                "head": "feat/autoloop-hyperagents-upgrade",
                "base": "main"
              }' 2>&1 | python3 -c "
            import sys,json
            try:
              d=json.load(sys.stdin)
              print(f'✅ PR #{d.get(\"number\",\"?\")} created: {d.get(\"html_url\",\"?\")}')
            except:
              print('⚠️ PR creation failed or already exists')
            "

      - name: "6️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            cd ${{ env.REPO_PATH }}
            STATUS="${{ job.status }}"
            EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
            COMMITS=$(git log --oneline --since="2 hours ago" --grep="autoloop" | wc -l)
            HEAD=$(git log --oneline -1)

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              -d "text=${EMOJI} <b>Summit: AUTOLOOP HyperAgents Upgrade</b>
            Status: ${STATUS}
            Commits: ${COMMITS}
            HEAD: ${HEAD}
            Branch: ${{ env.BRANCH }}
            Server: Hetzner
            Mode: Claude Code auto
            Features: Staged Eval Gating + Diff Lineage" \
              > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ⛰️ Summit: AUTOLOOP HyperAgents Upgrade
          **Status:** ${{ job.status }}
          **Server:** Hetzner everest-dispatch
          **Branch:** ${{ env.BRANCH }}
          **Mode:** Claude Code auto (${{ github.event.inputs.max_minutes || '60' }}m max)
          **Dry Run:** ${{ github.event.inputs.dry_run || 'false' }}

          ### Features
          1. **Staged Eval Gating** — Run 5/25 assertions first, skip full eval on early failure
          2. **Git Diff Lineage** — Save .diff per mutation + archive.jsonl for rollback

          ### Expected Commits
          1. \`feat(autoloop): add staged eval gating with 5-of-25 sampling\`
          2. \`test(autoloop): staged eval gating tests\`
          3. \`feat(autoloop): add git diff lineage tracking\`
          4. \`feat(autoloop): add rollback_to_ancestor utility\`
          5. \`test(autoloop): diff lineage tests\`
          6. \`docs(autoloop): update AUTOLOOP.md with new flow\`

          ### Reference
          Meta HyperAgents: github.com/facebookresearch/hyperagents
          EOF
