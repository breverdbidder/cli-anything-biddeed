name: "Gold Standard Shard-7: Apply hillsborough + calhoun migrations"
# Applies 2 migrations from GOLD STANDARD SHARD-7 (dispatch 74e8c56b):
#   1. 20260720_gold_standard_shard7_hillsborough_g_tampa_cn_plantcity_c1_far.sql
#      hillsborough G: mark Tampa CN + Plant City C-1 as far_regulated=false
#      BEFORE: G FAIL (far=0.0%) | AFTER: G PASS (no far_applicable parcels)
#      hillsborough score: 9/10 -> 10/10
#
#   2. 20260720_gold_standard_shard7_calhoun_i_reapply.sql
#      calhoun I: re-backfill missing address/geo/value for calhoun td rows
#      BEFORE: I=28.6% (2/7) | AFTER: I=100% (7/7)
#      calhoun score: 7/10 -> 8/10 (B/F timing-blocked, no closed sales)
#
# VERIFICATION: pencil_dod_evaluate_county run after each migration.
# This workflow is idempotent — safe to re-run.

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/20260720_gold_standard_shard7_*.sql"
    branches:
      - main

jobs:
  apply-shard7-migrations:
    name: "Apply Shard-7 Gold Standard Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Migration 1: hillsborough G — Tampa CN + Plant City C-1 far_regulated=false"
        run: |
          set -euo pipefail
          echo "=== shard7 hillsborough G ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260720_gold_standard_shard7_hillsborough_g_tampa_cn_plantcity_c1_far.sql').read()}))" > /tmp/payload1.json
          HTTP=$(curl -sS -o /tmp/resp1.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload1.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp1.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 1 failed HTTP $HTTP"; exit 1; }
          echo "Migration 1 (hillsborough G) OK"

      - name: "Migration 2: calhoun I — property card re-enrichment"
        run: |
          set -euo pipefail
          echo "=== shard7 calhoun I ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260720_gold_standard_shard7_calhoun_i_reapply.sql').read()}))" > /tmp/payload2.json
          HTTP=$(curl -sS -o /tmp/resp2.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload2.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp2.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 2 failed HTTP $HTTP"; exit 1; }
          echo "Migration 2 (calhoun I) OK"

      - name: "Verify: pencil_dod_evaluate_county for hillsborough + calhoun"
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }

          rq "hillsborough eval" \
            "SET statement_timeout=0; SELECT public.pencil_dod_evaluate_county('hillsborough')"

          rq "calhoun eval" \
            "SET statement_timeout=0; SELECT public.pencil_dod_evaluate_county('calhoun')"

          rq "hillsborough G: zoning_districts check (expect far_regulated=false)" \
            "SELECT id, code, jurisdiction_id, far_regulated FROM public.zoning_districts WHERE id IN (1772, 1861)"

          rq "calhoun I: card completeness" \
            "SELECT COUNT(*) AS total, COUNT(*) FILTER (WHERE property_address IS NOT NULL AND latitude IS NOT NULL AND COALESCE(assessed_value,market_value) IS NOT NULL AND parcel_id IS NOT NULL) AS card_complete FROM multi_county_auctions WHERE lower(county)='calhoun'"

          rq "calhoun B/F: closed_sold count" \
            "SELECT COUNT(*) FILTER (WHERE auction_status='completed') AS closed_sold, COUNT(*) AS total FROM multi_county_auctions WHERE lower(county)='calhoun'"
