name: "Summit: DesignWise P4b — Remaining 4 Agents"
on:
  workflow_dispatch: {}

jobs:
  p4b-execute:
    name: "P4b CodeWise A11y Support Stitch"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main && git checkout main && git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web

            cat > /tmp/p4b-prompt.txt << 'PROMPT_END'
            MISSION DesignWise P4b. Four agents remain below 8.5 target.
            Read docs/plans/DESIGNWISE-TODO.md first.

            AGENT 1 CodeWise 7.5 to 8.5. Unit tests. MOST IMPORTANT.
            bun add -D vitest @testing-library/react @testing-library/jest-dom jsdom.
            Create vitest.config.ts with jsdom environment.
            Find top 4 largest component files in components directory.
            Write a test file for each that verifies it renders without crashing.
            Use simple smoke tests not complex interaction tests.
            Add test script to package.json.
            Verify bun run test passes.
            Commit and push immediately.

            AGENT 2 A11yWise 7.5 to 8.5. ARIA and contrast.
            Search components/explorer for tooltip or popup components.
            Add role tooltip and aria-describedby where missing.
            Search for button elements in explorer components.
            Add aria-label to buttons that only have icons.
            In globals.css find text-slate-500 on dark backgrounds.
            Change to text-slate-400 for better contrast ratio.
            Commit and push.

            AGENT 3 SupportWise 7.0 to 8.5. Onboarding.
            Check components/onboarding directory. It has OnboardingProvider and related files.
            Build on existing infrastructure. Do not install new packages.
            Add 5 tour steps to the existing system or create lightweight overlay.
            Steps are Welcome then Explorer map then Chat input then Layers then Pricing.
            Store completion flag in localStorage.
            Commit and push.

            AGENT 4 StitchWise 5.0 to 8.5. Design system doc.
            Read globals.css and tailwind.config.ts to extract actual design tokens.
            Create .stitch/DESIGN.md documenting the real design system.
            Include colors spacing typography border-radius component patterns.
            Create .stitch/generated/sample-component-spec.md as proof of concept.
            Create lib/stitch-usage.ts with a logStitchEvent function.
            Commit and push.

            RULES.
            Git config ci@biddeed.ai BidDeed-CI.
            Git remote use https with x-access-token and GH_PAT at github.com/breverdbidder/zonewise-web.git.
            Commit after EACH agent completed. Push to main each time.
            Update docs/plans/DESIGNWISE-TODO.md marking completed tasks.
            BUILD GATE bun run build must pass after every commit.
            If build breaks fix it before moving to next agent.
            If context reaches 50 percent commit push and stop.
            Send Telegram summary listing completed agents.
            Cost max 10 dollars. GO.
            PROMPT_END

            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='${OAUTH_TOKEN}'
              export SUPABASE_URL='${SUPABASE_URL}'
              export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='${GH_PAT}'
              export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
              export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'
              cd /opt/biddeed/zonewise-web
              claude --print --dangerously-skip-permissions < /tmp/p4b-prompt.txt
            "
