name: Daily Action Plan (6:00 AM EST)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  action-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate HTML action plan
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, json, os, base64
          from datetime import datetime, timezone, timedelta

          GH = os.environ["GH_PAT"]
          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          EST = timezone(timedelta(hours=-5))
          NOW = datetime.now(EST)
          TODAY = NOW.strftime("%Y-%m-%d")
          YESTERDAY = (NOW - timedelta(days=1)).strftime("%Y-%m-%d")
          DAY_NAME = NOW.strftime("%A, %B %d, %Y")
          sb = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json", "Prefer": "return=representation"}
          gh = lambda u: requests.get(u, headers={"Authorization": f"token {GH}"}, timeout=15).json()

          # Pull yesterday's open items
          open_items = []
          try:
              r = requests.get(f"{SB_URL}/rest/v1/daily_checkpoints?date=eq.{YESTERDAY}&status=neq.completed&order=priority.asc", headers=sb, timeout=10)
              if r.status_code == 200: open_items = r.json()
          except: pass

          # Pull blocked items (any date)
          blocked = []
          try:
              r = requests.get(f"{SB_URL}/rest/v1/daily_checkpoints?status=eq.blocked&order=date.desc&limit=10", headers=sb, timeout=10)
              if r.status_code == 200: blocked = r.json()
          except: pass

          # Pull weekly scores
          scores = []
          try:
              r = requests.get(f"{SB_URL}/rest/v1/daily_scores?order=date.desc&limit=7", headers=sb, timeout=10)
              if r.status_code == 200: scores = r.json()
          except: pass

          # Pull Nexus P0/P1
          nexus = []
          try:
              r = requests.get(f"{SB_URL}/rest/v1/nexus_tasks?status=in.(queued,dispatched,running)&order=priority.asc&limit=10", headers=sb, timeout=10)
              if r.status_code == 200: nexus = r.json()
          except: pass

          # Stale repos
          stale = []
          for repo in ["everest-stack","cli-anything-biddeed","brevard-bidder-scraper","zonewise-web","everest-nexus","biddeed-ai"]:
              try:
                  c = gh(f"https://api.github.com/repos/breverdbidder/{repo}/commits?per_page=1")
                  if isinstance(c, list) and c:
                      last = datetime.fromisoformat(c[0]["commit"]["author"]["date"].replace("Z","+00:00"))
                      age = (datetime.now(timezone.utc) - last).days
                      if age > 7: stale.append({"repo": repo, "days": age})
              except: pass

          # Build ranked actions
          actions = []
          rank = 1
          for item in blocked:
              actions.append({"rank": rank, "icon": "🔴", "label": "UNBLOCK",
                  "task": item.get("task","")[:80], "domain": item.get("domain",""),
                  "reason": "Blocked items compound — unblock before new work",
                  "since": item.get("date","?")})
              rank += 1
          for item in open_items:
              if item.get("status") == "in_progress":
                  actions.append({"rank": rank, "icon": "🔄", "label": "FINISH",
                      "task": item.get("task","")[:80], "domain": item.get("domain",""),
                      "reason": "Half-done work = zero value. Complete before starting new."})
                  rank += 1
          for t in nexus:
              if t.get("priority") in ("P0","P1"):
                  actions.append({"rank": rank, "icon": "⚡", "label": t.get("priority","P1"),
                      "task": t.get("description","")[:80], "domain": t.get("project","ECOSYSTEM"),
                      "reason": f"SLA: {'2hr' if t.get('priority')=='P0' else '24hr'}"})
                  rank += 1
          for s in stale:
              actions.append({"rank": rank, "icon": "🧹", "label": "STALE",
                  "task": f"{s['repo']} — {s['days']} days without commits", "domain": "ECOSYSTEM",
                  "reason": "Stale repos = abandoned work = tech debt"})
              rank += 1
          for item in open_items:
              if item.get("status") == "pending":
                  actions.append({"rank": rank, "icon": "⏳", "label": "PENDING",
                      "task": item.get("task","")[:80], "domain": item.get("domain",""),
                      "reason": "Carried forward — becomes blocked if ignored"})
                  rank += 1

          # Pattern analysis
          patterns = []
          if len(scores) >= 3:
              rates = [s.get("completion_rate", 0) for s in scores[:3]]
              avg = sum(rates)/len(rates)
              if avg < 50: patterns.append(("📉", "Completion rate below 50% for 3 days", "Too many items or scope creep — reduce daily scope"))
              trend = (rates[0] or 0) - (rates[-1] or 0)
              if trend < -20: patterns.append(("📉", "Completion rate dropping", "Consider reducing daily scope"))
              elif trend > 20: patterns.append(("📈", "Completion rate improving", "Momentum building — keep focus"))
              worst_counts = {}
              for s in scores:
                  w = s.get("worst_domain","")
                  if w: worst_counts[w] = worst_counts.get(w,0)+1
              for d,c in worst_counts.items():
                  if c >= 3: patterns.append(("🔴", f"{d} weakest 3+ days in a row", "Systemic issue — needs dedicated session"))

          # Trend chart data
          trend_html = ""
          if scores:
              max_rate = max(s.get("completion_rate",0) for s in scores) or 100
              bars = ""
              for s in reversed(scores[:7]):
                  r = s.get("completion_rate", 0)
                  h = max(4, int(r / max_rate * 60))
                  color = "#22c55e" if r >= 80 else "#F59E0B" if r >= 50 else "#ef4444"
                  date_short = s.get("date","")[-5:]
                  bars += f'<div style="text-align:center;flex:1"><div style="background:{color};height:{h}px;border-radius:3px;margin:0 2px"></div><div style="font-size:9px;color:#64748b;margin-top:4px">{date_short}</div><div style="font-size:10px;color:#94a3b8">{r}%</div></div>'
              trend_html = f'<div class="card"><div class="ch">📈 7-Day Trend</div><div style="display:flex;align-items:flex-end;height:80px;padding-top:10px">{bars}</div></div>'

          # Actions HTML
          actions_html = ""
          if actions:
              for a in actions[:10]:
                  label_bg = "#ef444433" if a["label"]=="UNBLOCK" else "#F59E0B33" if a["label"] in ("FINISH","P0","P1") else "#1e293b"
                  label_color = "#fca5a5" if a["label"]=="UNBLOCK" else "#fde68a" if a["label"] in ("FINISH","P0","P1") else "#94a3b8"
                  actions_html += f"""
                  <div class="action">
                    <div class="rank">{a["rank"]}</div>
                    <div class="abody">
                      <div class="atop"><span class="badge" style="background:{label_bg};color:{label_color}">{a["icon"]} {a["label"]}</span><span class="adomain">{a["domain"]}</span></div>
                      <div class="atask">{a["task"]}</div>
                      <div class="areason">{a["reason"]}</div>
                    </div>
                  </div>"""
          else:
              actions_html = '<div class="clean">✅ No open items — clean slate today!</div>'

          patterns_html = ""
          if patterns:
              for icon, title, detail in patterns:
                  patterns_html += f'<div class="pattern"><span>{icon}</span><div><strong>{title}</strong><br><span style="color:#94a3b8;font-size:11px">{detail}</span></div></div>'

          stale_html = ""
          if stale:
              stale_html = '<div class="alert">🧹 <strong>Stale repos:</strong> ' + ", ".join(f'{s["repo"]} ({s["days"]}d)' for s in stale) + '</div>'

          html = f"""<!DOCTYPE html>
          <html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Action Plan — {TODAY}</title>
          <style>
          *{{margin:0;padding:0;box-sizing:border-box}}
          body{{background:#020617;color:#f8fafc;font-family:Inter,-apple-system,sans-serif;padding:16px;max-width:800px;margin:0 auto}}
          h1{{font-size:20px;font-weight:800;background:linear-gradient(135deg,#3b82f6,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent}}
          .sub{{color:#94a3b8;font-size:12px;margin-bottom:16px}}
          .summary{{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}}
          .sbox{{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 14px;flex:1;min-width:100px;text-align:center}}
          .sbox .n{{font-size:20px;font-weight:800}}.sbox .l{{font-size:9px;color:#64748b;text-transform:uppercase;margin-top:2px}}
          .card{{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px 14px;margin-bottom:10px}}
          .ch{{font-weight:700;font-size:14px;margin-bottom:8px}}
          .action{{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #1e293b33}}
          .action:last-child{{border-bottom:none}}
          .rank{{background:#1E3A5F;color:#F59E0B;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}}
          .abody{{flex:1}}
          .atop{{display:flex;align-items:center;gap:8px;margin-bottom:4px}}
          .badge{{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}}
          .adomain{{color:#64748b;font-size:11px}}
          .atask{{font-size:13px;color:#e2e8f0;margin-bottom:2px}}
          .areason{{font-size:11px;color:#64748b;font-style:italic}}
          .clean{{background:#22c55e22;border:1px solid #22c55e44;border-radius:8px;padding:16px;text-align:center;font-size:14px;color:#86efac}}
          .pattern{{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1e293b33;font-size:13px}}
          .alert{{background:#ef444422;border-left:3px solid #ef4444;padding:10px 12px;margin-bottom:10px;color:#fca5a5;font-size:12px;border-radius:4px}}
          .ft{{text-align:center;color:#475569;font-size:10px;margin-top:20px;padding-top:12px;border-top:1px solid #1e293b}}
          </style></head><body>
          <h1>🌅 Daily Action Plan</h1>
          <p class="sub">{DAY_NAME} — Ariel Shapira — Everest Capital USA</p>
          <div class="summary">
            <div class="sbox"><div class="n" style="color:#F59E0B">{len(open_items)}</div><div class="l">Open Items</div></div>
            <div class="sbox"><div class="n" style="color:#ef4444">{len(blocked)}</div><div class="l">Blocked</div></div>
            <div class="sbox"><div class="n" style="color:#3b82f6">{sum(1 for t in nexus if t.get('priority') in ('P0','P1'))}</div><div class="l">P0/P1 Tasks</div></div>
            <div class="sbox"><div class="n" style="color:#a78bfa">{len(actions)}</div><div class="l">Actions Today</div></div>
          </div>
          {trend_html}
          {stale_html}
          <div class="card"><div class="ch">🎯 Ranked Actions</div>{actions_html}</div>
          {"<div class='card'><div class='ch'>🔍 Pattern Analysis</div>" + patterns_html + "</div>" if patterns else ""}
          <div class="ft">BidDeed.AI Action Plan System — Auto-generated {NOW.strftime('%I:%M %p EST')}</div>
          </body></html>"""

          with open("/tmp/action-plan.html", "w") as f:
              f.write(html)

          # Push to CF Pages
          fname = f"action-plan-{TODAY}.html"
          content_b64 = base64.b64encode(html.encode()).decode()
          existing = requests.get(
              f"https://api.github.com/repos/breverdbidder/brevard-bidder-landing/contents/reports/{fname}",
              headers={"Authorization": f"token {GH}"}, timeout=10)
          payload = {"message": f"action-plan: {TODAY}", "content": content_b64}
          if existing.status_code == 200: payload["sha"] = existing.json()["sha"]
          r = requests.put(
              f"https://api.github.com/repos/breverdbidder/brevard-bidder-landing/contents/reports/{fname}",
              headers={"Authorization": f"token {GH}", "Content-Type": "application/json"},
              json=payload, timeout=15)
          url = f"https://brevard-bidder-landing.pages.dev/reports/{fname}" if r.status_code in (200,201) else "push_failed"

          # Store actions to Supabase
          for a in actions:
              try:
                  requests.post(f"{SB_URL}/rest/v1/daily_action_plans",
                      json={"date": TODAY, "rank": a["rank"], "task": a["task"],
                            "domain": a["domain"], "reason": a.get("reason","")},
                      headers=sb, timeout=10)
              except: pass

          with open("/tmp/tg_msg.txt", "w") as f:
              f.write(f"🌅 *Action Plan: {TODAY}*\n\n")
              f.write(f"📋 {len(actions)} actions ranked\n")
              f.write(f"🔴 {len(blocked)} blocked | 🔄 {len(open_items)} open\n\n")
              for a in actions[:5]:
                  f.write(f"{a['rank']}. {a['icon']} {a['task'][:50]}\n")
              if len(actions) > 5: f.write(f"...+{len(actions)-5} more\n")
              f.write(f"\n👉 [View Full Report]({url})")

          print(f"Report: {url}")
          PYSCRIPT

      - name: Telegram with report link
        if: always()
        run: |
          MSG=$(cat /tmp/tg_msg.txt 2>/dev/null || echo "🌅 Action plan generated")
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="false" > /dev/null
