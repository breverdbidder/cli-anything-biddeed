name: biddeed-reels-daily
# BidDeed Reels pipeline v1 (issue #19736) -- daily short-form reel
# generation for every property sold to a THIRD PARTY at a Florida auction
# the previous day (statewide). GENERATES AND STAGES ONLY: every row lands
# at status='pending_approval' or 'error' (see scripts/biddeed_reels_lib.py
# and scripts/biddeed_reels_pipeline.py). This workflow never posts to a
# social platform and never sends anything to anyone.
#
# CRON TIMING: public.auction_buyer_sightings.buyer_type is populated by the
# winnerdata-daily pipeline (winnerdata_pipeline.py / realauction_winner_harvest.py),
# which runs at 00:00 UTC (primary) and 04:00 UTC (midnight-ET catch-up) --
# see that workflow's own header for the timing analysis. 11:00 UTC here is
# >=1h clear of BOTH passes (7h after the later 04:00 UTC catch-up), and
# also runs after winnerdata-daily-winner-ff-digest.yml's 10:00 UTC build so
# the day's third-party sightings are as complete as they're going to get
# before this queries them.
on:
  workflow_dispatch:
    inputs:
      auction_date:
        description: 'YYYY-MM-DD, defaults to yesterday (UTC) if blank'
        required: false
        default: ''
      force:
        description: 'Re-render rows that already have a video_url'
        required: false
        default: 'false'
      days_back:
        description: 'Backfill mode: process ALL candidates (foreclosure 3rd-party + tax_deed direct from multi_county_auctions) in [today-N, yesterday]. Overrides auction_date.'
        required: false
        default: ''
      min_sold:
        description: 'Skip candidates with sold_amount below this (filters sub-$5k raw-land tax certificates). Blank = no floor.'
        required: false
        default: ''
  schedule:
    - cron: "0 11 * * *"    # 7:00 AM EDT / 6:00 AM EST (11:00 UTC)
# Concurrency keyed per auction_date so backfill batches for different dates run
# in PARALLEL instead of serializing (and instead of a newer pending dispatch
# silently cancelling an older pending one -- which is how the 2026-08-25 batch
# died on 2026-09-03). Scheduled runs share one 'scheduled' group as before.
concurrency: {group: "biddeed-reels-daily-${{ github.event.inputs.days_back && format('backfill-{0}', github.event.inputs.days_back) || github.event.inputs.auction_date || 'scheduled' }}", cancel-in-progress: false}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Run BidDeed Reels pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # T3 directive #3: OpenRouter (primary vision provider) + the
          # claude-router proxy key (final vision fallback). Neither secret
          # exists as a GH Actions secret yet -- both evaluate to an empty
          # string here, which resolve_key() in main() already treats the
          # same as "unset" and falls through to a live vault fetch (same
          # mechanism this pipeline already relies on for ROUTER_PROXY_KEY
          # today). Wiring the secret name here now means a future GH secret
          # add "just works" with no further workflow change.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ROUTER_PROXY_KEY: ${{ secrets.ROUTER_PROXY_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.auction_date }}" ]; then
            ARGS="$ARGS --auction-date ${{ github.event.inputs.auction_date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.days_back }}" ]; then
            ARGS="$ARGS --days-back ${{ github.event.inputs.days_back }}"
          fi
          if [ -n "${{ github.event.inputs.min_sold }}" ]; then
            ARGS="$ARGS --min-sold ${{ github.event.inputs.min_sold }}"
          fi
          python scripts/biddeed_reels_pipeline.py $ARGS
