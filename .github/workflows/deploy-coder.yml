name: "SUMMIT: Deploy Coder Workspaces"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Deployment phase'
        required: true
        default: 'all'
        type: choice
        options:
          - install
          - verify
          - all

jobs:
  deploy-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy Coder to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP '
            set -e
            echo "=== SUMMIT: Coder Workspaces Deployment ==="
            PHASE="${{ github.event.inputs.phase }}"

            if [ "$PHASE" = "install" ] || [ "$PHASE" = "all" ]; then
              echo ">>> Phase 1: Installing Coder via Docker Compose"
              mkdir -p /home/claude/coder && cd /home/claude/coder

              if [ ! -f docker-compose.yaml ]; then
                curl -L https://raw.githubusercontent.com/coder/coder/main/compose.yaml -o docker-compose.yaml
              fi

              DOCKER_GID=$(getent group docker | cut -d: -f3 || echo "999")
              echo "Docker GID: $DOCKER_GID"

              export CODER_ACCESS_URL="http://87.99.129.125:3000"
              export CODER_TELEMETRY_ENABLE="false"

              docker compose up -d 2>&1 || docker-compose up -d 2>&1
              sleep 15

              CODER_VER=$(curl -s http://localhost:3000/api/v2/buildinfo 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get(\"version\",\"UNK\"))" 2>/dev/null || echo "PENDING")
              echo "Coder version: $CODER_VER"
            fi

            if [ "$PHASE" = "verify" ] || [ "$PHASE" = "all" ]; then
              echo ">>> Verification"
              CODER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v2/buildinfo 2>/dev/null || echo "000")
              echo "Coder API status: $CODER_STATUS"

              if [ "$CODER_STATUS" = "200" ]; then
                echo "✅ Coder server is LIVE at http://87.99.129.125:3000"
              else
                echo "❌ Coder not responding"
                docker ps -a --filter "name=coder" --format "table {{.Names}}\t{{.Status}}" 2>/dev/null || true
                docker compose -f /home/claude/coder/docker-compose.yaml logs --tail 20 2>/dev/null || true
              fi

              docker ps --filter "name=coder" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || true
            fi

            echo "=== SUMMIT: Coder deployment complete ==="
          '
