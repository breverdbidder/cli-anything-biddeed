name: "SUMMIT: Deploy Coder Workspaces"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Deployment phase'
        required: true
        default: 'verify'
        type: choice
        options:
          - install
          - verify
          - setup-admin
          - all

jobs:
  deploy-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy Coder to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP '
            set -e
            echo "=== SUMMIT: Coder Workspaces ==="
            PHASE="${{ github.event.inputs.phase }}"

            if [ "$PHASE" = "install" ] || [ "$PHASE" = "all" ]; then
              echo ">>> Install"
              mkdir -p /home/claude/coder && cd /home/claude/coder
              if [ ! -f docker-compose.yaml ]; then
                curl -L https://raw.githubusercontent.com/coder/coder/main/compose.yaml -o docker-compose.yaml
              fi
              docker compose up -d 2>&1
              sleep 20
            fi

            if [ "$PHASE" = "verify" ] || [ "$PHASE" = "all" ]; then
              echo ">>> Verify"
              # Check both port 3000 and 7080
              for PORT in 7080 3000; do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$PORT/api/v2/buildinfo 2>/dev/null || echo "000")
                if [ "$STATUS" = "200" ]; then
                  VER=$(curl -s http://localhost:$PORT/api/v2/buildinfo | python3 -c "import sys,json;print(json.load(sys.stdin).get(\"version\",\"?\"))" 2>/dev/null)
                  echo "✅ Coder LIVE on port $PORT — version $VER"
                  break
                else
                  echo "Port $PORT: HTTP $STATUS"
                fi
              done
              docker ps --filter "name=coder" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null
            fi

            if [ "$PHASE" = "setup-admin" ]; then
              echo ">>> Setup admin via CLI"
              # Install coder CLI if needed
              if ! command -v coder &> /dev/null; then
                curl -L https://coder.com/install.sh | sh 2>&1
              fi
              CODER_PORT=$(docker ps --filter "name=coder-coder" --format "{{.Ports}}" | grep -oP "\d+(?=->)" | head -1)
              echo "Coder is on port: $CODER_PORT"
              echo "Visit http://87.99.129.125:$CODER_PORT to create admin account"
            fi

            echo "=== Done ==="
          '
