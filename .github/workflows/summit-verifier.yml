name: SUMMIT Spec Fulfillment Verifier

# LAUNCH-E (#20039, 2026-09-05): schedule retired — consolidated into
# supabase-summit-verifier.yml, which now carries the canonical `41 * * * *`
# hourly schedule for this two-workflow SUMMIT verifier group. This file is
# workflow_dispatch + repository_dispatch only; its hourly "patrol" mode
# (scanning recently-closed SUMMIT issues) will only run when manually
# dispatched or via repository_dispatch(verify-summit) until re-added to a
# schedule.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'SUMMIT issue number to verify'
        required: true
  repository_dispatch:
    types: [verify-summit]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
      BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Determine issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "number=${{ github.event.client_payload.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          else
            echo "mode=patrol" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verifier (single issue)
        if: steps.issue.outputs.mode == 'single'
        run: |
          python scripts/spec_fulfillment_verifier.py \
            --issue ${{ steps.issue.outputs.number }}

      - name: Run verifier (hourly patrol)
        if: steps.issue.outputs.mode == 'patrol'
        run: |
          echo "=== Hourly patrol: scanning recently-closed SUMMIT issues ==="
          ISSUES=$(gh issue list --repo breverdbidder/cli-anything-biddeed \
            --label summit --state closed \
            --json number,closedAt \
            --jq '[.[] | select(.closedAt > (now - 86400 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .number] | .[]' 2>/dev/null || true)

          if [ -z "$ISSUES" ]; then
            echo "No recently-closed SUMMIT issues found"
            exit 0
          fi

          for ISSUE in $ISSUES; do
            echo "--- Verifying SUMMIT #${ISSUE} ---"
            python scripts/spec_fulfillment_verifier.py --issue "$ISSUE" || true
          done
