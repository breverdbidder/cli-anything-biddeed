name: SHARD-17 Letter I - Property Cards Completion (charlotte/citrus/broward)

on:
  schedule:
    - cron: '45 5,13,21 * * *'  # Run 3x daily: 05:45, 13:45, 21:45 UTC
  workflow_dispatch:
    inputs:
      county:
        description: 'Specific county to process'
        required: false
        type: choice
        options:
          - 'all'
          - 'charlotte'
          - 'citrus'
          - 'broward'
        default: 'all'

jobs:
  property-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests --break-system-packages -q
          
      - name: Run SHARD-17 Letter I Property Cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🎯 SHARD-17 Letter I: Property Cards Completion"
          echo "Counties: charlotte, citrus, broward"
          echo "Target: ≥95% property cards complete (address+geo+value+zoned parcel)"
          
          if [ "${{ github.event.inputs.county }}" = "all" ] || [ -z "${{ github.event.inputs.county }}" ]; then
            echo "Processing all counties..."
            python3 scripts/shard17_property_cards.py --all-counties
          else
            echo "Processing county: ${{ github.event.inputs.county }}"
            python3 scripts/shard17_property_cards.py --county ${{ github.event.inputs.county }}
          fi
          
      - name: Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="🏠 SHARD-17 Letter I (Property Cards) - Status: $STATUS
          Counties: charlotte, citrus, broward
          Target: Complete property cards (address+geo+value+zoning)
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" || true