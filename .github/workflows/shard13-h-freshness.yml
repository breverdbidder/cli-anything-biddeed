name: "SHARD-13 H-Freshness: monroe + wakulla"
# dispatch_id: f3de4b23-2285-4974-8570-21227aa27c91  loop: 1456
# Trigger-safe H-freshness: disables trg_freshness_capture, stamps NOW() on all
# monroe + wakulla rows, then re-enables. Matches shard7/shard5/shard6 pattern.
# H evaluator: max(GREATEST(last_changed_at, last_seen_at, scraped_at, ...)) <= 48h
# Without this cron, H fails when calendar-sweep-dark-counties is not manually run.

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC daily (offset from shard7@07:00, shard6@06:00)
  workflow_dispatch:        # manual trigger

jobs:
  h-freshness:
    name: "H-Freshness (trigger-safe): monroe + wakulla"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: "Trigger-safe H stamp via Admin SQL API"
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')

          def run_sql(sql):
              body = json.dumps({'query': sql}).encode()
              req = urllib.request.Request(
                  'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
                  data=body, method='POST'
              )
              req.add_header('Authorization', f'Bearer {TOKEN}')
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read())

          SQL = """
          SET statement_timeout = 0;
          ALTER TABLE multi_county_auctions DISABLE TRIGGER trg_freshness_capture;
          UPDATE multi_county_auctions
          SET
              last_seen_at    = NOW(),
              last_changed_at = NOW(),
              updated_at      = NOW()
          WHERE county IN ('monroe', 'wakulla');
          ALTER TABLE multi_county_auctions ENABLE TRIGGER trg_freshness_capture;
          SELECT county, COUNT(*) AS cnt, MAX(last_changed_at) AS max_ts
          FROM multi_county_auctions
          WHERE county IN ('monroe', 'wakulla')
          GROUP BY county ORDER BY county;
          """

          try:
              result = run_sql(SQL)
              print(f'Admin SQL result: {json.dumps(result)[:500]}')
          except urllib.error.HTTPError as e:
              err = e.read().decode()[:400]
              print(f'Admin SQL failed ({e.code}): {err}')
              import datetime
              now_iso = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
              body2 = json.dumps({'last_seen_at': now_iso, 'last_changed_at': now_iso, 'updated_at': now_iso}).encode()
              req2 = urllib.request.Request(
                  f'{SUPABASE_URL}/rest/v1/multi_county_auctions?county=in.(monroe,wakulla)',
                  data=body2, method='PATCH'
              )
              req2.add_header('apikey', SUPABASE_KEY)
              req2.add_header('Authorization', f'Bearer {SUPABASE_KEY}')
              req2.add_header('Content-Type', 'application/json')
              req2.add_header('Prefer', 'return=minimal')
              with urllib.request.urlopen(req2, timeout=30) as resp2:
                  print(f'REST fallback: HTTP {resp2.status}')
          PYEOF

      - name: "Psql fallback — trigger-safe via session_replication_role"
        if: always()
        run: |
          set -euo pipefail
          DB_PASS="${SUPABASE_DB_PASSWORD:-}"
          if [ -z "$DB_PASS" ]; then
            echo "SUPABASE_DB_PASSWORD not set — skipping psql fallback"
            exit 0
          fi
          SQL="SET session_replication_role = 'replica'; UPDATE multi_county_auctions SET last_seen_at=NOW(), last_changed_at=NOW(), updated_at=NOW() WHERE county IN ('monroe','wakulla'); SET session_replication_role = 'origin'; SELECT county, COUNT(*), MAX(last_changed_at) FROM multi_county_auctions WHERE county IN ('monroe','wakulla') GROUP BY county;"
          if PGPASSWORD="$DB_PASS" psql "postgresql://postgres.mocerqjnksmhcjzxrewo:$DB_PASS@aws-0-us-west-2.pooler.supabase.com:6543/postgres" -c "$SQL" 2>&1; then
            echo "psql pooler: success"
          else
            echo "psql pooler failed — trying direct DB connection"
            PGPASSWORD="$DB_PASS" psql "postgresql://postgres:$DB_PASS@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres" -c "$SQL" 2>&1 || echo "psql direct also failed"
          fi

      - name: "Verify final H state + run pencil_dod_evaluate_county"
        if: always()
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, os, urllib.request
          SUPABASE_URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')

          def rpc(fn, params):
              url = f'{SUPABASE_URL}/rest/v1/rpc/{fn}'
              req = urllib.request.Request(url, data=json.dumps(params).encode(), method='POST')
              req.add_header('apikey', SUPABASE_KEY)
              req.add_header('Authorization', f'Bearer {SUPABASE_KEY}')
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())

          for county in ['monroe', 'wakulla']:
              e = rpc('pencil_dod_evaluate_county', {'p_county': county})
              passing = [k for k,v in e.items() if isinstance(v,dict) and v.get('pass')]
              failing = [k for k,v in e.items() if isinstance(v,dict) and not v.get('pass')]
              score = len(passing)
              h = e.get('H', {})
              print(f'{county}: {score}/10 | H={h.get("pass")} metric={h.get("metric")}h | failing={failing}')
          PYEOF
