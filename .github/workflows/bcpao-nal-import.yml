name: bcpao-nal-import
# v3 folio→PIN bridge — no CF, no bulk file, addr matching only.
# Strategies (in order): bcpao_data extraction → exact addr_key → cleaned addr → mark-empty.
# Replaces CF-blocked Playwright harvester for the base matching pass.

on:
  workflow_dispatch:
    inputs:
      apply_migration:
        description: "Apply SQL migration first? (yes/no)"
        required: false
        default: "yes"
  schedule:
    - cron: "30 06 * * *"   # daily 06:30 UTC

concurrency:
  group: bcpao-nal-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migrations
        if: ${{ github.event.inputs.apply_migration != 'no' }}
        run: |
          set -euo pipefail
          TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF=mocerqjnksmhcjzxrewo
          apply_sql() {
            local file="$1"
            python3 -c "import json; f=open('${file}'); payload=json.dumps({'query':f.read()}); open('/tmp/payload.json','w').write(payload)"
            HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json)
            echo "  ${file}: HTTP ${HTTP}"; cat /tmp/resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d)" 2>/dev/null || cat /tmp/resp.json; echo
            [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration ${file} failed HTTP ${HTTP}"; exit 1; }
          }
          echo "=== Applying bridge infra migration ==="
          apply_sql supabase/migrations/20260622_bcpao_folio_pin_bridge.sql
          echo "=== Applying directional bridge function ==="
          apply_sql supabase/migrations/20260622_bcpao_directional_bridge_fn.sql
          echo "All migrations OK"
          # Give PostgREST time to pick up the NOTIFY pgrst reload signal
          sleep 8

      - name: Run BCPAO NAL import (addr matching)
        run: python3 scripts/bcpao-nal-import.py

      - name: Verify DoD
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, json, sys

          sb_url = os.environ['SUPABASE_URL'].rstrip('/')
          sb_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def sb_count(table, params=''):
              url = f'{sb_url}/rest/v1/{table}?select=count'
              if params:
                  url += f'&{params}'
              req = urllib.request.Request(url)
              req.add_header('apikey', sb_key)
              req.add_header('Authorization', f'Bearer {sb_key}')
              req.add_header('Prefer', 'count=exact')
              with urllib.request.urlopen(req, timeout=15) as r:
                  hdr = r.headers.get('content-range', '?/?')
                  return int(hdr.split('/')[-1])

          bridge = sb_count('brevard_folio_pin_bridge')
          queued = sb_count('bcpao_fetch_jobs', 'status=eq.queued')
          done   = sb_count('bcpao_fetch_jobs', 'status=eq.done')
          empty  = sb_count('bcpao_fetch_jobs', 'status=eq.empty')
          failed = sb_count('bcpao_fetch_jobs', 'status=eq.failed')

          print('=== FINAL VERIFICATION ===')
          print(f'brevard_folio_pin_bridge total={bridge}')
          print(f'bcpao_fetch_jobs queued={queued} done={done} empty={empty} failed={failed}')

          if bridge >= 5500:
              print(f'DoD ✓ bridge >= 5500 rows ({bridge})')
          else:
              pct = (bridge / 5500) * 100
              remaining_q = queued + failed
              print(f'DoD PARTIAL: {bridge}/5500 rows ({pct:.1f}%) — {remaining_q} accounts still need BCPAO API')
              print('Note: BCPAO API is CF-blocked in GHA; addr matching is the limit of this approach')
          PYEOF
