name: "Summit: TrendPredictor P0 — Claude Code Auto Session"

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Max session minutes'
        required: false
        default: '45'
      dry_run:
        description: 'Dry run (prompt only)'
        required: false
        type: boolean
        default: false

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  summit:
    name: "⛰️ Summit: TrendPredictor P0"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: "1️⃣ Preflight"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            [ -d "${{ env.REPO_PATH }}/.git" ] || { cd /opt/biddeed; git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git; }
            cd ${{ env.REPO_PATH }}
            git fetch origin main && git reset --hard origin/main
            echo "📦 $(git log --oneline -1)"
            command -v claude &>/dev/null || npm install -g @anthropic-ai/claude-code
            test -f trendpredictor/agent.py && echo "✅ agent.py"
            test -f trendpredictor/CLAUDE.md && echo "✅ CLAUDE.md"
            python3 -c "import httpx" || pip install httpx --break-system-packages
            echo "✅ Preflight complete"

      - name: "2️⃣ Upload prompt"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            # Use the prompt file from the repo
            test -f trendpredictor/prompts/summit-p0.md && echo "✅ Prompt found in repo"
            cp trendpredictor/prompts/summit-p0.md /opt/biddeed/trendpredictor-p0-prompt.md
            wc -c /opt/biddeed/trendpredictor-p0-prompt.md

      - name: "3️⃣ Execute Claude Code"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: ${{ github.event.inputs.max_minutes || '45' }}m
          script: |
            export ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            export MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}"
            cd ${{ env.REPO_PATH }}

            git config user.email "claude@biddeed.ai"
            git config user.name "Claude Code (TrendPredictor P0)"
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git

            PROMPT=$(cat /opt/biddeed/trendpredictor-p0-prompt.md)
            LOG="trendpredictor/eval/summit_p0_$(date +%Y%m%d_%H%M%S).log"
            mkdir -p trendpredictor/eval trendpredictor/eval_outputs

            echo "⛰️ Summit: TrendPredictor P0 | $(date)"
            IS_SANDBOX=1 claude -p "$PROMPT" --dangerously-skip-permissions 2>&1 | tee "$LOG" || true
            echo "⏰ Done: $(date)"

            git add -A
            git diff --cached --quiet || {
              git commit -m "summit(trendpredictor): P0 session complete $(date +%Y%m%d_%H%M%S)"
              git push origin main
            } || true
            echo "📊 Commits: $(git log --oneline --since='1 hour ago' --grep='trendpredictor' | wc -l)"

      - name: "4️⃣ Post-session verify"
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            export MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}"

            echo "=== JSON validity ==="
            python3 -m trendpredictor.agent analyze --zip 32937 --horizon 12 --json 2>/dev/null \
              | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            p=d.get('stages',{}).get('prediction',{})
            print(f'✅ Score: {p.get(\"direction_score\",0):+.1f} | Action: {p.get(\"timing_action\",\"?\")}')
            print(f'   GeoJSON: {\"YES\" if p.get(\"geojson_feature\") else \"NO\"}')
            " 2>&1 || echo "❌ JSON broken"

            echo "=== Heatmap check ==="
            [ -f trendpredictor/eval_outputs/brevard_pulse.html ] && echo "✅ Heatmap HTML exists" || echo "⚠️ No heatmap yet"
            [ -f trendpredictor/eval_outputs/brevard_pulse.geojson ] && echo "✅ GeoJSON exists" || echo "⚠️ No GeoJSON yet"

            echo "=== Commits ==="
            git log --oneline --since="2 hours ago" --grep="trendpredictor" | head -10

      - name: "5️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            cd ${{ env.REPO_PATH }}
            STATUS="${{ job.status }}"
            EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
            COMMITS=$(git log --oneline --since="2 hours ago" --grep="trendpredictor" | wc -l)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              -d "text=${EMOJI} <b>Summit: TrendPredictor P0</b>
            Status: ${STATUS}
            Commits: ${COMMITS}
            Heatmap: Mapbox GL JS
            Server: Hetzner" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ⛰️ Summit: TrendPredictor P0
          **Status:** ${{ job.status }}
          **Mode:** Claude Code auto (${{ github.event.inputs.max_minutes || '45' }}m max)
          ### Expected Commits
          1. \`feat(trendpredictor): Supabase market_trends + --save\`
          2. \`feat(trendpredictor): BCPAO YoY sales growth\`
          3. \`feat(trendpredictor): Zillow ZORI rental index\`
          4. \`feat(trendpredictor): Full county pulse heatmap HTML\`
          5. \`test(trendpredictor): smoke test + county pulse\`
          EOF
