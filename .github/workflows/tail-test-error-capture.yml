name: Tail Worker During Test Error Capture

# Temporary diagnostic: streams live Worker console output (wrangler tail)
# while hitting /test-error-capture, to observe the [posthog-diag] log
# lines from captureError() and determine why the event isn't landing
# in PostHog for distinct_id=biddeed-worker even though a direct capture
# call with the same key succeeds.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tail worker logs while triggering test-error-capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler --version >/dev/null 2>&1 || true
          npx wrangler tail --format pretty > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          for i in $(seq 1 30); do
            if grep -q "waiting for logs" /tmp/tail.log 2>/dev/null; then
              echo "tail connected after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sS -o /dev/null -w "trigger HTTP_STATUS:%{http_code}\n" https://biddeed.ai/test-error-capture || true
          sleep 15
          kill $TAIL_PID 2>/dev/null || true
          echo "=== wrangler tail output ==="
          cat /tmp/tail.log
