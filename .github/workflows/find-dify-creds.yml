name: Find Dify Credentials
on:
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH check
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "" | base64 -d > /tmp/find-creds.sh
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no /tmp/find-creds.sh root@$HETZNER_IP:/tmp/find-creds.sh
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP 'bash /tmp/find-creds.sh'
