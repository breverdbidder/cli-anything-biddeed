name: Fork Skill Repo

# Fork any GitHub repo into breverdbidder via the API, verify it,
# and optionally bootstrap a rebrand branch with everest conventions.
#
# Triggered manually via Actions tab → "Fork Skill Repo" → Run workflow.
# Uses EVEREST_GH_PAT (classic ghp_*, scopes: repo).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source repo to fork (owner/repo)"
        required: true
        default: "alirezarezvani/claude-skills"
      target_name:
        description: "Fork name under breverdbidder"
        required: true
        default: "everest-board-skills"
      default_branch_only:
        description: "Fork default branch only (faster, recommended)"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]
      create_rebrand_branch:
        description: "Create personas/legends-overlay branch after fork"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fork_full_name: ${{ steps.fork.outputs.full_name }}
      fork_url: ${{ steps.fork.outputs.html_url }}
      fork_clone_url: ${{ steps.fork.outputs.clone_url }}
    steps:
      - name: Validate PAT exists
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::EVEREST_GH_PAT secret is not set. Add it at Settings → Secrets → Actions."
            exit 1
          fi
          echo "✅ PAT present"

      - name: Verify PAT scope (must have repo)
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
        run: |
          SCOPES=$(curl -sSI -H "Authorization: Bearer $PAT" https://api.github.com/user \
                   | grep -i '^x-oauth-scopes:' | sed 's/.*: //' | tr -d '\r\n')
          echo "Scopes: $SCOPES"
          if ! echo "$SCOPES" | grep -q "repo"; then
            echo "::error::PAT missing 'repo' scope. Current scopes: $SCOPES"
            exit 1
          fi
          echo "✅ PAT has repo scope"

      - name: Verify source repo exists
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
          SRC: ${{ inputs.source }}
        run: |
          HTTP=$(curl -sS -o /tmp/src.json -w "%{http_code}" \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$SRC")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Source repo $SRC not accessible (HTTP $HTTP)"
            cat /tmp/src.json
            exit 1
          fi
          STARS=$(jq -r '.stargazers_count' /tmp/src.json)
          LICENSE=$(jq -r '.license.spdx_id // "NONE"' /tmp/src.json)
          PRIVATE=$(jq -r '.private' /tmp/src.json)
          echo "✅ Source: $SRC | ⭐ $STARS | License: $LICENSE | Private: $PRIVATE"

      - name: Check if fork already exists
        id: precheck
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
          TARGET: breverdbidder/${{ inputs.target_name }}
        run: |
          HTTP=$(curl -sS -o /tmp/existing.json -w "%{http_code}" \
                  -H "Authorization: Bearer $PAT" \
                  "https://api.github.com/repos/$TARGET")
          if [ "$HTTP" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Fork $TARGET already exists. Will skip create, just verify."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✅ Target name available"
          fi

      - name: Create fork
        id: fork
        if: steps.precheck.outputs.exists == 'false'
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
          SRC: ${{ inputs.source }}
          NAME: ${{ inputs.target_name }}
          DEFAULT_ONLY: ${{ inputs.default_branch_only }}
        run: |
          PAYLOAD=$(jq -n \
                    --arg n "$NAME" \
                    --argjson d $DEFAULT_ONLY \
                    '{name:$n, default_branch_only:$d}')
          HTTP=$(curl -sS -o /tmp/fork.json -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$SRC/forks" \
                  -d "$PAYLOAD")
          if [ "$HTTP" != "202" ] && [ "$HTTP" != "200" ]; then
            echo "::error::Fork failed (HTTP $HTTP)"
            cat /tmp/fork.json
            exit 1
          fi
          FULL_NAME=$(jq -r '.full_name' /tmp/fork.json)
          URL=$(jq -r '.html_url' /tmp/fork.json)
          CLONE=$(jq -r '.clone_url' /tmp/fork.json)
          echo "✅ Fork created: $FULL_NAME"
          echo "full_name=$FULL_NAME" >> "$GITHUB_OUTPUT"
          echo "html_url=$URL" >> "$GITHUB_OUTPUT"
          echo "clone_url=$CLONE" >> "$GITHUB_OUTPUT"

      - name: Wait for fork to be ready
        if: steps.precheck.outputs.exists == 'false'
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
          TARGET: breverdbidder/${{ inputs.target_name }}
        run: |
          for i in {1..30}; do
            HTTP=$(curl -sS -o /tmp/poll.json -w "%{http_code}" \
                    -H "Authorization: Bearer $PAT" \
                    "https://api.github.com/repos/$TARGET")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Fork ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Fork did not become available within 30s"
          exit 1

      - name: Hydrate fork metadata (if pre-existing)
        if: steps.precheck.outputs.exists == 'true'
        id: hydrate
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
          TARGET: breverdbidder/${{ inputs.target_name }}
        run: |
          FULL_NAME=$(jq -r '.full_name' /tmp/existing.json)
          URL=$(jq -r '.html_url' /tmp/existing.json)
          CLONE=$(jq -r '.clone_url' /tmp/existing.json)
          echo "full_name=$FULL_NAME" >> "$GITHUB_OUTPUT"
          echo "html_url=$URL" >> "$GITHUB_OUTPUT"
          echo "clone_url=$CLONE" >> "$GITHUB_OUTPUT"

      - name: Create rebrand branch (personas/legends-overlay)
        if: inputs.create_rebrand_branch == 'true'
        env:
          PAT: ${{ secrets.EVEREST_GH_PAT }}
          TARGET: breverdbidder/${{ inputs.target_name }}
        run: |
          DEFAULT_BRANCH=$(curl -sS \
            -H "Authorization: Bearer $PAT" \
            "https://api.github.com/repos/$TARGET" | jq -r '.default_branch')
          SHA=$(curl -sS \
            -H "Authorization: Bearer $PAT" \
            "https://api.github.com/repos/$TARGET/git/refs/heads/$DEFAULT_BRANCH" \
            | jq -r '.object.sha')
          HTTP=$(curl -sS -o /tmp/branch.json -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$TARGET/git/refs" \
                  -d "{\"ref\":\"refs/heads/personas/legends-overlay\",\"sha\":\"$SHA\"}")
          if [ "$HTTP" = "201" ]; then
            echo "✅ Branch personas/legends-overlay created at $SHA"
          elif [ "$HTTP" = "422" ]; then
            echo "::warning::Branch personas/legends-overlay already exists"
          else
            echo "::error::Branch creation failed (HTTP $HTTP)"
            cat /tmp/branch.json
            exit 1
          fi

      - name: Summary
        env:
          NEW: ${{ steps.fork.outputs.full_name }}
          EXISTED: ${{ steps.hydrate.outputs.full_name }}
        run: |
          FN="${NEW:-$EXISTED}"
          echo "Fork: $FN" >> "$GITHUB_STEP_SUMMARY"