name: "Deploy SiteManager to Hetzner"

on:
  push:
    paths: ['sitemanager/**']
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test'
        required: false
        type: boolean
        default: true

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  deploy:
    name: "🏗️ Deploy SiteManager"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "1️⃣ Deploy"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            [ -d "${{ env.REPO_PATH }}/.git" ] || { cd /opt/biddeed; git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git; }
            cd ${{ env.REPO_PATH }} && git fetch origin main && git reset --hard origin/main
            echo "📦 $(git log --oneline -1)"
            test -f sitemanager/agent.py && echo "✅ agent.py"
            test -f sitemanager/CLAUDE.md && echo "✅ CLAUDE.md"
            pip install httpx --quiet --break-system-packages 2>/dev/null || true
            mkdir -p sitemanager/eval_outputs
            echo "✅ SiteManager deployed"

      - name: "2️⃣ Smoke test"
        if: github.event.inputs.smoke_test != 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            echo "🧪 Smoke: create project for test parcel"
            python3 -m sitemanager.agent create --parcel "2537220000001" --budget 85000 --json 2>/dev/null \
              > sitemanager/eval_outputs/smoke_test.json || true
            python3 -c "
            import json
            d = json.load(open('sitemanager/eval_outputs/smoke_test.json'))
            r = d.get('report', {})
            p = d.get('project', {})
            print(f'✅ Project: {p.get(\"project_id\")}')
            print(f'   Health: {r.get(\"site_health_score\",\"?\")}/100 | Status: {r.get(\"status\")}')
            print(f'   Safety: {r.get(\"safety_score\")}/100 | Phases: {len(p.get(\"phases\",{}))}')
            print(f'   Actions: {len(r.get(\"action_items\",[]))}')
            print(f'   GeoJSON: {\"YES\" if r.get(\"geojson_feature\") else \"NO\"}')
            " 2>&1 || echo "⚠️ Smoke test failed"

      - name: "3️⃣ Status"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            python3 -m sitemanager.agent status 2>&1

      - name: "4️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            COMMIT=$(cd ${{ env.REPO_PATH }} && git log --oneline -1)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "parse_mode=HTML" \
              -d "text=$( [ '${{ job.status }}' = 'success' ] && echo '✅' || echo '❌' ) <b>SiteManager Deploy</b>: ${{ job.status }}
            Commit: ${COMMIT}" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: echo "## 🏗️ SiteManager Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
