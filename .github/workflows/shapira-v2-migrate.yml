name: Shapira Formula V2 — Migration + Backfill + Retrain
on:
  workflow_dispatch:

jobs:
  migrate-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql + python deps
        run: |
          sudo apt-get install -y postgresql-client
          pip install httpx

      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          export PGSSLMODE=require
          PROJECT_REF="mocerqjnksmhcjzxrewo"

          echo "=== Shapira V2 Migration: prediction_trajectories + learned_parameters + retrain_events ==="
          SUCCESS=0

          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_KEY}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_KEY}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE_CONN=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE_CONN"
            if psql "$CONN" -c "SELECT 1" 2>&1; then
              echo "Connected! Running migration..."
              psql "$CONN" -f migrations/20260331_shapira_formula_v2.sql
              echo "=== Verifying tables ==="
              psql "$CONN" -c "
                SELECT 'prediction_trajectories' AS tbl, COUNT(*) FROM prediction_trajectories
                UNION ALL
                SELECT 'learned_parameters', COUNT(*) FROM learned_parameters
                UNION ALL
                SELECT 'retrain_events', COUNT(*) FROM retrain_events;
              "
              echo "Migration complete. VERIFIED."
              SUCCESS=1
              break
            fi
          done

          if [ "$SUCCESS" = "0" ]; then
            echo "ERROR: All connection attempts failed."
            exit 1
          fi

      - name: Backfill prediction_trajectories from multi_county_auctions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Backfilling prediction_trajectories ==="
          python scripts/retrain_shapira.py --backfill
          echo "Backfill complete."

      - name: Run initial retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Running initial parameter optimization ==="
          python scripts/retrain_shapira.py
          echo "Retrain complete."

      - name: Verify via curl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== VERIFICATION ==="
          echo "--- prediction_trajectories count ---"
          curl -s "${SUPABASE_URL}/rest/v1/prediction_trajectories?select=id" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Prefer: count=exact" \
            -I | grep -i content-range

          echo "--- learned_parameters ---"
          curl -s "${SUPABASE_URL}/rest/v1/learned_parameters?select=zip_code,auction_type,sample_size,avg_reward" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}"

          echo "--- retrain_events ---"
          curl -s "${SUPABASE_URL}/rest/v1/retrain_events?select=*&order=created_at.desc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}"

          echo "VERIFIED."
