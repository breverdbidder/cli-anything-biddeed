name: "Fix Claude Code + Re-dispatch Viral Buildout"

on:
  workflow_dispatch:

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose and fix Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          envs: GH_PAT,CLAUDE_OAUTH_B64
          script: |
            echo "=== Claude Code Diagnostic ==="

            # Ensure claude user exists
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            su - claude << 'USERCMD'
            export PATH="/home/claude/.npm-global/bin:$HOME/.local/bin:$PATH"
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global

            echo "--- Current version ---"
            claude --version 2>&1 || echo "Claude Code not found"

            echo "--- Updating Claude Code to latest ---"
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -5

            echo "--- New version ---"
            claude --version 2>&1

            echo "--- Available flags ---"
            claude --help 2>&1 | grep -iE "auto|permission|skip|dangerously|yes|mode" || echo "No matching flags found"

            echo "--- Full help output ---"
            claude --help 2>&1
            USERCMD

      - name: Re-trigger buildout
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/viral-buildout.yml/dispatches" \
            -d '{"ref":"main","inputs":{"phase":"all"}}'
          echo "Buildout re-dispatched"
