name: CC Direct — OAuth Fixed
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers'
        required: true
        default: '263'
jobs:
  run-claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Run Claude Code on Hetzner for issue ${{ matrix.issue }}
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=20 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Setup workspace ==="
          $SSH "mkdir -p /root/summit-${ISSUE} && cd /root/summit-${ISSUE} && \
            (test -d cli-anything-biddeed/.git && cd cli-anything-biddeed && git pull || \
            git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git) && \
            cd cli-anything-biddeed && git config user.email 'claude-code@biddeed.ai' && git config user.name 'Claude Code'"

          echo "=== Write OAuth credentials via base64 (avoids # shell issue) ==="
          echo "DEBUG: CLAUDE_OAUTH_B64 length=$(echo -n "$CLAUDE_OAUTH_B64" | wc -c), first 4 chars=$(echo -n "$CLAUDE_OAUTH_B64" | head -c 4 | od -An -c | tr -d " "), last 4=$(echo -n "$CLAUDE_OAUTH_B64" | tail -c 4 | od -An -c | tr -d " ")"
          # FIXED Apr 7 2026: write FULL credentials.json from CLAUDE_OAUTH_B64 (was building truncated JSON from accessToken only)
          $SSH "mkdir -p /root/.claude && echo \"${CLAUDE_OAUTH_B64}\" | base64 -d > /root/.claude/.credentials.json && chmod 600 /root/.claude/.credentials.json && echo Wrote credentials: && wc -c /root/.claude/.credentials.json"

          echo "=== Verify Claude Code auth ==="
          $SSH "claude --version 2>&1 && claude -p 'say hello' --allowedTools 'Bash(*)' 2>&1 | head -5 || echo 'Auth test failed'"

          echo "=== Run Claude Code on SUMMIT #${ISSUE} ==="
          $SSH "cd /root/summit-${ISSUE}/cli-anything-biddeed && \
            export GH_PAT='${GH_PAT}' && \
            claude -p 'Read GitHub issue #${ISSUE} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${ISSUE} using: curl -s -H \"Authorization: token ${GH_PAT}\" https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE} | jq .body. Then execute ALL tasks. Follow CLAUDE.md. Commit and push. Comment on the issue when done.' \
            --allowedTools 'Bash(*)' 'Read' 'Write' 'Edit' \
            2>&1 | tail -500" || echo "Claude Code exited"

          echo "=== SUMMIT #${ISSUE} COMPLETE ==="
