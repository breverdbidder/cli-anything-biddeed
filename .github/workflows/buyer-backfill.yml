name: "Buyer Backfill — Name On Title from RealForeclose Detail Pages"
# Scrapes RealForeclose Auction Details pages for all SOLD rows missing
# winning_bidder (Name On Title) and plaintiff. Populates auction_buyer_profiles
# trigger → upsert_auction_buyer_profile() → lead funnel.

on:
  workflow_dispatch:
    inputs:
      since_date:
        description: "Start date (YYYY-MM-DD, default: 2026-07-01)"
        required: false
        default: "2026-07-01"
      until_date:
        description: "End date (YYYY-MM-DD, default: today)"
        required: false
        default: ""
      county:
        description: "Single county to target (leave blank for all)"
        required: false
        default: ""
  # Also run daily at 6 AM ET to catch new sold rows
  schedule:
    - cron: "0 10 * * *"

jobs:
  backfill:
    name: "Scrape Name On Title — RealForeclose Detail Pages"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run buyer backfill scraper
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SINCE_DATE:  ${{ github.event.inputs.since_date  || '2026-07-01' }}
          UNTIL_DATE:  ${{ github.event.inputs.until_date  || '' }}
          TARGET_COUNTY: ${{ github.event.inputs.county    || '' }}
          REALFORECLOSE_EMAIL:    ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: python3 scripts/buyer_backfill.py
