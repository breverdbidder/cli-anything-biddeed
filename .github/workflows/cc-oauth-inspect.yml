name: cc oauth inspect
on: { workflow_dispatch: {} }
jobs:
  i:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: inspect
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE" | sed -E 's/(sk-ant-[a-z0-9]+-[A-Za-z0-9]{4})[A-Za-z0-9_-]+/\1***/g'
          echo "=== creds file ==="
          if [ -f /root/.claude/.credentials.json ]; then
          python3 - <<'PY'
          import json,datetime
          d=json.load(open('/root/.claude/.credentials.json'))
          o=d.get('claudeAiOauth',d)
          m=lambda t:(t[:16]+'..len%d'%len(t)) if isinstance(t,str) else t
          print("top_keys:",list(d.keys()))
          print("oauth_keys:",list(o.keys()) if isinstance(o,dict) else None)
          print("accessToken:",m(o.get('accessToken')))
          print("refreshToken:",m(o.get('refreshToken')))
          print("scopes:",o.get('scopes'))
          print("subscriptionType:",o.get('subscriptionType'))
          e=o.get('expiresAt')
          print("expiresAt_raw:",e)
          if e:
            ts=int(e)/1000.0
            print("expiresAt_utc:",datetime.datetime.utcfromtimestamp(ts).isoformat(),"Z")
            print("now_utc:",datetime.datetime.utcnow().isoformat(),"Z")
            print("expired:",ts<datetime.datetime.utcnow().timestamp())
          print("clientId:",o.get('clientId') or d.get('clientId'))
          PY
          else echo "NO creds file"; fi
          echo "=== client_id hunt ==="
          grep -rhoE 'client_id["'\'' :=]+[A-Za-z0-9-]{8,}' /root/.claude.json /root/.claude/ 2>/dev/null | sed -E 's/([A-Za-z0-9-]{8})[A-Za-z0-9-]+$/\1***/' | sort -u | head -5
          echo "END"
          REMOTE
