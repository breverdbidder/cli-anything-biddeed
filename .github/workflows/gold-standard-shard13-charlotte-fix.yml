name: "Gold Standard SHARD-13 Charlotte — C/D/I Fix (run6253)"
# dispatch: 549b0e98-97ab-48f1-a6ee-193ce66bdb61
# Session: architect-20260724T160000
#
# Applies migration: supabase/migrations/20260724_shard13_charlotte_c_d_i_fix_run6253.sql
# Then runs python3 scripts/shard13_charlotte_live_fix.py for REST-API-level fixes
# (parcel_zones coverage sweep) and verification.
#
# Wired as a one-time fix + daily re-run to handle new scraper rows.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'fix_and_verify'
        type: choice
        options:
          - fix_and_verify
          - verify_only
          - migration_only
  schedule:
    # Daily at 16:00Z (afternoon wave) — catch any new scraper rows
    - cron: '0 16 * * *'

concurrency:
  group: gold-standard-shard13-charlotte
  cancel-in-progress: false

jobs:
  charlotte-fix:
    name: "SHARD-13 Charlotte C/D/I Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      MODE: ${{ github.event.inputs.mode || 'fix_and_verify' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Apply SQL migration via Management API"
        if: ${{ env.MODE != 'verify_only' }}
        run: |
          set -euo pipefail
          echo "=== Applying 20260724_shard13_charlotte_c_d_i_fix_run6253.sql ==="

          SQL=$(cat supabase/migrations/20260724_shard13_charlotte_c_d_i_fix_run6253.sql)
          # Strip trailing verification SELECTs for migration-only safety; the whole file runs cleanly
          PAYLOAD=$(python3 -c "
          import json, sys
          sql = open('supabase/migrations/20260724_shard13_charlotte_c_d_i_fix_run6253.sql').read()
          print(json.dumps({'query': sql}))
          ")

          HTTP=$(curl -sS -o /tmp/migration_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Migration HTTP: $HTTP"
          cat /tmp/migration_resp.json
          echo

          if [[ "$HTTP" != "200" && "$HTTP" != "201" ]]; then
            echo "::error::Migration failed HTTP $HTTP"
            exit 1
          fi
          echo "Migration applied OK"

      - name: "Run live fix script (parcel_zones coverage + REST patches)"
        if: ${{ env.MODE != 'verify_only' && env.MODE != 'migration_only' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          echo "=== Running shard13_charlotte_live_fix.py ==="
          python3 scripts/shard13_charlotte_live_fix.py 2>&1
          echo "Live fix script complete"

      - name: "Verify: pencil_dod_evaluate_county(charlotte)"
        run: |
          set -euo pipefail
          echo "=== FINAL VERIFICATION ==="
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          H = {
              "apikey": SB_KEY,
              "Authorization": f"Bearer {SB_KEY}",
              "Content-Type": "application/json",
          }

          def rpc(fn, body):
              req = urllib.request.Request(
                  f"{SB_URL}/rest/v1/rpc/{fn}",
                  data=json.dumps(body).encode(),
                  headers=H,
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {"error": str(e)}

          # Try both parameter name conventions
          ev = rpc("pencil_dod_evaluate_county", {"county_slug_arg": "charlotte"})
          if "error" in (ev or {}) or ev is None:
              ev = rpc("pencil_dod_evaluate_county", {"p_county_slug": "charlotte"})

          print("=== pencil_dod_evaluate_county('charlotte') ===")
          print(json.dumps(ev, indent=2))

          # Parse results
          if isinstance(ev, list):
              ev = ev[0] if ev else {}

          passed = []
          failed = []
          for letter in "ABCDEFGHIJ":
              letter_data = ev.get(letter, {})
              if isinstance(letter_data, dict):
                  if letter_data.get("pass"):
                      passed.append(f"{letter}({letter_data.get('metric', '?')})")
                  else:
                      failed.append(f"{letter}({letter_data.get('metric', '?')})")

          print(f"\ncharlotte: {len(passed)}/10")
          print(f"PASS: {passed}")
          print(f"FAIL: {failed}")

          # Check C, D, I specifically
          c_pass = ev.get("C", {}).get("pass") if isinstance(ev.get("C"), dict) else None
          d_pass = ev.get("D", {}).get("pass") if isinstance(ev.get("D"), dict) else None
          i_pass = ev.get("I", {}).get("pass") if isinstance(ev.get("I"), dict) else None

          print(f"\nTarget letters: C={'PASS' if c_pass else 'FAIL'} D={'PASS' if d_pass else 'FAIL'} I={'PASS' if i_pass else 'FAIL'}")

          if len(passed) >= 9:
              print("::notice::charlotte >=9/10 PASS — close to certification")
          elif len(passed) == 10:
              print("::notice::charlotte 10/10 PASS — CERTIFIED!")

          # Quick count verification
          req = urllib.request.Request(
              f"{SB_URL}/rest/v1/multi_county_auctions?county=eq.charlotte&select=parity_status",
              headers=H
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  rows = json.loads(r.read())
              from collections import Counter
              counts = Counter(r.get("parity_status") for r in rows)
              print(f"\nParity breakdown (all charlotte rows): {dict(counts)}")
              print(f"Total charlotte rows: {len(rows)}")
          except Exception as e:
              print(f"Count query error: {e}")

          PYEOF

      - name: "Summary"
        if: always()
        run: |
          echo "dispatch_id: 549b0e98-97ab-48f1-a6ee-193ce66bdb61"
          echo "county: charlotte"
          echo "session: architect-20260724T160000"
          echo "migration: 20260724_shard13_charlotte_c_d_i_fix_run6253.sql"
          echo "targets: C (91.7%->>=95%), D (91.7%->>=95%), I (92.7%->>=95%)"
