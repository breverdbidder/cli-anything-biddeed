name: Check Scraper API
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HETZNER_IP bash <<'R'
          # Show signatures of relevant functions
          python3 -c "
          import inspect, sys
          sys.path.insert(0,'/opt/brevard-bidder-scraper')
          from src.scrapers import acclaimweb_scraper as a
          for name in ['search_acclaimweb_browserless','search_acclaimweb_with_fallback']:
              fn = getattr(a, name, None)
              if fn:
                  print(f'{name}{inspect.signature(fn)}')
          "
          # Also look for direct Telerik CSV approach used in canterbury workflow
          ls /opt/scrapers/ 2>/dev/null
          find /opt -maxdepth 3 -name "*.py" -newer /etc/hostname 2>/dev/null | head -10
          # Check the v9 mariam scraper that worked
          find /opt -name "*mariam*" -o -name "*v9*" 2>/dev/null | head -10
          R
