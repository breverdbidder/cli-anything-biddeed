name: cc oauth apply
on: { workflow_dispatch: {} }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: apply tokens
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SVC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          SB_URL="https://mocerqjnksmhcjzxrewo.supabase.co"
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH "SB_URL='$SB_URL' SVC='$SVC' bash -s" <<"REMOTE" | sed -E 's/(sk-ant-[a-z0-9]+-[A-Za-z0-9]{4})[A-Za-z0-9_-]+/\1***/g'
          python3 - <<'PY'
          import json,time,os,urllib.request
          SB=os.environ['SB_URL']; SVC=os.environ['SVC']
          req=urllib.request.Request(SB+"/rest/v1/rpc/get_claude_oauth", data=b'{}', method='POST',
            headers={'apikey':SVC,'Authorization':'Bearer '+SVC,'Content-Type':'application/json'})
          j=json.load(urllib.request.urlopen(req,timeout=30))
          p='/root/.claude/.credentials.json'
          d=json.load(open(p)); o=d['claudeAiOauth']
          o['accessToken']=j['access']; o['refreshToken']=j['refresh']
          o['expiresAt']=int(time.time()*1000)+28800*1000
          json.dump(d,open(p,'w'))
          print("CREDS_WRITTEN expiresAt",o['expiresAt'],"at",o['accessToken'][:16],"rt",o['refreshToken'][:16])
          PY
          echo "=== verify claude -p ==="
          cd /root
          timeout 70 claude -p "reply with only the word OK" --output-format text 2>&1 | head -8
          echo "VERIFY_EXIT=${PIPESTATUS[0]}"
          echo "END"
          REMOTE
