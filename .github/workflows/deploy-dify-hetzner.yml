name: Deploy ZoneWise Dify to Hetzner

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy action'
        required: true
        type: choice
        options:
          - deploy
          - status
          - stop
          - logs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            ACTION="${{ inputs.action }}"
            
            if [ "$ACTION" = "status" ]; then
              echo "=== Docker Status ==="
              docker ps --format 'table {{.Names}}	{{.Status}}	{{.Ports}}' | grep -i dify || echo "No Dify containers"
              echo ""
              echo "=== Resources ==="
              free -h
              df -h /
              exit 0
            fi
            
            if [ "$ACTION" = "stop" ]; then
              cd /opt/dify-zonewise/docker && docker compose down
              echo "Dify stopped"
              exit 0
            fi
            
            if [ "$ACTION" = "logs" ]; then
              cd /opt/dify-zonewise/docker && docker compose logs --tail=50
              exit 0
            fi
            
            # Deploy
            echo "=== Pre-flight ==="
            free -h
            df -h /
            nproc
            
            echo ""
            echo "=== Cloning ZoneWise Dify ==="
            if [ -d /opt/dify-zonewise ]; then
              cd /opt/dify-zonewise
              git pull origin main
            else
              git clone --depth 1 https://github.com/breverdbidder/dify-zonewise.git /opt/dify-zonewise
              cd /opt/dify-zonewise
            fi
            
            cd docker
            
            if [ ! -f .env ]; then
              cp .env.example .env
              SECRET=$(openssl rand -hex 32)
              
              cat >> .env << 'ENVEOF'
CONSOLE_API_URL=http://87.99.129.125:3100/console/api
CONSOLE_WEB_URL=http://87.99.129.125:3100
SERVICE_API_URL=http://87.99.129.125:3100/api
APP_WEB_URL=http://87.99.129.125:3100
VECTOR_STORE=pgvector
COMPOSE_PROFILES=pgvector,postgresql
INIT_PASSWORD=zonewise2026
ENVEOF
              
              sed -i "s/SECRET_KEY=.*/SECRET_KEY=$SECRET/" .env
              
              # Change nginx port to 3100
              sed -i 's/80:80/3100:80/' docker-compose.yaml
              echo "→ Configured .env with port 3100"
            fi
            
            echo ""
            echo "=== Starting Dify ==="
            docker compose pull
            docker compose up -d
            
            echo ""
            echo "=== Waiting 90s for startup ==="
            sleep 90
            
            echo ""
            echo "=== Verification ==="
            curl -sI http://localhost:3100 | head -5
            docker ps --format 'table {{.Names}}	{{.Status}}' | head -15
            
            echo ""
            echo "✅ ZoneWise Dify deployed at http://87.99.129.125:3100"
            echo "   Admin password: zonewise2026"
