name: "SUMMIT P0: chat-v2 split-screen Playwright verify — LOOP UNTIL PASS"
# Issue: breverdbidder/cli-anything-biddeed#102
# Commit: db7908e on zonewise-web main
#
# 7 checks via Playwright from Hetzner:
#   1. thread_rendering   — chat thread list present
#   2. textarea_presence  — message input textarea present
#   3. split_layout       — CSS grid split-screen layout active
#   4. artifact_panel     — right-side artifact/code panel present
#   5. brand_background   — background color #020617 applied
#   6. mobile_responsive  — 375×812 no horizontal overflow
#   7. api_functional     — send test message → response contains "parcel" or "zone"
#
# Loop: retries up to 5 times (15-min wait between), stops on first all-pass.

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: "Max retry attempts (default 5)"
        required: false
        default: "5"
      poll_deploy:
        description: "Poll zonewise-web deploy-prod first (true/false)"
        required: false
        default: "true"

jobs:
  chat-v2-verify:
    name: "chat-v2 split-screen — attempt loop"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Poll zonewise-web deploy-prod until success (or skip) ────────
      - name: "Poll zonewise-web deploy-prod"
        if: inputs.poll_deploy == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Polling breverdbidder/zonewise-web for latest deploy run..."
          MAX_WAIT=900   # 15 min
          INTERVAL=30
          ELAPSED=0
          STATUS="unknown"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RUNS=$(curl -s -H "Authorization: token ${GH_PAT}" \
              "https://api.github.com/repos/breverdbidder/zonewise-web/actions/runs?per_page=5" \
              | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          runs=data.get('workflow_runs',[])
          for r in runs:
            name=r.get('name','').lower()
            if 'deploy' in name or 'prod' in name:
              print(r['status']+'|'+r['conclusion']+'|'+r['html_url'])
              break
          else:
            # No deploy-specific run found — just check latest
            if runs:
              r=runs[0]
              print(r['status']+'|'+r['conclusion']+'|'+r['html_url'])
          " 2>/dev/null || echo "queued|none|")

            STATUS_FIELD=$(echo "$RUNS" | cut -d'|' -f1)
            CONCLUSION=$(echo "$RUNS" | cut -d'|' -f2)
            RUN_URL=$(echo "$RUNS" | cut -d'|' -f3)

            echo "  Deploy status: ${STATUS_FIELD} / conclusion: ${CONCLUSION} (${ELAPSED}s elapsed)"

            if [ "$STATUS_FIELD" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Deploy succeeded: ${RUN_URL}"
                break
              elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ]; then
                echo "⚠️  Deploy ${CONCLUSION} — proceeding with Playwright test anyway (will capture real state)"
                break
              fi
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "⏱  Deploy poll timeout after ${MAX_WAIT}s — proceeding with Playwright test"
          fi

      # ── Step 2: SSH to Hetzner — Playwright verify loop ──────────────────────
      - name: "Run Playwright verify loop on Hetzner"
        id: playwright
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '5' }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 90m
          envs: SUPABASE_URL,SUPABASE_KEY,TG_TOKEN,TG_CHAT,GH_PAT,MAX_ATTEMPTS
          script: |
            set -e
            WORK_DIR="/tmp/chat-v2-verify-$(date +%s)"
            mkdir -p "$WORK_DIR" && cd "$WORK_DIR"

            # Install deps (cached node_modules from last run if available)
            CACHE_DIR="/tmp/chat-v2-verify-cache"
            if [ -d "$CACHE_DIR/node_modules" ]; then
              cp -r "$CACHE_DIR/node_modules" ./node_modules
              echo "Using cached node_modules"
            else
              npm init -y > /dev/null 2>&1
              npm install playwright > /dev/null 2>&1
              npx playwright install chromium --with-deps > /dev/null 2>&1
              mkdir -p "$CACHE_DIR"
              cp -r ./node_modules "$CACHE_DIR/" || true
            fi

            # Write verify script
            cat > verify-chat-v2.js << 'VERIFYEOF'
            const { chromium } = require('playwright');
            const fs = require('fs');
            const https = require('https');
            const http = require('http');

            const TARGET = 'https://zonewise.ai/chat-v2';
            const SUPABASE_URL = process.env.SUPABASE_URL || '';
            const SUPABASE_KEY = process.env.SUPABASE_KEY || '';
            const TG_TOKEN = process.env.TG_TOKEN || '';
            const TG_CHAT = process.env.TG_CHAT || '';
            const GH_PAT = process.env.GH_PAT || '';
            const ISSUE_NUMBER = '102';
            const REPO = 'breverdbidder/cli-anything-biddeed';

            const results = [];

            function log(name, passed, detail) {
              results.push({ name, passed, detail });
              console.log(`${passed ? '✅' : '❌'} [${name}]: ${detail}`);
            }

            async function httpPost(options, body) {
              return new Promise((resolve, reject) => {
                const lib = options.hostname.startsWith('localhost') ? http : https;
                const req = lib.request(options, res => {
                  let data = '';
                  res.on('data', c => data += c);
                  res.on('end', () => resolve({ status: res.statusCode, body: data }));
                });
                req.on('error', reject);
                if (body) req.write(typeof body === 'string' ? body : JSON.stringify(body));
                req.end();
              });
            }

            async function sendTelegram(text, photoPath) {
              if (!TG_TOKEN || !TG_CHAT) return;
              if (photoPath && fs.existsSync(photoPath)) {
                const photo = fs.readFileSync(photoPath);
                const boundary = '----FormBoundary' + Date.now();
                const bodyBuf = Buffer.concat([
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n${TG_CHAT}\r\n`),
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="caption"\r\n\r\n${text.slice(0, 1024)}\r\n`),
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="parse_mode"\r\n\r\nMarkdown\r\n`),
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="photo"; filename="screenshot.png"\r\nContent-Type: image/png\r\n\r\n`),
                  photo,
                  Buffer.from(`\r\n--${boundary}--\r\n`),
                ]);
                await httpPost({
                  hostname: 'api.telegram.org', path: `/bot${TG_TOKEN}/sendPhoto`,
                  method: 'POST',
                  headers: { 'Content-Type': `multipart/form-data; boundary=${boundary}`, 'Content-Length': bodyBuf.length },
                }, bodyBuf).catch(() => {});
              } else {
                const msgBody = JSON.stringify({ chat_id: TG_CHAT, text: text.slice(0, 4096), parse_mode: 'Markdown' });
                await httpPost({
                  hostname: 'api.telegram.org', path: `/bot${TG_TOKEN}/sendMessage`,
                  method: 'POST', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(msgBody) },
                }, msgBody).catch(() => {});
              }
            }

            async function uploadToSupabase(screenshotPath, filename) {
              if (!SUPABASE_URL || !SUPABASE_KEY || !fs.existsSync(screenshotPath)) return null;
              try {
                const data = fs.readFileSync(screenshotPath);
                const uploadPath = `chat-v2/${filename}`;
                const res = await httpPost({
                  hostname: new URL(SUPABASE_URL).hostname,
                  path: `/storage/v1/object/deployment-screenshots/${uploadPath}`,
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'apikey': SUPABASE_KEY,
                    'Content-Type': 'image/png',
                    'Content-Length': data.length,
                    'x-upsert': 'true',
                  },
                }, data);
                if (res.status >= 200 && res.status < 300) {
                  return `${SUPABASE_URL}/storage/v1/object/public/deployment-screenshots/${uploadPath}`;
                }
                console.error(`Supabase upload HTTP ${res.status}: ${res.body}`);
                return null;
              } catch (e) {
                console.error('Supabase upload failed:', e.message);
                return null;
              }
            }

            async function persistToSupabase(payload) {
              if (!SUPABASE_URL || !SUPABASE_KEY) return;
              try {
                const body = JSON.stringify(payload);
                await httpPost({
                  hostname: new URL(SUPABASE_URL).hostname,
                  path: '/rest/v1/deployment_checks',
                  method: 'POST',
                  headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body),
                    'Prefer': 'return=minimal',
                  },
                }, body);
              } catch (e) {
                console.error('Supabase persist failed:', e.message);
              }
            }

            async function commentOnIssue(comment) {
              if (!GH_PAT) { console.log('[GitHub] No GH_PAT — skipping issue comment'); return; }
              const body = JSON.stringify({ body: comment });
              try {
                await httpPost({
                  hostname: 'api.github.com',
                  path: `/repos/${REPO}/issues/${ISSUE_NUMBER}/comments`,
                  method: 'POST',
                  headers: {
                    'Authorization': `token ${GH_PAT}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body),
                    'User-Agent': 'playwright-verifier',
                  },
                }, body);
                console.log('[GitHub] Issue comment posted');
              } catch (e) {
                console.error('[GitHub] Comment failed:', e.message);
              }
            }

            async function runVerification() {
              const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
              const shotDir = '/tmp/chat-v2-screenshots';
              fs.mkdirSync(shotDir, { recursive: true });

              const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
              const consoleErrors = [];

              // ── Desktop viewport (1440×900) ──────────────────────────────────
              console.log('\n=== Desktop 1440×900 ===');
              const ctx = await browser.newContext({ viewport: { width: 1440, height: 900 } });
              const page = await ctx.newPage();
              page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

              await page.goto(TARGET, { timeout: 45000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(6000);

              const desktopShot = `${shotDir}/desktop-${ts}.png`;
              await page.screenshot({ path: desktopShot, fullPage: false });

              // CHECK 1: thread_rendering — chat thread list present
              const threadEl = await page.$('[class*="thread"], [class*="Thread"], [data-testid*="thread"], aside, .sidebar, [class*="chat-list"], [class*="chatList"], [class*="conversation"]');
              log('thread_rendering', !!threadEl, threadEl ? 'Thread list element found' : 'No thread list element found (checked: [class*=thread], aside, .sidebar, [class*=chat-list])');

              // CHECK 2: textarea_presence — message input textarea
              const textareaEl = await page.$('textarea, [contenteditable="true"], input[type="text"][placeholder*="message" i], input[type="text"][placeholder*="ask" i], [class*="input"][role="textbox"]');
              log('textarea_presence', !!textareaEl, textareaEl ? 'Message input found' : 'No message input (checked: textarea, contenteditable, chat input)');

              // CHECK 3: split_layout — CSS grid or flex split
              const layoutCheck = await page.evaluate(() => {
                const checks = [];
                // Check for grid layout on main containers
                const containers = document.querySelectorAll('main, .main, [class*="layout"], [class*="split"], [class*="panel"], [class*="workspace"]');
                for (const el of containers) {
                  const s = window.getComputedStyle(el);
                  if (s.display === 'grid' || s.display === 'flex') {
                    const rect = el.getBoundingClientRect();
                    if (rect.width > 900 && rect.height > 400) {
                      checks.push(`${el.tagName}.${(el.className||'').toString().slice(0,30)} display:${s.display}`);
                    }
                  }
                }
                // Also check for two side-by-side panels
                const allPanels = document.querySelectorAll('[class*="panel"], [class*="pane"], [class*="col"], aside, [class*="sidebar"]');
                const visiblePanels = Array.from(allPanels).filter(el => {
                  const r = el.getBoundingClientRect();
                  return r.width > 100 && r.height > 200;
                });
                return { gridElements: checks, visiblePanelCount: visiblePanels.length };
              });
              const splitOk = layoutCheck.gridElements.length > 0 || layoutCheck.visiblePanelCount >= 2;
              log('split_layout', splitOk, splitOk
                ? `Grid/flex containers: ${layoutCheck.gridElements.slice(0,2).join(', ') || 'implicit'} | ${layoutCheck.visiblePanelCount} visible panels`
                : `No split detected — grid elements: ${layoutCheck.gridElements.length}, visible panels: ${layoutCheck.visiblePanelCount}`);

              // CHECK 4: artifact_panel — right-side artifact/code panel
              const artifactEl = await page.$('[class*="artifact"], [class*="Artifact"], [class*="code-panel"], [class*="codePanel"], [class*="preview"], [class*="result-panel"], [data-testid*="artifact"]');
              log('artifact_panel', !!artifactEl, artifactEl ? 'Artifact panel element found' : 'Artifact panel not found (checked: [class*=artifact], [class*=code-panel], [class*=preview])');

              // CHECK 5: brand_background — body or root bg is #020617
              const bgCheck = await page.evaluate(() => {
                const els = [document.body, document.documentElement, document.querySelector('#__next'), document.querySelector('[class*="layout"]'), document.querySelector('main')].filter(Boolean);
                const target = '#020617';
                for (const el of els) {
                  const bg = window.getComputedStyle(el).backgroundColor;
                  // Convert rgb to hex for comparison
                  const m = bg.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
                  if (m) {
                    const hex = '#' + [m[1],m[2],m[3]].map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
                    if (hex === target) return { found: true, element: el.tagName, hex };
                  }
                  // Direct string match
                  if (bg === target || bg.toLowerCase() === target) return { found: true, element: el.tagName, bg };
                }
                // Fallback: check CSS variables
                const cssVar = window.getComputedStyle(document.documentElement).getPropertyValue('--background') || '';
                return { found: false, cssVar: cssVar.trim(), sampleBg: window.getComputedStyle(document.body).backgroundColor };
              });
              log('brand_background', bgCheck.found,
                bgCheck.found
                  ? `#020617 found on ${bgCheck.element}`
                  : `#020617 not detected — body bg: ${bgCheck.sampleBg}, CSS var: ${bgCheck.cssVar || 'none'}`);

              await ctx.close();

              // ── Mobile viewport (375×812) ────────────────────────────────────
              console.log('\n=== Mobile 375×812 ===');
              const mCtx = await browser.newContext({ viewport: { width: 375, height: 812 } });
              const mPage = await mCtx.newPage();
              await mPage.goto(TARGET, { timeout: 45000, waitUntil: 'domcontentloaded' });
              await mPage.waitForTimeout(5000);

              const mobileShot = `${shotDir}/mobile-${ts}.png`;
              await mPage.screenshot({ path: mobileShot, fullPage: false });

              // CHECK 6: mobile_responsive — no horizontal overflow
              const mobileOk = await mPage.evaluate(() => {
                const overflowX = document.documentElement.scrollWidth > 385;
                const bodyOverflow = document.body.scrollWidth > 385;
                return { overflowX, bodyOverflow, docWidth: document.documentElement.scrollWidth, bodyWidth: document.body.scrollWidth };
              });
              log('mobile_responsive', !mobileOk.overflowX && !mobileOk.bodyOverflow,
                !mobileOk.overflowX && !mobileOk.bodyOverflow
                  ? `375px viewport clean — doc: ${mobileOk.docWidth}px, body: ${mobileOk.bodyWidth}px`
                  : `Horizontal overflow — doc: ${mobileOk.docWidth}px, body: ${mobileOk.bodyWidth}px`);

              await mCtx.close();

              // ── API functional check ─────────────────────────────────────────
              console.log('\n=== API Functional (send test message) ===');
              const apiCtx = await browser.newContext({ viewport: { width: 1440, height: 900 } });
              const apiPage = await apiCtx.newPage();
              const apiResponses = [];
              apiPage.on('response', async res => {
                const url = res.url();
                if (url.includes('/api/') || url.includes('/chat') || url.includes('/message') || url.includes('zonewise')) {
                  try {
                    const ct = res.headers()['content-type'] || '';
                    if (ct.includes('json')) {
                      const text = await res.text().catch(() => '');
                      apiResponses.push({ url, status: res.status(), body: text.slice(0, 500) });
                    }
                  } catch (_) {}
                }
              });

              await apiPage.goto(TARGET, { timeout: 45000, waitUntil: 'domcontentloaded' });
              await apiPage.waitForTimeout(5000);

              const TEST_MESSAGE = '1600 Orlando Ave Cocoa Beach FL';
              let apiCheckPassed = false;
              let apiCheckDetail = 'Could not find input to send message';

              const inputEl = await apiPage.$('textarea, [contenteditable="true"], input[type="text"]');
              if (inputEl) {
                await inputEl.click();
                await inputEl.fill(TEST_MESSAGE);
                await apiPage.waitForTimeout(500);

                // Try Enter key or submit button
                await apiPage.keyboard.press('Enter');
                await apiPage.waitForTimeout(8000);

                const apiShot = `${shotDir}/api-response-${ts}.png`;
                await apiPage.screenshot({ path: apiShot, fullPage: false });

                // Check page body for parcel/zone keywords
                const pageBody = await apiPage.textContent('body').catch(() => '');
                const hasKeyword = /parcel|zone|zoning|property|assessor/i.test(pageBody) ||
                  apiResponses.some(r => /parcel|zone|zoning|property/i.test(r.body));

                if (hasKeyword) {
                  apiCheckPassed = true;
                  apiCheckDetail = 'Response contains "parcel" or "zone" keyword';
                } else {
                  apiCheckDetail = `No parcel/zone keyword in page or ${apiResponses.length} API responses captured`;
                }
              }
              log('api_functional', apiCheckPassed, apiCheckDetail);

              await apiCtx.close();
              await browser.close();

              // ── Console errors check ─────────────────────────────────────────
              console.log(`\nConsole errors captured: ${consoleErrors.length}`);
              if (consoleErrors.length > 0) {
                console.log('  First 3:', consoleErrors.slice(0, 3).join('\n  '));
              }

              // ── Upload screenshots to Supabase ───────────────────────────────
              console.log('\n=== Uploading screenshots to Supabase ===');
              const desktopUrl = await uploadToSupabase(desktopShot, `desktop-${ts}.png`);
              const mobileUrl = await uploadToSupabase(mobileShot, `mobile-${ts}.png`);
              console.log('Desktop screenshot:', desktopUrl || 'upload failed/skipped');
              console.log('Mobile screenshot:', mobileUrl || 'upload failed/skipped');

              // ── Persist to deployment_checks ─────────────────────────────────
              const passed = results.filter(r => r.passed).length;
              const failed = results.filter(r => !r.passed).length;
              const overallStatus = failed === 0 ? 'pass' : 'fail';

              await persistToSupabase({
                url: TARGET,
                status: overallStatus,
                http_code: 200,
                load_ms: 0,
                checks_json: results,
                errors_json: consoleErrors.slice(0, 10),
                has_screenshot: !!(desktopUrl || mobileUrl),
                verified_at: new Date().toISOString(),
              });

              // ── Build GitHub comment ─────────────────────────────────────────
              const checkLines = results.map(r => `| ${r.passed ? '✅' : '❌'} | \`${r.name}\` | ${r.detail} |`).join('\n');
              const statusEmoji = failed === 0 ? '✅' : '❌';
              const comment = `## ${statusEmoji} chat-v2 Playwright Verification — ${new Date().toISOString().slice(0, 16)} UTC

            **Result: ${passed}/7 checks passed**

            | Status | Check | Detail |
            |--------|-------|--------|
            ${checkLines}

            **Console errors:** ${consoleErrors.length === 0 ? 'None ✅' : `${consoleErrors.length} errors ⚠️`}

            **Screenshots:**
            ${desktopUrl ? `- [Desktop 1440×900](${desktopUrl})` : '- Desktop: upload failed/skipped'}
            ${mobileUrl ? `- [Mobile 375×812](${mobileUrl})` : '- Mobile: upload failed/skipped'}

            ${failed === 0 ? '🎯 **All 7 checks PASSING — enterprise-grade quality confirmed.**' : `⚠️ **${failed} check(s) failing — retry loop continuing.**`}

            _Verified from Hetzner 87.99.129.125 via Playwright headless Chromium_`;

              console.log('\n=== GitHub Issue Comment ===');
              console.log(comment);
              await commentOnIssue(comment);

              // ── Telegram summary ─────────────────────────────────────────────
              const tgMsg = `${statusEmoji} *chat-v2 Playwright — ${passed}/7 PASS*\n${results.map(r => `${r.passed ? '✅' : '❌'} ${r.name}: ${r.detail.slice(0,60)}`).join('\n')}\nConsole errors: ${consoleErrors.length}\n${desktopUrl ? `[Screenshot](${desktopUrl})` : ''}`;
              await sendTelegram(tgMsg, desktopUrl ? null : desktopShot);

              return { passed, failed, overallStatus, results };
            }

            (async () => {
              const maxAttempts = parseInt(process.env.MAX_ATTEMPTS || '5');
              let attempt = 0;
              let lastResult = null;

              while (attempt < maxAttempts) {
                attempt++;
                console.log(`\n${'='.repeat(60)}`);
                console.log(`ATTEMPT ${attempt}/${maxAttempts} — ${new Date().toISOString()}`);
                console.log('='.repeat(60));

                try {
                  lastResult = await runVerification();
                  if (lastResult.failed === 0) {
                    console.log(`\n🎉 ALL 7 CHECKS PASSED on attempt ${attempt}!`);
                    process.exit(0);
                  } else {
                    console.log(`\n❌ ${lastResult.failed} checks failed on attempt ${attempt}. Waiting 15min before retry...`);
                    if (attempt < maxAttempts) {
                      await new Promise(r => setTimeout(r, 15 * 60 * 1000));
                    }
                  }
                } catch (e) {
                  console.error(`Attempt ${attempt} threw:`, e.message);
                  if (attempt < maxAttempts) {
                    console.log('Waiting 5min before retry...');
                    await new Promise(r => setTimeout(r, 5 * 60 * 1000));
                  }
                }
              }

              const failCount = lastResult ? lastResult.failed : 7;
              console.log(`\n⛔ LOOP EXHAUSTED after ${maxAttempts} attempts — ${failCount} checks still failing`);
              process.exit(1);
            })();
            VERIFYEOF

            node verify-chat-v2.js
            EXIT_CODE=$?
            cd /tmp && rm -rf "$WORK_DIR"
            exit $EXIT_CODE

      # ── Step 3: Notify on complete ────────────────────────────────────────────
      - name: "Final status"
        if: always()
        run: |
          if [ "${{ steps.playwright.outcome }}" = "success" ]; then
            echo "✅ chat-v2 verification PASSED — all 7 checks green"
          else
            echo "❌ chat-v2 verification FAILED or loop exhausted after ${{ inputs.max_attempts || 5 }} attempts"
            exit 1
          fi
