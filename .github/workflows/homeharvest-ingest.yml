name: homeharvest-ingest
# Weekly batch pull of Realtor.com closed-sales + rental comps via HomeHarvest.
# Interim/bootstrap comps source (Ariel, Aug 16 2026) -- scheduled batch only,
# never live-per-request. Writes public.sale_listings / public.rental_listings,
# source='homeharvest_realtor_com'.
# Rotates through all 67 FL counties by parcel-count priority (Brevard every
# run) -- see scripts/homeharvest_ingest.py FL_ALL_67_COUNTIES for the batching
# logic.
#
# Scheduling lives in pg_cron (jobname 'homeharvest-rental-weekly', jobid 11116,
# '0 9 * * 1'), NOT in this workflow's `on:` block -- pg_cron calls
# public.dispatch_homeharvest_rental_ingest(), which fires workflow_dispatch here.
# This keeps one scheduler of record (visible in cron.job like every other
# recurring job in this project) instead of two independent weekly triggers.

on:
  workflow_dispatch:
    inputs:
      counties:
        description: "Comma-separated FL county names (overrides weekly batch, e.g. Brevard,Orange)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no writes)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install homeharvest pandas httpx

      - name: Run ingestion
        run: |
          if [ -n "${{ inputs.counties }}" ]; then
            ARGS="--counties ${{ inputs.counties }}"
          else
            ARGS="--batch --batch-size 6"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/homeharvest_ingest.py $ARGS
