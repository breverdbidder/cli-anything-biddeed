name: homeharvest-ingest
# Weekly scheduled batch pull of Realtor.com closed-sales + rental comps via
# HomeHarvest. Interim/bootstrap comps source (Ariel, Aug 16 2026) -- scheduled
# batch only, never live-per-request. Writes public.sale_listings /
# public.rental_listings, source='homeharvest_realtor_com'.
# Rotates through the Gold Standard county list weekly (Brevard every run) --
# see scripts/homeharvest_ingest.py FL_PRIORITY_COUNTIES for the batching logic.

on:
  workflow_dispatch:
    inputs:
      counties:
        description: "Comma-separated FL county names (overrides weekly batch, e.g. Brevard,Orange)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no writes)"
        required: false
        default: "false"
  schedule:
    - cron: "0 9 * * 1"  # Mondays 9AM UTC (weekly cadence per compliance guardrails)

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install homeharvest pandas httpx

      - name: Run ingestion
        run: |
          if [ -n "${{ inputs.counties }}" ]; then
            ARGS="--counties ${{ inputs.counties }}"
          else
            ARGS="--batch --batch-size 6"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/homeharvest_ingest.py $ARGS
