name: "Gold Standard SHARD-3 E18709 (pasco/franklin/walton/union/levy)"

# dispatch_id: e5c9db2a-3ee1-462d-b7aa-be8f12a1562c
# Counties: pasco (9/10 I), franklin (7/10 E+I+J), walton (7/10 E+I+J), union (6/10 C+D), levy (5/10 C+D+E+I+J)
# Session: architect-20260811T080000
# Issue: https://github.com/breverdbidder/cli-anything-biddeed/issues/18709

on:
  workflow_dispatch:
  schedule:
    # 08:00Z daily — aligns with SHARD-3 08:00Z wave
    - cron: '0 8 * * *'

concurrency:
  group: gold-standard-shard3-e18709
  cancel-in-progress: false

jobs:
  apply-fixes:
    name: "Apply SHARD-3 E18709 Fixes (pasco/franklin/walton/union/levy)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Run shard3 e18709 fix script
        run: python3 scripts/shard3_e18709_pasco_franklin_walton_union_levy_fix.py | tee /tmp/shard3_e18709_output.txt

      - name: Upload results summary
        if: always()
        run: |
          echo "## SHARD-3 E18709 Results — pasco/franklin/walton/union/levy" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/shard3_e18709_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  verify:
    name: "Verify SHARD-3 E18709 Scoreboard"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [apply-fixes]
    if: always()
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Verify all 5 counties
        run: |
          python3 - << 'EOF'
          import os, httpx, json, sys

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=120)

          # SET statement_timeout = 0 per HARD GUARDRAILS
          client.post(URL, headers=H, json={'query': 'SET statement_timeout = 0;'})

          print('### SQL VERIFICATION - SHARD-3 E18709 (2026-08-11)')
          all_ok = True
          scores = {}
          results_json = {}

          for county in ('pasco', 'franklin', 'walton', 'union', 'levy'):
              r = client.post(URL, headers=H,
                              json={'query': f"SELECT * FROM public.pencil_dod_evaluate_county('{county}');"})
              data = r.json()
              row = data[0] if data else {}
              result = row.get('pencil_dod_evaluate_county', row)
              passes = sum(1 for letter in 'ABCDEFGHIJ'
                           if isinstance(result.get(letter), dict)
                           and result[letter].get('pass') is True)
              fails = [letter for letter in 'ABCDEFGHIJ'
                       if isinstance(result.get(letter), dict)
                       and result[letter].get('pass') is not True]
              scores[county] = passes
              results_json[county] = result
              status = '✓ GOLD' if passes == 10 else f'FAIL={fails}'
              print(f'  {county}: {passes}/10 {status}')
              print(f'  Raw: {json.dumps(result, default=str)[:800]}')
              print()

          print('=== gold_standard_county_status ===')
          r2 = client.post(URL, headers=H, json={'query': """
              SELECT county_slug, score, letters_passing, letters_failing, updated_at
              FROM gold_standard_county_status
              WHERE county_slug IN ('pasco','franklin','walton','union','levy')
              ORDER BY score DESC;
          """})
          for row in (r2.json() or []):
              print(f'  {row}')

          print()
          print('=== ENTRY vs EXIT COMPARISON ===')
          entry = {
              'pasco': {'score': 9, 'failing': ['I']},
              'franklin': {'score': 7, 'failing': ['E', 'I', 'J']},
              'walton': {'score': 7, 'failing': ['E', 'I', 'J']},
              'union': {'score': 6, 'failing': ['B', 'C', 'D', 'F']},
              'levy': {'score': 5, 'failing': ['C', 'D', 'E', 'I', 'J']},
          }
          for county, entry_data in entry.items():
              before = entry_data['score']
              after = scores.get(county, 0)
              delta = after - before
              sign = '+' if delta >= 0 else ''
              print(f'  {county}: {before}/10 -> {after}/10 ({sign}{delta})')

          print()
          print(f'Timestamp UTC: {__import__("datetime").datetime.utcnow().isoformat()}Z')

          # Certify if any county hit 10/10
          any_gold = any(s == 10 for s in scores.values())
          if any_gold:
              r3 = client.post(URL, headers=H,
                               json={'query': 'SELECT public.gold_standard_certify();'})
              print(f'  CERTIFY result = {r3.json()}')
          EOF
        continue-on-error: true
