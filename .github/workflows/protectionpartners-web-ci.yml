name: "Protection Partners Web CI"

on:
  push:
    paths: ['sites/protectionpartners-web/**']
    branches: [main]
  pull_request:
    paths: ['sites/protectionpartners-web/**']

defaults:
  run:
    working-directory: sites/protectionpartners-web

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sites/protectionpartners-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_DOMAIN: protectionpartners.pages.dev
