name: "Gold Standard SHARD-14: baker CDEI Fix"

# Fixes baker county letters C, D, E, I
# Scrapes baker.realtaxdeed.com + baker.realforeclose.com to get address/parcel data
# Links parcels via Baker County PA ArcGIS
# Enriches via FL GIO statewide cadastral (co_no=12)
# Backfills parity_status for C/D criterion
# dispatch_id: 5c3a52ba-5ab1-4fc7-aec2-669ee8066d1b

on:
  workflow_dispatch:
    inputs:
      n_dates:
        description: "Number of past auction dates to scrape (default 24)"
        required: false
        default: "24"
  schedule:
    # Run daily at 09:30 UTC until baker reaches 10/10
    - cron: '30 9 * * *'

concurrency:
  group: gold-standard-shard14-baker
  cancel-in-progress: false

jobs:
  baker-cdei-fix:
    name: "Baker County C/D/E/I Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      N_DATES: ${{ github.event.inputs.n_dates || '24' }}
      THROTTLE: "1.5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install urllib3 --quiet

      - name: Run Baker CDEI fix
        run: |
          set -euo pipefail
          echo "=== Baker County CDEI Fix ==="
          echo "dispatch_id: 5c3a52ba-5ab1-4fc7-aec2-669ee8066d1b"
          echo "n_dates: ${N_DATES}"
          python3 scripts/gold_standard_shard14_baker_cdei_fix.py 2>&1 | tee /tmp/baker_cdei_output.txt
          echo "::notice::Baker CDEI fix script completed"

      - name: Verify baker pencil_dod
        run: |
          set -euo pipefail
          echo "=== Verifying baker pencil_dod_evaluate_county ==="
          python3 -c "
          import os, json, urllib.request

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}

          req = urllib.request.Request(URL, data=json.dumps({
              'query': \"SELECT * FROM public.pencil_dod_evaluate_county('baker');\"
          }).encode(), headers=H, method='POST')
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read())

          if not data:
              print('ERROR: no data from pencil_dod_evaluate_county')
              raise SystemExit(1)

          row = data[0]
          result = row.get('pencil_dod_evaluate_county', row)
          if isinstance(result, str):
              result = json.loads(result)

          print('### SQL VERIFICATION — Baker County pencil_dod_evaluate_county')
          print(f'county=baker auctions_total={result.get(\"auctions_total\")}')
          passes = []
          fails = []
          for k, v in result.items():
              if k not in ('county', 'auctions_total', 'V2_LITMUS') and isinstance(v, dict):
                  status = 'PASS' if v.get('pass') else 'FAIL'
                  metric = round(v.get('metric', 0) or 0, 1)
                  detail = v.get('detail', '')
                  print(f'  {status}  {k}: metric={metric} | {detail}')
                  if v.get('pass'):
                      passes.append(k)
                  else:
                      fails.append(k)
          print()
          print(f'PASS ({len(passes)}/10): {passes}')
          print(f'FAIL ({len(fails)}/10): {fails}')
          print()
          print(f'Full JSON: {json.dumps(result)}')
          " 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check ultraloop audit rows
        run: |
          python3 -c "
          import os, json, urllib.request

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}

          req = urllib.request.Request(URL, data=json.dumps({
              'query': \"\"\"
                SELECT letter, claim, survived, created_at
                FROM public.gold_standard_ultraloop_audit
                WHERE dispatch_id = '5c3a52ba-5ab1-4fc7-aec2-669ee8066d1b'
                  AND county_slug = 'baker'
                ORDER BY created_at DESC LIMIT 20;
              \"\"\"
          }).encode(), headers=H, method='POST')
          with urllib.request.urlopen(req, timeout=60) as r:
              rows = json.loads(r.read())

          print(f'Ultraloop audit rows: {len(rows)}')
          for row in rows:
              print(f'  {row.get(\"letter\")}: survived={row.get(\"survived\")} | {row.get(\"claim\",\"\")[:80]}')
          " 2>&1
