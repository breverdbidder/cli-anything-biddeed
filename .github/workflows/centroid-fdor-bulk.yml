name: centroid-fdor-bulk

on:
  workflow_dispatch:
    inputs:
      co_no_override:
        description: "Single co_no (blank = all pending)"
        required: false
        default: ""

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix
        id: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CO_NO_OVERRIDE: ${{ github.event.inputs.co_no_override }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json
          url = os.environ["SUPABASE_URL"]; key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          hdrs = {"apikey": key, "Authorization": f"Bearer {key}"}
          override = os.environ.get("CO_NO_OVERRIDE","").strip()
          params = ({"co_no": f"eq.{override}", "select": "co_no,county_name,centroids_done"}
                    if override else
                    {"status": "in.(pending)", "select": "co_no,county_name,centroids_done",
                     "order": "total_parcels.asc"})
          rows = requests.get(f"{url}/rest/v1/fl_parcel_centroid_progress", headers=hdrs, params=params).json()
          print(f"Counties queued: {len(rows)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f'matrix={json.dumps({"include":[{"co_no":r["co_no"],"county_name":r["county_name"],"resume_offset":r.get("centroids_done") or 0} for r in rows]})}\n')
          PYEOF

  harvest:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
      max-parallel: 4
      fail-fast: false
    name: "[${{ matrix.co_no }}] ${{ matrix.county_name }}"
    steps:
      - name: Install deps
        run: pip install requests --quiet

      - name: Harvest centroids via RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CO_NO: ${{ matrix.co_no }}
          COUNTY_NAME: ${{ matrix.county_name }}
          RESUME_OFFSET: ${{ matrix.resume_offset }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time, sys, json

          CO_NO         = int(os.environ["CO_NO"])
          COUNTY_NAME   = os.environ["COUNTY_NAME"]
          RESUME_OFFSET = int(os.environ.get("RESUME_OFFSET","0") or "0")
          SB_URL        = os.environ["SUPABASE_URL"]
          SB_KEY        = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          SB_HDRS       = {"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}",
                           "Content-Type":"application/json","Prefer":"return=minimal"}

          CENTROID_FS = ("https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest"
                         "/services/Florida_Statewide_Parcel_Centroid_Version/FeatureServer/0/query")
          BROWSER_UA  = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                         "AppleWebKit/537.36 (KHTML, like Gecko) "
                         "Chrome/124.0.0.0 Safari/537.36")

          PAGE    = 2000
          RETRIES = 6
          BATCH   = 1000   # RPC = single DB transaction, handles large batches safely

          session = requests.Session()
          session.headers.update({"User-Agent":BROWSER_UA,
                                  "Accept":"application/json",
                                  "Referer":"https://www.arcgis.com/"})

          def sb_patch(p):
              requests.patch(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",
                             headers=SB_HDRS, params={"co_no":f"eq.{CO_NO}"}, json=p)

          def upsert_rpc(rows):
              """Single DB transaction via upsert_centroids RPC — no PostgREST row overhead."""
              seen = {}
              for r in rows: seen[r["parcel_id"]] = r
              payload = {"rows": list(seen.values())}
              r = requests.post(
                  f"{SB_URL}/rest/v1/rpc/upsert_centroids",
                  headers={**SB_HDRS, "Prefer": "return=representation"},
                  json=payload, timeout=120)
              if r.status_code not in (200, 201):
                  raise RuntimeError(f"rpc {r.status_code}: {r.text[:300]}")
              return r.json() if r.text else 0

          def get_oid_range():
              for attempt in range(RETRIES):
                  try:
                      r = session.get(CENTROID_FS, params={
                          "where":f"CO_NO={CO_NO}","outFields":"OBJECTID",
                          "returnGeometry":"false",
                          "outStatistics":'[{"statisticType":"min","onStatisticField":"OBJECTID","outStatisticFieldName":"min_oid"},{"statisticType":"max","onStatisticField":"OBJECTID","outStatisticFieldName":"max_oid"}]',
                          "f":"json"}, timeout=60)
                      d = r.json()
                      if "features" in d and d["features"]:
                          a = d["features"][0]["attributes"]
                          return a.get("min_oid"), a.get("max_oid")
                      raise RuntimeError(f"stats: {d.get('error','no features')}")
                  except Exception as e:
                      if attempt==RETRIES-1: raise
                      time.sleep(min(120,4**attempt))

          def fetch_chunk(min_oid, max_oid):
              for attempt in range(RETRIES):
                  try:
                      r = session.get(CENTROID_FS, params={
                          "where":f"CO_NO={CO_NO} AND OBJECTID>={min_oid} AND OBJECTID<={max_oid}",
                          "outFields":"PARCEL_ID,OBJECTID","returnGeometry":"true",
                          "resultRecordCount":PAGE,"outSR":"4326","f":"json"}, timeout=120)
                      d = r.json()
                      if "error" in d: raise RuntimeError(str(d["error"]))
                      return d.get("features",[])
                  except Exception as e:
                      if attempt==RETRIES-1: raise
                      time.sleep(min(120,4**attempt))

          sb_patch({"status":"running","started_at":"now()","error_msg":None})
          print(f"[{CO_NO}] {COUNTY_NAME} start (resume={RESUME_OFFSET})")

          tw = RESUME_OFFSET; batch = []
          try:
              min_oid, max_oid = get_oid_range()
              if min_oid is None:
                  sb_patch({"status":"done","centroids_done":0,"completed_at":"now()","updated_at":"now()"})
                  sys.exit(0)

              print(f"[{CO_NO}] OID {min_oid}→{max_oid}")

              # Resume: skip proportionally into OID space
              if RESUME_OFFSET > 0:
                  oid_span = max_oid - min_oid
                  skip_ratio = RESUME_OFFSET / max(max_oid - min_oid, 1)
                  cursor = min_oid + int(oid_span * skip_ratio * 0.9)
                  print(f"[{CO_NO}] Resuming from OID ~{cursor}")
              else:
                  cursor = min_oid

              while cursor <= max_oid:
                  chunk_end = cursor + 20000
                  features  = fetch_chunk(cursor, chunk_end)

                  for f in features:
                      geom = f.get("geometry")
                      pid  = f.get("attributes",{}).get("PARCEL_ID")
                      if not pid or not geom: continue
                      lng, lat = geom.get("x"), geom.get("y")
                      if lng is None or lat is None: continue
                      if not(-90<=lat<=90) or not(-180<=lng<=180): continue
                      batch.append({"parcel_id":pid,"co_no":CO_NO,
                                    "centroid_lat":round(lat,7),
                                    "centroid_lng":round(lng,7)})
                      if len(batch) >= BATCH:
                          upsert_rpc(batch); tw += len(batch); batch = []

                  if features:
                      cursor = max(f["attributes"]["OBJECTID"] for f in features)+1
                  else:
                      cursor = chunk_end+1

                  print(f"  cursor={cursor}/{max_oid} written={tw}")
                  if tw % 10000 < BATCH:
                      sb_patch({"centroids_done":tw,"updated_at":"now()"})
                  time.sleep(0.3)

              if batch: upsert_rpc(batch); tw += len(batch)
              sb_patch({"status":"done","centroids_done":tw,
                        "completed_at":"now()","updated_at":"now()"})
              print(f"[{CO_NO}] {COUNTY_NAME} DONE — {tw:,}")

          except Exception as e:
              sb_patch({"status":"error","error_msg":str(e)[:500],"updated_at":"now()"})
              print(f"[{CO_NO}] ERROR: {e}",file=sys.stderr); sys.exit(1)
          PYEOF

  audit:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Scoreboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          url=os.environ["SUPABASE_URL"]; key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          hdrs={"apikey":key,"Authorization":f"Bearer {key}"}
          rows=requests.get(f"{url}/rest/v1/fl_parcel_centroid_progress",headers=hdrs,
                            params={"select":"co_no,county_name,status,centroids_done,total_parcels","order":"co_no.asc"}).json()
          done=[x for x in rows if x["status"]=="done"]
          errors=[x for x in rows if x["status"]=="error"]
          tw=sum(x["centroids_done"] or 0 for x in rows)
          tp=sum(x["total_parcels"] or 0 for x in rows)
          print(f"done={len(done)}/67 errors={len(errors)} written={tw:,}/{tp:,} pct={tw/tp*100:.1f}%" if tp else "")
          [print(f"  ERROR [{e['co_no']}] {e['county_name']}: {(e.get('error_msg') or '')[:100]}") for e in errors]
          PYEOF
