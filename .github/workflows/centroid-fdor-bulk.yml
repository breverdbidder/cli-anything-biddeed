name: centroid-fdor-bulk

on:
  workflow_dispatch:
    inputs:
      co_no_override:
        description: "Single co_no to run (blank = all pending)"
        required: false
        default: ""
      reset_false_done:
        description: "Reset false-done counties before run (true/false)"
        required: false
        default: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Reset false-done + build pending matrix
        id: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESET_FALSE_DONE: ${{ github.event.inputs.reset_false_done }}
          CO_NO_OVERRIDE: ${{ github.event.inputs.co_no_override }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json
          url  = os.environ["SUPABASE_URL"]
          key  = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          hdrs = {"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"}
          if os.environ.get("RESET_FALSE_DONE","true").lower() == "true":
              r = requests.patch(f"{url}/rest/v1/fl_parcel_centroid_progress", headers={**hdrs, "Prefer":"return=minimal"}, params={"status": "eq.done", "centroids_done": "eq.0"}, json={"status": "pending", "error_msg": "reset: false_done detected"})
              print(f"Reset false-done HTTP {r.status_code}")
          override = os.environ.get("CO_NO_OVERRIDE","").strip()
          if override:
              params = {"co_no": f"eq.{override}", "select": "co_no,county_name,total_parcels"}
          else:
              params = {"status": "in.(pending,running)", "select": "co_no,county_name,total_parcels", "order": "total_parcels.asc"}
          r = requests.get(f"{url}/rest/v1/fl_parcel_centroid_progress", headers=hdrs, params=params)
          rows = r.json()
          print(f"Pending counties: {len(rows)}")
          matrix = {"include": [{"co_no": row["co_no"], "county_name": row["county_name"]} for row in rows]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          PYEOF

  harvest:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false
    name: "co_no=${{ matrix.co_no }} (${{ matrix.county_name }})"
    steps:
      - name: Install deps
        run: pip install requests --quiet
      - name: Harvest FDOR centroids
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CO_NO: ${{ matrix.co_no }}
          COUNTY_NAME: ${{ matrix.county_name }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time, sys
          CO_NO=int(os.environ["CO_NO"]); COUNTY_NAME=os.environ["COUNTY_NAME"]
          SB_URL=os.environ["SUPABASE_URL"]; SB_KEY=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          SB_HDRS={"apikey":SB_KEY,"Authorization":f"Bearer {SB_KEY}","Content-Type":"application/json","Prefer":"return=minimal"}
          FDOR_FS="https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest/services/Florida_Statewide_Cadastral/FeatureServer/0/query"
          PAGE_SIZE=2000; MAX_RETRIES=4; BATCH_SIZE=500
          def patch_progress(p): requests.patch(f"{SB_URL}/rest/v1/fl_parcel_centroid_progress",headers=SB_HDRS,params={"co_no":f"eq.{CO_NO}"},json=p)
          def upsert_batch(rows):
              r=requests.post(f"{SB_URL}/rest/v1/fl_parcels",headers={**SB_HDRS,"Prefer":"resolution=merge-duplicates,return=minimal"},json=rows)
              if r.status_code not in (200,201): raise RuntimeError(f"upsert {r.status_code}: {r.text[:300]}")
          def fdor_page(offset):
              params={"where":f"CO_NO={CO_NO}","outFields":"PARCEL_ID,CO_NO","returnCentroid":"true","returnGeometry":"false","resultOffset":offset,"resultRecordCount":PAGE_SIZE,"outSR":"4326","f":"json"}
              for a in range(MAX_RETRIES):
                  try:
                      r=requests.get(FDOR_FS,params=params,timeout=60); r.raise_for_status(); data=r.json()
                      if "error" in data: raise RuntimeError(f"FDOR:{data['error']}")
                      return data.get("features",[])
                  except Exception as e:
                      if a==MAX_RETRIES-1: raise
                      time.sleep(2**a)
          patch_progress({"status":"running","started_at":"now()","error_msg":None})
          print(f"[{CO_NO}] {COUNTY_NAME} start")
          tw=0; offset=0; batch=[]
          try:
              while True:
                  features=fdor_page(offset)
                  if not features: break
                  for f in features:
                      c=f.get("centroid"); a=f.get("attributes",{}); pid=a.get("PARCEL_ID") or a.get("parcel_id")
                      if not pid or not c: continue
                      lat=c.get("y"); lng=c.get("x")
                      if lat is None or lng is None: continue
                      batch.append({"parcel_id":pid,"co_no":CO_NO,"centroid_lat":round(lat,7),"centroid_lng":round(lng,7),"updated_at":"now()"})
                      if len(batch)>=BATCH_SIZE: upsert_batch(batch); tw+=len(batch); batch=[]
                  offset+=len(features); print(f"  offset={offset} written={tw}")
                  if tw%10000<BATCH_SIZE: patch_progress({"centroids_done":tw,"updated_at":"now()"})
                  if len(features)<PAGE_SIZE: break
              if batch: upsert_batch(batch); tw+=len(batch)
              patch_progress({"status":"done","centroids_done":tw,"completed_at":"now()","updated_at":"now()"})
              print(f"[{CO_NO}] {COUNTY_NAME} DONE {tw}")
          except Exception as e:
              patch_progress({"status":"error","error_msg":str(e)[:500],"updated_at":"now()"})
              print(f"[{CO_NO}] ERROR:{e}",file=sys.stderr); sys.exit(1)
          PYEOF

  audit:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Scoreboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          url=os.environ["SUPABASE_URL"]; key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          hdrs={"apikey":key,"Authorization":f"Bearer {key}"}
          rows=requests.get(f"{url}/rest/v1/fl_parcel_centroid_progress",headers=hdrs,params={"select":"co_no,county_name,status,centroids_done,total_parcels","order":"co_no.asc"}).json()
          done=[x for x in rows if x["status"]=="done"]; errors=[x for x in rows if x["status"]=="error"]
          tw=sum(x["centroids_done"] or 0 for x in rows); tp=sum(x["total_parcels"] or 0 for x in rows)
          print(f"done={len(done)}/67 errors={len(errors)} written={tw:,}/{tp:,} pct={tw/tp*100:.1f}%" if tp else "no data")
          [print(f"  ERROR co_no={e['co_no']} {e['county_name']}") for e in errors]
          PYEOF
