name: Set Chatwoot Worker Secrets

# Idempotent. Copies the Chatwoot repo secrets (added by Ariel in the GitHub UI,
# 2026-09-04) onto the production Cloudflare Worker, skipping any that are
# empty, then redeploys so the new version sees them (secrets added by
# `wrangler secret put` only become visible to a fresh deployment — learned
# on the C2 SUPABASE_SERVICE_ROLE_KEY binding). CHATWOOT_WEBHOOK_SECRET is
# bound separately from the vault (set-worker-secret-from-vault.yml).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Put Chatwoot secrets on the Worker (skip empties)
        env:
          CHATWOOT_BOT_TOKEN: ${{ secrets.CHATWOOT_BOT_TOKEN }}
          CHATWOOT_INBOX_MAP: ${{ secrets.CHATWOOT_INBOX_MAP }}
          CHATWOOT_WEBSITE_TOKEN_BIDDEED: ${{ secrets.CHATWOOT_WEBSITE_TOKEN_BIDDEED }}
          CHATWOOT_SIGNING_SECRET: ${{ secrets.CHATWOOT_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          for name in CHATWOOT_BOT_TOKEN CHATWOOT_INBOX_MAP CHATWOOT_WEBSITE_TOKEN_BIDDEED CHATWOOT_SIGNING_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then echo "skip $name (empty)"; continue; fi
            echo "::add-mask::$value"
            echo "$value" | npx wrangler secret put "$name"
            echo "bound $name"
          done

      - name: Redeploy so the new version sees the secrets
        run: npx wrangler deploy --no-bundle
