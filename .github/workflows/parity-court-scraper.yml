name: PARITY Court Scraper (Firecrawl) v2

on:
  workflow_dispatch:
    inputs:
      batch_payload:
        description: 'JSON array of items: [{mca_id,url,county,case_number}]'
        required: true
      run_label:
        description: 'Tracking label for this batch'
        required: false
        default: 'manual'
      dispatch_id:
        description: 'court_workflow_dispatches.id for callback patch'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx
      - name: Scrape PREVIEW pages + harvest AITEM blocks + writeback
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_PAYLOAD: ${{ inputs.batch_payload }}
          RUN_LABEL: ${{ inputs.run_label }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, time, httpx
          from datetime import datetime

          FC  = os.environ['FIRECRAWL_API_KEY']
          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_KEY']
          ITEMS = json.loads(os.environ.get('BATCH_PAYLOAD','[]'))
          RUN   = os.environ.get('GH_RUN_ID','')
          LBL   = os.environ.get('RUN_LABEL','manual')
          DISP  = os.environ.get('DISPATCH_ID','')

          H  = {'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}
          HR = {**H, 'Prefer': 'return=representation'}
          HU = {**H, 'Prefer': 'resolution=merge-duplicates'}

          def fc_scrape(url):
              try:
                  r = httpx.post('https://api.firecrawl.dev/v1/scrape',
                      headers={'Authorization': f'Bearer {FC}','Content-Type':'application/json'},
                      json={'url':url,'formats':['html','markdown'],
                            'waitFor':4000,'timeout':45000,'onlyMainContent':False},
                      timeout=90.0)
                  try: return r.status_code, r.json()
                  except Exception: return r.status_code, {'_text': r.text[:1000]}
              except Exception as e:
                  return 0, {'error': str(e)[:300]}

          def to_float(s):
              if not s: return None
              m = re.search(r'\$?([\d,]+\.?\d*)', s)
              if not m: return None
              try: return float(m.group(1).replace(',',''))
              except Exception: return None

          def strip_html(s):
              if not s: return None
              t = re.sub(r'\s+',' ', re.sub(r'<[^>]+>','', s)).strip()
              return t or None

          def extract_href(s):
              if not s: return None
              m = re.search(r'href="([^"]+)"', s)
              return m.group(1) if m else None

          def parse_starts(s):
              if not s: return None
              cleaned = re.sub(r'\s+(?:ET|EST|EDT|CT|CST|CDT|MT|MST|MDT|PT|PST|PDT)\s*$','', s.strip())
              for fmt in ('%m/%d/%Y %I:%M %p','%m/%d/%Y %H:%M','%m/%d/%Y'):
                  try: return datetime.strptime(cleaned, fmt).isoformat()
                  except Exception: continue
              return None

          def parse_aitem_blocks(html, county_sub):
              items = []
              starts = [m.start() for m in re.finditer(r'<div\s+id="AITEM_\d+"', html)]
              if not starts: return items
              starts.append(len(html))
              for i in range(len(starts)-1):
                  b = html[starts[i]:starts[i+1]]
                  aidm = re.search(r'aid="(\d+)"', b)
                  if not aidm: continue
                  aid = aidm.group(1)

                  sm = re.search(r'ASTAT_MSGA[^>]*>Auction Starts</div>\s*<div[^>]+>\s*([^<]+?)\s*</div>', b)
                  starts_raw = sm.group(1).strip() if sm else None

                  rows = re.findall(
                      r'<td[^>]*class="AD_LBL"[^>]*>(.*?)</td>\s*<td[^>]*class="AD_DTA[^"]*"[^>]*>(.*?)</td>',
                      b, re.DOTALL)

                  data = {}
                  addr_lines = []
                  last_addr = False
                  for lbl_html, dta_html in rows:
                      lbl = re.sub(r'<[^>]+>','', lbl_html).strip().rstrip(':').lower()
                      if 'property address' in lbl:
                          t = strip_html(dta_html)
                          if t: addr_lines.append(t)
                          last_addr = True; continue
                      if last_addr and not lbl:
                          t = strip_html(dta_html)
                          if t: addr_lines.append(t)
                          continue
                      last_addr = False
                      if lbl: data[lbl] = dta_html

                  items.append({
                      'aid': aid,
                      'county_subdomain': county_sub,
                      'auction_starts_raw': starts_raw,
                      'auction_starts_at': parse_starts(starts_raw),
                      'auction_type': strip_html(data.get('auction type')),
                      'case_number': strip_html(data.get('case #')),
                      'case_clerk_url': extract_href(data.get('case #','')),
                      'judgment_amount': to_float(data.get('final judgment amount')),
                      'parcel_id': strip_html(data.get('parcel id')),
                      'parcel_assessor_url': extract_href(data.get('parcel id','')),
                      'property_address': ', '.join(addr_lines) if addr_lines else None,
                      'assessed_value': to_float(data.get('assessed value')),
                      'plaintiff_max_bid': to_float(data.get('plaintiff max bid')),
                  })
              return items

          ok = err = creds = total_aids = 0
          for it in ITEMS:
              mca = it.get('mca_id'); url = it.get('url')
              county = it.get('county'); case = it.get('case_number')
              sub_m = re.search(r'https?://([^.]+)\.realforeclose\.com', url or '')
              county_sub = sub_m.group(1) if sub_m else county

              row = {'mca_id': mca, 'county_slug': county, 'case_number': case,
                     'fetch_url': url, 'system_type': 'realforeclose',
                     'backend': f'firecrawl_v2_{RUN}', 'parse_state': 'fetching'}
              cr_id = None
              try:
                  ins = httpx.post(f'{SB}/rest/v1/court_responses_raw', headers=HR, json=row, timeout=20.0)
                  if ins.status_code in (200,201):
                      j = ins.json()
                      if j: cr_id = j[0]['id']
              except Exception: pass

              status, data = fc_scrape(url); creds += 1
              html = (data.get('data') or {}).get('html') if isinstance(data, dict) else None

              if status == 200 and html:
                  aids = parse_aitem_blocks(html, county_sub)
                  total_aids += len(aids)
                  if aids:
                      payload = []
                      for a in aids:
                          payload.append({
                              'aid': a['aid'],
                              'county_slug': county,
                              'auction_type': a['auction_type'],
                              'case_number': a['case_number'],
                              'case_clerk_url': a['case_clerk_url'],
                              'judgment_amount': a['judgment_amount'],
                              'parcel_id': a['parcel_id'],
                              'parcel_assessor_url': a['parcel_assessor_url'],
                              'property_address': a['property_address'],
                              'assessed_value': a['assessed_value'],
                              'plaintiff_max_bid': a['plaintiff_max_bid'],
                              'auction_starts_at': a['auction_starts_at'],
                              'auction_starts_raw': a['auction_starts_raw'],
                              'county_subdomain': a['county_subdomain'],
                              'source_response_id': cr_id,
                              'source_dispatch_id': int(DISP) if DISP and DISP.isdigit() else None,
                              'source_run_id': int(RUN) if RUN and RUN.isdigit() else None,
                          })
                      try:
                          httpx.post(f'{SB}/rest/v1/realforeclose_aids?on_conflict=aid',
                              headers=HU, json=payload, timeout=30.0)
                      except Exception: pass

                  if cr_id:
                      httpx.patch(f'{SB}/rest/v1/court_responses_raw?id=eq.{cr_id}', headers=H,
                          json={'status_code': status, 'response_body': html[:500000],
                                'parse_state': 'ok' if aids else 'parsed_empty'}, timeout=20.0)
                  ok += 1
              else:
                  if cr_id:
                      httpx.patch(f'{SB}/rest/v1/court_responses_raw?id=eq.{cr_id}', headers=H,
                          json={'status_code': status, 'parse_state': 'failed',
                                'parse_error': str(data)[:500]}, timeout=20.0)
                  err += 1
              time.sleep(0.3)

          try:
              if DISP and DISP.isdigit():
                  httpx.post(f'{SB}/rest/v1/rpc/realforeclose_aids_to_mca_patch',
                      headers=H, json={'p_dispatch_id': int(DISP)}, timeout=30.0)
          except Exception: pass

          try:
              httpx.post(f'{SB}/rest/v1/firecrawl_metrics', headers=H,
                  json={'credits_used': creds, 'searches_count': len(ITEMS),
                        'estimated_cost_usd': round(creds*0.003, 4),
                        'status': 'success' if err==0 else 'partial',
                        'stage': f'court_scraper_v2_{LBL}'}, timeout=20.0)
          except Exception: pass

          print(f'BATCH DONE v2: ok={ok} err={err} creds={creds} aids_harvested={total_aids} cost=${creds*0.003:.4f} run_id={RUN}')
          PYEOF
