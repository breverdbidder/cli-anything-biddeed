name: PARITY Court Scraper (Firecrawl)

on:
  workflow_dispatch:
    inputs:
      batch_payload:
        description: 'JSON array of items: [{mca_id,url,county,case_number}]'
        required: true
      run_label:
        description: 'Tracking label for this batch'
        required: false
        default: 'manual'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx
      - name: Scrape via Firecrawl and write back to Supabase
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_PAYLOAD: ${{ inputs.batch_payload }}
          RUN_LABEL: ${{ inputs.run_label }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, time, httpx
          FC = os.environ['FIRECRAWL_API_KEY']
          SB = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_KEY']
          ITEMS = json.loads(os.environ.get('BATCH_PAYLOAD','[]'))
          RUN = os.environ.get('GH_RUN_ID','')
          LBL = os.environ.get('RUN_LABEL','manual')
          H = {'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}
          HR = {**H, 'Prefer': 'return=representation'}

          def fc_scrape(url):
              try:
                  r = httpx.post('https://api.firecrawl.dev/v1/scrape',
                      headers={'Authorization': f'Bearer {FC}','Content-Type':'application/json'},
                      json={'url':url,'formats':['html','markdown'],'waitFor':4000,'timeout':45000,'onlyMainContent':False},
                      timeout=90.0)
                  try: return r.status_code, r.json()
                  except Exception: return r.status_code, {'_text': r.text[:1000]}
              except Exception as e:
                  return 0, {'error': str(e)[:300]}

          def parse_html(html, md):
              out = {}
              if html:
                  pats = [
                      ('plaintiff', r'(?is)plaintiff[^<]{0,40}<[^>]+>\s*([A-Za-z0-9 &\.,\-/]{3,200})'),
                      ('defendant', r'(?is)defendant[^<]{0,40}<[^>]+>\s*([A-Za-z0-9 &\.,\-/]{3,200})'),
                      ('assigned_judge', r'(?is)(?:judge|assigned\s+judge)[^<]{0,40}<[^>]+>\s*([A-Za-z\. \-]{4,80})'),
                      ('case_classification_label', r'(?is)case\s+(?:type|classification)[^<]{0,40}<[^>]+>\s*([A-Za-z0-9 \-/]{3,80})'),
                  ]
                  for k, p in pats:
                      m = re.search(p, html)
                      if m: out[k] = m.group(1).strip()
                  m = re.search(r'(?is)judgment[\s_]*amount[^<]{0,40}<[^>]+>\s*\$?([\d,\.]+)', html)
                  if m:
                      try: out['judgment_amount_from_court'] = float(m.group(1).replace(',',''))
                      except Exception: pass
              if md:
                  if 'plaintiff' not in out:
                      m = re.search(r'(?im)^[\s|]*plaintiff[:\s|]+(.{3,200})', md)
                      if m: out['plaintiff'] = re.sub(r'[|<>].*$','', m.group(1)).strip()
                  if 'defendant' not in out:
                      m = re.search(r'(?im)^[\s|]*defendant[:\s|]+(.{3,200})', md)
                      if m: out['defendant'] = re.sub(r'[|<>].*$','', m.group(1)).strip()
              return out

          ok = err = creds = 0
          for it in ITEMS:
              mca = it.get('mca_id'); url = it.get('url')
              county = it.get('county'); case = it.get('case_number')
              row = {'mca_id': mca, 'county_slug': county, 'case_number': case,
                     'fetch_url': url, 'system_type': 'realforeclose',
                     'backend': f'firecrawl_workflow_{RUN}', 'parse_state': 'fetching'}
              cr_id = None
              try:
                  ins = httpx.post(f'{SB}/rest/v1/court_responses_raw', headers=HR, json=row, timeout=20.0)
                  if ins.status_code in (200, 201):
                      cr_id = ins.json()[0]['id']
              except Exception: pass
              status, data = fc_scrape(url); creds += 1
              html = (data.get('data') or {}).get('html') if isinstance(data, dict) else None
              md = (data.get('data') or {}).get('markdown') if isinstance(data, dict) else None
              if status == 200 and html:
                  fields = parse_html(html, md)
                  if cr_id:
                      httpx.patch(f'{SB}/rest/v1/court_responses_raw?id=eq.{cr_id}', headers=H,
                          json={'status_code': status, 'response_body': html[:500000],
                                'parse_state': 'ok' if fields else 'parsed_empty'}, timeout=20.0)
                  if fields:
                      meta = {'mca_id': mca, 'county_slug': county, 'case_number': case,
                              'case_detail_url': url, 'realforeclose_url': url,
                              'source_system': 'realforeclose', 'source_response_id': cr_id, **fields}
                      try: httpx.post(f'{SB}/rest/v1/court_case_metadata', headers=H, json=meta, timeout=20.0)
                      except Exception: pass
                      mp = {k: v for k, v in {
                          'plaintiff': fields.get('plaintiff'),
                          'assigned_judge': fields.get('assigned_judge'),
                          'case_classification_label': fields.get('case_classification_label')
                      }.items() if v}
                      if mp:
                          try: httpx.patch(f'{SB}/rest/v1/multi_county_auctions?id=eq.{mca}', headers=H, json=mp, timeout=20.0)
                          except Exception: pass
                  ok += 1
              else:
                  if cr_id:
                      httpx.patch(f'{SB}/rest/v1/court_responses_raw?id=eq.{cr_id}', headers=H,
                          json={'status_code': status, 'parse_state': 'failed',
                                'parse_error': str(data)[:500]}, timeout=20.0)
                  err += 1
              time.sleep(0.3)

          try:
              httpx.post(f'{SB}/rest/v1/firecrawl_metrics', headers=H,
                  json={'credits_used': creds, 'searches_count': len(ITEMS),
                        'estimated_cost_usd': round(creds*0.003, 4),
                        'status': 'success' if err == 0 else 'partial',
                        'stage': f'court_scraper_{LBL}'}, timeout=20.0)
          except Exception: pass
          print(f'BATCH DONE: ok={ok} err={err} credits={creds} cost=${creds*0.003:.4f} run_id={RUN}')
          PYEOF
