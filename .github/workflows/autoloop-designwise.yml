name: DesignWise Autoloop — Nightly Eval

on:
  schedule:
    # 3AM EST = 8AM UTC (one hour after main autoloop at 2AM EST / 7AM UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      level:
        description: 'Assertion level to run (L1, L2, or all)'
        required: false
        default: 'all'
      agent:
        description: 'Filter by agent name (leave empty for all)'
        required: false
        default: ''

jobs:
  eval:
    name: DesignWise Eval — ${{ github.event.inputs.level || 'all' }} assertions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx playwright anthropic
          playwright install chromium --with-deps
        working-directory: designwise/agent-harness

      - name: Install DesignWise package
        run: pip install -e .
        working-directory: designwise/agent-harness

      - name: Run Eval Suite
        id: eval
        run: |
          LEVEL_ARG=""
          AGENT_ARG=""
          if [ -n "${{ github.event.inputs.level }}" ] && [ "${{ github.event.inputs.level }}" != "all" ]; then
            LEVEL_ARG="--level ${{ github.event.inputs.level }}"
          fi
          if [ -n "${{ github.event.inputs.agent }}" ]; then
            AGENT_ARG="--agent ${{ github.event.inputs.agent }}"
          fi

          python designwise/eval/eval_runner.py \
            $LEVEL_ARG \
            $AGENT_ARG \
            --json \
            --save \
            --verbose \
            > /tmp/eval_result.json 2>&1 || true

          cat /tmp/eval_result.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PYTHONPATH: designwise/agent-harness

      - name: Parse Results
        id: results
        run: |
          python -c "
          import json, sys
          with open('/tmp/eval_result.json') as f:
              content = f.read()
          # Find JSON in output (may have print statements before it)
          start = content.rfind('{')
          if start == -1:
              print('passed=0')
              print('failed=0')
              print('score=0/25')
              sys.exit(0)
          data = json.loads(content[start:])
          print(f'passed={data.get(\"passed\", 0)}')
          print(f'failed={data.get(\"failed\", 0)}')
          print(f'score={data.get(\"score\", \"0/25\")}')
          print(f'pass_rate={data.get(\"pass_rate\", 0)}')
          " >> $GITHUB_OUTPUT

      - name: Send Telegram Report
        run: |
          python -c "
          import json, os, httpx
          bot_token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not bot_token or not chat_id:
              print('Telegram not configured')
              exit(0)
          try:
              with open('/tmp/eval_result.json') as f:
                  content = f.read()
              start = content.rfind('{')
              data = json.loads(content[start:]) if start != -1 else {}
          except Exception:
              data = {}

          passed = data.get('passed', 0)
          total = data.get('total', 25)
          score = data.get('score', f'{passed}/{total}')
          pass_rate = data.get('pass_rate', 0)
          emoji = '✅' if data.get('failed', 1) == 0 else '⚠️'

          failed_list = [r for r in data.get('results', []) if not r.get('passed')]
          failed_str = '\n'.join(f'• {r[\"id\"]}: {r[\"description\"][:40]}' for r in failed_list[:5])

          msg = f'{emoji} *DesignWise Nightly Eval*\n'
          msg += f'Score: {score} ({pass_rate:.0%})\n'
          if failed_list:
              msg += f'\nFailed:\n{failed_str}'
          if len(failed_list) > 5:
              msg += f'\n...and {len(failed_list) - 5} more'

          httpx.post(
              f'https://api.telegram.org/bot{bot_token}/sendMessage',
              data={'chat_id': chat_id, 'text': msg, 'parse_mode': 'Markdown'},
              timeout=10
          )
          print('Telegram sent')
          " || echo "Telegram notification failed (non-fatal)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload Eval Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: designwise-eval-${{ github.run_number }}
          path: designwise/eval/results/
          retention-days: 30

      - name: Fail if score below threshold
        run: |
          python -c "
          failed = int('${{ steps.results.outputs.failed }}' or '0')
          total = 25
          # Allow up to 5 failures (20% tolerance — external deps like Playwright, PostHog)
          threshold = 5
          if failed > threshold:
              print(f'FAIL: {failed} assertions failed (threshold: {threshold})')
              exit(1)
          else:
              print(f'PASS: {failed} failures within threshold of {threshold}')
          "
