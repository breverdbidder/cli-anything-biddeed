name: "Gold Standard SHARD-5 dispatch 5d40a513 (pinellas/osceola/suwannee/baker)"
# Dispatch: 5d40a513-fb55-4c9c-ad49-be84afb8388f
# Session: architect-20260807T160000
# Counties: pinellas (9/10), osceola (8/10), suwannee (7/10), baker (5/10)
# SHIP-TO-MAIN: direct push, no PRs, DB changes via SQL migration + Python executor

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - migration
          - execute
          - verify

concurrency:
  group: gold-standard-shard5-5d40a513
  cancel-in-progress: false

jobs:
  # ── Job 1: Apply SQL migration ─────────────────────────────────────────────
  apply-migration:
    name: "Apply SHARD-5 5d40a513 Migration"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'migration'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client 2>/dev/null || true

      - name: Apply migration via psql
        run: |
          set -euo pipefail
          REF="mocerqjnksmhcjzxrewo"
          MIGRATION="migrations/20260807_gold_standard_shard5_5d40a513_pinellas_osceola_suwannee_baker.sql"
          for CONN in \
            "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require"; do
            if psql "$CONN" -c "SELECT 1" > /dev/null 2>&1; then
              echo "Connected to Supabase"
              psql "$CONN" -f "$MIGRATION" \
                && echo "Migration applied OK" \
                || echo "Migration had errors (may be idempotent re-run)"
              break
            fi
          done || echo "psql unavailable — skipping SQL migration (Python executor will handle via REST)"

      - name: Verify migration via REST API
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB_URL = os.environ.get('SUPABASE_URL', '').rstrip('/')
          SB_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SB_URL or not SB_KEY:
              print("No SUPABASE_URL/KEY — skipping")
              exit(0)

          headers = {
              'apikey': SB_KEY,
              'Authorization': f'Bearer {SB_KEY}',
              'Content-Type': 'application/json',
          }

          print("=== SHARD-5 5d40a513 Migration Verification ===")
          for county in ['pinellas', 'osceola', 'suwannee', 'baker']:
              url = f"{SB_URL}/rest/v1/bid_decisions?county_slug=eq.{county}&select=case_number&limit=1&pipeline_run_id=like.SHARD5-5d40a513*"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      rows = json.loads(r.read())
                      print(f"  {county}: {len(rows)} SHARD5-5d40a513 bid_decision rows visible")
              except Exception as e:
                  print(f"  {county}: check error {e}")
          PYEOF

  # ── Job 2: Python executor ─────────────────────────────────────────────────
  execute:
    name: "SHARD-5 5d40a513 Python Executor"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: apply-migration
    if: always() && (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'execute')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Configure git
        run: |
          git config user.email "shard5-5d40a513-bot@biddeed.ai"
          git config user.name "SHARD-5 5d40a513 Gold Standard Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/breverdbidder/cli-anything-biddeed.git

      - name: Run SHARD-5 5d40a513 executor
        run: |
          set -euo pipefail
          python3 scripts/gold_standard_shard5_pinellas_osceola_suwannee_baker_5d40a513.py

      - name: Push any commits from executor
        if: always()
        run: |
          git pull --rebase origin main || true
          git push origin main || echo "Nothing to push"

  # ── Job 3: Verify metrics ──────────────────────────────────────────────────
  verify:
    name: "Verify SHARD-5 5d40a513 Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: execute
    if: always() && (github.event.inputs.phase == 'all' || github.event.inputs.phase == 'verify')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run pencil_dod_evaluate_county for all 4 counties
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SB_URL = os.environ.get('SUPABASE_URL', '').rstrip('/')
          SB_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SB_URL or not SB_KEY:
              print("No SUPABASE_URL/KEY — cannot verify")
              exit(0)

          headers = {
              'apikey': SB_KEY,
              'Authorization': f'Bearer {SB_KEY}',
              'Content-Type': 'application/json',
          }
          COUNTIES = ['pinellas', 'osceola', 'suwannee', 'baker']

          print("### SQL VERIFICATION — SHARD-5 dispatch 5d40a513")
          print(f"dispatch_id: 5d40a513-fb55-4c9c-ad49-be84afb8388f")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print()

          def rpc_evaluate(county):
              url = f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
              payload = json.dumps({'p_county': county}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  {county} eval error: {e}")
                  return None

          county_scores = {}
          for county in COUNTIES:
              result = rpc_evaluate(county)
              if result is None:
                  print(f"{county}: EVALUATION FAILED")
                  county_scores[county] = 0
                  continue
              if isinstance(result, dict):
                  passes = sum(1 for ltr in 'ABCDEFGHIJ' if isinstance(result.get(ltr), dict) and result[ltr].get('pass'))
                  details = {}
                  for ltr in 'ABCDEFGHIJ':
                      v = result.get(ltr)
                      if isinstance(v, dict):
                          details[ltr] = {'pass': v.get('pass'), 'metric': v.get('metric'), 'detail': v.get('detail')}
                      else:
                          details[ltr] = v
                  print(f"{county} [{passes}/10]: {json.dumps(details)}")
              elif isinstance(result, list):
                  passes = sum(1 for r in result if isinstance(r, dict) and r.get('pass'))
                  print(f"{county} [{passes}/10]: {json.dumps(result)}")
              else:
                  passes = 0
                  print(f"{county}: unexpected result type {type(result)}: {result}")
              county_scores[county] = passes

          print()
          total = sum(county_scores.values())
          print(f"TOTAL: {total}/40 letters passing")
          print(f"Scores: {county_scores}")
          PYEOF
