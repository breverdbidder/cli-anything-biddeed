name: Apply Nexus Foundation Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install psql
        run: sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

      - name: Checkout everest-nexus for migration SQL
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/everest-nexus
          token: ${{ secrets.GH_PAT }}

      - name: Apply migration 001 — Foundation (9 tables)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Applying 001_nexus_foundation.sql..."
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
            -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/001_nexus_foundation.sql
          echo "Migration 001 complete"

      - name: Apply migration 002 — Cron jobs
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
            -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
            -v ON_ERROR_STOP=0 \
            -f supabase/migrations/002_cron_jobs.sql || echo "002 had errors (pg_cron may not be enabled)"

      - name: Apply migration 003 — Data scanner functions
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
            -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
            -v ON_ERROR_STOP=0 \
            -f supabase/migrations/003_data_scanner_functions.sql || echo "003 had errors"

      - name: Verify tables
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
            -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
            -c "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'nexus_%' ORDER BY tablename;"

      - name: Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🗄️ *Nexus Migration: ${{ job.status }}*
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
