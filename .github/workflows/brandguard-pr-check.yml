name: BrandGuard PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'designwise/**'
      - '**.html'
      - '**.css'
      - '**.tsx'
      - '**.ts'

jobs:
  brandguard:
    name: BrandGuard — Brand Compliance Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx playwright
          playwright install chromium --with-deps
        working-directory: designwise/agent-harness

      - name: Install DesignWise package
        run: pip install -e .
        working-directory: designwise/agent-harness

      - name: Get Vercel Preview URL
        id: preview
        run: |
          # Wait for Vercel preview deployment and extract URL
          # Vercel posts deployment URLs as PR comments; fall back to lab URL
          PREVIEW_URL="${{ vars.LAB_URL || 'https://lab.zonewise.ai' }}"
          echo "url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run BrandGuard Scan
        id: brandguard
        run: |
          python -m cli_anything.designwise.core.brandguard_agent \
            --url "${{ steps.preview.outputs.url }}" \
            --json > /tmp/brandguard_result.json 2>&1
          cat /tmp/brandguard_result.json
        working-directory: designwise/agent-harness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Parse Violations
        id: violations
        run: |
          VIOLATIONS=$(python -c "
          import json, sys
          with open('/tmp/brandguard_result.json') as f:
              data = json.load(f)
          violations = data.get('violations', [])
          count = len(violations)
          print(f'count={count}')
          if violations:
              details = '\n'.join(f'• [{v.get(\"type\",\"unknown\")}] {v.get(\"element\",\"\")} — Expected: {v.get(\"expected\",\"\")} Got: {v.get(\"actual\",\"\")}' for v in violations[:10])
              print(f'details<<EOF')
              print(details)
              print('EOF')
          else:
              print('details=✅ No violations found')
          ")
          echo "$VIOLATIONS" >> $GITHUB_OUTPUT

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = {};
            try {
              result = JSON.parse(fs.readFileSync('/tmp/brandguard_result.json', 'utf8'));
            } catch (e) {
              result = { violations: [], error: e.message };
            }
            const violations = result.violations || [];
            const count = violations.length;
            const passed = count === 0;
            const emoji = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            let body = `## ${emoji} BrandGuard — ${status}\n\n`;
            body += `**URL scanned:** ${{ steps.preview.outputs.url }}\n`;
            body += `**Violations found:** ${count}\n\n`;

            if (violations.length > 0) {
              body += `### Violations\n\n`;
              for (const v of violations.slice(0, 10)) {
                body += `- **[${v.type || 'unknown'}]** ${v.element || ''}\n`;
                body += `  - Expected: \`${v.expected || ''}\`\n`;
                body += `  - Got: \`${v.actual || ''}\`\n\n`;
              }
              if (violations.length > 10) {
                body += `_...and ${violations.length - 10} more violations_\n`;
              }
              body += `\n> ⛔ This PR cannot be merged until all brand violations are resolved.\n`;
              body += `> Run \`designwise brandguard --url <your-url>\` locally to debug.\n`;
            } else {
              body += `> All brand compliance checks passed. ✨\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Fail if violations found
        run: |
          VIOLATIONS=$(python -c "
          import json
          with open('/tmp/brandguard_result.json') as f:
              data = json.load(f)
          print(len(data.get('violations', [])))
          ")
          echo "Violation count: $VIOLATIONS"
          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "❌ BrandGuard: $VIOLATIONS violations found. Merge blocked."
            exit 1
          else
            echo "✅ BrandGuard: No violations. Merge allowed."
          fi
