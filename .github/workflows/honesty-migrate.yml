name: Deploy Honesty Protocol Tables
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install psql
        run: sudo apt-get install -y postgresql-client
      
      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Direct connection (not pooler)
          DATABASE_URL="postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres"
          echo "Connecting to Supabase direct..."
          psql "$DATABASE_URL" -f migrations/20260328_honesty_protocol.sql
          echo "=== Verify ==="
          psql "$DATABASE_URL" -c "SELECT count(*) as violations FROM honesty_violations;"
          psql "$DATABASE_URL" -c "SELECT count(*) as claims FROM claim_audit;"
          echo "Migration complete ✅"
