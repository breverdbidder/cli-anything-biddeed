name: Deploy Honesty Protocol Tables
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install psql
        run: sudo apt-get install -y postgresql-client
      
      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DATABASE_URL="postgresql://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres"
          psql "$DATABASE_URL" -f migrations/20260328_honesty_protocol.sql
          echo "=== Verify ==="
          psql "$DATABASE_URL" -c "SELECT count(*) as violations FROM honesty_violations;"
          psql "$DATABASE_URL" -c "SELECT count(*) as claims FROM claim_audit;"
