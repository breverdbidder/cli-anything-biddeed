name: Deploy Honesty Protocol Tables
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install psql
        run: sudo apt-get install -y postgresql-client
      
      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Try session-mode pooler (port 5432)
          for CONN in \
            "postgresql://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres" \
            "postgresql://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require"; do
            echo "Trying connection..."
            if psql "$CONN" -c "SELECT 1" 2>/dev/null; then
              echo "Connected! Running migration..."
              psql "$CONN" -f migrations/20260328_honesty_protocol.sql
              echo "=== Verify ==="
              psql "$CONN" -c "SELECT count(*) as violations FROM honesty_violations;"
              psql "$CONN" -c "SELECT count(*) as claims FROM claim_audit;"
              echo "Migration complete"
              exit 0
            fi
          done
          echo "All connection attempts failed"
          exit 1
