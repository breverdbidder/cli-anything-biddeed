name: Nexus S1 Task + Workflow Intelligence

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 80m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID
          script: |
            set -e
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN'
              export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID'
              export GH_PAT='$GH_PAT'
              mkdir -p /home/claude/repos
              cd /home/claude/repos
              if [ -d everest-nexus ]; then cd everest-nexus && git pull origin main; else git clone https://${GH_PAT}@github.com/breverdbidder/everest-nexus.git && cd everest-nexus; fi
              claude -p 'MISSION: Everest Nexus S1 — Task Intelligence + Workflow Intelligence. Read docs/EVEREST-NEXUS-SPEC.md and docs/EVEREST-NEXUS-PLAN.md.

S1.1 SUPABASE MIGRATION: Create supabase/migrations/001_nexus_foundation.sql. ALL 9 tables from spec: nexus_tasks (with priority P0-P3, project, owner, sla_deadline, escalation_count, auto_priority, status checks, all columns from spec Layer 1), nexus_workflows (all columns from spec Layer 2), nexus_repos (all columns from spec Layer 3 including consolidation_group and consolidation_recommendation), nexus_tables (all columns from spec Layer 4), nexus_secrets (all columns from spec Layer 5), nexus_domains (all columns from spec Layer 6), nexus_notifications (task_id, repo_name, priority, notification_type with CHECK constraint, message, telegram_msg_id, sent_at, delivered), nexus_chat_sessions (session_id UNIQUE, title, source CHECK claude_ai/claude_code/telegram, started_at, ended_at, tasks_created, tasks_completed, key_decisions JSONB, summary, chat_url), nexus_insights (layer, insight_type, title, description, severity, recommendation, auto_actionable, acted_on). ALL indexes from spec. RLS: anon SELECT, service_role ALL. Realtime on nexus_tasks and nexus_notifications. Run via curl to Supabase REST at https://mocerqjnksmhcjzxrewo.supabase.co using env SUPABASE_KEY or hardcode the anon key. Verify each table exists after creation.

S1.2 TASK ENGINE: Create scanners/task_engine.py with create_task, update_status, auto_assign_priority (rules from spec: blocked=P0, owner Ariel=P1, routine=P2, docs=P3), compute_sla_deadline, get_active_tasks, get_stale_tasks. Create scanners/escalation.py with check_p0_escalation (find P0 past 2hr, send Telegram), send_accountability (4hr), build_digest (morning/evening format from spec). Create scanners/notifier.py with send_telegram using BIDDEED_BOT_TOKEN to BIDDEED_BOT_CHAT_ID (740118343).

S1.3 WORKFLOW SCANNER: Create scanners/workflow_scanner.py. For ALL repos under breverdbidder (paginate GitHub API), list workflows, fetch last 5 runs each, compute success_rate, avg_duration, detect dead (active + 0 runs 30d), estimate cost (minutes * 0.008). Write to nexus_workflows. Generate insights for dead and failing workflows into nexus_insights. Create scanners/seed_workflows.py that runs the initial full scan. Run it.

S1.4 TELEGRAM COMMANDS: Create scanners/telegram_commands.py with handlers for /tasks /p0 /p1 /stale /bump /demote /done /skip /block /digest /nexus. Each queries or updates nexus_tasks via Supabase REST. Format responses as Telegram HTML.

S1.5 PG_CRON: Create supabase/migrations/002_cron_jobs.sql with 9 cron jobs: nexus_staleness (5min), nexus_p0_escalation (2hr), nexus_morning_digest (14:00 UTC), nexus_evening_digest (22:00 UTC), nexus_workflow_scan (6hr), nexus_repo_scan (6hr), nexus_data_scan (12hr), nexus_secret_scan (daily 6AM UTC), nexus_domain_scan (daily 7AM UTC). Use pg_cron and pg_net to call edge functions or direct SQL.

S1.6 REPO SEED (bonus): Create scanners/seed_repos.py. Fetch all breverdbidder repos. Tier: CORE=[cli-anything-biddeed,zonewise-web,biddeed-ai,biddeed-ai-ui,claude-code-telegram-control,life-os,cliproxy-gateway,everest-nexus], ACTIVE=[zonewise,goviralbitch,superpowers,zonewise-landing,biddeed-landing,brevard-bidder-landing,zonewise-desktop], MONITORED=rest. Insert into nexus_repos. Compute stale_days and health_score. Run it.

COMMIT: git config user.email ci@biddeed.ai, git config user.name BidDeed-CI, prefix NEXUS:, push main after each task. Final Telegram: send summary of what was built with table counts and scanner results.' --dangerously-skip-permissions
            "
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" -d "text=Nexus S1: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
