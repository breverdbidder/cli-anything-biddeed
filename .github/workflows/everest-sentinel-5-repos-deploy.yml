name: everest-sentinel-5-repos-deploy

# Autonomous sentinel — polls Supabase for queued five-repo deploys and executes
# them with ghost-success-proof delivery_proof. Runs every 10 min + on demand.
#
# Guarantees: any state=verified transition must pass trg_prevent_ghost_success
# guardrail (needs hard_verification + github_commits or other evidence keys).

# LAUNCH-E (#20039, 2026-09-05): schedule retired — consolidated into
# sentinel-v2.yml, which now carries the canonical `7,37 * * * *` schedule
# for this three-workflow group (sentinel.yml / sentinel-v2.yml /
# everest-sentinel-5-repos-deploy.yml). This file is workflow_dispatch-only;
# queued five-repo deploys will sit until manually dispatched (or until this
# poller is wired into the canonical schedule's job steps in a follow-up).

on:
  workflow_dispatch:
    inputs:
      deploy_slug:
        description: 'Optional specific repo_slug to deploy (else all queued)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: everest-sentinel-5-repos
  cancel-in-progress: false

jobs:
  poll-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
      SUPABASE_PROJECT_REF: mocerqjnksmhcjzxrewo
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_PAT: ${{ secrets.EVEREST_GH_PAT || github.token }}
    steps:
      - name: Checkout sentinel repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests==2.32.3

      - name: Validate required secrets (fail fast, no silent skip)
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret not set — refusing to continue (would silently ghost-succeed)"
            exit 1
          fi

      - name: Poll Supabase for queued deploys + execute
        id: work
        run: python3 .github/scripts/sentinel_5_repos.py
        env:
          INPUT_SLUG: ${{ inputs.deploy_slug }}
