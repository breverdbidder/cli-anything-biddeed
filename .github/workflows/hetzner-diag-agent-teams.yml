name: Hetzner Diag — Agent Teams State

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag or cleanup'
        required: false
        type: string
        default: 'diag'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH diagnostic + optional cleanup
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: MODE
          command_timeout: 8m
          script: |
            set +e
            echo "=== MODE: $MODE ==="
            
            if [ "$MODE" = "cleanup" ]; then
              echo ""
              echo "=== DISK CLEANUP ==="
              df -h / | tail -1
              
              echo "--- 1. Reap zombie chromium processes ---"
              pkill -9 chromium 2>&1 || true
              pkill -9 chrome 2>&1 || true
              
              echo "--- 2. Clear apt cache ---"
              apt-get clean -y 2>&1 | tail -2
              apt-get autoclean -y 2>&1 | tail -2
              apt-get autoremove -y 2>&1 | tail -2
              
              echo "--- 3. Clear /tmp ---"
              find /tmp -type f -mtime +1 -delete 2>&1 | head -5
              du -sh /tmp 2>&1
              
              echo "--- 4. Clear old log files ---"
              find /var/log -type f -name "*.log.*" -delete 2>&1 | head -5
              find /var/log -type f -name "*.gz" -delete 2>&1 | head -5
              journalctl --vacuum-size=200M 2>&1 | tail -3
              
              echo "--- 5. Clear Docker if present ---"
              if command -v docker >/dev/null; then
                docker system prune -af --volumes 2>&1 | tail -3
              fi
              
              echo "--- 6. Clear npm/node/cache dirs ---"
              rm -rf /root/.npm/_cacache 2>&1
              rm -rf /root/.cache/pip 2>&1
              rm -rf /root/.cache/Cypress 2>&1
              rm -rf /root/.cache/ms-playwright/chromium-*/chrome-linux/locales 2>&1
              find /root -name "node_modules" -type d -maxdepth 3 -exec du -sh {} \; 2>&1 | sort -h | tail -10
              
              echo "--- 7. Clean old spawn prompts + env files ---"
              find /root -maxdepth 1 -name "spawn_prompt_*.md" -mtime +1 -delete
              find /root -maxdepth 1 -name ".env-run-*" -mtime +1 -delete
              find /root -maxdepth 1 -name "claude-run-*.log" -mtime +1 -delete
              
              echo "--- 8. Clean old Playwright captures from prior runs ---"
              find /root/algoma_captures -type f -mtime +0 -delete 2>&1 | head -5
              find /root -maxdepth 2 -name "*.png" -mtime +2 -delete 2>&1 | head -5
              
              echo ""
              echo "=== POST-CLEANUP ==="
              df -h / | tail -1
              free -h | head -2
            fi
            
            echo ""
            echo "=== 1. tmux sessions ==="
            tmux ls 2>&1 || echo "(no tmux sessions)"
            echo ""
            echo "=== 2. tmux everest-agents tail ==="
            tmux capture-pane -pt everest-agents:0 -S -50 2>&1 || echo "(no session)"
            echo ""
            echo "=== 3. claude processes ==="
            ps aux | grep -E 'claude|node' | grep -v grep | head -10
            echo ""
            echo "=== 4. Disk + memory ==="
            df -h / | tail -1
            free -h | head -2
            echo ""
            echo "=== DONE ==="
