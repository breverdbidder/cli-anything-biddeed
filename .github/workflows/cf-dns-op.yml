name: Cloudflare DNS Op (zonewise.ai)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list | create_a'
        required: true
        default: 'list'
      record_name:
        description: 'DNS record name, e.g. chat.zonewise.ai'
        required: false
        default: ''
      record_content:
        description: 'A record IP content'
        required: false
        default: ''
      proxied:
        description: 'Cloudflare proxy (orange cloud) true/false'
        required: false
        default: 'false'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ZONE_ID: b32406b78aaaefd55557d77c843a5940
      ACTION: ${{ inputs.action }}
      RECORD_NAME: ${{ inputs.record_name }}
      RECORD_CONTENT: ${{ inputs.record_content }}
      PROXIED: ${{ inputs.proxied }}
    steps:
      - name: Mask token
        run: echo "::add-mask::${CF_API_TOKEN}"
      - name: List records
        if: ${{ inputs.action == 'list' }}
        run: |
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" | python3 -m json.tool
      - name: Verify token scopes
        if: ${{ inputs.action == 'list' }}
        run: |
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" | python3 -m json.tool
      - name: Create A record
        if: ${{ inputs.action == 'create_a' }}
        run: |
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c "import json,os; print(json.dumps({'type':'A','name':os.environ['RECORD_NAME'],'content':os.environ['RECORD_CONTENT'],'proxied': os.environ['PROXIED']=='true','ttl':300}))")")
          echo "$RESP"
