name: cc secure
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: register admin
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"EOF" | sed -E 's/(eyJ[A-Za-z0-9_-]{3})[A-Za-z0-9._-]+/\1***JWT***/g'
          U=ariel
          P=$(openssl rand -hex 16)
          echo "ADMIN_USER=$U"
          echo "ADMIN_PW=$P"
          echo "REG1=$(curl -sS -m 10 -X POST http://127.0.0.1:3001/api/auth/register -H 'Content-Type: application/json' -d "{\"username\":\"$U\",\"password\":\"$P\"}")"
          echo "REG2_setup=$(curl -sS -m 10 -X POST http://127.0.0.1:3001/api/auth/setup -H 'Content-Type: application/json' -d "{\"username\":\"$U\",\"password\":\"$P\"}")"
          echo "AFTER_STATUS=$(curl -sS -m 6 http://127.0.0.1:3001/api/auth/status)"
          echo "END"
          EOF
