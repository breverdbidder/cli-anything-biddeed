name: Deploy worker.js to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy worker.js via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Get the worker name from wrangler.toml or find it
          WORKER_NAME=$(grep -r "name" src/wrangler.toml 2>/dev/null | head -1 | cut -d'"' -f2 || echo "biddeed-worker")
          echo "Deploying worker: $WORKER_NAME"
          
          # Upload worker script via CF API
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/workers/scripts/$WORKER_NAME" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata={\"main_module\":\"worker.js\",\"compatibility_date\":\"2024-01-01\"};type=application/json" \
            -F "worker.js=@src/worker.js;type=application/javascript+module" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if d.get('success') else 'FAILED:', d.get('errors',''))"
