name: "CI Output Gate (reusable)"

# Reusable workflow that verifies CI dossier mission completion AFTER the CC step.
# Catches `claude --print` ghost-success (exit 0 without delivering work).
# Created 2026-05-27 by SUMMIT-G in response to rentcast ghost-completing SUMMIT-E.

on:
  workflow_call:
    inputs:
      dossier_slug:            { required: true,  type: string }
      dossier_date:            { required: true,  type: string }
      v65_dossier_id:          { required: true,  type: string }
      summit_id:               { required: true,  type: string }
      min_storage_files:       { required: false, type: number, default: 8 }
      required_phase:          { required: false, type: string, default: 'P12_DELIVER' }
      required_classification: { required: false, type: string, default: 'READY_FOR_SIGNOFF' }
      gate_mode:               { required: false, type: string, default: 'blocking' }
    secrets:
      SUPABASE_URL:         { required: true }
      SUPABASE_SERVICE_KEY: { required: true }
      TELEGRAM_BOT_TOKEN:   { required: false }
      TELEGRAM_CHAT_ID:     { required: false }

jobs:
  gate:
    name: "Verify ${{ inputs.dossier_slug }}"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Run 4 output gate checks"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLUG:    ${{ inputs.dossier_slug }}
          DATE:    ${{ inputs.dossier_date }}
          V65_ID:  ${{ inputs.v65_dossier_id }}
          SUMMIT:  ${{ inputs.summit_id }}
          MIN:     ${{ inputs.min_storage_files }}
          REQ_PH:  ${{ inputs.required_phase }}
          REQ_CL:  ${{ inputs.required_classification }}
          MODE:    ${{ inputs.gate_mode }}
          TG_TOK:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID:  ${{ github.run_id }}
        run: |
          set -uo pipefail
          FAILS=()

          SB_AUTH=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")

          # Check 1: dossier phase + classification
          D=$(curl -sf "${SUPABASE_URL}/rest/v1/ci_v65_dossiers?id=eq.${V65_ID}&select=current_phase,classification" "${SB_AUTH[@]}")
          PH=$(echo "$D" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r[0]['current_phase'] if r else 'MISSING')")
          CL=$(echo "$D" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r[0]['classification'] if r else 'MISSING')")
          [[ "$PH" == "$REQ_PH" ]] || FAILS+=("check1a phase=$PH expected=$REQ_PH")
          [[ "$CL" == "$REQ_CL" ]] || FAILS+=("check1b classification=$CL expected=$REQ_CL")

          # Check 2: legacy rich-data populated
          L=$(curl -sf "${SUPABASE_URL}/rest/v1/ci_dossiers?competitor_slug=eq.${SLUG}&select=pricing_tiers,founders,patent_search_uspto,traffic_intelligence" "${SB_AUTH[@]}")
          for F in pricing_tiers founders patent_search_uspto traffic_intelligence; do
            H=$(echo "$L" | python3 -c "import json,sys; r=json.load(sys.stdin); print('yes' if (r and r[0].get('$F') not in (None,'',[],{},)) else 'no')")
            [[ "$H" == "yes" ]] || FAILS+=("check2 legacy.$F empty")
          done

          # Check 3: storage file count
          # Use signed REST list
          FILES_JSON=$(curl -sf -X POST "${SUPABASE_URL}/storage/v1/object/list/ci-evidence" \
            "${SB_AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "{\"prefix\":\"dossiers/${SLUG}/${DATE}/\",\"limit\":100,\"offset\":0}")
          N=$(echo "$FILES_JSON" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
          [[ "$N" -ge "$MIN" ]] || FAILS+=("check3 storage_files=$N expected>=$MIN")

          # Check 4: event_log synthesis entry
          E=$(curl -sf "${SUPABASE_URL}/rest/v1/ci_v65_event_log?source=ilike.summit_*_complete&select=id&limit=1" "${SB_AUTH[@]}")
          EN=$(echo "$E" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          [[ "$EN" -ge 1 ]] || FAILS+=("check4 no summit_complete event_log entry")

          # Report
          if [[ ${#FAILS[@]} -eq 0 ]]; then
            echo "::notice::OUTPUT GATE PASS for $SLUG ($N files in storage)"
            curl -sf -X POST "${SUPABASE_URL}/rest/v1/ghost_success_audit" "${SB_AUTH[@]}" \
              -H "Content-Type: application/json" \
              -d "{\"summit_id\":\"${SUMMIT}\",\"slug\":\"${SLUG}\",\"workflow_run_id\":\"${RUN_ID}\",\"verdict\":\"pass\",\"checks_performed\":7,\"gate_mode\":\"${MODE}\"}" > /dev/null
            exit 0
          fi

          echo "::error::OUTPUT GATE FAIL for $SLUG"
          for f in "${FAILS[@]}"; do echo "  - $f"; done

          # Log to audit
          FAILS_JSON=$(printf '%s\n' "${FAILS[@]}" | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -sf -X POST "${SUPABASE_URL}/rest/v1/ghost_success_audit" "${SB_AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "{\"summit_id\":\"${SUMMIT}\",\"slug\":\"${SLUG}\",\"workflow_run_id\":\"${RUN_ID}\",\"verdict\":\"fail\",\"failures\":${FAILS_JSON},\"checks_performed\":7,\"gate_mode\":\"${MODE}\"}" > /dev/null

          # Reset dossier classification to break ghost-complete state
          curl -sf -X PATCH "${SUPABASE_URL}/rest/v1/ci_v65_dossiers?id=eq.${V65_ID}" "${SB_AUTH[@]}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"classification\":\"IN_PROGRESS\"}"

          # Telegram
          if [[ -n "$TG_TOK" && -n "$TG_CHAT" ]]; then
            MSG="OUTPUT GATE FAIL: ${SLUG} ghost-completed. Reset to IN_PROGRESS. Run: https://github.com/${GITHUB_REPOSITORY:-breverdbidder/cli-anything-biddeed}/actions/runs/${RUN_ID}"
            curl -sf -X POST "https://api.telegram.org/bot${TG_TOK}/sendMessage" \
              -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG}" > /dev/null || true
          fi

          # Blocking vs warn
          if [[ "$MODE" == "blocking" ]]; then
            exit 1
          fi
          echo "::warning::gate_mode=warn, not failing the job"
