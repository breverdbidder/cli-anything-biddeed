name: Gold Standard SHARD-7 (charlotte, polk, st_lucie, seminole, liberty)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - charlotte
          - polk
          - st_lucie
          - seminole
          - liberty
          - j_generator
          - cd_parity
          - h_fix
          - verify
  schedule:
    - cron: '30 8 * * *'   # 08:30Z daily (after 08:00Z session initializes)

concurrency:
  group: gold-standard-shard7
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # 5h 40min — leaves 20min buffer before GHA 6h limit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Configure git
        run: |
          git config user.email "shard7-bot@biddeed.ai"
          git config user.name "SHARD-7 Gold Standard Bot"

      - name: Run SHARD-7 master coordinator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE: ${{ github.event.inputs.phase || 'all' }}
        run: |
          set -euo pipefail
          python3 scripts/shard7_s65_master_coordinator.py

      - name: Run J-generator directly (all 5 counties)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'j_generator' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/shard7_s65_j_generator.py

      - name: Trigger seminole scrapes (H freshness — 535.6h SLA violation)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'seminole' || github.event.inputs.phase == 'h_fix' || github.event.inputs.phase == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(python3 -c "from datetime import date, timedelta; print((date.today() - timedelta(weeks=${WEEKS_BACK})).strftime('%Y-%m-%d'))")
            for SALE_TYPE in foreclosure tax_deed; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"seminole\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"$SALE_TYPE\",\"max_pages\":\"10\"}}"
              echo "Dispatched seminole $SALE_TYPE $AUCTION_DATE"
              sleep 2
            done
          done

      - name: Trigger charlotte scrapes (B/F outcomes)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'charlotte' || github.event.inputs.phase == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(python3 -c "from datetime import date, timedelta; print((date.today() - timedelta(weeks=${WEEKS_BACK})).strftime('%Y-%m-%d'))")
            for SALE_TYPE in foreclosure tax_deed; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"charlotte\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"$SALE_TYPE\",\"max_pages\":\"10\"}}"
              echo "Dispatched charlotte $SALE_TYPE $AUCTION_DATE"
              sleep 2
            done
          done

      - name: Trigger polk scrapes (B/F outcomes)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'polk' || github.event.inputs.phase == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(python3 -c "from datetime import date, timedelta; print((date.today() - timedelta(weeks=${WEEKS_BACK})).strftime('%Y-%m-%d'))")
            for SALE_TYPE in foreclosure tax_deed; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"polk\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"$SALE_TYPE\",\"max_pages\":\"10\"}}"
              echo "Dispatched polk $SALE_TYPE $AUCTION_DATE"
              sleep 2
            done
          done

      - name: Trigger st_lucie scrapes (B/F/E outcomes)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'st_lucie' || github.event.inputs.phase == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(python3 -c "from datetime import date, timedelta; print((date.today() - timedelta(weeks=${WEEKS_BACK})).strftime('%Y-%m-%d'))")
            for SALE_TYPE in foreclosure tax_deed; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"st_lucie\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"$SALE_TYPE\",\"max_pages\":\"10\"}}"
              echo "Dispatched st_lucie $SALE_TYPE $AUCTION_DATE"
              sleep 2
            done
          done

      - name: Trigger liberty scrapes (bootstrap — check if auctions exist)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'liberty' || github.event.inputs.phase == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for WEEKS_BACK in 1 2 3 4; do
            AUCTION_DATE=$(python3 -c "from datetime import date, timedelta; print((date.today() - timedelta(weeks=${WEEKS_BACK})).strftime('%Y-%m-%d'))")
            for SALE_TYPE in foreclosure tax_deed; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"liberty\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"$SALE_TYPE\",\"max_pages\":\"5\"}}"
              echo "Dispatched liberty $SALE_TYPE $AUCTION_DATE"
              sleep 2
            done
          done

      - name: Verify county metrics (final evaluation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, httpx, json

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}

          client = httpx.Client(timeout=60)
          counties = ['charlotte', 'polk', 'st_lucie', 'seminole', 'liberty']

          print('### SQL VERIFICATION — SHARD-7 Evaluation')
          import datetime
          print(f'Timestamp: {datetime.datetime.now(datetime.timezone.utc).isoformat()}')

          for county in counties:
              r = client.post(f'{BASE}/rpc/pencil_dod_evaluate_county', headers=H, json={'county_name': county})
              if r.status_code == 200:
                  ev = r.json()
                  if isinstance(ev, list):
                      passes = [row['letter'] for row in ev if isinstance(row, dict) and row.get('pass')]
                      print(f'{county.upper()}: {len(passes)}/10 PASS — {passes}')
                      for row in ev:
                          if isinstance(row, dict):
                              status = 'PASS' if row.get('pass') else 'FAIL'
                              print(f\"  {row.get('letter')}: {status} metric={row.get('metric')}\")
                  else:
                      print(f'{county}: result format unexpected: {str(ev)[:200]}')
              else:
                  print(f'{county}: evaluation failed {r.status_code}: {r.text[:100]}')
          " 2>&1 | tee /tmp/shard7_verify_output.txt

          cat /tmp/shard7_verify_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Run gold_standard_loop + certify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, httpx

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=300)

          print('Running gold_standard_loop...')
          r = client.post(f'{BASE}/rpc/gold_standard_loop', headers=H, json={}, timeout=300)
          print(f'loop: {r.status_code}')
          if r.status_code == 200:
              print(str(r.text)[:200])

          import time
          time.sleep(5)

          print('Running gold_standard_certify...')
          r2 = client.post(f'{BASE}/rpc/gold_standard_certify', headers=H, json={}, timeout=120)
          print(f'certify: {r2.status_code}')
          if r2.status_code == 200:
              print(r2.text[:500])
          " 2>&1

      - name: Commit any new migration files
        run: |
          set +e
          git pull --rebase origin main || git pull origin main
          git add supabase/migrations/20260619_shard7_s65_*.sql || true
          git add scripts/shard7_s65_*.py || true
          git add scripts/shard7_*.py || true
          git diff --cached --quiet || git commit -m "fix: SHARD-7 S65 migration + script updates from GHA run"
          git push origin main || true
