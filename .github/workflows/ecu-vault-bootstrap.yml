name: ECU Vault Bootstrap

# Populates Supabase vault with secrets needed for ecu_chat_send():
#   anthropic_api_key  ← from ANTHROPIC_API_KEY  (TIER 1 PRIMARY for Claude)
#   gemini_api_key     ← from GEMINI_API_KEY     (TIER 2 FALLBACK)
# Idempotent: re-running just refreshes the values.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ecu_vault_bootstrap_runs row id'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  populate-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets present
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_URL:-}" ]              && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "${ANTHROPIC_API_KEY:-}" ]         && missing+=("ANTHROPIC_API_KEY")
          [ -z "${GEMINI_API_KEY:-}" ]            && missing+=("GEMINI_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi
          echo "All four required secrets present."

      - name: Push anthropic_api_key to Supabase vault
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          body=$(jq -nc \
            --arg name "anthropic_api_key" \
            --arg value "$ANTHROPIC_API_KEY" \
            --arg desc "Anthropic API key (TIER 1 PRIMARY for ECU chat). Set by ecu-vault-bootstrap workflow." \
            '{p_name: $name, p_value: $value, p_description: $desc}')
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_set_vault_secret" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n 1)
          json=$(echo "$response" | sed '$d')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase RPC failed (HTTP $status): $json"
            exit 1
          fi
          echo "anthropic_api_key set: $json"

      - name: Push gemini_api_key to Supabase vault
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          body=$(jq -nc \
            --arg name "gemini_api_key" \
            --arg value "$GEMINI_API_KEY" \
            --arg desc "Gemini 2.5 Flash paid API key (TIER 2 FALLBACK for ECU chat)." \
            '{p_name: $name, p_value: $value, p_description: $desc}')
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_set_vault_secret" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n 1)
          json=$(echo "$response" | sed '$d')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase RPC failed (HTTP $status): $json"
            exit 1
          fi
          echo "gemini_api_key set: $json"

      - name: Verify both required secrets configured
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_router_check_secrets" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Secret status:"
          echo "$response" | jq .
          # Both anthropic_api_key and gemini_api_key must be CONFIGURED
          # (anthropic_oauth_bearer is OPTIONAL — only one Anthropic auth needed)
          required_ok=$(echo "$response" | jq '[.[] | select(.secret_name=="anthropic_api_key" or .secret_name=="gemini_api_key") | .status] | all(.=="CONFIGURED")')
          if [ "$required_ok" = "true" ]; then
            echo "✓ Required secrets CONFIGURED (anthropic_api_key + gemini_api_key)"
          else
            echo "::error::Required secrets not all CONFIGURED"
            exit 1
          fi

      - name: Mark bootstrap run as succeeded
        if: success()
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID:                     ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then exit 0; fi
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/ecu_vault_bootstrap_runs?id=eq.$RUN_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\":\"succeeded\",\"workflow_run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"completed_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Mark bootstrap run as failed
        if: failure()
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID:                     ${{ inputs.run_id }}
        run: |
          if [ -z "${RUN_ID:-}" ]; then exit 0; fi
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/ecu_vault_bootstrap_runs?id=eq.$RUN_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"workflow_run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"completed_at\":\"$(date -u +%FT%TZ)\",\"error_message\":\"Workflow step failed; see run URL\"}" || true
