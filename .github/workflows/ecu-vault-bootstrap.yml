name: ECU Vault Bootstrap

# Populates Supabase vault with whichever LLM credentials are configured
# in this repo's GitHub secrets:
#
#   anthropic_oauth_bearer  ← from ANTHROPIC_OAUTH_BEARER  (Claude Max — preferred)
#   anthropic_api_key       ← from ANTHROPIC_API_KEY       (Claude API — alternate)
#   gemini_api_key          ← from GEMINI_API_KEY          (or GOOGLE_API_KEY)
#
# Tolerant: each step skips gracefully if its source secret isn't set.
# Required: at least ONE Anthropic credential AND at least ONE Gemini credential.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ecu_vault_bootstrap_runs row id (for traceback)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  populate-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase credentials present
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_URL:-}" ]              && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Supabase secrets: ${missing[*]}"
            exit 1
          fi
          echo "Supabase credentials present."

      # ─── ANTHROPIC OAUTH BEARER (preferred — Max plan, $0) ───────────
      - name: Push anthropic_oauth_bearer (if ANTHROPIC_OAUTH_BEARER set)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_OAUTH_BEARER:     ${{ secrets.ANTHROPIC_OAUTH_BEARER }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_OAUTH_BEARER:-}" ]; then
            echo "::warning::ANTHROPIC_OAUTH_BEARER not set in repo secrets — skipping (Max plan path unavailable)"
            exit 0
          fi
          body=$(jq -nc \
            --arg name  "anthropic_oauth_bearer" \
            --arg value "$ANTHROPIC_OAUTH_BEARER" \
            --arg desc  "Claude Max OAuth bearer (TIER 1 PRIMARY, preferred — within Max subscription, effectively \$0)." \
            '{p_name: $name, p_value: $value, p_description: $desc}')
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_set_vault_secret" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n 1)
          json=$(echo "$response" | sed '$d')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase RPC failed (HTTP $status): $json"; exit 1
          fi
          echo "✓ anthropic_oauth_bearer set: $json"

      # ─── ANTHROPIC API KEY (alternate — sk-ant-*, billed per token) ──
      - name: Push anthropic_api_key (if ANTHROPIC_API_KEY set)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set — skipping API key path"; exit 0
          fi
          body=$(jq -nc \
            --arg name  "anthropic_api_key" \
            --arg value "$ANTHROPIC_API_KEY" \
            --arg desc  "Claude API key (TIER 1 alternate — used only if anthropic_oauth_bearer absent)." \
            '{p_name: $name, p_value: $value, p_description: $desc}')
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_set_vault_secret" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n 1); json=$(echo "$response" | sed '$d')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase RPC failed (HTTP $status): $json"; exit 1
          fi
          echo "✓ anthropic_api_key set: $json"

      # ─── GEMINI / GOOGLE API KEY (TIER 2 fallback) ───────────────────
      - name: Push gemini_api_key (prefer GEMINI_API_KEY, fall back to GOOGLE_API_KEY)
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY:             ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY="${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}"
          SOURCE="GEMINI_API_KEY"
          [ -z "${GEMINI_API_KEY:-}" ] && [ -n "${GOOGLE_API_KEY:-}" ] && SOURCE="GOOGLE_API_KEY (fallback)"
          if [ -z "$KEY" ]; then
            echo "::warning::Neither GEMINI_API_KEY nor GOOGLE_API_KEY set — skipping Gemini fallback"; exit 0
          fi
          body=$(jq -nc \
            --arg name  "gemini_api_key" \
            --arg value "$KEY" \
            --arg desc  "Gemini 2.5 Flash paid API key (TIER 2 FALLBACK). Sourced from $SOURCE." \
            '{p_name: $name, p_value: $value, p_description: $desc}')
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_set_vault_secret" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n 1); json=$(echo "$response" | sed '$d')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase RPC failed (HTTP $status): $json"; exit 1
          fi
          echo "✓ gemini_api_key set from $SOURCE: $json"

      # ─── GUARD: at least one Anthropic creds required ────────────────
      - name: Verify minimum required vault state
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ecu_router_check_secrets" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Secret status:"; echo "$response" | jq .
          # At least ONE Anthropic credential must be CONFIGURED
          anthro_ok=$(echo "$response" | jq '[.[] | select(.secret_name=="anthropic_oauth_bearer" or .secret_name=="anthropic_api_key") | select(.status=="CONFIGURED")] | length >= 1')
          # Gemini fallback also required
          gemini_ok=$(echo "$response" | jq '[.[] | select(.secret_name=="gemini_api_key") | select(.status=="CONFIGURED")] | length == 1')
          if [ "$anthro_ok" = "true" ] && [ "$gemini_ok" = "true" ]; then
            echo "✓ Vault state meets minimum: Anthropic + Gemini both CONFIGURED"
          else
            echo "::error::Insufficient vault state. Anthropic_ok=$anthro_ok, Gemini_ok=$gemini_ok"
            exit 1
          fi

      - name: Mark bootstrap run as succeeded
        if: success()
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID:                     ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then exit 0; fi
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/ecu_vault_bootstrap_runs?id=eq.$RUN_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\":\"succeeded\",\"workflow_run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"completed_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Mark bootstrap run as failed
        if: failure()
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID:                     ${{ inputs.run_id }}
        run: |
          if [ -z "${RUN_ID:-}" ]; then exit 0; fi
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/ecu_vault_bootstrap_runs?id=eq.$RUN_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"workflow_run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"completed_at\":\"$(date -u +%FT%TZ)\",\"error_message\":\"Workflow step failed; see run URL\"}" || true
