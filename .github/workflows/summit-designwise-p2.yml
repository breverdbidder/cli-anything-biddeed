name: "Summit: DesignWise P2 — A11y + Support + Deploy + SEO"
on:
  workflow_dispatch: {}

jobs:
  p2-execute:
    name: "P2: Core Hardening (A11y, Support, Deploy, SEO, Infra)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute P2 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web
            echo "Last 3 commits:"
            git log --oneline -3

            echo "=== [5/6] Claude Code — P2 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='${OAUTH_TOKEN}'
              export SUPABASE_URL='${SUPABASE_URL}'
              export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='${GH_PAT}'
              export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
              export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'

              cd /opt/biddeed/zonewise-web

              claude --print --dangerously-skip-permissions 'MISSION: DesignWise Squad P2 — Core Hardening. Read docs/plans/DESIGNWISE-TODO.md and docs/plans/DESIGNWISE-FIRE.md first. P0 and P1 are complete. Execute P2 tasks in priority order. PRIORITIZE highest-impact tasks that fit in 110 min session. PRIORITY 1 — P2B-1 SupportWise FAQ page (3h): Create app/help/page.tsx with HelpContent client component. 10-item FAQ accordion with categories (Getting Started, Data, Pricing, Features, Support, Security). Search/filter. House brand colors Navy 1E3A5F Orange F59E0B Dark 020617. Add /help link to footer. Reference docs/designwise-staging/p2b/help-page.tsx and HelpContent.tsx for structure. Commit after. PRIORITY 2 — P2B-4 DeployWise health check (2h): Create app/api/health/route.ts — checks env vars and Supabase connection. Reference docs/designwise-staging/p2b/health-route.ts. Commit after. PRIORITY 3 — P2B-5 SEOWise metadata (4h): Create lib/seo-metadata.ts with unique metadata for every route. Update each page.tsx to use route-specific metadata. Reference docs/designwise-staging/p2b/seo-metadata.ts. Commit after. PRIORITY 4 — P2A-1 A11yWise ARIA on map (3h): Add role=application and aria-label to explorer MapCanvas. Add aria-label to map controls. Add keyboard event handlers. Reference docs/designwise-staging/p2a/useMapKeyboard.ts. Commit after. PRIORITY 5 — P2A-2 A11yWise focus styles (1h): Add focus-visible styles with outline 2px solid F59E0B offset 2px on all interactive elements in globals.css. Commit after. PRIORITY 6 — P2C-3 Sentinel stale workflow filter (1h): If time remains, update scripts sentinel-patrol.sh to filter known 422 stale workflow names from Telegram alerts. Commit after. RULES: git config ci@biddeed.ai / BidDeed-CI. Remote: https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git. Commit after EACH task. Push to main. Update docs/plans/DESIGNWISE-TODO.md marking completed tasks. BUILD GATE: bun run build must pass after each commit. If context hits 50 percent, commit and push what you have. Send Telegram when done: curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=${TELEGRAM_CHAT_ID} -d parse_mode=Markdown -d text=P2 SUMMIT summary with completed tasks. COST DISCIPLINE: 10 dollar session max. No unnecessary installs. GO.'
            "

            echo "=== [6/6] Done ==="
