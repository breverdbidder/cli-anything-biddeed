name: "Gold Standard SHARD-4 Run-8310 (st_lucie E+I fix)"
# dispatch_id: 55b8a3ab-3845-4c12-8db4-9d1e4e89c120
# Session: architect-20260802T160000
# Issue: breverdbidder/cli-anything-biddeed#17342
# Target: st_lucie 8/10 -> 10/10 (fix E=94.1% + I=94.1%)
# SHIP-TO-MAIN: direct push, no PRs

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - e_i_fix
          - verify
  schedule:
    - cron: '10 8 * * *'
    - cron: '10 16 * * *'

concurrency:
  group: gold-standard-shard4-run8310-st-lucie
  cancel-in-progress: false

jobs:
  e-i-fix:
    name: "st_lucie E+I Parcel Linkage Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run st_lucie E+I fix
        run: python3 scripts/shard4_run8310_st_lucie_e_i_fix.py

  verify:
    name: "Verify st_lucie Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e-i-fix
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify pencil_dod_evaluate_county st_lucie
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SUPABASE_KEY = os.environ.get('SUPABASE_KEY', '')
          if not SUPABASE_URL or not SUPABASE_KEY:
              print("No SUPABASE_URL/KEY — cannot verify")
              exit(0)

          headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': f'Bearer {SUPABASE_KEY}',
              'Content-Type': 'application/json',
          }

          def rpc_evaluate(county):
              url = f"{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
              payload = json.dumps({'p_county': county}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  eval error: {e}")
                  return None

          print("### SQL VERIFICATION — SHARD-4 Run-8310 st_lucie")
          print(f"dispatch_id: 55b8a3ab-3845-4c12-8db4-9d1e4e89c120")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")

          result = rpc_evaluate('st_lucie')
          if result is None:
              print("st_lucie: EVALUATION FAILED")
              exit(1)

          if isinstance(result, dict):
              passes = sum(1 for ltr in 'ABCDEFGHIJ'
                           if isinstance(result.get(ltr), dict) and result[ltr].get('pass'))
              for ltr in 'ABCDEFGHIJ':
                  ldata = result.get(ltr, {})
                  p = 'PASS' if ldata.get('pass') else 'FAIL'
                  m = ldata.get('metric', '?')
                  d = ldata.get('detail', '')
                  print(f"  {ltr} {p} metric={m} [{d}]")
              print(f"")
              print(f"st_lucie [{passes}/10]")
              if passes == 10:
                  print("GOLD STANDARD ACHIEVED: st_lucie 10/10")
              elif passes >= 9:
                  print(f"One letter away — remaining: {[l for l in 'ABCDEFGHIJ' if not result.get(l, {}).get('pass')]}")
          else:
              print(f"Unexpected result type: {type(result)}")
              exit(1)
          PYEOF
