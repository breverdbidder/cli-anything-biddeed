name: "ZoneWise: Density Extract (municode)"
on:
  workflow_dispatch:
    inputs:
      issues:
        description: "dispatcher issue ref (ignored by this job)"
        required: false
        default: ""
      limit:
        description: "districts to process this run"
        required: false
        default: "8"
jobs:
  extract:
    name: "Extract stated du/acre from municode (honest, provenance)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx playwright
      - run: python -m playwright install --with-deps chromium
      - name: "Run density extractor"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/zw_density_extract.py
