name: Certify Router — Shadow Audit Cron

# Runs nightly to force-audit a sample of cheap-path certs with Opus.
# Disagreements trigger auto-tighten (raise shadow_rate, lower floors, set min_tier=sonnet)
# and post a Sentinel alert.

on:
  schedule:
    # 02:00 UTC daily (off-peak, after all nightly scrapers)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_county:
        description: 'Force-audit a specific county (blank = use shadow_audit_rate sampling)'
        required: false
        default: ''
      force_disagree:
        description: 'Force disagreement for testing auto-tighten (true/false)'
        required: false
        default: 'false'

concurrency:
  group: certify-shadow-audit
  cancel-in-progress: false

jobs:
  shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet anthropic httpx

      - name: Run shadow audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_COUNTY: ${{ github.event.inputs.force_county || '' }}
          FORCE_DISAGREE: ${{ github.event.inputs.force_disagree || 'false' }}
          TRIGGER_SOURCE: shadow_audit_cron
        run: |
          python3 - <<'EOF'
          import httpx, json, os, random, sys
          sys.path.insert(0, ".")

          from certify.router import (
              _load_config, _sb_get, _shadow_audit_sample, _run_gate,
              DEFAULT_SHADOW_RATE,
          )

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          force_county = os.environ.get("FORCE_COUNTY", "").strip()
          force_disagree = os.environ.get("FORCE_DISAGREE", "false").lower() == "true"

          cfg = _load_config()
          shadow_rate = float(cfg.get("shadow_audit_rate", DEFAULT_SHADOW_RATE))
          print(f"shadow_audit_rate={shadow_rate}")

          # Fetch recent cheap-path certs not yet shadow-audited
          rows = _sb_get("certify_tier_trail", {
              "final_certify": "eq.true",
              "shadow_audited": "eq.false",
              "final_tier":    "in.(t1,t2)",
              "select":        "id,county_slug,run_id",
              "order":         "created_at.desc",
              "limit":         "100",
          })

          if force_county:
              candidates = [r for r in rows if r["county_slug"] == force_county]
              if not candidates:
                  # Fetch any trail for the county to force-test
                  candidates = _sb_get("certify_tier_trail", {
                      "county_slug": f"eq.{force_county}",
                      "final_certify": "eq.true",
                      "select": "id,county_slug,run_id",
                      "limit": "1",
                  })
          else:
              # Sample at shadow_rate
              candidates = [r for r in rows if random.random() < shadow_rate]

          print(f"Shadow audit candidates: {len(candidates)}")
          disagreements = 0

          for trail in candidates:
              trail_id    = trail["id"]
              county_slug = trail["county_slug"]
              run_id      = trail["run_id"]

              try:
                  gate = _run_gate(county_slug)
              except Exception as e:
                  print(f"SKIP {county_slug}: gate error {e}")
                  continue

              if force_disagree:
                  # Monkey-patch Opus to disagree — tests the tighten path
                  import certify.router as router_mod
                  orig = router_mod._run_opus_review
                  router_mod._run_opus_review = lambda *a, **kw: ("Anomaly detected: forced_disagree=true", 100, 50)
                  agreed = _shadow_audit_sample(trail_id, county_slug, run_id, gate)
                  router_mod._run_opus_review = orig
              else:
                  agreed = _shadow_audit_sample(trail_id, county_slug, run_id, gate)

              if not agreed:
                  disagreements += 1
                  print(f"DISAGREEMENT: {county_slug} trail_id={trail_id}")

          print(f"\nShadow audit complete: {len(candidates)} audited, {disagreements} disagreements")
          if disagreements > 0:
              print("Auto-tighten triggered — floors lowered, shadow_rate raised, min_tier=sonnet")
              # Reload config to show new values
              new_cfg = _load_config()
              print(f"  haiku_floor:   {new_cfg.get('haiku_confidence_floor')}")
              print(f"  sonnet_floor:  {new_cfg.get('sonnet_confidence_floor')}")
              print(f"  shadow_rate:   {new_cfg.get('shadow_audit_rate')}")
              print(f"  min_tier:      {new_cfg.get('min_tier')}")
          EOF

      - name: Print weekly cost telemetry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'EOF'
          import httpx, os
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          resp = httpx.get(
              f"{url}/rest/v1/v_certify_cost_weekly",
              headers=headers,
              params={"limit": "8", "order": "week_start.desc"},
              timeout=20,
          )
          rows = resp.json() if resp.status_code == 200 else []
          print("=== Certify Router Weekly Cost (Opus Reduction %) ===")
          for row in rows:
              pct = row.get("opus_reduction_pct") or "n/a"
              print(
                  f"  {row['week_start']}  "
                  f"counties={row['counties_processed']}  "
                  f"actual={row['actual_cost_cents']}¢  "
                  f"opus_baseline={row['opus_only_cost_cents']}¢  "
                  f"reduction={pct}%"
              )
          EOF
