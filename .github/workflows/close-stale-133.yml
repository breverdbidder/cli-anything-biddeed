name: Close Stale Issue #133 — GHA-435588 Resolved

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-stale-133.yml'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark GHA-435588 done in nexus_tasks and close issue #133
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, os, textwrap
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "breverdbidder/cli-anything-biddeed"

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          gh_h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}

          # 1. Mark GHA-435588 as done in nexus_tasks
          for status_val in ["done", "resolved", "cancelled"]:
              r = requests.patch(
                  f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.GHA-435588",
                  headers=sb_h,
                  json={
                      "status": status_val,
                      "completed_at": datetime.now(timezone.utc).isoformat(),
                      "result_summary": "YAML parse failure fixed in commit 80c9d4cf — heredoc content indented 12 spaces so GitHub YAML parser accepts the block scalar.",
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                  }
              )
              print(f"Supabase update ({status_val}): {r.status_code} — {r.text[:200]}")
              if r.status_code in (200, 204):
                  break
              if r.status_code == 400 and "23514" in r.text:
                  continue
              break

          # 2. Comment on issue #133
          comment = textwrap.dedent("""
              ## Root Cause Analysis -- VERIFIED

              Root cause: `.github/workflows/summit-stripe-paywall.yml` had a YAML parse failure at line 123.

              The TypeScript/Python heredoc content lines were at column 0 in the file.
              GitHub YAML parser treats any block-scalar line with less indentation than the block
              base as an early block terminator. The import on line 123 ended the `script:` block.

              Fix applied: commit `80c9d4cf` (fix #132: summit-stripe-paywall)
              - All heredoc content lines indented to 12-space YAML alignment
              - YAML strips 12-space prefix at parse time, shell sees content at column 0 (correct)
              - Heredoc terminators remain at column 0 in the executed script

              Verification: `python3 -c "import yaml; yaml.safe_load(open('.github/workflows/summit-stripe-paywall.yml'))"` returns OK.

              GHA-435588 marked done in nexus_tasks. Closing as resolved.
          """).strip()

          r2 = requests.post(
              f"https://api.github.com/repos/{REPO}/issues/133/comments",
              headers=gh_h,
              json={"body": comment}
          )
          print(f"Comment: {r2.status_code}")

          # 3. Close issue #133
          r3 = requests.patch(
              f"https://api.github.com/repos/{REPO}/issues/133",
              headers=gh_h,
              json={"state": "closed", "state_reason": "completed"}
          )
          print(f"Close issue: {r3.status_code}")
          PYSCRIPT
