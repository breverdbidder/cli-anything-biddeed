name: "Diagnose BTT schema + MCA join keys"
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
    steps:
      - name: "Query BTT schema and sample rows"
        run: |
          run_q() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/q.json
            curl -sS -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json
            echo; echo
          }

          run_q "brevard_tier1_today columns" \
            "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='brevard_tier1_today' ORDER BY ordinal_position"

          run_q "brevard_tier1_today full sample (3 rows)" \
            "SELECT * FROM brevard_tier1_today LIMIT 3"

          run_q "MCA columns containing 'auction' or 'registry' or 'bid'" \
            "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='multi_county_auctions' AND (column_name ILIKE '%auction%' OR column_name ILIKE '%registry%' OR column_name ILIKE '%bid%' OR column_name ILIKE '%realtax%' OR column_name ILIKE '%tier1%') ORDER BY ordinal_position"

          run_q "MCA all columns (brevard)" \
            "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='multi_county_auctions' ORDER BY ordinal_position"

          run_q "MCA sample row (brevard, completed status)" \
            "SELECT * FROM multi_county_auctions WHERE county='brevard' AND auction_status='completed' LIMIT 2"

          run_q "realforeclose_aids columns" \
            "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='realforeclose_aids' ORDER BY ordinal_position"

          run_q "realforeclose_aids sample" \
            "SELECT * FROM realforeclose_aids LIMIT 3"
