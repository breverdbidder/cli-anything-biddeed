name: "Gold Standard Shard-10: highlands + lee — run 5153"
# dispatch_id: 6e68076f-54a1-4bf5-a3a0-1b5a621e969c
# Session: 2026-07-19
# Target: highlands (8/10 → 10/10), lee (5/10 → 10/10)
#
# Phase 1: Apply lee G fix migration (set parking_regulated=false on all lee districts)
# Phase 2: Run session script (highlands C/D harvest, lee I geocoding, lee C/D investigation)
# Phase 3: Verify scores via pencil_dod_evaluate_county

on:
  workflow_dispatch:

jobs:
  apply-lee-g-fix:
    name: "Phase 1: Apply lee G parking_regulated fix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Apply lee G fix: parking_regulated=false for all lee jids"
        run: |
          set -euo pipefail
          echo "=== Applying migrations/20260719_gold_standard_shard10_highlands_lee.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('migrations/20260719_gold_standard_shard10_highlands_lee.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Lee G fix migration applied successfully"

      - name: "Verify lee G score after fix"
        run: |
          set -uo pipefail
          echo "=== pencil_dod_evaluate_county('lee') ==="
          python3 -c "
          import json
          print(json.dumps({'query': \"SELECT public.pencil_dod_evaluate_county('lee') AS result;\"}))
          " > /tmp/verify.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verify.json
          echo

  run-session-script:
    name: "Phase 2: Run session script (highlands C/D, lee I geocode, lee C/D)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: apply-lee-g-fix
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run shard10_run5153_highlands_lee_session.py"
        run: |
          set -euo pipefail
          cd /home/runner/work/cli-anything-biddeed/cli-anything-biddeed
          python3 scripts/shard10_run5153_highlands_lee_session.py
        working-directory: ${{ github.workspace }}

  verify-final-scores:
    name: "Phase 3: Final verification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: run-session-script
    if: always()
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Final scores for highlands + lee"
        run: |
          set -uo pipefail
          for county in highlands lee; do
            echo "=== pencil_dod_evaluate_county('$county') ==="
            python3 -c "
          import json
          print(json.dumps({'query': \"SELECT public.pencil_dod_evaluate_county('$county') AS result;\"}))
            " > /tmp/verify_${county}.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/verify_${county}.json
            echo
          done
