name: "Verify Deployment — deployment-verifier tool"
# Issue: breverdbidder/cli-anything-biddeed#101
#
# Runs after successful production deploys OR on-demand.
# Tests: verify_deployment.py → signal_detector.py → auto_repair.py
# Targets: zonewise.ai/chat-v2 + configurable URL list

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated URLs to verify (default: zonewise.ai/chat-v2)"
        required: false
        default: "https://zonewise.ai/chat-v2,https://zonewise.ai"
      selectors:
        description: "CSS selectors to check (comma-separated)"
        required: false
        default: ""
      create_issue:
        description: "Create GitHub issue on critical failure"
        required: false
        type: boolean
        default: true
  # Auto-trigger after deploy workflows succeed
  workflow_run:
    workflows:
      - "Deploy ZoneWise Dify to Hetzner"
      - "Deploy ZoneWise Dify"
    types:
      - completed

jobs:
  verify:
    name: "Verify Deployment"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright httpx
          playwright install chromium --with-deps

      - name: Set URL list
        id: urls
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URLS="${{ inputs.urls }}"
          else
            # Default targets after auto-trigger
            URLS="https://zonewise.ai/chat-v2,https://zonewise.ai"
          fi
          echo "urls=${URLS}" >> "$GITHUB_OUTPUT"

      - name: Run DB migration (idempotent)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - << 'EOF'
          import os, httpx, pathlib

          url = os.getenv("SUPABASE_URL", "")
          key = os.getenv("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("⚠️  SUPABASE creds not set — skipping migration")
              exit(0)

          sql = pathlib.Path("migrations/20260330_deployment_checks.sql").read_text()
          resp = httpx.post(
              f"{url}/rest/v1/rpc/exec_sql",
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"},
              json={"query": sql},
              timeout=30,
          )
          # exec_sql may not exist; use pg REST approach
          # Tables are CREATE IF NOT EXISTS so idempotent
          print(f"Migration response: {resp.status_code}")
          EOF

      - name: Verify deployments
        id: verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          URLS="${{ steps.urls.outputs.urls }}"
          SELECTORS="${{ inputs.selectors }}"

          # Convert comma-separated URLs to --batch file
          echo "${URLS}" | tr ',' '\n' > /tmp/verify_urls.txt
          echo "Verifying URLs:"
          cat /tmp/verify_urls.txt

          ARGS="--batch /tmp/verify_urls.txt --json --persist"
          if [ -n "${SELECTORS}" ]; then
            ARGS="${ARGS} --selectors ${SELECTORS}"
          fi

          cd tools/deployment-verifier
          python verify_deployment.py ${ARGS} > /tmp/verify_results.json 2>&1
          EXIT_CODE=$?
          cat /tmp/verify_results.json

          echo "verify_exit=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Detect signals
        id: signals
        run: |
          cd tools/deployment-verifier
          python signal_detector.py /tmp/verify_results.json --critical-only \
            > /tmp/critical_signals.json 2>&1 || true

          SIGNAL_COUNT=$(python -c "import json,sys; d=json.load(open('/tmp/critical_signals.json')); print(len(d))" 2>/dev/null || echo "0")
          echo "critical_count=${SIGNAL_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Critical signals found: ${SIGNAL_COUNT}"
          cat /tmp/critical_signals.json

      - name: Auto-repair — create issue on critical failure
        if: steps.signals.outputs.critical_count != '0' && (github.event_name == 'workflow_dispatch' && inputs.create_issue == 'true' || github.event_name == 'workflow_run')
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd tools/deployment-verifier
          python auto_repair.py \
            --signals /tmp/critical_signals.json \
            --repo breverdbidder/cli-anything-biddeed \
            --create-issue \
            --json > /tmp/repair_actions.json 2>&1
          cat /tmp/repair_actions.json

      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VERIFY_EXIT="${{ steps.verify.outputs.verify_exit }}"
          CRITICAL="${{ steps.signals.outputs.critical_count }}"
          URLS="${{ steps.urls.outputs.urls }}"

          if [ "${VERIFY_EXIT}" = "0" ]; then
            EMOJI="✅"
            STATUS="PASS"
          else
            EMOJI="❌"
            STATUS="FAIL"
          fi

          MSG="${EMOJI} Deployment Verify: ${STATUS}%0AURLs: ${URLS}%0ACritical signals: ${CRITICAL:-0}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" > /dev/null 2>&1 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-screenshots
          path: /tmp/deployment-verifier-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if critical signals found
        if: steps.signals.outputs.critical_count != '0'
        run: |
          echo "❌ ${critical_count} critical deployment signals detected"
          exit 1
