name: "HZ Probe"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: probe
        run: |
          echo "=== Cloud API with HETZNER_PASSWORD ==="
          R1=$(curl -s -w "\nHTTP:%{http_code}" -H "Authorization: Bearer ${{ secrets.HETZNER_PASSWORD }}" "https://api.hetzner.cloud/v1/servers")
          echo "$R1" | tail -1
          echo "$R1" | head -n -1 | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            for s in d.get('servers',[]):
              ip=s.get('public_net',{}).get('ipv4',{}).get('ip','?')
              print(f'ID:{s[\"id\"]} Name:{s[\"name\"]} Status:{s[\"status\"]} IP:{ip}')
              # Check firewall
              fw=s.get('public_net',{}).get('firewalls',[])
              if fw: print(f'  Firewalls: {fw}')
            if not d.get('servers'):
              print(f'No servers or auth error: {str(d)[:200]}')
          except Exception as e:
            print(f'Parse error: {e}')
            print(sys.stdin.read()[:200] if hasattr(sys.stdin,'read') else '')
          "
          echo ""
          echo "=== SSH probe ==="
          timeout 5 bash -c 'echo | nc -w 3 ${{ secrets.HETZNER_IP }} 22' && echo "SSH:UP" || echo "SSH:DOWN"
          echo ""
          echo "=== Firewall check ==="
          curl -s -H "Authorization: Bearer ${{ secrets.HETZNER_PASSWORD }}" "https://api.hetzner.cloud/v1/firewalls" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            for f in d.get('firewalls',[]):
              print(f'FW:{f[\"name\"]} Rules:{len(f.get(\"rules\",[]))}')
              for r in f.get('rules',[]):
                print(f'  {r.get(\"direction\",\"?\")} {r.get(\"protocol\",\"?\")} port:{r.get(\"port\",\"?\")} src:{r.get(\"source_ips\",\"?\")}')
          except: print('No firewall data')
          "
