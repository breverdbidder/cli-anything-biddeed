name: "Summit: DesignWise Stitch 2.0 Spec Patch — 9 Amendments"
on:
  workflow_dispatch: {}

jobs:
  patch:
    name: "Apply SPEC-PATCH.md + stitch_usage table + quota logic + SDK swap"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute Spec Patch on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== [1/6] Setup claude user ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Update Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null

            echo "=== [3/6] Setup auth token ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Clone/Pull Repos ==="
            mkdir -p /opt/biddeed
            
            # CLI-ANYTHING repo
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed

            # ZONEWISE-WEB repo (for DESIGN.md + lab branch)
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web

            echo "Repos ready"

            echo "=== [5/6] Run Claude Code ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'MISSION: Apply DesignWise Stitch 2.0 Spec Patch — 9 Amendments. Zero human intervention.

              STEP 0 — READ ALL CONTEXT FIRST
              Read these files IN ORDER before any code changes:
              1. CLAUDE.md (root directive)
              2. docs/plans/DESIGNWISE-SPEC.md (original spec)
              3. docs/plans/DESIGNWISE-PLAN.md (original plan)  
              4. docs/plans/DESIGNWISE-SPEC-PATCH.md (THE 9 AMENDMENTS — this is your primary mission doc)

              STEP 1 — SUPABASE: Create stitch_usage table (Amendment 1)
              Execute via curl against Supabase REST API (NEVER supabase CLI):
              
              CREATE TABLE IF NOT EXISTS stitch_usage (
                id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
                date DATE NOT NULL,
                mode TEXT NOT NULL CHECK (mode IN (flash, pro)),
                screen_name TEXT,
                generation_count INT DEFAULT 1,
                remaining INT,
                created_at TIMESTAMPTZ DEFAULT NOW(),
                UNIQUE(date, mode, screen_name)
              );

              Also: ALTER TABLE design_tasks ADD COLUMN IF NOT EXISTS figma_url TEXT;
              
              Use this pattern for SQL execution:
              curl -s -X POST \"\\${SUPABASE_URL}/rest/v1/rpc\" \
                -H \"apikey: \\${SUPABASE_SERVICE_KEY}\" \
                -H \"Authorization: Bearer \\${SUPABASE_SERVICE_KEY}\" \
                -H \"Content-Type: application/json\" \
                -d \"{\\\"query\\\": \\\"CREATE TABLE IF NOT EXISTS stitch_usage ...\\\"}\"\n              
              If rpc doesnt work, use the Supabase SQL endpoint or write a node script with fetch to the pg REST endpoint.
              Verify the table exists by querying it.

              STEP 2 — UPDATE StitchWise Agent (Amendment 1, 3, 6)
              In designwise/agent-harness/cli_anything/designwise/core/stitch_agent.py (create if not exists):
              a) Update MCP config to use @google/stitch-sdk (NOT @_davideast/stitch-mcp)
              b) Add intent-based prompt templates for all 8 screens (copy exact intents from SPEC-PATCH.md Amendment 1)
              c) Add project-wide context: single Stitch project zonewise-production
              d) Add quota check function: query stitch_usage, reject if remaining < 10
              e) Add batch generation: 5 screens per call (2 batches for 8 screens)
              f) Add mode selection: Flash for iteration, Pro for production screens
              g) Reference Stitch Skills Library for React component conversion

              STEP 3 — UPDATE Commander Agent (Amendment 5)
              In designwise/agent-harness/cli_anything/designwise/core/commander.py:
              a) Add quota check before StitchWise dispatch (query stitch_usage remaining)
              b) Add parallel dispatch support for design explorations
              c) Alert at 80 percent quota usage (280/350 used) via Telegram

              STEP 4 — ADD Interactive Prototype Flow (Amendment 2)
              In stitch_agent.py add method: generate_prototype()
              - After 8 screens generated, stitch them into clickable flow
              - Flow: Landing -> Heatmap -> Parcel click -> Gate -> Signup -> App -> Chat -> Map
              - Export as interactive HTML
              - Log to design_tasks with type interactive_prototype

              STEP 5 — ADD URL Extraction Drift Detection (Amendment 3)
              In designwise/agent-harness/cli_anything/designwise/core/brandguard_agent.py:
              a) Add method: check_design_drift(live_url, design_md_path)
              b) Extract design tokens from live site
              c) Diff against DESIGN.md in repo
              d) If drift: create GitHub Issue + Telegram alert

              Create workflow: .github/workflows/weekly-designmd-drift.yml
              Cron: Sunday 8AM EST (0 13 * * 0 UTC)
              Calls: cli-anything-designwise brandguard --drift-check

              STEP 6 — UPDATE CodeWise for Direct MCP Pipeline (Amendment 4)
              In designwise/agent-harness/cli_anything/designwise/core/codewise_agent.py:
              a) Primary path: Claude Code connects to Stitch MCP, references project directly
              b) Fallback path: HTML export + conversion (original spec)
              c) Add CLAUDE.md MCP config for Stitch SDK
              d) Use Stitch Skills Library react-component-conversion skill

              STEP 7 — ADD Figma Archive (Amendment 6)
              In stitch_agent.py add optional method: export_to_figma()
              - After screen approval, export Figma format
              - Store URL in design_tasks.figma_url
              - Low priority, non-blocking

              STEP 8 — UPDATE SPEC AND PLAN
              a) Increment DESIGNWISE-SPEC.md version to V1.1.0
              b) Add Stitch 2.0 amendments section referencing SPEC-PATCH.md
              c) Update DESIGNWISE-PLAN.md to include patch tasks in correct sprints:
                 - S1: stitch_usage table, Commander quota check  
                 - S2: Intent prompting, project context, SDK swap, URL extraction, Stitch-to-CC pipeline
                 - S3: Prototyping, parallel explorations
                 - S4: Figma archive
              d) Add weekly-designmd-drift.yml to cron workflow table

              STEP 9 — TESTS
              Write tests for all new functionality:
              - test_stitch_quota.py: quota tracking, quota limit enforcement
              - test_brand_drift.py: URL extraction, diff detection
              - test_prototype.py: flow assembly validation
              - test_parallel_dispatch.py: Commander parallel mode
              Minimum 20 new tests.

              STEP 10 — GIT PUSH
              git config user.email ci@biddeed.ai
              git config user.name BidDeed-CI
              git remote set-url origin https://x-access-token:\\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              
              Commit after each major step. Push frequently.
              Final commit message: \"feat: DesignWise Stitch 2.0 spec patch — 9 amendments applied, stitch_usage table, quota mgmt, SDK swap, drift detection\"

              STEP 11 — TELEGRAM NOTIFICATION
              When ALL steps complete:
              curl -s -X POST \"https://api.telegram.org/bot\\${TELEGRAM_BOT_TOKEN}/sendMessage\" \
                -d chat_id=\"\\${TELEGRAM_CHAT_ID}\" \
                -d text=\"✅ DESIGNWISE SPEC PATCH DEPLOYED
              9 Stitch 2.0 amendments applied:
              • stitch_usage quota table CREATED
              • Intent-based vibe prompts ADDED
              • @google/stitch-sdk MCP config UPDATED  
              • Project-wide context threading ADDED
              • URL extraction drift detection ADDED
              • Interactive prototype flow ADDED
              • Parallel exploration dispatch ADDED
              • Figma archive pipeline ADDED
              • Stitch-to-Claude-Code direct MCP ADDED
              • 20+ new tests
              • SPEC V1.1.0 + PLAN V1.1.0
              Repo: cli-anything-biddeed/designwise/\"

              COST: Zero dollars. All existing infrastructure.
              '
            "

            echo "=== [6/6] Session complete ==="
