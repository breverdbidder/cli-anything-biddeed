name: "\U0001F3AC YouTube Transcript Squad"

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL or Video ID'
        required: true
        type: string
  repository_dispatch:
    types: [youtube-transcript]

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy script to Hetzner
        run: |
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no \
            youtube_transcript/yt_transcript_squad.py \
            root@${{ secrets.HETZNER_IP }}:/opt/yt-transcript/yt_transcript_squad.py

      - name: Run on Hetzner (non-cloud IP)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          URL="${{ github.event.inputs.youtube_url || github.event.client_payload.url }}"
          if [ -z "$URL" ]; then
            echo "No YouTube URL provided"
            exit 1
          fi
          echo "Processing: $URL on Hetzner (non-cloud IP)"

          # Run pipeline on Hetzner where youtube-transcript-api works
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no \
            root@${{ secrets.HETZNER_IP }} \
            "cd /opt/yt-transcript && \
             CLIPROXY_BASE_URL=http://127.0.0.1:8317 \
             CLIPROXY_API_KEY=\$(cat /opt/cliproxy-gateway/.env.generated 2>/dev/null | grep GATEWAY_API_KEY | cut -d= -f2 || echo '') \
             SUPABASE_URL='$SUPABASE_URL' \
             SUPABASE_SERVICE_KEY='$SUPABASE_KEY' \
             OUTPUT_DIR=/opt/yt-transcript/output \
             python3 yt_transcript_squad.py '$URL'"

      - name: Fetch results from Hetzner
        if: success()
        run: |
          mkdir -p ./output
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no \
            "root@${{ secrets.HETZNER_IP }}:/opt/yt-transcript/output/*" ./output/ 2>/dev/null || true
          ls -la ./output/

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-report
          path: output/
          retention-days: 30

      - name: Commit report to repo
        if: success()
        run: |
          git config user.name "BidDeed Bot"
          git config user.email "bot@biddeed.ai"
          mkdir -p reports/transcripts
          cp output/*.md reports/transcripts/ 2>/dev/null || true
          cp output/*.json reports/transcripts/ 2>/dev/null || true
          git add reports/transcripts/
          git diff --cached --quiet || git commit -m "Transcript: ${{ github.event.inputs.youtube_url || github.event.client_payload.url }}"
          git push || echo "Push failed"
