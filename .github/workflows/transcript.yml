name: YouTube Transcript Squad

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube URL or type setup-brain to init vault on Hetzner
        required: true
        type: string
  repository_dispatch:
    types: [youtube-transcript]

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPADATA_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          URL="${{ github.event.inputs.youtube_url || github.event.client_payload.url }}"
          if [ -z "$URL" ]; then echo "No URL"; exit 1; fi

          if [ "$URL" = "setup-brain" ]; then
            echo "=== SETTING UP BRAIN VAULT ON HETZNER ==="
            sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} "
              if [ -d /opt/biddeed-brain/.git ]; then
                cd /opt/biddeed-brain && git pull origin main
                echo 'PULLED existing vault'
              else
                git clone https://${GH_PAT}@github.com/breverdbidder/biddeed-brain.git /opt/biddeed-brain
                echo 'CLONED fresh vault'
              fi
              cd /opt/biddeed-brain
              git config user.name 'BidDeed Bot'
              git config user.email 'bot@biddeed.ai'
              cat > /opt/biddeed-brain/sync.sh << 'SYNCEOF'
#!/bin/bash
cd /opt/biddeed-brain
git add -A
git diff --cached --quiet || git commit -m \"auto-sync: \$(date +%Y-%m-%d_%H:%M)\"
git push origin main 2>/dev/null
SYNCEOF
              chmod +x /opt/biddeed-brain/sync.sh
              (crontab -l 2>/dev/null | grep -v biddeed-brain; echo '*/5 * * * * /opt/biddeed-brain/sync.sh >/dev/null 2>&1') | crontab -
              echo '=== VAULT FILES ==='
              ls -la /opt/biddeed-brain/
              echo '=== CRON ==='
              crontab -l | grep biddeed
              echo '=== DONE ==='
            "
          else
            echo "Transcript mode not yet wired to Supadata in this workflow."
            echo "Use Claude chat to transcribe videos for now."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          retention-days: 30
          if-no-files-found: ignore
