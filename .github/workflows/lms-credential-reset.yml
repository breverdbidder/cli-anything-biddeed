name: LMS Credential Reset (self-service forgot-password)

# Ariel-triggerable, no CC session needed. This IS the forgot-login recovery
# path for the winnerdata-lms real login page (session-cookie auth as of
# #19707, 2026-09-01 — HTTP Basic Auth was retired that same day): click
# "Run workflow" here, check email. Deterministic bash/node/python only —
# no Claude Code, no quota risk, mirrors mirror-deploy.yml's no-CC pattern.
#
# What it does, in order:
#   1. Generates a fresh LMS_AUTH_USER / LMS_AUTH_PASS pair.
#   2. Sets both as live `wrangler secret put` values on the winnerdata-lms
#      Worker (this repo owns that Worker — see workers/winnerdata-lms/).
#   3. Rewrites the LMS_AUTH_USER / LMS_AUTH_PASS GitHub Actions repo secrets
#      to match, via the GitHub API (using everest_gh_pat from the Supabase
#      vault) — otherwise the next push-triggered deploy-winnerdata-lms.yml
#      run would silently redeploy the OLD credentials and undo this reset.
#   4. Overwrites (never duplicates) the lms_auth_user / lms_auth_pass
#      Supabase vault entries via the existing whitelisted
#      sync_credential_from_gha RPC (see
#      supabase/migrations/20260901g_lms_credential_reset_whitelist.sql) —
#      this is the same vault entry the winnerdataai-mvp /admin gate (issue
#      #14 in that repo, if/when it exists) should read, so there is one
#      source of truth for this credential pair, not two.
#   5. Emails the new username/password to Ariel via Resend — the actual
#      recovery channel, independent of any chat session. Deliberately runs
#      right after rotation (steps 1-4), before step 6, so a bug in the
#      verification step can never again silently withhold this — see the
#      2026-09-01 incident note above verify step below.
#   6. Verifies live against the real /login + session-cookie flow (#19707,
#      2026-09-01): OLD credentials rejected (401 + inline error), NEW
#      credentials accepted (303 + session cookie that then grants access).
#      A failure here after step 5 has already run is a verification-script
#      bug, not proof the rotation itself failed — see the error messages in
#      that step for how to tell the two apart.
#
# CREDENTIAL HANDLING (CLAUDE.md): every step touching the raw values masks
# them immediately with ::add-mask:: before they can appear in any log line,
# GITHUB_ENV dump, or step output. The generated values are never written to
# this repo, this file, a commit, or an issue/PR comment — only to Cloudflare
# Worker secrets, GitHub Actions repo secrets (also write-only once set), the
# Supabase vault, and a one-time email to Ariel's own inbox. Generation/GH-
# secret-rewrite/email logic lives in scripts/lms_credential_reset.py rather
# than inline heredocs — GH Actions' `run: |` block-scalar indentation rules
# and bash heredoc terminator rules conflict for indented multi-line Python
# (confirmed: the inline-heredoc pattern used by a couple of older sibling
# workflows in this repo, e.g. set-mindstudio-gh-secret.yml, actually raises
# `IndentationError` if run — untested until now since the value it read was
# never empty at the point that step's error handling would have surfaced
# it). A committed script sidesteps the whole class of bug.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lms-credential-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard - required secrets present
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          MISSING=""
          [ -z "$CF_TOKEN" ] && MISSING="$MISSING CF_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && MISSING="$MISSING CF_ACCOUNT_ID"
          [ -z "$SB_URL" ] && MISSING="$MISSING SUPABASE_URL"
          [ -z "$SB_KEY" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$SAT" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "$RESEND" ] && MISSING="$MISSING RESEND_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING. Add them at Settings > Secrets > Actions."
            exit 1
          fi
          echo "Secrets present."

      - name: Install deps
        run: |
          cd workers/winnerdata-lms && npm install
          pip install pynacl requests

      - name: Generate new credential pair
        run: python3 scripts/lms_credential_reset.py generate

      - name: Set live Worker secrets (Cloudflare)
        working-directory: workers/winnerdata-lms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "$NEW_LMS_AUTH_USER" | npx wrangler secret put LMS_AUTH_USER
          echo "$NEW_LMS_AUTH_PASS" | npx wrangler secret put LMS_AUTH_PASS

      - name: Rewrite GitHub Actions repo secrets (prevents next deploy from reverting)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/lms_credential_reset.py rotate-gh-secret

      - name: Update Supabase vault (lms_auth_user / lms_auth_pass)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          vault_sync() {
            local gh_name="$1" vault_name="$2" value="$3"
            payload=$(jq -n \
              --arg gn "$gh_name" --arg vn "$vault_name" --arg v "$value" \
              --arg rid "$RUN_ID" --arg rurl "$RUN_URL" \
              '{p_github_secret_name:$gn, p_vault_secret_name:$vn, p_value:$v, p_workflow_run_id:($rid|tonumber), p_workflow_run_url:$rurl}')
            response=$(curl -sS --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/rpc/sync_credential_from_gha" \
              -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              --data-binary "$payload")
            action=$(echo "$response" | jq -r '.action // "unknown"')
            echo "[$gh_name] -> vault.$vault_name :: action=$action"
            if [[ "$action" != "created" && "$action" != "updated" ]]; then
              echo "::error::vault update failed for $vault_name: $response"
              exit 1
            fi
          }

          vault_sync "LMS_AUTH_USER" "lms_auth_user" "$NEW_LMS_AUTH_USER"
          vault_sync "LMS_AUTH_PASS" "lms_auth_pass" "$NEW_LMS_AUTH_PASS"

      # Runs immediately after rotation (steps above all succeeded — GHA's
      # default no-continue-on-error behavior already guarantees this step
      # is unreachable otherwise) and BEFORE verification. This ordering is
      # the actual fix for the 2026-09-01 incident where a stale verify
      # assertion (still testing retired HTTP Basic Auth, see #19707) caused
      # this email to be silently skipped even though the rotation had
      # genuinely succeeded. Withholding the only channel Ariel has for
      # learning his login changed is worse than sending it before a
      # non-blocking verification check runs.
      - name: Email new credentials to Ariel via Resend
        id: send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/lms_credential_reset.py send-email

      # Verifies against the real /login + session-cookie flow (#19707,
      # 2026-09-01 replaced HTTP Basic Auth with this). A failure here does
      # NOT mean the rotation failed and does NOT mean the email above is
      # wrong — the rotation steps already ran and the email already sent by
      # this point. It means this verification script itself has a bug and
      # needs fixing; the ::error:: messages below say so explicitly.
      - name: Verify live - OLD credentials now rejected via /login
        env:
          OLD_USER: ${{ secrets.LMS_AUTH_USER }}
          OLD_PASS: ${{ secrets.LMS_AUTH_PASS }}
        run: |
          set -euo pipefail
          echo "::add-mask::$OLD_USER"
          echo "::add-mask::$OLD_PASS"
          URL="https://winnerdata-lms.brevardbidderai.workers.dev"
          sleep 8
          CODE=$(curl -s --max-time 15 -o /tmp/old_login_body.html -w "%{http_code}" \
            -X POST --data-urlencode "username=$OLD_USER" --data-urlencode "password=$OLD_PASS" \
            "$URL/login" || echo "000")
          echo "POST /login with OLD credentials returned $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for OLD credentials via /login, got $CODE. Rotation already succeeded and the reset email already sent -- this is a verification-script bug (wrong expected status/flow), not proof the rotation failed. Do not distrust the new credentials on this alone."
            exit 1
          fi
          if ! grep -q "Incorrect username or password" /tmp/old_login_body.html; then
            echo "::error::Got 401 for OLD credentials but missing the expected inline error text -- /login's response shape may have changed. Rotation already succeeded and the reset email already sent."
            exit 1
          fi
          echo "PASS: OLD credentials correctly rejected by /login (401 + inline error)"

      - name: Verify live - NEW credentials accepted via /login
        run: |
          set -euo pipefail
          URL="https://winnerdata-lms.brevardbidderai.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s --max-time 15 -c /tmp/lms_new_cookies.txt -o /tmp/new_login_body.html -w "%{http_code}" \
              -X POST --data-urlencode "username=$NEW_LMS_AUTH_USER" --data-urlencode "password=$NEW_LMS_AUTH_PASS" \
              "$URL/login" || echo "000")
            echo "attempt $attempt: POST /login with NEW credentials returned $CODE"
            if [ "$CODE" = "303" ] && grep -q lms_session /tmp/lms_new_cookies.txt; then
              echo "PASS: NEW credentials issue a session cookie"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::Expected 303 + session cookie for NEW credentials after 6 attempts, last code=$CODE. Rotation already succeeded and the reset email already sent. If the NEW credentials genuinely do not work, that IS serious -- re-run this workflow to rotate again. If they do work when tried manually, this is a verification-script bug."
              exit 1
            fi
            sleep 10
          done
          CODE2=$(curl -s --max-time 15 -b /tmp/lms_new_cookies.txt -o /tmp/healthz_body.json -w "%{http_code}" "$URL/healthz")
          echo "/healthz with NEW session cookie returned $CODE2"
          if [ "$CODE2" != "200" ] || ! grep -q '"ok":true' /tmp/healthz_body.json; then
            echo "::error::Session cookie from NEW credentials did not grant access to /healthz, code=$CODE2. Rotation already succeeded and the reset email already sent -- investigate whether this is a genuine session bug or a verification-script issue."
            exit 1
          fi
          echo "PASS: NEW credentials log in and the session grants access to /healthz"

      - name: Summary
        if: always()
        env:
          RESEND_ID: ${{ steps.send.outputs.resend_id }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
        run: |
          {
            echo "### LMS Credential Reset — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Cloudflare Worker secrets (winnerdata-lms): rotated"
            echo "- GitHub Actions repo secrets (LMS_AUTH_USER/LMS_AUTH_PASS): rotated"
            echo "- Supabase vault (lms_auth_user/lms_auth_pass): rotated"
            if [ "$SEND_OUTCOME" = "success" ]; then
              echo "- Reset email sent to everestcapital8@gmail.com (Resend id: ${RESEND_ID:-unknown})"
            else
              echo "- Reset email step outcome: ${SEND_OUTCOME:-unknown} (this step runs before verification and only fails if rotation itself failed above)"
            fi
            echo "- Live verification against /login + session-cookie flow: see the two 'Verify live' steps above for pass/fail"
            echo ""
            echo "No credential value appears in this log or summary."
          } >> "$GITHUB_STEP_SUMMARY"
