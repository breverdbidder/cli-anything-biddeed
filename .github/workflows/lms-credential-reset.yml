name: LMS Credential Reset (self-service forgot-password)

# Ariel-triggerable, no CC session needed. This IS the forgot-password
# recovery path for the winnerdata-lms HTTP Basic Auth login: click
# "Run workflow" here, check email. Deterministic bash/node/python only —
# no Claude Code, no quota risk, mirrors mirror-deploy.yml's no-CC pattern.
#
# What it does, in order:
#   1. Generates a fresh LMS_AUTH_USER / LMS_AUTH_PASS pair.
#   2. Sets both as live `wrangler secret put` values on the winnerdata-lms
#      Worker (this repo owns that Worker — see workers/winnerdata-lms/).
#   3. Rewrites the LMS_AUTH_USER / LMS_AUTH_PASS GitHub Actions repo secrets
#      to match, via the GitHub API (using everest_gh_pat from the Supabase
#      vault) — otherwise the next push-triggered deploy-winnerdata-lms.yml
#      run would silently redeploy the OLD credentials and undo this reset.
#   4. Overwrites (never duplicates) the lms_auth_user / lms_auth_pass
#      Supabase vault entries via the existing whitelisted
#      sync_credential_from_gha RPC (see
#      supabase/migrations/20260901g_lms_credential_reset_whitelist.sql) —
#      this is the same vault entry the winnerdataai-mvp /admin gate (issue
#      #14 in that repo, if/when it exists) should read, so there is one
#      source of truth for this credential pair, not two.
#   5. Verifies live: OLD credentials now 401, NEW credentials 200.
#   6. Emails the new username/password to Ariel via Resend — the actual
#      recovery channel, independent of any chat session.
#
# CREDENTIAL HANDLING (CLAUDE.md): every step touching the raw values masks
# them immediately with ::add-mask:: before they can appear in any log line,
# GITHUB_ENV dump, or step output. The generated values are never written to
# this repo, this file, a commit, or an issue/PR comment — only to Cloudflare
# Worker secrets, GitHub Actions repo secrets (also write-only once set), the
# Supabase vault, and a one-time email to Ariel's own inbox. Generation/GH-
# secret-rewrite/email logic lives in scripts/lms_credential_reset.py rather
# than inline heredocs — GH Actions' `run: |` block-scalar indentation rules
# and bash heredoc terminator rules conflict for indented multi-line Python
# (confirmed: the inline-heredoc pattern used by a couple of older sibling
# workflows in this repo, e.g. set-mindstudio-gh-secret.yml, actually raises
# `IndentationError` if run — untested until now since the value it read was
# never empty at the point that step's error handling would have surfaced
# it). A committed script sidesteps the whole class of bug.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lms-credential-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard - required secrets present
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          MISSING=""
          [ -z "$CF_TOKEN" ] && MISSING="$MISSING CF_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && MISSING="$MISSING CF_ACCOUNT_ID"
          [ -z "$SB_URL" ] && MISSING="$MISSING SUPABASE_URL"
          [ -z "$SB_KEY" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$SAT" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "$RESEND" ] && MISSING="$MISSING RESEND_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING. Add them at Settings > Secrets > Actions."
            exit 1
          fi
          echo "Secrets present."

      - name: TEMP DIAGNOSTIC - hash of RESEND_API_KEY as seen by runner (no value exposed)
        env:
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "sha256=$(printf '%s' "$RESEND" | sha256sum | cut -d' ' -f1)"

      - name: Install deps
        run: |
          cd workers/winnerdata-lms && npm install
          pip install pynacl requests

      - name: Generate new credential pair
        run: python3 scripts/lms_credential_reset.py generate

      - name: Set live Worker secrets (Cloudflare)
        working-directory: workers/winnerdata-lms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "$NEW_LMS_AUTH_USER" | npx wrangler secret put LMS_AUTH_USER
          echo "$NEW_LMS_AUTH_PASS" | npx wrangler secret put LMS_AUTH_PASS

      - name: Rewrite GitHub Actions repo secrets (prevents next deploy from reverting)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/lms_credential_reset.py rotate-gh-secret

      - name: Update Supabase vault (lms_auth_user / lms_auth_pass)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          vault_sync() {
            local gh_name="$1" vault_name="$2" value="$3"
            payload=$(jq -n \
              --arg gn "$gh_name" --arg vn "$vault_name" --arg v "$value" \
              --arg rid "$RUN_ID" --arg rurl "$RUN_URL" \
              '{p_github_secret_name:$gn, p_vault_secret_name:$vn, p_value:$v, p_workflow_run_id:($rid|tonumber), p_workflow_run_url:$rurl}')
            response=$(curl -sS --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/rpc/sync_credential_from_gha" \
              -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              --data-binary "$payload")
            action=$(echo "$response" | jq -r '.action // "unknown"')
            echo "[$gh_name] -> vault.$vault_name :: action=$action"
            if [[ "$action" != "created" && "$action" != "updated" ]]; then
              echo "::error::vault update failed for $vault_name: $response"
              exit 1
            fi
          }

          vault_sync "LMS_AUTH_USER" "lms_auth_user" "$NEW_LMS_AUTH_USER"
          vault_sync "LMS_AUTH_PASS" "lms_auth_pass" "$NEW_LMS_AUTH_PASS"

      - name: Verify live - OLD credentials now rejected (401)
        env:
          OLD_USER: ${{ secrets.LMS_AUTH_USER }}
          OLD_PASS: ${{ secrets.LMS_AUTH_PASS }}
        run: |
          set -euo pipefail
          echo "::add-mask::$OLD_USER"
          echo "::add-mask::$OLD_PASS"
          URL="https://winnerdata-lms.brevardbidderai.workers.dev"
          sleep 8
          CODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" -u "$OLD_USER:$OLD_PASS" "$URL/healthz" || echo "000")
          echo "/healthz with OLD credentials returned $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for OLD credentials after rotation, got $CODE"
            exit 1
          fi
          echo "PASS: OLD credentials correctly rejected"

      - name: Verify live - NEW credentials accepted (200)
        run: |
          set -euo pipefail
          URL="https://winnerdata-lms.brevardbidderai.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s --max-time 15 -o /tmp/healthz_body.json -w "%{http_code}" -u "$NEW_LMS_AUTH_USER:$NEW_LMS_AUTH_PASS" "$URL/healthz" || echo "000")
            echo "attempt $attempt: /healthz with NEW credentials returned $CODE"
            if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/healthz_body.json; then
              echo "PASS: NEW credentials accepted, ok:true"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::Expected 200 + ok:true for NEW credentials after 6 attempts, last code=$CODE"
              exit 1
            fi
            sleep 10
          done

      - name: Email new credentials to Ariel via Resend
        id: send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/lms_credential_reset.py send-email

      - name: Summary
        if: always()
        env:
          RESEND_ID: ${{ steps.send.outputs.resend_id }}
        run: |
          {
            echo "### LMS Credential Reset — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Cloudflare Worker secrets (winnerdata-lms): rotated"
            echo "- GitHub Actions repo secrets (LMS_AUTH_USER/LMS_AUTH_PASS): rotated"
            echo "- Supabase vault (lms_auth_user/lms_auth_pass): rotated"
            echo "- OLD credentials verified 401, NEW credentials verified 200"
            echo "- Reset email sent to everestcapital8@gmail.com (Resend id: ${RESEND_ID:-unknown})"
            echo ""
            echo "No credential value appears in this log or summary."
          } >> "$GITHUB_STEP_SUMMARY"
