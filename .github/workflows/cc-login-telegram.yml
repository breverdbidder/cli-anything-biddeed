name: CC Login → Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get login URL and send to Telegram
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Getting CC login URL ==="
          LOGIN_OUTPUT=$($SSH "timeout 10 claude /login 2>&1 || true")
          echo "$LOGIN_OUTPUT"
          
          URL=$(echo "$LOGIN_OUTPUT" | grep -oP 'https://[^\s]+' | head -1)
          
          if [ -n "$URL" ]; then
            echo "Found URL: $URL"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d text="🔐 *Claude Code Login Required*%0A%0ATap this link to authenticate CC on Hetzner:%0A${URL}%0A%0AAfter you tap, CC will auto-pick up the token. Then I'll re-fire SUMMIT #263."
            echo "Sent to Telegram!"
          else
            echo "No URL found. Trying alternative..."
            ALT_OUTPUT=$($SSH "timeout 10 claude login 2>&1 || true")
            echo "$ALT_OUTPUT"
            ALT_URL=$(echo "$ALT_OUTPUT" | grep -oP 'https://[^\s]+' | head -1)
            if [ -n "$ALT_URL" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d parse_mode="Markdown" \
                -d text="🔐 *Claude Code Login*%0A%0ATap: ${ALT_URL}"
              echo "Sent alt URL to Telegram!"
            else
              echo "FULL OUTPUT:"
              echo "$LOGIN_OUTPUT"
              echo "---"
              echo "$ALT_OUTPUT"
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d text="⚠️ CC login on Hetzner needs manual SSH: ssh root@${HETZNER_IP} then run: claude /login"
            fi
          fi
