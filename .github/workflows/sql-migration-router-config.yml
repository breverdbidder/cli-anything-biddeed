name: SQL Migration - Create Router Config
on: 
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  create_config:
    if: contains(github.event.issue.labels.*.name, 'infrastructure') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DB_HOST: db.mocerqjnksmhcjzxrewo.supabase.co
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DB_NAME: postgres
      
    steps:
      - name: Install PostgreSQL client
        run: |
          apt-get update -qq
          apt-get install -y postgresql-client > /dev/null 2>&1
          
      - name: Create certify_router_config table
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" << 'SQL'
          CREATE TABLE IF NOT EXISTS public.certify_router_config (
            id BIGSERIAL PRIMARY KEY,
            router_name VARCHAR(100) NOT NULL DEFAULT 'primary',
            max_concurrent_counties INTEGER DEFAULT 10,
            retry_attempts INTEGER DEFAULT 3,
            enable_shadow_audit BOOLEAN DEFAULT true,
            certification_criteria JSONB DEFAULT '{"consecutive_gold_min": 10}',
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW(),
            UNIQUE(router_name)
          );
          INSERT INTO public.certify_router_config (router_name)
          VALUES ('primary') ON CONFLICT DO NOTHING;
          SELECT 'SUCCESS' as result;
SQL
          
      - name: Verify table exists
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -c "
          SELECT table_name FROM information_schema.tables 
          WHERE table_schema='public' AND table_name='certify_router_config';
          " && echo "✅ Table verified"
