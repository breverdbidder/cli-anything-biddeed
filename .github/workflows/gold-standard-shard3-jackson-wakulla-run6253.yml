name: "Gold Standard SHARD-3 Jackson+Wakulla (run 6253)"

# dispatch_id: da3fde1c-5c12-4786-bbda-4ea2708ee2e1
# issue: breverdbidder/cli-anything-biddeed#13866
# Targets: jackson I (83.6%->95%), wakulla E/I/B/F
# Ship-to-main mandate — no PRs, direct commits

on:
  workflow_dispatch:
  schedule:
    # Daily 16:05 UTC — aligns with afternoon wave
    - cron: '5 16 * * *'

concurrency:
  group: gold-standard-shard3-jackson-wakulla
  cancel-in-progress: false

jobs:
  jackson-i-wakulla-ei:
    name: "Jackson I + Wakulla E/I fix"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests pypdf

      - name: "Apply migration via Management API"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error
          from pathlib import Path

          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          URL = "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          sql = Path("migrations/20260724_gold_standard_shard3_jackson_i_wakulla_ei_run6253.sql").read_text()
          print(f"Applying migration ({len(sql)} chars)...")

          body = json.dumps({"query": sql}).encode()
          req = urllib.request.Request(URL, data=body, headers=H, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              print(f"Migration OK: {str(result)[:300]}")
          except urllib.error.HTTPError as e:
              err = e.read().decode()
              print(f"Migration error {e.code}: {err[:500]}")
              raise SystemExit(1)
          PYEOF

      - name: "Run jackson I + wakulla E/I script"
        run: python3 scripts/shard3_jackson_i_wakulla_ei_run6253.py

      - name: "Evaluate jackson + wakulla"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          KEY = os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or os.environ.get("SUPABASE_KEY")
          BASE = f"{SB}/rest/v1"
          H = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          print("### SQL VERIFICATION — SHARD-3 jackson + wakulla (run 6253)")
          for county in ("jackson", "wakulla"):
              req = urllib.request.Request(
                  f"{BASE}/rpc/pencil_dod_evaluate_county",
                  data=json.dumps({"p_county": county}).encode(),
                  headers=H, method="POST"
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  ev = json.loads(r.read())
              passes = sum(1 for l in "ABCDEFGHIJ"
                           if isinstance(ev.get(l), dict) and ev[l].get("pass"))
              fails = [l for l in "ABCDEFGHIJ"
                       if isinstance(ev.get(l), dict) and not ev[l].get("pass")]
              print(f"  {county}: {passes}/10  FAIL={fails}")
              for l in "ABCDEFGHIJ":
                  d = ev.get(l, {}) or {}
                  print(f"    {l}: pass={d.get('pass')} metric={d.get('metric')} {d.get('detail','')}")
              print()
          PYEOF

  wakulla-bf:
    name: "Wakulla B+F outcomes scraper"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: jackson-i-wakulla-ei
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests pypdf

      - name: "Scrape wakulla clerk for B+F outcomes"
        run: |
          EXIT=0
          python3 scripts/shard3_wakulla_bf_run6253.py || EXIT=$?
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "2" ]; then
            echo "wakulla_bf exit=$EXIT" >> "$GITHUB_STEP_SUMMARY"
            exit "$EXIT"
          fi

  final-evaluation:
    name: "Final evaluation + scoreboard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [jackson-i-wakulla-ei, wakulla-bf]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Final evaluations + ultraloop verification"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          KEY = os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or os.environ.get("SUPABASE_KEY")
          BASE = f"{SB}/rest/v1"
          H = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          print("### SQL VERIFICATION — SHARD-3 Final (dispatch da3fde1c)")
          results = {}
          for county in ("jackson", "wakulla"):
              req = urllib.request.Request(
                  f"{BASE}/rpc/pencil_dod_evaluate_county",
                  data=json.dumps({"p_county": county}).encode(),
                  headers=H, method="POST"
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  ev = json.loads(r.read())
              passes = sum(1 for l in "ABCDEFGHIJ"
                           if isinstance(ev.get(l), dict) and ev[l].get("pass"))
              fails = [l for l in "ABCDEFGHIJ"
                       if isinstance(ev.get(l), dict) and not ev[l].get("pass")]
              results[county] = {"passes": passes, "ev": ev}
              print(f"  {county}: {passes}/10  FAIL={fails}")
              print(f"  JSON: {json.dumps(ev, default=str)}")
              print()

          # Check ultraloop audit rows
          audit_req = urllib.request.Request(
              f"{BASE}/gold_standard_ultraloop_audit"
              "?dispatch_id=eq.da3fde1c-5c12-4786-bbda-4ea2708ee2e1"
              "&select=county_slug,letter,survived,claim&order=id.desc&limit=20",
              headers=H
          )
          with urllib.request.urlopen(audit_req, timeout=15) as r:
              audit_rows = json.loads(r.read())
          print("Ultraloop audit rows:")
          for row in audit_rows:
              survived = "SURVIVED" if row.get("survived") else "REFUTED"
              print(f"  {row['county_slug']} {row['letter']}: {survived} — {row['claim'][:80]}")

          # Summary
          print()
          print("=== FINAL SUMMARY ===")
          for county, data in results.items():
              print(f"  {county}: {data['passes']}/10")
          PYEOF

        continue-on-error: true
