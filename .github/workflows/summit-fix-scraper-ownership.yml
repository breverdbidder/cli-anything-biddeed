name: Summit fix — chown /opt/biddeed scraper dirs to summit user
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: SSH chown
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: current state of /opt/biddeed/* ==="
          $SSH "ls -la /opt/biddeed/ 2>&1 | head -30"

          echo
          echo "=== B: brevard-bidder-scraper current ownership ==="
          $SSH "ls -la /opt/biddeed/brevard-bidder-scraper/ 2>&1 | head -10"
          $SSH "stat -c '%U:%G %n' /opt/biddeed/brevard-bidder-scraper/.git 2>&1"

          echo
          echo "=== C: ensure summit user exists ==="
          $SSH "id summit 2>&1 || useradd -m -s /bin/bash summit"

          echo
          echo "=== D: chown brevard-bidder-scraper recursively to summit ==="
          $SSH "chown -R summit:summit /opt/biddeed/brevard-bidder-scraper"
          $SSH "echo exit=\$?"

          echo
          echo "=== E: verify new ownership ==="
          $SSH "ls -la /opt/biddeed/brevard-bidder-scraper/ 2>&1 | head -5"
          $SSH "stat -c '%U:%G %n' /opt/biddeed/brevard-bidder-scraper/.git 2>&1"

          echo
          echo "=== F: test git pull as summit user ==="
          $SSH "sudo -u summit bash -c 'cd /opt/biddeed/brevard-bidder-scraper && git status 2>&1 | head -5'"

          echo "=== END ==="
