name: "SUMMIT: Ultraplan Dispatch"

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task description for Ultraplan (or use issue_number)'
        required: false
        type: string
        default: ''
      issue_number:
        description: 'GitHub Issue number (alternative to task text)'
        required: false
        type: string
        default: ''
      repo:
        description: 'Target repo under breverdbidder/'
        required: false
        type: choice
        options:
          - cli-anything-biddeed
          - zonewise-web
          - zonewise-superpowers
          - zonewise-video
          - brevard-bidder-scraper
        default: 'cli-anything-biddeed'
      timeout_minutes:
        description: 'Max wait for ultraplan completion (minutes)'
        required: false
        default: '40'
        type: string

env:
  HETZNER_HOST: 87.99.129.125

jobs:
  ultraplan:
    name: "🏔️⚡ Ultraplan: ${{ inputs.task || format('Issue #{0}', inputs.issue_number) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.task }}" ] && [ -z "${{ inputs.issue_number }}" ]; then
            echo "❌ Must provide either task or issue_number"
            exit 1
          fi
          echo "✅ Inputs validated"

      - name: "1️⃣ Deploy ultraplan-runner to Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            REPO_PATH="/opt/biddeed/${{ inputs.repo }}"

            # Ensure repo exists
            mkdir -p /opt/biddeed
            if [ ! -d "$REPO_PATH/.git" ]; then
              echo "📥 Cloning ${{ inputs.repo }}..."
              git clone "https://x-access-token:${{ secrets.GH_PAT }}@github.com/breverdbidder/${{ inputs.repo }}.git" "$REPO_PATH"
            fi

            cd "$REPO_PATH"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -1

            # Verify prereqs
            command -v claude &>/dev/null || { echo "❌ Claude Code missing"; exit 1; }
            command -v tmux &>/dev/null || apt-get install -y tmux
            python3 -c "import ssl" || { echo "❌ Python3 missing"; exit 1; }

            echo "✅ Preflight complete: $(claude --version 2>/dev/null || echo 'unknown')"

      - name: "2️⃣ Upload runner script"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: |
            cat > /opt/biddeed/ultraplan-runner.py << 'PYEOF'
            #!/usr/bin/env python3
            """Ultraplan Runner — interactive CC + /ultraplan via tmux pseudo-TTY."""
            import subprocess, sys, os, time, json, urllib.request, ssl

            REPO_PATH = os.environ.get("REPO_PATH", "/opt/biddeed/cli-anything-biddeed")
            GH_PAT = os.environ.get("GH_PAT", "")
            TG_TOKEN = os.environ.get("TG_TOKEN", "")
            TG_CHAT = os.environ.get("TG_CHAT", "")
            TIMEOUT = int(os.environ.get("ULTRAPLAN_TIMEOUT", "2400"))

            def telegram(msg):
                if not TG_TOKEN or not TG_CHAT:
                    return
                try:
                    data = json.dumps({"chat_id": TG_CHAT, "text": msg, "parse_mode": "HTML"}).encode()
                    req = urllib.request.Request(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                        data=data, headers={"Content-Type": "application/json"})
                    urllib.request.urlopen(req, context=ssl.create_default_context(), timeout=10)
                except Exception as e:
                    print(f"[TG error] {e}")

            def fetch_issue(num):
                repo = os.path.basename(REPO_PATH)
                url = f"https://api.github.com/repos/breverdbidder/{repo}/issues/{num}"
                req = urllib.request.Request(url, headers={
                    "Authorization": f"token {GH_PAT}", "Accept": "application/vnd.github.v3+json"})
                resp = urllib.request.urlopen(req, context=ssl.create_default_context(), timeout=15)
                d = json.loads(resp.read())
                return f"{d.get('title','')}\n\n{d.get('body','')}"

            def run_ultraplan(task):
                os.chdir(REPO_PATH)
                subprocess.run(["git", "fetch", "origin", "main"], capture_output=True)
                subprocess.run(["git", "reset", "--hard", "origin/main"], capture_output=True)

                safe = task.replace("'", "'\\''").replace("\n", " ")[:2000]
                telegram(f"🏔️⚡ <b>ULTRAPLAN START</b>\n📋 {safe[:200]}")

                # Kill any existing session
                subprocess.run(["tmux", "kill-session", "-t", "ultraplan"], capture_output=True)

                # Start tmux + claude
                subprocess.run(["tmux", "new-session", "-d", "-s", "ultraplan", "-x", "200", "-y", "50"])
                subprocess.run(["tmux", "send-keys", "-t", "ultraplan",
                    f"cd {REPO_PATH} && claude --dangerously-skip-permissions", "Enter"])
                time.sleep(10)

                # Send ultraplan command
                subprocess.run(["tmux", "send-keys", "-t", "ultraplan", f"/ultraplan {safe}", "Enter"])
                time.sleep(5)

                # Accept confirmation
                subprocess.run(["tmux", "send-keys", "-t", "ultraplan", "y", "Enter"])

                # Poll for completion
                url_found = ""
                status = "timeout"
                elapsed = 0
                poll = 30

                while elapsed < TIMEOUT:
                    time.sleep(poll)
                    elapsed += poll

                    pane = subprocess.run(["tmux", "capture-pane", "-t", "ultraplan", "-p"],
                        capture_output=True, text=True).stdout

                    # Check for URL
                    import re
                    urls = re.findall(r'https://claude\.ai/code/\S+', pane)
                    if urls and not url_found:
                        url_found = urls[0]
                        telegram(f"🔗 <b>ULTRAPLAN SESSION</b>\n{url_found}")

                    if "ultraplan ready" in pane or "pull request" in pane:
                        status = "complete"
                        break
                    if "error" in pane.lower() and "ultraplan" in pane.lower():
                        status = "error"
                        break

                    print(f"POLL: {elapsed}s / {TIMEOUT}s", flush=True)

                subprocess.run(["tmux", "kill-session", "-t", "ultraplan"], capture_output=True)

                emoji = {"complete":"✅","error":"❌","timeout":"⏰"}.get(status,"❓")
                telegram(f"{emoji} <b>ULTRAPLAN {status.upper()}</b>\n📋 {safe[:150]}\n{'🔗 '+url_found if url_found else ''}")
                return status

            if __name__ == "__main__":
                import argparse
                p = argparse.ArgumentParser()
                p.add_argument("task", nargs="?", default="")
                p.add_argument("--issue", "-i", default="")
                a = p.parse_args()
                task = fetch_issue(a.issue) if a.issue else a.task
                if not task:
                    print("Need task or --issue"); sys.exit(1)
                s = run_ultraplan(task)
                sys.exit(0 if s == "complete" else 1)
            PYEOF
            chmod +x /opt/biddeed/ultraplan-runner.py
            echo "✅ Runner uploaded"

      - name: "3️⃣ Execute Ultraplan"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 50m
          script: |
            set -e
            export REPO_PATH="/opt/biddeed/${{ inputs.repo }}"
            export GH_PAT="${{ secrets.GH_PAT }}"
            export TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
            export TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
            export ULTRAPLAN_TIMEOUT=$(( ${{ inputs.timeout_minutes }} * 60 ))

            TASK="${{ inputs.task }}"
            ISSUE="${{ inputs.issue_number }}"

            cd "$REPO_PATH"

            if [ -n "$ISSUE" ]; then
              python3 /opt/biddeed/ultraplan-runner.py --issue "$ISSUE"
            else
              python3 /opt/biddeed/ultraplan-runner.py "$TASK"
            fi

      - name: "4️⃣ Notify completion"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          TASK="${{ inputs.task || format('Issue #{0}', inputs.issue_number) }}"
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=🏔️⚡ <b>SUMMIT Ultraplan ${STATUS}</b>%0A📋 ${TASK:0:200}" \
            >/dev/null 2>&1 || true
