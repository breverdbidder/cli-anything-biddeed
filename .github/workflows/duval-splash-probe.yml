name: "Duval splash page probe"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet httpx
      - name: Probe Duval splash page
        env:
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import httpx, re, os
          HOST = "https://duval.realforeclose.com"
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          client = httpx.Client(follow_redirects=True, timeout=30.0, headers={'User-Agent': UA})

          print("=== 1. GET /index.cfm (splash page) ===")
          r0 = client.get(f"{HOST}/index.cfm")
          print(f"Status: {r0.status_code}, URL: {r0.url}")
          print(f"Cookies: {list(client.cookies.keys())}")
          print(f"FULL HTML (first 5000 chars):\n{r0.text[:5000]}")

          print("\n=== 2. GET PREVIEW directly (no auth) ===")
          r1 = client.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE=06%2F24%2F2026")
          print(f"Status: {r1.status_code}, URL: {r1.url}, len={len(r1.text)}")
          print(f"Has AITEM: {'AITEM_' in r1.text}, Has LogName: {'LogName' in r1.text}")
          print(f"First 2000 chars:\n{r1.text[:2000]}")

          print("\n=== 3. Try zaction=TERMS accept ===")
          r2 = client.get(f"{HOST}/index.cfm?zaction=TERMS&Zmethod=ACCEPT")
          print(f"Status: {r2.status_code}, URL: {r2.url}")
          print(f"Has LogName: {'LogName' in r2.text}, first 1000: {r2.text[:1000]!r}")

          print("\n=== 4. Try CALENDAR after splash ===")
          r3 = client.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=CALENDAR")
          print(f"Status: {r3.status_code}, URL: {r3.url}")
          print(f"Has LogName: {'LogName' in r3.text}, first 1000: {r3.text[:1000]!r}")
          PYEOF
