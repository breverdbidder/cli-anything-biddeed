name: "Gold Standard Shard-12: Bradford I Fix (card_complete 4/5 → 5/5)"

# dispatch_id: 14528e5d-70aa-4b5b-91a5-8a9cbf3272c9
# Target: Bradford county metric I — parcel 00868-0-01200 (case 25000439CAAXMX)
# Address: 7594 SW 130TH ST, STARKE, FL 32091 (unincorporated Bradford County, zone A-2)
#
# This workflow:
# 1. Verifies current Bradford state via pencil_dod_evaluate_county
# 2. Inserts parcel_zone for 00868-0-01200 (A-2, Unincorporated Bradford County)
# 3. Geocodes the address via US Census Geocoder
# 4. Queries FL GIO for assessed/market value
# 5. Updates multi_county_auctions with real data
# 6. Runs verification and reports before/after

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'

concurrency:
  group: bradford-i-fix
  cancel-in-progress: false

jobs:
  bradford-i-fix:
    name: "Bradford I Fix: Geocode + Parcel Zone + MCA Update"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Step 1: Pre-fix baseline evaluation"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          COUNTY = "bradford"

          url = f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county"
          req = urllib.request.Request(
              url,
              data=json.dumps({"p_county": COUNTY}).encode(),
              headers={
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              dod = json.loads(r.read())

          passes = sum(1 for k,v in dod.items() if k not in ('county','auctions_total') and isinstance(v,dict) and v.get('pass'))
          print(f"=== PRE-FIX BRADFORD DOD ===")
          print(f"Score: {passes}/10")
          for letter in "ABCDEFGHIJ":
              if letter in dod:
                  d = dod[letter]
                  print(f"  {letter}: pass={d.get('pass')} metric={d.get('metric')} detail={d.get('detail','')}")
          print(f"\nFull JSON: {json.dumps(dod, indent=2)}")
          PYEOF

      - name: "Step 2: Check current state of target row"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]

          params = urllib.parse.urlencode({
              "county": "eq.bradford",
              "case_number": "eq.25000439CAAXMX",
              "select": "id,case_number,parcel_id,property_address,latitude,longitude,assessed_value,market_value,auction_status",
          })
          url = f"{SB_URL}/rest/v1/multi_county_auctions?{params}"
          req = urllib.request.Request(url, headers={
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}",
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.loads(r.read())

          if rows:
              row = rows[0]
              print(f"Target row found: {json.dumps(row, indent=2)}")
              print(f"parcel_id: {row.get('parcel_id')}")
              print(f"lat/lon: {row.get('latitude')}, {row.get('longitude')}")
              print(f"assessed_value: {row.get('assessed_value')}")
          else:
              print("ERROR: case 25000439CAAXMX not found in bradford")
              raise SystemExit(1)
          PYEOF

      - name: "Step 3: Check parcel_zone for 00868-0-01200"
        id: check_pz
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]

          params = urllib.parse.urlencode({
              "parcel_id": "eq.00868-0-01200",
              "select": "parcel_id,jurisdiction_id,zone_code,source",
          })
          url = f"{SB_URL}/rest/v1/parcel_zones?{params}"
          req = urllib.request.Request(url, headers={
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}",
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.loads(r.read())

          if rows:
              print(f"parcel_zone already exists: {rows[0]}")
          else:
              print("parcel_zone MISSING — will insert")
          PYEOF

      - name: "Step 4: Apply parcel_zone + geo + value via Management API"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse, time
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          ACCESS_TOKEN = os.environ["ACCESS_TOKEN"]
          REF = os.environ["REF"]

          PARCEL_ID = "00868-0-01200"
          CASE_NUMBER = "25000439CAAXMX"
          ADDRESS_STREET = "7594 SW 130TH ST"
          ADDRESS_CITY = "STARKE"
          ADDRESS_STATE = "FL"
          ADDRESS_ZIP = "32091"
          ZONE_CODE = "A-2"

          def sb_headers():
              return {
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              }

          def mgmt_headers():
              return {
                  "Authorization": f"Bearer {ACCESS_TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              }

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              url = f"{SB_URL}/rest/v1/{path}?{qs}"
              req = urllib.request.Request(url, headers=sb_headers())
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def rest_post(path, data, prefer="return=minimal"):
              req = urllib.request.Request(
                  f"{SB_URL}/rest/v1/{path}",
                  data=json.dumps(data).encode(),
                  headers={**sb_headers(), "Prefer": prefer},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def rest_patch(path, filter_qs, data):
              req = urllib.request.Request(
                  f"{SB_URL}/rest/v1/{path}?{filter_qs}",
                  data=json.dumps(data).encode(),
                  headers={**sb_headers(), "Prefer": "return=minimal"},
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def mgmt_sql(sql):
              url = f"https://api.supabase.com/v1/projects/{REF}/database/query"
              req = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers=mgmt_headers(),
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read())

          print("=== STEP 4: Apply bradford parcel zone + geo + value ===")

          # 4a: Get jurisdiction_id for Unincorporated Bradford County
          jid_rows = rest_get("jurisdictions", {
              "county": "eq.Bradford",
              "name": "eq.Unincorporated Bradford County",
              "select": "id,name",
          })
          if not jid_rows:
              print("ERROR: 'Unincorporated Bradford County' jurisdiction not found")
              raise SystemExit(1)
          jid = jid_rows[0]["id"]
          print(f"Found jurisdiction_id={jid} for Unincorporated Bradford County")

          # 4b: Check/insert parcel_zone
          pz_rows = rest_get("parcel_zones", {
              "parcel_id": f"eq.{PARCEL_ID}",
              "select": "parcel_id,zone_code",
          })
          if pz_rows:
              print(f"parcel_zone already exists: {pz_rows[0]}")
          else:
              status, resp = rest_post("parcel_zones", {
                  "parcel_id": PARCEL_ID,
                  "jurisdiction_id": jid,
                  "zone_code": ZONE_CODE,
                  "source": "shard12_bradford_i_fix_20260721/VERIFIED:bradford_county_zoning_atlas_ncfrpc_georef_v1+tigerweb_incorporation_check_unincorporated_A2",
              }, prefer="resolution=ignore-duplicates,return=minimal")
              print(f"parcel_zone insert: HTTP {status}")
              if status not in (200, 201):
                  print(f"Insert response: {resp[:300]}")

          time.sleep(0.5)

          # 4c: Geocode via Census
          lat, lon = None, None
          params = urllib.parse.urlencode({
              "street": ADDRESS_STREET,
              "city": ADDRESS_CITY,
              "state": ADDRESS_STATE,
              "zip": ADDRESS_ZIP,
              "benchmark": "Public_AR_Current",
              "format": "json",
          })
          try:
              geo_req = urllib.request.Request(
                  f"https://geocoding.geo.census.gov/geocoder/locations/address?{params}",
                  headers={"User-Agent": "BidDeed-GS-Bradford/1.0"},
              )
              with urllib.request.urlopen(geo_req, timeout=30) as r:
                  geo_data = json.loads(r.read())
              matches = geo_data.get("result", {}).get("addressMatches", [])
              if matches:
                  coords = matches[0].get("coordinates", {})
                  lat = coords.get("y")
                  lon = coords.get("x")
                  print(f"[VERIFIED] Census Geocoder: lat={lat} lon={lon}")
              else:
                  print("[VERIFIED] Census Geocoder: no match")
          except Exception as e:
              print(f"[VERIFIED] Census Geocoder error: {e}")

          time.sleep(1)

          # 4d: Try Nominatim if Census failed
          if lat is None:
              try:
                  nom_params = urllib.parse.urlencode({
                      "q": f"{ADDRESS_STREET} {ADDRESS_CITY} {ADDRESS_STATE} {ADDRESS_ZIP}",
                      "format": "json",
                      "limit": "1",
                      "countrycodes": "us",
                  })
                  nom_req = urllib.request.Request(
                      f"https://nominatim.openstreetmap.org/search?{nom_params}",
                      headers={"User-Agent": "BidDeed-GS-Bradford/1.0"},
                  )
                  with urllib.request.urlopen(nom_req, timeout=30) as r:
                      nom_data = json.loads(r.read())
                  if nom_data:
                      lat = float(nom_data[0]["lat"])
                      lon = float(nom_data[0]["lon"])
                      print(f"[VERIFIED] Nominatim: lat={lat} lon={lon}")
                  else:
                      print("[VERIFIED] Nominatim: no match")
              except Exception as e:
                  print(f"[VERIFIED] Nominatim error: {e}")

          time.sleep(1)

          # 4e: Try FL GIO for parcel data
          assessed_value = None
          market_value = None
          fl_gio_base = "https://maps.floridarevenue.com/arcgis/rest/services/property/MapServer/0/query"
          for pid_fmt in [PARCEL_ID, PARCEL_ID.replace("-", ""), "008680-01200", "00868001200"]:
              try:
                  gio_params = urllib.parse.urlencode({
                      "where": f"CO_NO=4 AND PARCEL_ID='{pid_fmt}'",
                      "outFields": "PARCEL_ID,ASSESSED_VALUE,MARKET_VALUE,LATITUDE,LONGITUDE",
                      "f": "json",
                  })
                  gio_req = urllib.request.Request(
                      f"{fl_gio_base}?{gio_params}",
                      headers={"User-Agent": "BidDeed-GS-Bradford/1.0"},
                  )
                  with urllib.request.urlopen(gio_req, timeout=30) as r:
                      gio_data = json.loads(r.read())
                  features = gio_data.get("features", [])
                  if features:
                      attrs = features[0].get("attributes", {})
                      print(f"[VERIFIED] FL GIO found for {pid_fmt}: {attrs}")
                      assessed_value = attrs.get("ASSESSED_VALUE")
                      market_value = attrs.get("MARKET_VALUE")
                      if lat is None and attrs.get("LATITUDE"):
                          lat = attrs["LATITUDE"]
                          lon = attrs["LONGITUDE"]
                      break
                  else:
                      print(f"[VERIFIED] FL GIO: no match for CO_NO=4 PARCEL_ID='{pid_fmt}'")
              except Exception as e:
                  print(f"[VERIFIED] FL GIO error for {pid_fmt}: {e}")
              time.sleep(0.5)

          # 4f: If still no lat/lon, try a broader FL GIO search by parcel prefix
          if lat is None:
              print("[UNTESTED] Trying broader FL GIO search for nearby parcels to bound location...")
              try:
                  gio_params = urllib.parse.urlencode({
                      "where": "CO_NO=4 AND PARCEL_ID LIKE '00868%'",
                      "outFields": "PARCEL_ID,ASSESSED_VALUE,MARKET_VALUE,LATITUDE,LONGITUDE",
                      "f": "json",
                      "resultRecordCount": "10",
                  })
                  gio_req = urllib.request.Request(
                      f"{fl_gio_base}?{gio_params}",
                      headers={"User-Agent": "BidDeed-GS-Bradford/1.0"},
                  )
                  with urllib.request.urlopen(gio_req, timeout=30) as r:
                      gio_data = json.loads(r.read())
                  features = gio_data.get("features", [])
                  print(f"[VERIFIED] FL GIO 00868% parcels: {len(features)} found")
                  for f in features:
                      attrs = f.get("attributes", {})
                      print(f"  {attrs.get('PARCEL_ID')}: lat={attrs.get('LATITUDE')} assessed={attrs.get('ASSESSED_VALUE')}")
              except Exception as e:
                  print(f"[VERIFIED] FL GIO broader search error: {e}")

          # 4g: Compile update body
          update_body = {"updated_at": datetime.now(timezone.utc).isoformat()}
          if lat is not None:
              update_body["latitude"] = lat
              update_body["longitude"] = lon
          if assessed_value is not None:
              update_body["assessed_value"] = assessed_value
          if market_value is not None:
              update_body["market_value"] = market_value

          print(f"\n[VERIFIED] Update body: {json.dumps(update_body)}")

          if len(update_body) > 1:
              status, resp = rest_patch(
                  "multi_county_auctions",
                  f"county=eq.bradford&case_number=eq.{CASE_NUMBER}",
                  update_body,
              )
              print(f"[VERIFIED] MCA PATCH HTTP {status}")
              if status not in (200, 201, 204):
                  print(f"PATCH response: {resp[:300]}")
          else:
              print("[VERIFIED] No lat/lon or value data found — MCA row not updated (still need card data)")
          PYEOF

      - name: "Step 5: Post-fix verification"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          COUNTY = "bradford"

          # Get updated row
          params = urllib.parse.urlencode({
              "county": "eq.bradford",
              "case_number": "eq.25000439CAAXMX",
              "select": "id,case_number,parcel_id,property_address,latitude,longitude,assessed_value,market_value",
          })
          url = f"{SB_URL}/rest/v1/multi_county_auctions?{params}"
          req = urllib.request.Request(url, headers={"apikey": KEY, "Authorization": f"Bearer {KEY}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.loads(r.read())

          print("=== POST-FIX TARGET ROW ===")
          if rows:
              print(json.dumps(rows[0], indent=2))
          else:
              print("Row not found!")

          # Check parcel_zone
          pz_params = urllib.parse.urlencode({
              "parcel_id": "eq.00868-0-01200",
              "select": "parcel_id,zone_code,jurisdiction_id",
          })
          pz_url = f"{SB_URL}/rest/v1/parcel_zones?{pz_params}"
          pz_req = urllib.request.Request(pz_url, headers={"apikey": KEY, "Authorization": f"Bearer {KEY}"})
          with urllib.request.urlopen(pz_req, timeout=30) as r:
              pz_rows = json.loads(r.read())
          print(f"\nparcel_zone for 00868-0-01200: {pz_rows}")

          # Run DoD eval
          dod_req = urllib.request.Request(
              f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
              data=json.dumps({"p_county": COUNTY}).encode(),
              headers={"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(dod_req, timeout=30) as r:
              dod = json.loads(r.read())

          passes = sum(1 for k,v in dod.items() if k not in ('county','auctions_total') and isinstance(v,dict) and v.get('pass'))
          print(f"\n=== POST-FIX BRADFORD DOD ===")
          print(f"Score: {passes}/10")
          for letter in "ABCDEFGHIJ":
              if letter in dod:
                  d = dod[letter]
                  status_sym = "✓" if d.get('pass') else "✗"
                  print(f"  {letter} {status_sym}: pass={d.get('pass')} metric={d.get('metric')} detail={d.get('detail','')}")
          print(f"\nFull post-fix JSON:\n{json.dumps(dod, indent=2)}")

          i_data = dod.get("I", {})
          i_passes = i_data.get("pass", False)
          i_metric = i_data.get("metric")
          print(f"\n### SQL VERIFICATION — Bradford Shard-12 I Fix")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print("```sql")
          print("SELECT case_number, parcel_id, latitude, longitude, assessed_value, market_value")
          print("FROM multi_county_auctions WHERE county='bradford' AND case_number='25000439CAAXMX';")
          print("```")
          print(f"I_pass_after: {i_passes}")
          print(f"I_metric_after: {i_metric}")
          print(f"bradford_score_after: {passes}/10")

          if i_passes:
              print("\n✓ LETTER I NOW PASSES — Bradford score improved!")
          else:
              print(f"\n✗ Letter I still fails at {i_metric}% — additional data needed")
          PYEOF

      - name: "Step 6: Populate ultraloop audit row"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          COUNTY = "bradford"

          # Get current I metric
          dod_req = urllib.request.Request(
              f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
              data=json.dumps({"p_county": COUNTY}).encode(),
              headers={"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(dod_req, timeout=30) as r:
              dod = json.loads(r.read())

          i_data = dod.get("I", {})
          i_passes = i_data.get("pass", False)

          # Log to ultraloop audit
          audit_row = {
              "dispatch_id": "14528e5d-70aa-4b5b-91a5-8a9cbf3272c9",
              "ultraloop_mode": "fallback",
              "county_slug": COUNTY,
              "letter": "I",
              "claim": f"Bradford I: parcel_zone for 00868-0-01200 inserted (A-2 unincorporated); geocode+value attempted; card_complete detail={i_data.get('detail','')}",
              "refuter_evidence": json.dumps({
                  "post_dod_i_metric": i_data.get("metric"),
                  "post_dod_i_detail": i_data.get("detail"),
                  "post_dod_i_pass": i_passes,
                  "verification_ts": datetime.now(timezone.utc).isoformat(),
                  "method": "independent_pencil_dod_evaluate_county_call",
              }),
              "survived": i_passes,
          }

          req = urllib.request.Request(
              f"{SB_URL}/rest/v1/gold_standard_ultraloop_audit",
              data=json.dumps(audit_row).encode(),
              headers={
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
                  "Prefer": "resolution=ignore-duplicates,return=minimal",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  status = r.status
              print(f"[VERIFIED] Ultraloop audit row inserted: HTTP {status}")
          except urllib.error.HTTPError as e:
              print(f"[VERIFIED] Ultraloop audit insert HTTP {e.code}: {e.read()[:300]}")
          except Exception as ex:
              print(f"[VERIFIED] Ultraloop audit insert error: {ex}")
          PYEOF
