# .github/workflows/repo-forensics.yml
# Repo Forensics v1 - Security gate for AI agent ecosystem
# Deploy to: ALL repos via Summit dispatch
# Docs: https://github.com/alexgreensh/repo-forensics

name: Repo Forensics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - skill-scan
      update-iocs:
        description: 'Pull latest IOC database'
        required: false
        default: true
        type: boolean

concurrency:
  group: forensics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20  # git_forensics needs commit history

      - name: Run Repo Forensics
        id: forensics
        uses: alexgreensh/repo-forensics@v1
        with:
          mode: ${{ inputs.mode || 'full' }}
          format: text
          update-iocs: ${{ inputs.update-iocs || 'true' }}
        continue-on-error: true

      - name: JSON Report (artifact)
        if: always()
        run: |
          # Re-run with JSON output for archival
          git clone --depth 1 https://github.com/alexgreensh/repo-forensics.git /tmp/repo-forensics
          bash /tmp/repo-forensics/skill/scripts/run_forensics.sh "${{ github.workspace }}" \
            --format json ${{ inputs.mode == 'skill-scan' && '--skill-scan' || '' }} \
            > forensics-report.json 2>&1 || true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensics-report-${{ github.sha }}
          path: forensics-report.json
          retention-days: 30

      - name: PR Comment (on findings)
        if: always() && github.event_name == 'pull_request' && steps.forensics.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('forensics-report.json', 'utf8').slice(0, 4000);
            } catch { report = 'Report generation failed'; }

            const exitCode = '${{ steps.forensics.outputs.exit-code }}';
            const icon = exitCode === '2' ? '🚨' : '⚠️';
            const severity = exitCode === '2' ? 'CRITICAL' : 'HIGH/MEDIUM';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} **Repo Forensics: ${severity} findings**\n\nExit code: ${exitCode}\n\n<details>\n<summary>Scan Results</summary>\n\n\`\`\`\n${report}\n\`\`\`\n</details>\n\n[View full report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

      - name: Gate Decision
        if: always()
        run: |
          EXIT_CODE="${{ steps.forensics.outputs.exit-code }}"
          if [ "$EXIT_CODE" = "2" ]; then
            echo "::error::BLOCKED: Critical security findings detected"
            exit 2
          elif [ "$EXIT_CODE" = "1" ]; then
            echo "::warning::WARN: High/medium findings detected - review recommended"
            # Don't block on high/medium, just warn
            exit 0
          else
            echo "✅ Clean scan"
            exit 0
          fi
