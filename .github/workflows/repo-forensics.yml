# .github/workflows/repo-forensics.yml
# Repo Forensics v1 - Security gate for AI agent ecosystem
# Pinned to exact commit SHA (no tags available yet)
name: Repo Forensics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - skill-scan
      update-iocs:
        description: 'Pull latest IOC database'
        required: false
        default: true
        type: boolean

concurrency:
  group: forensics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone repo-forensics (pinned)
        run: |
          git clone --depth 1 https://github.com/alexgreensh/repo-forensics.git /tmp/repo-forensics
          cd /tmp/repo-forensics
          # Pin to known-good commit
          git fetch --depth 1 origin 1b2ebde1750be74d29d974ae6c4e9a71d7b5f37a
          git checkout 1b2ebde1750be74d29d974ae6c4e9a71d7b5f37a

      - name: Run Forensics Scan
        id: forensics
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          ARGS=""
          if [ "$MODE" = "skill-scan" ]; then
            ARGS="--skill-scan"
          fi
          if [ "${{ inputs.update-iocs }}" = "true" ]; then
            ARGS="$ARGS --update-iocs"
          fi

          set +e
          bash /tmp/repo-forensics/skill/scripts/run_forensics.sh "${{ github.workspace }}" --format text $ARGS 2>&1 | tee /tmp/forensics-text.txt
          TEXT_EXIT=${PIPESTATUS[0]}
          set -e

          echo "exit-code=$TEXT_EXIT" >> "$GITHUB_OUTPUT"

          # JSON report for artifact
          set +e
          bash /tmp/repo-forensics/skill/scripts/run_forensics.sh "${{ github.workspace }}" --format json $ARGS > /tmp/forensics-report.json 2>&1
          set -e

          if [ "$TEXT_EXIT" -eq 2 ]; then
            echo "::error::Repo Forensics found CRITICAL findings"
          elif [ "$TEXT_EXIT" -eq 1 ]; then
            echo "::warning::Repo Forensics found HIGH/MEDIUM findings"
          fi
        continue-on-error: true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensics-report-${{ github.sha }}
          path: /tmp/forensics-report.json
          retention-days: 30

      - name: PR Comment
        if: always() && github.event_name == 'pull_request' && steps.forensics.outputs.exit-code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('/tmp/forensics-text.txt', 'utf8').slice(0, 4000); } catch { report = 'Report unavailable'; }
            const exitCode = '${{ steps.forensics.outputs.exit-code }}';
            const icon = exitCode === '2' ? '🚨' : '⚠️';
            const severity = exitCode === '2' ? 'CRITICAL' : 'HIGH/MEDIUM';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} **Repo Forensics: ${severity} findings**\n\nExit code: ${exitCode}\n\n<details>\n<summary>Scan Results</summary>\n\n\`\`\`\n${report}\n\`\`\`\n</details>\n\n[Full report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

      - name: Gate Decision
        if: always()
        run: |
          EC="${{ steps.forensics.outputs.exit-code }}"
          if [ "$EC" = "2" ]; then
            echo "::error::BLOCKED: Critical security findings"
            exit 2
          elif [ "$EC" = "1" ]; then
            echo "::warning::Review recommended"
            exit 0
          else
            echo "✅ Clean"
            exit 0
          fi
