name: CC OAuth Restore + Run SUMMIT 379
on:
  workflow_dispatch: {}
jobs:
  restore-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Restore OAuth and run CC
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Step 1: Restore OAuth credentials from Docker overlay ==="
          $SSH 'mkdir -p /root/.claude &&             CRED=$(find /var/lib/docker/rootfs/overlayfs -name ".credentials.json" -path "*host-claude-credentials*" 2>/dev/null | head -1) &&             if [ -n "$CRED" ]; then               cp "$CRED" /root/.claude/.credentials.json &&               echo "RESTORED from: $CRED";             else               CRED2=$(find /var/lib/docker/rootfs/overlayfs -name ".credentials.json" -path "*fakeroot*claude*" 2>/dev/null | head -1) &&               if [ -n "$CRED2" ]; then                 cp "$CRED2" /root/.claude/.credentials.json &&                 echo "RESTORED from: $CRED2";               else                 echo "FAILED: No credentials found";                 exit 1;               fi;             fi &&             ls -la /root/.claude/.credentials.json &&             echo "Credentials restored successfully"'

          echo ""
          echo "=== Step 2: Test CC auth ==="
          $SSH 'claude -p "echo OAUTH_WORKING" --allowedTools "Bash(*)" 2>&1 | tail -5' || echo "Auth test done"

          echo ""
          echo "=== Step 3: Setup workspace ==="
          $SSH "mkdir -p /root/summit-379 && cd /root/summit-379 &&             (test -d zonewise-web/.git && cd zonewise-web && git pull ||             git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git) &&             cd zonewise-web && git config user.email 'claude-code@biddeed.ai' && git config user.name 'Claude Code'"

          echo ""
          echo "=== Step 4: Run CC on SUMMIT #379 ==="
          $SSH "cd /root/summit-379/zonewise-web &&             export SUPABASE_ACCESS_TOKEN='${SUPABASE_ACCESS_TOKEN}' &&             export GH_PAT='${GH_PAT}' &&             claude -p 'Read GitHub issue #379 at https://github.com/breverdbidder/cli-anything-biddeed/issues/379 using: curl -s -H \"Authorization: token ${GH_PAT}\" https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/379 | jq .body. Also read all comments: curl -s -H \"Authorization: token ${GH_PAT}\" https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/379/comments | jq .[].body. Then execute ALL tasks. The key task: wire fl_parcels table (9.4M rows, 57 counties) to the zonewise-web frontend. Create /api/parcels route. Wire PropertyIntelCard popup. Commit and push. Comment on the issue when done.'             --allowedTools 'Bash(*)' 'Read' 'Write' 'Edit'             2>&1 | tail -500" || echo "CC session ended"

          echo "=== SUMMIT #379 COMPLETE ==="
