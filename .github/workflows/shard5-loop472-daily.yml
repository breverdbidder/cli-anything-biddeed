name: "SHARD-5 Loop-472 Daily — collier/madison/holmes/osceola/union"
# Daily pipeline wiring loop-472 scripts for the 5-county Gold Standard build.
# Session: loop=472 (2026-06-25)
# Runs at 05:30Z daily — before the 07:30Z gold_standard_loop pg_cron job.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to run (leave empty for all)'
        required: false
        default: ''

jobs:

  # ── H-FRESHNESS ──────────────────────────────────────────────────────────────
  h-freshness:
    name: "H: Freshness patch — collier/madison/holmes/osceola/union"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: "Run shard5_loop472_h_freshness.py"
        run: |
          set -euo pipefail
          python scripts/shard5_loop472_h_freshness.py

  # ── A LANE SETUP (osceola + union) ───────────────────────────────────────────
  a-lane-setup:
    name: "A: Lane setup — osceola/union"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: h-freshness
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: "Run shard5_loop472_a_lane_setup.py"
        run: |
          set -euo pipefail
          python scripts/shard5_loop472_a_lane_setup.py

  # ── B/F OUTCOMES ─────────────────────────────────────────────────────────────
  bf-outcomes:
    name: "B/F: Outcome rows + promote_tier1 — all 5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [h-freshness, a-lane-setup]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: "Run shard5_loop472_bf_outcomes.py"
        run: |
          set -euo pipefail
          python scripts/shard5_loop472_bf_outcomes.py

  # ── C/D PARITY ───────────────────────────────────────────────────────────────
  cd-parity:
    name: "C/D: Official-source parity rows — all 5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bf-outcomes
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: "Run shard5_loop472_cd_parity.py"
        run: |
          set -euo pipefail
          python scripts/shard5_loop472_cd_parity.py

  # ── J BID-DECISIONS ──────────────────────────────────────────────────────────
  j-decisions:
    name: "J: Bid-decisions via Shapira V14 — all 5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cd-parity
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: "Run shard5_loop472_j_decisions.py"
        run: |
          set -euo pipefail
          python scripts/shard5_loop472_j_decisions.py
