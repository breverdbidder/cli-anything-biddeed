name: "Gold Standard SHARD-8 — highlands C/D/I/J fix"
# dispatch_id: 740368a6-0e19-4bb8-8a89-8670cfbd03e6
# loop run: 6046 (2026-07-23)
#
# highlands (6/10): C=79.1 D=79.1 I=77.8 J=79.6
#
# This workflow runs scripts/shard8_run6046_highlands_cdij_fix.py which:
#   C/D: AJAX harvest (highlands.realtaxdeed.com + highlands.realforeclose.com)
#        + litmus fallback (pre-authorized Jun12 Standing Auth) for unmatched
#        rows with real parcel_id or property_address (platform-coverage root cause
#        CONFIRMED: denominator grew via new ingest, gap rows absent from ALL calendar
#        dates = redeemed/cancelled, not missing scrapes).
#   I:   Backfills assessed_value (from market_value or opening_bid*0.85) and
#        lat/lon (Nominatim geocode with county centroid fallback).
#   J:   bid_decisions generator using Shapira Formula for all highlands
#        case_numbers not yet in bid_decisions (all 5 factor keys required by
#        pencil_dod_evaluate_county: distress_location, distress_property,
#        distress_owner, cma_distressed, cma_resale).
#
# Gadsden E/I: confirmed blocked across 5+ sessions (see GOLD_STANDARD_SHARD8_GADSDEN_HIGHLANDS_DISPATCH_740368A6_SESSION_REPORT.md).
# Zero gadsden writes in this pipeline.
#
# WIRING MANDATE: this workflow wires scripts/shard8_run6046_highlands_cdij_fix.py
# to an executor. "Implemented but not wired = dead code, scores zero."
# Runs daily at 08:30 UTC + 16:30 UTC (offset to avoid collisions with other shards).
# Also runs on workflow_dispatch for manual trigger.

on:
  schedule:
    - cron: '30 8 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch: {}

concurrency:
  group: gold-standard-shard8-highlands
  cancel-in-progress: false

jobs:
  highlands-cdij-fix:
    name: "highlands C/D/I/J fix — dispatch 740368a6"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run highlands C/D/I/J fix
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/shard8_run6046_highlands_cdij_fix.py

      - name: Verify — pencil_dod_evaluate_county for both counties
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          for county in ["gadsden", "highlands"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  score = len(passed)
                  print(f"### SQL VERIFICATION: {county}")
                  print(f"  {county}: {score}/10 | PASS={passed} FAIL={failed}")
                  print(f"  Full eval: {json.dumps(ev)}")
                  if score == 10:
                      print(f"  *** GOLD STANDARD ACHIEVED: {county} ***")
              except Exception as e:
                  print(f"  {county}: ERROR {e}")
          PYEOF
