name: Mark Nexus Task Done

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "nexus_tasks task_id to mark as completed"
        required: true
      reason:
        description: "Completion reason / proof"
        required: false
        default: "Marked done via workflow_dispatch"

jobs:
  mark-done:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark task completed in nexus_tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          REASON: ${{ inputs.reason }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, os
          from datetime import datetime, timezone, timedelta

          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          TASK_ID = os.environ.get("TASK_ID", "")
          REASON = os.environ.get("REASON", "")

          if not all([SB_URL, SB_KEY, TASK_ID]):
              print("Missing required env vars")
              exit(1)

          sb_h = {
              "apikey": SB_KEY,
              "Authorization": f"Bearer {SB_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          now = datetime.now(timezone.utc).isoformat()
          # First query to see current status and discover valid values
          r_check = requests.get(
              f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.{TASK_ID}&select=task_id,status",
              headers=sb_h, timeout=10,
          )
          print(f"Current state: {r_check.text[:200]}")

          # Try 'done' (common nexus status) — falls back to 'cancelled' if needed
          for status_val in ["done", "resolved", "cancelled"]:
              r = requests.patch(
                  f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.{TASK_ID}",
                  headers=sb_h,
                  json={"status": status_val, "completed_at": now},
                  timeout=10,
              )
              if r.status_code in (200, 204):
                  print(f"[VERIFIED] nexus_tasks.{TASK_ID} → status={status_val}")
                  break
              elif r.status_code == 400 and "23514" in r.text:
                  print(f"status={status_val} rejected by constraint, trying next")
                  continue
              else:
                  break  # unexpected error

          if r.status_code not in (200, 204):
              print(f"[FAILED] {r.status_code}: {r.text[:200]}")
              exit(1)
          PYSCRIPT
