name: Deploy Winner Data LMS Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/winnerdata-lms/**'
      - '.github/workflows/deploy-winnerdata-lms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winnerdata-lms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/winnerdata-lms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard - required secrets present
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          AUTH_USER: ${{ secrets.LMS_AUTH_USER }}
          AUTH_PASS: ${{ secrets.LMS_AUTH_PASS }}
        run: |
          MISSING=""
          [ -z "$CF_TOKEN" ] && MISSING="$MISSING CF_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && MISSING="$MISSING CF_ACCOUNT_ID"
          [ -z "$AUTH_USER" ] && MISSING="$MISSING LMS_AUTH_USER"
          [ -z "$AUTH_PASS" ] && MISSING="$MISSING LMS_AUTH_PASS"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING. Add them at Settings > Secrets > Actions."
            exit 1
          fi
          echo "Secrets present."

      - name: Syntax check worker
        run: |
          node --check src/index.js
          echo "Worker JS parses OK"

      - name: Install dependencies
        run: npm install

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/winnerdata-lms
          command: deploy

      - name: Set Worker Basic Auth secrets
        run: |
          echo "${{ secrets.LMS_AUTH_USER }}" | npx wrangler secret put LMS_AUTH_USER
          echo "${{ secrets.LMS_AUTH_PASS }}" | npx wrangler secret put LMS_AUTH_PASS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Verify live - unauthenticated request must be rejected
        run: |
          sleep 8
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://lms.winnerdataai.com/healthz || echo "000")
          echo "/healthz (no auth) returned $CODE"
          if [ "$CODE" = "000" ]; then
            echo "::warning::Endpoint unreachable - check route/DNS binding for lms.winnerdataai.com (run lms-winnerdata-dns-fix.yml if needed)"
            exit 0
          fi
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for unauthenticated request, got $CODE. Basic Auth gate is not enforcing."
            exit 1
          fi
          echo "PASS: unauthenticated request correctly rejected (401)"

      - name: Verify live - authenticated request returns real data
        run: |
          CODE=$(curl -s -o /tmp/healthz_body.json -w "%{http_code}" -u "${{ secrets.LMS_AUTH_USER }}:${{ secrets.LMS_AUTH_PASS }}" https://lms.winnerdataai.com/healthz || echo "000")
          echo "/healthz (authenticated) returned $CODE"
          cat /tmp/healthz_body.json || true
          if [ "$CODE" != "200" ]; then
            echo "::error::Expected 200 for authenticated /healthz, got $CODE"
            exit 1
          fi
          grep -q '"ok": true' /tmp/healthz_body.json || { echo "::error::healthz body missing ok:true"; exit 1; }
          echo "PASS: authenticated healthz returns ok:true"

      - name: Summary
        run: |
          echo "### Winner Data LMS Worker — Deploy Verified" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://lms.winnerdataai.com" >> "$GITHUB_STEP_SUMMARY"
          echo "Auth: HTTP Basic (credentials in LMS_AUTH_USER/LMS_AUTH_PASS repo secrets)" >> "$GITHUB_STEP_SUMMARY"
