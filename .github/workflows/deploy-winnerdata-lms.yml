name: Deploy Winner Data LMS Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/winnerdata-lms/**'
      - '.github/workflows/deploy-winnerdata-lms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winnerdata-lms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/winnerdata-lms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard - required secrets present
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          AUTH_USER: ${{ secrets.LMS_AUTH_USER }}
          AUTH_PASS: ${{ secrets.LMS_AUTH_PASS }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MISSING=""
          [ -z "$CF_TOKEN" ] && MISSING="$MISSING CF_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && MISSING="$MISSING CF_ACCOUNT_ID"
          [ -z "$AUTH_USER" ] && MISSING="$MISSING LMS_AUTH_USER"
          [ -z "$AUTH_PASS" ] && MISSING="$MISSING LMS_AUTH_PASS"
          [ -z "$SB_URL" ] && MISSING="$MISSING SUPABASE_URL"
          [ -z "$SB_SERVICE_KEY" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING. Add them at Settings > Secrets > Actions."
            exit 1
          fi
          echo "Secrets present."

      - name: Syntax check worker
        run: |
          node --check src/index.js
          echo "Worker JS parses OK"

      - name: Install dependencies
        run: npm install

      - name: Deploy via wrangler
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/deploy_output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy_output.txt | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract workers.dev URL from wrangler output"
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Worker secrets
        run: |
          echo "${{ secrets.LMS_AUTH_USER }}" | npx wrangler secret put LMS_AUTH_USER
          echo "${{ secrets.LMS_AUTH_PASS }}" | npx wrangler secret put LMS_AUTH_PASS
          echo "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # lms.winnerdataai.com/* is declared in wrangler.toml's [[routes]] and will
      # activate automatically once DNS is fixed (see wrangler.toml comment —
      # CF_API_TOKEN currently lacks Zone:DNS permission). Primary verification
      # target is the workers.dev URL, which does not depend on that route.
      - name: Verify live - unauthenticated request redirects to the real login page, no Basic Auth popup (workers.dev)
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          sleep 8
          CODE=$(curl -s -D /tmp/healthz_noauth_headers.txt -o /dev/null -w "%{http_code}" "$URL/healthz" || echo "000")
          echo "/healthz (no session) returned $CODE"
          if [ "$CODE" != "302" ]; then
            echo "::error::Expected 302 redirect to /login for unauthenticated request, got $CODE. Session gate is not enforcing."
            exit 1
          fi
          if ! grep -qi "^location: $URL/login" /tmp/healthz_noauth_headers.txt; then
            echo "::error::Expected redirect Location to end in /login" && cat /tmp/healthz_noauth_headers.txt && exit 1
          fi
          echo "PASS: unauthenticated request redirected to /login (302)"

          CODE=$(curl -s -D /tmp/login_headers.txt -o /tmp/login_body.html -w "%{http_code}" "$URL/login" || echo "000")
          echo "/login returned $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Expected 200 for GET /login, got $CODE" && exit 1
          fi
          if grep -qi '^www-authenticate:' /tmp/login_headers.txt; then
            echo "::error::/login must never send a WWW-Authenticate challenge — that IS the native popup this ticket removes" && exit 1
          fi
          if ! grep -q 'name="username"' /tmp/login_body.html || ! grep -q 'name="password"' /tmp/login_body.html; then
            echo "::error::/login is missing username/password fields" && cat /tmp/login_body.html && exit 1
          fi
          if ! grep -q 'Forgot login?' /tmp/login_body.html; then
            echo "::error::/login is missing the visible Forgot login link" && exit 1
          fi
          echo "PASS: /login is a real form (username + password + visible Forgot login link), no popup"

      - name: Verify live - wrong credentials show an inline error, not a popup (workers.dev)
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          CODE=$(curl -s -o /tmp/wrong_login_body.html -w "%{http_code}" -X POST --data-urlencode "username=definitely-wrong" --data-urlencode "password=definitely-wrong" "$URL/login")
          echo "POST /login (wrong creds) returned $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for wrong credentials, got $CODE" && exit 1
          fi
          if ! grep -q "Incorrect username or password" /tmp/wrong_login_body.html; then
            echo "::error::Missing inline 'Incorrect username or password' error" && cat /tmp/wrong_login_body.html && exit 1
          fi
          echo "PASS: wrong credentials produce an inline error on the same page"

      - name: Verify live - correct credentials log in and the session persists across navigations (workers.dev)
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          # Retry with backoff: freshly-set `wrangler secret put` values can take
          # a few seconds to propagate to the edge, so an immediate curl can hit
          # a Worker instance still running on stale/partial secrets.
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s --max-time 15 -c /tmp/lms_cookies.txt -o /tmp/login_result.html -w "%{http_code}" \
              -X POST --data-urlencode "username=${{ secrets.LMS_AUTH_USER }}" --data-urlencode "password=${{ secrets.LMS_AUTH_PASS }}" \
              "$URL/login" || echo "000")
            echo "attempt $attempt: POST /login (correct creds) returned $CODE"
            if [ "$CODE" = "303" ] && grep -q lms_session /tmp/lms_cookies.txt; then
              echo "PASS: correct credentials issue a session cookie"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::Expected 303 + session cookie after 6 attempts, last code=$CODE"
              exit 1
            fi
            sleep 10
          done

          # DoD requires the session to persist across at least 2 page
          # navigations without re-sending credentials.
          CODE1=$(curl -s -b /tmp/lms_cookies.txt -o /tmp/healthz_body.json -w "%{http_code}" "$URL/healthz")
          echo "/healthz with session cookie (navigation 1) returned $CODE1"
          if [ "$CODE1" != "200" ] || ! grep -q '"ok":true' /tmp/healthz_body.json; then
            echo "::error::Session cookie did not grant access to /healthz, code=$CODE1" && cat /tmp/healthz_body.json && exit 1
          fi
          CODE2=$(curl -s -b /tmp/lms_cookies.txt -o /tmp/orgs_body.html -w "%{http_code}" "$URL/orgs")
          echo "/orgs with session cookie (navigation 2) returned $CODE2"
          if [ "$CODE2" != "200" ]; then
            echo "::error::Session cookie did not grant access to /orgs, code=$CODE2" && exit 1
          fi
          echo "PASS: session persists across 2 separate page navigations (/healthz then /orgs)"

      - name: Check custom domain (informational only - known DNS gap)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://lms.winnerdataai.com/healthz || echo "000")
          echo "/healthz via lms.winnerdataai.com returned $CODE (expected unreachable until CF_API_TOKEN gets Zone:DNS:Edit — see wrangler.toml)"

      # Evidence-gathering only. Runs inside the GHA runner because the
      # LMS_AUTH_USER/LMS_AUTH_PASS values are write-only repo secrets — no
      # human or agent outside this runner can read them back out to curl the
      # 6 views independently. Response bodies (real DB rows, no secret
      # material) are appended to the job summary as the DoD evidence.
      - name: Evidence - real rows for all 6 views (org_id=032f4717-545f-4a18-b48b-28ea4257699d, Protection Partners)
        run: |
          set +e
          URL="${{ steps.deploy.outputs.worker_url }}"
          ORG_ID="032f4717-545f-4a18-b48b-28ea4257699d"

          fetch_view() {
            # $1=label $2=path
            echo "#### $1"
            CODE=$(curl -s -o /tmp/view_body.html -w "%{http_code}" -b /tmp/lms_cookies.txt "$URL$2")
            echo "HTTP $CODE"
            echo '```'
            grep -oE '<td>[^<]{0,60}(<[^t][^<]*)?</td>|<h2>[^<]*</h2>|<span class="stat-num[^"]*">[^<]*</span>' /tmp/view_body.html | head -30
            echo '```'
            echo
          }

          {
            echo "### Live-data evidence — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fetch_view "1. Clients/orgs view (GET /orgs)" "/orgs"
            fetch_view "2. Leads view (GET /leads?org_id=...)" "/leads?org_id=$ORG_ID"
            fetch_view "3. Producer performance view (GET /producers?org_id=...)" "/producers?org_id=$ORG_ID"
            fetch_view "4. Billing view (GET /billing?org_id=...)" "/billing?org_id=$ORG_ID"
            fetch_view "5. FF Batches list (GET /ff-batches)" "/ff-batches"
            fetch_view "6. FF Batch detail/review (GET /ff-batches/2026-08-29 — real 28-lead batch)" "/ff-batches/2026-08-29"
          } | tee /tmp/lms_evidence.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-live-data-evidence
          path: /tmp/lms_evidence.md
          retention-days: 14

      - name: Summary
        run: |
          echo "### Winner Data LMS Worker — Deploy Verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Live URL (workers.dev): ${{ steps.deploy.outputs.worker_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Intended custom domain: https://lms.winnerdataai.com (blocked on DNS — CF_API_TOKEN lacks Zone:DNS permission, see wrangler.toml)" >> "$GITHUB_STEP_SUMMARY"
          echo "Auth: real /login form (username+password, credentials in LMS_AUTH_USER/LMS_AUTH_PASS repo secrets) + signed session cookie — no browser Basic Auth popup" >> "$GITHUB_STEP_SUMMARY"
