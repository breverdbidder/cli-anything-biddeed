name: Deploy Winner Data LMS Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/winnerdata-lms/**'
      - '.github/workflows/deploy-winnerdata-lms.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winnerdata-lms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/winnerdata-lms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard - required secrets present
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          AUTH_USER: ${{ secrets.LMS_AUTH_USER }}
          AUTH_PASS: ${{ secrets.LMS_AUTH_PASS }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LMS_AUTH_EMAIL: ${{ secrets.LMS_SUPABASE_AUTH_EMAIL }}
          LMS_AUTH_PW: ${{ secrets.LMS_SUPABASE_AUTH_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$CF_TOKEN" ] && MISSING="$MISSING CF_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && MISSING="$MISSING CF_ACCOUNT_ID"
          [ -z "$AUTH_USER" ] && MISSING="$MISSING LMS_AUTH_USER"
          [ -z "$AUTH_PASS" ] && MISSING="$MISSING LMS_AUTH_PASS"
          [ -z "$SB_URL" ] && MISSING="$MISSING SUPABASE_URL"
          [ -z "$SB_SERVICE_KEY" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$SB_ANON_KEY" ] && MISSING="$MISSING SUPABASE_ANON_KEY"
          [ -z "$LMS_AUTH_EMAIL" ] && MISSING="$MISSING LMS_SUPABASE_AUTH_EMAIL"
          [ -z "$LMS_AUTH_PW" ] && MISSING="$MISSING LMS_SUPABASE_AUTH_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING. Add them at Settings > Secrets > Actions."
            exit 1
          fi
          echo "Secrets present."

      - name: Syntax check worker
        run: |
          node --check src/index.js
          echo "Worker JS parses OK"

      - name: Install dependencies
        run: npm install

      # Issue #20033: Meta/TikTok/X OAuth callback routes, mocked providers
      # (no real app credentials exist yet -- Ariel creates the apps after
      # this ships). A failing unit test blocks deploy, same as the syntax
      # check above.
      - name: Unit test — OAuth callback routes (mocked Meta/TikTok/X/Supabase)
        run: node --test tests/

      - name: Deploy via wrangler
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/deploy_output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy_output.txt | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract workers.dev URL from wrangler output"
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Worker secrets
        run: |
          echo "${{ secrets.LMS_AUTH_USER }}" | npx wrangler secret put LMS_AUTH_USER
          echo "${{ secrets.LMS_AUTH_PASS }}" | npx wrangler secret put LMS_AUTH_PASS
          echo "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_KEY
          echo "${{ secrets.SUPABASE_ANON_KEY }}" | npx wrangler secret put SUPABASE_ANON_KEY
          echo "${{ secrets.LMS_SUPABASE_AUTH_EMAIL }}" | npx wrangler secret put LMS_SUPABASE_AUTH_EMAIL
          echo "${{ secrets.LMS_SUPABASE_AUTH_PASSWORD }}" | npx wrangler secret put LMS_SUPABASE_AUTH_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Issue #20033: all seven are OPTIONAL app-level credentials Ariel adds
      # once he creates each platform's developer app. Absence is expected
      # state, not an error -- each is only `wrangler secret put` if the
      # corresponding GitHub secret is actually set, so an unset one leaves
      # env.<NAME> undefined at runtime and that platform's /connections tile
      # renders "Not configured — add <NAME>" per intent guardrail #7
      # (never a placeholder value). This step must not fail when any/all of
      # these are absent.
      - name: Set optional Connections Worker secrets (Meta/TikTok/X/Typefully)
        run: |
          set_if_present() {
            name="$1"; value="$2"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
              echo "Set $name"
            else
              echo "Skipping $name — not set as a GitHub secret yet (tile will show Not configured)"
            fi
          }
          set_if_present META_APP_ID "${{ secrets.META_APP_ID }}"
          set_if_present META_APP_SECRET "${{ secrets.META_APP_SECRET }}"
          set_if_present TIKTOK_CLIENT_KEY "${{ secrets.TIKTOK_CLIENT_KEY }}"
          set_if_present TIKTOK_CLIENT_SECRET "${{ secrets.TIKTOK_CLIENT_SECRET }}"
          set_if_present X_API_KEY "${{ secrets.X_API_KEY }}"
          set_if_present X_API_SECRET "${{ secrets.X_API_SECRET }}"
          set_if_present TYPEFULLY_API_KEY "${{ secrets.TYPEFULLY_API_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # lms.winnerdataai.com/* is declared in wrangler.toml's [[routes]] and will
      # activate automatically once DNS is fixed (see wrangler.toml comment —
      # CF_API_TOKEN currently lacks Zone:DNS permission). Primary verification
      # target is the workers.dev URL, which does not depend on that route.
      - name: Verify live - unauthenticated request redirects to the real login page, no Basic Auth popup (workers.dev)
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          sleep 8
          CODE=$(curl -s -D /tmp/healthz_noauth_headers.txt -o /dev/null -w "%{http_code}" "$URL/healthz" || echo "000")
          echo "/healthz (no session) returned $CODE"
          if [ "$CODE" != "302" ]; then
            echo "::error::Expected 302 redirect to /login for unauthenticated request, got $CODE. Session gate is not enforcing."
            exit 1
          fi
          if ! grep -qi "^location: $URL/login" /tmp/healthz_noauth_headers.txt; then
            echo "::error::Expected redirect Location to end in /login" && cat /tmp/healthz_noauth_headers.txt && exit 1
          fi
          echo "PASS: unauthenticated request redirected to /login (302)"

          CODE=$(curl -s -D /tmp/login_headers.txt -o /tmp/login_body.html -w "%{http_code}" "$URL/login" || echo "000")
          echo "/login returned $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Expected 200 for GET /login, got $CODE" && exit 1
          fi
          if grep -qi '^www-authenticate:' /tmp/login_headers.txt; then
            echo "::error::/login must never send a WWW-Authenticate challenge — that IS the native popup this ticket removes" && exit 1
          fi
          if ! grep -q 'name="username"' /tmp/login_body.html || ! grep -q 'name="password"' /tmp/login_body.html; then
            echo "::error::/login is missing username/password fields" && cat /tmp/login_body.html && exit 1
          fi
          if ! grep -q 'Forgot login?' /tmp/login_body.html; then
            echo "::error::/login is missing the visible Forgot login link" && exit 1
          fi
          echo "PASS: /login is a real form (username + password + visible Forgot login link), no popup"

      - name: Verify live - wrong credentials show an inline error, not a popup (workers.dev)
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          CODE=$(curl -s -o /tmp/wrong_login_body.html -w "%{http_code}" -X POST --data-urlencode "username=definitely-wrong" --data-urlencode "password=definitely-wrong" "$URL/login")
          echo "POST /login (wrong creds) returned $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for wrong credentials, got $CODE" && exit 1
          fi
          if ! grep -q "Incorrect username or password" /tmp/wrong_login_body.html; then
            echo "::error::Missing inline 'Incorrect username or password' error" && cat /tmp/wrong_login_body.html && exit 1
          fi
          echo "PASS: wrong credentials produce an inline error on the same page"

      - name: Verify live - correct credentials log in and the session persists across navigations (workers.dev)
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          # Retry with backoff: freshly-set `wrangler secret put` values can take
          # a few seconds to propagate to the edge, so an immediate curl can hit
          # a Worker instance still running on stale/partial secrets.
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s --max-time 15 -c /tmp/lms_cookies.txt -o /tmp/login_result.html -w "%{http_code}" \
              -X POST --data-urlencode "username=${{ secrets.LMS_AUTH_USER }}" --data-urlencode "password=${{ secrets.LMS_AUTH_PASS }}" \
              "$URL/login" || echo "000")
            echo "attempt $attempt: POST /login (correct creds) returned $CODE"
            if [ "$CODE" = "303" ] && grep -q lms_session /tmp/lms_cookies.txt; then
              echo "PASS: correct credentials issue a session cookie"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::Expected 303 + session cookie after 6 attempts, last code=$CODE"
              exit 1
            fi
            sleep 10
          done

          # DoD requires the session to persist across at least 2 page
          # navigations without re-sending credentials.
          CODE1=$(curl -s -b /tmp/lms_cookies.txt -o /tmp/healthz_body.json -w "%{http_code}" "$URL/healthz")
          echo "/healthz with session cookie (navigation 1) returned $CODE1"
          if [ "$CODE1" != "200" ] || ! grep -q '"ok":true' /tmp/healthz_body.json; then
            echo "::error::Session cookie did not grant access to /healthz, code=$CODE1" && cat /tmp/healthz_body.json && exit 1
          fi
          CODE2=$(curl -s -b /tmp/lms_cookies.txt -o /tmp/orgs_body.html -w "%{http_code}" "$URL/orgs")
          echo "/orgs with session cookie (navigation 2) returned $CODE2"
          if [ "$CODE2" != "200" ]; then
            echo "::error::Session cookie did not grant access to /orgs, code=$CODE2" && exit 1
          fi
          echo "PASS: session persists across 2 separate page navigations (/healthz then /orgs)"

      - name: Check custom domain (informational only - known DNS gap)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://lms.winnerdataai.com/healthz || echo "000")
          echo "/healthz via lms.winnerdataai.com returned $CODE (expected unreachable until CF_API_TOKEN gets Zone:DNS:Edit — see wrangler.toml)"

      # Evidence-gathering only. Runs inside the GHA runner because the
      # LMS_AUTH_USER/LMS_AUTH_PASS values are write-only repo secrets — no
      # human or agent outside this runner can read them back out to curl the
      # 6 views independently. Response bodies (real DB rows, no secret
      # material) are appended to the job summary as the DoD evidence.
      - name: Evidence - real rows for all 6 views (org_id=032f4717-545f-4a18-b48b-28ea4257699d, Protection Partners)
        run: |
          set +e
          URL="${{ steps.deploy.outputs.worker_url }}"
          ORG_ID="032f4717-545f-4a18-b48b-28ea4257699d"

          fetch_view() {
            # $1=label $2=path
            echo "#### $1"
            CODE=$(curl -s -o /tmp/view_body.html -w "%{http_code}" -b /tmp/lms_cookies.txt "$URL$2")
            echo "HTTP $CODE"
            echo '```'
            grep -oE '<td>[^<]{0,60}(<[^t][^<]*)?</td>|<h2>[^<]*</h2>|<span class="stat-num[^"]*">[^<]*</span>' /tmp/view_body.html | head -30
            echo '```'
            echo
          }

          {
            echo "### Live-data evidence — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fetch_view "1. Clients/orgs view (GET /orgs)" "/orgs"
            fetch_view "2. Leads view (GET /leads?org_id=...)" "/leads?org_id=$ORG_ID"
            fetch_view "3. Producer performance view (GET /producers?org_id=...)" "/producers?org_id=$ORG_ID"
            fetch_view "4. Billing view (GET /billing?org_id=...)" "/billing?org_id=$ORG_ID"
            fetch_view "5. FF Batches list (GET /ff-batches)" "/ff-batches"
            fetch_view "6. FF Batch detail/review (GET /ff-batches/2026-08-29 — real 28-lead batch)" "/ff-batches/2026-08-29"
          } | tee /tmp/lms_evidence.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-live-data-evidence
          path: /tmp/lms_evidence.md
          retention-days: 14

      # ---------------------------------------------------------------
      # Issue #19745 requirement 4: a real click-through proof that (a) the
      # LMS Batch Review + Approval screen creates a provenanced
      # winnerdata.ff_batch_approvals row through the authenticated path,
      # and (b) it's a genuine browser click, not a curl replay of the login
      # form. Runs inside this runner for the same reason the evidence step
      # above does: LMS_AUTH_USER/LMS_AUTH_PASS are write-only secrets.
      #
      # batch_kind='nine_case_portfolio' + a synthetic far-future batch_date:
      # scripts/winnerdata_ff_send_approved.py only ever queries
      # batch_kind='seller_digest' rows, so approving this test batch can
      # NEVER cascade into a real send to Mariam/any producer, regardless of
      # whether the winnerdata.ff_batches_notify_approved DB trigger fires —
      # matches CLAUDE.md M1 (no producer-addressed send without Ariel's LMS
      # approval click, and this build itself must not cause one).
      # ---------------------------------------------------------------
      - name: Prepare synthetic test batch for Playwright approval proof
        working-directory: .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sql = """
            insert into winnerdata.ff_batches (batch_date, status, batch_kind, lead_count)
            values ('2099-06-15', 'pending_approval', 'nine_case_portfolio', 0)
            on conflict (batch_date) do update set status = 'pending_approval',
              approved_at = null, approved_by = null, approval_provenance = null;
          """
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "winnerdata-lms-deploy-playwright-proof/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status, resp.read().decode())
          PY

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Issue #20033 DoD: "/connections live behind the LMS auth, Playwright
      # 390 px screenshot, all six tiles rendering with real status, zero
      # console errors." Separate from the FF-batch click-through below —
      # this is a read-only page, no approval/send risk (M1) either way.
      - name: Playwright — /connections at 390px, real login, zero console errors
        env:
          LMS_URL: ${{ steps.deploy.outputs.worker_url }}
          LMS_USER: ${{ secrets.LMS_AUTH_USER }}
          LMS_PASS: ${{ secrets.LMS_AUTH_PASS }}
        run: |
          cat > ./lms_connections_390.mjs <<'EOF'
          import { chromium } from 'playwright';

          const BASE = process.env.LMS_URL;
          const USER = process.env.LMS_USER;
          const PASS = process.env.LMS_PASS;
          const TILE_LABELS = ['YouTube', 'Instagram Business', 'Facebook Page', 'TikTok', 'X (Twitter)', 'Typefully', 'LinkedIn Company Page'];

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

          const consoleErrors = [];
          page.on('console', (msg) => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('pageerror', (err) => consoleErrors.push(String(err)));

          let loginResponse;
          for (let attempt = 1; attempt <= 4; attempt++) {
            await page.goto(`${BASE}/login`);
            await page.fill('#username', USER);
            await page.fill('#password', PASS);
            [loginResponse] = await Promise.all([
              page.waitForResponse((r) => r.url().endsWith('/login') && r.request().method() === 'POST'),
              page.click('form[action="/login"] button[type="submit"]'),
            ]);
            if (loginResponse.status() === 303) break;
            await new Promise((r) => setTimeout(r, 5000));
          }
          if (loginResponse.status() !== 303) {
            console.error(`FAIL: login did not succeed after retries (status=${loginResponse.status()})`);
            process.exit(1);
          }

          await page.goto(`${BASE}/connections`);
          await page.waitForLoadState('networkidle').catch(() => {});

          const bodyText = await page.textContent('body');
          const missingTiles = TILE_LABELS.filter((label) => !bodyText.includes(label));
          if (missingTiles.length) {
            console.error(`FAIL: missing tile(s): ${missingTiles.join(', ')}`);
            process.exit(1);
          }
          console.log('PASS: all six platform tiles rendered with real status');

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
          if (overflow) {
            console.error('FAIL: horizontal overflow at 390px viewport');
            process.exit(1);
          }
          console.log('PASS: no horizontal overflow at 390px');

          if (consoleErrors.length) {
            console.error(`FAIL: ${consoleErrors.length} console error(s): ${JSON.stringify(consoleErrors)}`);
            process.exit(1);
          }
          console.log('PASS: zero console errors');

          await page.screenshot({ path: '/tmp/connections_390.png', fullPage: true });
          await browser.close();
          EOF
          node ./lms_connections_390.mjs
          rm -f ./lms_connections_390.mjs

      - name: Commit /connections 390px screenshot evidence
        working-directory: .
        run: |
          mkdir -p docs/evidence
          cp /tmp/connections_390.png docs/evidence/20033-lms-connections-390px.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/20033-lms-connections-390px.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "$(cat <<'EOF'
          docs(20033): commit live Playwright /connections 390px screenshot

          Automated evidence from deploy-winnerdata-lms.yml — real browser login +
          /connections render at 390px, all six tiles present, zero console errors.

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          EOF
          )"
            git push origin HEAD:main
          fi

      - name: Playwright — real LMS login + FF batch approve click-through
        env:
          LMS_URL: ${{ steps.deploy.outputs.worker_url }}
          LMS_USER: ${{ secrets.LMS_AUTH_USER }}
          LMS_PASS: ${{ secrets.LMS_AUTH_PASS }}
        run: |
          cat > ./lms_approve_click.mjs <<'EOF'
          import { chromium } from 'playwright';

          const BASE = process.env.LMS_URL;
          const USER = process.env.LMS_USER;
          const PASS = process.env.LMS_PASS;
          const BATCH_DATE = '2099-06-15';

          // Isolate a value problem (wrong secret content) from a browser
          // DOM-interaction problem before touching Playwright at all -- a
          // plain fetch() POST exercises the exact same credentials the
          // page.fill() calls below will use.
          const directRes = await fetch(`${BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ username: USER, password: PASS }).toString(),
            redirect: 'manual',
          });
          console.log(`Direct fetch() POST /login -> ${directRes.status} (sanity check, independent of Playwright)`);
          if (directRes.status !== 303) {
            console.error('FAIL: even a direct fetch() with these exact secret values does not log in -- '
              + 'this points at the LMS_AUTH_USER/LMS_AUTH_PASS secret values themselves, not Playwright.');
            process.exit(1);
          }

          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('dialog', (d) => d.accept());

          let loginResponse;
          for (let attempt = 1; attempt <= 4; attempt++) {
            await page.goto(`${BASE}/login`);
            await page.fill('#username', USER);
            await page.fill('#password', PASS);
            [loginResponse] = await Promise.all([
              page.waitForResponse((r) => r.url().endsWith('/login') && r.request().method() === 'POST'),
              page.click('form[action="/login"] button[type="submit"]'),
            ]);
            console.log(`attempt ${attempt}: POST /login -> ${loginResponse.status()}`);
            if (loginResponse.status() === 303) break;
            await new Promise((r) => setTimeout(r, 5000));
          }
          await page.waitForLoadState('networkidle').catch(() => {});
          if (page.url().includes('/login') || loginResponse.status() !== 303) {
            console.error(`FAIL: login did not redirect as expected after retries (status=${loginResponse.status()}, url=${page.url()})`);
            console.error((await page.content()).slice(0, 1500));
            process.exit(1);
          }
          console.log('PASS: real browser login via /login form succeeded');

          await page.goto(`${BASE}/ff-batches/${BATCH_DATE}`);
          await page.screenshot({ path: '/tmp/ff_batch_approval_before.png', fullPage: true });
          const beforeText = await page.textContent('body');
          if (!beforeText.includes('PENDING_APPROVAL') && !beforeText.includes('PENDING APPROVAL') && !beforeText.toUpperCase().includes('PENDING_APPROVAL')) {
            console.error('FAIL: test batch is not pending_approval before the click — cannot prove the approve action');
            process.exit(1);
          }

          const approveButton = page.locator('form[action$="/approve"] button[type="submit"]');
          if ((await approveButton.count()) === 0) {
            console.error('FAIL: no Approve button found on the batch detail page');
            process.exit(1);
          }
          await Promise.all([
            page.waitForNavigation(),
            approveButton.click(),
          ]);
          await page.screenshot({ path: '/tmp/ff_batch_approval_after.png', fullPage: true });

          const afterText = await page.textContent('body');
          if (afterText.includes('Approval failed') || afterText.includes('Approval rejected')) {
            console.error('FAIL: approval error text present on the page after clicking Approve');
            console.error(afterText.slice(0, 2000));
            process.exit(1);
          }
          if (!afterText.toUpperCase().includes('APPROVED')) {
            console.error('FAIL: batch does not show APPROVED status after the real click');
            process.exit(1);
          }
          console.log('PASS: real browser click on Approve Batch moved the batch to APPROVED');
          await browser.close();
          EOF
          node ./lms_approve_click.mjs
          rm -f ./lms_approve_click.mjs

      - name: Verify the click created a real, hash-matching ff_batch_approvals row
        working-directory: .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPECTED_EMAIL: ${{ secrets.LMS_SUPABASE_AUTH_EMAIL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sql = """
            select a.batch_date, a.batch_kind, a.approved_by_email,
                   a.snapshot_hash, b.status, b.approval_provenance
            from winnerdata.ff_batch_approvals a
            join winnerdata.ff_batches b on b.batch_date = a.batch_date
            where a.batch_date = '2099-06-15'
            order by a.approved_at desc limit 1;
          """
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "winnerdata-lms-deploy-playwright-proof/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              rows = json.loads(resp.read())
          print(json.dumps(rows, indent=2))
          if not rows:
              print("::error::No ff_batch_approvals row was created by the real LMS click")
              raise SystemExit(1)
          row = rows[0]
          expected_email = os.environ["EXPECTED_EMAIL"]
          if row["approved_by_email"] != expected_email:
              print(f"::error::approved_by_email={row['approved_by_email']!r}, expected {expected_email!r}")
              raise SystemExit(1)
          if row["status"] != "approved" or row["approval_provenance"] != "authenticated_lms_click":
              print(f"::error::unexpected batch state after approval: {row}")
              raise SystemExit(1)
          print("PASS: ff_batch_approvals row exists, correct admin email, batch flipped with authenticated_lms_click provenance")
          PY

      - name: Commit Playwright approval-click evidence screenshots
        working-directory: .
        run: |
          mkdir -p docs/evidence
          cp /tmp/ff_batch_approval_before.png docs/evidence/19745-lms-ff-batch-approval-before.png
          cp /tmp/ff_batch_approval_after.png docs/evidence/19745-lms-ff-batch-approval-after.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/19745-lms-ff-batch-approval-before.png docs/evidence/19745-lms-ff-batch-approval-after.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "$(cat <<'EOF'
          docs(19745): commit live Playwright approval click-through screenshots

          Automated evidence from deploy-winnerdata-lms.yml — a real browser login
          + Approve Batch click against the deployed LMS Worker, proving the
          authenticated-JWT approval path (issue #19745) works end to end.

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          EOF
          )"
            git push origin HEAD:main
          fi

