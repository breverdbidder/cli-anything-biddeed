name: "Create IMS Permits Table"
on:
  workflow_dispatch: {}
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create ims_permits table
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client -qq
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "CREATE TABLE IF NOT EXISTS ims_permits (
              id SERIAL PRIMARY KEY,
              record_number TEXT UNIQUE NOT NULL,
              permit_type TEXT,
              permit_subtype TEXT,
              milestone TEXT,
              address TEXT,
              city TEXT DEFAULT 'Palm Bay',
              county TEXT DEFAULT 'Brevard',
              applicant TEXT,
              description TEXT,
              scraped_at TIMESTAMPTZ DEFAULT now()
            );"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "CREATE INDEX IF NOT EXISTS idx_ims_address ON ims_permits(address);
                CREATE INDEX IF NOT EXISTS idx_ims_type ON ims_permits(permit_type);
                CREATE INDEX IF NOT EXISTS idx_ims_milestone ON ims_permits(milestone);"
          echo "✅ Table created"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "SELECT COUNT(*) FROM ims_permits;"
