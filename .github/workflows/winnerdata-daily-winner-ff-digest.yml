name: winnerdata-daily-winner-ff-digest
# "The Daily Winner FFs" -- issue #19490. Sends the branded digest email of
# that day's guard-passed (#19481), routed leads to Mariam Shapira.
#
# Runs AFTER both winnerdata-daily.yml passes (00:00 UTC primary, 04:00 UTC
# midnight-ET catch-up -- see that workflow's own header for the timing
# analysis) so the day's batch is fully routed before this queries it.
#
# CRON TIMING (2026-08-26): scheduled 10:00 UTC = 6:00 AM EDT. Hard SLA is
# 8:00 AM ET (12:00 UTC in EDT); issue's own internal target is 7:30 AM ET
# (11:30 UTC) for a 30-min buffer. This schedule leaves ~1h30m to the 7:30
# target and ~2h to the hard 8:00 AM deadline -- both comfortably clear of
# winnerdata-daily.yml's own 30-minute timeout window. Same DST caveat as
# winnerdata-daily.yml: fixed UTC cron, so the ET label drifts an hour
# across the DST boundary -- flagged, not silently assumed.
#
# The separate winnerdata-daily-ff-digest-sla-alert pg_cron job (see
# supabase/migrations/20260826b_winnerdata_daily_winner_ff_digest.sql)
# fires a Telegram alert to Ariel at 11:15 UTC (7:15 AM ET) if no digest has
# been logged sent/no_leads_sent for today by then.
on:
  workflow_dispatch:
    inputs:
      test_send_to:
        description: 'Safe test recipient override (never Mariam''s -- she has none on file yet)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no Resend call, no DB log write)'
        required: false
        default: 'false'
  schedule:
    - cron: "0 10 * * *"    # 6:00 AM EDT / 5:00 AM EST (10:00 UTC)
concurrency: {group: winnerdata-daily-winner-ff-digest, cancel-in-progress: false}
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Send daily digest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.test_send_to }}" ]; then
            ARGS="$ARGS --test-send-to ${{ github.event.inputs.test_send_to }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/winnerdata_daily_winner_ff_digest.py $ARGS
