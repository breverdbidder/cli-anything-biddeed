name: winnerdata-daily-winner-ff-digest
# "The Daily Winner FFs" -- BUILD step (issue #19482, Aug 27 scope change).
# Computes that day's guard-passed (#19481), routed leads and writes a
# winnerdata.ff_batches row with status='pending_approval'. Does NOT send
# email -- sending only happens in winnerdata-ff-send-approved.yml, and only
# after Ariel approves via public.ff_approve_batch() (Cowork task, outside
# this repo). See supabase/migrations/20260827_winnerdata_ff_batches_approval_gate.sql.
#
# Runs AFTER both winnerdata-daily.yml passes (00:00 UTC primary, 04:00 UTC
# midnight-ET catch-up -- see that workflow's own header for the timing
# analysis) so the day's batch is fully routed before this queries it.
#
# CRON TIMING (2026-08-26, unchanged by the approval-gate scope change):
# scheduled 10:00 UTC = 6:00 AM EDT, well clear of Ariel's 6:45 AM ET
# "pipeline late" alert and Mariam's 8:00 AM ET hard deadline. Same DST
# caveat as winnerdata-daily.yml: fixed UTC cron, so the ET label drifts an
# hour across the DST boundary -- flagged, not silently assumed.
#
# Two pg_cron-driven Telegram alerts (see the migration above) replace the
# old auto-send-era SLA check: winnerdata-ff-pipeline-late-alert (10:45 UTC
# / 6:45 AM ET, fires if no batch row exists yet) and
# winnerdata-ff-unapproved-alert (11:45 UTC / 7:45 AM ET, fires if the batch
# exists but is still pending_approval).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB write)'
        required: false
        default: 'false'
  schedule:
    - cron: "0 10 * * *"    # 6:00 AM EDT / 5:00 AM EST (10:00 UTC)
concurrency: {group: winnerdata-daily-winner-ff-digest, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build pending_approval batch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/winnerdata_daily_winner_ff_digest.py $ARGS
