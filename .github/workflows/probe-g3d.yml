name: G3D Tiles Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Map Tiles API
        env:
          KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "=== Map Tiles root ==="
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" "https://tile.googleapis.com/v1/3dtiles/root.json?key=$KEY")
          echo "HTTP: $HTTP"
          cat /tmp/resp.json | head -c 500
          echo ""
          if [ "$HTTP" = "200" ]; then
            echo "RESULT: MAPS_PLATFORM_ENABLED"
          elif [ "$HTTP" = "403" ]; then
            echo "RESULT: MAPS_PLATFORM_DISABLED_OR_RESTRICTED"
          else
            echo "RESULT: UNKNOWN_$HTTP"
          fi
