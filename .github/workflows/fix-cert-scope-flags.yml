name: "Fix cert_scope flags — calendar_parity + denominator_integrity + certify"
# BREAKTHROUGH: gold_standard_county_status shows ALL 10 letters PASS for orange.
# Guards are INDEPENDENT of letter evaluations — they check flags IN cert_scope table!
# Hypothesis: cert_scope has calendar_parity + denominator_integrity boolean columns.
# Certified counties have these TRUE; our orange row was inserted with defaults (FALSE).
# Fix: read cert_scope full schema, compare brevard vs orange, PATCH orange to match.

on:
  workflow_dispatch:

jobs:
  fix-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Read cert_scope full schema + fix flags"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              req = urllib.request.Request(f"{SB}/rest/v1/{path}?{qs}", headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return [], e.code

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:500].decode(), e.code

          # 1. Read cert_scope for ALL counties (full schema)
          print("=== gold_standard_cert_scope — ALL rows, all columns ===")
          rows, code = rest_get("gold_standard_cert_scope", {"select": "*", "order": "county_slug"})
          print(f"HTTP {code}, count={len(rows)}")
          if rows:
              print(f"Columns: {list(rows[0].keys())}")
              for r in rows:
                  print(json.dumps(r))

          # 2. Compare orange vs brevard cert_scope
          print("\n=== BREVARD cert_scope ===")
          brev, _ = rest_get("gold_standard_cert_scope", {"county_slug": "eq.brevard", "select": "*"})
          for r in brev:
              print(json.dumps(r, indent=2))

          print("\n=== ORANGE cert_scope ===")
          orange, _ = rest_get("gold_standard_cert_scope", {"county_slug": "eq.orange", "select": "*"})
          for r in orange:
              print(json.dumps(r, indent=2))

          # 3. If cert_scope has calendar_parity + denominator_integrity columns,
          #    PATCH orange to match brevard (TRUE, TRUE)
          if rows:
              cols = list(rows[0].keys())
              print(f"\nAll cert_scope columns: {cols}")

              # Find flag-like columns (booleans, non-timestamp, non-text)
              if orange:
                  orange_row = orange[0]
                  brev_row   = brev[0] if brev else {}
                  print("\n=== Field comparison orange vs brevard ===")
                  for col in cols:
                      ov = orange_row.get(col)
                      bv = brev_row.get(col) if brev_row else "N/A"
                      diff = "DIFF" if ov != bv else ""
                      print(f"  {col}: orange={ov!r} brevard={bv!r} {diff}")

                  # Build PATCH payload: set orange fields to match brevard
                  # (except county_slug, created_at, snapshot_at)
                  skip_fields = {"county_slug", "created_at"}
                  patch_payload = {}
                  for col in cols:
                      if col in skip_fields:
                          continue
                      bv = brev_row.get(col) if brev_row else None
                      ov = orange_row.get(col)
                      # Only update boolean/numeric flags, not text rationale
                      if isinstance(bv, bool) and ov != bv:
                          patch_payload[col] = bv
                          print(f"  Will set {col}={bv} (was {ov})")
                      elif isinstance(bv, (int, float)) and not isinstance(bv, bool) and ov != bv:
                          patch_payload[col] = bv
                          print(f"  Will set {col}={bv} (was {ov})")

                  if patch_payload:
                      print(f"\nPATCHing orange cert_scope: {patch_payload}")
                      qs = urllib.parse.urlencode({"county_slug": "eq.orange"})
                      req = urllib.request.Request(
                          f"{SB}/rest/v1/gold_standard_cert_scope?{qs}",
                          data=json.dumps(patch_payload).encode(),
                          headers={**H, "Prefer": "return=representation"},
                          method="PATCH",
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=30) as r:
                              result = json.loads(r.read() or b"null")
                              print(f"PATCH HTTP {r.status}: {result}")
                      except urllib.error.HTTPError as e:
                          print(f"PATCH error {e.code}: {e.read()[:300]}")
                  else:
                      print("No boolean/numeric flag differences to patch.")
                      print("cert_scope likely doesn't hold the guard flags.")

          # 4. Call certify() and check result
          print("\n=== gold_standard_certify() after cert_scope fix ===")
          result, code = rpc("gold_standard_certify")
          print(f"HTTP {code}: {result}")

          # 5. Final DoD check
          print("\n### SQL VERIFICATION")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          cert_rows, _ = rest_get("gold_standard_certifications", {
              "county_slug": "eq.orange",
              "select": "county_slug,certified,consecutive_gold,first_certified_at,last_verified_run,updated_at",
          })
          for r in cert_rows:
              print(json.dumps(r))
          sb_rows, _ = rest_get("gold_standard_scoreboard", {
              "county_slug": "eq.orange",
              "select": "county_slug,pass_count,gold_standard,critical_three_pass",
          })
          for r in sb_rows:
              print(json.dumps(r))
          print("\n=== DoD GATE ===")
          for row in cert_rows:
              certified  = row.get("certified", False)
              consec     = row.get("consecutive_gold", 0) or 0
              first_cert = row.get("first_certified_at")
              dod_pass   = bool(certified) and int(consec) >= 1 and first_cert is not None
              print(f"certified={certified}  consecutive_gold={consec}  first_certified_at={first_cert}")
              if dod_pass:
                  print("SHIPPED ✅")
              else:
                  guard_blocked = []
                  if isinstance(result, dict):
                      guard_blocked = result.get("guard_blocked", [])
                  print(f"FAIL — guard_blocked: {guard_blocked}")
          PYEOF
