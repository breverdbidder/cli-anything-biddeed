name: cliproxy probe — verify biddeed-cliproxy at 127.0.0.1:8317 as Anthropic API shim
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH + inspect cliproxy
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== A: container image + config ==="
          $SSH 'docker inspect biddeed-cliproxy 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)[0]
          print(\"Image:\", d[\"Config\"][\"Image\"])
          print(\"Cmd:\", d[\"Config\"][\"Cmd\"])
          print(\"Entrypoint:\", d[\"Config\"][\"Entrypoint\"])
          print(\"Env (non-empty, no values):\")
          for e in d[\"Config\"].get(\"Env\",[]):
              k = e.split(\"=\",1)[0]
              v = e.split(\"=\",1)[1] if \"=\" in e else \"\"
              if any(s in k.upper() for s in [\"KEY\",\"TOKEN\",\"SECRET\",\"PASS\"]):
                  print(f\"  {k}=<redacted,len={len(v)}>\")
              else:
                  print(f\"  {k}={v[:60]}\")
          print(\"Mounts:\")
          for m in d.get(\"Mounts\",[]):
              print(f\"  {m.get(\\\"Source\\\",\\\"?\\\")} -> {m.get(\\\"Destination\\\",\\\"?\\\")}\")
          "'

          echo
          echo "=== B: port mapping + health ==="
          $SSH 'docker ps --format "{{.Names}}: {{.Ports}} {{.Status}}" | grep cliproxy'
          $SSH 'curl -sS -o /dev/null -w "cliproxy /: %{http_code} (%{time_total}s)\n" -m 5 http://127.0.0.1:8317/' 
          $SSH 'curl -sS -o /dev/null -w "cliproxy /health: %{http_code}\n" -m 5 http://127.0.0.1:8317/health'
          $SSH 'curl -sS -o /dev/null -w "cliproxy /v1/messages: %{http_code}\n" -m 5 -X POST http://127.0.0.1:8317/v1/messages'

          echo
          echo "=== C: cliproxy config file (if mounted) ==="
          $SSH 'docker exec biddeed-cliproxy sh -c "find /app /config /root -name \"config.*\" -o -name \"*.yaml\" -o -name \"*.yml\" -o -name \"*.toml\" 2>/dev/null | head -10"' 2>&1 | head -20
          
          echo
          echo "=== D: Real Anthropic-format call to cliproxy ==="
          RESP=$($SSH "curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: dummy' \
            -H 'anthropic-version: 2023-06-01' \
            -d '{
              \"model\": \"claude-sonnet-4\",
              \"max_tokens\": 50,
              \"messages\": [{\"role\":\"user\",\"content\":\"Reply with only the word CLIPROXY_OK\"}]
            }' \
            -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500
          echo

          echo
          echo "=== E: try with claude -p using ANTHROPIC_BASE_URL ==="
          $SSH '
            export ANTHROPIC_BASE_URL=http://127.0.0.1:8317
            export ANTHROPIC_API_KEY=dummy-for-cliproxy
            claude -p "reply only CLAUDE_VIA_CLIPROXY_OK" --allowedTools Read 2>&1 | tail -20
          ' || echo "claude -p via cliproxy failed"

          echo "=== END ==="
