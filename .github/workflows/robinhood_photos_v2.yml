name: Robinhood Photos v2

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/robinhood_v2
          mkdir -p /tmp/robinhood_v2
          cd /tmp/robinhood_v2

          cat > scrape.py <<'PY'
          import asyncio, json, os, re, hashlib
          from pathlib import Path
          import urllib.request, urllib.error

          ADDR = "4087 Robinhood Dr Melbourne FL 32935"
          OUT = Path('/tmp/robinhood_v2')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          def http_get(url, timeout=15, headers=None):
              hdrs = {'User-Agent': UA}
              if headers: hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              return urllib.request.urlopen(req, timeout=timeout)

          # ===== 1) WAYBACK MACHINE — find archived snapshots =====
          def wayback_zillow():
              urls = set()
              snapshots = []
              try:
                  cdx_url = ("https://web.archive.org/cdx/search/cdx?"
                             "url=zillow.com/homedetails/4087-Robinhood*&output=json&limit=50")
                  with http_get(cdx_url, timeout=20) as r:
                      data = json.loads(r.read())
                  print(f"  Wayback CDX rows: {len(data)}", flush=True)
                  for row in data[1:]:  # skip header
                      ts = row[1]
                      orig = row[2]
                      snap = f"https://web.archive.org/web/{ts}/{orig}"
                      snapshots.append(snap)

                  # Try the most recent pre-2018 snapshot (closer to 2015 sale)
                  snapshots.sort()
                  for snap in snapshots[:6]:
                      try:
                          print(f"  Fetching: {snap[:100]}", flush=True)
                          with http_get(snap, timeout=25) as r:
                              html = r.read().decode('utf-8', errors='replace')
                          # Wayback rewrites image src to /web/{ts}im_/<orig> form
                          for pat in [
                              r'https://photos\.zillowstatic\.com/[^"\\\']+?\.jpg',
                              r'https://web\.archive\.org/web/\d+im_/https://photos\.zillowstatic\.com/[^"\\\']+?\.jpg',
                              r'/web/\d+/https://photos\.zillowstatic\.com/[^"\\\']+?\.jpg',
                          ]:
                              for u in re.findall(pat, html):
                                  if u.startswith('/web/'):
                                      u = 'https://web.archive.org' + u
                                  urls.add(u)
                      except Exception as e:
                          print(f"    snap err: {e}", flush=True)
              except Exception as e:
                  print(f"  Wayback CDX err: {e}", flush=True)
              print(f"  Wayback URLs: {len(urls)}", flush=True)
              return list(urls)

          def wayback_realtor():
              urls = set()
              try:
                  cdx_url = ("https://web.archive.org/cdx/search/cdx?"
                             "url=realtor.com/realestateandhomes-detail/4087-Robinhood*&output=json&limit=30")
                  with http_get(cdx_url, timeout=20) as r:
                      data = json.loads(r.read())
                  print(f"  Wayback Realtor CDX rows: {len(data)}", flush=True)
                  snaps = sorted([f"https://web.archive.org/web/{r[1]}/{r[2]}" for r in data[1:]])
                  for snap in snaps[:4]:
                      try:
                          with http_get(snap, timeout=25) as r:
                              html = r.read().decode('utf-8', errors='replace')
                          for pat in [
                              r'https://[a-z]+\.rdcpix\.com/[^"\\\']+?\.jpg',
                              r'https://web\.archive\.org/web/\d+im_/https://[a-z]+\.rdcpix\.com/[^"\\\']+?\.jpg',
                          ]:
                              for u in re.findall(pat, html):
                                  urls.add(u)
                      except Exception as e:
                          print(f"    snap err: {e}", flush=True)
              except Exception as e:
                  print(f"  Wayback Realtor err: {e}", flush=True)
              print(f"  Wayback Realtor URLs: {len(urls)}", flush=True)
              return list(urls)

          # ===== 2) BING IMAGE SEARCH (less bot-blocked than Google) =====
          async def bing_images(page):
              urls = set()
              try:
                  q = '"4087 Robinhood" Melbourne FL'
                  search_url = f"https://www.bing.com/images/search?q={q.replace(' ', '+').replace('\"', '%22')}&form=HDRSC2"
                  await page.goto(search_url, wait_until="domcontentloaded", timeout=30000)
                  await asyncio.sleep(3)
                  html = await page.content()
                  # Bing embeds image URLs in murl= attribute and m= JSON
                  for pat in [
                      r'"murl":"(https?://[^"]+?\.jpg)"',
                      r'"murl":"(https?://[^"]+?\.jpeg)"',
                      r'mediaurl=([^"&]+\.jpg)',
                  ]:
                      for u in re.findall(pat, html):
                          # bing url-encodes
                          import urllib.parse
                          u = urllib.parse.unquote(u)
                          urls.add(u)
                  print(f"  Bing URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Bing err: {e}", flush=True)
              return list(urls)

          # ===== 3) HOMES.COM (less protected, was indexed for nearby props) =====
          async def homes_dot_com(page):
              urls = set()
              try:
                  # Try the search URL pattern
                  await page.goto(
                      "https://www.homes.com/property/4087-robinhood-dr-melbourne-fl/",
                      wait_until="domcontentloaded", timeout=30000,
                  )
                  await asyncio.sleep(3)
                  html = await page.content()
                  Path('/tmp/robinhood_v2/homes_detail.html').write_text(html, errors='replace')
                  print(f"  Homes.com page: {len(html)} bytes", flush=True)
                  for pat in [
                      r'https://images\.homes\.com/[^"\\\']+?\.jpg',
                      r'https://[a-z0-9.\-]+homes\.com/[^"\\\']+?\.jpg',
                  ]:
                      for u in re.findall(pat, html):
                          urls.add(u)
                  print(f"  Homes.com URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Homes.com err: {e}", flush=True)
              return list(urls)

          # ===== 4) GOOGLE STREET VIEW (fallback - guaranteed front exterior) =====
          def streetview_metadata():
              return []

          
          # ===== 5) Try direct Zillow CDN with common patterns =====
          # Sister property 4097 had zpid 121941824. Pattern lookup: try ranges around that.

          async def main():
              from playwright.async_api import async_playwright
              all_urls = []

              print("=== Wayback: Zillow ===", flush=True)
              all_urls += wayback_zillow()

              print("\n=== Wayback: Realtor ===", flush=True)
              all_urls += wayback_realtor()

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                  )
                  page = await ctx.new_page()

                  print("\n=== Bing Images ===", flush=True)
                  all_urls += await bing_images(page)

                  print("\n=== Homes.com ===", flush=True)
                  all_urls += await homes_dot_com(page)

                  await browser.close()

              # Dedupe + filter
              uniq = list(dict.fromkeys(all_urls))
              # Filter to images that might be 4087 Robinhood specifically
              good = []
              for u in uniq:
                  ulow = u.lower()
                  if 'thumb' in ulow and 'large' not in ulow:
                      continue
                  if any(s in ulow for s in ['logo', 'icon', 'sprite', 'avatar', 'placeholder']):
                      continue
                  good.append(u)

              print(f"\n=== Total: {len(uniq)} unique, {len(good)} after filter ===", flush=True)
              for u in good[:50]:
                  print(f"  {u[:160]}", flush=True)

              # Download
              downloaded = []
              for i, url in enumerate(good[:30], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_robinhood_{h}.jpg"
                      fpath = OUT / fname
                      with http_get(url, timeout=20, headers={'Referer': 'https://www.zillow.com/'}) as r:
                          data = r.read()
                      if len(data) > 8000:  # min 8KB
                          fpath.write_bytes(data)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                          print(f"  [{i}] {len(data)} bytes -> {fname}", flush=True)
                      else:
                          print(f"  [{i}] too small {len(data)}", flush=True)
                  except Exception as e:
                      print(f"  [{i}] FAIL: {str(e)[:80]}", flush=True)

              with open(OUT / 'manifest.json', 'w') as f:
                  json.dump({'address': ADDR, 'all_urls_found': len(uniq), 'downloaded': downloaded}, f, indent=2)
              print(f"\n>>> Downloaded {len(downloaded)} photos", flush=True)

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/robinhood_v2/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/robinhood_v2/ /tmp/results/ || true
          ls -la /tmp/results/robinhood_v2/ 2>/dev/null || echo "no results"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos_v2
          path: /tmp/results/
          retention-days: 90
