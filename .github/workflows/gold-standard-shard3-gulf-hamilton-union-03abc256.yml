          SB_URL = os.environ['SUPABASE_URL']
          SB_KEY = os.environ['SUPABASE_KEY']
          DISPATCH_ID = os.environ['DISPATCH_ID']
          REST_H = {'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=30)

          def log_audit(county, letter, claim, evidence, survived):
              row = {
                  'dispatch_id': DISPATCH_ID,
                  'ultraloop_mode': 'fallback',
                  'county_slug': county,
                  'letter': letter,
                  'claim': claim,
                  'refuter_evidence': evidence,
                  'survived': survived,
              }
              r = client.post(f'{SB_URL}/rest/v1/gold_standard_ultraloop_audit',
                              headers={**REST_H, 'Prefer': 'return=representation'},
                              json=row)
              if r.status_code in (200, 201):
                  result = r.json()
                  iid = result[0].get('id') if result else '?'
                  print(f'  LOG OK id={iid}: {county}/{letter} survived={survived}')
              else:
                  print(f'  LOG FAIL HTTP {r.status_code}: {r.text[:200]}')

          print('=== LOGGING ULTRALOOP AUDIT ROWS ===')

          # gulf — all passing letters (A,B,C,D,E,F,G,H,J confirmed PASS; I=85.7% confirmed FAIL)
          # The Port St Joe zoning block is a confirmed dead end (4+ independent sessions)
          log_audit('gulf', 'I',
              'I=85.7% (12/14). Parcels 05762000R/05004050R remain in Port St Joe city limits with no '
              'georeferenced zoning map. Confirmed dead end across 4+ independent sessions (dispatches '
              '1a211136, 0ba2502a, and others). ZoneAtlas FLU layer covers rural parcels only. '
              'No new lever found. 3 parcel-null rows (232019CA/232024CA/232024CC) have no parcel_id '
              'to look up. This session re-confirmed all prior findings.',
              {
                  'type': 'dead_end_confirmation',
                  'sessions_checked': 4,
                  'dead_end_details': 'Port St Joe static zoning PDF, no georeferencing; ArcGIS FLU layer is Future Land Use not zoning',
                  'parcel_null_rows': 3,
                  'latest_dispatch': '0ba2502a (2026-07-30)',
                  'honesty_tag': 'VERIFIED',
              },
              True)  # survived=True (correctly reporting as still FAIL, no overclaim)

          # hamilton — passing letters A,B,E,F,G,H,J confirmed PASS; C,D=61.9% confirmed FAIL; I=95.2% PASS
          log_audit('hamilton', 'I',
              'I=95.2% (20/21). Parcel 8282-000 (case 2023-CA-41) inside Town of White Springs municipal '
              'limits, outside county ZoneAtlas coverage. Prior session (0d016197, 2026-07-31) independently '
              'confirmed: ZoneAtlas returns CITY LIMITS placeholder, not a real zone code. This session '
              'researched Town of White Springs municipal zoning codes via Municode, AmLegal, town website. '
              'White Springs has no online code portal found. Parcel remains correctly unlinked. I PASSES at 95.2% '
              'despite this 1 residual row (20/21 >= 95% threshold).',
              {
                  'type': 'pass_with_residual',
                  'metric': 95.2,
                  'card_complete': '20 of 21',
                  'residual_parcel': '8282-000',
                  'residual_case': '2023-CA-41',
                  'residual_reason': 'White Springs municipal limits, outside county ZoneAtlas',
                  'threshold': 95.0,
                  'passes': True,
                  'honesty_tag': 'VERIFIED',
              },
              True)

          log_audit('hamilton', 'C',
              'C=61.9% (13/21). 8 rows genuinely blocked at source. 3 unpublished TD certs '
              '(HAM-TD-CERT-379/597/599, Dec 2025 sale). 5 FC cases absent/date-conflicted '
              '(2024-CA-19, 2023-CA-41, 2025-CA-37, 2021-CA-46, 2025-CA-66). OCRS has no '
              'case-number search. hamiltonclerk.com/official-record-search/ supports instrument/party/book only. '
              'hamiltonclerk.com live-checked this session. No new outcomes published.',
              {
                  'type': 'dead_end_confirmation',
                  'blocked_rows': 8,
                  'blocked_td_certs': ['HAM-TD-CERT-379', 'HAM-TD-CERT-597', 'HAM-TD-CERT-599'],
                  'blocked_fc_cases': ['2024-CA-19', '2023-CA-41', '2025-CA-37', '2021-CA-46', '2025-CA-66'],
                  'levers_exhausted': ['hamiltonclerk.com', 'OCRS', 'MyFloridaCounty', 'official-record-search'],
                  'honesty_tag': 'VERIFIED',
              },
              True)

          log_audit('hamilton', 'D',
              'D=61.9% (13/21). Same 8 rows as C — D tracks parity_any, which equals parity_clean for Hamilton '
              'since no partial-match tier exists. Same dead end conclusion as C.',
              {
                  'type': 'dead_end_confirmation',
                  'same_as': 'C',
                  'honesty_tag': 'VERIFIED',
              },
              True)

          # union — B/F null (no closed auctions)
          log_audit('union', 'B',
              'B=null. Union has 3 auctions total. 1 redeemed cert (UNION-TD-CERT223, 2026-03-12). '
              '2 upcoming: 63-2025-CA-0053 due 2026-08-13, 63-2024-CA-0047 due 2026-10-15. '
              'Today is 2026-08-03. 2026-08-13 is 10 days away — no closed sale to verify yet. '
