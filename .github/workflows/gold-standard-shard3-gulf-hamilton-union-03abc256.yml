name: "Gold Standard SHARD-3: gulf/hamilton/union — dispatch 03abc256"

# Session: 2026-08-03T08:00Z
# Dispatch: 03abc256-a5ba-4078-b41f-b7f730a50901
# Targets:
#   gulf: I=85.7% (12/14, Port St Joe blocked), need 95%+
#   hamilton: C/D=61.9% (8 rows blocked), I=95.2% (1 row: 8282-000 White Springs)
#   union: B/F=null (check if 2026-08-13 auction closed)

on:
  workflow_dispatch:

concurrency:
  group: gold-standard-03abc256
  cancel-in-progress: false

jobs:
  baseline-and-diagnose:
    name: "Step 1: Baseline Evaluations + Diagnostics"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DISPATCH_ID: "03abc256-a5ba-4078-b41f-b7f730a50901"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: "Baseline evaluations (gulf, hamilton, union)"
        id: baseline
        run: |
          python3 -c "
          import os, json, httpx

          TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=60)

          print('=== BASELINE EVALUATIONS (2026-08-03T08:00Z) ===')
          before = {}
          for county in ('gulf', 'hamilton', 'union'):
              r = client.post(URL, headers=H, json={'query': f\"SELECT public.pencil_dod_evaluate_county('{county}');\"})
              data = r.json()
              if data and isinstance(data, list) and data[0]:
                  result = list(data[0].values())[0] if isinstance(data[0], dict) else {}
                  before[county] = result
                  passes = sum(1 for k, v in result.items()
                               if k not in ('county', 'auctions_total') and isinstance(v, dict) and v.get('pass'))
                  total = sum(1 for k, v in result.items()
                              if k not in ('county', 'auctions_total') and isinstance(v, dict))
                  fails = [f\"{k}={v.get('metric','?')}\" for k, v in result.items()
                           if k not in ('county', 'auctions_total') and isinstance(v, dict) and not v.get('pass')]
                  print(f'{county}: {passes}/{total} | FAILING: {fails}')
                  print(f'  {json.dumps(result)}')
              else:
                  print(f'{county}: ERROR {r.status_code} {r.text[:200]}')

          print()
          print('=== RAW JSON (for session report) ===')
          for county, result in before.items():
              print(f'{county}: {json.dumps(result)}')
          " 2>&1

      - name: "hamilton I diagnosis — parcel 8282-000 (2023-CA-41, White Springs)"
        id: hamilton-i-diag
        run: |
          python3 -c "
          import os, json, httpx

          TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}
          SB_URL = os.environ['SUPABASE_URL']
          SB_KEY = os.environ['SUPABASE_KEY']
          REST_H = {'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=60)

          print('=== HAMILTON I — 2023-CA-41 (parcel 8282-000) DIAGNOSIS ===')

          # Get the current state of this auction
          r = client.get(f'{SB_URL}/rest/v1/multi_county_auctions',
                         headers=REST_H,
                         params={'county': 'eq.hamilton', 'case_number': 'eq.2023-CA-41',
                                 'select': 'case_number,parcel_id,property_address,latitude,longitude,po_latitude,assessed_value,market_value,auction_date,status'})
          print('MCA row:', r.text[:500])

          # Check parcel_zones for 8282-000
          r2 = client.get(f'{SB_URL}/rest/v1/parcel_zones',
                          headers=REST_H,
                          params={'parcel_id': 'eq.8282000', 'select': 'parcel_id,zone_code,jurisdiction_id'})
          print('parcel_zones (dashes stripped):', r2.text[:500])

          r3 = client.get(f'{SB_URL}/rest/v1/parcel_zones',
                          headers=REST_H,
                          params={'parcel_id': 'eq.8282-000', 'select': 'parcel_id,zone_code,jurisdiction_id'})
          print('parcel_zones (with dashes):', r3.text[:500])

          # Check fl_parcels for this parcel
          r4 = client.post(URL, headers=H,
                           json={'query': \"SELECT parcel_id, phy_addr1, phy_city, phy_zipcd, jv, centroid_lat, centroid_lng, dor_uc FROM fl_parcels WHERE co_no=34 AND parcel_id='8282000' LIMIT 5;\"})
          print('fl_parcels:', r4.text[:500])

          # Check jurisdictions for Hamilton
          r5 = client.post(URL, headers=H,
                           json={'query': \"SELECT id, name, county_name FROM jurisdictions WHERE county_name ILIKE '%hamilton%' ORDER BY name;\"})
          print('Hamilton jurisdictions:', r5.text[:1000])

          # Check what zoning districts exist for White Springs / Hamilton
          r6 = client.post(URL, headers=H,
                           json={'query': \"SELECT zd.id, zd.code, zd.name, zd.jurisdiction_id, j.name as jname FROM zoning_districts zd JOIN jurisdictions j ON j.id=zd.jurisdiction_id WHERE j.county_name ILIKE '%hamilton%' ORDER BY j.name, zd.code;\"})
          print('Hamilton zoning districts:', r6.text[:2000])

          # Check if any existing parcels near 8282-000 in White Springs have parcel_zones
          r7 = client.post(URL, headers=H,
                           json={'query': \"SELECT pz.parcel_id, pz.zone_code, pz.jurisdiction_id, fp.phy_city FROM parcel_zones pz JOIN fl_parcels fp ON fp.parcel_id=pz.parcel_id AND fp.co_no=34 WHERE fp.phy_city ILIKE '%white springs%' LIMIT 10;\"})
          print('White Springs parcel_zones:', r7.text[:1000])
          " 2>&1

      - name: "union auction status — check if 63-2025-CA-0053 closed"
        id: union-check
        run: |
          python3 -c "
          import os, json, httpx, urllib.request, urllib.parse, urllib.error
          from datetime import datetime, timezone

          TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}
          SB_URL = os.environ['SUPABASE_URL']
          SB_KEY = os.environ['SUPABASE_KEY']
          REST_H = {'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=60)

          print('=== UNION AUCTION STATUS CHECK (2026-08-03) ===')
          print('Today: 2026-08-03. Earliest close: 2026-08-13. Still 10 days away.')
          print()

          r = client.get(f'{SB_URL}/rest/v1/multi_county_auctions',
                         headers=REST_H,
                         params={'county': 'eq.union',
                                 'select': 'case_number,auction_date,status,parity_status,winning_bid,verified_outcome',
                                 'order': 'auction_date.asc'})
          auctions = r.json() if r.status_code == 200 else []
          print(f'Union auctions ({len(auctions)} total):')
          for a in auctions:
              print(f'  {a}')

          # Check for any outcomes
          r2 = client.get(f'{SB_URL}/rest/v1/foreclosure_outcomes',
                          headers=REST_H,
                          params={'county': 'eq.union', 'select': 'case_number,winning_bid,data_source,created_at'})
          fo = r2.json() if r2.status_code == 200 else []
          r3 = client.get(f'{SB_URL}/rest/v1/tax_deed_outcomes',
                          headers=REST_H,
                          params={'county': 'eq.union', 'select': 'case_number,winning_bid,data_source,created_at'})
          td = r3.json() if r3.status_code == 200 else []
          print(f'Union foreclosure_outcomes: {len(fo)} rows: {fo}')
          print(f'Union tax_deed_outcomes: {len(td)} rows: {td}')

          # Look at union county configuration
          r4 = client.post(URL, headers=H,
                           json={'query': \"SELECT county_slug, foreclosure_url, foreclosure_platform, tax_deed_url, tax_deed_platform FROM pipeline.counties WHERE county_slug='union' LIMIT 1;\"})
          print('Union pipeline config:', r4.text[:500])

          print()
          print('CONCLUSION: B/F cannot move until 2026-08-13 at earliest (10 days away).')
          print('No action needed this session for union B/F.')
          " 2>&1

      - name: "hamilton C/D — check hamiltonclerk.com for new data"
        id: hamilton-cd-check
        run: |
          python3 -c "
          import os, json, httpx
          from datetime import datetime, timezone

          SB_URL = os.environ['SUPABASE_URL']
          SB_KEY = os.environ['SUPABASE_KEY']
          REST_H = {'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=30)

          print('=== HAMILTON C/D — UNMATCHED ROW STATUS ===')
          r = client.get(f'{SB_URL}/rest/v1/multi_county_auctions',
                         headers=REST_H,
                         params={'county': 'eq.hamilton',
                                 'select': 'case_number,auction_date,parity_status,parity_source,status,winning_bid',
                                 'order': 'case_number.asc'})
          rows = r.json() if r.status_code == 200 else []
          unmatched = [row for row in rows if row.get('parity_status') != 'matched_clean']
          matched = [row for row in rows if row.get('parity_status') == 'matched_clean']
          print(f'Total: {len(rows)} | Matched: {len(matched)} | Unmatched: {len(unmatched)}')
          print()
          print('UNMATCHED rows (C/D gap):')
          for row in unmatched:
              print(f'  {row}')
          print()
          # Probe hamiltonclerk.com for the 3 unpublished TD certs
          print('=== LIVE HAMILTON CLERK CHECK ===')
          try:
              r2 = client.get('https://hamiltonclerk.com/tax-deeds/', timeout=15,
                              headers={'User-Agent': 'Mozilla/5.0 (compatible; BidDeed Gold Standard Audit)'})
              print(f'hamiltonclerk.com/tax-deeds/ HTTP {r2.status_code}')
              if r2.status_code == 200:
                  # Check for our 3 unpublished cert numbers
                  for cert in ['379', '597', '599']:
                      if f'CERT-{cert}' in r2.text or f'Cert {cert}' in r2.text or f'cert {cert}' in r2.text:
                          print(f'  FOUND reference to cert {cert} in page!')
                      else:
                          # Try to check if the parcel IDs appear
                          pass
                  # Check for date annotations near the Dec 2025 certs
                  if 'REDEEMED' in r2.text.upper() or 'SOLD' in r2.text.upper():
                      import re
                      # Look for REDEEMED/SOLD annotations near Dec 2025
                      matches = re.findall(r'.{100}(REDEEMED|SOLD).{100}', r2.text, re.IGNORECASE)
                      for m in matches[:5]:
                          print(f'  Found annotation: {m[:200]}')
                  # Quick check for 2025-CA-66 date resolution
                  if '2025-CA-66' in r2.text or 'CA-66' in r2.text:
                      import re
                      idx = r2.text.find('66')
                      print(f'  Context around CA-66: {r2.text[max(0,idx-200):idx+500]}')
          except Exception as e:
              print(f'hamiltonclerk.com fetch failed: {e}')

          # Check hamiltonclerk.com/foreclosures/
          try:
              r3 = client.get('https://hamiltonclerk.com/foreclosures/', timeout=15,
                              headers={'User-Agent': 'Mozilla/5.0 (compatible; BidDeed Gold Standard Audit)'})
              print(f'hamiltonclerk.com/foreclosures/ HTTP {r3.status_code}')
              if r3.status_code == 200:
                  # Check for our 5 missing FC cases
                  missing_cases = ['2024-CA-19', '2023-CA-41', '2025-CA-37', '2021-CA-46', '2025-CA-66']
                  for case in missing_cases:
                      case_short = case.split('-CA-')[1]
                      if case in r3.text or f'CA-{case_short}' in r3.text:
                          print(f'  FOUND: {case} on foreclosures page!')
                          import re
                          idx = r3.text.find(case_short)
                          print(f'  Context: {r3.text[max(0,idx-300):idx+500]}')
                      else:
                          print(f'  NOT FOUND: {case}')
          except Exception as e:
              print(f'hamiltonclerk.com/foreclosures/ fetch failed: {e}')
          " 2>&1

  hamilton-i-whitespings-research:
    name: "Step 2: Hamilton I — Town of White Springs zoning research"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: baseline-and-diagnose
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: "Research White Springs municipal zoning"
        id: white-springs-research
        run: |
          python3 -c "
          import os, json, httpx, re

          client = httpx.Client(timeout=30, follow_redirects=True,
                                headers={'User-Agent': 'Mozilla/5.0 (compatible; BidDeed Gold Standard Audit)'})
          TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}

          print('=== WHITE SPRINGS MUNICIPAL ZONING RESEARCH ===')
          print('Parcel 8282-000 (case 2023-CA-41) is inside Town of White Springs.')
          print('County ZoneAtlas coverage ends at municipal limits.')
          print()

          # White Springs coordinates from fl_parcels centroid
          # (8282-000 in White Springs, Hamilton County)
          # White Springs is a small town in Hamilton County, FL
          # Population ~750, on Suwannee River

          # Try White Springs official town site
          urls_to_try = [
              'https://townofwhitesprings.com',
              'https://www.townofwhitesprings.com',
              'https://whitesprings.org',
              'http://townofwhitesprings.com',
          ]
          for u in urls_to_try:
              try:
                  r = client.get(u, timeout=10)
                  print(f'{u}: HTTP {r.status_code} ({len(r.text)} bytes)')
                  if r.status_code == 200 and ('zoning' in r.text.lower() or 'planning' in r.text.lower() or 'code' in r.text.lower()):
                      print(f'  HAS zoning/planning/code content!')
                      # Find relevant links
                      links = re.findall(r'href=[\"\'](.*?zoning.*?|.*?planning.*?|.*?ordinance.*?)[\"\'']', r.text, re.IGNORECASE)
                      print(f'  Relevant links: {links[:5]}')
              except Exception as e:
                  print(f'{u}: {type(e).__name__}: {e}')

          # Try Municode for White Springs
          municode_urls = [
              'https://library.municode.com/fl/white_springs',
              'https://library.municode.com/fl/white%20springs',
              'https://www.municode.com/library/fl/white_springs',
          ]
          for u in municode_urls:
              try:
                  r = client.get(u, timeout=10)
                  print(f'{u}: HTTP {r.status_code}')
                  if r.status_code == 200:
                      if 'zoning' in r.text.lower():
                          print(f'  HAS zoning content - {len(r.text)} bytes')
              except Exception as e:
                  print(f'{u}: {e}')

          # Try FL Dept of Commerce / local government website lookup
          fl_govt_url = 'https://floridajobs.org/community-planning-and-development/technical-assistance/local-government-resources/comprehensive-plan-database'
          try:
              r = client.get(fl_govt_url, timeout=10)
              print(f'FL Govt: HTTP {r.status_code}')
          except Exception as e:
              print(f'FL Govt: {e}')

          # Try ArcGIS online search for White Springs
          arcgis_url = 'https://www.arcgis.com/sharing/rest/search?q=white+springs+florida+zoning&num=5&f=json'
          try:
              r = client.get(arcgis_url, timeout=10)
              print(f'ArcGIS search: HTTP {r.status_code}')
              if r.status_code == 200:
                  data = r.json()
                  for item in data.get('results', [])[:3]:
                      print(f'  ArcGIS item: {item.get(\"title\",\"?\")} | {item.get(\"url\",\"?\")}')
          except Exception as e:
              print(f'ArcGIS: {e}')

          # Try Hamilton County GIS which might include municipal data
          hamilton_gis_urls = [
              'https://arcgis.hamiltoncountyfl.com/arcgis/rest/services',
              'https://gis.hamiltoncountyfl.com/arcgis/rest/services',
              'https://arcgis5.roktech.net/arcgis/rest/services/hamilton',
          ]
          for u in hamilton_gis_urls:
              try:
                  r = client.get(f'{u}?f=json', timeout=10)
                  print(f'{u}: HTTP {r.status_code}')
                  if r.status_code == 200:
                      data = r.json()
                      print(f'  Services: {[s.get(\"name\") for s in data.get(\"services\", [])[:5]]}')
              except Exception as e:
                  print(f'{u}: {type(e).__name__}: {e}')

          # Direct lookup of parcel 8282-000 centroid on Hamilton ZoneAtlas
          print()
          print('=== HAMILTON ZONEATLAS ArcGIS QUERY FOR 8282-000 ===')
          # First get centroid from fl_parcels
          r_centroid = httpx.post(URL, headers=H,
                                  json={'query': \"SELECT centroid_lat, centroid_lng, phy_addr1, phy_city, phy_zipcd, jv, dor_uc FROM fl_parcels WHERE co_no=34 AND parcel_id='8282000' LIMIT 1;\"},
                                  timeout=30)
          print(f'fl_parcels query: HTTP {r_centroid.status_code}')
          centroid_data = r_centroid.json()
          print(f'Centroid data: {json.dumps(centroid_data)}')

          if centroid_data and isinstance(centroid_data, list) and centroid_data[0]:
              row = centroid_data[0]
              lat = row.get('centroid_lat')
              lng = row.get('centroid_lng')
              print(f'Coordinates: lat={lat}, lng={lng}')
              if lat and lng:
                  # Query Hamilton ZoneAtlas with these coords
                  zoneatlas_url = (
                      'https://arcgis5.roktech.net/arcgis/rest/services/hamilton/ZoneAtlas/MapServer/0/query'
                      f'?geometry={lng},{lat}&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects'
                      '&outFields=ZONE,JURISDICTION,PARCEL_ID&f=json&returnGeometry=false&inSR=4326&outSR=4326'
                  )
                  try:
                      rz = client.get(zoneatlas_url, timeout=15)
                      print(f'ZoneAtlas query: HTTP {rz.status_code}')
                      print(f'ZoneAtlas response: {rz.text[:1000]}')
                  except Exception as e:
                      print(f'ZoneAtlas query failed: {e}')

                  # Also try the county GIS city limits layer to confirm it is in White Springs
                  # From prior session: layer 7 = City Limits on Gulf GIS
                  # For Hamilton, try layers
                  for layer_id in [0, 1, 2, 3, 4, 5]:
                      city_url = (
                          f'https://arcgis5.roktech.net/arcgis/rest/services/hamilton/ZoneAtlas/MapServer/{layer_id}/query'
                          f'?geometry={lng},{lat}&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects'
                          f'&outFields=*&f=json&returnGeometry=false&inSR=4326'
                      )
                      try:
                          rc = client.get(city_url, timeout=10)
                          if rc.status_code == 200:
                              rdata = rc.json()
                              features = rdata.get('features', [])
                              if features:
                                  print(f'Layer {layer_id}: {len(features)} features: {json.dumps(features[0])}')
                      except Exception:
                          pass
          " 2>&1

      - name: "Try White Springs Municode and FL Statute lookup"
        run: |
          python3 -c "
          import os, json, httpx, re

          client = httpx.Client(timeout=20, follow_redirects=True,
                                headers={'User-Agent': 'Mozilla/5.0 (compatible; BidDeed Gold Standard Audit)'})

          print('=== WHITE SPRINGS ZONING CODE RESEARCH ===')

          # White Springs town code might be on Municode - let's search
          search_urls = [
              'https://library.municode.com/fl/white_springs/codes/code_of_ordinances',
              'https://library.municode.com/fl/white_springs',
          ]
          for u in search_urls:
              try:
                  r = client.get(u, timeout=15)
                  print(f'{u}: HTTP {r.status_code} ({len(r.text)} bytes)')
                  if r.status_code == 200:
                      # Extract chapter/title links
                      links = re.findall(r'href=[\"\'](/.*?)[\"\']\s*>([^<]*(?:zoning|land|planning|develop)[^<]*)', r.text, re.IGNORECASE)
                      print(f'  Zoning links: {links[:5]}')
              except Exception as e:
                  print(f'{u}: {e}')

          # Try American Legal (another codification service)
          al_url = 'https://www.amlegal.com/codes/client/white-springs_fl/'
          try:
              r = client.get(al_url, timeout=10)
              print(f'AmLegal: HTTP {r.status_code}')
          except Exception as e:
              print(f'AmLegal: {e}')

          # Try Code Publishing
          cp_urls = [
              'https://www.codepublishing.com/FL/WhiteSprings',
              'https://www.codepublishing.com/FL/White-Springs',
          ]
          for u in cp_urls:
              try:
                  r = client.get(u, timeout=10)
                  print(f'{u}: HTTP {r.status_code}')
              except Exception as e:
                  print(f'{u}: {e}')

          # Search for White Springs zoning on Firecrawl API - NO, Firecrawl key is in secrets
          # Instead try direct Google-style approach to known FL municipal code portals

          # Try Hamilton County property appraiser for parcel 8282-000
          # Hamilton Co Property Appraiser: hcpaf.com or similar
          pa_urls = [
              'https://qpublic.schneidercorp.com/Application.aspx?AppID=947&LayerID=19813&PageTypeID=4&PageID=10280&Q=855882697&KeyValue=3478450',
              'https://hcpaf.com',
              'https://www.hcpaf.com',
          ]
          for u in pa_urls[:2]:
              try:
                  r = client.get(u, timeout=10)
                  print(f'{u}: HTTP {r.status_code}')
              except Exception as e:
                  print(f'{u}: {e}')

          # Directly check the Hamilton County property appraiser's parcel search
          # for parcel 8282-000 to get its current classification
          pa_query_url = 'https://qpublic.schneidercorp.com/Application.aspx?AppID=947&LayerID=19813&PageTypeID=4&PageID=10280&KeyValue=8282000'
          try:
              r = client.get(pa_query_url, timeout=10)
              print(f'HCPA parcel lookup: HTTP {r.status_code}')
              if r.status_code == 200:
                  # Look for zoning info
                  zoning_match = re.search(r'(?:zon|use.?code|classification)[^<]*<[^>]+>([^<]+)', r.text, re.IGNORECASE)
                  if zoning_match:
                      print(f'  Possible zoning: {zoning_match.group(1)}')
          except Exception as e:
              print(f'HCPA: {e}')
          " 2>&1

  log-ultraloop-audit:
    name: "Step 3: Log Ultraloop Audit Rows"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hamilton-i-whitespings-research
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DISPATCH_ID: "03abc256-a5ba-4078-b41f-b7f730a50901"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
