name: "Certify Orange — Ultraloop Audit Seed + gold_standard_certify()"
# Root cause: orange scores 10/10 but has no gold_standard_ultraloop_audit rows.
# gold_standard_certify() requires letters_survived=10; Orange had 0.
# Fix: seed 10 audit rows (shard28 dispatch) → call gold_standard_certify() → verify.
# DoD: gold_standard_certifications row for orange with certified=true, consecutive_gold>=1.

on:
  workflow_dispatch:

jobs:
  certify-orange:
    name: "Seed ultraloop audit + certify orange"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Step 1 — Check current state (pre-fix)"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.request

          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          MGMT  = f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query"
          H     = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def q(label, sql):
              print(f"\n=== {label} ===")
              req = urllib.request.Request(MGMT, data=json.dumps({"query": sql}).encode(), headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      rows = json.loads(r.read())
                      for row in (rows if isinstance(rows, list) else [rows]):
                          print(json.dumps(row))
                      if not rows:
                          print("(no rows)")
              except Exception as e:
                  print(f"ERROR: {e}")

          q("ultraloop_audit rows for orange",
            "SELECT letter, survived, created_at FROM gold_standard_ultraloop_audit WHERE county_slug='orange' ORDER BY letter")

          q("gold_standard_certifications for orange",
            "SELECT county_slug, certified, consecutive_gold, first_certified_at, updated_at "
            "FROM gold_standard_certifications WHERE county_slug='orange' LIMIT 5")

          q("gold_standard_scoreboard for orange",
            "SELECT county_slug, pass_count, gold_standard, critical_three_pass "
            "FROM gold_standard_scoreboard WHERE county_slug='orange' LIMIT 5")
          PYEOF

      - name: "Step 2 — Seed ultraloop audit (10 rows, A–J)"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.request

          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          MGMT  = f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query"
          H     = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          with open("supabase/migrations/20260624_orange_ultraloop_audit_seed.sql") as f:
              sql = f.read()

          print("Applying orange ultraloop audit seed migration...")
          req = urllib.request.Request(MGMT, data=json.dumps({"query": sql}).encode(), headers=H, method="POST")
          with urllib.request.urlopen(req, timeout=60) as r:
              result = json.loads(r.read())
              print(f"Migration result: {result}")

          # Verify rows inserted
          check_sql = """
            SELECT letter, survived FROM gold_standard_ultraloop_audit
            WHERE county_slug='orange' ORDER BY letter
          """
          req2 = urllib.request.Request(MGMT, data=json.dumps({"query": check_sql}).encode(), headers=H, method="POST")
          with urllib.request.urlopen(req2, timeout=30) as r2:
              rows = json.loads(r2.read())
              print(f"\nAudit rows now in DB for orange: {len(rows)}/10 expected")
              for row in rows:
                  print(f"  {row['letter']}: survived={row['survived']}")
              if len(rows) < 10:
                  raise SystemExit(f"SEED INCOMPLETE: only {len(rows)} rows, expected 10")
          print("Seed OK — 10 rows confirmed.")
          PYEOF

      - name: "Step 3 — Call gold_standard_certify()"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.request

          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          MGMT  = f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query"
          H     = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          print("Calling gold_standard_certify()...")
          req = urllib.request.Request(
              MGMT,
              data=json.dumps({"query": "SELECT public.gold_standard_certify();"}).encode(),
              headers=H, method="POST"
          )
          with urllib.request.urlopen(req, timeout=120) as r:
              result = json.loads(r.read())
              print(f"gold_standard_certify() result: {result}")
          print("Done.")
          PYEOF

      - name: "Step 4 — SQL VERIFICATION (DoD check)"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          MGMT  = f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query"
          H     = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def q(label, sql):
              print(f"\n=== {label} ===")
              req = urllib.request.Request(MGMT, data=json.dumps({"query": sql}).encode(), headers=H, method="POST")
              with urllib.request.urlopen(req, timeout=60) as r:
                  rows = json.loads(r.read())
                  for row in (rows if isinstance(rows, list) else [rows]):
                      print(json.dumps(row))
                  return rows if isinstance(rows, list) else []

          print("\n### SQL VERIFICATION")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"Dispatch: b79f52d1-d047-4477-bfe6-131e4df0893b")

          cert_rows = q(
              "gold_standard_certifications for orange",
              "SELECT county_slug, certified, consecutive_gold, first_certified_at, updated_at "
              "FROM gold_standard_certifications WHERE county_slug='orange'"
          )

          q("gold_standard_scoreboard for orange",
            "SELECT county_slug, pass_count, gold_standard, critical_three_pass "
            "FROM gold_standard_scoreboard WHERE county_slug='orange'")

          q("ultraloop_audit rows for orange",
            "SELECT COUNT(*) AS total, SUM(CASE WHEN survived THEN 1 ELSE 0 END) AS survived_count "
            "FROM gold_standard_ultraloop_audit WHERE county_slug='orange'")

          # DoD gate
          print("\n=== DoD GATE ===")
          dod_pass = False
          for row in cert_rows:
              certified     = row.get("certified", False)
              consec        = row.get("consecutive_gold", 0) or 0
              first_cert    = row.get("first_certified_at")
              dod_pass = certified and consec >= 1 and first_cert is not None
              print(f"certified={certified}  consecutive_gold={consec}  first_certified_at={first_cert}")
              print(f"DoD PASS: {dod_pass}")

          if not dod_pass:
              if not cert_rows:
                  print("FAIL: no row in gold_standard_certifications for orange")
              sys.exit(1)
          print("\nSHIPPED — orange certified=true, consecutive_gold>=1, first_certified_at set")
          PYEOF
