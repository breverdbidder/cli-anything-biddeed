name: "SHARD-6 Taylor County Daily Scrape"
# Wires scripts/shard6_taylor_scraper.py to a schedule. Mirrors the dixie
# pattern (shard6-dixie-daily-scrape.yml) — code that is not SCHEDULED is
# dead code per the WIRING MANDATE.
#
# Taylor County has no online auction platform: taylor.realforeclose.com
# and taylor.realtaxdeed.com both 302-redirect to realauction.com, and
# taylor.realtdm.com (tax deed case management, TEST env) returns zero
# cases under every filter combination (confirmed 2026-07-10). Real data
# comes from taylorclerk.com's structured foreclosure-sales/tax-deeds
# department pages — this scrapes both live, no synthetic fallback.

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: shard6-taylor-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: "Taylor County Clerk Scraper (taylorclerk.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx beautifulsoup4

      - name: Run Taylor clerk scraper
        run: |
          set -euo pipefail
          python3 scripts/shard6_taylor_scraper.py 2>&1 | tee /tmp/taylor_scrape.log

      - name: Post summary
        if: always()
        run: |
          echo "## SHARD-6 Taylor County Daily Scrape" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/taylor_scrape.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
