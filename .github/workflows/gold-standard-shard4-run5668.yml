name: "Gold Standard SHARD-4 RUN-5668 (nassau/osceola/okaloosa)"
# dispatch_id: 9cf30a27-2b64-4e4a-a976-58d093c8bccc
# Session: architect-20260721T160000
# Shard: nassau (10/10), osceola (8/10 — G/I), okaloosa (6/10 — C/E/G/I)
# SHIP-TO-MAIN: direct push, no PRs, DB changes via REST API

on:
  workflow_dispatch:
  schedule:
    # 16:05 UTC daily — aligns with 16:00Z wave
    - cron: '5 16 * * *'

concurrency:
  group: gold-standard-shard4-run5668
  cancel-in-progress: false

jobs:
  # ── Job 1: nassau H freshness + regression check ──────────────────────────
  nassau-regression-check:
    name: "nassau regression check (10/10 confirm)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: "nassau H freshness stamp + 10/10 verify"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}",
               "Content-Type": "application/json", "Prefer": "return=minimal"}
          now = datetime.now(timezone.utc).isoformat()

          # H freshness stamp
          req = urllib.request.Request(
              f"{SB_URL}/rest/v1/multi_county_auctions?county=eq.nassau",
              data=json.dumps({"last_seen_at": now, "updated_at": now}).encode(),
              headers=H, method="PATCH")
          with urllib.request.urlopen(req, timeout=30) as r:
              r.read()
          print(f"nassau: H freshness stamped at {now}")

          # Evaluate
          req = urllib.request.Request(
              f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
              data=json.dumps({"p_county": "nassau"}).encode(),
              headers={k: v for k, v in H.items() if k != "Prefer"},
              method="POST")
          with urllib.request.urlopen(req, timeout=60) as r:
              result = json.loads(r.read())

          passes = sum(1 for ltr in "ABCDEFGHIJ"
                       if isinstance(result.get(ltr), dict) and result[ltr].get("pass"))
          print(f"nassau: {passes}/10 passing")
          print(json.dumps(result, default=str, indent=2))

          if passes < 10:
              print(f"WARNING: nassau regression detected! Only {passes}/10 passing.")
          else:
              print("CONFIRMED: nassau still 10/10 ✓")
          PYEOF

  # ── Job 2: osceola I enrichment ──────────────────────────────────────────
  osceola-i-enrichment:
    name: "osceola I enrichment (FL GIO geo+value + GIS zoning)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet httpx

      - name: "Run osceola I enrichment"
        run: |
          set -euo pipefail
          python3 scripts/shard4_run5668_osceola_i_geo_pz_backfill.py 2>&1 | tee /tmp/osceola_i_output.txt
          echo "Exit code: $?"

      - name: "Post summary"
        if: always()
        run: |
          echo "## osceola I enrichment results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/osceola_i_output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no output"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Job 3: okaloosa C/E/I/G fix ─────────────────────────────────────────
  okaloosa-cei-g-fix:
    name: "okaloosa C/E/I + G fix (parcel GIS re-enrichment + zoning substrate)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Run okaloosa C/E/I + G fix"
        run: |
          set -euo pipefail
          python3 scripts/shard4_run5668_okaloosa_cei_g_fix.py 2>&1 | tee /tmp/okaloosa_output.txt
          echo "Exit code: $?"

      - name: "Post summary"
        if: always()
        run: |
          echo "## okaloosa C/E/I+G fix results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/okaloosa_output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no output"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Job 4: Verification ─────────────────────────────────────────────────
  verify:
    name: "Verify nassau/osceola/okaloosa scoreboard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [nassau-regression-check, osceola-i-enrichment, okaloosa-cei-g-fix]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: "Run pencil_dod_evaluate_county for all 3 counties"
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}",
               "Content-Type": "application/json"}

          print("### SQL VERIFICATION — SHARD-4 RUN-5668")
          print(f"dispatch_id: 9cf30a27-2b64-4e4a-a976-58d093c8bccc")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print("")

          COUNTIES = ["nassau", "osceola", "okaloosa"]
          for county in COUNTIES:
              req = urllib.request.Request(
                  f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
                  data=json.dumps({"p_county": county}).encode(),
                  headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      result = json.loads(r.read())
              except Exception as e:
                  print(f"{county}: EVALUATION FAILED: {e}")
                  continue

              passes = 0
              details = []
              for ltr in "ABCDEFGHIJ":
                  v = result.get(ltr)
                  if isinstance(v, dict):
                      p = v.get("pass", False)
                      m = v.get("metric", "?")
                      passes += int(bool(p))
                      details.append(f"{ltr}={'PASS' if p else 'FAIL'} metric={m}")
              print(f"\n{county}: {passes}/10")
              for d in details:
                  print(f"  {d}")

          PYEOF

      - name: "Post SQL verification summary"
        if: always()
        run: |
          echo "## SQL VERIFICATION — SHARD-4 RUN-5668" >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT public.pencil_dod_evaluate_county('nassau');" >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT public.pencil_dod_evaluate_county('osceola');" >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT public.pencil_dod_evaluate_county('okaloosa');" >> "$GITHUB_STEP_SUMMARY"
