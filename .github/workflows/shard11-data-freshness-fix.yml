name: SHARD-11 Data Freshness Fix

on:
  workflow_dispatch:
    inputs:
      county:
        description: 'County to fix (baker, miami_dade, or all)'
        required: false
        default: 'all'
  schedule:
    # Run every 6 hours to maintain data freshness
    - cron: '0 */6 * * *'

jobs:
  freshness_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx

      - name: Check freshness status
        id: check
        run: |
          echo "Checking data freshness for SHARD-11 counties..."
          
          python3 -c "
          import os, sys, httpx, json
          from datetime import datetime, timezone
          
          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}
          
          client = httpx.Client(timeout=30)
          counties = ['baker', 'miami_dade']
          stale_counties = []
          
          for county in counties:
              try:
                  r = client.post(f'{url}/rest/v1/rpc/pencil_dod_evaluate_county',
                                 headers=headers, json={'county_slug_arg': county})
                  
                  if r.status_code == 200:
                      letters = r.json()
                      for letter in letters:
                          if letter.get('letter') == 'H' and not letter.get('pass'):
                              detail = letter.get('detail', '')
                              if 'hours since last_seen' in detail:
                                  try:
                                      hours = float(detail.split('=')[1].split()[0])
                                      if hours > 48:  # SLA threshold
                                          stale_counties.append(county)
                                          print(f'{county}: {hours:.1f}h stale (>48h SLA)')
                                      else:
                                          print(f'{county}: {hours:.1f}h stale (within SLA)')
                                  except:
                                      stale_counties.append(county)
                                      print(f'{county}: H FAIL (unparseable)')
                              break
                      else:
                          print(f'{county}: Letter H status unknown')
                  else:
                      print(f'{county}: Evaluation failed ({r.status_code})')
                      
              except Exception as e:
                  print(f'{county}: Error - {e}')
                  stale_counties.append(county)
          
          target_county = '${{ inputs.county }}'
          if target_county and target_county != 'all':
              stale_counties = [c for c in stale_counties if c == target_county]
          
          needs_fix = len(stale_counties) > 0
          print(f'needs_fix={str(needs_fix).lower()}')
          print(f'stale_counties={json.dumps(stale_counties)}')
          " >> $GITHUB_OUTPUT

      - name: Run freshness fix
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          echo "=== SHARD-11 DATA FRESHNESS FIX ==="
          echo "Fixing Letter H failures for stale counties"
          echo "Stale counties: ${{ steps.check.outputs.stale_counties }}"
          echo ""
          
          python3 scripts/shard11_fix_data_freshness.py

      - name: Verify fix results
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          echo "=== FRESHNESS FIX VERIFICATION ==="
          
          if [ -f /tmp/shard11_freshness_results.json ]; then
            echo "Fix results:"
            cat /tmp/shard11_freshness_results.json | jq -r '
              .fix_results[] | 
              "  \(.county): \(.status) (\(.elapsed_time // 0 | floor)s)"
            '
            
            # Check success rate
            SUCCESS_COUNT=$(cat /tmp/shard11_freshness_results.json | jq '[.fix_results[] | select(.status == "SUCCESS")] | length')
            TOTAL_COUNT=$(cat /tmp/shard11_freshness_results.json | jq '.fix_results | length')
            
            echo ""
            echo "Success rate: $SUCCESS_COUNT/$TOTAL_COUNT counties"
            
            if [ "$SUCCESS_COUNT" -gt 0 ]; then
              echo "✅ Freshness fix successful for $SUCCESS_COUNT counties"
              echo "Data will be refreshed in next scraper cycle"
            else
              echo "❌ Freshness fix failed for all counties"
              exit 1
            fi
          else
            echo "❌ No freshness results file found"
            exit 1
          fi

      - name: Skip notification
        if: steps.check.outputs.needs_fix == 'false'
        run: |
          echo "✅ Data freshness check passed - no action needed"
          echo "All counties within 48h SLA"