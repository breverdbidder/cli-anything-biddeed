# DEPRECATED 2026-05-28
#
# This workflow was the original Coder.com pathway. CODER_URL and CODER_TOKEN
# secrets were never registered, so every dispatch silently failed.
#
# Replaced by .github/workflows/claude-code-action.yml which uses the official
# anthropics/claude-code-action and the already-configured CLAUDE_CODE_OAUTH_TOKEN
# secret. No external service registration required.
#
# Triggers removed below so this file no longer activates on label events.
# Manual workflow_dispatch retained for diagnostic purposes only.
# File kept on disk as a tombstone for historical traceability; remove after
# confirming the new workflow is stable.

name: Coder Task (DEPRECATED)

on:
  workflow_dispatch: {}

permissions:
  issues: read

jobs:
  deprecated-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Print deprecation notice
        run: |
          echo "::warning::coder-task.yml is deprecated. Use claude-code-action.yml instead."
          echo "Original Coder.com pathway never had CODER_URL/CODER_TOKEN secrets registered."
          echo "Replacement: anthropics/claude-code-action with CLAUDE_CODE_OAUTH_TOKEN."
          exit 0
