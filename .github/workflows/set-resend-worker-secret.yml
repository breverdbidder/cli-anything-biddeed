name: Set Resend Worker Secret

# One-off/idempotent: pulls resend_api_key from Supabase vault and writes
# it as RESEND_API_KEY on the production Cloudflare Worker so /chat/lead
# can send free county report emails via Resend.
# Same credential-handling pattern as set-posthog-worker-secret.yml.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch resend_api_key from vault and set as Worker secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg q "SELECT vault_secret('resend_api_key') AS v;" '{query: $q}')
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: cli-anything-biddeed-cc/1.0" \
            -d "$payload")
          value=$(echo "$resp" | jq -r '.[0].v // empty')
          if [ -z "$value" ]; then
            echo "::error::resend_api_key not returned from vault_secret() — check vault contents"
            exit 1
          fi
          echo "::add-mask::$value"
          echo "$value" | npx wrangler secret put RESEND_API_KEY
