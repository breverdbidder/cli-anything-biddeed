name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Login + Execute Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GH_PAT
          script: |
            set -e
            echo "SUMMIT: Explorer V2 V9"

            id claude 2>/dev/null || useradd -m -s /bin/bash claude

            # Check auth
            LOGGED=$(claude auth status 2>&1 | grep '"loggedIn": true' || echo "")
            if [ -n "$LOGGED" ]; then
              echo "Already logged in!"
            else
              echo "Not logged in. Launching login..."
              
              LOGFILE="/tmp/claude-login.log"
              rm -f "$LOGFILE"
              
              # Launch login, pipe ALL output to file
              (claude auth login 2>&1 | tee "$LOGFILE") &
              LOGIN_PID=$!
              
              # Wait up to 30s for URL to appear
              URL=""
              for i in $(seq 1 30); do
                sleep 1
                URL=$(grep -o 'https://claude.ai/oauth[^ "]*' "$LOGFILE" 2>/dev/null | head -1 || true)
                if [ -n "$URL" ]; then
                  echo "Got URL at second $i"
                  break
                fi
              done
              
              if [ -z "$URL" ]; then
                echo "Trying alternate extraction..."
                cat "$LOGFILE" 2>/dev/null
                URL=$(cat "$LOGFILE" 2>/dev/null | tr -d '\r\n' | grep -o 'https://claude.ai/oauth[^ "]*' | head -1 || true)
              fi
              
              if [ -n "$URL" ]; then
                echo "URL captured: ${URL:0:80}..."
                
                # URL-encode the login URL for Telegram
                ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$URL', safe=''))" 2>/dev/null || echo "$URL")
                
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  -d "text=🔑 TAP TO LOG IN CLAUDE ON HETZNER

${URL}

⏰ You have 5 MINUTES to tap and approve." \
                  -d "disable_web_page_preview=true" > /dev/null 2>&1
                
                echo "Sent to Telegram. Waiting 5 min..."
                
                # Poll every 5s for 5 min
                for i in $(seq 1 60); do
                  sleep 5
                  if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
                    echo "LOGIN SUCCESS at $(date)"
                    kill $LOGIN_PID 2>/dev/null || true
                    break 
                  fi
                done
              else
                echo "FATAL: Could not capture URL"
                echo "Log contents:"
                cat "$LOGFILE" 2>/dev/null | head -20
                kill $LOGIN_PID 2>/dev/null || true
                exit 1
              fi
              
              kill $LOGIN_PID 2>/dev/null || true
            fi

            # Verify
            claude auth status 2>&1
            if ! claude auth status 2>&1 | grep -q '"loggedIn": true'; then
              echo "Login timed out."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=🏔️❌ Claude login timed out. Re-run and tap faster." > /dev/null 2>&1
              exit 1
            fi

            # Copy auth to claude user
            cp -r /root/.claude /home/claude/.claude 2>/dev/null || true
            cp /root/.claude.json /home/claude/.claude.json 2>/dev/null || true
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            su -s /bin/bash claude -c "
              export HOME=/home/claude
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
              claude --version
              claude auth status 2>&1 | head -3
            "

            # Clone and deploy
            WORK="/tmp/zw-exp-$(date +%s)"
            mkdir -p "$WORK"
            cd "$WORK"
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK"

            cat > "$WORK/run.sh" << 'ENDSCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            claude -p "
            Implement Explorer V2 for ZoneWise.AI.
            READ: docs/plans/EXPLORER_V2_SPEC.md then CLAUDE.md
            Choropleth heatmap WITHOUT login — Reventure lead magnet.
            FREE: Choropleth always visible. 5 parcel clicks/day. 3 chats/day. Then upgrade modal.
            1. ZOOM-ADAPTIVE ZONING in BrevardExplorer.tsx.
            2. CHOROPLETH: zillow.ts + ChoroplethLayer.tsx.
            3. NLP CHAT: ExplorerV2.tsx split-screen.
            4. MOBILE: ExplorerMobileSheet.tsx.
            5. CONVERSION: Modals after 5 clicks / 3 chats.
            6. ZONING FILTER: Dropdown RU/BU/PUD/AU/IU/TU.
            Brand: #1E3A5F navy, #F59E0B orange, #020617 bg.
            Must pass tsc + build. Execute autonomously.
            " --dangerously-skip-permissions
            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10
            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "FATAL: No changes"; exit 1; }
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            echo "PUSHED"
            ENDSCRIPT

            sed -i "s|WORKDIR|$WORK|g" "$WORK/run.sh"
            chmod +x "$WORK/run.sh"
            chown claude:claude "$WORK/run.sh"
            su -s /bin/bash claude "$WORK/run.sh"
            rm -rf "$WORK"
            
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🏔️✅ Explorer V2 DEPLOYED to zonewise.ai/explorer" > /dev/null 2>&1
            echo "DONE"

      - name: Trigger Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'

      - name: Close Issue 41
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" -d '{"state":"closed","state_reason":"completed"}'

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "text=🏔️❌ Explorer V2 FAILED" > /dev/null 2>&1
