name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Execute Claude Code on Hetzner (Max Plan)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          script: |
            set -e
            echo "SUMMIT: Explorer V2 V7"

            # Setup claude user
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            
            # Setup npm global dir for claude user
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            # Install claude code for claude user
            su -s /bin/bash claude -c "
              export HOME=/home/claude
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:\$PATH
              npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -5
              /home/claude/.npm-global/bin/claude --version
            "

            # Clone repo
            WORK="/tmp/zw-exp-$(date +%s)"
            mkdir -p "$WORK"
            cd "$WORK"
            git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK"

            # Execute as claude user
            cat > "$WORK/run.sh" << 'ENDSCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            
            echo "=== Running Claude Code ==="
            claude --version
            claude -p "
            You are implementing Explorer V2 for ZoneWise.AI.

            READ FIRST: docs/plans/EXPLORER_V2_SPEC.md
            READ SECOND: CLAUDE.md

            CRITICAL: Choropleth heatmap MUST be visible WITHOUT login — Reventure.app lead magnet strategy.

            FREE TIER (no login): Choropleth always visible. 5 parcel clicks/day + 3 chat messages/day. After limit: upgrade modal.

            ORDER:
            1. ZOOM-ADAPTIVE ZONING in BrevardExplorer.tsx. Hidden zoom<12, 15% at 12-14, 55% at 15+.
            2. CHOROPLETH: lib/explorer/zillow.ts + ChoroplethLayer.tsx. Blue-green-yellow-orange-red.
            3. NLP CHAT SPLIT-SCREEN: ExplorerV2.tsx chat left map right.
            4. MOBILE BOTTOM SHEET: ExplorerMobileSheet.tsx.
            5. CONVERSION GATE: Modals after 5 clicks or 3 chats.
            6. ZONING FILTER: Dropdown All/RU/BU/PUD/AU/IU/TU.

            Brand: Navy #1E3A5F, Orange #F59E0B, bg #020617.
            npx tsc --noEmit and npm run build must pass.
            DO NOT ask questions. Execute autonomously.
            " --dangerously-skip-permissions

            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10

            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            if git diff --cached --quiet; then
              echo "FATAL: No changes"
              exit 1
            fi
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            echo "PUSHED"
            ENDSCRIPT

            sed -i "s|WORKDIR|$WORK|g" "$WORK/run.sh"
            chmod +x "$WORK/run.sh"
            chown claude:claude "$WORK/run.sh"
            su -s /bin/bash claude "$WORK/run.sh"
            rm -rf "$WORK"
            echo "DONE"

      - name: Trigger Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'

      - name: Close Issue 41
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" -d '{"state":"closed","state_reason":"completed"}'

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && MSG="🏔️✅ Explorer V2 DEPLOYED%0Azonewise.ai/explorer LIVE" || MSG="🏔️❌ Explorer V2 FAILED"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$MSG" > /dev/null 2>&1 || true
