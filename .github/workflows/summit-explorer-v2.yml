name: "SUMMIT: Explorer V2 Deploy"
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Write token to Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 1m
          envs: CLAUDE_OAUTH_B64
          script: |
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            chmod 644 /tmp/claude-oauth-token
            echo "Token: $(wc -c < /tmp/claude-oauth-token) bytes"
            echo "First 10: $(head -c 10 /tmp/claude-oauth-token)"
      - name: Deploy Explorer V2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: GH_PAT,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            echo "SUMMIT: Explorer V2"
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            su -s /bin/bash claude -c "export HOME=/home/claude && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3"
            WORK="/tmp/zw-exp-$(date +%s)"
            mkdir -p "$WORK" && cd "$WORK"
            git clone "https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            chown -R claude:claude "$WORK"
            cat > "$WORK/deploy.sh" << 'SCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            export CLAUDE_CODE_OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            echo "Auth:"
            claude auth status
            claude -p "Implement Explorer V2 for ZoneWise.AI. READ: docs/plans/EXPLORER_V2_SPEC.md then CLAUDE.md. CRITICAL: Choropleth heatmap WITHOUT login — Reventure lead magnet. FREE: Choropleth always visible. 5 parcel clicks/day. 3 chats/day. Then upgrade modal. 1. ZOOM-ADAPTIVE ZONING in BrevardExplorer.tsx. Hidden zoom<12, 15% at 12-14, 55% at 15+. 2. CHOROPLETH: zillow.ts + ChoroplethLayer.tsx. Blue-red. Zoom 9-13. 3. NLP CHAT: ExplorerV2.tsx split-screen. chat/route.ts. 4. MOBILE: ExplorerMobileSheet.tsx. 5. CONVERSION: Modals after 5 clicks / 3 chats. 6. ZONING FILTER: Dropdown RU/BU/PUD/AU/IU/TU. Brand: #1E3A5F, #F59E0B, #020617. Must pass tsc + build." --dangerously-skip-permissions
            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10
            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "No changes"; exit 1; }
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            echo "PUSHED"
            SCRIPT
            sed -i "s|WORKDIR|$WORK|g" "$WORK/deploy.sh"
            chmod +x "$WORK/deploy.sh"
            chown claude:claude "$WORK/deploy.sh"
            su -s /bin/bash claude "$WORK/deploy.sh"
            rm -f /tmp/claude-oauth-token
            rm -rf "$WORK"
            python3 -c "import json,urllib.request;urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage',json.dumps({'chat_id':'${TELEGRAM_CHAT_ID}','text':'🏔️✅ Explorer V2 DEPLOYED'}).encode(),{'Content-Type':'application/json'}))"
      - name: Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'
      - name: Close Issue
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GH_PAT }}" "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" -d '{"state":"closed","state_reason":"completed"}'
