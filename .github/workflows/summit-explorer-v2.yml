name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Execute Claude Code on Hetzner (Max Plan)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          script: |
            set -e
            echo "=== AUTH INVESTIGATION PART 2 ==="
            
            echo "--- claude auth --help ---"
            claude auth --help 2>&1 || echo "no auth help"
            
            echo ""
            echo "--- claude setup-token --help ---"
            claude setup-token --help 2>&1 || echo "no setup-token help"
            
            echo ""
            echo "--- claude auth login --help ---"
            claude auth login --help 2>&1 || echo "no auth login help"
            
            echo ""
            echo "--- Try headless login ---"
            claude auth login --no-browser 2>&1 | head -5 || echo "no --no-browser flag"
            
            echo ""
            echo "--- Try with ANTHROPIC_API_KEY (test) ---"
            echo "Would use ANTHROPIC_API_KEY env var but we want Max plan not API"
            
            echo ""
            echo "--- Node version ---"
            node --version
            
            echo "DONE"
