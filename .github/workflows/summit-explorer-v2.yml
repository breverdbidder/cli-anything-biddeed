name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Login + Execute Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GH_PAT
          script: |
            set -e
            echo "SUMMIT: Explorer V2 — Telegram Login"

            if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
              echo "ALREADY LOGGED IN"
            else
              echo "Step 1: Capture URL with script command"
              TYPESCRIPT="/tmp/claude-login-capture.txt"
              rm -f "$TYPESCRIPT"

              # script command captures terminal output (proven in run #14)
              timeout 25 script -q "$TYPESCRIPT" -c "claude auth login" 2>&1 || true

              # Extract URL
              URL=$(grep -o 'https://claude.ai/oauth[^ ]*' "$TYPESCRIPT" 2>/dev/null | head -1)
              echo "Extracted URL: ${URL:0:60}..."

              if [ -z "$URL" ]; then
                echo "FATAL: No URL captured. File contents:"
                cat "$TYPESCRIPT" 2>/dev/null | head -20
                exit 1
              fi

              # Step 2: Send to Telegram
              echo "Sending to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=🔑 TAP TO LOG IN CLAUDE ON HETZNER

${URL}

⏰ You have 5 MINUTES to tap and approve.
Then Explorer V2 deploys automatically." \
                -d "disable_web_page_preview=true"

              echo "Sent! Now starting fresh login process..."

              # Step 3: Start fresh login (the first one timed out)
              script -q /dev/null -c "claude auth login" &
              LOGIN_PID=$!

              # Step 4: Wait up to 5 min for login
              LOGGED_IN=false
              for i in $(seq 1 60); do
                sleep 5
                if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
                  LOGGED_IN=true
                  echo "LOGIN SUCCESS after $((i*5))s!"
                  break
                fi
                # Print heartbeat every 30s
                [ $((i % 6)) -eq 0 ] && echo "Waiting... ${i}0s / 300s"
              done

              kill $LOGIN_PID 2>/dev/null || true
              wait $LOGIN_PID 2>/dev/null || true

              if [ "$LOGGED_IN" = "false" ]; then
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=⏰ Login timed out (5 min). Re-run workflow for fresh link." > /dev/null 2>&1
                echo "TIMEOUT"
                exit 1
              fi
            fi

            echo "=== LOGGED IN ==="
            claude auth status 2>&1

            # Copy auth to claude user
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            cp -r /root/.claude /home/claude/.claude 2>/dev/null || true
            cp /root/.claude.json /home/claude/.claude.json 2>/dev/null || true
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            su -s /bin/bash claude -c "
              export HOME=/home/claude
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
              claude --version
            "

            WORK="/tmp/zw-exp-$(date +%s)"
            mkdir -p "$WORK" && cd "$WORK"
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK"

            cat > "$WORK/run.sh" << 'ENDSCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            claude --version
            claude -p "
            Implement Explorer V2 for ZoneWise.AI. READ: docs/plans/EXPLORER_V2_SPEC.md then CLAUDE.md
            CRITICAL: Choropleth heatmap WITHOUT login — Reventure lead magnet.
            FREE: Choropleth always visible. 5 parcel clicks/day. 3 chats/day. Then upgrade modal.
            1. ZOOM-ADAPTIVE ZONING in BrevardExplorer.tsx. Hidden zoom<12, 15% at 12-14, 55% at 15+.
            2. CHOROPLETH: zillow.ts + ChoroplethLayer.tsx. Blue-red. Zoom 9-13.
            3. NLP CHAT: ExplorerV2.tsx split-screen. chat/route.ts.
            4. MOBILE: ExplorerMobileSheet.tsx.
            5. CONVERSION: Modals after 5 clicks / 3 chats.
            6. ZONING FILTER: Dropdown RU/BU/PUD/AU/IU/TU.
            Brand: #1E3A5F, #F59E0B, #020617. Must pass tsc + build.
            " --dangerously-skip-permissions
            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10
            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "FATAL: No changes"; exit 1; }
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            echo "PUSHED"
            ENDSCRIPT

            sed -i "s|WORKDIR|$WORK|g" "$WORK/run.sh"
            chmod +x "$WORK/run.sh"
            chown claude:claude "$WORK/run.sh"
            su -s /bin/bash claude "$WORK/run.sh"
            rm -rf "$WORK"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🏔️✅ Explorer V2 DEPLOYED to zonewise.ai/explorer" > /dev/null 2>&1
            echo "DONE"

      - name: Trigger Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'

      - name: Close Issue 41
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" -d '{"state":"closed","state_reason":"completed"}'

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "text=🏔️❌ Explorer V2 FAILED" > /dev/null 2>&1 || true
