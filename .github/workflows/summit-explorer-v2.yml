name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute Claude Code on Hetzner (Max Plan)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "=== AUTH INVESTIGATION ==="
            
            claude auth --help 2>&1 || true
            echo "---"
            claude setup-token --help 2>&1 || true
            echo "---"
            claude auth login --help 2>&1 || true
            echo "---"
            claude auth status 2>&1 || true
            echo "---"
            # Check all claude subcommands
            claude --help 2>&1
            echo "---"
            # Check if there's a way to use API key
            echo "ANTHROPIC_API_KEY test:"
            ANTHROPIC_API_KEY=test claude auth status 2>&1 || true
            echo "---"
            # Check node path for finding auth storage
            node -e "const os=require('os');const path=require('path');console.log('home:',os.homedir());console.log('config:',process.env.XDG_CONFIG_HOME||path.join(os.homedir(),'.config'))" 2>&1
            echo "---"
            # Check if there's a keyring
            which secret-tool 2>/dev/null && secret-tool search --all xdg:schema claude 2>/dev/null || echo "no secret-tool"
            echo "---"
            # Check all hidden files in root
            ls -la /root/.claude* /root/.anthropic* /root/.config/claude* 2>/dev/null || echo "checked"
