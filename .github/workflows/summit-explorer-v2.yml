name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Login + Execute Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GH_PAT
          script: |
            set -e
            echo "SUMMIT: Explorer V2 — Auto Login + Deploy"

            id claude 2>/dev/null || useradd -m -s /bin/bash claude

            # Check if already logged in
            AUTH=$(claude auth status 2>&1 | head -1)
            echo "Current auth: $AUTH"

            if echo "$AUTH" | grep -q '"loggedIn": true'; then
              echo "Already logged in!"
            else
              echo "Not logged in. Starting login with 5-min window..."
              
              # Start claude auth login in background, capture output
              LOGFILE="/tmp/claude-login-$$.log"
              
              # Use script to capture pseudo-terminal output
              nohup script -q -c "claude auth login" "$LOGFILE" &
              LOGIN_PID=$!
              
              # Wait for URL to appear in log (up to 30 seconds)
              for i in $(seq 1 30); do
                sleep 1
                if grep -q "claude.ai/oauth" "$LOGFILE" 2>/dev/null; then
                  break
                fi
              done
              
              # Extract URL
              URL=$(grep -o 'https://claude.ai/oauth[^ ]*' "$LOGFILE" 2>/dev/null | head -1)
              
              if [ -n "$URL" ]; then
                echo "Captured URL: $URL"
                
                # Send to Telegram
                MSG="🔑 TAP TO LOG IN CLAUDE ON HETZNER%0A%0A${URL}%0A%0A⏰ You have 5 MINUTES to tap this link and approve.%0AThen Explorer V2 deploys automatically."
                curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}" > /dev/null 2>&1
                
                echo "URL sent to Telegram. Waiting 5 minutes..."
                
                # Wait up to 5 minutes for login to complete
                for i in $(seq 1 60); do
                  sleep 5
                  STATUS=$(claude auth status 2>&1 | grep loggedIn || echo "checking...")
                  if echo "$STATUS" | grep -q "true"; then
                    echo "LOGIN SUCCESSFUL!"
                    kill $LOGIN_PID 2>/dev/null || true
                    break
                  fi
                done
              else
                echo "ERROR: Could not capture login URL"
                cat "$LOGFILE" 2>/dev/null
                exit 1
              fi
            fi

            # Verify logged in
            claude auth status 2>&1
            LOGGED=$(claude auth status 2>&1 | grep '"loggedIn": true' || echo "")
            if [ -z "$LOGGED" ]; then
              echo "FATAL: Still not logged in after 5 minutes"
              MSG="🏔️❌ Explorer V2: Login timed out. Tap the link within 5 min next time."
              curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}" > /dev/null 2>&1
              exit 1
            fi

            # Copy auth to claude user
            cp -r /root/.claude /home/claude/.claude 2>/dev/null || true
            cp /root/.claude.json /home/claude/.claude.json 2>/dev/null || true
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            # Install claude for claude user
            su -s /bin/bash claude -c "
              export HOME=/home/claude
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
              claude --version
            "

            # Clone and deploy
            WORK="/tmp/zw-exp-$(date +%s)"
            mkdir -p "$WORK"
            cd "$WORK"
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK"

            cat > "$WORK/run.sh" << 'ENDSCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            claude --version
            claude -p "
            Implement Explorer V2 for ZoneWise.AI.
            READ: docs/plans/EXPLORER_V2_SPEC.md then CLAUDE.md
            CRITICAL: Choropleth heatmap WITHOUT login — Reventure lead magnet.
            FREE: Choropleth always visible. 5 parcel clicks/day. 3 chats/day. Then upgrade modal.
            1. ZOOM-ADAPTIVE ZONING in BrevardExplorer.tsx. Hidden zoom<12, 15% at 12-14, 55% at 15+.
            2. CHOROPLETH: zillow.ts + ChoroplethLayer.tsx. Blue-red scale. Zoom 9-13.
            3. NLP CHAT: ExplorerV2.tsx split-screen. chat/route.ts.
            4. MOBILE: ExplorerMobileSheet.tsx bottom sheet.
            5. CONVERSION: Modals after 5 clicks / 3 chats.
            6. ZONING FILTER: Dropdown RU/BU/PUD/AU/IU/TU.
            Brand: #1E3A5F navy, #F59E0B orange, #020617 bg.
            Must pass tsc + build. Execute autonomously.
            " --dangerously-skip-permissions
            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10
            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "FATAL: No changes"; exit 1; }
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            echo "PUSHED"
            ENDSCRIPT

            sed -i "s|WORKDIR|$WORK|g" "$WORK/run.sh"
            chmod +x "$WORK/run.sh"
            chown claude:claude "$WORK/run.sh"
            su -s /bin/bash claude "$WORK/run.sh"
            rm -rf "$WORK"
            
            MSG="🏔️✅ Explorer V2 DEPLOYED%0Azonewise.ai/explorer LIVE%0AIssue %2341 closing..."
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}" > /dev/null 2>&1
            echo "DONE"

      - name: Trigger Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'

      - name: Close Issue 41
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" -d '{"state":"closed","state_reason":"completed"}'

      - name: Notify Telegram
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🏔️❌ Explorer V2 FAILED" > /dev/null 2>&1 || true
