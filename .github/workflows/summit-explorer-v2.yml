name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Execute Claude Code on Hetzner (Max Plan)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          script: |
            set -e
            echo "=========================================="
            echo "  SUMMIT: Explorer V2 — Claude Code"
            echo "  Hetzner + Max Plan (ZERO API cost)"
            echo "=========================================="

            # Create non-root user if missing
            id claude 2>/dev/null || useradd -m -s /bin/bash claude

            # Verify claude binary
            CLAUDE_BIN=$(which claude 2>/dev/null || echo "/usr/local/bin/claude")
            echo "Claude binary: $CLAUDE_BIN"
            $CLAUDE_BIN --version

            # Setup workspace
            WORK_DIR="/tmp/zonewise-explorer-v2-$(date +%s)"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # Clone repo
            git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK_DIR"

            # Run as claude user with explicit PATH
            su -s /bin/bash claude -c "
            export PATH=/usr/local/bin:/usr/bin:/bin:\$PATH
            export HOME=/home/claude
            cd $WORK_DIR/zonewise-web

            echo 'Installing dependencies...'
            npm ci 2>/dev/null || npm install

            echo 'Claude version:'
            claude --version

            echo 'Running Claude Code...'
            claude -p '
            You are implementing Explorer V2 for ZoneWise.AI.

            READ FIRST: docs/plans/EXPLORER_V2_SPEC.md (full specification)
            READ SECOND: CLAUDE.md (project conventions)

            CRITICAL: The choropleth heatmap MUST be visible WITHOUT login. This is the Reventure.app lead magnet strategy that drives 200K+ monthly visitors. The dashboard at zonewise.ai/explorer must load with NO authentication.

            FREE TIER (no login required):
            - Choropleth heatmap always visible at county/ZIP zoom
            - 5 parcel clicks per day (localStorage counter, resets daily)
            - 3 chat messages per day (localStorage counter, resets daily)
            - After limit: show upgrade modal linking to /signup?plan=pro

            IMPLEMENTATION ORDER:
            1. ZOOM-ADAPTIVE ZONING: In BrevardExplorer.tsx, add map.on zoom handler. Zoning hidden zoom<12, 15% opacity at 12-14, 55% at 15+. Parcels hidden zoom<14.
            2. CHOROPLETH HEATMAP: Create lib/explorer/zillow.ts and ChoroplethLayer.tsx. Color scale blue-green-yellow-orange-red. Visible zoom 9-13, fades at 14+.
            3. NLP CHAT SPLIT-SCREEN: Create ExplorerV2.tsx with chat left, map right. Create app/api/explorer/chat/route.ts. Parse MAP:FLY commands.
            4. MOBILE BOTTOM SHEET: ExplorerMobileSheet.tsx. Collapsed=search+pills. Expanded=chat+detail.
            5. CONVERSION GATE: Upgrade modals after 5 parcel clicks or 3 chat messages.
            6. ZONING FILTER: Dropdown All/RU/BU/PUD/AU/IU/TU.

            Brand: Navy #1E3A5F, Orange #F59E0B, bg #020617, Inter font.
            After: npx tsc --noEmit and npm run build must pass.
            DO NOT ask questions. Execute autonomously. Leave TODO for skipped items.
            ' --dangerously-skip-permissions

            echo 'Type check...'
            npx tsc --noEmit 2>&1 | tail -10 || true
            echo 'Build...'
            npm run build 2>&1 | tail -10

            echo 'Git push...'
            git config user.name 'Claude Code (Hetzner)'
            git config user.email 'claude@zonewise.ai'
            git add -A
            if git diff --cached --quiet; then
              echo 'No changes to commit'
            else
              git commit -m 'feat(explorer-v2): Reventure lead magnet — choropleth + NLP chat + conversion funnel [SUMMIT]

            - Choropleth heatmap visible WITHOUT login (lead magnet)
            - 5 free parcel clicks + 3 free chat messages before gate
            - Split-screen NLP chat panel
            - Mobile bottom sheet
            - Zoom-adaptive zoning opacity
            - Zoning type filter

            Closes #41'
              git push origin main
              echo 'PUSHED TO MAIN'
            fi
            "

            rm -rf "$WORK_DIR"
            echo "SUMMIT COMPLETE"

      - name: Trigger Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" \
            -d '{"ref":"main"}' -w "Promote: HTTP %{http_code}\n"

      - name: Close Issue 41
        if: success()
        run: |
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" \
            -d '{"state":"closed","state_reason":"completed"}'

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="🏔️✅ Explorer V2 DEPLOYED to zonewise.ai/explorer%0AReventure lead magnet LIVE%0AIssue %2341 CLOSED"
          else
            MSG="🏔️❌ Explorer V2 FAILED — check logs"
          fi
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$MSG" > /dev/null 2>&1 || true
