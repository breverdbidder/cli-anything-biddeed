name: "SUMMIT: Explorer V2 via Hetzner"
on:
  workflow_dispatch:

jobs:
  claude-code-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Login + Execute Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GH_PAT
          script: |
            set -e
            echo "SUMMIT: Explorer V2 — Auto Login + Deploy"

            # Setup claude user
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            # Install claude for claude user
            su -s /bin/bash claude -c "
              export HOME=/home/claude
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              which claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            "

            # Check if already logged in
            AUTH_OK=$(su -s /bin/bash claude -c "
              export HOME=/home/claude
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              claude auth status 2>&1
            " || true)
            echo "Current auth: $AUTH_OK"

            if echo "$AUTH_OK" | grep -q '"loggedIn": true'; then
              echo "Already authenticated!"
            else
              echo "Not logged in. Capturing login URL..."
              
              # Install expect if needed
              which expect >/dev/null 2>&1 || apt-get install -y -qq expect > /dev/null 2>&1

              # Try to capture auth URL using script command
              su -s /bin/bash claude -c "
                export HOME=/home/claude
                export NPM_CONFIG_PREFIX=/home/claude/.npm-global
                export PATH=/home/claude/.npm-global/bin:\$PATH
                export TERM=dumb
                export BROWSER=echo
                export DISPLAY=
                script -qc 'timeout 20 claude auth login --email everestcapital8@gmail.com 2>&1 || true' /tmp/claude-login-output.txt
              " || true

              cat /tmp/claude-login-output.txt 2>/dev/null || echo "no output captured"

              # Also try direct execution
              su -s /bin/bash claude -c "
                export HOME=/home/claude
                export NPM_CONFIG_PREFIX=/home/claude/.npm-global
                export PATH=/home/claude/.npm-global/bin:\$PATH
                export TERM=dumb
                export BROWSER='echo URL:'
                export DISPLAY=
                timeout 20 claude auth login 2>&1 || true
              " > /tmp/claude-login-direct.txt 2>&1 || true

              cat /tmp/claude-login-direct.txt 2>/dev/null || echo "no direct output"

              # Extract URL from any captured output
              URL=$(cat /tmp/claude-login-output.txt /tmp/claude-login-direct.txt 2>/dev/null | grep -oP 'https?://[^\s\x00-\x1f]+' | head -1)
              
              if [ -n "$URL" ]; then
                echo "Captured URL: $URL"
                MSG="🔑 TAP TO LOG IN CLAUDE ON HETZNER%0A%0A${URL}%0A%0A⏳ Explorer V2 will auto-deploy after auth"
                curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=$MSG&disable_web_page_preview=true" > /dev/null 2>&1
                
                # Wait for auth (check every 30s, max 15 min)
                echo "Waiting for auth..."
                for i in $(seq 1 30); do
                  sleep 30
                  CHECK=$(su -s /bin/bash claude -c "
                    export HOME=/home/claude
                    export NPM_CONFIG_PREFIX=/home/claude/.npm-global
                    export PATH=/home/claude/.npm-global/bin:\$PATH
                    claude auth status 2>&1
                  " || true)
                  if echo "$CHECK" | grep -q '"loggedIn": true'; then
                    echo "AUTHENTICATED after $((i*30))s!"
                    
                    # Generate setup-token for future use
                    su -s /bin/bash claude -c "
                      export HOME=/home/claude
                      export NPM_CONFIG_PREFIX=/home/claude/.npm-global
                      export PATH=/home/claude/.npm-global/bin:\$PATH
                      claude setup-token 2>&1
                    " > /tmp/setup-token.txt 2>&1 || true
                    
                    TOKEN=$(grep -oP 'sk-ant-oat01-[^\s]+' /tmp/setup-token.txt | head -1)
                    if [ -n "$TOKEN" ]; then
                      echo "Setup token generated! Store as CLAUDE_CODE_OAUTH_TOKEN secret."
                      MSG2="✅ Claude logged in! Setup token generated.%0AStore as CLAUDE_CODE_OAUTH_TOKEN in GitHub secrets for future runs."
                      curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=$MSG2" > /dev/null 2>&1
                    fi
                    break
                  fi
                  echo "Check $i: not yet..."
                done
                
                # Final check
                FINAL=$(su -s /bin/bash claude -c "
                  export HOME=/home/claude
                  export NPM_CONFIG_PREFIX=/home/claude/.npm-global
                  export PATH=/home/claude/.npm-global/bin:\$PATH
                  claude auth status 2>&1
                " || true)
                if ! echo "$FINAL" | grep -q '"loggedIn": true'; then
                  echo "Auth timed out"
                  curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=⏰ Auth timed out. Link may have expired." > /dev/null 2>&1
                  exit 1
                fi
              else
                echo "Could not capture login URL. Raw output:"
                cat /tmp/claude-login-output.txt /tmp/claude-login-direct.txt 2>/dev/null | head -50
                curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=❌ Could not capture Claude login URL on Hetzner" > /dev/null 2>&1
                exit 1
              fi
            fi

            # === NOW DEPLOY EXPLORER V2 ===
            echo "=== DEPLOYING EXPLORER V2 ==="
            WORK="/tmp/zw-exp-$(date +%s)"
            mkdir -p "$WORK"
            cd "$WORK"
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK"

            cat > "$WORK/run.sh" << ENDSCRIPT
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:\$PATH

            cd $WORK/zonewise-web
            npm ci 2>/dev/null || npm install

            claude -p "
            Implement Explorer V2 for ZoneWise.AI.
            READ: docs/plans/EXPLORER_V2_SPEC.md then CLAUDE.md
            CRITICAL: Choropleth heatmap WITHOUT login — Reventure lead magnet.
            FREE: Choropleth always visible. 5 parcel clicks/day. 3 chats/day. Then upgrade modal.
            1. ZOOM-ADAPTIVE ZONING in BrevardExplorer.tsx. Hidden zoom<12, 15% at 12-14, 55% at 15+.
            2. CHOROPLETH: zillow.ts + ChoroplethLayer.tsx. Blue-red scale. Zoom 9-13.
            3. NLP CHAT: ExplorerV2.tsx split-screen. chat/route.ts.
            4. MOBILE: ExplorerMobileSheet.tsx bottom sheet.
            5. CONVERSION: Modals after 5 clicks / 3 chats.
            6. ZONING FILTER: Dropdown RU/BU/PUD/AU/IU/TU.
            Brand: #1E3A5F navy, #F59E0B orange, #020617 bg.
            Must pass tsc + build. Execute autonomously.
            " --dangerously-skip-permissions

            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10

            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "FATAL: No changes"; exit 1; }
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            echo "PUSHED"
            ENDSCRIPT

            chmod +x "$WORK/run.sh"
            chown claude:claude "$WORK/run.sh"
            su -s /bin/bash claude "$WORK/run.sh"
            rm -rf "$WORK"
            echo "SUMMIT COMPLETE"

      - name: Trigger Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'

      - name: Close Issue 41
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41" -d '{"state":"closed","state_reason":"completed"}'

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && MSG="🏔️✅ Explorer V2 DEPLOYED%0Azonewise.ai/explorer" || MSG="🏔️❌ Explorer V2 FAILED"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$MSG" > /dev/null 2>&1 || true
