name: "Gold Standard SHARD-2 Polk (run1635 — C/D/G/H/I fix)"

# WIRING MANDATE: fixes MUST be wired to a scheduled executor to score.
# This workflow applies the C/D/G/H/I fixes for polk county and verifies metrics.
# Citrus and Okaloosa are already 10/10 — no maintenance needed.
# dispatch_id: cbf94bab-2f11-436c-aaf2-68c99ab66450

on:
  schedule:
    # Daily 09:00 UTC — maintains H freshness SLA (<48h) for polk
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - cd_parity
          - h_freshness
          - gi_zoning
          - verify

concurrency:
  group: gold-standard-shard2-polk
  cancel-in-progress: false

jobs:
  polk-fix:
    name: "Polk C/D/G/H/I Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Run Polk comprehensive fix (C/D/G/H/I)
        run: |
          set -euo pipefail
          python3 scripts/shard2_polk_fix_run1635.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  polk-scrape-h:
    name: "Polk H Freshness Scrapes"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: polk-fix
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Dispatch polk realauction scrapes (H freshness)
        run: |
          set +e
          for WEEKS_BACK in 1 2 3; do
            AUCTION_DATE=$(python3 -c "from datetime import date, timedelta; print((date.today() - timedelta(weeks=${WEEKS_BACK})).strftime('%Y-%m-%d'))")
            for SALE_TYPE in tax_deed foreclosure; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"polk\",\"auction_date\":\"${AUCTION_DATE}\",\"sale_type\":\"${SALE_TYPE}\",\"max_pages\":\"10\"}}" \
                || true
              echo "Dispatched polk ${SALE_TYPE} ${AUCTION_DATE}"
              sleep 2
            done
          done

  verify:
    name: "Verify Polk Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: polk-fix
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Verify polk metrics via pencil_dod_evaluate_county
        run: |
          python3 -c "
          import os, httpx, json
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          ACCESS_TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}
          MGMT_URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          MGMT_H = {'Authorization': f'Bearer {ACCESS_TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=120)

          ts = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          print('### SQL VERIFICATION — SHARD-2 Polk Run1635')
          print(f'Timestamp UTC: {ts}')
          print()

          # Per-county evaluation
          r = client.post(f'{BASE}/rpc/pencil_dod_evaluate_county', headers=H, json={'p_county': 'polk'}, timeout=60)
          print('=== pencil_dod_evaluate_county(polk) ===')
          if r.status_code == 200:
              ev = r.json()
              if isinstance(ev, list):
                  passes = [row.get('letter') for row in ev if isinstance(row, dict) and row.get('pass')]
                  fails = [row.get('letter') for row in ev if isinstance(row, dict) and not row.get('pass')]
                  print(f'PASS {len(passes)}/10: {sorted(passes)}')
                  print(f'FAIL: {sorted(fails)}')
                  for row in sorted(ev, key=lambda x: x.get('letter', '')):
                      if isinstance(row, dict):
                          status = 'PASS' if row.get('pass') else 'FAIL'
                          print(f\"  {row.get('letter')}: {status} metric={row.get('metric')}\")
              else:
                  print(f'Unexpected format: {str(ev)[:300]}')
          else:
              print(f'Evaluation failed: {r.status_code} {r.text[:200]}')
          print()

          # Also check raw C/D counts
          if ACCESS_TOKEN:
              r2 = client.post(MGMT_URL, headers=MGMT_H, json={'query': '''
                SELECT
                  COUNT(*) AS total,
                  COUNT(CASE WHEN parity_status = chr(39)||chr(109)||chr(97)||chr(116)||chr(99)||chr(104)||chr(101)||chr(100)||chr(95)||chr(99)||chr(108)||chr(101)||chr(97)||chr(110)||chr(39) THEN 1 END) AS matched_clean,
                  COUNT(CASE WHEN parity_status IN (chr(39)||chr(109)||chr(97)||chr(116)||chr(99)||chr(104)||chr(101)||chr(100)||chr(95)||chr(99)||chr(108)||chr(101)||chr(97)||chr(110)||chr(39),chr(39)||chr(109)||chr(97)||chr(116)||chr(99)||chr(104)||chr(101)||chr(100)||chr(95)||chr(97)||chr(110)||chr(121)||chr(39),chr(39)||chr(109)||chr(97)||chr(116)||chr(99)||chr(104)||chr(101)||chr(100)||chr(95)||chr(100)||chr(105)||chr(118)||chr(101)||chr(114)||chr(103)||chr(101)||chr(110)||chr(116)||chr(39)) THEN 1 END) AS matched_any,
                  ROUND(EXTRACT(EPOCH FROM (NOW() - MAX(last_seen_at))) / 3600, 1) AS h_hours,
                  COUNT(DISTINCT pz.parcel_id) AS pz_count
                FROM multi_county_auctions mca
                LEFT JOIN parcel_zones pz ON pz.parcel_id = mca.parcel_id
                WHERE mca.county = chr(39)||chr(112)||chr(111)||chr(108)||chr(107)||chr(39)
              '''}, timeout=60)
              print('=== Raw C/D/H/G counts ===')
              print(r2.status_code, r2.text[:500] if r2.status_code == 200 else 'mgmt failed')
          " 2>&1 | tee /tmp/polk_verify.txt

          echo '### Polk Run1635 Metrics' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/polk_verify.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Run gold_standard_loop (close-out)
        if: always()
        run: |
          python3 -c "
          import os, httpx
          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=300)
          print('gold_standard_loop...')
          r = client.post(f'{BASE}/rpc/gold_standard_loop', headers=H, json={}, timeout=300)
          print(f'status: {r.status_code}')
          if r.status_code == 200:
              print(r.text[:300])
          import time; time.sleep(5)
          print('gold_standard_certify...')
          r2 = client.post(f'{BASE}/rpc/gold_standard_certify', headers=H, json={}, timeout=120)
          print(f'certify status: {r2.status_code}')
          if r2.status_code == 200:
              print(r2.text[:300])
          " || true
