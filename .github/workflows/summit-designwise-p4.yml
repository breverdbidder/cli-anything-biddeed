name: "Summit: DesignWise P4 — All Agents to 8.5+"
on:
  workflow_dispatch: {}

jobs:
  p4-execute:
    name: "P4: Final Push — 6 agents below 8.5 target"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute P4 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web
            echo "Last 3 commits:"
            git log --oneline -3

            echo "=== [5/6] Claude Code — P4 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='${OAUTH_TOKEN}'
              export SUPABASE_URL='${SUPABASE_URL}'
              export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='${GH_PAT}'
              export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
              export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'

              cd /opt/biddeed/zonewise-web

              claude --print --dangerously-skip-permissions 'MISSION: DesignWise P4 — Push ALL agents to 8.5+ safeguard benchmark. Read docs/plans/DESIGNWISE-TODO.md first. P0-P3 complete. 7 agents already at 8.5+. 6 agents below target need work. Execute in this EXACT priority order — highest ROI per hour first.

AGENT 1 — CodeWise (7.5 to 8.5): Unit tests + pre-commit gate. (a) bun add -D vitest @testing-library/react @testing-library/jest-dom jsdom. (b) Create vitest.config.ts with jsdom env. (c) Write unit tests for the TOP 4 most critical components. Find them by searching components/ for the largest and most imported files. Test: renders without crash, key props work, user interactions fire. Minimum 4 test files. (d) Add a scripts entry in package.json: test runs vitest run. (e) Verify: bun run test passes. Commit: feat(codewise): Unit tests for top components + vitest config.

AGENT 2 — A11yWise (7.5 to 8.5): ARIA completion + contrast. (a) Find ParcelTooltip or equivalent tooltip component in components/explorer/. Add role=tooltip and aria-describedby. (b) Find map controls (zoom buttons, layer toggles) in components/explorer/. Add aria-label to every button. (c) Add keyboard activation (Enter/Space) to any map control that only has onClick. (d) Run a quick contrast check: look at globals.css for any text color on dark bg that has ratio below 4.5:1. Fix the worst offenders. Common issue: text-slate-500 on bg-slate-950 is too low. Bump to text-slate-400 minimum. (e) Commit: feat(a11y): ARIA tooltips + map controls + contrast fixes.

AGENT 3 — SupportWise (7.0 to 8.5): Onboarding tour. (a) bun add @reactour/tour or build a lightweight custom tour with 5 steps (no heavy deps if reactour conflicts). (b) Create components/OnboardingTour.tsx (or update existing components/onboarding/ if it already has tour infrastructure). Check what exists first. (c) 5 steps: Welcome, Map explorer, Chat input, Layer controls, Pricing CTA. (d) Trigger on first visit — check if onboarding dir already has a provider/context. Wire into it. (e) Add contextual tooltip on chat input placeholder: Try asking about zoning in any county. (f) Commit: feat(support): 5-step onboarding tour for new users.

AGENT 4 — AnalyticsWise (8.0 to 8.5): Verify + dashboard config. (a) Check that posthog.capture calls are actually firing by adding a console.log in development. (b) Create a simple PostHog dashboard config comment or doc listing the 5 core metrics to track: daily active users, explorer opens, chat queries, pricing views, signup clicks. Put this in lib/posthog.ts as a comment block or in docs/POSTHOG-DASHBOARD.md. (c) Verify that the conversion funnel trackEvent calls from P1-2 match PostHog event names exactly. (d) Commit: feat(analytics): PostHog dashboard spec + event verification.

AGENT 5 — IterateWise (6.5 to 8.5): Make A/B experiment functional. (a) Read lib/experiments.ts and components that use it (HeroCTA or similar). (b) Ensure the experiment code actually renders different variants based on a flag. If using PostHog feature flags, the flag name should be hero_cta_variant. If PostHog SDK feature flags are not available on client, implement a simple cookie-based random split as fallback. (c) Add conversion tracking: when user clicks the CTA, fire posthog.capture with the variant name. (d) Create docs/EXPERIMENTS.md documenting: hypothesis, variants, metric, duration (2 weeks), start date. (e) Commit: feat(iterate): Functional A/B test with conversion tracking + experiment doc.

AGENT 6 — StitchWise (5.0 to 8.5): Install official skills + prove pipeline. (a) Run: npx skills add google-labs-code/stitch-skills --skill stitch-design --global 2>/dev/null || echo skip. Do same for react:components, design-md, enhance-prompt, shadcn-ui. If npx skills is not available, manually clone the repo and copy SKILL.md files to .skills/ directory. (b) Create .stitch/DESIGN.md documenting the ZoneWise design system: Navy 1E3A5F primary, Orange F59E0B accent, Dark 020617 bg, Inter font, dark mode default. Include component patterns, spacing, border radius conventions from the actual codebase. Analyze globals.css and tailwind.config.ts to extract real tokens. (c) Create a simple proof-of-concept: use the design-md content to generate 1 component specification. Write it as .stitch/generated/sample-component-spec.md. (d) Wire stitch_usage tracking: create lib/stitch-usage.ts that logs generation events to Supabase (table: stitch_usage with columns: id, timestamp, skill_name, input_hash, output_size, success). Create the table via fetch to Supabase REST API if it does not exist. (e) Move any old StitchWise harness references to docs/legacy/. (f) Commit: feat(stitch): Official skills installed + DESIGN.md + usage tracking + proof of concept.

AGENT 7 — Commander (8.5 stays): OAuth health. Only if time remains. (a) Create scripts/oauth-health-check.sh: decode CLAUDE_OAUTH_B64, check if JWT, extract exp, warn if less than 7 days. (b) Commit: feat(commander): OAuth token health check script.

RULES: git config ci@biddeed.ai / BidDeed-CI. Remote: https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git. Commit after EACH agent. Push to main. Update docs/plans/DESIGNWISE-TODO.md. BUILD GATE: bun run build must pass after EVERY commit. If it breaks, fix immediately before moving on. If context hits 50 percent, commit push what you have and stop. Send Telegram summary when done listing each agent and its new score. COST DISCIPLINE: 10 dollar session max. GO.'
            "

            echo "=== [6/6] Done ==="
