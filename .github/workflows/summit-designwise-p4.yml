name: "Summit: DesignWise P4 — All Agents 8.5+"
on:
  workflow_dispatch: {}

jobs:
  p4-execute:
    name: "P4 Final Push"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute P4 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main && git checkout main && git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web

            cat > /tmp/p4-prompt.txt << 'PROMPT_END'
            MISSION DesignWise P4. Push ALL agents to 8.5+ benchmark.
            Read docs/plans/DESIGNWISE-TODO.md first. P0-P3 done. 6 agents below 8.5.

            AGENT 1 CodeWise 7.5 to 8.5. Add vitest unit tests.
            bun add -D vitest @testing-library/react @testing-library/jest-dom jsdom.
            Create vitest.config.ts with jsdom env.
            Write unit tests for top 4 components by size in components dir.
            Test each renders without crash and key interactions work.
            Add test script to package.json. Verify bun run test passes.
            Commit feat codewise unit tests.

            AGENT 2 A11yWise 7.5 to 8.5. ARIA completion plus contrast.
            Find tooltip component in components explorer dir. Add role tooltip and aria-describedby.
            Find map control buttons. Add aria-label to every button.
            Add keyboard activation Enter Space to any control with only onClick.
            Check globals.css for low contrast text on dark bg. Fix worst cases.
            Bump text-slate-500 to text-slate-400 minimum where on dark bg.
            Commit feat a11y ARIA tooltips map controls contrast.

            AGENT 3 SupportWise 7.0 to 8.5. Onboarding tour.
            Check components/onboarding dir for existing infrastructure.
            Build on existing OnboardingProvider if present.
            Create or update onboarding tour with 5 steps.
            Steps Welcome and Map explorer and Chat input and Layers and Pricing.
            Trigger on first visit via context or localStorage flag.
            Add contextual tooltip on chat input placeholder.
            Commit feat support onboarding tour.

            AGENT 4 AnalyticsWise 8.0 to 8.5. Dashboard spec.
            Create docs/POSTHOG-DASHBOARD.md listing 5 core metrics.
            Daily active users and explorer opens and chat queries and pricing views and signups.
            Verify trackEvent calls in codebase match PostHog event names.
            Commit feat analytics PostHog dashboard spec.

            AGENT 5 IterateWise 6.5 to 8.5. Make A/B functional.
            Read lib/experiments.ts. Ensure variant rendering works.
            If PostHog feature flags not available on client use cookie random split fallback.
            Add conversion tracking on CTA click with variant name.
            Create docs/EXPERIMENTS.md with hypothesis variants metric duration.
            Commit feat iterate functional AB test.

            AGENT 6 StitchWise 5.0 to 8.5. Design system plus proof of concept.
            Create .stitch/DESIGN.md documenting ZoneWise design system.
            Extract real tokens from globals.css and tailwind.config.ts.
            Navy 1E3A5F Orange F59E0B Dark 020617 Inter font.
            Document component patterns spacing border radius from actual code.
            Create .stitch/generated/sample-component-spec.md as proof of concept.
            Create lib/stitch-usage.ts for generation event logging.
            Move old harness refs to docs/legacy if any exist.
            Commit feat stitch design system plus poc.

            RULES.
            Git config ci@biddeed.ai BidDeed-CI.
            Remote https x-access-token GH_PAT github.com breverdbidder zonewise-web.git.
            Commit after EACH agent. Push to main.
            Update docs/plans/DESIGNWISE-TODO.md marking tasks done.
            BUILD GATE bun run build must pass after every commit.
            If context 50 percent commit push and stop.
            Send Telegram summary when done.
            Cost 10 dollar max. GO.
            PROMPT_END

            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='${OAUTH_TOKEN}'
              export SUPABASE_URL='${SUPABASE_URL}'
              export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='${GH_PAT}'
              export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
              export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'
              cd /opt/biddeed/zonewise-web
              claude --print --dangerously-skip-permissions < /tmp/p4-prompt.txt
            "
