name: AgentRemote Fix Auth

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find Working LLM Path
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GEMINI_API_KEY
          script: |
            echo "=== 1. Check gcloud for new Gemini key ==="
            which gcloud 2>&1 || echo "gcloud not installed"
            
            echo ""
            echo "=== 2. Check CLIProxyAPI logs ==="
            docker logs biddeed-cliproxy --tail 20 2>&1 || echo "No docker logs"
            
            echo ""
            echo "=== 3. Check CLIProxyAPI config for alternate keys ==="
            cat /opt/cliproxy-gateway/config.yaml 2>&1
            
            echo ""
            echo "=== 4. Check .env.generated for gateway auth ==="
            cat /opt/cliproxy-gateway/.env.generated 2>&1
            
            echo ""
            echo "=== 5. Try Claude CLI with --api-key flag ==="
            claude --help 2>&1 | grep -iE "api.key|provider|base.url|login" | head -10
            
            echo ""
            echo "=== 6. Try Gemini with v1 endpoint (not v1beta) ==="
            curl -s "https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Say hi"}]}]}' 2>&1 | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('error',{}).get('code','ok'),d.get('error',{}).get('message','')[:150] if d.get('error') else d['candidates'][0]['content']['parts'][0]['text'][:100])" 2>&1
            
            echo ""
            echo "=== 7. Try with model list to see what's available ==="
            curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" 2>&1 | python3 -c "
            import sys,json
            d=json.load(sys.stdin)
            for m in d.get('models',[])[:15]:
                name = m.get('name','').replace('models/','')
                methods = ','.join(m.get('supportedGenerationMethods',[]))
                print(f'  {name:40} {methods}')
            " 2>&1
