name: AgentRemote Fix Auth

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fix LLM Access on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GEMINI_API_KEY
          script: |
            echo "=== 1. Restart CLIProxyAPI ==="
            cd /opt/cliproxy-gateway && docker compose restart 2>&1 || echo "Docker restart failed"
            sleep 5
            curl -sf http://127.0.0.1:8317/health 2>&1 || echo "CLIProxyAPI still down"
            
            echo ""
            echo "=== 2. Test different Gemini models ==="
            for model in gemini-2.0-flash-lite gemini-1.5-flash gemini-2.0-flash; do
              echo "Testing $model..."
              RESP=$(curl -s -w "\n%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d '{"contents":[{"parts":[{"text":"Say hello in one word"}]}]}')
              HTTP=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | head -n -1)
              echo "  HTTP: $HTTP"
              if [ "$HTTP" = "200" ]; then
                echo "  ✅ $model WORKS"
                echo "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);print('  Response:',d['candidates'][0]['content']['parts'][0]['text'][:100])" 2>/dev/null
                break
              else
                echo "  ❌ $model failed"
                echo "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);print('  Error:',d.get('error',{}).get('message','')[:100])" 2>/dev/null
              fi
            done
            
            echo ""
            echo "=== 3. Test Claude login via Max plan key file ==="
            ls -la ~/.claude/ 2>/dev/null || echo "No ~/.claude dir"
            cat ~/.claude/.credentials.json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps({k:v[:20]+'...' if isinstance(v,str) and len(v)>20 else v for k,v in d.items()}, indent=2))" 2>/dev/null || echo "No credentials file"
