name: AgentRemote Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== 1. Auth check ==="
            claude --version 2>&1
            echo "---"
            claude auth status 2>&1 || true
            
            echo ""
            echo "=== 2. Exact executor command ==="
            python3 -c "
            import subprocess, json
            cmd = ['claude', '--print', '--output-format', 'text', '--max-turns', '25', '--verbose', 'Say hello world']
            print(f'CMD: {cmd}')
            r = subprocess.run(cmd, capture_output=True, text=True, timeout=30, cwd='/root')
            print(f'RETURNCODE: {r.returncode}')
            print(f'STDOUT: [{r.stdout[:500]}]')
            print(f'STDERR: [{r.stderr[:500]}]')
            " 2>&1
            
            echo ""
            echo "=== 3. Simpler command ==="
            python3 -c "
            import subprocess
            r = subprocess.run(['claude', '--print', 'Say hello'], capture_output=True, text=True, timeout=30)
            print(f'RC: {r.returncode}')
            print(f'OUT: [{r.stdout[:300]}]')
            print(f'ERR: [{r.stderr[:300]}]')
            " 2>&1
            
            echo ""
            echo "=== 4. Even simpler ==="
            echo "Say hello" | claude --print 2>&1 | head -10
            echo "EXIT: $?"
            
            echo ""
            echo "=== 5. Claude help flags ==="
            claude --help 2>&1 | grep -E "(print|output|format|verbose|max-turns)" | head -10
