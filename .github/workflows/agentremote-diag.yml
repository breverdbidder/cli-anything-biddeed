name: AgentRemote Fix Auth

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add DeepSeek Key and Restart
        uses: appleboy/ssh-action@v1
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== 1. Add DeepSeek key to executor .env ==="
            grep -q "DEEPSEEK_API_KEY" /opt/agentremote-executor/.env && \
              sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=sk-ef423e40aa164b67ac581d6f6ab51475|" /opt/agentremote-executor/.env || \
              echo "DEEPSEEK_API_KEY=sk-ef423e40aa164b67ac581d6f6ab51475" >> /opt/agentremote-executor/.env
            
            echo "=== 2. Test DeepSeek directly ==="
            curl -s "https://api.deepseek.com/v1/chat/completions" \
              -H "Authorization: Bearer sk-ef423e40aa164b67ac581d6f6ab51475" \
              -H "Content-Type: application/json" \
              -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"Say hello in one sentence"}],"max_tokens":50}' 2>&1 | python3 -c "
            import sys,json
            d=json.load(sys.stdin)
            if 'choices' in d:
                print('✅ DeepSeek WORKS:', d['choices'][0]['message']['content'][:100])
            else:
                print('❌ DeepSeek error:', json.dumps(d)[:200])
            " 2>&1
            
            echo ""
            echo "=== 3. Restart executor with new key ==="
            systemctl restart agentremote-executor
            sleep 3
            
            echo "=== 4. Verify ==="
            systemctl is-active agentremote-executor
            curl -sf http://127.0.0.1:8318/health | python3 -m json.tool
            
            echo ""
            echo "=== 5. Verify env loaded ==="
            cat /opt/agentremote-executor/.env | sed 's/=.*/=***/'
