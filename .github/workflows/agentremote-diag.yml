name: AgentRemote Fix Auth

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fix Claude Auth on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ANTHROPIC_API_KEY
          script: |
            echo "=== 1. Add API key to executor .env ==="
            # Append ANTHROPIC_API_KEY if not already there
            grep -q "ANTHROPIC_API_KEY" /opt/agentremote-executor/.env && \
              sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}|" /opt/agentremote-executor/.env || \
              echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> /opt/agentremote-executor/.env
            
            echo "=== 2. Update systemd to pass it ==="
            # Add to systemd environment
            grep -q "ANTHROPIC_API_KEY" /etc/systemd/system/agentremote-executor.service || \
              sed -i '/^EnvironmentFile=/a Environment=ANTHROPIC_API_KEY=' /etc/systemd/system/agentremote-executor.service
            
            echo "=== 3. Test CLI with API key ==="
            export ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}"
            timeout 30 claude -p "Say hello" 2>&1 | head -5
            echo "EXIT: $?"
            
            echo ""
            echo "=== 4. Restart executor ==="
            systemctl daemon-reload
            systemctl restart agentremote-executor
            sleep 3
            
            echo "=== 5. Verify ==="
            systemctl is-active agentremote-executor
            curl -sf http://127.0.0.1:8318/health | python3 -m json.tool
            
            echo ""
            echo "=== 6. Check env is loaded ==="
            cat /opt/agentremote-executor/.env | sed 's/=.*/=***/'
