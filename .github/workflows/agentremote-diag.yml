name: AgentRemote Fix Auth

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Claude Login on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          command_timeout: 3m
          script: |
            echo "=== Starting claude login ==="
            
            # Run claude login in background, capture output
            timeout 120 claude login --no-open 2>&1 | tee /tmp/claude_login_output.txt &
            LOGIN_PID=$!
            
            # Wait for URL to appear (up to 30s)
            for i in $(seq 1 30); do
              sleep 2
              URL=$(grep -oP 'https://[^\s]+' /tmp/claude_login_output.txt 2>/dev/null | head -1)
              if [ -n "$URL" ]; then
                echo "Found URL: $URL"
                
                # Send URL to Telegram
                curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="${TELEGRAM_CHAT_ID}" \
                  -d text="🔑 *Claude Login Required*

Tap this link to authenticate Claude Code on Hetzner:

${URL}

After logging in, the bot will auto-upgrade to Claude CLI (Max plan, \$0/task)." \
                  -d parse_mode="Markdown" \
                  -d disable_web_page_preview="true"
                
                echo "URL sent to Telegram!"
                break
              fi
              echo "Waiting for URL... ($i)"
            done
            
            # Wait for login to complete (user needs to click URL)
            echo "Waiting for user to complete login (up to 90s)..."
            wait $LOGIN_PID 2>/dev/null
            EXIT_CODE=$?
            
            echo ""
            echo "=== Login result ==="
            cat /tmp/claude_login_output.txt
            echo "Exit code: $EXIT_CODE"
            
            echo ""
            echo "=== Auth status ==="
            claude auth status 2>&1
            
            # If logged in, restart executor
            if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
              echo "✅ LOGGED IN! Restarting executor..."
              systemctl restart agentremote-executor
              sleep 3
              curl -sf http://127.0.0.1:8318/health | python3 -m json.tool
              
              # Notify success on Telegram
              curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="✅ Claude CLI authenticated on Hetzner! Bot now uses Claude Max plan (\$0/task). DeepSeek is fallback only." \
                -d parse_mode="Markdown"
            else
              echo "❌ Not logged in yet"
              
              curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="⚠️ Login timed out. You can try again or SSH to Hetzner: ssh root@87.99.129.125 then run: claude login"
            fi
