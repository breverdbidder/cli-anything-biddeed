name: "Jefferson B/F Probe — 2026-07-24 Fresh Sources"
# Triggered by Gold Standard Shard-6, run 6253 (issue #13868).
# Jefferson is at 8/10 (B and F FAIL) for 4 consecutive sessions.
# Root blocker: case 25-CA-164 (sold 2026-06-25) has sold_amount IS NULL.
# All independent source probes prior to 2026-07-24 were blocked by:
#   - Civitek OCRS: Turnstile-gated
#   - myfloridacounty.com/orisearch/33: Turnstile-gated
#   - qpublic.schneidercorp.com: HTTP 403
#   - FL GIO SALE_PRC1: stale DOR roll (2025 data, predates 2026-06-25 sale)
#   - JCPA ArcGIS (checked 2026-07-19, day 24): THOMPSON still owner
#
# NEW APPROACH (2026-07-24, day 29 post-sale):
#   - JCPA ArcGIS re-probe: FL appraisers typically process deeds in 14-30 days
#   - jeffersonclerk.com: may have added a "Past Sales" section post-sale
#   - FL DOR SUNTAX/RPT parcel-transfer data (separate from stale cadastral)
#   - Attom Data / PropertyShark / other real estate data aggregators
#
# If JCPA now shows sale_price > 0, this session writes:
#   1. sold_amount on the MCA row
#   2. foreclosure_outcomes row (data_source=jcpa_arcgis:SHARD6-JEFFERSON-BF-V1)
#   3. tier1_sold_amount + tier1_authoritative on the MCA row
#   4. ultraloop_audit survived=true row for B and F
# Then runs pencil_dod_evaluate_county('jefferson') to confirm 10/10.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - probe sources but do not write to DB'
        required: false
        default: 'false'

jobs:
  probe:
    name: "Jefferson B/F blocker probe — fresh data sources"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install dependencies"
        run: pip install pypdf

      - name: "Run B/F probe"
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          python3 scripts/jefferson_bf_probe_20260724.py

      - name: "Run evaluator to check if B/F moved"
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, json, urllib.request
          SUPABASE_URL = os.environ["SUPABASE_URL"]
          KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          body = json.dumps({"p_county": "jefferson"}).encode()
          req = urllib.request.Request(
              f"{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
              data=body,
              headers={
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read())
          print("### SQL VERIFICATION")
          print("```")
          print("SELECT public.pencil_dod_evaluate_county('jefferson');")
          for letter in "ABCDEFGHIJ":
              ld = result.get(letter, {})
              mark = "PASS" if ld.get("pass") else "FAIL"
              print(f"  {letter}: {mark} metric={ld.get('metric')} detail={ld.get('detail','')}")
          print(f"  auctions_total={result.get('auctions_total')}")
          print("```")
          b = result.get("B", {})
          f = result.get("F", {})
          b_pass = b.get("pass", False)
          f_pass = f.get("pass", False)
          if b_pass and f_pass:
              print("::notice::Jefferson B AND F now PASS — 10/10 achieved!")
          elif b_pass or f_pass:
              print(f"::notice::Jefferson partial progress — B={'PASS' if b_pass else 'FAIL'} F={'PASS' if f_pass else 'FAIL'}")
          else:
              print("::warning::Jefferson B and F still FAIL — blocker persists")

          import os
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary_path:
              with open(summary_path, "a") as f_out:
                  f_out.write("### SQL VERIFICATION\n")
                  f_out.write("```sql\n")
                  f_out.write("SELECT public.pencil_dod_evaluate_county('jefferson');\n")
                  for letter in "ABCDEFGHIJ":
                      ld = result.get(letter, {})
                      mark = "PASS" if ld.get("pass") else "FAIL"
                      f_out.write(f"  {letter}: {mark} metric={ld.get('metric')} detail={ld.get('detail','')}\n")
                  f_out.write(f"  auctions_total={result.get('auctions_total')}\n")
                  f_out.write("```\n")
          EOF
