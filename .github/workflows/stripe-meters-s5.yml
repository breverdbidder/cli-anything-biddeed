name: "Stripe S5 Meters — Billing Meter + Metered Prices → Supabase"
# Zero-HITL: creates the S5 billing meter (if missing) + metered prices for
# investor/pro/proplus attached to EXISTING products, writes stripe_meter_id +
# stripe_s5_price_id to stripe_products. Idempotent — safe to re-run.
#
# Surface to Ariel ONLY if STRIPE_SECRET_KEY missing/invalid.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — skip Stripe API calls, only verify secrets present"
        required: false
        default: "false"
        type: string

jobs:
  meters:
    name: "P1 — Stripe billing meters + Supabase writeback"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard — STRIPE_SECRET_KEY must be set
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "${STRIPE_SECRET_KEY}" ]; then
            echo "::error::STRIPE_SECRET_KEY secret is not set. Add it at Settings → Secrets → Actions."
            exit 1
          fi
          echo "STRIPE_SECRET_KEY present (first 6 chars: $(echo "${STRIPE_SECRET_KEY}" | cut -c1-6)...)"

      - name: Install stripe SDK
        run: npm install stripe --no-save

      - name: Run stripe-meters-s5.js
        if: ${{ inputs.dry_run != 'true' }}
        env:
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
        run: |
          set -o pipefail
          node scripts/stripe-meters-s5.js 2>&1 | tee /tmp/stripe-meters-s5.log

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "DRY_RUN=true — secrets verified, Stripe API calls skipped."

  verify:
    name: "P2 — SHIP GATE verification"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: meters
    if: ${{ inputs.dry_run != 'true' }}
    steps:
      - name: Query stripe_products
        run: |
          ROWS=$(curl -sf \
            "${{ secrets.SUPABASE_URL }}/rest/v1/stripe_products?select=tier_id,stripe_meter_id,stripe_s5_price_id&tier_id=in.(investor,pro,proplus)&order=tier_id" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "### SQL VERIFICATION"
          echo '```'
          echo "SELECT count(*) FROM public.stripe_products WHERE tier_id IN ('investor','pro','proplus') AND (stripe_meter_id IS NULL OR stripe_s5_price_id IS NULL);"
          echo ""
          echo "$ROWS" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          missing = [r for r in rows if not r.get('stripe_meter_id') or not r.get('stripe_s5_price_id')]
          for r in rows:
            print(f\"  {r['tier_id']:<12} meter={r['stripe_meter_id']}  s5_price={r['stripe_s5_price_id']}\")
          print()
          print(f'count={len(missing)}')
          if missing:
            sys.exit(1)
          print('PASS: investor/pro/proplus all wired')
          print(f'Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)')
          "
          echo '```'
