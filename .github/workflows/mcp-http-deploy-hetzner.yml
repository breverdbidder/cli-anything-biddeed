name: "MCP HTTP — Deploy to Hetzner"
# Deploys biddeed-mcp HTTP server to Hetzner 87.99.129.125:3031
# Run after npm publish or any time the HTTP server needs a refresh.

on:
  workflow_dispatch:
    inputs:
      port:
        description: "HTTP port (default: 3031)"
        required: false
        default: "3031"
        type: string

jobs:
  deploy:
    name: "Deploy MCP HTTP server to Hetzner"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Copy package to Hetzner + restart
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          HETZNER_IP="87.99.129.125"
          PORT="${{ inputs.port }}"

          # Write SSH key to temp file
          echo "$HETZNER_SSH_KEY" > /tmp/hetzner_key
          chmod 600 /tmp/hetzner_key

          SSH="ssh -i /tmp/hetzner_key -o StrictHostKeyChecking=no root@${HETZNER_IP}"
          SCP="scp -i /tmp/hetzner_key -o StrictHostKeyChecking=no"

          echo "=== Syncing packages/biddeed-mcp to Hetzner ==="
          $SSH "mkdir -p /opt/biddeed-mcp"
          $SCP -r packages/biddeed-mcp/ root@${HETZNER_IP}:/opt/biddeed-mcp/

          echo "=== Installing dependencies on Hetzner ==="
          $SSH "cd /opt/biddeed-mcp/biddeed-mcp && npm install --production 2>&1 | tail -3"

          echo "=== Writing .env file on Hetzner ==="
          $SSH "cat > /opt/biddeed-mcp/.env <<'ENVEOF'
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
          PORT=${PORT}
          ENVEOF"

          echo "=== Setting up systemd service ==="
          $SSH "cat > /etc/systemd/system/biddeed-mcp-http.service <<'SVCEOF'
          [Unit]
          Description=BidDeed MCP HTTP Server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/biddeed-mcp/biddeed-mcp
          EnvironmentFile=/opt/biddeed-mcp/.env
          ExecStart=/usr/bin/node bin/biddeed-mcp-http.js
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SVCEOF"

          $SSH "systemctl daemon-reload && systemctl enable biddeed-mcp-http && systemctl restart biddeed-mcp-http"

          echo "=== Waiting for server to be healthy ==="
          sleep 5
          HTTP_STATUS=$($SSH "curl -s -o /dev/null -w '%{http_code}' http://localhost:${PORT}/health" 2>/dev/null) || HTTP_STATUS="error"
          echo "Health check: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ biddeed-mcp HTTP server live on ${HETZNER_IP}:${PORT}"
            echo ""
            echo "Claude Desktop config:"
            echo '{'
            echo '  "mcpServers": {'
            echo '    "biddeed": {'
            echo '      "type": "http",'
            echo "      \"url\": \"http://${HETZNER_IP}:${PORT}/mcp\","
            echo '      "headers": { "Authorization": "Bearer bd_live_..." }'
            echo '    }'
            echo '  }'
            echo '}'
          else
            echo "::warning::Health check returned $HTTP_STATUS — check Hetzner logs: journalctl -u biddeed-mcp-http -n 50"
            $SSH "journalctl -u biddeed-mcp-http -n 30 --no-pager" || true
            exit 1
          fi
