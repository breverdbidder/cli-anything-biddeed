name: "Gold Standard SHARD-3 Lake (dispatch 77ac9cef)"

# dispatch_id: 77ac9cef-69e5-48e3-b76e-7bddb2b42d7d
# County: lake (8/10 → target 10/10)
# Failing: C (94.1% matched_clean=111/118 need>=112) + I (67.8% card_complete=80/118 need>=112)
# Fix: municipal zoning substrate (Groveland/Tavares/Umatilla/Mascotte) + clerk Playwright crosscheck

on:
  workflow_dispatch:

concurrency:
  group: gold-standard-shard3-lake-77ac9cef
  cancel-in-progress: false

jobs:
  lake-ci-fix:
    name: "Lake C+I Fix (dispatch 77ac9cef)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx playwright --quiet

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium --with-deps
        continue-on-error: true

      - name: Run lake main executor (I-fix + C-fix + ultraloop + closeout)
        run: python3 scripts/shard3_lake_main_executor_77ac9cef.py 2>&1 | tee /tmp/lake_executor_output.txt

      - name: Upload results to step summary
        if: always()
        run: |
          echo "## LAKE DISPATCH 77ac9cef Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/lake_executor_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  verify:
    name: "Verify Lake Scoreboard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lake-ci-fix
    if: always()
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Verify lake pencil_dod + certifications
        run: |
          python3 - << 'EOF'
          import os, httpx, json, sys

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=60)

          print('### SQL VERIFICATION - LAKE DISPATCH 77ac9cef')

          r = client.post(URL, headers=H,
                          json={'query': "SELECT * FROM public.pencil_dod_evaluate_county('lake');"})
          data = r.json()
          row = data[0] if data else {}
          result = row.get('pencil_dod_evaluate_county', row)

          passes = sum(1 for letter in 'ABCDEFGHIJ'
                       if isinstance(result.get(letter), dict) and result[letter].get('pass') is True)
          fails = [letter for letter in 'ABCDEFGHIJ'
                   if isinstance(result.get(letter), dict) and result[letter].get('pass') is not True]

          print(f'  lake: {passes}/10 FAIL={fails}')
          for letter in 'ABCDEFGHIJ':
              d = result.get(letter, {})
              print(f'    {letter}: pass={d.get("pass")} metric={d.get("metric")} detail={d.get("detail")}')

          r2 = client.post(URL, headers=H, json={'query': """
              SELECT county_slug, certified, consecutive_gold
              FROM gold_standard_certifications
              WHERE county_slug = 'lake'
          """})
          print()
          print('=== Certification ===')
          for row2 in (r2.json() or []):
              status = 'CERTIFIED' if row2.get('certified') else 'PENDING'
              print(f'  lake: {status} (consecutive={row2.get("consecutive_gold", 0)})')

          print()
          print(f'FINAL: {passes}/10 passing')
          if passes < 10:
              print(f'STILL FAILING: {fails}')
              sys.exit(1)
          else:
              print('LAKE 10/10 GOLD STANDARD CERTIFIED')
          EOF
        continue-on-error: true
