name: fl-parcel-centroids-all

on:
  workflow_dispatch:
    inputs:
      co_no:
        description: 'co_no to process (0 = auto-pick next 2 pending counties)'
        required: false
        default: '0'
      page_size:
        description: 'Records per API page'
        required: false
        default: '500'
      max_pages:
        description: 'Max pages per worker'
        required: false
        default: '300'
  schedule:
    - cron: '20 */2 * * *'

concurrency:
  group: fl-parcel-centroids-all
  cancel-in-progress: false

jobs:
  pick-counties:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      skip_reason: ${{ steps.pick.outputs.skip_reason }}
    steps:
      - name: Resolve live service_role key
        id: key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/api-keys" \
            | python3 -c "
          import sys,json
          for k in json.load(sys.stdin):
              if k.get('name')=='service_role':
                  print(k['api_key']); break
          ")
          echo "::add-mask::$KEY"
          echo "service_key=$KEY" >> $GITHUB_OUTPUT

      - name: Pick next 2 pending counties
        id: pick
        env:
          SUPABASE_URL: "https://mocerqjnksmhcjzxrewo.supabase.co"
          SUPABASE_KEY: ${{ steps.key.outputs.service_key }}
          MANUAL_CO_NO: ${{ github.event.inputs.co_no || '0' }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, datetime

          url  = os.environ["SUPABASE_URL"]
          key  = os.environ["SUPABASE_KEY"]
          manual = os.environ["MANUAL_CO_NO"]
          hdrs = {"apikey": key, "Authorization": f"Bearer {key}"}

          # Pre-flight: skip this run entirely if the DB restarted in the last
          # 10 minutes — an 8-way (now 2-way) matrix hitting PostgREST right
          # after a restart is exactly the load pattern LAUNCH-E is cutting.
          restart_req = urllib.request.Request(
              f"{url}/rest/v1/db_restart_log?select=observed_at&order=observed_at.desc&limit=1",
              headers=hdrs
          )
          try:
              with urllib.request.urlopen(restart_req) as r:
                  restart_rows = json.loads(r.read())
          except Exception as e:
              restart_rows = []
              print(f"db_restart_log check failed (proceeding): {e}")

          if restart_rows:
              latest = datetime.datetime.fromisoformat(restart_rows[0]["observed_at"].replace("Z", "+00:00"))
              age_s = (datetime.datetime.now(datetime.timezone.utc) - latest).total_seconds()
              print(f"Latest db restart: {restart_rows[0]['observed_at']} ({age_s:.0f}s ago)")
              if age_s < 600:
                  print(f"SKIP — DB restarted {age_s:.0f}s ago (<600s threshold)")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write('matrix={"include":[]}\n')
                      f.write(f"skip_reason=db_restart_{int(age_s)}s_ago\n")
                  raise SystemExit(0)

          def patch(path, body):
              urllib.request.urlopen(urllib.request.Request(
                  f"{url}/rest/v1/{path}",
                  data=json.dumps(body).encode(),
                  method="PATCH",
                  headers={**hdrs,"Content-Type":"application/json","Prefer":"return=minimal"}
              ))

          # Reset false-done (done but centroids_done=0)
          patch("fl_parcel_centroid_progress?status=eq.done&centroids_done=eq.0",
                {"status":"pending","last_parcel_id":None,"centroids_done":0,"completed_at":None})

          # Reset errored counties back to pending
          patch("fl_parcel_centroid_progress?status=eq.error",
                {"status":"pending","error_msg":None})

          # Reset stale-running: no checkpoint written in >10min means worker died
          stale_cutoff = (datetime.datetime.utcnow() - datetime.timedelta(minutes=10)).strftime("%Y-%m-%dT%H:%M:%SZ")
          patch(f"fl_parcel_centroid_progress?status=eq.running&updated_at=lt.{stale_cutoff}",
                {"status":"pending"})

          if manual != "0":
              counties = [{"co_no": manual, "slot": 1}]
          else:
              req = urllib.request.Request(
                  f"{url}/rest/v1/fl_parcel_centroid_progress?status=eq.pending&centroids_needed=gt.0&order=centroids_needed.desc&limit=2&select=co_no,county_name",
                  headers=hdrs
              )
              with urllib.request.urlopen(req) as r:
                  rows = json.loads(r.read())
              counties = [{"co_no": str(row["co_no"]), "slot": i+1, "county": row["county_name"]} for i, row in enumerate(rows)]

          if not counties:
              print("No pending counties — all done!")
              counties = []

          matrix = json.dumps({"include": counties})
          print(f"Matrix: {matrix}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          PYEOF

  enrich:
    needs: pick-counties
    if: ${{ needs.pick-counties.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      matrix: ${{ fromJson(needs.pick-counties.outputs.matrix) }}
      fail-fast: false   # one county failing won't kill the other

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stagger start (non-slot-1 workers spread 15s apart to avoid API collision)
        if: matrix.slot != 1
        run: sleep $(( (${{ matrix.slot }} - 1) * 15 ))

      - name: Resolve live service_role key
        id: key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/api-keys" \
            | python3 -c "
          import sys,json
          for k in json.load(sys.stdin):
              if k.get('name')=='service_role':
                  print(k['api_key']); break
          ")
          echo "::add-mask::$KEY"
          echo "service_key=$KEY" >> $GITHUB_OUTPUT
          echo "Processing county co_no=${{ matrix.co_no }} (${{ matrix.county }})"

      - name: Run centroid enrichment
        env:
          SUPABASE_URL: "https://mocerqjnksmhcjzxrewo.supabase.co"
          SUPABASE_SERVICE_KEY: ${{ steps.key.outputs.service_key }}
          CO_NO: ${{ matrix.co_no }}
          PAGE_SIZE: ${{ github.event.inputs.page_size || '500' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '300' }}
        run: python scripts/fl_parcel_centroids_all.py

      - name: Summary
        if: always()
        run: |
          echo "## County co_no=${{ matrix.co_no }} (${{ matrix.county }})" >> $GITHUB_STEP_SUMMARY
          echo "slot: ${{ matrix.slot }}" >> $GITHUB_STEP_SUMMARY
