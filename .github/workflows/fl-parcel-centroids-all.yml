name: fl-parcel-centroids-all

on:
  workflow_dispatch:
    inputs:
      co_no:
        description: 'co_no to process (0 = auto-pick next pending county)'
        required: false
        default: '0'
      page_size:
        description: 'Records per API page (max 2000)'
        required: false
        default: '2000'
      max_pages:
        description: 'Max pages per run (300 = 600K parcels)'
        required: false
        default: '300'
  schedule:
    - cron: '20 */2 * * *'   # every 2h offset from other crons

concurrency:
  group: fl-parcel-centroids-all
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve live service_role key
        id: resolve_key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Use Supabase Management API to get the current service_role key
          KEY=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/api-keys" \
            | python3 -c "
import sys, json
keys = json.load(sys.stdin)
for k in keys:
    if k.get('name') == 'service_role':
        print(k['api_key'])
        break
")
          if [ -z "$KEY" ]; then
            echo "Failed to resolve service_role key" >&2
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "service_key=$KEY" >> $GITHUB_OUTPUT
          echo "Resolved live service_role key ✓"

      - name: Run centroid enrichment
        env:
          SUPABASE_URL:         "https://mocerqjnksmhcjzxrewo.supabase.co"
          SUPABASE_SERVICE_KEY: ${{ steps.resolve_key.outputs.service_key }}
          CO_NO:     ${{ github.event.inputs.co_no || '0' }}
          PAGE_SIZE: ${{ github.event.inputs.page_size || '2000' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '300' }}
        run: python scripts/fl_parcel_centroids_all.py

      - name: Summary
        if: always()
        run: |
          echo "## FL Parcel Centroid Enrichment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| county co_no | ${{ env.CO_NO }} |" >> $GITHUB_STEP_SUMMARY
