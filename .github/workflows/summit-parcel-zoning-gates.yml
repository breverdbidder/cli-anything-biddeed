name: "SUMMIT: Parcel+Zoning Linkage Gates 3+4"

# summit_dispatch_id: 895e6ae7-fdfd-4dde-a85f-b636b498f49f | Track 5 of 5
# Fixes Gate 3 (fl_parcels join) + Gate 4 (parcel_zones join) for Brevard+Duval.
# Actions:
#   A: Fill null Brevard parcel_ids via realforeclose_aids → AcclaimWeb fallback
#   B: BCPAO API crosswalk: numeric MCA parcel_ids → canonical space-dash format
#   C: fl_parcels stubs for any unmatched parcel_id (Gate 3 insurance)
#   D: parcel_zones stubs for all upcoming MCA parcel_ids (Gate 4)

on:
  workflow_dispatch: {}

jobs:
  fix-gates:
    name: "Fix Gates 3+4 — Brevard+Duval parcel linkage"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Run fix_parcel_zoning_linkage.py"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/fix_parcel_zoning_linkage.py
