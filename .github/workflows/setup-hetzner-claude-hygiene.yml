name: Setup Claude Code Hygiene on Hetzner

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Claude Code + Hygiene on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          password: ${{ secrets.HETZNER_PASSWORD }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            echo "=== [1/5] Node.js ==="
            if ! command -v node &>/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -qq nodejs
            fi
            node --version
            npm --version

            echo "=== [2/5] Claude Code CLI ==="
            if ! command -v claude &>/dev/null; then
              npm install -g @anthropic-ai/claude-code
              echo "Claude Code installed"
            else
              echo "Claude Code already installed"
              claude --version 2>/dev/null || true
            fi

            echo "=== [3/5] CC Status Line ==="
            npm install -g cc-status-line@latest 2>/dev/null || echo "cc-status-line install attempted"
            echo "CC Status Line installed globally"

            echo "=== [4/5] Claude Code Global Config ==="
            mkdir -p /root/.claude

            cat > /root/.claude/CLAUDE.md << 'MDEOF'
# Session Hygiene Rules (Auto-deployed Mar 15, 2026)

## Mandatory Plugins
1. Context7 — Live API docs. /plugin → context7
2. CC Status Line — Context monitor. npx cc-status-line@latest

## Context Window Rules
- 50% RULE: Kill and restart at ~50% context.
- NEVER /compact. Start fresh instead.
- Sub-agents for heavy work via Superpowers execute-plan.
- cli-anything harnesses: checkpoint between HARNESS.md phases.

## CC Status Line Config
Line 1: model | context% | session_cost | session_clock
Line 2: git_branch | git_worktree
MDEOF

            echo "=== [5/5] Clone repos for Claude Code workspace ==="
            mkdir -p /opt/biddeed
            for repo in cli-anything-biddeed biddeed-ai zonewise-scraper-v4; do
              if [ ! -d "/opt/biddeed/$repo" ]; then
                cd /opt/biddeed && git clone "https://github.com/breverdbidder/$repo.git" 2>&1 | tail -1
              else
                cd "/opt/biddeed/$repo" && git pull origin main 2>&1 | tail -1
              fi
            done

            echo ""
            echo "=== RESULTS ==="
            echo "Node: $(node --version)"
            echo "NPM: $(npm --version)"
            which claude && echo "Claude CLI: $(which claude)" || echo "Claude CLI: not found"
            ls -la /root/.claude/CLAUDE.md
            ls /opt/biddeed/
            echo ""
            echo "STATUS: Server prepped. Run 'claude login' via SSH to authenticate once."
