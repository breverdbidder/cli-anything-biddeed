name: Setup Claude Code Hygiene on Hetzner

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Claude Code + Hygiene on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            echo "=== [1/5] Node.js ==="
            if ! command -v node &>/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -qq nodejs
            fi
            node --version
            npm --version

            echo "=== [2/5] Claude Code CLI ==="
            if ! command -v claude &>/dev/null; then
              npm install -g @anthropic-ai/claude-code
              echo "Claude Code installed"
            else
              echo "Claude Code already installed: $(claude --version 2>/dev/null || echo 'installed')"
            fi

            echo "=== [3/5] CC Status Line ==="
            npx cc-status-line@latest << 'STATUSEOF'
model | context% | session_cost | session_clock
git_branch | git_worktree
STATUSEOF
            echo "CC Status Line configured"

            echo "=== [4/5] Context7 Plugin Setup ==="
            mkdir -p /root/.claude/plugins
            # Pre-configure Context7 so it's ready when Claude boots
            cat > /tmp/install-context7.sh << 'C7EOF'
#!/bin/bash
# Run inside a Claude Code session: /plugin → context7
# Or run: claude --print "install context7 plugin"
echo "Context7 must be installed from within a Claude Code session."
echo "Run: /plugin → Discover → context7 → Install"
C7EOF
            chmod +x /tmp/install-context7.sh
            echo "Context7 prep done (plugin install requires active session)"

            echo "=== [5/5] Claude Code Config ==="
            mkdir -p /root/.claude
            # Write session hygiene rules to global CLAUDE.md
            cat > /root/.claude/CLAUDE.md << 'MDEOF'
# Session Hygiene Rules (Auto-deployed Mar 15, 2026)

## Mandatory Plugins
1. Context7 — Live API docs. /plugin → context7
2. CC Status Line — Context monitor. npx cc-status-line@latest

## Context Window Rules
- 50% RULE: Kill and restart at ~50% context.
- NEVER /compact. Start fresh instead.
- Sub-agents for heavy work via Superpowers execute-plan.
- cli-anything harnesses: checkpoint between HARNESS.md phases.
MDEOF

            echo ""
            echo "=== DONE ==="
            echo "Node: $(node --version)"
            echo "NPM: $(npm --version)"
            which claude && echo "Claude Code: installed" || echo "Claude Code: install pending"
            echo ""
            echo "NEXT: Run 'claude login' on Hetzner via SSH to authenticate (one-time OAuth)."
            echo "Then inside Claude Code: /plugin → context7 to complete setup."
