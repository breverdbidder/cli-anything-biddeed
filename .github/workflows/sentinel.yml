name: "Everest Sentinel"

# LAUNCH-E (#20039, 2026-09-05): schedule retired — consolidated into
# sentinel-v2.yml, which now carries the canonical `7,37 * * * *` schedule
# for this three-workflow group (sentinel.yml / sentinel-v2.yml /
# everest-sentinel-5-repos-deploy.yml). This file is workflow_dispatch-only;
# dispatch it manually if scripts/sentinel-patrol.sh's specific checks are
# needed outside sentinel-v2's coverage.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Specific run ID to triage (optional)'
        required: false

jobs:
  sentinel:
    name: "Patrol + Auto-Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sentinel.sh
            scripts/sentinel-patrol.sh

      - name: "Patrol for failed/stale SUMMITs"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          REPO: ${{ github.repository }}
          MANUAL_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          chmod +x scripts/sentinel.sh scripts/sentinel-patrol.sh
          bash scripts/sentinel-patrol.sh
