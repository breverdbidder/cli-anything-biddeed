name: "GOLD STANDARD SHARD-5: levy / jackson / sarasota (run 6046)"
# dispatch_id: e1b98987-617e-4804-aac8-3c21bfbb3933
# Session: architect-20260723T160000
# Targets:
#   levy:     9/10 -> fix H freshness, assess A (fc=0 genuine)
#   jackson:  7/10 -> fix C/D (86.3%), I (83.6%)
#   sarasota: 5/10 -> fix G, I (80.2%), J (0%), reharvest C/D (54%)
#
# WIRING MANDATE: Scheduled daily at 06:30Z (before 07:30Z gold_standard_loop).
# PARALLEL-FLEET RULES: Commits stay county-scoped. No cross-shard writes.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'County to run (levy, jackson, sarasota, or all)'
        required: false
        default: 'all'

jobs:

  # ── LEVY: H Freshness + A Assessment ─────────────────────────────────────
  levy-h-freshness:
    name: "levy: H freshness + A assessment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event.inputs.county == 'levy' || github.event.inputs.county == 'all'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: "Run levy H freshness + A assessment"
        run: |
          set -euo pipefail
          python scripts/shard5_run6046_levy_h_freshness.py

  # ── JACKSON: C/D Reharvest + I Backfill ──────────────────────────────────
  jackson-cd-i:
    name: "jackson: C/D reharvest + I card completeness"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.county == 'jackson' || github.event.inputs.county == 'all'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: "Run jackson C/D/I fix"
        run: |
          set -euo pipefail
          python scripts/shard5_run6046_jackson_cd_i_fix.py

  # ── SARASOTA: G + I Fix ───────────────────────────────────────────────────
  sarasota-g-i:
    name: "sarasota: G zone_standards + I card completeness"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.county == 'sarasota' || github.event.inputs.county == 'all'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: "Run sarasota G/I fix"
        run: |
          set -euo pipefail
          python scripts/shard5_run6046_sarasota_g_i_fix.py

  # ── SARASOTA: J Bid-Decisions Generator ──────────────────────────────────
  sarasota-j:
    name: "sarasota: J bid-decisions generator"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: sarasota-g-i
    if: github.event_name == 'schedule' || github.event.inputs.county == 'sarasota' || github.event.inputs.county == 'all'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: "Run sarasota J generator"
        run: |
          set -euo pipefail
          python scripts/shard5_run6046_sarasota_j_generator.py

  # ── SARASOTA: C/D Parity Reharvest ───────────────────────────────────────
  sarasota-cd:
    name: "sarasota: C/D parity reharvest"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: sarasota-g-i
    if: github.event_name == 'schedule' || github.event.inputs.county == 'sarasota' || github.event.inputs.county == 'all'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: "Run sarasota C/D fix"
        run: |
          set -euo pipefail
          python scripts/shard5_run6046_sarasota_cd_fix.py

  # ── VERIFICATION ──────────────────────────────────────────────────────────
  verify:
    name: "Verify: pencil_dod_evaluate_county for all three"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [levy-h-freshness, jackson-cd-i, sarasota-j, sarasota-cd]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.county == 'all')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: "Final evaluation — all three counties"
        run: |
          set -euo pipefail
          python - << 'PYEOF'
          import os, json, urllib.request, urllib.error, time

          SB = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          HEADERS = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def evaluate(county):
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB}/rest/v1/rpc/pencil_dod_evaluate_county",
                                           data=body, headers=HEADERS, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  ERROR {county}: {e}")
                  return {}

          print("=== FINAL VERIFICATION: levy / jackson / sarasota ===")
          for county in ["levy", "jackson", "sarasota"]:
              ev = evaluate(county)
              passes = sum(1 for l in "ABCDEFGHIJ" if isinstance(ev.get(l), dict) and ev.get(l,{}).get("pass"))
              print(f"\n{county.upper()}: {passes}/10")
              for letter in "ABCDEFGHIJ":
                  ld = ev.get(letter, {})
                  if isinstance(ld, dict):
                      st = "PASS" if ld.get("pass") else "FAIL"
                      print(f"  {letter}: {st} metric={ld.get('metric')} [{ld.get('detail','')}]")
              time.sleep(1)
          PYEOF
