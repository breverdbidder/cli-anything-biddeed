name: mcps-fix-v2

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove broken registrations + re-add with proper env + verify
        env:
          HETZNER_IP:             ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY:        ${{ secrets.HETZNER_SSH_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          # S = run command AS SUMMIT with proper HOME + login shell + cd to home
          # Takes one arg (the command string).
          S() { $SSH "sudo -H -u summit bash -lc 'cd ~ && $1'"; }

          echo "=== Binaries discovery (where are they installed?) ==="
          $SSH "for b in nano-banana-pro-mcp nano-banana-mcp gemini-mcp-tool mcp-server-supabase google-drive-mcp notebooklm-mcp nlm; do
            path=\$(which \$b 2>/dev/null || echo NOT-FOUND)
            echo \"  \$b -> \$path\"
          done"

          echo ""
          echo "=== Remove existing (broken) registrations ==="
          for name in supabase nano-banana-pro nano-banana-flash gemini-cli google-drive notebooklm; do
            S "claude mcp remove $name 2>/dev/null || true"
          done

          echo ""
          echo "=== Pre-warm + verify npx works as summit in own HOME ==="
          S "cd ~ && timeout 120 npx -y @supabase/mcp-server-supabase@latest --help 2>&1 | head -3 || echo warmup-done"

          echo ""
          echo "=== Register (using env + proper HOME) ==="
          # Note: claude mcp add -e KEY=VAL transparently passes env to MCP subprocess

          S "claude mcp add --scope user supabase \
            -e SUPABASE_ACCESS_TOKEN='${SUPABASE_ACCESS_TOKEN}' \
            -- npx -y @supabase/mcp-server-supabase@latest --project-ref mocerqjnksmhcjzxrewo"

          S "mkdir -p ~/ai-outputs/nano-banana-pro && claude mcp add --scope user nano-banana-pro \
            -e GEMINI_API_KEY='${GEMINI_API_KEY}' \
            -e GEMINI_OUTPUT_DIR=/home/summit/ai-outputs/nano-banana-pro \
            -- npx -y @rafarafarafa/nano-banana-pro-mcp"

          S "claude mcp add --scope user nano-banana-flash \
            -e GEMINI_API_KEY='${GEMINI_API_KEY}' \
            -- npx -y nano-banana-mcp"

          S "claude mcp add --scope user gemini-cli \
            -e GEMINI_API_KEY='${GEMINI_API_KEY}' \
            -- npx -y gemini-mcp-tool"

          echo ""
          echo "=== FINAL HEALTH CHECK ==="
          S "claude mcp list 2>&1"

          echo ""
          echo "=== Google SA genuine status ==="
          $SSH "for p in /root/.config/gcloud/application_default_credentials.json /root/gcp-sa.json /opt/everest/secrets/google-service-account.json /home/summit/.config/gcloud/application_default_credentials.json /root/everest/google-sa.json; do
            [ -f \"\$p\" ] && echo FOUND: \$p && head -c 50 \$p && echo
          done
          find /root /opt/everest /home/summit -maxdepth 4 -name '*service*account*.json' 2>/dev/null | head -5
          find /root /opt/everest /home/summit -maxdepth 4 -name '*gcp*.json' -o -name 'sa-*.json' 2>/dev/null | head -5"
