name: CC Direct — API Key Auth
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers'
        required: true
        default: '263'
      target_repo:
        description: 'Target repo to clone and work in'
        required: false
        default: 'cli-anything-biddeed'
jobs:
  run-claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Run Claude Code on Hetzner for issue ${{ matrix.issue }}
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Setup workspace ==="
          $SSH "mkdir -p /root/summit-${ISSUE} && cd /root/summit-${ISSUE} && \
            (test -d ${TARGET_REPO}/.git && cd ${TARGET_REPO} && git pull || \
            git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/${TARGET_REPO}.git) && \
            cd ${TARGET_REPO} && git config user.email 'claude-code@biddeed.ai' && git config user.name 'Claude Code'"

          echo "=== Configure API Key Auth ==="
          $SSH "export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}' && \
            echo 'API key configured (length: '\$(echo -n \"${ANTHROPIC_API_KEY}\" | wc -c)')' && \
            which claude && claude --version 2>&1 || echo 'Claude not found, installing...' && \
            (which claude || npm install -g @anthropic-ai/claude-code 2>/dev/null || true)"

          echo "=== Run Claude Code on SUMMIT #${ISSUE} ==="
          $SSH "cd /root/summit-${ISSUE}/${TARGET_REPO} && \
            export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}' && \
            export GH_PAT='${GH_PAT}' && \
            claude -p 'Read GitHub issue #${ISSUE} at https://github.com/breverdbidder/${TARGET_REPO}/issues/${ISSUE} using: curl -s -H \"Authorization: token '${GH_PAT}'\" https://api.github.com/repos/breverdbidder/${TARGET_REPO}/issues/${ISSUE} | jq .body. Then execute ALL tasks in the issue. Follow CLAUDE.md. Commit and push all changes. Comment results on the issue when done.' \
            --allowedTools 'Bash(*)' 'Read' 'Write' 'Edit' \
            2>&1 | tail -500" || echo "Claude Code exited"

          echo "=== SUMMIT #${ISSUE} COMPLETE ==="
