name: "Apply Gold Standard SHARD-2 Migration (a1884f7f)"
# Applies the shard-2 migration for lee/hamilton/liberty/charlotte/baker
# dispatch_id: a1884f7f-816e-4b36-bfb6-e4a65f77ebba
# issue: #18872
#
# Run once then disable. Idempotent — safe to re-run.

on:
  workflow_dispatch:

jobs:
  apply-migration:
    name: "Apply SHARD-2 Migration (charlotte C/D/G/I/J, hamilton C/D, lee I, baker J)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: Apply SHARD-2 migration
        run: |
          set -euo pipefail
          echo "=== Applying 20260812_gold_standard_shard2_lee_hamilton_liberty_charlotte_baker_a1884f7f.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('migrations/20260812_gold_standard_shard2_lee_hamilton_liberty_charlotte_baker_a1884f7f.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('NOTICE','') or r.get('notice','') or str(r)[:200]) for r in (d if isinstance(d,list) else [d])]" 2>/dev/null || cat /tmp/resp.json | head -100
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration applied OK"

      - name: Verify county scores
        run: |
          set -euo pipefail
          echo "=== Verifying pencil_dod_evaluate_county per county ==="
          for COUNTY in charlotte hamilton lee baker liberty; do
            echo ""
            echo "--- $COUNTY ---"
            python3 -c "import json; print(json.dumps({'query': \"SELECT public.pencil_dod_evaluate_county('${COUNTY}')\".replace('COUNTY','$COUNTY')}))" | \
              sed "s/COUNTY/$COUNTY/g" > /tmp/q.json
            python3 -c "
          import json
          q = \"SELECT public.pencil_dod_evaluate_county('$COUNTY')\"
          print(json.dumps({'query': q}))
          " > /tmp/q.json
            HTTP=$(curl -sS -o /tmp/vr.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json)
            echo "HTTP: $HTTP"
            cat /tmp/vr.json
            echo
          done
