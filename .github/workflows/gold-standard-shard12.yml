name: Gold Standard SHARD-12 (sarasota, okaloosa, putnam, hendry)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - baseline
          - h_fix
          - cd_parity
          - parcel_linkage
          - bootstrap_hendry
          - ij_enrichment
          - verify

concurrency:
  group: gold-standard-shard12
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # 5h 40min — leaves 20min buffer before GHA 6h limit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Configure git
        run: |
          git config user.email "shard12-bot@biddeed.ai"
          git config user.name "SHARD-12 Gold Standard Bot"

      - name: Run SHARD-12 main executor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE: ${{ github.event.inputs.phase || 'all' }}
        run: |
          set -euo pipefail
          python3 scripts/shard12_main_executor.py

      - name: Verify county metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, httpx, json

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}

          client = httpx.Client(timeout=60)
          counties = ['sarasota', 'okaloosa', 'putnam', 'hendry']

          print('### SQL VERIFICATION — SHARD-12 Evaluation')
          print(f'Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)')

          for county in counties:
              r = client.post(f'{BASE}/rpc/pencil_dod_evaluate_county', headers=H, json={'county_slug_arg': county})
              if r.status_code == 200:
                  ev = r.json()
                  passes = [row['letter'] for row in ev if isinstance(row, dict) and row.get('pass')] if isinstance(ev, list) else []
                  print(f'{county.upper()}: {len(passes)}/10 PASS — {passes}')
                  if isinstance(ev, list):
                      for row in ev:
                          if isinstance(row, dict):
                              print(f\"  {row.get('letter')}: {'PASS' if row.get('pass') else 'FAIL'} metric={row.get('metric')}\")
              else:
                  print(f'{county}: evaluation failed {r.status_code}')
          " 2>&1 | tee verify_output.txt

          cat verify_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger putnam scrape (recent dates)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Trigger putnam tax deed scrapes for recent dates to fix H freshness
          for weeks_back in 1 2 3 4; do
            AUCTION_DATE=$(date -d "-${weeks_back} week" +%Y-%m-%d 2>/dev/null || date -v -${weeks_back}w +%Y-%m-%d)
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"putnam\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"tax_deed\",\"max_pages\":\"8\"}}"
            echo "Dispatched putnam tax_deed $AUCTION_DATE"
            sleep 3
          done

      - name: Trigger okaloosa scrape (H fix + TD lane)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for weeks_back in 1 2; do
            AUCTION_DATE=$(date -d "-${weeks_back} week" +%Y-%m-%d 2>/dev/null || date -v -${weeks_back}w +%Y-%m-%d)
            for SALE_TYPE in tax_deed foreclosure; do
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/scrape-realauction-county.yml/dispatches \
                -d "{\"ref\":\"main\",\"inputs\":{\"county_slug\":\"okaloosa\",\"auction_date\":\"$AUCTION_DATE\",\"sale_type\":\"$SALE_TYPE\",\"max_pages\":\"5\"}}"
              echo "Dispatched okaloosa $SALE_TYPE $AUCTION_DATE"
              sleep 3
            done
          done

      - name: Run gold_standard_loop + certify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, httpx

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          BASE = f'{SUPABASE_URL}/rest/v1'
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=300)

          print('Running gold_standard_loop...')
          r = client.post(f'{BASE}/rpc/gold_standard_loop', headers=H, json={}, timeout=300)
          print(f'loop: {r.status_code}')

          print('Running gold_standard_certify...')
          r2 = client.post(f'{BASE}/rpc/gold_standard_certify', headers=H, json={}, timeout=120)
          print(f'certify: {r2.status_code}')
          if r2.status_code == 200:
              print(r2.text[:500])
          "
