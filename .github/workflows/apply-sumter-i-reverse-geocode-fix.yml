name: "Apply sumter I reverse-geocode fix (D29A024 property_address)"
# Applies migration 20260725_sumter_i_d29a024_reverse_geocode_address.sql
# Gold Standard shard-5 (sumter): fixes Criterion I (card_complete 10/11 -> 11/11)
# by calling Sumter County ArcGIS reverseGeocode for parcel D29A024 (case 2025-CA-000255).
#
# AUTO-DISPATCH: this workflow runs automatically once via schedule, then disables itself.
# Also supports manual workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260725_sumter_i_d29a024_reverse_geocode_address.sql'

jobs:
  apply-migration:
    name: "Apply sumter I D29A024 reverse-geocode migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Apply migration: sumter I D29A024 reverse-geocode address"
        run: |
          set -euo pipefail
          MIGRATION="supabase/migrations/20260725_sumter_i_d29a024_reverse_geocode_address.sql"
          echo "=== Applying: $MIGRATION ==="
          python3 -c "import json; print(json.dumps({'query': open('${MIGRATION}').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration applied OK"

      - name: "Verify: pencil_dod_evaluate_county('sumter')"
        if: always()
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }

          rq "D29A024 row after fix" \
            "SELECT id, case_number, parcel_id, property_address, round(latitude::numeric,6) AS lat, round(longitude::numeric,6) AS lon, assessed_value FROM multi_county_auctions WHERE county='sumter' AND case_number='2025-CA-000255'"

          rq "sumter pencil_dod_evaluate_county" \
            "SELECT public.pencil_dod_evaluate_county('sumter')"

          rq "sumter I card_complete breakdown" \
            "SELECT COUNT(*) AS total, COUNT(CASE WHEN property_address IS NOT NULL AND COALESCE(latitude, po_latitude::double precision) IS NOT NULL AND COALESCE(longitude, po_longitude::double precision) IS NOT NULL AND COALESCE(assessed_value, market_value) IS NOT NULL THEN 1 END) AS card_complete FROM multi_county_auctions WHERE lower(county)='sumter'"
