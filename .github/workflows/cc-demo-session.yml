name: cc demo session
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: start demo session
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE" | sed -E 's/(sk-ant-[a-z0-9]+-[A-Za-z0-9]{4})[A-Za-z0-9_-]+/\1***/g'
          mkdir -p /root/projects/biddeed-demo
          cd /root/projects/biddeed-demo
          echo "# BidDeed demo workspace" > README.md
          echo "Phone-dashboard connectivity test." >> README.md
          echo "=== claude session (persisted) ==="
          timeout 90 claude -p "You are Claude Code running on Ariel's Everest/BidDeed Hetzner box, shown live in his phone dashboard. In exactly two short sentences: introduce yourself and confirm you are ready to take instructions on this box." --output-format text 2>&1 | head -15
          echo "CLAUDE_EXIT=${PIPESTATUS[0]}"
          echo "=== session files written ==="
          ls -1 /root/.claude/projects/ 2>/dev/null | head -20
          echo "--- newest jsonl (last 5 min) ---"
          find /root/.claude/projects -name '*.jsonl' -newermt '-5 min' 2>/dev/null
          echo "END"
          REMOTE
