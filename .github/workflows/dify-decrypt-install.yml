name: Decrypt Dify Gemini key + install in cliproxy + smoke test
on:
  workflow_dispatch: {}
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH + decrypt + install + smoke
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          TENANT_ID="09209873-c6be-42d1-86cb-364624f23fe4"

          echo "=== A: pull encrypted blob from postgres into a Hetzner temp file ==="
          $SSH "docker exec docker-db_postgres-1 psql -U postgres -d dify -tAc \"SELECT encrypted_config FROM provider_credentials WHERE provider_name = 'langgenius/gemini/google' LIMIT 1;\" > /root/.tmp_dify_blob.json && wc -c /root/.tmp_dify_blob.json"

          echo
          echo "=== B: run Dify decrypt_token inside docker-api-1 ==="
          # Build python script on Hetzner (not in GHA log) and execute via docker cp + exec
          $SSH "cat > /root/.tmp_decrypt.py << 'PYEOF'
import json, sys, os
sys.path.insert(0, '/app/api')

with open('/data/blob.json') as f:
    enc = json.load(f)

key_blob = enc.get('google_api_key') or enc.get('api_key') or list(enc.values())[0]
tenant_id = '${TENANT_ID}'

# Try direct rsa.decrypt first
try:
    from libs import rsa
    plain = rsa.decrypt(key_blob, tenant_id)
    if isinstance(plain, bytes):
        plain = plain.decode()
    with open('/data/plain.txt', 'w') as f:
        f.write(plain)
    print(f'OK len={len(plain)} starts_with={plain[:6]}')
except Exception as e:
    print(f'rsa.decrypt failed: {e}', file=sys.stderr)
    # Fallback: use encrypter.decrypt_token which needs Flask context
    try:
        from app_factory import create_app
        app = create_app()
        with app.app_context():
            from core.helper.encrypter import decrypt_token
            plain = decrypt_token(tenant_id, key_blob)
            if isinstance(plain, bytes):
                plain = plain.decode()
            with open('/data/plain.txt', 'w') as f:
                f.write(plain)
            print(f'OK_via_app len={len(plain)} starts_with={plain[:6]}')
    except Exception as e2:
        print(f'app decrypt also failed: {e2}', file=sys.stderr)
        sys.exit(1)
PYEOF
chmod 644 /root/.tmp_decrypt.py /root/.tmp_dify_blob.json
"

          # docker cp the script + blob INTO the api container's writable area (/tmp)
          # Actually since /data is read-only, use /tmp inside container which IS writable
          $SSH '
            docker cp /root/.tmp_decrypt.py docker-api-1:/tmp/decrypt.py
            docker cp /root/.tmp_dify_blob.json docker-api-1:/tmp/blob.json
            # Patch script to use /tmp instead of /data
            docker exec docker-api-1 sh -c "sed -i \"s|/data/blob.json|/tmp/blob.json|; s|/data/plain.txt|/tmp/plain.txt|\" /tmp/decrypt.py"
            docker exec docker-api-1 sh -c "cd /app/api && python /tmp/decrypt.py 2>&1 | tail -10"
          '

          echo
          echo "=== C: pull plaintext key from container into Hetzner host (no GHA log exposure) ==="
          $SSH '
            docker cp docker-api-1:/tmp/plain.txt /root/.tmp_plain.txt 2>&1 | tail -3
            ls -la /root/.tmp_plain.txt 2>&1
            wc -c /root/.tmp_plain.txt 2>&1
            head -c 6 /root/.tmp_plain.txt 2>&1
            echo
            head -c 6 /root/.tmp_plain.txt | grep -q "^AIza" && echo "✓ valid Gemini key format" || echo "✗ not a Gemini key format"
          '

          echo
          echo "=== D: install key into cliproxy config (in-place sed, value never echoed) ==="
          $SSH '
            CFG=/opt/cliproxy-gateway/config.yaml
            cp $CFG ${CFG}.bak.predify.$(date +%s)
            # Read plaintext key into shell var
            KEY=$(cat /root/.tmp_plain.txt)
            # The current gemini-api-key block:
            #   gemini-api-key:
            #     - api-key: <REDACTED_OLD>
            # Use python for safe in-place YAML-style replacement
            python3 << PYEOF2
import re
with open("$CFG") as f: c = f.read()
# Replace the first "api-key:" under gemini-api-key
new = re.sub(r"(gemini-api-key:\s*\n\s*-\s*api-key:\s*)\S+", r"\g<1>$KEY", c, count=1)
with open("$CFG", "w") as f: f.write(new)
print("config patched")
PYEOF2
            unset KEY
            grep -A1 "^gemini-api-key:" $CFG | head -3 | sed -E "s/(api-key:\s*).*/\1<redacted>/"
          '

          echo
          echo "=== E: WIPE all temp files containing the key ==="
          $SSH '
            shred -u /root/.tmp_plain.txt 2>/dev/null || rm -f /root/.tmp_plain.txt
            rm -f /root/.tmp_dify_blob.json /root/.tmp_decrypt.py
            docker exec docker-api-1 sh -c "rm -f /tmp/plain.txt /tmp/blob.json /tmp/decrypt.py"
            ls /root/.tmp_* 2>&1 | head -3
          '

          echo
          echo "=== F: restart cliproxy ==="
          $SSH 'docker restart biddeed-cliproxy && sleep 4 && docker logs --tail 5 biddeed-cliproxy 2>&1 | grep -v "no space"'

          echo
          echo "=== G: smoke test — Anthropic format → gemini-flash via cliproxy ==="
          CP_KEY="biddeed-gw-77dc6c9df0e5088057c28d1f94d3fef791961fbb409da85f"
          RESP=$($SSH "curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${CP_KEY}' \
            -H 'anthropic-version: 2023-06-01' \
            -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with PATH_Y_OK\"}]}' \
            -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500

          echo
          echo "=== H: claude -p via cliproxy (REAL TEST) ==="
          $SSH "ANTHROPIC_BASE_URL=http://127.0.0.1:8317 ANTHROPIC_API_KEY=${CP_KEY} claude -p 'reply only with CLAUDE_PATH_Y_OK and nothing else' --model claude-sonnet-4-20250514 --allowedTools Read 2>&1 | tail -15"

          echo "=== END ==="
