name: "SimilarWeb via Apify (real data, not Cloudflare-blocked scrape)"

# Uses the proven RehabValuator/Gridics/Zoneomics pattern:
# Apify actor mscraper/similarweb-quick-scraper → real SimilarWeb data
# Apify token fetched from Supabase vault via get_apify_token() RPC (never logged).
# Captures BOTH rentcast.io + dealcheck.io in one run, saves JSON to ci-evidence storage.

on:
  workflow_dispatch:
    inputs:
      summit_id:
        required: true
        default: "05f7873d-09b7-41ac-8724-99e0b4ec9983"
      dossier_date:
        required: true
        default: "2026-05-27"

concurrency:
  group: similarweb-apify
  cancel-in-progress: false

jobs:
  scrape:
    name: "Apify SimilarWeb scrape (both targets)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Run Apify actor + upload per-target JSON"
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATE: ${{ github.event.inputs.dossier_date }}
          SUMMIT_ID: ${{ github.event.inputs.summit_id }}
        run: |
          set -e

          # Fetch Apify token from vault (no echo)
          APIFY_TOKEN=$(curl -sf "${SB_URL}/rest/v1/rpc/get_apify_token" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' | tr -d '"')

          if [ -z "$APIFY_TOKEN" ] || [ "$APIFY_TOKEN" = "null" ]; then
            echo "::error::Failed to fetch apify_api_token from vault"
            exit 1
          fi
          echo "✓ Apify token retrieved from vault (length=${#APIFY_TOKEN})"

          ACTOR_ID="mscraper~similarweb-quick-scraper"
          DOMAINS_JSON='{"websites":["rentcast.io","dealcheck.io"]}'

          echo "🚀 Starting Apify actor: $ACTOR_ID for rentcast.io + dealcheck.io"
          RUN_RESP=$(curl -sf -X POST \
            "https://api.apify.com/v2/acts/${ACTOR_ID}/runs?token=${APIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$DOMAINS_JSON")

          RUN_ID=$(echo "$RUN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")
          DATASET_ID=$(echo "$RUN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['defaultDatasetId'])")
          echo "✓ Run started: $RUN_ID (dataset: $DATASET_ID)"

          # Poll for completion (up to 5 min)
          STATUS="UNKNOWN"
          for i in {1..30}; do
            sleep 10
            STATUS=$(curl -sf "https://api.apify.com/v2/actor-runs/${RUN_ID}?token=${APIFY_TOKEN}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['status'])")
            echo "  poll ${i}: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ABORTED" ] || [ "$STATUS" = "TIMED-OUT" ]; then
              break
            fi
          done

          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "::error::Apify run ended with status: $STATUS"
            exit 1
          fi

          # Fetch dataset items
          DATA=$(curl -sf "https://api.apify.com/v2/datasets/${DATASET_ID}/items?token=${APIFY_TOKEN}&format=json")
          echo "✓ Dataset fetched, ${#DATA} chars"

          # Split per-domain and upload to storage
          echo "$DATA" > /tmp/all.json
          python3 <<PYEOF
          import json, os, urllib.request, urllib.error
          data = json.load(open('/tmp/all.json'))
          sb_url = os.environ['SB_URL']
          sb_key = os.environ['SB_KEY']
          date   = os.environ['DATE']
          summit = os.environ['SUMMIT_ID']
          print(f"Total items: {len(data)}")
          for item in data:
              dom = item.get('SiteName') or item.get('Domain') or item.get('domain') or item.get('website') or ''
              dom = dom.lower().replace('https://','').replace('http://','').rstrip('/')
              slug = 'rentcast' if 'rentcast' in dom else ('dealcheck' if 'dealcheck' in dom else None)
              if not slug:
                  print(f"SKIP unknown domain: {dom}")
                  continue
              fname = f"similarweb-apify-{slug}.json"
              path  = f"dossiers/{slug}/{date}/{fname}"
              url   = f"{sb_url}/storage/v1/object/ci-evidence/{path}"
              body  = json.dumps(item, indent=2).encode('utf-8')
              req = urllib.request.Request(url, data=body, method='POST', headers={
                'apikey': sb_key,
                'Authorization': f'Bearer {sb_key}',
                'Content-Type': 'application/json',
                'x-upsert': 'true'
              })
              try:
                resp = urllib.request.urlopen(req, timeout=30)
                print(f"✓ uploaded {path} [{resp.status}] size={len(body)}")
              except urllib.error.HTTPError as e:
                print(f"✗ failed {path} [{e.code}] {e.read().decode()[:200]}")

              # Log event
              ev_url = f"{sb_url}/rest/v1/ci_v65_event_log"
              ev_body = json.dumps({
                'source': f'similarweb_apify_{slug}',
                'source_url': f'https://www.similarweb.com/website/{dom}/',
                'signal_kind': 'other',
                'payload': {
                  '_marker': 'VERIFIED',
                  'method': 'apify_mscraper_similarweb_quick_scraper',
                  'global_rank': item.get('GlobalRank'),
                  'country_rank': item.get('CountryRank'),
                  'category_rank': item.get('CategoryRank'),
                  'monthly_visits': item.get('Engagments', {}).get('Visits') if isinstance(item.get('Engagments'), dict) else None,
                  'bounce_rate': item.get('Engagments', {}).get('BounceRate') if isinstance(item.get('Engagments'), dict) else None,
                  'pages_per_visit': item.get('Engagments', {}).get('PagePerVisit') if isinstance(item.get('Engagments'), dict) else None,
                  'avg_visit_duration': item.get('Engagments', {}).get('TimeOnSite') if isinstance(item.get('Engagments'), dict) else None,
                  'summit_id': summit
                }
              }).encode('utf-8')
              try:
                urllib.request.urlopen(urllib.request.Request(ev_url, data=ev_body, method='POST', headers={
                  'apikey': sb_key, 'Authorization': f'Bearer {sb_key}',
                  'Content-Type': 'application/json', 'Prefer': 'return=minimal'
                }), timeout=10)
                print(f"✓ event_log entry for {slug}")
              except Exception as e:
                print(f"✗ event_log failed: {e}")
          PYEOF

          echo "::notice::SimilarWeb-via-Apify capture complete for rentcast.io + dealcheck.io"
