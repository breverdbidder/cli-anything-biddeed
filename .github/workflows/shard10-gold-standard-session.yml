name: "SHARD-10 Gold Standard Session"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Session mode"
        required: true
        type: choice
        options:
          - full-session
          - county-ingestion-only
          - evaluation-only
        default: full-session
      target_county:
        description: "Specific county (for single operations)"
        required: false
        type: string

jobs:
  shard10-session:
    name: "SHARD-10 Autonomous Session"
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour ceiling
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install httpx requests
          
      - name: Test Database Connection
        run: |
          echo "Testing database connectivity..."
          python test_shard10_connection.py
          
      - name: Run County Ingestion - Franklin
        if: inputs.mode == 'full-session' || inputs.mode == 'county-ingestion-only'
        run: |
          echo "Ingesting franklin county (CO_NO=29)..."
          python scripts/ingest_county.py --county 29 --full
          
      - name: Run County Ingestion - Union  
        if: inputs.mode == 'full-session' || inputs.mode == 'county-ingestion-only'
        run: |
          echo "Ingesting union county (CO_NO=73)..."
          python scripts/ingest_county.py --county 73 --full
          
      - name: Single County Ingestion
        if: inputs.target_county != ''
        run: |
          echo "Ingesting specific county: ${{ inputs.target_county }}"
          python scripts/ingest_county.py --county "${{ inputs.target_county }}" --full
          
      - name: Run SHARD-10 Improvements
        if: inputs.mode == 'full-session'
        run: |
          echo "Running full SHARD-10 improvements..."
          python scripts/shard10_gold_standard_improvements.py
          
      - name: Evaluation Only
        if: inputs.mode == 'evaluation-only'
        run: |
          echo "Running evaluation only..."
          python shard_check_simple.py
          
      - name: Final Verification
        run: |
          echo "Running final verification..."
          python shard_check_simple.py
          
      - name: Commit Results to Main
        if: inputs.mode == 'full-session'
        run: |
          git config --global user.name "SHARD-10 Session"
          git config --global user.email "shard10@biddeed.ai"
          
          # Switch to main and merge changes
          git fetch origin main
          git checkout main
          git merge ${{ github.ref_name }} --no-ff -m "SHARD-10: Merge autonomous session results
          
          - Completed county ingestion for franklin and union
          - Improved metrics for manatee, alachua, martin  
          - Ship-to-main mandate: autonomous session results
          
          Co-authored-by: breverdbidder <breverdbidder@users.noreply.github.com>"
          
          git push origin main