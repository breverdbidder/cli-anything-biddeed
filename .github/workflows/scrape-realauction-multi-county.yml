name: RealAuction Multi-County Scraper

on:
  workflow_dispatch:
    inputs:
      county_slug:
        required: true
      county_domain:
        required: true
      auction_date:
        required: true
      max_pages:
        required: false
        default: '15'
      section_area:
        description: 'C = closed/canceled, R = running/upcoming'
        required: false
        default: 'C'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - name: Scrape county
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          COUNTY_SLUG: ${{ github.event.inputs.county_slug }}
          COUNTY_DOMAIN: ${{ github.event.inputs.county_domain }}
          AUCTION_DATE: ${{ github.event.inputs.auction_date }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          SECTION_AREA: ${{ github.event.inputs.section_area }}
        run: python .github/scripts/scrape_realauction_county.py
