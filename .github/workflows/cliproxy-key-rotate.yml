name: Rotate Gemini key in cliproxy (zero-leak)
on:
  workflow_dispatch: {}
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe + install + smoke
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          NEW_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          SCP="scp -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
          set +e
          
          echo "::add-mask::$NEW_GEMINI_KEY"
          CFG=/opt/cliproxy-gateway/config.yaml
          
          echo "=== A: validate new key format ==="
          KLEN=${#NEW_GEMINI_KEY}
          KHEAD4=${NEW_GEMINI_KEY:0:4}
          echo "new key: len=$KLEN starts=$KHEAD4"
          if [ "$KLEN" -lt 30 ] || [ "$KHEAD4" != "AIza" ]; then
            echo "::error::invalid key format"
            exit 1
          fi
          
          echo
          echo "=== B: quick probe — hit Gemini API directly with new key ==="
          PROBE_RESP=$(curl -sS -m 20 -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $NEW_GEMINI_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" \
            -d '{"contents":[{"parts":[{"text":"Reply only with PROBE_OK"}]}]}')
          PROBE_CLEAN=$(echo "$PROBE_RESP" | sed "s|${NEW_GEMINI_KEY}|<REDACTED>|g")
          if echo "$PROBE_CLEAN" | grep -q "PROBE_OK"; then
            echo "✓ new key VALID at Gemini directly"
          elif echo "$PROBE_CLEAN" | grep -qi "API_KEY_INVALID\|expired\|permission_denied"; then
            echo "::error::new key REJECTED by Gemini — check the value in GH secret"
            echo "$PROBE_CLEAN" | head -c 500
            exit 1
          else
            echo "response ambiguous but not a key-error:"
            echo "$PROBE_CLEAN" | head -c 400
          fi
          
          echo
          echo "=== C: extract cliproxy gateway key from Hetzner config (length only) ==="
          CP_KEY=$($SSH "grep -A1 '^api-keys:' $CFG | tail -1 | sed 's/.*\"\\(.*\\)\".*/\\1/'" | tr -d '\r\n')
          echo "::add-mask::$CP_KEY"
          echo "cliproxy gateway key: len=${#CP_KEY} first4=${CP_KEY:0:4}"
          
          echo
          echo "=== D: backup current config + write key via stdin pipe (not command line) ==="
          $SSH "cp $CFG ${CFG}.bak.rot.\$(date +%s)"
          echo "$NEW_GEMINI_KEY" | $SSH "cat > /root/.tmp_newkey && chmod 600 /root/.tmp_newkey"
          
          echo
          echo "=== E: copy installer script + run + shred ==="
          $SCP scripts/cliproxy_install_newkey.py root@${HETZNER_IP}:/root/.tmp_installer.py
          $SSH "python3 /root/.tmp_installer.py"
          RC=$?
          $SSH "shred -u /root/.tmp_newkey /root/.tmp_installer.py 2>/dev/null"
          $SSH "ls /root/.tmp_* 2>&1 | head -3"
          if [ $RC -ne 0 ]; then
            echo "::error::installer failed rc=$RC"
            exit 1
          fi
          
          echo
          echo "=== F: restart cliproxy ==="
          $SSH "docker restart biddeed-cliproxy && sleep 4"
          $SSH 'docker logs --tail 5 biddeed-cliproxy 2>&1 | grep -v "no space"'
          
          echo
          echo "=== G: smoke test via cliproxy ==="
          RESP=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with CLIPROXY_NEWKEY_OK\"}]}' -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          # Redact potential echo of either key
          RESP_SAFE=$(echo "$RESP" | sed "s|${NEW_GEMINI_KEY}|<K1>|g; s|${CP_KEY}|<K2>|g")
          if echo "$RESP_SAFE" | grep -q "CLIPROXY_NEWKEY_OK"; then
            echo "✓ cliproxy end-to-end with new key PASSED"
            echo "$RESP_SAFE" | head -c 400
          else
            echo "::error::smoke test failed"
            echo "$RESP_SAFE" | head -c 500
            exit 1
          fi
          
          echo
          echo "=== H: shred all backups ==="
          $SSH "for f in ${CFG}.bak*; do shred -u \"\$f\" 2>/dev/null && echo shredded; done"
          $SSH "ls $CFG* 2>&1"
          
          echo "=== END ==="
