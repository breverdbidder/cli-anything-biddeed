name: Continuous Executor (Every 2 Hours)

on:
  schedule:
    # LAUNCH-E (#20039, 2026-09-05): */30 -> :09/:39, off the :00/:15/:30/:45
    # stampede marks (still every 30min to keep 3 slots filled).
    - cron: '9,39 * * * *'
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run continuous executor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          pip install requests xgboost numpy --break-system-packages -q 2>/dev/null
          python3 scripts/continuous_executor.py
