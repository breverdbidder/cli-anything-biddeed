name: Fix BidDeed.AI via ZoneWise-Web Token
# Issue #27: biddeed.ai HTTP 000 for weeks
# Previous fix (fix-biddeed-dns.yml) blocked: CF_API_TOKEN has Zone:Read only
# Cross-dispatches to zonewise-web (has CLOUDFLARE_API_TOKEN with Zone:DNS:Edit)
# Pattern: same as nexus-dns-fix.yml which added nexus.zonewise.ai CNAME

on:
  workflow_dispatch:

jobs:
  fix-via-zonewise:
    name: "Fix biddeed.ai DNS via zonewise-web token"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Diagnose current state
        run: |
          echo "=== Issue #27: biddeed.ai HTTP 000 ==="
          dig biddeed.ai A +short 2>/dev/null || echo "No A record"
          dig biddeed.ai CNAME +short 2>/dev/null || echo "No CNAME"
          PAGES=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://brevard-bidder-landing.pages.dev)
          APEX=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://biddeed.ai 2>/dev/null || echo "000")
          echo "brevard-bidder-landing.pages.dev: HTTP $PAGES"
          echo "biddeed.ai: HTTP $APEX"
          if [ "$PAGES" != "200" ] && [ "$PAGES" != "301" ] && [ "$PAGES" != "302" ]; then
            echo "ERROR: CF Pages source is not reachable (HTTP $PAGES)"
            exit 1
          fi
          echo "CF Pages source LIVE (HTTP $PAGES) — proceeding"

      - name: Push DNS-fix workflow to zonewise-web and dispatch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Build the workflow YAML that zonewise-web will run
          # Using printf to avoid heredoc/YAML indentation conflicts
          ACCT="${CF_ACCOUNT_ID}"
          python3 - <<'PYEOF'
          import json, base64, urllib.request, urllib.error, os, time

          token = os.environ["GH_PAT"]
          cf_account_id = os.environ.get("CF_ACCOUNT_ID", "")

          headers = {
              "Authorization": f"token {token}",
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json"
          }

          # Build workflow YAML as lines to avoid triple-quote indentation issues
          lines = [
              "name: Fix BidDeed DNS (dispatched from cli-anything-biddeed)",
              "on:",
              "  repository_dispatch:",
              "    types: [fix-biddeed-dns]",
              "  workflow_dispatch:",
              "jobs:",
              "  dns:",
              "    runs-on: ubuntu-latest",
              "    timeout-minutes: 10",
              "    steps:",
              "      - name: Add DNS records for biddeed.ai",
              "        env:",
              "          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}",
              "          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
              "        run: |",
              "          echo '=== Getting biddeed.ai zone ID ==='",
              "          ZONE_RESP=$(curl -s \"https://api.cloudflare.com/client/v4/zones?name=biddeed.ai\" \\",
              "            -H \"Authorization: Bearer $CF_TOKEN\")",
              "          ZONE_ID=$(echo $ZONE_RESP | python3 -c \"import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NOT_FOUND')\")",
              "          echo \"Zone ID: $ZONE_ID\"",
              "          if [ \"$ZONE_ID\" = \"NOT_FOUND\" ]; then",
              "            echo 'CLOUDFLARE_API_TOKEN cannot access biddeed.ai zone'",
              "            echo \"Zone response: $ZONE_RESP\"",
              "            exit 1",
              "          fi",
              "          echo '=== Adding CNAME: biddeed.ai -> brevard-bidder-landing.pages.dev ==='",
              "          EX=$(curl -s \"https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=biddeed.ai\" \\",
              "            -H \"Authorization: Bearer $CF_TOKEN\" | \\",
              "            python3 -c \"import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NONE')\")",
              "          if [ \"$EX\" != \"NONE\" ]; then",
              "            R=$(curl -s -X PUT \"https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EX\" \\",
              "              -H \"Authorization: Bearer $CF_TOKEN\" -H \"Content-Type: application/json\" \\",
              "              -d '{\"type\":\"CNAME\",\"name\":\"biddeed.ai\",\"content\":\"brevard-bidder-landing.pages.dev\",\"ttl\":1,\"proxied\":true}')",
              "          else",
              "            R=$(curl -s -X POST \"https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records\" \\",
              "              -H \"Authorization: Bearer $CF_TOKEN\" -H \"Content-Type: application/json\" \\",
              "              -d '{\"type\":\"CNAME\",\"name\":\"biddeed.ai\",\"content\":\"brevard-bidder-landing.pages.dev\",\"ttl\":1,\"proxied\":true}')",
              "          fi",
              "          echo $R | python3 -c \"import json,sys; d=json.load(sys.stdin); print('OK apex CNAME' if d.get('success') else f'FAIL apex: {d.get(\\\"errors\\\")}')\"",
              "          echo '=== Adding CNAME: www.biddeed.ai -> brevard-bidder-landing.pages.dev ==='",
              "          EXW=$(curl -s \"https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=www.biddeed.ai\" \\",
              "            -H \"Authorization: Bearer $CF_TOKEN\" | \\",
              "            python3 -c \"import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NONE')\")",
              "          if [ \"$EXW\" != \"NONE\" ]; then",
              "            RW=$(curl -s -X PUT \"https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXW\" \\",
              "              -H \"Authorization: Bearer $CF_TOKEN\" -H \"Content-Type: application/json\" \\",
              "              -d '{\"type\":\"CNAME\",\"name\":\"www\",\"content\":\"brevard-bidder-landing.pages.dev\",\"ttl\":1,\"proxied\":true}')",
              "          else",
              "            RW=$(curl -s -X POST \"https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records\" \\",
              "              -H \"Authorization: Bearer $CF_TOKEN\" -H \"Content-Type: application/json\" \\",
              "              -d '{\"type\":\"CNAME\",\"name\":\"www\",\"content\":\"brevard-bidder-landing.pages.dev\",\"ttl\":1,\"proxied\":true}')",
              "          fi",
              "          echo $RW | python3 -c \"import json,sys; d=json.load(sys.stdin); print('OK www CNAME' if d.get('success') else f'FAIL www: {d.get(\\\"errors\\\")}')\"",
              f"          ACCT='{cf_account_id}'",
              "          if [ -n \"$ACCT\" ]; then",
              "            P=$(curl -s -X POST \"https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/brevard-bidder-landing/domains\" \\",
              "              -H \"Authorization: Bearer $CF_TOKEN\" -H \"Content-Type: application/json\" \\",
              "              -d '{\"name\":\"biddeed.ai\"}')",
              "            echo $P | python3 -c \"import json,sys; d=json.load(sys.stdin); errs=d.get('errors',[]); print('OK Pages custom domain' if d.get('success') else ('already registered' if any('already' in str(e).lower() or '10000' in str(e) for e in errs) else f'WARN Pages: {errs}'))\"",
              "          fi",
              "          echo '=== Verify DNS propagation ==='",
              "          sleep 15",
              "          dig biddeed.ai A +short || echo 'propagating...'",
              "          LIVE=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 15 https://biddeed.ai 2>/dev/null || echo 000)",
              "          echo \"biddeed.ai: HTTP $LIVE\"",
              "          [ \"$LIVE\" = \"200\" ] || [ \"$LIVE\" = \"301\" ] || [ \"$LIVE\" = \"302\" ] && echo 'ONLINE' || echo 'DNS may need more propagation time'",
          ]
          workflow_content = "\n".join(lines) + "\n"

          encoded = base64.b64encode(workflow_content.encode()).decode()
          filename = "fix-biddeed-dns-dispatch.yml"
          api_url = f"https://api.github.com/repos/breverdbidder/zonewise-web/contents/.github/workflows/{filename}"

          # Get SHA if file exists
          sha = ""
          try:
              req = urllib.request.Request(api_url, headers=headers)
              resp = json.loads(urllib.request.urlopen(req).read())
              sha = resp.get("sha", "")
              print(f"File exists (SHA: {sha[:8]}), updating...")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("File does not exist, creating...")
              else:
                  raise

          # Push workflow file to zonewise-web
          data = {"message": "fix(biddeed): DNS fix dispatch from cli-anything-biddeed #27", "content": encoded}
          if sha:
              data["sha"] = sha
          req = urllib.request.Request(api_url, data=json.dumps(data).encode(), method="PUT", headers=headers)
          resp = urllib.request.urlopen(req)
          print(f"Workflow pushed to zonewise-web: HTTP {resp.status}")

          time.sleep(8)

          # Dispatch via repository_dispatch
          dispatch_url = "https://api.github.com/repos/breverdbidder/zonewise-web/dispatches"
          req = urllib.request.Request(
              dispatch_url,
              data=json.dumps({"event_type": "fix-biddeed-dns"}).encode(),
              method="POST",
              headers=headers
          )
          resp = urllib.request.urlopen(req)
          print(f"Dispatch sent: HTTP {resp.status}")
          print("Fix workflow running in zonewise-web — check: github.com/breverdbidder/zonewise-web/actions")
          PYEOF

      - name: Wait and verify final state
        run: |
          echo "Waiting 90s for zonewise-web workflow + DNS propagation..."
          sleep 90
          echo "=== Final verification ==="
          dig biddeed.ai A +short 2>/dev/null || echo "DNS propagating..."
          APEX=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://biddeed.ai 2>/dev/null || echo "000")
          echo "biddeed.ai: HTTP $APEX"
          if [ "$APEX" = "200" ] || [ "$APEX" = "301" ] || [ "$APEX" = "302" ]; then
            echo "VERIFIED: biddeed.ai ONLINE (HTTP $APEX)"
          else
            echo "RESULT: HTTP $APEX — check zonewise-web Actions tab for DNS fix result"
            echo "If CLOUDFLARE_API_TOKEN lacks biddeed.ai zone access, Ariel must scope the token to all zones in CF Dashboard"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          APEX=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://biddeed.ai 2>/dev/null || echo "000")
          if [ "$APEX" = "200" ] || [ "$APEX" = "301" ] || [ "$APEX" = "302" ]; then
            MSG="BIDDEED-010 RESOLVED: biddeed.ai ONLINE (HTTP $APEX)"
          else
            MSG="BIDDEED-010 IN PROGRESS: biddeed.ai HTTP $APEX — DNS fix dispatched to zonewise-web Actions"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=$MSG" > /dev/null 2>&1 || true
