name: "Gold Standard Shard-5: gulf/marion/okeechobee/lake (dispatch 9e12d062)"
# Dispatch: 9e12d062-b309-4def-b6f5-130798862110
# Session: loop run 9488 (2026-08-07)
#
# WIRING MANDATE: this workflow runs the shard-5 executor to fix:
#   gulf  8/10  → E(92.9%) + I(78.6%) failing — new rows need parcel linkage
#   marion  7/10  → C(94.5%) + D(94.5%) + J(94.5%) — new rows need J + parity
#   okeechobee 6/10 → C(82.5%) + D(82.5%) + I(81.3%) + J(82.5%) — new rows
#   lake  5/10  → C(89.6%) + D(94.8%) + E(69.6%) + I(69.6%) + J(70.4%)
#
# Strategy: idempotent J-generator + E-linkage + C/D parity promotion for
# all rows that were ingested after the prior session (run7519).
#
# Parallel-fleet: this workflow only writes to gulf/marion/okeechobee/lake rows.
# Cron: daily 06:00Z — before the 07:30Z gold_standard_loop pg_cron job.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to run (leave empty for all 4)'
        required: false
        default: ''
      skip_eval:
        description: 'Skip final evaluation'
        required: false
        default: 'false'

jobs:
  shard5-fix:
    name: "Shard-5: gulf/marion/okeechobee/lake fix"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx

      - name: "Run shard-5 executor (gulf/marion/okeechobee/lake)"
        run: |
          set -euo pipefail
          python3 scripts/gold_standard_shard5_gulf_marion_okeechobee_lake_9e12d062.py 2>&1
        timeout-minutes: 50

      - name: "Verify: pencil_dod_evaluate_county for all 4 counties"
        if: github.event.inputs.skip_eval != 'true'
        env:
          REF: mocerqjnksmhcjzxrewo
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json
            echo; echo
          }
          
          rq "gulf evaluation" "SET statement_timeout=0; SELECT public.pencil_dod_evaluate_county('gulf');"
          rq "marion evaluation" "SET statement_timeout=0; SELECT public.pencil_dod_evaluate_county('marion');"
          rq "okeechobee evaluation" "SET statement_timeout=0; SELECT public.pencil_dod_evaluate_county('okeechobee');"
          rq "lake evaluation" "SET statement_timeout=0; SELECT public.pencil_dod_evaluate_county('lake');"

      - name: "Summary: before/after metrics"
        if: always()
        run: |
          echo "### SHARD-5 SESSION SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatch_id: 9e12d062-b309-4def-b6f5-130798862110" >> "$GITHUB_STEP_SUMMARY"
          echo "loop_run: 9488" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**BEFORE (brief baseline):**" >> "$GITHUB_STEP_SUMMARY"
          echo "| County | Score | Failing |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| gulf | 8/10 | E(92.9%) I(78.6%) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| marion | 7/10 | C(94.5%) D(94.5%) J(94.5%) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| okeechobee | 6/10 | C(82.5%) D(82.5%) I(81.3%) J(82.5%) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lake | 5/10 | C(89.6%) D(94.8%) E(69.6%) I(69.6%) J(70.4%) |" >> "$GITHUB_STEP_SUMMARY"
