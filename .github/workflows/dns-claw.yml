name: DNS — claw.zonewise.ai
on:
  workflow_dispatch:
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup CNAME
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ZONE="b32406b78aaaefd55557d77c843a5940"
          
          EXISTING=$(curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=claw.zonewise.ai&type=CNAME")
          echo "API response: $EXISTING"
          
          COUNT=$(echo "$EXISTING" | python3 -c "import json,sys; r=json.load(sys.stdin); print(len(r.get('result',[])))" 2>/dev/null || echo "error")
          echo "Existing records: $COUNT"
          
          if [ "$COUNT" = "0" ] || [ "$COUNT" = "error" ]; then
            echo "Creating CNAME..."
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"CNAME","name":"claw","content":"claw-zonewise.pages.dev","proxied":true}' "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records"
          else
            RID=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
            echo "Updating $RID..."
            curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"CNAME","name":"claw","content":"claw-zonewise.pages.dev","proxied":true}' "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$RID"
          fi
          
          echo ""
          sleep 5
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' https://claw.zonewise.ai --max-time 10 || echo "000")
          echo "claw.zonewise.ai: HTTP $HTTP"
