name: "Gold Standard SHARD-4 #18319 (sarasota/seminole/pasco/suwannee/hendry)"

# Issue #18319 — dispatch 1338ab5d-c22a-43be-876f-887fb75417e7
# Session: architect-20260807T080000
# Targets:
#   sarasota (9/10): G pk1000 structural blocker (fleet policy needed)
#   seminole (8/10): G PUD-RES zone_standards, I parity harvest
#   pasco (7/10):    C/D parity harvest (NULL+mca_only), I parcel enrichment
#   suwannee (6/10): B/F structural blocker, I/J new auction enrichment
#   hendry (5/10):   C/D/E parcel linkage via ArcGIS, I/J enrichment

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run (all/pasco/seminole/hendry/suwannee/verify)'
        required: false
        default: 'all'
        type: string

concurrency:
  group: gold-standard-shard4-18319
  cancel-in-progress: false

jobs:
  execute:
    name: "SHARD-4 Gold Standard Executor"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Configure git
        run: |
          git config user.email "shard4-bot@biddeed.ai"
          git config user.name "SHARD-4 Gold Standard Bot"

      - name: Run executor (phase=${{ github.event.inputs.phase || 'all' }})
        env:
          PHASE: ${{ github.event.inputs.phase || 'all' }}
        run: |
          set -o pipefail
          python3 scripts/gold_standard_shard4_18319_executor.py 2>&1 | tee /tmp/shard4_executor.log
          echo "## Executor Output" >> "$GITHUB_STEP_SUMMARY"
          tail -100 /tmp/shard4_executor.log >> "$GITHUB_STEP_SUMMARY"

      - name: Verify county metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request
          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_KEY']
          H = {'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}',
               'Content-Type': 'application/json', 'Prefer': 'params=single-object'}
          counties = ['sarasota', 'seminole', 'pasco', 'suwannee', 'hendry']
          print('### SQL VERIFICATION — SHARD-4 #18319')
          import datetime
          print(f'Timestamp: {datetime.datetime.utcnow().isoformat()}Z')
          for county in counties:
              try:
                  req = urllib.request.Request(
                      f'{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county',
                      data=json.dumps({'county_slug_arg': county}).encode(),
                      headers=H, method='POST')
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ev = json.loads(r.read())
                  if isinstance(ev, dict):
                      passes = [k for k,v in ev.items() if isinstance(v,dict) and v.get('pass')]
                      fails  = [k for k,v in ev.items() if isinstance(v,dict) and not v.get('pass')]
                      print(f'{county.upper()}: {len(passes)}/10 pass={passes} fail={fails}')
                      for k,v in ev.items():
                          if isinstance(v,dict):
                              print(f'  {k}: {\"PASS\" if v.get(\"pass\") else \"FAIL\"} metric={v.get(\"metric\")} detail={v.get(\"detail\",\"\")}')
                  elif isinstance(ev, list):
                      passes = [r[\"letter\"] for r in ev if isinstance(r,dict) and r.get(\"pass\")]
                      fails  = [r[\"letter\"] for r in ev if isinstance(r,dict) and not r.get(\"pass\")]
                      print(f'{county.upper()}: {len(passes)}/10 pass={passes} fail={fails}')
              except Exception as e:
                  # try alternate param name
                  try:
                      req2 = urllib.request.Request(
                          f'{SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county',
                          data=json.dumps({'p_county': county}).encode(),
                          headers=H, method='POST')
                      with urllib.request.urlopen(req2, timeout=60) as r2:
                          ev2 = json.loads(r2.read())
                      passes = [k for k,v in ev2.items() if isinstance(v,dict) and v.get('pass')] if isinstance(ev2,dict) else []
                      print(f'{county.upper()}: {len(passes)}/10 (via p_county param)')
                  except Exception as e2:
                      print(f'{county}: evaluation failed: {e} / {e2}')
          " 2>&1 | tee /tmp/verify_output.txt
          cat /tmp/verify_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit session report
        run: |
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "gold-standard: shard4 #18319 sarasota/seminole/pasco/suwannee/hendry session (1338ab5d)

Dispatch: 1338ab5d-c22a-43be-876f-887fb75417e7
Session: architect-20260807T080000

Fixes:
- pasco C/D: RealForeclose+RealTaxDeed harvest for NULL/mca_only rows
- pasco I: parcel enrichment via FL GIO ArcGIS
- seminole C/D/I: RealForeclose/RealTaxDeed harvest for NULL rows
- seminole G: PUD-RES classified not-regulated (per-development-agreement)
- hendry E/I/C/D: parcel linkage via Hendry ArcGIS (services7.arcgis.com/8l7Qq5t0CPLAJwJK)
- hendry J + suwannee J: bid_decisions for parcel-linked rows
- suwannee I: new auction enrichment via RealTaxDeed
- sarasota G: structural blocker documented (fleet policy needed from Ariel)
- suwannee B/F: structural blocker documented (courthouse-steps FC + CAPTCHA)

🤖 Generated with [Claude Code](https://claude.ai/code)

Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin main
            echo "Committed and pushed to main"
          else
            echo "No new changes to commit"
          fi
