name: ML Priority — Nightly Retrain + Chat Intelligence

on:
  schedule:
    - cron: '0 5 * * *'  # 1 AM EDT
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODEL_PATH: /tmp/priority_model.pkl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install xgboost numpy requests -q
      
      - name: Run Chat Intelligence Pipeline
        run: |
          echo "=== LAYER 1+2: Chat Intelligence Extraction ==="
          python3 << 'PYEOF'
          import sys; sys.path.insert(0, 'scripts')
          from chat_intelligence_pipeline import *

          # Use recent chat summaries stored in Supabase insights
          import requests, json, os
          SB_URL = os.environ['SUPABASE_URL']
          SB_KEY = os.environ['SUPABASE_KEY']
          sb_h = {'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}'}

          # Pull recent insights for chat data
          r = requests.get(f'{SB_URL}/rest/v1/insights?type=eq.chat_intelligence&order=created_at.desc&limit=20', headers=sb_h, timeout=10)
          existing = r.json() if r.status_code == 200 else []
          print(f'Existing chat intelligence entries: {len(existing)}')

          # Run frequency analysis on nexus tasks descriptions as proxy
          r2 = requests.get(f'{SB_URL}/rest/v1/nexus_tasks?select=description,project,priority,status,created_at&limit=500', headers=sb_h, timeout=15)
          tasks = r2.json() if r2.status_code == 200 else []

          # Convert tasks to chat-like format for frequency analysis
          fake_chats = [{'title': t.get('description','')[:80], 'summary': t.get('description',''), 'updated_at': t.get('created_at',''), 'url': ''} for t in tasks]

          signals = analyze_chat_frequency(fake_chats)
          scores = compute_domain_priority(signals)

          print('Domain priority scores:')
          for d in sorted(scores.keys(), key=lambda x: -scores[x]['score']):
              s = scores[d]
              print(f'  {d}: {s["score"]} pts (mentions={s["mentions"]}, urgency={s["urgency"]})')

          # Gemini deep analysis if key available
          gemini_key = os.environ.get('GEMINI_API_KEY', '')
          priorities = None
          if gemini_key:
              priorities = gemini_extract_priorities(fake_chats[:10], scores)
              if priorities:
                  print(f'Gemini extracted {len(priorities)} priorities')
                  for p in priorities[:5]:
                      print(f'  +{p.get("xgboost_boost",0)} [{p.get("domain","?")}] {p.get("task","?")[:60]}')

          # Store results
          store_chat_intelligence(scores, priorities)
          print('Chat intelligence stored in Supabase')
          PYEOF
      
      - name: Train XGBoost with enriched features
        run: python3 scripts/ml_priority_engine.py
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: priority-model
          path: /tmp/priority_model.pkl
          retention-days: 7
