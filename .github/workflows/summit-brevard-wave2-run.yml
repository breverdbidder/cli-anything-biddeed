name: Summit Brevard Wave 2 — Fill 53K Parcels
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [summit-wave2-run]

jobs:
  wave2-gis:
    name: City GIS probes + unincorporated gap fill
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx shapely

      - name: Run Wave 2 GIS conquest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/summit_brevard_wave2_gis.py

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave2-gis-results
          path: wave2_gis_results.json
          if-no-files-found: ignore
