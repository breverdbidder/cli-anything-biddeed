name: n8n Setup + Test on Hetzner
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - status

jobs:
  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: n8n on Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          ACTION: ${{ inputs.action }}
          TELEGRAM_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${HETZNER_IP}"

          if [ "$ACTION" = "status" ]; then
            $SSH "docker ps --filter name=n8n && curl -s http://localhost:5678/healthz || echo 'n8n not running'"
            exit 0
          fi

          echo "=== Installing n8n on Hetzner ==="

          # Check if already running
          RUNNING=$($SSH "docker ps --format '{{.Names}}' | grep -c n8n || true" 2>/dev/null)
          if [ "$RUNNING" -gt "0" ]; then
            echo "n8n already running!"
            $SSH "docker ps --filter name=n8n --format '{{.Names}} | {{.Status}} | {{.Ports}}'"
          else
            # Create compose file on Hetzner
            $SSH "mkdir -p /opt/n8n/data /opt/n8n/templates"
            
            $SSH 'cat > /opt/n8n/docker-compose.yml << EOF
version: "3.8"
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=ariel
      - N8N_BASIC_AUTH_PASSWORD=Everest18n8n
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/New_York
      - N8N_SECURE_COOKIE=false
    volumes:
      - /opt/n8n/data:/home/node/.n8n
      - /opt/n8n/templates:/home/node/templates
EOF'
            
            # Pull and start
            $SSH "cd /opt/n8n && docker compose pull && docker compose up -d"
            
            # Wait for health
            sleep 15
            $SSH "curl -s http://localhost:5678/healthz && echo ' — n8n HEALTHY' || echo 'n8n starting...'"
            $SSH "docker ps --filter name=n8n --format '{{.Names}} | {{.Status}} | {{.Ports}}'"
          fi

          # External health check
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${HETZNER_IP}:5678/healthz" --max-time 10 || echo "000")
          echo "External check: HTTP $STATUS"

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT}" -d "parse_mode=Markdown" \
              --data-urlencode "text=✅ *n8n LIVE on Hetzner*

          URL: http://${HETZNER_IP}:5678
          User: ariel
          Pass: Everest18n8n

          3 skill repos deployed:
          • skills/n8n-claude (7 skills)
          • skills/n8n-generator (545 nodes)
          • skills/n8n-seo-templates (21 workflows)" > /dev/null
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT}" \
              --data-urlencode "text=⚠️ n8n installed but port 5678 not reachable externally (HTTP $STATUS). May need: ufw allow 5678" > /dev/null
          fi
