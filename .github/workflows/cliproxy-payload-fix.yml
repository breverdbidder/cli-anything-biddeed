name: cliproxy payload fix — remove top-level temperature for Gemini routing
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH + payload fix
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          CFG=/opt/cliproxy-gateway/config.yaml
          
          echo "=== A: current payload section ==="
          $SSH "grep -A20 '^payload:' $CFG"

          echo
          echo "=== B: backup + remove the entire payload section ==="
          $SSH "cp $CFG ${CFG}.bak.payload.\$(date +%s)"
          # Remove from "^payload:" to EOF (it's the last section)
          $SSH "sed -i '/^payload:/,\$d' $CFG"
          
          echo "--- after edit, last 10 lines ---"
          $SSH "tail -10 $CFG"

          echo
          echo "=== C: restart container ==="
          $SSH 'docker restart biddeed-cliproxy'
          sleep 5
          $SSH 'docker logs --tail 5 biddeed-cliproxy 2>&1 | grep -v "no space"'

          echo
          echo "=== D: smoke test — gemini-flash via Anthropic format ==="
          CP_KEY="biddeed-gw-77dc6c9df0e5088057c28d1f94d3fef791961fbb409da85f"
          RESP=$($SSH "curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${CP_KEY}' \
            -H 'anthropic-version: 2023-06-01' \
            -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with CLIPROXY_GEMINI_OK\"}]}' \
            -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500
          echo

          echo
          echo "=== E: also try OpenAI-compat format (chat completions) ==="
          RESP2=$($SSH "curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${CP_KEY}' \
            -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with OPENAI_FMT_OK\"}]}' \
            -m 30 http://127.0.0.1:8317/v1/chat/completions 2>&1")
          echo "len: ${#RESP2}"
          echo "$RESP2" | head -c 1500
          echo

          echo
          echo "=== F: try Gemini native format directly ==="
          RESP3=$($SSH "curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'x-goog-api-key: ${CP_KEY}' \
            -d '{\"contents\":[{\"parts\":[{\"text\":\"reply only GEMINI_NATIVE_OK\"}]}]}' \
            -m 30 http://127.0.0.1:8317/v1beta/models/gemini-2.0-flash:generateContent 2>&1")
          echo "len: ${#RESP3}"
          echo "$RESP3" | head -c 1500
          echo

          echo "=== END ==="
