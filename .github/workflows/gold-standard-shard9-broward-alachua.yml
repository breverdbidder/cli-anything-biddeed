name: Gold Standard Shard-9 (broward + alachua)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - migration
          - broward_i_enrichment
          - alachua_j_fill
          - verify
  schedule:
    - cron: '0 8 * * *'   # 08:00Z daily

concurrency:
  group: gold-standard-shard9-broward-alachua
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Apply migration via Management API
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'migration' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATION_FILE: migrations/20260720_gold_standard_shard9_broward_alachua.sql
        run: python3 scripts/mgmt_api_migrate.py

      - name: Run shard-9 executor (broward I + alachua J + E)
        if: ${{ github.event.inputs.phase == 'all' || github.event.inputs.phase == 'broward_i_enrichment' || github.event.inputs.phase == 'alachua_j_fill' || github.event.inputs.phase == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/shard9_broward_alachua_executor.py

      - name: Verify county metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.parse

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def rpc(fn, params):
              req = urllib.request.Request(
                  f'{SUPABASE_URL}/rest/v1/rpc/{fn}',
                  data=json.dumps(params).encode(),
                  headers={'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}',
                           'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f'rpc {fn} error: {e}')
                  return None

          print('=== VERIFICATION — shard9 broward+alachua ===')
          import datetime
          print(f'Timestamp: {datetime.datetime.now(datetime.timezone.utc).isoformat()}')

          for county in ['broward', 'alachua']:
              result = rpc('pencil_dod_evaluate_county', {'p_county': county})
              if result:
                  if isinstance(result, list):
                      passes = sum(1 for r in result if isinstance(r, dict) and r.get('pass'))
                      print(f'{county.upper()}: {passes}/10')
                      for r in result:
                          if isinstance(r, dict):
                              status = 'PASS' if r.get('pass') else 'FAIL'
                              print(f\"  {r.get('letter')}: {status} metric={r.get('metric')}\")
                  elif isinstance(result, dict):
                      passes = sum(1 for v in result.values() if isinstance(v, dict) and v.get('pass'))
                      print(f'{county.upper()}: {passes}/10 — {json.dumps(result)}')
                  else:
                      print(f'{county}: {result}')
              else:
                  print(f'{county}: evaluation failed')
          " 2>&1 | tee /tmp/shard9_verify.txt

          cat /tmp/shard9_verify.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Run gold_standard_loop (if no other session mid-flight)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request

          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def rpc(fn, params):
              req = urllib.request.Request(
                  f'{SUPABASE_URL}/rest/v1/rpc/{fn}',
                  data=json.dumps(params).encode(),
                  headers={'apikey': SUPABASE_KEY, 'Authorization': f'Bearer {SUPABASE_KEY}',
                           'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      return r.status, json.loads(r.read() or b'null')
              except Exception as e:
                  return None, str(e)

          print('Running gold_standard_loop...')
          status, result = rpc('gold_standard_loop', {})
          print(f'loop: {status} — {str(result)[:200]}')

          import time; time.sleep(5)

          print('Running gold_standard_certify...')
          status2, result2 = rpc('gold_standard_certify', {})
          print(f'certify: {status2} — {str(result2)[:400]}')
          " 2>&1
