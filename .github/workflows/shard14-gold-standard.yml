name: "SHARD-14 Gold Standard Pipeline"

# WIRING MANDATE: Execute SHARD-14 pipeline automatically
# Counties: osceola, flagler, santa_rosa, hamilton
# Target: Move from current scores to 10/10 Gold Standard

on:
  # Manual dispatch for immediate execution
  workflow_dispatch:
    inputs:
      county:
        description: "County to process (or 'all' for all SHARD-14)"
        required: true
        type: choice
        options:
          - hamilton
          - osceola 
          - flagler
          - santa_rosa
          - all
        default: hamilton
      mode:
        description: "Pipeline mode"
        required: true
        type: choice
        options:
          - setup
          - ingest
          - verified_outcomes
          - full_pipeline
        default: setup

  # Daily execution at 06:00Z (before main Gold Standard loop at 07:30Z)  
  schedule:
    - cron: '0 6 * * *'

jobs:
  shard14-pipeline:
    name: "SHARD-14 ${{ inputs.county || 'all' }} (${{ inputs.mode || 'full_pipeline' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max per ship-to-main mandate
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install httpx
          
      - name: Configure environment  
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Environment configured"
          echo "Processing county: ${{ inputs.county || 'all' }}"
          echo "Pipeline mode: ${{ inputs.mode || 'full_pipeline' }}"
          
      - name: Setup pipeline infrastructure
        if: inputs.mode == 'setup' || inputs.mode == 'full_pipeline' || inputs.mode == null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🔧 Setting up SHARD-14 pipeline infrastructure..."
          
          if [ "${{ inputs.county }}" = "all" ] || [ -z "${{ inputs.county }}" ]; then
            python scripts/setup_shard14_counties.py
          else
            python scripts/setup_shard14_counties.py --county "${{ inputs.county }}"
          fi
          
      - name: Setup verified outcomes tables
        if: inputs.mode == 'setup' || inputs.mode == 'verified_outcomes' || inputs.mode == 'full_pipeline' || inputs.mode == null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🔍 Setting up verified outcomes pipeline..."
          python scripts/shard14_verified_outcomes.py --setup
          
      - name: Ingest auction data (Letter A)
        if: inputs.mode == 'ingest' || inputs.mode == 'full_pipeline' || inputs.mode == null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "📊 Ingesting auction data for Letter A (dual product coverage)..."
          
          if [ "${{ inputs.county }}" = "all" ] || [ -z "${{ inputs.county }}" ]; then
            python scripts/shard14_county_ingestion.py --all-shard14
          else
            python scripts/shard14_county_ingestion.py --county "${{ inputs.county }}"
          fi
          
      - name: Collect verified outcomes (Letter B)
        if: inputs.mode == 'verified_outcomes' || inputs.mode == 'full_pipeline' || inputs.mode == null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🔍 Collecting verified outcomes for Letter B..."
          
          if [ "${{ inputs.county }}" = "all" ] || [ -z "${{ inputs.county }}" ]; then
            python scripts/shard14_verified_outcomes.py --all-shard14 --scrape
          else
            python scripts/shard14_verified_outcomes.py --county "${{ inputs.county }}" --scrape  
          fi
          
      - name: Verification protocol (Evidence-Before-Claims)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "✅ Running verification protocol..."
          python scripts/verify_shard14_status.py
          
          echo ""
          echo "📊 Verifying Letters A and B specifically:"
          
          if [ "${{ inputs.county }}" = "all" ] || [ -z "${{ inputs.county }}" ]; then
            python scripts/shard14_county_ingestion.py --all-shard14 --verify-only
            python scripts/shard14_verified_outcomes.py --all-shard14 --verify
          else
            python scripts/shard14_county_ingestion.py --county "${{ inputs.county }}" --verify-only
            python scripts/shard14_verified_outcomes.py --county "${{ inputs.county }}" --verify
          fi
          
      - name: Commit pipeline state (Ship-to-Main)
        if: success()
        run: |
          git config --global user.name "SHARD-14 Pipeline"
          git config --global user.email "claude@biddeed.ai"
          
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "chore: SHARD-14 pipeline execution $(date -Iseconds)
            
            County: ${{ inputs.county || 'all' }}
            Mode: ${{ inputs.mode || 'full_pipeline' }}
            
            Automated execution per ship-to-main mandate.
            Pipeline state persisted to Supabase.
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>"
            
            git push origin main
            echo "✅ Pipeline state committed to main"
          fi
          
      - name: Notify completion
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            STATUS="${{ job.status }}"
            COUNTY="${{ inputs.county || 'all' }}"
            MODE="${{ inputs.mode || 'full_pipeline' }}"
            
            MESSAGE="🏗️ SHARD-14 Pipeline $STATUS
            
            County: $COUNTY
            Mode: $MODE
            Duration: ${{ steps.setup.outputs.duration || 'Unknown' }}
            
            Next verification: Gold Standard loop 07:30Z"
            
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MESSAGE" \
              -d "parse_mode=Markdown" || echo "Telegram notification failed"
          fi