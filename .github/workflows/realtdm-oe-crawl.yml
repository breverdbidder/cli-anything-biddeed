name: RealTDM OE Crawl
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'realtdm subdomain (county)'
        required: false
        default: 'miamidade'
        type: string
      max_cases:
        description: 'max case detail pages'
        required: false
        default: '40'
        type: string
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SUBDOMAIN: ${{ github.event.inputs.subdomain }}
      MAX_CASES: ${{ github.event.inputs.max_cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install --quiet playwright httpx
          python -m playwright install --with-deps chromium
      - name: Run crawl
        run: python .github/scripts/realtdm_oe_crawl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtdm-oe-${{ github.event.inputs.subdomain }}
          path: out/
          if-no-files-found: warn
