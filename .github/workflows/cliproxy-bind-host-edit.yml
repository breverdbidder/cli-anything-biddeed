name: cliproxy bind fix v2 — edit config via host volume path
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH + locate volume + patch + restart
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: docker inspect mounts for biddeed-cliproxy ==="
          $SSH 'docker inspect biddeed-cliproxy --format "{{json .Mounts}}" 2>&1 | python3 -m json.tool 2>&1 | head -40'

          echo
          echo "=== B: find /data on host filesystem ==="
          # Method 1: from inspect
          DATA_HOST=$($SSH 'docker inspect biddeed-cliproxy --format "{{range .Mounts}}{{if eq .Destination \"/data\"}}{{.Source}}{{end}}{{end}}"' | tr -d '\r\n')
          echo "host path for /data: '$DATA_HOST'"
          # Method 2: find by container ID
          $SSH 'find /var/lib/docker/volumes -maxdepth 2 -name "*cliproxy*" 2>/dev/null'

          echo
          echo "=== C: list volume contents from host side ==="
          if [ -n "$DATA_HOST" ]; then
            $SSH "ls -la '$DATA_HOST' 2>&1 | head -10"
            $SSH "ls -la '$DATA_HOST/logs' 2>&1 | head -5"
          fi

          # Try volumes by name
          for VOL in cliproxy-gateway_auth-data cliproxy-gateway_log-data; do
            echo "--- $VOL ---"
            $SSH "ls -la /var/lib/docker/volumes/$VOL/_data/ 2>&1 | head -10"
          done

          # Find config.yaml ANYWHERE in cliproxy volumes
          echo "--- config.yaml search ---"
          $SSH 'find /var/lib/docker/volumes -name "config.yaml" 2>/dev/null'

          echo
          echo "=== D: locate config.yaml via container's overlay ==="
          OVERLAY=$($SSH 'docker inspect biddeed-cliproxy --format "{{.GraphDriver.Data.MergedDir}}" 2>&1' | tr -d '\r\n')
          echo "overlay: $OVERLAY"
          $SSH "ls -la '$OVERLAY/data/' 2>&1 | head -10" 

          echo
          echo "=== E: patch config + restart ==="
          # Find the actual config file
          CFG=$($SSH 'find /var/lib/docker/overlay2 /var/lib/docker/volumes -name "config.yaml" 2>/dev/null | xargs grep -l "biddeed-gw" 2>/dev/null | head -1' | tr -d '\r\n')
          echo "found config at: $CFG"
          if [ -n "$CFG" ]; then
            $SSH "grep -n '^host:' '$CFG'"
            $SSH "sed -i.bak 's/^host: \"127.0.0.1\"/host: \"0.0.0.0\"/' '$CFG'"
            $SSH "grep -n '^host:' '$CFG'"
            
            echo "--- restart container ---"
            $SSH 'docker restart biddeed-cliproxy'
            sleep 5
            $SSH 'docker logs --tail 10 biddeed-cliproxy 2>&1 | grep -v "no space"'

            echo
            echo "=== F: smoke test from host (after bind fix) ==="
            CP_KEY="biddeed-gw-77dc6c9df0e5088057c28d1f94d3fef791961fbb409da85f"
            RESP=$($SSH "curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -H 'x-api-key: ${CP_KEY}' \
              -H 'anthropic-version: 2023-06-01' \
              -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with CLIPROXY_OK\"}]}' \
              -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
            echo "len: ${#RESP}"
            echo "$RESP" | head -c 1500
            echo
          else
            echo "config.yaml not found via overlay search — different mechanism"
          fi

          echo "=== END ==="
