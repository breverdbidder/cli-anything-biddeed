name: Track F - CMA Dogfood (Sandusky)
on:
  workflow_dispatch:

jobs:
  cma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install homeharvest pandas
      - name: Run CMA
        run: |
          mkdir -p /tmp/cma_out
          python scripts/track-f/cma_dogfood.py | tee /tmp/cma_out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cma-result
          path: /tmp/cma_out/
          retention-days: 30
