name: Deploy Landing Pages
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - deploy-zonewise
          - deploy-biddeed
          - deploy-both
      landing_url:
        description: 'URL to raw HTML file (for deploy actions)'
        required: false
        type: string

env:
  VM_HOST: 87.99.129.125

jobs:
  deploy:
    name: "${{ inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify Sites
        if: inputs.action == 'verify'
        run: |
          echo "⛰️ Landing Page Health Check"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          check_site() {
            URL="$1"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 "$URL" 2>/dev/null || echo "000")
            SIZE=$(curl -s -L --max-time 10 "$URL" 2>/dev/null | wc -c)
            TITLE=$(curl -s -L --max-time 10 "$URL" 2>/dev/null | grep -o '<title>[^<]*</title>' | head -1 | sed 's/<[^>]*>//g')
            HAS_3D=$(curl -s -L --max-time 10 "$URL" 2>/dev/null | grep -c "three.min.js" || echo 0)
            
            [ "$CODE" = "200" ] && ICON="✅" || ICON="❌"
            [ "$HAS_3D" -gt 0 ] && TD="🎮3D" || TD="📄flat"
            echo "$ICON $URL → $CODE | ${SIZE}B | $TD | $TITLE"
          }
          
          check_site "https://www.zonewise.ai"
          check_site "https://zonewise.ai"
          check_site "https://brevard-bidder-landing.pages.dev"
          check_site "https://biddeed.ai"

      - name: Deploy ZoneWise
        if: inputs.action == 'deploy-zonewise' || inputs.action == 'deploy-both'
        env:
          GH_PAT: ${{ secrets.PAT4 }}
        run: |
          echo "🌐 Deploying ZoneWise.AI landing page..."
          
          if [ -n "${{ inputs.landing_url }}" ]; then
            curl -sL "${{ inputs.landing_url }}" > /tmp/zonewise-landing.html
          else
            # Pull latest from repo
            curl -sL -H "Authorization: token $GH_PAT" \
              "https://raw.githubusercontent.com/breverdbidder/zonewise-web/main/public/index.html" \
              > /tmp/zonewise-landing.html
          fi
          
          SIZE=$(wc -c < /tmp/zonewise-landing.html)
          echo "File size: ${SIZE} bytes"
          
          # Verify it's a proper HTML file with 3D
          grep -q "three.min.js" /tmp/zonewise-landing.html || { echo "❌ No Three.js found — aborting"; exit 1; }
          grep -q "1E3A5F" /tmp/zonewise-landing.html || { echo "❌ No house brand colors — aborting"; exit 1; }
          
          echo "✅ Content validated (Three.js + house brand)"
          
          # Push to repo if URL was provided (new content)
          if [ -n "${{ inputs.landing_url }}" ]; then
            CONTENT=$(base64 -w0 /tmp/zonewise-landing.html)
            SHA=$(curl -s -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/breverdbidder/zonewise-web/contents/public/index.html" | \
              python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))")
            
            curl -s -X PUT \
              -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/breverdbidder/zonewise-web/contents/public/index.html" \
              -d "{\"message\":\"deploy: update ZoneWise landing page (${SIZE}B)\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
            echo "✅ Pushed to GitHub — Vercel auto-deploy triggered"
          fi
          
          # Wait and verify
          sleep 30
          LIVE_SIZE=$(curl -s -L https://www.zonewise.ai/ | wc -c)
          echo "Live site: ${LIVE_SIZE} bytes"

      - name: Deploy BidDeed
        if: inputs.action == 'deploy-biddeed' || inputs.action == 'deploy-both'
        env:
          GH_PAT: ${{ secrets.PAT4 }}
        run: |
          echo "🏠 Deploying BidDeed.AI landing page..."
          
          if [ -n "${{ inputs.landing_url }}" ]; then
            curl -sL "${{ inputs.landing_url }}" > /tmp/biddeed-landing.html
          else
            curl -sL -H "Authorization: token $GH_PAT" \
              "https://raw.githubusercontent.com/breverdbidder/brevard-bidder-landing/main/index.html" \
              > /tmp/biddeed-landing.html
          fi
          
          SIZE=$(wc -c < /tmp/biddeed-landing.html)
          echo "File size: ${SIZE} bytes"
          
          grep -q "three.min.js" /tmp/biddeed-landing.html || { echo "❌ No Three.js — aborting"; exit 1; }
          grep -q "1E3A5F" /tmp/biddeed-landing.html || { echo "❌ No house brand — aborting"; exit 1; }
          
          echo "✅ Content validated"
          
          if [ -n "${{ inputs.landing_url }}" ]; then
            CONTENT=$(base64 -w0 /tmp/biddeed-landing.html)
            SHA=$(curl -s -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/breverdbidder/brevard-bidder-landing/contents/index.html" | \
              python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))")
            
            curl -s -X PUT \
              -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/breverdbidder/brevard-bidder-landing/contents/index.html" \
              -d "{\"message\":\"deploy: update BidDeed landing page (${SIZE}B)\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
            echo "✅ Pushed to GitHub — Cloudflare auto-deploy triggered"
          fi
          
          sleep 30
          LIVE_SIZE=$(curl -s -L https://brevard-bidder-landing.pages.dev/ | wc -c)
          echo "Live site: ${LIVE_SIZE} bytes"

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS=${{ job.status }}
          [ "$STATUS" = "success" ] && ICON="✅" || ICON="❌"
          
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="$ICON *Landing Pages: ${{ inputs.action }}* — ${STATUS}
          
          🌐 zonewise.ai: $(curl -s -o /dev/null -w '%{http_code}' -L https://www.zonewise.ai)
          🏠 biddeed.ai: $(curl -s -o /dev/null -w '%{http_code}' -L --max-time 5 https://biddeed.ai 2>/dev/null || echo '000')
          ⏰ $(date '+%I:%M %p EST')" \
            -d parse_mode="Markdown" > /dev/null 2>&1 || true
