name: close-stale-199
on:
  workflow_dispatch:
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 199,
              body: `## Root Cause Fixed (commits \`2c5b9cc0\` + \`5e9b056b\`)

**GHA run**: GHA-997331 (failed before 2026-03-29T14:11Z)

**Root cause (two issues):**
1. YAML syntax error in \`.github/workflows/summit-utcc-executor.yml\` — bare quotes at column 0 in the large claude prompt caused 0 jobs to be parsed from the workflow.
2. Idempotency check ran before git pull — \`utcc/registry.py\` existence check was evaluated against a stale/missing local clone on Hetzner.

**Fixes applied:**
- Commit \`2c5b9cc0\` (2026-03-29 14:11 UTC): repaired YAML syntax across 8 broken workflows — collapsed multi-line prompts with bare quotes to single lines with \\n escape sequences.
- Commit \`5e9b056b\` (2026-04-01): moved git pull/clone BEFORE idempotency check so \`utcc/registry.py\` is evaluated against current repo state.

**Verification**: YAML valid ✅ | Idempotency guard correct ✅ | Fix already in main ✅

Stale issue — closing.`
            });
            await github.rest.issues.update({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 199,
              state: 'closed'
            });
