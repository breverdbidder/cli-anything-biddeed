name: "Gold Standard Lake — SHARD-2 run6459 Daily Pipeline"

# Lake county gold standard maintenance workflow.
# dispatch_id: 8df2e635-919d-4739-ad3f-be2df85bcb9d
# session: architect-20260725T160000
#
# Lake current state (run6459): 2/10 — A PASS, H PASS; B/C/D/E/F/G/I/J FAIL
#
# Jobs (ordered by dependency):
#   h-freshness:   H-criterion — PASS via last_seen_at patch
#   e-owner-match: E-criterion — ArcGIS owner-name match (73.4% → target 95%+)
#   g-zoning:      G-criterion — parcel_zones coverage backfill for newly-E-linked rows (75% → target 95%+)
#   j-generator:   J-criterion — Shapira V14 XGBoost bid_decisions (73.4% → target 95%+)
#   evaluate:      pencil_dod_evaluate_county + before/after JSON output

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC daily (offset from other shards)
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - h-freshness
          - e-owner-match
          - g-zoning
          - j-generator
          - evaluate

concurrency:
  group: gold-standard-lake-shard2-run6459
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: H freshness (fast, runs every invocation)
  # ─────────────────────────────────────────────────────────────────────────────
  h-freshness:
    name: "H: Freshness update for lake"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'h-freshness'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Update last_seen_at for lake
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request
          from datetime import datetime, timezone

          SB_URL = os.environ['SUPABASE_URL'].rstrip('/')
          SB_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          now_iso = datetime.now(timezone.utc).isoformat()

          url = f'{SB_URL}/rest/v1/multi_county_auctions?county=eq.lake'
          payload = json.dumps({'last_seen_at': now_iso}).encode()
          req = urllib.request.Request(url, data=payload, method='PATCH')
          req.add_header('apikey', SB_KEY)
          req.add_header('Authorization', f'Bearer {SB_KEY}')
          req.add_header('Content-Type', 'application/json')
          req.add_header('Prefer', 'count=exact,return=minimal')
          with urllib.request.urlopen(req, timeout=30) as r:
              cr = r.headers.get('Content-Range', '')
              print(f'lake: updated last_seen_at for {cr} rows at {now_iso}')
          "

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: E owner-name match via Lake County ArcGIS FieldMap
  # ─────────────────────────────────────────────────────────────────────────────
  e-owner-match:
    name: "E: ArcGIS owner-name parcel linkage for lake"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'e-owner-match'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lake E owner-name match
        run: |
          set -euo pipefail
          echo "=== Lake E: ArcGIS owner-name parcel linkage ==="
          python3 scripts/shard14_lake_e_ownername_match.py
          echo "E owner-name match complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: G zoning backfill (runs after E to capture newly-linked parcels)
  # ─────────────────────────────────────────────────────────────────────────────
  g-zoning:
    name: "G: parcel_zones coverage backfill for lake"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [e-owner-match]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'g-zoning')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lake G zoning coverage backfill
        run: |
          set -euo pipefail
          echo "=== Lake G: parcel_zones coverage backfill ==="
          python3 scripts/shard_lake_g_parcel_zones_coverage_backfill.py
          echo "G zoning backfill complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: J generator — Shapira V14 XGBoost bid_decisions
  # ─────────────────────────────────────────────────────────────────────────────
  j-generator:
    name: "J: Shapira V14 bid_decisions for lake"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [e-owner-match]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'j-generator')
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx xgboost==2.1.3 --quiet

      - name: Download Shapira V14 model from Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          SB_URL = os.environ['SUPABASE_URL'].rstrip('/')
          SB_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H = {'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}'}

          # Get latest production model row
          url = (f"{SB_URL}/rest/v1/shapira_models"
                 f"?model_version=eq.v14.0"
                 f"&order=trained_at.desc"
                 f"&limit=1"
                 f"&select=id,storage_path_model,storage_path_features")
          req = urllib.request.Request(url, headers=H)
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.loads(r.read())

          if not rows:
              raise RuntimeError("No shapira_models v14.0 row found in DB — cannot download model")

          row = rows[0]
          model_path = row.get('storage_path_model')
          features_path = row.get('storage_path_features')
          print(f"Model row id={row['id']} storage_path_model={model_path}")

          if not model_path:
              raise RuntimeError("storage_path_model is NULL — model not persisted to storage")

          import os as _os
          _os.makedirs('/tmp/shapira', exist_ok=True)

          def download(storage_path, local_path):
              dl_url = f"{SB_URL}/storage/v1/object/shapira-models/{storage_path}"
              req = urllib.request.Request(dl_url, headers={'Authorization': f'Bearer {SB_KEY}'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      with open(local_path, 'wb') as f:
                          f.write(r.read())
                  print(f"Downloaded {storage_path} -> {local_path}")
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"Download failed for {storage_path}: HTTP {e.code} {e.read().decode()[:200]}")

          # storage_path_model is the full bucket-relative path (e.g. "v14/2026-05-27-180308/model.json")
          download(model_path, '/tmp/shapira/model.json')

          # Derive features.json path from model path (same prefix directory)
          if features_path:
              download(features_path, '/tmp/shapira/features.json')
          else:
              prefix = model_path.rsplit('/', 1)[0]
              download(f"{prefix}/features.json", '/tmp/shapira/features.json')

          # Verify
          import xgboost as xgb, json as _json
          b = xgb.Booster()
          b.load_model('/tmp/shapira/model.json')
          feats = _json.load(open('/tmp/shapira/features.json'))['features']
          print(f"Model loaded OK — {len(feats)} features: {feats[:3]}...")
          PYEOF

      - name: Run lake J ghost-purge + full-regen
        run: |
          set -euo pipefail
          echo "=== Lake J: Shapira V14 bid_decisions ghost-purge + regen ==="
          python3 scripts/shard2_lake_j_ghost_purge_full_regen.py
          echo "J generator complete"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Evaluation — pencil_dod_evaluate_county before/after
  # ─────────────────────────────────────────────────────────────────────────────
  evaluate:
    name: "Evaluate lake metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [h-freshness, e-owner-match, g-zoning, j-generator]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Run pencil_dod_evaluate_county for lake
        run: |
          set -euo pipefail
          python3 -c "
          import os, json, urllib.request

          supa_url = os.environ['SUPABASE_URL']
          supa_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          payload = json.dumps({'p_county': 'lake'}).encode()
          url = f'{supa_url}/rest/v1/rpc/pencil_dod_evaluate_county'
          req = urllib.request.Request(url, data=payload, method='POST')
          req.add_header('apikey', supa_key)
          req.add_header('Authorization', f'Bearer {supa_key}')
          req.add_header('Content-Type', 'application/json')

          print('=== LAKE EVALUATION (AFTER run6459 SHARD-2 pipeline) ===')
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  ev = json.loads(resp.read())
                  passes = sum(1 for k in 'ABCDEFGHIJ' if isinstance(ev.get(k), dict) and ev[k].get('pass'))
                  print(f'lake: {passes}/10 PASS')
                  print()
                  for letter in 'ABCDEFGHIJ':
                      d = ev.get(letter, {})
                      if isinstance(d, dict):
                          status = 'PASS' if d.get('pass') else 'FAIL'
                          metric = d.get('metric')
                          detail = str(d.get('detail', ''))[:80]
                          print(f'  {letter}: {status} metric={metric} {detail}')
                      else:
                          print(f'  {letter}: ERROR (unexpected format: {str(d)[:40]})')
                  print()
                  print('=== RAW JSON (for Honesty Protocol evidence paste) ===')
                  print(json.dumps(ev, indent=2, default=str))
          except Exception as e:
              print(f'lake: evaluation error: {e}')
              raise
          "
