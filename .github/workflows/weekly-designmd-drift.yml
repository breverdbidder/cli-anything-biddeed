name: Weekly DesignMD Drift Check
# Amendment 3 — DESIGNWISE-SPEC-PATCH.md
# BrandGuard weekly drift detection: extracts tokens from live site, diffs against DESIGN.md
# Creates GitHub Issue + Telegram alert on drift detected
on:
  schedule:
    - cron: '0 13 * * 0'  # Sunday 8AM EST (13:00 UTC)
  workflow_dispatch:
jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install httpx
      - name: Run drift check
        run: |
          cd designwise/agent-harness
          python -m cli_anything.designwise.core.brandguard_agent --drift-check \
            --live-url https://zonewise.ai \
            --design-md ../../DESIGN.md \
            --json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: breverdbidder/zonewise-web
