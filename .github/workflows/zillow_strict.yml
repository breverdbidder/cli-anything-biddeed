name: Zillow Strict — All Properties

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          mkdir -p /tmp/zs
          
          cat > /tmp/zs/scrape.py <<'PY'
          import json, os, re, time, hashlib
          from pathlib import Path
          import urllib.request, urllib.parse
          
          OUT = Path('/tmp/zs')
          API_KEY = os.environ['FIRECRAWL_API_KEY'].strip()
          
          # Each property: address keywords for verification + Zillow URL (ZPID if known, bare otherwise)
          PROPERTIES = [
              {"id": "rainsville", "addr_check": ["1548", "RAINSVILLE"],
               "url": "https://www.zillow.com/homedetails/1548-Rainsville-Rd-SE-Palm-Bay-FL-32909/104107381_zpid/"},
              {"id": "district",   "addr_check": ["211", "DISTRICT"],
               "url": "https://www.zillow.com/homedetails/211-District-St-SE-Palm-Bay-FL-32909/104102427_zpid/"},
              {"id": "fillmore",   "addr_check": ["478", "FILLMORE"],
               "url": "https://www.zillow.com/homedetails/478-Fillmore-Ave-NE-Palm-Bay-FL-32907/"},
              {"id": "copenhaver", "addr_check": ["342", "COPENHAVER"],
               "url": "https://www.zillow.com/homedetails/342-Copenhaver-Ave-NE-Palm-Bay-FL-32907/"},
              {"id": "eldron",     "addr_check": ["3120", "ELDRON"],
               "url": "https://www.zillow.com/homedetails/3120-Eldron-Blvd-SE-Palm-Bay-FL-32909/"},
              {"id": "kirkland",   "addr_check": ["1107", "KIRKLAND"],
               "url": "https://www.zillow.com/homedetails/1107-Kirkland-Dr-Cocoa-FL-32922/"},
              {"id": "pompano",    "addr_check": ["1036", "POMPANO"],
               "url": "https://www.zillow.com/homedetails/1036-Pompano-Dr-Rockledge-FL-32955/"},
              {"id": "canterbury", "addr_check": ["2191", "CANTERBURY"],
               "url": "https://www.zillow.com/homedetails/2191-Canterbury-Ln-Melbourne-FL-32935/"},
              {"id": "bonny",      "addr_check": ["2456", "BONNY"],
               "url": "https://www.zillow.com/homedetails/2456-Bonny-Dr-Cocoa-FL-32926/"},
              {"id": "miracle",    "addr_check": ["977", "MIRACLE"],
               "url": "https://www.zillow.com/homedetails/977-Miracle-Way-Rockledge-FL-32955/"},
              {"id": "robinhood",  "addr_check": ["4087", "ROBINHOOD"],
               "url": "https://www.zillow.com/homedetails/4087-Robinhood-Dr-Melbourne-FL-32935/"},
              {"id": "elmira",     "addr_check": ["1380", "ELMIRA"],  # verify the existing Elmira photos source
               "url": "https://www.zillow.com/homedetails/1380-Elmira-Ave-NW-Palm-Bay-FL-32907/"},
          ]
          
          def fc_scrape(url):
              payload = json.dumps({
                  "url": url,
                  "formats": ["html"],
                  "waitFor": 8000,
                  "timeout": 90000,
                  "onlyMainContent": False,
                  "blockAds": False,
                  "proxy": "stealth",
                  "actions": [
                      {"type": "wait", "milliseconds": 5000},
                      {"type": "scroll", "direction": "down"},
                      {"type": "wait", "milliseconds": 3000},
                  ],
              }).encode()
              req = urllib.request.Request(
                  "https://api.firecrawl.dev/v1/scrape",
                  data=payload,
                  headers={
                      'Content-Type': 'application/json',
                      'Authorization': f'Bearer {API_KEY}',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"    HTTP {e.code}: {e.read()[:200]}", flush=True)
                  return None
              except Exception as e:
                  print(f"    err: {e}", flush=True)
                  return None
          
          def extract_listing_data(html):
              """Parse __NEXT_DATA__ and walk to find property photos + address."""
              if not html:
                  return None, None, []
              
              # Try __NEXT_DATA__ first
              m = re.search(r'<script[^>]+id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.DOTALL)
              if not m:
                  return None, None, []
              
              try:
                  next_data = json.loads(m.group(1))
              except Exception as e:
                  print(f"    __NEXT_DATA__ parse err: {e}", flush=True)
                  return None, None, []
              
              # Walk to find property data + originalPhotos
              # Zillow stores it under props.pageProps.componentProps.gdpClientCache (a stringified JSON)
              props_data = None
              try:
                  cache = next_data.get('props', {}).get('pageProps', {}).get('componentProps', {}).get('gdpClientCache')
                  if isinstance(cache, str):
                      cache = json.loads(cache)
                  for key, val in (cache or {}).items():
                      if isinstance(val, dict) and 'property' in val:
                          props_data = val['property']
                          break
              except Exception as e:
                  print(f"    cache walk err: {e}", flush=True)
              
              # Fallback: walk entire __NEXT_DATA__ for "originalPhotos"
              if not props_data:
                  def find_property(obj):
                      if isinstance(obj, dict):
                          if 'originalPhotos' in obj and 'address' in obj:
                              return obj
                          for v in obj.values():
                              r = find_property(v)
                              if r: return r
                      elif isinstance(obj, list):
                          for x in obj:
                              r = find_property(x)
                              if r: return r
                      return None
                  props_data = find_property(next_data)
              
              if not props_data:
                  return None, None, []
              
              addr = props_data.get('address') or {}
              zpid = props_data.get('zpid', 'unknown')
              photos = props_data.get('originalPhotos') or []
              
              # Extract the largest URL from each photo
              photo_urls = []
              for p in photos:
                  if not isinstance(p, dict): continue
                  # subjectType filter - only PROPERTY photos
                  st = p.get('subjectType', '')
                  if st and st != 'PROPERTY':
                      continue
                  mixed = p.get('mixedSources') or {}
                  jpegs = mixed.get('jpeg') or []
                  if not jpegs:
                      # Fallback to direct url
                      u = p.get('url')
                      if u and 'zillowstatic.com' in u:
                          photo_urls.append(u)
                      continue
                  # Find largest by width
                  largest = None
                  largest_w = 0
                  for j in jpegs:
                      if not isinstance(j, dict): continue
                      w = j.get('width') or 0
                      url = j.get('url')
                      if url and w > largest_w:
                          largest = url
                          largest_w = w
                  if largest:
                      photo_urls.append(largest)
              
              return addr, zpid, photo_urls
          
          def http_download(url, referer):
              UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': referer,
                  'Accept': 'image/avif,image/webp,*/*',
              })
              return urllib.request.urlopen(req, timeout=25)
          
          all_results = {}
          for prop in PROPERTIES:
              print(f"\n=== {prop['id']}: {prop['url'][:100]} ===", flush=True)
              prop_dir = OUT / prop['id']
              prop_dir.mkdir(exist_ok=True)
              
              result = fc_scrape(prop['url'])
              if not result or not result.get('success'):
                  print(f"    Firecrawl failed", flush=True)
                  if result: print(f"    {json.dumps(result)[:200]}", flush=True)
                  all_results[prop['id']] = {'url': prop['url'], 'firecrawl_failed': True}
                  continue
              
              data = result.get('data', {})
              html = data.get('html', '')
              meta = data.get('metadata', {})
              title = meta.get('title','')[:80]
              print(f"    HTML: {len(html)}b | title: {title}", flush=True)
              
              # Save raw HTML for forensics
              if html:
                  (prop_dir / 'page.html').write_text(html, errors='replace')
              
              addr, zpid, photo_urls = extract_listing_data(html)
              
              if not addr:
                  print(f"    ✗ NO LISTING DATA FOUND in __NEXT_DATA__", flush=True)
                  all_results[prop['id']] = {'url': prop['url'], 'no_listing_data': True, 'title': title}
                  continue
              
              street = (addr.get('streetAddress') or '').upper()
              city = (addr.get('city') or '').upper()
              print(f"    Listing: ZPID={zpid} | {street}, {city}", flush=True)
              print(f"    originalPhotos count: {len(photo_urls)}", flush=True)
              
              # Verify address matches expected
              addr_full = f"{street} {city}".upper()
              expected = prop['addr_check']
              all_match = all(kw.upper() in addr_full for kw in expected)
              if not all_match:
                  print(f"    ✗ ADDRESS MISMATCH — expected {expected}, got '{street}, {city}'", flush=True)
                  all_results[prop['id']] = {
                      'url': prop['url'], 'address_mismatch': True,
                      'expected': expected, 'got': f"{street}, {city}",
                      'zpid': zpid,
                  }
                  continue
              
              if not photo_urls:
                  print(f"    ⚠ no photos (likely off-market)", flush=True)
                  all_results[prop['id']] = {
                      'url': prop['url'], 'no_photos': True,
                      'address': f"{street}, {city}", 'zpid': zpid,
                  }
                  continue
              
              # Download
              downloaded = []
              for i, url in enumerate(photo_urls[:40], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_z{zpid}_{h}.jpg"
                      with http_download(url, prop['url']) as r:
                          data_bytes = r.read()
                      if len(data_bytes) > 8000:
                          (prop_dir / fname).write_bytes(data_bytes)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data_bytes)})
                      else:
                          print(f"      [{i}] {len(data_bytes)}b too small", flush=True)
                  except Exception as e:
                      print(f"      [{i}] FAIL: {str(e)[:60]}", flush=True)
              
              print(f"    ✓ Downloaded {len(downloaded)}/{len(photo_urls)} photos", flush=True)
              all_results[prop['id']] = {
                  'url': prop['url'],
                  'verified_address': f"{street}, {city}",
                  'zpid': zpid,
                  'photos_in_listing': len(photo_urls),
                  'downloaded': len(downloaded),
                  'files': downloaded,
              }
              time.sleep(2)
          
          with open(OUT / 'manifest.json', 'w') as f:
              json.dump(all_results, f, indent=2, default=str)
          
          print("\n" + "=" * 60, flush=True)
          print("SUMMARY", flush=True)
          print("=" * 60, flush=True)
          total = 0
          for pid, r in all_results.items():
              if r.get('downloaded'):
                  print(f"  ✓ {pid}: {r['downloaded']} verified photos (ZPID {r.get('zpid','?')})", flush=True)
                  total += r['downloaded']
              elif r.get('no_photos'):
                  print(f"  - {pid}: address verified but listing has no photos (off-market)", flush=True)
              elif r.get('address_mismatch'):
                  print(f"  ✗ {pid}: ADDRESS MISMATCH (got {r.get('got')})", flush=True)
              elif r.get('no_listing_data'):
                  print(f"  ✗ {pid}: no listing data in page", flush=True)
              else:
                  print(f"  ✗ {pid}: scrape failed", flush=True)
          print(f"\nTotal downloaded: {total} verified photos", flush=True)
          PY
          
          python3 /tmp/zs/scrape.py 2>&1 | tee /tmp/zs/run.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillow_strict
          path: /tmp/zs/
