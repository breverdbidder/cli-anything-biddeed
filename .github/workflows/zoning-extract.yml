name: zoning-extract

# Autonomous, manually-triggered per county. Discovery (source map) is the only
# per-county prerequisite; once that exists this runs unattended.
on:
  workflow_dispatch:
    inputs:
      county:
        description: "County (e.g. brevard, duval)"
        required: true
        default: "brevard"
      jurisdiction:
        description: "Optional single assignment_jurisdiction (e.g. palm_bay)"
        required: false
        default: ""
      dry_run:
        description: "Extract and log without writing to staging"
        type: boolean
        default: false
      render_only:
        description: "Render pages and report size only (no LLM, no writes) — bot-wall smoke test"
        type: boolean
        default: false

concurrency:
  group: zoning-extract-${{ github.event.inputs.county }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: zoning_extractor
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run extractor
        working-directory: zoning_extractor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--county ${{ github.event.inputs.county }}"
          if [ -n "${{ github.event.inputs.jurisdiction }}" ]; then ARGS="$ARGS --jurisdiction ${{ github.event.inputs.jurisdiction }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.render_only }}" = "true" ]; then ARGS="$ARGS --render-only"; fi
          python main.py $ARGS
