name: Supabase SUMMIT Verifier

# Autonomous audit of verified SUMMITs against actual artifacts.
# Closes the self-attestation loophole in trg_prevent_ghost_success.
#
# Cron: hourly at :41 (was every 30 min), scans last 24h of state=verified,
# auto-flips to failed on GHA-GREEN-NOT-DELIVERED + logs CRITICAL
# honesty_violation.
#
# LAUNCH-E (#20039, 2026-09-05): this is now the canonical schedule for the
# two-workflow SUMMIT verifier group (this file + summit-verifier.yml).
# summit-verifier.yml's `schedule:` was removed; it stays workflow_dispatch +
# repository_dispatch only. Moved */30 -> hourly :41 (off :00/:15/:30/:45)
# to cut scheduled Supabase load ahead of launch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "auto-patrol"
        type: choice
        options:
          - auto-patrol
          - all-verified-today
          - session
          - summit-id
          - retro-verify-today
      session_id:
        description: "chat_session_id (if mode=session)"
        required: false
      summit_id:
        description: "SUMMIT uuid (if mode=summit-id)"
        required: false
      auto_flip:
        description: "Auto-flip verified→failed on NOT_DELIVERED"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: read

concurrency:
  group: supabase-summit-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
      BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install httpx==0.27.0

      - name: Fail fast on missing secrets (anti-ghost-success)
        run: |
          for var in GH_TOKEN SUPABASE_SERVICE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::missing required secret: $var"
              exit 1
            fi
          done

      - name: Run verifier (auto-patrol)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'auto-patrol' }}
        run: python scripts/supabase_summit_verifier.py --auto-patrol

      - name: Run verifier (all-verified-today)
        if: ${{ inputs.mode == 'all-verified-today' }}
        run: python scripts/supabase_summit_verifier.py --all-verified-today

      - name: Run verifier (session)
        if: ${{ inputs.mode == 'session' }}
        run: python scripts/supabase_summit_verifier.py --session "${{ inputs.session_id }}"

      - name: Run verifier (summit-id)
        if: ${{ inputs.mode == 'summit-id' }}
        run: python scripts/supabase_summit_verifier.py --summit-id "${{ inputs.summit_id }}"
      - name: Run verifier (retro-verify today's self-attested verified)
        if: ${{ inputs.mode == 'retro-verify-today' }}
        run: python scripts/supabase_summit_verifier.py --retro-verify-today
