name: SUMMIT — Phase 4b Title Search Pipeline

on:
  workflow_dispatch:

jobs:
  summit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Prepare Claude Code script
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
        run: |
          cat > /tmp/run-claude.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          export CLAUDE_CODE_OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
          export NPM_CONFIG_PREFIX=/home/claude/.npm-global
          export PATH="/home/claude/.npm-global/bin:$PATH"

          cd /home/claude/everest-stack
          git pull origin main -q

          echo "=== Repo: $(git rev-parse --short HEAD) ==="

          pip install requests beautifulsoup4 playwright pdfplumber --break-system-packages -q 2>/dev/null || true
          playwright install chromium 2>/dev/null || true

          if [ ! -d /home/claude/brevard-bidder-scraper/.git ]; then
            git clone https://github.com/breverdbidder/brevard-bidder-scraper.git /home/claude/brevard-bidder-scraper -q
          else
            cd /home/claude/brevard-bidder-scraper && git pull -q && cd /home/claude/everest-stack
          fi

          claude -p "Read CLAUDE.md and TODO.md. Build the full 13-point title search pipeline. Follow TODO.md tasks in order. Port scrapers from /home/claude/brevard-bidder-scraper. Test with: python3 scrapers/property_scraper.py --owner AMY_HORL --case 05-2025-CC-022459-XXCC-BC --mode title-search. Every field verified or source_unavailable. Push to GitHub when done." --allowedTools "Bash,Read,Write,Edit,Grep,Glob" 2>&1 | tail -200

          echo "=== Session complete ==="
          SCRIPT
          chmod +x /tmp/run-claude.sh

      - name: SUMMIT Dispatch
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no /tmp/run-claude.sh root@${{ secrets.HETZNER_IP }}:/tmp/run-claude.sh

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=30 root@${{ secrets.HETZNER_IP }} "
            echo '${{ secrets.CLAUDE_OAUTH_B64 }}' | base64 -d > /tmp/claude-oauth-token
            chown claude:claude /tmp/claude-oauth-token /tmp/run-claude.sh
            su - claude -c 'bash /tmp/run-claude.sh'
            rm -f /tmp/claude-oauth-token
          "

      - name: Verify
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} '
            cd /home/claude/everest-stack
            echo "SHA: $(git rev-parse --short HEAD)"
            echo "Scrapers: $(ls scrapers/*.py 2>/dev/null | wc -l) files"
            echo "Tests: $(node --test test/skill-validation.test.js 2>&1 | grep "# pass" | awk "{print \$3}") passing"
            echo "TODO done: $(grep -c "\[x\]" TODO.md 2>/dev/null || echo 0)/$(grep -c "\[" TODO.md 2>/dev/null || echo 0)"
          '

      - name: Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🏔️ *SUMMIT Phase 4b: Title Search Pipeline*
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
