name: "Dev Intel Tab Integration"

on:
  workflow_dispatch:
    inputs:
      deliverable:
        description: "Which deliverable (1-6 or all)"
        required: true
        default: "all"
        type: choice
        options:
          - "1-supabase"
          - "2-mapbox"
          - "3-cma-agent"
          - "4-bcpao-photos"
          - "5-explore-route"
          - "6-split-screen"
          - "all"

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON: "${{ secrets.SUPABASE_ANON_KEY }}"
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON}" \
            "${SUPABASE_URL}/rest/v1/envelope_cache?select=parcel_id&limit=1")
          echo "Supabase HTTP: $CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
            echo "WARNING: envelope_cache may be empty. Continuing anyway."
          fi

      - name: Build dispatch prompt
        id: prompt
        run: |
          DELIVERABLE="${{ github.event.inputs.deliverable }}"
          if [ "$DELIVERABLE" = "all" ]; then
            PROMPT="Execute ALL tasks in envelope/dev-intel-dispatch/TODO.md sequentially. Deliverable 1 through 6. Verify bun run build passes after each. Commit after each deliverable. The source artifact is at envelope/dev-intel-dispatch/zonewise-dev-intel-v3.jsx. Follow envelope/dev-intel-dispatch/CLAUDE.md directives. Use auto-mode."
          else
            NUM=$(echo "$DELIVERABLE" | cut -d'-' -f1)
            PROMPT="Execute Deliverable ${NUM} from envelope/dev-intel-dispatch/TODO.md only. The source artifact is at envelope/dev-intel-dispatch/zonewise-dev-intel-v3.jsx. Follow envelope/dev-intel-dispatch/CLAUDE.md directives. Verify bun run build passes before committing."
          fi
          echo "prompt=${PROMPT}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DISPATCH_PROMPT: "${{ steps.prompt.outputs.prompt }}"
        with:
          host: 87.99.129.125
          username: claude
          key: "${{ secrets.HETZNER_SSH_KEY }}"
          command_timeout: 40m
          envs: DISPATCH_PROMPT
          script: |
            set -euo pipefail
            
            echo "=== ENVIRONMENT ==="
            export CLAUDE_CODE_OAUTH_TOKEN=$(echo "${{ secrets.CLAUDE_OAUTH_B64 }}" | base64 -d)
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH="/home/claude/.npm-global/bin:$PATH"
            
            echo "=== CLONE/PULL zonewise-web ==="
            cd /home/claude/repos
            if [ -d "zonewise-web" ]; then
              cd zonewise-web && git pull origin main
            else
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
              cd zonewise-web
            fi
            
            echo "=== CLONE/PULL dispatch source ==="
            cd /home/claude/repos
            if [ -d "cli-anything-biddeed" ]; then
              cd cli-anything-biddeed && git pull origin main
            else
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
              cd cli-anything-biddeed
            fi
            
            echo "=== COPY DISPATCH FILES ==="
            cp -r /home/claude/repos/cli-anything-biddeed/envelope/dev-intel-dispatch /home/claude/repos/zonewise-web/.dev-intel-dispatch
            
            echo "=== RUN CLAUDE CODE ==="
            cd /home/claude/repos/zonewise-web
            claude --print "${DISPATCH_PROMPT}" --auto-mode --max-tokens 128000 \
              2>&1 | tee "/home/claude/logs/dev-intel-$(date +%Y%m%d-%H%M%S).log"
            
            echo "=== DONE ==="

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            -d text="${EMOJI} *Dev Intel Integration*
          Status: ${STATUS}
          Deliverable: ${{ github.event.inputs.deliverable }}
          [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true
