name: "Dev Intel Tab Integration"

on:
  workflow_dispatch:
    inputs:
      deliverable:
        description: "Which deliverable (1-6 or all)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "1-supabase"
          - "2-mapbox"
          - "3-cma-agent"
          - "4-bcpao-photos"
          - "5-explore-route"
          - "6-split-screen"

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy runner script
        env:
          SSH_KEY: "${{ secrets.HETZNER_SSH_KEY }}"
          OAUTH_B64: "${{ secrets.CLAUDE_OAUTH_B64 }}"
          GH_PAT_VAL: "${{ secrets.GH_PAT }}"
          DELIVERABLE: "${{ github.event.inputs.deliverable }}"
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125"
          SCP="scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no"

          # Build prompt
          if [ "$DELIVERABLE" = "all" ]; then
            PROMPT="Execute ALL tasks in /home/claude/repos/zonewise-web/.dev-intel-dispatch/TODO.md sequentially. Deliverable 1 through 6. Verify bun run build passes after each. Commit after each deliverable. The source artifact is at /home/claude/repos/zonewise-web/.dev-intel-dispatch/zonewise-dev-intel-v3.jsx. Follow /home/claude/repos/zonewise-web/.dev-intel-dispatch/CLAUDE.md directives."
          else
            NUM=$(echo "$DELIVERABLE" | cut -d'-' -f1)
            PROMPT="Execute Deliverable ${NUM} from /home/claude/repos/zonewise-web/.dev-intel-dispatch/TODO.md only. Source artifact at /home/claude/repos/zonewise-web/.dev-intel-dispatch/zonewise-dev-intel-v3.jsx. Follow /home/claude/repos/zonewise-web/.dev-intel-dispatch/CLAUDE.md directives."
          fi

          # Write script LOCALLY then SCP it
          cat > /tmp/run-dev-intel.sh << LOCALEOF
          #!/usr/bin/env bash
          set -euo pipefail
          LOGFILE="/home/claude/logs/dev-intel-\$(date +%Y%m%d-%H%M%S).log"
          exec > "\$LOGFILE" 2>&1

          export CLAUDE_CODE_OAUTH_TOKEN=\$(echo "${OAUTH_B64}" | base64 -d)
          export NPM_CONFIG_PREFIX=/home/claude/.npm-global
          export PATH="/home/claude/.npm-global/bin:\$PATH"

          echo "=== \$(date) START ==="
          echo "Deliverable: ${DELIVERABLE}"

          cd /home/claude/repos
          [ -d zonewise-web ] && (cd zonewise-web && git pull origin main) || git clone https://x-access-token:${GH_PAT_VAL}@github.com/breverdbidder/zonewise-web.git
          cd /home/claude/repos
          [ -d cli-anything-biddeed ] && (cd cli-anything-biddeed && git pull origin main) || git clone https://x-access-token:${GH_PAT_VAL}@github.com/breverdbidder/cli-anything-biddeed.git

          cp -r /home/claude/repos/cli-anything-biddeed/envelope/dev-intel-dispatch /home/claude/repos/zonewise-web/.dev-intel-dispatch

          cd /home/claude/repos/zonewise-web
          claude -p '${PROMPT}' --dangerously-skip-permissions

          echo "=== \$(date) DONE ==="
          LOCALEOF
          chmod +x /tmp/run-dev-intel.sh

          # SCP to Hetzner
          $SCP /tmp/run-dev-intel.sh root@87.99.129.125:/home/claude/run-dev-intel.sh
          $SSH "chown claude:claude /home/claude/run-dev-intel.sh && chmod +x /home/claude/run-dev-intel.sh"
          echo "✅ Script deployed"

          # Fire via nohup
          $SSH "su - claude -c 'nohup /home/claude/run-dev-intel.sh &' && sleep 2 && pgrep -u claude -f run-dev-intel && echo '✅ Running' || echo '❌ Not started'"

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "🚀" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            -d text="${EMOJI} *Dev Intel — Claude Code Dispatched*
          Status: ${STATUS} (nohup fire-and-forget)
          Deliverable: ${{ github.event.inputs.deliverable }}
          Monitor: ssh root@87.99.129.125 'tail -f /home/claude/logs/dev-intel-*.log'
          [GHA](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true
