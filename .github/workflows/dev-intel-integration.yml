name: "Dev Intel Tab Integration"

on:
  workflow_dispatch:
    inputs:
      deliverable:
        description: "Which deliverable (1-6 or all)"
        required: true
        default: "all"
        type: choice
        options:
          - "1-supabase"
          - "2-mapbox"
          - "3-cma-agent"
          - "4-bcpao-photos"
          - "5-explore-route"
          - "6-split-screen"
          - "all"

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dispatch prompt
        id: prompt
        run: |
          DELIVERABLE="${{ github.event.inputs.deliverable }}"
          if [ "$DELIVERABLE" = "all" ]; then
            echo "prompt=Execute ALL tasks in envelope/dev-intel-dispatch/TODO.md sequentially. Deliverable 1 through 6. Verify bun run build passes after each. Commit after each deliverable. The source artifact is at envelope/dev-intel-dispatch/zonewise-dev-intel-v3.jsx. Follow envelope/dev-intel-dispatch/CLAUDE.md directives. Use auto-mode." >> "$GITHUB_OUTPUT"
          else
            NUM=$(echo "$DELIVERABLE" | cut -d'-' -f1)
            echo "prompt=Execute Deliverable ${NUM} from envelope/dev-intel-dispatch/TODO.md only. The source artifact is at envelope/dev-intel-dispatch/zonewise-dev-intel-v3.jsx. Follow envelope/dev-intel-dispatch/CLAUDE.md directives. Verify bun run build passes before committing." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH and deploy
        env:
          SSH_KEY: "${{ secrets.HETZNER_SSH_KEY }}"
          OAUTH_B64: "${{ secrets.CLAUDE_OAUTH_B64 }}"
          GH_PAT_VAL: "${{ secrets.GH_PAT }}"
          DISPATCH_PROMPT: "${{ steps.prompt.outputs.prompt }}"
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 << REMOTE_EOF
            set -euo pipefail

            echo "=== SETUP CLAUDE USER ENV ==="
            su - claude -c '
              export CLAUDE_CODE_OAUTH_TOKEN=\$(echo "${OAUTH_B64}" | base64 -d)
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH="/home/claude/.npm-global/bin:\$PATH"

              echo "=== CLONE/PULL repos ==="
              mkdir -p /home/claude/repos /home/claude/logs
              cd /home/claude/repos

              if [ -d "zonewise-web" ]; then
                cd zonewise-web && git pull origin main && cd ..
              else
                git clone "https://x-access-token:${GH_PAT_VAL}@github.com/breverdbidder/zonewise-web.git"
              fi

              if [ -d "cli-anything-biddeed" ]; then
                cd cli-anything-biddeed && git pull origin main && cd ..
              else
                git clone "https://x-access-token:${GH_PAT_VAL}@github.com/breverdbidder/cli-anything-biddeed.git"
              fi

              echo "=== COPY DISPATCH FILES ==="
              cp -r /home/claude/repos/cli-anything-biddeed/envelope/dev-intel-dispatch /home/claude/repos/zonewise-web/.dev-intel-dispatch

              echo "=== RUN CLAUDE CODE ==="
              cd /home/claude/repos/zonewise-web
              claude --print "${DISPATCH_PROMPT}" \
                --dangerously-skip-permissions \
                --max-tokens 128000 \
                2>&1 | tee "/home/claude/logs/dev-intel-\$(date +%Y%m%d-%H%M%S).log"

              echo "=== SESSION COMPLETE ==="
            '
          REMOTE_EOF

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            -d text="${EMOJI} *Dev Intel Integration*
          Status: ${STATUS}
          Deliverable: ${{ github.event.inputs.deliverable }}
          [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true
