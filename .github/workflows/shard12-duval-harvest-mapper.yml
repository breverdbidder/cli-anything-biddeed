name: SHARD-12 Duval Harvest→Outcomes Mapper
# Maps Duval staging tables to foreclosure_outcomes to fix B+F chain break
# CHAIN BREAK: 37 court-format Duval cases harvested clean but ZERO foreclosure_outcomes rows exist
# This mapper is the "last missing link in an otherwise fully closed loop"

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Records to process per run'
        required: false
        default: '1000'
  schedule:
    # Run every 4 hours to process new staging records
    - cron: '15 */4 * * *'

concurrency:
  group: shard12-duval-harvest-mapper
  cancel-in-progress: false

jobs:
  map_harvest_to_outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run Duval harvest mapper
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python scripts/shard12_duval_harvest_outcomes_mapper.py

      - name: Verify mapping results
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(
              host='aws-0-us-west-2.pooler.supabase.com', port=5432,
              database='postgres', user='postgres.mocerqjnksmhcjzxrewo',
              password=os.environ['SUPABASE_DB_PASSWORD']
          )
          with conn.cursor() as cur:
              # Count Duval foreclosure outcomes by data source
              cur.execute('''
                  SELECT data_source, COUNT(*) 
                  FROM public.foreclosure_outcomes 
                  WHERE county = 'duval' AND sale_type = 'foreclosure'
                  GROUP BY data_source 
                  ORDER BY data_source
              ''')
              print('Duval foreclosure outcomes by source:')
              for source, count in cur.fetchall():
                  print(f'  {source}: {count}')
              
              # Check recent mappings
              cur.execute('''
                  SELECT COUNT(*) 
                  FROM public.foreclosure_outcomes 
                  WHERE county = 'duval' 
                  AND data_source LIKE 'acclaim_ct:DUVAL-%'
                  AND enriched_at >= NOW() - INTERVAL '1 hour'
              ''')
              recent = cur.fetchone()[0]
              print(f'Recent mappings (last hour): {recent}')
          conn.close()
          "