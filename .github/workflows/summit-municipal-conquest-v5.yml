name: "Summit: Municipal Conquest V5 — Melbourne + Titusville"
on:
  workflow_dispatch: {}

jobs:
  conquer:
    name: "Conquer Melbourne + Titusville"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install httpx pyproj

      - name: "Execute Municipal Conquest V5"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/summit_conquest_v5.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-v5-results
          path: conquest_v5_results.json
          retention-days: 90
