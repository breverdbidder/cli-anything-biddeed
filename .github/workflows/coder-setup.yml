name: "SUMMIT: Coder Setup v3 (Token + Template)"
on:
  workflow_dispatch:

jobs:
  coder-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Coder via SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP << 'SSHEOF'
          set -e
          CODER_URL="http://127.0.0.1:7080"

          echo "=== CODER SETUP v3 ==="

          # 1. Get session token via login API
          echo ">>> Login"
          SESSION=$(curl -s -X POST "$CODER_URL/api/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"ariel@everestcapitalusa.com","password":"EverestCoder2026!"}')
          TOKEN=$(echo "$SESSION" | python3 -c "import sys,json;print(json.load(sys.stdin)['session_token'])")
          echo "Session: ${TOKEN:0:15}..."

          # 2. Create long-lived API token
          echo ">>> Create API token"
          API_RESP=$(curl -s -X POST "$CODER_URL/api/v2/users/me/keys/tokens" \
            -H "Coder-Session-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"token_name":"summit-v3","lifetime":31536000000000000}')
          echo "Token response: $API_RESP"
          API_KEY=$(echo "$API_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('key','NONE'))" 2>/dev/null || echo "PARSE_FAIL")
          echo "API Key: ${API_KEY:0:15}..."

          # If key creation failed, try alternate endpoint format
          if [ "$API_KEY" = "NONE" ] || [ "$API_KEY" = "PARSE_FAIL" ]; then
            echo "Trying alternate token creation..."
            API_RESP2=$(curl -s -X POST "$CODER_URL/api/v2/users/me/keys" \
              -H "Coder-Session-Token: $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Alt response: $API_RESP2"
            API_KEY=$(echo "$API_RESP2" | python3 -c "import sys,json;print(json.load(sys.stdin).get('key','NONE'))" 2>/dev/null || echo "FAIL")
            echo "Alt API Key: ${API_KEY:0:15}..."
          fi

          # Save whatever token works
          BEST_TOKEN="$TOKEN"
          if [ "$API_KEY" != "NONE" ] && [ "$API_KEY" != "FAIL" ] && [ "$API_KEY" != "PARSE_FAIL" ]; then
            BEST_TOKEN="$API_KEY"
          fi
          echo "$BEST_TOKEN" > /home/claude/coder/.api-token
          chmod 600 /home/claude/coder/.api-token

          # 3. Verify auth
          echo ">>> Verify"
          curl -s "$CODER_URL/api/v2/users/me" \
            -H "Coder-Session-Token: $TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(f'User: {d[\"username\"]}, Status: {d[\"status\"]}')"

          # 4. List existing templates
          echo ">>> Templates"
          TEMPLATES=$(curl -s "$CODER_URL/api/v2/organizations/default/templates" \
            -H "Coder-Session-Token: $TOKEN")
          echo "Templates: $TEMPLATES"

          # 5. Check available example templates
          echo ">>> Available starter templates"
          EXAMPLES=$(curl -s "$CODER_URL/api/v2/organizations/default/templates/examples" \
            -H "Coder-Session-Token: $TOKEN" 2>/dev/null | python3 -c "
          import sys,json
          data = json.load(sys.stdin)
          if isinstance(data, list):
            for t in data:
              if 'docker' in t.get('id','').lower() or 'task' in t.get('id','').lower():
                print(f\"  {t['id']}: {t.get('name','?')}\")
            print(f'Total examples: {len(data)}')
          else:
            print(data)
          " 2>/dev/null || echo "No examples endpoint")

          # 6. Save CODER_URL + token for GitHub secrets step
          echo "CODER_TOKEN=$BEST_TOKEN" > /home/claude/coder/.gh-secrets
          echo "CODER_URL=http://$(hostname -I | awk '{print $1}'):7080" >> /home/claude/coder/.gh-secrets

          echo "✅ Setup v3 complete"
          echo "=== Done ==="
          SSHEOF

      - name: Retrieve and set GitHub secrets
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner

          # Get the token from Hetzner
          CODER_TOKEN=$(ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP "cat /home/claude/coder/.api-token 2>/dev/null || echo MISSING")
          echo "Token retrieved: ${CODER_TOKEN:0:15}..."

          if [ "$CODER_TOKEN" != "MISSING" ]; then
            echo "$CODER_TOKEN" | gh secret set CODER_TOKEN --repo ${{ github.repository }}
            echo "http://$HETZNER_IP:7080" | gh secret set CODER_URL --repo ${{ github.repository }}
            echo "✅ GitHub secrets CODER_TOKEN + CODER_URL set"
          else
            echo "⚠️ No token found on Hetzner"
          fi
