name: "SUMMIT: Coder Full Setup"
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Step to run'
        required: true
        default: 'all'
        type: choice
        options:
          - admin-setup
          - template-setup
          - all

jobs:
  coder-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Coder Setup via SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP '
            set -e
            STEP="${{ github.event.inputs.step }}"
            CODER_PORT=7080
            CODER_URL="http://127.0.0.1:${CODER_PORT}"

            echo "=== SUMMIT: Coder Full Setup ==="

            # --- STEP 1: Create admin user ---
            if [ "$STEP" = "admin-setup" ] || [ "$STEP" = "all" ]; then
              echo ">>> Step 1: Admin user"

              # Install coder CLI
              if ! command -v coder &>/dev/null; then
                curl -L https://coder.com/install.sh | sh 2>&1 | tail -3
              fi
              echo "Coder CLI: $(coder version 2>/dev/null || echo not-found)"

              # Create first admin user via server subcommand
              # This bypasses the browser requirement
              CODER_CONTAINER=$(docker ps --filter "ancestor=ghcr.io/coder/coder:latest" --format "{{.Names}}" | head -1)
              echo "Coder container: $CODER_CONTAINER"

              if [ -n "$CODER_CONTAINER" ]; then
                docker exec "$CODER_CONTAINER" coder server create-admin-user \
                  --email "ariel@everestcapitalusa.com" \
                  --username "ariel" \
                  --password "EverestCoder2026!" 2>&1 || echo "Admin create returned non-zero (may already exist)"
              fi

              # Now login via CLI
              export CODER_URL
              coder login "$CODER_URL" \
                --first-user-email "ariel@everestcapitalusa.com" \
                --first-user-username "ariel" \
                --first-user-password "EverestCoder2026!" \
                --first-user-trial=false 2>&1 || \
              coder login "$CODER_URL" \
                --token="" 2>&1 || echo "Trying password login..."

              # Try password-based login
              CODER_SESSION=$(curl -s -X POST "$CODER_URL/api/v2/users/login" \
                -H "Content-Type: application/json" \
                -d "{\"email\":\"ariel@everestcapitalusa.com\",\"password\":\"EverestCoder2026!\"}" 2>/dev/null)
              echo "Login response: ${CODER_SESSION:0:80}..."

              SESSION_TOKEN=$(echo "$CODER_SESSION" | python3 -c "import sys,json;print(json.load(sys.stdin).get(\"session_token\",\"NONE\"))" 2>/dev/null || echo "PARSE_FAIL")
              echo "Session token: ${SESSION_TOKEN:0:20}..."

              if [ "$SESSION_TOKEN" != "NONE" ] && [ "$SESSION_TOKEN" != "PARSE_FAIL" ]; then
                # Configure CLI with token
                mkdir -p ~/.config/coderv2
                echo "$CODER_URL" > ~/.config/coderv2/url
                echo "$SESSION_TOKEN" > ~/.config/coderv2/session

                # Create long-lived API token
                API_TOKEN=$(curl -s -X POST "$CODER_URL/api/v2/users/me/keys/tokens" \
                  -H "Content-Type: application/json" \
                  -H "Coder-Session-Token: $SESSION_TOKEN" \
                  -d "{\"token_name\":\"summit-api\",\"lifetime\":31536000000000000}" 2>/dev/null)
                CODER_API_KEY=$(echo "$API_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get(\"key\",\"NONE\"))" 2>/dev/null || echo "PARSE_FAIL")
                echo "API key: ${CODER_API_KEY:0:15}..."

                # Save token for future use
                echo "$CODER_API_KEY" > /home/claude/coder/.api-token
                chmod 600 /home/claude/coder/.api-token

                # Verify
                curl -s "$CODER_URL/api/v2/users/me" \
                  -H "Coder-Session-Token: $SESSION_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(f\"Logged in as: {d.get(\"username\",\"?\")}, email: {d.get(\"email\",\"?\")}\")" 2>/dev/null
                echo "✅ Admin setup complete"
              else
                echo "⚠️ Could not get session token — trying first-user API"
                # Try the first user setup API
                FIRST_USER=$(curl -s -X POST "$CODER_URL/api/v2/users/first" \
                  -H "Content-Type: application/json" \
                  -d "{\"email\":\"ariel@everestcapitalusa.com\",\"username\":\"ariel\",\"password\":\"EverestCoder2026!\",\"trial\":false}" 2>/dev/null)
                echo "First user response: ${FIRST_USER:0:120}..."

                SESSION_TOKEN=$(echo "$FIRST_USER" | python3 -c "import sys,json;print(json.load(sys.stdin).get(\"session_token\",\"NONE\"))" 2>/dev/null || echo "FAIL")
                echo "Session from first-user: ${SESSION_TOKEN:0:20}..."

                if [ "$SESSION_TOKEN" != "NONE" ] && [ "$SESSION_TOKEN" != "FAIL" ]; then
                  mkdir -p ~/.config/coderv2
                  echo "$CODER_URL" > ~/.config/coderv2/url
                  echo "$SESSION_TOKEN" > ~/.config/coderv2/session

                  API_TOKEN=$(curl -s -X POST "$CODER_URL/api/v2/users/me/keys/tokens" \
                    -H "Content-Type: application/json" \
                    -H "Coder-Session-Token: $SESSION_TOKEN" \
                    -d "{\"token_name\":\"summit-api\",\"lifetime\":31536000000000000}" 2>/dev/null)
                  CODER_API_KEY=$(echo "$API_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get(\"key\",\"NONE\"))" 2>/dev/null || echo "FAIL")
                  echo "$CODER_API_KEY" > /home/claude/coder/.api-token
                  chmod 600 /home/claude/coder/.api-token
                  echo "API key saved: ${CODER_API_KEY:0:15}..."
                  echo "✅ First user created + authenticated"
                else
                  echo "❌ All auth methods failed"
                fi
              fi
            fi

            # --- STEP 2: Template ---
            if [ "$STEP" = "template-setup" ] || [ "$STEP" = "all" ]; then
              echo ">>> Step 2: Template setup"
              export CODER_URL

              # Load saved token
              if [ -f /home/claude/coder/.api-token ]; then
                export CODER_SESSION_TOKEN=$(cat /home/claude/coder/.api-token)
                echo "Using saved API token"
              fi

              # List existing templates
              echo "Current templates:"
              coder templates list 2>/dev/null || echo "(none)"
            fi

            echo "=== Done ==="
          '

      - name: Set CODER_URL repo secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "http://${{ secrets.HETZNER_IP }}:7080" | gh secret set CODER_URL --repo ${{ github.repository }} 2>/dev/null || echo "Secret set skipped"
