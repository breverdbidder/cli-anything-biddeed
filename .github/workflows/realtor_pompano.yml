name: Realtor Pompano

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          mkdir -p /tmp/p
          
          cat > /tmp/p/scrape.py <<'PY'
          import json, os, re, urllib.request, hashlib
          from pathlib import Path
          
          OUT = Path('/tmp/p')
          API_KEY = os.environ['FIRECRAWL_API_KEY'].strip()
          URL = "https://www.realtor.com/realestateandhomes-detail/1036-Pompano-Dr_Rockledge_FL_32955_M58265-64909"
          
          payload = json.dumps({
              "url": URL,
              "formats": ["html", "markdown"],
              "waitFor": 10000,
              "timeout": 90000,
              "onlyMainContent": False,
              "blockAds": False,
              "proxy": "stealth",
              "actions": [
                  {"type": "wait", "milliseconds": 6000},
                  {"type": "scroll", "direction": "down"},
                  {"type": "wait", "milliseconds": 4000},
                  {"type": "scroll", "direction": "down"},
                  {"type": "wait", "milliseconds": 3000},
              ],
          }).encode()
          req = urllib.request.Request(
              "https://api.firecrawl.dev/v1/scrape",
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': f'Bearer {API_KEY}',
              },
              method='POST',
          )
          
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read()[:500]}", flush=True)
              raise
          
          if not result.get('success'):
              print(f"Failed: {json.dumps(result)[:500]}", flush=True)
              raise SystemExit(1)
          
          data = result.get('data', {})
          html = data.get('html', '')
          md = data.get('markdown', '')
          meta = data.get('metadata', {})
          
          (OUT / 'page.html').write_text(html, errors='replace')
          (OUT / 'page.md').write_text(md, errors='replace')
          (OUT / 'meta.json').write_text(json.dumps(meta, indent=2))
          
          print(f"HTML: {len(html)}b | MD: {len(md)}b", flush=True)
          print(f"Title: {meta.get('title','')[:80]}", flush=True)
          
          # Extract photo URLs - rdcpix CDN
          urls = set()
          for u in re.findall(r'https://[a-z]{1,4}\.rdcpix\.com/[a-zA-Z0-9./-]+\.jpg', html + md):
              urls.add(u)
          for u in re.findall(r'https://[a-z]{1,4}\.rdcpix\.com/[a-zA-Z0-9./-]+\.jpeg', html + md):
              urls.add(u)
          
          print(f"\nFound {len(urls)} unique rdcpix URLs", flush=True)
          
          # Group by base path/photo number, prefer largest
          groups = {}
          for u in urls:
              # Extract photo number/path
              m = re.match(r'(.+?)/([^/]+?)\.(jpg|jpeg)', u)
              if m:
                  base = m.group(2)
                  # Strip size suffix
                  base_clean = re.sub(r'-w\d+_h\d+(_x\d+)?$', '', base)
                  if base_clean not in groups or len(u) < len(groups[base_clean]):
                      groups[base_clean] = u
          
          # Sort and take first 30
          sorted_urls = sorted(groups.values())
          print(f"After dedup: {len(sorted_urls)} photos", flush=True)
          for u in sorted_urls[:5]: print(f"  {u}")
          
          # Download
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          downloaded = []
          for i, u in enumerate(sorted_urls[:30], 1):
              try:
                  # Force largest size by replacing -w*_h* with -w2048_h1536
                  u_large = re.sub(r'-w\d+_h\d+(_x\d+)?', '-w2048_h1536_x2', u)
                  req = urllib.request.Request(u_large, headers={'User-Agent': UA, 'Referer': URL})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data_b = r.read()
                  if len(data_b) > 8000:
                      h = hashlib.md5(u.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_Pompano_realtor_{h}.jpg"
                      (OUT / fname).write_bytes(data_b)
                      downloaded.append(fname)
                      print(f"  [{i:02d}] {len(data_b)}b -> {fname}", flush=True)
              except Exception as e:
                  print(f"  [{i:02d}] FAIL: {str(e)[:80]}", flush=True)
                  # Try original size
                  try:
                      req = urllib.request.Request(u, headers={'User-Agent': UA, 'Referer': URL})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data_b = r.read()
                      if len(data_b) > 8000:
                          h = hashlib.md5(u.encode()).hexdigest()[:8]
                          fname = f"{i:02d}_Pompano_realtor_{h}.jpg"
                          (OUT / fname).write_bytes(data_b)
                          downloaded.append(fname)
                          print(f"  [{i:02d}] {len(data_b)}b (orig) -> {fname}", flush=True)
                  except Exception as e2:
                      print(f"  [{i:02d}] FAIL2: {str(e2)[:60]}", flush=True)
          
          print(f"\nDOWNLOADED: {len(downloaded)} photos", flush=True)
          PY
          
          python3 /tmp/p/scrape.py 2>&1 | tee /tmp/p/run.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtor_pompano
          path: /tmp/p/
