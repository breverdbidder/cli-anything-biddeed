name: Refresh 67-county auction calendar

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Days ahead to refresh'
        required: false
        default: '60'
      county:
        description: 'Optional county slug; blank means all 67 counties'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: refresh-67-county-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DAYS_AHEAD: ${{ inputs.days_ahead || '60' }}
      COUNTY_SLUG: ${{ inputs.county || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate required secrets without printing values
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is missing' >&2; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is missing' >&2; exit 1; }

      - name: Run county calendar refresh
        shell: bash
        run: |
          set -o pipefail
          args=(--days-ahead "$DAYS_AHEAD" --continue-on-error)
          if [ -n "$COUNTY_SLUG" ]; then args+=(--county "$COUNTY_SLUG"); fi
          python scripts/refresh_67_county_calendar.py "${args[@]}" | tee refresh-67-county-calendar.json

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-67-county-calendar-${{ github.run_id }}
          path: refresh-67-county-calendar.json
          if-no-files-found: warn
