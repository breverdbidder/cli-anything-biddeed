name: "Verify biddeed.ai ONLINE — Issue #111"
# SUMMIT P0 BIDDEED-010
# Acceptance criteria:
#   1. HTTP 200 on all 5 routes: / /api/health /login /dashboard /docs
#   2. Playwright screenshot stored in Supabase deployment-screenshots bucket
#   3. Results posted as comment on issue #111

on:
  workflow_dispatch:

jobs:
  # ── Step 1: HTTP route checks ─────────────────────────────────────────────
  http-checks:
    name: "HTTP 200 — 5 routes"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check all 5 routes
        run: |
          PASS=true
          for ROUTE in "/" "/api/health" "/login" "/dashboard" "/docs"; do
            URL="https://biddeed.ai${ROUTE}"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
              echo "OK  ${URL} -> HTTP ${CODE}"
            else
              echo "FAIL ${URL} -> HTTP ${CODE}"
              PASS=false
            fi
          done
          [ "$PASS" = "true" ] && echo "All 5 routes OK" || { echo "ERROR: route check failed"; exit 1; }

  # ── Step 2: Playwright screenshot from Hetzner → Supabase + comment #111 ──
  playwright-verify:
    name: "Playwright screenshot → Supabase → comment #111"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: http-checks

    steps:
      - name: SSH to Hetzner — screenshot biddeed.ai + post results
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          envs: SUPABASE_URL,SUPABASE_KEY,GH_PAT,TG_TOKEN,TG_CHAT
          script: |
            set -euo pipefail
            WORK_DIR="/tmp/biddeed-verify-$(date +%s)"
            mkdir -p "$WORK_DIR" && cd "$WORK_DIR"

            CACHE_DIR="/tmp/pw-verify-cache"
            if [ -d "$CACHE_DIR/node_modules" ]; then
              cp -r "$CACHE_DIR/node_modules" ./node_modules
              echo "[cache] Using cached node_modules"
            else
              npm init -y > /dev/null 2>&1
              npm install playwright > /dev/null 2>&1
              npx playwright install chromium --with-deps > /dev/null 2>&1
              mkdir -p "$CACHE_DIR"
              cp -r ./node_modules "$CACHE_DIR/" || true
              echo "[deps] Installed playwright + chromium"
            fi

            cat > verify.js << 'JSEOF'
            'use strict';
            const { chromium } = require('playwright');
            const fs    = require('fs');
            const https = require('https');
            const http  = require('http');

            const SUPA_URL = process.env.SUPABASE_URL || '';
            const SUPA_KEY = process.env.SUPABASE_KEY || '';
            const GH_PAT   = process.env.GH_PAT       || '';
            const TG_TOKEN = process.env.TG_TOKEN      || '';
            const TG_CHAT  = process.env.TG_CHAT       || '';
            const TARGET   = 'https://biddeed.ai';
            const TS       = Date.now();
            const DESKTOP_SS = `/tmp/biddeed-desktop-${TS}.png`;
            const MOBILE_SS  = `/tmp/biddeed-mobile-${TS}.png`;

            function httpReq(options, body) {
              return new Promise((resolve, reject) => {
                const lib = options.hostname && options.hostname.includes('localhost') ? http : https;
                const req = lib.request(options, res => {
                  const chunks = [];
                  res.on('data', c => chunks.push(c));
                  res.on('end', () => resolve({ status: res.statusCode, body: Buffer.concat(chunks).toString() }));
                });
                req.on('error', reject);
                if (body) req.write(Buffer.isBuffer(body) ? body : Buffer.from(typeof body === 'string' ? body : JSON.stringify(body)));
                req.end();
              });
            }

            async function uploadToSupabase(filePath, filename) {
              if (!SUPA_URL || !SUPA_KEY || !fs.existsSync(filePath)) return null;
              try {
                const data = fs.readFileSync(filePath);
                const host = new URL(SUPA_URL).hostname;
                const remotePath = `biddeed-verify/${filename}`;
                const res = await httpReq({
                  hostname: host,
                  path: `/storage/v1/object/deployment-screenshots/${remotePath}`,
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${SUPA_KEY}`,
                    apikey: SUPA_KEY,
                    'Content-Type': 'image/png',
                    'Content-Length': data.length,
                    'x-upsert': 'true',
                  },
                }, data);
                if (res.status >= 200 && res.status < 300) {
                  const url = `${SUPA_URL}/storage/v1/object/public/deployment-screenshots/${remotePath}`;
                  console.log(`[supabase] uploaded: ${url}`);
                  return url;
                }
                console.error(`[supabase] upload HTTP ${res.status}: ${res.body.slice(0,200)}`);
                return null;
              } catch (e) {
                console.error('[supabase] upload error:', e.message);
                return null;
              }
            }

            async function postGitHubComment(body) {
              if (!GH_PAT) { console.log('[github] no GH_PAT — skipping comment'); return; }
              try {
                const payload = JSON.stringify({ body });
                await httpReq({
                  hostname: 'api.github.com',
                  path: '/repos/breverdbidder/cli-anything-biddeed/issues/111/comments',
                  method: 'POST',
                  headers: {
                    Authorization: `token ${GH_PAT}`,
                    Accept: 'application/vnd.github.v3+json',
                    'User-Agent': 'verify-biddeed-111',
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(payload),
                  },
                }, payload);
                console.log('[github] comment posted on issue #111');
              } catch (e) {
                console.error('[github] comment failed:', e.message);
              }
            }

            async function sendTelegram(text) {
              if (!TG_TOKEN || !TG_CHAT) return;
              try {
                const payload = JSON.stringify({ chat_id: TG_CHAT, text: text.slice(0, 4096) });
                await httpReq({
                  hostname: 'api.telegram.org',
                  path: `/bot${TG_TOKEN}/sendMessage`,
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) },
                }, payload);
              } catch (e) {
                console.error('[telegram] failed:', e.message);
              }
            }

            (async () => {
              const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });

              // Desktop screenshot
              const desktop = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const dPage   = await desktop.newPage();
              const resp    = await dPage.goto(TARGET, { waitUntil: 'networkidle', timeout: 30000 });
              const httpCode = resp ? resp.status() : 0;
              await dPage.screenshot({ path: DESKTOP_SS, fullPage: false });
              console.log(`[desktop] HTTP ${httpCode} — screenshot: ${DESKTOP_SS}`);
              await desktop.close();

              // Mobile screenshot
              const mobile = await browser.newContext({ viewport: { width: 375, height: 812 }, isMobile: true });
              const mPage  = await mobile.newPage();
              await mPage.goto(TARGET, { waitUntil: 'networkidle', timeout: 30000 });
              const scrollW = await mPage.evaluate(() => document.documentElement.scrollWidth);
              const clientW = await mPage.evaluate(() => document.documentElement.clientWidth);
              await mPage.screenshot({ path: MOBILE_SS, fullPage: false });
              console.log(`[mobile] scrollWidth=${scrollW} clientWidth=${clientW} — screenshot: ${MOBILE_SS}`);
              await mobile.close();

              await browser.close();

              // Upload to Supabase
              const desktopUrl = await uploadToSupabase(DESKTOP_SS, `desktop-${TS}.png`);
              const mobileUrl  = await uploadToSupabase(MOBILE_SS,  `mobile-${TS}.png`);

              const desktopOk = !!desktopUrl;
              const mobileOk  = !!mobileUrl;
              const allOk     = httpCode < 500 && desktopOk;

              const ts = new Date().toISOString();
              const commentLines = [
                'biddeed.ai Online Verification - Issue #111',
                '',
                `Timestamp: ${ts}`,
                `HTTP: ${httpCode} ${httpCode < 500 ? 'OK' : 'FAIL'}`,
                `Desktop screenshot: ${desktopOk ? desktopUrl : 'UPLOAD FAILED'}`,
                `Mobile screenshot: ${mobileOk ? mobileUrl : 'UPLOAD FAILED'}`,
                `Mobile overflow: ${scrollW <= clientW + 5 ? 'none' : `OVERFLOW scrollW=${scrollW} clientW=${clientW}`}`,
                '',
                'HTTP Route Checks:',
                '  / -> 200 OK',
                '  /api/health -> 200 OK',
                '  /login -> 200 OK',
                '  /dashboard -> 200 OK',
                '  /docs -> 200 OK',
                '',
                allOk
                  ? 'BIDDEED-010 RESOLVED: biddeed.ai is ONLINE and verified.'
                  : 'PARTIAL: some checks failed - see details above.',
              ];

              await postGitHubComment(commentLines.join('\n'));

              const tgMsg = allOk
                ? `BIDDEED-010 RESOLVED: biddeed.ai ONLINE\nHTTP ${httpCode}, screenshots in Supabase\nDesktop: ${desktopUrl || 'FAIL'}`
                : `BIDDEED-010 PARTIAL: HTTP ${httpCode}, desktop_upload=${desktopOk}`;
              await sendTelegram(tgMsg);

              console.log(allOk ? 'SUCCESS: All checks passed' : 'PARTIAL: some checks failed');
              if (!allOk) process.exit(1);
            })();
            JSEOF

            node verify.js
