name: Skills Evaluator — Agent 17

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 6AM UTC (1AM EST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create Supabase table
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c "
          import os, sys, json, urllib.request

          query = '''
            CREATE TABLE IF NOT EXISTS skills_catalog (
              id TEXT PRIMARY KEY,
              repo TEXT NOT NULL,
              skill_name TEXT NOT NULL,
              score INTEGER DEFAULT 0,
              category TEXT DEFAULT 'unknown',
              status TEXT DEFAULT 'SKIP',
              reason TEXT,
              content_hash TEXT,
              evaluated_at TIMESTAMPTZ DEFAULT NOW(),
              installed_repos TEXT[] DEFAULT '{}',
              created_at TIMESTAMPTZ DEFAULT NOW()
            );
            CREATE INDEX IF NOT EXISTS idx_skills_score ON skills_catalog(score DESC);
            CREATE INDEX IF NOT EXISTS idx_skills_status ON skills_catalog(status);
            CREATE INDEX IF NOT EXISTS idx_skills_category ON skills_catalog(category);
          '''
          req = urllib.request.Request(
              'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
              data=json.dumps({'query': query}).encode(),
              headers={
                  'Authorization': f\"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}\",
                  'Content-Type': 'application/json',
                  'User-Agent': 'cli-anything-biddeed-skills-evaluator/1.0',
              },
              method='POST',
          )
          try:
              resp = urllib.request.urlopen(req, timeout=60)
              print(f'✅ skills_catalog table ready ({resp.status})')
          except urllib.error.HTTPError as e:
              print(f'❌ Management API error {e.code}: {e.read().decode()}')
              sys.exit(1)
          "

      - name: Run evaluator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/evaluate_skills_v2.py

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESULT=$(cat /tmp/skills-eval/result_summary.txt 2>/dev/null || echo "no result file — evaluator did not complete")
          MSG="Agent 17 Skills Evaluator%0AStatus: ${{ job.status }}%0A${RESULT}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="${MSG}" || true
