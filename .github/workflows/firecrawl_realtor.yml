name: Firecrawl Realtor Scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run Firecrawl scrape
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          mkdir -p /tmp/fc
          
          cat > /tmp/fc/scrape.py <<'PY'
          import json, os, re, time, hashlib
          from pathlib import Path
          import urllib.request, urllib.parse
          
          OUT = Path('/tmp/fc')
          API_KEY = os.environ['FIRECRAWL_API_KEY'].strip()
          
          PROPERTIES = [
              {"id": "rainsville", "url": "https://www.realtor.com/realestateandhomes-detail/1548-Rainsville-Rd-SE_Palm-Bay_FL_32909_M59272-17621"},
              {"id": "district",   "url": "https://www.realtor.com/realestateandhomes-detail/211-District-St-SE_Palm-Bay_FL_32909"},
              {"id": "fillmore",   "url": "https://www.realtor.com/realestateandhomes-detail/478-Fillmore-Ave-NE_Palm-Bay_FL_32907"},
              {"id": "copenhaver", "url": "https://www.realtor.com/realestateandhomes-detail/342-Copenhaver-Ave-NE_Palm-Bay_FL_32907"},
              {"id": "eldron",     "url": "https://www.realtor.com/realestateandhomes-detail/3120-Eldron-Blvd-SE_Palm-Bay_FL_32909"},
              {"id": "kirkland",   "url": "https://www.realtor.com/realestateandhomes-detail/1107-Kirkland-Dr_Cocoa_FL_32922"},
              {"id": "pompano",    "url": "https://www.realtor.com/realestateandhomes-detail/1036-Pompano-Dr_Rockledge_FL_32955"},
              {"id": "lakewood",   "url": "https://www.realtor.com/realestateandhomes-detail/1581-Lakewood-Dr-NE_Palm-Bay_FL_32905"},
              {"id": "robinhood",  "url": "https://www.realtor.com/realestateandhomes-detail/4087-Robinhood-Dr_Melbourne_FL_32935"},
              {"id": "miracle",    "url": "https://www.realtor.com/realestateandhomes-detail/977-Miracle-Way_Rockledge_FL_32955"},
              {"id": "bonny",      "url": "https://www.realtor.com/realestateandhomes-detail/2456-Bonny-Dr_Cocoa_FL_32926"},
              {"id": "canterbury", "url": "https://www.realtor.com/realestateandhomes-detail/2191-Canterbury-Ln_Melbourne_FL_32935"},
          ]
          
          def fc_scrape(url):
              """Hit Firecrawl /v1/scrape endpoint."""
              payload = json.dumps({
                  "url": url,
                  "formats": ["html", "markdown"],
                  "waitFor": 5000,
                  "timeout": 45000,
                  "onlyMainContent": False,
                  "blockAds": False,
              }).encode()
              req = urllib.request.Request(
                  "https://api.firecrawl.dev/v1/scrape",
                  data=payload,
                  headers={
                      'Content-Type': 'application/json',
                      'Authorization': f'Bearer {API_KEY}',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"    HTTP {e.code}: {e.read()[:300]}", flush=True)
                  return None
              except Exception as e:
                  print(f"    err: {e}", flush=True)
                  return None
          
          def extract_image_urls(html):
              urls = set()
              if not html: return urls
              for pat in [
                  r'https://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\<>]+?\.jpg',
                  r'https://photos\.zillowstatic\.com/[^"\s\'\\<>]+?\.jpg',
                  r'https://ssl\.cdn-redfin\.com/photo/[^"\s\'\\<>]+?\.jpg',
              ]:
                  for u in re.findall(pat, html):
                      urls.add(u)
              return urls
          
          def http_download(url, referer):
              UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': referer,
                  'Accept': 'image/avif,image/webp,*/*',
              })
              return urllib.request.urlopen(req, timeout=25)
          
          all_results = {}
          for prop in PROPERTIES:
              print(f"\n=== {prop['id']}: {prop['url'][:80]} ===", flush=True)
              prop_dir = OUT / prop['id']
              prop_dir.mkdir(exist_ok=True)
              
              result = fc_scrape(prop['url'])
              if not result or not result.get('success'):
                  print(f"    Firecrawl failed", flush=True)
                  if result:
                      print(f"    {json.dumps(result)[:300]}", flush=True)
                  continue
              
              data = result.get('data', {})
              html = data.get('html', '')
              md = data.get('markdown', '')
              meta = data.get('metadata', {})
              
              print(f"    HTML: {len(html)}b | MD: {len(md)}b | title: {meta.get('title','')[:80]}", flush=True)
              # Save raw outputs for debugging
              if html: (prop_dir / 'page.html').write_text(html, errors='replace')
              if md: (prop_dir / 'page.md').write_text(md, errors='replace')
              if meta: (prop_dir / 'meta.json').write_text(json.dumps(meta, indent=2))
              
              # Extract image URLs
              urls = extract_image_urls(html)
              urls.update(extract_image_urls(md))
              # Also pull from metadata.ogImage and similar
              for key in ['ogImage', 'ogImageUrl', 'image', 'twitter:image']:
                  v = meta.get(key)
                  if isinstance(v, str) and 'rdcpix' in v.lower():
                      urls.add(v)
              
              print(f"    Found {len(urls)} candidate image URLs", flush=True)
              
              # Filter + dedupe by photo ID (rdcpix URLs have the same base path with different size suffixes)
              # Group by base path, prefer largest variant per group
              groups = {}
              for u in urls:
                  # Extract base path before size suffix
                  m = re.match(r'(.+?)([_\-]w\d+|_h\d+|_q\d+)*\.jpg$', u)
                  base = m.group(1) if m else u
                  # Score by suffix (larger = better)
                  score = 0
                  if '_w1536' in u or '_w1280' in u: score = 5
                  elif '_w1024' in u or '_w960' in u: score = 4
                  elif '_w640' in u or '_w480' in u: score = 3
                  else: score = 2
                  if base not in groups or groups[base][1] < score:
                      groups[base] = (u, score)
              best_urls = [url for url, _ in groups.values()]
              print(f"    After dedup: {len(best_urls)} unique photos", flush=True)
              for u in best_urls[:3]:
                  print(f"      {u[:140]}", flush=True)
              
              # Download
              downloaded = []
              for i, url in enumerate(best_urls[:30], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_realtor_{h}.jpg"
                      with http_download(url, prop['url']) as r:
                          data_bytes = r.read()
                      if len(data_bytes) > 8000:
                          (prop_dir / fname).write_bytes(data_bytes)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data_bytes)})
                          print(f"      [{i}] {len(data_bytes)}b -> {fname}", flush=True)
                      else:
                          print(f"      [{i}] {len(data_bytes)}b too small", flush=True)
                  except Exception as e:
                      print(f"      [{i}] FAIL: {str(e)[:60]}", flush=True)
              
              all_results[prop['id']] = {
                  'url': prop['url'],
                  'urls_found': len(urls),
                  'downloaded': len(downloaded),
                  'files': downloaded,
              }
              time.sleep(1)
          
          with open(OUT / 'manifest.json', 'w') as f:
              json.dump(all_results, f, indent=2, default=str)
          total = sum(r['downloaded'] for r in all_results.values())
          print(f"\n>>> TOTAL: {total} photos across {len(all_results)}/{len(PROPERTIES)} properties", flush=True)
          PY
          
          python3 /tmp/fc/scrape.py 2>&1 | tee /tmp/fc/run.log
          echo "---"
          ls -la /tmp/fc/
          for d in /tmp/fc/*/; do
            if [ -d "$d" ]; then
              echo "  $d: $(ls $d 2>/dev/null | wc -l) files"
            fi
          done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl_realtor
          path: /tmp/fc/
