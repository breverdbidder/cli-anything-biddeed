name: Stitch API Verify
on:
  push:
    paths:
      - 'scripts/verify-stitch.sh'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test Stitch
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Testing Stitch API..."
          if [ -z "$KEY" ]; then echo "NO KEY"; exit 1; fi
          echo "Key: ${#KEY} chars"
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X POST "https://stitch.googleapis.com/mcp" -H "Content-Type: application/json" -H "x-goog-api-key: $KEY" -d '{"jsonrpc":"2.0","method":"tools/list","id":1}')
          echo "HTTP: $HTTP"
          cat /tmp/body.txt | head -c 1000
          echo ""
          if [ "$HTTP" = "200" ]; then echo "PASS"; else echo "FAIL - need gcloud enable"; fi
