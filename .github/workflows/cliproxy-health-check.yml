name: cliproxy health check v3
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: SSH smoke
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: container status ==="
          $SSH 'docker ps --format "{{.Names}} {{.Status}}" | grep cliproxy'

          echo
          echo "=== B: extract gateway key via grep -oP ==="
          # Gateway key format: biddeed-gw-<40+hex>
          CP_KEY=$($SSH "grep -oP 'biddeed-gw-[a-f0-9]{20,}' /opt/cliproxy-gateway/config.yaml" | head -1 | tr -d '\r\n')
          echo "::add-mask::$CP_KEY"
          if [ -z "$CP_KEY" ]; then
            echo "::error::could not extract gateway key"
            exit 1
          fi
          echo "gateway key: len=${#CP_KEY}"

          echo
          echo "=== C: smoke test cliproxy current state ==="
          RESP=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":30,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only HEALTH_OK\"}]}' -m 25 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"

          if echo "$RESP" | grep -q "HEALTH_OK"; then
            echo "::notice::CURRENT_STATUS=WORKING"
          elif echo "$RESP" | grep -qi "API_KEY_INVALID\|expired"; then
            echo "::notice::CURRENT_STATUS=KEY_EXPIRED"
          elif echo "$RESP" | grep -qi "PERMISSION_DENIED\|denied access"; then
            echo "::notice::CURRENT_STATUS=PROJECT_DENIED"
          else
            echo "::notice::CURRENT_STATUS=UNKNOWN"
          fi
          echo "response preview:"
          echo "$RESP" | head -c 500
          echo "=== END ==="
