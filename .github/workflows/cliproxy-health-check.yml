name: cliproxy health check v2
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: SSH smoke
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: container status ==="
          $SSH 'docker ps --format "{{.Names}} {{.Status}}" | grep cliproxy'

          echo
          echo "=== B: extract gateway key (masked) ==="
          CP_KEY=$($SSH "awk '/^api-keys:/{getline; gsub(/.*\"/, \"\"); gsub(/\".*/, \"\"); print}' /opt/cliproxy-gateway/config.yaml" | tr -d '\r\n')
          echo "::add-mask::$CP_KEY"
          echo "gateway key: len=${#CP_KEY}"

          echo
          echo "=== C: smoke test current cliproxy state ==="
          RESP=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":30,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only HEALTH_OK\"}]}' -m 25 http://127.0.0.1:8317/v1/messages 2>&1")
          SAFE=$(echo "$RESP" | sed "s|${CP_KEY}|<K>|g")
          echo "len: ${#RESP}"

          if echo "$SAFE" | grep -q "HEALTH_OK"; then
            echo "::notice::CURRENT_STATUS=WORKING — cliproxy alive, Gemini key valid"
          elif echo "$SAFE" | grep -qi "API_KEY_INVALID\|expired"; then
            echo "::notice::CURRENT_STATUS=KEY_EXPIRED — need fresh key"
          elif echo "$SAFE" | grep -qi "PERMISSION_DENIED\|denied access"; then
            echo "::notice::CURRENT_STATUS=PROJECT_DENIED — project needs API access enabled"
          else
            echo "::notice::CURRENT_STATUS=UNKNOWN"
          fi
          echo "response preview:"
          echo "$SAFE" | head -c 500
          echo "=== END ==="
