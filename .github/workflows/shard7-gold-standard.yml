name: "SHARD-7 Gold Standard — highlands, volusia, miami_dade, columbia, madison"

# Autonomous 6h session for SHARD-7 counties following criterion-parallel strategy
# Implements C/D parity, E linkage, J generator, bootstrap counties, freshness fixes

on:
  workflow_dispatch:
    inputs:
      target_counties:
        description: 'Counties to target (default: highlands,volusia,miami_dade,columbia,madison)'
        required: false
        default: 'highlands,volusia,miami_dade,columbia,madison'
        type: string
      max_hours:
        description: 'Max runtime in hours (default 6)'
        required: false
        default: '6'
        type: string
      verification_only:
        description: 'Only run verification, no fixes (default false)'
        required: false
        type: boolean
        default: false
  schedule:
    # Run 3x daily during 24/7 build cadence (08:00Z, 16:00Z, 00:00Z)
    - cron: '0 8,16,0 * * *'

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  shard7_gold_standard:
    name: "🎯 SHARD-7 Gold Standard Campaign"
    runs-on: ubuntu-latest
    timeout-minutes: 390  # 6.5 hours (6h session + buffer)

    steps:
      - name: "📊 Pre-flight verification"
        run: |
          echo "🎯 SHARD-7 GOLD STANDARD CAMPAIGN"
          echo "Counties: ${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}"
          echo "Max hours: ${{ github.event.inputs.max_hours || '6' }}"
          echo "Verification only: ${{ github.event.inputs.verification_only || 'false' }}"
          echo "Started: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          # Build session metadata for tracking
          cat > /tmp/shard7_session.json << EOF
          {
            "session_id": "shard7-${{ github.run_id }}",
            "counties": "${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}",
            "max_hours": "${{ github.event.inputs.max_hours || '6' }}",
            "verification_only": "${{ github.event.inputs.verification_only || 'false' }}",
            "started_at": "$(date -u --iso-8601=seconds)",
            "github_run": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: "🚀 Execute SHARD-7 targeted fixes on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: ${{ github.event.inputs.max_hours || '6' }}h
          script: |
            set -e
            cd ${{ env.REPO_PATH }}
            
            # Ensure we have latest code
            git fetch origin main
            git reset --hard origin/main
            git pull origin main
            
            # Set environment variables for Supabase access
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}"
            export SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            
            # Session tracking
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            SESSION_ID="shard7-${{ github.run_id }}-${TIMESTAMP}"
            LOG_DIR=".claude/shard_logs"
            mkdir -p "$LOG_DIR"
            
            echo "🎯 SHARD-7 Gold Standard Session: ${SESSION_ID}"
            echo "🕒 Started: $(date)"
            
            # Telegram start notification
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=🎯 SHARD-7 Gold Standard starting%0ACounties: ${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}%0ASession: ${SESSION_ID}" \
              > /dev/null 2>&1 || true
            
            if [ "${{ github.event.inputs.verification_only }}" == "true" ]; then
              echo "📊 Running verification only..."
              python3 verify_shard7_status.py 2>&1 | tee "$LOG_DIR/shard7_verification_${TIMESTAMP}.log"
            else
              echo "🔧 Running targeted fixes..."
              
              # Run the targeted fixes script
              python3 scripts/shard7_targeted_fixes.py 2>&1 | tee "$LOG_DIR/shard7_fixes_${TIMESTAMP}.log"
              
              # Run verification after fixes to measure impact
              echo "📈 Post-fix verification..."
              python3 verify_shard7_status.py 2>&1 | tee "$LOG_DIR/shard7_post_verification_${TIMESTAMP}.log"
            fi
            
            echo "✅ SHARD-7 session completed: $(date)"
            
            # Commit any changes made by the scripts
            git add -A
            git diff --cached --quiet || {
              git commit -m "feat(shard-7): gold standard improvements - session ${SESSION_ID}

              Autonomous SHARD-7 gold standard fixes executed:
              - Counties: ${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}
              - Session: ${SESSION_ID}
              - Logs: ${LOG_DIR}/shard7_*_${TIMESTAMP}.log
              
              🤖 Generated with [Claude Code](https://claude.ai/code)"
              
              # Configure git for push
              git config user.name "SHARD-7 Gold Standard Bot"
              git config user.email "shard7-bot@biddeed.ai"
              git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
              git push origin main
            } || echo "No changes to commit"
            
            # Final session metadata
            echo "Session ${SESSION_ID} completed successfully" > "$LOG_DIR/shard7_${SESSION_ID}_complete.marker"

      - name: "📊 Session summary"
        if: always()
        run: |
          SESSION_STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          echo "📈 SHARD-7 Gold Standard Session Summary"
          echo "Status: ${SESSION_STATUS}"
          echo "Counties: ${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}"
          echo "Run URL: ${RUN_URL}"
          
          # Telegram completion notification
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🏁 SHARD-7 Gold Standard ${SESSION_STATUS}%0ACounties: ${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}%0ADetails: ${RUN_URL}" \
            > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## SHARD-7 Gold Standard Campaign
          **Counties:** ${{ github.event.inputs.target_counties || 'highlands,volusia,miami_dade,columbia,madison' }}
          **Max hours:** ${{ github.event.inputs.max_hours || '6' }}
          **Verification only:** ${{ github.event.inputs.verification_only || 'false' }}
          **Status:** ${{ job.status }}
          **Server:** Hetzner ${{ env.HETZNER_HOST }}
          **Repo path:** ${{ env.REPO_PATH }}
          
          ### Target Metrics (Criterion-Parallel Strategy)
          - **C/D Parity:** highlands 31.5% → 95%+, volusia 11.6% → 95%+
          - **E Parcel Linkage:** 50-58% → 95%+ across all counties
          - **J Deal Thesis:** 0% → 95%+ (Shapira Formula implementation)
          - **Bootstrap:** columbia/madison 0/10 → basic coverage
          - **H Freshness:** miami_dade 272h → <48h
          
          ### Logs Location
          Hetzner: \`/opt/biddeed/cli-anything-biddeed/.claude/shard_logs/shard7_*\`
          EOF