name: "SHARD-7 Gulf FC Outcomes Harvester"
# Populates multi_county_auctions + foreclosure_outcomes for Gulf County
# to satisfy B (verified_outcomes >= 95%) and F (tier1_sold >= 95%) criteria.
#
# Gulf County is tiny (pop ~13K, Port St. Joe FL panhandle).
# gulf.realforeclose.com is the FC platform. Live scrape only — as of
# 2026-07-10 the script no longer falls back to fabricated data when the
# live scrape finds nothing (see scripts/shard7_gulf_bf_outcomes.py header
# and the fix commit for the prior "clerk proxy records" incident). It
# fails loudly instead, so this job legitimately fails until a working
# scrape of gulf's real sold-auction history is built.
#
# dispatch_id: 59743e39-a09f-41df-8035-766ce34ad215
# script: scripts/shard7_gulf_bf_outcomes.py

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: shard7-gulf-outcomes
  cancel-in-progress: false

jobs:
  gulf-outcomes:
    name: "Gulf County B+F Outcomes (FC)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx requests

      - name: Run Gulf FC outcomes harvester
        run: |
          set -euo pipefail
          python3 scripts/shard7_gulf_bf_outcomes.py 2>&1 | tee /tmp/gulf_outcomes.log
          echo "Exit code: $?"

      - name: Post summary to GitHub step summary
        if: always()
        run: |
          set +e
          echo "## SHARD-7 Gulf FC Outcomes Harvester" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**County:** gulf  |  **Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "SHARD-7|wrote|Written|PASS|FAIL|SQL VERIF|rows written|foreclosure_outcomes|multi_county_auctions|B criterion|F criterion|dispatch_id" \
            /tmp/gulf_outcomes.log 2>/dev/null | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify B+F via REST (no Mgmt API token needed)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, sys, urllib.request, urllib.parse

          KEY = os.environ['SUPABASE_KEY']
          URL = os.environ['SUPABASE_URL'].rstrip('/')
          H = {
              'apikey': KEY,
              'Authorization': f'Bearer {KEY}',
              'Content-Type': 'application/json',
          }

          def get(path, params=None):
              url = f'{URL}/rest/v1/{path}'
              if params:
                  url += '?' + '&'.join(f'{k}={urllib.parse.quote(str(v))}' for k, v in params.items())
              req = urllib.request.Request(url, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f'GET {path} failed: {e}', file=sys.stderr)
                  return []

          # Count sold rows (closed_sold denominator)
          sold_rows = get('multi_county_auctions', {
              'county': 'eq.gulf',
              'auction_status': 'eq.sold',
              'select': 'case_number,sold_amount,tier1_sold_amount',
              'limit': '100',
          })
          n_sold = len(sold_rows)

          # Count outcome rows (B numerator)
          fo_rows = get('foreclosure_outcomes', {
              'county': 'eq.gulf',
              'select': 'case_number,winning_bid',
              'limit': '100',
          })
          n_fo = len(fo_rows)

          # Count tier1 rows (F numerator)
          t1_rows = [r for r in sold_rows if r.get('tier1_sold_amount')]
          n_t1 = len(t1_rows)

          print()
          print('### SQL VERIFICATION — Gulf County B+F')
          import datetime
          print(f'Timestamp: {datetime.datetime.now(datetime.timezone.utc).isoformat()}')
          print(f'multi_county_auctions sold rows (gulf):     {n_sold}')
          print(f'foreclosure_outcomes rows (gulf):           {n_fo}')
          print(f'tier1_sold_amount rows (gulf):              {n_t1}')

          b_pct = (n_fo / n_sold * 100) if n_sold > 0 else 0
          f_pct = (n_t1 / n_sold * 100) if n_sold > 0 else 0
          b_status = 'PASS' if b_pct >= 95 else 'FAIL'
          f_status = 'PASS' if f_pct >= 95 else 'FAIL'

          print(f'B criterion: {b_pct:.1f}% ({n_fo}/{n_sold}) >= 95% -> {b_status}')
          print(f'F criterion: {f_pct:.1f}% ({n_t1}/{n_sold}) >= 95% -> {f_status}')
          print('### END SQL VERIFICATION')

          if n_sold == 0:
              print('WARNING: closed_sold denominator = 0 — no sold rows found', file=sys.stderr)
              sys.exit(1)
          " 2>&1 | tee /tmp/gulf_verify.txt
          cat /tmp/gulf_verify.txt >> "$GITHUB_STEP_SUMMARY"
