name: "SHARD-4 Gold Standard Autonomous Session"

on:
  workflow_dispatch:
    inputs:
      counties:
        description: 'Counties to target (comma-separated)'
        required: false
        default: 'citrus,clay,martin,washington,lafayette'
      letters:
        description: 'Letters to focus on'
        required: false
        default: 'B,I,J'
      max_hours:
        description: 'Maximum session hours (6 hour budget)'
        required: false
        default: '6'
  schedule:
    # Daily autonomous sessions at 08:00Z per issue
    - cron: '0 8 * * *'

jobs:
  shard4-autonomous:
    name: "SHARD-4 Autonomous Execution"
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour budget per issue
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONUNBUFFERED: 1
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # Work on main per SHIP-TO-MAIN mandate
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install supabase
          
      - name: Verify environment and database connectivity
        run: |
          echo "Verifying SHARD-4 environment..."
          echo "Counties: ${{ github.event.inputs.counties || 'citrus,clay,martin,washington,lafayette' }}"
          echo "Letters: ${{ github.event.inputs.letters || 'B,I,J' }}"
          echo "Max hours: ${{ github.event.inputs.max_hours || '6' }}"
          
          # Test database connection
          python shard4_status_check.py
          
      - name: Run SHARD-4 autonomous session
        id: execute
        run: |
          echo "🚀 Starting SHARD-4 Gold Standard autonomous session..."
          echo "Session start: $(date -u)"
          
          # Execute the main improvement script
          python shard4_gold_standard_executor.py \
            --counties "${{ github.event.inputs.counties || 'citrus,clay,martin,washington,lafayette' }}" \
            --letters "${{ github.event.inputs.letters || 'B,I,J' }}" \
            --max-hours ${{ github.event.inputs.max_hours || 6 }}
          
          echo "Session end: $(date -u)"
          
      - name: Run verification protocol
        id: verify
        run: |
          echo "🔍 Running verification protocol..."
          
          # Run pencil_dod_evaluate_county for each county
          counties="${{ github.event.inputs.counties || 'citrus,clay,martin,washington,lafayette' }}"
          IFS=',' read -ra COUNTY_ARRAY <<< "$counties"
          
          for county in "${COUNTY_ARRAY[@]}"; do
            echo "Evaluating $county..."
            python -c "
import sys, os
sys.path.insert(0, os.path.join(os.path.dirname(__file__), 'shared'))
from cli_anything_shared.supabase import get_client
client = get_client()
result = client.rpc('pencil_dod_evaluate_county', {'county_slug': '$county'}).execute()
print(f'=== $county VERIFICATION ===')
if result.data:
    for item in result.data:
        letter = item.get('letter', '').upper()
        passed = item.get('pass', False)
        metric = item.get('metric', 'NULL')
        print(f'{letter}: {\"PASS\" if passed else \"FAIL\"} (metric={metric})')
else:
    print('No evaluation data returned')
print()
"
          done
          
      - name: Commit improvements to main
        if: always()
        run: |
          # Configure git
          git config --global user.name 'SHARD-4 Autonomous Session'
          git config --global user.email 'shard4@biddeed.ai'
          
          # Check for changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Committing changes to main branch..."
            git add -A
            git commit -m "SHARD-4: Autonomous session B/I/J improvements - $(date -u +%Y%m%d_%H%M%SZ)
            
Counties: citrus, clay, martin, washington, lafayette
Critical letters: B (verified outcomes), I (property cards), J (deal thesis)
Session duration: ${{ github.event.inputs.max_hours || 6 }} hour budget

🤖 Generated with [Claude Code](https://claude.ai/code)

Co-Authored-By: Claude <noreply@anthropic.com>"
            
            git push origin main
            echo "✅ Changes committed to main branch"
          else
            echo "ℹ️ No changes to commit"
          fi
          
      - name: Update session summary
        if: always()
        run: |
          echo "## SHARD-4 Gold Standard Session Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Session Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Counties:** citrus, clay, martin, washington, lafayette" >> $GITHUB_STEP_SUMMARY
          echo "**Target Letters:** B (verified outcomes), I (property cards), J (deal thesis)" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** CRITERION-PARALLEL PIVOT targeting critical three" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "See step logs for pencil_dod_evaluate_county results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHIP-TO-MAIN:** All changes committed directly to main branch per autonomous mandate" >> $GITHUB_STEP_SUMMARY