name: winnerdata-daily
# Daily automated FF pipeline (BidDeed + ZoneWise + Tracerfy), all 67 FL
# counties: Signal -> authenticated RealAuction winner harvest -> Skip-trace
# -> Appraiser cross-verify -> Quote-Draft -> Route -> Deliver.
# See scripts/winnerdata_pipeline.py. Degrades (does not fail) when
# TRACERFY_API_KEY/REALFORECLOSE_* are absent — logs BLOCKED and runs on
# existing data only. Never fabricates leads.
#
# Sprint 1b (scripts/realauction_winner_harvest.py, wired 2026-08-25 per
# issue #19446) replaced the untested Bright Data Scraping Browser path —
# direct HTTP from this runner is NOT IP-blocked (confirmed live), so no
# vendor browser is needed. It authenticates against Ariel's own bidder
# account, not a paid vendor API, so it does NOT spend the Tracerfy/
# BrightData ledger. Tracerfy skip-trace spend alone is hard-capped at
# 100 units/UTC day by public.ff_ledger_spend()
# (scripts/ff_credit_ledger.py) — no borrowing across days.
#
# CRON TIMING (INFERRED 2026-08-24, not vendor-confirmed per county — flagged
# explicitly, do not treat as verified fact): RealAuction/RealTaxDeed FL
# foreclosure/tax-deed sales run online starting ~9-11am ET (confirmed for
# Flagler: 11am; Palm Beach: 10am Mon-Thu) and, since a single county session
# auctions many parcels sequentially, typically continue into the afternoon.
# The PRIOR cron (11:00 UTC = 7:00 AM ET) ran *before* same-day auctions even
# started, so it could only ever pick up results from days-old sales via
# Sprint 1's 7-day lookback -- same-day FF generation was structurally
# impossible at that hour.
#
# 2026-08-24 follow-up check: pulled actual auction_time data from
# public.multi_county_auctions + public.auction_calendar. Only 15 of 67
# counties have any recorded start-time data at all, but for those 15
# (Brevard, Orange, Palm Beach, Polk, Hillsborough, Marion, Hernando, Dixie,
# Sumter, Levy, Madison, Hendry, Monroe, Miami-Dade) every recorded start
# time falls between 9:00-11:00 AM ET, nothing later. 00:00 UTC (8:00 PM
# EDT / 7:00 PM EST) is confirmed safe for those 15; the other 52 counties
# remain unverified (no start-time data exists to check against) -- Ariel
# accepted this as an acceptable risk given the midnight catch-up pass below,
# rather than blocking on scraping all 67 counties' actual posted times.
# Primary pass moved from 23:00 UTC to 00:00 UTC (8:00 PM ET) plus a second
# midnight-ET catch-up pass added as a safety net for any county whose
# results post later than expected. Revisit if a specific county's clerk
# posts later than the catch-up pass.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"    # 8:00 PM EDT / 7:00 PM EST (00:00 UTC) — daily FF pipeline, primary pass
    - cron: "0 4 * * *"    # 12:00 AM EDT / 11:00 PM EST (04:00 UTC) — midnight-ET catch-up pass for late-posting counties
concurrency: {group: winnerdata-daily, cancel-in-progress: false}
permissions:
  contents: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx playwright && playwright install --with-deps chromium
      - name: Run daily FF pipeline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
        run: python scripts/winnerdata_pipeline.py
      - name: Commit batch files
        run: |
          git config user.name "winnerdata-bot"
          git config user.email "actions@github.com"
          git add winnerdata/batches/
          git diff --cached --quiet || git commit -m "Winner Data daily batch $(date -u +%Y-%m-%d)"
          git push
