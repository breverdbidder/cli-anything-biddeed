name: Deploy Winner Data Fact Finder Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/winnerdata-ff/**'
      - 'templates/FF_TEMPLATE_*.html'
      - '.github/workflows/deploy-winnerdata-ff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winnerdata-ff-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard - required secrets present
        # This workflow previously referenced secrets.CLOUDFLARE_API_TOKEN /
        # secrets.CLOUDFLARE_ACCOUNT_ID, which do NOT exist in this repo --
        # every other Cloudflare Workers/Pages deploy workflow here
        # (deploy-worker.yml, deploy-ensemble-worker.yml, deploy_cf.yml,
        # sprint5a-deploy.yml, etc.) uses secrets.CF_API_TOKEN /
        # secrets.CF_ACCOUNT_ID. That naming mismatch, not a missing
        # credential, is why this Worker was undeployable -- fixed 2026-08-24
        # as part of the daily FF pipeline work (the mandatory
        # appraiser-link/verify-badge changes need this deploy to ship).
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          SVC_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CF_API_TOKEN or CF_ACCOUNT_ID. Add them at Settings > Secrets > Actions. Token scope: Workers Scripts:Edit + Workers Routes:Edit."
            exit 1
          fi
          if [ -z "$SVC_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY (issue #20038 -- the Worker now reads this as a secret instead of a hardcoded anon key). Add it at Settings > Secrets > Actions."
            exit 1
          fi
          echo "Secrets present."

      - name: Syntax check worker
        run: |
          node --check workers/winnerdata-ff/src/index.js
          echo "Worker JS parses OK"

      - name: Unit tests - fail build on internal-reference leak or format regressions
        # issue #19751: gates the shipped template against internal
        # issue/comment ids and vendor names leaking into client-facing HTML
        # (workers/winnerdata-ff/test/no_internal_refs.test.mjs), plus the
        # existing ff_format.js coverage. A failure here blocks the deploy
        # step below -- this was previously never wired into CI.
        run: node --test workers/winnerdata-ff/test/

      - name: Set SUPABASE_SERVICE_ROLE_KEY worker secret
        # issue #20038: must land BEFORE the code deploy below -- the deployed
        # Worker reads env.SUPABASE_SERVICE_ROLE_KEY on every request (no more
        # hardcoded anon key in src/index.js). Setting the secret first means
        # the new code is never live without it. `wrangler secret put` reads
        # the value from stdin so it never appears in argv/logs; GHA also
        # masks any secrets.* value that happens to print.
        working-directory: workers/winnerdata-ff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SVC_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "$SVC_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/winnerdata-ff
          command: deploy

      - name: Verify live - real HTTP, not a checkmark
        # issue #20038: workers_dev=false now (wrangler.toml) -- ff.winnerdataai.com
        # is the only route this Worker answers on. workers.dev is expected to
        # NOT return 200 anymore; that used to be the fallback check here, now
        # it's a guard the OTHER direction (side door must be gone).
        run: |
          sleep 8
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://ff.winnerdataai.com/healthz || echo "000")
          echo "/healthz (custom domain) returned $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::ff.winnerdataai.com/healthz did not return 200 (got $CODE). This is the only route the Worker should serve now -- treat this as a real deploy failure."
            exit 1
          fi
          WD_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://winnerdata-ff.brevardbidderai.workers.dev/healthz || echo "000")
          echo "/healthz (workers.dev) returned $WD_CODE"
          if [ "$WD_CODE" = "200" ]; then
            echo "::error::workers.dev still returns 200 with workers_dev=false in wrangler.toml -- the unauthenticated side door is not actually closed. Failing the deploy."
            exit 1
          fi

      - name: Security gate - unauthenticated access must NOT return lead data
        run: |
          BODY=$(curl -s https://ff.winnerdataai.com/portal || echo "")
          if echo "$BODY" | grep -qE '[0-9]{3}-[0-9]{3}-[0-9]{4}'; then
            echo "::error::Unauthenticated /portal exposed a phone number. Cloudflare Access and/or RLS is NOT enforced. Failing the deploy."
            exit 1
          fi
          echo "No PII leaked on unauthenticated request."
