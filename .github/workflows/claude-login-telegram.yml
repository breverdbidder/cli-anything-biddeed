name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login Claude on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GH_PAT
          script: |
            rm -f /tmp/cl.txt
            timeout 25 script -q /tmp/cl.txt -c "claude auth login" || true
            URL=$(grep -o 'https://claude.ai/oauth[^ "]*' /tmp/cl.txt | head -1)
            echo "URL length: ${#URL}"
            test -n "$URL" || exit 1
            echo "Posting to GitHub issue..."
            curl -s -X POST -H "Authorization: token ${GH_PAT}" -H "Content-Type: application/json" "https://api.github.com/repos/breverdbidder/zonewise-web/issues/41/comments" -d "{\"body\":\"LOGIN URL: ${URL}\"}" | head -c 100
            echo ""
            echo "Sending Telegram..."
            echo "Token: ${TELEGRAM_BOT_TOKEN:0:10}..."
            echo "Chat: ${TELEGRAM_CHAT_ID}"
            curl -v -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🔑 TAP TO LOGIN: ${URL}\",\"disable_web_page_preview\":true}" 2>&1 | tail -20
            echo "Starting fresh login + 5min wait..."
            script -q /dev/null -c "claude auth login" &
            BG=$!
            for i in $(seq 1 60); do
              sleep 5
              claude auth status 2>&1 | grep -q '"loggedIn": true' && echo "SUCCESS" && kill $BG 2>/dev/null && exit 0
              [ $((i % 12)) -eq 0 ] && echo "Waiting $((i*5))s..."
            done
            kill $BG 2>/dev/null
            exit 1
