name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture login URL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "Starting login"
            rm -f /tmp/cl-login.txt
            nohup script -q /tmp/cl-login.txt -c "claude auth login" > /dev/null 2>&1 &
            BG=$!
            for i in $(seq 1 30); do
              sleep 1
              grep -q 'claude.ai/oauth' /tmp/cl-login.txt 2>/dev/null && break
            done
            URL=$(grep -o 'https://claude.ai/oauth[^ "]*' /tmp/cl-login.txt | head -1)
            if [ -z "$URL" ]; then
              echo "No URL"
              cat /tmp/cl-login.txt
              kill $BG 2>/dev/null
              exit 1
            fi
            echo "URL length: ${#URL}"
            python3 -c "
            import json, urllib.request
            url = '''$URL'''
            payload = json.dumps({
                'chat_id': '${TELEGRAM_CHAT_ID}',
                'text': '🔑 Tap the button below to log in Claude on Hetzner.\n\nYou have 5 minutes.',
                'reply_markup': {
                    'inline_keyboard': [[{
                        'text': '🔑 TAP HERE TO LOGIN',
                        'url': url
                    }]]
                }
            }).encode()
            req = urllib.request.Request(
                'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage',
                data=payload,
                headers={'Content-Type': 'application/json'}
            )
            resp = urllib.request.urlopen(req)
            print('Telegram:', resp.read().decode()[:100])
            "
            echo "Waiting 5 min for approval..."
            for i in $(seq 1 60); do
              sleep 5
              if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
                echo "LOGIN SUCCESS"
                kill $BG 2>/dev/null || true
                python3 -c "
            import json, urllib.request
            payload = json.dumps({
                'chat_id': '${TELEGRAM_CHAT_ID}',
                'text': '✅ Login successful! Deploying Explorer V2...'
            }).encode()
            req = urllib.request.Request(
                'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage',
                data=payload,
                headers={'Content-Type': 'application/json'}
            )
            urllib.request.urlopen(req)
            "
                exit 0
              fi
              [ $((i % 12)) -eq 0 ] && echo "Waiting... $((i*5))s"
            done
            kill $BG 2>/dev/null || true
            echo "TIMEOUT"
            exit 1
