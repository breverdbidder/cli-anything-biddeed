name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture login URL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "Step 1: Capture URL (synchronous)"
            rm -f /tmp/cl.txt
            timeout 25 script -q /tmp/cl.txt -c "claude auth login" || true
            URL=$(grep -o 'https://claude.ai/oauth[^ "]*' /tmp/cl.txt | head -1)
            if [ -z "$URL" ]; then
              echo "No URL"
              cat /tmp/cl.txt
              exit 1
            fi
            echo "Got URL (${#URL} chars)"
            echo "Step 2: Send button to Telegram"
            python3 << PYEOF
            import json, urllib.request
            url = "$URL"
            token = "$TELEGRAM_BOT_TOKEN"
            chat = "$TELEGRAM_CHAT_ID"
            payload = json.dumps({
                "chat_id": chat,
                "text": "🔑 Tap the button to log in Claude on Hetzner.\n5 minutes to approve.",
                "reply_markup": {"inline_keyboard": [[{"text": "🔑 TAP HERE TO LOGIN", "url": url}]]}
            }).encode()
            req = urllib.request.Request(
                f"https://api.telegram.org/bot{token}/sendMessage",
                data=payload, headers={"Content-Type": "application/json"}
            )
            try:
                resp = urllib.request.urlopen(req)
                print("OK:", resp.read().decode()[:80])
            except Exception as e:
                print("ERR:", e)
            PYEOF
            echo "Step 3: Start fresh login + wait 5 min"
            script -q /dev/null -c "claude auth login" &
            BG=$!
            for i in $(seq 1 60); do
              sleep 5
              if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
                echo "LOGIN SUCCESS after $((i*5))s"
                kill $BG 2>/dev/null || true
                python3 << PYEOF2
            import json, urllib.request
            payload = json.dumps({"chat_id": "$TELEGRAM_CHAT_ID", "text": "✅ Login successful!"}).encode()
            req = urllib.request.Request(
                "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage",
                data=payload, headers={"Content-Type": "application/json"}
            )
            urllib.request.urlopen(req)
            PYEOF2
                exit 0
              fi
              [ $((i % 12)) -eq 0 ] && echo "Waiting... $((i*5))s"
            done
            kill $BG 2>/dev/null || true
            echo "TIMEOUT"
            exit 1
