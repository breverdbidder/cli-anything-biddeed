name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login Claude on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TG_TOKEN,TG_CHAT,PAT
          script: |
            rm -f /tmp/cl-flush.txt
            export TG_TOKEN TG_CHAT PAT
            (for i in $(seq 1 60); do
              sleep 1
              URL=$(grep -o 'https://claude.ai/oauth[^ "]*' /tmp/cl-flush.txt 2>/dev/null | head -1)
              if [ -n "$URL" ]; then
                python3 << PYEOF
            import json, urllib.request, os
            url = os.environ.get('CAPTURED_URL','')
            if not url:
                import re
                with open('/tmp/cl-flush.txt') as f:
                    m = re.search(r'https://claude\.ai/oauth\S+', f.read())
                    url = m.group(0) if m else ''
            if not url: exit(1)
            token = os.environ['TG_TOKEN']
            chat = os.environ['TG_CHAT']
            pat = os.environ['PAT']
            for desc, target, hdrs, body in [
                ('TG', f'https://api.telegram.org/bot{token}/sendMessage', {}, {'chat_id':chat,'text':'🔑 Tap to login:','reply_markup':{'inline_keyboard':[[{'text':'🔑 LOGIN','url':url}]]}}),
                ('GH', 'https://api.github.com/repos/breverdbidder/zonewise-web/issues/41/comments', {'Authorization':f'token {pat}'}, {'body':'🔑 LIVE:\n'+url})
            ]:
                try:
                    req = urllib.request.Request(target, data=json.dumps(body).encode(), headers={**hdrs,'Content-Type':'application/json'})
                    urllib.request.urlopen(req)
                    print(f'{desc} OK')
                except Exception as e:
                    print(f'{desc} ERR: {e}')
            PYEOF
                break
              fi
            done) &
            script -f -q /tmp/cl-flush.txt -c "claude auth login"
            claude auth status
