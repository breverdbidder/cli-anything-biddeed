name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login Claude on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TG_TOKEN,TG_CHAT,PAT
          script: |
            rm -f /tmp/cl-fg.txt
            export TG_TOKEN TG_CHAT PAT
            (while true; do
              URL=$(grep -o 'https://claude.ai/oauth[^ "]*' /tmp/cl-fg.txt 2>/dev/null | head -1)
              if [ -n "$URL" ]; then
                python3 -c "
            import json, urllib.request, os
            url = '$URL'
            token = os.environ['TG_TOKEN']
            chat = os.environ['TG_CHAT']
            pat = os.environ['PAT']
            for target, payload in [
              (f'https://api.telegram.org/bot{token}/sendMessage', json.dumps({'chat_id':chat,'text':'🔑 Tap to login (5 min):','reply_markup':{'inline_keyboard':[[{'text':'🔑 TAP HERE','url':url}]]}}).encode()),
              (f'https://api.github.com/repos/breverdbidder/zonewise-web/issues/41/comments', json.dumps({'body':'🔑 LIVE LOGIN URL:\n\n'+url}).encode())
            ]:
              headers = {'Content-Type':'application/json'}
              if 'github' in target: headers['Authorization'] = f'token {pat}'
              try:
                urllib.request.urlopen(urllib.request.Request(target, data=payload, headers=headers))
                print(f'OK: {target[:40]}')
              except Exception as e:
                print(f'ERR: {e}')
            "
                break
              fi
              sleep 1
            done) &
            SENDER=$!
            script -q /tmp/cl-fg.txt -c "claude auth login"
            LOGIN_EXIT=$?
            kill $SENDER 2>/dev/null || true
            claude auth status
            if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
              echo "SUCCESS"
              exit 0
            fi
            echo "Login exited with: $LOGIN_EXIT"
            exit 1
