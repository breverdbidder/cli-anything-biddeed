name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login Claude on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TG_TOKEN,TG_CHAT,PAT
          script: |
            rm -f /tmp/cl-live.txt
            script -q /tmp/cl-live.txt -c "claude auth login" &
            BG=$!
            echo "Login PID: $BG"
            URL=""
            for i in $(seq 1 40); do
              sleep 1
              URL=$(grep -o 'https://claude.ai/oauth[^ "]*' /tmp/cl-live.txt 2>/dev/null | head -1)
              test -n "$URL" && break
            done
            if [ -z "$URL" ]; then
              echo "No URL after 40s"
              cat /tmp/cl-live.txt 2>/dev/null
              kill $BG 2>/dev/null
              exit 1
            fi
            echo "URL captured (${#URL} chars) - process still alive"
            python3 -c "
            import json, urllib.request
            url = '''$URL'''
            token = '''$TG_TOKEN'''
            chat = '''$TG_CHAT'''
            pat = '''$PAT'''
            payload = json.dumps({'chat_id':chat,'text':'🔑 Tap to login (5 min):','reply_markup':{'inline_keyboard':[[{'text':'🔑 TAP HERE TO LOGIN','url':url}]]}}).encode()
            req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,headers={'Content-Type':'application/json'})
            try:
                resp = urllib.request.urlopen(req)
                print('TG OK')
            except Exception as e:
                print(f'TG ERR: {e}')
            ghpayload = json.dumps({'body':'🔑 LOGIN URL (5 min - process alive):\n\n'+url}).encode()
            req2 = urllib.request.Request(f'https://api.github.com/repos/breverdbidder/zonewise-web/issues/41/comments',data=ghpayload,headers={'Content-Type':'application/json','Authorization':f'token {pat}'})
            try:
                urllib.request.urlopen(req2)
                print('GH OK')
            except Exception as e:
                print(f'GH ERR: {e}')
            "
            echo "Waiting 5 min for approval..."
            for i in $(seq 1 60); do
              sleep 5
              if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
                echo "LOGIN SUCCESS"
                kill $BG 2>/dev/null || true
                claude auth status
                exit 0
              fi
              [ $((i % 12)) -eq 0 ] && echo "Waiting $((i*5))s..."
            done
            kill $BG 2>/dev/null || true
            echo "TIMEOUT"
            exit 1
