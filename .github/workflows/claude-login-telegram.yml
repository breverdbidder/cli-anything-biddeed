name: Claude Login via Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture login URL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 14m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "Starting login"
            LOGFILE=/tmp/claude-login-out.txt
            rm -f $LOGFILE
            nohup script -q $LOGFILE -c "claude auth login" > /dev/null 2>&1 &
            BG=$!
            for i in $(seq 1 30); do
              sleep 1
              grep -q 'claude.ai/oauth' $LOGFILE 2>/dev/null && break
            done
            URL=$(grep -o 'https://claude.ai/oauth[^ ]*' $LOGFILE | head -1)
            if [ -z "$URL" ]; then
              echo "No URL"
              cat $LOGFILE
              kill $BG 2>/dev/null
              exit 1
            fi
            echo "Got URL (${#URL} chars)"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🔑 TAP LINK BELOW to log in Claude on Hetzner. You have 5 min.\"}"
            sleep 1
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${URL}\",\"disable_web_page_preview\":true}"
            echo "Sent to Telegram. Waiting 5 min..."
            for i in $(seq 1 60); do
              sleep 5
              if claude auth status 2>&1 | grep -q '"loggedIn": true'; then
                echo "LOGIN SUCCESS"
                kill $BG 2>/dev/null || true
                claude auth status
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"✅ Login successful! Deploying Explorer V2...\"}"
                exit 0
              fi
              [ $((i % 12)) -eq 0 ] && echo "Waiting... $((i*5))s"
            done
            kill $BG 2>/dev/null || true
            echo "TIMEOUT"
            exit 1
