name: SUMMIT — Understand-Anything Plugin Scan

# Dispatches a Claude Code session on Hetzner to run the Understand-Anything plugin
# against a target repo, then commits the resulting knowledge-graph.json back.
#
# Auth-gated: refuses to run if /root/.claude/.credentials.json is empty (OAuth dead).
# When auth is dead, the workflow exits with clear remediation steps and writes a
# failure beacon to ci_v65_event_log + annotates the summit_chat_dispatch row.
#
# Trigger paths:
#   1. Manual: workflow_dispatch with target_repo input
#   2. Programmatic: repository_dispatch event_type=summit_understand_anything
#                    with client_payload.{target_repo, dispatch_id}
#
# Cost profile: routes through Max-plan CC session on Hetzner (UNLIMITED).
# NEVER falls back to ANTHROPIC_API_KEY — that violates the R5 cost rule.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo to scan (e.g. breverdbidder/summit-trigger)'
        required: true
        type: string
      target_branch:
        description: 'Branch to scan'
        required: false
        type: string
        default: 'main'
      dispatch_id:
        description: 'Optional summit_chat_dispatch UUID to annotate on completion'
        required: false
        type: string
        default: ''
      max_budget_usd:
        description: 'Safety cap (ignored under Max-plan OAuth, used only if CC ever falls through to API)'
        required: false
        type: string
        default: '5'
  repository_dispatch:
    types:
      - summit_understand_anything

concurrency:
  group: hetzner-understand-${{ github.event.inputs.target_repo || github.event.client_payload.target_repo }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REPO: ${{ github.event.inputs.target_repo || github.event.client_payload.target_repo }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.event.client_payload.target_branch || 'main' }}
      DISPATCH_ID: ${{ github.event.inputs.dispatch_id || github.event.client_payload.dispatch_id || '' }}
      MAX_BUDGET_USD: ${{ github.event.inputs.max_budget_usd || github.event.client_payload.max_budget_usd || '5' }}
      HETZNER_IP: ${{ secrets.HETZNER_IP }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      EVEREST_GH_PAT: ${{ secrets.EVEREST_GH_PAT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          echo "SSH=ssh -i $HOME/.ssh/key -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}" >> $GITHUB_ENV
          echo "SCP=scp -i $HOME/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> $GITHUB_ENV

      - name: Validate target_repo input
        run: |
          if [ -z "$TARGET_REPO" ]; then
            echo "::error::target_repo input is required"
            exit 1
          fi
          if ! echo "$TARGET_REPO" | grep -qE '^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$'; then
            echo "::error::target_repo must be owner/repo format, got: $TARGET_REPO"
            exit 1
          fi
          echo "TARGET_SLUG=$(echo $TARGET_REPO | tr '/' '-')" >> $GITHUB_ENV

      - name: Gate — CC auth must be alive
        id: gate
        run: |
          set -eo pipefail
          # The credentials file must be > 0 bytes AND parse as JSON with a non-empty access token
          AUTH_STATUS=$($SSH "
            if [ ! -s /root/.claude/.credentials.json ]; then
              echo 'DEAD: credentials file empty or missing'
              exit 0
            fi
            if ! jq -e '.claudeAiOauth.accessToken // .accessToken // empty' /root/.claude/.credentials.json > /dev/null 2>&1; then
              echo 'DEAD: no access token in credentials'
              exit 0
            fi
            # Check expiry if present
            EXP=\$(jq -r '.claudeAiOauth.expiresAt // .expiresAt // empty' /root/.claude/.credentials.json 2>/dev/null)
            if [ -n \"\$EXP\" ] && [ \"\$EXP\" != 'null' ]; then
              NOW=\$(date +%s)
              EXP_S=\$((EXP / 1000))
              if [ \$NOW -gt \$EXP_S ]; then
                echo \"DEAD: token expired (exp=\$EXP_S now=\$NOW)\"
                exit 0
              fi
              REMAINING=\$((EXP_S - NOW))
              echo \"ALIVE: token valid for \$REMAINING seconds\"
            else
              echo 'ALIVE: token present (no expiry field)'
            fi
          ")
          echo "auth_status=$AUTH_STATUS"
          echo "auth_status=$AUTH_STATUS" >> $GITHUB_OUTPUT
          if echo "$AUTH_STATUS" | grep -q '^DEAD:'; then
            echo "::error::Claude Code OAuth auth is dead on Hetzner. Remediation:"
            echo "::error::  1. SSH into the box from Hetzner Cloud web console (works on phone browser)"
            echo "::error::  2. Run: tmux attach -t everest-agents  OR  tmux new -s cc-auth"
            echo "::error::  3. Run: claude auth login"
            echo "::error::  4. Open the printed URL in your phone browser, complete OAuth"
            echo "::error::  5. Token writes to /root/.claude/.credentials.json"
            echo "::error::  6. Re-fire this workflow"
            # Write beacon to ci_v65_event_log via pure shell (jq if available, else printf)
            if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              # JSON-escape AUTH_STATUS for safety
              AUTH_STATUS_J=$(printf '%s' "$AUTH_STATUS" | sed 's/\\/\\\\/g; s/"/\\"/g')
              DID_J=$([ -n "$DISPATCH_ID" ] && printf '"%s"' "$DISPATCH_ID" || printf 'null')
              RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              printf '{"signal_kind":"other","source":"summit_understand_anything_auth_gate","payload":{"severity":"BLOCK","reason":"cc_oauth_dead_on_hetzner","target_repo":"%s","dispatch_id":%s,"auth_status":"%s","workflow_run_url":"%s"}}' \
                "$TARGET_REPO" "$DID_J" "$AUTH_STATUS_J" "$RUN_URL" > /tmp/beacon.json
              curl -sS -X POST \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                -d "@/tmp/beacon.json" \
                -w "beacon http=%{http_code}\n" \
                "$SUPABASE_URL/rest/v1/ci_v65_event_log" || true
            fi
            if [ -n "$DISPATCH_ID" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              printf '%s' '{"state":"quarantined","quarantine_reason":"cc_oauth_dead_on_hetzner","quarantine_diagnosis":"Hetzner box healthy, CC binary present, network to api.anthropic.com works, but /root/.claude/.credentials.json is empty or expired. Requires interactive OAuth flow (phone browser sufficient).","quarantine_self_heal":"SSH into Hetzner Cloud web console, tmux attach -t everest-agents, claude auth login, complete OAuth in browser, re-fire workflow."}' > /tmp/quarantine.json
              curl -sS -X PATCH \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                -d "@/tmp/quarantine.json" \
                "$SUPABASE_URL/rest/v1/summit_chat_dispatch?id=eq.$DISPATCH_ID" || true
            fi
            exit 78  # exit code 78 = neutral skip (visible in run UI)
          fi
          echo "::notice::CC auth alive — proceeding with scan of $TARGET_REPO"

      - name: Ensure understand-anything plugin is cloned on Hetzner
        run: |
          $SSH '
            set -eo pipefail
            UA_DIR=/opt/understand-anything-plugin
            if [ -d "$UA_DIR/.git" ]; then
              echo "Plugin already cloned at $UA_DIR — pulling latest"
              cd "$UA_DIR" && git pull --ff-only origin main || true
            else
              echo "Cloning plugin from breverdbidder fork"
              mkdir -p /opt
              git clone --depth 1 https://github.com/breverdbidder/Understand-Anything.git "$UA_DIR"
            fi
            # Verify plugin manifest is present
            test -f "$UA_DIR/understand-anything-plugin/.claude-plugin/plugin.json" || { echo "::error::plugin.json missing"; exit 1; }
            ls -la "$UA_DIR/understand-anything-plugin/skills/" | head -20
          '

      - name: Clone target repo on Hetzner
        run: |
          $SSH "
            set -eo pipefail
            WORK_DIR=/tmp/ua-scan-$TARGET_SLUG-${{ github.run_id }}
            rm -rf \"\$WORK_DIR\"
            mkdir -p \"\$WORK_DIR\"
            cd \"\$WORK_DIR\"
            git clone --depth 1 --branch $TARGET_BRANCH https://x-access-token:${EVEREST_GH_PAT}@github.com/${TARGET_REPO}.git target
            cd target
            echo \"=== Cloned $TARGET_REPO @ \$(git rev-parse HEAD) ===\"
            find . -type f -not -path './.git/*' | wc -l | xargs echo 'file count:'
          "

      - name: Run understand-anything via headless Claude Code
        timeout-minutes: 35
        run: |
          $SSH "
            set -eo pipefail
            WORK_DIR=/tmp/ua-scan-$TARGET_SLUG-${{ github.run_id }}
            cd \"\$WORK_DIR/target\"
            echo '=== Starting /understand via claude -p (Max-plan OAuth) ==='
            unset ANTHROPIC_API_KEY
            export HOME=/root
            # --plugin-dir loads the plugin for this session only (no marketplace install needed)
            # --permission-mode bypassPermissions: skip the workspace trust dialog (safe per claude --help: 'Only use in directories you trust')
            # --max-budget-usd: safety cap — under OAuth this is ignored, under API fallback it caps spend
            # --output-format json: machine-parseable session output
            claude -p '/understand' \
              --plugin-dir /opt/understand-anything-plugin/understand-anything-plugin \
              --permission-mode bypassPermissions \
              --max-budget-usd ${MAX_BUDGET_USD} \
              --output-format json \
              2>&1 | tail -200 || {
                echo '::error::claude -p invocation failed'
                exit 1
              }
            # Verify outputs exist
            test -f .understand-anything/knowledge-graph.json || { echo '::error::knowledge-graph.json was not produced'; exit 1; }
            test -f .understand-anything/meta.json || { echo '::error::meta.json was not produced'; exit 1; }
            KG_SIZE=\$(stat -c%s .understand-anything/knowledge-graph.json)
            META_SIZE=\$(stat -c%s .understand-anything/meta.json)
            echo \"::notice::Scan complete. kg=\${KG_SIZE}b meta=\${META_SIZE}b\"
          "

      - name: Copy outputs back to runner
        run: |
          mkdir -p ./artifacts
          $SCP "root@${HETZNER_IP}:/tmp/ua-scan-${TARGET_SLUG}-${{ github.run_id }}/target/.understand-anything/knowledge-graph.json" ./artifacts/knowledge-graph.json
          $SCP "root@${HETZNER_IP}:/tmp/ua-scan-${TARGET_SLUG}-${{ github.run_id }}/target/.understand-anything/meta.json" ./artifacts/meta.json
          ls -la ./artifacts/
          echo "=== meta.json ==="
          cat ./artifacts/meta.json

      - name: Commit knowledge-graph.json + meta.json to target repo
        run: |
          set -eo pipefail
          for f in knowledge-graph.json meta.json; do
            B64=$(base64 -w0 ./artifacts/$f)
            # Check if file exists (PUT requires sha if updating)
            EXISTING_SHA=$(curl -sH "Authorization: Bearer $EVEREST_GH_PAT" \
              "https://api.github.com/repos/${TARGET_REPO}/contents/.understand-anything/${f}" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('sha',''))" 2>/dev/null || echo "")
            if [ -n "$EXISTING_SHA" ]; then
              SHA_PART=",\"sha\":\"$EXISTING_SHA\""
            else
              SHA_PART=""
            fi
            BODY=$(printf '{"message":"feat(.understand-anything): %s from real plugin run (CC on Hetzner via summit-understand-anything workflow run %s)","content":"%s","branch":"%s"%s}' \
              "$f" "${{ github.run_id }}" "$B64" "$TARGET_BRANCH" "$SHA_PART")
            RESULT=$(curl -sS -X PUT \
              -H "Authorization: Bearer $EVEREST_GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${TARGET_REPO}/contents/.understand-anything/${f}" \
              -d "$BODY")
            COMMIT_SHA=$(echo "$RESULT" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('commit',{}).get('sha') or 'ERR:'+str(d.get('message')))")
            echo "::notice::committed $f → $COMMIT_SHA"
            echo "${f}_COMMIT=$COMMIT_SHA" >> $GITHUB_ENV
          done

      - name: Annotate dispatch row on success
        if: success() && env.DISPATCH_ID != ''
        env:
          KG_COMMIT_VAL: ${{ env['knowledge-graph.json_COMMIT'] }}
          META_COMMIT_VAL: ${{ env['meta.json_COMMIT'] }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_ID_V="${{ github.run_id }}"
          printf '{"state":"closed","completed_at":"now()","delivery_proof":{"mode":"cc_on_hetzner_real_run","target_repo":"%s","target_branch":"%s","kg_commit":"%s","meta_commit":"%s","workflow_run_id":"%s","workflow_run_url":"%s","harness":"claude-code-headless-hetzner-oauth-maxplan"}}' \
            "$TARGET_REPO" "$TARGET_BRANCH" "$KG_COMMIT_VAL" "$META_COMMIT_VAL" "$RUN_ID_V" "$RUN_URL" > /tmp/annotate.json
          curl -sS -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "@/tmp/annotate.json" \
            "$SUPABASE_URL/rest/v1/summit_chat_dispatch?id=eq.$DISPATCH_ID" || echo "annotate failed (non-fatal)"

      - name: Cleanup workspace on Hetzner
        if: always()
        run: |
          $SSH "rm -rf /tmp/ua-scan-${TARGET_SLUG}-${{ github.run_id }}" || true

      - name: Failure beacon
        if: failure()
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then exit 0; fi
          curl -sS -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$(printf '{"signal_kind":"other","source":"summit_understand_anything_failure","payload":{"severity":"HIGH","target_repo":"%s","dispatch_id":%s,"workflow_run_id":"%s","workflow_run_url":"%s"}}' \
                "$TARGET_REPO" "$([ -n "$DISPATCH_ID" ] && printf '\"%s\"' "$DISPATCH_ID" || printf 'null')" "${{ github.run_id }}" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")" \
            "$SUPABASE_URL/rest/v1/ci_v65_event_log" || true
          if [ -n "$DISPATCH_ID" ]; then
            curl -sS -X PATCH \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"state":"quarantined","quarantine_reason":"workflow_failure","last_error":"summit-understand-anything workflow failed — see workflow_run_url in delivery_proof"}' \
              "$SUPABASE_URL/rest/v1/summit_chat_dispatch?id=eq.$DISPATCH_ID" || true
          fi
