name: "Duval C+D Parity — tier1 RealTDM sweep + certify"
# Fixes Duval C/D from 0% → 95%+ by:
#   1. Applying the duval_realtdm_parity migration (idempotent)
#   2. Scraping duval.realtdm.com → duval_realtdm_raw staging table
#   3. Running refresh_duval_parity_v1() (two-path join):
#        Path A: realforeclose_aids (county_slug='duval') → tier1_realforeclose_duval
#        Path B: duval_realtdm_raw  → tier1_realtdm_duval
#   4. Running gold_standard_loop() to recompute all 10 letters
#   5. Running gold_standard_certify() if pass_count=10
#   6. SQL VERIFICATION block (SHIP GATE compliance)
#
# Rules: cc-runner-ghonly.yml ONLY — no Hetzner, no local run.
# Supabase: mocerqjnksmhcjzxrewo
# Repo: breverdbidder/cli-anything-biddeed

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "RealTDM base URL (default duval.realtdm.com)"
        required: false
        default: "https://duval.realtdm.com"
      date_start:
        description: "MM/DD/YYYY sweep start (default 3yr back)"
        required: false
        default: ""
      date_stop:
        description: "MM/DD/YYYY sweep stop (default 1yr forward)"
        required: false
        default: ""

concurrency:
  group: duval-realtdm-parity
  cancel-in-progress: false

jobs:
  parity-fix:
    name: "Duval C/D Parity Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF:                       mocerqjnksmhcjzxrewo
      BASE_URL:                  ${{ github.event.inputs.base_url || 'https://duval.realtdm.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Step 1: Apply migration (idempotent via IF NOT EXISTS) ──────────────
      - name: "Apply 20260623_duval_realtdm_parity migration"
        run: |
          set -euo pipefail
          SQL=$(cat supabase/migrations/20260623_duval_realtdm_parity.sql)
          PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'query': open('supabase/migrations/20260623_duval_realtdm_parity.sql').read()}))")
          HTTP=$(curl -sS -o /tmp/mig.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Migration HTTP: $HTTP"
          cat /tmp/mig.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || \
            { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration applied OK"

      # ── Step 2: Check realauction_subdomains for Duval FQDN ─────────────────
      - name: "Resolve Duval RealTDM FQDN from realauction_subdomains"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          try:
              req = urllib.request.Request(
                  f"{SB}/rest/v1/realauction_subdomains"
                  f"?county_slug=eq.duval&select=base_url,platform&limit=5",
                  headers=H)
              with urllib.request.urlopen(req, timeout=15) as r:
                  rows = json.loads(r.read())
              if rows:
                  print(f"realauction_subdomains Duval: {rows}")
                  # Use first row's base_url if it looks like realtdm
                  for row in rows:
                      url = (row.get("base_url") or "").strip()
                      if "realtdm" in url.lower():
                          print(f"::notice::Found RealTDM URL in DB: {url}")
                          # Write to GH env so downstream step can use it
                          with open(os.environ.get("GITHUB_ENV", "/dev/null"), "a") as f:
                              f.write(f"BASE_URL={url}\n")
                          break
              else:
                  print("No realauction_subdomains row for Duval — using default BASE_URL")
          except Exception as e:
              print(f"realauction_subdomains lookup failed: {e} — using default BASE_URL")
          PYEOF

      # ── Step 3: Scrape duval.realtdm.com → duval_realtdm_raw ───────────────
      - name: "Scrape Duval RealTDM (wide range)"
        run: |
          python scripts/duval_realtdm_parity_sweep.py \
            "${{ github.event.inputs.date_start }}" \
            "${{ github.event.inputs.date_stop }}"
        continue-on-error: true  # endpoint may 404 if Duval is FC-only; Path A covers those

      # ── Step 4: Run refresh_duval_parity_v1() ───────────────────────────────
      - name: "refresh_duval_parity_v1() — two-path join"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          body = json.dumps({}).encode()
          req  = urllib.request.Request(f"{SB}/rest/v1/rpc/refresh_duval_parity_v1",
                                        data=body, headers=H, method="POST")
          with urllib.request.urlopen(req, timeout=120) as r:
              result = json.loads(r.read())
          print(f"refresh_duval_parity_v1 result: {result}")

          total = sum(row.get("rows_updated", 0) for row in result if isinstance(row, dict))
          print(f"Total rows updated: {total}")
          if total == 0:
              print("::warning::0 rows updated — check realforeclose_aids population and case_number formats")
          PYEOF

      # ── Step 5: Run gold_standard_loop() ────────────────────────────────────
      - name: "Run gold_standard_loop()"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          body = json.dumps({}).encode()
          req  = urllib.request.Request(f"{SB}/rest/v1/rpc/gold_standard_loop",
                                        data=body, headers=H, method="POST")
          with urllib.request.urlopen(req, timeout=300) as r:
              result = r.read().decode()
          print(f"gold_standard_loop: {result[:500]}")
          PYEOF

      # ── Step 6: Verify C/D via gold_standard_scoreboard ─────────────────────
      - name: "Verify C/D on gold_standard_scoreboard"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          req = urllib.request.Request(
              f"{SB}/rest/v1/gold_standard_scoreboard"
              f"?county_slug=eq.duval&select=c_parity_clean,d_parity_any,pass_count,evaluated_at",
              headers=H)
          with urllib.request.urlopen(req, timeout=30) as r:
              rows = json.loads(r.read())

          if not rows:
              print("::error::No scoreboard row for Duval — gold_standard_loop may not have run")
              sys.exit(1)

          row = rows[0]
          c_pass = row.get("c_parity_clean", False)
          d_pass = row.get("d_parity_any",   False)
          passes = row.get("pass_count",     0)
          print(f"Duval scoreboard: C={c_pass} D={d_pass} pass_count={passes} at {row.get('evaluated_at')}")

          if not c_pass or not d_pass:
              print(f"::warning::C/D not both PASS yet (c={c_pass} d={d_pass}). Running pencil_dod for detail...")
              body = json.dumps({"county_slug_arg": "duval"}).encode()
              req2 = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/pencil_dod_evaluate_county",
                  data=body,
                  headers={**H, "Content-Type": "application/json"},
                  method="POST")
              with urllib.request.urlopen(req2, timeout=30) as r2:
                  detail = json.loads(r2.read())
              for row in detail:
                  if row.get("letter") in ("C","D"):
                      print(f"  {row['letter']}: pass={row['pass']} metric={row['metric']} | {row['detail']}")
          PYEOF

      # ── Step 7: Run gold_standard_certify() if pass_count=10 ────────────────
      - name: "Run gold_standard_certify()"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          # Check pass_count first
          req = urllib.request.Request(
              f"{SB}/rest/v1/gold_standard_scoreboard"
              f"?county_slug=eq.duval&select=pass_count",
              headers=H)
          with urllib.request.urlopen(req, timeout=15) as r:
              rows = json.loads(r.read())
          pass_count = rows[0]["pass_count"] if rows else 0

          if pass_count < 10:
              print(f"pass_count={pass_count} — skipping certify (need 10/10 first)")
              sys.exit(0)

          # Run certify
          body = json.dumps({}).encode()
          req2 = urllib.request.Request(
              f"{SB}/rest/v1/rpc/gold_standard_certify",
              data=body,
              headers={**H, "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req2, timeout=120) as r2:
              result = r2.read().decode()
          print(f"gold_standard_certify: {result[:500]}")
          PYEOF

      # ── Step 8: SQL VERIFICATION (SHIP GATE compliance) ─────────────────────
      - name: "SQL VERIFICATION"
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}
          now_utc = datetime.now(timezone.utc).isoformat()

          def get(path):
              req = urllib.request.Request(f"{SB}/rest/v1/{path}", headers=H)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          # Parity source breakdown
          parity = get("multi_county_auctions?county=eq.duval"
                       "&select=parity_source,parity_status"
                       "&limit=1000")
          from collections import Counter
          src_counts  = Counter(r.get("parity_source") for r in parity)
          stat_counts = Counter(r.get("parity_status") for r in parity)

          # Gold standard scoreboard
          score = get("gold_standard_scoreboard?county_slug=eq.duval"
                      "&select=c_parity_clean,d_parity_any,pass_count,evaluated_at")

          # Certifications
          try:
              cert = get("gold_standard_certifications?county_slug=eq.duval"
                         "&select=certified,consecutive_gold,certified_at&limit=1")
          except Exception:
              cert = []

          print("\n### SQL VERIFICATION")
          print(f"Timestamp UTC: {now_utc}")
          print(f"\nSELECT parity_source, COUNT(*) FROM multi_county_auctions WHERE county='duval' GROUP BY 1:")
          for src, n in sorted(src_counts.items(), key=lambda x: -x[1]):
              print(f"  {src}: {n}")
          print(f"\nSELECT parity_status, COUNT(*) FROM multi_county_auctions WHERE county='duval' GROUP BY 1:")
          for st, n in sorted(stat_counts.items(), key=lambda x: -x[1]):
              print(f"  {st}: {n}")
          matched_clean = stat_counts.get("matched_clean", 0)
          total         = sum(stat_counts.values())
          print(f"\nmatched_clean={matched_clean} / total={total}  "
                f"({matched_clean*100//total if total else 0}%)")
          if score:
              s = score[0]
              print(f"\ngold_standard_scoreboard (duval): C={s['c_parity_clean']} "
                    f"D={s['d_parity_any']} pass_count={s['pass_count']}")
          if cert:
              c = cert[0]
              print(f"gold_standard_certifications (duval): certified={c.get('certified')} "
                    f"consecutive_gold={c.get('consecutive_gold')}")
          PYEOF
