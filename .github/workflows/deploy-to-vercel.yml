name: Deploy docs to Vercel

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Vercel project name (creates if missing)'
        required: false
        default: 'biddeed-demo'

concurrency:
  group: deploy-to-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy /docs to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -e
          cd docs
          # Initialize project config (creates new project if needed)
          cat > vercel.json <<JSON
          {
            "cleanUrls": false,
            "trailingSlash": false
          }
          JSON
          # Deploy as production with auto-confirm
          DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --name="$PROJECT_NAME" 2>&1 | tee /tmp/deploy.log | tail -1)
          echo "Deploy URL: $DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          # Also try to get prod alias
          cat /tmp/deploy.log
      - name: Patch URL back to Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          python3 -c "
          import os, httpx, json
          url = os.environ['DEPLOY_URL']
          httpx.post(f\"{os.environ['SB_URL']}/rest/v1/_csv_exports\",
            headers={'apikey': os.environ['SB_KEY'], 'Authorization': f\"Bearer {os.environ['SB_KEY']}\", 'Content-Type':'application/json'},
            json={'filename':'vercel_deploy_marker', 'csv_content': url, 'uploaded_url': url, 'csv_bytes': len(url)})
          print(f'Stored: {url}')
          "
