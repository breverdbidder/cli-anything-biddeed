name: Check CF Token Zone Scope

on:
  workflow_dispatch: {}

jobs:
  check-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token
        run: >
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify"
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          -H "Content-Type: application/json"

      - name: List zones visible to token raw
        run: >
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones?per_page=50"
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          -H "Content-Type: application/json"

      - name: Direct lookup for zonewise.ai
        run: >
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai"
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          -H "Content-Type: application/json"
