name: "CLERK-SSOT: Daily Parity Check"
on:
  schedule:
    - cron: "0 9 * * *"  # 05:00 ET, ahead of the 11:05 UTC digest send
  workflow_dispatch: {}

concurrency:
  group: clerk-ssot-parity
  cancel-in-progress: false

jobs:
  parity:
    name: "Clerk SSOT parity sweep"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx beautifulsoup4 lxml pypdf playwright
      - run: playwright install --with-deps chromium  # union.py needs a real browser to pass Cloudflare's managed challenge
      - name: "Run parity sweep"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/clerk_ssot/run_parity.py
