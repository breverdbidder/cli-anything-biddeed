name: Copy Secrets to Claude Chamber

on:
  repository_dispatch:
    types: [copy-secrets-chamber]

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install pynacl requests

      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, requests
          from nacl import encoding, public

          def encrypt_secret(pk, val):
              k = public.PublicKey(pk.encode("utf-8"), encoding.Base64Encoder())
              return base64.b64encode(public.SealedBox(k).encrypt(val.encode("utf-8"))).decode("utf-8")

          token = os.environ["GH_TOKEN"]
          repo = "breverdbidder/claude-chamber"
          h = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}
          r = requests.get(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=h)
          pk = r.json()

          for name in ["HETZNER_SSH_KEY","HETZNER_PASSWORD","CLAUDE_OAUTH_B64","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","SUPABASE_URL"]:
              val = os.environ.get(name, "")
              if not val:
                  print(f"SKIP {name}")
                  continue
              enc = encrypt_secret(pk["key"], val)
              r = requests.put(f"https://api.github.com/repos/{repo}/actions/secrets/{name}", headers=h, json={"encrypted_value": enc, "key_id": pk["key_id"]})
              print(f"{'OK' if r.status_code in (201,204) else f'FAIL({r.status_code})'} {name}")

          # Also copy SUPABASE_KEY as SUPABASE_SERVICE_KEY
          val = os.environ.get("SUPABASE_KEY", "")
          if val:
              enc = encrypt_secret(pk["key"], val)
              r = requests.put(f"https://api.github.com/repos/{repo}/actions/secrets/SUPABASE_SERVICE_KEY", headers=h, json={"encrypted_value": enc, "key_id": pk["key_id"]})
              print(f"{'OK' if r.status_code in (201,204) else f'FAIL({r.status_code})'} SUPABASE_SERVICE_KEY")
          PYEOF
