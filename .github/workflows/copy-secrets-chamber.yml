name: Copy Secrets to Claude Chamber

on:
  repository_dispatch:
    types: [copy-secrets-chamber]

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install pynacl requests

      - name: Copy secrets to claude-chamber
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, requests
          from nacl import encoding, public

          def encrypt_secret(public_key, secret_value):
              pk = public.PublicKey(public_key.encode("utf-8"), encoding.Base64Encoder())
              sealed = public.SealedBox(pk).encrypt(secret_value.encode("utf-8"))
              return base64.b64encode(sealed).decode("utf-8")

          token = os.environ["GH_TOKEN"]
          repo = "breverdbidder/claude-chamber"
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

          r = requests.get(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers)
          pk_data = r.json()
          pub_key = pk_data["key"]
          key_id = pk_data["key_id"]

          secrets = {
              "HETZNER_SSH_KEY": os.environ.get("HETZNER_SSH_KEY", ""),
              "CLAUDE_OAUTH_B64": os.environ.get("CLAUDE_OAUTH_B64", ""),
              "TELEGRAM_BOT_TOKEN": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              "TELEGRAM_CHAT_ID": os.environ.get("TELEGRAM_CHAT_ID", ""),
              "SUPABASE_URL": os.environ.get("SUPABASE_URL", ""),
              "SUPABASE_SERVICE_KEY": os.environ.get("SUPABASE_KEY", ""),
          }

          for name, value in secrets.items():
              if not value:
                  print(f"SKIP {name} (empty)")
                  continue
              enc = encrypt_secret(pub_key, value)
              r = requests.put(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  headers=headers,
                  json={"encrypted_value": enc, "key_id": key_id}
              )
              s = "OK" if r.status_code in (201, 204) else f"FAIL({r.status_code})"
              print(f"{s} {name}")
          PYEOF
