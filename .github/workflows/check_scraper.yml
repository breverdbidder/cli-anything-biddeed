name: Check Scraper
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HETZNER_IP \
            'grep -E "^class |^def |^async def " /opt/brevard-bidder-scraper/src/scrapers/acclaimweb_scraper.py | head -30; echo ---; ls /opt/brevard-bidder-scraper/src/scrapers/'
