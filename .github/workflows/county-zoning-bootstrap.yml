name: "County Zoning Bootstrap — G/I Criteria"
# Beta-launch campaign issue #8144
# Phase 2: seeds zoning_jurisdiction_xwalk + zoning_source_map, then
# runs zoning-extract.yml to populate zoning_codes_staging for criterion G.
# Must run AFTER county-outcome-harvest.yml (B/C/D/F/H) for the same county.

on:
  workflow_dispatch:
    inputs:
      county:
        description: 'County slug (sarasota|palm_beach|broward|orange|volusia)'
        required: true
        type: choice
        options:
          - sarasota
          - palm_beach
          - broward
          - orange
          - volusia
      skip_discovery:
        description: 'Skip Firecrawl nodeId discovery (use placeholder node_hints)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      dry_run:
        description: 'Dry run: seed source_map but do not run zoning extractor'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: county-zoning-bootstrap-${{ github.event.inputs.county }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: "Bootstrap ${{ github.event.inputs.county }} zoning → G/I"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      COUNTY: ${{ github.event.inputs.county }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip

      # ── Phase 1: Seed zoning_jurisdiction_xwalk + zoning_source_map ────────
      - name: Seed source map (Municode discovery)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY:         ${{ secrets.FIRECRAWL_API_KEY }}
          COUNTY:                    ${{ env.COUNTY }}
        run: |
          SKIP="${{ github.event.inputs.skip_discovery }}"
          if [ "$SKIP" = "true" ]; then
            # Run without Firecrawl (all nodeIds will be DISCOVERY_PENDING)
            FIRECRAWL_API_KEY="" python scripts/municode_discovery.py
          else
            python scripts/municode_discovery.py
          fi

      # ── Phase 2: Run zoning extractor for the county ────────────────────────
      - name: Run zoning extractor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL || secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching zoning-extract.yml for ${{ env.COUNTY }}..."
          gh workflow run zoning-extract.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field county=${{ env.COUNTY }} \
            2>&1 || echo "Dispatch failed — may need manual trigger after node_hints are populated"

      # ── Phase 3: Verify source map seeded ───────────────────────────────────
      - name: Verify source map
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          CTY = os.environ.get('COUNTY', '')
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          COUNTY_MAP = {
              "sarasota": "Sarasota", "palm_beach": "Palm Beach",
              "broward": "Broward", "orange": "Orange", "volusia": "Volusia"
          }
          display = COUNTY_MAP.get(CTY, CTY)

          url = f"{SB}/rest/v1/zoning_source_map?county=eq.{display}&select=assignment_jurisdiction,node_hint,platform"
          req = urllib.request.Request(url, headers=H)
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  rows = json.loads(r.read())
              print(f"\nzoning_source_map for {CTY} ({display}):")
              for r in rows:
                  pending = " ⚠️ PENDING" if r.get("node_hint") == "DISCOVERY_PENDING" else ""
                  print(f"  {r['assignment_jurisdiction']}: node_hint={r.get('node_hint')}{pending}")
              pending_count = sum(1 for r in rows if r.get("node_hint") == "DISCOVERY_PENDING")
              if pending_count > 0:
                  print(f"\n⚠️ {pending_count} jurisdictions have DISCOVERY_PENDING node_hints.")
                  print("   Manually inspect Municode and update node_hint before running zoning extractor.")
              else:
                  print(f"\n✅ All {len(rows)} jurisdictions have node_hints — zoning extractor is ready.")
          except Exception as e:
              print(f"Error checking source_map: {e}")
          PYEOF

      # ── Phase 4: Promote staged zoning codes if gated=true rows exist ───────
      - name: Promote gated zoning codes (if any)
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          CTY = os.environ.get('COUNTY', '')
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          # Check for gated=true rows in staging
          url = f"{SB}/rest/v1/zoning_codes_staging?county=eq.{CTY}&gated=eq.true&select=id&limit=1"
          req = urllib.request.Request(url, headers=H)
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  rows = json.loads(r.read())
              if not rows:
                  print(f"No gated=true rows in zoning_codes_staging for {CTY} — skipping promotion")
              else:
                  print(f"Found gated=true rows — calling promote_gated_zoning_codes('{CTY}')...")
                  body = json.dumps({"county_arg": CTY}).encode()
                  req2 = urllib.request.Request(
                      f"{SB}/rest/v1/rpc/promote_gated_zoning_codes",
                      data=body, headers=H, method="POST"
                  )
                  with urllib.request.urlopen(req2, timeout=60) as r:
                      result = json.loads(r.read())
                  print(f"Promotion result: {result}")
          except Exception as e:
              print(f"Promotion check failed (non-critical): {e}")
          PYEOF

      # ── Phase 5: Check G criterion after extraction ──────────────────────────
      - name: Verify G criterion
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone
          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          CTY = os.environ.get('COUNTY', '')
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          result = None
          try:
              body = json.dumps({"county_slug_arg": CTY}).encode()
              req  = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/pencil_dod_evaluate_county",
                  data=body, headers=H, method="POST"
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  result = json.loads(r.read())
          except Exception as e:
              print(f"Could not evaluate {CTY}: {e}")

          now = datetime.now(timezone.utc).isoformat() + "Z"
          print(f"\n### G/I VERIFICATION — {CTY.upper()} — {now}")
          if result:
              for row in result:
                  letter = (row.get("letter") or "").upper()
                  if letter in ("G", "I"):
                      is_pass = row.get("pass", False)
                      print(f"  {letter}: {'PASS ✅' if is_pass else 'FAIL ❌'}  metric={row.get('metric')}  detail={row.get('detail')}")
          PYEOF
