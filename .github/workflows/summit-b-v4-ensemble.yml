name: SUMMIT-B V4 — Stacked Ensemble Training

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install xgboost lightgbm catboost scikit-learn numpy pandas requests -q
      - name: Train V4 ensemble
        run: python scripts/train_v4_ensemble.py
