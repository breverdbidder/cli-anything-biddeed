name: "Autoloop: Overnight Skill Self-Improvement (Hetzner)"

on:
  # ---------------------------------------------------------------------
  # NIGHTLY SCHEDULE DISABLED 2026-08-20 (approved by Ariel).
  # Reason: this ran an ungoverned Claude Code session on Max OAuth every
  # night — up to 170 min / 50 iterations with --dangerously-skip-permissions
  # and no quota gate. It is the largest uncontrolled consumer of the weekly
  # subscription limit. It was also SSH-dependent on Hetzner 87.99.129.125,
  # whose sshd has been down since ~Aug 10 (runs Aug 18/19/20 all failed).
  # To restore: rebuild GHA-only and gate on quota_gate_check('engineering').
  # schedule:
  #   - cron: '0 7 * * *'  # 2 AM EST = 7 AM UTC
  # ---------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      skill:
        description: 'Which skill to improve'
        required: true
        type: choice
        options:
          - zonewise
          - auction
          - reports
          - enricher
          - forecaster
          - trendpredictor
          - sitemanager
          - projecttracker
          - zonewise-scraper
          - cost-discipline
          - honesty-protocol
          - brand-colors
          - ship-gate
          - designwise
          - exa-discovery
          - skill-creator
      max_iterations:
        description: 'Max iterations (default 50)'
        required: false
        default: '50'
      dry_run:
        description: 'Dry run (baseline only, no Claude Code loop)'
        required: false
        type: boolean
        default: false
      l3:
        description: 'Run L3 post-execution analyzer after eval'
        required: false
        type: boolean
        default: false

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed
  DEFAULT_SKILL: zonewise

jobs:
  autoloop:
    name: "🔄 Autoloop: ${{ github.event.inputs.skill || 'zonewise' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Determine skill
        id: config
        run: |
          SKILL="${{ github.event.inputs.skill || env.DEFAULT_SKILL }}"
          MAX="${{ github.event.inputs.max_iterations || '50' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          echo "skill=$SKILL" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          echo "dry=$DRY" >> $GITHUB_OUTPUT
          echo "🎯 Skill: $SKILL | Max: $MAX | Dry: $DRY"

      - name: "1️⃣ Preflight"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            SKILL="${{ steps.config.outputs.skill }}"
            rm -f /tmp/autoloop_auth_status.txt

            # Ensure repo exists (auto-clone if missing)
            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              echo "📥 Repo not found — cloning..."
              git clone https://github.com/breverdbidder/cli-anything-biddeed.git ${{ env.REPO_PATH }}
            fi

            # Sync to remote — reset handles case where prior push failed leaving local ahead
            cd ${{ env.REPO_PATH }}
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -1

            # Verify Claude Code
            command -v claude &>/dev/null || { echo "❌ Claude Code missing"; npm install -g @anthropic-ai/claude-code; }
            claude --version 2>/dev/null || true

            # Resolve eval path: Platform Skills (.claude/skills/) vs legacy harness skills
            if [ -f "${{ env.REPO_PATH }}/.claude/skills/$SKILL/eval.json" ]; then
              EVAL_FILE="${{ env.REPO_PATH }}/.claude/skills/$SKILL/eval.json"
              EVAL_OUT_DIR="${{ env.REPO_PATH }}/.claude/skills/$SKILL/eval_outputs"
            else
              EVAL_FILE="${{ env.REPO_PATH }}/$SKILL/eval/eval.json"
              EVAL_OUT_DIR="${{ env.REPO_PATH }}/$SKILL/eval_outputs"
            fi

            test -f "$EVAL_FILE" || { echo "❌ Missing eval.json at $EVAL_FILE"; exit 1; }
            test -f "${{ env.REPO_PATH }}/scripts/eval_runner.py" || { echo "❌ Missing eval_runner.py"; exit 1; }
            mkdir -p "$EVAL_OUT_DIR"

            python3 --version
            echo "✅ Preflight: $SKILL ready (eval: $EVAL_FILE)"

      - name: "2️⃣ Baseline eval"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            TS=$(date +%Y%m%d_%H%M%S)

            # Resolve eval path: Platform Skills vs legacy harness skills
            if [ -f ".claude/skills/$SKILL/eval.json" ]; then
              EVAL_FILE=".claude/skills/$SKILL/eval.json"
              EVAL_OUT_DIR=".claude/skills/$SKILL/eval_outputs"
              BASELINE_OUT=".claude/skills/$SKILL/eval_outputs/baseline_${TS}.json"
            else
              EVAL_FILE="$SKILL/eval/eval.json"
              EVAL_OUT_DIR="$SKILL/eval_outputs"
              BASELINE_OUT="$SKILL/eval/baseline_${TS}.json"
            fi
            mkdir -p "$EVAL_OUT_DIR"

            python3 scripts/eval_runner.py \
              --eval-file "$EVAL_FILE" \
              --outputs-dir "$EVAL_OUT_DIR/" \
              --output "$BASELINE_OUT" 2>&1 || true

            if [ -f "$BASELINE_OUT" ]; then
              python3 -c "import json; d=json.load(open('$BASELINE_OUT')); print(f'📊 Baseline: {d[\"summary\"][\"score_pct\"]}')"
            else
              echo "📊 Baseline: first run (no prior outputs)"
            fi

      - name: "3️⃣ Autoloop — Claude Code auto-mode"
        if: steps.config.outputs.dry != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 170m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            MAX="${{ steps.config.outputs.max }}"

            # Resolve SKILL.md and eval paths: Platform Skills vs legacy harness
            if [ -f ".claude/skills/$SKILL/SKILL.md" ]; then
              SKILL_MD=".claude/skills/$SKILL/SKILL.md"
              EVAL_FILE=".claude/skills/$SKILL/eval.json"
              EVAL_OUT_DIR=".claude/skills/$SKILL/eval_outputs"
            else
              case "$SKILL" in
                zonewise) SKILL_MD="zonewise/agent-harness/ZONEWISE.md" ;;
                auction)  SKILL_MD="auction/agent-harness/AUCTION.md" ;;
                reports)  SKILL_MD="reports/REPORTS.md" ;;
                enricher) SKILL_MD="enricher/CLAUDE.md" ;;
                forecaster) SKILL_MD="forecaster/CLAUDE.md" ;;
                trendpredictor) SKILL_MD="trendpredictor/CLAUDE.md" ;;
                sitemanager) SKILL_MD="sitemanager/CLAUDE.md" ;;
                projecttracker) SKILL_MD="projecttracker/CLAUDE.md" ;;
                *) echo "❌ Unknown skill: $SKILL"; exit 1 ;;
              esac
              EVAL_FILE="$SKILL/eval/eval.json"
              EVAL_OUT_DIR="$SKILL/eval_outputs"
            fi
            mkdir -p "$EVAL_OUT_DIR"

            read -r -d '' PROMPT << 'LOOPEOF'
            Run a self-improvement loop on the SKILL_PLACEHOLDER skill (SKILLMD_PLACEHOLDER).

            Eval file: EVALFILE_PLACEHOLDER
            Eval runner: python scripts/eval_runner.py --eval-file EVALFILE_PLACEHOLDER --outputs-dir EVALOUT_PLACEHOLDER/

            For each iteration:
            1. Run the skill against all 5 test prompts in eval.json
            2. Save outputs to SKILL_PLACEHOLDER/eval_outputs/{test_id}.json (and .docx for report tests)
            3. Run eval_runner.py and read the score
            4. If any assertions fail, make ONE targeted change to SKILLMD_PLACEHOLDER to fix the failure
            5. Re-run the tests and re-score
            6. If score improved: git add -A && git commit -m "autoloop(SKILL_PLACEHOLDER): {old}% -> {new}% [{assertion}]" && git push origin main
            7. If score dropped: git checkout -- SKILLMD_PLACEHOLDER and try a DIFFERENT change
            8. Log each iteration as JSON line to SKILL_PLACEHOLDER/eval/autoloop_log.jsonl

            RULES:
            - ONE change per iteration to isolate improvements
            - Never stop. Never ask. The human is asleep. You are autonomous
            - If stuck 5x on same assertion, skip to next failure
            - Maximum MAX_PLACEHOLDER iterations
            - git push after every successful commit
            - If context hits 50%, checkpoint to SKILL_PLACEHOLDER/eval/autoloop_checkpoint.json and stop
            LOOPEOF

            PROMPT="${PROMPT//SKILL_PLACEHOLDER/$SKILL}"
            PROMPT="${PROMPT//SKILLMD_PLACEHOLDER/$SKILL_MD}"
            PROMPT="${PROMPT//EVALFILE_PLACEHOLDER/$EVAL_FILE}"
            PROMPT="${PROMPT//EVALOUT_PLACEHOLDER/$EVAL_OUT_DIR}"
            PROMPT="${PROMPT//MAX_PLACEHOLDER/$MAX}"

            PROMPT_FILE="/tmp/autoloop_prompt.txt"
            echo "$PROMPT" > $PROMPT_FILE
            LOG="$EVAL_OUT_DIR/autoloop_session_$(date +%Y%m%d_%H%M%S).log"

            echo "🚀 Autoloop: $SKILL | Max: $MAX | $(date)"
            IS_SANDBOX=1 claude -p "$(cat $PROMPT_FILE)" --dangerously-skip-permissions 2>&1 | tee "$LOG" || true
            echo "⏰ Done: $(date)"

            # Detect a dead session (e.g. expired OAuth) so this doesn't silently
            # report success while doing zero real work — see skill-audit #15144.
            AUTH_STATUS="ok"
            if grep -qiE "OAuth access token has expired|Failed to authenticate|authentication_error" "$LOG" 2>/dev/null; then
              AUTH_STATUS="auth_expired"
              echo "🔴 Claude Code auth failed this session — 0 real iterations ran"
            fi
            echo "$AUTH_STATUS" > /tmp/autoloop_auth_status.txt

            # Push final state (use PAT so push succeeds and next run's fetch is clean)
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
            git add -A
            git diff --cached --quiet || { git commit -m "autoloop($SKILL): session complete $(date +%Y%m%d)"; git push origin main; } || true

            [ "$AUTH_STATUS" = "auth_expired" ] && exit 1 || true

      - name: "4️⃣ Results + Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            TS=$(date +%Y%m%d_%H%M%S)

            # Resolve eval path: Platform Skills vs legacy harness skills
            if [ -f ".claude/skills/$SKILL/eval.json" ]; then
              EVAL_FILE=".claude/skills/$SKILL/eval.json"
              EVAL_OUT_DIR=".claude/skills/$SKILL/eval_outputs"
              FINAL_OUT=".claude/skills/$SKILL/eval_outputs/final_${TS}.json"
              LOG_FILE=".claude/skills/$SKILL/eval_outputs/autoloop_log.jsonl"
            else
              EVAL_FILE="$SKILL/eval/eval.json"
              EVAL_OUT_DIR="$SKILL/eval_outputs"
              FINAL_OUT="$SKILL/eval/final_${TS}.json"
              LOG_FILE="$SKILL/eval/autoloop_log.jsonl"
            fi
            mkdir -p "$EVAL_OUT_DIR"

            python3 scripts/eval_runner.py \
              --eval-file "$EVAL_FILE" \
              --outputs-dir "$EVAL_OUT_DIR/" \
              --output "$FINAL_OUT" 2>&1 || true

            SCORE="n/a"
            [ -f "$FINAL_OUT" ] && SCORE=$(python3 -c "import json; d=json.load(open('$FINAL_OUT')); print(d['summary']['score_pct'])" 2>/dev/null || echo "n/a")

            ITERS=0
            [ -f "$LOG_FILE" ] && ITERS=$(wc -l < "$LOG_FILE")
            COMMITS=$(git log --oneline --since="12 hours ago" --grep="autoloop" 2>/dev/null | wc -l)

            echo "📊 Score: $SCORE | Iterations: $ITERS | Commits: $COMMITS"

            AUTH_STATUS=$(cat /tmp/autoloop_auth_status.txt 2>/dev/null || echo "unknown")
            if [ "$AUTH_STATUS" = "auth_expired" ]; then
              TEXT="🔴 AUTOLOOP BROKEN — Claude Code OAuth expired on Hetzner%0A%0ASkill: $SKILL%0AZero real iterations ran (auth failure, not a skill issue)%0AFix: run 'claude /login' on 87.99.129.125 — Ariel-only, cannot be auto-rotated%0ABaseline score shown ($SCORE) is stale, not a live re-eval"
            else
              TEXT="🔄 Autoloop Complete%0A%0ASkill: $SKILL%0AScore: $SCORE%0AIterations: $ITERS%0ACommits: $COMMITS%0AServer: Hetzner"
            fi

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$TEXT" \
              > /dev/null 2>&1 || true

      - name: "5️⃣ Evolution V2 — LLM Patch on Score Drop"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            TS=$(date +%Y%m%d_%H%M%S)

            # Resolve paths
            if [ -f ".claude/skills/$SKILL/eval.json" ]; then
              EVAL_FILE=".claude/skills/$SKILL/eval.json"
              EVAL_OUT_DIR=".claude/skills/$SKILL/eval_outputs"
            else
              EVAL_FILE="$SKILL/eval/eval.json"
              EVAL_OUT_DIR="$SKILL/eval_outputs"
            fi

            # Find latest session log and baseline score
            SESSION_LOG=$(ls -t "$EVAL_OUT_DIR"/autoloop_session_*.log 2>/dev/null | head -1 || echo "")
            BASELINE_FILE=$(ls -t "$EVAL_OUT_DIR"/baseline_*.json 2>/dev/null | head -1 || echo "")
            FINAL_FILE=$(ls -t "$EVAL_OUT_DIR"/final_*.json 2>/dev/null | head -1 || echo "")

            SCORE_BEFORE="0.0"
            if [ -n "$BASELINE_FILE" ]; then
              SCORE_BEFORE=$(python3 -c "import json; d=json.load(open('$BASELINE_FILE')); print(d['summary']['score'])" 2>/dev/null || echo "0.0")
            fi

            CURRENT_EVAL="$EVAL_OUT_DIR/evo_check_${TS}.json"
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            python3 scripts/eval_runner.py \
              --eval-file "$EVAL_FILE" \
              --outputs-dir "$EVAL_OUT_DIR/" \
              --output "$CURRENT_EVAL" \
              --evolve \
              --score-before "$SCORE_BEFORE" \
              ${SESSION_LOG:+--session-log "$SESSION_LOG"} \
              2>&1 || true

            echo "✅ Evolution V2 step complete"

      - name: "6️⃣ L3 Post-Execution Analyzer (optional)"
        if: ${{ github.event.inputs.l3 == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            RUN_ID="autoloop_$(date +%Y%m%d_%H%M%S)"
            TS=$(date +%Y%m%d_%H%M%S)

            # Resolve SKILL.md path: platform skill or harness skill
            if [ -f ".claude/skills/$SKILL/SKILL.md" ]; then
              SKILL_MD=".claude/skills/$SKILL/SKILL.md"
              EVAL_FILE=".claude/skills/$SKILL/eval.json"
            else
              SKILL_MD="$SKILL/agent-harness/${SKILL^^}.md"
              EVAL_FILE="$SKILL/eval/eval.json"
            fi

            # Use latest final eval output or re-run baseline
            FINAL=$(ls -t "$SKILL/eval/final_"*.json 2>/dev/null | head -1 || true)
            if [ -z "$FINAL" ]; then
              FINAL="$SKILL/eval/l3_baseline_${TS}.json"
              python3 scripts/eval_runner.py \
                --eval-file "$EVAL_FILE" \
                --outputs-dir "$SKILL/eval_outputs/" \
                --output "$FINAL" 2>&1 || true
            fi

            L3_OUT="$SKILL/eval/l3_analysis_${TS}.json"

            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            python3 scripts/l3_analyze.py \
              --skill "$SKILL" \
              --skill-md "$SKILL_MD" \
              --eval-results "$FINAL" \
              --run-id "$RUN_ID" \
              --output "$L3_OUT" 2>&1 || true

            echo "📊 L3 Analysis: $L3_OUT"
            [ -f "$L3_OUT" ] && python3 -c "import json,sys; d=json.load(open('$L3_OUT')); a=d.get('analysis',{}); evo=a.get('evolution_suggestion'); print(f\"L3: pass_rate={d['pass_rate']:.0%} | completed={a.get('task_completed')} | evo={evo['type'] if evo else 'none'}\"); evo and print(f\"Direction: {evo.get('direction','\"\")}\")" 2>/dev/null || true

            # Commit L3 analysis file
            git add "$L3_OUT" 2>/dev/null || true
            git diff --cached --quiet || git commit -m "autoloop-l3($SKILL): analysis $RUN_ID" && git push origin main || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Autoloop — ${{ steps.config.outputs.skill }}
          **Server:** Hetzner everest-dispatch
          **Max Iterations:** ${{ steps.config.outputs.max }}
          **Dry Run:** ${{ steps.config.outputs.dry }}
          **L3 Analyzer:** ${{ github.event.inputs.l3 || 'false' }}
          Check Telegram for final scores.
          EOF
