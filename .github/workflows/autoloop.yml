name: "Evolutionary Skill Loop"

on:
  schedule:
    - cron: '0 7 * * *'  # 2 AM EST nightly
  workflow_dispatch:
    inputs:
      skill_name:
        description: 'Skill to optimize'
        required: true
        type: choice
        options:
          - zonewise
          - auction
          - reports
          - enricher
          - forecaster
          - trendpredictor
          - sitemanager
          - projecttracker
      max_generations:
        description: 'Max evolution generations'
        required: false
        default: '3'
      variant_count:
        description: 'Variants per generation (default 5)'
        required: false
        default: '5'
      target_pass_rate:
        description: 'Stop when this pass rate is achieved (0.0-1.0)'
        required: false
        default: '0.95'
      dry_run:
        description: 'Dry run (baseline only, no evolution loop)'
        required: false
        type: boolean
        default: false

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed
  DEFAULT_SKILL: zonewise

jobs:
  evolve:
    name: "🧬 Evolutionary Loop: ${{ github.event.inputs.skill_name || 'zonewise' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Determine inputs
        id: config
        run: |
          SKILL="${{ github.event.inputs.skill_name || env.DEFAULT_SKILL }}"
          MAX="${{ github.event.inputs.max_generations || '3' }}"
          VARIANTS="${{ github.event.inputs.variant_count || '5' }}"
          TARGET="${{ github.event.inputs.target_pass_rate || '0.95' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          echo "skill=$SKILL" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          echo "variants=$VARIANTS" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "dry=$DRY" >> $GITHUB_OUTPUT
          echo "🎯 Skill: $SKILL | Generations: $MAX | Variants: $VARIANTS | Target: $TARGET | Dry: $DRY"

      - name: "1️⃣ Preflight"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            SKILL="${{ steps.config.outputs.skill }}"

            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              echo "📥 Repo not found — cloning..."
              git clone https://github.com/breverdbidder/cli-anything-biddeed.git ${{ env.REPO_PATH }}
            fi

            cd ${{ env.REPO_PATH }}
            git pull origin main --ff-only 2>&1 | tail -3

            command -v claude &>/dev/null || npm install -g @anthropic-ai/claude-code
            test -f "${{ env.REPO_PATH }}/scripts/eval_runner.py" || { echo "❌ Missing eval_runner.py"; exit 1; }

            python3 scripts/eval_runner.py verify-ground-truth $SKILL
            echo "✅ Preflight: $SKILL ready"

      - name: "2️⃣ Baseline Score"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            python3 scripts/eval_runner.py baseline $SKILL

      - name: "3️⃣ Current Skill Score"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            python3 scripts/eval_runner.py score $SKILL

      - name: "4️⃣ Evolutionary Loop"
        if: steps.config.outputs.dry != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 170m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            MAX="${{ steps.config.outputs.max }}"
            VARIANTS="${{ steps.config.outputs.variants }}"
            TARGET="${{ steps.config.outputs.target }}"

            python3 scripts/eval_runner.py evolve \
              --skill "$SKILL" \
              --variants "$VARIANTS" \
              --max-generations "$MAX" \
              --target-pass-rate "$TARGET" \
              --breed-on-plateau

            # Commit any improvements (eval artifacts only — SKILL.md not modified per constraints)
            git add -A
            git diff --cached --quiet || {
              git commit -m "autoloop($SKILL): evolutionary run gen${MAX} $(date +%Y%m%d)"
              git push origin main
            } || true

      - name: "5️⃣ Report to Supabase"
        if: steps.config.outputs.dry != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
              python3 scripts/eval_runner.py report $SKILL

      - name: "6️⃣ Telegram Notification"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd ${{ env.REPO_PATH }}
            SKILL="${{ steps.config.outputs.skill }}"
            SCORE_FILE="$(find $SKILL/eval -name 'latest_score.json' 2>/dev/null | head -1)"
            SCORE="n/a"
            [ -n "$SCORE_FILE" ] && SCORE=$(python3 -c "import json; d=json.load(open('$SCORE_FILE')); print(d.get('pass_rate_pct','n/a'))" 2>/dev/null || echo "n/a")

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=🧬 Evolutionary Loop Complete%0A%0ASkill: $SKILL%0APass Rate: $SCORE%0AGenerations: ${{ steps.config.outputs.max }}%0AVariants/Gen: ${{ steps.config.outputs.variants }}%0AServer: Hetzner" \
              > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧬 Evolutionary Skill Loop — ${{ steps.config.outputs.skill }}
          **Generations:** ${{ steps.config.outputs.max }}
          **Variants/gen:** ${{ steps.config.outputs.variants }}
          **Target pass rate:** ${{ steps.config.outputs.target }}
          **Dry Run:** ${{ steps.config.outputs.dry }}
          Check Telegram for final scores.
          EOF
