name: SHARD-12 Gold Standard Session

# Autonomous execution workflow for sumter, indian_river, polk, glades
# Per WIRING MANDATE: Every shipped script MUST be scheduled
# Reference: Gold Standard SHARD-12 issue - run 26 June 14, 2026

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - verify_only
          - dry_run
      counties:
        description: 'Target counties (comma-separated)'
        required: false
        default: 'sumter,indian_river,polk,glades'
        type: string
  schedule:
    # Run 3x daily during 24/7 build cadence (08:00Z, 16:00Z, 00:00Z)
    # Aligned with fleet coordination to avoid conflicts
    - cron: '0 8,16,0 * * *'

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: shard12-gold-standard-${{ github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  shard12-autonomous-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour session budget
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml

      - name: Validate environment
        run: |
          echo "🔍 Environment validation"
          echo "SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' && '✅ Available' || '❌ Missing' }}"
          echo "SUPABASE_KEY: ${{ secrets.SUPABASE_KEY != '' && '✅ Available' || '❌ Missing' }}"
          echo "Mode: ${{ github.event.inputs.mode || 'scheduled' }}"
          echo "Counties: ${{ github.event.inputs.counties || 'sumter,indian_river,polk,glades' }}"

      - name: Execute SHARD-12 Autonomous Session
        id: session
        run: |
          echo "🚀 Starting SHARD-12 autonomous session..."
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Execute the main session script
          python3 shard12_autonomous_session.py > session_output.log 2>&1 || true
          
          # Capture results
          echo "Session output:"
          cat session_output.log
          
          # Check for success indicators
          if grep -q "SESSION: SUCCESS" session_output.log; then
            echo "session_status=success" >> $GITHUB_OUTPUT
          elif grep -q "PARTIAL" session_output.log; then
            echo "session_status=partial" >> $GITHUB_OUTPUT  
          else
            echo "session_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Run Verification Protocol
        if: steps.session.outputs.session_status != 'failed'
        run: |
          echo "🔍 Running verification protocol..."
          python3 scripts/shard12_verification_protocol.py > verification_output.log 2>&1 || true
          
          echo "Verification output:"
          cat verification_output.log

      - name: Generate Session Report
        run: |
          cat > session_report.md << 'EOF'
          ## SHARD-12 Autonomous Session Report
          
          **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Counties:** sumter, indian_river, polk, glades
          **Session Status:** ${{ steps.session.outputs.session_status }}
          **Workflow:** ${{ github.workflow }} (#${{ github.run_number }})
          
          ### Session Output
          ```
          $(cat session_output.log | tail -50)
          ```
          
          ### Verification Output  
          ```
          $(cat verification_output.log | tail -30)
          ```
          
          ### Next Steps
          - Session status: ${{ steps.session.outputs.session_status }}
          - Metrics should reflect improvements in next gold_standard_loop() run
          - Monitor county status via pencil_dod_evaluate_county() functions
          
          EOF

      - name: Archive Session Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard12-session-${{ github.run_number }}
          path: |
            session_output.log
            verification_output.log
            session_report.md
          retention-days: 30

      - name: Update Issue Comment (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            // Find the SHARD-12 issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'gold-standard'
            });
            
            const shard12Issue = issues.find(issue => 
              issue.title.includes('SHARD-12') || 
              issue.body.includes('sumter') && issue.body.includes('indian_river')
            );
            
            if (shard12Issue) {
              const report = require('fs').readFileSync('session_report.md', 'utf8');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: shard12Issue.number,
                body: `### Autonomous Session Execution\n\n${report}\n\n**Workflow Link:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            }

      - name: Telegram Notification (if configured)
        if: steps.session.outputs.session_status == 'success'
        continue-on-error: true
        run: |
          # Call the telegram notification workflow if available
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "shard12-success",
              "client_payload": {
                "message": "SHARD-12 Gold Standard session completed successfully",
                "counties": "sumter, indian_river, polk, glades",
                "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }' || true