name: Copy Secrets to Everest Nexus

on:
  repository_dispatch:
    types: [copy-secrets-nexus]

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install pynacl

      - name: Copy secrets to everest-nexus
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, urllib.request
          from nacl import encoding, public

          token = os.environ["GH_PAT"]
          repo = "breverdbidder/everest-nexus"

          # Get target repo public key
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers={"Authorization": f"token {token}"}
          )
          pk_data = json.loads(urllib.request.urlopen(req).read())
          pub_key = pk_data["key"]
          key_id = pk_data["key_id"]

          def encrypt(value):
              pk = public.PublicKey(pub_key.encode(), encoding.Base64Encoder())
              sealed = public.SealedBox(pk).encrypt(value.encode())
              return base64.b64encode(sealed).decode()

          for name in ["HETZNER_SSH_KEY", "CLAUDE_OAUTH_B64"]:
              value = os.environ.get(name, "")
              if not value:
                  print(f"SKIP {name}: empty")
                  continue
              encrypted = encrypt(value)
              data = json.dumps({"encrypted_value": encrypted, "key_id": key_id}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  data=data, method="PUT",
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"}
              )
              resp = urllib.request.urlopen(req)
              print(f"{name}: HTTP {resp.status}")
          PYEOF

      - name: Push Nexus S1 workflow
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Now push the S1 workflow to everest-nexus
          cat > /tmp/nexus-s1.yml << 'WFEOF'
          name: Nexus S1
          on:
            workflow_dispatch:
          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              steps:
                - name: Claude Code on Hetzner
                  uses: appleboy/ssh-action@v1.2.0
                  with:
                    host: ${{ secrets.HETZNER_IP }}
                    username: root
                    key: ${{ secrets.HETZNER_SSH_KEY }}
                    command_timeout: 80m
                    envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,SUPABASE_URL,SUPABASE_KEY
                    script: |
                      set -e
                      su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN=\$(echo \$CLAUDE_OAUTH_B64 | base64 -d) && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && export BIDDEED_BOT_TOKEN=\$BIDDEED_BOT_TOKEN && export BIDDEED_BOT_CHAT_ID=\$BIDDEED_BOT_CHAT_ID && export GH_PAT=\$GH_PAT && export SUPABASE_URL=\$SUPABASE_URL && export SUPABASE_KEY=\$SUPABASE_KEY && mkdir -p /home/claude/repos && cd /home/claude/repos && (cd everest-nexus && git pull origin main 2>/dev/null || git clone https://\${GH_PAT}@github.com/breverdbidder/everest-nexus.git && cd everest-nexus) && claude -p 'Read docs/EVEREST-NEXUS-SPEC.md and docs/EVEREST-NEXUS-PLAN.md. Execute ALL S1 tasks. Create 9 Supabase tables (nexus_ prefix), task engine with P0 escalation, workflow scanner for all 50 repos, Telegram commands, pg_cron jobs, and seed repos. Git prefix NEXUS:, push main, Telegram notify when done.' --dangerously-skip-permissions"
                  env:
                    CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
                    GH_PAT: ${{ secrets.GH_PAT }}
                    BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
                    BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
                    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                    SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                - name: Notify
                  if: always()
                  run: |
                    curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" -d "text=Nexus S1: ${{ job.status }} - https://github.com/breverdbidder/everest-nexus/actions/runs/${{ github.run_id }}" || true
          WFEOF

          echo "Nexus S1 workflow built. Secrets copied. Ready for manual dispatch from everest-nexus."

      - name: Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=Secret Copier: ${{ job.status }} - HETZNER_SSH_KEY + CLAUDE_OAUTH_B64 deployed to everest-nexus" || true
