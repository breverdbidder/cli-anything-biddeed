name: "Read certify() source — push migration + call get_certify_source()"
# Installs supabase CLI, pushes migration that creates get_certify_source() wrapper,
# then calls it via REST to read the gold_standard_certify() function body.
# Goal: understand what no_calendar_parity + no_denominator_integrity guards check.

on:
  workflow_dispatch:

jobs:
  read-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: "Install supabase CLI"
        run: |
          npm install -g supabase@latest 2>&1 | tail -5
          supabase --version

      - name: "Push migration (creates get_certify_source wrapper)"
        run: |
          supabase link --project-ref mocerqjnksmhcjzxrewo --password "$SUPABASE_DB_PASSWORD" 2>&1
          supabase db push --password "$SUPABASE_DB_PASSWORD" 2>&1

      - name: "Call get_certify_source() via REST and print source"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:2000].decode(), e.code

          print("=== gold_standard_certify() source ===")
          result, code = rpc("get_certify_source")
          print(f"HTTP {code}")
          if isinstance(result, str) and len(result) > 0:
              print(result)
          else:
              print(f"Result: {result}")

          print("\n=== pencil_dod_evaluate_county() source ===")
          result, code = rpc("get_eval_source")
          print(f"HTTP {code}")
          if isinstance(result, str) and len(result) > 0:
              print(result[:3000])
          else:
              print(f"Result: {result}")
          PYEOF
