name: gadsden — Shard-11 E+I Fix (issue 12897)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  gadsden-ei-fix:
    name: 'Gadsden E+I: parcel linkage + municipal zoning'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run E+I fix script
        run: |
          set -euo pipefail
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python3 scripts/gadsden_shard11_ei_comprehensive.py $DRY_FLAG

      - name: Final evaluation
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, urllib.request
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          body = json.dumps({"p_county": "gadsden"}).encode()
          req = urllib.request.Request(
              f"{url}/rest/v1/rpc/pencil_dod_evaluate_county",
              data=body,
              headers={"apikey": key, "Authorization": f"Bearer {key}",
                       "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read().decode())
          print("=== FINAL pencil_dod_evaluate_county('gadsden') ===")
          print(json.dumps(result, indent=2))
          e = result.get("E", {})
          i = result.get("I", {})
          total_pass = sum(1 for k in "ABCDEFGHIJ" if result.get(k, {}).get("pass"))
          print(f"\nE: {e.get('metric')}% (pass={e.get('pass')}) | I: {i.get('metric')}% (pass={i.get('pass')})")
          print(f"Total: {total_pass}/10")
          EOF
