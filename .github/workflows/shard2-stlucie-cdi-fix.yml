name: "SHARD-2 St Lucie C/D/I Fix (run 6046)"
# Fixes C (parity_clean ≥95%), D (parity_any ≥95%), I (card_complete ≥95%) for st_lucie.
# Root cause: new rows from calendar_sweep_mca_v3 lack parity_status and enrichment.
# Strategy: AJAX harvest from stlucie.realforeclose.com + ArcGIS parcel lookup +
#   Census geocode + parity promotion with tier1_ prefix (required by evaluator).
#
# Targets letter pairs: C/D (parity) + I (property card completeness)
# dispatch_id: 92daf5f6-f3b7-40a5-9295-4ab20c20e161
# Built: 2026-07-23 (SHARD-2 run 6046)

on:
  schedule:
    - cron: '15 6 * * *'   # 06:15 UTC daily
  workflow_dispatch:

jobs:
  fix:
    name: "St Lucie C/D/I enrichment and parity fix"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install dependencies"
        run: pip install --quiet requests

      - name: "Run st_lucie C/D/I fix"
        run: |
          set -euo pipefail
          python3 scripts/shard2_stlucie_cdi_fix.py
        continue-on-error: false

      - name: "Verify: pencil_dod_evaluate_county st_lucie"
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_county": "st_lucie"}')
          echo "### SQL VERIFICATION: st_lucie evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP"

          C_PASS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('C',{}).get('pass', False))")
          I_PASS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('I',{}).get('pass', False))")
          echo "C pass: $C_PASS | I pass: $I_PASS"
          if [ "$C_PASS" = "True" ] && [ "$I_PASS" = "True" ]; then
            echo "::notice::st_lucie C and I now PASS"
          else
            echo "::warning::st_lucie C or I still failing — review output above"
          fi
