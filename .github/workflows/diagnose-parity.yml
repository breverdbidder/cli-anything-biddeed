name: "Diagnose Parity Bootstrap (why 0 matched)"
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
    steps:
      - name: "Parity + tier1 diagnostics"
        run: |
          run_q() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/q.json
            curl -sS -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json
            echo; echo
          }
          run_q "auction_status on mca_only rows" \
            "SELECT auction_status, COUNT(*) n FROM multi_county_auctions WHERE county='brevard' AND parity_status='mca_only' GROUP BY auction_status ORDER BY n DESC"
          run_q "brevard_tier1_today exists?" \
            "SELECT EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relname='brevard_tier1_today' AND n.nspname='public') AS btt_exists"
          run_q "brevard_tier1_today row count" \
            "SELECT COUNT(*) n FROM brevard_tier1_today"
          run_q "mca_only cases sample (case_number)" \
            "SELECT case_number FROM multi_county_auctions WHERE county='brevard' AND parity_status='mca_only' LIMIT 5"
          run_q "brevard_tier1_today cases sample" \
            "SELECT case_number FROM brevard_tier1_today LIMIT 5"
          run_q "normalize_case_number cross-check" \
            "SELECT mca.case_number AS mca_raw, normalize_case_number(mca.case_number) AS mca_norm, t1.case_number AS t1_raw, normalize_case_number(t1.case_number) AS t1_norm FROM multi_county_auctions mca CROSS JOIN (SELECT case_number FROM brevard_tier1_today LIMIT 3) t1 WHERE mca.county='brevard' AND mca.parity_status='mca_only' LIMIT 6"
          run_q "mca auction_status distribution (brevard)" \
            "SELECT auction_status, COUNT(*) n FROM multi_county_auctions WHERE county='brevard' GROUP BY auction_status ORDER BY n DESC"
