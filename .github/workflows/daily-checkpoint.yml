name: "Daily Checkpoint (11:59 PM EST)"

on:
  schedule:
    - cron: '59 4 * * *'
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate honest checkpoint
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, json, os
          from datetime import datetime, timezone, timedelta

          GH = os.environ["GH_PAT"]
          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID", "")
          EST = timezone(timedelta(hours=-4))
          NOW = datetime.now(EST)
          TODAY = NOW.strftime("%Y-%m-%d")
          DAY_NAME = NOW.strftime("%A, %B %d, %Y")
          gh_h = {"Authorization": f"token {GH}"}
          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          repos = ["cli-anything-biddeed","brevard-bidder-scraper","zonewise-web","everest-nexus","cliproxy-gateway"]
          domain_map = {
              "brevard-bidder-scraper": "BIDDEED", "cli-anything-biddeed": "ECOSYSTEM",
              "zonewise-web": "ZONEWISE", "everest-nexus": "ECOSYSTEM", "cliproxy-gateway": "BIDDEED",
          }

          # =============================================
          # HONEST SCORING: Outcomes, not activity
          # =============================================

          # 1. REAL TASKS from nexus_tasks
          tasks_done = 0
          tasks_open = 0
          tasks_blocked = 0
          nexus_items = []
          try:
              r = requests.get(
                  f"{SB_URL}/rest/v1/nexus_tasks?order=priority.asc&limit=200",
                  headers=sb_h, timeout=10
              )
              if r.status_code == 200:
                  for t in r.json():
                      status = t.get("status", "?")
                      completed_today = False
                      if status == "completed":
                          ca = t.get("completed_at", "")
                          if ca and TODAY in ca:
                              completed_today = True
                              tasks_done += 1
                      elif status == "blocked":
                          tasks_blocked += 1
                          tasks_open += 1
                      elif status in ("queued", "running", "dispatched"):
                          tasks_open += 1
                      nexus_items.append({
                          "id": t.get("task_id", "?"),
                          "desc": t.get("description", "")[:60],
                          "status": status,
                          "priority": t.get("priority", "P3"),
                          "domain": t.get("project", "?"),
                          "completed_today": completed_today,
                      })
          except Exception as e:
              print(f"Nexus query: {e}")

          # 2. GIT ACTIVITY (not "completed" — just activity count)
          commit_count = 0
          active_repos = 0
          for repo in repos:
              try:
                  commits = requests.get(
                      f"https://api.github.com/repos/breverdbidder/{repo}/commits?since={TODAY}T00:00:00Z&per_page=50",
                      headers=gh_h, timeout=10
                  ).json()
                  if isinstance(commits, list) and len(commits) > 0:
                      commit_count += len(commits)
                      active_repos += 1
              except: pass

          # 3. GHA HEALTH
          gha_ok = gha_fail = 0
          for repo in repos:
              try:
                  runs = requests.get(
                      f"https://api.github.com/repos/breverdbidder/{repo}/actions/runs?created=%3E{TODAY}T00:00:00Z&per_page=50",
                      headers=gh_h, timeout=10
                  ).json()
                  for run in runs.get("workflow_runs", []):
                      if run.get("conclusion") == "success": gha_ok += 1
                      elif run.get("conclusion") == "failure": gha_fail += 1
              except: pass
          gha_total = gha_ok + gha_fail
          gha_health = round(gha_ok / gha_total * 100) if gha_total > 0 else 0

          # 4. HONESTY VIOLATIONS
          open_violations = 0
          try:
              r = requests.get(
                  f"{SB_URL}/rest/v1/honesty_violations?resolved=eq.false&select=count",
                  headers=sb_h, timeout=10
              )
              if r.status_code == 200:
                  open_violations = r.json()[0].get("count", 0)
          except: pass

          # 5. HONEST SCORE CALCULATION
          # Score = weighted average of real metrics, NOT commit count
          # Tasks completed today (40%), GHA health (30%), Violations penalty (20%), Activity (10%)
          task_score = min(100, tasks_done * 20) if tasks_done > 0 else 0  # Each task = 20pts, cap 100
          gha_score = gha_health
          violation_penalty = open_violations * 15  # Each violation = -15pts
          activity_score = min(100, commit_count * 5)  # Commits are just activity, low weight
          
          honest_score = max(0, round(
              task_score * 0.4 +
              gha_score * 0.3 -
              violation_penalty * 0.2 +
              activity_score * 0.1
          ))

          if honest_score >= 80: grade = "🟢 A"
          elif honest_score >= 60: grade = "🟡 B"
          elif honest_score >= 40: grade = "🟠 C"
          else: grade = "🔴 D"

          # 6. BUILD TELEGRAM MESSAGE
          msg = f"📊 DAILY CHECKPOINT — {DAY_NAME}\n\n"
          msg += f"{grade} Score: {honest_score}/100\n\n"
          msg += f"📋 Tasks: {tasks_done} done today | {tasks_open} open | {tasks_blocked} blocked\n"
          msg += f"🔨 Activity: {commit_count} commits across {active_repos}/{len(repos)} repos\n"
          msg += f"⚙️ GHA: {gha_ok}✅ {gha_fail}❌ ({gha_health}% health)\n"
          
          if open_violations > 0:
              msg += f"🔴 Honesty: {open_violations} open violation(s) (-{violation_penalty}pts)\n"
          else:
              msg += f"✅ Honesty: clean\n"

          # Top completed tasks today
          done_today = [t for t in nexus_items if t["completed_today"]]
          if done_today:
              msg += f"\n✅ Completed today:\n"
              for t in done_today[:5]:
                  msg += f"  [{t['priority']}] {t['desc']}\n"

          # Open P0/P1
          urgent = [t for t in nexus_items if t["priority"] in ("P0","P1") and t["status"] not in ("completed","cancelled")]
          if urgent:
              msg += f"\n🚨 Open P0/P1:\n"
              for t in urgent[:5]:
                  msg += f"  [{t['priority']}] {t['desc']} ({t['status']})\n"

          msg += f"\n📊 Scoring: tasks({task_score}×.4) + GHA({gha_score}×.3) - violations({violation_penalty}×.2) + activity({activity_score}×.1)"

          print(msg)

          # 7. SEND TO TELEGRAM
          if TG_TOKEN and TG_CHAT:
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                      json={"chat_id": TG_CHAT, "text": msg[:4000]},
                      timeout=10
                  )
                  print(f"\n{'✅' if r.status_code == 200 else '❌'} Telegram: {r.status_code}")
              except Exception as e:
                  print(f"\n❌ Telegram: {e}")

          # 8. SAVE TO SUPABASE
          if SB_URL and SB_KEY:
              try:
                  requests.post(
                      f"{SB_URL}/rest/v1/daily_scores",
                      headers=sb_h,
                      json={
                          "date": TODAY,
                          "total_items": tasks_open + tasks_done,
                          "completed": tasks_done,
                          "in_progress": tasks_open - tasks_blocked,
                          "blocked": tasks_blocked,
                          "completion_rate": honest_score,
                          "gha_ok": gha_ok, "gha_fail": gha_fail,
                          "summary": msg[:500],
                      },
                      timeout=10
                  )
                  print("✅ Supabase saved")
              except Exception as e:
                  print(f"❌ Supabase: {e}")

          PYSCRIPT
