name: Daily Checkpoint (11:59 PM EST)

on:
  schedule:
    - cron: '59 4 * * *'
  workflow_dispatch:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure tables exist + build checkpoint
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null

          cat > /tmp/checkpoint.py << 'PYSCRIPT'
          import requests, json, os
          from datetime import datetime, timezone, timedelta

          GH_PAT = os.environ.get("GH_PAT", "")
          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          TODAY = datetime.now(timezone(timedelta(hours=-5))).strftime("%Y-%m-%d")
          gh = lambda u: requests.get(u, headers={"Authorization": f"token {GH_PAT}"}, timeout=15).json()
          sb = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json", "Prefer": "return=representation"}

          # Auto-create tables via RPC if needed
          for table in ["daily_checkpoints", "daily_action_plans", "daily_scores"]:
              try:
                  r = requests.get(f"{SB_URL}/rest/v1/{table}?limit=0", headers=sb, timeout=10)
                  if r.status_code == 200:
                      continue
              except:
                  pass
              print(f"Table {table} missing — will be created on first successful migration run")

          # Scan repos
          repos = ["everest-stack","cli-anything-biddeed","brevard-bidder-scraper","zonewise-web","everest-nexus","biddeed-ai","zonewise-gtm","claude-chamber","swimsquad-ai"]
          domain_map = {
              "everest-stack": "BIDDEED", "brevard-bidder-scraper": "BIDDEED", "biddeed-ai": "BIDDEED",
              "cli-anything-biddeed": "ECOSYSTEM", "everest-nexus": "ECOSYSTEM",
              "zonewise-web": "ZONEWISE", "zonewise-gtm": "GTM",
              "claude-chamber": "BIDDEED", "swimsquad-ai": "MICHAEL",
          }

          items = []
          for repo in repos:
              try:
                  commits = gh(f"https://api.github.com/repos/breverdbidder/{repo}/commits?since={TODAY}T00:00:00Z&per_page=20")
                  if isinstance(commits, list):
                      for c in commits:
                          msg = c["commit"]["message"].split("\n")[0][:100]
                          items.append({"date": TODAY, "domain": domain_map.get(repo, "PERSONAL"),
                              "task": f"[{repo}] {msg}", "status": "completed",
                              "detail": f"SHA: {c['sha'][:8]}", "priority": "P2"})
              except:
                  pass

          # GHA runs
          try:
              runs = gh(f"https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/runs?created=%3E{TODAY}T00:00:00Z&per_page=30")
              wr = runs.get("workflow_runs", [])
              ok = sum(1 for r in wr if r.get("conclusion") == "success")
              fail = sum(1 for r in wr if r.get("conclusion") == "failure")
              run_ = sum(1 for r in wr if r.get("status") == "in_progress")
              items.append({"date": TODAY, "domain": "ECOSYSTEM",
                  "task": f"GHA: {ok}✅ {fail}❌ {run_}🔄 ({len(wr)} total runs)",
                  "status": "completed" if fail == 0 else "in_progress", "priority": "P1" if fail > 2 else "P2"})
          except:
              pass

          # Store to Supabase
          stored = 0
          for item in items:
              try:
                  r = requests.post(f"{SB_URL}/rest/v1/daily_checkpoints", json=item, headers=sb, timeout=10)
                  if r.status_code in (200, 201): stored += 1
              except:
                  pass

          # Score
          completed = sum(1 for i in items if i["status"] == "completed")
          total = len(items)
          rate = round((completed / total * 100), 1) if total > 0 else 0
          dc = {}
          for i in items:
              d = i["domain"]
              dc.setdefault(d, {"c": 0, "t": 0})
              dc[d]["t"] += 1
              if i["status"] == "completed": dc[d]["c"] += 1
          top = max(dc, key=lambda d: dc[d]["c"]) if dc else "NONE"
          worst = min(dc, key=lambda d: dc[d]["c"]) if dc else "NONE"

          try:
              requests.post(f"{SB_URL}/rest/v1/daily_scores",
                  json={"date": TODAY, "total_items": total, "completed": completed,
                        "in_progress": sum(1 for i in items if i["status"]=="in_progress"),
                        "blocked": sum(1 for i in items if i["status"]=="blocked"),
                        "completion_rate": rate, "top_domain": top, "worst_domain": worst},
                  headers=sb, timeout=10)
          except:
              pass

          # Telegram
          msg = f"📊 *Daily Checkpoint: {TODAY}*\n\n"
          msg += f"✅ Completed: {completed}/{total}\n"
          msg += f"📈 Rate: {rate}%\n"
          msg += f"🏆 Top: {top} | ⚠️ Weak: {worst}\n"
          msg += f"💾 Supabase: {stored} items stored\n\n"
          for d in sorted(dc.keys()):
              msg += f"  {d}: {dc[d]['c']}/{dc[d]['t']}\n"

          with open("/tmp/checkpoint_msg.txt", "w") as f:
              f.write(msg)
          print(msg)
          PYSCRIPT

          python3 /tmp/checkpoint.py

      - name: Telegram
        if: always()
        run: |
          MSG=$(cat /tmp/checkpoint_msg.txt 2>/dev/null || echo "📊 Daily checkpoint complete")
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -d text="$MSG" -d parse_mode="Markdown" > /dev/null
