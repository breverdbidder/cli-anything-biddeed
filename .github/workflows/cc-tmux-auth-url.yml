name: cc tmux auth url
on: { workflow_dispatch: {} }
jobs:
  u:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: restart wide and capture clean url
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          su - claude -c 'tmux -L authsock kill-server 2>/dev/null; true'
          sleep 1
          su - claude -c 'tmux -L authsock new-session -d -s auth -x 520 -y 50 "claude setup-token"'
          sleep 14
          echo "=== url ==="
          su - claude -c 'tmux -L authsock capture-pane -t auth -p -J' 2>&1 | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -oE 'https://[^[:space:]]+' | head -1
          echo "=== session alive ==="
          su - claude -c 'tmux -L authsock list-sessions' 2>&1
          echo END
          REMOTE
