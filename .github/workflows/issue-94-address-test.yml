name: "Issue #94 — Test 20 Addresses Across 5 Brevard Cities"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/issue-94-address-test.yml'

jobs:
  test-addresses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TG_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}

    steps:
      - name: "Test 20 addresses — Cocoa Beach (4)"
        id: cocoa_beach
        run: |
          echo "=== Cocoa Beach (4 addresses) ==="
          PASS=0; FAIL=0; FAILURES=""

          for addr in \
            "1600 S Orlando Ave Cocoa Beach FL" \
            "3680 N Atlantic Ave Cocoa Beach FL" \
            "10 N Orlando Ave Cocoa Beach FL" \
            "4700 N Atlantic Ave Cocoa Beach FL"; do

            RESULT=$(curl -s -X POST "https://zonewise.ai/api/zoning-chat" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"$addr\"}" --max-time 20 2>/dev/null || echo '{}')

            HAS_PARCEL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('parcel') else 'NO')" 2>/dev/null || echo "ERROR")

            if [ "$HAS_PARCEL" = "YES" ]; then
              echo "  PASS $addr"
              PASS=$((PASS+1))
            else
              echo "  FAIL $addr"
              FAIL=$((FAIL+1))
              FAILURES="$FAILURES\n  - $addr"
            fi
          done

          echo "Cocoa Beach: $PASS/4 passed"
          echo "CB_PASS=$PASS" >> $GITHUB_ENV
          echo "CB_FAIL=$FAIL" >> $GITHUB_ENV
          echo "CB_FAILURES=$FAILURES" >> $GITHUB_ENV

      - name: "Test 20 addresses — Satellite Beach (4)"
        id: satellite_beach
        run: |
          echo "=== Satellite Beach (4 addresses) ==="
          PASS=0; FAIL=0; FAILURES=""

          for addr in \
            "625 Ocean Street Satellite Beach FL" \
            "1000 S Patrick Dr Satellite Beach FL" \
            "2900 S Patrick Dr Satellite Beach FL" \
            "1300 Highway A1A Satellite Beach FL"; do

            RESULT=$(curl -s -X POST "https://zonewise.ai/api/zoning-chat" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"$addr\"}" --max-time 20 2>/dev/null || echo '{}')

            HAS_PARCEL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('parcel') else 'NO')" 2>/dev/null || echo "ERROR")

            if [ "$HAS_PARCEL" = "YES" ]; then
              echo "  PASS $addr"
              PASS=$((PASS+1))
            else
              echo "  FAIL $addr"
              FAIL=$((FAIL+1))
              FAILURES="$FAILURES\n  - $addr"
            fi
          done

          echo "Satellite Beach: $PASS/4 passed"
          echo "SB_PASS=$PASS" >> $GITHUB_ENV
          echo "SB_FAIL=$FAIL" >> $GITHUB_ENV
          echo "SB_FAILURES=$FAILURES" >> $GITHUB_ENV

      - name: "Test 20 addresses — Melbourne (4)"
        id: melbourne
        run: |
          echo "=== Melbourne (4 addresses) ==="
          PASS=0; FAIL=0; FAILURES=""

          for addr in \
            "1900 S Harbor City Blvd Melbourne FL" \
            "2600 N Wickham Rd Melbourne FL" \
            "1350 N Harbor City Blvd Melbourne FL" \
            "4215 W New Haven Ave Melbourne FL"; do

            RESULT=$(curl -s -X POST "https://zonewise.ai/api/zoning-chat" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"$addr\"}" --max-time 20 2>/dev/null || echo '{}')

            HAS_PARCEL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('parcel') else 'NO')" 2>/dev/null || echo "ERROR")

            if [ "$HAS_PARCEL" = "YES" ]; then
              echo "  PASS $addr"
              PASS=$((PASS+1))
            else
              echo "  FAIL $addr"
              FAIL=$((FAIL+1))
              FAILURES="$FAILURES\n  - $addr"
            fi
          done

          echo "Melbourne: $PASS/4 passed"
          echo "MEL_PASS=$PASS" >> $GITHUB_ENV
          echo "MEL_FAIL=$FAIL" >> $GITHUB_ENV
          echo "MEL_FAILURES=$FAILURES" >> $GITHUB_ENV

      - name: "Test 20 addresses — Merritt Island (4)"
        id: merritt_island
        run: |
          echo "=== Merritt Island (4 addresses) ==="
          PASS=0; FAIL=0; FAILURES=""

          for addr in \
            "2100 N Courtenay Pkwy Merritt Island FL" \
            "1150 N Courtenay Pkwy Merritt Island FL" \
            "615 Fortenberry Rd Merritt Island FL" \
            "320 S Sykes Creek Pkwy Merritt Island FL"; do

            RESULT=$(curl -s -X POST "https://zonewise.ai/api/zoning-chat" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"$addr\"}" --max-time 20 2>/dev/null || echo '{}')

            HAS_PARCEL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('parcel') else 'NO')" 2>/dev/null || echo "ERROR")

            if [ "$HAS_PARCEL" = "YES" ]; then
              echo "  PASS $addr"
              PASS=$((PASS+1))
            else
              echo "  FAIL $addr"
              FAIL=$((FAIL+1))
              FAILURES="$FAILURES\n  - $addr"
            fi
          done

          echo "Merritt Island: $PASS/4 passed"
          echo "MI_PASS=$PASS" >> $GITHUB_ENV
          echo "MI_FAIL=$FAIL" >> $GITHUB_ENV
          echo "MI_FAILURES=$FAILURES" >> $GITHUB_ENV

      - name: "Test 20 addresses — Palm Bay (4)"
        id: palm_bay
        run: |
          echo "=== Palm Bay (4 addresses) ==="
          PASS=0; FAIL=0; FAILURES=""

          for addr in \
            "1000 Malabar Rd SE Palm Bay FL" \
            "4300 Babcock St NE Palm Bay FL" \
            "100 Malabar Rd SW Palm Bay FL" \
            "1200 Emerson Dr NE Palm Bay FL"; do

            RESULT=$(curl -s -X POST "https://zonewise.ai/api/zoning-chat" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"$addr\"}" --max-time 20 2>/dev/null || echo '{}')

            HAS_PARCEL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('parcel') else 'NO')" 2>/dev/null || echo "ERROR")

            if [ "$HAS_PARCEL" = "YES" ]; then
              echo "  PASS $addr"
              PASS=$((PASS+1))
            else
              echo "  FAIL $addr"
              FAIL=$((FAIL+1))
              FAILURES="$FAILURES\n  - $addr"
            fi
          done

          echo "Palm Bay: $PASS/4 passed"
          echo "PB_PASS=$PASS" >> $GITHUB_ENV
          echo "PB_FAIL=$FAIL" >> $GITHUB_ENV
          echo "PB_FAILURES=$FAILURES" >> $GITHUB_ENV

      - name: "Compute totals and post comment to issue #94"
        if: always()
        run: |
          CB=${CB_PASS:-0}; SB=${SB_PASS:-0}; MEL=${MEL_PASS:-0}; MI=${MI_PASS:-0}; PB=${PB_PASS:-0}
          TOTAL=$((CB + SB + MEL + MI + PB))

          echo "=== FINAL RESULTS ==="
          echo "Cocoa Beach:    $CB/4"
          echo "Satellite Beach: $SB/4"
          echo "Melbourne:      $MEL/4"
          echo "Merritt Island: $MI/4"
          echo "Palm Bay:       $PB/4"
          echo "TOTAL:          $TOTAL/20"

          if [ "$TOTAL" -ge 16 ]; then
            STATUS="PASS"
            STATUS_ICON="PASS"
          else
            STATUS="FAIL"
            STATUS_ICON="FAIL"
          fi

          BODY="## Address Parser Test Results — 20 Addresses / 5 Brevard Cities\n\n**Status: $STATUS_ICON — $TOTAL/20 passed** (threshold: 16/20)\n\n| City | Passed | Total |\n|------|--------|-------|\n| Cocoa Beach | $CB | 4 |\n| Satellite Beach | $SB | 4 |\n| Melbourne | $MEL | 4 |\n| Merritt Island | $MI | 4 |\n| Palm Bay | $PB | 4 |\n| **TOTAL** | **$TOTAL** | **20** |\n\n"

          if [ "$TOTAL" -lt 16 ]; then
            BODY="${BODY}### Failures requiring investigation\n"
            [ -n "$CB_FAILURES" ] && BODY="${BODY}**Cocoa Beach:**$CB_FAILURES\n"
            [ -n "$SB_FAILURES" ] && BODY="${BODY}**Satellite Beach:**$SB_FAILURES\n"
            [ -n "$MEL_FAILURES" ] && BODY="${BODY}**Melbourne:**$MEL_FAILURES\n"
            [ -n "$MI_FAILURES" ] && BODY="${BODY}**Merritt Island:**$MI_FAILURES\n"
            [ -n "$PB_FAILURES" ] && BODY="${BODY}**Palm Bay:**$PB_FAILURES\n"
            BODY="${BODY}\nRoot cause: API returned null parcel field — no DB match in sample_properties. Address normalization / fuzzy matching needed for street aliases (e.g. A1A).\n"
          fi

          BODY="${BODY}\n*Run: ${{ github.run_id }} | $(date -u +%Y-%m-%dT%H:%M:%SZ)*"

          if [ -n "$GH_TOKEN" ]; then
            echo "$BODY" | gh issue comment 94 --repo breverdbidder/cli-anything-biddeed --body-file -
            echo "Comment posted to issue #94"
          else
            echo "GH_TOKEN not set — comment not posted"
            echo "Comment body:"
            echo "$BODY"
          fi

          # Telegram notification
          TG_MSG="Issue #94 — Address Test: $TOTAL/20 passed ($STATUS). CB:$CB SB:$SB MEL:$MEL MI:$MI PB:$PB"
          if [ -n "$TG_BOT" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=$TG_MSG" || true
          fi

          # Exit non-zero if below threshold
          if [ "$STATUS" = "FAIL" ]; then
            echo "Below 16/20 threshold — workflow fails to signal debugging needed"
            exit 1
          fi
