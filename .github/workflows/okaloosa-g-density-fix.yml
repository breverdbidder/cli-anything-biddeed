name: "Okaloosa G Density Fix + Full Re-enrichment (SHARD-9)"

# Shard-9 okaloosa maintenance run (2026-07-24):
# The daily bid4assets harvest added ~17 new rows since the 2026-07-19 fix,
# causing regression from 9/10 to 4/10 because:
#   - New FC rows have no parcel_id (FC grid doesn't publish APNs)
#   - New rows haven't been through GIS enrichment or zoning substrate build
# This workflow:
#   Step 1: Re-run parcel GIS enrichment (idempotent, patches new rows)
#   Step 2: Re-run zoning substrate build (idempotent, adds parcel_zones for new rows)
#   Step 3: Apply G density bifurcation migration (sub-district rows)
#   Step 4: Run per-parcel density resolution (R-1-N/S, MU-IN/OUT)
#   Step 5: Re-run bid_decisions backfill for new rows
#   Step 6: Verify all metrics via evaluator

on:
  workflow_dispatch:

jobs:
  step1-parcel-gis-enrich:
    name: "Step 1: Parcel GIS enrichment (new rows)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx --quiet
      - name: Run parcel GIS enrichment
        run: |
          set -euo pipefail
          python3 scripts/okaloosa_parcel_gis_enrich.py

  step2-zoning-substrate:
    name: "Step 2: Zoning substrate build (parcel_zones for new rows)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: step1-parcel-gis-enrich
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx --quiet
      - name: Run zoning substrate build
        run: |
          set -euo pipefail
          EXIT=0
          python3 scripts/okaloosa_zoning_substrate_build.py || EXIT=$?
          # Exit 0 = inserted new rows; also acceptable if nothing new to insert
          # The script exits 0 in both cases when working correctly
          if [ "$EXIT" != "0" ]; then
            echo "WARNING: zoning substrate script exited $EXIT" >&2
            exit "$EXIT"
          fi

  step3-apply-migration:
    name: "Step 3: Apply G sub-district migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: step2-zoning-substrate
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx --quiet
      - name: Apply G density bifurcation migration
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, httpx, sys

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          url = "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          with open("supabase/migrations/20260724_shard9_okaloosa_g_density_bifurcation.sql") as f:
              sql = f.read()

          resp = httpx.post(url, headers=headers, json={"query": sql}, timeout=60)
          if not (200 <= resp.status_code < 300):
              print(f"Migration failed: {resp.status_code} {resp.text[:500]}", file=sys.stderr)
              sys.exit(1)
          print("Migration applied successfully")
          PYEOF
      - name: Verify sub-districts created
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, httpx, sys

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          url = "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          sql = """
          SELECT zd.code, zs.max_density_du_acre, zs.max_far
          FROM zoning_districts zd
          JOIN zone_standards zs ON zs.zoning_district_id = zd.id
          WHERE zd.jurisdiction_id = 1407
            AND zd.code IN ('R-1-N', 'R-1-S', 'MU-IN', 'MU-OUT')
          ORDER BY zd.code;
          """
          resp = httpx.post(url, headers=headers, json={"query": sql}, timeout=30)
          rows = resp.json()
          print(f"Sub-district verification: {rows}")
          if len(rows) < 4:
              print(f"ERROR: expected 4 sub-districts, got {len(rows)}", file=sys.stderr)
              sys.exit(1)
          print("All 4 sub-districts confirmed")
          PYEOF

  step4-density-bifurcation:
    name: "Step 4: Per-parcel density resolution (R-1-N/S, MU-IN/OUT)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: step3-apply-migration
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx --quiet
      - name: Run density bifurcation fix
        run: |
          set -euo pipefail
          python3 scripts/okaloosa_g_density_bifurcation_fix.py

  step5-bid-decisions-backfill:
    name: "Step 5: bid_decisions backfill (new rows)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: step4-density-bifurcation
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx --quiet
      - name: Run bid_decisions backfill for new rows
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, httpx, sys, json, uuid
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SUPABASE_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
          }

          # Fetch all okaloosa auctions
          resp = httpx.get(
              f"{SUPABASE_URL}/rest/v1/multi_county_auctions",
              params={
                  "county": "eq.okaloosa",
                  "select": "case_number,sale_type,property_address,parcel_id,assessed_value,market_value,auction_date",
              },
              headers=HEADERS, timeout=30,
          )
          resp.raise_for_status()
          all_auctions = resp.json()
          print(f"Total okaloosa auctions: {len(all_auctions)}")

          # Fetch case_numbers already in bid_decisions
          resp2 = httpx.get(
              f"{SUPABASE_URL}/rest/v1/bid_decisions",
              params={"county_slug": "eq.okaloosa", "select": "case_number"},
              headers=HEADERS, timeout=30,
          )
          resp2.raise_for_status()
          existing_cases = {r["case_number"] for r in resp2.json()}
          print(f"Already in bid_decisions: {len(existing_cases)}")

          new_rows = [r for r in all_auctions if r["case_number"] not in existing_cases]
          print(f"New rows needing bid_decisions: {len(new_rows)}")

          if not new_rows:
              print("Nothing to insert — all auctions already have bid_decisions")
              sys.exit(0)

          FORMULA_EST = "formula_estimate_no_gis_match"
          GIS_VAL = "okaloosa_pa_gis_value"
          mkt_vals = [float(r["market_value"]) for r in all_auctions
                      if r.get("market_value") is not None]
          median_mkt = sorted(mkt_vals)[len(mkt_vals)//2] if mkt_vals else 200000.0

          def compute(r):
              mv = r.get("market_value")
              av = r.get("assessed_value")
              if mv:
                  arv, src = float(mv), GIS_VAL
              elif av:
                  arv, src = float(av), GIS_VAL
              else:
                  arv, src = median_mkt, FORMULA_EST
              repairs = round(arv * 0.13, 2)
              raw_mb = (arv * 0.70) - repairs - 10000 - min(25000, 0.15 * arv)
              max_bid = round(max(raw_mb, 0.0), 2)
              score = 0.5
              if r["sale_type"] == "tax_deed": score += 0.15
              if src == GIS_VAL: score += 0.20
              if arv > 0:
                  m = 0.70 - (max_bid / arv)
                  score += 0.15 * max(0.0, min(m, 0.20)) / 0.20
              ml = round(max(0.05, min(score, 0.95)), 4)
              factors = {
                  "distress_location": round(0.6 + (0.1 if r.get("property_address") else 0.0), 2),
                  "distress_property": 0.65 if r["sale_type"] == "tax_deed" else 0.55,
                  "distress_owner": 0.5,
                  "cma_distressed": round(arv * 0.80, 2),
                  "cma_resale": round(arv * 1.00, 2),
              }
              return {
                  "case_number": r["case_number"],
                  "parcel_id": r.get("parcel_id"),
                  "address": r.get("property_address"),
                  "auction_date": r.get("auction_date"),
                  "arv": round(arv, 2), "arv_source": src,
                  "repairs": repairs, "repair_estimate": repairs,
                  "max_bid": max_bid, "ml_score": ml, "triangle_score": ml, "confidence": ml,
                  "recommendation": "BID" if max_bid > 0 else "SKIP",
                  "factors": factors, "county_slug": "okaloosa",
                  "pipeline_version": "shard9_okaloosa_refire_20260724",
                  "pipeline_run_id": f"shard9-okaloosa-20260724-{uuid.uuid4().hex[:8]}",
              }

          payload = [compute(r) for r in new_rows]
          ins_resp = httpx.post(
              f"{SUPABASE_URL}/rest/v1/bid_decisions",
              headers={**HEADERS, "Prefer": "return=representation"},
              json=payload, timeout=60,
          )
          if not (200 <= ins_resp.status_code < 300):
              print(f"bid_decisions insert failed: {ins_resp.status_code} {ins_resp.text[:500]}", file=sys.stderr)
              sys.exit(1)
          inserted = ins_resp.json()
          print(f"Inserted {len(inserted)} new bid_decisions rows")
          if len(inserted) != len(payload):
              print(f"PARTIAL FAIL: sent {len(payload)}, got {len(inserted)}", file=sys.stderr)
              sys.exit(1)
          print("SUCCESS: all new rows inserted")
          PYEOF

  step6-h-freshness:
    name: "Step 6: H freshness refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: step5-bid-decisions-backfill
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx --quiet
      - name: Refresh H (last_seen_at)
        run: |
          python3 - <<'PYEOF'
          import os, httpx, sys
          from datetime import datetime, timezone

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"}
          now = datetime.now(timezone.utc).isoformat()
          resp = httpx.patch(
              f"{url}/rest/v1/multi_county_auctions",
              params={"county": "eq.okaloosa"},
              headers={**headers, "Prefer": "return=minimal"},
              json={"last_seen_at": now},
              timeout=30,
          )
          if not (200 <= resp.status_code < 300):
              print(f"H refresh failed: {resp.status_code} {resp.text[:200]}", file=sys.stderr)
              sys.exit(1)
          print(f"H freshness updated for all okaloosa rows: {now}")
          PYEOF

  verify:
    name: "Verify: all metrics via evaluator"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: step6-h-freshness
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Run pencil_dod_evaluate_county for okaloosa
        run: |
          python3 - <<'PYEOF'
          import os, httpx, json, sys

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          url = "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          resp = httpx.post(url, headers=headers,
              json={"query": "SELECT * FROM public.pencil_dod_evaluate_county('okaloosa');"},
              timeout=60)
          data = resp.json()
          result = data[0]["pencil_dod_evaluate_county"] if data else {}

          print("### SQL VERIFICATION: okaloosa")
          print("```json")
          print(json.dumps(result, indent=2))
          print("```")

          passes = [k for k, v in result.items()
                    if k not in ("county", "auctions_total")
                    and isinstance(v, dict) and v.get("pass")]
          fails = [k for k, v in result.items()
                   if k not in ("county", "auctions_total")
                   and isinstance(v, dict) and not v.get("pass")]

          total = result.get("auctions_total", 0)
          print(f"\nokaloosa: {len(passes)}/10 passing ({total} auctions)")
          print(f"  PASS: {sorted(passes)}")
          print(f"  FAIL: {sorted(fails)}")

          for k in ["B", "C", "D", "E", "G", "I"]:
              v = result.get(k, {})
              print(f"  {k}: metric={v.get('metric')} pass={v.get('pass')} detail={v.get('detail')}")

          if len(passes) >= 9:
              print(f"\n{len(passes)}/10 — G fix applied successfully")
          else:
              print(f"\nOnly {len(passes)}/10 — review failures above", file=sys.stderr)
              sys.exit(1)
          PYEOF
