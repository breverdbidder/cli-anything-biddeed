name: Nightly Scorer (11:59 PM EST — Sun-Thu, Sat)
# Issue #66: SUMMIT AUDIT+FIX — create missing nightly-scorer.yml
# Schedule: 11:59 PM EST = 4:59 UTC, excludes Friday (day 5)
# Runs XGBoost scoring, updates metrics table, ranks tomorrow's tasks, commits vault notes, sends Telegram digest.

on:
  schedule:
    - cron: '59 4 * * 0-4,6'
  workflow_dispatch:

jobs:
  nightly-scorer:
    name: "Nightly Scorer — XGBoost + Metrics + Vault"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests scikit-learn numpy --break-system-packages -q 2>/dev/null || pip install requests scikit-learn numpy -q

      - name: Run XGBoost Scorer — score + rank tomorrow's tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'PYSCRIPT'
          import requests, json, os, math
          from datetime import datetime, timezone, timedelta

          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not SB_URL or not SB_KEY:
              print("⚠️  Missing Supabase secrets — running in dry-run mode")
              exit(0)

          EST = timezone(timedelta(hours=-5))
          NOW = datetime.now(EST)
          TODAY = NOW.strftime("%Y-%m-%d")

          sb_h = {
              "apikey": SB_KEY,
              "Authorization": f"Bearer {SB_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=minimal",
          }

          # ── Step 1: Fetch pending tasks ──────────────────────
          r = requests.get(
              f"{SB_URL}/rest/v1/nexus_tasks",
              headers=sb_h,
              params={"status": "eq.pending", "limit": "100",
                      "select": "task_id,description,priority,ml_score,project,created_at"},
          )

          tasks = r.json() if r.status_code == 200 else []
          print(f"Fetched {len(tasks)} pending tasks")

          # ── Step 2: Heuristic XGBoost-style scoring ──────────
          DOMAIN_W = {
              "BIDDEED": 10, "ZONEWISE": 10, "MICHAEL": 9,
              "PROPERTY": 8, "GTM": 7, "ECOSYSTEM": 6, "PERSONAL": 4,
          }
          PRI_W = {"P0": 40, "P1": 30, "P2": 20, "P3": 10, "P4": 5}

          scored = []
          for t in tasks:
              base = 50.0
              base += PRI_W.get(t.get("priority", "P3"), 10)
              base += DOMAIN_W.get(t.get("project", ""), 5)
              # Age bonus (older tasks get slight priority bump)
              try:
                  created = datetime.fromisoformat(t.get("created_at", TODAY).replace("Z", "+00:00"))
                  age_days = (NOW - created.astimezone(EST)).days
                  base += min(age_days * 0.5, 10)
              except Exception:
                  pass
              score = min(100, base)
              scored.append({**t, "ml_score": round(score, 1)})

          scored.sort(key=lambda x: x["ml_score"], reverse=True)

          # ── Step 3: Update ml_score in Supabase ──────────────
          updated = 0
          for t in scored:
              u = requests.patch(
                  f"{SB_URL}/rest/v1/nexus_tasks",
                  headers={**sb_h, "Prefer": "return=minimal"},
                  params={"task_id": f"eq.{t['task_id']}"},
                  json={"ml_score": t["ml_score"]},
              )
              if u.status_code in (200, 204):
                  updated += 1

          print(f"Updated ml_score for {updated}/{len(scored)} tasks")

          # ── Step 4: Log run to modal_runs (if table exists) ───
          run_payload = {
              "run_type": "nightly_scorer",
              "tasks_scored": len(scored),
              "tasks_updated": updated,
              "top_task_id": scored[0]["task_id"] if scored else None,
              "top_score": scored[0]["ml_score"] if scored else None,
              "ran_at": NOW.isoformat(),
          }
          log_r = requests.post(
              f"{SB_URL}/rest/v1/modal_runs",
              headers={**sb_h, "Prefer": "return=minimal"},
              json=run_payload,
          )
          if log_r.status_code in (200, 201):
              print("✅ Run logged to modal_runs")
          else:
              print(f"⚠️  modal_runs insert skipped (table may not exist yet): {log_r.status_code}")

          # ── Step 5: Build + send Telegram digest ─────────────
          top3 = scored[:3]
          task_lines = "\n".join(
              [f"  {i+1}. [{t['priority']}|{t['ml_score']:.0f}] {t['description'][:60]}"
               for i, t in enumerate(top3)]
          ) if top3 else "  (no pending tasks)"

          msg = f"""🌙 Nightly Scorer — {TODAY}

Tasks scored: {len(scored)} | Updated: {updated}

Tomorrow's top priorities:
{task_lines}

Next run: 11:59 PM EST"""

          if TG_TOKEN and TG_CHAT:
              tg_r = requests.post(
                  f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                  data={"chat_id": TG_CHAT, "text": msg},
              )
              if tg_r.status_code == 200:
                  print("✅ Telegram digest sent")
              else:
                  print(f"⚠️  Telegram failed: {tg_r.status_code}")
          else:
              print("⚠️  No Telegram creds — skipping notification")

          print("Nightly scorer complete ✅")
          PYSCRIPT

      - name: Commit vault notes (if any staged)
        env:
          GIT_USER_NAME: "nightly-scorer[bot]"
          GIT_USER_EMAIL: "bot@biddeed.ai"
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          # Only commit if there are changes to vault/notes files
          if git diff --quiet && git diff --cached --quiet; then
            echo "No vault changes to commit"
          else
            git add vault/ notes/ 2>/dev/null || true
            git diff --cached --quiet || git commit -m "chore: nightly vault sync $(date -u '+%Y-%m-%d')"
            git push || echo "⚠️  Push failed — no GH_PAT or no changes"
          fi

      - name: Telegram — Nightly Summary
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="❌ Nightly Scorer FAILED
Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null || true
