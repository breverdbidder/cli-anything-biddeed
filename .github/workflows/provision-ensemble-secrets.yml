name: Provision Ensemble Worker Secrets and Deploy

on:
  workflow_dispatch:

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Set SUPABASE_URL secret
        working-directory: workers/ensemble-inference
        run: echo "https://mocerqjnksmhcjzxrewo.supabase.co" | wrangler secret put SUPABASE_URL --name ensemble-inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set SUPABASE_SERVICE_KEY secret
        working-directory: workers/ensemble-inference
        run: echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_KEY --name ensemble-inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set WORKER_AUTH_SECRET secret
        working-directory: workers/ensemble-inference
        run: echo "889fe223b35cb687ec7cb9f20c2ae1e21ed03d3602252a0e50a20ebccd60c3fd" | wrangler secret put WORKER_AUTH_SECRET --name ensemble-inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Install dependencies
        working-directory: workers/ensemble-inference
        run: npm install

      - name: Deploy worker
        working-directory: workers/ensemble-inference
        run: npx wrangler deploy --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
