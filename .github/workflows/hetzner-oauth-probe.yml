name: Hetzner OAuth Probe v2
# 2026-04-20: corrects filename bug (.credentials.json not credentials.json)
# and explores non-browser refresh paths.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deep probe
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "::group::A. Token shape on /root/.credentials.json (keys + value types only)"
          $SSH "jq 'to_entries | map({k: .key, vtype: (.value | type), vlen: (.value | tostring | length)})' /root/.claude/.credentials.json 2>&1" || echo "parse failed"
          echo "::endgroup::"

          echo "::group::B. Nested claudeAiOauth structure (if OAuth shape)"
          $SSH "jq '.claudeAiOauth | if . then to_entries | map({k: .key, vtype: (.value | type), vlen: (.value | tostring | length)}) else \"no claudeAiOauth wrapper\" end' /root/.claude/.credentials.json 2>&1" || echo "nested probe failed"
          echo "::endgroup::"

          echo "::group::C. Expiration fields (non-sensitive)"
          $SSH "jq '{root_expires_at: .expires_at, nested_expires_at: .claudeAiOauth.expiresAt, root_exp: .exp, scopes: .claudeAiOauth.scopes, account_uuid: (.claudeAiOauth.accountUuid // \"none\"), subscription: (.claudeAiOauth.subscriptionType // \"none\")}' /root/.claude/.credentials.json 2>&1" || echo "exp fields probe failed"
          echo "::endgroup::"

          echo "::group::D. Has refresh_token? (length only, not value)"
          $SSH "jq '{has_refresh_at_root: (has(\"refreshToken\") or has(\"refresh_token\")), has_refresh_nested: (.claudeAiOauth | has(\"refreshToken\")), refresh_len: (.claudeAiOauth.refreshToken // .refreshToken // .refresh_token // empty | tostring | length)}' /root/.claude/.credentials.json 2>&1" || echo "refresh probe failed"
          echo "::endgroup::"

          echo "::group::E. Claude CLI top-level commands"
          $SSH "claude --help 2>&1 | head -60" || true
          echo "::endgroup::"

          echo "::group::F. Claude CLI login/auth subcommands"
          $SSH "claude /help 2>&1 | head -80" || true
          echo "::endgroup::"

          echo "::group::G. Claude CLI session / account commands (any refresh paths?)"
          $SSH "HOME=/root claude --print '/login' --max-turns 1 2>&1 | head -20 || echo 'test interactive cmd failed'"
          echo "::endgroup::"

          echo "::group::H. Network check — can we reach Anthropic from Hetzner?"
          $SSH "curl -s -o /dev/null -w 'status=%{http_code} time=%{time_total}\n' https://api.anthropic.com/v1/messages -X POST -H 'Content-Type: application/json' -d '{}' 2>&1" || true
          echo "::endgroup::"

          echo "::group::I. Check for backup credential files that might be fresher"
          $SSH "find /root/.claude /home/summit/.claude -name '*credential*' -printf '%T+ %s %p\n' 2>&1 | sort" || true
          echo "::endgroup::"

          echo "::group::J. Cliproxy status + supported backends"
          $SSH "curl -s http://127.0.0.1:8317/health 2>&1 || curl -s http://127.0.0.1:8317/v1/models 2>&1 || echo 'cliproxy probe failed'" | head -30
          echo "::endgroup::"

          echo "::group::K. Cliproxy config (which models/providers it supports — credential-redacted v3)"
          # v3 redactor (2026-05-27): replaces sed-with-broken-quote-regex with Python pattern-matching
          # against the canonical R5 STOP patterns. Handles quoted AND unquoted YAML scalars.
          # Fix for credential leak in run 26510225937 (see ci_v65_event_log id 6d739e34).
          $SSH "cat /opt/cliproxy-gateway/config.yaml 2>&1 | head -120" | python3 -c "
import sys, re
text = sys.stdin.read()
# R5 STOP patterns — name : regex pairs
patterns = [
    ('GOOGLE_API_KEY',     r'AIza[A-Za-z0-9_\-]{20,}'),
    ('ANTHROPIC_API_KEY',  r'sk-ant-[A-Za-z0-9_\-]{20,}'),
    ('OPENAI_COMPAT_KEY',  r'sk-[A-Za-z0-9_\-]{20,}'),
    ('BIDDEED_GATEWAY',    r'biddeed-gw-[A-Za-z0-9_\-]{20,}'),
    ('GH_PAT',             r'ghp_[A-Za-z0-9_\-]{20,}'),
    ('GH_SERVER_TOKEN',    r'ghs_[A-Za-z0-9_\-]{20,}'),
    ('SUPABASE_PAT',       r'sbp_[A-Za-z0-9_\-]{20,}'),
    ('JWT_TOKEN',          r'eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'),
    ('GENERIC_HEX64',      r'\b[a-f0-9]{64}\b'),
]
for label, pat in patterns:
    text = re.sub(pat, lambda m, l=label: f'REDACTED({l},len={len(m.group(0))})', text)
print(text)
" || true
          echo "::endgroup::"
