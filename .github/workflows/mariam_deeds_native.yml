name: Mariam Deeds Native

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Single grantee or ALL'
        required: false
        default: 'MAXI DAY'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run NATIVE scraper on Hetzner (no Browserless)
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          set -e
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          cd /opt
          if [ ! -d brevard-bidder-scraper/.git ]; then
            git clone https://${GH_PAT}@github.com/breverdbidder/brevard-bidder-scraper.git
          else
            cd brevard-bidder-scraper && git pull origin main 2>/dev/null || true
            cd /opt
          fi
          cd brevard-bidder-scraper

          # Ensure Playwright + Chromium installed
          pip install --quiet playwright 2>&1 | tail -3 || true
          python3 -m playwright install chromium 2>&1 | tail -3 || true

          mkdir -p /tmp/mariam_native
          cd /tmp/mariam_native

          # Wrapper: calls native scraper but captures ALL doc types (including deeds)
          cat > runner.py <<'PY'
          import asyncio, json, os, sys, re
          from datetime import datetime

          async def search_all_doctypes(party_name: str):
              """Same flow as acclaimweb_scraper_native but captures all doc types."""
              from playwright.async_api import async_playwright

              result = {
                  "party": party_name,
                  "timestamp": datetime.utcnow().isoformat(),
                  "records": [],
                  "success": False,
                  "error": None,
                  "debug": [],
              }

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"]
                  )
                  ctx = await browser.new_context(
                      viewport={"width":1920,"height":1080},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  )
                  page = await ctx.new_page()
                  try:
                      print(f"[1] Loading disclaimer for {party_name}", flush=True)
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000
                      )
                      await asyncio.sleep(2)

                      # Click accept
                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)
                          result["debug"].append("Accepted disclaimer")
                      else:
                          result["debug"].append("No accept button found, continuing")

                      print(f"[2] On search page: {page.url}", flush=True)

                      # Find input field and submit
                      filled = False
                      for sel in [
                          "input[name='GranteeName']","input[name='gteeName']",
                          "input[id='GranteeName']","input[id='gteeName']",
                          "input[name*='Grantee']","input[id*='Grantee']",
                          "input[name*='gtee']","input[id*='gtee']",
                          "input[placeholder*='Grantee']","input[placeholder*='Last Name']",
                      ]:
                          try:
                              f = page.locator(sel)
                              if await f.count() > 0:
                                  await f.first.fill(party_name)
                                  filled = True
                                  result["debug"].append(f"filled via {sel}")
                                  print(f"[3] Filled field via {sel}", flush=True)
                                  break
                          except Exception as e:
                              pass

                      if not filled:
                          # Fallback to first text input
                          ti = page.locator("input[type='text']:visible")
                          if await ti.count() > 0:
                              await ti.first.fill(party_name)
                              filled = True
                              result["debug"].append("filled via first visible text input")

                      if not filled:
                          result["error"] = "could not find search input"
                          return result

                      # Set wide date range
                      for date_sel, value in [
                          ("input[name='FromDate']","01/01/2011"),
                          ("input[id='FromDate']","01/01/2011"),
                          ("input[name='ToDate']","12/31/2022"),
                          ("input[id='ToDate']","12/31/2022"),
                      ]:
                          try:
                              df = page.locator(date_sel)
                              if await df.count() > 0:
                                  await df.first.fill(value)
                          except: pass

                      # Submit
                      print("[4] Submitting search", flush=True)
                      submitted = False
                      for sel in ["input[value='Search']","button[type='submit']","input[type='submit']"]:
                          try:
                              b = page.locator(sel)
                              if await b.count() > 0 and await b.first.is_visible():
                                  await b.first.click()
                                  await page.wait_for_load_state("networkidle", timeout=60000)
                                  submitted = True
                                  break
                          except: pass

                      if not submitted:
                          result["error"] = "could not submit"
                          return result

                      await asyncio.sleep(3)
                      print(f"[5] Results URL: {page.url}", flush=True)

                      content = await page.content()
                      if "No records found" in content or "no results" in content.lower():
                          result["success"] = True
                          result["debug"].append("no records found")
                          return result

                      # Parse table — capture ALL doc types
                      rows = await page.locator("table tr").all()
                      result["debug"].append(f"found {len(rows)} rows")
                      print(f"[6] Parsing {len(rows)} rows", flush=True)

                      for row in rows[1:]:  # skip header
                          cols = await row.locator("td").all()
                          if len(cols) < 5: continue
                          try:
                              rec = {
                                  "document_number": (await cols[0].inner_text()).strip() if len(cols)>0 else "",
                                  "document_type":   (await cols[1].inner_text()).strip() if len(cols)>1 else "",
                                  "recording_date":  (await cols[2].inner_text()).strip() if len(cols)>2 else "",
                                  "book_page":       (await cols[3].inner_text()).strip() if len(cols)>3 else "",
                                  "grantor":         (await cols[4].inner_text()).strip() if len(cols)>4 else "",
                                  "grantee":         (await cols[5].inner_text()).strip() if len(cols)>5 else "",
                                  "amount":          (await cols[6].inner_text()).strip() if len(cols)>6 else "",
                              }
                              result["records"].append(rec)
                          except: pass

                      result["success"] = True
                      print(f"[7] Captured {len(result['records'])} records", flush=True)
                  except Exception as e:
                      result["error"] = str(e)
                  finally:
                      await browser.close()
              return result

          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
          target = os.environ.get("GRANTEE","MAXI DAY").strip().upper()
          targets = GRANTEES_ALL if target == "ALL" else [target]

          async def main():
              all_out = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_all_doctypes(g)
                  all_out[g] = r
                  print(f"  -> {len(r.get('records', []))} records, success={r.get('success')}", flush=True)
                  if r.get("error"):
                      print(f"  -> error: {r['error']}", flush=True)

              with open("/tmp/mariam_native/all_results.json","w") as f:
                  json.dump(all_out, f, indent=2, default=str)
              total = sum(len(v.get("records",[])) for v in all_out.values())
              print(f"\n>>> TOTAL: {total} records across {len(all_out)} grantees")
          asyncio.run(main())
          PY

          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee /tmp/mariam_native/run.log
          ls -la /tmp/mariam_native/
          REMOTE

      - name: Pull results
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_native/ /tmp/results/ || true
          ls -la /tmp/results/mariam_native/ 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_deeds_native_${{ inputs.grantee }}
          path: /tmp/results/

      - name: Print summary
        if: always()
        run: |
          if [ -f /tmp/results/mariam_native/all_results.json ]; then
            python3 - <<'PY'
            import json
            d = json.load(open('/tmp/results/mariam_native/all_results.json'))
            for g, v in d.items():
              recs = v.get('records', [])
              print(f"\n=== {g}: {len(recs)} records ===")
              for r in recs[:8]:
                print(f"  {r.get('recording_date'):<12} {r.get('document_type'):<6} #{r.get('document_number')} | {r.get('grantor','')[:30]:<30} -> {r.get('grantee','')[:30]}")
              if len(recs) > 8:
                print(f"  ... +{len(recs)-8} more")
            PY
          else
            echo "No results file"
            cat /tmp/results/mariam_native/run.log 2>/dev/null | tail -40 || true
          fi
