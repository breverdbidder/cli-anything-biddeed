name: "Summit: Watch Session 1 - Foundation"
on:
  workflow_dispatch: {}

jobs:
  session1:
    name: "DB + Edge Function"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute Session 1 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== [1/5] Setup Claude Code Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            export CLAUDE_CODE_OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [2/5] Update + Verify Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code ready"

            echo "=== [3/5] Clone/Pull Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo "Repo ready at $(pwd)"

            echo "=== [4/5] Run Claude Code Session 1 ==="
            cd /opt/biddeed/cli-anything-biddeed

            export SUPABASE_URL="$SUPABASE_URL"
            export SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY"
            export NPM_CONFIG_PREFIX=/root/.npm-global

            PROMPT="You are executing Session 1 of the Claude Watch (Everest Edition) build plan.

            READ docs/plans/WATCH-SPEC.md and docs/plans/WATCH-PLAN.md FIRST.

            Execute all steps in Session 1 of PLAN.md with these CRITICAL changes:

            1. DO NOT use supabase CLI - it cannot be installed via npm globally.
            2. For SQL migration: use curl to POST SQL to the Supabase Management API sql endpoint. Example: curl -X POST SUPABASE_URL/rest/v1/rpc/... with service key. Or use the Supabase SQL API: curl https://SUPABASE_URL/pg with auth header.
            3. For edge function deployment: create the function code in the repo but DO NOT deploy it yet - just commit the code. We will deploy the edge function separately.
            4. Create the full harness directory structure at harnesses/watch/
            5. Create all files: migration SQL, edge function TypeScript, package.json, tsconfig.json, types.ts
            6. Validate the migration by querying Supabase REST API for the new tables
            7. Git config: git config user.email ci@biddeed.ai and git config user.name BidDeed-CI
            8. Git push: git remote set-url origin https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
            9. CRITICAL: zero execSync anywhere in source code, verify with real queries, one attempt per approach
            10. Generate a WATCH_INGEST_TOKEN via openssl rand -hex 32 and print it at the end

            SUPABASE_URL and SUPABASE_SERVICE_KEY are available as environment variables."

            # Try auto-mode first, fallback to dangerously-skip-permissions
            if claude --help 2>&1 | grep -q "auto-mode"; then
              claude --print --auto-mode "$PROMPT" 2>&1 | tee /tmp/watch-session1.log | tail -100
            else
              claude --print --dangerously-skip-permissions "$PROMPT" 2>&1 | tee /tmp/watch-session1.log | tail -100
            fi

            EXIT_CODE=${PIPESTATUS[0]}

            echo "=== [5/5] Telegram Report ==="
            if [ $EXIT_CODE -eq 0 ]; then
              EMOJI="✅"
              STATUS="SUCCESS"
            else
              EMOJI="❌"
              STATUS="FAILED (exit $EXIT_CODE)"
            fi

            SUMMARY=$(tail -20 /tmp/watch-session1.log | head -10 | tr '\n' ' ' | cut -c1-400)
            MSG="${EMOJI} Watch Session 1: ${STATUS}%0A%0ARepo: cli-anything-biddeed%0ATarget: harnesses/watch/%0A%0A${SUMMARY}"

            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" > /dev/null 2>&1 || true

            exit $EXIT_CODE
