name: Hetzner Server Reset
on:
  workflow_dispatch:
jobs:
  reset-server:
    runs-on: ubuntu-latest
    steps:
      - name: Get server ID and reset
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          echo "=== Listing servers ==="
          curl -s -H "Authorization: Bearer $HETZNER_TOKEN" \
            "https://api.hetzner.cloud/v1/servers" | jq '.servers[] | {id, name, status, public_net}'

          echo ""
          echo "=== Getting server ID ==="
          SERVER_ID=$(curl -s -H "Authorization: Bearer $HETZNER_TOKEN" \
            "https://api.hetzner.cloud/v1/servers" | jq -r '.servers[0].id')
          echo "Server ID: $SERVER_ID"

          echo ""
          echo "=== Resetting server ==="
          curl -s -X POST -H "Authorization: Bearer $HETZNER_TOKEN" \
            "https://api.hetzner.cloud/v1/servers/$SERVER_ID/actions/reset" | jq .

          echo ""
          echo "=== Waiting 30s for reboot ==="
          sleep 30

          echo ""
          echo "=== Checking SSH ==="
          timeout 10 bash -c 'echo | nc -w 5 87.99.129.125 22' && echo "SSH IS OPEN" || echo "SSH STILL CLOSED"
