name: "Gold Standard SHARD-5 — palm_beach / gilchrist / columbia"
# dispatch_id: 7617ebac-a6a7-41d0-ab26-a879c1da0f08
# loop run 7622
#
# palm_beach: 10/10 (audit freshness only)
# gilchrist:  8/10 — E (42.9%), I (42.9%) — structural block, audit rows
# columbia:   6/10 — A/B/F/I — structural blocks, new channel investigation
#
# WIRING: daily 08:00Z / 16:00Z / 00:00Z to match fleet cadence
# Per PARALLEL-FLEET RULES: only touches palm_beach, gilchrist, columbia rows.
# Never touches other shards' counties.

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: gold-standard-shard5-palmbeach-gilchrist-columbia
  cancel-in-progress: false

jobs:
  shard5-investigation:
    name: "SHARD-5 ULTRALOOP — palm_beach / gilchrist / columbia"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ULTRALOOP investigation script
        run: |
          set -euo pipefail
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python3 scripts/gold_standard_shard5_palmbeach_gilchrist_columbia_run7622.py $DRY_FLAG

  verify-after:
    name: "Verify county evaluations after investigation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [shard5-investigation]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Evaluate all 3 counties
        run: |
          python3 -c "
          import json, os, urllib.request, urllib.error

          KEY = os.environ.get('SUPABASE_KEY', '')
          URL = os.environ.get('SUPABASE_URL', 'https://mocerqjnksmhcjzxrewo.supabase.co')

          if not KEY:
              print('No SUPABASE_KEY — skip evaluation')
              exit(0)

          def evaluate(county):
              req = urllib.request.Request(
                  f'{URL}/rest/v1/rpc/pencil_dod_evaluate_county',
                  data=json.dumps({'p_county': county}).encode(),
                  headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}',
                           'Content-Type': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {'error': str(e.code)}

          counties = ['palm_beach', 'gilchrist', 'columbia']
          for c in counties:
              result = evaluate(c)
              if isinstance(result, dict) and 'error' not in result:
                  score = sum(1 for k, v in result.items()
                              if isinstance(v, dict) and v.get('pass') is True)
                  print(f'{c}: {score}/10')
                  print(json.dumps(result, indent=2))
              else:
                  print(f'{c}: evaluation failed — {result}')
              print()
          "
