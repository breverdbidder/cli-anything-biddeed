name: Deploy roadmap page → zonewise.ai/roadmap

on:
  push:
    branches: [main]
    paths:
      - 'pages/roadmap.html'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - verify

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read roadmap page
        id: read_page
        run: |
          PAGE_CONTENT=$(cat pages/roadmap.html | base64 -w 0)
          echo "page_b64=${PAGE_CONTENT}" >> $GITHUB_OUTPUT
          PAGE_SIZE=$(wc -c < pages/roadmap.html)
          echo "page_size=${PAGE_SIZE}" >> $GITHUB_OUTPUT
          echo "Page size: ${PAGE_SIZE} bytes"

      - name: Validate brand colors present
        run: |
          if ! grep -q '#1E3A5F\|#F59E0B\|#020617' pages/roadmap.html; then
            echo "ERROR: Brand colors missing from roadmap.html"
            exit 1
          fi
          echo "Brand colors OK: #1E3A5F, #F59E0B, #020617 found"
          PHASE_COUNT=$(grep -c 'phase-card' pages/roadmap.html || true)
          echo "Phase cards found: ${PHASE_COUNT}"
          COMPETITOR_COUNT=$(grep -c 'threat-card' pages/roadmap.html || true)
          echo "Competitor cards found: ${COMPETITOR_COUNT}"

      - name: Get current file SHA from zonewise-web
        id: get_sha
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/contents/public/roadmap/index.html")
          SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          if [ -n "$SHA" ]; then
            echo "Existing file SHA: ${SHA} (will update)"
          else
            echo "No existing file (will create)"
          fi

      - name: Deploy to zonewise-web via GitHub API
        id: deploy
        run: |
          PAGE_B64="${{ steps.read_page.outputs.page_b64 }}"
          SHA="${{ steps.get_sha.outputs.sha }}"

          # Build request body
          if [ -n "$SHA" ]; then
            BODY=$(python3 -c "
          import json, sys
          body = {
            'message': 'deploy(roadmap): update /roadmap page [GTM-012]',
            'content': '$PAGE_B64',
            'sha': '$SHA',
            'branch': 'main'
          }
          print(json.dumps(body))
          ")
          else
            BODY=$(python3 -c "
          import json, sys
          body = {
            'message': 'deploy(roadmap): add /roadmap page [GTM-012]',
            'content': '$PAGE_B64',
            'branch': 'main'
          }
          print(json.dumps(body))
          ")
          fi

          HTTP_CODE=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/contents/public/roadmap/index.html")

          echo "HTTP response: ${HTTP_CODE}"
          cat /tmp/deploy_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Commit:', d.get('commit',{}).get('sha','N/A')[:12])" 2>/dev/null || true

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "Deploy SUCCESS (HTTP ${HTTP_CODE})"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Deploy FAILED (HTTP ${HTTP_CODE})"
            cat /tmp/deploy_response.json
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Wait for Vercel deploy (30s)
        run: sleep 30

      - name: Verify live page
        id: verify
        run: |
          HTTP=$(curl -s -o /tmp/roadmap_response.html -w "%{http_code}" \
            --max-time 15 \
            "https://zonewise.ai/roadmap/")

          echo "Live HTTP: ${HTTP}"

          if [ "$HTTP" -eq 200 ]; then
            if grep -q 'ZoneWise' /tmp/roadmap_response.html && \
               grep -q 'Algoma\|Gridics\|TestFit' /tmp/roadmap_response.html; then
              echo "Live verification: PASS"
              echo "verified=true" >> $GITHUB_OUTPUT
            else
              echo "Live verification: page returned 200 but content check failed"
              echo "verified=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Live page not yet available (HTTP ${HTTP}) — Vercel may still be deploying"
            echo "verified=pending" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram
        if: always()
        run: |
          DEPLOY_STATUS="${{ steps.deploy.outputs.status }}"
          VERIFIED="${{ steps.verify.outputs.verified }}"
          PAGE_SIZE="${{ steps.read_page.outputs.page_size }}"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi

          MSG="${ICON} GTM-012 — roadmap page deploy

          Status: ${DEPLOY_STATUS}
          Live verified: ${VERIFIED}
          Page size: ${PAGE_SIZE} bytes
          URL: https://zonewise.ai/roadmap/
          Repo: breverdbidder/cli-anything-biddeed
          Run: ${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG" || true

      - name: Comment on GitHub issue #36
        if: always()
        run: |
          DEPLOY_STATUS="${{ steps.deploy.outputs.status }}"
          VERIFIED="${{ steps.verify.outputs.verified }}"
          PAGE_SIZE="${{ steps.read_page.outputs.page_size }}"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            RESULT_ICON="✅"
            RESULT_TEXT="DEPLOYED"
          else
            RESULT_ICON="❌"
            RESULT_TEXT="FAILED"
          fi

          BODY="${RESULT_ICON} **GTM-012 — ZoneWise Roadmap ${RESULT_TEXT}**

          **URL:** https://zonewise.ai/roadmap/
          **Deploy status:** \`${DEPLOY_STATUS}\`
          **Live verified:** \`${VERIFIED}\`
          **Page size:** ${PAGE_SIZE} bytes

          **What was built:**
          - 20-phase feature roadmap from competitive gap analysis
          - Gap analysis vs Algoma · Gridics (PropZone) · TestFit
          - Priority matrix: Tier 1 (build now) → Tier 4 (2027)
          - GTM battle cards for all 3 competitors
          - 6-month success metrics
          - Visual HTML page deployed to zonewise.ai/roadmap

          **Roadmap doc:** \`docs/plans/GTM-012-ZONEWISE-ROADMAP.md\`

          Run: [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $(echo "$BODY" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}" \
            "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/36/comments" || true

      - name: Close nexus_tasks
        if: steps.deploy.outputs.status == 'success'
        run: |
          curl -s -X POST \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"done\", \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"notes\": \"GTM-012: ZoneWise roadmap deployed to zonewise.ai/roadmap. 20 phases, gap analysis vs Algoma/Gridics/TestFit.\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/nexus_tasks?issue_number=eq.36&repo=eq.cli-anything-biddeed" || true

  verify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'verify' }}
    steps:
      - name: Verify live page at zonewise.ai/roadmap
        run: |
          echo "Checking https://zonewise.ai/roadmap/"
          HTTP=$(curl -s -o /tmp/roadmap_check.html -w "%{http_code}" \
            --max-time 15 \
            "https://zonewise.ai/roadmap/")

          echo "HTTP: ${HTTP}"

          if [ "$HTTP" -eq 200 ]; then
            SIZE=$(wc -c < /tmp/roadmap_check.html)
            echo "Page size: ${SIZE} bytes"

            if grep -q 'ZoneWise' /tmp/roadmap_check.html; then echo "✅ Title check: PASS"; else echo "❌ Title check: FAIL"; fi
            if grep -q 'roadmap\|Algoma\|Gridics' /tmp/roadmap_check.html; then echo "✅ Content check: PASS"; else echo "❌ Content check: FAIL"; fi

            echo "✅ Live page: VERIFIED (HTTP 200, ${SIZE} bytes)"
          else
            echo "❌ Page not available (HTTP ${HTTP})"
            exit 1
          fi
