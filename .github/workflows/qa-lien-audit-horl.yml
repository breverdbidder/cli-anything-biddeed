name: QA + Lien Audit - VIERA EAST VS HORL

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run full QA + Lien Audit on Hetzner
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} '
            set -euo pipefail

            echo "============================================"
            echo " QA + LIEN AUDIT: VIERA EAST VS AMY L HORL"
            echo " Case: 05-2025-CC-022459-XXCC-BC"
            echo " Type: HOA FORECLOSURE (CRITICAL)"
            echo "============================================"

            # Ensure repos are current
            for repo in brevard-bidder-scraper everest-stack; do
              DIR="/home/claude/$repo"
              if [ -d "$DIR/.git" ]; then
                cd "$DIR" && git pull -q 2>/dev/null || true
              fi
            done

            cd /home/claude/brevard-bidder-scraper

            # Install deps if needed
            pip install requests beautifulsoup4 httpx --break-system-packages -q 2>/dev/null || true

            echo ""
            echo "[1/5] BCPAO Search — Owner: Horl"
            python3 -c "
import requests, json, sys

# BCPAO API search by owner name
url = \"https://www.bcpao.us/api/v1/search\"
params = {\"owner\": \"Horl\", \"activeonly\": \"true\"}
headers = {\"User-Agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\"}

try:
    r = requests.get(url, params=params, headers=headers, timeout=15)
    if r.status_code == 200:
        data = r.json()
        if isinstance(data, list) and len(data) > 0:
            for prop in data:
                print(json.dumps(prop, indent=2))
        else:
            print(f\"Response: {r.text[:500]}\")
    else:
        print(f\"HTTP {r.status_code}: {r.text[:300]}\")
except Exception as e:
    print(f\"BCPAO API error: {e}\")

# Try alternate endpoint
try:
    url2 = \"https://www.bcpao.us/api/v1/search?owner=HORL&activeonly=true\"
    r2 = requests.get(url2, headers=headers, timeout=15)
    print(f\"Alt endpoint: HTTP {r2.status_code}\")
    if r2.status_code == 200 and r2.text.strip():
        print(r2.text[:1000])
except Exception as e:
    print(f\"Alt error: {e}\")
" 2>&1 || echo "BCPAO search failed"

            echo ""
            echo "[2/5] BCPAO GIS API — Parcel search"
            python3 -c "
import requests, json

# Try BCPAO GIS REST API
base = \"https://gis.brevardfl.gov/gissrv/rest/services/Base_Map/Parcel_New_WKID2881/MapServer/5/query\"
params = {
    \"where\": \"UPPER(OWNER1) LIKE '%HORL%'\",
    \"outFields\": \"ACCOUNT,OWNER1,OWNER2,SITEADDR,LEGAL1,LEGAL2,JUSTVAL,BLDGVAL,LANDVAL,SQFT,YRBLT,BEDS,BATHS,USECODE\",
    \"f\": \"json\",
    \"returnGeometry\": \"false\"
}
headers = {\"User-Agent\": \"Mozilla/5.0\"}

try:
    r = requests.get(base, params=params, headers=headers, timeout=15)
    data = r.json()
    features = data.get(\"features\", [])
    print(f\"Found {len(features)} parcels for HORL\")
    for f in features:
        a = f[\"attributes\"]
        print(json.dumps(a, indent=2))
except Exception as e:
    print(f\"GIS error: {e}\")
" 2>&1 || echo "BCPAO GIS failed"

            echo ""
            echo "[3/5] AcclaimWeb — Recorded instruments for HORL"
            python3 -c "
import requests, json
from bs4 import BeautifulSoup

session = requests.Session()
session.headers.update({
    \"User-Agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\"
})

# AcclaimWeb party search
base = \"https://vaclmweb1.brevardclerk.us/AcclaimWeb\"

# Get search page first (session cookies)
try:
    r = session.get(f\"{base}/search/party\", timeout=15)
    print(f\"AcclaimWeb search page: HTTP {r.status_code}\")
except Exception as e:
    print(f\"AcclaimWeb connection: {e}\")
    exit()

# Search by party name
try:
    search_url = f\"{base}/search/party\"
    payload = {
        \"LastName\": \"HORL\",
        \"FirstName\": \"AMY\",
        \"PartyType\": \"Both\",
        \"SearchType\": \"Exact\"
    }
    r = session.post(search_url, data=payload, timeout=15, allow_redirects=True)
    print(f\"Search result: HTTP {r.status_code}, {len(r.text)} chars\")
    
    soup = BeautifulSoup(r.text, \"html.parser\")
    rows = soup.find_all(\"tr\")
    print(f\"Table rows found: {len(rows)}\")
    
    for row in rows[:20]:
        cells = row.find_all(\"td\")
        if cells:
            vals = [c.get_text(strip=True) for c in cells]
            print(\" | \".join(vals[:6]))
except Exception as e:
    print(f\"AcclaimWeb search error: {e}\")
" 2>&1 || echo "AcclaimWeb search failed"

            echo ""
            echo "[4/5] Store results to Supabase"
            python3 -c "
import requests, json, os
from datetime import datetime

SUPABASE_URL = os.environ.get(\"SUPABASE_URL\", \"\")
SUPABASE_KEY = os.environ.get(\"SUPABASE_KEY\", \"\")

if not SUPABASE_URL or not SUPABASE_KEY:
    # Try to read from local config
    for f in [\"/home/claude/.env\", \"/home/claude/brevard-bidder-scraper/.env\"]:
        try:
            with open(f) as fh:
                for line in fh:
                    if line.startswith(\"SUPABASE_URL=\"):
                        SUPABASE_URL = line.split(\"=\", 1)[1].strip()
                    elif line.startswith(\"SUPABASE_KEY=\"):
                        SUPABASE_KEY = line.split(\"=\", 1)[1].strip()
        except:
            pass

if SUPABASE_URL and SUPABASE_KEY:
    # Log the QA attempt to insights table
    payload = {
        \"category\": \"qa_property\",
        \"content\": json.dumps({
            \"case\": \"05-2025-CC-022459-XXCC-BC\",
            \"plaintiff\": \"VIERA EAST\",
            \"defendant\": \"AMY L HORL\",
            \"type\": \"HOA_FORECLOSURE\",
            \"auction_date\": \"2026-04-15\",
            \"status\": \"AUDIT_IN_PROGRESS\",
            \"critical_flag\": \"SENIOR_MORTGAGE_UNVERIFIED\",
            \"timestamp\": datetime.utcnow().isoformat()
        })
    }
    headers = {
        \"apikey\": SUPABASE_KEY,
        \"Authorization\": f\"Bearer {SUPABASE_KEY}\",
        \"Content-Type\": \"application/json\",
        \"Prefer\": \"return=representation\"
    }
    try:
        r = requests.post(f\"{SUPABASE_URL}/rest/v1/insights\", json=payload, headers=headers, timeout=10)
        print(f\"Supabase insert: HTTP {r.status_code}\")
    except Exception as e:
        print(f\"Supabase error: {e}\")
else:
    print(\"No Supabase credentials found\")
" 2>&1

            echo ""
            echo "[5/5] Save reports"
            mkdir -p /home/claude/.everest-stack/deals /home/claude/.everest-stack/audits

            cat > /home/claude/.everest-stack/audits/horl-viera-east-audit-$(date +%Y%m%d).md << REPORT
# Lien Audit: VIERA EAST VS AMY L HORL
Case: 05-2025-CC-022459-XXCC-BC
Mode: PRE-BID
