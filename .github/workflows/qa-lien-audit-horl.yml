DO NOT BID until AcclaimWeb confirms no active mortgage.

## Automated Data Collection
BCPAO GIS API: see output above
AcclaimWeb search: see output above

## Clearance
PENDING — requires AcclaimWeb mortgage verification
REPORT

            chown -R claude:claude /home/claude/.everest-stack
            echo ""
            echo "============================================"
            echo " AUDIT COMPLETE — Results above"
            echo "============================================"
          '

      - name: Telegram results
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔍 *QA + Lien Audit: VIERA EAST VS HORL*
            Case: 05-2025-CC-022459
            Type: ⚠️ HOA FORECLOSURE
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
