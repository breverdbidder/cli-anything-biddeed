name: "Viral Weekly Analyze — Cron"

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

jobs:
  weekly-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run analyze on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 55m
          envs: CLAUDE_OAUTH_B64,GH_PAT,SUPABASE_URL,SUPABASE_SERVICE_KEY,SUPADATA_API_KEY
          script: |
            set -e
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            chmod 644 /tmp/claude-oauth-token

            cat > /tmp/viral-env.sh << ENVEOF
            export PATH="/home/claude/.npm-global/bin:\$HOME/.local/bin:\$PATH"
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export CLAUDE_CODE_OAUTH_TOKEN=\$(cat /tmp/claude-oauth-token)
            export SUPABASE_URL="$SUPABASE_URL"
            export SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_KEY"
            export SUPADATA_API_KEY="$SUPADATA_API_KEY"
            export GH_PAT="$GH_PAT"
            ENVEOF
            chmod 644 /tmp/viral-env.sh

            su - claude -c '
              source /tmp/viral-env.sh

              cd /home/claude
              [ ! -d cli-anything-biddeed ] && git clone https://${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              cd cli-anything-biddeed && git pull

              claude --permission-mode auto -p "Read harnesses/viral/HARNESS.md. Execute weekly analysis: 1) Run src/analyze.py --manual --all 2) Run src/update_brain.py. Report structured summary."
            '
