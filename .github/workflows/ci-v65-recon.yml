name: CI V6.5 Recon
on:
  workflow_dispatch:
    inputs:
      slug:        { description: 'competitor slug', required: true, type: string }
      domain:      { description: 'root domain (no scheme)', required: true, type: string }
      mode:        { description: 'ci_v65_full | signal', required: false, default: 'ci_v65_full', type: string }
      requested_by:{ description: 'who asked', required: false, default: 'Ariel', type: string }
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SLUG: ${{ github.event.inputs.slug }}
      DOMAIN: ${{ github.event.inputs.domain }}
      MODE: ${{ github.event.inputs.mode }}
      REQ_BY: ${{ github.event.inputs.requested_by }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          pip install --quiet playwright httpx
          python -m playwright install --with-deps chromium
      - name: Run recon
        run: python .github/scripts/ci_v65_recon.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-v65-${{ github.event.inputs.slug }}
          path: out/
          if-no-files-found: warn
