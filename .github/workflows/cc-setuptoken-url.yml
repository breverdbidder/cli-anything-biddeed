name: cc setuptoken url
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: start setup-token and capture URL
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          # run setup-token as the claude user; it prints an oauth URL then waits for a code.
          # we only need the URL, so capture early output then kill it.
          rm -f /tmp/st.out
          su - claude -c 'setsid bash -c "claude setup-token > /tmp/st.out 2>&1 < /dev/null &"; sleep 12'
          echo "=== captured output ==="
          cat /tmp/st.out 2>/dev/null | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g'
          echo "=== extracted url ==="
          grep -oE 'https://[a-zA-Z0-9./?=_&%-]*(claude|anthropic)[a-zA-Z0-9./?=_&%-]*' /tmp/st.out 2>/dev/null | head -3
          echo END
          REMOTE
