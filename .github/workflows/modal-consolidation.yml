name: SSOT Consolidation (Modal Parallel)
on:
  workflow_dispatch:

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Modal
        run: pip install modal
      
      - name: Create Modal secret for Supabase
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DB_PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          modal secret create supabase-db SUPABASE_DB_PASSWORD="$DB_PW" 2>/dev/null || \
          modal secret update supabase-db SUPABASE_DB_PASSWORD="$DB_PW" 2>/dev/null || \
          echo "Secret may already exist — continuing"
      
      - name: Run parallel consolidation
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "🚀 Launching 67-county parallel consolidation on Modal"
          modal run scripts/consolidation_modal.py
          echo "✅ Consolidation complete"
