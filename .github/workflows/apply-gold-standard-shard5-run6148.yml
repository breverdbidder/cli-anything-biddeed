name: "Gold Standard Shard-5: pinellas/madison/hamilton run6148"
# dispatch_id: 8d7de4ab-5fc4-4b09-b83d-a31544402c4d
# Applies SQL migration + runs Python fixes for:
#   pinellas I (+1 card to 95%), madison A (TD bootstrap), hamilton C/D/E/I

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify only, no writes)"
        type: boolean
        default: false

jobs:
  apply-shard5-fixes:
    name: "Shard-5 run6148: pinellas/madison/hamilton"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "BEFORE: pencil_dod_evaluate_county for all 3 counties"
        run: |
          set -euo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json
            echo; echo
          }
          rq "BEFORE pinellas" "SELECT public.pencil_dod_evaluate_county('pinellas');"
          rq "BEFORE madison"  "SELECT public.pencil_dod_evaluate_county('madison');"
          rq "BEFORE hamilton" "SELECT public.pencil_dod_evaluate_county('hamilton');"

      - name: "Apply SQL migration: shard5 run6148"
        run: |
          set -euo pipefail
          echo "=== Applying 20260724t_gold_standard_shard5_pinellas_madison_hamilton_run6148.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260724t_gold_standard_shard5_pinellas_madison_hamilton_run6148.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration OK"

      - name: "Run Hamilton E parcel linkage script"
        run: |
          set -euo pipefail
          pip install --quiet urllib3 2>/dev/null || true
          python3 scripts/gold_standard_shard5_hamilton_e_parcel_link_run6148.py
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "AFTER: pencil_dod_evaluate_county + SQL verification"
        if: always()
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }
          rq "AFTER pinellas" "SELECT public.pencil_dod_evaluate_county('pinellas');"
          rq "AFTER madison"  "SELECT public.pencil_dod_evaluate_county('madison');"
          rq "AFTER hamilton" "SELECT public.pencil_dod_evaluate_county('hamilton');"
          rq "PINELLAS I card_complete count" \
            "SELECT COUNT(*) AS total, COUNT(pz.parcel_id) AS with_pz, COUNT(CASE WHEN mca.latitude IS NOT NULL THEN 1 END) AS with_geo FROM multi_county_auctions mca LEFT JOIN parcel_zones pz ON pz.parcel_id = mca.parcel_id AND pz.jurisdiction_id = 635 WHERE mca.county = 'pinellas' AND mca.parcel_id IS NOT NULL AND mca.parcel_id NOT IN ('MULTIPLE PARCELS', 'Property Appraiser', 'SINGLE MEMBER INTEREST');"
          rq "MADISON A lane check" \
            "SELECT sale_type, source_platform, COUNT(*) AS cnt FROM multi_county_auctions WHERE county = 'madison' GROUP BY 1, 2 ORDER BY 2, 3;"
          rq "HAMILTON C/D parity check" \
            "SELECT parity_status, COUNT(*) AS cnt FROM multi_county_auctions WHERE county = 'hamilton' GROUP BY 1 ORDER BY 2 DESC;"
          rq "HAMILTON E parcel link check" \
            "SELECT case_number, parcel_id IS NOT NULL AS has_parcel FROM multi_county_auctions WHERE county = 'hamilton' AND sale_type = 'foreclosure' ORDER BY case_number;"
          rq "HAMILTON I sample_properties + parcel_zones check" \
            "SELECT mca.case_number, mca.parcel_id, sp.lat IS NOT NULL AS has_geo, pz.zone_code FROM multi_county_auctions mca LEFT JOIN sample_properties sp ON sp.parcel_id = mca.parcel_id LEFT JOIN parcel_zones pz ON pz.parcel_id = mca.parcel_id WHERE mca.county = 'hamilton' ORDER BY mca.sale_type, mca.case_number;"
          rq "ULTRALOOP AUDIT rows this dispatch" \
            "SELECT county_slug, letter, survived, created_at FROM gold_standard_ultraloop_audit WHERE dispatch_id = '8d7de4ab-5fc4-4b09-b83d-a31544402c4d' ORDER BY county_slug, letter;"
