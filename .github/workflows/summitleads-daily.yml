name: summitleads-daily
# SummitLeads Signal -> Skip-trace -> Quote-Draft -> Route -> Deliver, daily at 7AM Eastern.
# See scripts/summitleads_pipeline.py. Degrades (does not fail) when BRIGHTDATA_*/TRACERFY_API_KEY
# are absent — logs BLOCKED and runs on existing winning_bidder data only. Never fabricates leads.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"   # 7:00 AM EDT (11:00 UTC) — issue #19392 Sprint 5
concurrency: {group: summitleads-daily, cancel-in-progress: false}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run SummitLeads pipeline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
        run: python scripts/summitleads_pipeline.py
      - name: Commit batch files
        run: |
          git config user.name "summitleads-bot"
          git config user.email "actions@github.com"
          git add summitleads/batches/
          git diff --cached --quiet || git commit -m "SummitLeads daily batch $(date -u +%Y-%m-%d)"
          git push
