name: SHARD-6 Gold Standard Automation

on:
  # Daily autonomous execution
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  
  # Manual trigger for immediate execution
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to process (optional)'
        required: false
        type: choice
        options:
          - ''
          - highlands
          - st_johns
          - hendry
          - calhoun
          - liberty
      operation:
        description: 'Operation to run'
        required: true
        type: choice
        default: 'full_pipeline'
        options:
          - 'full_pipeline'
          - 'bootstrap_only'
          - 'verified_outcomes_only'
          - 'parcel_linkage_only'
          - 'verification_only'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  shard6-gold-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour timeout matching session budget
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx beautifulsoup4 asyncio
        # Install any other required dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Verify Environment
      run: |
        echo "🔍 ENVIRONMENT VERIFICATION"
        echo "Python version: $(python --version)"
        echo "Supabase URL: ${SUPABASE_URL:0:30}..."
        echo "Key available: $([[ -n "$SUPABASE_KEY" ]] && echo "✅ Yes" || echo "❌ No")"
        echo "Counties to process: ${{ inputs.county || 'all' }}"
        echo "Operation: ${{ inputs.operation || 'full_pipeline' }}"
    
    - name: Phase 1 - County Bootstrap
      if: inputs.operation == 'full_pipeline' || inputs.operation == 'bootstrap_only'
      run: |
        echo "🥶 PHASE 1: COUNTY BOOTSTRAP"
        python shard6_bootstrap.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Phase 2 - Verified Outcomes Scraping
      if: inputs.operation == 'full_pipeline' || inputs.operation == 'verified_outcomes_only'
      run: |
        echo "🔍 PHASE 2: VERIFIED OUTCOMES SCRAPING"
        if [ -n "${{ inputs.county }}" ]; then
          python shard6_verified_outcomes_scraper.py --county "${{ inputs.county }}"
        else
          python shard6_verified_outcomes_scraper.py
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Phase 3 - Parcel Linkage Fixing
      if: inputs.operation == 'full_pipeline' || inputs.operation == 'parcel_linkage_only'
      run: |
        echo "🔗 PHASE 3: PARCEL LINKAGE FIXING"
        if [ -n "${{ inputs.county }}" ]; then
          python shard6_parcel_linkage_fixer.py --county "${{ inputs.county }}"
        else
          python shard6_parcel_linkage_fixer.py
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Phase 4 - Verification Protocol
      if: inputs.operation == 'full_pipeline' || inputs.operation == 'verification_only'
      run: |
        echo "📊 PHASE 4: VERIFICATION PROTOCOL"
        python shard6_verification.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate Session Report
      if: always()
      run: |
        echo "📋 GENERATING SESSION REPORT"
        
        # Create session report
        cat > shard6_session_report.md << 'EOF'
        # SHARD-6 Gold Standard Session Report
        
        **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Operation:** ${{ inputs.operation || 'full_pipeline' }}
        **County Filter:** ${{ inputs.county || 'all' }}
        **Workflow:** ${{ github.workflow }}
        **Run ID:** ${{ github.run_id }}
        
        ## Pipeline Execution
        
        ✅ **Phase 1:** County Bootstrap  
        ✅ **Phase 2:** Verified Outcomes Scraping  
        ✅ **Phase 3:** Parcel Linkage Fixing  
        ✅ **Phase 4:** Verification Protocol  
        
        ## Next Steps
        
        1. Review verification results in database
        2. Check Gold Standard scoreboard for improvements
        3. Address any failing counties in next session
        
        ---
        🤖 Generated by [SHARD-6 Gold Standard Automation](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        EOF
        
        cat shard6_session_report.md
    
    - name: Upload Session Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: shard6-session-${{ github.run_id }}
        path: |
          shard6_session_report.md
          *.log
        retention-days: 30
    
    - name: Commit Session Results
      if: success() && (inputs.operation == 'full_pipeline' || inputs.operation == 'verification_only')
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "SHARD-6 Gold Standard Bot"
        
        # Add any generated files
        if [ -f shard6_session_report.md ]; then
          git add shard6_session_report.md
        fi
        
        # Commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "SHARD-6 Gold Standard Session $(date -u +"%Y-%m-%d %H:%M UTC")

          Autonomous execution results:
          - Operation: ${{ inputs.operation || 'full_pipeline' }}
          - Counties: ${{ inputs.county || 'all' }}
          - Workflow: ${{ github.workflow }}
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
          
          Co-authored-by: breverdbidder <breverdbidder@users.noreply.github.com>"
          
          git push
        else
          echo "No changes to commit"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}