name: Sync Credentials → Supabase Vault

# Option C: GitHub secrets are source of truth. This workflow propagates
# values into vault.secrets via the public.sync_credential_from_gha RPC.
# The Smart Router (ecu_route_chat_llm) reads from vault, so this closes
# the loop without any human-in-the-loop.
#
# Triggers:
#   - schedule: every 15 minutes (eventual consistency safety net)
#   - workflow_dispatch: manual instant propagation
#   - push to this file: re-sync after any change to the sync logic itself
#
# Banned by design: ANTHROPIC_API_KEY is never referenced here, even
# though it exists in GitHub secrets. The Postgres function also
# hard-rejects it.

on:
  schedule:
    # LAUNCH-E (#20039, 2026-09-05): */15 -> :06/:21/:36/:51, off the
    # :00/:15/:30/:45 stampede marks (still every 15min). Recent failures on
    # this schedule are transient origin errors (Cloudflare 520 / PostgREST
    # "schema cache" 503) during DB restarts, not a logic bug — self-heal on
    # the next tick, so the schedule stays enabled, just retimed.
    - cron: '6,21,36,51 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-credentials-to-vault.yml'

permissions:
  contents: read

concurrency:
  group: sync-credentials-to-vault
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync credentials to Supabase vault
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Source secrets — whitelisted in the PG function. Any others ignored.
          CLAUDE_CODE_OAUTH_TOKEN:   ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_REFRESH_TOKEN: ${{ secrets.CLAUDE_CODE_REFRESH_TOKEN }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          BIDDEED_BOT_TOKEN:         ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID:       ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          RUN_ID:  ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY missing"
            exit 1
          fi

          # Map: GH_SECRET_NAME → vault_secret_name → value
          # The PG function validates this mapping. Mismatches log as 'error'.
          declare -A MAP=(
            ["CLAUDE_CODE_OAUTH_TOKEN"]="anthropic_oauth_bearer"
            ["CLAUDE_CODE_REFRESH_TOKEN"]="anthropic_oauth_refresh_token"
            ["GEMINI_API_KEY"]="gemini_api_key"
            ["BIDDEED_BOT_TOKEN"]="telegram_bot_token"
            ["BIDDEED_BOT_CHAT_ID"]="telegram_chat_id"
          )

          # Collect values into a parallel associative array. Done this way to
          # keep secret values out of any printed/echoed shell commands.
          declare -A VALUES=(
            ["CLAUDE_CODE_OAUTH_TOKEN"]="${CLAUDE_CODE_OAUTH_TOKEN:-}"
            ["CLAUDE_CODE_REFRESH_TOKEN"]="${CLAUDE_CODE_REFRESH_TOKEN:-}"
            ["GEMINI_API_KEY"]="${GEMINI_API_KEY:-}"
            ["BIDDEED_BOT_TOKEN"]="${BIDDEED_BOT_TOKEN:-}"
            ["BIDDEED_BOT_CHAT_ID"]="${BIDDEED_BOT_CHAT_ID:-}"
          )

          ANY_CHANGE=0
          ANY_ERROR=0

          for gh_name in "${!MAP[@]}"; do
            vault_name="${MAP[$gh_name]}"
            value="${VALUES[$gh_name]:-}"

            if [[ -z "$value" ]]; then
              echo "[$gh_name] skipped — GitHub secret is empty"
              continue
            fi

            # Build JSON body using jq so values with quotes/newlines stay safe
            payload=$(jq -n \
              --arg gn "$gh_name" \
              --arg vn "$vault_name" \
              --arg v  "$value" \
              --arg rid "$RUN_ID" \
              --arg rurl "$RUN_URL" \
              '{p_github_secret_name:$gn, p_vault_secret_name:$vn, p_value:$v, p_workflow_run_id:($rid|tonumber), p_workflow_run_url:$rurl}')

            # Call the RPC. Response body never logged at full fidelity.
            response=$(curl -sS --fail-with-body \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/sync_credential_from_gha" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary "$payload" 2>&1) || {
                echo "::error::[$gh_name] RPC call failed: $response"
                ANY_ERROR=1
                continue
              }

            action=$(echo "$response" | jq -r '.action // "unknown"')
            changed=$(echo "$response" | jq -r '.changed // false')

            echo "[$gh_name] → vault.$vault_name :: action=$action"

            if [[ "$changed" == "true" ]]; then
              ANY_CHANGE=1
            fi
            if [[ "$action" == "error" ]]; then
              ANY_ERROR=1
            fi
          done

          if [[ $ANY_CHANGE -eq 1 ]]; then
            echo "::notice::Vault updated. Router will pick up new credentials on next call."
          fi
          if [[ $ANY_ERROR -eq 1 ]]; then
            echo "::warning::At least one credential failed to sync — check public.v_gha_sync_recent"
            exit 1
          fi
