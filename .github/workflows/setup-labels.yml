name: Setup Required Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-labels.yml'
      - '.github/workflows/issue-triage-agent.md'

jobs:
  create-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create required labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              { name: "P0-critical", color: "B60205", description: "Security vulnerabilities, data loss, production down" },
              { name: "P1-high",     color: "D93F0B", description: "Broken core functionality, blocking workflows" },
              { name: "P2-medium",   color: "E4E669", description: "Non-blocking bugs, performance issues" },
              { name: "P3-low",      color: "0E8A16", description: "Nice-to-haves, cosmetic issues" },
              { name: "bug",         color: "D73A4A", description: "Something isn't working" },
              { name: "feature",     color: "A2EEEF", description: "New feature or request" },
              { name: "question",    color: "D876E3", description: "Further information is requested" },
              { name: "documentation", color: "0075CA", description: "Improvements or additions to documentation" },
              { name: "summit",      color: "5319E7", description: "SUMMIT task — autonomous execution" },
              { name: "ci-failure",  color: "E4E669", description: "CI workflow failed" },
              { name: "auto-diagnosed", color: "C5DEF5", description: "Automatically diagnosed by CI agent" },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
                console.log(`Created: ${label.name}`);
              } catch (e) {
                if (e.status === 422) {
                  // Label already exists — update color/description
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  console.log(`Updated: ${label.name}`);
                } else {
                  console.error(`Failed ${label.name}: ${e.message}`);
                }
              }
            }
