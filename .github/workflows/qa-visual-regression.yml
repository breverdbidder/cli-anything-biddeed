name: qa-visual-regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Skip visual-regression for PRs that touch zero visual surface.
    # Docs, shell scripts, .claude commands, and other workflow YAML cannot
    # change rendered UI, so running Playwright against them is a false-
    # positive check that blocks merge with no signal. Verified on PR #558
    # (docs + scripts only, 5 files) which produced a "no diff PNGs found"
    # failure because there was nothing visual to diff.
    paths-ignore:
      - '**/*.md'
      - 'scripts/**'
      - '.claude/**'
      - 'docs/**'
      - '.github/**'
      - '.husky/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitignore'
      - '.prettierrc'
      - '.prettierignore'
      - 'LICENSE'
      - 'README.md'

# Required check — blocks merge if visual diff > 1%
concurrency:
  group: qa-visual-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: QAWise Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Python deps (QAWise)
        run: |
          pip install httpx supabase --quiet

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Start Next.js server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Capture PR screenshots
        run: |
          npx playwright test --config=playwright.config.ts \
            --project=chromium \
            --grep="@visual" \
            --reporter=json \
            --output=playwright-results/
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        continue-on-error: true

      - name: Download baselines from Supabase
        run: |
          python3 - <<'EOF'
          import os, json, httpx, base64, pathlib

          supabase_url = os.environ.get("SUPABASE_URL", "")
          supabase_key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not supabase_url or not supabase_key:
              print("No Supabase credentials — skipping baseline download")
              exit(0)

          headers = {"apikey": supabase_key, "Authorization": f"Bearer {supabase_key}"}
          resp = httpx.get(
              f"{supabase_url}/rest/v1/visual_baselines?select=screen_name,baseline_url",
              headers=headers,
          )
          baselines = resp.json() if resp.status_code == 200 else []
          pathlib.Path("baselines").mkdir(exist_ok=True)
          for b in baselines:
              name = b["screen_name"]
              url = b.get("baseline_url", "")
              if url:
                  img_resp = httpx.get(url)
                  if img_resp.status_code == 200:
                      pathlib.Path(f"baselines/{name}.png").write_bytes(img_resp.content)
                      print(f"Downloaded baseline: {name}")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Compare screenshots vs baselines (Pixelmatch, threshold 1%)
        id: diff
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          // Install pixelmatch + pngjs inline if not in package.json
          try { require.resolve("pixelmatch"); } catch { execSync("npm install pixelmatch pngjs --no-save"); }

          const pixelmatch = require("pixelmatch");
          const { PNG } = require("pngjs");

          const THRESHOLD = 0.01; // 1% pixel diff allowed
          const screenshotDir = "playwright-results";
          const baselineDir = "baselines";

          if (!fs.existsSync(screenshotDir)) {
            console.log("No screenshots directory — skipping diff");
            process.exit(0);
          }

          const screenshots = fs.readdirSync(screenshotDir).filter(f => f.endsWith(".png"));
          let failed = false;
          const report = [];

          for (const file of screenshots) {
            const screen = file.replace(".png", "");
            const baselinePath = path.join(baselineDir, file);
            const actualPath = path.join(screenshotDir, file);

            if (!fs.existsSync(baselinePath)) {
              // No baseline — save current as new baseline candidate
              fs.copyFileSync(actualPath, baselinePath);
              report.push({ screen, status: "new_baseline", diff_pct: 0 });
              console.log(`NEW BASELINE: ${screen}`);
              continue;
            }

            const actual = PNG.sync.read(fs.readFileSync(actualPath));
            const expected = PNG.sync.read(fs.readFileSync(baselinePath));

            if (actual.width !== expected.width || actual.height !== expected.height) {
              report.push({ screen, status: "size_mismatch", diff_pct: 100 });
              console.log(`SIZE MISMATCH: ${screen} ${actual.width}x${actual.height} vs ${expected.width}x${expected.height}`);
              failed = true;
              continue;
            }

            const diff = new PNG({ width: actual.width, height: actual.height });
            const numDiff = pixelmatch(actual.data, expected.data, diff.data, actual.width, actual.height, { threshold: 0.1 });
            const totalPixels = actual.width * actual.height;
            const diffPct = numDiff / totalPixels;

            if (diffPct > THRESHOLD) {
              const diffPath = path.join(screenshotDir, `${screen}-diff.png`);
              fs.writeFileSync(diffPath, PNG.sync.write(diff));
              report.push({ screen, status: "failed", diff_pct: diffPct.toFixed(4) });
              console.log(`FAIL: ${screen} — ${(diffPct * 100).toFixed(2)}% diff (max 1%)`);
              failed = true;
            } else {
              report.push({ screen, status: "passed", diff_pct: diffPct.toFixed(4) });
              console.log(`PASS: ${screen} — ${(diffPct * 100).toFixed(2)}% diff`);
            }
          }

          fs.writeFileSync("visual-regression-report.json", JSON.stringify(report, null, 2));
          process.exit(failed ? 1 : 0);
          EOF

      - name: Upload new baselines to Supabase visual_baselines
        if: always()
        run: |
          python3 - <<'EOF'
          import os, json, httpx, base64, pathlib

          supabase_url = os.environ.get("SUPABASE_URL", "")
          supabase_key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not supabase_url or not supabase_key:
              exit(0)

          report_path = pathlib.Path("visual-regression-report.json")
          if not report_path.exists():
              exit(0)

          report = json.loads(report_path.read_text())
          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates",
          }
          sha = os.environ.get("GITHUB_SHA", "unknown")[:8]

          for item in report:
              if item["status"] in ("new_baseline", "passed"):
                  screen = item["screen"]
                  row = {
                      "screen_name": screen,
                      "diff_pct": float(item["diff_pct"]),
                      "status": item["status"],
                      "commit_sha": sha,
                  }
                  httpx.post(
                      f"{supabase_url}/rest/v1/visual_baselines",
                      headers=headers,
                      json=row,
                  )
                  print(f"Updated Supabase baseline: {screen}")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            playwright-results/*-diff.png
            visual-regression-report.json
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          if [ -f visual-regression-report.json ]; then
            echo "=== Visual Regression Report ==="
            cat visual-regression-report.json
          fi
