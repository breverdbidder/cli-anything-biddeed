name: Duval BCPAO Harvest

# Independent of the quarantined claude-code-direct.yml dispatch path.
# Runs on schedule + manual dispatch. Idempotent: queue-based, ON CONFLICT writes.

on:
  schedule:
    # Every 2 hours, 9am-9pm ET (13:00-01:00 UTC). Polite to BCPAO.
    - cron: '0 13,15,17,19,21,23,1 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Parcels per claim batch'
        required: false
        default: '50'
      priority_max:
        description: 'Max priority to claim (10=top20 only, 100=all)'
        required: false
        default: '100'
      rate:
        description: 'Requests per second'
        required: false
        default: '1.5'
      max_iters:
        description: 'Max claim/process cycles before exit'
        required: false
        default: '40'

concurrency:
  group: duval-bcpao-harvest
  cancel-in-progress: false   # never kill mid-batch; let it finish

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 50         # GH free-tier hard ceiling: 360 min; stay well under
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/duval-bcpao/requirements.txt

      - name: Run BCPAO harvester
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          USER_AGENT_EMAIL: ${{ secrets.USER_AGENT_EMAIL }}
        run: |
          python scrapers/duval-bcpao/duval_bcpao_scraper.py \
            --batch ${{ github.event.inputs.batch || '50' }} \
            --priority-max ${{ github.event.inputs.priority_max || '100' }} \
            --rate ${{ github.event.inputs.rate || '1.5' }} \
            --max-iters ${{ github.event.inputs.max_iters || '40' }}

      - name: Post-run queue report
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -c "
          import os, psycopg
          with psycopg.connect(os.environ['SUPABASE_DB_URL']) as c, c.cursor() as cur:
              cur.execute('''
                SELECT status, COUNT(*) FROM public.duval_bcpao_harvest_queue
                GROUP BY status ORDER BY 1
              ''')
              for s, n in cur.fetchall():
                  print(f'  {s:15} {n}')
              cur.execute('SELECT COUNT(*) FROM public.duval_bcpao_assessments WHERE parse_status=%s', ('parsed',))
              print(f'\\nparsed records total: {cur.fetchone()[0]}')
          "
