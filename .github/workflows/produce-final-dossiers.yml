"""

          # === PUSH ===
          print("\n=== Pushing to repos ===")
          push_file('breverdbidder/everest-vault',
                    '600-Research/battle-cards/rentcast-v6-FINAL.md',
                    bc_rentcast, 'feat(ci-v65): RentCast v6 FINAL battle card with VERIFIED Apify SimilarWeb + reverse-engineering')
          push_file('breverdbidder/everest-vault',
                    '600-Research/battle-cards/dealcheck-v6-FINAL.md',
                    bc_dealcheck, 'feat(ci-v65): DealCheck v6 FINAL battle card with VERIFIED Apify SimilarWeb + reverse-engineering')
          push_file('breverdbidder/everest-content',
                    'dossiers/competitive-intel/RENTCAST-DEALCHECK-CI-V65-FINAL.md',
                    narrative, 'feat(ci-v65): final combined narrative — RentCast vs DealCheck with all verified data')

          # Log to event_log
          ev_body = json.dumps({
              'source': 'final_dossiers_delivery',
              'source_url': 'https://github.com/breverdbidder/everest-vault/blob/main/600-Research/battle-cards/rentcast-v6-FINAL.md',
              'signal_kind': 'other',
              'payload': {
                  '_marker': 'VERIFIED',
                  'deliverables': ['rentcast-v6-FINAL.md', 'dealcheck-v6-FINAL.md', 'RENTCAST-DEALCHECK-CI-V65-FINAL.md'],
                  'date': d
              }
          }).encode()
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"{sb}/rest/v1/ci_v65_event_log", data=ev_body, method='POST',
                  headers={**SB_H, 'Content-Type':'application/json','Prefer':'return=minimal'}
              ), timeout=10)
              print("\n✓ event_log entry created")
          except Exception as e:
              print(f"event_log: {e}")

          print("\n::notice::CI V6.5 final dossiers delivered — battle cards + combined narrative live")
          PYEOF
