| Category | {rsw.get('category')} #{fmt_int(rsw.get('category_rank',{}).get('Rank') if isinstance(rsw.get('category_rank'),dict) else rsw.get('category_rank'))} | {dsw.get('category')} #{fmt_int(dsw.get('category_rank',{}).get('Rank') if isinstance(dsw.get('category_rank'),dict) else dsw.get('category_rank'))} | Different verticals |

### DealCheck trajectory (HISTORICAL VERIFIED)
- **Nov 2025**: 48,079 monthly visits (-22.3% MoM)
- **Apr 2026**: 29,843 monthly visits (**-38% over 5 months**)

DealCheck is shrinking faster than it was 6 months ago. RentCast appears stable-to-growing in the API vertical.

### Geographic surprises

**DealCheck has 23.1% Canadian traffic** — unusually strong cross-border for a US-only tool. Real Canadian distressed-asset investor base using DealCheck despite no Canadian data sources. Opportunity for BidDeed/ZoneWise Canadian expansion (later horizon).

**RentCast has 6.9% Pakistani + 1.8% Vietnamese traffic** — developer/scraper audience signal. Confirms B2B API model attracts global devs at low-cost markets, supporting BidDeed's MCP-native pitch.

## 2. Reverse-Engineered API Surface

Probed {STAMP} via reverse-engineering recon workflow. Full results: {storage_link('rentcast', 're-api-probes.json')} + {storage_link('dealcheck', 're-api-probes.json')}.

### RentCast API surface
- **{len(re_summarize(data['rentcast'].get('re'),'rentcast.io')['success'])} endpoints returned 2xx**
- **{len(re_summarize(data['rentcast'].get('re'),'rentcast.io')['auth_walled'])} endpoints auth-walled** (HTTP 401 → API exists, requires key)
- **Sitemap**: {(data['rentcast'].get('sitemap') or {}).get('url_count', 'unknown')} URLs indexed
- **developers.rentcast.io**: documented developer portal (probed)
