- **No public developer API** confirmed — DealCheck is app-only (iOS/Android/web)
- **MCP .well-known**: not present
- **Implication**: BidDeed at any API/MCP price point has no DealCheck competitor in the developer surface

## 3. Strategic Implications for BidDeed MCP V1

### Pricing thesis (validated)
RentCast's $0/$74/$169/$329 tier structure with **87K monthly visits and growing** is the model to match — not DealCheck's $0/$19/$39 consumer pricing with **30K monthly visits and shrinking**.

**BidDeed MCP V1 tier proposal** (per BIDDEED-MCP-V1-PRS.md, now validated):
- Free: $0/mo, 100 calls/mo
- Starter: $99/mo, 5,000 calls/mo
- Pro: $249/mo, 25,000 calls/mo
- Enterprise: $499+/mo, custom

### Differentiation (where neither competitor is)
1. **MCP-native from day 1** — neither RentCast nor DealCheck expose MCP `.well-known` endpoints
2. **Florida foreclosure + tax-deed depth** — RentCast is national/thin, doesn't have auction data
3. **Paired with ZoneWise.AI** — 67-county zoning intelligence layered on top of property data
4. **Agentic ecosystem positioning** — not "API" or "calculator" but "agentic AI ecosystem"

### Threat assessment
- **RentCast (Tier 1 threat)**: could add MCP layer if they noticed BidDeed. But solo founder, focused on national property data, unlikely to pivot to FL distressed-only depth.
- **DealCheck (Tier 2 threat)**: declining, no API surface, no overlap with BidDeed's developer audience. Compete on different axis.

