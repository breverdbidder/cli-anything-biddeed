| Metric | **RentCast** | **DealCheck** | Δ |
|---|---|---|---|
| Global rank | #{fmt_int(rsw.get('global_rank',{}).get('Rank') if isinstance(rsw.get('global_rank'),dict) else rsw.get('global_rank'))} | #{fmt_int(dsw.get('global_rank',{}).get('Rank') if isinstance(dsw.get('global_rank'),dict) else dsw.get('global_rank'))} | RentCast 90% better |
| US rank | #{fmt_int(rsw.get('country_rank',{}).get('Rank') if isinstance(rsw.get('country_rank'),dict) else rsw.get('country_rank'))} | #{fmt_int(dsw.get('country_rank',{}).get('Rank') if isinstance(dsw.get('country_rank'),dict) else dsw.get('country_rank'))} | RentCast 2.4× better |
| Monthly visits | **{fmt_int(rsw.get('monthly_visits'))}** | {fmt_int(dsw.get('monthly_visits'))} | **RentCast 2.9× more** |
