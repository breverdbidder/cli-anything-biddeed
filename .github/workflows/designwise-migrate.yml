name: "DesignWise: S1.4 Schema Migration"
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Install psql"
        run: sudo apt-get install -y -qq postgresql-client

      - name: "Run migration"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          echo "=== Running migration ==="
          psql \
            -h aws-0-us-east-1.pooler.supabase.com \
            -p 6543 \
            -U postgres.mocerqjnksmhcjzxrewo \
            -d postgres \
            -f designwise/migrations/001_designwise_tables.sql \
            --echo-errors 2>&1
          echo "=== Done ==="

      - name: "Verify 11 tables"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PASS=0
          for TABLE in design_tasks brand_violations visual_baselines page_analytics conversion_funnel support_tickets ab_tests deploy_log competitor_snapshots seo_audits stitch_usage; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              "${SUPABASE_URL}/rest/v1/${TABLE}?select=count&limit=0")
            if [ "$STATUS" = "200" ]; then echo "OK $TABLE"; PASS=$((PASS+1)); else echo "FAIL $TABLE ($STATUS)"; fi
          done
          echo "Result: $PASS/11"
          if [ "$PASS" -lt 11 ]; then exit 1; fi

      - name: "Telegram"
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=✅ *DESIGNWISE S1.4 VERIFIED*
          🗄️ 11/11 tables via REST API
          🔑 Pooler + password confirmed
          _Zero-HITL migrations operational._"

