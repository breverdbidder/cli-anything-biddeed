name: "DesignWise: S1.4 Schema Migration"
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install pg
      - name: "Debug password + Run migration"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Password length: ${#SUPABASE_DB_PASSWORD}"
          echo "First char: ${SUPABASE_DB_PASSWORD:0:1}"
          echo "Last char: ${SUPABASE_DB_PASSWORD: -1}"
          echo "Has whitespace: $(echo "$SUPABASE_DB_PASSWORD" | grep -c '[[:space:]]')"
          CLEAN_PW=$(echo "$SUPABASE_DB_PASSWORD" | tr -d '[:space:]')
          echo "Cleaned length: ${#CLEAN_PW}"
          export SUPABASE_DB_PASSWORD="$CLEAN_PW"
          node designwise/migrations/run_migration.js
      - name: "Verify 11 tables"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PASS=0
          for TABLE in design_tasks brand_violations visual_baselines page_analytics conversion_funnel support_tickets ab_tests deploy_log competitor_snapshots seo_audits stitch_usage; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" "${SUPABASE_URL}/rest/v1/${TABLE}?select=count&limit=0")
            if [ "$STATUS" = "200" ]; then echo "OK $TABLE"; PASS=$((PASS+1)); else echo "FAIL $TABLE ($STATUS)"; fi
          done
          echo "Result: $PASS/11"
          if [ "$PASS" -lt 11 ]; then exit 1; fi
      - name: "Telegram"
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode="Markdown" --data-urlencode "text=✅ *DB MIGRATION PIPELINE VERIFIED*
          🗄️ 11/11 tables + pooler working
          _Zero-HITL migrations operational._"
