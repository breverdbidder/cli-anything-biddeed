name: "Summit: DesignWise P3 — Content + QA + Support + Iterate"
on:
  workflow_dispatch: {}

jobs:
  p3-execute:
    name: "P3: Full Capability (Content, QA, Docs, A/B)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute P3 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web
            echo "Last 3 commits:"
            git log --oneline -3

            echo "=== [5/6] Claude Code — P3 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='${OAUTH_TOKEN}'
              export SUPABASE_URL='${SUPABASE_URL}'
              export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='${GH_PAT}'
              export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
              export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'

              cd /opt/biddeed/zonewise-web

              claude --print --dangerously-skip-permissions 'MISSION: DesignWise Squad P3 — Full Capability. Read docs/plans/DESIGNWISE-TODO.md first. P0 P1 P2 are complete. Execute P3 in priority order within 110 min. PRIORITY 1 — P1-2 leftover: Wire trackEvent to PostHog (2h). In lib/posthog.ts there is a typed track() function. Search entire codebase for any existing trackEvent or analytics calls. Wire them to use the posthog track() function. Add tracking to key user actions: explorer map interaction, chat query sent, pricing page viewed, signup CTA clicked. Import and call track() at each point. Commit. PRIORITY 2 — P3-3a ContentWise live usage counter (3h). Create a components/StatsCounter.tsx that queries Supabase for real counts. Check what tables exist by querying Supabase REST API or check lib/ files for table references. Show real numbers on the homepage for parcels analyzed and counties covered. Use SWR or fetch with revalidation. Style with house brand. If no good table exists, count from any available data source. Commit. PRIORITY 3 — P3-5a QAWise chat streaming E2E test (3h). Create tests/e2e/chat-streaming.spec.ts using Playwright. Test: navigate to explorer, find chat input, type a query, verify response appears. Also create tests/e2e/mobile.spec.ts testing at 375px and 768px viewports — verify no horizontal overflow, key elements visible. Commit. PRIORITY 4 — P3-4 SupportWise API docs page (3h). Create app/docs/page.tsx with API reference documentation. Cover: authentication, endpoints, rate limits, code examples in curl Python and JavaScript. Style with house brand dark theme. Add link to /docs in footer and help page. Commit. PRIORITY 5 — P3-2 IterateWise first A/B test setup (2h). If PostHog is accessible, use PostHog feature flags to set up first experiment. Create a simple hero CTA text variant. Document the experiment in a new Supabase table or in code comments. If PostHog feature flags API is not accessible from server, create the experiment config in code with a simple random split. Commit. PRIORITY 6 — P3-1f StitchWise cleanup (30m). If time: remove any references to deprecated google stitch-sdk or davideast from SPEC-PATCH.md or other files. Archive old StitchWise harness references. Commit. RULES: git config ci@biddeed.ai / BidDeed-CI. Remote: https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git. Commit after EACH task. Push to main. Update docs/plans/DESIGNWISE-TODO.md marking completed tasks. BUILD GATE: bun run build must pass after each commit. If context hits 50 percent, commit push what you have. Send Telegram when done with summary of completed tasks. COST DISCIPLINE: 10 dollar session max. GO.'
            "

            echo "=== [6/6] Done ==="
