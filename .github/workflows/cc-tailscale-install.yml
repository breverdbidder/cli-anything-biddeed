name: cc tailscale install
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: install tailscale
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          if command -v tailscale >/dev/null 2>&1; then
            echo "ALREADY_INSTALLED"
          else
            curl -fsSL https://tailscale.com/install.sh | sh 2>&1 | tail -5
          fi
          echo "=== version ==="
          tailscale version 2>&1 | head -3
          echo "=== tun device ==="
          ls -l /dev/net/tun 2>&1 || echo "no tun"
          echo "=== daemon ==="
          systemctl is-enabled tailscaled 2>&1
          systemctl is-active tailscaled 2>&1
          echo "=== status ==="
          tailscale status 2>&1 | head -5
          echo "END"
          REMOTE
