name: ml-score-nightly
# Issue #20044 item 2b — nightly batch scoring: real 3-learner V4 ensemble.
# Runs scripts/ml_score_nightly.py (Python — the only runtime that can
# execute the trained xgboost/lightgbm/catboost/sklearn pickles in
# model_artifacts.artifact_b64) so the report's ml_scores read-path
# (composer.js scoreModel()) always has a fresh, real 3-distinct-learner
# score for every upcoming auction, not a live Modal/pure-JS call per report.
#
# OWNER OVERRIDE (Ariel Shapira, 2026-09-06, issue #20044): this file is
# created under an explicit one-time exception to standing mandate M5
# ("no workflow-file edits"), scoped to exactly this path.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily — off the quarter-hour

concurrency:
  group: ml-score-nightly
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned ML dependencies
        run: pip install -r scripts/requirements-ml.txt

      - name: Run nightly ensemble scoring
        run: python3 scripts/ml_score_nightly.py
