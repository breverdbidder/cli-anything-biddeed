name: Run Supabase Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration SQL file path'
        required: true
        default: 'migrations/20260403_data_lake_v1.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      
      - name: Run migration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Running migration: ${{ github.event.inputs.migration_file }}"
          
          # Try transaction mode (port 6543) first
          echo "Attempting port 6543 (transaction mode)..."
          if psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
            -c "SELECT 1;" 2>/dev/null; then
            echo "✅ Connected via port 6543"
            psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
              -f "${{ github.event.inputs.migration_file }}" \
              -v ON_ERROR_STOP=1
          else
            echo "Port 6543 failed, trying direct connection (port 5432)..."
            if psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
              -c "SELECT 1;" 2>/dev/null; then
              echo "✅ Connected via direct"
              psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
                -f "${{ github.event.inputs.migration_file }}" \
                -v ON_ERROR_STOP=1
            else
              echo "❌ All connection methods failed"
              echo "Tried: pooler:6543, direct:5432"
              echo "Check SUPABASE_DB_PASSWORD secret"
              exit 1
            fi
          fi
          echo "✅ Migration complete"
      
      - name: Verify tables
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          CONN="postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"
          echo "📊 Verification:"
          psql "$CONN" -c "
            SELECT 'fl_parcels' as tbl, count(*) FROM fl_parcels
            UNION ALL SELECT 'fl_parcels w/ luse_desc', count(*) FROM fl_parcels WHERE luse_desc IS NOT NULL
            UNION ALL SELECT 'flood_zones', count(*) FROM flood_zones
            UNION ALL SELECT 'soils', count(*) FROM soils
            UNION ALL SELECT 'zoning_codes', count(*) FROM zoning_codes
            UNION ALL SELECT 'dor_land_use_codes', count(*) FROM dor_land_use_codes
          " 2>/dev/null || echo "Verify step skipped (connection issue)"
