name: Run Supabase Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'SQL file'
        required: true
        default: 'migrations/20260403_data_lake_v1.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run migration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Running: ${{ github.event.inputs.migration_file }}"
          echo "Testing direct IPv4 connection..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
            -c "SELECT 'connected' AS status, now();"
          echo "✅ Connected — executing migration..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
            -f "${{ github.event.inputs.migration_file }}" \
            -v ON_ERROR_STOP=1
          echo "✅ Migration complete"
      - name: Verify
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          CONN="postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require"
          psql "$CONN" -c "SELECT 'fl_parcels' as tbl, count(*)::text FROM fl_parcels UNION ALL SELECT 'dor_land_use_codes', count(*)::text FROM dor_land_use_codes UNION ALL SELECT 'zoning_codes', count(*)::text FROM zoning_codes UNION ALL SELECT 'flood_zones', count(*)::text FROM flood_zones;"
