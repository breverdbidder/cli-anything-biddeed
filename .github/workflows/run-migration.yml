name: Run Supabase Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration SQL file path'
        required: true
        default: 'migrations/20260403_data_lake_v1.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      
      - name: Run migration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Running migration: ${{ github.event.inputs.migration_file }}"
          psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres" \
            -f "${{ github.event.inputs.migration_file }}" \
            -v ON_ERROR_STOP=1
          echo "✅ Migration complete"
      
      - name: Verify tables
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "📊 Verification:"
          psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres" -c "
            SELECT 'fl_parcels' as tbl, count(*) FROM fl_parcels
            UNION ALL SELECT 'fl_parcels w/ luse_desc', count(*) FROM fl_parcels WHERE luse_desc IS NOT NULL
            UNION ALL SELECT 'flood_zones', count(*) FROM flood_zones
            UNION ALL SELECT 'soils', count(*) FROM soils
            UNION ALL SELECT 'wetlands', count(*) FROM wetlands
            UNION ALL SELECT 'future_land_use', count(*) FROM future_land_use
            UNION ALL SELECT 'zoning_codes', count(*) FROM zoning_codes
            UNION ALL SELECT 'dor_land_use_codes', count(*) FROM dor_land_use_codes
            UNION ALL SELECT 'parcel_sales_history', count(*) FROM parcel_sales_history
          "
