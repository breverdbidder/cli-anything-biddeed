name: Run Supabase Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration SQL file path'
        required: true
        default: 'migrations/20260403_data_lake_v1.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      
      - name: Run migration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Running migration: ${{ github.event.inputs.migration_file }}"
          
          # Shared pooler = IPv4 compatible (per Supabase docs)
          CONN="postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"
          
          echo "Connecting via shared pooler (IPv4)..."
          psql "$CONN" -c "SELECT 'connected' AS status, now();" || {
            echo "Pooler 6543 failed, trying session mode 5432..."
            CONN="postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require"
            psql "$CONN" -c "SELECT 'connected' AS status;" || { echo "❌ All failed"; exit 1; }
          }
          
          echo "✅ Connected — executing migration..."
          psql "$CONN" -f "${{ github.event.inputs.migration_file }}" -v ON_ERROR_STOP=1
          echo "✅ Migration complete"
      
      - name: Verify tables
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          CONN="postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"
          echo "📊 Verification:"
          psql "$CONN" -c "
            SELECT 'fl_parcels total' as metric, count(*)::text as val FROM fl_parcels
            UNION ALL SELECT 'fl_parcels w/ luse_desc', count(*)::text FROM fl_parcels WHERE luse_desc IS NOT NULL
            UNION ALL SELECT 'flood_zones', count(*)::text FROM flood_zones
            UNION ALL SELECT 'soils', count(*)::text FROM soils
            UNION ALL SELECT 'wetlands', count(*)::text FROM wetlands
            UNION ALL SELECT 'future_land_use', count(*)::text FROM future_land_use
            UNION ALL SELECT 'zoning_codes', count(*)::text FROM zoning_codes
            UNION ALL SELECT 'dor_land_use_codes', count(*)::text FROM dor_land_use_codes
            UNION ALL SELECT 'parcel_sales_history', count(*)::text FROM parcel_sales_history
            UNION ALL SELECT 'competitive_intel', count(*)::text FROM competitive_intel
          " 2>/dev/null || echo "Verify skipped"
