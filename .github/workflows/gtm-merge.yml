name: GTM Factory — merge

# CMO FACTORY CP0 (issue #19777). factory/gtm/merge.py IS the merge decision
# -- this workflow only supplies the environment (gh auth, verdict file
# checkout from main) and calls it. No model, no human judgment call lives
# in this workflow; merge.py refuses on anything short of
# verdict=="PASS" && gates_green==true, see factory/gtm/merge.py's own
# docstring. This is a CP0 skeleton: no validator role writes real
# docs/gtm/verdicts/<issue>.json files yet (that lands once CP1+ builds real
# GTM PRs), so a workflow_dispatch with a real issue number today is
# expected to refuse for lack of a verdict file -- that is correct, fails-
# closed behavior, not a bug.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'GTM issue number whose verdict file to act on (docs/gtm/verdicts/<issue>.json)'
        required: true
        type: string
      dry_run:
        description: 'Print the merge decision without calling gh pr merge'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '17 */6 * * *'

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (docs/gtm/verdicts/ and .factory/gtm/ read from main only)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Halt check (fails closed) — STOP file, control issue label, spi_gates
        id: halt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL || secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          HALTED=0
          REASONS=""

          if [ -f ".factory/gtm/STOP" ]; then
            HALTED=1; REASONS="${REASONS} STOP-file-present"
          fi

          LABELS=$(gh issue view 19780 --repo ${{ github.repository }} --json labels -q '.labels[].name' 2>/dev/null)
          RC=$?
          if [ $RC -ne 0 ]; then
            HALTED=1; REASONS="${REASONS} control-issue-label-unreadable(fails-closed)"
          elif echo "$LABELS" | grep -qx "factory:halt"; then
            HALTED=1; REASONS="${REASONS} factory:halt-label-set"
          fi

          GATE=$(curl -s --max-time 15 "${SUPABASE_URL}/rest/v1/spi_gates?gate_key=eq.gtm_factory_halt&select=verified_at" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          if [ -z "$GATE" ]; then
            HALTED=1; REASONS="${REASONS} spi_gates-unreadable(fails-closed)"
          else
            OPEN=$(echo "$GATE" | python3 -c "import json,sys; d=json.load(sys.stdin); print('1' if d and d[0].get('verified_at') is None else '0')" 2>/dev/null || echo "1")
            if [ "$OPEN" = "1" ]; then
              HALTED=1; REASONS="${REASONS} spi_gates.gtm_factory_halt-open"
            fi
          fi

          echo "halted=$HALTED" >> "$GITHUB_OUTPUT"
          echo "reasons=$REASONS" >> "$GITHUB_OUTPUT"
          echo "halt check: halted=$HALTED reasons=[$REASONS]"

      - name: Stop here if halted
        if: steps.halt.outputs.halted == '1'
        run: |
          echo "::error::GTM factory is HALTED (${{ steps.halt.outputs.reasons }}) — refusing to merge. See .factory/gtm/STOP.md for the resume contract."
          exit 1

      - name: Quota gate check (public.quota_gate_check('engineering'))
        id: quota
        if: steps.halt.outputs.halted == '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESP=$(curl -s --max-time 30 -X POST "${SUPABASE_URL}/rest/v1/rpc/quota_gate_check" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" -d '{"p_category":"engineering"}')
          echo "quota_gate_check response: $RESP"
          ALLOW=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("allow")).lower())' 2>/dev/null || echo "error")
          REASON=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("reason",""))' 2>/dev/null || echo "unreachable")
          if [ "$ALLOW" = "true" ]; then
            MODE="full"
          elif [ "$REASON" = "NO_READING" ]; then
            MODE="cap"   # NEVER silently skip on NO_READING -- still attempt the merge decision
          else
            MODE="skip"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "quota gate mode: $MODE (allow=$ALLOW reason=$REASON)"

      - name: Quota-denied — logged, not silent
        if: steps.halt.outputs.halted == '0' && steps.quota.outputs.mode == 'skip'
        run: |
          echo "::warning::quota_gate_check denied engineering-category work this run (mode=skip). Merge decision was NOT evaluated this run."
          exit 1

      - name: Merge decision (factory/gtm/merge.py — the ONLY place this decision is made)
        if: steps.halt.outputs.halted == '0' && steps.quota.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL || secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--issue ${{ inputs.issue || '0' }}"
          if [ "${{ inputs.dry_run }}" != "false" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 factory/gtm/merge.py $ARGS
