name: "SHARD-12 glades J residual comps — run 6288"
# Dispatch: 5a58baf4-dd28-46e3-9d10-3150e99d076f
# Session:  architect-20260725T000000
#
# Applies migrations/20260725_glades_j_residual_comps_run6288.sql to extend
# glades bid_decisions coverage from 59/70 (84.3%) toward the 95% threshold.
#
# Two passes:
#   PASS A: Widened residential comp window (0.5x-2.0x living area, since 2020)
#           targeting the ~7 residential rows with thin comp pools at the prior
#           0.7x-1.3x/since-2022 window.
#   PASS B: County-level vacant land fallback (co_no=32, no zip restriction,
#           0.25x-4.0x land sqft, since 2020) for the ~2 vacant land rows that
#           failed the prior zip-restricted search.
#
# The 2 rows with no fl_parcels join are left without bid_decisions (BLANK>WRONG).
# Maximum achievable J without fleet-wide parcel_id format fix: ~63-64/70 (90-91%).
#
# Wiring: workflow_dispatch only (one-time migration, not ongoing cron).
# The glades-municode-notices-scraper.yml cron handles ongoing H/A freshness.

on:
  workflow_dispatch: {}

concurrency:
  group: glades-j-residual-run6288
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: "Apply glades J residual comps migration and verify"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run glades J residual comps executor
        run: python3 scripts/glades_j_residual_comps_run6288.py
