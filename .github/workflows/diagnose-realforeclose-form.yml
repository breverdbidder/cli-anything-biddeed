name: "Diagnose RealForeclose login form structure"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet httpx
      - name: Probe login form and preview page
        env:
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import httpx, re, os

          HOST = "https://brevard.realforeclose.com"
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          print(f"EMAIL set: {bool(EMAIL)}, PW set: {bool(PW)}")

          client = httpx.Client(follow_redirects=True, timeout=30.0,
                                 headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64)'})

          # 1. GET the login page and print the form HTML
          r0 = client.get(f"{HOST}/index.cfm")
          print(f"\n=== GET /index.cfm ===")
          print(f"Status: {r0.status_code}, URL: {r0.url}")
          print(f"Cookies: {list(client.cookies.keys())}")
          # Extract form HTML
          m = re.search(r'<form[^>]*(?:login|LOGIN|user|USER)[^>]*>.*?</form>', r0.text, re.DOTALL|re.IGNORECASE)
          if m:
              print(f"Form found:\n{m.group(0)[:2000]}")
          else:
              # Try to find any form
              m2 = re.search(r'<form[^>]*>.*?</form>', r0.text, re.DOTALL)
              if m2:
                  print(f"Form (first match):\n{m2.group(0)[:2000]}")
              else:
                  print(f"No form found. First 2000 chars:\n{r0.text[:2000]}")

          # 2. Try GET on the PREVIEW page without auth
          print(f"\n=== GET PREVIEW page (no auth) ===")
          r1 = client.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE=06/17/2026")
          print(f"Status: {r1.status_code}, URL: {r1.url}, len={len(r1.text)}")
          has_aitem = 'AITEM_' in r1.text
          has_login = 'LogName' in r1.text or 'Log In' in r1.text
          print(f"Has AITEM blocks: {has_aitem}, Has login form: {has_login}")
          if has_aitem:
              # Count them
              n = len(re.findall(r'<div\s+id="AITEM_\d+"', r1.text))
              print(f"AITEM count: {n}")
          else:
              print(f"First 500 chars: {r1.text[:500]!r}")

          # 3. Try the CALENDAR endpoint (often public)
          print(f"\n=== GET CALENDAR ===")
          r2 = client.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=CALENDAR")
          print(f"Status: {r2.status_code}, len={len(r2.text)}, has_login={'LogName' in r2.text}")
          if 'AITEM' in r2.text or 'auction' in r2.text.lower():
              print(f"First 500: {r2.text[:500]!r}")
          PYEOF
