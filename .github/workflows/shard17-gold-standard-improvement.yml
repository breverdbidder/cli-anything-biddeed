name: shard17-gold-standard-improvement
# GOLD STANDARD AUTOPILOT: Automated improvement cycle for charlotte, citrus, broward
# Runs F criterion promotion and C/D parity improvement on schedule
# Target: Move metrics toward 95% thresholds for gold standard certification

on:
  workflow_dispatch:
    inputs:
      max_fixes_per_county:
        description: "Maximum fixes to apply per county"
        required: false
        default: "100"
      skip_parity:
        description: "Skip parity improvement (focus on F criterion only)"
        required: false
        default: "false"
      
  schedule:
    # Run twice daily: 10:30 UTC and 22:30 UTC
    # Avoids peak usage and allows for outcome data accumulation
    - cron: "30 10,22 * * *"

concurrency:
  group: shard17-improvements
  cancel-in-progress: false

jobs:
  improve-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install httpx
          
      - name: Run F criterion improvement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== F CRITERION (tier1_sold_amount) IMPROVEMENT ==="
          python scripts/shard17_f_criterion_promoter.py
          
      - name: Run C/D parity improvement
        if: ${{ github.event.inputs.skip_parity != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_FIXES: ${{ github.event.inputs.max_fixes_per_county || '100' }}
        run: |
          echo "=== C/D PARITY IMPROVEMENT ==="
          python scripts/shard17_parity_improver.py
          
      - name: Report final metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== FINAL METRICS REPORT ==="
          python -c "
import sys
sys.path.append('scripts')
from shard17_f_criterion_promoter import Tier1Promoter

promoter = Tier1Promoter()
counties = ['charlotte', 'citrus', 'broward']

print('SHARD-17 Final Metrics:')
for county in counties:
    f_result = promoter.evaluate_county_f_criterion(county)
    if f_result:
        print(f'{county}: F={f_result.get(\"metric\", 0):.1f}% ({\"PASS\" if f_result.get(\"pass\") else \"FAIL\"})')
    else:
        print(f'{county}: F=ERROR (evaluation failed)')
"
          
      - name: Notify on significant improvement
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Optional: Create notification issue or comment if major improvement detected
          echo "Workflow completed successfully - metrics updated"