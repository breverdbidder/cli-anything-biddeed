name: SHARD-17 Gold Standard Campaign

on:
  workflow_dispatch:
    inputs:
      target_letters:
        description: 'Target letters (space-separated, e.g., "E B J")'
        required: false
        default: 'E B J'
      single_county:
        description: 'Target single county (optional)'
        required: false
        type: choice
        options:
          - 'all'
          - 'charlotte'
          - 'citrus'
          - 'broward'
        default: 'all'
  schedule:
    # Run every 4 hours during the 6h autonomous window
    - cron: '0 8,12,16 * * *'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  shard17-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour maximum per SHIP-TO-MAIN mandate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install httpx asyncio
          
      - name: Verify Supabase connection
        run: |
          python scripts/shard17_verification_protocol.py || echo "Verification failed but continuing campaign"
          
      - name: Run SHARD-17 Gold Standard Campaign
        run: |
          set -e
          echo "Starting SHARD-17 Gold Standard Campaign for counties: charlotte, citrus, broward"
          echo "Session start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Determine target parameters
          if [ "${{ github.event.inputs.single_county }}" != "all" ] && [ -n "${{ github.event.inputs.single_county }}" ]; then
            COUNTY_ARG="--county ${{ github.event.inputs.single_county }}"
          else
            COUNTY_ARG=""
          fi
          
          LETTERS="${{ github.event.inputs.target_letters }}"
          if [ -z "$LETTERS" ]; then
            LETTERS="E B J"
          fi
          
          # Convert space-separated letters to array format
          LETTER_ARGS=$(echo "$LETTERS" | tr ' ' '\n' | xargs -I {} echo "--letters {}" | xargs)
          
          echo "Executing: python scripts/shard17_gold_standard_campaign.py $LETTER_ARGS $COUNTY_ARG"
          
          # Execute the campaign
          python scripts/shard17_gold_standard_campaign.py $LETTER_ARGS $COUNTY_ARG
          
      - name: Commit and push changes
        run: |
          git config --global user.name "SHARD-17 Campaign Bot"
          git config --global user.email "shard17@biddeed.ai"
          
          # Add any generated files or updates
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: SHARD-17 Gold Standard improvements for charlotte, citrus, broward

            Auto-generated improvements for Gold Standard Letters:
            - Counties: ${{ github.event.inputs.single_county || 'charlotte, citrus, broward' }}
            - Letters: ${{ github.event.inputs.target_letters || 'E B J' }}
            - Session: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>"
            
            git push origin main
          fi
          
      - name: Final verification and report
        run: |
          echo "Campaign completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Running final verification protocol..."
          
          # Run final verification
          python scripts/shard17_verification_protocol.py || echo "Final verification completed with warnings"
          
      - name: Update workflow status
        if: always()
        run: |
          echo "SHARD-17 Campaign workflow completed"
          echo "Status: ${{ job.status }}"
          echo "Counties processed: charlotte, citrus, broward"