name: "Diagnose Orange Guard Failures (calendar_parity + denominator_integrity)"
# orange certify() blocked by no_calendar_parity+no_denominator_integrity
# cert_scope has no rows for orange — check certified counties to understand schema
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: "Diagnose orange guard failures — cert_scope focus"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              url = f"{SB}/rest/v1/{path}?{qs}"
              req = urllib.request.Request(url, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  GET {path} error: {e}")
                  return []

          def rpc(func, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{func}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body_bytes = e.read()
                  print(f"  RPC {func} error {e.code}: {body_bytes[:400]}")
                  return None

          # Check cert_scope for certified counties to understand schema
          print("=== gold_standard_cert_scope — sample from certified counties ===")
          rows = rest_get("gold_standard_cert_scope", {
              "select": "*", "limit": "5",
              "order": "created_at.desc"
          })
          for r in rows:
              print(json.dumps(r))
          if not rows:
              print("  (no rows in table)")

          # Try all column names via get on orange
          print("\n=== gold_standard_cert_scope for orange only ===")
          rows = rest_get("gold_standard_cert_scope", {"county_slug": "eq.orange", "select": "*"})
          for r in rows:
              print(json.dumps(r))
          if not rows:
              print("  (no rows)")

          # Check gold_standard_certifications for certified counties to understand the full schema
          print("\n=== gold_standard_certifications — certified=true examples ===")
          rows = rest_get("gold_standard_certifications", {
              "certified": "eq.true", "select": "*", "limit": "3"
          })
          for r in rows:
              print(json.dumps(r))

          # Try calling pencil_dod_evaluate_county with p_county_slug
          print("\n=== pencil_dod_evaluate_county(p_county_slug='orange') ===")
          ev = rpc("pencil_dod_evaluate_county", {"p_county_slug": "orange"})
          if ev:
              if isinstance(ev, list):
                  for row in ev:
                      print(json.dumps(row))
              else:
                  print(json.dumps(ev))

          # Try with county_name
          print("\n=== pencil_dod_evaluate_county(county_name='orange') ===")
          ev2 = rpc("pencil_dod_evaluate_county", {"county_name": "orange"})
          if ev2:
              if isinstance(ev2, list):
                  for row in ev2:
                      print(json.dumps(row))
              else:
                  print(json.dumps(ev2))

          # Check if there's a gold_standard_loop or similar function that seeds cert_scope
          print("\n=== gold_standard_scoreboard — all certified counties ===")
          rows = rest_get("gold_standard_scoreboard", {
              "gold_standard": "eq.true", "select": "county_slug,pass_count,gold_standard"
          })
          print(f"Total gold counties: {len(rows)}")
          for r in rows:
              print(f"  {r['county_slug']}")

          print("\n=== gold_standard_certifications — all rows ===")
          rows = rest_get("gold_standard_certifications", {"select": "county_slug,certified,consecutive_gold,first_certified_at"})
          for r in rows:
              print(json.dumps(r))
          PYEOF
