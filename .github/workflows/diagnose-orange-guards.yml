name: "Diagnose Orange Guard Failures (calendar_parity + denominator_integrity)"
# Digging deeper: check pencil_dod_scorecard, full certifications schema, and
# call pencil_dod_evaluate_county(p_county='orange') with correct parameter name.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: "Deep diagnose orange guard failures"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              url = f"{SB}/rest/v1/{path}?{qs}"
              req = urllib.request.Request(url, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  GET {path} error: {e}")
                  return []

          def rpc(func, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{func}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body_bytes = e.read()
                  print(f"  RPC {func} error {e.code}: {body_bytes[:400]}")
                  return None

          # Get full schema of gold_standard_certifications
          print("=== gold_standard_certifications — ALL columns for orange ===")
          rows = rest_get("gold_standard_certifications", {
              "county_slug": "eq.orange", "select": "*"
          })
          for r in rows:
              print(json.dumps(r, indent=2))

          print("\n=== gold_standard_certifications — ALL columns for brevard (certified) ===")
          rows = rest_get("gold_standard_certifications", {
              "county_slug": "eq.brevard", "select": "*"
          })
          for r in rows:
              print(json.dumps(r, indent=2))

          # Check pencil_dod_scorecard for orange
          print("\n=== pencil_dod_scorecard for orange ===")
          rows = rest_get("pencil_dod_scorecard", {
              "county_slug": "eq.orange", "select": "*", "order": "created_at.desc", "limit": "3"
          })
          for r in rows:
              print(json.dumps(r, indent=2))
          if not rows:
              print("  (no rows)")

          # Check pencil_dod_scorecard for brevard (certified)
          print("\n=== pencil_dod_scorecard for brevard ===")
          rows = rest_get("pencil_dod_scorecard", {
              "county_slug": "eq.brevard", "select": "*", "order": "created_at.desc", "limit": "1"
          })
          for r in rows:
              print(json.dumps(r, indent=2))

          # Try pencil_dod_evaluate_county(p_county='orange') — hint said p_county
          print("\n=== pencil_dod_evaluate_county(p_county='orange') ===")
          ev = rpc("pencil_dod_evaluate_county", {"p_county": "orange"})
          if ev:
              if isinstance(ev, list):
                  for row in ev[:5]:
                      print(json.dumps(row))
              else:
                  print(json.dumps(ev))

          # Call gold_standard_certify() and parse result carefully
          print("\n=== gold_standard_certify() detailed result ===")
          result = rpc("gold_standard_certify")
          print(json.dumps(result, indent=2))

          # Check if there's a view or function showing calendar_parity/denominator_integrity
          print("\n=== gold_standard_decisions (if exists) for orange ===")
          rows = rest_get("gold_standard_decisions", {
              "county_slug": "eq.orange", "select": "*", "limit": "3"
          })
          for r in rows:
              print(json.dumps(r, indent=2))
          if not rows:
              print("  (no rows or table doesn't exist)")

          # Check gold_standard_campaign table
          print("\n=== gold_standard_campaign for orange ===")
          rows = rest_get("gold_standard_campaign", {
              "county_slug": "eq.orange", "select": "*", "limit": "3"
          })
          for r in rows:
              print(json.dumps(r, indent=2))
          if not rows:
              print("  (no rows)")
          PYEOF
