name: Test Firecrawl Transcript
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Firecrawl Browser-Side Caption Fetch
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          KEY = os.environ["FIRECRAWL_API_KEY"]

          def fc(data):
              body = json.dumps(data).encode()
              req = urllib.request.Request("https://api.firecrawl.dev/v2/scrape", data=body, headers={
                  "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"
              }, method="POST")
              resp = urllib.request.urlopen(req, context=ctx, timeout=120)
              return json.loads(resp.read().decode())

          vid = "2kbINqpluM0"

          print("=== Firecrawl: Browser JS fetches captions URL ===")
          try:
              r = fc({
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "formats": ["markdown"],
                  "actions": [
                      {"type": "wait", "milliseconds": 5000},
                      {"type": "execute_javascript", "code": """
                          (async () => {
                              try {
                                  // Find timedtext URL in ytInitialPlayerResponse
                                  const scripts = document.querySelectorAll('script');
                                  let captionUrl = null;
                                  
                                  for (const s of scripts) {
                                      const text = s.textContent || s.innerText || '';
                                      const match = text.match(/"baseUrl"\s*:\s*"(https:\/\/www\.youtube\.com\/api\/timedtext[^"]+)"/);
                                      if (match) {
                                          captionUrl = match[1].replace(/\\\\u0026/g, '&').replace(/\\u0026/g, '&');
                                          break;
                                      }
                                  }
                                  
                                  if (!captionUrl) {
                                      // Try window.ytInitialPlayerResponse
                                      if (window.ytInitialPlayerResponse) {
                                          const tracks = window.ytInitialPlayerResponse?.captions?.playerCaptionsTracklistRenderer?.captionTracks;
                                          if (tracks && tracks.length > 0) {
                                              captionUrl = tracks[0].baseUrl;
                                          }
                                      }
                                  }
                                  
                                  if (captionUrl) {
                                      // Fetch from INSIDE the browser (same session/IP)
                                      const resp = await fetch(captionUrl + '&fmt=json3');
                                      const data = await resp.json();
                                      
                                      // Extract text from json3 format
                                      const events = data.events || [];
                                      let transcript = '';
                                      for (const evt of events) {
                                          if (evt.segs) {
                                              for (const seg of evt.segs) {
                                                  transcript += (seg.utf8 || '');
                                              }
                                              transcript += ' ';
                                          }
                                      }
                                      
                                      // Inject into page
                                      const div = document.createElement('div');
                                      div.id = 'extracted-transcript';
                                      div.textContent = 'TRANSCRIPT_DATA_START|' + transcript.trim() + '|TRANSCRIPT_DATA_END';
                                      document.body.prepend(div);
                                  } else {
                                      const div = document.createElement('div');
                                      div.id = 'extracted-transcript';
                                      div.textContent = 'NO_CAPTION_URL_FOUND';
                                      document.body.prepend(div);
                                  }
                              } catch(e) {
                                  const div = document.createElement('div');
                                  div.id = 'extracted-transcript';
                                  div.textContent = 'JS_ERROR:' + e.message;
                                  document.body.prepend(div);
                              }
                          })();
                      """},
                      {"type": "wait", "milliseconds": 5000},
                      {"type": "scrape"}
                  ],
                  "timeout": 90000
              })
              
              if r.get("success"):
                  md = r.get("data", {}).get("markdown", "")
                  print(f"Markdown: {len(md)} chars")
                  
                  # Look for our injected transcript
                  if "TRANSCRIPT_DATA_START" in md:
                      start = md.index("TRANSCRIPT_DATA_START|") + len("TRANSCRIPT_DATA_START|")
                      end = md.index("|TRANSCRIPT_DATA_END")
                      transcript = md[start:end]
                      print(f"✅ GOT TRANSCRIPT! {len(transcript)} chars")
                      print(f"First 500: {transcript[:500]}")
                      with open("/tmp/transcript_final.txt", "w") as f:
                          f.write(transcript)
                  elif "NO_CAPTION_URL_FOUND" in md:
                      print("❌ No caption URL found in page")
                  elif "JS_ERROR" in md:
                      idx = md.index("JS_ERROR:")
                      print(f"❌ {md[idx:idx+200]}")
                  else:
                      print("No transcript marker found in output")
                      # Save full output for inspection
                      with open("/tmp/full_output.txt", "w") as f:
                          f.write(md)
                      print(f"Saved full output. First 300: {md[:300]}")
              else:
                  print(f"Failed: {json.dumps(r)[:300]}")
          except Exception as e:
              print(f"Error: {e}")

          PYEOF

      - name: Save
        if: always()
        run: |
          mkdir -p output
          cp /tmp/transcript_final.txt /tmp/full_output.txt output/ 2>/dev/null || true
          ls -la output/
          for f in output/*; do
            echo "=== $f ($(wc -c < $f) bytes) ==="
            head -c 2000 "$f"
            echo -e "\n..."
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-final
          path: output/
