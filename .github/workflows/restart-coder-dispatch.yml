name: Restart Coder + Re-dispatch SUMMIT
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'SUMMIT issue number to re-dispatch after restart'
        required: true
        default: '150'

jobs:
  restart-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restart Coder on Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          echo "=== Restarting Coder ==="
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP << 'SSHEOF'
          set -e

          # Find and restart coder
          echo "Current coder status:"
          systemctl status coder 2>/dev/null || docker ps -a --filter name=coder 2>/dev/null || echo "Checking processes..."
          ps aux | grep -i coder | grep -v grep || echo "No coder process found"

          # Try systemctl first
          if systemctl is-active coder 2>/dev/null; then
            systemctl restart coder
            echo "Restarted via systemctl"
          elif docker ps -a --filter name=coder --format '{{.Names}}' 2>/dev/null | grep -q coder; then
            docker restart $(docker ps -a --filter name=coder --format '{{.Names}}' | head -1)
            echo "Restarted via docker"
          else
            # Check if coder binary exists
            which coder 2>/dev/null && echo "Coder binary found"
            # Try to start coder server
            if [ -f /usr/local/bin/coder ] || which coder >/dev/null 2>&1; then
              nohup coder server --address 0.0.0.0:7080 > /var/log/coder.log 2>&1 &
              echo "Started coder server manually"
            else
              echo "ERROR: Cannot find coder installation"
              exit 1
            fi
          fi

          # Wait for health
          echo "Waiting for Coder to be healthy..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080 | grep -qE '2[0-9][0-9]|3[0-9][0-9]'; then
              echo "Coder is UP after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Coder failed to start after 60s"
          exit 1
          SSHEOF

      - name: Re-dispatch SUMMIT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=${{ inputs.issue_number }}
          echo "Removing and re-adding 'coder' label on issue #${ISSUE}..."
          gh api repos/${{ github.repository }}/issues/${ISSUE}/labels/coder -X DELETE || true
          sleep 2
          gh api repos/${{ github.repository }}/issues/${ISSUE}/labels -f "labels[]=coder"
          echo "Re-dispatched SUMMIT #${ISSUE}"
