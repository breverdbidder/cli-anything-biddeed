name: "Gold Standard SHARD-1 — broward/flagler/liberty/alachua (dispatch e9965e7f)"
# dispatch_id: e9965e7f-9504-40b8-a038-a36bfd29d264
# chat_session: architect-20260723T160000
# issue: #13515
#
# Counties:
#   broward: 10/10 (MAINTAIN — H freshness + regression guard)
#   flagler: 8/10 (B/F FAIL — probe RealAuction Results Report, new angle)
#   liberty: 7/10 (A/B/F FAIL — check 24-CA-22 post-sale result, 2026-07-21)
#   alachua: 5/10 (C/D/E/I/J FAIL — extend J for new rows, probe parcel links)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target county or all'
        required: false
        default: 'all'
        type: choice
        options: [all, broward, flagler, liberty, alachua, verify_only]
  schedule:
    # 08:00Z, 16:00Z, 00:00Z waves (matches fleet cadence)
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
    - cron: '0 0 * * *'

concurrency:
  group: gold-standard-e9965e7f-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  shard-e9965e7f:
    name: "Shard e9965e7f — ${{ github.event.inputs.target || 'all' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
      REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
      DISPATCH_ID: e9965e7f-9504-40b8-a038-a36bfd29d264

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.email "shard-e9965e7f@biddeed.ai"
          git config user.name "Shard e9965e7f Gold Standard Bot"

      - name: Phase 1 — Baseline evaluations
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
import os, json, urllib.request

SB_URL = os.environ["SUPABASE_URL"]
SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

print("=== BASELINE EVALUATIONS ===")
for county in ["broward", "flagler", "liberty", "alachua"]:
    req = urllib.request.Request(
        f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
        data=json.dumps({"p_county": county}).encode(),
        headers=H, method="POST"
    )
    try:
        with urllib.request.urlopen(req, timeout=60) as r:
            ev = json.loads(r.read())
        passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
        failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
        print(f"\n{county.upper()}: {len(passed)}/10")
        print(f"  PASS: {passed}")
        print(f"  FAIL: {failed}")
        for l in "ABCDEFGHIJ":
            d = ev.get(l, {})
            print(f"    {l}: {'PASS' if d.get('pass') else 'FAIL'} metric={d.get('metric')} {d.get('detail','')}")
    except Exception as e:
        print(f"{county}: ERROR {e}")
PYEOF

