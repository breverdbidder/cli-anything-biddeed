import json, os, re, sys, urllib.error, urllib.request

SB_URL = os.environ["SUPABASE_URL"]
SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
H_SUPA = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

print("=== ALACHUA PARCEL LINKAGE — past-dated E-blocked cases ===")
print("Target cases: 01 2025 CA 003287 (2026-05-04), 01 2025 CA 001928 (2026-05-14)")
print("Prior evidence: these 2 are already matched_clean (parity PASS) but lack parcel_id")
print("RealForeclose: '01 2025 CA 003287' -> 'MULTIPLE PARCEL', '01 2025 CA 001928' -> 'Property Appraiser'")

# Get their current state
req = urllib.request.Request(
    f"{SB_URL}/rest/v1/multi_county_auctions?county=eq.alachua&case_number=in.(\"01 2025 CA 003287\",\"01 2025 CA 001928\")&select=*",
    headers=H_SUPA
)
try:
    with urllib.request.urlopen(req, timeout=30) as r:
        rows = json.loads(r.read())
    print(f"\nCurrent state of these 2 cases:")
    for row in rows:
        print(f"  {row.get('case_number')} | parcel_id={row.get('parcel_id')} | parity={row.get('parity_status')} | addr={row.get('property_address','')[:60]}")
except Exception as e:
    print(f"ERROR: {e}")

# Try Alachua County Property Appraiser ArcGIS by address for case 01 2025 CA 003287
# This is "MULTIPLE PARCEL" which means we need to match by address/plaintiff
# The address on this foreclosure case may be in the property_address field

print("\n=== Probe: Alachua PAO ArcGIS FeatureServer ===")
pao_url = "https://maps.acpafl.org/server/rest/services/PublicParcel/FeatureServer/0/query"

def query_pao(where_clause, out_fields="PARCEL_ID,PHY_ADDR1,PHY_CITY,JUST_VALUE"):
    params = urllib.parse.urlencode({
        "where": where_clause,
        "outFields": out_fields,
        "returnGeometry": "false",
        "f": "json",
        "resultRecordCount": "5"
    })
    req = urllib.request.Request(
        f"{pao_url}?{params}",
        headers={"User-Agent": UA}
    )
    try:
        with urllib.request.urlopen(req, timeout=20) as r:
            data = json.loads(r.read())
        features = data.get("features", [])
        return features
    except Exception as e:
        return []

import urllib.parse

# Case 01 2025 CA 001928: shard9 5th firing says this is matched_clean but no parcel_id
# Let's check the RealForeclose AJAX for its property address
print("Trying PAO ArcGIS for the two cases by exploring plaintiff addresses...")

# We know from shard9 that these cases ARE matched_clean (parity) and past-dated
# The E-gap is just these 2 (plus the future-dated cases)
# Since RealForeclose returns 'Property Appraiser' for 01 2025 CA 001928:
#   - This likely means the parcel is tax-exempt or government property
#   - Or it's a condo/unit case where the appraiser hasn't assigned a folio
# Since RealForeclose returns 'MULTIPLE PARCEL' for 01 2025 CA 003287:
#   - Multiple parcels are subject to the judgment
#   - A multi-parcel foreclosure can't be linked to a single parcel_id

# Try querying PAO ArcGIS by address for any clues
# First check if we have the address from MCA
req = urllib.request.Request(
    f"{SB_URL}/rest/v1/multi_county_auctions?county=eq.alachua&parcel_id=is.null&auction_date=lt.2026-07-23&select=case_number,property_address,auction_date,parity_status",
    headers=H_SUPA
)
try:
    with urllib.request.urlopen(req, timeout=30) as r:
        null_parcel_past = json.loads(r.read())
    print(f"\nAlachua past-dated rows without parcel_id: {len(null_parcel_past)}")
    for row in null_parcel_past:
        print(f"  {row.get('case_number')} | date={row.get('auction_date')} | parity={row.get('parity_status')} | addr={row.get('property_address','NONE')[:80]}")
        
        # Try PAO ArcGIS lookup by address if we have one
        addr = row.get('property_address', '')
        if addr and len(addr) > 10 and 'none' not in addr.lower():
            # Extract street number and name for partial match
            parts = addr.split(',')[0].strip() if ',' in addr else addr
            features = query_pao(f"PHY_ADDR1 LIKE '%{parts[:20]}%'")
            if features:
                print(f"    PAO ArcGIS found {len(features)} match(es):")
                for f in features[:3]:
                    attrs = f.get('attributes', {})
                    print(f"      parcel_id={attrs.get('PARCEL_ID')} addr={attrs.get('PHY_ADDR1')} city={attrs.get('PHY_CITY')} val={attrs.get('JUST_VALUE')}")
            else:
                print(f"    PAO ArcGIS: no match for address '{parts[:20]}'")
except Exception as e:
    print(f"ERROR: {e}")

print("\nConclusion: if PAO found matches above, those can be used to link parcel_ids.")
print("If no matches: E-gap for past-dated cases remains structurally blocked.")
PYEOF

