import os, json, urllib.request
from datetime import datetime, timezone

SB_URL = os.environ["SUPABASE_URL"]
SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

print(f"=== FINAL EVALUATIONS ===")
print(f"Timestamp: {datetime.now(timezone.utc).isoformat()}")

all_results = {}
for county in ["broward", "flagler", "liberty", "alachua"]:
    req = urllib.request.Request(
        f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
        data=json.dumps({"p_county": county}).encode(),
        headers=H, method="POST"
    )
    try:
        with urllib.request.urlopen(req, timeout=60) as r:
            ev = json.loads(r.read())
        passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
        failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
        score = len(passed)
        all_results[county] = {"score": score, "pass": passed, "fail": failed, "eval": ev}
        
        print(f"\n{county.upper()}: {score}/10 {'★ GOLD' if score == 10 else ''}")
        for l in "ABCDEFGHIJ":
            d = ev.get(l, {})
            status = "PASS" if d.get("pass") else "FAIL"
            metric = d.get("metric")
            detail = d.get("detail", "")
            print(f"  {l} {status} metric={metric} {detail}")
    except Exception as e:
        print(f"{county}: ERROR {e}")

print("\n### SQL VERIFICATION")
print(json.dumps(all_results, indent=2, default=str))

# Guard: broward must stay 10/10
broward = all_results.get("broward", {})
if broward.get("score", 0) < 10:
    print("ERROR: broward REGRESSED from 10/10!")
    import sys; sys.exit(1)
else:
    print(f"broward: MAINTAINED {broward['score']}/10 ✓")
