import json, os, re, sys, urllib.error, urllib.request
from datetime import datetime, timezone

SB_URL = os.environ["SUPABASE_URL"]
SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
H_SUPA = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json", "Prefer": "return=representation"}
UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

print("=== LIBERTY CASE 24-CA-22 POST-SALE CHECK ===")
print(f"Timestamp: {datetime.now(timezone.utc).isoformat()}")
print("Sale date: 2026-07-21. Today: 2026-07-23. Checking for result...")

def fetch(url, timeout=20):
    req = urllib.request.Request(url, headers={"User-Agent": UA})
    try:
        with urllib.request.urlopen(req, timeout=timeout) as r:
            return r.status, r.read().decode("utf-8", "ignore")
    except urllib.error.HTTPError as e:
        return e.code, e.read().decode("utf-8", "ignore")
    except Exception as e:
        return 0, str(e)

# Check liberty current MCA state
req = urllib.request.Request(
    f"{SB_URL}/rest/v1/multi_county_auctions?county=eq.liberty&select=*&limit=20",
    headers=H_SUPA
)
with urllib.request.urlopen(req, timeout=30) as r:
    liberty_rows = json.loads(r.read())
print(f"\nLiberty MCA rows: {len(liberty_rows)}")
for row in liberty_rows:
    print(f"  case={row.get('case_number')} status={row.get('auction_status')} sold={row.get('sold_amount')} date={row.get('auction_date')}")

# Check foreclosure_outcomes for liberty
req = urllib.request.Request(
    f"{SB_URL}/rest/v1/foreclosure_outcomes?county=eq.liberty&select=*&limit=20",
    headers=H_SUPA
)
with urllib.request.urlopen(req, timeout=30) as r:
    liberty_fo = json.loads(r.read())
print(f"\nLiberty foreclosure_outcomes: {len(liberty_fo)}")
for row in liberty_fo:
    print(f"  {row}")

# Check libertyclerk.com for results
urls = [
    "https://libertyclerk.com/courts/foreclosure-sales/",
    "https://libertyclerk.com/courts/tax-deeds/",
    "https://libertyclerk.com/",
]

for url in urls:
    status, body = fetch(url)
    print(f"\n{url} -> HTTP {status}, len={len(body)}")
    if status == 200:
        lower = body.lower()
        # Check for case number
        if "24-ca-22" in lower:
            idx = lower.find("24-ca-22")
            print(f"  FOUND 24-CA-22! Context: {body[max(0,idx-200):idx+400]}")
        # Check for sale result keywords
        for kw in ["sold", "result", "winning", "awarded", "amount", "bid"]:
            if kw in lower:
                lines = [l.strip()[:150] for l in body.split('\n') if kw in l.lower() and len(l.strip()) > 10]
                if lines:
                    print(f"  '{kw}' in {len(lines)} lines:")
                    for l in lines[:3]:
                        print(f"    {l}")
        # Check for TD listings
        if "no properties" in lower or "no tax deed" in lower or "no foreclosure" in lower:
            print(f"  Page indicates no active listings")
        if len(body) < 3000:
            print(f"  Short page, full preview: {body[:2000]}")
    else:
        print(f"  [blocked or error]")

# Check for any new TD cases
print("\n=== Liberty Tax Deed Check ===")
td_url = "https://libertyclerk.com/courts/tax-deeds/"
status, body = fetch(td_url)
print(f"HTTP {status}, len={len(body)}")
if status == 200:
    lower = body.lower()
    if "no properties" in lower or "no tax deed" in lower:
        print("CONFIRMED: still shows no active tax deed listings (A FAIL persists)")
    else:
        # Look for any property/case mentions
        case_patterns = re.findall(r'[\d]{2}-[A-Z]+-\d{4}|case\s*#?\s*[\w-]+', body, re.I)
        if case_patterns:
            print(f"Case patterns found: {case_patterns[:10]}")
        print(f"Body preview: {body[:1500]}")
