name: "Gold Standard Precert Guard Refresh (all counties)"

# Fixes the consecutive_gold=0 freeze: gold_standard_certify() requires
# calendar_parity + denominator_integrity guard rows dated within a rolling
# 7-day window. Before this workflow, only shard3's 5 counties got a daily
# refresh (gold-standard-shard3-daily.yml); every other county's guards were
# one-off inserts that silently expired after 7 days, permanently blocking
# streak accrual and triggering revocation at the next certify tick after
# expiry. See issue #10982 and insights row (anomaly_type=CERTIFY_TICK_ROOT_CAUSE).

on:
  schedule:
    # Daily 12:30 UTC — after the morning pencil_dod loop populates
    # gold_standard_county_status for the day.
    - cron: '30 12 * * *'
  workflow_dispatch:

concurrency:
  group: gold-standard-precert-guard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: "Refresh precert guards + certify tick"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Refresh precert guards for all 10/10 counties + run certify tick
        run: python3 scripts/gold_standard_precert_guard_refresh.py
