name: cc diag two
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: streaming diagnostic single district
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=40 root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          su - claude -c "timeout 360 claude -p \"\$(cat /home/claude/p_1332.txt)\" --output-format stream-json --verbose --dangerously-skip-permissions" </dev/null > /home/claude/raw2.txt 2>&1
          echo "=== exit $? ; bytes $(wc -c < /home/claude/raw2.txt) ; lines $(wc -l < /home/claude/raw2.txt) ==="
          echo "=== EVENT TYPES ==="
          grep -o '"type":"[a-z_]*"' /home/claude/raw2.txt | sort | uniq -c
          echo "=== SUBTYPES/TOOLS ==="
          grep -o '"name":"[A-Za-z_]*"' /home/claude/raw2.txt | sort | uniq -c
          echo "=== HEAD 1200 ==="
          head -c 1200 /home/claude/raw2.txt
          echo ""
          echo "=== TAIL 1500 ==="
          tail -c 1500 /home/claude/raw2.txt
          echo ""
          echo "=== END ==="
          REMOTE
