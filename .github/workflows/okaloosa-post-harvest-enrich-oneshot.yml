name: "Okaloosa Post-Harvest Enrichment (one-shot)"
# Triggered manually to fix the current 6 unlinked okaloosa FC rows
# (C/D/E at 90.8%, need >=95% to PASS). This runs the same 3-pass
# enrichment pipeline that is now wired into the daily harvest workflow.
#
# After this run, the harvest workflow's built-in post-harvest step will
# keep C/D/E/I/J current going forward.
#
# SHARD-5 issue #17345 (2026-08-02): okaloosa 6/10, C/D/E/I failing.

on:
  workflow_dispatch:

jobs:
  enrich:
    name: "Okaloosa: GIS enrich + zoning substrate + bid_decisions"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests

      - name: "PASS1+2+3: GIS enrich + zoning substrate + bid_decisions"
        run: |
          set -euo pipefail
          python3 scripts/okaloosa_post_harvest_enrich.py

      - name: "Verify: pencil_dod_evaluate_county before/after"
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_county": "okaloosa"}')
          echo "### SQL VERIFICATION: okaloosa post-enrich" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP"
          C_METRIC=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('C',{}).get('metric','N/A'))")
          E_METRIC=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('E',{}).get('metric','N/A'))")
          echo "C metric: $C_METRIC (need >=95 to PASS)"
          echo "E metric: $E_METRIC (need >=95 to PASS)"
