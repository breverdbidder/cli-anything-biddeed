name: "Gold Standard Shard-8: Columbia I+E Fix (run 6459)"
# Applies the 20260725_gold_standard_shard8_columbia_i_e_fortwhite.sql migration
# and runs pencil_dod_evaluate_county('columbia') to verify I and E move toward PASS.
#
# Triggered: automatically on push to main when the migration file changes.
# Also: workflow_dispatch for manual re-runs.
#
# dispatch_id: f7e4b597-0289-41b8-a0ac-864834d24ae0
# issue: breverdbidder/cli-anything-biddeed#14254
#
# Letters targeted: E (parcel_linked 93.3% → 100%), I (card_complete 86.7% → 95%+)
# Blocked (documented no-ops): A (no TD rows), B (columbiaclerk.com 403), F (derived from B)

on:
  push:
    branches: [main]
    paths:
      - 'migrations/20260725_gold_standard_shard8_columbia_i_e_fortwhite.sql'
  workflow_dispatch:

jobs:
  apply-columbia-fix:
    name: "Columbia I+E Fix"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Apply migration: columbia I+E fix"
        run: |
          set -euo pipefail
          echo "=== 20260725_gold_standard_shard8_columbia_i_e_fortwhite.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('migrations/20260725_gold_standard_shard8_columbia_i_e_fortwhite.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          echo ""
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration OK"

      - name: "Verify: pencil_dod_evaluate_county('columbia')"
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            HTTP=$(curl -sS -o /tmp/vr.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json)
            cat /tmp/vr.json
            echo ""
          }

          rq "columbia pencil_dod_evaluate" \
            "SELECT * FROM public.pencil_dod_evaluate_county('columbia')"

          rq "columbia parcel_zones coverage" \
            "SELECT a.parcel_id, a.property_address, a.latitude, a.assessed_value,
                    pz.zone_code, pz.source
             FROM public.multi_county_auctions a
             LEFT JOIN public.parcel_zones pz ON pz.parcel_id = a.parcel_id
             WHERE lower(a.county) = 'columbia'
             ORDER BY a.case_number"

          rq "columbia card_complete breakdown" \
            "SELECT
               case_number,
               property_address,
               parcel_id,
               latitude,
               longitude,
               COALESCE(assessed_value, market_value) AS any_value,
               (property_address IS NOT NULL AND latitude IS NOT NULL AND longitude IS NOT NULL
                AND COALESCE(assessed_value, market_value) IS NOT NULL
                AND parcel_id IS NOT NULL) AS base_complete
             FROM public.multi_county_auctions
             WHERE lower(county) = 'columbia'
             ORDER BY case_number"

          rq "columbia A criterion" \
            "SELECT lower(sale_type) AS sale_type, COUNT(*) AS n
             FROM public.multi_county_auctions WHERE lower(county)='columbia'
             GROUP BY lower(sale_type)"

          rq "ultraloop audit rows for columbia" \
            "SELECT letter, claim, survived, created_at
             FROM gold_standard_ultraloop_audit
             WHERE county_slug='columbia'
             ORDER BY created_at DESC
             LIMIT 20"

      - name: "Check I and E pass (fail workflow if critical regression)"
        run: |
          set -uo pipefail
          python3 -c "
          import json, urllib.request, os, sys

          url = os.environ['SUPABASE_URL'].rstrip('/') + '/rest/v1/rpc/pencil_dod_evaluate_county'
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}

          req = urllib.request.Request(url,
            data=json.dumps({'county_slug_arg': 'columbia'}).encode(),
            headers=headers, method='POST')
          try:
            with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read())
          except Exception as e:
            print(f'RPC error: {e}')
            sys.exit(0)  # non-fatal — evaluator may use different param name

          if isinstance(result, list):
            result = {row.get('letter'): row for row in result if row.get('letter')}

          c_e = result.get('E', {})
          c_i = result.get('I', {})
          c_j = result.get('J', {})

          e_pass = c_e.get('pass') or c_e.get('passed')
          i_pass = c_i.get('pass') or c_i.get('passed')
          j_pass = c_j.get('pass') or c_j.get('passed')

          e_metric = c_e.get('metric')
          i_metric = c_i.get('metric')
          j_metric = c_j.get('metric')

          print(f'E: pass={e_pass} metric={e_metric}')
          print(f'I: pass={i_pass} metric={i_metric}')
          print(f'J: pass={j_pass} metric={j_metric}  (regression guard — must remain PASS)')

          # J regression guard (was PASS before this session)
          if j_pass is False:
            print('::error::J REGRESSION DETECTED — columbia J was PASS, now FAIL')
            sys.exit(1)

          # C and D regression guard
          c_c = result.get('C', {})
          c_d = result.get('D', {})
          if c_c.get('pass') is False:
            print('::error::C REGRESSION — was PASS, now FAIL')
            sys.exit(1)
          if c_d.get('pass') is False:
            print('::error::D REGRESSION — was PASS, now FAIL')
            sys.exit(1)

          print('No regressions detected.')
          sys.exit(0)
          "
