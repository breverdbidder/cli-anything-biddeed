name: Dify call v2 — actual smoke test via nginx Host header
on:
  workflow_dispatch: {}
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test Dify chat endpoint
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Smoke test: /v1/chat-messages via nginx localhost + Host header ==="
          RESP=$($SSH "curl -sS -X POST \
            -H 'Host: chat.zonewise.ai' \
            -H 'Authorization: Bearer ${DIFY_API_KEY}' \
            -H 'Content-Type: application/json' \
            -d '{\"inputs\":{},\"query\":\"Reply with only the literal text DIFY_SMOKE_OK and nothing else.\",\"response_mode\":\"blocking\",\"user\":\"summit-smoke-v2\"}' \
            -m 60 http://localhost/v1/chat-messages 2>&1") || echo "CURL_FAILED $?"
          echo "len: ${#RESP}"
          echo "--- raw first 2000 chars ---"
          echo "$RESP" | head -c 2000
          echo
          echo "--- parsed ---"
          echo "$RESP" | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              if 'answer' in d:
                  print(f\"SUCCESS answer={d['answer'][:200]!r}\")
                  md = d.get('metadata', {})
                  print(f\"usage={md.get('usage', {})}\")
              elif 'code' in d:
                  print(f\"DIFY_ERR code={d.get('code','?')} msg={d.get('message','?')[:300]} status={d.get('status','?')}\")
              elif 'message' in d:
                  print(f\"MSG_ERR {d['message'][:300]}\")
              else:
                  print(f\"keys={list(d.keys())[:10]}\")
          except Exception as e:
              print(f'PARSE_ERR: {e}')
              print(f'first500={raw[:500]}')
          " || true

          echo
          echo "=== Alt: /v1/parameters to see app metadata ==="
          PARAMS=$($SSH "curl -sS -H 'Host: chat.zonewise.ai' -H 'Authorization: Bearer ${DIFY_API_KEY}' -m 10 http://localhost/v1/parameters 2>&1") || echo "PARAMS_FAILED"
          echo "$PARAMS" | head -c 1500 || true

          echo
          echo "=== Alt: /v1/info to get app type and model ==="
          INFO=$($SSH "curl -sS -H 'Host: chat.zonewise.ai' -H 'Authorization: Bearer ${DIFY_API_KEY}' -m 10 http://localhost/v1/info 2>&1") || echo "INFO_FAILED"
          echo "$INFO" | head -c 1500 || true

          echo "=== END ==="
