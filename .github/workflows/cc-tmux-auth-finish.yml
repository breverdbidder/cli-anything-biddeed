name: cc tmux auth finish
on: { workflow_dispatch: {} }
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: send code and verify
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          CODE='AXjRIZligCPmG6fgPOwZVKf1zA73xszXxsyhzn2mHerFtg8F#KoQ1nJUSkg_674I-RHkQQSy5Uc2YnbWpje_z7bUxJIA'
          $SSH "bash -s -- '$CODE'" <<"REMOTE"
          CODE="$1"
          # type the code into the waiting setup-token prompt, then Enter
          su - claude -c "tmux -L authsock send-keys -t auth -l '$CODE'"
          su - claude -c "tmux -L authsock send-keys -t auth Enter"
          sleep 10
          echo "=== pane after submit ==="
          su - claude -c 'tmux -L authsock capture-pane -t auth -p -J' 2>&1 | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v '^[[:space:]]*$' | tail -20
          echo "=== creds present ==="
          echo "claude_creds=$(test -f /home/claude/.claude/.credentials.json && echo yes || echo no)"
          echo "=== ping ==="
          su - claude -c 'timeout 45 claude -p "say PONG" --output-format text 2>&1' | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | tail -3
          echo END
          REMOTE
