name: "SUMMIT: Restore Parcel Features"
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Write token
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 1m
          envs: CLAUDE_OAUTH_B64
          script: |
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            chmod 644 /tmp/claude-oauth-token
            echo "Token: $(wc -c < /tmp/claude-oauth-token) bytes"
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: GH_PAT,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            su -s /bin/bash claude -c "export HOME=/home/claude && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3"
            WORK="/tmp/zw-restore-$(date +%s)"
            mkdir -p "$WORK" && cd "$WORK"
            git clone "https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            chown -R claude:claude "$WORK"
            cat > "$WORK/run.sh" << 'SCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            export CLAUDE_CODE_OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            claude auth status
            claude -p "READ: docs/plans/EXPLORER_V2_RESTORE.md then CLAUDE.md. Restore missing parcel features to ExplorerV2. Reference components/explorer/BrevardExplorer.tsx for the ORIGINAL ParcelDetail and popupHtml. DO NOT touch style switching, choropleth, conversion gate, or layout. Only add missing parcel detail. Must pass tsc + build." --dangerously-skip-permissions
            npx tsc --noEmit 2>&1 | tail -10 || true
            npm run build 2>&1 | tail -10
            git config user.name "Claude Code (Hetzner)"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "No changes"; exit 1; }
            git commit -m "fix: restore zoning, owner, BCPAO, popup in Explorer V2 parcel detail"
            git push origin main
            echo "PUSHED"
            SCRIPT
            sed -i "s|WORKDIR|$WORK|g" "$WORK/run.sh"
            chmod +x "$WORK/run.sh"
            chown claude:claude "$WORK/run.sh"
            su -s /bin/bash claude "$WORK/run.sh"
            rm -f /tmp/claude-oauth-token
            rm -rf "$WORK"
            python3 -c "import json,urllib.request;urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage',json.dumps({'chat_id':'${TELEGRAM_CHAT_ID}','text':'🏔️✅ Parcel features RESTORED on zonewise.ai/explorer'}).encode(),{'Content-Type':'application/json'}))"
      - name: Promote
        if: success()
        run: |
          sleep 90
          curl -s -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/promote-now.yml/dispatches" -d '{"ref":"main"}'
