name: Morning Executor (6 AM EST — Sun-Thu, Sat)
# Issue #66: SUMMIT AUDIT+FIX — create missing morning-executor.yml
# Schedule: 6:00 AM EST = 11:00 UTC, excludes Friday (day 5)
# Invokes daily action pipeline, creates SUMMIT issues from top 3 tasks, sends Telegram digest.

on:
  schedule:
    - cron: '0 11 * * 0-4,6'
  workflow_dispatch:

jobs:
  morning-executor:
    name: "Morning Executor — Daily Action Plan + SUMMIT Dispatch"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests --break-system-packages -q 2>/dev/null

      - name: Run Daily Action Plan V2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/daily_action_plan.py

      - name: Create SUMMIT issues from top 3 tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'PYSCRIPT'
          import requests, os, json
          from datetime import datetime, timezone, timedelta

          SB_URL = os.environ.get("SUPABASE_URL", "")
          SB_KEY = os.environ.get("SUPABASE_KEY", "")
          GH_PAT = os.environ.get("GH_PAT", "")
          REPO = "breverdbidder/cli-anything-biddeed"

          if not all([SB_URL, SB_KEY, GH_PAT]):
              print("⚠️  Missing secrets — skipping SUMMIT issue creation")
              exit(0)

          sb_h = {
              "apikey": SB_KEY,
              "Authorization": f"Bearer {SB_KEY}",
              "Content-Type": "application/json",
          }
          gh_h = {
              "Authorization": f"token {GH_PAT}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }

          # Fetch top 3 pending tasks by ml_score
          r = requests.get(
              f"{SB_URL}/rest/v1/nexus_tasks",
              headers=sb_h,
              params={
                  "status": "eq.pending",
                  "order": "ml_score.desc.nullslast",
                  "limit": "3",
                  "select": "task_id,description,priority,ml_score,project",
              },
          )

          if r.status_code != 200:
              print(f"⚠️  Supabase query failed: {r.status_code} — skipping SUMMIT dispatch")
              exit(0)

          tasks = r.json()
          if not tasks:
              print("✅ No pending tasks — nothing to dispatch")
              exit(0)

          EST = timezone(timedelta(hours=-5))
          today = datetime.now(EST).strftime("%Y-%m-%d")
          created = 0

          for task in tasks:
              tid = task.get("task_id", "?")
              desc = task.get("description", "")[:200]
              pri = task.get("priority", "P3")
              score = task.get("ml_score") or 50
              project = task.get("project", "?")

              title = f"SUMMIT [{pri}|{score:.0f}] {tid}: {desc[:60]}"
              body = f"""## Morning Executor — Auto-Dispatched SUMMIT Task

**Date:** {today}
**Task ID:** {tid}
**Priority:** {pri}
**ML Score:** {score:.0f}/100
**Project:** {project}

### Description
{desc}

---
Execute autonomously. Verify with proof. Update nexus_tasks when done.
Dispatched by: morning-executor.yml"""

              issue_r = requests.post(
                  f"https://api.github.com/repos/{REPO}/issues",
                  headers=gh_h,
                  json={"title": title, "body": body, "labels": ["summit"]},
              )

              if issue_r.status_code == 201:
                  num = issue_r.json().get("number", "?")
                  print(f"✅ Created issue #{num}: {title[:60]}")
                  created += 1
              else:
                  print(f"⚠️  Failed to create issue for {tid}: {issue_r.status_code}")

          print(f"Morning Executor: {created}/{len(tasks)} SUMMIT issues created")
          PYSCRIPT

      - name: Telegram — Morning Digest Summary
        if: always()
        env:
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "☀️" || echo "⚠️")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${EMOJI} Morning Executor: ${STATUS}
Action plan sent. SUMMIT issues dispatched.
Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null || true
