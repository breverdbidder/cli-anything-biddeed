name: UTCC SSH Executor

on:
  repository_dispatch:
    types: [utcc-dispatch]

jobs:
  execute:
    name: "UTCC Task via Hetzner"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Execute task on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 80m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,SUPABASE_URL,SUPABASE_KEY
          script: |
            set -e
            TASK="${{ github.event.client_payload.task }}"
            TASK_ID="${{ github.event.client_payload.task_id }}"
            RUN_ID="${{ github.run_id }}"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            echo "=== UTCC Executor: $TASK_ID ==="
            echo "Task: $TASK"

            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)

            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN'
              export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID'
              export GH_PAT='$GH_PAT'

              # Ensure repo is current
              if [ -d /home/claude/repos/cli-anything-biddeed ]; then
                cd /home/claude/repos/cli-anything-biddeed
                git pull origin main --ff-only 2>&1 | tail -3
              else
                mkdir -p /home/claude/repos
                git clone https://${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git /home/claude/repos/cli-anything-biddeed
                cd /home/claude/repos/cli-anything-biddeed
              fi

              git config user.email 'ci@biddeed.ai'
              git config user.name 'BidDeed-CI'
              git remote set-url origin https://\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git

              # Mark task dispatched in registry
              if [ -n '$TASK_ID' ] && [ -n '$SUPABASE_URL' ] && [ -n '$SUPABASE_KEY' ]; then
                curl -s -X PATCH '${SUPABASE_URL}/rest/v1/task_registry?task_id=eq.'$TASK_ID \
                  -H 'apikey: ${SUPABASE_KEY}' \
                  -H 'Authorization: Bearer ${SUPABASE_KEY}' \
                  -H 'Content-Type: application/json' \
                  -d '{\"status\":\"running\",\"dispatched_at\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\",\"gha_run_id\":'$RUN_ID',\"gha_run_url\":\"'$RUN_URL'\"}' || true
              fi

              # Execute the task
              claude --print --dangerously-skip-permissions '$TASK'
              EXIT_CODE=\$?

              # Push any changes
              git add -A
              git diff --cached --quiet || git commit -m 'UTCC: Task $TASK_ID output' && git push origin main || true

              # Update task status
              if [ -n '$TASK_ID' ] && [ -n '$SUPABASE_URL' ] && [ -n '$SUPABASE_KEY' ]; then
                STATUS=\$( [ \$EXIT_CODE -eq 0 ] && echo 'completed' || echo 'failed' )
                curl -s -X PATCH '${SUPABASE_URL}/rest/v1/task_registry?task_id=eq.'$TASK_ID \
                  -H 'apikey: ${SUPABASE_KEY}' \
                  -H 'Authorization: Bearer ${SUPABASE_KEY}' \
                  -H 'Content-Type: application/json' \
                  -d '{\"status\":\"'\$STATUS'\",\"completed_at\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' || true
              fi

              exit \$EXIT_CODE
            "
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TASK_ID="${{ github.event.client_payload.task_id }}"
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          MSG="${EMOJI} UTCC Task ${TASK_ID:-unknown}: ${STATUS}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.BIDDEED_BOT_CHAT_ID }}\",\"text\":\"${MSG}\"}" \
            >/dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          echo "## UTCC Task — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Task ID**: ${{ github.event.client_payload.task_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Task**: ${{ github.event.client_payload.task }}" >> $GITHUB_STEP_SUMMARY
