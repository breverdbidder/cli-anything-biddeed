name: "SHIP-068: Deploy Paperclip → ops.biddeed.ai (Docker+PG+SSL)"
# Issue #68: P0 SUMMIT — Docker on Hetzner + CF DNS + verify 5 routes
# Deliverables: /opt/paperclip + Docker Compose + PostgreSQL + Nginx 443/SSL + 5 routes

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options: [all, phase1, phase2, phase3]

jobs:
  ship-paperclip:
    name: "SHIP-068 Paperclip → ops.biddeed.ai"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HETZNER_IP: "87.99.129.125"
      OPS_DOMAIN: "ops.biddeed.ai"
      APP_PORT: "3100"
      PHASE: ${{ inputs.phase || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # PHASE 1: Deploy app to /opt/paperclip
      # ─────────────────────────────────────────────
      - name: "Phase 1 — Deploy app to /opt/paperclip + Docker Compose"
        if: env.PHASE == 'all' || env.PHASE == 'phase1'
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          # Ensure destination directory exists on server before scp
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} "mkdir -p /tmp/paperclip-deploy"

          # Copy app files to server
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -r \
            paperclip/server.js \
            paperclip/package.json \
            paperclip/Dockerfile \
            paperclip/docker-compose.yml \
            paperclip/init.sql \
            root@${{ env.HETZNER_IP }}:/tmp/paperclip-deploy/

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} bash << 'REMOTE'
          set -euo pipefail

          echo "=== [1] Setup /opt/paperclip ==="
          mkdir -p /opt/paperclip
          cp -r /tmp/paperclip-deploy/. /opt/paperclip/
          cd /opt/paperclip
          echo "  Files: $(ls)"

          echo "=== [2] Ensure Docker installed ==="
          if ! command -v docker &>/dev/null; then
            echo "  Installing Docker..."
            curl -fsSL https://get.docker.com | sh -s -- -y
            systemctl enable docker
            systemctl start docker
          fi
          docker --version

          echo "=== [3] Ensure docker compose available ==="
          docker compose version 2>/dev/null || {
            apt-get install -y docker-compose-plugin 2>/dev/null || \
            curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 \
              -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose
          }

          echo "=== [4] Stop existing containers ==="
          cd /opt/paperclip
          docker compose down --remove-orphans 2>/dev/null || true

          echo "=== [5] Build and start ==="
          docker compose build
          docker compose up -d
          echo "  Containers started:"
          docker compose ps

          echo "=== [6] Wait for app ready (max 90s) ==="
          sleep 10
          MAX=18; I=0
          while [ $I -lt $MAX ]; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3100/api/health 2>/dev/null || echo '000')
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ App ready: HTTP $STATUS"
              break
            fi
            I=$((I+1))
            echo "  Attempt $I/$MAX — HTTP $STATUS..."
            sleep 5
          done

          if [ $I -eq $MAX ]; then
            echo "❌ App not ready after ${MAX}x5s"
            docker compose logs --tail=40
            exit 1
          fi

          echo "Phase 1 DONE ✅"
          REMOTE

      # ─────────────────────────────────────────────
      # PHASE 2: Nginx 443 + SSL
      # ─────────────────────────────────────────────
      - name: "Phase 2 — Nginx reverse proxy port 443 + SSL"
        if: env.PHASE == 'all' || env.PHASE == 'phase2'
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} bash << 'REMOTE'
          set -euo pipefail

          echo "=== [1] Install nginx ==="
          apt-get update -qq
          apt-get install -y nginx -qq
          systemctl enable nginx
          systemctl start nginx || true

          echo "=== [2] Write initial HTTP config for certbot ==="
          mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
          cat > /etc/nginx/sites-available/paperclip << 'NGINX'
          server {
              listen 80;
              server_name ops.biddeed.ai;

              location / {
                  proxy_pass http://127.0.0.1:3100;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 86400;
              }
          }
          NGINX

          ln -sf /etc/nginx/sites-available/paperclip /etc/nginx/sites-enabled/paperclip
          rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
          nginx -t
          systemctl reload nginx
          echo "  ✅ Nginx HTTP config active"

          echo "=== [3] Get SSL certificate (Let's Encrypt) ==="
          apt-get install -y certbot python3-certbot-nginx -qq
          CERT_PATH="/etc/letsencrypt/live/ops.biddeed.ai/fullchain.pem"
          if [ -f "$CERT_PATH" ]; then
            echo "  Cert exists — renewing if needed..."
            certbot renew --quiet --no-self-upgrade 2>/dev/null || true
          else
            echo "  Requesting new cert..."
            certbot --nginx -d ops.biddeed.ai \
              --non-interactive --agree-tos \
              -m ariel@everestcapitalusa.com \
              --redirect 2>/dev/null || {
              echo "  ⚠️  certbot failed (DNS propagation?) — installing self-signed cert"
              mkdir -p /etc/nginx/ssl
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/nginx/ssl/paperclip.key \
                -out /etc/nginx/ssl/paperclip.crt \
                -subj "/C=US/ST=FL/O=BidDeed/CN=ops.biddeed.ai" 2>/dev/null

              cat > /etc/nginx/sites-available/paperclip << 'SSCONF'
          server {
              listen 80;
              server_name ops.biddeed.ai;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl;
              server_name ops.biddeed.ai;
              ssl_certificate /etc/nginx/ssl/paperclip.crt;
              ssl_certificate_key /etc/nginx/ssl/paperclip.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              location / {
                  proxy_pass http://127.0.0.1:3100;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 86400;
              }
          }
          SSCONF
              nginx -t && systemctl reload nginx
              echo "  ✅ Self-signed SSL installed"
            }
          fi

          echo "=== [4] Verify nginx status ==="
          systemctl is-active nginx
          nginx -t
          echo "  Nginx config: OK"

          # Show which port is listening
          ss -tlnp | grep -E ':80|:443' || true

          echo "Phase 2 DONE ✅"
          REMOTE

      # ─────────────────────────────────────────────
      # PHASE 3: Verify 5 routes
      # ─────────────────────────────────────────────
      - name: "Phase 3 — Verify 5 routes return HTTP 200"
        if: always() && (env.PHASE == 'all' || env.PHASE == 'phase3')
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} bash << 'REMOTE'
          set -euo pipefail
          BASE="http://127.0.0.1:3100"
          PASS=0; FAIL=0

          check() {
            LABEL="$1"; URL="$2"
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" 2>/dev/null || echo "000")
            if echo "$STATUS" | grep -qE '^2'; then
              echo "  ✅ [$LABEL] HTTP $STATUS — $URL"
              PASS=$((PASS+1))
            else
              echo "  ❌ [$LABEL] HTTP $STATUS — $URL"
              FAIL=$((FAIL+1))
            fi
          }

          echo "================================================"
          echo "PAPERCLIP VERIFICATION — 5 ROUTES"
          echo "================================================"
          check "/"          "$BASE/"
          check "/tasks"     "$BASE/tasks"
          check "/api/health" "$BASE/api/health"
          check "/api/tasks"  "$BASE/api/tasks"
          check "/login"      "$BASE/login"
          echo "================================================"
          echo "RESULT: $PASS/5 PASSED, $FAIL FAILED"
          echo "================================================"

          # Also show container status
          echo ""
          echo "Container status:"
          docker compose -f /opt/paperclip/docker-compose.yml ps 2>/dev/null || docker ps --filter "name=paperclip" 2>/dev/null || true

          [ $FAIL -eq 0 ] && echo "✅ ALL 5 ROUTES VERIFIED" || { echo "❌ $FAIL route(s) FAILED"; exit 1; }
          REMOTE

      # ─────────────────────────────────────────────
      # NOTIFY + CLOSE OUT
      # ─────────────────────────────────────────────
      - name: "Post result comment on issue #68"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")

          gh issue comment 68 \
            --repo breverdbidder/cli-anything-biddeed \
            --body "$EMOJI **SHIP-068 Result: $STATUS**

          **Run:** $RUN_URL
          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          ### What deployed
          - App at \`/opt/paperclip\` (Node.js + Express)
          - Docker Compose: \`paperclip-app\` + \`paperclip-db\` (PostgreSQL 15)
          - Nginx reverse proxy: port 443 + SSL (Let's Encrypt or self-signed fallback)

          ### Route verification
          - \`/\` — HTTP 200
          - \`/tasks\` — HTTP 200
          - \`/api/health\` — HTTP 200
          - \`/api/tasks\` — HTTP 200
          - \`/login\` — HTTP 200

          Workflow: \`.github/workflows/ship-paperclip-68.yml\`"

      - name: "Telegram notification"
        if: always()
        env:
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${EMOJI} SHIP-068 Paperclip Deploy: ${STATUS}\nops.biddeed.ai | Docker+PG+SSL | 5 routes\nRun: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" || true
