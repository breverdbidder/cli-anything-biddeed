name: Close Stale Issue #116 — GHA-964966 Resolved

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-stale-116.yml'

jobs:
  close-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark GHA-964966 done in nexus_tasks and close issue #116
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 << 'PYSCRIPT'
          import requests, os
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "breverdbidder/cli-anything-biddeed"

          sb_h = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          gh_h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}

          # 1. Mark GHA-964966 as done in nexus_tasks
          r = requests.patch(
              f"{SB_URL}/rest/v1/nexus_tasks?task_id=eq.GHA-964966",
              headers=sb_h,
              json={
                  "status": "done",
                  "completed_at": datetime.now(timezone.utc).isoformat(),
                  "result_summary": "Stale task — root cause fixed by #114 (labels + skip_patterns). No current failure.",
                  "updated_at": datetime.now(timezone.utc).isoformat(),
              }
          )
          print(f"Supabase update: {r.status_code} — {r.text[:200]}")

          # 2. Comment on issue #116
          comment = """## Root Cause Analysis — VERIFIED

**Finding:** GHA-964966 is a stale nexus_task created *before* commit `06391cd9` (issue #114) was deployed.

**Timeline:**
- Issue Triage Agent failed → `task-lifecycle.yml` created nexus task `GHA-964966` (no skip pattern in place yet)
- Commit `06391cd9` fixed both problems:
  1. Added "Issue Triage Agent" to `skip_patterns` in `task-lifecycle.yml` → no more stale tasks
  2. Created `setup-labels.yml` → all required labels now exist in the repo
- Continuous Executor picked up the stale GHA-964966 task and dispatched it as issue #116

**This is the same pattern as issue #115 (GHA-044084)**, which was already confirmed and closed.

**Current state:** Issue Triage Agent is operational. No active failure. GHA-964966 marked `done` in nexus_tasks.

**No workflow changes needed.** Closing as resolved."""

          r2 = requests.post(
              f"https://api.github.com/repos/{REPO}/issues/116/comments",
              headers=gh_h,
              json={"body": comment}
          )
          print(f"Comment: {r2.status_code}")

          # 3. Close issue #116
          r3 = requests.patch(
              f"https://api.github.com/repos/{REPO}/issues/116",
              headers=gh_h,
              json={"state": "closed", "state_reason": "completed"}
          )
          print(f"Close issue: {r3.status_code}")
          PYSCRIPT
