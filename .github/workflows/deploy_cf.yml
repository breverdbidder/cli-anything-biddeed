name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout everestcapitalusa repo
        env:
          PAT: ${{ secrets.GH_PAT_FULL }}
        run: |
          # Try GH_PAT_FULL first, fallback to GH_PAT
          PAT="${{ secrets.GH_PAT_FULL }}"
          [ -z "$PAT" ] && PAT="${{ secrets.GH_PAT }}"
          mkdir -p /tmp/site
          cd /tmp/site
          git clone --depth=1 "https://x-access-token:${PAT}@github.com/breverdbidder/everestcapitalusa.git" .
          echo "Repo cloned. HEAD: $(git rev-parse --short HEAD)"
          echo "Files: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "Size: $(du -sh --exclude=.git . | cut -f1)"

      - name: Install wrangler
        run: |
          npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd /tmp/site
          # Remove .git so we don't deploy git internals
          rm -rf .git
          wrangler pages deploy . --project-name=everestcapitalusa --branch=main --commit-message="Deploy 14-project portfolio (Lakewood→Robinhood, newest-first)"
