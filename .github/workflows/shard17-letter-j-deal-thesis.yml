name: SHARD-17 Letter J - Deal Thesis Pipeline (charlotte/citrus/broward)

on:
  schedule:
    - cron: '30 4,12,20 * * *'  # Run 3x daily: 04:30, 12:30, 20:30 UTC  
  workflow_dispatch:
    inputs:
      county:
        description: 'Specific county to process'
        required: false
        type: choice
        options:
          - 'all'
          - 'charlotte'
          - 'citrus'
          - 'broward'
        default: 'all'

jobs:
  deal-thesis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests --break-system-packages -q
          
      - name: Run SHARD-17 Letter J Deal Thesis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🎯 SHARD-17 Letter J: Deal Thesis Pipeline (Shapira Formula)"
          echo "Counties: charlotte, citrus, broward"
          echo "Formula: (ARV×70%)-Repairs-\$10K-MIN(\$25K,15%×ARV)"
          
          if [ "${{ github.event.inputs.county }}" = "all" ] || [ -z "${{ github.event.inputs.county }}" ]; then
            echo "Processing all counties..."
            python3 scripts/shard17_deal_thesis.py --all-counties
          else
            echo "Processing county: ${{ github.event.inputs.county }}"
            python3 scripts/shard17_deal_thesis.py --county ${{ github.event.inputs.county }}
          fi
          
      - name: Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="💎 SHARD-17 Letter J (Deal Thesis) - Status: $STATUS
          Counties: charlotte, citrus, broward  
          Pipeline: Shapira Formula bid_decisions
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" || true