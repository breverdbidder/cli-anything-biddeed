name: Verify PostHog Error Capture

# One-off verification: confirms a specific test $exception event actually
# landed in PostHog after hitting biddeed.ai/test-error-capture. Uses
# posthog_personal_api_key (read-only query scope) from the vault. Per
# CLAUDE.md CREDENTIAL HANDLING (GTM-22D): fetch + query happen in the same
# masked GHA step; only a boolean/count is ever written to the job log —
# the key value itself is never printed or exported as a job output.

on:
  workflow_dispatch:
    inputs:
      distinct_id:
        description: 'distinct_id to search for in the $exception event'
        required: false
        default: 'biddeed-worker'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query PostHog for the test $exception event
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISTINCT_ID: ${{ inputs.distinct_id }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg q "SELECT vault_secret('posthog_personal_api_key') AS v;" '{query: $q}')
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: cli-anything-biddeed-cc/1.0" \
            -d "$payload")
          key=$(echo "$resp" | jq -r '.[0].v // empty')
          if [ -z "$key" ]; then
            echo "::error::posthog_personal_api_key not returned from vault_secret()"
            exit 1
          fi
          echo "::add-mask::$key"

          project_id=$(curl -sS "https://us.posthog.com/api/projects/@current/" \
            -H "Authorization: Bearer $key" | jq -r '.id // empty')
          if [ -z "$project_id" ]; then
            echo "::error::Could not resolve PostHog project id from @current"
            exit 1
          fi
          echo "Resolved project_id=$project_id"

          echo "--- diagnostic: does posthog_project_key itself work against the capture endpoint? ---"
          pkpayload=$(jq -nc --arg q "SELECT vault_secret('posthog_project_key') AS v;" '{query: $q}')
          pkresp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: cli-anything-biddeed-cc/1.0" \
            -d "$pkpayload")
          pkey=$(echo "$pkresp" | jq -r '.[0].v // empty')
          if [ -n "$pkey" ]; then
            echo "::add-mask::$pkey"
            capbody=$(jq -nc --arg k "$pkey" '{api_key:$k, event:"$exception", distinct_id:"gha-diag-probe", properties:{"$exception_message":"gha diagnostic probe"}}')
            capout=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "https://us.i.posthog.com/capture/" \
              -H "Content-Type: application/json" -d "$capbody")
            echo "Direct capture call result: $capout"
          else
            echo "::error::posthog_project_key not returned for direct-capture diagnostic"
          fi

          echo "--- waiting 45s for ClickHouse ingestion before querying ---"
          sleep 45

          echo "--- diagnostic: query by distinct_id only, no event-name filter (30min, incl an older run's gha-diag-probe) ---"
          diag2=$(curl -sS -G "https://us.posthog.com/api/projects/${project_id}/events" \
            -H "Authorization: Bearer $key" \
            --data-urlencode "distinct_id=gha-diag-probe" \
            --data-urlencode "after=-30m" \
            --data-urlencode "limit=10")
          echo "$diag2" | jq '[.results[] | {event, distinct_id, timestamp}]'

          echo "--- diagnostic: any events at all on this project in the last 15min? ---"
          diag=$(curl -sS -G "https://us.posthog.com/api/projects/${project_id}/events" \
            -H "Authorization: Bearer $key" \
            --data-urlencode "after=-15m" \
            --data-urlencode "limit=20")
          echo "$diag" | jq '[.results[] | {event, distinct_id, timestamp}]'

          events=$(curl -sS -G "https://us.posthog.com/api/projects/${project_id}/events" \
            -H "Authorization: Bearer $key" \
            --data-urlencode "event=\$exception" \
            --data-urlencode "distinct_id=${DISTINCT_ID}" \
            --data-urlencode "after=-30m" \
            --data-urlencode "limit=5")
          count=$(echo "$events" | jq '.results | length')
          echo "Matching \$exception events for distinct_id=${DISTINCT_ID}: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::No matching \$exception event found in PostHog"
            exit 1
          fi
          echo "$events" | jq '[.results[] | {timestamp, properties: {exception_message: .properties["$exception_message"], url: .properties.url}}]'
