name: SHARD-11 Gold Standard Fixes

on:
  workflow_dispatch:
    inputs:
      county_filter:
        description: 'County filter (all, or specific county name)'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run mode (no database changes)'
        required: false
        default: false
        type: boolean
  
  schedule:
    # Run every 6 hours during active period
    - cron: '0 */6 * * *'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  shard11-targeted-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests httpx
        
    - name: Run database migration
      run: |
        npm install pg
        node migrations/run_migration.js migrations/20260612_shard11_county_setup.sql
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        
    - name: Run SHARD-11 targeted fixes
      run: |
        python scripts/shard11_targeted_fixes.py
      env:
        COUNTY_FILTER: ${{ github.event.inputs.county_filter || 'all' }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        
    - name: Run verification
      run: |
        python scripts/verify_shard11_status.py
        
    - name: Update issue comment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const timestamp = new Date().toISOString();
          
          // Look for the SHARD-11 issue
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'shard-11'
          });
          
          if (issues.length === 0) {
            console.log('No SHARD-11 issue found');
            return;
          }
          
          const issue = issues[0];
          const county_filter = '${{ github.event.inputs.county_filter || "all" }}';
          
          const comment = `### SHARD-11 Automated Fix Run
          
**Timestamp:** ${timestamp}  
**County Filter:** ${county_filter}  
**Workflow:** [${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})  

🔄 SHARD-11 targeted fixes executed automatically. Check logs for detailed results.

**Target Counties:** manatee, washington, miami_dade, gadsden, wakulla  
**Priority:** Letter E (parcel linkage), Letter H (freshness), Letter B (verified outcomes)

---
*🤖 Generated by SHARD-11 Gold Standard automation*`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issue.number,
            body: comment
          });

concurrency:
  group: shard11-fixes
  cancel-in-progress: false