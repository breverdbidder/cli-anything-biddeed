name: hetzner-repair-summit-creds

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Repair summit credentials + verify
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          set +e
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@${HETZNER_IP}"

          echo "=== 1. Pre-state: summit auth ==="
          $SSH 'sudo -u summit bash -c "unset ANTHROPIC_API_KEY; timeout 8 claude -p \"echo: PRE_CHECK\" 2>&1 | head -5"'

          echo ""
          echo "=== 2. Identify canonical root creds file ==="
          $SSH 'for f in /root/.claude/.credentials.json /root/.claude/credentials.json; do if [ -f "$f" ]; then echo "FOUND: $f  size=$(wc -c < $f)  mtime=$(stat -c %y $f)"; fi; done'

          echo ""
          echo "=== 3. Delete stale summit creds (both name variants) ==="
          $SSH 'rm -fv /home/summit/.claude/credentials.json /home/summit/.claude/.credentials.json 2>&1'

          echo ""
          echo "=== 4. Copy root creds to BOTH summit path variants (force overwrite) ==="
          $SSH 'CANONICAL=""; for f in /root/.claude/.credentials.json /root/.claude/credentials.json; do if [ -f "$f" ]; then CANONICAL="$f"; break; fi; done; echo "canonical source: $CANONICAL"; mkdir -p /home/summit/.claude; cp -fv "$CANONICAL" /home/summit/.claude/.credentials.json; cp -fv "$CANONICAL" /home/summit/.claude/credentials.json; chown -R summit:summit /home/summit/.claude; chmod 600 /home/summit/.claude/.credentials.json /home/summit/.claude/credentials.json'

          echo ""
          echo "=== 5. Verify summit sees both files with correct perms ==="
          $SSH 'sudo -u summit ls -la /home/summit/.claude/'

          echo ""
          echo "=== 6. POST-STATE: summit auth test (the real test) ==="
          OUTPUT=$($SSH 'sudo -u summit bash -c "unset ANTHROPIC_API_KEY; timeout 15 claude -p \"echo: POST_CHECK_REPAIRED\" 2>&1 | head -10"')
          echo "$OUTPUT"

          echo ""
          echo "=== 7. VERDICT ==="
          if echo "$OUTPUT" | grep -q "POST_CHECK_REPAIRED"; then
            echo "✅ REPAIR SUCCESSFUL — summit can authenticate"
            exit 0
          elif echo "$OUTPUT" | grep -q "Not logged in"; then
            echo "❌ REPAIR FAILED — summit still not authenticated"
            echo "   Hypothesis: canonical root creds file path wrong, or file content expired"
            exit 1
          else
            echo "⚠️  AMBIGUOUS — unexpected output, review log"
            exit 2
          fi
