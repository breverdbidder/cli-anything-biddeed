name: Robinhood Photos Scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          mkdir -p /tmp/robinhood_photos
          cd /tmp/robinhood_photos

          cat > scrape.py <<'PY'
          import asyncio, json, os, re, hashlib
          from pathlib import Path
          from urllib.parse import urlparse, urljoin
          import urllib.request, urllib.error

          ADDR = "4087 Robinhood Dr Melbourne FL 32935"
          OUT = Path('/tmp/robinhood_photos')
          OUT.mkdir(exist_ok=True)

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          async def harvest_zillow(page):
              urls = set()
              try:
                  await page.goto(
                      "https://www.zillow.com/homes/4087-Robinhood-Dr-Melbourne-FL-32935_rb/",
                      wait_until="domcontentloaded", timeout=45000,
                  )
                  await asyncio.sleep(4)
                  html = await page.content()
                  Path('/tmp/robinhood_photos/zillow_search.html').write_text(html, errors='replace')
                  print(f"  Zillow search page: {len(html)} bytes", flush=True)

                  # Find ZPID and follow to detail page
                  m = re.search(r'/homedetails/[^"\']*?(\d+)_zpid', html)
                  if m:
                      zpid = m.group(1)
                      print(f"  Found zpid={zpid}", flush=True)
                      detail_url = f"https://www.zillow.com/homedetails/4087-Robinhood-Dr-Melbourne-FL-32935/{zpid}_zpid/"
                      await page.goto(detail_url, wait_until="domcontentloaded", timeout=45000)
                      await asyncio.sleep(5)
                      html = await page.content()
                      Path('/tmp/robinhood_photos/zillow_detail.html').write_text(html, errors='replace')
                      print(f"  Zillow detail: {len(html)} bytes", flush=True)
                  else:
                      print("  Zillow: no zpid found", flush=True)

                  # Image regex hits
                  for pat in [
                      r'https://photos\.zillowstatic\.com/[a-z]+/IS[a-z0-9]+\.jpg',
                      r'https://photos\.zillowstatic\.com/fp/[a-z0-9]+-[a-z0-9_]+\.jpg',
                      r'https://photos\.zillowstatic\.com/fp/[^"\\]+?\.jpg',
                      r'https://[^"\\]+?zillowstatic[^"\\]+?\.jpg',
                  ]:
                      for u in re.findall(pat, html):
                          urls.add(u)
                  print(f"  Zillow URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Zillow error: {e}", flush=True)
              return list(urls)

          async def harvest_realtor(page):
              urls = set()
              try:
                  await page.goto(
                      "https://www.realtor.com/realestateandhomes-detail/4087-Robinhood-Dr_Melbourne_FL_32935",
                      wait_until="domcontentloaded", timeout=45000,
                  )
                  await asyncio.sleep(5)
                  html = await page.content()
                  Path('/tmp/robinhood_photos/realtor_detail.html').write_text(html, errors='replace')
                  print(f"  Realtor: {len(html)} bytes", flush=True)
                  for pat in [
                      r'https://ap\.rdcpix\.com/[^"\\]+?\.jpg',
                      r'https://[a-z]+\.rdcpix\.com/[^"\\]+?\.jpg',
                  ]:
                      for u in re.findall(pat, html):
                          urls.add(u)
                  print(f"  Realtor URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Realtor error: {e}", flush=True)
              return list(urls)

          async def harvest_redfin(page):
              urls = set()
              try:
                  # Use the search endpoint which redirects
                  await page.goto(
                      "https://www.redfin.com/stingray/do/location-autocomplete?location=4087+Robinhood+Dr+Melbourne+FL+32935&v=2",
                      wait_until="domcontentloaded", timeout=20000,
                  )
                  await asyncio.sleep(2)
                  body = await page.content()
                  # extract redfin URL
                  m = re.search(r'(/FL/Melbourne/4087-Robinhood-Dr[^"\\]+/home/\d+)', body)
                  if m:
                      detail_url = "https://www.redfin.com" + m.group(1)
                      print(f"  Redfin detail: {detail_url}", flush=True)
                      await page.goto(detail_url, wait_until="domcontentloaded", timeout=45000)
                      await asyncio.sleep(5)
                      html = await page.content()
                      Path('/tmp/robinhood_photos/redfin_detail.html').write_text(html, errors='replace')
                      for pat in [
                          r'https://ssl\.cdn-redfin\.com/photo/\d+/[^"\\]+?\.jpg',
                          r'https://[a-z0-9.\-]+cdn-redfin[^"\\]+?\.jpg',
                      ]:
                          for u in re.findall(pat, html):
                              urls.add(u)
                      print(f"  Redfin URLs: {len(urls)}", flush=True)
                  else:
                      print(f"  Redfin: no autocomplete match", flush=True)
              except Exception as e:
                  print(f"  Redfin error: {e}", flush=True)
              return list(urls)

          async def harvest_google_images(page):
              urls = set()
              try:
                  await page.goto(
                      "https://www.google.com/search?tbm=isch&q=%224087+Robinhood+Drive%22+Melbourne+FL",
                      wait_until="domcontentloaded", timeout=30000,
                  )
                  await asyncio.sleep(3)
                  html = await page.content()
                  for pat in [
                      r'"(https://[^"\\]+?\.jpg)"',
                      r'"(https://[^"\\]+?\.jpeg)"',
                  ]:
                      for u in re.findall(pat, html):
                          if any(d in u for d in ['zillow', 'redfin', 'realtor', 'rdcpix', 'homes.com', 'trulia']):
                              urls.add(u)
                  print(f"  Google Images filtered: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Google Images error: {e}", flush=True)
              return list(urls)

          async def main():
              from playwright.async_api import async_playwright
              all_urls = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                  )
                  page = await ctx.new_page()

                  print("=== Zillow ===", flush=True)
                  all_urls += await harvest_zillow(page)

                  print("\n=== Realtor ===", flush=True)
                  all_urls += await harvest_realtor(page)

                  print("\n=== Redfin ===", flush=True)
                  all_urls += await harvest_redfin(page)

                  print("\n=== Google Images ===", flush=True)
                  all_urls += await harvest_google_images(page)

                  await browser.close()

              # Dedupe + filter
              uniq = list(dict.fromkeys(all_urls))
              # Drop tiny thumbnails
              filtered = [u for u in uniq if any(s in u.lower() for s in ['large', 'big', 'cc_', '/o/', '/x/']) or 'thumb' not in u.lower()]
              if not filtered:
                  filtered = uniq

              print(f"\n=== Total unique URLs: {len(uniq)}, filtered: {len(filtered)} ===", flush=True)
              for u in filtered[:30]:
                  print(f"  {u[:140]}", flush=True)

              # Download
              downloaded = []
              for i, url in enumerate(filtered[:25], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      ext = '.jpg'
                      fname = f"{i:02d}_robinhood_{h}{ext}"
                      fpath = OUT / fname
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Referer': 'https://www.zillow.com/'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          data = r.read()
                      if len(data) > 5000:  # min 5KB
                          fpath.write_bytes(data)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                          print(f"  [{i}] {len(data)} bytes -> {fname}", flush=True)
                      else:
                          print(f"  [{i}] too small ({len(data)} bytes)", flush=True)
                  except Exception as e:
                      print(f"  [{i}] FAIL: {e}", flush=True)

              with open(OUT / 'manifest.json', 'w') as f:
                  json.dump({'address': ADDR, 'all_urls_found': len(uniq), 'downloaded': downloaded}, f, indent=2)
              print(f"\n>>> Downloaded {len(downloaded)} photos", flush=True)

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          ls -la /tmp/robinhood_photos/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/robinhood_photos/ /tmp/results/ || true
          ls -la /tmp/results/robinhood_photos/ 2>/dev/null || echo "no results"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos
          path: /tmp/results/
          retention-days: 90
