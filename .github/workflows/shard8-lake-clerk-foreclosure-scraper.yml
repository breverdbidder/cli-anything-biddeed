name: "SHARD-8 Lake County Clerk Foreclosure Scraper"
# Real, unauthenticated, server-rendered clerk calendar — no WAF, no login.
# lake.realforeclose.com is confirmed NOT a live foreclosure site (offline;
# Lake omitted from RealAuction's own "Jump To" directory). Real source is
# the Lake County Clerk's in-person courthouse calendar, same pattern as the
# existing Brevard exception.
#
# Source: https://foreclosurecalendar.lakecountyclerkfl.gov/default.aspx
# WIRING MANDATE: dispatch_id e8753921-4814-4a11-be35-839594f91e8b (shard-8)

on:
  schedule:
    - cron: '15 8 * * *'   # daily 08:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse only, no DB writes)'
        required: false
        default: 'false'

jobs:
  scrape:
    name: "Scrape Lake Clerk foreclosure calendar"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet requests

      - name: "Scrape + upsert real foreclosure sale entries"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            python3 scripts/shard8_lake_clerk_foreclosure_scraper.py --dry-run
          else
            python3 scripts/shard8_lake_clerk_foreclosure_scraper.py
          fi

      - name: "Verify: row count for lake/foreclosure"
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.lake&sale_type=eq.foreclosure&select=case_number,auction_date&limit=3")
          COUNT=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$RESP")
          echo "### SQL VERIFICATION: lake foreclosure" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT case_number, auction_date FROM multi_county_auctions WHERE county='lake' AND sale_type='foreclosure' LIMIT 3;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- sample rows: $RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::lake/foreclosure: $COUNT sample rows verified present"
