name: "SHARD Jefferson County Clerk Foreclosure/Tax-Deed Scraper"
# jefferson.realforeclose.com / jefferson.realtaxdeed.com are NOT provisioned
# RealAuction tenants for Jefferson (confirmed 2026-07-03). Real source is the
# Jefferson County Clerk's own site — sales are held in-person at the
# courthouse (same in-person pattern as Brevard/Lake/Liberty).
#
# Sources:
#   https://www.jeffersonclerk.com/clerk-services/property-sales/foreclosures/
#   https://www.jeffersonclerk.com/clerk-services/property-sales/tax-deed-sales/
#
# Built 2026-07-03 (scripts/shard_jefferson_clerk_scraper.py, commit 6cfd51c1)
# but never wired to any scheduler -- Gold Standard shard-8 (run3534,
# 2026-07-10) found it committed and unexecuted since. This workflow closes
# that WIRING MANDATE gap. Jefferson is a small rural county (pop ~14K) with
# sparse, intermittent auction activity -- both lanes were genuinely empty
# (0 scheduled sales) when this was wired, verified live 2026-07-10. Weekly
# cadence is appropriate; daily would just be noise for a county this small.

on:
  schedule:
    - cron: '30 8 * * 1'   # weekly, Monday 08:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse only, no DB writes)'
        required: false
        default: 'false'

jobs:
  scrape:
    name: "Scrape Jefferson Clerk foreclosure + tax-deed calendars"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install dependencies"
        run: pip install pypdf

      - name: "Scrape + upsert real auction entries"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            python3 scripts/shard_jefferson_clerk_scraper.py --dry-run
          else
            python3 scripts/shard_jefferson_clerk_scraper.py
          fi

      - name: "Verify: row count for jefferson"
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.jefferson&select=case_number,sale_type,auction_date&limit=10")
          COUNT=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$RESP")
          echo "### SQL VERIFICATION: jefferson auctions" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT case_number, sale_type, auction_date FROM multi_county_auctions WHERE county='jefferson' LIMIT 10;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- sample rows: $RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::jefferson: $COUNT sample rows verified present"
