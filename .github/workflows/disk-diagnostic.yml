name: Hetzner disk diagnostic — find what's eating space
on:
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: disk usage by filesystem ==="
          $SSH 'df -h'

          echo
          echo "=== B: inode usage ==="
          $SSH 'df -i'

          echo
          echo "=== C: top 20 largest directories at root ==="
          $SSH 'du -sh /* 2>/dev/null | sort -rh | head -20'

          echo
          echo "=== D: /var breakdown ==="
          $SSH 'du -sh /var/* 2>/dev/null | sort -rh | head -20'

          echo
          echo "=== E: docker space usage ==="
          $SSH 'docker system df -v 2>/dev/null | head -60'

          echo
          echo "=== F: largest files on system ==="
          $SSH 'find / -type f -size +500M 2>/dev/null | head -20 | xargs -I {} ls -lh {} 2>/dev/null'

          echo
          echo "=== G: /root ==="
          $SSH 'du -sh /root/* 2>/dev/null | sort -rh | head -20'

          echo
          echo "=== H: /tmp ==="
          $SSH 'du -sh /tmp 2>/dev/null; ls -la /tmp 2>/dev/null | head -20'

          echo "=== END ==="
