name: "Gold Standard SHARD-1: brevard+osceola run-8552"
# dispatch_id: 1f5f4ede-c466-4c43-a9ec-e6ce1d02c1e5
# brevard: 9/10 (I=84.3% failing) | osceola: 8/10 (G=78.6%, I=92.7% failing)
# SHIP-TO-MAIN mandate: all work commits directly to main

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'County to target'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - brevard
          - osceola
          - verify_only
          - closeout

concurrency:
  group: gold-standard-shard1-brevard-osceola-8552
  cancel-in-progress: false

jobs:
  brevard-osceola-shard1:
    name: "SHARD-1 brevard+osceola (run 8552)"
    runs-on: ubuntu-latest
    timeout-minutes: 340

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Configure git
        run: |
          git config user.email "shard1-brevard-osceola-bot@biddeed.ai"
          git config user.name "SHARD-1 Brevard+Osceola Bot (run 8552)"

      - name: Verify baseline (before any writes)
        run: |
          set -euo pipefail
          echo "=== BASELINE pencil_dod_evaluate_county ==="
          python3 - <<'PYEOF'
          import os, json, urllib.request

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          for county in ["brevard", "osceola"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if (ev.get(l) or {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not (ev.get(l) or {}).get("pass")]
                  print(f"\n### BASELINE {county.upper()}: {len(passed)}/10")
                  for l in "ABCDEFGHIJ":
                      ld = ev.get(l) or {}
                      p = "PASS" if ld.get("pass") else "FAIL"
                      print(f"  {l}: {p} metric={ld.get('metric','-')} detail={ld.get('detail','')}")
              except Exception as e:
                  print(f"{county}: ERROR {e}")
          PYEOF

      - name: Fix brevard I (municipal zoning backfill)
        if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'brevard' }}
        run: |
          set -euo pipefail
          echo "=== BREVARD I FIX: municipal ArcGIS zoning ==="
          python3 scripts/shard1_brevard_osceola_i_fix_run8552.py --county brevard
          echo "=== brevard I DONE ==="

      - name: Fix osceola I (placeholder-address rows)
        if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'osceola' }}
        run: |
          set -euo pipefail
          echo "=== OSCEOLA I FIX: address/geo/zone backfill ==="
          python3 scripts/shard1_brevard_osceola_i_fix_run8552.py --county osceola
          echo "=== osceola I DONE ==="

      - name: Fix osceola G pk1000 (per-parcel parking ratio)
        if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'osceola' }}
        run: |
          set -euo pipefail
          echo "=== OSCEOLA G pk1000 FIX: per-parcel DOR_UC parking mapping ==="
          python3 scripts/shard1_osceola_g_pk1000_fix_run8552.py
          echo "=== osceola G DONE ==="

      - name: Verify after (post-fix evaluation)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "=== POST-FIX pencil_dod_evaluate_county ==="
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          results = {}
          for county in ["brevard", "osceola"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if (ev.get(l) or {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not (ev.get(l) or {}).get("pass")]
                  results[county] = {"score": len(passed), "pass": passed, "fail": failed, "raw": ev}
                  star = "★ GOLD" if len(passed) == 10 else ""
                  print(f"\n### AFTER {county.upper()}: {len(passed)}/10 {star}")
                  for l in "ABCDEFGHIJ":
                      ld = ev.get(l) or {}
                      p = "PASS" if ld.get("pass") else "FAIL"
                      print(f"  {l}: {p} metric={ld.get('metric','-')} detail={ld.get('detail','')}")
              except Exception as e:
                  print(f"{county}: ERROR {e}")
                  results[county] = {"score": 0, "error": str(e)}

          print(f"\n### SQL VERIFICATION")
          print(f"SELECT public.pencil_dod_evaluate_county('brevard');")
          print(f"SELECT public.pencil_dod_evaluate_county('osceola');")
          print(f"\nResults: {json.dumps({k: v.get('score') for k, v in results.items()})}")

          for county, data in results.items():
              if data.get("score", 0) == 10:
                  print(f"GOLD {county} — checking certification eligibility")
          PYEOF

      - name: Session close-out checkpoint
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "=== SESSION CLOSE-OUT: write checkpoint to gold_standard_campaign ==="
          python3 - <<'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          DISPATCH_ID = "1f5f4ede-c466-4c43-a9ec-e6ce1d02c1e5"

          criteria_by_county = {}
          for county in ["brevard", "osceola"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ev = json.loads(r.read())
                  criteria = {l: bool((ev.get(l) or {}).get("pass")) for l in "ABCDEFGHIJ"}
                  criteria_by_county[county] = criteria
                  passed = sum(1 for v in criteria.values() if v)
                  print(f"{county}: {passed}/10 criteria: {criteria}")
              except Exception as e:
                  print(f"{county} eval error: {e}")
                  criteria_by_county[county] = {l: False for l in "ABCDEFGHIJ"}

          now = datetime.now(timezone.utc).isoformat()
          for county, criteria in criteria_by_county.items():
              passed = sum(1 for v in criteria.values() if v)
              exit_reason = "certified" if passed == 10 else "timeout"

              update_body = json.dumps({
                  "criteria_passed": criteria,
                  "criteria_total": 10,
                  "exit_reason": exit_reason,
                  "session_end_at": now,
              })
              req = urllib.request.Request(
                  f"{SB_URL}/rest/v1/gold_standard_campaign"
                  f"?dispatch_id=eq.{DISPATCH_ID}&county_slug=eq.{county}",
                  data=update_body.encode(),
                  method="PATCH",
                  headers={**H, "Prefer": "return=minimal"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      r.read()
                  print(f"Checkpoint written: {county} {passed}/10 exit={exit_reason}")
              except Exception as e:
                  print(f"Checkpoint write failed for {county}: {e}")
                  insert_body = json.dumps({
                      "dispatch_id": DISPATCH_ID,
                      "county_slug": county,
                      "criteria_passed": criteria,
                      "criteria_total": 10,
                      "exit_reason": exit_reason,
                      "session_end_at": now,
                  })
                  req2 = urllib.request.Request(
                      f"{SB_URL}/rest/v1/gold_standard_campaign",
                      data=insert_body.encode(),
                      method="POST",
                      headers={**H, "Prefer": "return=minimal,resolution=merge-duplicates"},
                  )
                  try:
                      with urllib.request.urlopen(req2, timeout=30) as r:
                          r.read()
                      print(f"Checkpoint INSERT succeeded for {county}")
                  except Exception as e2:
                      print(f"Checkpoint INSERT also failed for {county}: {e2}")

          print(f"\n### SQL VERIFICATION (close-out)")
          print(f"SELECT county_slug, criteria_passed, criteria_total, exit_reason, session_end_at")
          print(f"FROM public.gold_standard_campaign")
          print(f"WHERE dispatch_id = '{DISPATCH_ID}';")
          PYEOF
