name: OAuth Fix — copy root creds to summit user (zero cost, zero HITL)
# Created Apr 13: forensic revealed root has working Max OAuth, summit user
# (which SUMMIT workflows run as) has stale credentials. Copy + chown + smoke-test.
# NO ANTHROPIC_API_KEY. NO new auth. NO token spend until smoke-test (one Max call).
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and restore summit user credentials
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Step 1: Compare existing credentials (size + sha256) ==="
          $SSH '
            ls -la /root/.claude/.credentials.json
            ls -la /home/summit/.claude/.credentials.json
            echo "--- sha256 ---"
            sha256sum /root/.claude/.credentials.json
            sha256sum /home/summit/.claude/.credentials.json
          '

          echo
          echo "=== Step 2: Test root auth (already known working) ==="
          $SSH 'claude auth status 2>&1 | head -10'

          echo
          echo "=== Step 3: Test summit auth BEFORE fix ==="
          $SSH 'su - summit -c "claude auth status 2>&1 | head -10" || echo "summit auth FAILED (as expected)"'

          echo
          echo "=== Step 4: Backup summit creds + copy from root ==="
          $SSH '
            cp -p /home/summit/.claude/.credentials.json /home/summit/.claude/.credentials.json.bak.$(date +%s) 2>/dev/null || echo "no backup needed"
            cp /root/.claude/.credentials.json /home/summit/.claude/.credentials.json
            chown summit:summit /home/summit/.claude/.credentials.json
            chmod 600 /home/summit/.claude/.credentials.json
            ls -la /home/summit/.claude/.credentials.json
            echo "--- post-copy sha256 ---"
            sha256sum /home/summit/.claude/.credentials.json
          '

          echo
          echo "=== Step 5: Test summit auth AFTER fix ==="
          $SSH 'su - summit -c "claude auth status 2>&1 | head -10"'

          echo
          echo "=== Step 6: Smoke test — single Max OAuth call as summit user ==="
          $SSH 'su - summit -c "cd /tmp && claude -p \"reply only with the literal text OK_SUMMIT_USER and nothing else\" --allowedTools \"Read\" 2>&1 | tail -10"' > /tmp/smoke.txt 2>&1 || true
          cat /tmp/smoke.txt

          if grep -qi "OK_SUMMIT_USER\|hello\|^OK" /tmp/smoke.txt; then
            echo "::notice::SUMMIT user OAuth WORKING — Max plan, zero cost, ready to dispatch SUMMITs"
          else
            echo "::error::Smoke test failed. Output above. Summit user OAuth still broken."
            exit 1
          fi
