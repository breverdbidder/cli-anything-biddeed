name: Deploy everest-stack to Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run QA + Lien Audit via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} '
            set -euo pipefail
            echo "========================================"
            echo " QA + LIEN AUDIT: VIERA EAST VS HORL"
            echo " Case: 05-2025-CC-022459-XXCC-BC"
            echo "========================================"

            pip install requests beautifulsoup4 --break-system-packages -q 2>/dev/null || true

            echo ""
            echo "[1/4] BCPAO GIS API — Parcel search for HORL"
            python3 << PYEOF
import requests, json

base = "https://gis.brevardfl.gov/gissrv/rest/services/Base_Map/Parcel_New_WKID2881/MapServer/5/query"
params = {
    "where": "UPPER(OWNER1) LIKE '"'"'%HORL%'"'"'",
    "outFields": "ACCOUNT,OWNER1,OWNER2,SITEADDR,LEGAL1,LEGAL2,JUSTVAL,BLDGVAL,LANDVAL,SQFT,YRBLT,BEDS,BATHS,USECODE",
    "f": "json",
    "returnGeometry": "false"
}
headers = {"User-Agent": "Mozilla/5.0"}

try:
    r = requests.get(base, params=params, headers=headers, timeout=15)
    data = r.json()
    features = data.get("features", [])
    print(f"Found {len(features)} parcels for HORL")
    for f in features:
        a = f["attributes"]
        print(json.dumps(a, indent=2))
except Exception as e:
    print(f"GIS error: {e}")
PYEOF

            echo ""
            echo "[2/4] BCPAO API — Property search"
            python3 << PYEOF
import requests, json

for endpoint in [
    "https://www.bcpao.us/api/v1/search?owner=HORL&activeonly=true",
    "https://www.bcpao.us/api/v1/search?owner=HORL",
    "https://www.bcpao.us/api/v1/search?name=HORL"
]:
    try:
        r = requests.get(endpoint, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
        print(f"{endpoint}: HTTP {r.status_code}")
        if r.status_code == 200 and r.text.strip() and r.text.strip() != "[]":
            print(r.text[:2000])
            break
    except Exception as e:
        print(f"Error: {e}")
PYEOF

            echo ""
            echo "[3/4] AcclaimWeb — Search recorded instruments"
            python3 << PYEOF
import requests, json
from bs4 import BeautifulSoup

s = requests.Session()
s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"})

base = "https://vaclmweb1.brevardclerk.us/AcclaimWeb"

# Get cookies
try:
    r = s.get(f"{base}/search/party", timeout=15)
    print(f"AcclaimWeb page: HTTP {r.status_code}")
except Exception as e:
    print(f"Connection failed: {e}")
    exit()

# Try searching
for search_data in [
    {"LastName": "HORL", "FirstName": "", "SearchType": "Exact", "PartyType": "Both"},
    {"LastName": "HORL", "FirstName": "AMY", "SearchType": "Exact", "PartyType": "Both"},
]:
    try:
        r = s.post(f"{base}/search/party", data=search_data, timeout=15, allow_redirects=True)
        print(f"Search {search_data.get('FirstName','ALL')}: HTTP {r.status_code}, {len(r.text)} bytes")
        
        soup = BeautifulSoup(r.text, "html.parser")
        
        # Look for result tables
        tables = soup.find_all("table")
        print(f"Tables found: {len(tables)}")
        
        for table in tables:
            rows = table.find_all("tr")
            for row in rows[:15]:
                cells = row.find_all(["td", "th"])
                if cells:
                    vals = [c.get_text(strip=True)[:40] for c in cells]
                    if any(v for v in vals):
                        print(" | ".join(vals))
        
        # Also check for any links with document info
        links = soup.find_all("a", href=True)
        doc_links = [l for l in links if "document" in str(l.get("href", "")).lower() or "cfn" in l.get_text(strip=True).lower()]
        if doc_links:
            print(f"Document links found: {len(doc_links)}")
            for dl in doc_links[:10]:
                print(f"  {dl.get_text(strip=True)}: {dl['href']}")
                
    except Exception as e:
        print(f"Search error: {e}")
PYEOF

            echo ""
            echo "[4/4] Save audit report"
            mkdir -p /home/claude/.everest-stack/audits
            cat > /home/claude/.everest-stack/audits/horl-viera-east-$(date +%Y%m%d).md << REPORT
# Lien Audit: VIERA EAST VS AMY L HORL
Case: 05-2025-CC-022459-XXCC-BC
Mode: PRE-BID (Automated)
Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
Type: HOA FORECLOSURE

## Data Sources Queried
- BCPAO GIS API: searched
- BCPAO Property API: searched
- AcclaimWeb: searched
- Results: see GHA run logs
REPORT
            chown -R claude:claude /home/claude/.everest-stack

            echo ""
            echo "========================================"
            echo " AUDIT COMPLETE"
            echo "========================================"
          '

      - name: Telegram results
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔍 *QA + Lien Audit: VIERA EAST VS HORL*
            Case: 05-2025-CC-022459
            Type: ⚠️ HOA FORECLOSURE
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
