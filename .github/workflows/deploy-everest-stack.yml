name: Deploy everest-stack to Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy and run scraper
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} 'bash -s' << 'REMOTE'
          set -euo pipefail

          REPO="/home/claude/everest-stack"
          PLUGIN="/home/claude/.claude/skills/everest-stack"

          echo "[1/5] Repo update..."
          cd "$REPO"
          git fetch origin main -q && git reset --hard origin/main -q
          echo "  SHA=$(git rev-parse --short HEAD)"

          echo "[2/5] Plugin symlink..."
          mkdir -p "$(dirname $PLUGIN)"
          [ -L "$PLUGIN" ] || ln -sf "$REPO" "$PLUGIN"
          echo "  OK"

          echo "[3/5] Tests..."
          TEST_OUT=$(node --test test/skill-validation.test.js 2>&1 || true)
          PASS=$(echo "$TEST_OUT" | grep "# pass" | awk "{print \$3}")
          FAIL=$(echo "$TEST_OUT" | grep "# fail" | awk "{print \$3}")
          echo "  $PASS pass, $FAIL fail"

          echo "[4/5] Install scraper deps..."
          pip install requests beautifulsoup4 --break-system-packages -q 2>/dev/null || true
          echo "  OK"

          echo "[5/5] Run HORL audit..."
          python3 "$REPO/scrapers/property_scraper.py" \
            --owner "AMY HORL" \
            --case "05-2025-CC-022459-XXCC-BC" \
            --mode lien

          echo ""
          echo "REPORT:"
          cat /home/claude/.everest-stack/audits/horl-audit-*.json 2>/dev/null || echo "No report file found"
          REMOTE

      - name: Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔍 *Phase 4 Scraper: VIERA EAST VS HORL*
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
