name: Deploy everest-stack to Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy everest-stack via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} '
            set -euo pipefail
            REPO_URL="https://github.com/breverdbidder/everest-stack.git"
            REPO_DIR="/home/claude/everest-stack"
            CLAUDE_USER="claude"

            echo "[1/7] Repo setup..."
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main -q 2>/dev/null
              git reset --hard origin/main -q
              echo "  Updated to $(git rev-parse --short HEAD)"
            else
              git clone "$REPO_URL" "$REPO_DIR" -q
              cd "$REPO_DIR"
              echo "  Cloned: $(git rev-parse --short HEAD)"
            fi
            chown -R $CLAUDE_USER:$CLAUDE_USER "$REPO_DIR"
            cd "$REPO_DIR"
            git config user.email "ariel@everestcapitalusa.com"
            git config user.name "Ariel Shapira"

            echo "[2/7] Upstream remote..."
            if git remote get-url upstream > /dev/null 2>&1; then
              echo "  Already configured"
            else
              git remote add upstream https://github.com/garrytan/gstack.git
              echo "  Added garrytan/gstack"
            fi
            git fetch upstream main --depth=1 -q 2>/dev/null || echo "  fetch skipped"
            UPSTREAM_SHA=$(git rev-parse --short upstream/main 2>/dev/null || echo "n/a")
            echo "  Upstream: $UPSTREAM_SHA"

            echo "[3/7] Plugin install..."
            SKILLS_DIR="/home/claude/.claude/skills"
            mkdir -p "$SKILLS_DIR"
            PLUGIN_LINK="$SKILLS_DIR/everest-stack"
            [ -L "$PLUGIN_LINK" ] && rm "$PLUGIN_LINK"
            ln -sf "$REPO_DIR" "$PLUGIN_LINK"
            chown -h $CLAUDE_USER:$CLAUDE_USER "$PLUGIN_LINK"
            [ -f "$PLUGIN_LINK/SKILL.md" ] && echo "  Symlinked OK" || { echo "  FAILED"; exit 1; }

            echo "[4/7] Tests..."
            cd "$REPO_DIR"
            TEST_OUT=$(su - $CLAUDE_USER -c "cd $REPO_DIR && node --test test/skill-validation.test.js" 2>&1 || true)
            PASS=$(echo "$TEST_OUT" | grep "# pass" | awk "{print \$3}")
            FAIL=$(echo "$TEST_OUT" | grep "# fail" | awk "{print \$3}")
            echo "  $PASS pass, $FAIL fail"
            if [ "${FAIL:-0}" != "0" ]; then
              echo "$TEST_OUT" | grep "not ok"
              exit 1
            fi

            echo "[5/7] Skills..."
            DOH=$(wc -l < deal-office-hours/SKILL.md)
            LA=$(wc -l < lien-audit/SKILL.md)
            FULL=$(find . -maxdepth 2 -name "SKILL.md" -not -path "./SKILL.md" -exec grep -L "STUB" {} \; 2>/dev/null | wc -l)
            STUBS=$(find . -maxdepth 2 -name "SKILL.md" -not -path "./SKILL.md" -exec grep -l "STUB" {} \; 2>/dev/null | wc -l)
            echo "  office-hours:${DOH}L lien-audit:${LA}L ${FULL}full+${STUBS}stubs"

            echo "[6/7] Cron + health..."
            mkdir -p /home/claude/.sentinel
            HEALTH="/home/claude/.sentinel/monitored-repos.txt"
            grep -q "everest-stack" "$HEALTH" 2>/dev/null || echo "everest-stack:$REPO_DIR" >> "$HEALTH"
            chmod +x "$REPO_DIR/scripts/"*.sh 2>/dev/null || true
            chown -R $CLAUDE_USER:$CLAUDE_USER /home/claude/.sentinel

            su - $CLAUDE_USER -c "
              CT=\$(crontab -l 2>/dev/null || true)
              echo \"\$CT\" | grep -q upstream-sync || (echo \"\$CT\"; echo \"0 14 * * 0 $REPO_DIR/scripts/upstream-sync.sh >> /tmp/everest-upstream.log 2>&1\") | crontab -
              CT=\$(crontab -l 2>/dev/null || true)
              echo \"\$CT\" | grep -q repo-forensics || (echo \"\$CT\"; echo \"5 14 * * 0 $REPO_DIR/scripts/repo-forensics.sh >> /tmp/everest-health.log 2>&1\") | crontab -
            "
            echo "  Cron configured"

            echo "[7/7] DONE"
            SHA=$(git rev-parse --short HEAD)
            echo "SHA=$SHA Tests=${PASS}/${PASS} Skills=${FULL}f+${STUBS}s Upstream=$UPSTREAM_SHA"
            echo "Plugin: $PLUGIN_LINK"
            echo "Cron: upstream-sync Sun 9AM EST, repo-forensics Sun 9:05AM EST"
          '

      - name: Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🏔️ *everest-stack SUMMIT*
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
