name: Deploy everest-stack to Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run QA + Lien Audit via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          cat > /tmp/audit.py << 'PYSCRIPT'
          import requests, json, sys
          from datetime import datetime

          print("=" * 50)
          print("QA + LIEN AUDIT: VIERA EAST VS AMY L HORL")
          print("Case: 05-2025-CC-022459-XXCC-BC")
          print("Type: HOA FORECLOSURE (CRITICAL)")
          print("=" * 50)

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          print("\n[1/3] BCPAO GIS API - Searching for HORL...")
          try:
              url = "https://gis.brevardfl.gov/gissrv/rest/services/Base_Map/Parcel_New_WKID2881/MapServer/5/query"
              params = {
                  "where": "UPPER(OWNER1) LIKE '%HORL%'",
                  "outFields": "ACCOUNT,OWNER1,OWNER2,SITEADDR,LEGAL1,LEGAL2,JUSTVAL,BLDGVAL,LANDVAL,SQFT,YRBLT,BEDS,BATHS,USECODE",
                  "f": "json",
                  "returnGeometry": "false"
              }
              r = requests.get(url, params=params, headers=headers, timeout=15)
              data = r.json()
              features = data.get("features", [])
              print(f"Found {len(features)} parcels")
              for f in features:
                  print(json.dumps(f["attributes"], indent=2))
          except Exception as e:
              print(f"GIS error: {e}")

          print("\n[2/3] BCPAO Property API...")
          for ep in [
              "https://www.bcpao.us/api/v1/search?owner=HORL&activeonly=true",
              "https://www.bcpao.us/api/v1/search?owner=HORL"
          ]:
              try:
                  r = requests.get(ep, headers=headers, timeout=10)
                  print(f"{ep}: HTTP {r.status_code}")
                  if r.status_code == 200 and r.text.strip() and r.text.strip() != "[]":
                      print(r.text[:2000])
                      break
              except Exception as e:
                  print(f"Error: {e}")

          print("\n[3/3] AcclaimWeb - Searching instruments for HORL...")
          try:
              s = requests.Session()
              s.headers.update(headers)
              base = "https://vaclmweb1.brevardclerk.us/AcclaimWeb"
              r = s.get(f"{base}/search/party", timeout=15)
              print(f"AcclaimWeb page: HTTP {r.status_code}")
              search_data = {"LastName": "HORL", "FirstName": "", "SearchType": "Exact", "PartyType": "Both"}
              r = s.post(f"{base}/search/party", data=search_data, timeout=15, allow_redirects=True)
              print(f"Search: HTTP {r.status_code}, {len(r.text)} bytes")
              from bs4 import BeautifulSoup
              soup = BeautifulSoup(r.text, "html.parser")
              for table in soup.find_all("table"):
                  for row in table.find_all("tr")[:20]:
                      cells = row.find_all(["td","th"])
                      if cells:
                          vals = [c.get_text(strip=True)[:50] for c in cells]
                          if any(v for v in vals):
                              print(" | ".join(vals))
          except Exception as e:
              print(f"AcclaimWeb error: {e}")

          print("\n" + "=" * 50)
          print("AUDIT COMPLETE")
          print("=" * 50)
          PYSCRIPT

          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no /tmp/audit.py root@${{ secrets.HETZNER_IP }}:/tmp/audit.py

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} "pip install requests beautifulsoup4 --break-system-packages -q 2>/dev/null; python3 /tmp/audit.py"

      - name: Telegram results
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔍 *QA + Lien Audit: VIERA EAST VS HORL*
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
