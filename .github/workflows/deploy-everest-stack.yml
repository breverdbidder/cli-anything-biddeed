name: Deploy everest-stack to Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy + Full HORL Audit
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} 'bash -s' << 'REMOTE'
          set -euo pipefail
          REPO="/home/claude/everest-stack"
          PLUGIN="/home/claude/.claude/skills/everest-stack"

          echo "[1/7] Update repo..."
          cd "$REPO" && git fetch origin main -q && git reset --hard origin/main -q
          echo "  SHA=$(git rev-parse --short HEAD)"

          echo "[2/7] Symlink..."
          mkdir -p "$(dirname $PLUGIN)"
          [ -L "$PLUGIN" ] || ln -sf "$REPO" "$PLUGIN"
          echo "  OK"

          echo "[3/7] Tests..."
          TEST_OUT=$(node --test test/skill-validation.test.js 2>&1 || true)
          PASS=$(echo "$TEST_OUT" | grep "# pass" | awk "{print \$3}")
          FAIL=$(echo "$TEST_OUT" | grep "# fail" | awk "{print \$3}")
          echo "  $PASS pass, $FAIL fail"

          echo "[4/7] Install scraper deps..."
          pip install requests beautifulsoup4 playwright --break-system-packages -q 2>/dev/null || true
          playwright install chromium 2>/dev/null || echo "  Chromium install skipped"
          echo "  OK"

          echo "[5/7] Verify skills..."
          FULL=$(find . -maxdepth 2 -name SKILL.md -exec grep -l "^---" {} \; | wc -l)
          echo "  ${FULL} skills found"

          echo "[6/7] Run HORL audit..."
          cd "$REPO"
          python3 scrapers/property_scraper.py --owner "AMY HORL" --case "05-2025-CC-022459-XXCC-BC" --mode lien 2>&1

          echo ""
          echo "[7/7] Check audit report..."
          find /root/.everest-stack/audits/ -name "*horl*" -exec cat {} \; 2>/dev/null || echo "No report"
          find /home/claude/.everest-stack/audits/ -name "*horl*" -exec cat {} \; 2>/dev/null || true
          REMOTE

      - name: Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔍 *Phase 4 Full Audit: HORL*
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
