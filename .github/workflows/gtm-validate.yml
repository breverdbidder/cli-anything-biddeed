name: GTM Factory — validate

# CMO FACTORY CP0 (issue #19777). Validator role. Reads docs/gtm/MISSION.md,
# harness/gtm/, and .factory/gtm/ from `main` ONLY -- never from a PR branch
# (docs/gtm/META.md SS5: "Protected paths ... validator reads them from
# main"). This workflow is a CP0 skeleton: no builder role produces PRs yet
# (that lands CP1+), so the default run is a self-test of factory/gtm/gate.py
# against its own fixtures, proving the markers this workflow is expected to
# emit actually work end to end.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate (optional -- CP0 has no builder-produced PRs yet, so omitting this runs the gate.py self-test instead)'
        required: false
        type: string
      paths:
        description: 'Space-separated artifact file paths to compliance-check (optional, defaults to the fixture self-test)'
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *' # every 6h, offset from the :00/:15/:30/:45 pg_cron watchdog tick

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (protected paths ONLY ever read from main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Halt check (fails closed) — STOP file, control issue label, spi_gates
        id: halt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL || secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          HALTED=0
          REASONS=""

          if [ -f ".factory/gtm/STOP" ]; then
            HALTED=1; REASONS="${REASONS} STOP-file-present"
          fi

          LABELS=$(gh issue view 19780 --repo ${{ github.repository }} --json labels -q '.labels[].name' 2>/dev/null)
          RC=$?
          if [ $RC -ne 0 ]; then
            HALTED=1; REASONS="${REASONS} control-issue-label-unreadable(fails-closed)"
          elif echo "$LABELS" | grep -qx "factory:halt"; then
            HALTED=1; REASONS="${REASONS} factory:halt-label-set"
          fi

          GATE=$(curl -s --max-time 15 "${SUPABASE_URL}/rest/v1/spi_gates?gate_key=eq.gtm_factory_halt&select=verified_at" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          if [ -z "$GATE" ]; then
            HALTED=1; REASONS="${REASONS} spi_gates-unreadable(fails-closed)"
          else
            OPEN=$(echo "$GATE" | python3 -c "import json,sys; d=json.load(sys.stdin); print('1' if d and d[0].get('verified_at') is None else '0')" 2>/dev/null || echo "1")
            if [ "$OPEN" = "1" ]; then
              HALTED=1; REASONS="${REASONS} spi_gates.gtm_factory_halt-open"
            fi
          fi

          echo "halted=$HALTED" >> "$GITHUB_OUTPUT"
          echo "reasons=$REASONS" >> "$GITHUB_OUTPUT"
          echo "halt check: halted=$HALTED reasons=[$REASONS]"

      - name: Stop here if halted
        if: steps.halt.outputs.halted == '1'
        run: |
          echo "::error::GTM factory is HALTED (${{ steps.halt.outputs.reasons }}) — refusing to validate. See .factory/gtm/STOP.md for the resume contract."
          exit 1

      - name: Quota gate check (public.quota_gate_check('engineering'))
        id: quota
        if: steps.halt.outputs.halted == '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESP=$(curl -s --max-time 30 -X POST "${SUPABASE_URL}/rest/v1/rpc/quota_gate_check" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" -d '{"p_category":"engineering"}')
          echo "quota_gate_check response: $RESP"
          ALLOW=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("allow")).lower())' 2>/dev/null || echo "error")
          REASON=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("reason",""))' 2>/dev/null || echo "unreachable")
          echo "allow=$ALLOW reason=$REASON"
          if [ "$ALLOW" = "true" ]; then
            MODE="full"
          elif [ "$REASON" = "NO_READING" ]; then
            MODE="cap"   # run, but capped -- NEVER silently skip on NO_READING
          else
            MODE="skip"  # explicit denial for a real reason — logged, not silent
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "quota gate mode: $MODE (allow=$ALLOW reason=$REASON)"

      - name: Compliance self-test / artifact check (factory/gtm/gate.py)
        if: steps.halt.outputs.halted == '0' && steps.quota.outputs.mode != 'skip'
        run: |
          if [ -n "${{ inputs.paths }}" ]; then
            echo "validating provided paths: ${{ inputs.paths }}"
            python3 factory/gtm/gate.py --paths ${{ inputs.paths }}
          else
            echo "no --paths input given -- running the gate.py self-test fixtures (CP0: no builder-produced artifacts exist yet)"
            python3 factory/gtm/gate.py --paths factory/gtm/fixtures/caption_clean.txt
          fi

      - name: Quota-denied — logged, not silent
        if: steps.halt.outputs.halted == '0' && steps.quota.outputs.mode == 'skip'
        run: |
          echo "::warning::quota_gate_check denied engineering-category work this run (mode=skip). Real validation was NOT performed this run. This is a logged skip, not a silent one."
          exit 1

      - name: doctor.py autonomy-dial report (never fails the job — CP0 is expected to be incomplete)
        if: steps.halt.outputs.halted == '0'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT_FULL || secrets.GITHUB_TOKEN }}
        run: python3 factory/gtm/doctor.py
