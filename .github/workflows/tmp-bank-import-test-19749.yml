name: TMP - Bank file import + SimpleFIN live test (issue 19749)

# Temporary diagnostic workflow, added/used/removed in the same session per CC_META_PROMPT.md
# CREDENTIAL HANDLING -- runs the real POST /import and /simplefin/* calls INSIDE the GHA
# runner (secrets masked at execution) rather than from a chat session, since this session does
# not hold CFO_AGENT_SHARED_SECRET (write-only GH secret, generated in #19737, never readable
# back). Mirrors the pattern already used by #19688 and #19738 for the same reason.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Import synthetic Wells Fargo CSV fixture
        env:
          CFO_SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
          WORKER_URL: https://everest-bank-engine.brevardbidderai.workers.dev
        run: |
          cat > /tmp/wf_fixture.csv << 'EOF'
          "01/15/2026","-52.13","*","","AMAZON.COM PURCHASE FIXTURE"
          "01/18/2026","1500.00","*","","PAYROLL DEPOSIT FIXTURE"
          "01/20/2026","-9.99","*","","NETFLIX.COM FIXTURE"
          EOF
          CODE=$(curl -s -o /tmp/import_resp.json -w "%{http_code}" -X POST \
            "$WORKER_URL/import?entity_code=everest_capital&mask=9999&account_label=WF%20Test%20Fixture%209999" \
            -H "X-CFO-Secret: $CFO_SECRET" \
            -H "Content-Type: text/csv" \
            --data-binary @/tmp/wf_fixture.csv)
          echo "POST /import (CSV fixture) -> HTTP $CODE"
          cat /tmp/import_resp.json
          echo "import_http_code=$CODE" >> "$GITHUB_OUTPUT"
        id: import_csv

      - name: Import synthetic OFX fixture (idempotency + FITID path)
        env:
          CFO_SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
          WORKER_URL: https://everest-bank-engine.brevardbidderai.workers.dev
        run: |
          cat > /tmp/wf_fixture.ofx << 'EOF'
          OFXHEADER:100
          DATA:OFXSGML
          VERSION:102
          SECURITY:NONE
          ENCODING:USASCII

          <OFX>
          <BANKMSGSRSV1>
          <STMTTRNRS>
          <STMTRS>
          <BANKACCTFROM>
          <ACCTID>9998
          </BANKACCTFROM>
          <BANKTRANLIST>
          <STMTTRN>
          <TRNTYPE>DEBIT
          <DTPOSTED>20260122120000[-5:EST]
          <TRNAMT>-14.50
          <FITID>FIXTURE-OFX-0001
          <NAME>UBER TRIP FIXTURE
          </STMTTRN>
          </BANKTRANLIST>
          </STMTRS>
          </STMTTRNRS>
          </BANKMSGSRSV1>
          </OFX>
          EOF
          CODE=$(curl -s -o /tmp/import_ofx_resp.json -w "%{http_code}" -X POST \
            "$WORKER_URL/import?entity_code=everest_capital&mask=9998&account_label=WF%20Test%20Fixture%209998" \
            -H "X-CFO-Secret: $CFO_SECRET" \
            -H "Content-Type: application/x-ofx" \
            --data-binary @/tmp/wf_fixture.ofx)
          echo "POST /import (OFX fixture) -> HTTP $CODE"
          cat /tmp/import_ofx_resp.json

      - name: Re-import same CSV fixture (idempotency proof)
        env:
          CFO_SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
          WORKER_URL: https://everest-bank-engine.brevardbidderai.workers.dev
        run: |
          CODE=$(curl -s -o /tmp/import_resp2.json -w "%{http_code}" -X POST \
            "$WORKER_URL/import?entity_code=everest_capital&mask=9999&account_label=WF%20Test%20Fixture%209999" \
            -H "X-CFO-Secret: $CFO_SECRET" \
            -H "Content-Type: text/csv" \
            --data-binary @/tmp/wf_fixture.csv)
          echo "POST /import (CSV fixture, 2nd run) -> HTTP $CODE"
          cat /tmp/import_resp2.json

      - name: SimpleFIN claim against published demo setup token
        env:
          CFO_SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
          WORKER_URL: https://everest-bank-engine.brevardbidderai.workers.dev
        run: |
          # Demo setup token published on https://www.simplefin.org/protocol.html -- not a
          # secret, reusable for testing per SimpleFIN's own docs.
          CODE=$(curl -s -o /tmp/claim_resp.json -w "%{http_code}" -X POST \
            "$WORKER_URL/simplefin/claim" \
            -H "X-CFO-Secret: $CFO_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"setup_token":"aHR0cHM6Ly9icmlkZ2Uuc2ltcGxlZmluLm9yZy9zaW1wbGVmaW4vY2xhaW0vZGVtbw=="}')
          echo "POST /simplefin/claim (demo token) -> HTTP $CODE"
          cat /tmp/claim_resp.json

      - name: SimpleFIN sync (only if claim succeeded)
        env:
          CFO_SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
          WORKER_URL: https://everest-bank-engine.brevardbidderai.workers.dev
        run: |
          CODE=$(curl -s -o /tmp/sync_resp.json -w "%{http_code}" -X POST \
            "$WORKER_URL/simplefin/sync" \
            -H "X-CFO-Secret: $CFO_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"entity_code":"everest_capital"}')
          echo "POST /simplefin/sync -> HTTP $CODE"
          cat /tmp/sync_resp.json

      - name: Summary
        run: |
          {
            echo "### Bank import + SimpleFIN live test (issue #19749)"
            echo '```'
            echo "-- import CSV fixture --"; cat /tmp/import_resp.json 2>/dev/null || echo "(no response)"
            echo "-- import OFX fixture --"; cat /tmp/import_ofx_resp.json 2>/dev/null || echo "(no response)"
            echo "-- import CSV fixture (2nd run, idempotency) --"; cat /tmp/import_resp2.json 2>/dev/null || echo "(no response)"
            echo "-- simplefin claim (demo token) --"; cat /tmp/claim_resp.json 2>/dev/null || echo "(no response)"
            echo "-- simplefin sync --"; cat /tmp/sync_resp.json 2>/dev/null || echo "(no response)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
