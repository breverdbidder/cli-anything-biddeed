name: Set MindStudio GitHub Actions Secret

on:
  workflow_dispatch:
    inputs:
      run_agents_after:
        description: "Run agent check after provisioning? (yes/no)"
        required: false
        default: "yes"

permissions:
  contents: read

jobs:
  provision-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install pynacl requests

      - name: Fetch mindstudio_api_key + everest_gh_pat from vault, provision GHA secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          python3 << 'PYEOF'
          import os, sys, json, base64
          import urllib.request, urllib.error
          from nacl import encoding, public
          import requests

          SUPABASE_ACCESS_TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          REPO = "breverdbidder/cli-anything-biddeed"
          SECRET_NAME = "MINDSTUDIO_API_KEY"
          PROJECT_ID = "mocerqjnksmhcjzxrewo"

          def vault_fetch(name):
              payload = json.dumps({"query": f"SELECT vault_secret('{name}') AS v;"}).encode()
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{PROJECT_ID}/database/query",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {SUPABASE_ACCESS_TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "cli-anything-biddeed-cc/1.0",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
              return (data[0].get("v") or "") if (isinstance(data, list) and data) else ""

          value = vault_fetch("mindstudio_api_key")
          gh_pat = vault_fetch("everest_gh_pat")

          if not value:
              print("::error::mindstudio_api_key not returned from vault")
              sys.exit(1)
          if not gh_pat:
              print("::error::everest_gh_pat not returned from vault")
              sys.exit(1)

          print(f"::add-mask::{value}", flush=True)
          print(f"::add-mask::{gh_pat}", flush=True)

          headers = {
              "Authorization": f"token {gh_pat}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          r = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=headers)
          if r.status_code != 200:
              print(f"::error::public-key fetch failed {r.status_code}: {r.text[:300]}")
              sys.exit(1)
          pk = r.json()

          k = public.PublicKey(pk["key"].encode("utf-8"), encoding.Base64Encoder())
          encrypted = base64.b64encode(public.SealedBox(k).encrypt(value.encode("utf-8"))).decode("utf-8")

          r2 = requests.put(
              f"https://api.github.com/repos/{REPO}/actions/secrets/{SECRET_NAME}",
              headers=headers,
              json={"encrypted_value": encrypted, "key_id": pk["key_id"]},
          )
          if r2.status_code in (201, 204):
              print(f"OK: {SECRET_NAME} provisioned on {REPO}")
          else:
              print(f"::error::FAIL({r2.status_code}): {r2.text[:300]}")
              sys.exit(1)
          PYEOF

      - name: Check MindStudio agent publish status
        if: ${{ github.event.inputs.run_agents_after == 'yes' }}
        env:
          MINDSTUDIO_API_KEY: ${{ secrets.MINDSTUDIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "[NOTE] Secret was just set - if this step fails with auth error, re-run workflow (GHA secret propagation ~30s)"
          python scripts/mindstudio_agent_check.py || true
