name: "RL Outcome Collector — Daily Post-Auction"
on:
  schedule:
    # Run daily at 8 AM EST (1 PM UTC) — 24h after Brevard auctions close
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Specific auction date (YYYY-MM-DD), or leave blank for yesterday"
        required: false
      all_pending:
        description: "Collect ALL pending outcomes"
        type: boolean
        default: false

jobs:
  collect:
    name: "Collect auction outcomes + score rewards"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Install dependencies"
        run: pip3 install requests -q

      - name: "Collect outcomes"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          elif [ "${{ inputs.all_pending }}" = "true" ]; then
            ARGS="--all-pending"
          fi
          python3 scripts/collect_outcomes.py $ARGS

      - name: "Apply dashboard views migration"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node migrations/run_migration.js migrations/20260407_trajectory_dashboard_views.sql || echo "Views may already exist"

      - name: "Query engine health"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Engine Health ==="
          curl -s "$SUPABASE_URL/rest/v1/trajectory_engine_health?select=*" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" | python3 -m json.tool 2>/dev/null || echo "View not yet created"

      - name: Summary
        if: always()
        run: |
          echo "## RL Outcome Collector — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ inputs.all_pending && 'all-pending' || inputs.date || 'yesterday' }}" >> $GITHUB_STEP_SUMMARY
