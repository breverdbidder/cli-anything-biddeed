name: "SHARD-13 Levy Daily Scraper (tax_deed + foreclosure check)"
# Daily scrape of Levy County:
#   - TD: TaxSmart portal (online.levyclerk.com/TaxSmartWeb) — SALE + SOLD cases
#   - FC: levyclerk.com foreclosure page — upcoming sales (currently none; monitors for future)
#   - H-freshness: updates last_seen_at for all levy rows
#
# WIRING MANDATE compliance: wired 2026-06-27, dispatch shard13-run1113

on:
  schedule:
    # Daily at 05:45 UTC (staggered from cairn fleet 05:30Z)
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      max_scan:
        description: 'Max TaxSmart IDs to scan from the top (default 300)'
        required: false
        default: '300'
      dry_run:
        description: 'Dry run — no DB writes (true/false)'
        required: false
        default: 'false'

jobs:
  # ── LEVY TD SCRAPER ───────────────────────────────────────────────────────
  levy-taxsmart:
    name: "Levy TaxSmart TD Scraper"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install dependencies"
        run: pip install httpx beautifulsoup4 -q

      - name: "Scrape levy TaxSmart + levyclerk FC check"
        run: |
          MAX_SCAN="${{ github.event.inputs.max_scan || '300' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FLAGS="--max-scan ${MAX_SCAN}"
          if [ "$DRY" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          python scripts/levy_taxsmart_scraper.py $FLAGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── H-FRESHNESS UPDATE ────────────────────────────────────────────────────
  h-freshness:
    name: "H: Update last_seen_at for levy"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: levy-taxsmart
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Stamp freshness via refresh_levy_freshness RPC"
        run: |
          set -euo pipefail
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_levy_freshness" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── J BID DECISIONS REFRESH ───────────────────────────────────────────────
  j-bid-decisions:
    name: "J: Refresh levy bid_decisions (Shapira Formula)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: levy-taxsmart
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Insert missing bid_decisions for levy via refresh_levy_bid_decisions RPC"
        run: |
          set -euo pipefail
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_levy_bid_decisions" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── EVALUATOR CHECK ───────────────────────────────────────────────────────
  evaluate:
    name: "DoD: Run pencil_dod_evaluate_county(levy)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [h-freshness, j-bid-decisions]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Run evaluator and report score"
        run: |
          set -euo pipefail
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_county":"levy"}' -o /tmp/levy_dod_result.json
          python3 -m json.tool /tmp/levy_dod_result.json
          python3 -c "
          import json

          with open('/tmp/levy_dod_result.json') as f:
              result = json.load(f)
          passed = sum(1 for v in result.values() if isinstance(v, dict) and v.get('pass'))
          total = sum(1 for v in result.values() if isinstance(v, dict))
          print(f'levy DoD: {passed}/{total}')
          if passed < 7:
              print('WARNING: levy DoD score below 7/10')
          "
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
