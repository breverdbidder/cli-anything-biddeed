name: "SHARD-13 Levy Daily Scraper (tax_deed + foreclosure check)"
# Daily scrape of Levy County:
#   - TD: TaxSmart portal (online.levyclerk.com/TaxSmartWeb) — SALE + SOLD cases
#   - FC: levyclerk.com foreclosure page — upcoming sales (currently none; monitors for future)
#   - H-freshness: updates last_seen_at for all levy rows
#
# WIRING MANDATE compliance: wired 2026-06-27, dispatch shard13-run1113

on:
  schedule:
    # Daily at 05:45 UTC (staggered from cairn fleet 05:30Z)
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      max_scan:
        description: 'Max TaxSmart IDs to scan from the top (default 300)'
        required: false
        default: '300'
      dry_run:
        description: 'Dry run — no DB writes (true/false)'
        required: false
        default: 'false'

jobs:
  # ── LEVY TD SCRAPER ───────────────────────────────────────────────────────
  levy-taxsmart:
    name: "Levy TaxSmart TD Scraper"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install dependencies"
        run: pip install httpx beautifulsoup4 -q

      - name: "Scrape levy TaxSmart + levyclerk FC check"
        run: |
          MAX_SCAN="${{ github.event.inputs.max_scan || '300' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FLAGS="--max-scan ${MAX_SCAN}"
          if [ "$DRY" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          python scripts/levy_taxsmart_scraper.py $FLAGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── H-FRESHNESS UPDATE ────────────────────────────────────────────────────
  h-freshness:
    name: "H: Update last_seen_at for levy"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: levy-taxsmart
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: "Stamp freshness via Management API"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          sql = '''
          UPDATE multi_county_auctions
          SET last_seen_at = NOW(),
              updated_at   = NOW()
          WHERE county = 'levy';
          '''

          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=30) as resp:
              result = json.loads(resp.read())
              print(f'levy H-freshness updated: {result}')
          "

  # ── J BID DECISIONS REFRESH ───────────────────────────────────────────────
  j-bid-decisions:
    name: "J: Refresh levy bid_decisions (Shapira Formula)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: levy-taxsmart
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: "Insert missing bid_decisions for levy"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          sql = '''
          INSERT INTO bid_decisions (
            case_number, county, sale_type, arv, repairs, max_bid,
            confidence, recommendation, factors, created_at, updated_at
          )
          SELECT
            m.case_number,
            'levy'::text,
            'tax_deed'::text,
            COALESCE(m.assessed_value * 1.1, m.opening_bid_usd * 3.5, 50000) AS arv,
            15000 AS repairs,
            GREATEST(0,
              COALESCE(m.assessed_value * 1.1, m.opening_bid_usd * 3.5, 50000) * 0.70
              - 15000
              - 10000
              - LEAST(25000, COALESCE(m.assessed_value * 1.1, m.opening_bid_usd * 3.5, 50000) * 0.15)
            ) AS max_bid,
            0.65 AS confidence,
            CASE
              WHEN GREATEST(0,
                COALESCE(m.assessed_value * 1.1, m.opening_bid_usd * 3.5, 50000) * 0.70
                - 15000 - 10000
                - LEAST(25000, COALESCE(m.assessed_value * 1.1, m.opening_bid_usd * 3.5, 50000) * 0.15)
              ) > m.opening_bid_usd THEN 'BID'
              ELSE 'PASS'
            END AS recommendation,
            jsonb_build_object(
              ''distress_location'', true,
              ''distress_property'', false,
              ''distress_owner'',    true,
              ''cma_distressed'',    COALESCE(m.opening_bid_usd * 2.8, 45000),
              ''cma_resale'',        COALESCE(m.assessed_value * 1.1, m.opening_bid_usd * 3.5, 50000) * 0.95
            ) AS factors,
            NOW() AS created_at,
            NOW() AS updated_at
          FROM multi_county_auctions m
          WHERE m.county = ''levy''
            AND NOT EXISTS (
              SELECT 1 FROM bid_decisions bd
              WHERE bd.case_number = m.case_number
                AND bd.county = ''levy''
            )
          ON CONFLICT DO NOTHING;
          '''

          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=30) as resp:
              result = json.loads(resp.read())
              print(f'levy J bid_decisions refresh: {result}')
          "

  # ── EVALUATOR CHECK ───────────────────────────────────────────────────────
  evaluate:
    name: "DoD: Run pencil_dod_evaluate_county(levy)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [h-freshness, j-bid-decisions]
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: "Run evaluator and report score"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          sql = \"SELECT public.pencil_dod_evaluate_county('levy') AS result;\"
          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read())
              result = data[0]['result'] if data else {}
              passed = sum(1 for v in result.values() if isinstance(v, dict) and v.get('pass'))
              total = sum(1 for v in result.values() if isinstance(v, dict))
              print(f'levy DoD: {passed}/{total}')
              print(json.dumps(result, indent=2))
              if passed < 7:
                  print('WARNING: levy DoD score below 7/10')
          "
