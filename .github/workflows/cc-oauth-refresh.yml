name: cc oauth refresh
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: refresh
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE" | sed -E 's/(sk-ant-[a-z0-9]+-[A-Za-z0-9]{4})[A-Za-z0-9_-]+/\1***/g'
          echo "BEFORE_EXP=$(python3 -c "import json;print(json.load(open('/root/.claude/.credentials.json'))['claudeAiOauth']['expiresAt'])")"
          echo "=== claude -p (triggers auto-refresh) ==="
          cd /root
          timeout 70 claude -p "reply with only the word OK" --output-format text 2>&1 | head -25
          echo "CLAUDE_EXIT=${PIPESTATUS[0]}"
          echo "=== AFTER ==="
          python3 - <<'PY'
          import json,datetime
          d=json.load(open('/root/.claude/.credentials.json'))['claudeAiOauth']
          e=int(d['expiresAt'])/1000.0
          now=datetime.datetime.now(datetime.timezone.utc).timestamp()
          print("AFTER_EXP_RAW",d['expiresAt'])
          print("AFTER_EXP_UTC",datetime.datetime.fromtimestamp(e,datetime.timezone.utc).isoformat())
          print("STILL_EXPIRED",e<now)
          print("AT_PREFIX",d['accessToken'][:16])
          print("RT_PREFIX",d['refreshToken'][:16])
          PY
          echo "END"
          REMOTE
