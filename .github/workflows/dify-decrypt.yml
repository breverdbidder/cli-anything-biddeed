name: Decrypt Dify Gemini credential
on:
  workflow_dispatch: {}
jobs:
  decrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SSH + locate + decrypt
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: providers table schema ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "\d providers" 2>&1 | head -25'

          echo
          echo "=== B: provider_credentials table schema ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "\d provider_credentials" 2>&1 | head -25'

          echo
          echo "=== C: gemini rows in providers table ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "SELECT id, tenant_id, provider_name, provider_type, is_valid, last_used FROM providers WHERE provider_name ILIKE '"'"'%gemini%'"'"' OR provider_name ILIKE '"'"'%google%'"'"';" 2>&1 | head -20'

          echo
          echo "=== D: provider_credentials rows for gemini ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "SELECT id, tenant_id, provider_name, length(encrypted_config) AS enc_len, created_at FROM provider_credentials WHERE provider_name ILIKE '"'"'%gemini%'"'"' OR provider_name ILIKE '"'"'%google%'"'"';" 2>&1 | head -20'

          echo
          echo "=== E: pull encrypted_config blob ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -tAc "SELECT encrypted_config FROM provider_credentials WHERE provider_name ILIKE '"'"'%gemini%'"'"' OR provider_name ILIKE '"'"'%google%'"'"' LIMIT 1;"' > /tmp/enc.txt
          echo "encrypted blob length: $(wc -c < /tmp/enc.txt)"
          head -c 200 /tmp/enc.txt
          echo

          echo
          echo "=== F: locate dify rsa decrypt module in api container ==="
          $SSH 'docker exec docker-api-1 sh -c "find /app -name \"rsa.py\" -o -name \"encrypter.py\" 2>/dev/null | head -10"'

          echo
          echo "=== G: peek at rsa.py to understand decrypt signature ==="
          $SSH 'docker exec docker-api-1 sh -c "find /app -name \"rsa.py\" 2>/dev/null | head -1 | xargs cat 2>/dev/null | head -80"'

          echo
          echo "=== H: peek at encrypter.py ==="
          $SSH 'docker exec docker-api-1 sh -c "find /app -name \"encrypter.py\" 2>/dev/null | head -1 | xargs cat 2>/dev/null | head -80"'

          echo "=== END ==="
