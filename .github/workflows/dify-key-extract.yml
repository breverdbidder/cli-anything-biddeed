name: Extract Dify's working Gemini key for cliproxy reuse
on:
  workflow_dispatch: {}
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SSH + dig out gemini key from dify
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e

          echo "=== A: dify postgres — find provider rows ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "\dt" 2>&1 | head -40'
          
          echo
          echo "=== B: list provider tables ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "SELECT table_name FROM information_schema.tables WHERE table_schema='\''public'\'' AND table_name LIKE '\''%provider%'\'';" 2>&1 | head -30'

          echo
          echo "=== C: provider configs (encrypted) ==="
          $SSH 'docker exec docker-db_postgres-1 psql -U postgres -d dify -c "SELECT provider_name, encrypted_config IS NOT NULL AS has_config, length(encrypted_config) AS len, created_at FROM provider WHERE provider_name LIKE '\''%gemini%'\'' OR provider_name LIKE '\''%google%'\'';" 2>&1 | head -20'

          echo
          echo "=== D: dify env vars in API container ==="
          $SSH 'docker exec docker-api-1 env 2>/dev/null | grep -iE "gemini|google.*key|api.*key" | sed -E "s/(=).*/\1<redacted>/"'

          echo
          echo "=== E: dify api container has the encryption key — try decrypting ==="
          $SSH 'docker exec docker-api-1 env 2>/dev/null | grep -iE "secret_key|encrypt" | sed -E "s/(=).*/\1<redacted_len_OK>/"'

          echo
          echo "=== F: check if Dify stores raw api keys anywhere accessible ==="
          $SSH 'docker exec docker-api-1 sh -c "find / -name \"*.json\" 2>/dev/null | xargs grep -l \"AIza\" 2>/dev/null | head -5" 2>&1 | head -5'

          echo
          echo "=== G: dify-plugin-daemon — see if it has the key ==="
          $SSH 'docker exec docker-plugin_daemon-1 env 2>/dev/null | grep -iE "gemini|google|api.*key" | sed -E "s/=.*/=<redacted>/" | head -10'

          echo "=== END ==="
