name: "Gold Standard SHARD-6 Daily (hillsborough/flagler/bay)"

# dispatch_id: 1f302343-9361-451a-8baa-7c22dd8844d8
# Issue: breverdbidder/cli-anything-biddeed#12796
# Counties: hillsborough, flagler, bay
# Run: loop run 5153 / session architect-20260719T160000
#
# WIRING MANDATE (2026-06-10): every scraper MUST be wired to a scheduler.
# This workflow runs the shard-6 executor daily at 09:00 UTC (between the
# 08:00 and 16:00 fleet waves) and maintains H <48h SLA for all 3 counties.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - hillsborough_i
          - flagler_i
          - bay_cd
          - bay_bf
          - bay_g
          - bay_i
          - verify

concurrency:
  group: gold-standard-shard6-hfb
  cancel-in-progress: false

jobs:
  # ── Job 1: Main executor (I, C/D, B/F, G fixes for all 3 counties) ──────────
  executor:
    name: "SHARD-6 Executor: hillsborough/flagler/bay"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Run SHARD-6 executor
        run: python3 scripts/gold_standard_shard6_hillsborough_flagler_bay.py

  # ── Job 2: Verify per-county metrics ─────────────────────────────────────────
  verify:
    name: "Verify SHARD-6 County Metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: executor
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Verify shard-6 metrics via pencil_dod_evaluate_county
        run: |
          python3 -c "
          import os, json, subprocess
          from datetime import datetime, timezone

          ACCESS_TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          MGMT_URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'

          def mgmt_query(sql):
              proc = subprocess.run(
                  ['curl', '-s', '-X', 'POST', MGMT_URL,
                   '-H', f'Authorization: Bearer {ACCESS_TOKEN}',
                   '-H', 'Content-Type: application/json',
                   '-d', json.dumps({'query': sql})],
                  capture_output=True, text=True, timeout=120
              )
              try:
                  return json.loads(proc.stdout)
              except Exception:
                  return []

          counties = ('hillsborough', 'flagler', 'bay')
          ts = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          print()
          print('### SQL VERIFICATION — SHARD-6 Gold Standard Metrics')
          print(f'Timestamp UTC: {ts}')
          print()

          all_results = {}
          all_pass = True
          for county in counties:
              result = mgmt_query(f\"SELECT * FROM public.pencil_dod_evaluate_county('{county}');\")
              raw = result[0].get('pencil_dod_evaluate_county', result[0]) if result else {}
              passes = 0
              fails = []
              for letter in 'ABCDEFGHIJ':
                  ld = raw.get(letter, {})
                  if isinstance(ld, dict) and ld.get('pass'):
                      passes += 1
                  elif isinstance(ld, dict):
                      fails.append(f'{letter}={ld.get(\"metric\",\"?\")}')
              total = raw.get('auctions_total', '?')
              status = f'{passes}/10'
              if fails:
                  status += f' FAIL=[{\" \".join(fails)}]'
                  all_pass = False
              all_results[county] = {'passes': passes, 'raw': raw}
              print(f'  {county}: {status} ({total} auctions)')
              for letter in 'ABCDEFGHIJ':
                  ld = raw.get(letter, {})
                  if isinstance(ld, dict):
                      mark = 'PASS' if ld.get('pass') else 'FAIL'
                      print(f'    {letter}: {mark} metric={ld.get(\"metric\",\"?\")} [{ld.get(\"detail\",\"\")}]')
              print()

          print()
          if all_pass:
              print('ALL 3 SHARD-6 COUNTIES: 10/10')
          else:
              print('Some counties have failing letters — check output above')
          " 2>&1 | tee verify_output.txt

          cat verify_output.txt >> "$GITHUB_STEP_SUMMARY"
