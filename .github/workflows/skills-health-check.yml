name: Skills Health Check

on:
  schedule:
    - cron: '0 14 * * 0'  # Sundays 9AM EST
  workflow_dispatch:

env:
  HETZNER_HOST: 87.99.129.125
  SKILLS_TARGET: /root/.claude/skills
  SKILLS_REPO: breverdbidder/claude-skills-library

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          token: ${{ secrets.GH_PAT }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check drift
        id: check
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"

          REMOTE=$($SSH_CMD "find ${{ env.SKILLS_TARGET }}/ -maxdepth 2 \( -name 'SKILL.md' -o -name 'skill.md' \) -exec dirname {} \; 2>/dev/null" | xargs -I{} basename {} | sort || echo "")
          REPO=$(ls -d skills/*/ 2>/dev/null | xargs -I{} basename {} | sort)

          MISSING=""
          for skill in $REPO; do
            echo "$REMOTE" | grep -q "^${skill}$" || MISSING="$MISSING $skill"
          done

          REMOTE_COUNT=$(echo "$REMOTE" | grep -c . || echo 0)
          REPO_COUNT=$(echo "$REPO" | grep -c . || echo 0)

          echo "remote_count=$REMOTE_COUNT" >> $GITHUB_OUTPUT
          echo "repo_count=$REPO_COUNT" >> $GITHUB_OUTPUT

          if [ -n "$MISSING" ]; then
            echo "⚠️ DRIFT:$MISSING"
            echo "drift=true" >> $GITHUB_OUTPUT
            echo "missing=$MISSING" >> $GITHUB_OUTPUT
          else
            echo "✅ All $REPO_COUNT skills synced"
            echo "drift=false" >> $GITHUB_OUTPUT
            echo "missing=" >> $GITHUB_OUTPUT
          fi

      - name: Auto-fix drift
        if: steps.check.outputs.drift == 'true'
        run: |
          SCP_CMD="scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -r"
          for skill in ${{ steps.check.outputs.missing }}; do
            echo "🔧 Deploying: $skill"
            $SCP_CMD skills/$skill root@${{ env.HETZNER_HOST }}:${{ env.SKILLS_TARGET }}/
          done

      - name: Telegram report
        if: always()
        run: |
          DRIFT="${{ steps.check.outputs.drift }}"
          MISSING="${{ steps.check.outputs.missing }}"
          REMOTE="${{ steps.check.outputs.remote_count }}"
          REPO="${{ steps.check.outputs.repo_count }}"
          
          if [ "$DRIFT" = "true" ]; then
            EMOJI="⚠️"
            STATUS="DRIFT FIXED"
          else
            EMOJI="✅"
            STATUS="ALL SYNCED"
          fi

          MSG="🧠 Skills Health $EMOJI $STATUS
Hetzner: $REMOTE skills | Repo: $REPO skills
Missing: ${MISSING:-none}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" > /dev/null 2>&1 || true
