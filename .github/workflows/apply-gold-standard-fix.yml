name: "Gold Standard Fix: Apply 5-Migration Bundle"
# Applies 5 migrations that fix 4 dead worker pipelines blocking Brevard Gold Standard at 3/10.
#
# Defect 1 (E-lane / BCPAO): 20260616_bcpao_drain_infra.sql + 20260617_missing_pipeline_objects.sql
# Defect 2 (E+upcoming / RealForeclose): 20260617_missing_pipeline_objects.sql
# Defect 3 (G-lane / Zoning): 20260616_zoning_upsert_constraint.sql
# Defect 4 (C/D/F-lanes / Parity): 20260616_parity_caseno_normalize.sql + 20260616_parity_fix_join_v2.sql
#
# AFTER RUNNING: manually dispatch these workflows to populate data:
#   1. scrape-brevard-realtdm   — populates pipeline.brevard_realtdm_cases (BCPAO worklist)
#   2. bcpao-bridge             — bridges account→parcel, drain fills MCA.parcel_id
#   3. brevard-realforeclose-drain — scrapes upcoming FC dates → realforeclose_aids → MCA
#   4. summit-zonewise-100      — fills zoning_assignments (now that UNIQUE index exists)
#
# Uses Supabase Management API (SUPABASE_ACCESS_TOKEN) — same pattern as
# bootstrap-agent-team-tables.yml (proven working).

on:
  workflow_dispatch:

jobs:
  apply-migrations:
    name: "Apply 5 Gold-Standard Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Migration 1: BCPAO drain infra (Defect 1 — E-lane)"
        run: |
          set -euo pipefail
          echo "=== 20260616_bcpao_drain_infra.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_bcpao_drain_infra.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 1 failed HTTP $HTTP"; exit 1; }
          echo "Migration 1 OK"

      - name: "Migration 2: Zoning unique index (Defect 3 — G-lane)"
        run: |
          set -euo pipefail
          echo "=== 20260616_zoning_upsert_constraint.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_zoning_upsert_constraint.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 2 failed HTTP $HTTP"; exit 1; }
          echo "Migration 2 OK"

      - name: "Migration 3: Parity case_number normalize (Defect 4 — C/D/F-lanes)"
        run: |
          set -euo pipefail
          echo "=== 20260616_parity_caseno_normalize.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_parity_caseno_normalize.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 3 failed HTTP $HTTP"; exit 1; }
          echo "Migration 3 OK"

      - name: "Migration 4: Parity join fix v2 (correct mca_id join + expanded status filter)"
        run: |
          set -euo pipefail
          echo "=== 20260616_parity_fix_join_v2.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_parity_fix_join_v2.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 4 failed HTTP $HTTP"; exit 1; }
          echo "Migration 4 OK"

      - name: "Migration 5: Pipeline objects + realforeclose_aids_to_mca_patch (Defect 1+2)"
        run: |
          set -euo pipefail
          echo "=== 20260617_missing_pipeline_objects.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260617_missing_pipeline_objects.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 5 failed HTTP $HTTP"; exit 1; }
          echo "Migration 5 OK"

      - name: "Verify all 4 defect fixes"
        if: always()
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local sql="$2"
            echo "=== $label ==="
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json || true
            echo; echo
          }

          rq "D1 bcpao_harvest_run rows" \
            "SELECT COUNT(*) AS harvest_run_rows FROM bcpao_harvest_run"

          rq "D1 pipeline tables" \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='pipeline' ORDER BY table_name"

          rq "D1+D2 key functions exist" \
            "SELECT proname FROM pg_proc WHERE proname IN ('bcpao_drain','upsert_brevard_realtdm_cases','upsert_brevard_account_parcel','realforeclose_aids_to_mca_patch') ORDER BY proname"

          rq "D1 v_brevard_unbridged_accounts view" \
            "SELECT COUNT(*) AS unbridged_accounts FROM v_brevard_unbridged_accounts"

          rq "D2 realforeclose_aids count" \
            "SELECT COUNT(*) AS total_aids, MAX(created_at) AS newest_aid FROM realforeclose_aids WHERE county_slug='brevard'"

          rq "D3 zoning unique index" \
            "SELECT indexname FROM pg_indexes WHERE tablename='zoning_assignments' AND indexname='idx_za_parcel_id_unique'"

          rq "D3 zoning_assignments count + newest write" \
            "SELECT COUNT(*) AS n, MAX(updated_at) AS newest_write FROM zoning_assignments"

          rq "D4 normalize_case_number smoke-test" \
            "SELECT normalize_case_number('05-2024-CA-001234-XXXX-XX') AS norm"

          rq "D4 parity status breakdown (brevard terminal)" \
            "SELECT COALESCE(parity_status,'null') AS parity_status, COUNT(*) AS n FROM multi_county_auctions WHERE county='brevard' AND auction_status IN ('completed','sold','redeemed','cancelled','canceled','no_sale','scheduled') GROUP BY parity_status ORDER BY n DESC"

          rq "D4 brevard parcel_id fill rate" \
            "SELECT COUNT(*) FILTER (WHERE parcel_id IS NOT NULL) AS filled, COUNT(*) AS total FROM multi_county_auctions WHERE county='brevard'"
