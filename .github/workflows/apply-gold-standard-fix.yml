name: "Gold Standard Fix: Apply 4-Defect Migrations"
# One-shot workflow to apply the 3 migrations that fix the 4 dead worker pipelines
# blocking Brevard Gold Standard at 3/10.
#
# Defect 1 (E-lane / BCPAO): 20260616_bcpao_drain_infra.sql
# Defect 3 (G-lane / Zoning): 20260616_zoning_upsert_constraint.sql
# Defect 4 (C/D/F-lanes / Parity): 20260616_parity_caseno_normalize.sql
#
# Uses Node pg with pooler (same pattern as flywheel-phase1-migrate.yml)

on:
  workflow_dispatch:

jobs:
  apply-migrations:
    name: "Apply 3 Gold-Standard Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install pg

      - name: "Apply all 3 migrations + verify"
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node - <<'JSEOF'
          const { Client } = require("pg");
          const fs = require("fs");

          const passwords = [
            process.env.SUPABASE_DB_PASSWORD,
            process.env.SUPABASE_KEY,
            process.env.SUPABASE_SERVICE_KEY,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
          ].filter(Boolean);

          const hosts = [
            "aws-0-us-west-2.pooler.supabase.com",
            "aws-0-us-east-1.pooler.supabase.com",
          ];
          const ports = [6543, 5432];
          const user = "postgres.mocerqjnksmhcjzxrewo";

          // Execute a single SQL statement, tolerate expected non-fatal errors
          async function execStmt(client, stmt) {
            const s = stmt.trim();
            if (!s) return;
            try {
              await client.query(s);
            } catch (err) {
              const msg = err.message;
              // Idempotent: already-exists errors are fine
              if (msg.includes("already exists") || msg.includes("duplicate key")) {
                console.log("  [skip — already exists]");
              } else {
                throw err;
              }
            }
          }

          // Split SQL into statements respecting $$ dollar-quote blocks
          function splitSQL(sql) {
            const stmts = [];
            let current = "";
            let inDollarQuote = false;
            let quoteTag = "";
            const lines = sql.split("\n");
            for (const line of lines) {
              const trimmed = line.trim();
              if (!inDollarQuote) {
                const m = trimmed.match(/\$([A-Za-z_]*)\$/);
                if (m) { inDollarQuote = true; quoteTag = m[0]; }
              } else {
                if (trimmed.includes(quoteTag)) { inDollarQuote = false; quoteTag = ""; }
              }
              current += line + "\n";
              if (!inDollarQuote && trimmed.endsWith(";")) {
                stmts.push(current.trim());
                current = "";
              }
            }
            if (current.trim()) stmts.push(current.trim());
            return stmts.filter(s => s && !s.startsWith("--"));
          }

          async function applyFile(client, path) {
            console.log(`\n=== ${path} ===`);
            const sql = fs.readFileSync(path, "utf8");
            const stmts = splitSQL(sql);
            console.log(`  ${stmts.length} statements`);
            for (const stmt of stmts) {
              const preview = stmt.substring(0, 80).replace(/\n/g, " ");
              process.stdout.write(`  > ${preview}...`);
              await execStmt(client, stmt);
              process.stdout.write(" OK\n");
            }
            console.log(`  DONE: ${path}`);
          }

          async function main() {
            let client, connected = false;

            outer:
            for (const pw of passwords) {
              for (const host of hosts) {
                for (const port of ports) {
                  client = new Client({
                    host, port, user,
                    password: pw,
                    database: "postgres",
                    ssl: { rejectUnauthorized: false },
                    connectionTimeoutMillis: 10000,
                    statement_timeout: 120000,
                  });
                  try {
                    await client.connect();
                    console.log(`Connected: ${host}:${port}`);
                    connected = true;
                    break outer;
                  } catch (err) {
                    const msg = err.message.substring(0, 80);
                    console.log(`FAIL ${host}:${port} => ${msg}`);
                    try { await client.end(); } catch(e) {}
                  }
                }
              }
            }

            if (!connected) {
              console.error("All connections failed — check SUPABASE_DB_PASSWORD secret");
              process.exit(1);
            }

            const MIGRATIONS = [
              "supabase/migrations/20260616_bcpao_drain_infra.sql",
              "supabase/migrations/20260616_zoning_upsert_constraint.sql",
              "supabase/migrations/20260616_parity_caseno_normalize.sql",
            ];

            for (const f of MIGRATIONS) {
              await applyFile(client, f);
            }

            // Verify
            console.log("\n=== VERIFICATION ===");
            const checks = [
              ["bcpao_harvest_run rows",  "SELECT COUNT(*)::text AS n FROM bcpao_harvest_run"],
              ["zoning_assignments rows", "SELECT COUNT(*)::text AS n FROM zoning_assignments"],
              ["idx_za_parcel_id_unique", "SELECT indexname FROM pg_indexes WHERE tablename='zoning_assignments' AND indexname='idx_za_parcel_id_unique'"],
              ["normalize_case_number",   "SELECT normalize_case_number('05-2024-CA-001234-XXXX') AS norm"],
              ["mca brevard parity matched", "SELECT COUNT(*)::text AS n FROM multi_county_auctions WHERE county='brevard' AND parity_status='matched_clean'"],
              ["mca brevard parcel_id filled", "SELECT COUNT(*)::text AS n FROM multi_county_auctions WHERE county='brevard' AND parcel_id IS NOT NULL"],
            ];

            for (const [label, sql] of checks) {
              try {
                const res = await client.query(sql);
                const val = Object.values(res.rows[0] || {})[0] || "(no row)";
                console.log(`  ${label}: ${val}`);
              } catch (err) {
                console.log(`  ${label}: ERROR — ${err.message.substring(0, 100)}`);
              }
            }

            // Gold standard scoreboard if available
            try {
              const res = await client.query(
                "SELECT metric, passes, value::text, threshold::text FROM gold_standard_scoreboard WHERE county='brevard' ORDER BY metric"
              );
              if (res.rows.length) {
                console.log("\n=== GOLD STANDARD SCOREBOARD ===");
                for (const r of res.rows) {
                  console.log(`  ${r.metric}: passes=${r.passes} value=${r.value} threshold=${r.threshold}`);
                }
              }
            } catch (err) {
              console.log("  gold_standard_scoreboard: not available");
            }

            await client.end();
            console.log("\nAll done.");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          JSEOF
