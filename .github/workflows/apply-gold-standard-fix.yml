name: "Gold Standard Fix: Apply 4-Defect Migrations"
# Applies 3 migrations that fix 4 dead worker pipelines blocking Brevard Gold Standard at 3/10.
#
# Defect 1 (E-lane / BCPAO): 20260616_bcpao_drain_infra.sql
# Defect 3 (G-lane / Zoning): 20260616_zoning_upsert_constraint.sql
# Defect 4 (C/D/F-lanes / Parity): 20260616_parity_caseno_normalize.sql
#
# Uses Supabase Management API (SUPABASE_ACCESS_TOKEN) — same pattern as
# bootstrap-agent-team-tables.yml (proven working).

on:
  workflow_dispatch:

jobs:
  apply-migrations:
    name: "Apply 3 Gold-Standard Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Migration 1: BCPAO drain infra (Defect 1 — E-lane)"
        run: |
          set -euo pipefail
          echo "=== 20260616_bcpao_drain_infra.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_bcpao_drain_infra.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 1 failed HTTP $HTTP"; exit 1; }
          echo "Migration 1 OK"

      - name: "Migration 2: Zoning unique index (Defect 3 — G-lane)"
        run: |
          set -euo pipefail
          echo "=== 20260616_zoning_upsert_constraint.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_zoning_upsert_constraint.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 2 failed HTTP $HTTP"; exit 1; }
          echo "Migration 2 OK"

      - name: "Migration 3: Parity case_number normalize (Defect 4 — C/D/F-lanes)"
        run: |
          set -euo pipefail
          echo "=== 20260616_parity_caseno_normalize.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260616_parity_caseno_normalize.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration 3 failed HTTP $HTTP"; exit 1; }
          echo "Migration 3 OK"

      - name: "Verify key tables and counts"
        run: |
          set -euo pipefail
          run_query() {
            python3 -c "import json; print(json.dumps({'query': '$1'}))" > /tmp/vq.json
            curl -sS \
              -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vq.json
          }

          echo "=== bcpao_harvest_run table ==="
          run_query "SELECT COUNT(*) AS harvest_run_rows FROM bcpao_harvest_run"
          echo
          echo "=== zoning unique index ==="
          run_query "SELECT indexname FROM pg_indexes WHERE tablename=\\'zoning_assignments\\' AND indexname=\\'idx_za_parcel_id_unique\\'"
          echo
          echo "=== normalize_case_number function ==="
          run_query "SELECT normalize_case_number(\\'05-2024-CA-001234-XXXX\\') AS norm"
          echo
          echo "=== parity status breakdown ==="
          run_query "SELECT parity_status, COUNT(*) AS n FROM multi_county_auctions WHERE county=\\'brevard\\' GROUP BY parity_status ORDER BY n DESC LIMIT 5"
          echo
          echo "=== zoning_assignments count ==="
          run_query "SELECT COUNT(*) AS n, MAX(updated_at) AS newest_write FROM zoning_assignments"
          echo
          echo "=== brevard parcel_id fill rate ==="
          run_query "SELECT COUNT(*) FILTER (WHERE parcel_id IS NOT NULL) AS filled, COUNT(*) AS total FROM multi_county_auctions WHERE county=\\'brevard\\'"
