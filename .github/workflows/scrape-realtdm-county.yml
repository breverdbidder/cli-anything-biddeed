name: scrape-realtdm-county
# Generalized RealTDM county scraper: holmes, walton, santa_rosa, st_johns.
# Public portal, no auth, polite 2s throttle.
# RPC: upsert_county_realtdm_mca(p_county, p)
on:
  workflow_dispatch:
    inputs:
      county_slug:
        description: "County slug (holmes, walton, santa_rosa, st_johns)"
        required: true
        default: "holmes"
      base_url:
        description: "RealTDM base URL (e.g. https://holmes.realtdm.com)"
        required: true
        default: "https://holmes.realtdm.com"
      date_start:
        description: "MM/DD/YYYY (default 45d back)"
        required: false
        default: ""
      date_stop:
        description: "MM/DD/YYYY (default 60d fwd)"
        required: false
        default: ""
  schedule:
    - cron: "0 9 * * 1,4"   # Mon+Thu 09:00Z for all matrix counties
concurrency:
  group: realtdm-county-${{ github.event.inputs.county_slug || 'scheduled' }}
  cancel-in-progress: false
jobs:
  sweep-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Sweep RealTDM county (dispatch)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY_SLUG: ${{ github.event.inputs.county_slug }}
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          python scripts/realtdm_county_sweep.py \
            "${{ github.event.inputs.date_start }}" \
            "${{ github.event.inputs.date_stop }}"

  sweep-scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - county_slug: holmes
            base_url: https://holmes.realtdm.com
          - county_slug: walton
            base_url: https://walton.realtdm.com
          - county_slug: santa_rosa
            base_url: https://santarosa.realtdm.com
          - county_slug: st_johns
            base_url: https://stjohns.realtdm.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Sweep RealTDM ${{ matrix.county_slug }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY_SLUG: ${{ matrix.county_slug }}
          BASE_URL: ${{ matrix.base_url }}
        run: python scripts/realtdm_county_sweep.py
