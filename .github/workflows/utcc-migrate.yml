name: UTCC Migration

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [utcc-migrate]

jobs:
  migrate:
    name: "Create UTCC Tables"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run migration via Supabase Management API
        run: |
          SQL=$(cat utcc/migrations/001_task_registry.sql)

          echo "=== Running UTCC migration ==="
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_MGMT_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}")

          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          echo "$BODY"

          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
            echo "✅ Migration succeeded"
          else
            echo "⚠️ Management API failed ($HTTP) — trying exec_sql RPC"
            curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/exec_sql" \
              -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"query\": $(echo "$SQL" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}" || echo "exec_sql not available"
          fi

      - name: Verify tables exist
        run: |
          for TABLE in task_registry task_logs; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/${TABLE}?limit=0" \
              -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $TABLE exists"
            else
              echo "❌ $TABLE not found (HTTP $STATUS)"
            fi
          done

      - name: Telegram
        if: always()
        run: |
          EMOJI=$( [ "${{ job.status }}" = "success" ] && echo "✅" || echo "❌" )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.BIDDEED_BOT_CHAT_ID }}\",\"text\":\"${EMOJI} UTCC Migration: ${{ job.status }}\"}" \
            >/dev/null 2>&1 || true
