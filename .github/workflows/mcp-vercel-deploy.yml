name: "MCP HTTP — Deploy to Vercel (biddeed.ai/api/mcp)"
# Deploys api/mcp.js serverless function to Vercel
# Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options: [production, preview]

jobs:
  deploy:
    name: "Deploy /api/mcp to Vercel"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install biddeed-mcp deps (required by api/mcp.js)
        working-directory: packages/biddeed-mcp
        run: npm install

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=${{ inputs.environment }} --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            DEPLOY_URL=$(vercel deploy --prod --token=$VERCEL_TOKEN 2>&1 | tail -1)
          else
            DEPLOY_URL=$(vercel deploy --token=$VERCEL_TOKEN 2>&1 | tail -1)
          fi
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $DEPLOY_URL"

      - name: Verify /api/mcp responds
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          if [ -z "$URL" ] || [[ "$URL" == *"Error"* ]]; then
            echo "::warning::Could not extract deploy URL"
            exit 0
          fi
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/mcp")
          echo "Health check GET /api/mcp → HTTP ${HTTP}"
          if [ "$HTTP" = "401" ] || [ "$HTTP" = "200" ]; then
            echo "✅ /api/mcp endpoint live (HTTP ${HTTP} = expected — 401 = auth required)"
          else
            echo "::warning::Unexpected HTTP ${HTTP} — manual check needed"
          fi

      - name: SHIP GATE verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "### SQL VERIFICATION"
          echo "\`\`\`"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          for SQL_CHECK in \
            "mcp_api_keys?active=eq.true|>= 1 active keys" \
            "billing_events?created_at=gte.$(date -u -d '-1 hour' '+%Y-%m-%dT%H:%M:%SZ')|>= 1 billing event in last hour" \
            "multi_county_auctions?source_platform=in.(propertyonion_orphan,po_api)|= 0 PO contamination"; do
            ENDPOINT="${SQL_CHECK%%|*}"
            DESC="${SQL_CHECK##*|}"
            COUNT=$(curl -sf "${SUPABASE_URL}/rest/v1/${ENDPOINT}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Prefer: count=exact" \
              -o /dev/null -w "%{header_json}" | python3 -c "
          import sys,json
          h=json.load(sys.stdin)
          cr=h.get('content-range',['0/0'])[0]
          print(cr.split('/')[-1] if '/' in cr else '?')
          " 2>/dev/null || echo "?")
            echo "  ${DESC}: ${COUNT}"
          done
          echo "\`\`\`"
