name: "MCP HTTP — Deploy to Vercel (biddeed.ai/api/mcp) — DEPRECATED"
# DEPRECATED (#20025, EXIT VERCEL A): mcp.biddeed.ai now deploys via
# .github/workflows/cloudflare-mcp-production.yml to the Cloudflare Worker
# biddeed-mcp-production. Push trigger removed so this can no longer
# auto-deploy to Vercel on every packages/biddeed-mcp change. Left as
# workflow_dispatch-only until #19812-C closes the Vercel account entirely.
#
# Deploys api/mcp.js serverless function to Vercel
# Requires: VERCEL_TOKEN secret.
# VERCEL_ORG_ID/VERCEL_PROJECT_ID were never set as secrets — previously this
# caused `vercel pull` to silently create a brand-new, wrong Vercel project
# instead of targeting the real "biddeed-mcp" project bound to mcp.biddeed.ai
# (root cause of the /report/pdf 404, found 2026-08-01). The "Resolve Vercel
# project" step below looks the project up by name via the Vercel API instead.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options: [production, preview]

concurrency:
  group: mcp-vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: "Deploy /api/mcp to Vercel"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install biddeed-mcp deps (required by api/mcp.js)
        working-directory: packages/biddeed-mcp
        run: npm install

      - name: Resolve Vercel project (name=biddeed-mcp)
        id: resolve
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          find_project() {
            local qs="$1"
            curl -s "https://api.vercel.com/v9/projects?search=biddeed-mcp&limit=20${qs}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" || echo '{"projects":[]}'
          }
          extract() {
            python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          ps = [p for p in d.get('projects', []) if p.get('name') == 'biddeed-mcp']
          print(ps[0]['id'] if ps else '')
          print(ps[0].get('accountId', '') if ps else '')
          "
          }

          RESP="$(find_project '')"
          read -r PROJECT_ID ORG_ID <<< "$(echo "$RESP" | extract | tr '\n' ' ')"

          if [ -z "$PROJECT_ID" ]; then
            echo "No 'biddeed-mcp' project in personal scope — trying known team scope"
            RESP="$(find_project '&teamId=team_hnNsngSBFPRmWAzVPkxTCMgu')"
            read -r PROJECT_ID ORG_ID <<< "$(echo "$RESP" | extract | tr '\n' ' ')"
            [ -n "$PROJECT_ID" ] && ORG_ID="team_hnNsngSBFPRmWAzVPkxTCMgu"
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Could not resolve a Vercel project named 'biddeed-mcp' in personal or team scope. Deploy would create a new project and silently miss mcp.biddeed.ai — aborting."
            exit 1
          fi

          echo "Resolved biddeed-mcp → project_id=$PROJECT_ID org_id=${ORG_ID:-<personal>}"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$PROJECT_ID" "$ORG_ID" > .vercel/project.json

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=${{ inputs.environment || 'production' }} --token=$VERCEL_TOKEN

      - name: Build locally (so we can smoke-test the exact deployed bundle)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ inputs.environment || 'production' }}" = "production" ]; then
            vercel build --prod --token=$VERCEL_TOKEN
          else
            vercel build --token=$VERCEL_TOKEN
          fi

      - name: Smoke-test the built function bundle (catch a crash before shipping it)
        run: |
          FUNC_DIR=".vercel/output/functions/api/mcp.func"
          if [ ! -d "$FUNC_DIR" ]; then
            echo "::error::$FUNC_DIR not found after vercel build — cannot smoke-test"
            exit 1
          fi
          cd "$FUNC_DIR"
          node -e "
          import('./api/mcp.js').then(async m => {
            const handler = m.default;
            const { EventEmitter } = await import('node:events');
            const req = Object.assign(new EventEmitter(), { method: 'GET', url: '/report/pdf', headers: { host: 'mcp.biddeed.ai' } });
            const res = {
              setHeader(){}, headersSent: false,
              writeHead(code, headers) { this.statusCode = code; console.log('[smoke] writeHead', code, headers); },
              end(body) { console.log('[smoke] end', body ? String(body).slice(0, 200) : body); },
            };
            await handler(req, res);
            if (res.statusCode !== 401) {
              console.error('[smoke] expected 401 (no auth header), got', res.statusCode);
              process.exit(1);
            }
            console.log('[smoke] OK — bundle loads and /report/pdf returns 401 with no key, as expected');
          }).catch(e => { console.error('[smoke] IMPORT/HANDLER CRASH:', e); process.exit(1); });
          "

      - name: Deploy to Vercel (prebuilt — same artifact just smoke-tested)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ inputs.environment || 'production' }}" = "production" ]; then
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tee /tmp/vercel-deploy.log
          else
            vercel deploy --prebuilt --token=$VERCEL_TOKEN 2>&1 | tee /tmp/vercel-deploy.log
          fi
          DEPLOY_URL=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.vercel\.app' /tmp/vercel-deploy.log | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $DEPLOY_URL"

      - name: Verify /api/mcp responds
        id: verify_mcp
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          if [ -z "$URL" ]; then
            echo "::warning::Could not extract deploy URL from vercel CLI output"
            exit 0
          fi
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/mcp")
          echo "Health check GET /api/mcp → HTTP ${HTTP}"
          if [ "$HTTP" = "401" ] || [ "$HTTP" = "200" ]; then
            echo "✅ /api/mcp endpoint live (HTTP ${HTTP} = expected — 401 = auth required)"
          elif [ "$HTTP" = "500" ]; then
            echo "http_500=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HTTP 500 — will pull runtime logs in next step"
          else
            echo "::warning::Unexpected HTTP ${HTTP} — manual check needed"
          fi

      - name: Verify /report/pdf is wired on production domain
        id: verify_pdf
        if: (inputs.environment || 'production') == 'production'
        run: |
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://mcp.biddeed.ai/report/pdf")
          echo "GET /report/pdf (no auth) on mcp.biddeed.ai → HTTP ${HTTP}"
          if [ "$HTTP" = "401" ]; then
            echo "✅ /report/pdf route live (401 = auth required, as expected with no key)"
          elif [ "$HTTP" = "404" ]; then
            echo "::error::/report/pdf still 404s on mcp.biddeed.ai after deploy — production alias may not have updated"
            exit 1
          elif [ "$HTTP" = "500" ]; then
            echo "http_500=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HTTP 500 — will pull runtime logs in next step"
          else
            echo "::warning::Unexpected HTTP ${HTTP} for /report/pdf — manual check needed"
          fi

      - name: Fetch Vercel runtime logs (only if 500 above)
        if: steps.verify_pdf.outputs.http_500 == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Build logs for latest deploy ==="
          timeout 20 vercel inspect "${{ steps.deploy.outputs.deploy_url }}" --token=$VERCEL_TOKEN --logs 2>&1 || true
          echo "=== Live-tail runtime logs while generating a fresh 500 ==="
          vercel logs mcp.biddeed.ai --token=$VERCEL_TOKEN --json > /tmp/vercel-runtime.log 2>&1 &
          TAIL_PID=$!
          sleep 4
          curl -s -o /dev/null "https://mcp.biddeed.ai/report/pdf"
          sleep 8
          kill $TAIL_PID 2>/dev/null || true
          wait $TAIL_PID 2>/dev/null || true
          cat /tmp/vercel-runtime.log

      - name: SHIP GATE verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "### SQL VERIFICATION"
          echo "\`\`\`"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          for SQL_CHECK in \
            "mcp_api_keys?active=eq.true|>= 1 active keys" \
            "billing_events?created_at=gte.$(date -u -d '-1 hour' '+%Y-%m-%dT%H:%M:%SZ')|>= 1 billing event in last hour" \
            "multi_county_auctions?source_platform=in.(propertyonion_orphan,po_api)|= 0 PO contamination"; do
            ENDPOINT="${SQL_CHECK%%|*}"
            DESC="${SQL_CHECK##*|}"
            COUNT=$(curl -sf "${SUPABASE_URL}/rest/v1/${ENDPOINT}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Prefer: count=exact" \
              -o /dev/null -w "%{header_json}" | python3 -c "
          import sys,json
          h=json.load(sys.stdin)
          cr=h.get('content-range',['0/0'])[0]
          print(cr.split('/')[-1] if '/' in cr else '?')
          " 2>/dev/null || echo "?")
            echo "  ${DESC}: ${COUNT}"
          done
          echo "\`\`\`"
