name: "Summit: DesignWise Squad Sprint 1 — Foundation"
on:
  workflow_dispatch: {}

jobs:
  sprint1:
    name: "Scaffold + BrandGuard + Commander + Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute Sprint 1 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== [1/6] Setup claude user ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Update Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null

            echo "=== [3/6] Setup auth token ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Clone/Pull Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed
            echo "Repo ready at $(pwd)"

            echo "=== [5/6] Run Claude Code ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'You are executing Sprint 1 of the DesignWise Squad build.

              CRITICAL: Read CLAUDE.md first. Then read docs/plans/DESIGNWISE-SPEC.md and docs/plans/DESIGNWISE-PLAN.md.

              Execute Sprint 1 tasks S1.1 through S1.4 and S1.6. Skip S1.5 (critical bug fixes — that is a separate session on zonewise-web).

              TASK LIST:

              S1.1 — SCAFFOLD DESIGNWISE HARNESS
              - Fork directory structure from zonewise/agent-harness/ pattern
              - Create designwise/agent-harness/cli_anything/designwise/ with all 13 agent stubs
              - Create designwise_cli.py with 13 subcommands: commander, stitch, brandguard, code, deploy, qa, analytics, support, iterate, seo, a11y, competitor, content
              - Create shared utils: supabase_client.py, brand_tokens.py, vercel_api.py
              - Create setup.py with entry point cli-anything-designwise
              - Write 15 unit tests (CLI invocation, JSON output, config loading)

              S1.2 — BRANDGUARD AGENT (most important agent)
              - Implement brandguard_agent.py with Playwright scanner
              - Parse DESIGN.md from zonewise-web repo (fetch via GitHub API)
              - Color validator: check all hex colors against allowed palette
              - Font validator: check all font-family declarations
              - Contrast checker: WCAG AA ratios (4.5:1 body, 3:1 large text)
              - Link checker: crawl all internal hrefs, flag 404s
              - Nav checker: verify consistent navbar on all routes
              - Min font size: flag anything below 11px
              - CLI output: JSON report with violations array
              - Supabase: insert to brand_violations table
              - Write 20 unit tests

              S1.3 — COMMANDER AGENT
              - Implement commander.py as LangGraph state machine
              - States: RECEIVE → CLASSIFY → DISPATCH → MONITOR → COMPLETE
              - Task classification logic for: new_screen, fix_bug, brand_audit, deploy, a_b_test, seo_audit, etc
              - Agent dispatch routing based on classification
              - Supabase: design_tasks table CRUD
              - Telegram notification on task completion
              - Write 10 tests

              S1.4 — SUPABASE SCHEMA (10 tables)
              - Execute SQL from SPEC section 4 via curl to Supabase REST API
              - DO NOT use supabase CLI. Use curl with service key header:
                curl -X POST SUPABASE_URL/rest/v1/rpc -H "apikey: SERVICE_KEY" -H "Authorization: Bearer SERVICE_KEY"
              - Or write a Node.js script using fetch to execute SQL
              - Create all 10 tables: design_tasks, brand_violations, visual_baselines, page_analytics, conversion_funnel, support_tickets, ab_tests, deploy_log, competitor_snapshots, seo_audits
              - Create RLS policies
              - Verify tables exist by querying

              S1.6 — EVAL FRAMEWORK
              - Create designwise/eval/eval.json with 25 assertions from SPEC section 5
              - Create eval runner following existing autoloop pattern

              GIT CONFIG:
              git config user.email ci@biddeed.ai
              git config user.name BidDeed-CI
              git remote set-url origin https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git

              PUSH frequently. Commit after each major task (S1.1, S1.2, S1.3, S1.4, S1.6).

              When done, send Telegram notification:
              curl -s -X POST https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=\${TELEGRAM_CHAT_ID} -d text=\"✅ DesignWise Sprint 1 COMPLETE. Scaffold+BrandGuard+Commander+Schema+Eval deployed to cli-anything-biddeed/designwise/\"
              '
            "

            echo "=== [6/6] Session complete ==="
