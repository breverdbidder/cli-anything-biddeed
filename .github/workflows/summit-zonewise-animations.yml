name: Summit — ZoneWise Animation + Mapbox

on:
  workflow_dispatch:
  repository_dispatch:
    types: [summit-zonewise-animations]

env:
  HETZNER_HOST: 87.99.129.125
  REPO: breverdbidder/zonewise-desktop

jobs:
  execute-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Telegram — Mission start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚀 SUMMIT #3: ZoneWise Animation + Mapbox
          Fix: non-root user for Claude Code
          Starting..." > /dev/null 2>&1 || true

      - name: Execute Claude Code on Hetzner
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.HETZNER_HOST }}"

          $SSH_CMD << 'REMOTE_SCRIPT'
          set -euo pipefail
          export PATH="/root/.npm-global/bin:/root/.local/bin:/usr/local/bin:$PATH"

          echo "=== 1. Create non-root user ==="
          id claude 2>/dev/null || useradd -m -s /bin/bash claude
          # Give claude access to npm global and node
          cp -r /root/.npm-global /home/claude/.npm-global 2>/dev/null || true
          chown -R claude:claude /home/claude

          echo "=== 2. Setup workspace as claude user ==="
          WORK_DIR="/home/claude/summit-zonewise"
          rm -rf "$WORK_DIR"
          git clone "https://${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git" "$WORK_DIR"
          chown -R claude:claude "$WORK_DIR"

          echo "=== 3. Install deps ==="
          su - claude -c "cd $WORK_DIR/apps/viewer && npm install 2>/dev/null; npm install framer-motion --save 2>/dev/null || true"

          echo "=== 4. Configure git for claude user ==="
          su - claude -c "git config --global user.email 'ariel@everestcapitalusa.com' && git config --global user.name 'Ariel Shapira'"

          echo "=== 5. Copy Claude Code config ==="
          # Ensure claude user has Claude Code access
          mkdir -p /home/claude/.claude
          cp -r /root/.claude/* /home/claude/.claude/ 2>/dev/null || true
          chown -R claude:claude /home/claude/.claude

          # Ensure node/npm/claude are in PATH
          CLAUDE_BIN=$(which claude)
          NODE_BIN=$(dirname $(which node))

          echo "=== 6. Launch Claude Code as non-root ==="
          su - claude -c "
            export PATH='$NODE_BIN:/home/claude/.npm-global/bin:\$PATH'
            export HOME=/home/claude
            cd $WORK_DIR

            claude --version

            timeout 6000 claude --dangerously-skip-permissions --model claude-sonnet-4-20250514 -p '
            Read docs/ANIMATION_MAPBOX_MISSION.md and execute ALL 4 phases.

            RULES:
            - Vite SPA in apps/viewer/ (NOT Next.js)
            - Custom code in zonewise/ directory
            - House brand: Navy #1E3A5F, Orange #F59E0B, Slate-950 #020617
            - Git push after each phase
            - Git remote: https://${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git
            - Vercel auto-deploys from main

            Phase 1: framer-motion animation system. START NOW.
            ' 2>&1 | tail -300
          "

          echo "=== 7. Verify + push ==="
          su - claude -c "
            cd $WORK_DIR
            cd apps/viewer && npx vite build 2>&1 | tail -10
            cd $WORK_DIR
            git add -A
            git diff --cached --quiet || git commit -m 'feat: animation + mapbox heatmap (summit)' && git push origin main || true
          "
          echo "=== DONE ==="
          REMOTE_SCRIPT

      - name: Verify
        if: always()
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"
          COMMITS=$($SSH_CMD "cd /home/claude/summit-zonewise && git log --oneline -5 2>/dev/null" || echo "N/A")
          ANIM=$($SSH_CMD "find /home/claude/summit-zonewise/zonewise/components/animations -name '*.tsx' 2>/dev/null | wc -l" || echo "0")
          MAP=$($SSH_CMD "test -f /home/claude/summit-zonewise/zonewise/components/web/MapboxHeatmap.tsx && echo YES || echo NO" || echo "?")
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "ANIM=$ANIM" >> $GITHUB_ENV
          echo "MAP=$MAP" >> $GITHUB_ENV

      - name: Telegram — Done
        if: always()
        run: |
          STATUS="${{ job.status }}"
          E=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$E SUMMIT: $STATUS
          Animations: ${{ env.ANIM || '?' }}
          MapboxHeatmap: ${{ env.MAP || '?' }}
          ${{ env.COMMITS || 'N/A' }}" > /dev/null 2>&1 || true
