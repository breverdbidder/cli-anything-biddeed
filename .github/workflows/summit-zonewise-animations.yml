name: Summit — ZoneWise Animation + Mapbox

on:
  workflow_dispatch:
  repository_dispatch:
    types: [summit-zonewise-animations]

env:
  HETZNER_HOST: 87.99.129.125
  REPO: breverdbidder/zonewise-desktop

jobs:
  execute-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Telegram — Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚀 SUMMIT #5: ANTHROPIC_API_KEY auth bypass" > /dev/null 2>&1 || true

      - name: Execute on Hetzner
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=20 root@${{ env.HETZNER_HOST }}"

          $SSH_CMD "
          set -euo pipefail
          export PATH='/root/.npm-global/bin:/root/.local/bin:/usr/local/bin:\$PATH'

          echo '=== 1. Setup user ==='
          id claude 2>/dev/null || useradd -m -s /bin/bash claude
          chown -R claude:claude /home/claude

          echo '=== 2. Clone ==='
          rm -rf /home/claude/summit-zonewise
          git clone 'https://${GH_PAT}@github.com/${{ env.REPO }}.git' /home/claude/summit-zonewise
          chown -R claude:claude /home/claude/summit-zonewise

          echo '=== 3. Deps ==='
          su - claude -c 'cd /home/claude/summit-zonewise/apps/viewer && npm install 2>/dev/null; npm install framer-motion --save 2>/dev/null || true'

          echo '=== 4. Git config ==='
          su - claude -c \"git config --global user.email 'ariel@everestcapitalusa.com' && git config --global user.name 'Ariel Shapira'\"

          NODE_BIN=\$(dirname \$(which node))

          echo '=== 5. Launch Claude Code with API key ==='
          su - claude -c \"
            export PATH='\$NODE_BIN:/home/claude/.npm-global/bin:\\\$PATH'
            export HOME=/home/claude
            export ANTHROPIC_API_KEY='${ANTHROPIC_KEY}'
            cd /home/claude/summit-zonewise

            claude --version
            echo 'Auth method: ANTHROPIC_API_KEY'

            timeout 6000 claude --dangerously-skip-permissions --model claude-sonnet-4-20250514 -p 'Read docs/ANIMATION_MAPBOX_MISSION.md and execute ALL 4 phases. Vite SPA in apps/viewer/. Custom code in zonewise/. Brand: Navy #1E3A5F, Orange #F59E0B, Slate-950 #020617. Git push after each phase to https://${GH_PAT}@github.com/${{ env.REPO }}.git. Phase 1 first: framer-motion animations. START.' 2>&1 | tail -300
          \"

          echo '=== 6. Final push ==='
          su - claude -c '
            cd /home/claude/summit-zonewise && git add -A
            git diff --cached --quiet || git commit -m \"feat: animation + mapbox (summit)\" && git push origin main || true
          '
          echo '=== DONE ==='
          "

      - name: Verify
        if: always()
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"
          COMMITS=$($SSH_CMD "cd /home/claude/summit-zonewise && git log --oneline -5 2>/dev/null" || echo "N/A")
          ANIM=$($SSH_CMD "find /home/claude/summit-zonewise/zonewise/components/animations -name '*.tsx' 2>/dev/null | wc -l" || echo "0")
          MAP=$($SSH_CMD "test -f /home/claude/summit-zonewise/zonewise/components/web/MapboxHeatmap.tsx && echo YES || echo NO" || echo "?")
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "ANIM=$ANIM" >> $GITHUB_ENV
          echo "MAP=$MAP" >> $GITHUB_ENV

      - name: Telegram — Done
        if: always()
        run: |
          STATUS="${{ job.status }}"
          E=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$E SUMMIT #5: $STATUS
          Animations: ${{ env.ANIM || '?' }}
          Mapbox: ${{ env.MAP || '?' }}
          ${{ env.COMMITS || 'N/A' }}" > /dev/null 2>&1 || true
