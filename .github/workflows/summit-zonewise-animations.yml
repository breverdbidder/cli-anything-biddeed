name: Summit — ZoneWise Animation + Mapbox

on:
  workflow_dispatch:
  repository_dispatch:
    types: [summit-zonewise-animations]

env:
  HETZNER_HOST: 87.99.129.125
  REPO: breverdbidder/zonewise-desktop

jobs:
  execute-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Telegram — Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚀 SUMMIT #6: env var passthrough fix" > /dev/null 2>&1 || true

      - name: Write mission script
        run: |
          cat > /tmp/mission.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          GH_PAT="$1"
          ANTHROPIC_KEY="$2"
          REPO="$3"

          export PATH="/root/.npm-global/bin:/root/.local/bin:/usr/local/bin:$PATH"

          echo "=== 1. Setup user ==="
          id claude 2>/dev/null || useradd -m -s /bin/bash claude
          chown -R claude:claude /home/claude 2>/dev/null || true

          echo "=== 2. Clone ==="
          rm -rf /home/claude/summit-zonewise
          git clone "https://${GH_PAT}@github.com/${REPO}.git" /home/claude/summit-zonewise
          chown -R claude:claude /home/claude/summit-zonewise

          echo "=== 3. Deps ==="
          su - claude -c "cd /home/claude/summit-zonewise/apps/viewer && npm install 2>/dev/null; npm install framer-motion --save 2>/dev/null || true"

          echo "=== 4. Git config ==="
          su - claude -c "git config --global user.email 'ariel@everestcapitalusa.com' && git config --global user.name 'Ariel Shapira'"

          NODE_BIN=$(dirname $(which node))

          echo "=== 5. Launch Claude Code ==="
          su - claude -c "export PATH='${NODE_BIN}:/home/claude/.npm-global/bin:\$PATH' && export HOME=/home/claude && export ANTHROPIC_API_KEY='${ANTHROPIC_KEY}' && cd /home/claude/summit-zonewise && claude --version && timeout 6000 claude --dangerously-skip-permissions --model claude-sonnet-4-20250514 -p 'Read docs/ANIMATION_MAPBOX_MISSION.md and execute ALL 4 phases. Vite SPA in apps/viewer/. Custom code in zonewise/. Brand: Navy #1E3A5F, Orange #F59E0B, Slate-950 #020617. Git push after each phase using: git remote set-url origin https://${GH_PAT}@github.com/${REPO}.git then git push. Phase 1 first: framer-motion animations. START.' 2>&1 | tail -300"

          echo "=== 6. Final push ==="
          su - claude -c "cd /home/claude/summit-zonewise && git remote set-url origin https://${GH_PAT}@github.com/${REPO}.git && git add -A && git diff --cached --quiet || (git commit -m 'feat: animation + mapbox (summit)' && git push origin main) || true"
          echo "=== DONE ==="
          SCRIPT
          chmod +x /tmp/mission.sh

      - name: Execute on Hetzner
        run: |
          # SCP the script, then execute with args
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no /tmp/mission.sh root@${{ env.HETZNER_HOST }}:/tmp/mission.sh
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=20 root@${{ env.HETZNER_HOST }} \
            "bash /tmp/mission.sh '${{ secrets.GH_PAT }}' '${{ secrets.ANTHROPIC_API_KEY }}' '${{ env.REPO }}'"

      - name: Verify
        if: always()
        run: |
          SSH_CMD="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"
          COMMITS=$($SSH_CMD "cd /home/claude/summit-zonewise && git log --oneline -5 2>/dev/null" || echo "N/A")
          ANIM=$($SSH_CMD "find /home/claude/summit-zonewise/zonewise/components/animations -name '*.tsx' 2>/dev/null | wc -l" || echo "0")
          MAP=$($SSH_CMD "test -f /home/claude/summit-zonewise/zonewise/components/web/MapboxHeatmap.tsx && echo YES || echo NO" || echo "?")
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "ANIM=$ANIM" >> $GITHUB_ENV
          echo "MAP=$MAP" >> $GITHUB_ENV

      - name: Telegram — Done
        if: always()
        run: |
          STATUS="${{ job.status }}"
          E=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$E SUMMIT #6: $STATUS
          Animations: ${{ env.ANIM || '?' }}
          Mapbox: ${{ env.MAP || '?' }}
          ${{ env.COMMITS || 'N/A' }}" > /dev/null 2>&1 || true
