name: Set Worker Secret From Vault

# Reusable, idempotent (same pattern as set-resend-worker-secret.yml):
# pulls a named secret from the Supabase vault and writes it as a secret on
# the production Cloudflare Worker. The value never leaves the runner and is
# masked in logs. First use (2026-09-04, approved by Ariel in chat): bind
# supabase_service_role_key as SUPABASE_SERVICE_ROLE_KEY so #19829 P1 chat
# persistence (uploads / recents / search) can turn on.

on:
  workflow_dispatch:
    inputs:
      vault_name:
        description: name in vault.decrypted_secrets
        required: true
        default: supabase_service_role_key
      worker_secret_name:
        description: Worker secret name to write
        required: true
        default: SUPABASE_SERVICE_ROLE_KEY

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ${{ inputs.vault_name }} from vault and set as Worker secret ${{ inputs.worker_secret_name }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VAULT_NAME: ${{ inputs.vault_name }}
          SECRET_NAME: ${{ inputs.worker_secret_name }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg q "SELECT vault_secret('$VAULT_NAME') AS v;" '{query: $q}')
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: cli-anything-biddeed-cc/1.0" \
            -d "$payload")
          value=$(echo "$resp" | jq -r '.[0].v // empty')
          if [ -z "$value" ]; then
            echo "::error::$VAULT_NAME not returned from vault_secret() — check vault contents"
            exit 1
          fi
          echo "::add-mask::$value"
          echo "$value" | npx wrangler secret put "$SECRET_NAME"
          echo "bound $SECRET_NAME on the production Worker"
