name: Export file to Supabase Storage

on:
  workflow_dispatch:
    inputs:
      export_id:
        description: 'public._csv_exports.id to upload'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPORT_ID: ${{ inputs.export_id }}
        run: |
          python3 - <<'PYEOF'
          import os, httpx, sys

          SB  = os.environ['SB_URL'].rstrip('/')
          KEY = os.environ['SB_KEY']
          XID = os.environ['EXPORT_ID']
          H_REST = {'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}
          H_STORAGE = {'Authorization': f'Bearer {KEY}'}

          r = httpx.get(f'{SB}/rest/v1/_csv_exports',
              params={'id': f'eq.{XID}', 'select': 'filename,csv_content,csv_bytes'},
              headers=H_REST, timeout=60.0)
          if r.status_code != 200 or not r.json():
              print(f'ERROR fetch: {r.status_code} {r.text[:300]}'); sys.exit(1)
          row = r.json()[0]
          fname = row['filename']
          content_text = row['csv_content']
          print(f'fetched: {fname} ({row.get("csv_bytes", len(content_text))} bytes)')

          # Detect content-type from extension
          ext = fname.rsplit('.', 1)[-1].lower() if '.' in fname else ''
          ctype_map = {
            'csv': 'text/csv; charset=utf-8',
            'html': 'text/html; charset=utf-8',
            'htm':  'text/html; charset=utf-8',
            'json': 'application/json',
            'txt':  'text/plain; charset=utf-8',
            'xml':  'application/xml',
            'md':   'text/markdown; charset=utf-8'
          }
          ctype = ctype_map.get(ext, 'text/plain; charset=utf-8')
          print(f'content-type: {ctype}')

          # Ensure bucket exists (idempotent)
          b = httpx.post(f'{SB}/storage/v1/bucket',
              headers={**H_STORAGE, 'Content-Type':'application/json'},
              json={'id':'exports','name':'exports','public':True,'file_size_limit':52428800},
              timeout=30.0)
          print(f'bucket: {b.status_code}')

          # Upload via POST with upsert
          up = httpx.post(f'{SB}/storage/v1/object/exports/{fname}',
              headers={**H_STORAGE, 'Content-Type': ctype, 'x-upsert':'true'},
              content=content_text.encode('utf-8'), timeout=180.0)
          print(f'upload POST: {up.status_code} {up.text[:300]}')
          if up.status_code not in (200, 201):
              up = httpx.put(f'{SB}/storage/v1/object/exports/{fname}',
                  headers={**H_STORAGE, 'Content-Type': ctype, 'x-upsert':'true'},
                  content=content_text.encode('utf-8'), timeout=180.0)
              print(f'upload PUT: {up.status_code} {up.text[:300]}')
              if up.status_code not in (200, 201): sys.exit(2)

          public_url = f'{SB}/storage/v1/object/public/exports/{fname}'
          httpx.patch(f'{SB}/rest/v1/_csv_exports',
              params={'id': f'eq.{XID}'}, headers=H_REST,
              json={'uploaded_url': public_url}, timeout=30.0)
          print(f'\nPUBLIC_URL: {public_url}\n')
          PYEOF
