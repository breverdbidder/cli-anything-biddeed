name: Claude Login + Explorer V2
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: SSH Login and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GH_PAT
          script: |
            echo "=== Claude Login + Explorer V2 ==="
            LOGGED=$(claude auth status 2>&1 | grep '"loggedIn": true' || echo "")
            if [ -n "$LOGGED" ]; then
              echo "Already logged in"
            else
              echo "Starting login..."
              claude auth login 2>&1 | tee /tmp/login.log &
              PID=$!
              for i in $(seq 1 30); do
                sleep 1
                URL=$(grep -o 'https://claude.ai/oauth[^ ]*' /tmp/login.log 2>/dev/null | head -1 || true)
                [ -n "$URL" ] && break
              done
              if [ -n "$URL" ]; then
                echo "URL: $URL"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=🔑 TAP NOW: ${URL}" -d "disable_web_page_preview=true"
                echo "Sent to Telegram. Waiting 5 min..."
                for i in $(seq 1 60); do
                  sleep 5
                  claude auth status 2>&1 | grep -q '"loggedIn": true' && echo "LOGGED IN!" && break
                done
                kill $PID 2>/dev/null || true
              else
                echo "No URL captured"
                cat /tmp/login.log 2>/dev/null
                exit 1
              fi
            fi
            claude auth status 2>&1 | grep -q '"loggedIn": true' || { echo "Login failed"; exit 1; }
            echo "=== Deploying Explorer V2 ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            cp -r /root/.claude /home/claude/.claude 2>/dev/null || true
            cp /root/.claude.json /home/claude/.claude.json 2>/dev/null || true
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            su -s /bin/bash claude -c "export HOME=/home/claude && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3 && claude --version"
            WORK="/tmp/zw-$(date +%s)"
            mkdir -p "$WORK" && cd "$WORK"
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            chown -R claude:claude "$WORK"
            cat > "$WORK/go.sh" << 'SCRIPT'
            #!/bin/bash
            set -e
            export HOME=/home/claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            cd WORKDIR/zonewise-web
            npm ci 2>/dev/null || npm install
            claude -p "Implement Explorer V2. READ docs/plans/EXPLORER_V2_SPEC.md then CLAUDE.md. Choropleth heatmap WITHOUT login. FREE: 5 parcel clicks/day, 3 chats/day, then modal. Brand: #1E3A5F #F59E0B #020617. Must pass tsc+build. Execute autonomously." --dangerously-skip-permissions
            npx tsc --noEmit 2>&1 | tail -5 || true
            npm run build 2>&1 | tail -5
            git config user.name "Claude Code"
            git config user.email "claude@zonewise.ai"
            git add -A
            git diff --cached --quiet && { echo "No changes"; exit 1; }
            git commit -m "feat(explorer-v2): Reventure lead magnet [SUMMIT]
            Closes #41"
            git push origin main
            SCRIPT
            sed -i "s|WORKDIR|$WORK|g" "$WORK/go.sh"
            chmod +x "$WORK/go.sh"
            chown claude:claude "$WORK/go.sh"
            su -s /bin/bash claude "$WORK/go.sh"
            rm -rf "$WORK"
            echo "DONE"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
