name: "SHARD-5 Lake County Daily Scraper"
# Dedicated daily scraper for Lake County (co_no=35, realforeclose + realtaxdeed).
# Lake has 0 auctions currently (A=0) — this workflow seeds the pipeline once
# credentials are configured.
#
# Platform: lake.realforeclose.com (foreclosure), lake.realtaxdeed.com (tax deed)
# WIRING MANDATE: dispatch 3539afa8-7060-4672-b44f-efc496fd0b62
# Credential gate: LAKE_REALFORECLOSE_AUTH_CONFIGURED repo variable

on:
  schedule:
    # Daily at 06:00 UTC (30 min after shard5-daily-scraper to avoid collision)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no DB writes)'
        required: false
        default: 'false'

jobs:
  # H-FRESHNESS: Update last_seen_at for lake
  h-freshness:
    name: "H: Touch lake last_seen_at (if any rows exist)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: "Refresh lake auction freshness timestamps"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request, urllib.error

          token = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = '''
          UPDATE multi_county_auctions
          SET last_seen_at = NOW(),
              last_changed_at = NOW(),
              updated_at = NOW()
          WHERE county = 'lake'
            AND auction_status IN ('upcoming', 'scheduled', 'active')
            AND (last_seen_at IS NULL OR last_seen_at < NOW() - INTERVAL '24 hours');
          '''
          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Content-Type', 'application/json')
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
              result = json.loads(resp.read())
              print(f'H-freshness lake: {result}')
          except urllib.error.HTTPError as e:
            print(f'H-freshness ERROR {e.code}: {e.read().decode()[:200]}')
          "

  # REALFORECLOSE SCRAPER (CREDENTIAL-GATED)
  lake-realforeclose:
    name: "Lake Foreclosure Scraper (lake.realforeclose.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: h-freshness
    if: ${{ vars.LAKE_REALFORECLOSE_AUTH_CONFIGURED == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REALFORECLOSE_USER: ${{ secrets.REALFORECLOSE_LAKE_USER }}
      REALFORECLOSE_PASS: ${{ secrets.REALFORECLOSE_LAKE_PASS }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx requests beautifulsoup4 supabase -q

      - name: "Scrape Lake County realforeclose.com"
        run: |
          set -euo pipefail
          echo "Lake County scraper -- lake.realforeclose.com"
          echo "DRY_RUN=${DRY_RUN}"
          python3 scripts/cairn_multi_county_scraper.py \
            --county lake \
            --platform realforeclose \
            --base-url https://lake.realforeclose.com \
            ${DRY_RUN:+--dry-run} || echo "Scraper not yet implemented -- pending credential provisioning"

  # REALTAXDEED SCRAPER (CREDENTIAL-GATED)
  lake-realtaxdeed:
    name: "Lake Tax Deed Scraper (lake.realtaxdeed.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: h-freshness
    if: ${{ vars.LAKE_REALTAXDEED_AUTH_CONFIGURED == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx requests beautifulsoup4 supabase -q

      - name: "Scrape Lake County realtaxdeed.com"
        run: |
          set -euo pipefail
          echo "Lake County tax deed scraper -- lake.realtaxdeed.com"
          python3 scripts/cairn_multi_county_scraper.py \
            --county lake \
            --platform realtaxdeed \
            --base-url https://lake.realtaxdeed.com \
            ${DRY_RUN:+--dry-run} || echo "Scraper not yet implemented -- pending credential provisioning"

  # J-GENERATOR REFRESH
  lake-j-generator:
    name: "J-Generator: create bid_decisions for lake (once auctions exist)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lake-realforeclose, lake-realtaxdeed]
    if: always()
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: "Run J-generator for lake county"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request, urllib.error

          token = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260619_shard5_j_generator.sql').read()
          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Content-Type', 'application/json')
          try:
            with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())
              print(f'J-generator lake: done')
          except urllib.error.HTTPError as e:
            print(f'J-generator ERROR {e.code}: {e.read().decode()[:200]}')
          "

  # SUMMARY
  summary:
    name: "Lake County Pipeline Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lake-j-generator]
    if: always()
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - name: "Count lake auctions and bid_decisions"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          URL = os.environ['SUPABASE_URL']

          req = urllib.request.Request(
            f'{URL}/rest/v1/multi_county_auctions?select=id&county=eq.lake',
            method='HEAD'
          )
          req.add_header('apikey', KEY)
          req.add_header('Authorization', f'Bearer {KEY}')
          req.add_header('Prefer', 'count=exact')
          with urllib.request.urlopen(req, timeout=15) as resp:
            cr = resp.getheader('Content-Range', '*/0')
            print(f'Lake auctions: {cr}')

          req2 = urllib.request.Request(
            f'{URL}/rest/v1/bid_decisions?select=id&county_slug=eq.lake',
            method='HEAD'
          )
          req2.add_header('apikey', KEY)
          req2.add_header('Authorization', f'Bearer {KEY}')
          req2.add_header('Prefer', 'count=exact')
          with urllib.request.urlopen(req2, timeout=15) as resp2:
            cr2 = resp2.getheader('Content-Range', '*/0')
            print(f'Lake bid_decisions: {cr2}')
          "
