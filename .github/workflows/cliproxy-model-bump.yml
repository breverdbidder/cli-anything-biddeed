name: cliproxy model bump — replace deprecated gemini-2.0-flash, retest
on:
  workflow_dispatch: {}
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SSH + bump model + retest
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          set +e
          CFG=/opt/cliproxy-gateway/config.yaml
          CP_KEY="biddeed-gw-77dc6c9df0e5088057c28d1f94d3fef791961fbb409da85f"

          echo "=== A: current models in cliproxy config ==="
          $SSH "grep -B1 'name:' ${CFG} | grep -E 'name:|model' | head -30"

          echo
          echo "=== B: bump gemini-2.0-flash to gemini-2.5-flash (current stable) ==="
          $SSH "cp ${CFG} ${CFG}.bak.bump.\$(date +%s)"
          $SSH "sed -i 's/gemini-2.0-flash/gemini-2.5-flash/g' ${CFG}"
          $SSH "grep -A1 '^gemini-api-key:' ${CFG} | head -10 | sed -E 's/(api-key:\s*).*/\1<redacted>/'"

          echo
          echo "=== C: restart cliproxy ==="
          $SSH "docker restart biddeed-cliproxy && sleep 4"
          $SSH 'docker logs --tail 5 biddeed-cliproxy 2>&1 | grep -v "no space"'

          echo
          echo "=== D: smoke 1 — Anthropic format → gemini-flash alias ==="
          RESP=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with PATH_Y_FINAL_OK\"}]}' -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 1500

          echo
          echo "=== E: smoke 2 — try gemini-flash-preview alias (newer model) ==="
          RESP2=$($SSH "curl -sS -X POST -H 'Content-Type: application/json' -H 'x-api-key: ${CP_KEY}' -H 'anthropic-version: 2023-06-01' -d '{\"model\":\"gemini-flash-preview\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"Reply only with PREVIEW_OK\"}]}' -m 30 http://127.0.0.1:8317/v1/messages 2>&1")
          echo "len: ${#RESP2}"
          echo "$RESP2" | head -c 1500

          echo
          echo "=== F: claude -p via cliproxy → gemini-flash ==="
          $SSH "ANTHROPIC_BASE_URL=http://127.0.0.1:8317 ANTHROPIC_API_KEY=${CP_KEY} claude -p 'reply only with CLAUDE_VIA_GEMINI_OK and nothing else' --model gemini-flash --allowedTools Read 2>&1 | tail -15"

          echo
          echo "=== G: claude -p via cliproxy → gemini-flash-preview ==="
          $SSH "ANTHROPIC_BASE_URL=http://127.0.0.1:8317 ANTHROPIC_API_KEY=${CP_KEY} claude -p 'reply only with CLAUDE_VIA_GEMINI_PREVIEW_OK' --model gemini-flash-preview --allowedTools Read 2>&1 | tail -15"

          echo "=== END ==="
