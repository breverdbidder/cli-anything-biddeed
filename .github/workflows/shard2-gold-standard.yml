name: SHARD-2 Gold Standard Autonomous Execution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'verify-only'
        type: choice
        options:
        - verify-only
        - execute
      dispatch_id:
        description: 'Dispatch ID'
        required: true
        default: '464969f4-742c-4182-8aad-5727210bef66'

env:
  SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  shard2-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour session budget
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx
        
    - name: Verify Environment
      run: |
        echo "Dispatch ID: ${{ github.event.inputs.dispatch_id }}"
        echo "Mode: ${{ github.event.inputs.mode }}"
        echo "Counties: brevard, sarasota, jackson, st_lucie, holmes"
        python -c "import os; print('SUPABASE_URL:', os.environ.get('SUPABASE_URL')); print('SUPABASE_KEY:', 'SET' if os.environ.get('SUPABASE_KEY') else 'NOT_SET')"
        
    - name: Execute SHARD-2 Master Coordinator
      id: execution
      run: |
        if [ "${{ github.event.inputs.mode }}" = "execute" ]; then
          echo "🚀 Executing full autonomous session"
          python scripts/shard2_master_coordinator.py --execute
        else
          echo "🔍 Running verification-only mode"
          python scripts/shard2_master_coordinator.py --verify-only
        fi
      continue-on-error: true
      
    - name: Upload Session Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: shard2-session-report-${{ github.event.inputs.dispatch_id }}
        path: |
          shard2_session_report_*.json
          *.log
        retention-days: 30
        
    - name: Comment Results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const glob = require('glob');
          
          // Find session report
          let reportContent = "Session completed - check artifacts for detailed report";
          try {
            const reportFiles = glob.sync('shard2_session_report_*.json');
            if (reportFiles.length > 0) {
              const report = JSON.parse(fs.readFileSync(reportFiles[0], 'utf8'));
              reportContent = `
          ## SHARD-2 Session Report
          
          **Dispatch ID**: ${{ github.event.inputs.dispatch_id }}
          **Mode**: ${{ github.event.inputs.mode }}
          **Elapsed**: ${report.elapsed_hours?.toFixed(1) || 'N/A'} hours
          
          ### Counties Processed
          ${report.counties?.map(c => `- ${c}`).join('\n') || 'N/A'}
          
          ### Results Summary
          - Counties improved: ${report.summary?.counties_improved || 0}/${report.summary?.total_counties || 5}
          - Total point gain: +${report.summary?.total_point_gain || 0} letters
          - Success rate: ${(report.summary?.success_rate * 100)?.toFixed(1) || 0}%
          
          ### Execution Log
          ${report.execution_log?.map(item => `- ${item}`).join('\n') || 'No execution log available'}
          `;
            }
          } catch (e) {
            console.log('Could not parse session report:', e);
          }
          
          // Comment on the triggering issue or PR
          const context = github.context;
          if (context.payload.issue) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: reportContent
            });
          } else {
            console.log('No issue context for commenting');
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Check Session Success
      run: |
        if [ "${{ steps.execution.outcome }}" = "success" ]; then
          echo "✅ SHARD-2 session completed successfully"
        else
          echo "⚠️ SHARD-2 session had issues - check logs and reports"
          exit 1
        fi