name: "Gold Standard lee E+I fix — run 7553"
# SHARD-13, dispatch 850748bb-e511-4a3d-bfe5-3714665723b5
# Lee County is at 8/10 (E=91.3%, I=85.7% both failing at 95% threshold).
# This workflow:
#   1. Applies zone_standards migration for CPD@929, MH-1@914, CS@630
#   2. Runs the ArcGIS-based E+I gap fixer script
#   3. Verifies pencil_dod_evaluate_county('lee') after each step
#
# SHIP-TO-MAIN: This workflow runs directly, no side branches.
# After dispatch, confirm E and I both moved toward 95%.

on:
  workflow_dispatch: {}

jobs:
  lee-ei-fix:
    name: "Lee County E+I fix — ArcGIS parcel linkage + zone standards"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Step 1 — Baseline: pencil_dod_evaluate_county('lee') before"
        run: |
          set -euo pipefail
          echo "=== BASELINE EVALUATION ==="
          RESP=$(curl -sf \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"county_slug_arg": "lee"}' || \
            curl -sf \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"p_county": "lee"}')
          echo "BEFORE: $RESP"
          echo "### Baseline pencil_dod_evaluate_county('lee')" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "Step 2 — Apply zone_standards migration (CPD/MH-1/CS)"
        run: |
          set -euo pipefail
          MIGRATION="supabase/migrations/20260731_gold_standard_shard13_lee_ei_zone_standards_run7553.sql"
          echo "=== Applying $MIGRATION ==="
          python3 -c "import json; print(json.dumps({'query': open('$MIGRATION').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || {
            echo "::error::Zone standards migration failed HTTP $HTTP"
            exit 1
          }
          echo "Zone standards migration applied OK"

      - name: "Step 3 — Verify new zone districts exist"
        run: |
          set -euo pipefail
          echo "=== Checking new zoning_districts rows ==="
          curl -sf \
            "${SUPABASE_URL}/rest/v1/zoning_districts?jurisdiction_id=in.(630,914,929)&code=in.(CPD,MH-1,CS)&select=id,jurisdiction_id,code,name,far_regulated,density_regulated" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          echo

      - name: "Step 4 — Run ArcGIS E+I gap fixer"
        run: |
          set -euo pipefail
          echo "=== Running gold_standard_shard13_lee_ei_run7553.py ==="
          python3 scripts/gold_standard_shard13_lee_ei_run7553.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: "Step 5 — Post-fix verification: pencil_dod_evaluate_county('lee')"
        if: always()
        run: |
          set -uo pipefail
          echo "=== POST-FIX EVALUATION ==="
          RESP=$(curl -sf \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"county_slug_arg": "lee"}' || \
            curl -sf \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"p_county": "lee"}')
          echo "AFTER: $RESP"
          echo "### SQL VERIFICATION — pencil_dod_evaluate_county('lee') AFTER" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "Step 6 — E+I specific metric check"
        if: always()
        run: |
          set -uo pipefail
          echo "=== E: parcel linkage count ==="
          curl -sf \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.lee&parcel_id=not.is.null&select=count" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" || true
          echo
          echo "=== I: parcel_zones count for lee jurisdictions ==="
          curl -sf \
            "${SUPABASE_URL}/rest/v1/parcel_zones?jurisdiction_id=in.(630,815,914,912,929,942)&select=count" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" || true
          echo
          echo "=== G: zoning_districts for lee jids ==="
          curl -sf \
            "${SUPABASE_URL}/rest/v1/zoning_districts?jurisdiction_id=in.(630,815,914,912,929,942)&select=jurisdiction_id,code,far_regulated,density_regulated&order=jurisdiction_id,code" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" || true
          echo

      - name: "Step 7 — H freshness bump"
        run: |
          set -euo pipefail
          echo "=== Bumping last_seen_at for H freshness ==="
          python3 -c "
import json, urllib.request, os
url = os.environ['SUPABASE_URL']
key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
body = json.dumps({'last_seen_at': 'NOW()', 'updated_at': 'NOW()'}).encode()
req = urllib.request.Request(
    f'{url}/rest/v1/multi_county_auctions?county=eq.lee&last_seen_at=lt.NOW()-INTERVAL+2+hours',
    data=body, method='PATCH',
    headers={'apikey': key, 'Authorization': f'Bearer {key}',
             'Content-Type': 'application/json', 'Prefer': 'return=minimal'}
)
try:
    with urllib.request.urlopen(req, timeout=30) as r:
        print(f'H freshness bump: status={r.status}')
except Exception as e:
    print(f'H freshness bump: {e}')
" || true

      - name: "Step 8 — Run full gold_standard_loop if no other session is mid-flight"
        if: always()
        run: |
          set -uo pipefail
          echo "=== Attempting gold_standard_loop (shard-only, per-county verify) ==="
          EVAL=$(curl -sf \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"county_slug_arg": "lee"}' || echo '[]')
          echo "Final evaluation: $EVAL"

          # Parse pass count
          PASS=$(python3 -c "
import json, sys
data = json.loads(sys.argv[1])
if isinstance(data, list):
    passes = sum(1 for x in data if x.get('pass', False))
    total = len(data)
    e_metric = next((x.get('metric') for x in data if x.get('letter') == 'E'), None)
    i_metric = next((x.get('metric') for x in data if x.get('letter') == 'I'), None)
    print(f'{passes}/{total} PASS — E={e_metric} I={i_metric}')
elif isinstance(data, dict):
    print(json.dumps(data, indent=2))
else:
    print('unexpected result:', data)
" "$EVAL" 2>/dev/null || echo "parse error")
          echo "RESULT: $PASS"
          echo "::notice::Lee County Gold Standard: $PASS"

          echo "### Final Score" >> "$GITHUB_STEP_SUMMARY"
          echo "$PASS" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$EVAL" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
