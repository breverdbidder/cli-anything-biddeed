name: "Summit: Ingest FL County"
on:
  workflow_dispatch:
    inputs:
      county:
        description: "County number (1-67) or slug"
        required: true
        type: string
      mode:
        description: "count = parcel count only, full = full ingestion"
        required: true
        type: choice
        options:
          - count
          - full
        default: count

jobs:
  ingest:
    name: "Ingest ${{ inputs.county }} (${{ inputs.mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: "Run Ingestion"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            python scripts/ingest_county.py --county "${{ inputs.county }}" --full
          else
            python scripts/ingest_county.py --county "${{ inputs.county }}"
          fi
