name: Evening Verification Sweep (5:00 PM EDT)

on:
  schedule:
    - cron: '0 21 * * *'  # 5:00 PM EDT = 21:00 UTC
  workflow_dispatch:

jobs:
  verification-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run evening verification sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 scripts/evening_verification_sweep.py
