name: "Everest Sentinel V2"
on:
  schedule:
    - cron: '*/5 * * * *'   # Patrol every 5 min (original design intent, was missing — added 2026-05-27 to support cron-driven cooldown enforcement)
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Specific run ID to triage'
        required: false

# Serialize all Sentinel V2 runs. Fixes the cooldown-check race that
# fired ~10 parallel /dispatches POSTs in 20s on 2026-05-27.
concurrency:
  group: sentinel-v2-global
  cancel-in-progress: false

jobs:
  sentinel-v2:
    name: "Patrol + Auto-Fix + Redispatch"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only fire on: (a) schedule, (b) manual, or (c) FAILURE of a summit/envelope/nexus workflow.
    # Skip Sentinel itself + Task Lifecycle + Close Stale to break the cascade loop.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        !contains(github.event.workflow_run.name, 'Sentinel') &&
        !contains(github.event.workflow_run.name, 'Task Lifecycle') &&
        !contains(github.event.workflow_run.name, 'Close Stale')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sentinel-v2.sh
            scripts/sentinel-v2-patrol.sh

      - name: "Run Sentinel V2 Patrol"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # FIXED 2026-05-27: was secrets.SUPABASE_KEY which returns "Invalid API key"
          # → caused sb_insert() silent failures → cooldown markers never persisted → flood
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          REPO: ${{ github.repository }}
          MANUAL_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          chmod +x scripts/sentinel-v2.sh scripts/sentinel-v2-patrol.sh
          bash scripts/sentinel-v2-patrol.sh
