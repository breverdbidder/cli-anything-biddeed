name: "Everest Sentinel V2"
on:
  # 2026-09-03 (#19767): the reactive `workflow_run: workflows: ["*"]` trigger
  # was removed. scripts/sentinel-v2-patrol.sh — the script every trigger type
  # here runs — does NOT use the triggering event's run data (that's only
  # wired up for the workflow_dispatch `run_id` manual-triage path below).
  # On every other invocation it independently re-scans
  # `GET /actions/runs?status=completed&created=>$(now - 10min)` and filters
  # to summit/designwise/envelope/nexus/viral by name. A 5-min cron with a
  # 10-minute lookback window has full overlap — every completed run is
  # already caught by the next (often two) cron ticks. The workflow_run
  # trigger added zero unique detection and was the entire source of the
  # fan-out: with ~660 workflow files in this repo and growing (every SUMMIT
  # session can mint new ones), "*" meant a Sentinel run per completed run of
  # any of them, at any concurrency. Measured before removal: 22 Sentinel V2
  # runs in a single 5-minute window (2026-09-03 00:34:50-00:39:50 UTC),
  # nearly all `skipped`.
  schedule:
    # Deliberately kept at 5 min — added 2026-05-27 (204491f3) as the
    # cron-driven backstop for cooldown-marker enforcement after a stale
    # SUPABASE_SERVICE_KEY secret silently broke sb_insert() and caused a
    # 10x dispatch flood. That failure mode is orthogonal to the workflow_run
    # fan-out fixed here — the cron is now Sentinel's ONLY failure-detection
    # path (see above), so shortening it would add real latency, not just
    # remove noise. Kept as-is.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Specific run ID to triage'
        required: false

# Serialize all Sentinel V2 runs. Fixes the cooldown-check race that
# fired ~10 parallel /dispatches POSTs in 20s on 2026-05-27.
concurrency:
  group: sentinel-v2-global
  cancel-in-progress: false

jobs:
  sentinel-v2:
    name: "Patrol + Auto-Fix + Redispatch"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run removed (see above) — every remaining trigger (schedule,
    # workflow_dispatch) should run the patrol. Guard kept as defence in
    # depth in case workflow_run is ever reintroduced.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        !contains(github.event.workflow_run.name, 'Sentinel') &&
        !contains(github.event.workflow_run.name, 'Task Lifecycle') &&
        !contains(github.event.workflow_run.name, 'Close Stale')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/sentinel-v2.sh
            scripts/sentinel-v2-patrol.sh

      - name: "Run Sentinel V2 Patrol"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # FIXED 2026-05-27: was secrets.SUPABASE_KEY which returns "Invalid API key"
          # → caused sb_insert() silent failures → cooldown markers never persisted → flood
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          REPO: ${{ github.repository }}
          MANUAL_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          chmod +x scripts/sentinel-v2.sh scripts/sentinel-v2-patrol.sh
          bash scripts/sentinel-v2-patrol.sh
