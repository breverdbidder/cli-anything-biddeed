name: "Figma MCP Setup on Hetzner"
on:
  workflow_dispatch: {}
jobs:
  setup:
    name: "🎨 Figma MCP Install"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Install Figma MCP on Hetzner"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          TG_BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"

          echo "=== Register Figma MCP on Hetzner ==="
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 "
            su - claude -c 'claude mcp add --transport http figma-remote-mcp https://mcp.figma.com/mcp 2>&1' || true
            su - claude -c 'claude mcp list 2>&1' || true
          " 2>&1

          echo ""
          echo "=== Send auth instructions to Telegram ==="
          curl -sf -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"✅ FIGMA MCP REGISTERED on Hetzner\n\nServer: figma-remote-mcp → mcp.figma.com/mcp\n\nOAuth triggers on first tool use. Next Claude Code session on Hetzner will auto-prompt for auth.\n\nAll agent files merged to main ✅\"}"
          echo "=== DONE ==="
