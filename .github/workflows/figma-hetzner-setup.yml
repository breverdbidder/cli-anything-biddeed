name: "Figma MCP Setup on Hetzner"
on:
  workflow_dispatch: {}
jobs:
  setup:
    name: "🎨 Figma MCP Install"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Write Figma MCP config directly"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null
          TG_BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"

          echo "=== Write Figma MCP config to claude user ==="
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 '
            # Read existing config or create new
            CLAUDE_HOME=/home/claude
            CONFIG="$CLAUDE_HOME/.claude.json"

            if [ -f "$CONFIG" ]; then
              echo "Existing config found, merging..."
              python3 -c "
import json
with open(\"'$CONFIG'\") as f:
    cfg = json.load(f)
if \"mcpServers\" not in cfg:
    cfg[\"mcpServers\"] = {}
cfg[\"mcpServers\"][\"figma-remote-mcp\"] = {
    \"type\": \"url\",
    \"url\": \"https://mcp.figma.com/mcp\"
}
with open(\"'$CONFIG'\", \"w\") as f:
    json.dump(cfg, f, indent=2)
print(\"Merged figma MCP into existing config\")
" 2>&1 || echo "Python merge failed, creating fresh..."
            fi

            # If no config or merge failed, create
            if [ ! -f "$CONFIG" ] || ! grep -q "figma" "$CONFIG" 2>/dev/null; then
              cat > "$CONFIG" << CONF
{
  "mcpServers": {
    "figma-remote-mcp": {
      "type": "url",
      "url": "https://mcp.figma.com/mcp"
    }
  }
}
CONF
              echo "Created new config with Figma MCP"
            fi

            chown claude:claude "$CONFIG"
            echo "Config contents:"
            cat "$CONFIG"
          ' 2>&1

          echo ""
          echo "=== Telegram ==="
          curl -sf -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"✅ FIGMA MCP CONFIG WRITTEN to Hetzner ~/.claude.json\n\nServer: figma-remote-mcp → mcp.figma.com/mcp\n\nNext Claude Code session will detect the MCP server and prompt for OAuth auth (one-time browser click).\n\nAll FigmaWise agent files on main ✅\"}"
          echo "=== DONE ==="
