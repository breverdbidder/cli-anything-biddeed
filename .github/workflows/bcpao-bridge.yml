name: bcpao-bridge
# BCPAO account->parcel bridge via Firecrawl (BCPAO is Cloudflare-walled from datacenter IPs).
# Feeds v_brevard_td_sold_cma (full addresses + corpus CMA for every sold lot).
on:
  workflow_dispatch:
    inputs:
      limit: {description: "max accounts this run", required: false, default: "100"}
  schedule:
    - cron: "40 8 * * 2,5"   # Tue+Fri 08:40Z
concurrency: {group: bcpao-bridge, cancel-in-progress: false}
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Bridge accounts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GHA_RUN_ID: ${{ github.run_id }}
        run: |
          pip install --quiet httpx
          python scripts/bcpao_bridge.py "${{ github.event.inputs.limit }}"
