name: "Calendar Sweep — MCP Remaining 4"
# Targets the 4 counties still at 0 upcoming auctions from the MCP 30-county mission.
# bradford/calhoun were in the 39-county sweep but remain dark (403 or genuinely no auctions).
# okaloosa was MISSING from all prior sweep workflows.
# monroe is tax_deed only per mission.
#
# DOD: SELECT COUNT(DISTINCT county) FROM multi_county_auctions
#      WHERE auction_date >= CURRENT_DATE AND source_platform NOT IN ('propertyonion_orphan','po_api')
#      → currently 51/50 — already passed, this workflow reaches for higher coverage.
#
# GHA-only (no Hetzner). Follows cc-runner-ghonly.yml pattern.

on:
  workflow_dispatch:
    inputs:
      sale_type:
        description: 'foreclosure | tax_deed | both'
        required: false
        default: 'both'
      dry_run:
        description: 'true = skip upsert, log only'
        required: false
        default: 'false'
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: calendar-sweep-mcp-remaining
  cancel-in-progress: false

jobs:
  # ── 1. BUILD MATRIX FROM SSOT ────────────────────────────────────────────────
  setup:
    name: "Build matrix for 4 remaining counties"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total:  ${{ steps.gen.outputs.total }}
    steps:
      - name: "Query realauction_subdomains (realforeclose+realtaxdeed only)"
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SALE_TYPE_IN: ${{ github.event.inputs.sale_type || 'both' }}
        run: |
          set -euo pipefail

          SLUGS="bradford,calhoun,monroe,okaloosa"

          STIN="${SALE_TYPE_IN:-both}"
          if [ "$STIN" = "both" ]; then
            ST_FILTER="platform=in.(realforeclose,realtaxdeed)"
          elif [ "$STIN" = "foreclosure" ]; then
            ST_FILTER="platform=eq.realforeclose"
          else
            ST_FILTER="platform=eq.realtaxdeed"
          fi

          URL="${SUPABASE_URL}/rest/v1/realauction_subdomains?is_active=eq.true&${ST_FILTER}&county_slug=in.(${SLUGS})&select=county_slug,sale_type,platform,base_url"
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "$URL" || echo "[]")

          TOTAL=$(echo "$RESP" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "::notice::Found $TOTAL entries in realauction_subdomains"

          if [ "$TOTAL" = "0" ]; then
            echo "::warning::No active entries found — all 4 counties may not be in realauction_subdomains"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(echo "$RESP" | python3 -c "
import json, sys
db = json.load(sys.stdin)
seen = set()
entries = []
for e in db:
    slug = e['county_slug']
    plat = e.get('platform') or ''
    st   = e.get('sale_type') or ''
    if plat not in ('realforeclose', 'realtaxdeed'):
        continue
    k = (slug, st)
    if k in seen:
        continue
    seen.add(k)
    raw = e.get('base_url') or f'https://{slug}.{plat}.com'
    base = raw.split('/index.cfm')[0].rstrip('/')
    entries.append({'county': slug, 'sale_type': st, 'platform': plat, 'base_url': base})
print(json.dumps({'include': entries}))
sys.stderr.write(f'INFO: {len(entries)} combos after dedup and platform filter\n')
")

          TOTAL=$(echo "$MATRIX" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['include']))")
          echo "::notice::Matrix: $TOTAL county+sale_type combos"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Sample:', d['include'][:4])"

  # ── 2. CALENDAR SWEEP (parallel, max 5) ──────────────────────────────────────
  sweep:
    name: "Sweep ${{ matrix.county }}/${{ matrix.sale_type }}"
    needs: setup
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests

      - name: "Scrape calendar + preview -> upsert to MCA"
        id: sweep
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY_SLUG:               ${{ matrix.county }}
          BASE_URL:                  ${{ matrix.base_url }}
          PLATFORM:                  ${{ matrix.platform }}
          SALE_TYPE:                 ${{ matrix.sale_type }}
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.county }} / ${{ matrix.sale_type }} ==="
          echo "  Base URL: ${{ matrix.base_url }}"
          echo "  Platform: ${{ matrix.platform }}"

          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "DRY RUN -- skipping script"
            exit 0
          fi

          EXIT=0; python .github/scripts/calendar_sweep_mca.py || EXIT=$?
          if [ "$EXIT" = "1" ]; then
            echo "  Retrying after 15s..."
            sleep 15
            EXIT=0; python .github/scripts/calendar_sweep_mca.py || EXIT=$?
          fi
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: "Verify row count for ${{ matrix.county }}"
        if: steps.sweep.outputs.exit_code == '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          COUNTY="${{ matrix.county }}"
          TODAY=$(date -u +%Y-%m-%d)
          URL="${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.${COUNTY}&auction_date=gte.${TODAY}&select=auction_date,case_number&limit=3"
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "$URL")
          COUNT=$(echo "$RESP" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "### SQL VERIFICATION: ${COUNTY}" >> "$GITHUB_STEP_SUMMARY"
          printf '```sql\n' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT county, auction_date, case_number FROM multi_county_auctions WHERE county='${COUNTY}' AND auction_date >= '${TODAY}' LIMIT 3;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- rows returned: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::${COUNTY}: $COUNT upcoming rows in MCA"

  # ── 3. DOD VERIFICATION ───────────────────────────────────────────────────────
  verify-dod:
    name: "DOD Verification"
    needs: [setup, sweep]
    if: always() && needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "Count distinct counties via paginated REST"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TODAY: ""
        run: |
          set -euo pipefail
          export TODAY=$(date -u +%Y-%m-%d)
          python3 .github/scripts/dod_rest_check.py > /tmp/dod.json

          COUNT=$(python3 -c "import json; print(json.load(open('/tmp/dod.json'))['distinct'])")
          ROWS=$(python3 -c "import json; print(json.load(open('/tmp/dod.json'))['total_rows'])")

          echo "### DOD VERIFICATION" >> "$GITHUB_STEP_SUMMARY"
          printf '```sql\n' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT COUNT(DISTINCT county) FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE auction_date >= '${TODAY}'" >> "$GITHUB_STEP_SUMMARY"
          echo "AND source_platform NOT IN ('propertyonion_orphan','po_api');" >> "$GITHUB_STEP_SUMMARY"
          echo "-- Total rows: $ROWS | Distinct counties: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -ge 50 ]; then
            echo "::notice::DOD PASSED: $COUNT >= 50 counties"
            echo "### DOD PASSED: $COUNT >= 50 counties" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DOD NOT MET: $COUNT / 50"
            echo "### DOD NOT MET: $COUNT / 50" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### Per-county row counts (4 target counties)" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          for COUNTY in bradford calhoun monroe okaloosa; do
            N=$(curl -sf \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.${COUNTY}&auction_date=gte.${TODAY}&select=county&limit=1000" 2>/dev/null \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
            echo "${COUNTY}: ${N} rows" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
