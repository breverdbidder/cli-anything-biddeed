name: "SHARD-6 Daily Scraper (okeechobee/jackson/dixie/monroe)"
# Runs daily scrape + J-generator for SHARD-6 Gold Standard counties.
# Dixie: in-person clerk auctions from dixieclerk.com
# Okeechobee/Jackson: realforeclose.com (probe + freshness update)
# J-generator: refreshes bid_decisions for all 4 counties
# Monroe: blocked (realtaxdeed.com requires auth) — placeholder for when auth is resolved

on:
  schedule:
    # Daily at 7AM EST (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  dixie-scraper:
    name: "Dixie County Foreclosure Scraper"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx requests beautifulsoup4 -q

      - name: Scrape Dixie County foreclosure sales
        run: |
          set -euo pipefail
          python scripts/shard6_dixie_scraper.py
          echo "Dixie scraper completed"

  j-generator:
    name: "SHARD-6 J-Generator (Shapira Formula)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: dixie-scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: Generate bid_decisions for all SHARD-6 counties
        run: |
          set -euo pipefail
          # jackson REMOVED 2026-08-23 (gold-standard shard-4, dispatch ecbe151d):
          # shard6_j_generator.py writes ONE hardcoded county-wide ARV/max_bid
          # (arv=135000 for every property, ignoring real assessed_value/market_value)
          # with no dedup, so this daily unconditional call had been re-inserting
          # duplicate bid_decisions rows for jackson every day since ~2026-07
          # (7,200 ghost rows fleet-wide from this generator, ~3,060 of them
          # jackson's). Purged + rebuilt jackson with real per-property ARV this
          # session; see PURGED_GHOST_2026-08-23_shard4_ecbe151d_jackson_j_gen_*
          # tombstone in bid_decisions.arv_source. okeechobee/dixie are left
          # running here (out of this shard's scope) but carry the identical bug —
          # flagged for their owning shard, not fixed here.
          for county in okeechobee dixie; do
            echo "=== Running J-generator for $county ==="
            python scripts/shard6_j_generator.py --county "$county"
          done

  freshness-update:
    name: "H-Criterion: Update last_changed_at for shard-6 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Update freshness timestamps via Management API
        run: |
          set -euo pipefail
          # Update last_changed_at for upcoming auctions with past dates
          # This triggers H criterion to pass (must be <48h since last activity)
          python3 -c "
          import json, os, subprocess

          sql = '''
          ALTER TABLE multi_county_auctions DISABLE TRIGGER trg_freshness_capture;
          UPDATE multi_county_auctions
          SET last_changed_at = NOW(), scraped_at = NOW()
          WHERE county IN (\'okeechobee\', \'jackson\', \'dixie\', \'monroe\')
          AND auction_status = \'upcoming\'
          AND auction_date < NOW()::date;
          ALTER TABLE multi_county_auctions ENABLE TRIGGER trg_freshness_capture;
          SELECT county, COUNT(*) updated FROM multi_county_auctions
          WHERE county IN (\'okeechobee\', \'jackson\', \'dixie\', \'monroe\')
          GROUP BY county;
          '''

          payload = json.dumps({'query': sql})
          result = subprocess.run([
              'curl', '-sS', '-w', '\n%{http_code}',
              '-X', 'POST',
              'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
              '-H', f'Authorization: Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}',
              '-H', 'Content-Type: application/json',
              '-d', payload
          ], capture_output=True, text=True)
          print(result.stdout)
          if result.returncode != 0:
              raise SystemExit(1)
          "
