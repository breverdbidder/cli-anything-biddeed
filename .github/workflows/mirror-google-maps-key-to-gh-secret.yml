name: Mirror google_maps_api_key to GH secret

# One-off/idempotent (issue #19736): pulls google_maps_api_key from the
# Supabase vault and writes it as the GOOGLE_MAPS_API_KEY repo secret so
# biddeed-reels-daily.yml can call the Maps Static + Street View Static APIs
# without anyone hand-pasting the key. Same credential-handling pattern as
# set-resend-worker-secret.yml (vault_secret() via the Management API,
# ::add-mask:: before any use, never echoed) -- the only difference is the
# target (a GH Actions repo secret via `gh secret set`, not a Cloudflare
# Worker secret via wrangler), because this key is consumed by a GHA job,
# not a Worker.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch google_maps_api_key from vault and set as repo secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg q "SELECT vault_secret('google_maps_api_key') AS v;" '{query: $q}')
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: cli-anything-biddeed-cc/1.0" \
            -d "$payload")
          value=$(echo "$resp" | jq -r '.[0].v // empty')
          if [ -z "$value" ]; then
            echo "::error::google_maps_api_key not returned from vault_secret() -- check vault contents"
            exit 1
          fi
          echo "::add-mask::$value"
          echo "$value" | gh secret set GOOGLE_MAPS_API_KEY --repo breverdbidder/cli-anything-biddeed
