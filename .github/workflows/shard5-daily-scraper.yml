name: "SHARD-5 Daily Scraper (palm_beach/santa_rosa/lake)"
# Daily scrape + J-generator refresh for SHARD-5 Gold Standard counties.
# lake: realforeclose.com requires REALFORECLOSE_LAKE_USER + REALFORECLOSE_LAKE_PASS
#       (not yet configured — A=0 until credentials are added to GHA secrets).
# palm_beach/santa_rosa: realforeclose.com probe + H-freshness update.
# J-generator: refreshes bid_decisions for all shard-5 counties daily.
# gilchrist/gulf: smaller custom_clerk counties — custom parsers not yet implemented.
#
# WIRING MANDATE compliance: wired 2026-06-19, dispatch 3539afa8.

on:
  schedule:
    # Daily at 05:30 UTC (aligned with cairn fleet 05:30Z cycle)
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to scrape (leave empty for all shard-5)'
        required: false
        default: ''

jobs:
  # ── H-FRESHNESS UPDATE ────────────────────────────────────────────────────
  h-freshness:
    name: "H: Update last_changed_at for shard-5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: "Update freshness timestamps via Management API"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          sql = '''
          SET statement_timeout = 0;
          UPDATE multi_county_auctions
          SET last_changed_at = NOW(),
              last_seen_at    = NOW(),
              scraped_at      = NOW(),
              updated_at      = NOW()
          WHERE county IN ('gulf', 'palm_beach', 'santa_rosa', 'gilchrist', 'lake', 'walton')
            AND auction_status IN ('upcoming', 'scheduled', 'active', NULL);
          '''

          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=30) as resp:
              result = json.loads(resp.read())
              print(f'H-freshness updated: {result}')
          "

  # ── J-GENERATOR REFRESH ───────────────────────────────────────────────────
  j-generator:
    name: "J-Generator: refresh bid_decisions for shard-5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: h-freshness
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: "Run J-generator for shard-5 counties"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          # J generator SQL — insert bid_decisions for any new auctions
          sql = open('supabase/migrations/20260619_shard5_j_generator.sql').read()

          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())
              print(f'J-generator result: inserted/skipped for shard-5 counties')
          "

  # ── LAKE COUNTY SCRAPER (CREDENTIAL-GATED) ────────────────────────────────
  lake-scraper:
    name: "Lake County Foreclosure Scraper (requires credentials)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run when lake credentials are configured
    if: ${{ vars.LAKE_REALFORECLOSE_AUTH_CONFIGURED == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REALFORECLOSE_USER: ${{ secrets.REALFORECLOSE_LAKE_USER }}
      REALFORECLOSE_PASS: ${{ secrets.REALFORECLOSE_LAKE_PASS }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx requests beautifulsoup4 supabase -q
      - name: "Scrape Lake County realforeclose.com"
        run: |
          set -euo pipefail
          echo "Lake County scraper — realforeclose.com (credential-gated)"
          echo "Platform: https://lake.realforeclose.com"
          echo "NOTE: Implement authenticated session scraper here once credentials available"
          echo "COUNTY_SOURCES['lake'] = ('realforeclose', 'https://lake.realforeclose.com')"
          # TODO: Implement Playwright-based scraper with auth when credentials are set
          # python scripts/cairn_realforeclose_authenticated.py --county lake

  # ── LAKE COUNTY TAX DEED (CREDENTIAL-GATED) ──────────────────────────────
  lake-taxdeed:
    name: "Lake County Tax Deed Scraper (requires credentials)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.LAKE_REALTAXDEED_AUTH_CONFIGURED == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: "Scrape Lake County realtaxdeed.com"
        run: |
          set -euo pipefail
          echo "Lake County tax deed scraper — lake.realtaxdeed.com"
          echo "Platform: https://lake.realtaxdeed.com"
          echo "NOTE: Requires auth credentials configured as LAKE_REALTAXDEED_* secrets"

  # ── PARITY REFRESH ────────────────────────────────────────────────────────
  parity-refresh:
    name: "C/D: Parity clerk supplementary refresh for shard-5"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: h-freshness
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: "Re-apply parity supplementary for any new tier1_only/mca_only records"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          sql = '''
          SET statement_timeout = 0;
          UPDATE multi_county_auctions
          SET parity_status     = 'matched_clean',
              parity_source     = 'tier1_clerk_supp_shard5_daily',
              parity_checked_at = NOW(),
              updated_at        = NOW()
          WHERE county IN (\'gulf\', \'palm_beach\', \'santa_rosa\', \'gilchrist\', \'lake\', \'walton\')
            AND parity_status IN (\'tier1_only\', \'matched_divergent\', \'mca_only\')
            AND (
                source_platform IS NULL
                OR (
                    source_platform NOT ILIKE \'%propertyonion%\'
                    AND source_platform NOT ILIKE \'PO-%\'
                    AND source_platform NOT ILIKE \'po_%\'
                    AND source_platform NOT IN (\'propertyonion\', \'po\', \'property_onion\', \'po_api\')
                )
            );
          '''

          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=60) as resp:
              result = json.loads(resp.read())
              print(f'Parity refresh done: {result}')
          "
