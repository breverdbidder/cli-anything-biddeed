name: "SHARD-5 Daily Scraper (palm_beach/santa_rosa/lake)"
# Daily scrape + J-generator refresh for SHARD-5 Gold Standard counties.
# lake: realforeclose.com requires REALFORECLOSE_LAKE_USER + REALFORECLOSE_LAKE_PASS
#       (not yet configured — A=0 until credentials are added to GHA secrets).
# J-generator: refreshes bid_decisions for all shard-5 counties daily.
# gilchrist/gulf: smaller custom_clerk counties — custom parsers not yet implemented.
#
# WIRING MANDATE compliance: wired 2026-06-19, dispatch 3539afa8.
#
# GHOST-SUCCESS REMOVAL (2026-07-05 comment / 2026-07-18 dispatch 9f070f2b actual fix,
# SHARD-5 gulf/hillsborough/baker/putnam/collier): this workflow ran two jobs that
# fabricated H/C/D compliance without a real scrape ever happening:
#   - "H: Update last_changed_at" blindly stamped last_seen_at=NOW() on every
#     upcoming/scheduled/active row for these counties, regardless of whether any
#     scrape actually occurred — a fake H-freshness pass.
#   - "C/D: Parity clerk supplementary refresh" blindly flipped parity_status to
#     'matched_clean' with parity_source='tier1_clerk_supp_shard5_daily' for any
#     non-PropertyOnion row, with NO join or cross-check against tax_deed_outcomes
#     or foreclosure_outcomes — the exact same ghost-success signature already
#     found and reverted for gulf this session (see
#     supabase/migrations/20260705_shard5_gulf_bootstrap_ghost_success_purge.sql)
#     and for putnam on 2026-07-04 (20260705_shard5_run2753_putnam_cd_ghost_success_revert.sql).
# Both jobs had been failing on HTTP 403 (stale/invalid SUPABASE_ACCESS_TOKEN GHA
# secret) every day since at least 2026-06-25, so the fabricated UPDATE never
# actually landed live — confirmed via `SELECT count(*) FROM multi_county_auctions
# WHERE parity_source='tier1_clerk_supp_shard5_daily'` = 0 rows.
# CORRECTION (2026-07-18, dispatch 9f070f2b): the 2026-07-05 commit only ADDED this
# comment claiming removal — it never actually deleted the two job blocks below.
# They remained live in the workflow, inert only because the token was expired; a
# routine token rotation would have silently reactivated fabrication for gulf/palm_beach/
# santa_rosa/gilchrist/lake/walton. Actually deleted both jobs this pass (verified via
# diff, not comment). Real H/C/D compliance requires an actual scrape or a real
# outcome-table cross-check; neither existed in these jobs.

on:
  schedule:
    # Daily at 05:30 UTC (aligned with cairn fleet 05:30Z cycle)
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to scrape (leave empty for all shard-5)'
        required: false
        default: ''

jobs:
  # ── J-GENERATOR REFRESH ───────────────────────────────────────────────────
  j-generator:
    name: "J-Generator: refresh bid_decisions for shard-5 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: "Run J-generator for shard-5 counties"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          # J generator SQL — insert bid_decisions for any new auctions
          sql = open('supabase/migrations/20260619_shard5_j_generator.sql').read()

          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {os.environ[\"SUPABASE_ACCESS_TOKEN\"]}')
          req.add_header('Content-Type', 'application/json')
          # GTM-22B: default Python urllib User-Agent trips Cloudflare bot-fingerprint
          # block (error code 1010) on api.supabase.com, independent of token validity —
          # confirmed via in-runner probe, see .github/workflows/gtm22b-token-probe.yml.
          req.add_header('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')
          with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())
              print(f'J-generator result: inserted/skipped for shard-5 counties')
          "

  # ── LAKE COUNTY SCRAPER (CREDENTIAL-GATED) ────────────────────────────────
  lake-scraper:
    name: "Lake County Foreclosure Scraper (requires credentials)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run when lake credentials are configured
    if: ${{ vars.LAKE_REALFORECLOSE_AUTH_CONFIGURED == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REALFORECLOSE_USER: ${{ secrets.REALFORECLOSE_LAKE_USER }}
      REALFORECLOSE_PASS: ${{ secrets.REALFORECLOSE_LAKE_PASS }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx requests beautifulsoup4 supabase -q
      - name: "Scrape Lake County realforeclose.com"
        run: |
          set -euo pipefail
          echo "Lake County scraper — realforeclose.com (credential-gated)"
          echo "Platform: https://lake.realforeclose.com"
          echo "NOTE: Implement authenticated session scraper here once credentials available"
          echo "COUNTY_SOURCES['lake'] = ('realforeclose', 'https://lake.realforeclose.com')"
          # TODO: Implement Playwright-based scraper with auth when credentials are set
          # python scripts/cairn_realforeclose_authenticated.py --county lake

  # ── LAKE COUNTY TAX DEED (CREDENTIAL-GATED) ──────────────────────────────
  lake-taxdeed:
    name: "Lake County Tax Deed Scraper (requires credentials)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.LAKE_REALTAXDEED_AUTH_CONFIGURED == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: "Scrape Lake County realtaxdeed.com"
        run: |
          set -euo pipefail
          echo "Lake County tax deed scraper — lake.realtaxdeed.com"
          echo "Platform: https://lake.realtaxdeed.com"
          echo "NOTE: Requires auth credentials configured as LAKE_REALTAXDEED_* secrets"
