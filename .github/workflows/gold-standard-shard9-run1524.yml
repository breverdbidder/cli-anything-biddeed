name: "SHARD-9 run1524 Daily Pipeline (glades/union)"
# Gold Standard maintenance for run1524 counties:
#   glades: 10/10 → maintain freshness + parity
#   union:  10/10 → maintain freshness + parity
#
# dispatch_id: f479859a-e8c5-412c-ad01-36d4b538c407
# Root cause fixed 2026-06-28: parity_source stamped to tier1_ prefix
# so gold_standard_loop counts C/D correctly.

on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 UTC daily (offset to avoid conflicts)
  workflow_dispatch:
    inputs:
      force_evaluate:
        description: "Force pencil_dod_evaluate_county run"
        required: false
        default: "true"

concurrency:
  group: shard9-run1524-daily
  cancel-in-progress: false

jobs:
  freshness:
    name: "H-Criterion: Freshness update for glades + union"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Update last_seen_at for glades + union
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request
          from datetime import datetime, timezone

          SB_URL = os.environ['SUPABASE_URL'].rstrip('/')
          SB_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          now_iso = datetime.now(timezone.utc).isoformat()

          for county in ['glades', 'union']:
              url = f'{SB_URL}/rest/v1/multi_county_auctions?county=eq.{county}'
              payload = json.dumps({'last_seen_at': now_iso}).encode()
              req = urllib.request.Request(url, data=payload, method='PATCH')
              req.add_header('apikey', SB_KEY)
              req.add_header('Authorization', f'Bearer {SB_KEY}')
              req.add_header('Content-Type', 'application/json')
              req.add_header('Prefer', 'count=exact,return=minimal')
              with urllib.request.urlopen(req, timeout=30) as r:
                  cr = r.headers.get('Content-Range','')
                  print(f'{county}: updated last_seen_at for {cr} rows')
          "

  parity-maintenance:
    name: "C/D Parity: Ensure tier1 source prefix for glades + union"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Stamp tier1_ prefix on any untagged matched_clean rows
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          SB_URL = os.environ['SUPABASE_URL'].rstrip('/')
          SB_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          now_iso = datetime.now(timezone.utc).isoformat()

          for county in ['glades', 'union']:
              # PATCH rows with matched_clean but no tier1 source
              for src_filter in ['is.null', 'not.like.tier1*']:
                  url = (f'{SB_URL}/rest/v1/multi_county_auctions'
                         f'?county=eq.{county}'
                         f'&parity_status=eq.matched_clean'
                         f'&parity_source={src_filter}')
                  payload = json.dumps({
                      'parity_source': 'tier1_clerk_supp_shard9_run1524',
                      'parity_checked_at': now_iso
                  }).encode()
                  req = urllib.request.Request(url, data=payload, method='PATCH')
                  req.add_header('apikey', SB_KEY)
                  req.add_header('Authorization', f'Bearer {SB_KEY}')
                  req.add_header('Content-Type', 'application/json')
                  req.add_header('Prefer', 'count=exact,return=minimal')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          cr = r.headers.get('Content-Range', '0/0')
                          print(f'{county} ({src_filter}): stamped {cr}')
                  except urllib.error.HTTPError as e:
                      print(f'{county} ({src_filter}): HTTP {e.code} - {e.read().decode()[:100]}')
          "

  evaluate:
    name: "Evaluate glades + union metrics"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [freshness, parity-maintenance]
    if: always()
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Run pencil_dod_evaluate_county for glades + union
        run: |
          set -euo pipefail
          python3 -c "
          import os, json, urllib.request

          supa_url = os.environ['SUPABASE_URL']
          supa_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          for county in ['glades', 'union']:
              payload = json.dumps({'p_county': county}).encode()
              url = f'{supa_url}/rest/v1/rpc/pencil_dod_evaluate_county'
              req = urllib.request.Request(url, data=payload, method='POST')
              req.add_header('apikey', supa_key)
              req.add_header('Authorization', f'Bearer {supa_key}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      ev = json.loads(resp.read())
                      passes = sum(1 for k in 'ABCDEFGHIJ' if isinstance(ev.get(k), dict) and ev[k].get('pass'))
                      print(f'{county}: {passes}/10 PASS')
                      for letter in 'ABCDEFGHIJ':
                          d = ev.get(letter, {})
                          if isinstance(d, dict):
                              status = 'PASS' if d.get('pass') else 'FAIL'
                              print(f'  {letter}: {status} metric={d.get(\"metric\")} {str(d.get(\"detail\",\"\"))[:60]}')
              except Exception as e:
                  print(f'{county}: evaluation error: {e}')
          "
