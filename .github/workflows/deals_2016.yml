name: 2016 Deals — Chain + Aerials

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          sudo apt-get install -y sshpass jq >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          MAPBOX:     ${{ secrets.MAPBOX_TOKEN }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "echo MAPBOX_TOKEN=${MAPBOX} > /tmp/mb.env" 2>/dev/null || true

          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/d2016 && mkdir -p /tmp/d2016
          cd /tmp/d2016

          cat > scrape.py <<'PY'
          import asyncio, json, re, hashlib, time, os
          from pathlib import Path
          import urllib.request, urllib.parse

          OUT = Path('/tmp/d2016')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          def http_get(url, timeout=25, headers=None):
              hdrs = {'User-Agent': UA}
              if headers: hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              return urllib.request.urlopen(req, timeout=timeout)

          # Two confirmed 2016 sales we want full chains for
          # 1) FAIRWAY ESTATES LT 4 BLK E (= 977 Miracle Way per Ariel) - sold to TINAJERO RAFAEL RAMIREZ $159,900
          # 2) MELROSE MANOR UNIT 2 LT 11 BLK C - sold to STEVENS MARLENA JUNE $89,900 - need address
          PROPERTIES = [
              {"id": "fairway", "legal_match": "LT 4 BLK E.*FAIRWAY ESTATES", "buyer": "TINAJERO,RAFAEL"},
              {"id": "melrose", "legal_match": "LT 11 BLK C.*MELROSE MANOR UNIT 2", "buyer": "STEVENS,MARLENA"},
          ]

          # ============================================================
          # STAGE 1: BCPAO address lookup for each legal description
          # Use their search endpoint
          # ============================================================
          async def bcpao_search_legal(page, prop):
              """Resolve address from legal description via BCPAO."""
              try:
                  # BCPAO has a JSON API for parcel queries
                  await page.goto("https://www.bcpao.us/PropertySearch/", wait_until="domcontentloaded", timeout=30000)
                  await asyncio.sleep(3)
                  # Try search via subdivision name
                  if prop["id"] == "fairway":
                      query = "fairway estates rockledge"
                  else:
                      query = "melrose manor rockledge"
                  # Try the visible search input
                  try:
                      sel = await page.query_selector("input[type='search'], input[placeholder*='search' i], input[placeholder*='address' i]")
                      if sel:
                          await sel.fill(query)
                          await asyncio.sleep(1)
                          await page.keyboard.press("Enter")
                          await asyncio.sleep(4)
                  except Exception as e:
                      print(f"  search input err: {e}", flush=True)
                  html = await page.content()
                  Path(f'/tmp/d2016/bcpao_{prop["id"]}.html').write_text(html, errors='replace')
                  print(f"  BCPAO {prop['id']}: {len(html)}b", flush=True)
                  # Try to extract addresses from the results
                  addrs = re.findall(r'(\d{1,5}\s+[A-Z][A-Z\s]+(?:DR|RD|AVE|BLVD|ST|WAY|LN|CT|PL|TRL|CIR)[^,<]*?)\s+(?:ROCKLEDGE|COCOA|MELBOURNE)', html)
                  print(f"  candidate addresses: {addrs[:5]}", flush=True)
                  return addrs
              except Exception as e:
                  print(f"  BCPAO err: {e}", flush=True)
                  return []

          # ============================================================
          # STAGE 2: Brevard Clerk - search buyers as GRANTOR (post-2016)
          # to find any resales (proves end-buyer success a la McKenzie/DeSantis)
          # ============================================================
          async def search_acclaim_csv(page, party_name, role="GRANTOR"):
              try:
                  await page.goto(
                      "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                      wait_until="networkidle", timeout=60000,
                  )
                  await asyncio.sleep(2)
                  btn = page.locator("input[value='I accept the conditions above.']")
                  if await btn.count() > 0:
                      await btn.click()
                      await page.wait_for_load_state("networkidle")
                      await asyncio.sleep(3)
                  await page.wait_for_selector("input#SearchOnName", timeout=20000)
                  if role == "GRANTEE":
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                  await page.fill("input#SearchOnName", party_name)
                  await page.fill("input#RecordDateFrom", "1/1/2016")
                  await page.fill("input#RecordDateTo", "12/31/2026")
                  await page.click("input#btnSearch")
                  await asyncio.sleep(4)
                  try:
                      await page.wait_for_selector("text=Select Names:", timeout=8000)
                      done = page.locator("input[type='submit'][value='Done']")
                      cnt = await done.count()
                      for i in range(cnt):
                          if await done.nth(i).is_visible():
                              await done.nth(i).click()
                              break
                  except: pass
                  await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=30000)
                  await asyncio.sleep(2)
                  async with page.expect_download(timeout=60000) as dl_info:
                      await page.click("a.csvButton#btnCsvButton")
                  download = await dl_info.value
                  safe = party_name.replace(' ','_').replace(',','')
                  csv_path = OUT / f"chain_{safe}_{role}.csv"
                  await download.save_as(str(csv_path))
                  print(f"  saved {role} for {party_name}: {csv_path.stat().st_size}b", flush=True)
                  return csv_path
              except Exception as e:
                  print(f"  acclaim err {party_name}/{role}: {e}", flush=True)
                  return None

          def find_legal_in_csv(csv_path, legal_match_re):
              if not csv_path or not csv_path.exists(): return []
              import csv
              hits = []
              with open(csv_path, 'r', encoding='utf-8-sig', errors='replace') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      legal = row.get('DocLegalDescription','')
                      if re.search(legal_match_re, legal):
                          hits.append(row)
              return hits

          # ============================================================
          # STAGE 3: Mapbox aerials (rooftop accuracy via geocode)
          # ============================================================
          def fetch_mapbox_aerial(lat, lng, addr_id, view, suffix=""):
              """Fetch a Mapbox satellite static image for a coordinate."""
              token = os.environ.get('MAPBOX_TOKEN','').strip()
              if not token:
                  print(f"    NO MAPBOX TOKEN", flush=True)
                  return None
              # Different views by zoom + pitch
              configs = {
                  "close":  f"{lng},{lat},19,0",
                  "wide":   f"{lng},{lat},17,0",
                  "neighborhood": f"{lng},{lat},16,0",
                  "pure":   f"{lng},{lat},18,0",
                  "3d":     f"{lng},{lat},18,0",
              }
              cfg = configs.get(view, f"{lng},{lat},18,0")
              # Use mapbox/satellite-streets-v12 for street labels overlay (close, 3d, neighborhood)
              # Use mapbox/satellite-v9 for pure imagery (pure)
              style = "satellite-v9" if view == "pure" else "satellite-streets-v12"
              # 3d view uses pitch=60, bearing
              if view == "3d":
                  cfg = f"{lng},{lat},18.5,15,60"
              url = f"https://api.mapbox.com/styles/v1/mapbox/{style}/static/{cfg}/1600x900@2x?access_token={token}"
              try:
                  with http_get(url, timeout=25) as r:
                      data = r.read()
                  if len(data) < 5000:
                      print(f"    too small {len(data)}b for {addr_id}/{view}", flush=True)
                      return None
                  fname = f"{addr_id}_{suffix}{view}.jpg"
                  fpath = OUT / fname
                  fpath.write_bytes(data)
                  print(f"    {fname}: {len(data)}b", flush=True)
                  return fname
              except Exception as e:
                  print(f"    mapbox err {view}: {e}", flush=True)
                  return None

          def geocode(addr):
              """Get lat/lng via Mapbox geocoding."""
              token = os.environ.get('MAPBOX_TOKEN','').strip()
              if not token: return None
              q = urllib.parse.quote(addr)
              url = f"https://api.mapbox.com/geocoding/v5/mapbox.places/{q}.json?access_token={token}&limit=1&country=us"
              try:
                  with http_get(url, timeout=15) as r:
                      data = json.loads(r.read())
                  if data.get('features'):
                      lng, lat = data['features'][0]['center']
                      return lat, lng
              except Exception as e:
                  print(f"    geocode err: {e}", flush=True)
              return None

          async def main():
              from playwright.async_api import async_playwright

              all_chain = {p["id"]: [] for p in PROPERTIES}
              addresses = {}

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                      accept_downloads=True,
                  )
                  page = await ctx.new_page()

                  # Stage 1: Search buyer chains (Tinajero + Stevens) for resales
                  for prop in PROPERTIES:
                      print(f"\n=== {prop['id']}: search {prop['buyer']} as GRANTOR ===", flush=True)
                      csvA = await search_acclaim_csv(page, prop["buyer"], "GRANTOR")
                      hits = find_legal_in_csv(csvA, prop["legal_match"]) if csvA else []
                      print(f"  Resale chain hits: {len(hits)}", flush=True)
                      for h in hits[:5]:
                          print(f"    {h.get('RecordDate')} {h.get('DocTypeDescription')} {h.get('CrossPartyName')} ${h.get('Consideration')}", flush=True)
                      all_chain[prop["id"]].extend(hits)

                      # If they sold, search NEXT buyer too
                      next_buyers = list({h.get('CrossPartyName','') for h in hits if h.get('Party')=='From' and h.get('DocTypeDescription')=='DEED'})
                      print(f"  Next buyers: {next_buyers}", flush=True)
                      for nb in next_buyers[:1]:
                          if nb:
                              csvB = await search_acclaim_csv(page, nb, "GRANTOR")
                              hits2 = find_legal_in_csv(csvB, prop["legal_match"]) if csvB else []
                              print(f"  {nb} chain: {len(hits2)} hits", flush=True)
                              for h in hits2[:5]:
                                  print(f"    {h.get('RecordDate')} {h.get('DocTypeDescription')} {h.get('CrossPartyName')} ${h.get('Consideration')}", flush=True)
                              all_chain[prop["id"]].extend(hits2)

                  await browser.close()

              # Save chains
              for pid, chain in all_chain.items():
                  with open(OUT / f"chain_{pid}.json", 'w') as f:
                      json.dump(chain, f, indent=2, default=str)

              # Stage 3: Use Brevard Property Appraiser via known parcel patterns
              # Known: FAIRWAY ESTATES LT 4 BLK E → most likely 977 Miracle Way Rockledge per Ariel
              # MELROSE MANOR UNIT 2 LT 11 BLK C → unknown, must geocode candidate addresses
              # Try Mapbox geocoding of likely candidates
              candidate_addresses = {
                  "fairway":  ["977 Miracle Way, Rockledge, FL 32955"],
                  "melrose":  [
                      "2456 Bonny Drive, Cocoa, FL 32926",
                      # MELROSE MANOR UNIT 2 LT 11 BLK C — also try guesses
                      "2456 Bonny Dr, Rockledge, FL 32955",
                  ],
              }
              for pid, addrs in candidate_addresses.items():
                  print(f"\n=== Geocode {pid} ===", flush=True)
                  for addr in addrs:
                      geo = geocode(addr)
                      if geo:
                          lat, lng = geo
                          print(f"  {addr}: {lat},{lng}", flush=True)
                          addresses[pid] = {"address": addr, "lat": lat, "lng": lng}
                          # Generate 5 aerial views
                          for v in ["close", "3d", "wide", "pure", "neighborhood"]:
                              fetch_mapbox_aerial(lat, lng, pid, v)
                          break
                      else:
                          print(f"  {addr}: geocode failed", flush=True)

              with open(OUT / 'manifest.json','w') as f:
                  json.dump({
                      'chains': all_chain,
                      'addresses': addresses,
                  }, f, indent=2, default=str)
              print(f"\n>>> Done", flush=True)

          asyncio.run(main())
          PY

          # Source mapbox token
          [ -f /tmp/mb.env ] && export $(cat /tmp/mb.env | xargs) || true
          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/d2016/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/d2016/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals_2016
          path: /tmp/results/
          retention-days: 90
