name: Hetzner Run Command
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on Hetzner via SSH'
        required: true
        default: 'docker ps'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute on Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          CMD: ${{ inputs.command }}
          TELEGRAM_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          OUTPUT=$(ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${HETZNER_IP} "$CMD" 2>&1)
          echo "$OUTPUT"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT}" -d "parse_mode=Markdown" \
            --data-urlencode "text=🖥️ *Hetzner*
          \`\`\`
          $(echo "$OUTPUT" | tail -20)
          \`\`\`" > /dev/null
