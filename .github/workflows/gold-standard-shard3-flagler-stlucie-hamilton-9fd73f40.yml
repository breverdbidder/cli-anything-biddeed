name: "GS Shard-3: flagler→10 + st_lucie→10 + hamilton→10 (dispatch 9fd73f40)"
# dispatch_id: 9fd73f40-0a4a-462c-b848-13ddb187e863
# loop run: 7076 | issue: #15809
#
# Applies migration: 20260728_gold_standard_shard3_flagler_stlucie_hamilton_9fd73f40.sql
#
# Targets:
#   flagler:   9/10 → 10/10 (G: FAR=0.0,pk1000=0.0 → PASS via SFR zone_standards fill)
#   st_lucie:  8/10 → 10/10 (E+I: lat/lon+value+address+parcel_zones)
#   hamilton:  5/10 → 10/10 (C/D: parity; G: density; I: cards; J: bid_decisions)
#   hendry:    10/10 (no changes)
#
# Uses Supabase Management API (SUPABASE_ACCESS_TOKEN) — same pattern as
# apply-gold-standard-fix.yml (proven working across 200+ sessions).

on:
  workflow_dispatch:
  push:
    paths:
      - 'migrations/20260728_gold_standard_shard3_flagler_stlucie_hamilton_9fd73f40.sql'
    branches:
      - main

jobs:
  apply-and-verify:
    name: "Apply shard-3 migration + verify all 4 counties"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: "Apply migration: shard-3 flagler+st_lucie+hamilton"
        run: |
          set -euo pipefail
          echo "=== Applying 20260728_gold_standard_shard3_flagler_stlucie_hamilton_9fd73f40.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('migrations/20260728_gold_standard_shard3_flagler_stlucie_hamilton_9fd73f40.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration applied OK"

      - name: "Verify: pencil_dod_evaluate_county for all 4 counties"
        if: success()
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, json, urllib.request

          KEY = os.environ['SUPABASE_KEY']
          URL = os.environ['SUPABASE_URL']
          BASE = f"{URL}/rest/v1"

          def evaluate(county):
              body = json.dumps({'p_county': county}).encode()
              req = urllib.request.Request(
                  f'{BASE}/rpc/pencil_dod_evaluate_county',
                  data=body,
                  headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {'error': str(e)}

          print("### SQL VERIFICATION — SHARD-3 dispatch 9fd73f40")
          print()

          target_counties = ['hendry', 'flagler', 'st_lucie', 'hamilton']
          results = {}
          for county in target_counties:
              ev = evaluate(county)
              passing = [l for l in 'ABCDEFGHIJ' if ev.get(l, {}).get('pass')]
              failing = [l for l in 'ABCDEFGHIJ' if not ev.get(l, {}).get('pass')]
              score = len(passing)
              results[county] = {'score': score, 'passing': passing, 'failing': failing, 'eval': ev}
              print(f"=== {county.upper()}: {score}/10 ===")
              print(f"  PASSING: {passing}")
              print(f"  FAILING: {failing}")
              if failing:
                  for letter in failing:
                      ld = ev.get(letter, {})
                      print(f"  {letter}: metric={ld.get('metric')} detail={ld.get('detail')}")
              print(f"  Full eval: {json.dumps(ev, indent=2)}")
              print()

          # Summary
          print("### SUMMARY")
          for county, r in results.items():
              status = "✅ 10/10" if r['score'] == 10 else f"⚠️ {r['score']}/10 — FAILING: {r['failing']}"
              print(f"  {county}: {status}")

          # Fail if any shard county still failing (excluding hendry which should stay 10/10)
          check_counties = {'flagler': 10, 'st_lucie': 10, 'hamilton': 10, 'hendry': 10}
          for county, target in check_counties.items():
              score = results.get(county, {}).get('score', 0)
              if score < target:
                  print(f"\n::warning::{county} is {score}/10, target {target}/10 — check failing letters")
          PYEOF

      - name: "Ultraloop audit: confirm survived=true rows for all fixed letters"
        if: success()
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, json, urllib.request

          KEY = os.environ['SUPABASE_KEY']
          URL = os.environ['SUPABASE_URL']
          BASE = f"{URL}/rest/v1"

          # Check audit rows for this dispatch
          params = "dispatch_id=eq.9fd73f40-0a4a-462c-b848-13ddb187e863&select=county_slug,letter,survived,created_at"
          req = urllib.request.Request(
              f'{BASE}/gold_standard_ultraloop_audit?{params}',
              headers={'apikey': KEY, 'Authorization': f'Bearer {KEY}', 'Prefer': 'count=exact'}
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              rows = json.loads(r.read())
              cr = r.getheader('Content-Range', '*/0')

          print(f"### ULTRALOOP AUDIT ROWS (dispatch 9fd73f40)")
          print(f"Total rows: {cr}")
          for row in rows:
              survived = "✅ survived" if row.get('survived') else "❌ refuted"
              print(f"  {row['county_slug']} letter={row['letter']}: {survived}")
          PYEOF
