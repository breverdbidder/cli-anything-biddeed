name: One-off — copy CF_API_TOKEN to biddeed-web cloudflare-staging env
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Seal and PUT CF_API_TOKEN into biddeed-web/cloudflare-staging
        env:
          SRC_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT_FULL }}
        run: |
          set -euo pipefail
          if [ -z "${SRC_TOKEN:-}" ]; then echo "::error::CF_API_TOKEN empty on this repo"; exit 1; fi
          if [ -z "${GH_PAT:-}" ]; then echo "::error::GH_PAT_FULL missing (need a PAT with repo scope to write env secrets)"; exit 1; fi
          pip install pynacl --quiet
          REPO_ID=$(curl -sf -H "Authorization: Bearer $GH_PAT" https://api.github.com/repos/breverdbidder/biddeed-web | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          PK=$(curl -sf -H "Authorization: Bearer $GH_PAT" "https://api.github.com/repositories/$REPO_ID/environments/cloudflare-staging/secrets/public-key")
          KEY=$(echo "$PK" | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          KID=$(echo "$PK" | python3 -c 'import sys,json;print(json.load(sys.stdin)["key_id"])')
          ENC=$(KEY="$KEY" python3 - <<'PY'
import os,base64
from nacl import encoding, public
pk = public.PublicKey(os.environ["KEY"].encode(), encoding.Base64Encoder())
print(base64.b64encode(public.SealedBox(pk).encrypt(os.environ["SRC_TOKEN"].encode())).decode())
PY
)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repositories/$REPO_ID/environments/cloudflare-staging/secrets/CF_API_TOKEN" \
            -d "{\"encrypted_value\":\"$ENC\",\"key_id\":\"$KID\"}")
          echo "PUT status: $CODE"
          [ "$CODE" = "201" ] || [ "$CODE" = "204" ] || { echo "::error::PUT failed $CODE"; exit 1; }
          echo "CF_API_TOKEN copied (value never printed)."
