name: "sarasota G+J fix dispatch 222af90c"
# Applies G pk1000_regulated fix + J countywide comps gap filler for sarasota.
# dispatch_id: 222af90c-d69b-4773-bbc4-ee8a1e6d211a
# run: loop run 7622

on:
  workflow_dispatch:

jobs:
  apply-sarasota-gj-fix:
    name: "sarasota G+J fix"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      REF: mocerqjnksmhcjzxrewo
      SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install httpx

      - name: "G FIX: Set pk1000_regulated=false for CN/PID/CT/DTC districts"
        run: |
          set -euo pipefail
          echo "=== Applying G migration: pk1000_regulated=false for 4 sarasota districts ==="
          python3 -c "import json; print(json.dumps({'query': open('migrations/20260731_gold_standard_shard13_sarasota_g_pk1000_usetype_override.sql').read()}))" > /tmp/g_payload.json
          HTTP=$(curl -sS -o /tmp/g_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/g_payload.json)
          echo "HTTP: $HTTP"; cat /tmp/g_resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::G migration failed HTTP $HTTP"; exit 1; }
          echo "G migration OK"

      - name: "Verify G fix: check pk1000_regulated=false on 4 districts"
        run: |
          set -euo pipefail
          python3 -c "
          import json
          q = '''SELECT id, code, pk1000_regulated FROM zoning_districts WHERE id IN (12598, 12335, 12591, 12902) ORDER BY id;'''
          print(json.dumps({'query': q}))
          " > /tmp/g_verify.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/g_verify.json
          echo

      - name: "J FIX: county-wide comps gap filler"
        run: |
          set -euo pipefail
          echo "=== Running J gap filler for 5 low-comp parcels ==="
          python3 scripts/sarasota_gj_dispatch222af90c_apply.py

      - name: "VERIFY: pencil_dod_evaluate_county('sarasota')"
        run: |
          set -euo pipefail
          python3 -c "
          import json
          q = \"SELECT public.pencil_dod_evaluate_county('sarasota');\"
          print(json.dumps({'query': q}))
          " > /tmp/verify.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verify.json
          echo

      - name: "GOLD STANDARD LOOP: per-county evaluation"
        run: |
          set -uo pipefail
          python3 -c "
          import json
          q = \"SELECT public.pencil_dod_evaluate_county('sarasota');\"
          print(json.dumps({'query': q}))
          " > /tmp/gs_eval.json
          curl -sS \
            -X POST \"https://api.supabase.com/v1/projects/${REF}/database/query\" \
            -H \"Authorization: Bearer ${TOKEN}\" \
            -H \"Content-Type: application/json\" \
            --data-binary @/tmp/gs_eval.json || true
          echo "Per-county evaluation complete (failures are non-blocking)"
