name: "MY SHARD-2 Gold Standard Pipeline"

on:
  workflow_dispatch:
    inputs:
      county:
        description: 'County to process'
        required: true
        type: choice
        options:
          - charlotte
          - polk
          - hendry
          - st_lucie
          - holmes
          - all_counties
      verify_metrics:
        description: 'Verify metrics before/after'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run only (no database writes)'
        required: false
        type: boolean
        default: false

env:
  SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co

jobs:
  execute_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour session budget
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install httpx requests
    
    - name: Set up environment
      env:
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
        if [[ -n "$SUPABASE_KEY" ]]; then
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> $GITHUB_ENV
        elif [[ -n "$SUPABASE_SERVICE_KEY" ]]; then
          echo "SUPABASE_KEY=$SUPABASE_SERVICE_KEY" >> $GITHUB_ENV
        else
          echo "No Supabase key found"
          exit 1
        fi
    
    - name: Test database connection
      run: |
        python scripts/my_shard2_verification.py
    
    - name: Execute single county pipeline
      if: ${{ github.event.inputs.county != 'all_counties' }}
      env:
        COUNTY: ${{ github.event.inputs.county }}
        VERIFY_METRICS: ${{ github.event.inputs.verify_metrics }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: |
        if [[ "$DRY_RUN" == "true" ]]; then
          echo "🔍 DRY RUN MODE"
          python scripts/my_shard2_execute_pipeline.py --county "$COUNTY" --dry-run
        elif [[ "$VERIFY_METRICS" == "true" ]]; then
          echo "🎯 EXECUTING WITH METRICS VERIFICATION"
          python scripts/my_shard2_execute_pipeline.py --county "$COUNTY" --verify-metrics
        else
          echo "🚀 EXECUTING WITHOUT METRICS VERIFICATION"
          python scripts/my_shard2_execute_pipeline.py --county "$COUNTY"
        fi
    
    - name: Execute all counties pipeline
      if: ${{ github.event.inputs.county == 'all_counties' }}
      env:
        VERIFY_METRICS: ${{ github.event.inputs.verify_metrics }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: |
        if [[ "$DRY_RUN" == "true" ]]; then
          echo "🔍 DRY RUN MODE - ALL COUNTIES"
          python scripts/my_shard2_execute_pipeline.py --all-counties --dry-run
        elif [[ "$VERIFY_METRICS" == "true" ]]; then
          echo "🎯 EXECUTING ALL COUNTIES WITH METRICS VERIFICATION"
          python scripts/my_shard2_execute_pipeline.py --all-counties --verify-metrics
        else
          echo "🚀 EXECUTING ALL COUNTIES WITHOUT METRICS VERIFICATION"
          python scripts/my_shard2_execute_pipeline.py --all-counties
        fi
    
    - name: Run final verification
      if: ${{ github.event.inputs.dry_run != 'true' }}
      run: |
        echo "📊 FINAL VERIFICATION OF CHANGES"
        python scripts/my_shard2_verification.py
    
    - name: Pipeline summary
      run: |
        echo "✅ MY SHARD-2 PIPELINE EXECUTION COMPLETED"
        echo "County: ${{ github.event.inputs.county }}"
        echo "Verify Metrics: ${{ github.event.inputs.verify_metrics }}"
        echo "Dry Run: ${{ github.event.inputs.dry_run }}"
        echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"