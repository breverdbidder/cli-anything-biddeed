name: Zillow Scrape — 4 Missing

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          mkdir -p /tmp/z
          cat > /tmp/z/scrape.py <<'PY'
          import json, os, re, time, hashlib
          from pathlib import Path
          import urllib.request, urllib.parse
          
          OUT = Path('/tmp/z')
          API_KEY = os.environ['FIRECRAWL_API_KEY'].strip()
          
          # Properties needing real listing photos. Using verified Zillow ZPIDs where known.
          # District ZPID 104102427 = ground truth provided by Ariel.
          # Rainsville ZPID 104107381 = verified earlier.
          # For the 4 missing, try ZPID-by-search first via bare URL redirect.
          PROPERTIES = [
              {"id": "fillmore",   "url": "https://www.zillow.com/homedetails/478-Fillmore-Ave-NE-Palm-Bay-FL-32907/"},
              {"id": "canterbury", "url": "https://www.zillow.com/homedetails/2191-Canterbury-Ln-Melbourne-FL-32935/"},
              {"id": "miracle",    "url": "https://www.zillow.com/homedetails/977-Miracle-Way-Rockledge-FL-32955/"},
              {"id": "robinhood",  "url": "https://www.zillow.com/homedetails/4087-Robinhood-Dr-Melbourne-FL-32935/"},
              # Verify District photos against Ariel's URL while we're at it (verification)
              {"id": "district_verify", "url": "https://www.zillow.com/homedetails/211-District-St-SE-Palm-Bay-FL-32909/104102427_zpid/"},
          ]
          
          def fc_scrape(url):
              payload = json.dumps({
                  "url": url,
                  "formats": ["html", "markdown"],
                  "waitFor": 8000,
                  "timeout": 90000,
                  "onlyMainContent": False,
                  "blockAds": False,
                  "proxy": "stealth",
                  "actions": [
                      {"type": "wait", "milliseconds": 5000},
                      {"type": "scroll", "direction": "down"},
                      {"type": "wait", "milliseconds": 3000},
                      {"type": "scroll", "direction": "down"},
                      {"type": "wait", "milliseconds": 2000},
                  ],
              }).encode()
              req = urllib.request.Request(
                  "https://api.firecrawl.dev/v1/scrape",
                  data=payload,
                  headers={
                      'Content-Type': 'application/json',
                      'Authorization': f'Bearer {API_KEY}',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"    HTTP {e.code}: {e.read()[:300]}", flush=True)
                  return None
              except Exception as e:
                  print(f"    err: {e}", flush=True)
                  return None
          
          def extract_photo_urls(html):
              urls = set()
              if not html: return urls
              # Zillow CDN photos
              for u in re.findall(r'https://photos\.zillowstatic\.com/[a-z]+/[^"\\\s\'<>]+?\.jpg', html):
                  urls.add(u)
              # Also rdcpix (cross-listed Realtor)
              for u in re.findall(r'https://[a-z]{1,4}\.rdcpix\.com/[^"\\\s\'<>]+?\.jpg', html):
                  urls.add(u)
              return urls
          
          def http_download(url, referer):
              UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': referer,
                  'Accept': 'image/avif,image/webp,*/*',
              })
              return urllib.request.urlopen(req, timeout=25)
          
          all_results = {}
          for prop in PROPERTIES:
              print(f"\n=== {prop['id']}: {prop['url'][:90]} ===", flush=True)
              prop_dir = OUT / prop['id']
              prop_dir.mkdir(exist_ok=True)
              
              result = fc_scrape(prop['url'])
              if not result or not result.get('success'):
                  print(f"    Firecrawl failed", flush=True)
                  if result: print(f"    {json.dumps(result)[:200]}", flush=True)
                  continue
              
              data = result.get('data', {})
              html = data.get('html', '')
              md = data.get('markdown', '')
              meta = data.get('metadata', {})
              
              title = meta.get('title','')[:80]
              print(f"    HTML: {len(html)}b | title: {title}", flush=True)
              
              # CRITICAL: verify the page is the right property
              # Check title contains the address keyword
              address_check = {
                  "fillmore": "Fillmore",
                  "canterbury": "Canterbury",
                  "miracle": "Miracle",
                  "robinhood": "Robinhood",
                  "district_verify": "District",
              }
              expected = address_check.get(prop['id'], '')
              title_lower = title.lower()
              md_lower = (md or '')[:1000].lower()
              addr_match = expected.lower() in title_lower or expected.lower() in md_lower
              print(f"    Address match (expected '{expected}'): {addr_match}", flush=True)
              
              if html: (prop_dir / 'page.html').write_text(html, errors='replace')
              if md: (prop_dir / 'page.md').write_text(md, errors='replace')
              if meta: (prop_dir / 'meta.json').write_text(json.dumps(meta, indent=2))
              
              if not addr_match:
                  print(f"    ⚠ TITLE MISMATCH — skipping download (likely wrong property)", flush=True)
                  all_results[prop['id']] = {'url': prop['url'], 'title': title, 'mismatch': True}
                  continue
              
              urls = extract_photo_urls(html)
              urls.update(extract_photo_urls(md))
              print(f"    Found {len(urls)} candidate image URLs", flush=True)
              
              # Dedup by base path keeping largest
              groups = {}
              for u in urls:
                  m = re.match(r'(.+?)([_\-]\d+_\d+)?(\.jpg)$', u)
                  base = m.group(1) if m else u
                  if base not in groups or len(u) > len(groups[base]):
                      groups[base] = u
              best_urls = list(groups.values())
              print(f"    After dedup: {len(best_urls)} unique photos", flush=True)
              
              # Download
              downloaded = []
              for i, url in enumerate(best_urls[:30], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_zillow_{h}.jpg"
                      with http_download(url, prop['url']) as r:
                          data_bytes = r.read()
                      if len(data_bytes) > 8000:
                          (prop_dir / fname).write_bytes(data_bytes)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data_bytes)})
                          print(f"      [{i}] {len(data_bytes)}b -> {fname}", flush=True)
                  except Exception as e:
                      print(f"      [{i}] FAIL: {str(e)[:60]}", flush=True)
              
              all_results[prop['id']] = {
                  'url': prop['url'],
                  'title': title,
                  'urls_found': len(urls),
                  'downloaded': len(downloaded),
                  'files': downloaded,
              }
              time.sleep(1)
          
          with open(OUT / 'manifest.json', 'w') as f:
              json.dump(all_results, f, indent=2, default=str)
          total = sum(r.get('downloaded', 0) for r in all_results.values())
          print(f"\n>>> TOTAL: {total} photos", flush=True)
          PY
          
          python3 /tmp/z/scrape.py 2>&1 | tee /tmp/z/run.log
          echo "---"
          for d in /tmp/z/*/; do
            if [ -d "$d" ]; then
              name=$(basename "$d")
              count=$(ls "$d"*.jpg 2>/dev/null | wc -l)
              echo "  $name: $count files"
            fi
          done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillow_4
          path: /tmp/z/
