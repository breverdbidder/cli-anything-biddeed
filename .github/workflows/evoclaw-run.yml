name: "EvoClaw Benchmark"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - setup
          - launch
          - status
          - results
      repo:
        description: 'Repo to evaluate'
        required: false
        type: choice
        default: ripgrep
        options:
          - ripgrep
          - navidrome
          - scikit-learn
          - dubbo
          - go-zero
          - nushell
          - element-web
      model:
        description: 'Model to use'
        required: false
        type: choice
        default: claude-sonnet-4-6
        options:
          - claude-sonnet-4-6
          - claude-opus-4-6

jobs:
  evoclaw:
    name: "🧪 ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Max 30 min — no more hour-long polling

    steps:
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config << EOF
          Host hz
            HostName ${{ secrets.HETZNER_IP }}
            User root
            IdentityFile ~/.ssh/hetzner
            StrictHostKeyChecking no
          EOF

      # ========================================
      # SETUP: Clone repo, download data, pull images (~15 min)
      # ========================================
      - name: "Setup EvoClaw on Hetzner"
        if: github.event.inputs.action == 'setup'
        run: |
          ssh hz << 'EOF'
          set -euo pipefail
          mkdir -p /opt/evoclaw && cd /opt/evoclaw

          # Clone EvoClaw
          [ -d EvoClaw ] && (cd EvoClaw && git pull) || git clone https://github.com/EvoClaw-Bench/EvoClaw.git
          cd EvoClaw && pip install -e . --break-system-packages 2>/dev/null || pip install -e .

          # HuggingFace dataset
          cd /opt/evoclaw
          if [ ! -d EvoClaw-data ]; then
            which git-lfs || (apt-get update -qq && apt-get install -y -qq git-lfs)
            git lfs install
            git clone https://huggingface.co/datasets/hyd2apse/EvoClaw-data
          else
            echo "Dataset exists"
          fi

          # Claude Code CLI
          export PATH="/root/.local/bin:$PATH"
          which claude || (curl -fsSL https://claude.ai/install.sh | bash)
          echo 'export PATH="/root/.local/bin:$PATH"' >> /root/.bashrc
          claude --version

          echo "✅ Setup complete"
          EOF

      # ========================================
      # LAUNCH: Pull images, write config, start run, EXIT (~10 min)
      # No polling. Fire and forget. $0 GHA waste.
      # ========================================
      - name: "Launch evaluation"
        if: github.event.inputs.action == 'launch'
        run: |
          REPO="${{ github.event.inputs.repo }}"
          MODEL="${{ github.event.inputs.model }}"
          TRIAL="everest_${REPO}_$(date +%Y%m%d_%H%M)"

          # Write OAuth credentials (MAX ONLY — zero API cost)
          if [ -z "${{ secrets.CLAUDE_OAUTH_B64 }}" ]; then
            echo "❌ CLAUDE_OAUTH_B64 is empty. SSH to Hetzner, run 'claude login',"
            echo "   then: base64 -w 0 ~/.claude/.credentials.json"
            echo "   Paste into CLAUDE_OAUTH_B64 secret."
            exit 1
          fi
          echo "${{ secrets.CLAUDE_OAUTH_B64 }}" | base64 -d | \
            ssh hz "mkdir -p /root/.claude && cat > /root/.claude/.credentials.json && chmod 600 /root/.claude/.credentials.json"

          ssh hz << LAUNCHEOF
          set -euo pipefail
          export PATH="/root/.local/bin:\$PATH"

          # SAFETY: Kill any API key env vars
          unset ANTHROPIC_API_KEY UNIFIED_API_KEY OPENAI_API_KEY 2>/dev/null || true

          cd /opt/evoclaw/EvoClaw

          # Pull Docker images for this repo
          echo "Pulling images for: ${REPO}..."
          ./scripts/pull_images.sh --repo ${REPO}

          # Write trial config
          cat > trial_config.yaml << YAML
          data_root: /opt/evoclaw/EvoClaw-data
          trial_name: ${TRIAL}
          agent: claude-code
          model: ${MODEL}
          timeout: 18000
          repos:
            - ${REPO}
          max_parallel: 1
          YAML

          echo "=== Config ==="
          cat trial_config.yaml

          # Ensure python symlink exists
          which python || ln -sf $(which python3) /usr/local/bin/python

          # Launch and EXIT — no polling
          nohup python3 scripts/run_all.py --config trial_config.yaml \
            > /opt/evoclaw/evoclaw_${REPO}.log 2>&1 &

          echo \$! > /opt/evoclaw/evoclaw.pid
          echo ""
          echo "✅ LAUNCHED (PID: \$(cat /opt/evoclaw/evoclaw.pid))"
          echo "📊 Model: ${MODEL}"
          echo "📦 Repo: ${REPO}"
          echo "💰 Cost: \$0 (Claude Max)"
          echo "⏱️  ETA: ~5 hours"
          echo ""
          echo "Check progress: trigger 'status' action"
          LAUNCHEOF

      # ========================================
      # STATUS: Quick check, ~1 min
      # ========================================
      - name: "Check status"
        if: github.event.inputs.action == 'status'
        run: |
          ssh hz << 'EOF'
          echo "=== Process ==="
          if [ -f /opt/evoclaw/evoclaw.pid ]; then
            PID=$(cat /opt/evoclaw/evoclaw.pid)
            kill -0 $PID 2>/dev/null && echo "✅ Running (PID: $PID)" || echo "⏹️ Finished"
          else
            echo "No run found"
          fi

          echo ""
          echo "=== Log (last 30 lines) ==="
          ls -t /opt/evoclaw/evoclaw_*.log 2>/dev/null | head -1 | xargs tail -30 2>/dev/null || echo "No log"

          echo ""
          echo "=== Monitor ==="
          cd /opt/evoclaw/EvoClaw && ./scripts/monitor.sh 2>/dev/null | head -20 || true

          echo ""
          echo "=== Docker ==="
          docker ps --format "table {{.Names}}\t{{.Status}}" 2>/dev/null | head -10

          echo ""
          df -h /
          EOF

      # ========================================
      # RESULTS: Collect final results + send Telegram
      # ========================================
      - name: "Collect results"
        if: github.event.inputs.action == 'results'
        run: |
          RESULT=$(ssh hz << 'EOF'
          echo "=== EvoClaw Results ==="
          cd /opt/evoclaw/EvoClaw

          # Find latest trial
          LATEST=$(ls -td /opt/evoclaw/EvoClaw-data/*/trials/everest_* 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            echo "Trial: $LATEST"
            cat "$LATEST/summary.json" 2>/dev/null | python3 -m json.tool 2>/dev/null | head -60
            echo ""
            cat "$LATEST/summary_filtered.json" 2>/dev/null | python3 -m json.tool 2>/dev/null | head -60
          else
            echo "No completed trials found"
          fi

          echo ""
          echo "=== Full Monitor ==="
          ./scripts/monitor.sh --detail 2>/dev/null || true
          EOF
          )

          echo "$RESULT"

          # Telegram notification
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=🧪 *EvoClaw Results*

          \`\`\`
          ${RESULT:0:3000}
          \`\`\`" || true
