name: "EvoClaw Benchmark"
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - launch
          - status
          - results
      repo:
        description: 'Repo to evaluate'
        required: false
        type: choice
        default: ripgrep
        options:
          - ripgrep
          - navidrome
          - scikit-learn
      model:
        description: 'Model to use'
        required: false
        type: choice
        default: claude-sonnet-4-6
        options:
          - claude-sonnet-4-6
          - claude-opus-4-6
jobs:
  evoclaw:
    name: "🧪 ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config << EOF
          Host hz
            HostName ${{ secrets.HETZNER_IP }}
            User root
            IdentityFile ~/.ssh/hetzner
            StrictHostKeyChecking no
          EOF
      - name: Launch
        if: github.event.inputs.action == 'launch'
        run: |
          REPO="${{ github.event.inputs.repo }}"
          MODEL="${{ github.event.inputs.model }}"
          TRIAL="everest_${REPO}_$(date +%Y%m%d_%H%M)"
          ssh hz << LAUNCH
          set -euo pipefail
          export PATH="/root/.local/bin:/root/.npm-global/bin:\$PATH"
          unset ANTHROPIC_API_KEY UNIFIED_API_KEY 2>/dev/null || true
          
          # Verify Claude Code auth (creds already on server)
          if [ ! -f /root/.claude/.credentials.json ]; then
            echo "FATAL: No Claude Code credentials. Run 'claude login' on server."
            exit 1
          fi
          echo "✅ Claude Code authenticated (Max - \$0 cost)"
          
          cd /opt/evoclaw/EvoClaw
          ./scripts/pull_images.sh --repo ${REPO}
          
          cat > trial_config.yaml << YML
          data_root: /opt/evoclaw/EvoClaw-data
          trial_name: ${TRIAL}
          agent: claude-code
          model: ${MODEL}
          timeout: 18000
          repos:
            - ${REPO}
          max_parallel: 1
          YML
          
          cat trial_config.yaml
          nohup python scripts/run_all.py --config trial_config.yaml > /opt/evoclaw/evoclaw_${REPO}.log 2>&1 &
          echo \$! > /opt/evoclaw/evoclaw.pid
          echo "✅ LAUNCHED PID:\$(cat /opt/evoclaw/evoclaw.pid) Repo:${REPO} Model:${MODEL}"
          LAUNCH
      - name: Status
        if: github.event.inputs.action == 'status'
        run: |
          ssh hz << 'EOF'
          if [ -f /opt/evoclaw/evoclaw.pid ]; then
            PID=$(cat /opt/evoclaw/evoclaw.pid)
            kill -0 $PID 2>/dev/null && echo "✅ Running PID:$PID" || echo "⏹️ Finished"
          fi
          ls -t /opt/evoclaw/evoclaw_*.log 2>/dev/null | head -1 | xargs tail -40 2>/dev/null
          cd /opt/evoclaw/EvoClaw && ./scripts/monitor.sh 2>/dev/null | head -20 || true
          docker ps --format "table {{.Names}}\t{{.Status}}" 2>/dev/null | head -10
          df -h /
          EOF
      - name: Results
        if: github.event.inputs.action == 'results'
        run: |
          RESULT=$(ssh hz << 'EOF'
          cd /opt/evoclaw/EvoClaw
          LATEST=$(ls -td /opt/evoclaw/EvoClaw-data/*/trials/everest_* 2>/dev/null | head -1)
          [ -n "$LATEST" ] && cat "$LATEST/summary.json" 2>/dev/null | python3 -m json.tool | head -80
          ./scripts/monitor.sh --detail 2>/dev/null || true
          EOF
          )
          echo "$RESULT"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=🧪 *EvoClaw Results*
          \`\`\`
          ${RESULT:0:3000}
          \`\`\`" || true
