name: AI Architect Autonomous Bootstrap (PARITY-06 + PARITY-01)
on:
  push:
    branches:
      - ai-architect/autonomous-bootstrap-2026-05-13
  workflow_dispatch: {}
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Bootstrap CC poller + run PARITY-01
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Step 1: Backup existing creds, write fresh from CLAUDE_OAUTH_B64 secret ==="
          $SSH "cp -a /root/.claude/.credentials.json /root/.claude/.credentials.json.bak.$(date +%s) 2>/dev/null; mkdir -p /root/.claude"
          printf '%s' "$OAUTH_B64" | base64 -d | $SSH "cat > /root/.claude/.credentials.json && chmod 600 /root/.claude/.credentials.json && ls -la /root/.claude/.credentials.json"
          if [ $? -ne 0 ]; then
            echo "::error::Failed to write creds to Hetzner"
            exit 1
          fi

          echo ""
          echo "=== Step 2: Test claude -p (REAL API call validates OAuth refresh) ==="
          AUTH_OUT=$($SSH 'export PATH="/root/.local/bin:/root/.npm-global/bin:$PATH"; claude -p "Respond with exactly: OAUTH_LIVE_$(date +%s)" --allowedTools "Bash(*)" 2>&1 | tail -30')
          AUTH_RC=$?
          echo "Auth test output:"
          echo "$AUTH_OUT"
          echo "Auth test rc: $AUTH_RC"

          if ! echo "$AUTH_OUT" | grep -q "OAUTH_LIVE_"; then
            echo "::error::OAuth validation FAILED — refresh token expired or invalid"
            BODY=$(jq -n --arg out "$AUTH_OUT" '{body: ("# AI Architect Autonomous Bootstrap — OAuth refresh failed\n\nThe CLAUDE_OAUTH_B64 secret was written to /root/.claude/.credentials.json on Hetzner. `claude -p` test still failed.\n\n**This means the refresh token inside the secret has rotated/expired** (typical lifespan ~30-60 days; last successful run was 111 days ago).\n\n**Only path forward requires Ariel to tap one Telegram URL:**\n```\ngh workflow run cc-oauth-fix-dispatch.yml -R breverdbidder/cli-anything-biddeed\n```\nThat workflow runs `claude auth login` on Hetzner, captures the OAuth URL, posts it to Telegram. Ariel taps the URL on phone — done. New refresh token is captured into CLAUDE_OAUTH_B64 (or wherever the workflow stores it).\n\nThis is the irreducible HITL floor — OAuth refresh inherently requires the human to authorize in a browser. No automated workaround exists at the OAuth protocol level.\n\n## Auth test output\n```\n" + $out + "\n```")}')
            curl -sS -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/7480/comments \
              -d "$BODY"
            exit 1
          fi

          echo "::notice::OAuth validated"
          curl -sS -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/7480/comments \
            -d "$(jq -n '{body: "✅ AI Architect autonomous bootstrap step 1 PASSED. OAuth validated on Hetzner via claude -p real API call. Proceeding to PARITY-01 execution."}')"

          echo ""
          echo "=== Step 3: Clone scraper repo ==="
          $SSH "mkdir -p /root/parity-01 && cd /root/parity-01 && (test -d brevard-bidder-scraper/.git && cd brevard-bidder-scraper && git fetch && git reset --hard origin/main || git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/brevard-bidder-scraper.git) && cd brevard-bidder-scraper && git config user.email 'ai-architect@biddeed.ai' && git config user.name 'AI Architect Bootstrap'"

          echo ""
          echo "=== Step 4: Run claude -p on PARITY-01 (issue #7479) ==="
          $SSH "cd /root/parity-01/brevard-bidder-scraper && export PATH='/root/.local/bin:/root/.npm-global/bin:\$PATH' GH_PAT='${GH_PAT}' SUPABASE_URL='${SUPABASE_URL}' SUPABASE_SERVICE_ROLE_KEY='${SUPABASE_SERVICE_ROLE_KEY}' && claude -p 'You are working on PARITY-01. Read GitHub issue 7479 in breverdbidder/cli-anything-biddeed using curl with the GH_PAT bearer. Execute the SUMMIT body: connect to Supabase via SUPABASE_URL+SUPABASE_SERVICE_ROLE_KEY (postgrest), update county_auction_config rows for top 10 metros by changing fc_calendar URL params from Zmethod=PREVIEW to Zmethod=CALENDAR. Verify by running one scrape against Broward. Commit changes, push, comment on issue 7479 with results including row counts before/after. Then UPDATE sprint_tasks SET status=completed, completed_at=NOW(), pr_url=<your-pr-url> WHERE id=b9190f73-0e68-4a62-b34a-b997a2f87066 via PostgREST. If you need clarifications, comment on issue 7479 and exit gracefully.' --allowedTools 'Bash(*)' 'Read' 'Write' 'Edit' 2>&1 | tail -2000"

          echo ""
          echo "=== Step 5: Mark PARITY-06 sprint_task complete ==="
          curl -sS -X PATCH -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            "${SUPABASE_URL}/rest/v1/sprint_tasks?id=eq.787a490b-89ec-4ed9-923d-d9245af7987c" \
            -d "{\"status\":\"completed\",\"completed_at\":\"$(date -Iseconds)\",\"pr_url\":\"https://github.com/breverdbidder/cli-anything-biddeed/actions/runs/${GITHUB_RUN_ID}\"}"

          echo "=== BOOTSTRAP COMPLETE ==="
