name: Debug + Fix Coder on Hetzner
on:
  workflow_dispatch:

jobs:
  debug-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH Debug Coder
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 root@$HETZNER_IP 'bash -s' << 'REMOTEOF'
          echo "=== SYSTEM RESOURCES ==="
          free -h
          df -h /
          uptime

          echo "=== DOCKER STATUS ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}" 2>&1

          echo "=== CODER LOGS (last 50) ==="
          docker logs coder-coder-1 --tail 50 2>&1 || echo "no container"

          echo "=== FIND COMPOSE ==="
          find / -maxdepth 3 -name "docker-compose*" 2>/dev/null | head -10

          echo "=== RESTART VIA COMPOSE ==="
          for d in /root/coder /opt/coder /home/coder /root; do
            if [ -f "$d/docker-compose.yml" ] || [ -f "$d/docker-compose.yaml" ]; then
              echo "Using $d"
              cd "$d"
              docker compose down 2>&1 || true
              sleep 5
              docker compose up -d 2>&1 || true
              break
            fi
          done

          echo "=== HEALTH CHECK (2min) ==="
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080 --max-time 3 2>/dev/null)
            if [ "$CODE" != "000" ] && [ "$CODE" != "" ]; then
              echo "Attempt $i: HTTP $CODE — CODER IS UP"
              exit 0
            fi
            [ $((i % 10)) -eq 0 ] && echo "Attempt $i: still waiting..."
            sleep 2
          done

          echo "=== FAILED — DIAGNOSTICS ==="
          docker logs coder-coder-1 --tail 30 2>&1 || true
          docker inspect coder-coder-1 --format '{{.State.ExitCode}} {{.State.Error}}' 2>/dev/null || true
          echo "CODER DID NOT RECOVER"
          exit 1
          REMOTEOF
