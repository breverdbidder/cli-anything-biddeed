name: cc check sessions
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          echo "=== project dirs ==="
          ls -1 /root/.claude/projects/ 2>/dev/null
          echo "=== demo project files ==="
          ls -la /root/.claude/projects/-root-projects-biddeed-demo/ 2>/dev/null || echo "NO demo project dir"
          echo "=== all jsonl last 15 min ==="
          find /root/.claude/projects -name '*.jsonl' -newermt '-15 min' -printf '%p  %s bytes\n' 2>/dev/null
          echo END
          REMOTE
