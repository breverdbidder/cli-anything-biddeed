name: Run SQL Migration
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Migration file path'
        required: true
        default: 'migrations/20260320_multi_county_schema.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node migrations/run_migration.js "${{ inputs.file }}"
