name: Dify call from GHA runner (not Hetzner) — test key + public endpoint
on:
  workflow_dispatch: {}
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Dify via chat.zonewise.ai
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          echo "=== A: DNS resolution from GHA runner ==="
          host chat.zonewise.ai 2>&1 | head -5 || nslookup chat.zonewise.ai 2>&1 | head -5

          echo
          echo "=== B: health / root check ==="
          curl -sS -o /dev/null -w "chat.zonewise.ai/        : HTTP %{http_code} (%{time_total}s)\n" https://chat.zonewise.ai/ -m 10
          curl -sS -o /dev/null -w "chat.zonewise.ai/v1      : HTTP %{http_code}\n" https://chat.zonewise.ai/v1 -m 10
          curl -sS -o /dev/null -w "chat.zonewise.ai/console : HTTP %{http_code}\n" https://chat.zonewise.ai/console -m 10

          echo
          echo "=== C: chat-messages endpoint (blocking mode) ==="
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer ${DIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"inputs":{},"query":"reply with only the literal string GEMINI_VIA_DIFY_OK and nothing else","response_mode":"blocking","user":"summit-smoke"}' \
            -m 45 https://chat.zonewise.ai/v1/chat-messages 2>&1)
          echo "len: ${#RESP}"
          echo "$RESP" | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              if 'answer' in d:
                  print(f\"  SUCCESS: answer={d['answer'][:150]!r}\")
                  print(f\"  model_usage: {d.get('metadata',{}).get('usage',{})}\")
              elif 'code' in d:
                  print(f\"  DIFY_ERROR: code={d.get('code','?')} msg={d.get('message','?')[:200]}\")
              elif 'error' in d:
                  print(f\"  ERROR: {d['error']}\")
              else:
                  print(f'  keys={list(d.keys())[:10]}')
                  print(f'  raw head: {raw[:200]}')
          except Exception as e:
              print(f'  PARSE_ERR: {e}')
              print(f'  raw head: {raw[:300]}')"

          echo
          echo "=== D: completion-messages endpoint (alt API) ==="
          RESP2=$(curl -sS -X POST \
            -H "Authorization: Bearer ${DIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"inputs":{"query":"reply OK"},"response_mode":"blocking","user":"summit-smoke"}' \
            -m 45 https://chat.zonewise.ai/v1/completion-messages 2>&1)
          echo "len: ${#RESP2}"
          echo "$RESP2" | head -c 300
          echo

          echo "=== END ==="
