name: Hetzner Status Check
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          echo "=== UPTIME ==="; $SSH "uptime"
          echo "=== TMUX SESSIONS ==="; $SSH "tmux ls 2>&1 || echo 'no tmux sessions'"
          echo "=== CLAUDE PROCESSES ==="; $SSH "ps -eo pid,etime,pcpu,pmem,cmd | grep -E 'claude|summit|ultraplan' | grep -v grep || echo 'no claude processes'"
          echo "=== SUMMIT WORKDIRS ==="; $SSH "ls -lat /root/ | grep summit | head -20 || echo 'none'"
          echo "=== RECENT LOGS ==="; $SSH "ls -lat /root/.claude/logs/ 2>/dev/null | head -10 || echo 'no logs dir'"
          echo "=== DISK ==="; $SSH "df -h / | tail -1"
          echo "=== MEM ==="; $SSH "free -h | head -2"
