name: "Calendar Sweep — Dark Counties"
# Scrapes upcoming auction listings for dark (zero-count) FL counties via RealTaxDeed / RealForeclosure.
# Extended to 39 counties (v2). DoD uses Supabase REST API only — no Management API.
#
# DOD: SELECT COUNT(DISTINCT county) FROM multi_county_auctions
#      WHERE auction_date >= CURRENT_DATE AND source_platform NOT IN ('propertyonion_orphan','po_api')
#      must return >= 50 (up from 26).
#
# Counties (39): alachua baker bay bradford calhoun citrus clay columbia escambia flagler
#   gadsden gilchrist glades hamilton hardee hendry hernando highlands jackson jefferson
#   lafayette lake leon levy liberty martin monroe okeechobee pasco putnam santa_rosa
#   seminole st_johns st_lucie suwannee taylor union wakulla walton

on:
  workflow_dispatch:
    inputs:
      sale_type:
        description: 'foreclosure | tax_deed | both'
        required: false
        default: 'both'
      dry_run:
        description: 'true = skip upsert, log only'
        required: false
        default: 'false'

concurrency:
  group: calendar-sweep-dark-counties
  cancel-in-progress: false

jobs:
  # ── 1. BUILD MATRIX FROM SSOT + HARDCODED FALLBACKS ─────────────────────────
  setup:
    name: "Build county matrix (39 dark counties)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total:  ${{ steps.gen.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: "Query realauction_subdomains + add fallbacks for counties missing from DB"
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SALE_TYPE_IN: ${{ github.event.inputs.sale_type || 'both' }}
        run: |
          set -euo pipefail

          # 39 dark counties — v2 extended (added columbia, gadsden, glades, hamilton, hardee,
          # jefferson, lafayette, levy, liberty, taylor, union, wakulla vs the prior 30)
          SLUGS="alachua,baker,bay,bradford,calhoun,citrus,clay,columbia,escambia,flagler,gadsden,gilchrist,glades,hamilton,hardee,hendry,hernando,highlands,jackson,jefferson,lafayette,lake,leon,levy,liberty,martin,monroe,okeechobee,pasco,putnam,santa_rosa,seminole,st_johns,st_lucie,suwannee,taylor,union,wakulla,walton"

          STIN="${SALE_TYPE_IN:-both}"
          if [ "$STIN" = "both" ]; then
            ST_FILTER="platform=in.(realforeclose,realtaxdeed)"
          elif [ "$STIN" = "foreclosure" ]; then
            ST_FILTER="platform=eq.realforeclose&sale_type=eq.foreclosure"
          else
            ST_FILTER="platform=eq.realtaxdeed&sale_type=eq.tax_deed"
          fi

          URL="${SUPABASE_URL}/rest/v1/realauction_subdomains?is_active=eq.true&${ST_FILTER}&county_slug=in.(${SLUGS})&select=county_slug,sale_type,platform,base_url"
          curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "$URL" > /tmp/db_resp.json || echo "[]" > /tmp/db_resp.json

          DB_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/db_resp.json'))))" 2>/dev/null || echo 0)
          echo "::notice::DB returned $DB_COUNT rows for the 39-county slug list"

          # build_dark_county_matrix.py: merges DB entries with fallbacks for missing counties
          MATRIX=$(SLUGS="$SLUGS" python3 .github/scripts/build_dark_county_matrix.py)
          TOTAL=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])['include']))" "$MATRIX")
          echo "::notice::Matrix: $TOTAL county+sale_type combos ($DB_COUNT from DB + fallbacks)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          python3 -c "import json,sys; d=json.loads(sys.argv[1]); print('Sample:', d['include'][:3])" "$MATRIX"

  # ── 2. CALENDAR SWEEP (parallel, batch 5) ────────────────────────────────────
  sweep:
    name: "Sweep ${{ matrix.county }}/${{ matrix.sale_type }}"
    needs: setup
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true    # dark counties exit(2); don't fail the whole run
    strategy:
      fail-fast: false
      max-parallel: 5          # rate-limit: 5 concurrent sessions
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests

      - name: "Scrape calendar + preview → upsert to MCA"
        id: sweep
        env:
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY_SLUG:                 ${{ matrix.county }}
          BASE_URL:                    ${{ matrix.base_url }}
          PLATFORM:                    ${{ matrix.platform }}
          SALE_TYPE:                   ${{ matrix.sale_type }}
        run: |
          set -euo pipefail
          echo "=== ${{ matrix.county }} / ${{ matrix.sale_type }} ==="
          echo "  Base URL: ${{ matrix.base_url }}"
          echo "  Platform: ${{ matrix.platform }}"

          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            echo "DRY RUN — skipping script execution"
            exit 0
          fi

          # Retry once on fatal error (exit 1). Dark = exit 2 (continue-on-error).
          EXIT=0; python .github/scripts/calendar_sweep_mca.py || EXIT=$?
          if [ "$EXIT" = "1" ]; then
            echo "  Retrying after 15s..."
            sleep 15
            EXIT=0; python .github/scripts/calendar_sweep_mca.py || EXIT=$?
          fi
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "county=${{ matrix.county }}" >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: "Verify: row count for ${{ matrix.county }}"
        if: steps.sweep.outputs.exit_code == '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          COUNTY="${{ matrix.county }}"
          TODAY=$(date -u +%Y-%m-%d)
          URL="${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.${COUNTY}&auction_date=gte.${TODAY}&select=auction_date,case_number&limit=3"
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "$URL")
          COUNT=$(python3 -c "import json,sys; print(len(json.load(sys.stdin)))" <<< "$RESP")
          echo "### SQL VERIFICATION: ${COUNTY}" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT county, auction_date, case_number FROM multi_county_auctions WHERE county='${COUNTY}' AND auction_date >= '${TODAY}' LIMIT 3;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- rows returned: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::${COUNTY}: $COUNT upcoming rows in MCA"

  # ── 3. DOD VERIFICATION — REST API ONLY (no Management API) ─────────────────
  verify-dod:
    name: "DOD Verification"
    needs: [setup, sweep]
    if: always() && needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "Count distinct counties via REST API"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TODAY: ""
        run: |
          set -euo pipefail
          export TODAY=$(date -u +%Y-%m-%d)

          # dod_rest_check.py: REST only, no Management API
          python3 .github/scripts/dod_rest_check.py > /tmp/dod_result.json

          COUNT=$(python3 -c "import json; print(json.load(open('/tmp/dod_result.json'))['distinct'])")
          TOTAL_ROWS=$(python3 -c "import json; print(json.load(open('/tmp/dod_result.json'))['total_rows'])")
          BREAKDOWN=$(python3 -c "import json; print(json.dumps(json.load(open('/tmp/dod_result.json'))['breakdown'], indent=2))")

          echo "### DOD VERIFICATION" >> "$GITHUB_STEP_SUMMARY"
          printf '```sql\n' >> "$GITHUB_STEP_SUMMARY"
          echo "-- REST: GET /rest/v1/multi_county_auctions?select=county&auction_date=gte.${TODAY}&source_platform=not.in.(...)" >> "$GITHUB_STEP_SUMMARY"
          echo "-- SQL equivalent: SELECT COUNT(DISTINCT county) FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "--   WHERE auction_date >= CURRENT_DATE AND source_platform NOT IN ('propertyonion_orphan','po_api')" >> "$GITHUB_STEP_SUMMARY"
          echo "-- Total rows fetched: $TOTAL_ROWS | Distinct counties: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -ge 50 ] 2>/dev/null; then
            echo "::notice::DOD PASSED: $COUNT distinct counties >= 50 ✅"
            echo "### ✅ DOD PASSED: $COUNT >= 50 counties" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DOD NOT YET MET: $COUNT distinct counties (target >= 50)"
            echo "### ⚠️ DOD NOT MET: $COUNT < 50 counties" >> "$GITHUB_STEP_SUMMARY"
            echo "Some counties may be genuinely dark (no scheduled auctions). Check per-county breakdown." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### Per-county breakdown (39 dark counties)" >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          echo "$BREAKDOWN" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          echo "$BREAKDOWN"
