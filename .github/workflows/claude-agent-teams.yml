name: Claude Code Agent Teams — CI Dossier Sprint
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers for Agent Teams dispatch'
        required: true
        type: string

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then
            echo "::error::Empty issues input"
            exit 1
          fi

  run-agent-teams:
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Validate issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
        run: |
          STATUS=$(curl -s -o /tmp/iss.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/$ISSUE")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Issue #$ISSUE not found"
            exit 1
          fi
          STATE=$(python3 -c "import json; print(json.load(open('/tmp/iss.json'))['state'])")
          [ "$STATE" = "open" ] || { echo "::error::Issue not open"; exit 1; }

      - name: Dispatch Agent Teams spawn on Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          ISSUE: ${{ matrix.issue }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Verify Agent Teams flag ==="
          $SSH "grep -q CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS ~/.claude/settings.json || (echo 'Agent Teams flag missing' && exit 1)"

          echo "=== Verify tmux everest-agents session exists ==="
          $SSH "tmux has-session -t everest-agents || tmux new-session -d -s everest-agents -n lead"

          echo "=== Persist env to Hetzner for claude session ==="
          $SSH "cat > /root/.summit-env << EOF
export SUPABASE_URL='${SUPABASE_URL}'
export SUPABASE_ANON_KEY='${SUPABASE_ANON_KEY}'
export SUPABASE_SERVICE_ROLE_KEY='${SUPABASE_SERVICE_ROLE_KEY}'
export SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}'
export SUPABASE_ACCESS_TOKEN='${SUPABASE_ACCESS_TOKEN}'
export FIRECRAWL_API_KEY='${FIRECRAWL_API_KEY}'
export EXA_API_KEY='${EXA_API_KEY}'
export GEMINI_API_KEY='${GEMINI_API_KEY}'
export GOOGLE_API_KEY='${GOOGLE_API_KEY}'
export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}'
export SUPADATA_API_KEY='${SUPADATA_API_KEY}'
export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'
export MAPBOX_TOKEN='${MAPBOX_TOKEN}'
export GH_PAT='${GH_PAT}'
EOF
chmod 600 /root/.summit-env"

          echo "=== Pull vault for CLAUDE.md bridge + EG14 gate script ==="
          $SSH "cd /root/everest-vault && git pull origin main && cd /root && (test -d cli-anything-biddeed && cd cli-anything-biddeed && git pull) || git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"

          echo "=== Spawn Agent Teams lead for issue ${ISSUE} ==="
          # Build the spawn instruction
          SPAWN_PROMPT='Read GitHub issue #'${ISSUE}' at https://github.com/breverdbidder/cli-anything-biddeed/issues/'${ISSUE}'. Read /root/everest-vault/CLAUDE.md bridge section. Read /root/everest-vault/600-Research/battle-cards/CI-BATTLE-CARD-v5-TEMPLATE-SPEC.md and /root/everest-vault/600-Research/battle-cards/dono-ai-v5-REFERENCE.html as reference. Then create an agent team with 4 teammates: researcher (Phases 1/5/6), playwright (Phases 2/3/8), writer (Phase 4/9/10), qa (Phase 12 using /root/cli-anything-biddeed/scripts/ci-eg14-dossier-gate.py). STRICT SEQUENCING: complete all 195 checkpoints in ci_protocol_checkpoints table with evidence, then run ci-eg14-dossier-gate.py against the synthesized HTML, and ONLY commit the battle card to everest-vault/600-Research/battle-cards/ if verdict=pass. Teammates use Sonnet, you use Opus. Post completion comment on issue '${ISSUE}' with phase-by-phase status and gate verdict. Do NOT push to zonewise-web. Honesty Protocol mandatory: every claim labeled VERIFIED/INFERRED/UNKNOWN.'

          # Send spawn command into tmux session using send-keys
          $SSH "tmux send-keys -t everest-agents:lead 'source /root/.summit-env && cd /root && claude' Enter"
          sleep 5
          $SSH "tmux send-keys -t everest-agents:lead '${SPAWN_PROMPT}' Enter"

          echo "=== Agent Teams spawn dispatched. Poll via ci_protocol_checkpoints. ==="
          echo "Lead agent now running in tmux everest-agents:lead on Hetzner."
          echo "Completion reported to issue #${ISSUE} by lead agent when done."
