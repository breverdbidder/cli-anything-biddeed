name: Claude Code Agent Teams - CI Dossier Sprint
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers for Agent Teams dispatch'
        required: true
        type: string

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then
            echo "::error::Empty issues input"
            exit 1
          fi

  run-agent-teams:
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Validate issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE: ${{ matrix.issue }}
        run: |
          STATUS=$(curl -s -o /tmp/iss.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/$ISSUE")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Issue #$ISSUE not found"
            exit 1
          fi
          STATE=$(python3 -c "import json; print(json.load(open('/tmp/iss.json'))['state'])")
          if [ "$STATE" != "open" ]; then
            echo "::error::Issue not open"
            exit 1
          fi
          echo "Issue #$ISSUE validated"

      - name: Dispatch Agent Teams spawn on Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          ISSUE: ${{ matrix.issue }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Verify Agent Teams flag ==="
          $SSH "grep -q CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS /root/.claude/settings.json && echo flag-present || (echo 'Agent Teams flag missing' && exit 1)"

          echo "=== Verify tmux everest-agents session exists ==="
          $SSH "tmux has-session -t everest-agents 2>/dev/null || tmux new-session -d -s everest-agents -n lead"

          echo "=== Write env file to Hetzner using printf (safe for YAML) ==="
          $SSH "printf 'export SUPABASE_URL=%s\n' '${SUPABASE_URL}' > /root/.summit-env"
          $SSH "printf 'export SUPABASE_ANON_KEY=%s\n' '${SUPABASE_ANON_KEY}' >> /root/.summit-env"
          $SSH "printf 'export SUPABASE_SERVICE_ROLE_KEY=%s\n' '${SUPABASE_SERVICE_ROLE_KEY}' >> /root/.summit-env"
          $SSH "printf 'export SUPABASE_SERVICE_KEY=%s\n' '${SUPABASE_SERVICE_KEY}' >> /root/.summit-env"
          $SSH "printf 'export SUPABASE_ACCESS_TOKEN=%s\n' '${SUPABASE_ACCESS_TOKEN}' >> /root/.summit-env"
          $SSH "printf 'export FIRECRAWL_API_KEY=%s\n' '${FIRECRAWL_API_KEY}' >> /root/.summit-env"
          $SSH "printf 'export EXA_API_KEY=%s\n' '${EXA_API_KEY}' >> /root/.summit-env"
          $SSH "printf 'export GEMINI_API_KEY=%s\n' '${GEMINI_API_KEY}' >> /root/.summit-env"
          $SSH "printf 'export GOOGLE_API_KEY=%s\n' '${GOOGLE_API_KEY}' >> /root/.summit-env"
          $SSH "printf 'export ANTHROPIC_API_KEY=%s\n' '${ANTHROPIC_API_KEY}' >> /root/.summit-env"
          $SSH "printf 'export SUPADATA_API_KEY=%s\n' '${SUPADATA_API_KEY}' >> /root/.summit-env"
          $SSH "printf 'export TELEGRAM_BOT_TOKEN=%s\n' '${TELEGRAM_BOT_TOKEN}' >> /root/.summit-env"
          $SSH "printf 'export TELEGRAM_CHAT_ID=%s\n' '${TELEGRAM_CHAT_ID}' >> /root/.summit-env"
          $SSH "printf 'export MAPBOX_TOKEN=%s\n' '${MAPBOX_TOKEN}' >> /root/.summit-env"
          $SSH "printf 'export GH_PAT=%s\n' '${GH_PAT}' >> /root/.summit-env"
          $SSH "chmod 600 /root/.summit-env && wc -l /root/.summit-env"

          echo "=== Pull vault + cli-anything-biddeed for CLAUDE.md bridge and EG14 gate ==="
          $SSH "cd /root/everest-vault && git pull origin main"
          $SSH "cd /root && if [ -d cli-anything-biddeed ]; then cd cli-anything-biddeed && git pull; else git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git; fi"

          echo "=== Send spawn command into tmux everest-agents:lead ==="
          SPAWN="source /root/.summit-env && cd /root && claude --dangerously-skip-permissions"
          $SSH "tmux send-keys -t everest-agents:lead '${SPAWN}' Enter"
          sleep 8

          echo "=== Send Agent Teams creation prompt ==="
          PROMPT="Read GitHub issue #${ISSUE} body and all comments: curl -s -H 'Authorization: token ${GH_PAT}' https://api.github.com/repos/breverdbidder/cli-anything-biddeed/issues/${ISSUE} and .../${ISSUE}/comments. Read /root/everest-vault/CLAUDE.md Agent Teams Multi-Session Bridge section. Read /root/everest-vault/600-Research/battle-cards/CI-BATTLE-CARD-v5-TEMPLATE-SPEC.md. Then create an agent team with 4 teammates using CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS. Teammates: researcher playwright writer qa (all Sonnet-4-6). You are lead (Opus-4-6). Execute the tasks in the issue body. The issue contains the full agent-team-composition spec. Follow strict sequencing: 195 checkpoints before any battle card, real EG14 gate via /root/cli-anything-biddeed/scripts/ci-eg14-dossier-gate.py before commit. Post completion comment on issue ${ISSUE}."
          $SSH "tmux send-keys -t everest-agents:lead \"$PROMPT\" Enter"

          echo "=== Dispatch complete. Agent Teams running in tmux everest-agents on Hetzner. ==="
          echo "Lead will post completion comment on issue #${ISSUE}."
