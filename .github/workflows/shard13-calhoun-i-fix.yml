name: "SHARD-13 Calhoun I fix: purge re-inserted fabricated parcel_zones"
# dispatch_id: 61ea7d8f-c9ca-401a-80ec-222b16502886
# Applies migration 20260718_shard13_calhoun_i_td_address_relink.sql to
# re-purge any fabricated parcel_zones rows that may have been re-inserted
# since the 20260711g fix, then verifies I metric via pencil_dod_evaluate_county.

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/20260718_shard13_calhoun_i_td_address_relink.sql'

jobs:
  apply-calhoun-i-fix:
    name: "Apply calhoun I fix migration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Apply migration via Supabase Management API"
        run: |
          set -euo pipefail
          SQL=$(cat supabase/migrations/20260718_shard13_calhoun_i_td_address_relink.sql)
          RESP=$(python3 -c "
          import json, os, urllib.request, urllib.error, sys
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260718_shard13_calhoun_i_td_address_relink.sql').read()
          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Content-Type', 'application/json')
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
              result = json.loads(resp.read())
              print(json.dumps(result))
          except urllib.error.HTTPError as e:
            err = e.read().decode()
            print(f'ERROR: {e.code} {err}', file=sys.stderr)
            sys.exit(1)
          ")
          echo "Migration result: $RESP"

      - name: "Verify parcel_zones counts for calhoun"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request, urllib.error, sys
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = '''SELECT source, count(*) as cnt FROM parcel_zones WHERE jurisdiction_id = 922 GROUP BY source ORDER BY source;'''
          body = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(
            'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query',
            data=body, method='POST'
          )
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Content-Type', 'application/json')
          with urllib.request.urlopen(req, timeout=30) as resp:
            result = json.loads(resp.read())
            print('parcel_zones for calhoun (jurisdiction 922):')
            print(json.dumps(result, indent=2))
          "

      - name: "Verify: pencil_dod_evaluate_county calhoun"
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_county": "calhoun"}')
          echo "### SQL VERIFICATION: calhoun" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "BEFORE/AFTER verification:"
          echo "$RESP"
          I_PASS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('I',{}).get('pass',False))")
          I_MET=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('I',{}).get('metric','?'))")
          echo "I: pass=${I_PASS} metric=${I_MET}"
          if [ "$I_PASS" = "True" ]; then
            echo "::notice::Calhoun I PASS (metric=${I_MET})"
          else
            echo "::warning::Calhoun I still FAIL (metric=${I_MET}) — parcel_zones rebuild needed via shard13-calhoun-i-relink.yml"
          fi
