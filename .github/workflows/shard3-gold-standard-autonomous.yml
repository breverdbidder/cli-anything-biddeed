name: SHARD-3 Gold Standard Autonomous Session

on:
  schedule:
    # Daily at 08:00Z (per briefing: 08:00Z wave)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      session_type:
        description: 'Session type'
        required: false
        default: 'autonomous'
        type: choice
        options:
          - autonomous
          - status_only
          - verification_only
      target_counties:
        description: 'Target counties (comma-separated)'
        required: false
        default: 'broward,alachua,lee,st_lucie,jefferson'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SESSION_ID: shard3-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  shard3-autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour budget per briefing
    
    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary  # For direct DB connections if needed
          
      - name: 🗃️ Apply Database Migration
        run: |
          echo "Applying shard-3 migration..."
          python3 -c "
          import httpx, os, sys
          
          # Read migration file
          with open('supabase/migrations/20260615_shard3_gold_standard_setup.sql', 'r') as f:
              migration_sql = f.read()
          
          # Apply via Supabase RPC
          client = httpx.Client(timeout=60)
          headers = {
              'apikey': os.environ['SUPABASE_KEY'],
              'Authorization': f'Bearer {os.environ[\"SUPABASE_KEY\"]}',
              'Content-Type': 'application/json'
          }
          
          try:
              response = client.post(
                  f'{os.environ[\"SUPABASE_URL\"]}/rest/v1/rpc/exec_sql',
                  headers=headers,
                  json={'query': migration_sql}
              )
              
              if response.status_code == 200:
                  print('✅ Migration applied successfully')
              else:
                  print(f'❌ Migration failed: {response.status_code} - {response.text[:500]}')
                  sys.exit(1)
          except Exception as e:
              print(f'❌ Migration error: {e}')
              sys.exit(1)
          "
          
      - name: 📊 Pre-Session Status Check
        id: pre_status
        run: |
          echo "Getting baseline status for shard-3 counties..."
          python3 scripts/shard3_gold_standard.py status > pre_status.log 2>&1
          cat pre_status.log
          
          # Extract pass counts for comparison
          echo "pre_status_captured=true" >> $GITHUB_OUTPUT
          
      - name: 🎯 Execute Autonomous Fixes
        if: github.event.inputs.session_type != 'status_only'
        run: |
          echo "🎯 STARTING SHARD-3 AUTONOMOUS EXECUTION"
          echo "Session ID: $SESSION_ID"
          echo "Counties: broward, alachua, lee, st_lucie, jefferson"
          echo "Budget: 6 hours"
          echo "Ship-to-main mandate: ACTIVE"
          
          # Run the autonomous fixes
          python3 scripts/shard3_autonomous_fixes.py | tee autonomous_fixes.log
          
      - name: 🔍 Post-Session Verification
        id: verification
        run: |
          echo "Running post-session verification..."
          python3 scripts/shard3_gold_standard.py status > post_status.log 2>&1
          cat post_status.log
          
          echo "post_status_captured=true" >> $GITHUB_OUTPUT
          
          # Extract improvements for summary
          echo "=== IMPROVEMENT SUMMARY ===" | tee improvement_summary.log
          echo "Pre-session status:" | tee -a improvement_summary.log
          grep -E "(Score:|letter.*metric)" pre_status.log | tee -a improvement_summary.log || true
          echo "" | tee -a improvement_summary.log
          echo "Post-session status:" | tee -a improvement_summary.log  
          grep -E "(Score:|letter.*metric)" post_status.log | tee -a improvement_summary.log || true
          
      - name: 📋 Generate Session Report
        run: |
          echo "# SHARD-3 AUTONOMOUS SESSION REPORT" > session_report.md
          echo "" >> session_report.md
          echo "**Session ID:** $SESSION_ID" >> session_report.md
          echo "**Counties:** broward, alachua, lee, st_lucie, jefferson" >> session_report.md
          echo "**Started:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> session_report.md
          echo "**Ship-to-main mandate:** ACTIVE" >> session_report.md
          echo "" >> session_report.md
          
          echo "## 🎯 Execution Summary" >> session_report.md
          echo "" >> session_report.md
          if [ -f autonomous_fixes.log ]; then
              echo "### Autonomous Fixes Log" >> session_report.md
              echo "\`\`\`" >> session_report.md
              tail -50 autonomous_fixes.log >> session_report.md
              echo "\`\`\`" >> session_report.md
              echo "" >> session_report.md
          fi
          
          echo "## 📊 Status Comparison" >> session_report.md
          echo "" >> session_report.md
          if [ -f improvement_summary.log ]; then
              echo "\`\`\`" >> session_report.md
              cat improvement_summary.log >> session_report.md
              echo "\`\`\`" >> session_report.md
          fi
          echo "" >> session_report.md
          
          echo "## 🔗 Artifacts" >> session_report.md
          echo "- Pre-session status: [pre_status.log](pre_status.log)" >> session_report.md
          echo "- Post-session status: [post_status.log](post_status.log)" >> session_report.md
          echo "- Execution log: [autonomous_fixes.log](autonomous_fixes.log)" >> session_report.md
          
          cat session_report.md
          
      - name: 💾 Archive Session Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: shard3-session-${{ env.SESSION_ID }}
          path: |
            pre_status.log
            post_status.log
            autonomous_fixes.log
            improvement_summary.log
            session_report.md
          retention-days: 7
          
      - name: 📡 Ship to Main (Per Mandate)
        if: success() && github.ref != 'refs/heads/main'
        run: |
          echo "🚢 SHIP-TO-MAIN MANDATE EXECUTION"
          echo "Current branch: $(git branch --show-current)"
          echo "Target: main"
          
          # Configure git for the action
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if we have any new commits to ship
          git fetch origin main
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD)
          
          if [ "$COMMITS_AHEAD" -gt 0 ]; then
              echo "📦 Shipping $COMMITS_AHEAD commit(s) to main..."
              
              # Create a merge commit to main
              git checkout main
              git pull origin main
              git merge --no-ff ${{ github.sha }} -m "ship: shard-3 gold standard autonomous session ${{ env.SESSION_ID }}

              Autonomous execution completed for counties: broward, alachua, lee, st_lucie, jefferson
              Session artifacts available in action run #${{ github.run_number }}
              
              🤖 Generated with [Claude Code](https://claude.ai/code)
              "
              
              git push origin main
              echo "✅ Successfully shipped to main"
          else
              echo "ℹ️ No new commits to ship"
          fi
          
      - name: 🎯 Session Completion
        if: always()
        run: |
          echo "🎯 SHARD-3 AUTONOMOUS SESSION COMPLETE"
          echo "Session ID: $SESSION_ID"
          echo "Status: ${{ job.status }}"
          echo "Duration: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Per SHIP-TO-MAIN MANDATE:"
          echo "- All changes committed directly to main branch"
          echo "- No PRs created (zero human in loop)"
          echo "- Verification protocol executed"
          echo ""
          echo "Next autonomous session: Tomorrow 08:00Z"