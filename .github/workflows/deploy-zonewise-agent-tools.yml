name: deploy-zonewise-agent-tools
# Issue #108: SUMMIT P0 — Wire Dify zoning agent with 3 tools
#
# Deploys zonewise-agent tool server to Hetzner (port 8319):
#   POST /parcel_lookup    — Supabase parcel lookup by address
#   POST /zoning_lookup    — zoning regulations by zone_code or parcel_id
#   POST /address_normalize — standardize FL address formats
#
# Then creates/wires the Dify agent-chat app with all 3 tools.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy      # deploy tool server + create Dify app
          - tools-only  # deploy tool server only (skip Dify app creation)
          - dify-only   # create/update Dify app only (tool server already running)
          - status      # check service status on Hetzner
          - logs        # tail service logs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Copy tool server to Hetzner
        if: ${{ inputs.action == 'deploy' || inputs.action == 'tools-only' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "tools/zonewise-agent/"
          target: "/opt/zonewise-agent-upload/"
          strip_components: 2

      - name: Install and start zonewise-agent service
        if: ${{ inputs.action == 'deploy' || inputs.action == 'tools-only' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 120s
          script: |
            set -euo pipefail
            echo "=== Install zonewise-agent (port 8319) ==="

            # Move uploaded files into place
            mkdir -p /opt/zonewise-agent
            cp -r /opt/zonewise-agent-upload/. /opt/zonewise-agent/
            rm -rf /opt/zonewise-agent-upload

            # Install Python dependencies
            cd /opt/zonewise-agent
            pip install -r requirements.txt -q

            # Write environment file (secrets never echoed)
            cat > /opt/zonewise-agent/.env << 'ENVEOF'
            SUPABASE_URL=__SUPABASE_URL__
            SUPABASE_KEY=__SUPABASE_KEY__
            ENVEOF
            sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g" /opt/zonewise-agent/.env
            sed -i "s|__SUPABASE_KEY__|${SUPABASE_KEY}|g" /opt/zonewise-agent/.env
            chmod 600 /opt/zonewise-agent/.env

            # Write systemd unit
            cat > /etc/systemd/system/zonewise-agent.service << 'UNITEOF'
            [Unit]
            Description=ZoneWise Agent Tool Server (Dify Custom Tool, port 8319)
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/zonewise-agent
            EnvironmentFile=/opt/zonewise-agent/.env
            ExecStart=/usr/bin/python3 -m uvicorn server:app --host 0.0.0.0 --port 8319
            Restart=always
            RestartSec=5
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            systemctl daemon-reload
            systemctl enable zonewise-agent
            systemctl restart zonewise-agent

            # Wait for startup
            sleep 6

            # Smoke test
            HEALTH=$(curl -sf http://localhost:8319/health 2>/dev/null || echo '{"status":"FAIL"}')
            echo "Health: $HEALTH"
            STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','FAIL'))")
            if [ "$STATUS" != "ok" ]; then
              echo "❌ Health check failed"
              journalctl -u zonewise-agent -n 30 --no-pager
              exit 1
            fi

            echo "✅ zonewise-agent running on port 8319"
            echo "   Tools: parcel_lookup, zoning_lookup, address_normalize"
            echo "   Docs:  http://87.99.129.125:8319/docs"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Create / configure Dify zoning agent app
        if: ${{ inputs.action == 'deploy' || inputs.action == 'dify-only' }}
        run: |
          pip install httpx -q
          python scripts/create_dify_app.py
        env:
          DIFY_HOST: http://87.99.129.125:3100
          DIFY_EMAIL: admin@zonewise.ai
          DIFY_PASSWORD: zonewise2026

      - name: Status check
        if: ${{ inputs.action == 'status' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          script: |
            echo "=== zonewise-agent status ==="
            systemctl status zonewise-agent --no-pager || true
            echo ""
            echo "=== Health check ==="
            curl -sf http://localhost:8319/health | python3 -m json.tool || echo "Not responding"
            echo ""
            echo "=== Port 8319 ==="
            ss -tlnp | grep 8319 || echo "Port 8319 not listening"

      - name: View logs
        if: ${{ inputs.action == 'logs' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          script: |
            journalctl -u zonewise-agent -n 100 --no-pager

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ACTION="${{ inputs.action }}"
          EMOJI="✅"
          [ "$STATUS" != "success" ] && EMOJI="❌"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${EMOJI} zonewise-agent tools (${ACTION}): ${STATUS}
          Issue: #108 — Dify zoning agent Sprint 2
          Host:  87.99.129.125:8319
          Docs:  http://87.99.129.125:8319/docs
          Dify:  http://87.99.129.125:3100" \
            -d parse_mode=HTML || true
