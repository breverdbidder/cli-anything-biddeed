name: "Diagnose Duval notice page + calendar + myeclerk"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet httpx
      - name: Probe notice page body + calendar + myeclerk
        env:
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import httpx, re, os, urllib.parse, urllib.request, http.cookiejar

          HOST  = "https://duval.realforeclose.com"
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          UA    = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36'
          TARGET_CASES = [
              '16-2025-CA-007080-AXXX-MA',
              '16-2025-CA-002503-AXXX-MA',
              '16-2025-CA-006568-AXXX-MA',
          ]

          # ── 0. Unauthenticated PREVIEW (returns calendar) ──────────────────
          fresh = httpx.Client(follow_redirects=True, timeout=30.0, headers={'User-Agent': UA})
          fresh.get(f"{HOST}/index.cfm")
          unauth_pr = fresh.get(f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE=06%2F24%2F2026")
          ua_html = unauth_pr.text
          ua_text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', ua_html)).strip()
          print(f"UNAUTH PREVIEW: HTTP {unauth_pr.status_code}, len={len(ua_html)}")
          print(f"  text[400:1200]: {ua_text[400:1200]!r}")
          # Look for AIDs and auction date entries
          aids_found = re.findall(r'aid="(\d+)"', ua_html)
          date_params = re.findall(r'AUCTIONDATE=([^&"\'> ]+)', ua_html)
          print(f"  AIDs in calendar: {aids_found[:10]}")
          print(f"  AUCTIONDATE params: {date_params[:10]}")
          # Look for June 24 link
          june24 = '06/24/2026' in ua_html or '06%2F24%2F2026' in ua_html or '6/24' in ua_html
          print(f"  June 24 date appears: {june24}")

          # ── 1. Try QUICKSEARCH by case number (unauthenticated) ────────────
          print("\n=== QUICKSEARCH (unauth) ===")
          for case in TARGET_CASES[:2]:
            qs_url = HOST + '/index.cfm?zaction=AUCTION&Zmethod=QUICKSEARCH&searchtxt=' + urllib.parse.quote(case) + '&myaction=SearchByCase'
            qs_r = fresh.get(qs_url)
            qs_html = qs_r.text
            qs_title = re.search(r'<title>([^<]+)</title>', qs_html, re.IGNORECASE)
            qs_text  = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', qs_html)).strip()
            aids = re.findall(r'aid="(\d+)"', qs_html)
            print(f"  case={case}: HTTP {qs_r.status_code}, len={len(qs_html)}, "
                  f"title={qs_title.group(1).strip() if qs_title else 'none'!r}")
            print(f"  aids={aids[:5]}, text[0:300]={qs_text[:300]!r}")

          # ── 2. myeclerk.duvalclerk.com case search ────────────────────────
          print("\n=== myeclerk.duvalclerk.com ===")
          # Try Tyler Odyssey portal URL patterns
          mec = httpx.Client(follow_redirects=True, timeout=30.0, headers={'User-Agent': UA})
          for url_tmpl in [
              'https://myeclerk.duvalclerk.com/cases/search?search=caseNumber&query={case}',
              'https://myeclerk.duvalclerk.com/cases/{case}',
              'https://myeclerk.duvalclerk.com/',
          ]:
              test_case = TARGET_CASES[0]
              url = url_tmpl.format(case=urllib.parse.quote(test_case))
              try:
                  r = mec.get(url, timeout=15.0)
                  title_m = re.search(r'<title>([^<]+)</title>', r.text, re.IGNORECASE)
                  txt = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', r.text)).strip()
                  print(f"  {url}: HTTP {r.status_code}, len={len(r.text)}")
                  print(f"    title={title_m.group(1).strip() if title_m else 'none'!r}")
                  print(f"    text[0:300]: {txt[:300]!r}")
                  # Look for judgment amounts
                  amounts = re.findall(r'\$[\d,]+\.?\d*', r.text)
                  print(f"    dollar amounts: {amounts[:10]}")
              except Exception as e:
                  print(f"  {url}: ERROR {e}")

          # ── 3. casesearch.flcourts.org ────────────────────────────────────
          print("\n=== casesearch.flcourts.org ===")
          fcs = httpx.Client(follow_redirects=True, timeout=30.0, headers={'User-Agent': UA})
          try:
              r0 = fcs.get('https://casesearch.flcourts.org/')
              print(f"  casesearch init: HTTP {r0.status_code}, len={len(r0.text)}")
              # Try case number search
              r1 = fcs.get('https://casesearch.flcourts.org/CaseSearch.aspx?CaseNumber=16-2025-CA-007080-AXXX-MA&County=Duval')
              txt1 = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', r1.text)).strip()
              print(f"  search: HTTP {r1.status_code}, len={len(r1.text)}")
              print(f"  text[0:300]: {txt1[:300]!r}")
          except Exception as e:
              print(f"  casesearch.flcourts.org: ERROR {e}")
          PYEOF
