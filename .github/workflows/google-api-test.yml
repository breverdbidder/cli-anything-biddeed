name: Google API key test — check both keys for generativelanguage access
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test both keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          for KEY_NAME in GEMINI_API_KEY GOOGLE_API_KEY; do
            KEY_VAL="${!KEY_NAME}"
            if [ -z "$KEY_VAL" ]; then
              echo "=== $KEY_NAME: NOT SET ==="
              continue
            fi
            echo "=== $KEY_NAME (len=${#KEY_VAL}) ==="
            RESP=$(curl -sS -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${KEY_VAL}" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"reply only with OK"}]}]}')
            echo "$RESP" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
              if 'error' in d:
                  print(f\"  ERROR {d['error'].get('code','?')}: {d['error'].get('message','?')[:200]}\")
                  print(f\"  status: {d['error'].get('status','?')}\")
              elif 'candidates' in d:
                  txt = d['candidates'][0]['content']['parts'][0]['text'].strip()
                  print(f'  SUCCESS: {txt!r}')
              else:
                  print(f'  UNKNOWN: {list(d.keys())[:5]}')
          except Exception as e:
              print(f'  PARSE_ERR: {e}')
          "
          done

          echo
          echo "=== also test gemini-1.5-flash + gemini-2.5-flash ==="
          for MODEL in gemini-1.5-flash gemini-2.5-flash gemini-2.5-pro; do
            for KEY_NAME in GEMINI_API_KEY GOOGLE_API_KEY; do
              KEY_VAL="${!KEY_NAME}"
              [ -z "$KEY_VAL" ] && continue
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${KEY_VAL}" \
                -H "Content-Type: application/json" \
                -d '{"contents":[{"parts":[{"text":"hi"}]}]}')
              echo "  ${KEY_NAME} + ${MODEL}: HTTP ${CODE}"
            done
          done
