name: bcpao-nal-bulk
# One-shot NAL bulk download: drain all 2713 unbridged Brevard folios in ~2min
# instead of 6h Playwright scraping. Criterion I unblock (24.8% → ≥95%).
#
# Strategy auto: tries BCPAO NAL ZIP first, falls back to DOR Cadastral ALT_KEY.
# Run once; re-runs are idempotent (bridge upsert ignores duplicates).
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "A (NAL ZIP) | B (DOR Cadastral) | auto"
        required: false
        default: "auto"
      bcpao_nal_url:
        description: "Override NAL URL (leave blank for default)"
        required: false
        default: ""

concurrency:
  group: bcpao-nal-bulk
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRATEGY: ${{ github.event.inputs.strategy || 'auto' }}
      BCPAO_NAL_URL: ${{ github.event.inputs.bcpao_nal_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify queue has work
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, json, sys

          sb_url = os.environ['SUPABASE_URL'].rstrip('/')
          sb_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          try:
              req = urllib.request.Request(
                  f'{sb_url}/rest/v1/bcpao_fetch_jobs?status=eq.queued&select=count',
                  headers={'apikey': sb_key, 'Authorization': f'Bearer {sb_key}', 'Prefer': 'count=exact'}
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  total = r.headers.get('content-range', '?/?').split('/')[-1]
                  print(f'bcpao_fetch_jobs queued: {total}')
                  if total == '0':
                      print('Queue empty — nothing to do.')
                      sys.exit(0)
          except Exception as e:
              print(f'Count query failed ({e}), proceeding anyway')
          PYEOF

      - name: Run NAL bulk bridge
        run: python3 scripts/bcpao_nal_bulk.py

      - name: Verify results
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, json, sys

          sb_url = os.environ['SUPABASE_URL'].rstrip('/')
          sb_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def count(table, params=''):
              url = f'{sb_url}/rest/v1/{table}?select=count'
              if params:
                  url += f'&{params}'
              req = urllib.request.Request(
                  url,
                  headers={'apikey': sb_key, 'Authorization': f'Bearer {sb_key}', 'Prefer': 'count=exact'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.headers.get('content-range', '?/?').split('/')[-1]
              except Exception as e:
                  return f'?({e})'

          queued   = count('bcpao_fetch_jobs', 'status=eq.queued')
          done     = count('bcpao_fetch_jobs', 'status=eq.done')
          failed   = count('bcpao_fetch_jobs', 'status=eq.failed')
          bridge   = count('brevard_folio_pin_bridge')
          unbridged_mca = count('multi_county_auctions', "county=eq.brevard&parcel_id=like.%25_______%25&select=count")

          print('=== VERIFICATION ===')
          print(f'bcpao_fetch_jobs   queued={queued}  done={done}  failed={failed}')
          print(f'brevard_folio_pin_bridge total={bridge}')
          print(f'MCA brevard 7-digit parcel_ids remaining: {unbridged_mca}')

          try:
              if int(done) >= 2000:
                  print(f'DoD check PASS: {done} jobs resolved')
              else:
                  print(f'WARNING: only {done} jobs done — expected ~2713', file=sys.stderr)
          except (ValueError, TypeError):
              pass
          PYEOF
