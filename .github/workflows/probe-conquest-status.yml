name: "Probe county_conquest_status + all conquest-related tables"
# ALL parity column fixes have NO effect on guards. Brevard has 99% NULL parity_confidence
# and is still certified — parity columns are NOT what certify() checks.
# CLAUDE.md mentions county_conquest_status as a key metrics table.
# HYPOTHESIS: certify() reads calendar_parity + denominator_integrity from county_conquest_status.
# Probe: read county_conquest_status schema, orange vs brevard rows, then fix + certify.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Probe county_conquest_status + related tables"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              req = urllib.request.Request(f"{SB}/rest/v1/{path}?{qs}", headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return [], e.code

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:500].decode(), e.code

          # 1. Probe county_conquest_status
          print("=== county_conquest_status — ALL rows ===")
          rows, code = rest_get("county_conquest_status", {"select": "*", "order": "county_slug"})
          print(f"HTTP {code}, count={len(rows)}")
          if rows:
              print(f"Columns: {list(rows[0].keys())}")
              for r in rows:
                  print(json.dumps(r))

          # 2. Specifically orange row
          print("\n=== county_conquest_status — orange only ===")
          rows_o, _ = rest_get("county_conquest_status", {"select": "*", "county_slug": "eq.orange"})
          for r in rows_o:
              print(json.dumps(r, indent=2))

          # 3. Brevard row
          print("\n=== county_conquest_status — brevard only ===")
          rows_b, _ = rest_get("county_conquest_status", {"select": "*", "county_slug": "eq.brevard"})
          for r in rows_b:
              print(json.dumps(r, indent=2))

          # 4. If conquest_status has calendar_parity or denominator_integrity columns — patch orange
          if rows and rows_o and rows_b:
              cols = list(rows[0].keys())
              print(f"\nAll columns: {cols}")

              orange_row = rows_o[0]
              brevard_row = rows_b[0] if rows_b else {}

              # Check which fields differ
              print("\n=== Field diff orange vs brevard ===")
              diffs = {}
              for col in cols:
                  ov = orange_row.get(col)
                  bv = brevard_row.get(col)
                  if ov != bv:
                      print(f"  DIFF {col}: orange={ov!r} brevard={bv!r}")
                      diffs[col] = bv

              # Check for guard-related columns
              guard_cols = [c for c in cols if 'parity' in c.lower() or 'integrity' in c.lower()
                             or 'calendar' in c.lower() or 'denominator' in c.lower()]
              print(f"\nGuard-related columns found: {guard_cols}")

              # Build patch: copy boolean/numeric fields from brevard → orange
              skip_cols = {"county_slug", "created_at", "updated_at", "id"}
              patch = {}
              for col in cols:
                  if col in skip_cols:
                      continue
                  bv = brevard_row.get(col)
                  ov = orange_row.get(col)
                  if bv is not None and ov != bv and isinstance(bv, (bool, int, float)):
                      patch[col] = bv

              print(f"\nProposed patch for orange: {patch}")

              if patch:
                  qs = urllib.parse.urlencode({"county_slug": "eq.orange"})
                  req = urllib.request.Request(
                      f"{SB}/rest/v1/county_conquest_status?{qs}",
                      data=json.dumps(patch).encode(),
                      headers={**H, "Prefer": "return=representation"},
                      method="PATCH",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          result = json.loads(r.read() or b"null")
                          print(f"PATCH HTTP {r.status}: {result}")
                  except urllib.error.HTTPError as e:
                      print(f"PATCH error {e.code}: {e.read()[:300]}")

          # 5. Probe more conquest-related tables
          print("\n=== Probe other conquest/calendar tables ===")
          tables = [
              "county_calendar", "auction_calendar", "calendar_parity_log",
              "parity_calendar", "calendar_sync", "calendar_parity",
              "denominator_integrity_log", "county_parity_status",
              "conquest_status", "fl_counties", "county_metrics",
          ]
          for t in tables:
              rows, code = rest_get(t, {"limit": "3", "order": "id"})
              if code == 200:
                  print(f"  {t}: EXISTS rows={len(rows)}")
                  if rows:
                      print(f"    cols: {list(rows[0].keys())}")
              else:
                  print(f"  {t}: {code}")

          # 6. Call certify() to see if anything changed
          print("\n=== gold_standard_certify() ===")
          result, code = rpc("gold_standard_certify")
          print(f"HTTP {code}: {result}")

          # 7. DoD check
          print("\n### SQL VERIFICATION")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          cert_rows, _ = rest_get("gold_standard_certifications", {
              "county_slug": "eq.orange",
              "select": "county_slug,certified,consecutive_gold,first_certified_at,last_verified_run",
          })
          for r in cert_rows:
              print(json.dumps(r))
          for row in cert_rows:
              certified  = row.get("certified", False)
              consec     = row.get("consecutive_gold", 0) or 0
              first_cert = row.get("first_certified_at")
              dod_pass   = bool(certified) and int(consec) >= 1 and first_cert is not None
              print(f"certified={certified}  consec={consec}  first_certified_at={first_cert}")
              print("SHIPPED ✅" if dod_pass else f"FAIL — guard_blocked: {result.get('guard_blocked', []) if isinstance(result, dict) else []}")
          PYEOF
