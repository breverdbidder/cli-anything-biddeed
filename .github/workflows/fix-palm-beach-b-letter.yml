name: Fix Palm Beach B-Letter (Verified Outcomes Pipeline)

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: 'Maximum cases to process'
        required: false
        default: '50'
      force_reprocess:
        description: 'Reprocess cases with existing outcomes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Run weekly to maintain verified outcomes pipeline
    - cron: '0 6 * * 1'  # Monday 6 AM UTC

permissions:
  contents: read

jobs:
  fix-b-letter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --quiet httpx requests beautifulsoup4
      
      - name: Check current B-letter status
        id: check_status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "Checking current B-letter status for palm_beach..."
          
          # Check B-letter status
          resp=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -X POST \
            "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
            -d '{"county_slug_arg": "palm_beach"}')
          
          # Extract B-letter result
          b_pass=$(echo "$resp" | jq -r '.[] | select(.letter == "B") | .pass')
          b_metric=$(echo "$resp" | jq -r '.[] | select(.letter == "B") | .metric') 
          b_details=$(echo "$resp" | jq -r '.[] | select(.letter == "B") | .details')
          
          echo "  palm_beach: B-pass=$b_pass, metric=$b_metric"
          echo "  details: $b_details"
          
          # Check verified outcomes count
          verified_resp=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/foreclosure_outcomes?select=count&county=eq.palm_beach")
          
          verified_count=$(echo "$verified_resp" | jq '.[0].count // 0')
          
          echo "current_b_pass=$b_pass" >> "$GITHUB_OUTPUT"
          echo "current_b_metric=$b_metric" >> "$GITHUB_OUTPUT"
          echo "verified_outcomes_count=$verified_count" >> "$GITHUB_OUTPUT"
          echo "max_cases=${{ github.event.inputs.max_cases || '50' }}" >> "$GITHUB_OUTPUT"
          
          # Determine if we need to run
          if [ "$b_pass" = "false" ] || [ "$verified_count" = "0" ]; then
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Palm Beach B-letter needs fix: pass=$b_pass, verified_count=$verified_count"
          else
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Palm Beach B-letter already passing: pass=$b_pass, verified_count=$verified_count"
          fi
      
      - name: Execute verified outcomes scraper
        if: steps.check_status.outputs.needs_fix == 'true' || github.event.inputs.force_reprocess == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_CASES: ${{ steps.check_status.outputs.max_cases }}
        run: |
          set -euo pipefail
          
          echo "::group::Running Palm Beach verified outcomes scraper"
          echo "Processing up to $MAX_CASES cases..."
          
          python scripts/palm_beach_verified_outcomes.py
          echo "::endgroup::"
      
      - name: Verify B-letter improvement
        if: steps.check_status.outputs.needs_fix == 'true' || github.event.inputs.force_reprocess == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          
          echo "::group::Verifying B-letter improvement"
          
          # Wait for database consistency
          echo "Waiting for database consistency..."
          sleep 15
          
          # Re-check B-letter status
          resp=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -X POST \
            "$SUPABASE_URL/rest/v1/rpc/pencil_dod_evaluate_county" \
            -d '{"county_slug_arg": "palm_beach"}')
          
          b_pass_after=$(echo "$resp" | jq -r '.[] | select(.letter == "B") | .pass')
          b_metric_after=$(echo "$resp" | jq -r '.[] | select(.letter == "B") | .metric')
          
          # Check verified outcomes count after
          verified_resp_after=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/foreclosure_outcomes?select=count&county=eq.palm_beach")
          
          verified_count_after=$(echo "$verified_resp_after" | jq '.[0].count // 0')
          
          echo "Final verification:"
          echo "  B-letter pass: $b_pass_after (was: ${{ steps.check_status.outputs.current_b_pass }})"
          echo "  B-letter metric: $b_metric_after (was: ${{ steps.check_status.outputs.current_b_metric }})"
          echo "  Verified outcomes: $verified_count_after (was: ${{ steps.check_status.outputs.verified_outcomes_count }})"
          
          # Success criteria: either B-letter passes OR verified outcomes count increased
          if [ "$b_pass_after" = "true" ] || [ "$verified_count_after" -gt "${{ steps.check_status.outputs.verified_outcomes_count }}" ]; then
            echo "::notice::✅ Palm Beach B-letter fix successful"
          else
            echo "::warning::⚠️ Palm Beach B-letter may need additional work"
          fi
          
          echo "::endgroup::"
      
      - name: Create summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Palm Beach B-Letter Verified Outcomes Summary
          
          **Issue:** B=null [verified=0 closed_sold=11946] - Zero independent verified outcomes  
          **Goal:** Build independent clerk-source verified outcome pipeline  
          **Canon:** PropertyOnion-derived data_source explicitly forbidden
          
          **Pre-fix Status:**
          - B-letter pass: ${{ steps.check_status.outputs.current_b_pass }}
          - B-letter metric: ${{ steps.check_status.outputs.current_b_metric }}
          - Verified outcomes count: ${{ steps.check_status.outputs.verified_outcomes_count }}
          
          **Fix Applied:** ${{ (steps.check_status.outputs.needs_fix == 'true' || github.event.inputs.force_reprocess == 'true') && '✅ Yes' || '➖ Skipped (already sufficient)' }}
          
          **Pipeline Components:**
          - Palm Beach County Clerk records discovery
          - Case-by-case verified outcome extraction
          - Independent data_source (palm_beach_clerk:*)
          - foreclosure_outcomes table population
          - Gold Standard B-letter verification
          
          **Next Steps:**
          - Pipeline runs weekly to maintain B-letter compliance
          - Expand to process more historical cases as needed
          - Monitor B-letter metrics for sustained improvement
          EOF