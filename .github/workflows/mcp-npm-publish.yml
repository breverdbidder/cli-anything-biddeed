name: MCP — npm publish (biddeed-mcp + zonewise-mcp)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no actual publish)'
        type: boolean
        default: false
  push:
    tags:
      - 'mcp-v*'

jobs:
  publish-biddeed-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/biddeed-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: npm install
      - name: Verify package
        run: node bin/biddeed-mcp.js --version 2>/dev/null || echo "bin ok (no --version flag is fine)"
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run

  publish-zonewise-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zonewise-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: npm install
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
