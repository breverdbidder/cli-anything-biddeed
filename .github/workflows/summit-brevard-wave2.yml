name: Summit Brevard Zoning Wave 2
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [summit-wave2]

jobs:
  wave2:
    name: City GIS probes for remaining 53K parcels
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Execute on Hetzner via Claude Code
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token
            mkdir -p /opt/biddeed
            if [ ! -d /opt/biddeed/cli-anything-biddeed ]; then
              cd /opt/biddeed && git clone "https://${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed && git pull origin main 2>/dev/null || true
            chown -R claude:claude /opt/biddeed

            cat > /tmp/wave2-prompt.txt << 'PROMPT'
            MISSION - Brevard Zoning Wave 2 - Fill remaining 53K parcels with real zoning codes.

            READ FIRST - scripts/summit_brevard_real_zoning.py (Wave 1 script).

            Wave 1 used county Zoning_WKID2881 layer with Shapely STRtree. Results per jurisdiction -
            unincorporated_brevard 51267/75351 (68.7%) 24K gap
            cocoa 20989/29886 (70.2%) 9K gap
            satellite_beach 3245/8525 (38.1%) 5K gap
            cocoa_beach 1669/10841 (15.4%) 9K gap
            malabar 0/1431 incorporated own zoning
            grant_valkaria 0/3067 incorporated own zoning
            melbourne_village 0/318 incorporated own zoning
            palm_shores 0/433 incorporated own zoning

            TASKS in order -

            1. PROBE CITY GIS - For each city with gaps search ArcGIS Online (hub.arcgis.com) and common municipal GIS patterns. Cocoa Beach try https services.arcgis.com search Cocoa Beach FL zoning. Satellite Beach try municipal ArcGIS REST. Malabar check if town publishes zoning shapefiles. For each found download zoning polygons and spatial join like Wave 1.

            2. UNINCORPORATED GAP 24K - Try buffering county zoning polygons 10ft and re-match. Check FLU layer Planning_Development/FLU_WKID2881/MapServer. For remaining unmatched use BCPAO USE_CODE and map to nearest real zone code.

            3. UPSERT to Supabase zoning_assignments with on_conflict=parcel_id. Columns parcel_id zone_code jurisdiction county zone_updated_at. URL and key from env vars SUPABASE_URL SUPABASE_KEY.

            4. TELEGRAM REPORT - Send summary with per-jurisdiction before/after counts. Token and chat ID from env vars.

            5. COMMIT any new scripts to the repo.

            CONSTRAINTS - 10 dollar budget. Batch ops. One attempt per approach. If city GIS not found after 2 probes mark NOT_AVAILABLE and move on.
            PROMPT

            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_KEY='$SUPABASE_SERVICE_KEY'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'
              export GH_PAT='$GH_PAT'
              cd /opt/biddeed/cli-anything-biddeed
              claude --enable-auto-mode -p \"\$(cat /tmp/wave2-prompt.txt)\"
            "
