name: "Deploy CC Auth to Hetzner"
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Deploy credentials to Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          CC_CREDS: ${{ secrets.CLAUDE_CODE_CREDENTIALS }}
          CC_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export SSHPASS="$HETZNER_PASSWORD"
          SSH="sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${HETZNER_IP}"

          # Get CC version on Hetzner
          CC_VER=$($SSH "claude --version 2>/dev/null || echo 'not-installed'")
          echo "CC version on Hetzner: $CC_VER"

          # Write credentials file
          $SSH "mkdir -p ~/.claude && chmod 700 ~/.claude"
          $SSH "cat > ~/.claude/.credentials.json << 'CREDS'
          ${CC_CREDS}
          CREDS"
          $SSH "chmod 600 ~/.claude/.credentials.json"

          # Write .claude.json with onboarding bypass
          $SSH "cat > ~/.claude.json << 'CONFIG'
          {
            \"hasCompletedOnboarding\": true,
            \"lastOnboardingVersion\": \"${CC_VER}\",
            \"oauthAccount\": {}
          }
          CONFIG"

          # Set env var permanently
          $SSH "grep -q CLAUDE_CODE_OAUTH_TOKEN ~/.bashrc || echo 'export CLAUDE_CODE_OAUTH_TOKEN=\"${CC_TOKEN}\"' >> ~/.bashrc"
          $SSH "grep -q CODEDB_NO_TELEMETRY ~/.bashrc || echo 'export CODEDB_NO_TELEMETRY=1' >> ~/.bashrc"

          # Verify
          $SSH "echo '=== VERIFY ===' && cat ~/.claude/.credentials.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f\"Token: {d[\"claudeAiOauth\"][\"accessToken\"][:20]}...\"); print(f\"Type: {d[\"claudeAiOauth\"][\"subscriptionType\"]}\")'"

          echo "✅ CC credentials deployed to Hetzner"
