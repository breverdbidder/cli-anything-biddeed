name: "Deploy CC Auth to Hetzner"
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Deploy credentials
        env:
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
          HOST: ${{ secrets.HETZNER_IP }}
          CC_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CC_CREDS: ${{ secrets.CLAUDE_CODE_CREDENTIALS }}
        run: |
          SSH="sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${HOST}"
          
          echo "=== Testing SSH ==="
          $SSH "echo SSH_OK && hostname" || { echo "SSH failed"; exit 1; }
          
          echo "=== Writing credentials ==="
          $SSH "mkdir -p /root/.claude && chmod 700 /root/.claude"
          echo "$CC_CREDS" | $SSH "cat > /root/.claude/.credentials.json && chmod 600 /root/.claude/.credentials.json"
          
          echo "=== Writing config ==="
          $SSH 'echo "{\"hasCompletedOnboarding\":true,\"oauthAccount\":{}}" > /root/.claude.json'
          
          echo "=== Setting env var ==="
          $SSH "grep -q CLAUDE_CODE_OAUTH_TOKEN /root/.bashrc 2>/dev/null || echo \"export CLAUDE_CODE_OAUTH_TOKEN=\\\"${CC_TOKEN}\\\"\" >> /root/.bashrc"
          
          echo "=== Verifying ==="
          $SSH "cat /root/.claude/.credentials.json | head -c 80 && echo '...'"
          $SSH "claude --version 2>/dev/null || echo 'CC not installed yet'"
          
          echo "✅ CC credentials deployed to Hetzner"
