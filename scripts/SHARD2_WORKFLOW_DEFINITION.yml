# SHARD-2 GOLD STANDARD WORKFLOW DEFINITION
# 
# This file contains the GitHub Actions workflow definition for SHARD-2 automation
# Cannot be created directly in .github/workflows due to GitHub App permissions
# 
# TO DEPLOY: Copy this content to .github/workflows/shard2-gold-standard.yml
# Requires user with workflows permission

name: shard2-gold-standard
# SHARD-2 Gold Standard Campaign: brevard, putnam, flagler, santa_rosa, holmes
# Automated improvements for failing letters using ship-to-main approach

on:
  workflow_dispatch:
    inputs:
      county:
        description: "Target county (brevard/putnam/flagler/santa_rosa/holmes/all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - brevard
          - putnam
          - flagler
          - santa_rosa
          - holmes
      tasks:
        description: "Tasks to run (H,B,F,E or subset)"
        required: false
        default: "H,B,F,E"
        type: string
      verify_only:
        description: "Verification only (no changes)"
        required: false
        default: false
        type: boolean
  schedule:
    # Daily at 06:00Z - before the 08:00Z main fleet launch
    - cron: "0 6 * * *"

concurrency:
  group: shard2-gold-standard
  cancel-in-progress: false

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Always work from main per ship-to-main mandate
          
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install requests httpx
          
      - name: Run SHARD-2 Gold Standard Automation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/shard2_gold_standard_automation.py \
            --county "${{ github.event.inputs.county || 'all' }}" \
            --tasks "${{ github.event.inputs.tasks || 'H,B,F,E' }}" \
            ${{ github.event.inputs.verify_only == 'true' && '--verify-only' || '' }}
            
      - name: Run Staging Mapper (Brevard Priority)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/staging_to_outcomes_mapper.py --county brevard
          
      - name: Verify Results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/verify_shard2_status.py
          
      - name: Commit Improvements (if any)
        if: github.event.inputs.verify_only != 'true'
        run: |
          git config --global user.name 'SHARD-2 Automation'
          git config --global user.email 'actions@github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "SHARD-2 Gold Standard automation improvements
          
          County: ${{ github.event.inputs.county || 'all' }}
          Tasks: ${{ github.event.inputs.tasks || 'H,B,F,E' }}
          Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
          
          Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin main
            echo "✅ Changes committed to main"
          else
            echo "ℹ️ No changes to commit"
          fi