name = "winnerdata-lms"
main = "src/index.js"
compatibility_date = "2026-08-24"
account_id = "83ab3f2fbbabd1a9b01a018fb4efe219"

# workers_dev=true: the CF_API_TOKEN available to this repo's GHA runners can
# read the zone (Zone:Read) but returns "Authentication error" (code 10000)
# on every DNS record read/write call -- confirmed live 2026-09-01, and NOT
# specific to this Worker: ff.winnerdataai.com (workers/winnerdata-ff, routed
# the same way) is STILL NXDOMAIN via Cloudflare's own DoH resolver despite
# .github/workflows/ff-winnerdata-dns-fix.yml's 2026-08-30 commit message
# claiming it was fixed. The token needs Zone:DNS:Edit added before
# lms.winnerdataai.com (or ff.winnerdataai.com) can resolve. Until then, the
# workers.dev URL below is the only reachable live endpoint -- the [[routes]]
# binding stays declared so it activates automatically once DNS is fixed.
workers_dev = true

[[routes]]
pattern = "lms.winnerdataai.com/*"
zone_name = "winnerdataai.com"

# Issue #20033 scope item 6: re-probe each connected platform's token every
# 6h so the /connections tiles flip (Needs re-auth / Connected / unhealthy)
# without a human refreshing anything. See scheduled() in src/index.js.
[triggers]
crons = ["0 */6 * * *"]

# No [vars] — all seven values this Worker needs (SUPABASE_URL,
# SUPABASE_SERVICE_KEY, SUPABASE_ANON_KEY, LMS_AUTH_USER, LMS_AUTH_PASS,
# LMS_SUPABASE_AUTH_EMAIL, LMS_SUPABASE_AUTH_PASSWORD) are real secrets set via
# `wrangler secret put` in the deploy workflow, never written here. The last
# two (added 2026-09-02, issue #19745) are a dedicated Supabase Auth identity
# used ONLY to mint a real user JWT for the FF batch approve action — see
# rpcAsAuthenticatedAdmin() in src/index.js.
#
# SECURITY FIX (2026-09-01, same-day follow-up): v1 embedded the Supabase
# anon key as a source constant (winnerdata-ff's pattern) and granted the
# lms_* RPCs EXECUTE to `anon`. Because this repo is public, that let anyone
# call those RPCs directly against Supabase with no auth at all. Fixed by
# revoking `anon` EXECUTE on all seven lms_* functions (service_role/postgres
# keep it — see supabase/migrations/20260901c_winnerdata_lms_revoke_anon_execute.sql)
# and switching this Worker to SUPABASE_SERVICE_KEY as a real secret. The
# data-access boundary is now the RPCs' service_role-only grant, not just
# org_id-in-the-request-body; the human-access boundary is still HTTP Basic
# Auth via LMS_AUTH_USER/LMS_AUTH_PASS.
#
# Issue #20033: seven MORE secrets are set the same way (GH secret ->
# `wrangler secret put`), all OPTIONAL -- absence just leaves that platform's
# /connections tile "Not configured", never a placeholder value (intent
# guardrail #7): META_APP_ID, META_APP_SECRET, TIKTOK_CLIENT_KEY,
# TIKTOK_CLIENT_SECRET, X_API_KEY, X_API_SECRET, TYPEFULLY_API_KEY. These are
# static per-app credentials Ariel creates once with each platform, distinct
# from the per-connect OAuth tokens (meta_page_access_token, tiktok_access_
# token, x_access_token, ...) which live in the Supabase vault, never here.
