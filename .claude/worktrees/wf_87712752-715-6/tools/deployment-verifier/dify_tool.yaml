openapi: 3.0.0
info:
  title: deployment-verifier
  description: >
    Headless Chromium deployment verifier for ZoneWise.AI.
    Verifies URLs using Playwright: HTTP status, load time, Next.js hydration,
    CSS selector presence, screenshots. Returns structured failure signals and
    triggers auto-repair via Gemini Flash + GitHub Issues.
  version: 1.0.0

servers:
  - url: http://87.99.129.125:8318
    description: Hetzner deployment-verifier service

paths:
  /verify:
    post:
      operationId: verifyDeployment
      summary: Verify a deployment URL
      description: >
        Launches headless Chromium to verify a URL. Checks HTTP status,
        load time (<8s), Next.js hydration (__NEXT_DATA__), optional CSS
        selectors, and captures a screenshot. Returns structured signals
        for any detected failures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: Full URL to verify (e.g. https://zonewise.ai/chat-v2)
                  example: https://zonewise.ai/chat-v2
                selectors:
                  type: string
                  description: >
                    Comma-separated CSS selectors to check for presence.
                    Example: "#thread-container,.message-thread"
                  example: "#thread-container,.message-thread"
                screenshot:
                  type: boolean
                  description: Capture a screenshot (default true)
                  default: true
                persist:
                  type: boolean
                  description: Write result to Supabase deployment_checks table
                  default: true
      responses:
        "200":
          description: Verification result with signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "422":
          description: Invalid request

  /verify/chat-v2:
    post:
      operationId: verifyChatV2
      summary: Verify zonewise.ai/chat-v2 (pre-configured)
      description: >
        Pre-configured verify for zonewise.ai/chat-v2.
        Checks Thread selector (#thread-container, .message-thread).
        No parameters required.
      responses:
        "200":
          description: Verification result for chat-v2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"

  /health:
    get:
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service is running

components:
  schemas:
    SignalSummary:
      type: object
      properties:
        signal_type:
          type: string
          enum:
            - http_error
            - slow_load
            - build_error
            - selector_missing
            - hydration_failure
            - cdn_miss
            - playwright_error
            - healthy
        severity:
          type: string
          enum: [critical, warning, info]
        message:
          type: string
        evidence:
          type: string
        auto_repairable:
          type: boolean

    VerifyResponse:
      type: object
      properties:
        url:
          type: string
        status:
          type: string
          enum: [pass, fail, error]
        http_code:
          type: integer
        load_ms:
          type: number
        checks_passed:
          type: integer
        checks_failed:
          type: integer
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalSummary"
        screenshot_path:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        verified_at:
          type: string
          format: date-time
