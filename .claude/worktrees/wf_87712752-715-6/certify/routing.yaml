# CERTIFY ROUTER — static reference config
# Live tunables (floors, shadow_audit_rate, min_tier) live in certify_router_config table.
# Edit this file for structural changes; edit the DB table for operational tuning.

version: "1.0"

# Non-negotiable invariant
invariant: >
  Certification authority lives with the DETERMINISTIC GATE.
  LLM tiers are a defense-in-depth anomaly screen.
  No model tier can emit certify=true.
  Every cert row: authority='gate'.

# T0 — deterministic gate (authoritative)
gate:
  function: pencil_dod_evaluate_county
  pass_threshold: 10               # all 10 letters must pass
  letters: [A, B, C, D, E, F, G, H, I, J]
  critical_three: [B, I, J]
  on_fail: skip_screens_route_opus  # FAIL skips T1/T2, goes straight to Opus diagnosis

# T1 — Haiku anomaly screen
t1_haiku:
  model: claude-haiku-4-5-20251001
  role: anomaly_screen             # clean|escalate; CANNOT certify
  confidence_floor_key: haiku_confidence_floor   # read from DB
  default_floor: 0.90
  on_clean_above_floor: certify_under_gate_authority
  on_below_floor: escalate_to_sonnet
  on_parse_fail: escalate          # malformed JSON always escalates

# T2 — Sonnet deeper screen
t2_sonnet:
  model: claude-sonnet-4-6
  role: anomaly_screen             # clean|escalate; CANNOT certify
  confidence_floor_key: sonnet_confidence_floor
  default_floor: 0.85
  on_clean_above_floor: certify_under_gate_authority
  on_below_floor: escalate_to_opus
  on_parse_fail: escalate

# T3 — Opus review (diagnosis + fix authorship + adjudication)
t3_opus:
  model: claude-opus-4-8
  role: diagnosis_and_adjudication
  triggered_by:
    - gate_fail
    - sonnet_escalation
    - novel_error_signature
    - shadow_audit_sample
  output: diagnosis_text           # structured text, not a cert verdict

# Shadow audit (self-correcting quality proof)
shadow_audit:
  rate_key: shadow_audit_rate       # read from DB
  default_rate: 0.10               # 10% of cheap-path certs re-certified with Opus
  model: claude-opus-4-8
  on_disagreement:
    raise_rate_to: 0.25
    lower_floors_by: 0.05
    set_min_tier: sonnet
    alert: sentinel

# Screen response contract
screen_response:
  required_fields: [verdict, confidence, reason]
  verdict_enum: [clean, escalate]
  confidence_range: [0.0, 1.0]
  on_malformed: escalate           # NEVER treat malformed as clean

# Cost model (USD per 1M tokens, for telemetry)
cost_model:
  haiku_input_per_m:   0.80
  haiku_output_per_m:  4.00
  sonnet_input_per_m:  3.00
  sonnet_output_per_m: 15.00
  opus_input_per_m:    15.00
  opus_output_per_m:   75.00
  # Estimated tokens per screen call
  screen_tokens_in:  800
  screen_tokens_out: 200

# Anomaly flags the screen must check
screen_anomalies:
  - "B metric > 100% (denominator_integrity violation)"
  - "pass_count=10 but critical_three B/I/J not all TRUE"
  - "J metric >95% with deal_complete_count=0"
  - "H metric=0 (freshness hours) — likely NULL coalesced to 0"
  - "All letters pass but total_closed=0 (denominator_integrity)"
  - "calendar_parity mismatch: C/D metrics inconsistent (C>D impossible)"
  - "adversarial_7d: pass_count=10 but no ultraloop audit rows for this county"
  - "rowcount_integrity: metric >100 (percentage > 100%)"
