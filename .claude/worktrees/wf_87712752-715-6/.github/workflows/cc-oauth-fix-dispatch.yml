name: CC OAuth Fix + Auto-Dispatch
on:
  workflow_dispatch:
    inputs:
      summit_issue:
        description: 'Issue to dispatch after OAuth is fixed'
        required: false
        default: '286'

jobs:
  fix-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fix CC OAuth on Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUMMIT_ISSUE: ${{ inputs.summit_issue }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${HETZNER_IP}"

          echo "=== Step 1: Check Claude Code ==="
          $SSH "which claude && claude --version 2>&1 || echo 'NOT_INSTALLED'" 2>/dev/null
          
          echo "=== Step 2: Install/update Claude Code ==="
          $SSH "npm list -g @anthropic-ai/claude-code 2>/dev/null || npm install -g @anthropic-ai/claude-code@latest" 2>/dev/null
          
          echo "=== Step 3: Check current auth ==="
          AUTH_STATUS=$($SSH "claude auth status 2>&1" 2>/dev/null || true)
          echo "$AUTH_STATUS"
          
          if echo "$AUTH_STATUS" | grep -q "Logged in"; then
            echo "Already logged in! Dispatching SUMMIT..."
            curl -s -X POST \
              -H "Authorization: token ${GH_PAT}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/claude-code-direct.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"issues\":\"${SUMMIT_ISSUE}\"}}"
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" -d "parse_mode=Markdown" \
              --data-urlencode "text=✅ *CC OAuth ALIVE* — SUMMIT #${SUMMIT_ISSUE} dispatched!"
            exit 0
          fi
          
          echo "=== Step 4: Force login — capture URL ==="
          # Method 1: unbuffer + script for TTY
          LOGIN_RAW=$($SSH "script -qfec 'claude auth login 2>&1' /dev/null" 2>/dev/null || true)
          echo "Raw output (hex-safe):"
          echo "$LOGIN_RAW" | cat -v | head -20
          
          # Extract URL — handle ANSI escape codes
          URL=$(echo "$LOGIN_RAW" | sed 's/\x1b\[[0-9;]*m//g' | grep -oP 'https://claude\.ai[^\s\x00-\x1f]*' | head -1)
          
          if [ -z "$URL" ]; then
            # Method 2: Try different login command
            LOGIN_RAW2=$($SSH "TERM=dumb claude auth login 2>&1" 2>/dev/null || true)
            echo "Method 2 raw:"
            echo "$LOGIN_RAW2" | cat -v | head -20
            URL=$(echo "$LOGIN_RAW2" | sed 's/\x1b\[[0-9;]*m//g' | grep -oP 'https://[^\s\x00-\x1f]+' | head -1)
          fi
          
          if [ -z "$URL" ]; then
            # Method 3: Non-interactive
            LOGIN_RAW3=$($SSH "claude auth login --non-interactive 2>&1" 2>/dev/null || true)
            echo "Method 3 raw:"
            echo "$LOGIN_RAW3" | cat -v | head -20
            URL=$(echo "$LOGIN_RAW3" | sed 's/\x1b\[[0-9;]*m//g' | grep -oP 'https://[^\s\x00-\x1f]+' | head -1)
          fi
          
          if [ -n "$URL" ]; then
            echo "FOUND URL: $URL"
            # Send to Telegram
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" -d "parse_mode=Markdown" \
              --data-urlencode "text=🔐 *CC OAuth Login*
          
          Tap this link to authenticate Claude Code on Hetzner:
          
          ${URL}
          
          After you tap, SUMMIT #${SUMMIT_ISSUE} auto-dispatches in 60s."
            
            echo "=== Step 5: Wait for auth (polling 60s) ==="
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$($SSH "claude auth status 2>&1" 2>/dev/null || true)
              if echo "$STATUS" | grep -q "Logged in"; then
                echo "AUTH SUCCESS after ${i}x5s!"
                
                # Auto-dispatch SUMMIT
                curl -s -X POST \
                  -H "Authorization: token ${GH_PAT}" \
                  -H "Content-Type: application/json" \
                  "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/claude-code-direct.yml/dispatches" \
                  -d "{\"ref\":\"main\",\"inputs\":{\"issues\":\"${SUMMIT_ISSUE}\"}}"
                
                curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${CHAT_ID}" -d "parse_mode=Markdown" \
                  --data-urlencode "text=✅ *CC OAuth FIXED!* SUMMIT #${SUMMIT_ISSUE} dispatched."
                exit 0
              fi
              echo "  Poll $i: waiting..."
            done
            
            echo "Timeout — user didn't tap link"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=⏰ OAuth timeout. Re-run workflow and tap the link within 60s."
          else
            echo "NO URL CAPTURED from any method"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=❌ CC OAuth — no login URL captured. Claude Code may need reinstall on Hetzner."
          fi
