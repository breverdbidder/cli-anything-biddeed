name: "SHARD-6 Dixie County Daily Scrape"
# Wires scripts/shard6_dixie_scraper.py to a schedule. Previously this
# script existed but was never called by any workflow — the exact
# WIRING MANDATE gap ("code that is not SCHEDULED is dead code") that
# left dixie's criterion-H (freshness) failing with no automatic refresh.
#
# Dixie County has no online auction platform: foreclosure sales are
# in-person at the courthouse, tax deed sales are listed on
# dixieclerk.com. This scrapes both pages live — no synthetic fallback.

on:
  schedule:
    # Daily at 05:45 UTC
    - cron: '45 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: shard6-dixie-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: "Dixie County Clerk Scraper (dixieclerk.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet httpx beautifulsoup4

      - name: Run Dixie clerk scraper
        run: |
          set -euo pipefail
          python3 scripts/shard6_dixie_scraper.py 2>&1 | tee /tmp/dixie_scrape.log

      - name: Post summary
        if: always()
        run: |
          echo "## SHARD-6 Dixie County Daily Scrape" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/dixie_scrape.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
