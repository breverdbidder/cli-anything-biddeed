name: "SUMMIT: County Expansion CC Session"
on:
  workflow_dispatch:

jobs:
  cc-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start Claude Code on Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP << 'SSHEOF'
          set -e

          # Setup
          cd /home/claude || mkdir -p /home/claude && cd /home/claude
          
          # Clone or update repo
          if [ -d "cli-anything-biddeed" ]; then
            cd cli-anything-biddeed && git pull origin main
          else
            git clone https://github.com/breverdbidder/cli-anything-biddeed.git
            cd cli-anything-biddeed
          fi
          
          # Install deps
          pip install httpx --break-system-packages 2>/dev/null || true
          
          echo "=== Starting County Expansion ==="
          echo "Phase 1: FL GIO Ingestion"
          
          # Set secrets from env
          export SUPABASE_URL="https://mocerqjnksmhcjzxrewo.supabase.co"
          
          # Run ingestion (reads SUPABASE_KEY from GitHub secrets via .env or direct)
          # Claude Code will pick up CLAUDE.md and execute the full pipeline
          
          echo "Repo ready. Claude Code session should be started manually:"
          echo "  cd /home/claude/cli-anything-biddeed"
          echo "  claude 'Read CLAUDE.md County Expansion section. Execute Phases 1-5 for Orange (48) and Duval (16).'"
          
          SSHEOF
          
          echo "✅ Hetzner repo updated. Start CC session manually or via Remote Control."
