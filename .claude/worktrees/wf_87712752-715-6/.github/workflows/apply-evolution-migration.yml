name: Apply Evolution Migration (Issue #67)
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pg
      - name: Apply skill_evolution tables
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node - <<'EOF'
          const { Client } = require("pg");
          const fs = require("fs");

          const pw = process.env.SUPABASE_KEY;
          if (!pw) { console.error("SUPABASE_KEY not set"); process.exit(1); }

          const hosts = [
            "aws-0-us-west-2.pooler.supabase.com",
            "aws-0-us-east-1.pooler.supabase.com",
          ];
          const ports = [6543, 5432];
          const user = "postgres.mocerqjnksmhcjzxrewo";

          async function main() {
            let client, connected = false;
            for (const host of hosts) {
              for (const port of ports) {
                client = new Client({ host, port, user, password: pw, database: "postgres", ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 8000 });
                try {
                  await client.connect();
                  console.log("Connected: " + host + ":" + port);
                  connected = true; break;
                } catch (err) {
                  console.log("FAIL " + host + ":" + port + " => " + err.message.substring(0, 60));
                  try { await client.end(); } catch(e) {}
                }
              }
              if (connected) break;
            }
            if (!connected) { console.error("All connections failed"); process.exit(1); }

            const sql = fs.readFileSync("migrations/20260330_skill_evolution.sql", "utf8");
            const stmts = sql.split(";").map(s => s.trim()).filter(s => s.length > 5 && !s.startsWith("--"));

            console.log("Running", stmts.length, "statements...");
            let ok = 0, skip = 0, fail = 0;
            for (const stmt of stmts) {
              try {
                await client.query(stmt);
                console.log("  OK: " + stmt.substring(0, 80).replace(/\n/g, " "));
                ok++;
              } catch(err) {
                if (err.message.includes("already exists") || err.message.includes("duplicate")) {
                  console.log("  SKIP (exists): " + stmt.substring(0, 60).replace(/\n/g, " "));
                  skip++;
                } else {
                  console.log("  FAIL: " + stmt.substring(0, 80).replace(/\n/g, " "));
                  console.log("    => " + err.message.substring(0, 100));
                  fail++;
                }
              }
            }
            console.log("\nResult: " + ok + " ok, " + skip + " skipped, " + fail + " failed");

            // Verify tables exist
            const r = await client.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'skill_evolution%' ORDER BY table_name");
            console.log("Tables found:", r.rows.map(r => r.table_name).join(", "));
            await client.end();
            process.exit(fail > 0 ? 1 : 0);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF
