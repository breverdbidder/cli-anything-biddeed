name: CodeSearch Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Install Node deps
        run: npm install pg

      - name: Run CodeSearch migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          export PGSSLMODE=require
          PROJECT_REF="mocerqjnksmhcjzxrewo"

          echo "=== Trying Supabase connection patterns ==="
          SUCCESS=0

          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE_CONN=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE_CONN"
            if psql "$CONN" -c "SELECT 1" > /dev/null 2>&1; then
              echo "Connected! Running codesearch migration..."
              psql "$CONN" -f migrations/20260329_codesearch.sql
              echo ""
              echo "=== Verifying tables ==="
              psql "$CONN" -c "
                SELECT 'code_repos' AS tbl, COUNT(*) AS rows FROM code_repos
                UNION ALL
                SELECT 'code_chunks', COUNT(*) FROM code_chunks;
              "
              echo ""
              echo "=== Also running platform skills eval migration ==="
              psql "$CONN" -f migrations/20260328_platform_skills_eval.sql || echo "platform_skills migration: check above for errors"
              psql "$CONN" -c "
                SELECT 'skills_eval_results' AS tbl, COUNT(*) AS rows FROM skills_eval_results
                UNION ALL
                SELECT 'skills_adoption_log', COUNT(*) FROM skills_adoption_log;
              " || true
              echo "VERIFIED: All migrations complete."
              SUCCESS=1
              break
            fi
          done

          if [ "$SUCCESS" = "0" ]; then
            echo ""
            echo "ERROR: All connection attempts failed."
            echo ""
            echo "BLOCKER: SUPABASE_DB_PASSWORD secret is stale or incorrect."
            echo "To fix:"
            echo "  1. Go to Supabase Dashboard → Settings → Database → Reset Password"
            echo "  2. gh secret set SUPABASE_DB_PASSWORD --body 'new_password' --repo breverdbidder/cli-anything-biddeed"
            echo "  3. Re-dispatch this workflow"
            exit 1
          fi
