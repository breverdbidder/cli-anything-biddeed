name: RealAuction Multi-County Scraper

on:
  workflow_dispatch:
    inputs:
      county_slug:
        required: true
      county_domain:
        description: 'Domain without https:// (e.g. bay.realforeclose.com)'
        required: true
      auction_date:
        required: true
      platform:
        description: 'realforeclose or realtaxdeed'
        required: false
        default: 'realforeclose'
      sale_type:
        description: 'foreclosure or tax_deed'
        required: false
        default: 'foreclosure'
      max_pages:
        required: false
        default: '15'
      section_area:
        description: 'C = closed/canceled, R = running/upcoming'
        required: false
        default: 'C'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - name: Scrape county
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          COUNTY_SLUG: ${{ github.event.inputs.county_slug }}
          BASE_URL: https://${{ github.event.inputs.county_domain }}
          PLATFORM: ${{ github.event.inputs.platform }}
          SALE_TYPE: ${{ github.event.inputs.sale_type }}
          AUCTION_DATE: ${{ github.event.inputs.auction_date }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          SECTION_AREA: ${{ github.event.inputs.section_area }}
        run: python .github/scripts/scrape_realauction_county.py

      - name: Promote historical tier1 cards to MCA
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c "
          import json, os, urllib.request
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          county = '${{ github.event.inputs.county_slug }}'.lower()
          sql = f'''
          SELECT biddeed.flow_card_to_mca(id) AS result
          FROM pipeline.tier1_card_raw
          WHERE county_slug = '{county}'
            AND auction_date < current_date
          ORDER BY id;
          '''
          url = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          payload = json.dumps({'query': sql}).encode()
          req = urllib.request.Request(url, data=payload, method='POST')
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Content-Type', 'application/json')
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  rows = json.loads(resp.read())
                  results = [r.get('result','') for r in rows]
                  updated = sum(1 for r in results if r and r.startswith('updated'))
                  inserted = sum(1 for r in results if r and r.startswith('inserted'))
                  skipped = sum(1 for r in results if r and r.startswith('skip'))
                  print(f'{county}: promoted {len(rows)} historical cards: updated={updated} inserted={inserted} skipped={skipped}')
          except Exception as e:
              print(f'WARN: promote step failed: {e} (non-fatal)')
          "

