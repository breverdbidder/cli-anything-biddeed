name: "Summit: CompetitorLens S3 — Foreclosure.com + Diff Reports"
on:
  workflow_dispatch: {}

jobs:
  s3-second-target:
    name: "S3: Foreclosure.com Search UI + Diff Reports + Preview Deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute S3 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,FIRECRAWL_API_KEY,DEEPSEEK_API_KEY
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed
            echo "Last 5 commits:"
            git log --oneline -5

            echo "=== [5/6] Claude Code — CompetitorLens S3 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'
              export FIRECRAWL_API_KEY='$FIRECRAWL_API_KEY'
              export DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'MISSION: CompetitorLens Agent #14 — Sprint 3 (Second Target + Diff Reports).

              STEP 0 — READ CONTEXT
              cat docs/plans/COMPETITORLENS-SPEC.md
              cat CLAUDE.md
              ls -la harnesses/competitorlens/
              cat harnesses/competitorlens/cli_anything.competitorlens.py | head -100

              CONTEXT: S1 (crawl+extract+Supabase) and S2 (UX analyzer+JSX generator+BrandGuard)
              are DONE. AuctionCalendar.jsx from PropertyOnion is generated and passing BrandGuard.
              42/42 eval assertions passing.

              SPRINT 3 TASKS (from spec Section 5):

              S3.1 — Crawl Foreclosure.com search interface
              - Target URL: https://www.foreclosure.com/
              - Use existing Firecrawl crawl.py pipeline
              - Extract the search/filter UI patterns: multi-filter search, interactive map,
                property cards with photos/price/beds/baths/status badges, save/track/export
              - Store in competitor_analyses table

              S3.2 — Generate PropertySearchGrid.jsx
              - Use existing analyze.py + generate.py pipeline
              - BidDeed.AI house brand: Navy #1E3A5F, Orange #F59E0B, Inter font, bg #020617
              - Data binding to Supabase auction data (historical_auctions or similar)
              - ADD BidDeed.AI intelligence layers:
                * ML Deal Score per property (replacing simple listing display)
                * Max bid calculation display (ARV formula)
                * Lien discovery status indicator (clean/risky/unknown)
                * Direct link to county auction platform
              - Submit to BrandGuard for validation — must PASS

              S3.3 — Diff Report generator (diff_report.py)
              - Create side-by-side comparison: competitor original vs BidDeed.AI version
              - Highlight UX improvements we added (ML scores, zoning, lien data)
              - Output: reports/competitor-diff-{name}.md
              - Generate for BOTH PropertyOnion and Foreclosure.com

              S3.4 — UX Pattern Library
              - Extract reusable patterns from both competitors into ux_pattern_library table
              - Patterns like: auction-calendar-grid, multi-filter-search, property-card,
                status-badge-system, map-cluster-view
              - Each pattern: name, source_competitor, description, implementation_notes

              S3.5 — Preview deployment
              - Both AuctionCalendar.jsx and PropertySearchGrid.jsx renderable
              - Verify components render with mock data at minimum
              - If Vercel preview is available, deploy there

              S3.6 — Integration tests
              - Add 15+ assertions to eval/eval.json covering full pipeline
              - Test: crawl -> extract -> analyze -> generate -> validate -> diff report
              - All existing 42 assertions must still pass

              RULES:
              1. Commit after EACH task — never batch
              2. git config user.email ci@biddeed.ai and user.name BidDeed-CI
              3. Git remote: https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              4. Push to main after each commit
              5. Commit messages: feat(competitorlens): S3.{N} - {description}
              6. If context hits 50%, commit and push what you have
              7. NEVER-LIE: Do not claim PropertySearchGrid.jsx passes BrandGuard unless
                 it actually does. Report exact scores and any violations.
              8. Send Telegram on completion:
                 curl -s -X POST \"https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage\" \
                   -d chat_id=\"\${TELEGRAM_CHAT_ID}\" \
                   -d text=\"CompetitorLens S3 DONE: Foreclosure.com crawled, PropertySearchGrid.jsx generated, BrandGuard status: [PASS/BLOCK], diff reports for both targets, UX pattern library populated. Eval: [X/Y] assertions passing.\"
              9. COST DISCIPLINE: \$10 session max.

              GO. Execute S3.1 through S3.6.'
            "

            echo "=== [6/6] Done ==="
