name: zw density worker
on:
  workflow_dispatch:
    inputs:
      limit:
        description: pending rows to process
        required: false
        default: "8"
jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: run worker on hetzner
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SVC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set +e
          SB_URL="https://mocerqjnksmhcjzxrewo.supabase.co"
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          KEY=$(curl -s -X POST "$SB_URL/rest/v1/rpc/get_router_gemini_key" -H "apikey: $SVC" -H "Authorization: Bearer $SVC" -H "Content-Type: application/json" -d '{}' | tr -d '"')
          if [ ${#KEY} -lt 20 ]; then echo "ERR key fetch len=${#KEY}"; exit 1; fi
          echo "key ok len ${#KEY}; python: $($SSH 'python3 --version 2>&1')"
          echo "" | base64 -d > /tmp/worker.py
          $SSH "SB_URL='$SB_URL' SVC='$SVC' GKEY='$KEY' LIMIT='${LIMIT:-8}' python3 -" < /tmp/worker.py
          echo "=== worker step exit $? ==="
