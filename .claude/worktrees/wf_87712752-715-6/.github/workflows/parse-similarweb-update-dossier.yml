name: "Parse Apify SimilarWeb JSON → backfill ci_dossiers.traffic_intelligence"

on:
  workflow_dispatch:
    inputs:
      dossier_date:
        required: true
        default: "2026-05-27"

jobs:
  parse-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Fetch + parse + UPDATE both targets"
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATE: ${{ github.event.inputs.dossier_date }}
        run: |
          set -e
          python3 <<'PYEOF'
          import json, os, urllib.request, urllib.error
          sb = os.environ['SB_URL']
          k  = os.environ['SB_KEY']
          d  = os.environ['DATE']
          H  = {'apikey': k, 'Authorization': f'Bearer {k}'}

          def fetch_json(slug):
              url = f"{sb}/storage/v1/object/ci-evidence/dossiers/{slug}/{d}/similarweb-apify-{slug}.json"
              req = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def extract(item):
              """Extract canonical structure from mscraper similarweb-quick-scraper response."""
              eng = item.get('Engagments') or item.get('Engagements') or {}
              if not isinstance(eng, dict): eng = {}
              top = item.get('TopCountryShares') or item.get('topCountryShares') or []
              if isinstance(top, list):
                  geo = [{'country': c.get('CountryCode') or c.get('Country') or c.get('country'),
                          'share': c.get('Value') or c.get('share')} for c in top[:10]]
              else:
                  geo = []
              ts = item.get('TrafficSources') or item.get('trafficSources') or {}
              return {
                  '_marker': 'VERIFIED',
                  '_source': 'apify_mscraper_similarweb_quick_scraper_2026_05_27',
                  'global_rank': item.get('GlobalRank') or item.get('globalRank'),
                  'country_rank': item.get('CountryRank') or item.get('countryRank'),
                  'category_rank': item.get('CategoryRank') or item.get('categoryRank'),
                  'category': item.get('Category') or item.get('category'),
                  'monthly_visits': eng.get('Visits') or eng.get('visits'),
                  'bounce_rate': eng.get('BounceRate') or eng.get('bounceRate'),
                  'pages_per_visit': eng.get('PagePerVisit') or eng.get('pagePerVisit'),
                  'avg_visit_duration_seconds': eng.get('TimeOnSite') or eng.get('timeOnSite'),
                  'top_countries': geo,
                  'traffic_sources': {
                      'direct': ts.get('Direct'),
                      'search': ts.get('Search'),
                      'social': ts.get('Social'),
                      'referrals': ts.get('Referrals'),
                      'paid_referrals': ts.get('Paid Referrals') or ts.get('PaidReferrals'),
                      'mail': ts.get('Mail')
                  },
                  'snapshot_month': item.get('SnapshotDate') or item.get('snapshotDate'),
                  'raw_keys_present': sorted(list(item.keys()))[:30]
              }

          for slug in ['rentcast', 'dealcheck']:
              try:
                  raw = fetch_json(slug)
              except Exception as e:
                  print(f"FETCH_FAIL {slug}: {e}")
                  continue
              # Apify returns either a list of items or a single item; normalize
              item = raw[0] if isinstance(raw, list) and raw else (raw if isinstance(raw, dict) else None)
              if not item:
                  print(f"EMPTY {slug}")
                  continue
              extracted = extract(item)
              print(f"=== {slug} ===")
              print(json.dumps(extracted, indent=2, default=str))

              # Merge into traffic_intelligence (preserve existing app_store_metrics + user_base)
              # Use Postgres JSONB || via PATCH with computed value
              patch_url = f"{sb}/rest/v1/ci_dossiers?competitor_slug=eq.{slug}"
              # Get existing
              get_req = urllib.request.Request(patch_url+"&select=traffic_intelligence", headers=H)
              with urllib.request.urlopen(get_req, timeout=20) as r:
                  existing = json.loads(r.read().decode())[0].get('traffic_intelligence') or {}
              existing['similarweb'] = extracted
              body = json.dumps({'traffic_intelligence': existing}).encode()
              hdrs = {**H, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'}
              req = urllib.request.Request(patch_url, data=body, method='PATCH', headers=hdrs)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"✓ UPDATED ci_dossiers.{slug}.traffic_intelligence.similarweb [{r.status}]")
              except urllib.error.HTTPError as e:
                  print(f"✗ UPDATE failed {slug} [{e.code}]: {e.read().decode()[:300]}")
          PYEOF
          echo "::notice::Apify SimilarWeb data parsed and merged into ci_dossiers.traffic_intelligence for both targets"
