name: Sprint 5A — Deploy Claw UI + Backend
on:
  workflow_dispatch:

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone claw-code
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/breverdbidder/claw-code.git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        working-directory: claw-code/ui
        env:
          VITE_DIFY_URL: http://87.99.129.125:3100
          VITE_DIFY_KEY: ${{ secrets.DIFY_API_KEY }}
          VITE_API_URL: https://claw-api.zonewise.ai
        run: |
          npm install
          npm run build
          echo "Build output:"
          ls -la dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: claw-code/ui
        run: |
          npm install -g wrangler
          
          # Create project if not exists
          wrangler pages project create claw-zonewise --production-branch main 2>/dev/null || true
          
          # Deploy
          DEPLOY_OUT=$(wrangler pages deploy dist/ --project-name claw-zonewise --branch main 2>&1)
          echo "$DEPLOY_OUT"
          
          # Extract URL
          DEPLOY_URL=$(echo "$DEPLOY_OUT" | grep -oP 'https://[^ ]+\.pages\.dev' | head -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "Deployed to: $DEPLOY_URL"

      - name: Setup DNS — claw.zonewise.ai
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ZONE_ID="b32406b78aaaefd55557d77c843a5940"
          
          # Check if CNAME already exists
          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=claw.zonewise.ai&type=CNAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          
          RECORD_COUNT=$(echo "$EXISTING" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('result',[])))")
          
          if [ "$RECORD_COUNT" = "0" ]; then
            echo "Creating CNAME record..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"claw","content":"claw-zonewise.pages.dev","proxied":true}' | python3 -c "import json,sys; r=json.load(sys.stdin); print('DNS created' if r.get('success') else f'DNS error: {r}')"
          else
            echo "CNAME already exists, updating..."
            RECORD_ID=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"claw","content":"claw-zonewise.pages.dev","proxied":true}' | python3 -c "import json,sys; r=json.load(sys.stdin); print('DNS updated' if r.get('success') else f'DNS error: {r}')"
          fi
          
          echo "Verifying DNS..."
          sleep 5
          dig claw.zonewise.ai +short || nslookup claw.zonewise.ai || true

      - name: Verify UI is live
        run: |
          sleep 15
          for url in "https://claw.zonewise.ai" "https://claw-zonewise.pages.dev"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$url" --max-time 15 2>/dev/null)
            echo "$url: HTTP $CODE"
          done

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy server.py to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Write deploy script
          cat > /tmp/deploy-claw-backend.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          echo "=== Deploying Claw Code Backend ==="
          
          # Clone or update claw-code
          if [ -d /opt/claw-code ]; then
            cd /opt/claw-code && git pull origin main 2>&1
          else
            git clone https://github.com/breverdbidder/claw-code.git /opt/claw-code 2>&1
          fi
          
          cd /opt/claw-code
          
          # Install deps
          pip3 install httpx 2>/dev/null || true
          
          # Create systemd service
          cat > /etc/systemd/system/claw-code.service << 'SVC'
          [Unit]
          Description=Claw Code API Server
          After=network.target
          
          [Service]
          Type=simple
          WorkingDirectory=/opt/claw-code
          ExecStart=/usr/bin/python3 -m python.server
          Restart=always
          RestartSec=5
          Environment=PYTHONPATH=/opt/claw-code
          Environment=PORT=8000
          
          [Install]
          WantedBy=multi-user.target
          SVC
          
          systemctl daemon-reload
          systemctl enable claw-code
          systemctl restart claw-code
          sleep 3
          
          # Verify
          STATUS=$(systemctl is-active claw-code)
          echo "Service status: $STATUS"
          
          HEALTH=$(curl -s http://127.0.0.1:8000/api/health --max-time 5 2>/dev/null || echo "failed")
          echo "Health: $HEALTH"
          
          if [ "$STATUS" = "active" ]; then
            echo "BACKEND DEPLOYED SUCCESSFULLY"
          else
            echo "=== Service logs ==="
            journalctl -u claw-code --no-pager -n 20 2>&1
            echo "BACKEND DEPLOYMENT FAILED"
            exit 1
          fi
          SCRIPT
          
          chmod +x /tmp/deploy-claw-backend.sh
          
          # Try SCP + SSH with retries (fail2ban may have cleared)
          for attempt in 1 2 3; do
            echo "SSH attempt $attempt..."
            if scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ConnectTimeout=10 /tmp/deploy-claw-backend.sh root@$HETZNER_IP:/tmp/deploy-claw-backend.sh 2>/dev/null; then
              ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 root@$HETZNER_IP 'bash /tmp/deploy-claw-backend.sh'
              exit $?
            fi
            echo "SSH attempt $attempt failed, waiting 30s..."
            sleep 30
          done
          
          echo "WARNING: Could not SSH to Hetzner — fail2ban may still be active"
          echo "Backend deployment deferred. UI deployment proceeds."
          exit 0
