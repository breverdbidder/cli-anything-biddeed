name: close-stale-190
on:
  workflow_dispatch:
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 190,
              body: `## Root Cause Fixed (commit \`3000bd35\`)

**Root cause**: \`git pull origin main --ff-only\` in Preflight step 1 fails when the local Hetzner repo has commits from prior sessions that weren't pushed (git push had no credentials). With \`set -e\` active, this kills the step → GHA run fails → 3+ consecutive failures = P1.

**Chain**: session commits log file → push fails silently (\`|| true\`) → next run's \`--ff-only\` fails → GHA fail loop.

**Fix applied**:
- Step 1: \`git fetch origin main && git reset --hard origin/main\` (handles diverged state)
- Step 3: configured git remote with GH_PAT before push (prevents future diverge)

YAML valid ✅ | Pushed to main ✅`
            });
            await github.rest.issues.update({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 190,
              state: 'closed'
            });
