name: "Summit: DesignWise S1.5 — Fix Critical UI Bugs"
on:
  workflow_dispatch: {}

jobs:
  bugfix:
    name: "Fix 7 CRITICAL bugs on zonewise-web"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute Bug Fixes on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "=== [1/6] Setup claude user ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Update Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3

            echo "=== [3/6] Setup auth token ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Clone/Pull zonewise-web ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/zonewise-web" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/zonewise-web.git"
            fi
            cd /opt/biddeed/zonewise-web
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/zonewise-web
            echo "Repo ready at $(pwd)"

            echo "=== [5/6] Run Claude Code ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'

              cd /opt/biddeed/zonewise-web

              claude --print --dangerously-skip-permissions \
                'You are executing Sprint 1 Task S1.5 — Fix CRITICAL UI Bugs on zonewise-web.

              READ CLAUDE.md first. Then read DESIGN.md (the master design system) and docs/plans/DESIGNWISE-SPEC.md.

              BRAND RULES (from DESIGN.md):
              - Navy: #1E3A5F (primary)
              - Orange: #F59E0B (accent/CTA)
              - Background: #020617 (slate-950)
              - Font: Inter ONLY (via next/font). JetBrains Mono for code only.
              - No font below 11px.

              FIX THESE 7 CRITICAL BUGS:

              1. DELETE /public/demo.html (standalone HTML file outside Next.js)
                 CREATE /app/demo/page.tsx — a proper Next.js route
                 Port the demo animation into a React component that:
                 - Uses ONLY brand colors from DESIGN.md (no #F5A623, #080A0D, #0F1117 etc)
                 - Uses Inter font (not Syne, not DM Sans)
                 - Has play/pause/replay controls (not auto-play only)
                 - Shares the same navbar and footer as all other pages
                 - Minimum font size 11px everywhere
                 - The 298-KPI report section with 4 categories and score rings

              2. FIX /kpis page — the KPI data never loads
                 Ensure KPIs render server-side or with proper loading states
                 Should show all 298 KPIs organized by the 17 categories
                 If data source is missing, create a static JSON file with KPI definitions

              3. FIX /explorer — currently returns 404 in a 200 response
                 Either: create a proper /explorer page OR redirect to /app
                 The landing page CTA links here — it MUST work

              4. ADD consistent navbar to ALL pages via layout.tsx
                 Nav items: How It Works, 298 KPIs, Live Demo, Pricing, Sign In, Get Started
                 Use brand colors: bg var(--color-surface), border-bottom 1px var(--color-border)

              5. ADD consistent footer to ALL pages
                 Include: ZoneWise.AI, copyright, Terms/Privacy/Disclaimer links

              6. FIX Terms/Privacy pages: remove duplicate year
                 Change \"ZoneWise.AI 2026\" to just \"ZoneWise.AI\" where it appears twice
                 Change \"© 2026 ZoneWise.AI 2026\" to \"© 2026 ZoneWise.AI\"

              7. CREATE /app route as the main split-screen shell
                 Left panel: 380px chat panel (placeholder for now)
                 Right panel: flex-1 map/content area (placeholder for now)
                 Proper responsive behavior at 768px breakpoint

              ALSO:
              - Create a lab branch: git checkout -b lab && git push origin lab
                This enables the lab.zonewise.ai Vercel branch deploy
              - Ensure all pages pass basic color/font checks against DESIGN.md

              GIT CONFIG:
              git config user.email ci@biddeed.ai
              git config user.name BidDeed-CI
              git remote set-url origin https://x-access-token:\${GH_PAT}@github.com/breverdbidder/zonewise-web.git

              Create a feature branch: git checkout -b fix/designwise-critical-bugs
              Commit after each fix. Push the branch. Then merge to main:
              git checkout main && git merge fix/designwise-critical-bugs && git push origin main

              Then create the lab branch from main:
              git checkout -b lab && git push origin lab

              When done:
              curl -s -X POST https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage -d chat_id=\${TELEGRAM_CHAT_ID} -d text=\"✅ DesignWise S1.5 COMPLETE. 7 critical UI bugs fixed on zonewise-web. Lab branch created. demo.html deleted, /demo /kpis /explorer /app all working with brand colors.\"
              '
            "

            echo "=== [6/6] Session complete ==="
