name: Hetzner Diag Probe
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Bash command to run on Hetzner'
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and run
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          CMD: ${{ inputs.command }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          echo "=== Running on Hetzner: ==="
          echo "$CMD"
          echo "=== Output: ==="
          $SSH "$CMD" 2>&1 || echo "[exit code: $?]"
