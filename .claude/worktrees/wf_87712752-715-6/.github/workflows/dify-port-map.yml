name: Dify port mapping — find which host port maps to dify nginx
on:
  workflow_dispatch: {}
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SSH
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== ALL docker containers with ports ==="
          $SSH 'docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -30'

          echo
          echo "=== All listening TCP sockets ==="
          $SSH 'ss -tlnp 2>/dev/null | head -20'

          echo
          echo "=== Host nginx vhost config (not dify) ==="
          $SSH 'ls /etc/nginx/sites-enabled/ 2>/dev/null; echo "---"; cat /etc/nginx/sites-enabled/* 2>/dev/null | head -50'

          echo
          echo "=== dify nginx container config paths ==="
          $SSH 'docker ps --format "{{.Names}}" | xargs -I {} sh -c "echo \"=== {} ===\"; docker exec {} sh -c \"nginx -T 2>/dev/null\" 2>/dev/null | head -20" 2>/dev/null | head -60'

          echo
          echo "=== Direct call to dify-api container IP:5001/v1 with DIFY key ==="
          API_IP=$($SSH 'docker inspect docker-api-1 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); nets=d[0][\"NetworkSettings\"][\"Networks\"]; print(list(nets.values())[0][\"IPAddress\"])"')
          echo "API container IP: $API_IP"
          RESP=$($SSH "curl -sS -X POST \
            -H 'Authorization: Bearer ${DIFY_API_KEY}' \
            -H 'Content-Type: application/json' \
            -d '{\"inputs\":{},\"query\":\"reply only DIFY_OK\",\"response_mode\":\"blocking\",\"user\":\"smoke\"}' \
            -m 30 http://${API_IP}:5001/v1/chat-messages 2>&1")
          echo "len: ${#RESP}"
          echo "$RESP" | head -c 800

          echo
          echo "=== Direct parameters call ==="
          PARAMS=$($SSH "curl -sS -H 'Authorization: Bearer ${DIFY_API_KEY}' -m 10 http://${API_IP}:5001/v1/parameters 2>&1")
          echo "$PARAMS" | head -c 800

          echo "=== END ==="
