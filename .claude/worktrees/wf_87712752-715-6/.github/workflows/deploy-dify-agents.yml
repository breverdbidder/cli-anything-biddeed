name: Deploy Dify Agents on Hetzner
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to deploy"
        required: true
        default: "brief-agent"
jobs:
  deploy-dify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HETZNER_IP: ${{ secrets.HETZNER_IP }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Probe Dify
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Dify endpoint discovery ==="
          for port in 80 3000 5001 8080; do
            for path in "/" "/apps" "/v1" "/v1/apps" "/api/v1" "/api/v1/apps" "/console/api/apps"; do
              CODE=$($SSH "curl -s -o /dev/null -w '%{http_code}' http://localhost:${port}${path} 2>/dev/null" 2>/dev/null)
              if [ -n "$CODE" ] && [ "$CODE" != "000" ] && [ "$CODE" != "404" ]; then
                echo "  PORT ${port} PATH ${path} → ${CODE}"
              fi
            done
          done

          echo ""
          echo "=== Dify with API key ==="
          for port in 80 3000 5001; do
            for path in "/v1/apps" "/api/v1/apps" "/console/api/apps"; do
              RESP=$($SSH "curl -s -w '\n%{http_code}' http://localhost:${port}${path} -H 'Authorization: Bearer ${DIFY_API_KEY}' 2>/dev/null" 2>/dev/null)
              CODE=$(echo "$RESP" | tail -1)
              if [ "$CODE" != "000" ] && [ "$CODE" != "404" ]; then
                echo "  PORT ${port} PATH ${path} → ${CODE}"
                echo "$RESP" | head -3
              fi
            done
          done

          echo ""
          echo "=== Docker containers ==="
          $SSH "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || echo 'Docker not available'"

          echo ""
          echo "=== Processes on key ports ==="
          $SSH "ss -tlnp 2>/dev/null | head -20"
