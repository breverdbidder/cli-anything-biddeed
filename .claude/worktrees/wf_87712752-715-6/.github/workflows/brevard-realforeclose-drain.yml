name: "Brevard RealForeclose upcoming drain"
# Defect 2 fix: court_responses_raw fed (28K rows) but realforeclose_aids upcoming=0.
# Root cause: parity-court-scraper.yml is manual-dispatch only; no automated run for
# upcoming Brevard foreclosure auctions.  Also: Firecrawl action types keep breaking
# across API versions ("write" → "type" → now "wait" also rejected).
#
# Fix: drop Firecrawl entirely. RealForeclose uses standard ColdFusion form auth.
# We POST the login form with httpx, get a session cookie, then fetch PREVIEW pages.
# No browser automation needed — the AITEM blocks are in the rendered HTML.

on:
  schedule:
    - cron: "30 7 * * 1-5"    # Mon-Fri 07:30Z — ahead of Brevard morning auctions
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: "How many days ahead to scrape (default 30)"
        required: false
        default: "30"

concurrency: {group: brevard-realforeclose-drain, cancel-in-progress: false}

jobs:
  drain:
    name: "Drain upcoming Brevard FC auctions → realforeclose_aids"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape + drain upcoming auction dates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '30' }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, re, time, urllib.request, urllib.parse, urllib.error, http.cookiejar
          from datetime import datetime, date, timedelta

          SB    = os.environ['SUPABASE_URL']
          KEY   = os.environ['SUPABASE_KEY']
          EMAIL = os.environ.get('REALFORECLOSE_EMAIL', '')
          PW    = os.environ.get('REALFORECLOSE_PASSWORD', '')
          LOOK  = int(os.environ.get('LOOKAHEAD_DAYS', '30'))
          RUN   = os.environ.get('GH_RUN_ID', '')

          HOST  = "https://brevard.realforeclose.com"
          UA    = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                   "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")
          H     = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}
          HU    = {**H, "Prefer": "resolution=merge-duplicates"}
          HR    = {**H, "Prefer": "return=representation"}

          # ── urllib-based Supabase helpers (no httpx needed) ─────────────────────
          def sb_post(path, payload, prefer=""):
              body = json.dumps(payload).encode()
              hdrs = {**H}
              if prefer: hdrs["Prefer"] = prefer
              req = urllib.request.Request(f"{SB}/rest/v1/{path}", data=body, headers=hdrs, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, []

          def sb_patch(path, payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(f"{SB}/rest/v1/{path}", data=body, headers=H, method="PATCH")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:200]

          def sb_rpc(name, payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(f"{SB}/rest/v1/rpc/{name}", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:200]

          # ── 1. Discover upcoming Brevard foreclosure auction dates ────────────
          # Generate weekday dates — Brevard FC auctions run Mon-Fri.
          # Don't query MCA (upcoming auctions aren't there yet — chicken-and-egg).
          today = date.today()
          cutoff = today + timedelta(days=LOOK)
          candidate = today
          dates = []
          while candidate <= cutoff:
              if candidate.weekday() < 5:  # Mon=0 … Fri=4
                  dates.append(candidate.isoformat())
              candidate += timedelta(days=1)
          print(f"Weekday dates to probe ({len(dates)}): {dates[:7]}{'...' if len(dates)>7 else ''}")

          # ── 2. Helpers ────────────────────────────────────────────────────────
          def to_float(s):
              if not s: return None
              m = re.search(r'\$?([\d,]+\.?\d*)', str(s))
              if not m: return None
              try: return float(m.group(1).replace(',', ''))
              except: return None

          def strip_html(s):
              if not s: return None
              t = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', str(s))).strip()
              return t or None

          def extract_href(s):
              if not s: return None
              m = re.search(r'href="([^"]+)"', str(s))
              return m.group(1) if m else None

          def parse_starts(s):
              if not s: return None
              cleaned = re.sub(r'\s+(?:ET|EST|EDT|CT|CST)\s*$', '', s.strip())
              for fmt in ('%m/%d/%Y %I:%M %p', '%m/%d/%Y %H:%M', '%m/%d/%Y'):
                  try: return datetime.strptime(cleaned, fmt).isoformat()
                  except: continue
              return None

          def parse_aitem_blocks(html, county_sub):
              items = []
              starts = [m.start() for m in re.finditer(r'<div\s+id="AITEM_\d+"', html)]
              if not starts:
                  return items
              starts.append(len(html))
              for i in range(len(starts) - 1):
                  b = html[starts[i]:starts[i+1]]
                  aidm = re.search(r'aid="(\d+)"', b)
                  if not aidm:
                      continue
                  aid = aidm.group(1)
                  sm = re.search(r'ASTAT_MSGA[^>]*>Auction Starts</div>\s*<div[^>]+>\s*([^<]+?)\s*</div>', b)
                  starts_raw = sm.group(1).strip() if sm else None
                  rows = re.findall(
                      r'<td[^>]*class="AD_LBL"[^>]*>(.*?)</td>\s*<td[^>]*class="AD_DTA[^"]*"[^>]*>(.*?)</td>',
                      b, re.DOTALL)
                  data = {}
                  addr_lines = []
                  last_addr = False
                  for lbl_h, dta_h in rows:
                      lbl = re.sub(r'<[^>]+>', '', lbl_h).strip().rstrip(':').lower()
                      if 'property address' in lbl:
                          t = strip_html(dta_h)
                          if t: addr_lines.append(t)
                          last_addr = True; continue
                      if last_addr and not lbl:
                          t = strip_html(dta_h)
                          if t: addr_lines.append(t)
                          continue
                      last_addr = False
                      if lbl: data[lbl] = dta_h
                  items.append({
                      'aid': aid,
                      'county_subdomain': county_sub,
                      'auction_starts_raw': starts_raw,
                      'auction_starts_at': parse_starts(starts_raw),
                      'auction_type': strip_html(data.get('auction type')),
                      'case_number': strip_html(data.get('case #')),
                      'case_clerk_url': extract_href(data.get('case #', '')),
                      'judgment_amount': to_float(data.get('final judgment amount')),
                      'parcel_id': strip_html(data.get('parcel id')),
                      'parcel_assessor_url': extract_href(data.get('parcel id', '')),
                      'property_address': ', '.join(addr_lines) if addr_lines else None,
                      'assessed_value': to_float(data.get('assessed value')),
                      'plaintiff_max_bid': to_float(data.get('plaintiff max bid')),
                  })
              return items

          # ── 3. Direct HTTP login + PREVIEW scrape (no Firecrawl needed) ──────────
          # brevard.realforeclose.com is accessible from GHA datacenter IPs (HTTP 200).
          # ColdFusion AJAX login: POST USERNAME+USERPASS to index.cfm with ZACTION=AJAX.
          # Session cookies are carried via CookieJar for subsequent PREVIEW page fetches.
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def _get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with opener.open(req, timeout=30) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:500]
              except Exception as e:
                  return 0, str(e)

          def _post(url, data_dict, extra_hdrs=None):
              body = urllib.parse.urlencode(data_dict).encode()
              hdrs = {"User-Agent": UA, "Content-Type": "application/x-www-form-urlencoded",
                      **(extra_hdrs or {})}
              req = urllib.request.Request(url, data=body, headers=hdrs, method="POST")
              try:
                  with opener.open(req, timeout=30) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:500]
              except Exception as e:
                  return 0, str(e)

          def login():
              if not EMAIL or not PW:
                  print("  WARNING: REALFORECLOSE_EMAIL/PASSWORD not set — unauthenticated (AITEM empty)")
                  return False
              # Step 1: splash (get CF session cookies)
              st, _ = _get(f"{HOST}/index.cfm")
              print(f"  Splash: HTTP {st}, cookies={[c.name for c in cj]}")
              # Step 2: AJAX login (logform.js mechanism)
              st, resp = _post(f"{HOST}/index.cfm",
                  {"ZACTION": "AJAX", "ZMETHOD": "LOGIN", "func": "LOGIN",
                   "USERNAME": EMAIL, "USERPASS": PW},
                  {"X-Requested-With": "XMLHttpRequest", "Accept": "application/json, */*; q=0.01"})
              print(f"  AJAX login: HTTP {st}, resp={resp[:120]!r}")
              return '"isOk":"YES"' in resp

          def scrape_preview(auction_date_iso):
              d = datetime.strptime(auction_date_iso, '%Y-%m-%d')
              date_mdy = d.strftime('%m/%d/%Y')
              url = f"{HOST}/index.cfm?zaction=AUCTION&Zmethod=PREVIEW&AUCTIONDATE={urllib.parse.quote(date_mdy)}"
              st, html = _get(url)
              return st, html

          print("\nLogging in to brevard.realforeclose.com...")
          logged_in = login()
          print(f"  Login success: {logged_in}")

          # ── 4. Per-date loop ──────────────────────────────────────────────────
          total_aids = 0
          total_inserted = 0

          for auction_date in dates:
              print(f"\n─── {auction_date} ───────────────────────────────────")
              d_obj = datetime.strptime(auction_date, '%Y-%m-%d')
              date_mdy = d_obj.strftime('%m/%d/%Y')

              status_code, html = scrape_preview(auction_date)
              print(f"  HTTP {status_code}, html_len={len(html)}")

              # Detect session loss
              if html and '<input' in html and 'LogName' in html and '<form' in html:
                  print("  Session lost — re-logging in")
                  login()
                  status_code, html = scrape_preview(auction_date)
                  print(f"  Retry: HTTP {status_code}, html_len={len(html)}")

              aids = parse_aitem_blocks(html, 'brevard') if html else []
              print(f"  AITEM blocks parsed: {len(aids)}")

              if html and not aids:
                  if 'No auctions' in html or 'no auction' in html.lower():
                      print("  No auctions scheduled for this date")
                  elif not logged_in:
                      print("  Not logged in — AITEM blocks unavailable")
                  else:
                      print(f"  HTML snippet: {html[:400]!r}")

              total_aids += len(aids)

              if aids:
                  payload = [{
                      'aid': a['aid'], 'county_slug': 'brevard',
                      'auction_type': a['auction_type'],
                      'case_number': a['case_number'],
                      'case_clerk_url': a['case_clerk_url'],
                      'judgment_amount': a['judgment_amount'],
                      'parcel_id': a['parcel_id'],
                      'parcel_assessor_url': a['parcel_assessor_url'],
                      'property_address': a['property_address'],
                      'assessed_value': a['assessed_value'],
                      'plaintiff_max_bid': a['plaintiff_max_bid'],
                      'auction_starts_at': a['auction_starts_at'],
                      'auction_starts_raw': a['auction_starts_raw'],
                      'county_subdomain': a['county_subdomain'],
                      'source_response_id': cr_id,
                      'source_run_id': int(RUN) if RUN and RUN.isdigit() else None,
                  } for a in aids]
                  st2, body2 = sb_post("realforeclose_aids?on_conflict=aid", payload, "resolution=merge-duplicates")
                  if st2 in (200, 201, 204):
                      total_inserted += len(payload)
                      print(f"  → inserted/upserted {len(payload)} aids")
                  else:
                      print(f"  aids INSERT FAILED: HTTP {st2}: {str(body2)[:300]}")

              time.sleep(1.5)

          # ── 5. Patch MCA from aids (case_number join) ─────────────────────────
          if total_inserted > 0:
              st_rpc, body_rpc = sb_rpc("realforeclose_aids_to_mca_patch", {"p_dispatch_id": None})
              print(f"\nrealforeclose_aids_to_mca_patch: HTTP {st_rpc}, {body_rpc[:200]}")

          print(f"\nDRAIN DONE: dates={len(dates)} aids_parsed={total_aids} aids_inserted={total_inserted}")

          if total_aids > 0 and total_inserted == 0:
              print("SILENT FAILURE: aids parsed but 0 inserted — check realforeclose_aids schema")
              import sys; sys.exit(1)
          PYEOF
