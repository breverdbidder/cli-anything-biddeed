name: cc nonroot inspect
on: { workflow_dispatch: {} }
jobs:
  i:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: inspect
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          echo "=== claude binary ==="
          which claude; readlink -f "$(which claude)"; echo "npm_prefix=$(npm prefix -g 2>/dev/null)"
          echo "=== non-root users (uid>=1000) ==="
          awk -F: '$3>=1000 && $3<65000 {print $1, $3, $6, $7}' /etc/passwd
          echo "=== claudecodeui unit ==="
          systemctl cat 'claudecodeui@root' 2>&1 | head -70
          echo "=== active instances ==="
          systemctl list-units 'claudecodeui@*' --no-legend 2>&1
          UNIT=$(systemctl cat 'claudecodeui@root' 2>/dev/null)
          ENVF=$(printf '%s' "$UNIT" | grep -oP 'EnvironmentFile=-?\K.*' | head -1)
          WD=$(printf '%s' "$UNIT" | grep -oP 'WorkingDirectory=\K.*' | head -1)
          echo "ENVF=$ENVF"
          echo "WD=$WD"
          echo "=== env (masked) ==="
          [ -n "$ENVF" ] && sed -E 's/(SECRET|TOKEN|KEY|PASSWORD|JWT)=.*/\1=***/I' "$ENVF" 2>/dev/null
          echo "=== db/sqlite files under WD ==="
          [ -n "$WD" ] && find "$WD" -maxdepth 3 \( -name '*.db' -o -name '*.sqlite*' \) 2>/dev/null
          echo "=== /root/.claude ==="
          ls -la /root/.claude 2>&1 | head
          echo "projects=$(ls -1 /root/.claude/projects 2>/dev/null | wc -l)"
          echo "END"
          REMOTE
