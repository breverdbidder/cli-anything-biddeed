name: codeburn-audit
# Honesty: VERIFIED design, UNTESTED until first run
# Purpose: Run codeburn against this runner's ~/.claude/projects/ session history,
#          POST results to Supabase cc_token_audit_runs.
# Bypasses broken SUMMIT pipeline. Direct workflow_dispatch + cron.

on:
  workflow_dispatch:
    inputs:
      source_label:
        description: "Source identifier (e.g. gha-ubuntu-latest, hetzner-runner-1)"
        required: true
        default: "gha-ubuntu-latest"
      runner_target:
        description: "Runner pool: ubuntu-latest | self-hosted"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
  schedule:
    # Daily 13:00 UTC = 09:00 ET. Hits ubuntu-latest only (cheap, fresh box, won't have CC data — sentinel run).
    - cron: '0 13 * * *'

permissions:
  contents: read

concurrency:
  group: codeburn-audit-${{ github.event.inputs.source_label || 'cron' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ${{ github.event.inputs.runner_target || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      SOURCE_LABEL: ${{ github.event.inputs.source_label || 'gha-ubuntu-latest-cron' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install codeburn
        run: npm install -g codeburn@latest

      - name: Capture codeburn export (JSON)
        id: export
        run: |
          set -e
          mkdir -p /tmp/cb
          # Export to fixed path. Codeburn picks up ~/.claude/projects/ by default.
          codeburn export --format json --output /tmp/cb/export.json 2>/tmp/cb/export.err || true
          if [ ! -s /tmp/cb/export.json ]; then
            # No data → emit empty schema-shaped doc so DB row still lands (HONEST UNKNOWN)
            echo '{"schema":"codeburn.export.v2","generated":"'$(date -u +%FT%TZ)'","summary":[],"periods":[]}' > /tmp/cb/export.json
          fi
          echo "bytes=$(wc -c < /tmp/cb/export.json)" >> $GITHUB_OUTPUT

      - name: Capture codeburn optimize (text)
        run: |
          codeburn optimize --period 30days > /tmp/cb/optimize.txt 2>/tmp/cb/optimize.err || true
          [ -s /tmp/cb/optimize.txt ] || echo "(no optimize output — no session data on this runner)" > /tmp/cb/optimize.txt

      - name: POST to Supabase cc_token_audit_runs
        run: |
          set -e
          GENERATED=$(jq -r '.generated // "1970-01-01T00:00:00Z"' /tmp/cb/export.json)
          SCHEMA=$(jq -r '.schema // "unknown"' /tmp/cb/export.json)
          C_TODAY=$(jq -r '(.summary[]? | select(.Period=="Today") | ."Cost (USD)") // 0' /tmp/cb/export.json)
          C_7D=$(jq -r   '(.summary[]? | select(.Period=="7 Days") | ."Cost (USD)") // 0' /tmp/cb/export.json)
          C_30D=$(jq -r  '(.summary[]? | select(.Period=="30 Days") | ."Cost (USD)") // 0' /tmp/cb/export.json)
          CALLS=$(jq -r  '(.summary[]? | select(.Period=="30 Days") | ."API Calls") // 0' /tmp/cb/export.json)
          SESS=$(jq -r   '(.summary[]? | select(.Period=="30 Days") | ."Sessions") // 0' /tmp/cb/export.json)
          PROJ=$(jq -r   '(.summary[]? | select(.Period=="30 Days") | ."Projects") // 0' /tmp/cb/export.json)

          # Build payload via jq (handles escaping)
          jq -n \
            --arg src   "$SOURCE_LABEL" \
            --arg host  "$(hostname)" \
            --arg gen   "$GENERATED" \
            --arg sch   "$SCHEMA" \
            --argjson today "$C_TODAY" \
            --argjson w7    "$C_7D" \
            --argjson m30   "$C_30D" \
            --argjson calls "$CALLS" \
            --argjson sess  "$SESS" \
            --argjson proj  "$PROJ" \
            --slurpfile raw /tmp/cb/export.json \
            --arg opt   "$(cat /tmp/cb/optimize.txt)" \
            --arg wfid  "${{ github.run_id }}" \
            --arg wfurl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              source: $src,
              runner_label: $host,
              generated_at: $gen,
              schema_version: $sch,
              cost_today_usd: $today,
              cost_7d_usd: $w7,
              cost_30d_usd: $m30,
              api_calls_30d: $calls,
              sessions_30d: $sess,
              projects_30d: $proj,
              raw_export: $raw[0],
              optimize_text: $opt,
              workflow_run_id: ($wfid | tonumber),
              workflow_run_url: $wfurl
            }' > /tmp/cb/payload.json

          # POST via PostgREST. Service role bypasses RLS.
          HTTP=$(curl -sS -o /tmp/cb/resp.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/cc_token_audit_runs" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data-binary @/tmp/cb/payload.json)
          echo "HTTP $HTTP"
          cat /tmp/cb/resp.json
          if [ "$HTTP" != "201" ]; then
            echo "ERROR:supabase_insert_http_$HTTP"
            exit 1
          fi
          ROW_ID=$(jq -r '.[0].id' /tmp/cb/resp.json)
          echo "PUSHED row:$ROW_ID source:$SOURCE_LABEL cost_30d:$C_30D"

      - name: Upload artifacts (export + optimize)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeburn-${{ env.SOURCE_LABEL }}-${{ github.run_id }}
          path: /tmp/cb/
          retention-days: 30
