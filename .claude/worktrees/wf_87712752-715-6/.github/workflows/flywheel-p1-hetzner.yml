name: Flywheel Phase 1 Migration via Hetzner (Issue #122)
on:
  workflow_dispatch: {}

jobs:
  migrate:
    name: "Flywheel P1 via Hetzner psql"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: SSH to Hetzner and run migration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            # Pull latest migration
            cd /opt/biddeed/cli-anything-biddeed 2>/dev/null || \
              cd /root/cli-anything-biddeed 2>/dev/null || \
              cd /home/ubuntu/cli-anything-biddeed 2>/dev/null || \
              (git clone https://github.com/breverdbidder/cli-anything-biddeed /tmp/flywheel-migrate && cd /tmp/flywheel-migrate)

            git pull origin main --ff-only 2>&1 | tail -3

            # Find working DB password
            PW=""
            for src in \
              /opt/biddeed/.env \
              /root/.env \
              /etc/biddeed/secrets \
              /opt/biddeed/cli-anything-biddeed/.env \
              /root/cli-anything-biddeed/.env
            do
              if [ -f "$src" ]; then
                candidate=$(grep -E "SUPABASE_DB_PASSWORD|PGPASSWORD|DB_PASSWORD" "$src" 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"'"'" | tr -d '[:space:]')
                if [ -n "$candidate" ]; then
                  PW="$candidate"
                  echo "Found password in $src"
                  break
                fi
              fi
            done

            # Try connecting
            export PGPASSWORD="${PW}"
            PSQL_CMD="psql -h aws-0-us-west-2.pooler.supabase.com -p 6543 -U postgres.mocerqjnksmhcjzxrewo -d postgres --no-password"

            if $PSQL_CMD -c "SELECT 1 as ping" 2>/dev/null; then
              echo "Connected via us-west-2:6543"
            else
              # try session mode
              PSQL_CMD="psql -h aws-0-us-west-2.pooler.supabase.com -p 5432 -U postgres.mocerqjnksmhcjzxrewo -d postgres --no-password"
              if $PSQL_CMD -c "SELECT 1 as ping" 2>/dev/null; then
                echo "Connected via us-west-2:5432"
              else
                echo "FAIL: psql connection failed with stored password"
                exit 1
              fi
            fi

            # Run migration
            echo "Running flywheel phase 1 migration..."
            $PSQL_CMD -v ON_ERROR_STOP=0 -f migrations/20260331_flywheel_phase1.sql 2>&1

            # Verify
            echo "=== VERIFICATION ==="
            $PSQL_CMD -c "
              SELECT table_name, table_type
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name IN ('customer_buyboxes','customer_behavior','customer_alerts')
              ORDER BY table_name;
            "

            $PSQL_CMD -c "
              SELECT viewname FROM pg_views
              WHERE schemaname = 'public' AND viewname = 'customer_accuracy';
            "

            $PSQL_CMD -c "
              SELECT relname, relrowsecurity as rls_enabled
              FROM pg_class
              WHERE relname IN ('customer_buyboxes','customer_behavior','customer_alerts')
                AND relnamespace = (SELECT oid FROM pg_namespace WHERE nspname = 'public')
              ORDER BY relname;
            "

            echo "=== MIGRATION COMPLETE ==="

      - name: Summary
        if: always()
        run: |
          echo "## Flywheel P1 via Hetzner — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Tables: customer_buyboxes, customer_behavior, customer_alerts + customer_accuracy view" >> $GITHUB_STEP_SUMMARY
