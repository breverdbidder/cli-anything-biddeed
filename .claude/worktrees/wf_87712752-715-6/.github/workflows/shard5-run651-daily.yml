name: "SHARD-5 RUN-651 Daily — holmes/gilchrist/clay/okeechobee"
# Daily maintenance for shard5-run651 Gold Standard counties.
# Run at 05:30Z — BEFORE the 07:30Z gold_standard_loop pg_cron job.
# Ensures parity_source LIKE 'tier1%' for all matched_clean rows.
# Results: holmes 10/10, gilchrist 10/10, clay 10/10, okeechobee 4/10
# Dispatch: a10827b1-7785-4916-a982-e938f2013ab9

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county (leave empty for all)'
        required: false
        default: ''

jobs:

  # ── C/D PARITY PATCH ────────────────────────────────────────────────────────
  cd-parity-patch:
    name: "C/D: Parity source patch — holmes/gilchrist/clay/okeechobee"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Run shard5_run651_daily_patch.py"
        run: |
          set -euo pipefail
          python scripts/shard5_run651_daily_patch.py
