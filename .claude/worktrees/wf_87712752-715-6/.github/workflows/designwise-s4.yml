name: "Summit: DesignWise S4 — Parity Sprint (4.2→8.5+)"
on:
  workflow_dispatch: {}

concurrency:
  group: designwise-s4
  cancel-in-progress: true

jobs:
  s4-parity:
    name: "S4: Fix All Bugs + Explorer + Chat + SEO + UX Parity"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/plans/DESIGNWISE-S4-DISPATCH.md

      - name: "Build on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID
          command_timeout: 110m
          script: |
            set -e
            echo "=== DesignWise S4 — $(date) ==="
            id
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH="/home/claude/.npm-global/bin:$PATH"
            which claude || npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            git config --global --unset-all safe.directory 2>/dev/null || true
            git config --global --add safe.directory '*'
            mkdir -p /opt/biddeed && cd /opt/biddeed
            rm -rf zonewise-web
            git clone https://${GH_PAT}@github.com/breverdbidder/zonewise-web.git
            cd zonewise-web
            npm ci 2>&1 | tail -5
            chown -R claude:claude /opt/biddeed/zonewise-web
            curl -s -X POST "https://api.telegram.org/bot${BIDDEED_BOT_TOKEN}/sendMessage" -d "chat_id=${BIDDEED_BOT_CHAT_ID}" -d "parse_mode=Markdown" --data-urlencode "text=🏔️ *S4 Parity* Starting Claude Code — 6 phases" || true
            su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN' \
              && export NPM_CONFIG_PREFIX=/home/claude/.npm-global \
              && export PATH=/home/claude/.npm-global/bin:\$PATH \
              && export GH_PAT='$GH_PAT' \
              && export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN' \
              && export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID' \
              && cd /opt/biddeed/zonewise-web \
              && git config user.email ci@biddeed.ai \
              && git config user.name BidDeed-CI \
              && claude -p 'MISSION: DesignWise S4 Parity Sprint. SCORE: 4.2/10 → TARGET 8.5+/10.

            YOU ARE IN: /opt/biddeed/zonewise-web (Next.js on Vercel at zonewise.ai)

            PHASE 1 (CRITICAL 30min): Fix lib/explorer/constants.ts — ExplorerV2.tsx imports ZONING_FILTERS, FREE_PARCEL_CLICKS, FREE_CHAT_MESSAGES, ChoroplethMetric type, ZoningFilter type, CHOROPLETH_COLOR_STOPS but they DO NOT EXIST. This JS crash kills Explorer showing infinite spinner. ADD all missing exports. Fix /demo.html 404 via rewrite in next.config.mjs. Fix AnimatedSection opacity:0 fallback.

            PHASE 2 (EXPLORER 45min): Verify ExplorerMap renders Mapbox tiles with choropleth after P1 fix. Verify chat streams via Anthropic SDK at /api/explorer/chat. Wire MAP commands from chat to map. Wire quick-action chips.

            PHASE 3 (LANDING 30min): Fix counter animation 67/369/5950/10.8M. Fix hero opacity:0 fallback. Wire homepage chips to /explorer.

            PHASE 4 (SEO 20min): Add JSON-LD structured data. Unique meta descriptions per route.

            PHASE 5 (UX 30min): Resizable chat panel. Chat-Map bidirectional sync. Keyboard shortcuts.

            PHASE 6 (DEPLOY 15min): npm run build ZERO errors. Commit and push per phase.

            RULES:
            - npm run build after EVERY phase. Fix errors before moving on.
            - git commit + git push after each phase.
            - Send heartbeat: curl -s -X POST https://api.telegram.org/bot$BIDDEED_BOT_TOKEN/sendMessage -d chat_id=$BIDDEED_BOT_CHAT_ID -d parse_mode=Markdown --data-urlencode text=Phase_N_status
            - If phase fails 3x: commit what works, move on.
            - Budget: 110 minutes total.' --dangerously-skip-permissions"

      - name: "Deploy via force-alias"
        if: always()
        continue-on-error: true
        run: |
          sleep 15
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/force-alias.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Force alias triggered"

      - name: "Notify"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=*DesignWise S4 Parity* — ${STATUS}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Target: 4.2 → 8.5+" || true
