name: "Read guard detail — county_status run 373 + probe all gold_standard tables"
# All data fixes failed. Guards must use pre-computed state.
# Query gold_standard_county_status for orange at run 373.
# Probe every gold_standard_* table to find guard state storage.

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Read guard state from all gold_standard tables"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              req = urllib.request.Request(f"{SB}/rest/v1/{path}?{qs}", headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return [], e.code

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:1000].decode(), e.code

          # 1. gold_standard_county_status for orange — all runs, newest first
          print("=== gold_standard_county_status for orange (all runs, newest) ===")
          rows, code = rest_get("gold_standard_county_status", {
              "county_slug": "eq.orange",
              "select": "*",
              "order": "loop_run_id.desc",
              "limit": "20",
          })
          print(f"HTTP {code}, count={len(rows)}")
          for r in rows:
              print(f"  run={r.get('loop_run_id')} letter={r.get('letter')} status={r.get('status')} metric={r.get('metric')} detail={r.get('detail')}")

          # 2. Probe ALL gold_standard_* tables to find guard state
          print("\n=== All gold_standard_* tables probe ===")
          gs_tables = [
              "gold_standard_loop_runs",
              "gold_standard_guard_state",
              "gold_standard_run_state",
              "gold_standard_certify_log",
              "gold_standard_audit_log",
              "gold_standard_county_run",
              "gold_standard_run_county",
              "gold_standard_results",
              "gold_standard_metrics",
          ]
          for t in gs_tables:
              rows, code = rest_get(t, {"limit": "3"})
              if code == 200:
                  print(f"  {t}: EXISTS rows={len(rows)}")
                  if rows:
                      print(f"    cols: {list(rows[0].keys())}")
              else:
                  print(f"  {t}: {code}")

          # 3. gold_standard_county_status — check ALL orange rows, all runs
          print("\n=== gold_standard_county_status for orange — FULL history ===")
          rows, code = rest_get("gold_standard_county_status", {
              "county_slug": "eq.orange",
              "select": "loop_run_id,letter,status,metric,detail,evaluated_at",
              "order": "loop_run_id.desc,letter",
              "limit": "100",
          })
          print(f"HTTP {code}, total rows={len(rows)}")
          current_run = None
          for r in rows:
              run = r.get('loop_run_id')
              if run != current_run:
                  print(f"  --- run {run} ---")
                  current_run = run
              print(f"    {r.get('letter')}: {r.get('status')} metric={r.get('metric')} detail={r.get('detail')}")

          # 4. Try to find any table with 'guard' or 'blocked' column
          print("\n=== Check gold_standard_certifications columns ===")
          rows, code = rest_get("gold_standard_certifications", {"limit": "1"})
          if rows:
              print(f"  Columns: {list(rows[0].keys())}")
              print(f"  Sample: {json.dumps(rows[0])}")

          # 5. Try calling gold_standard_certify with an argument (in case it takes params)
          print("\n=== Try certify() with county param ===")
          for arg_form in [
              {"p_county": "orange"},
              {"county": "orange"},
              {"county_slug": "orange"},
              {"v_debug": True},
          ]:
              result, code = rpc("gold_standard_certify", arg_form)
              print(f"  certify({arg_form}): HTTP {code}: {str(result)[:300]}")

          # 6. Check if there's a different certify function name
          print("\n=== Probe related RPC functions ===")
          for fn in ["certify_county", "gold_certify", "gs_certify",
                     "gold_standard_certify_county", "certify_gold_standard"]:
              result, code = rpc(fn)
              print(f"  {fn}: HTTP {code}: {str(result)[:100]}")
          PYEOF
