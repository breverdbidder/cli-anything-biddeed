name: close-stale-197
on:
  workflow_dispatch:
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 197,
              body: `## Root Cause Fixed (commit \`2c5b9cc0\`)

**GHA run**: 23709997602 (failed 2026-03-29T13:21Z)

**Root cause**: YAML syntax error in \`.github/workflows/weekly-health.yml\` — bare quotes at column 0 in the Dream skill health check step caused 0 jobs to be parsed from the workflow.

**Fix applied**: Commit \`2c5b9cc0\` (2026-03-29 14:11 UTC) replaced literal newline continuation in DREAM_REPORT string with \\n escape sequences, resolving the YAML parse error.

**Verification**: Subsequent runs succeeded:
- 2026-03-30T07:39Z → success ✅
- 2026-03-30T12:51Z → success ✅
- 2026-03-31T23:47Z → success ✅

All tests pass (234 passed, 6 skipped). All CLIs callable. LangGraph pipeline complete. Workflow is healthy.

YAML valid ✅ | Fix already in main ✅ | Stale issue — closing.`
            });
            await github.rest.issues.update({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 197,
              state: 'closed'
            });
