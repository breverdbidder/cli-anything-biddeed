name: mcps-fix-and-verify

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH diagnose + re-register + verify
        env:
          HETZNER_IP:             ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY:        ${{ secrets.HETZNER_SSH_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "====================================================="
          echo "PHASE A: Probe existing state"
          echo "====================================================="
          echo ""
          echo "--- npm globals matching MCP packages ---"
          $SSH "npm ls -g --depth=0 2>/dev/null | grep -E 'nano-banana|gemini-mcp|google-drive|supabase|notebooklm' || echo '(no MCP globals found)'"
          echo ""
          echo "--- uv tools ---"
          $SSH "sudo -u summit bash -lc 'ls ~/.local/share/uv/tools 2>/dev/null || uv tool list 2>/dev/null' | head -20"
          echo ""
          echo "--- Google service account file search (common paths) ---"
          $SSH "for p in /root/.config/gcloud/*.json /root/.gcp/*.json /root/*.json /home/summit/*.json /opt/everest/secrets/*.json /opt/everest/google-sa.json /etc/gcp/*.json /root/gcp-sa.json /home/summit/.config/gcloud/*.json; do
            [ -f \"\$p\" ] && echo \"  FOUND: \$p ( \$(wc -c < \"\$p\") bytes )\"
          done
          find /root /opt /home/summit -maxdepth 4 -name '*.json' -size -10k 2>/dev/null | xargs -I{} sh -c 'head -1 \"\$1\" 2>/dev/null | grep -l service_account && echo \"  SA-likely: \$1\"' _ {} 2>/dev/null | head -5"
          echo ""
          echo "--- Current MCP registrations for summit ---"
          $SSH "sudo -u summit claude mcp list 2>&1 | head -20"
          echo ""

          echo "====================================================="
          echo "PHASE B: Pre-cache npx packages (avoid health-check timeout)"
          echo "====================================================="
          # npx downloads-to-cache on first use. Pre-warm by running --version / --help each.
          for pkg in "@supabase/mcp-server-supabase" "@rafarafarafa/nano-banana-pro-mcp" "nano-banana-mcp" "gemini-mcp-tool"; do
            echo "warming: $pkg"
            $SSH "sudo -u summit timeout 60 npx -y $pkg --help 2>&1 | head -3 || true"
          done
          echo ""

          echo "====================================================="
          echo "PHASE C: Verify MCP health after warmup"
          echo "====================================================="
          $SSH "sudo -u summit claude mcp list 2>&1"
          echo ""

          echo "====================================================="
          echo "PHASE D: If google SA was found, register google-drive"
          echo "====================================================="
          SA_PATH=$($SSH "for p in /root/.config/gcloud/application_default_credentials.json /root/gcp-sa.json /opt/everest/secrets/google-service-account.json /home/summit/.config/gcloud/application_default_credentials.json; do
            [ -f \"\$p\" ] && echo \"\$p\" && break
          done")
          if [ -n "${SA_PATH}" ]; then
            echo "Google SA found at: ${SA_PATH}"
            # Copy to summit-readable location if needed
            $SSH "cp '${SA_PATH}' /home/summit/.config/google-sa.json 2>/dev/null || true
              chown summit:summit /home/summit/.config/google-sa.json 2>/dev/null || mkdir -p /home/summit/.config && cp '${SA_PATH}' /home/summit/.config/google-sa.json && chown -R summit:summit /home/summit/.config"
            if ! $SSH "sudo -u summit claude mcp list 2>&1 | grep -q '^google-drive'"; then
              $SSH "sudo -u summit claude mcp add --scope user google-drive \
                -e GOOGLE_APPLICATION_CREDENTIALS=/home/summit/.config/google-sa.json \
                -e GOOGLE_DRIVE_MCP_SCOPES=drive,documents,spreadsheets,presentations,calendar,calendar.events \
                -- google-drive-mcp start --transport stdio" && echo "REG: google-drive" || echo "ERR: google-drive"
            else
              echo "SKIP: google-drive (already registered)"
            fi
          else
            echo "No Google SA JSON found on Hetzner filesystem"
          fi
          echo ""

          echo "====================================================="
          echo "PHASE E: Final verification"
          echo "====================================================="
          $SSH "sudo -u summit claude mcp list 2>&1"
