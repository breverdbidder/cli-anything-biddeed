name: "Calhoun Clerk Harvest"
# SHARD-6 (citrus/volusia/miami_dade/calhoun/wakulla) — dispatch_id: 530d7f14-0fb3-4f2f-ad90-62abafdc3cfe
# Calhoun's RealAuction tenants are genuinely dark (confirmed live via
# calendar_sweep_mca.py this session: zero future dates on either lane).
# The Clerk's own site (calhounclerk.com) publishes structured foreclosure +
# tax-deed cards including Parcel ID and Address directly, so this harvester
# gets full E-criterion linkage on ingest. Verified live 2026-07-10: found a
# second real case (26-03DR) that calendar-sweep-dark-counties had missed
# entirely (fc=1 -> fc=2), E moved 0% -> 100% (2/2).

on:
  schedule:
    - cron: '45 5 * * *'   # 05:45 UTC daily
  workflow_dispatch:

jobs:
  harvest:
    name: "Harvest calhoun clerk foreclosure + tax deed"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests

      - name: "Run harvester"
        run: |
          set -euo pipefail
          EXIT=0
          python3 scripts/calhoun_clerk_harvest.py || EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_STEP_SUMMARY"
          # exit 2 = genuinely zero listings this cycle -- not a failure
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "2" ]; then
            exit "$EXIT"
          fi

      - name: "Verify: A/E metric via evaluator RPC"
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_county": "calhoun"}')
          echo "### SQL VERIFICATION: calhoun" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP"
