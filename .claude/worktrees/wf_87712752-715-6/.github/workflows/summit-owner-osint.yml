name: "SUMMIT #387: Owner OSINT — Migrate + Classify"
on:
  workflow_dispatch: {}

jobs:
  osint:
    name: "Owner OSINT — classify auction defendants"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Run migration via Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 120s
          command_timeout: 5m
          script: |
            set -e
            cd /opt/biddeed/cli-anything-biddeed
            git pull origin main --ff-only 2>&1 | tail -3

            # Source DB credentials
            for envfile in /opt/biddeed/.env .env /root/.env; do
              [ -f "$envfile" ] && source "$envfile" 2>/dev/null || true
            done

            command -v psql >/dev/null 2>&1 || apt-get install -y -qq postgresql-client 2>/dev/null

            PROJ="mocerqjnksmhcjzxrewo"
            MIGFILE="migrations/20260407_auction_owner_intel.sql"
            SUCCESS=0

            for CONN in \
              "postgresql://postgres.${PROJ}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
              "postgresql://postgres.${PROJ}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            ; do
              if psql "$CONN" -c "SELECT 1" 2>&1 | grep -q "1 row"; then
                echo "Connected! Running migration..."
                psql "$CONN" -f "$MIGFILE" -v ON_ERROR_STOP=0 2>&1
                echo "=== Verify table ==="
                psql "$CONN" -c "SELECT COUNT(*) FROM auction_owner_intel" 2>&1
                SUCCESS=1
                break
              fi
            done

            if [ "$SUCCESS" = "0" ]; then
              echo "psql failed — trying node runner..."
              export SUPABASE_DB_PASSWORD
              node migrations/run_migration.js "$MIGFILE" 2>&1
            fi

      - name: "Run Owner OSINT classifier"
        run: |
          pip3 install requests -q 2>&1 | tail -1
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_KEY }}" \
          TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
          TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
          python3 scripts/owner_osint.py --county brevard 2>&1

      - name: "Verify via REST API"
        run: |
          echo "=== auction_owner_intel count ==="
          curl -s -I \
            "${{ secrets.SUPABASE_URL }}/rest/v1/auction_owner_intel?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Prefer: count=exact" 2>&1 | grep -i "content-range"

          echo ""
          echo "=== Classification breakdown ==="
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/auction_owner_intel?select=classification" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" | python3 -c "
          import sys, json
          from collections import Counter
          data = json.loads(sys.stdin.read())
          if isinstance(data, list):
              counts = Counter(r['classification'] for r in data)
              print(f'Total: {len(data)} defendants')
              for cls, n in counts.most_common():
                  print(f'  {cls}: {n}')
          else:
              print(f'Error: {data}')
          "

      - name: "Telegram notification"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${EMOJI} SUMMIT #387 Owner OSINT: ${STATUS} — auction defendants classified" \
            >/dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          echo "## SUMMIT #387 Owner OSINT — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Table: auction_owner_intel" >> $GITHUB_STEP_SUMMARY
          echo "- Script: scripts/owner_osint.py" >> $GITHUB_STEP_SUMMARY
          echo "- Classifications: DISTRESSED_HOMEOWNER, INVESTOR, CORPORATE, ESTATE, UNKNOWN" >> $GITHUB_STEP_SUMMARY
