name: Chat Ground Truth Migration (Issue #37)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install psql + jq
        run: sudo apt-get install -y postgresql-client jq

      - name: Run chat_ground_truth + chat_reconciliation migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          PROJECT_REF="mocerqjnksmhcjzxrewo"
          TABLES_EXIST=0
          MIGRATION_SUCCESS=0
          INSERT_SUCCESS=0

          # ─── Phase 0: Check if tables exist via REST API ───
          echo "=== Phase 0: Check for existing tables ==="
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_KEY:-}" ]; then
            HTTP=$(curl -s -o /tmp/openapi.json -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" 2>/dev/null)
            echo "OpenAPI HTTP: $HTTP"
            if [ "$HTTP" = "200" ]; then
              GT_COLS=$(python3 -c "
          import json, sys
          spec = json.load(open('/tmp/openapi.json'))
          props = spec.get('definitions', {}).get('chat_ground_truth', {}).get('properties', {})
          print(len(props))
          " 2>/dev/null || echo "0")
              RC_COLS=$(python3 -c "
          import json, sys
          spec = json.load(open('/tmp/openapi.json'))
          props = spec.get('definitions', {}).get('chat_reconciliation', {}).get('properties', {})
          print(len(props))
          " 2>/dev/null || echo "0")
              echo "chat_ground_truth columns: $GT_COLS"
              echo "chat_reconciliation columns: $RC_COLS"
              if [ "$GT_COLS" -gt "0" ] && [ "$RC_COLS" -gt "0" ]; then
                TABLES_EXIST=1
                echo "✅ Both tables already exist"
              fi
            fi

            # Direct table check
            HTTP2=$(curl -s -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/chat_ground_truth?limit=0" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" 2>/dev/null)
            echo "Direct chat_ground_truth check HTTP: $HTTP2"
            HTTP3=$(curl -s -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/chat_reconciliation?limit=0" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" 2>/dev/null)
            echo "Direct chat_reconciliation check HTTP: $HTTP3"
            if [ "$HTTP2" = "200" ] && [ "$HTTP3" = "200" ]; then
              TABLES_EXIST=1
              echo "✅ Both tables verified via direct check"
            fi
          fi

          # ─── Phase 1: psql migration ───
          echo ""
          echo "=== Phase 1: psql migration ==="
          export PGSSLMODE=require

          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE"
            if psql "$CONN" -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ psql connected"
              psql "$CONN" -f migrations/20260329_chat_ground_truth.sql
              echo ""
              echo "=== Column counts ==="
              psql "$CONN" -c "
                SELECT table_name, COUNT(*) AS column_count
                FROM information_schema.columns
                WHERE table_name IN ('chat_ground_truth','chat_reconciliation')
                  AND table_schema='public'
                GROUP BY table_name
                ORDER BY table_name;"
              MIGRATION_SUCCESS=1
              break
            fi
          done

          # ─── Phase 2: Verify via REST API ───
          echo ""
          echo "=== Phase 2: REST verification ==="
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_KEY:-}" ]; then
            # Insert a test row into chat_ground_truth
            RUN_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            SESSION_ID="test-issue-37-$(date +%s)"
            HTTP=$(curl -s -o /tmp/insert_gt.json -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/rest/v1/chat_ground_truth" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "{
                \"session_id\": \"${SESSION_ID}\",
                \"chat_date\": \"$(date +%Y-%m-%d)\",
                \"updated_at\": \"${RUN_TS}\",
                \"title\": \"Issue #37 migration verification\",
                \"summary_chars\": 42,
                \"summary_words\": 7,
                \"scan_source\": \"issue_37_verify\"
              }" 2>/dev/null)
            echo "chat_ground_truth insert HTTP: $HTTP"
            cat /tmp/insert_gt.json | head -c 500; echo

            # Insert a test row into chat_reconciliation
            HTTP2=$(curl -s -o /tmp/insert_rc.json -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/rest/v1/chat_reconciliation" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "{
                \"month\": \"2026-01\",
                \"total_ground_truth\": 0,
                \"total_in_db\": 0,
                \"trust_score\": 0.00
              }" 2>/dev/null)
            echo "chat_reconciliation insert HTTP: $HTTP2"
            cat /tmp/insert_rc.json | head -c 500; echo

            if [ "$HTTP" = "201" ] && [ "$HTTP2" = "201" ]; then
              INSERT_SUCCESS=1
              echo "✅ Both test rows inserted successfully"
            fi
          fi

          # ─── Summary ───
          echo ""
          echo "=== SUMMARY ==="
          echo "Tables pre-existed: $TABLES_EXIST"
          echo "Migration via psql: $MIGRATION_SUCCESS"
          echo "REST verification inserts: $INSERT_SUCCESS"

          if [ "$TABLES_EXIST" = "0" ] && [ "$MIGRATION_SUCCESS" = "0" ]; then
            echo ""
            echo "❌ BLOCKER: Tables don't exist and all migration paths failed."
            echo "   Fix SUPABASE_DB_PASSWORD:"
            echo "   1. Supabase Dashboard → Settings → Database → Reset Password"
            echo "   2. gh secret set SUPABASE_DB_PASSWORD --body 'newpass' --repo breverdbidder/cli-anything-biddeed"
            echo "   3. gh workflow run chat-ground-truth-migrate.yml --repo breverdbidder/cli-anything-biddeed"
            exit 1
          fi

          echo "✅ chat_ground_truth + chat_reconciliation migration: DONE"

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ chat_ground_truth + chat_reconciliation — Complete" >> $GITHUB_STEP_SUMMARY
            echo "Both tables created. Issue #37 resolved." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ chat_ground_truth + chat_reconciliation — Failed" >> $GITHUB_STEP_SUMMARY
            echo "Fix SUPABASE_DB_PASSWORD and re-run." >> $GITHUB_STEP_SUMMARY
          fi
