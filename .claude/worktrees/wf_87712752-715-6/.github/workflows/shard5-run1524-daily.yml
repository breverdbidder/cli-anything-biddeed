name: "SHARD-5 Run-1524 Daily — suwannee/osceola"
# Daily pipeline for run-1524 shard-5 counties: suwannee + osceola.
# Session: run=1524 (2026-06-28)
# Runs at 05:00Z daily — before the 07:30Z gold_standard_loop pg_cron job.
# suwannee: bootstrap A/B/F/G/I
# osceola: C/D parity promotion (idempotent — skips already-promoted rows)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'Single county to run (suwannee or osceola, leave empty for all)'
        required: false
        default: ''

jobs:

  # ── H-FRESHNESS (runs for suwannee via loop472 script) ────────────────────
  h-freshness:
    name: "H: Freshness patch — suwannee (via loop472)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: "Run shard5_loop472_h_freshness.py (now includes suwannee)"
        run: |
          set -euo pipefail
          python scripts/shard5_loop472_h_freshness.py

  # ── SUWANNEE BOOTSTRAP (A/B/F/G/I) ──────────────────────────────────────────
  suwannee-bootstrap:
    name: "A/B/F/G/I: Suwannee bootstrap — run1524"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: h-freshness
    if: ${{ github.event.inputs.county == '' || github.event.inputs.county == 'suwannee' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Run shard5_run1524_suwannee_bootstrap.py"
        run: |
          set -euo pipefail
          python scripts/shard5_run1524_suwannee_bootstrap.py

  # ── OSCEOLA C/D PARITY ───────────────────────────────────────────────────────
  osceola-cd-fix:
    name: "C/D: Osceola parity promotion — run1524"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: h-freshness
    if: ${{ github.event.inputs.county == '' || github.event.inputs.county == 'osceola' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Run shard5_run1524_osceola_cd_fix.py"
        run: |
          set -euo pipefail
          python scripts/shard5_run1524_osceola_cd_fix.py
