name: "SUMMIT-B · Train Shapira V14 XGBoost"

on:
  workflow_dispatch:
    inputs:
      summit_dispatch_id:
        description: "summit_chat_dispatch UUID (for traceback)"
        required: false
        default: "2572cb98-5c24-4606-800d-0b106e83de7f"
  # Optional weekly retrain — disabled by default, enable when corpus grows materially
  # schedule:
  #   - cron: '0 8 * * 1'  # Mondays 4 AM EST

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install xgboost==2.1.3 scikit-learn==1.5.2 pandas==2.2.3 numpy==2.0.2 requests==2.32.3

      - name: Mark SUMMIT in_progress
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUMMIT_ID: ${{ github.event.inputs.summit_dispatch_id || '2572cb98-5c24-4606-800d-0b106e83de7f' }}
        run: |
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"state\":\"in_progress\",\"picked_up_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"workflow_run_id\":${{ github.run_id }},\"workflow_run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Train V14 XGBoost
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/train_shapira_v14.py

      - name: Mark SUMMIT closed on success
        if: success()
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUMMIT_ID: ${{ github.event.inputs.summit_dispatch_id || '2572cb98-5c24-4606-800d-0b106e83de7f' }}
        run: |
          MODEL_ID=$(curl -sS "$SUPABASE_URL/rest/v1/shapira_models?model_version=eq.v14.0&order=trained_at.desc&limit=1&select=id,auc,accuracy,storage_path_model" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"state\":\"closed\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"delivery_proof\":{\"workflow_run_id\":${{ github.run_id }},\"workflow_run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"shapira_models_row\":$MODEL_ID,\"harness\":\"gha-ubuntu-xgboost-2.1.3\"}}"

      - name: Mark SUMMIT failed on error
        if: failure()
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUMMIT_ID: ${{ github.event.inputs.summit_dispatch_id || '2572cb98-5c24-4606-800d-0b106e83de7f' }}
        run: |
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"state\":\"failed\",\"last_error\":\"Workflow failed — see run ${{ github.run_id }}\",\"workflow_run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
