name: Dify streaming smoke test — real SUMMIT-equivalent task
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Dify agent via streaming
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Test 1: trivial — reply OK (streaming) ==="
          START=$(date +%s)
          RESP=$($SSH "curl -sS -N -X POST \
            -H 'Authorization: Bearer ${DIFY_API_KEY}' \
            -H 'Content-Type: application/json' \
            -d '{\"inputs\":{},\"query\":\"Reply with only the literal text DIFY_AGENT_OK and nothing else.\",\"response_mode\":\"streaming\",\"user\":\"summit-smoke\"}' \
            -m 60 http://172.22.0.8:5001/v1/chat-messages 2>&1")
          END=$(date +%s)
          echo "wall: $((END-START))s"
          echo "len: ${#RESP}"
          echo "--- last 1500 chars ---"
          echo "$RESP" | tail -c 1500
          echo
          echo "--- extract answer from SSE stream ---"
          echo "$RESP" | python3 -c "
          import json, sys, re
          raw = sys.stdin.read()
          # Dify streaming format is SSE: 'data: {...}\n\n'
          events = []
          for line in raw.splitlines():
              if line.startswith('data: '):
                  try:
                      events.append(json.loads(line[6:]))
                  except: pass
          print(f'events: {len(events)}')
          # Collect answer tokens
          answer = ''
          usage = None
          model = None
          for e in events:
              if e.get('event') == 'agent_message' or e.get('event') == 'message':
                  answer += e.get('answer','')
              if e.get('event') == 'message_end':
                  usage = e.get('metadata',{}).get('usage',{})
              if 'model' in e:
                  model = e.get('model')
          print(f'answer: {answer[:300]!r}')
          print(f'usage: {usage}')
          # Print the unique event types seen
          types = set(e.get('event','?') for e in events)
          print(f'event_types: {types}')
          "

          echo
          echo "=== Test 2: real work — summarize a file from graphify-out ==="
          START=$(date +%s)
          RESP2=$($SSH "curl -sS -N -X POST \
            -H 'Authorization: Bearer ${DIFY_API_KEY}' \
            -H 'Content-Type: application/json' \
            -d '{\"inputs\":{},\"query\":\"In /root/summit-workspace do: cd cli-anything-biddeed && git pull origin main && head -40 graphify-out/GRAPH_REPORT.md. Then reply with a 3-sentence summary of what the graphify adoption does for SUMMIT dispatch. Plain text only.\",\"response_mode\":\"streaming\",\"user\":\"summit-smoke\"}' \
            -m 120 http://172.22.0.8:5001/v1/chat-messages 2>&1")
          END=$(date +%s)
          echo "wall: $((END-START))s"
          echo "len: ${#RESP2}"
          echo "$RESP2" | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          answer = ''
          usage = None
          for line in raw.splitlines():
              if line.startswith('data: '):
                  try:
                      e = json.loads(line[6:])
                      if e.get('event') in ('agent_message','message'):
                          answer += e.get('answer','')
                      if e.get('event') == 'message_end':
                          usage = e.get('metadata',{}).get('usage',{})
                  except: pass
          print(f'answer (first 800): {answer[:800]}')
          print(f'usage: {usage}')
          " || true

          echo "=== END ==="
