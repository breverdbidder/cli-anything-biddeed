name: cc probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: probe
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"EOF" | sed -E 's/(sk-[A-Za-z0-9]{3}|eyJ[A-Za-z0-9]{3}|AQ\.[A-Za-z0-9]{3})[A-Za-z0-9._-]+/\1***/g'
          echo "=== service ==="
          echo -n "is-active: "; systemctl is-active claudecodeui@root 2>&1
          echo -n "is-enabled: "; systemctl is-enabled claudecodeui@root 2>&1
          curl -sS -o /dev/null -w "127.0.0.1:3001 -> %{http_code}\n" -m 6 http://127.0.0.1:3001
          echo "=== claude auth ==="
          (claude --version 2>&1 | head -1) || echo "claude not on PATH"
          test -f /root/.claude/.credentials.json && echo "creds file: present" || echo "creds file: absent"
          grep -o '"subscriptionType"[^,]*' /root/.claude/.credentials.json 2>/dev/null | head -1 || true
          echo "=== cloudflared ==="
          (which cloudflared && cloudflared --version 2>&1 | head -1) || echo "no cloudflared"
          ls -la /etc/cloudflared 2>/dev/null || echo "no /etc/cloudflared"
          (pgrep -a cloudflared | head -3) || echo "no cloudflared process"
          echo "=== tailscale ==="
          (which tailscale && tailscale status 2>&1 | head -3) || echo "no tailscale"
          echo "=== ports ==="
          ss -tlnp 2>/dev/null | grep -E ":(3001|80|443) " || echo "none of 3001/80/443 listening"
          echo "=== END ==="
          EOF
