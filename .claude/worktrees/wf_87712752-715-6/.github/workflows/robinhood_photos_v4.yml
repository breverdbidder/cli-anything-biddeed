name: Robinhood Photos v4 — Resale Chain

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/rh_v4 && mkdir -p /tmp/rh_v4
          cd /tmp/rh_v4

          cat > scrape.py <<'PY'
          import asyncio, json, re, hashlib, time
          from pathlib import Path
          import urllib.request, urllib.parse

          OUT = Path('/tmp/rh_v4')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          def http_get(url, timeout=25, headers=None):
              hdrs = {'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml,application/xml,application/json,*/*'}
              if headers: hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              return urllib.request.urlopen(req, timeout=timeout)

          async def search_acclaim(page, party_name, role="GRANTOR"):
              """Use the same Brevard Clerk pattern that worked for Mariam v8 - CSV export."""
              try:
                  await page.goto(
                      "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                      wait_until="networkidle", timeout=60000,
                  )
                  await asyncio.sleep(2)
                  btn = page.locator("input[value='I accept the conditions above.']")
                  if await btn.count() > 0:
                      await btn.click()
                      await page.wait_for_load_state("networkidle")
                      await asyncio.sleep(3)

                  await page.wait_for_selector("input#SearchOnName", timeout=20000)
                  if role == "GRANTOR":
                      pass  # default = GRANTOR
                  else:
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                  await page.fill("input#SearchOnName", party_name)
                  await page.fill("input#RecordDateFrom", "1/1/2015")
                  await page.fill("input#RecordDateTo", "12/31/2026")
                  await page.click("input#btnSearch")
                  await asyncio.sleep(4)

                  # Name picker - click first visible Done if multiple
                  try:
                      await page.wait_for_selector("text=Select Names:", timeout=8000)
                      all_done = page.locator("input[type='submit'][value='Done']")
                      cnt = await all_done.count()
                      for i in range(cnt):
                          if await all_done.nth(i).is_visible():
                              await all_done.nth(i).click()
                              break
                  except: pass

                  # Wait for results grid + CSV export button
                  await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=30000)
                  await asyncio.sleep(2)

                  async with page.expect_download(timeout=60000) as dl_info:
                      await page.click("a.csvButton#btnCsvButton")
                  download = await dl_info.value
                  safe = party_name.replace(' ','_').replace(',','')
                  csv_path = OUT / f"chain_{safe}_{role}.csv"
                  await download.save_as(str(csv_path))
                  print(f"  saved {role} for {party_name}: {csv_path.stat().st_size}b", flush=True)
                  return csv_path
              except Exception as e:
                  print(f"  err {party_name}/{role}: {e}", flush=True)
                  try:
                      await page.screenshot(path=str(OUT/f"err_{party_name.replace(' ','_').replace(',','')}.png"), full_page=True)
                  except: pass
                  return None

          def find_robinhood_in_csv(csv_path):
              """Find rows whose legal description matches 4087 Robinhood (LT 2 BLK M ... SHERWOOD PARK SEC D)."""
              if not csv_path or not csv_path.exists(): return []
              import csv
              hits = []
              with open(csv_path, 'r', encoding='utf-8-sig', errors='replace') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      legal = row.get('DocLegalDescription','')
                      if 'LT 2 BLK M' in legal and 'SHERWOOD PARK SEC D' in legal:
                          hits.append(row)
              return hits

          async def main():
              from playwright.async_api import async_playwright

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                      accept_downloads=True,
                  )
                  page = await ctx.new_page()

                  # Find McKenzie's "From" records (when she sold)
                  print("=== Search MCKENZIE,RASHEDA as GRANTOR ===", flush=True)
                  csv1 = await search_acclaim(page, "MCKENZIE,RASHEDA", "GRANTOR")
                  hits1 = find_robinhood_in_csv(csv1) if csv1 else []
                  print(f"  Robinhood hits in McKenzie chain: {len(hits1)}", flush=True)
                  for h in hits1:
                      print(f"    {h.get('RecordDate')} {h.get('DocTypeDescription')} {h.get('CrossPartyName')} ${h.get('Consideration')}", flush=True)

                  # Also search just RASHEDA without the comma
                  print("\n=== Search RASHEDA MCKENZIE alt format ===", flush=True)
                  csv2 = await search_acclaim(page, "MCKENZIE,RASHEDA A", "GRANTOR")
                  hits2 = find_robinhood_in_csv(csv2) if csv2 else []
                  print(f"  alt hits: {len(hits2)}", flush=True)
                  for h in hits2:
                      print(f"    {h.get('RecordDate')} {h.get('DocTypeDescription')} {h.get('CrossPartyName')} ${h.get('Consideration')}", flush=True)

                  # Compose full chain summary
                  all_chain = hits1 + hits2
                  # Dedupe by InstrumentNumber
                  seen_inst = set(); uniq_chain = []
                  for h in all_chain:
                      i = h.get('InstrumentNumber')
                      if i and i not in seen_inst:
                          seen_inst.add(i); uniq_chain.append(h)

                  with open(OUT/'robinhood_chain.json','w') as f:
                      json.dump(uniq_chain, f, indent=2)
                  print(f"\n>>> Total unique chain hits: {len(uniq_chain)}", flush=True)

                  # If we found a resale, search for the next buyer too
                  next_buyers = []
                  for h in uniq_chain:
                      if h.get('Party') == 'From' and h.get('CrossPartyName'):
                          next_buyers.append(h.get('CrossPartyName'))
                  print(f"  Next buyers identified: {next_buyers}", flush=True)

                  # Search next buyer's chain
                  for buyer in next_buyers[:2]:
                      print(f"\n=== Search {buyer} as GRANTOR ===", flush=True)
                      csvN = await search_acclaim(page, buyer, "GRANTOR")
                      hitsN = find_robinhood_in_csv(csvN) if csvN else []
                      print(f"  hits: {len(hitsN)}", flush=True)
                      for h in hitsN:
                          print(f"    {h.get('RecordDate')} {h.get('DocTypeDescription')} {h.get('CrossPartyName')} ${h.get('Consideration')}", flush=True)
                      uniq_chain.extend(hitsN)

                  # Save full chain
                  seen_inst = set(); final_chain = []
                  for h in uniq_chain:
                      i = h.get('InstrumentNumber')
                      if i and i not in seen_inst:
                          seen_inst.add(i); final_chain.append(h)
                  with open(OUT/'robinhood_full_chain.json','w') as f:
                      json.dump(final_chain, f, indent=2)
                  print(f"\n>>> Final chain: {len(final_chain)} transactions", flush=True)

                  # ==== STAGE 2: Once we know resale year, fetch Wayback Zillow snapshots ====
                  print("\n=== Stage 2: Wayback Zillow for resale year ===", flush=True)
                  resale_years = set()
                  for h in final_chain:
                      d = h.get('RecordDate','')
                      m = re.search(r'(\d{1,2})/(\d{1,2})/(\d{4})', d)
                      if m:
                          resale_years.add(int(m.group(3)))
                  print(f"  Years with transactions: {sorted(resale_years)}", flush=True)

                  await browser.close()

              # ==== Wayback CDX directly via urllib (NO playwright) ====
              all_image_urls = set()
              for url_pat in [
                  "zillow.com/homedetails/4087-Robinhood*",
                  "zillow.com/homedetails/*Robinhood*Melbourne*32935*",
                  "redfin.com/FL/Melbourne/4087-Robinhood*",
                  "trulia.com/property/*-4087*Robinhood*",
                  "trulia.com/p/fl/melbourne/4087-robinhood*",
              ]:
                  cdx_url = f"https://web.archive.org/cdx/search/cdx?url={urllib.parse.quote(url_pat)}&output=json&limit=200"
                  try:
                      with http_get(cdx_url, timeout=40) as r:
                          body = r.read()
                      data = json.loads(body)
                      print(f"  CDX [{url_pat[:55]}]: {len(data)-1 if len(data)>0 else 0} rows", flush=True)
                      for row in data[1:]:
                          ts, orig, mime = row[1], row[2], row[3]
                          snap_url = f"https://web.archive.org/web/{ts}/{orig}"
                          # Skip image MIMEs - these direct image archives are gold
                          if 'image' in str(mime).lower():
                              all_image_urls.add(snap_url)
                              continue
                          # Fetch HTML
                          try:
                              with http_get(snap_url, timeout=30) as r2:
                                  html = r2.read().decode('utf-8', errors='replace')
                              for pat in [
                                  r'https://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                                  r'https://ssl\.cdn-redfin\.com/photo/[^"\s\'\\]+?\.jpg',
                                  r'https://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?\.jpg',
                                  r'https://thumbs\.trulia[^"\s\'\\]+?\.jpg',
                                  r'/web/\d+im_/https?://photos\.zillowstatic\.com/[^"\s\'\\]+?\.jpg',
                                  r'/web/\d+im_/https?://ssl\.cdn-redfin\.com/[^"\s\'\\]+?\.jpg',
                                  r'/web/\d+im_/https?://[a-z]{1,4}\.rdcpix\.com/[^"\s\'\\]+?\.jpg',
                              ]:
                                  for u in re.findall(pat, html):
                                      if u.startswith('/web/'):
                                          u = 'https://web.archive.org' + u
                                      all_image_urls.add(u)
                              if len(html) > 50000:
                                  # save the first big one
                                  outp = OUT / f'snap_{ts}.html'
                                  if not outp.exists():
                                      outp.write_text(html[:200000], errors='replace')
                          except Exception as ee:
                              print(f"    snap fetch err: {str(ee)[:60]}", flush=True)
                              time.sleep(1)
                  except Exception as e:
                      print(f"  CDX err [{url_pat[:30]}]: {str(e)[:80]}", flush=True)
                  time.sleep(1)

              print(f"\n>>> Image URLs found in Wayback: {len(all_image_urls)}", flush=True)
              for u in list(all_image_urls)[:10]:
                  print(f"    {u[:140]}", flush=True)

              # Download
              downloaded = []
              for i, url in enumerate(list(all_image_urls)[:50], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_robinhood_{h}.jpg"
                      with http_get(url, timeout=25, headers={'Referer': 'https://web.archive.org/'}) as r:
                          data = r.read()
                      if len(data) > 8000:
                          (OUT / fname).write_bytes(data)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                          print(f"  [{i}] {len(data)}b -> {fname}", flush=True)
                  except Exception as e:
                      print(f"  [{i}] FAIL: {str(e)[:60]}", flush=True)

              with open(OUT/'manifest.json','w') as f:
                  json.dump({
                      'chain': final_chain,
                      'resale_years': sorted(list(resale_years)),
                      'downloaded': downloaded,
                  }, f, indent=2, default=str)
              print(f"\n>>> Total photos downloaded: {len(downloaded)}", flush=True)

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/rh_v4/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/rh_v4/ /tmp/results/ || true
          ls -la /tmp/results/rh_v4/ 2>/dev/null

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos_v4
          path: /tmp/results/
          retention-days: 90
