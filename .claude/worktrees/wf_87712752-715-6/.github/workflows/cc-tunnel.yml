name: cc tunnel
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: quick tunnel
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"EOF"
          CFD=$(command -v cloudflared)
          cat >/etc/systemd/system/cc-tunnel.service <<UNIT
          [Unit]
          Description=cloudflared quick tunnel -> claudecodeui 3001
          After=network-online.target
          Wants=network-online.target
          [Service]
          ExecStart=$CFD tunnel --no-autoupdate --url http://127.0.0.1:3001
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cc-tunnel >/dev/null 2>&1
          sleep 15
          URL=$(journalctl -u cc-tunnel --no-pager -n 300 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)
          echo "TUNNEL_URL=$URL"
          echo "TUNNEL_ACTIVE=$(systemctl is-active cc-tunnel)"
          [ -n "$URL" ] && echo "PUBLIC_CHECK=$(curl -sS -o /dev/null -w '%{http_code}' -m 15 "$URL/api/auth/status")"
          echo "END"
          EOF
