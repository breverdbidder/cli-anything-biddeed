name: "SUMMIT: Task from Issue"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number to execute'
        required: true
        type: string
      timeout_minutes:
        description: 'Max session duration (minutes)'
        required: false
        default: '90'
        type: string

jobs:
  summit-dispatch:
    name: "🏔️ SUMMIT Task #${{ inputs.issue_number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute via Claude Runner
        uses: ./.github/actions/claude-runner
        with:
          prompt: |
            Read GitHub issue #${{ inputs.issue_number }} at https://github.com/breverdbidder/cli-anything-biddeed/issues/${{ inputs.issue_number }}.
            Follow CLAUDE.md directives. Load TODO.md if present.
            Execute the task described in the issue autonomously. The issue title and body contain the full task — read it and act on it.
            For GHA failures: diagnose the root cause, fix the workflow file, commit and push.
            For feature work: read any referenced spec files in docs/plans/ or specs/, implement the feature, commit and push.
            For bugs: diagnose, fix, verify with proof (curl/test/query), commit and push.
            Commit frequently with descriptive messages. Push results. Comment on the issue with findings.
            Session budget: 10 dollars max. Honesty Protocol enforced. Mark done in nexus_tasks when complete.
          gh_pat: ${{ secrets.GH_PAT }}
          claude_oauth_b64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
