name: "Fix orange realforeclose_url + is_operational + certify"
# Root cause identified: orange MCA rows have realforeclose_url=NULL.
# Brevard (certified): realforeclose_url='https://brevard.realforeclose.com'
# The calendar_parity guard checks realforeclose_url IS NOT NULL for operational auctions.
# Also: fix is_operational (only 'upcoming' should be True, not all 545).
# Fix: PATCH orange rows to set realforeclose_url + fix is_operational counts.

on:
  workflow_dispatch:

jobs:
  fix-url:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Step 1 — Set realforeclose_url for ALL orange rows"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}",
                 "Content-Type": "application/json", "Prefer": "return=minimal"}

          # Set realforeclose_url for ALL orange rows
          qs = urllib.parse.urlencode({"county": "eq.orange"})
          payload = {
              "realforeclose_url": "https://myorangeclerk.realforeclose.com",
              "source_platform": "realforeclose",
          }
          req = urllib.request.Request(
              f"{SB}/rest/v1/multi_county_auctions?{qs}",
              data=json.dumps(payload).encode(),
              headers=H, method="PATCH",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f"Set realforeclose_url: HTTP {r.status}")

          # Fix is_operational: only 'upcoming' should be True
          # Set is_operational=False for non-upcoming (cancelled, completed, redeemed)
          for status in ("cancelled", "completed", "redeemed"):
              qs2 = urllib.parse.urlencode({"county": "eq.orange", "auction_status": f"eq.{status}"})
              req2 = urllib.request.Request(
                  f"{SB}/rest/v1/multi_county_auctions?{qs2}",
                  data=json.dumps({"is_operational": False}).encode(),
                  headers=H, method="PATCH",
              )
              with urllib.request.urlopen(req2, timeout=30) as r:
                  print(f"Set is_operational=False for {status}: HTTP {r.status}")

          # Verify
          from collections import Counter
          qs3 = urllib.parse.urlencode({"county": "eq.orange",
                                         "select": "realforeclose_url,is_operational,source_platform",
                                         "limit": "1000"})
          req3 = urllib.request.Request(f"{SB}/rest/v1/multi_county_auctions?{qs3}",
                                        headers={"apikey": KEY, "Authorization": f"Bearer {KEY}"})
          with urllib.request.urlopen(req3, timeout=30) as r:
              rows = json.loads(r.read())
          url_cnt = Counter(r.get("realforeclose_url") for r in rows)
          op_cnt  = Counter(r.get("is_operational") for r in rows)
          sp_cnt  = Counter(r.get("source_platform") for r in rows)
          print(f"\nAfter fix:")
          print(f"  realforeclose_url: {dict(url_cnt)}")
          print(f"  is_operational: {dict(op_cnt)}")
          print(f"  source_platform: {dict(sp_cnt)}")
          PYEOF

      - name: "Step 2 — Call certify() after realforeclose_url fix"
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              req = urllib.request.Request(f"{SB}/rest/v1/{path}?{qs}", headers=H)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          print("Calling gold_standard_certify()...")
          req = urllib.request.Request(
              f"{SB}/rest/v1/rpc/gold_standard_certify",
              data=b"{}",
              headers=H, method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read() or b"null")
                  print(f"certify() result: {result}")
                  guard_blocked = result.get("guard_blocked", []) if isinstance(result, dict) else []
          except urllib.error.HTTPError as e:
              body = e.read()
              guard_blocked = ["timeout_or_error"]
              print(f"certify() HTTP {e.code}: {body[:500]}")
          except Exception as e:
              guard_blocked = ["exception"]
              print(f"certify() error: {e}")

          print("\n### SQL VERIFICATION")
          print(f"Timestamp UTC: {datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")

          cert_rows = rest_get("gold_standard_certifications", {
              "county_slug": "eq.orange",
              "select": "county_slug,certified,consecutive_gold,first_certified_at,last_verified_run,updated_at",
          })
          for r in cert_rows:
              print(json.dumps(r))

          sb_rows = rest_get("gold_standard_scoreboard", {
              "county_slug": "eq.orange",
              "select": "county_slug,pass_count,gold_standard,critical_three_pass",
          })
          for r in sb_rows:
              print(json.dumps(r))

          print("\n=== DoD GATE ===")
          dod_pass = False
          for row in cert_rows:
              certified  = row.get("certified", False)
              consec     = row.get("consecutive_gold", 0) or 0
              first_cert = row.get("first_certified_at")
              dod_pass   = bool(certified) and int(consec) >= 1 and first_cert is not None
              print(f"certified={certified}  consecutive_gold={consec}  first_certified_at={first_cert}")
              print(f"guard_blocked: {guard_blocked}")
              print(f"DoD PASS: {dod_pass}")

          if dod_pass:
              print("\nSHIPPED ✅ — orange certified=true, consecutive_gold>=1, first_certified_at set")
          else:
              print("\nFAIL — certified=false after realforeclose_url fix")
              sys.exit(1)
          PYEOF
