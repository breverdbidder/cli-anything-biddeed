name: "Summit Issue #70: Brevard 68%→85% Envelope Conquest"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print counts only, no upserts)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  # ─── Track 1A: Titusville (39%) + Melbourne (82%) ─────────────────
  track1a-titusville-melbourne:
    name: "Track 1A: Titusville (39%) + Melbourne (82%)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx pyproj
      - name: "Conquer Titusville + Melbourne (Municipal GIS)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/summit_conquest_v5.py

  # ─── Track 1B: Cocoa (41%) + Rockledge (58%) ──────────────────────
  track1b-cocoa-rockledge:
    name: "Track 1B: Cocoa (41%) + Rockledge (58%)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx pyproj
      - name: "Conquer Cocoa (AGOL) + Rockledge"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/summit_conquest_v5b.py

  # ─── Track 2: Cocoa Beach (9%) + Palm Bay 29 (71%) + Unincorp 30 (35%) ──
  track2-bcpao-overlay:
    name: "Track 2: Cocoa Beach (9%) + Palm Bay 29 + Unincorp 30 (BCPAO overlay)"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx shapely
      - name: "Conquer via BCPAO County Overlay (7 jurisdictions)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: python scripts/brevard_85_percent_v2.py

  # ─── Verify: Final audit after all tracks complete ─────────────────
  verify:
    name: "NEVER-LIE Audit: Final coverage report"
    runs-on: ubuntu-latest
    needs: [track1a-titusville-melbourne, track1b-cocoa-rockledge, track2-bcpao-overlay]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: "Query Supabase — NEVER-LIE coverage report"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json

          sb_url = os.environ.get("SUPABASE_URL", "")
          sb_key = os.environ.get("SUPABASE_KEY", "")
          tg_bot = os.environ.get("TELEGRAM_BOT_TOKEN", "") or os.environ.get("BIDDEED_BOT_TOKEN", "")
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "") or os.environ.get("BIDDEED_BOT_CHAT_ID", "")

          def sb_count(filter_str):
              url = f"{sb_url}/rest/v1/zoning_assignments?select=id&limit=1&{filter_str}"
              req = urllib.request.Request(url, headers={
                  "apikey": sb_key,
                  "Authorization": f"Bearer {sb_key}",
                  "Prefer": "count=exact"
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  cr = r.headers.get("content-range", "0/0")
                  return int(cr.split("/")[1]) if "/" in cr else 0

          def tg(msg):
              print(msg)
              if tg_bot and tg_chat:
                  try:
                      data = json.dumps({"chat_id": tg_chat, "text": msg[:4000]}).encode()
                      req = urllib.request.Request(
                          f"https://api.telegram.org/bot{tg_bot}/sendMessage",
                          data=data, headers={"Content-Type": "application/json"}
                      )
                      urllib.request.urlopen(req, timeout=10)
                  except Exception as e:
                      print(f"[tg] {e}")

          # Target jurisdictions — totals from BCPAO (pre-conquest)
          TARGETS = {
              "cocoa_beach":       40498,
              "titusville":        16471,
              "cocoa":             37215,
              "rockledge":         19864,
              "palm_bay_29":       59780,
              "unincorporated_30": 11800,
              "melbourne":         32478,
          }

          lines = ["🏔️ SUMMIT ISSUE #70 — FINAL COVERAGE AUDIT", ""]
          total_covered = 0
          total_parcels = 0
          all_above_85 = True

          for jur, target in sorted(TARGETS.items()):
              try:
                  covered = sb_count(f"jurisdiction=eq.{jur}")
              except Exception as e:
                  covered = -1
                  print(f"  Query error for {jur}: {e}")

              pct = (covered / target * 100) if target > 0 and covered >= 0 else 0
              status = "✅" if pct >= 85 else ("⚠️" if pct >= 50 else "❌")
              lines.append(f"  {status} {jur}: {covered:,}/{target:,} ({pct:.1f}%)")

              if pct < 85:
                  all_above_85 = False
              if covered > 0:
                  total_covered += covered
                  total_parcels += target

          overall = (total_covered / total_parcels * 100) if total_parcels else 0
          lines.append("")
          lines.append(f"📊 Overall: {total_covered:,}/{total_parcels:,} ({overall:.1f}%)")
          lines.append(f"🎯 Target: 85%+ all jurisdictions")
          lines.append(f"{'✅ MISSION COMPLETE' if all_above_85 else '⚠️ PARTIAL — re-run needed'}")
          lines.append("")
          lines.append("NEVER-LIE: All counts from live Supabase queries.")

          tg("\n".join(lines))
          print("\n".join(lines))

          # Exit non-zero if not at target (informational only — don't fail workflow)
          if not all_above_85:
              print("\nSome jurisdictions still below 85%. Re-run needed for remaining gaps.")
          EOF
