name: Certify Router (Haiku→Sonnet→Opus)

on:
  workflow_dispatch:
    inputs:
      counties:
        description: 'Comma-separated county slugs (leave blank for all gold-standard candidates)'
        required: false
        default: ''
      run_id:
        description: 'Optional run ID (generated if blank)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (gate only, no LLM screens or DB writes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    # Runs after the evening verification sweep (21:30 UTC = 5:30 PM EDT)
    - cron: '30 21 * * *'

concurrency:
  group: certify-router
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet anthropic httpx

      - name: Apply router schema migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Idempotent — CREATE TABLE IF NOT EXISTS, ON CONFLICT DO NOTHING
          python3 - <<'EOF'
          import httpx, os, pathlib
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          sql = pathlib.Path("supabase/migrations/20260619_certify_router.sql").read_text()
          resp = httpx.post(
              f"{url}/rest/v1/rpc/execute_sql",
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"},
              json={"query": sql},
              timeout=30,
          )
          # execute_sql may not exist; fall through (migration idempotent via IF NOT EXISTS)
          print(f"Migration apply status: {resp.status_code}")
          EOF
        continue-on-error: true

      - name: Resolve counties
        id: resolve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_COUNTIES: ${{ github.event.inputs.counties }}
        run: |
          python3 - <<'EOF'
          import httpx, json, os
          counties_input = os.environ.get("INPUT_COUNTIES", "").strip()
          if counties_input:
              counties = [c.strip() for c in counties_input.split(",") if c.strip()]
          else:
              # All counties with pass_count=10 in latest gold_standard_county_status
              url = os.environ["SUPABASE_URL"]
              key = os.environ["SUPABASE_KEY"]
              headers = {"apikey": key, "Authorization": f"Bearer {key}"}
              resp = httpx.get(
                  f"{url}/rest/v1/gold_standard_scoreboard",
                  headers=headers,
                  params={"pass_count": "eq.10", "select": "county_slug"},
                  timeout=20,
              )
              rows = resp.json() if resp.status_code == 200 else []
              counties = [r["county_slug"] for r in rows]
              if not counties:
                  # Fallback to known gold-standard counties
                  counties = ["brevard", "duval", "indian_river", "osceola", "sarasota"]
          print(f"Counties to certify: {counties}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"counties={','.join(counties)}\n")
              f.write(f"count={len(counties)}\n")
          EOF

      - name: Run certify router
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'cron' || 'dispatch' }}
        run: |
          COUNTIES="${{ steps.resolve.outputs.counties }}"
          RUN_ID="${{ github.event.inputs.run_id }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          ARGS=$(python3 -c "print(' '.join('$COUNTIES'.split(',')))")

          if [ "$DRY_RUN" = "true" ]; then
            python3 -m certify.router $ARGS --dry-run
          elif [ -n "$RUN_ID" ]; then
            python3 -m certify.router $ARGS --run-id "$RUN_ID"
          else
            python3 -m certify.router $ARGS
          fi

      - name: Run backtest (7-day verdict parity check)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 -m certify.backtest --days 7
        # A flip causes non-zero exit → workflow fails → loop does NOT exit

      - name: Print cost telemetry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'EOF'
          import httpx, json, os
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          resp = httpx.get(
              f"{url}/rest/v1/v_certify_cost_weekly",
              headers=headers,
              params={"limit": "4", "order": "week_start.desc"},
              timeout=20,
          )
          rows = resp.json() if resp.status_code == 200 else []
          print("\n=== Weekly Opus Reduction ===")
          for row in rows:
              print(
                  f"Week {row['week_start']}: "
                  f"actual={row['actual_cost_cents']}¢ "
                  f"opus_only={row['opus_only_cost_cents']}¢ "
                  f"reduction={row['opus_reduction_pct']}%"
              )
          EOF
