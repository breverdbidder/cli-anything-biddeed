name: Nexus Infra Setup

on:
  repository_dispatch:
    types: [nexus-infra]

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Add nexus.zonewise.ai CNAME via Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai" \
            -H "Authorization: Bearer $CF_API_TOKEN" | \
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NONE')")
          echo "Zone: $ZONE_ID"

          RECORDS=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=nexus.zonewise.ai" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          COUNT=$(echo "$RECORDS" | python3 -c "import json,sys; r=json.load(sys.stdin).get('result'); print(len(r) if r else 0)")

          if [ "$COUNT" = "0" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"nexus","content":"cname.vercel-dns.com","ttl":1,"proxied":false}' | \
              python3 -c "import json,sys; d=json.load(sys.stdin); print('CNAME CREATED' if d.get('success') else f'FAIL: {d.get(\"errors\",\"\")}')"
          else
            echo "CNAME already exists — skipping"
          fi

      - name: Create Vercel project and link domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Check if project exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.vercel.com/v9/projects/everest-nexus" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          if [ "$STATUS" != "200" ]; then
            echo "Creating Vercel project..."
            curl -s -X POST "https://api.vercel.com/v10/projects" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "everest-nexus",
                "framework": "nextjs",
                "gitRepository": {"type": "github", "repo": "breverdbidder/everest-nexus"}
              }' | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Project: {d.get(\"id\",\"FAIL\")} name: {d.get(\"name\",\"?\")}')"
          else
            echo "Project exists"
          fi

          echo "Adding domain..."
          curl -s -X POST "https://api.vercel.com/v10/projects/everest-nexus/domains" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"nexus.zonewise.ai"}' | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Domain: {d.get(\"name\",d.get(\"error\",{}).get(\"message\",\"FAIL\"))}')"

      - name: Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=NEXUS INFRA: ${{ job.status }} — DNS + Vercel — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
