name: Fix Claude Code Install on Hetzner

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H 87.99.129.125 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install and fix Claude Code on Hetzner
        run: |
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@87.99.129.125 'bash -s' << 'REMOTE'
          set -ex
          
          echo "=== [1/5] Node.js ==="
          node --version
          npm --version
          
          echo "=== [2/5] NPM global prefix ==="
          NPM_PREFIX=$(npm config get prefix)
          echo "NPM prefix: $NPM_PREFIX"
          ls -la "$NPM_PREFIX/bin/" 2>/dev/null || echo "No bin dir yet"
          
          echo "=== [3/5] Install Claude Code ==="
          npm install -g @anthropic-ai/claude-code@latest
          
          echo "=== [4/5] Find claude binary ==="
          NPM_BIN="$NPM_PREFIX/bin"
          ls -la "$NPM_BIN/claude" 2>/dev/null || echo "Not in prefix bin"
          find / -name "claude" -type f 2>/dev/null | head -5 || true
          find / -name "claude" -type l 2>/dev/null | head -5 || true
          
          # Ensure npm global bin is in PATH for all sessions
          if ! echo "$PATH" | grep -q "$NPM_BIN"; then
            echo "export PATH=\"$NPM_BIN:\$PATH\"" >> /root/.bashrc
            echo "export PATH=\"$NPM_BIN:\$PATH\"" >> /root/.profile
            echo "Added $NPM_BIN to PATH in .bashrc and .profile"
          fi
          
          # Also create symlink in /usr/local/bin as fallback
          if [ -f "$NPM_BIN/claude" ] || [ -L "$NPM_BIN/claude" ]; then
            ln -sf "$NPM_BIN/claude" /usr/local/bin/claude
            echo "Symlinked claude to /usr/local/bin/claude"
          fi
          
          echo "=== [5/5] Verify ==="
          export PATH="$NPM_BIN:$PATH"
          which claude
          claude --version || echo "Version command failed but binary found"
          echo ""
          echo "STATUS: Claude Code CLI installed and PATH fixed"
          REMOTE
