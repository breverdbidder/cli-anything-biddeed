name: Emergency - Create Missing Tables
on: workflow_dispatch

jobs:
  create_tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create certify_router_config table
        env:
          DB_HOST: db.mocerqjnksmhcjzxrewo.supabase.co
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_NAME: postgres
        run: |
          apt-get update && apt-get install -y postgresql-client
          
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -c "
          CREATE TABLE IF NOT EXISTS public.certify_router_config (
            id BIGSERIAL PRIMARY KEY,
            router_name VARCHAR(100) NOT NULL DEFAULT 'primary',
            max_concurrent_counties INTEGER DEFAULT 10,
            retry_attempts INTEGER DEFAULT 3,
            enable_shadow_audit BOOLEAN DEFAULT true,
            certification_criteria JSONB DEFAULT '{
              "consecutive_gold_min": 10,
              "false_positive_threshold": 0.01,
              "data_freshness_hours": 24
            }',
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW()
          );
          
          INSERT INTO public.certify_router_config (router_name, max_concurrent_counties)
          VALUES ('primary', 10)
          ON CONFLICT DO NOTHING;
          
          SELECT 'Router config table created' as status;
          "
          
          echo "✅ certify_router_config table created/verified"
