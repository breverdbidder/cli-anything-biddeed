name: "Summit: ZoneWise Multi-County Migration"
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Run multi-county schema migration"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "=== Running 20260320_multi_county_schema.sql ==="
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -f migrations/20260320_multi_county_schema.sql \
            --echo-errors
          echo "=== Migration complete ==="

      - name: "Verify tables exist"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "SELECT COUNT(*) as fl_counties_rows FROM fl_counties;"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "SELECT co_no, parcels_ingested, coverage_pct, status FROM county_conquest_status WHERE co_no=5;"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "SELECT COUNT(*) as za_total FROM zoning_assignments WHERE county='brevard';"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h db.mocerqjnksmhcjzxrewo.supabase.co \
            -p 5432 -U postgres -d postgres \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='zoning_assignments' AND column_name IN ('co_no','zone_source','zone_confidence','dor_uc') ORDER BY column_name;"
