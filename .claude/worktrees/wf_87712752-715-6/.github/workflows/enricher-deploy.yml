name: "Deploy Enricher to Hetzner"

on:
  push:
    paths:
      - 'enricher/**'
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test after deploy'
        required: false
        type: boolean
        default: true
      test_parcel:
        description: 'Parcel ID for smoke test (blank = default)'
        required: false
        default: ''

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed
  ENRICHER_PATH: /opt/biddeed/cli-anything-biddeed/enricher

jobs:
  deploy:
    name: "🏠 Deploy Enricher"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "1️⃣ Deploy to Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            # Ensure repo exists
            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              echo "📥 Repo not found — cloning..."
              cd /opt/biddeed
              git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
            fi

            # Pull latest
            cd ${{ env.REPO_PATH }}
            git fetch origin main
            git reset --hard origin/main
            echo "📦 Pulled: $(git log --oneline -1)"

            # Verify enricher files
            test -f enricher/agent.py       || { echo "❌ Missing agent.py"; exit 1; }
            test -f enricher/CLAUDE.md      || { echo "❌ Missing CLAUDE.md"; exit 1; }
            test -f enricher/eval/eval.json || { echo "❌ Missing eval.json"; exit 1; }
            echo "✅ Enricher files verified"

            # Install deps
            pip install httpx --quiet --break-system-packages 2>/dev/null || true

            # Create eval outputs dir
            mkdir -p enricher/eval_outputs

            echo "✅ Enricher deployed to Hetzner"

      - name: "2️⃣ Create Supabase table"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            # Create property_profiles table if not exists
            curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/exec_sql" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "CREATE TABLE IF NOT EXISTS property_profiles (id BIGSERIAL PRIMARY KEY, parcel_id TEXT UNIQUE NOT NULL, owner_name TEXT, owner_type TEXT, assessed_value BIGINT, market_value BIGINT, delinquent BOOLEAN DEFAULT FALSE, sale_type TEXT, action TEXT, max_bid BIGINT, motivation_score INT, confidence FLOAT, enriched_at TIMESTAMPTZ, raw_json JSONB, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW()); CREATE INDEX IF NOT EXISTS idx_pp_action ON property_profiles(action); CREATE INDEX IF NOT EXISTS idx_pp_sale_type ON property_profiles(sale_type);"
              }' 2>/dev/null || echo "⚠️ Supabase table creation skipped (may already exist or exec_sql not enabled — create manually)"

      - name: "3️⃣ Smoke test"
        if: github.event.inputs.smoke_test != 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            PARCEL="${{ github.event.inputs.test_parcel }}"
            [ -z "$PARCEL" ] && PARCEL="2537220000001"

            echo "🧪 Smoke test: parcel $PARCEL"

            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"

            python3 -m enricher.agent enrich \
              --parcel "$PARCEL" \
              --mode foreclosure \
              --depth quick \
              --json > enricher/eval_outputs/smoke_test.json 2>&1 || true

            if [ -f enricher/eval_outputs/smoke_test.json ]; then
              python3 -c "
            import json, sys
            try:
                d = json.load(open('enricher/eval_outputs/smoke_test.json'))
                stages = list(d.get('stages', {}).keys())
                elapsed = d.get('elapsed_seconds', 'n/a')
                print(f'✅ Smoke test passed: {len(stages)} stages in {elapsed}s')
                print(f'   Stages: {stages}')
                owner = d.get('stages', {}).get('owner', {})
                if owner.get('owner_name'):
                    print(f'   Owner: {owner[\"owner_name\"]}')
                    print(f'   Type: {owner.get(\"owner_type\", \"unknown\")}')
                    print(f'   Confidence: {owner.get(\"confidence\", 0):.0%}')
            except Exception as e:
                print(f'⚠️ Smoke test output not valid JSON: {e}')
                # Show raw output for debugging
                with open('enricher/eval_outputs/smoke_test.json') as f:
                    print(f.read()[:500])
              " 2>&1 || echo "⚠️ Smoke test parsing failed"
            else
              echo "❌ Smoke test produced no output"
            fi

      - name: "4️⃣ Connectivity check"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            python3 -m enricher.agent status 2>&1

      - name: "5️⃣ Telegram notification"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            STATUS="${{ job.status }}"
            EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
            COMMIT=$(cd ${{ env.REPO_PATH }} && git log --oneline -1)

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              -d "text=${EMOJI} <b>Enricher Deploy</b>: ${STATUS}
            Commit: ${COMMIT}
            Server: Hetzner everest-dispatch
            Smoke: ${{ github.event.inputs.smoke_test != 'false' && '✅' || '⏭️ skipped' }}" \
              > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🏠 Enricher Deploy
          **Status:** ${{ job.status }}
          **Server:** Hetzner everest-dispatch (87.99.129.125)
          **Smoke Test:** ${{ github.event.inputs.smoke_test != 'false' && 'Yes' || 'Skipped' }}
          **Trigger:** ${{ github.event_name }}
          EOF
