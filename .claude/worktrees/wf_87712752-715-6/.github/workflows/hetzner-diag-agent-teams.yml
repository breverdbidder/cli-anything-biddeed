name: Hetzner Diag — Agent Teams State

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag, cleanup, or kill'
        required: false
        type: string
        default: 'diag'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH action
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: MODE
          command_timeout: 8m
          script: |
            set +e
            echo "=== MODE: $MODE ==="
            
            if [ "$MODE" = "kill" ]; then
              echo "=== KILLING claude session in everest-agents tmux ==="
              tmux send-keys -t everest-agents:0 C-c C-c C-c 2>&1 || true
              sleep 1
              tmux send-keys -t everest-agents:0 "exit" C-m 2>&1 || true
              sleep 1
              pkill -f 'claude -p' 2>&1 || true
              pkill -f '^claude$' 2>&1 || true
              sleep 1
              echo "--- Claude processes after kill ---"
              ps aux | grep -E 'claude -p|/claude ' | grep -v grep || echo "(no claude processes)"
              echo "--- tmux tail ---"
              tmux capture-pane -pt everest-agents:0 -S -20 2>&1 || true
              echo "=== KILL DONE ==="
              exit 0
            fi
            
            if [ "$MODE" = "cleanup" ]; then
              echo "=== DISK CLEANUP ==="
              df -h / | tail -1
              pkill -9 chromium 2>&1 || true
              apt-get clean -y 2>&1 | tail -1
              journalctl --vacuum-size=200M 2>&1 | tail -1
              if command -v docker >/dev/null; then
                docker system prune -af --volumes 2>&1 | tail -1
              fi
              rm -rf /root/.npm/_cacache /root/.cache/pip 2>&1
              find /root -maxdepth 1 -name "spawn_prompt_*.md" -mtime +1 -delete
              find /root -maxdepth 1 -name ".env-run-*" -mtime +1 -delete
              find /root -maxdepth 1 -name "claude-run-*.log" -mtime +1 -delete
              df -h / | tail -1
            fi
            
            echo ""
            echo "=== tmux sessions ==="
            tmux ls 2>&1 || echo "(none)"
            echo ""
            echo "=== tmux everest-agents tail (50 lines) ==="
            tmux capture-pane -pt everest-agents:0 -S -50 2>&1 || echo "(no session)"
            echo ""
            echo "=== claude processes ==="
            ps aux | grep -E 'claude|node' | grep -v grep | head -10
            echo ""
            echo "=== disk + memory ==="
            df -h / | tail -1
            free -h | head -2
            echo ""
            echo "=== DONE ==="
