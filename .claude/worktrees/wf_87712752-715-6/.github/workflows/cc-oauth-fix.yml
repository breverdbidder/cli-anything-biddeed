name: CC OAuth Fix V2
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fix OAuth and test
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          CLAUDE_CODE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Step 1: Decode B64 and inspect ==="
          echo "$CLAUDE_OAUTH_B64" | base64 -d 2>/dev/null | python3 -c "
          import json,sys
          raw = sys.stdin.read()
          print(f'Raw length: {len(raw)}')
          try:
            d = json.loads(raw)
            for k in d:
              val = d[k]
              if isinstance(val, dict):
                for k2 in val:
                  v2 = str(val[k2])
                  print(f'  {k}.{k2}: {v2[:30]}... (len={len(v2)})')
              else:
                print(f'  {k}: {str(val)[:30]}...')
          except Exception as e:
            print(f'Not JSON: {e}')
            print(f'First 50 chars: {raw[:50]}')
          "

          echo ""
          echo "=== Step 2: Write B64 creds to Hetzner ==="
          CREDS=$(echo "$CLAUDE_OAUTH_B64" | base64 -d 2>/dev/null)
          $SSH "mkdir -p /root/.claude && cat > /root/.claude/.credentials.json << 'CREDEOF'
          $CREDS
          CREDEOF
          echo 'Written. Size:' && wc -c /root/.claude/.credentials.json"

          echo ""
          echo "=== Step 3: Test auth status ==="
          $SSH "claude auth status 2>&1 || true"

          echo ""
          echo "=== Step 4: Test CC with simple command ==="
          $SSH "timeout 30 claude -p 'Run: echo OAUTH_WORKS' --allowedTools 'Bash(*)' 2>&1 | tail -10" || echo "CC test failed"

          echo ""
          echo "=== Step 5: If failed, try headless login URL ==="
          $SSH "claude auth status 2>&1 | grep -q 'true' || (echo 'NEED_RELOGIN' && claude auth login --non-interactive 2>&1 | head -5 || claude /login 2>&1 | head -5 || true)"
