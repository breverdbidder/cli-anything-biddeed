name: "Sprint Parallel Executor (24/6)"

on:
  schedule:
    - cron: '0 */4 * * 0-5'  # Every 4 hours, Sun-Fri (24/6)
  workflow_dispatch:
    inputs:
      force_task:
        description: 'Force specific task (1=competitors, 2=dify, 3=address-fix)'
        required: false
        default: 'all'

concurrency:
  group: sprint-parallel
  cancel-in-progress: false

jobs:
  # ═══ TASK 1: Competitors HTML (THE MOAT) ═══
  task1-competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: "Build 9-competitor battle cards HTML"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "=== TASK 1: Competitors HTML ==="
          # Pull all PRD data from competitive-intelligence repo
          mkdir -p /tmp/ci-data
          
          for file in Dono_ai_PRD.md PropertyOnion_PRD.md Reventure_PRD.md Gridics_COMPLETE_PRD_PRS.md TestFit_Complete_PRD_PRS.md Zoneomics_COMPLETE_PRD_PRS.md; do
            curl -sH "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/breverdbidder/competitive-intelligence/contents/prds/$file" | \
              python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d['content']).decode())" > /tmp/ci-data/$file 2>/dev/null || true
          done
          
          # Pull existing competitors HTML
          curl -sH "Authorization: token $GH_PAT" \
            "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/contents/pages/competitors.html" | \
            python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d['content']).decode())" > /tmp/ci-data/current.html 2>/dev/null || true
          
          # Pull Algoma analysis from zonewise-web
          curl -sH "Authorization: token $GH_PAT" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/contents/public/competitors.html" | \
            python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d['content']).decode())" > /tmp/ci-data/zonewise-version.html 2>/dev/null || true
          
          echo "PRD files collected:"
          ls -la /tmp/ci-data/
          echo ""
          echo "Task 1 data staged. SUMMIT dispatch needed for HTML generation."

      - name: "Notify status"
        if: always()
        env:
          TG_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🏔️ Sprint Task 1 (Competitors HTML): Data staged. $(date -u +%H:%M)" || true

  # ═══ TASK 2: Dify Deploy + Configure ═══
  task2-dify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Deploy/Check Dify on Hetzner"
        env:
          HETZNER_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          echo "=== TASK 2: Dify Backend ==="
          mkdir -p ~/.ssh
          echo "$HETZNER_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null
          
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP << 'REMOTE'
            # Check if Dify is running
            if docker ps | grep -q dify; then
              echo "✅ Dify already running"
              docker ps --format 'table {{.Names}}	{{.Status}}' | grep dify
            else
              echo "🔧 Deploying Dify..."
              if [ ! -d /opt/dify-zonewise ]; then
                git clone --depth 1 https://github.com/breverdbidder/dify-zonewise.git /opt/dify-zonewise
              fi
              cd /opt/dify-zonewise/docker
              if [ ! -f .env ]; then
                cp .env.example .env
                SECRET=$(openssl rand -hex 32)
                _IP=$(hostname -I | awk '{print $1}')
                echo "CONSOLE_API_URL=http://${_IP}:3100/console/api" >> .env
                echo "CONSOLE_WEB_URL=http://${_IP}:3100" >> .env
                echo "SERVICE_API_URL=http://${_IP}:3100/api" >> .env
                echo "APP_WEB_URL=http://${_IP}:3100" >> .env
                echo "VECTOR_STORE=pgvector" >> .env
                echo "COMPOSE_PROFILES=pgvector,postgresql" >> .env
                echo "INIT_PASSWORD=zonewise2026" >> .env
                sed -i "s/SECRET_KEY=.*/SECRET_KEY=$SECRET/" .env
                sed -i 's/80:80/3100:80/' docker-compose.yaml
              fi
              docker compose pull
              docker compose up -d
              echo "⏳ Waiting 90s for startup..."
              sleep 90
              echo "=== Status ==="
              docker ps --format 'table {{.Names}}	{{.Status}}' | head -15
            fi
            
            # Health check
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100 2>/dev/null || echo "000")
            echo "Health: HTTP $HTTP_CODE"
          REMOTE

      - name: "Notify status"
        if: always()
        env:
          TG_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🏔️ Sprint Task 2 (Dify Deploy): Complete. $(date -u +%H:%M)" || true

  # ═══ TASK 3: Address Parser Fix + Verify ═══
  task3-address-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Verify address parser on production"
        run: |
          echo "=== TASK 3: Address Parser Verification ==="
          PASS=0
          FAIL=0
          
          for addr in "1600 S Orlando Ave Cocoa Beach" "2100 N Courtenay Pkwy Merritt Island" "3680 N Atlantic Ave Cocoa Beach" "625 Ocean Street Satellite Beach" "1900 S Harbor City Blvd Melbourne"; do
            RESULT=$(curl -s -X POST "https://zonewise.ai/api/zoning-chat" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"$addr\"}" --max-time 20 2>/dev/null || echo '{}')
            
            HAS_PARCEL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('parcel') else 'NO')" 2>/dev/null || echo "ERROR")
            
            if [ "$HAS_PARCEL" = "YES" ]; then
              echo "  ✅ $addr"
              PASS=$((PASS+1))
            else
              echo "  ❌ $addr"
              FAIL=$((FAIL+1))
            fi
          done
          
          echo ""
          echo "Results: $PASS passed, $FAIL failed out of 5 tests"
          echo "PASS_RATE=$PASS" >> $GITHUB_ENV

      - name: "Notify results"
        if: always()
        env:
          TG_BOT: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🏔️ Sprint Task 3 (Address Parser): ${PASS_RATE:-?}/5 passing. $(date -u +%H:%M)" || true

  # ═══ MONITOR: Update sprint board ═══
  update-board:
    needs: [task1-competitors, task2-dify, task3-address-fix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Update sprint board"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "=== Sprint Board Update ==="
          echo "Task 1 (Competitors): ${{ needs.task1-competitors.result }}"
          echo "Task 2 (Dify): ${{ needs.task2-dify.result }}"
          echo "Task 3 (Address Fix): ${{ needs.task3-address-fix.result }}"
          echo "Time: $(date -u)"
