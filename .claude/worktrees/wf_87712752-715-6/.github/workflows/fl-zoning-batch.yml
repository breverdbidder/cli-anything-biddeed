name: FL Zoning Batch Ingest

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch key from fl_counties_manifest.yml"
        required: true
        default: batch_1_metro
        type: choice
        options:
          - batch_1_metro
          - batch_2
          - batch_3
          - batch_4
          - batch_5
          - batch_6

permissions:
  contents: read

concurrency:
  group: fl-zoning-${{ github.event.inputs.batch }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet psycopg2-binary requests pyyaml

      - name: Preflight — require SUPABASE_DB_URL
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set on this repo"
            exit 1
          fi
          echo "SUPABASE_DB_URL present (length ${#SUPABASE_DB_URL})"

      - name: Run batch ingest
        run: python zw_zoning_ingest.py --batch "${{ github.event.inputs.batch }}"
