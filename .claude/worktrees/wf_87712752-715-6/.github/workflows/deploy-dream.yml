name: Deploy Dream Skill

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos (or "all")'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (no actual deployment)'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy-dream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Dream Skill
        env:
          GITHUB_TOKEN: ${{ secrets.PAT4 }}
          PAT4: ${{ secrets.PAT4 }}
          TARGET_REPOS: ${{ inputs.repos }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          chmod +x scripts/deploy-dream-skill.sh
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN — would deploy to: ${TARGET_REPOS}"
            exit 0
          fi
          bash scripts/deploy-dream-skill.sh

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi
          MSG="${EMOJI} Dream Skill Deploy: ${STATUS}%0ARepos: ${{ inputs.repos }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" || true
