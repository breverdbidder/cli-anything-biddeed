name: Find Browserless Key on Hetzner

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Probe Hetzner for Browserless key location (and print MASKED preview only)
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'EOF'
          echo "=== env vars matching BROWSER ==="
          env | grep -i browser | sed 's/=.*/=<REDACTED>/'

          echo ""
          echo "=== .env files in /opt ==="
          find /opt -maxdepth 3 -name ".env" -o -name ".env.*" 2>/dev/null | head -10

          echo ""
          echo "=== Search all .env files for BROWSERLESS ==="
          for f in $(find /opt -maxdepth 4 -name ".env*" 2>/dev/null); do
            if grep -q "BROWSERLESS" "$f" 2>/dev/null; then
              echo "FOUND in: $f"
              grep -i BROWSERLESS "$f" | head -3 | sed 's/=.*/=<HAS_VALUE>/'
            fi
          done

          echo ""
          echo "=== /root/.bashrc /root/.profile for BROWSERLESS ==="
          grep -i browser /root/.bashrc /root/.profile /etc/environment 2>/dev/null | sed 's/=.*/=<HAS_VALUE>/'

          echo ""
          echo "=== Systemd service env ==="
          find /etc/systemd/system -name "*.service" 2>/dev/null | xargs grep -l -i browser 2>/dev/null | head -3

          echo ""
          echo "=== Look for it in any biddeed/brevard config ==="
          for d in /opt/brevard-bidder-scraper /opt/biddeed-brain /opt/cli-anything-biddeed /opt/auction-scraper-playwright; do
            if [ -d "$d" ]; then
              echo "Checking $d:"
              find "$d" -maxdepth 3 -name "*.env*" -o -name "config.*" 2>/dev/null | head -5
              find "$d" -maxdepth 3 -type f \( -name "*.env*" -o -name "config.*" -o -name "secrets.*" \) -exec grep -l BROWSERLESS {} \; 2>/dev/null
            fi
          done
          EOF
