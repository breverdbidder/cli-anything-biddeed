name: Deploy AgentRemote V5 Executor to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'executor/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - status
          - restart

jobs:
  deploy-executor:
    name: "\U0001F680 Deploy AgentRemote Executor"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to Hetzner
        if: inputs.action == 'deploy' || inputs.action == ''
        uses: appleboy/ssh-action@v1
        env:
          AGENT_SECRET_V5: ${{ secrets.AGENT_SECRET_V5 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: AGENT_SECRET_V5,SUPABASE_KEY,TELEGRAM_BOT_TOKEN,GEMINI_API_KEY
          script: |
            set -e
            echo "=== AgentRemote V5 Executor Deploy ==="
            
            mkdir -p /opt/agentremote-executor
            
            curl -sL "https://raw.githubusercontent.com/breverdbidder/claude-code-telegram-control/main/executor/executor.py?$(date +%s)" \
              -o /opt/agentremote-executor/executor.py
            
            pip install requests --break-system-packages -q
            
            cat > /opt/agentremote-executor/.env << ENVEOF
            AGENT_SECRET=${AGENT_SECRET_V5}
            SUPABASE_URL=https://mocerqjnksmhcjzxrewo.supabase.co
            SUPABASE_SERVICE_KEY=${SUPABASE_KEY}
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            ENVEOF
            
            sed -i 's/^[[:space:]]*//' /opt/agentremote-executor/.env
            
            cat > /etc/systemd/system/agentremote-executor.service << 'SVCEOF'
            [Unit]
            Description=AgentRemote V5 Executor
            After=network.target
            
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/agentremote-executor
            ExecStart=/usr/bin/python3 /opt/agentremote-executor/executor.py
            Restart=always
            RestartSec=5
            Environment=EXECUTOR_PORT=8318
            Environment=CLAUDE_CMD=claude
            Environment=MAX_TASK_DURATION=300
            EnvironmentFile=/opt/agentremote-executor/.env
            
            [Install]
            WantedBy=multi-user.target
            SVCEOF
            
            sed -i 's/^[[:space:]]*//' /etc/systemd/system/agentremote-executor.service
            
            systemctl daemon-reload
            systemctl enable agentremote-executor
            systemctl restart agentremote-executor
            sleep 3
            
            echo "=== Service Status ==="
            systemctl is-active agentremote-executor
            echo "=== Health Check ==="
            curl -sf http://127.0.0.1:8318/health && echo ""
            echo "=== Env Keys ==="
            cat /opt/agentremote-executor/.env | sed 's/=.*/=***/'
            echo "=== Done ==="

      - name: Check Status
        if: inputs.action == 'status'
        uses: appleboy/ssh-action@v1
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== Service ==="
            systemctl status agentremote-executor --no-pager | head -15
            echo "=== Health ==="
            curl -sf http://127.0.0.1:8318/health | python3 -m json.tool 2>/dev/null || echo "Not responding"
            echo "=== Logs ==="
            journalctl -u agentremote-executor --no-pager -n 30 --output=cat

      - name: Restart
        if: inputs.action == 'restart'
        uses: appleboy/ssh-action@v1
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            systemctl restart agentremote-executor
            sleep 2
            systemctl is-active agentremote-executor
            curl -sf http://127.0.0.1:8318/health | python3 -m json.tool
