name: Daily Action Plan V2 (6:00 AM EDT)

on:
  schedule:
    - cron: '0 10 * * *'  # 6:00 AM EDT = 10:00 UTC
  workflow_dispatch:

jobs:
  action-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate and send action plan (V2 — ML scoring + carryforward)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          pip install requests --break-system-packages -q 2>/dev/null
          python3 scripts/daily_action_plan.py
