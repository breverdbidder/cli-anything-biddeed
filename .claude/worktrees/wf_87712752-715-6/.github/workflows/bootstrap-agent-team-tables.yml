name: Bootstrap Agent Team Tables (one-shot DDL)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm you want to create the 4 agent team tables"
        required: true
        type: string

jobs:
  ddl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify confirmation
        env:
          C: ${{ inputs.confirm }}
        run: |
          [ "$C" = "YES" ] || { echo "::error::confirm must be YES"; exit 1; }

      - name: Run DDL via Supabase Management API
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: mocerqjnksmhcjzxrewo
        run: |
          set -euo pipefail

          cat > /tmp/ddl.sql <<'SQL'
          -- 1. Run headers
          CREATE TABLE IF NOT EXISTS public.agent_team_runs (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            summit_issue integer NOT NULL,
            competitor_slug text,
            status text NOT NULL DEFAULT 'queued' CHECK (status IN ('queued','running','blocked','succeeded','failed','cancelled')),
            lead_model text NOT NULL DEFAULT 'claude-opus-4-6',
            teammate_models jsonb DEFAULT '{}'::jsonb,
            hetzner_tmux_session text DEFAULT 'everest-agents',
            started_at timestamptz DEFAULT now(),
            completed_at timestamptz,
            eg14_gate_passed boolean,
            eg14_score integer,
            wall_clock_sec integer,
            total_tokens_estimate integer,
            spawn_prompt_path text,
            final_battle_card_path text,
            notes text,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS idx_atr_status ON public.agent_team_runs(status);
          CREATE INDEX IF NOT EXISTS idx_atr_issue ON public.agent_team_runs(summit_issue);
          CREATE INDEX IF NOT EXISTS idx_atr_slug ON public.agent_team_runs(competitor_slug);

          -- 2. Append-only event log
          CREATE TABLE IF NOT EXISTS public.agent_team_events (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            run_id uuid NOT NULL REFERENCES public.agent_team_runs(id) ON DELETE CASCADE,
            teammate text NOT NULL CHECK (teammate IN ('lead','researcher','playwright','writer','qa','architect','system')),
            event_type text NOT NULL,
            phase integer,
            checkpoint_id text,
            payload jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS idx_ate_run_created ON public.agent_team_events(run_id, created_at DESC);
          CREATE INDEX IF NOT EXISTS idx_ate_run_teammate ON public.agent_team_events(run_id, teammate);
          CREATE INDEX IF NOT EXISTS idx_ate_run_type ON public.agent_team_events(run_id, event_type);

          -- 3. Inbox (teammate-to-teammate messages)
          CREATE TABLE IF NOT EXISTS public.agent_team_inbox (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            run_id uuid NOT NULL REFERENCES public.agent_team_runs(id) ON DELETE CASCADE,
            from_agent text NOT NULL,
            to_agent text NOT NULL,
            message_type text NOT NULL CHECK (message_type IN ('assignment','question','finding','conflict','ack','handoff')),
            subject text NOT NULL,
            body text NOT NULL,
            related_checkpoint text,
            priority text DEFAULT 'normal' CHECK (priority IN ('low','normal','high','urgent')),
            read_at timestamptz,
            acknowledged_at timestamptz,
            created_at timestamptz DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS idx_ati_run_to_unread ON public.agent_team_inbox(run_id, to_agent, read_at) WHERE read_at IS NULL;
          CREATE INDEX IF NOT EXISTS idx_ati_run_created ON public.agent_team_inbox(run_id, created_at DESC);

          -- 4. Alerts (escalations to architect + Ariel)
          CREATE TABLE IF NOT EXISTS public.agent_team_alerts (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            run_id uuid REFERENCES public.agent_team_runs(id) ON DELETE SET NULL,
            competitor_slug text,
            severity text NOT NULL CHECK (severity IN ('info','warn','block','critical')),
            audience text NOT NULL CHECK (audience IN ('architect','ariel','both')),
            title text NOT NULL,
            body text NOT NULL,
            recommended_action text,
            acknowledged_at timestamptz,
            acknowledged_by text,
            resolution text,
            telegram_sent boolean DEFAULT false,
            created_at timestamptz DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS idx_ata_unack ON public.agent_team_alerts(audience, acknowledged_at) WHERE acknowledged_at IS NULL;
          CREATE INDEX IF NOT EXISTS idx_ata_severity ON public.agent_team_alerts(severity, created_at DESC);
          CREATE INDEX IF NOT EXISTS idx_ata_run ON public.agent_team_alerts(run_id);

          -- Auto-touch updated_at
          CREATE OR REPLACE FUNCTION public.agent_team_runs_touch_updated() RETURNS trigger AS $FN$
          BEGIN NEW.updated_at = now(); RETURN NEW; END;
          $FN$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS trg_atr_touch ON public.agent_team_runs;
          CREATE TRIGGER trg_atr_touch BEFORE UPDATE ON public.agent_team_runs
            FOR EACH ROW EXECUTE FUNCTION public.agent_team_runs_touch_updated();

          -- Verify
          SELECT table_name FROM information_schema.tables
          WHERE table_schema='public' AND table_name LIKE 'agent_team_%'
          ORDER BY table_name;
          SQL

          # Wrap in JSON for API
          python3 -c "import json; print(json.dumps({'query': open('/tmp/ddl.sql').read()}))" > /tmp/payload.json

          echo "=== Running DDL via Supabase Management API ==="
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 EverestCapital/1.0" \
            --data-binary @/tmp/payload.json)

          echo "HTTP: $HTTP_CODE"
          cat /tmp/resp.json
          echo ""

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::DDL failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "::notice::DDL executed. Verifying tables exist..."

      - name: Verify via REST API
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -eu
          for T in agent_team_runs agent_team_events agent_team_inbox agent_team_alerts; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "apikey: $SRK" -H "Authorization: Bearer $SRK" \
              "$URL/rest/v1/$T?limit=0")
            if [ "$CODE" = "200" ]; then
              echo "✅ $T"
            else
              echo "❌ $T (HTTP $CODE)"
              exit 1
            fi
          done
          echo "All 4 Agent Team tables exist and are reachable via REST."
