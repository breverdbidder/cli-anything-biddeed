name: "Gold Standard SHARD-1 Daily — orange/pinellas/st_lucie/washington/lafayette"
# dispatch_id: ffd85d01-2812-47af-86a1-4d0fc80424d7
# orange: 10/10 DONE  |  pinellas: 10/10 DONE (fixed by shard9)
# st_lucie: 4/10 → 10/10  |  washington: 3/10 → 10/10  |  lafayette: 0/10 → 8/10+

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'County to fix (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - st_lucie
          - washington
          - lafayette
          - verify_only
  schedule:
    # Daily at 08:00Z, 16:00Z, 00:00Z — matches 3-wave fleet cadence
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
    - cron: '0 0 * * *'

concurrency:
  group: gold-standard-shard1-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  shard1-gold-standard:
    name: "SHARD-1 Gold Standard — ${{ github.event.inputs.target || 'all' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 340

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET: ${{ github.event.inputs.target || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.email "shard1-bot@biddeed.ai"
          git config user.name "SHARD-1 Gold Standard Bot"

      - name: Verify-only — evaluate all counties
        if: ${{ github.event.inputs.target == 'verify_only' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request
          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}
          for county in ["orange", "pinellas", "st_lucie", "washington", "lafayette"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county", data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  print(f"{county}: {len(passed)}/10 | PASS={passed} FAIL={failed}")
              except Exception as e:
                  print(f"{county}: ERROR {e}")
          PYEOF

      - name: Fix st_lucie (B,C,D,F,G,I)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'st_lucie' }}
        run: |
          set -euo pipefail
          echo "=== ST_LUCIE FIX ==="
          python3 scripts/shard1_st_lucie_all_fixes.py
          echo "st_lucie DONE"

      - name: Fix st_lucie v2 (C/D NULL parity + B/F auction_status sold + I address)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'st_lucie' }}
        run: |
          set -euo pipefail
          echo "=== ST_LUCIE V2 FIX ==="
          python3 scripts/shard1_st_lucie_v2_fix.py || true
          echo "st_lucie v2 DONE"

      - name: Fix washington (B,C,D,F,G,I,J)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'washington' }}
        run: |
          set -euo pipefail
          echo "=== WASHINGTON FIX ==="
          python3 scripts/shard1_washington_all_fixes.py
          echo "washington DONE"

      - name: Bootstrap lafayette (0→8/10)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'lafayette' }}
        run: |
          set -euo pipefail
          echo "=== LAFAYETTE BOOTSTRAP ==="
          python3 scripts/shard1_lafayette_bootstrap.py
          echo "lafayette DONE"

      - name: Final verification — all shard1 counties
        if: ${{ always() && github.event.inputs.target != 'verify_only' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          total_score = 0
          results = {}
          for county in ["orange", "pinellas", "st_lucie", "washington", "lafayette"]:
              body = json.dumps({"p_county": county}).encode()
              req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/pencil_dod_evaluate_county",
                                            data=body, headers=H, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      ev = json.loads(r.read())
                  passed = [l for l in "ABCDEFGHIJ" if ev.get(l, {}).get("pass")]
                  failed = [l for l in "ABCDEFGHIJ" if not ev.get(l, {}).get("pass")]
                  score = len(passed)
                  total_score += score
                  results[county] = {"score": score, "pass": passed, "fail": failed}
                  star = "★ GOLD" if score == 10 else ""
                  print(f"  {county}: {score}/10 {star}")
                  if failed:
                      print(f"    FAILING: {failed}")
                  for l in "ABCDEFGHIJ":
                      ld = ev.get(l, {})
                      print(f"    {l}: {'PASS' if ld.get('pass') else 'FAIL'} metric={ld.get('metric')} detail={ld.get('detail','')}")
              except Exception as e:
                  print(f"  {county}: ERROR {e}")

          print(f"\n### SQL VERIFICATION — SHARD-1 FINAL")
          print(f"  Total shard score: {total_score}/50")
          print(f"  Results: {json.dumps(results, indent=2)}")

          # Alert on regressions for orange/pinellas (should stay 10/10)
          for county in ["orange", "pinellas"]:
              if results.get(county, {}).get("score", 0) < 10:
                  print(f"  ⚠️  REGRESSION: {county} dropped below 10/10!")
          PYEOF

      - name: Run gold_standard_loop for close-out
        if: ${{ always() && github.event.inputs.target == 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Run the gold standard loop for all counties
          python3 - <<'PYEOF'
          import os, json, urllib.request, time

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_KEY"]
          H = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}", "Content-Type": "application/json"}

          print("Running gold_standard_loop()...")
          req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/gold_standard_loop",
                                        data=b"{}", headers=H, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print(f"  gold_standard_loop: HTTP {r.status}")
          except Exception as e:
              print(f"  gold_standard_loop ERROR: {e} (non-fatal)")

          time.sleep(5)
          # Attempt certify
          req = urllib.request.Request(f"{SB_URL}/rest/v1/rpc/gold_standard_certify",
                                        data=b"{}", headers=H, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print(f"  gold_standard_certify: HTTP {r.status}")
          except Exception as e:
              print(f"  gold_standard_certify ERROR: {e} (non-fatal)")
          PYEOF
