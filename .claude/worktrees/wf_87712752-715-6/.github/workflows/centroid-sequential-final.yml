name: centroid-sequential-final
on:
  workflow_dispatch:
    inputs:
      co_no_override:
        description: "Single co_no (blank = all pending)"
        required: false
        default: ""
jobs:
  harvest-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install
        run: pip install requests
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CO_NO_OVERRIDE: ${{ github.event.inputs.co_no_override }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/breverdbidder/cli-anything-biddeed/main/scripts/centroid_sequential.py -o /tmp/cs.py && python3 /tmp/cs.py

