name: brevard-bidhistory
# Authenticated RealAuction bid-history harvest -> the moat (bidder-ID graph + winner names).
# Auth = JSON POST to /index.cfm (decoded 2026-06-11). Creds from GitHub Secrets, runner-only.
# Account-safe: single session, 4s throttle, member-cadence. Runs after Brevard sale days.
on:
  workflow_dispatch:
    inputs:
      platform: {description: "realforeclose | realtaxdeed", required: false, default: "realtaxdeed"}
      date:     {description: "YYYY-MM-DD (default today)",  required: false, default: ""}
  schedule:
    - cron: "0 18 * * 3"   # Wed 18:00Z: after Brevard tax-deed + foreclosure sale mornings
concurrency: {group: brevard-bidhistory, cancel-in-progress: false}
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Harvest bid history
        env:
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/realauction_bidhistory.py "${{ github.event.inputs.platform || 'realtaxdeed' }}" "${{ github.event.inputs.date }}"
