name: "SimilarWeb-via-Apify (framework comparison)"

on:
  workflow_dispatch:
    inputs:
      targets:
        required: true
        description: "comma-separated domains"
        default: "skybridge.tech,mcp-use.com,mastra.ai,manufact.com"
      label:
        required: true
        default: "frameworks-2026-05-27"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Apify SimilarWeb scrape"
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGETS: ${{ github.event.inputs.targets }}
          LABEL: ${{ github.event.inputs.label }}
        run: |
          set -e
          APIFY_TOKEN=$(curl -sf "${SB_URL}/rest/v1/rpc/get_apify_token" \
            -H "apikey: ${SB_KEY}" -H "Authorization: Bearer ${SB_KEY}" \
            -H "Content-Type: application/json" -d '{}' | tr -d '"')
          [ -z "$APIFY_TOKEN" ] || [ "$APIFY_TOKEN" = "null" ] && { echo "::error::no apify token"; exit 1; }

          DOMAINS_JSON=$(python3 -c "import json,os; print(json.dumps({'websites': os.environ['TARGETS'].split(',')}))")
          echo "Scraping: $DOMAINS_JSON"

          ACTOR="mscraper~similarweb-quick-scraper"
          RUN_RESP=$(curl -sf -X POST "https://api.apify.com/v2/acts/${ACTOR}/runs?token=${APIFY_TOKEN}" \
            -H "Content-Type: application/json" -d "$DOMAINS_JSON")
          RUN_ID=$(echo "$RUN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])")
          DATASET_ID=$(echo "$RUN_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['defaultDatasetId'])")
          echo "✓ run $RUN_ID dataset $DATASET_ID"

          for i in {1..30}; do
            sleep 10
            STATUS=$(curl -sf "https://api.apify.com/v2/actor-runs/${RUN_ID}?token=${APIFY_TOKEN}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['status'])")
            echo "poll ${i}: $STATUS"
            [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ABORTED" ] && break
          done
          [ "$STATUS" != "SUCCEEDED" ] && { echo "::error::run ended $STATUS"; exit 1; }

          DATA=$(curl -sf "https://api.apify.com/v2/datasets/${DATASET_ID}/items?token=${APIFY_TOKEN}&format=json")
          echo "$DATA" > /tmp/data.json
          python3 <<PYEOF
          import json, os, urllib.request
          data = json.load(open('/tmp/data.json'))
          sb=os.environ['SB_URL']; k=os.environ['SB_KEY']; label=os.environ['LABEL']
          print(f"Items: {len(data)}")
          for item in data:
              dom = (item.get('SiteName') or item.get('Domain') or '').lower().replace('https://','').rstrip('/')
              if not dom: continue
              slug = dom.replace('.', '-')
              path = f"comparisons/{label}/similarweb-{slug}.json"
              body = json.dumps(item, indent=2).encode()
              req = urllib.request.Request(
                f"{sb}/storage/v1/object/ci-evidence/{path}",
                data=body, method='POST',
                headers={'apikey': k, 'Authorization': f'Bearer {k}', 'Content-Type': 'application/json', 'x-upsert': 'true'})
              try:
                  resp = urllib.request.urlopen(req, timeout=30)
                  print(f"✓ {path} [{resp.status}]")
              except Exception as e:
                  print(f"✗ {path}: {e}")
          PYEOF
          echo "::notice::framework SimilarWeb capture complete"
