name: Deploy visual-explainer to Hetzner

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/setup-visual-explainer.sh'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy visual-explainer skill to Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          password: ${{ secrets.HETZNER_PASSWORD }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e

            SKILL_DIR="/root/.claude/skills/visual-explainer"
            CMD_DIR="/root/.claude/commands"
            DIAGRAMS_DIR="/root/.agent/diagrams"

            echo "=== [1/4] Clone/update visual-explainer ==="
            if [ -d "$SKILL_DIR/.git" ]; then
              cd "$SKILL_DIR" && git pull origin main --quiet
              echo "Updated existing install"
            else
              mkdir -p "$(dirname "$SKILL_DIR")"
              git clone --quiet https://github.com/breverdbidder/visual-explainer.git "$SKILL_DIR"
              echo "Cloned fresh"
            fi

            echo "=== [2/4] Install slash commands ==="
            mkdir -p "$CMD_DIR"
            CMDS=0
            for cmd in "$SKILL_DIR/plugins/visual-explainer/commands/"*.md; do
              cp "$cmd" "$CMD_DIR/$(basename "$cmd")"
              CMDS=$((CMDS+1))
            done
            echo "$CMDS commands installed to $CMD_DIR"

            echo "=== [3/4] Create output directory ==="
            mkdir -p "$DIAGRAMS_DIR"

            echo "=== [4/4] Verify ==="
            PASS=0
            FAIL=0
            for f in \
              "$SKILL_DIR/plugins/visual-explainer/SKILL.md" \
              "$SKILL_DIR/plugins/visual-explainer/templates/biddeed-brand-preset.html" \
              "$SKILL_DIR/plugins/visual-explainer/eval/eval.json" \
              "$CMD_DIR/diff-review.md" \
              "$CMD_DIR/project-recap.md" \
              "$CMD_DIR/generate-slides.md"; do
              if [ -f "$f" ]; then
                echo "  ✓ $(basename $f)"
                PASS=$((PASS+1))
              else
                echo "  ✗ $(basename $f) MISSING"
                FAIL=$((FAIL+1))
              fi
            done

            echo ""
            if [ "$FAIL" -eq 0 ]; then
              echo "DEPLOY COMPLETE: $PASS/$PASS checks passed"
            else
              echo "DEPLOY INCOMPLETE: $FAIL failures"
              exit 1
            fi

      - name: Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
          MSG="$EMOJI visual-explainer Deploy: $STATUS%0ATarget: Hetzner everest-dispatch%0ASkill: breverdbidder/visual-explainer%0ACommands: diff-review, plan-review, project-recap, generate-slides, generate-web-diagram, fact-check"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" > /dev/null 2>&1 || true
