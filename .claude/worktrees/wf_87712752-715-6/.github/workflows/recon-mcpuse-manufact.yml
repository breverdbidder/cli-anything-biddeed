name: "RECON: mcp-use docs + Manufact pricing"
on:
  workflow_dispatch:
    inputs:
      summit_id:
        description: "summit_chat_dispatch.id to update with delivery_proof"
        required: true
        type: string
      bucket_prefix:
        description: "Storage prefix under ci-evidence/"
        required: false
        default: "manufact-pricing-2026-05-27"

jobs:
  capture:
    name: "Render + screenshot mcp-use + Manufact"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Supabase
        run: |
          python -m pip install --quiet playwright supabase
          python -m playwright install --with-deps chromium

      - name: Capture pages and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUMMIT_ID: ${{ inputs.summit_id }}
          BUCKET_PREFIX: ${{ inputs.bucket_prefix }}
        run: |
          cat > /tmp/recon.py <<'PYEOF'
          import asyncio, json, os, datetime
          from playwright.async_api import async_playwright
          from supabase import create_client

          URLS = [
              ("manufact-pricing",  "https://manufact.com/pricing"),
              ("mcp-use-docs-home", "https://docs.mcp-use.com/home"),
          ]
          PREFIX = os.environ["BUCKET_PREFIX"]
          SUMMIT_ID = os.environ["SUMMIT_ID"]
          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_KEY"])

          async def run():
              artifacts = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  ctx = await browser.new_context(
                      viewport={"width": 1440, "height": 900},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  )
                  for slug, url in URLS:
                      try:
                          page = await ctx.new_page()
                          await page.goto(url, wait_until="networkidle", timeout=30000)
                          await page.wait_for_timeout(2500)

                          shot = await page.screenshot(full_page=True, type="png")
                          shot_path = f"{PREFIX}/{slug}-desktop.png"
                          sb.storage.from_("ci-evidence").upload(
                              shot_path, shot,
                              {"content-type": "image/png", "upsert": "true"})

                          text = await page.evaluate("() => document.body.innerText")
                          txt_path = f"{PREFIX}/{slug}-text.md"
                          sb.storage.from_("ci-evidence").upload(
                              txt_path, text.encode("utf-8"),
                              {"content-type": "text/markdown", "upsert": "true"})

                          html = await page.content()
                          html_path = f"{PREFIX}/{slug}-rendered.html"
                          sb.storage.from_("ci-evidence").upload(
                              html_path, html.encode("utf-8"),
                              {"content-type": "text/html", "upsert": "true"})

                          # Try targeted pricing extraction (heuristic)
                          pricing_data = await page.evaluate("""() => {
                              const out = [];
                              const cards = document.querySelectorAll('div, section, article');
                              for (const card of cards) {
                                  const txt = card.innerText || '';
                                  if (/\\$\\d/.test(txt) && txt.length < 1200 && txt.length > 40) {
                                      out.push(txt.trim());
                                  }
                              }
                              return Array.from(new Set(out)).slice(0, 20);
                          }""")
                          pricing_path = f"{PREFIX}/{slug}-pricing-extracted.json"
                          sb.storage.from_("ci-evidence").upload(
                              pricing_path,
                              json.dumps({"url": url, "extracted_blocks": pricing_data}, indent=2).encode("utf-8"),
                              {"content-type": "application/json", "upsert": "true"})

                          artifacts.append({
                              "slug": slug, "url": url,
                              "screenshot": shot_path, "text_md": txt_path,
                              "html": html_path, "pricing_json": pricing_path,
                              "text_chars": len(text),
                              "pricing_blocks_found": len(pricing_data),
                          })
                          await page.close()
                          print(f"OK {slug} text={len(text)} blocks={len(pricing_data)}")
                      except Exception as e:
                          artifacts.append({"slug": slug, "url": url, "error": str(e)})
                          print(f"ERR {slug}: {e}")
                  await browser.close()

              sb.postgrest.from_("summit_chat_dispatch").update({
                  "state": "closed",
                  "completed_at": datetime.datetime.utcnow().isoformat() + "+00:00",
                  "delivery_proof": {
                      "mode": "gha-ubuntu-playwright",
                      "harness": "actions/setup-python@v5 + playwright[chromium]",
                      "bucket": "ci-evidence",
                      "bucket_prefix": PREFIX,
                      "artifacts": artifacts,
                      "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  },
              }).eq("id", SUMMIT_ID).execute()

              print(json.dumps(artifacts, indent=2))

          asyncio.run(run())
          PYEOF
          python /tmp/recon.py
