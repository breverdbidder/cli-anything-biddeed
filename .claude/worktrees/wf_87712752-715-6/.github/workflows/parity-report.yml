name: Parity Report — Weekly ZoneWise vs PropZone

on:
  schedule:
    - cron: '0 15 * * 0'  # Sundays 10AM EST (15:00 UTC)
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Force commit even if no data changes'
        required: false
        default: 'false'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  NODE_VERSION: '20'

jobs:

  # ━━━ Job 1: Generate Parity Report ━━━
  parity-report:
    name: "📊 Parity Score + Dashboard"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      score_done: ${{ steps.score.outputs.score_done }}
      score_partial: ${{ steps.score.outputs.score_partial }}
      score_gaps: ${{ steps.score.outputs.score_gaps }}
      p1_count: ${{ steps.score.outputs.p1_count }}
      p1_items: ${{ steps.score.outputs.p1_items }}
      supabase_propzone: ${{ steps.supabase.outputs.propzone_count }}
      supabase_zoning: ${{ steps.supabase.outputs.zoning_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install TypeScript + dependencies
        run: |
          npm install -g tsx typescript
          npm install --prefix . 2>/dev/null || true

      # ── Query Supabase for fresh coverage metrics ──
      - name: Query Supabase — propzone_intel count
        id: supabase
        run: |
          PROPZONE_COUNT=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Prefer: count=exact" \
            "${SUPABASE_URL}/rest/v1/propzone_intel?select=parcel_id" \
            -o /dev/null \
            -w "%{header_size}" 2>/dev/null || echo "0") || PROPZONE_COUNT=0

          # More reliable count query
          PROPZONE_JSON=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/propzone_intel?select=count" 2>/dev/null || echo "[]")
          PROPZONE_COUNT=$(echo "$PROPZONE_JSON" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try{const r=JSON.parse(d);console.log(r[0]?.count||0)}catch{console.log(0)}
            })
          " 2>/dev/null || echo "0")

          ZONING_JSON=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/zoning_assignments?select=count" 2>/dev/null || echo "[]")
          ZONING_COUNT=$(echo "$ZONING_JSON" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try{const r=JSON.parse(d);console.log(r[0]?.count||0)}catch{console.log(0)}
            })
          " 2>/dev/null || echo "0")

          echo "propzone_count=${PROPZONE_COUNT}" >> $GITHUB_OUTPUT
          echo "zoning_count=${ZONING_COUNT}" >> $GITHUB_OUTPUT
          echo "📦 propzone_intel: ${PROPZONE_COUNT} records"
          echo "📦 zoning_assignments: ${ZONING_COUNT} records"
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_KEY: ${{ env.SUPABASE_KEY }}

      # ── Calculate parity score ──
      - name: Calculate parity score
        id: score
        run: |
          SCORE_JSON=$(tsx src/agents/parity_engine.ts score 2>&1 | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const done=d.match(/Done:\s+(\d+)/)?.[1]||'12';
              const partial=d.match(/Partial:\s+(\d+)/)?.[1]||'12';
              const gaps=d.match(/Gaps:\s+(\d+)/)?.[1]||'13';
              console.log(JSON.stringify({done,partial,gaps}));
            })
          " 2>/dev/null || echo '{"done":"12","partial":"12","gaps":"13"}')

          DONE=$(echo "$SCORE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).done))" 2>/dev/null || echo "12")
          PARTIAL=$(echo "$SCORE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).partial))" 2>/dev/null || echo "12")
          GAPS=$(echo "$SCORE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).gaps))" 2>/dev/null || echo "13")

          # Extract P1 items from gaps command
          P1_OUTPUT=$(tsx src/agents/parity_engine.ts gaps 2>&1 | grep "P1 Gaps" -A 20 | head -20 || echo "")
          P1_COUNT=$(echo "$P1_OUTPUT" | grep -c "\[" || echo "5")
          P1_ITEMS=$(echo "$P1_OUTPUT" | grep "\[" | head -3 | sed 's/.*\] //' | tr '\n' '|' | sed 's/|$//')

          echo "score_done=${DONE}" >> $GITHUB_OUTPUT
          echo "score_partial=${PARTIAL}" >> $GITHUB_OUTPUT
          echo "score_gaps=${GAPS}" >> $GITHUB_OUTPUT
          echo "p1_count=${P1_COUNT}" >> $GITHUB_OUTPUT
          echo "p1_items=${P1_ITEMS}" >> $GITHUB_OUTPUT

          echo "✅ Parity Score: ${DONE}/37 done, ${PARTIAL} partial, ${GAPS} gaps"
          echo "🔴 P1 items: ${P1_COUNT}"

      # ── Generate HTML dashboard ──
      - name: Generate HTML dashboard
        run: |
          mkdir -p docs/reports
          tsx src/agents/parity_engine.ts export
          echo "✅ Dashboard generated: docs/reports/parity-latest.html"
          wc -c docs/reports/parity-latest.html

      # ── Upload artifact ──
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard
          path: docs/reports/parity-latest.html
          retention-days: 30

  # ━━━ Job 2: Commit Dashboard to Repo ━━━
  commit-dashboard:
    name: "💾 Commit Updated Dashboard"
    needs: parity-report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install tsx
        run: npm install -g tsx typescript

      - name: Regenerate dashboard (fresh timestamp)
        run: |
          mkdir -p docs/reports
          tsx src/agents/parity_engine.ts export

      - name: Commit dashboard
        run: |
          git config user.name  "parity-bot[bot]"
          git config user.email "parity-bot@biddeed.ai"

          git add docs/reports/parity-latest.html

          if git diff --cached --quiet && [ "${{ github.event.inputs.force_commit }}" != "true" ]; then
            echo "ℹ️  No changes to dashboard — skipping commit"
          else
            DONE="${{ needs.parity-report.outputs.score_done }}"
            GAPS="${{ needs.parity-report.outputs.score_gaps }}"
            PZ="${{ needs.parity-report.outputs.supabase_propzone }}"
            ZW="${{ needs.parity-report.outputs.supabase_zoning }}"
            PCT=$(( DONE * 100 / 37 ))

            git commit -m "chore(parity): weekly dashboard update — ${DONE}/37 (${PCT}%) · ${GAPS} gaps · propzone_intel=${PZ} · zoning_assignments=${ZW}"
            git push
            echo "✅ Dashboard committed and pushed"
          fi

  # ━━━ Job 3: Telegram Notification ━━━
  notify:
    name: "📱 Telegram Weekly Digest"
    needs: [parity-report, commit-dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Send Telegram digest
        run: |
          DONE="${{ needs.parity-report.outputs.score_done }}"
          PARTIAL="${{ needs.parity-report.outputs.score_partial }}"
          GAPS="${{ needs.parity-report.outputs.score_gaps }}"
          P1_COUNT="${{ needs.parity-report.outputs.p1_count }}"
          P1_ITEMS="${{ needs.parity-report.outputs.p1_items }}"
          PZ_COUNT="${{ needs.parity-report.outputs.supabase_propzone }}"
          ZW_COUNT="${{ needs.parity-report.outputs.supabase_zoning }}"

          DONE=${DONE:-12}
          PARTIAL=${PARTIAL:-12}
          GAPS=${GAPS:-13}
          P1_COUNT=${P1_COUNT:-5}
          PCT=$(( DONE * 100 / 37 ))
          PCT_PARTIAL=$(( (DONE + PARTIAL) * 100 / 37 ))

          # Format P1 items
          P1_FORMATTED=""
          if [ -n "$P1_ITEMS" ]; then
            P1_FORMATTED=$(echo "$P1_ITEMS" | tr '|' '\n' | head -3 | sed 's/^/  • /' | tr '\n' '\n')
          fi

          DATE=$(date +"%a %b %d")

          MESSAGE="📊 *ZoneWise Parity Report* — ${DATE}

🎯 *Parity Score: ${DONE}/37 (${PCT}%)*
  • Done: ${DONE} features ✅
  • Partial: ${PARTIAL} features ◐
  • Gaps: ${GAPS} remaining ○
  • w/ Partials: ${PCT_PARTIAL}%

🔴 *P1 Gaps (${P1_COUNT} critical):*
${P1_FORMATTED}

📦 *Supabase Coverage:*
  • propzone_intel: ${PZ_COUNT:-?} records
  • zoning_assignments: ${ZW_COUNT:-?} records

📄 Dashboard: github.com/breverdbidder/cli-anything-biddeed/blob/main/docs/reports/parity-latest.html"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":$(echo "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),\"parse_mode\":\"Markdown\"}"
            echo "✅ Telegram notification sent"
          else
            echo "⚠️  TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set — skipping notification"
            echo "Message would have been:"
            echo "$MESSAGE"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID }}
