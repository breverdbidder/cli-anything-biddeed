name: "SUMMIT: Coder Template v7 (TF fix)"
on:
  workflow_dispatch:

jobs:
  coder-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fix TF + Create Template
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@$HETZNER_IP << 'SSHEOF'
          set -e
          CODER_URL="http://127.0.0.1:7080"
          SESSION=$(curl -s -X POST "$CODER_URL/api/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"ariel@everestcapitalusa.com","password":"EverestCoder2026!"}')
          TOKEN=$(echo "$SESSION" | python3 -c "import sys,json;print(json.load(sys.stdin)['session_token'])")
          export CODER_URL CODER_SESSION_TOKEN="$TOKEN"
          mkdir -p ~/.config/coderv2
          echo "$CODER_URL" > ~/.config/coderv2/url
          echo "$TOKEN" > ~/.config/coderv2/session

          # Fix the TF file: folder→workdir, remove install_claude
          TMPL_DIR="/home/claude/coder/templates/biddeed-claude-code"
          cd "$TMPL_DIR"

          # Patch in-place
          sed -i 's/folder         = "\/home\/coder\/project"/workdir        = "\/home\/coder\/project"/' main.tf
          sed -i '/install_claude/d' main.tf

          echo "Fixed main.tf. Module block:"
          grep -A5 'module "claude-code"' main.tf

          # Delete old failed template
          coder templates delete biddeed-claude-code --yes 2>/dev/null || true

          # Clean terraform cache to force fresh init
          rm -rf .terraform .terraform.lock.hcl

          # Create template
          echo "Creating template..."
          coder templates create biddeed-claude-code \
            --directory . \
            --default-ttl 2h \
            --yes 2>&1

          echo ">>> Templates:"
          coder templates list 2>&1
          echo "✅ DONE"
          SSHEOF
