name: Mariam Deeds v6

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Grantee or ALL'
        required: false
        default: 'MAXI DAY'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run v6 — JS direct execution
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v6
          cd /tmp/mariam_v6

          cat > runner.py <<'PY'
          import asyncio, json, os, re
          from datetime import datetime

          async def search_grantee(party_name: str):
              from playwright.async_api import async_playwright
              result = {"party": party_name, "ts": datetime.utcnow().isoformat(),
                        "records": [], "success": False, "error": None,
                        "debug": [], "screenshots": []}

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (Windows NT 10.0) Chrome/120.0",
                  )
                  page = await ctx.new_page()
                  safe = party_name.replace(' ','_').replace(',','')

                  try:
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)

                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)

                      await page.wait_for_selector("input#SearchOnName", timeout=20000)
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                      await page.fill("input#SearchOnName", party_name)
                      await page.fill("input#RecordDateFrom", "1/1/2011")
                      await page.fill("input#RecordDateTo", "12/31/2022")
                      result["debug"].append(f"form filled: {party_name}")

                      await page.click("input#btnSearch")
                      await asyncio.sleep(4)

                      # Wait for picker
                      try:
                          await page.wait_for_selector("text=Select Names:", timeout=15000)
                          result["debug"].append("Name picker visible")

                          # Strategy: directly call the JS function that the Done button invokes
                          await page.evaluate("GetNameListString('NameListTreeView')")
                          result["debug"].append("called GetNameListString JS directly")
                          try:
                              await page.wait_for_load_state("networkidle", timeout=60000)
                          except: pass
                          await asyncio.sleep(8)
                      except Exception as e:
                          result["debug"].append(f"picker handling: {e}")

                      ss = f"/tmp/mariam_v6/{safe}_results.png"
                      await page.screenshot(path=ss, full_page=True)
                      result["screenshots"].append(ss)

                      content = await page.content()
                      with open(f"/tmp/mariam_v6/{safe}_results.html","w") as f:
                          f.write(content[:1000000])

                      tbl_count = await page.locator("table").count()
                      result["debug"].append(f"page now has {tbl_count} tables")

                      # Acclaim renders search results in a Telerik grid
                      # Try pagination-aware capture
                      async def capture_visible_results():
                          rows_out = []
                          all_rows = await page.locator("tr").all()
                          for row in all_rows:
                              try:
                                  cells = await row.locator("td").all()
                                  if len(cells) < 5: continue
                                  texts = [(await c.inner_text()).strip() for c in cells]
                                  has_date = any(re.fullmatch(r"\d{1,2}/\d{1,2}/\d{4}", t) for t in texts)
                                  if has_date:
                                      rows_out.append({"cells": texts})
                              except: pass
                          return rows_out

                      result["records"] = await capture_visible_results()
                      result["debug"].append(f"page 1 records: {len(result['records'])}")

                      # Pagination - click next while present
                      max_pages = 50
                      pages_seen = 1
                      while pages_seen < max_pages:
                          # Look for next button (Telerik Kendo grid)
                          next_btn = page.locator("a.t-arrow-next:not(.t-state-disabled)")
                          if await next_btn.count() == 0:
                              next_btn = page.locator("a[title='Go to the next page']:not(.t-state-disabled)")
                          if await next_btn.count() == 0 or not await next_btn.first.is_visible():
                              result["debug"].append(f"no next page after page {pages_seen}")
                              break
                          try:
                              await next_btn.first.click()
                              await asyncio.sleep(3)
                              pages_seen += 1
                              page_recs = await capture_visible_results()
                              result["records"].extend(page_recs)
                              result["debug"].append(f"page {pages_seen}: +{len(page_recs)} (total {len(result['records'])})")
                          except Exception as e:
                              result["debug"].append(f"pagination broke: {e}")
                              break

                      result["success"] = True
                      await browser.close()
                  except Exception as e:
                      result["error"] = str(e)
                      try:
                          await page.screenshot(path=f"/tmp/mariam_v6/{safe}_error.png", full_page=True)
                      except: pass
                      try: await browser.close()
                      except: pass

              return result

          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
          target = os.environ.get("GRANTEE","MAXI DAY").strip().upper()
          targets = GRANTEES_ALL if target == "ALL" else [target]

          async def main():
              all_out = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_grantee(g)
                  all_out[g] = r
                  print(f"  records={len(r['records'])} success={r['success']}", flush=True)
                  for d in r['debug']: print(f"  ! {d}", flush=True)

              with open("/tmp/mariam_v6/all_results.json","w") as f:
                  json.dump(all_out, f, indent=2, default=str)
              print(f"\n>>> TOTAL: {sum(len(v['records']) for v in all_out.values())} records")
          asyncio.run(main())
          PY

          pip install --quiet playwright 2>&1 | tail -1 || true
          python3 -m playwright install chromium 2>&1 | tail -1 || true
          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee /tmp/mariam_v6/run.log
          ls -la /tmp/mariam_v6/
          REMOTE

      - name: Pull
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v6/ /tmp/results/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v6_${{ inputs.grantee }}
          path: /tmp/results/
