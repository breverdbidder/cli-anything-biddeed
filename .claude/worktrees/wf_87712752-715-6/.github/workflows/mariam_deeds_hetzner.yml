name: Mariam Deeds — Hetzner Run

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Grantee name (or ALL for all 4)'
        required: false
        default: 'ALL'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run scraper on Hetzner
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          set -e
          # Build the remote script as a heredoc, scp it over, execute
          cat > /tmp/remote.sh <<'REMOTE_SCRIPT'
          #!/bin/bash
          set -e
          cd /opt
          if [ ! -d brevard-bidder-scraper/.git ]; then
            git clone https://${GH_PAT}@github.com/breverdbidder/brevard-bidder-scraper.git
          fi
          cd brevard-bidder-scraper
          git pull origin main 2>/dev/null || true

          # Read secrets from the existing scraper's .env on Hetzner
          export $(grep -E '^(BROWSERLESS_API_KEY|ACCLAIMWEB_USERNAME|ACCLAIMWEB_PASSWORD|DATABASE_URL|SUPABASE_SERVICE_ROLE_KEY)=' .env 2>/dev/null | xargs) || true

          # Install deps if needed
          pip install --quiet httpx playwright dataclasses-json 2>/dev/null || true

          # Build the deed scraper inline
          mkdir -p /tmp/mariam_deeds
          cat > /tmp/mariam_deeds/run.py <<'PY'
          import asyncio, os, sys, json
          sys.path.insert(0, '/opt/brevard-bidder-scraper')
          from src.scrapers.acclaimweb_scraper import search_acclaimweb_browserless

          DEED_DOC_TYPES = ["TD","CT","WD","SWD","QCD","DEED","CSALE"]
          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]

          target = os.environ.get('GRANTEE','ALL').strip().upper()
          targets = GRANTEES_ALL if target == 'ALL' else [target]

          async def main():
              all_results = {}
              for g in targets:
                  print(f"\n=== Searching: {g} ===", flush=True)
                  try:
                      r = await search_acclaimweb_browserless(
                          party_name=g, role="GRANTEE",
                          doc_types=DEED_DOC_TYPES,
                          date_from="01/01/2011", date_to="12/31/2022",
                      )
                      records = [rec.__dict__ for rec in (r.mortgages + r.satisfactions + r.other_liens)]
                      all_results[g] = {
                          'success': r.success,
                          'records_found': r.records_found,
                          'records': records,
                          'execution_method': r.execution_method,
                          'error': r.error,
                      }
                      print(f"  -> {r.records_found} records", flush=True)
                  except Exception as e:
                      all_results[g] = {'error': str(e), 'records': []}
                      print(f"  -> ERROR: {e}", flush=True)

              outpath = '/tmp/mariam_deeds/all_results.json'
              with open(outpath,'w') as f:
                  json.dump(all_results, f, indent=2, default=str)
              print(f"\nSaved to {outpath}")
              total = sum(v.get('records_found',0) for v in all_results.values())
              print(f"TOTAL: {total} records across {len(all_results)} grantees")

          asyncio.run(main())
          PY

          GRANTEE="${GRANTEE}" python3 /tmp/mariam_deeds/run.py 2>&1 | tee /tmp/mariam_deeds/run.log
          ls -la /tmp/mariam_deeds/
          REMOTE_SCRIPT

          chmod +x /tmp/remote.sh
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" < /tmp/remote.sh

      - name: Pull results back via SCP
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_deeds/ /tmp/results/ || true
          ls -la /tmp/results/mariam_deeds/ 2>/dev/null || echo "no results"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_deeds_${{ inputs.grantee }}
          path: /tmp/results/
          retention-days: 90

      - name: Print summary
        if: always()
        run: |
          if [ -f /tmp/results/mariam_deeds/all_results.json ]; then
            python3 -c "
            import json
            d = json.load(open('/tmp/results/mariam_deeds/all_results.json'))
            for g,v in d.items():
              n = v.get('records_found', len(v.get('records',[])))
              print(f'{g}: {n} records')
            "
          fi
