name: "Summit: DesignWise S3 — Quality + Core Pages + Reventure Heatmap"
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [designwise-s3]
jobs:
  s3:
    name: "S3: QAWise + SEO + A11y + Core Pages + Heatmap"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute S3 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 110m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,GEMINI_API_KEY,SUPABASE_URL,SUPABASE_KEY,MAPBOX_TOKEN
          script: |
            set -e
            echo "=== DesignWise S3 — $(date) ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            mkdir -p /opt/biddeed
            cd /opt/biddeed
            if [ -d cli-anything-biddeed ]; then cd cli-anything-biddeed && git pull; else git clone https://${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git && cd cli-anything-biddeed; fi
            git config --global --add safe.directory /opt/biddeed/cli-anything-biddeed
            chown -R claude:claude /opt/biddeed
            PROMPT="MISSION: DesignWise Sprint 3. READ docs/plans/DESIGNWISE-S3-DISPATCH.md for step-by-step guide. READ docs/plans/DESIGNWISE-SPEC.md for agent architecture. READ CLAUDE.md for project rules. Execute ALL 5 steps: (1) QAWise agent with Playwright visual regression and E2E and Lighthouse, (2) SEOWise agent with meta scanner and sitemap and schema.org, (3) AccessibilityWise agent with axe-core WCAG 2.1 AA, (4) Core Pages in zonewise-web: Reventure-style choropleth heatmap at /explorer with Mapbox GL and Zillow ZHVI data, conversion gate with 5 clicks free, pricing page Free/Starter 39/Pro 99, mobile bottom sheet. Clone zonewise-web: git clone https://GH_PAT@github.com/breverdbidder/zonewise-web.git, (5) Telegram notification. RULES: NEVER-LIE verify before claiming done. House brand Navy 1E3A5F Orange F59E0B Inter font bg 020617. Git prefix DW: for cli-anything, feat: for zonewise-web. Push to main. Run tests before pushing. If fails after 3 attempts report honestly and move on."
            su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN' && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && export GH_PAT='$GH_PAT' && export GEMINI_API_KEY='$GEMINI_API_KEY' && export SUPABASE_URL='$SUPABASE_URL' && export SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_KEY' && export NEXT_PUBLIC_MAPBOX_TOKEN='$MAPBOX_TOKEN' && export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN' && export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID' && cd /opt/biddeed/cli-anything-biddeed && git pull origin main && claude -p \"$PROMPT\" --dangerously-skip-permissions"
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      - name: "Notify"
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=DesignWise S3: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
