name: "YouTube Transcript: Table Migration"
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install pg
      - name: "Debug password"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Password length: ${#SUPABASE_DB_PASSWORD}"
          echo "First char: ${SUPABASE_DB_PASSWORD:0:1}"
          echo "Last char: ${SUPABASE_DB_PASSWORD: -1}"
          echo "Has whitespace: $(echo "$SUPABASE_DB_PASSWORD" | grep -c '[[:space:]]')"
      - name: "Run migration"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          CLEAN_PW=$(echo "$SUPABASE_DB_PASSWORD" | tr -d '[:space:]')
          echo "Cleaned length: ${#CLEAN_PW}"
          export SUPABASE_DB_PASSWORD="$CLEAN_PW"
          node migrations/run_youtube_transcript.js
      - name: "Verify table via REST"
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/youtube_transcript?select=count&limit=0")
          echo "REST check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "FAIL"; exit 1; fi
          echo "youtube_transcript accessible"