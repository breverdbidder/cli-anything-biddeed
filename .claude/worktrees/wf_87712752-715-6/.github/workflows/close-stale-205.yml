name: close-stale-205
on:
  workflow_dispatch:
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 205,
              body: `## Root Cause Fixed (commit \`2c5b9cc0\`)

**GHA tracking ID**: GHA-084631
**Workflow**: \`.github/workflows/weekly-health.yml\`

**Root cause:**
YAML syntax error in \`weekly-health.yml\` — multi-line f-string blocks with bare content at column 0 caused GitHub Actions to reject the workflow file, producing 0-second "workflow file issue" failures.

**Fix applied:**
Commit \`2c5b9cc0\` (2026-03-29 14:11 UTC): repaired YAML syntax across 8 broken workflows including \`weekly-health.yml\` — collapsed multi-line blocks with bare quotes to properly escaped single lines.

**Verification (VERIFIED):**
- YAML parse: \`python3 -c "import yaml; yaml.safe_load(open('.github/workflows/weekly-health.yml'))"\` → YAML VALID ✅
- Identical pattern to Issue #197 (Session 56) and Issue #204 (Session 62) — same workflow, same fix ✅
- Failing run GHA-084631 predates commit \`2c5b9cc0\` fix — stale pre-fix failure ✅

Stale issue — closing.`
            });
            await github.rest.issues.update({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 205,
              state: 'closed'
            });
