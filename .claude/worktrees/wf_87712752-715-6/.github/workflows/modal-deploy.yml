name: Modal Deploy & Execute

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = setup Modal app, run = trigger one execution'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - run
  push:
    paths:
      - 'scripts/modal_executor.py'

jobs:
  modal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal + deps
        run: |
          pip install modal requests -q

      - name: Create Modal secrets (idempotent)
        if: inputs.action == 'deploy' || github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          python3 << 'PYSCRIPT'
          import subprocess, os
          # Create/update Modal secret with all our env vars
          cmd = [
            "modal", "secret", "create", "everest-secrets",
            f"SUPABASE_URL={os.environ['SUPABASE_URL']}",
            f"SUPABASE_KEY={os.environ['SUPABASE_KEY']}",
            f"GH_PAT={os.environ['GH_PAT']}",
            f"TELEGRAM_BOT_TOKEN={os.environ['TELEGRAM_BOT_TOKEN']}",
            f"TELEGRAM_CHAT_ID={os.environ['TELEGRAM_CHAT_ID']}",
            "--force",
          ]
          r = subprocess.run(cmd, capture_output=True, text=True)
          print(r.stdout)
          if r.returncode != 0:
            print(f"stderr: {r.stderr}")
            # Secret might already exist, try updating
            print("Retrying with update...")
          PYSCRIPT

      - name: Deploy Modal app
        if: inputs.action == 'deploy' || github.event_name == 'push'
        run: |
          modal deploy scripts/modal_executor.py
          echo "✅ Modal app deployed — running every 2 hours"

      - name: Run Modal executor now
        if: inputs.action == 'run'
        run: |
          modal run scripts/modal_executor.py
          echo "✅ Modal executor completed"

      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          ACTION="${{ inputs.action || 'deploy' }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=MODAL ${ACTION^^}: everest-executor deployed. Parallel task execution active 24/6."
