name: cc nonroot setup
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: switch dashboard to non-root claude user
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          U=claude
          echo "=== prep home/.claude ==="
          mkdir -p /home/$U/.claude/projects
          if [ -d /root/.claude/projects ]; then cp -rn /root/.claude/projects/. /home/$U/.claude/projects/ 2>/dev/null; fi
          chown -R $U:$U /home/$U/.claude
          echo "claude_home_projects=$(ls -1 /home/$U/.claude/projects 2>/dev/null | wc -l)"
          echo "existing_creds=$(test -f /home/$U/.claude/.credentials.json && echo yes || echo no)"
          echo "=== auth db ownership ==="
          mkdir -p /opt/claudecodeui-data
          chown -R $U:$U /opt/claudecodeui-data
          ls -la /opt/claudecodeui-data
          echo "=== ensure app readable by $U ==="
          chmod -R a+rX /opt/claudecodeui 2>/dev/null
          echo "app_readable=$(su - $U -c 'test -r /opt/claudecodeui/package.json && echo yes || echo no' 2>&1)"
          echo "claude_bin_as_user=$(su - $U -c 'which claude' 2>&1)"
          echo "=== switch service (with rollback) ==="
          systemctl stop 'claudecodeui@root' 2>&1
          systemctl enable "claudecodeui@$U" 2>&1
          systemctl start "claudecodeui@$U" 2>&1
          sleep 5
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001 2>/dev/null)
          if systemctl is-active --quiet "claudecodeui@$U" && [ "$CODE" = "200" ]; then
            systemctl disable 'claudecodeui@root' 2>&1
            echo "SWITCH_OK active=yes http=$CODE user=$U"
            echo "service_user=$(systemctl show -p MainPID 'claudecodeui@'$U | cut -d= -f2 | xargs -I{} ps -o user= -p {} 2>/dev/null)"
          else
            echo "SWITCH_FAILED http=$CODE — rolling back to root"
            systemctl stop "claudecodeui@$U" 2>&1
            systemctl start 'claudecodeui@root' 2>&1
            journalctl -u "claudecodeui@$U" -n 25 --no-pager 2>&1
          fi
          echo "END"
          REMOTE
