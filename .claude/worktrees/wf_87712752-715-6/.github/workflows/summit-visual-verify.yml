name: "Summit: Visual Verification — All 14 Agents"
on:
  workflow_dispatch: {}

jobs:
  verify:
    name: "Playwright Visual Proof"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Verify on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 8m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            cd /tmp
            rm -rf dw-verify && mkdir dw-verify && cd dw-verify

            npm init -y > /dev/null 2>&1
            npm install playwright > /dev/null 2>&1
            npx playwright install chromium --with-deps > /dev/null 2>&1

            cat > verify.js << 'VERIFYEOF'
            const { chromium } = require('playwright');
            const fs = require('fs');
            const https = require('https');

            const BASE = 'https://zonewise.ai';
            const R = [];
            function log(a,c,p,d) { R.push({a,c,p,d}); console.log(`${p?'✅':'❌'} [${a}] ${c}: ${d}`); }

            async function sendPhoto(token, chatId, photoPath, caption) {
              return new Promise((resolve, reject) => {
                const boundary = '----FormBoundary' + Date.now();
                const photo = fs.readFileSync(photoPath);
                const body = Buffer.concat([
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n${chatId}\r\n`),
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="caption"\r\n\r\n${caption.slice(0,1024)}\r\n`),
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="parse_mode"\r\n\r\nMarkdown\r\n`),
                  Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="photo"; filename="screenshot.png"\r\nContent-Type: image/png\r\n\r\n`),
                  photo,
                  Buffer.from(`\r\n--${boundary}--\r\n`),
                ]);
                const req = https.request({
                  hostname: 'api.telegram.org', path: `/bot${token}/sendPhoto`, method: 'POST',
                  headers: { 'Content-Type': `multipart/form-data; boundary=${boundary}`, 'Content-Length': body.length },
                }, res => { let d=''; res.on('data',c=>d+=c); res.on('end',()=>resolve(d)); });
                req.on('error', reject);
                req.write(body);
                req.end();
              });
            }

            (async () => {
              const TG_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
              const TG_CHAT = process.env.TELEGRAM_CHAT_ID;
              const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
              const ctx = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const page = await ctx.newPage();
              const phReqs = [];
              page.on('request', r => { if (r.url().includes('posthog') || r.url().includes('us.i.posthog')) phReqs.push(r.url()); });

              // 1. HOMEPAGE
              console.log('\n=== HOMEPAGE ===');
              await page.goto(BASE, { timeout: 45000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(8000);
              await page.screenshot({ path: 'home.png' });

              log('A11yWise','SkipToContent', !!(await page.$('a[href="#main-content"]')), 'link');
              log('A11yWise','main-content', !!(await page.$('#main-content')), 'id');

              const body = await page.textContent('body').catch(()=>'');
              log('ContentWise','Parcels on page', /parcels/i.test(body), body.match(/[\d,]+ parcels/i)?.[0]||'check');
              log('SEOWise','GSC meta', !!(await page.$('meta[name="google-site-verification"]')), 'tag');
              log('SEOWise','OG title', !!(await page.$('meta[property="og:title"]')), 'tag');
              log('SEOWise','JSON-LD', !!(await page.$('script[type="application/ld+json"]')), 'schema');

              // Tab focus test
              await page.keyboard.press('Tab');
              await page.waitForTimeout(300);
              await page.screenshot({ path: 'home-focus.png' });
              const focusEl = await page.evaluate(() => {
                const el = document.activeElement;
                if (!el || el === document.body) return null;
                const s = window.getComputedStyle(el);
                return { tag: el.tagName, outline: s.outlineColor, class: (el.className||'').toString().slice(0,30) };
              });
              log('A11yWise','Focus-visible', !!focusEl && focusEl.tag !== 'BODY', JSON.stringify(focusEl||'none'));

              // Onboarding
              const tourEls = await page.evaluate(() => {
                let found = [];
                document.querySelectorAll('*').forEach(e => {
                  const cn = typeof e.className === 'string' ? e.className : '';
                  if (/tour|onboard|welcome|step-indicator/i.test(cn)) found.push(cn.slice(0,40));
                  if (e.getAttribute && /tour|onboard/i.test(e.getAttribute('data-testid')||'')) found.push('data-testid match');
                });
                return found.slice(0,5);
              });
              log('SupportWise','Onboarding tour', tourEls.length > 0, tourEls.length > 0 ? tourEls.join(', ') : 'No elements (may need fresh localStorage)');

              // PostHog
              await page.waitForTimeout(3000);
              log('AnalyticsWise','PostHog requests', phReqs.length > 0, `${phReqs.length} network calls`);

              // A/B test
              const ctaTexts = await page.evaluate(() => {
                return Array.from(document.querySelectorAll('a, button')).slice(0,15).map(e=>e.textContent?.trim()).filter(t=>t&&t.length>2&&t.length<50);
              });
              log('IterateWise','CTA buttons', ctaTexts.length > 0, ctaTexts.slice(0,4).join(' | '));

              await sendPhoto(TG_TOKEN, TG_CHAT, 'home.png', '🏠 *Homepage* — DesignWise Visual Verification');

              // 2. /help
              console.log('\n=== /help ===');
              await page.goto(BASE+'/help', { timeout: 30000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);
              await page.screenshot({ path: 'help.png' });

              const helpH1 = await page.textContent('h1').catch(()=>'');
              log('SupportWise','/help heading', /help/i.test(helpH1), helpH1);
              const btns = await page.$$('button');
              log('SupportWise','FAQ buttons', btns.length >= 5, `${btns.length} buttons`);
              if (btns.length > 2) { await btns[2].click().catch(()=>{}); await page.waitForTimeout(500); }
              await page.screenshot({ path: 'help-expanded.png' });

              await sendPhoto(TG_TOKEN, TG_CHAT, 'help.png', '❓ */help* — FAQ page');

              // 3. /docs
              console.log('\n=== /docs ===');
              await page.goto(BASE+'/docs', { timeout: 30000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);
              await page.screenshot({ path: 'docs.png' });

              const docsBody = await page.textContent('body').catch(()=>'');
              log('SupportWise','/docs API ref', /endpoint|API|auth/i.test(docsBody), 'content');
              log('SupportWise','/docs code examples', /curl|python|javascript/i.test(docsBody), 'examples');

              await sendPhoto(TG_TOKEN, TG_CHAT, 'docs.png', '📖 */docs* — API Reference');

              // 4. /explorer
              console.log('\n=== /explorer ===');
              await page.goto(BASE+'/explorer', { timeout: 30000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(8000);
              await page.screenshot({ path: 'explorer.png' });

              const ariaCount = await page.evaluate(() => document.querySelectorAll('[aria-label]').length);
              log('A11yWise','ARIA labels', ariaCount > 0, `${ariaCount} labeled elements`);
              const roleApp = await page.$('[role="application"]');
              log('A11yWise','role=application', !!roleApp, roleApp?'Found':'Not found');
              const chatInput = await page.$('input, textarea');
              log('QAWise','Chat input', !!chatInput, chatInput?'Found':'Not found');

              await sendPhoto(TG_TOKEN, TG_CHAT, 'explorer.png', '🗺 */explorer* — Map + ARIA');

              // 5. /pricing
              console.log('\n=== /pricing ===');
              await page.goto(BASE+'/pricing', { timeout: 30000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);
              await page.screenshot({ path: 'pricing.png' });

              const priceBody = await page.textContent('body').catch(()=>'');
              log('ContentWise','Pricing tiers', /\$39|\$99|free|pro/i.test(priceBody), 'tiers');

              await sendPhoto(TG_TOKEN, TG_CHAT, 'pricing.png', '💰 */pricing* — Plans');

              // 6. Mobile
              console.log('\n=== MOBILE ===');
              await page.setViewportSize({ width: 375, height: 812 });
              await page.goto(BASE, { timeout: 30000, waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(5000);
              await page.screenshot({ path: 'mobile.png' });
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > 380);
              log('QAWise','Mobile 375px', !overflow, overflow?'OVERFLOW':'Clean');

              await sendPhoto(TG_TOKEN, TG_CHAT, 'mobile.png', '📱 *Mobile 375px* — Responsive');

              // 7. Health
              console.log('\n=== /api/health ===');
              await page.setViewportSize({ width: 1280, height: 800 });
              const hRes = await page.goto(BASE+'/api/health', { timeout: 10000 });
              const hJ = await hRes.json().catch(()=>({}));
              log('DeployWise','Health', hJ.status==='ok', JSON.stringify(hJ).slice(0,80));

              await browser.close();

              // SUMMARY to Telegram
              const passed = R.filter(r=>r.p).length;
              const failed = R.filter(r=>!r.p).length;
              let summary = `🎯 *DesignWise Visual Verification*\n✅ ${passed} passed | ❌ ${failed} failed\n\n`;
              R.forEach(r => { summary += `${r.p?'✅':'❌'} *${r.a}* ${r.c}: ${r.d}\n`; });

              const https2 = require('https');
              const summaryBody = JSON.stringify({ chat_id: TG_CHAT, text: summary, parse_mode: 'Markdown' });
              const req = https2.request({
                hostname: 'api.telegram.org', path: `/bot${TG_TOKEN}/sendMessage`, method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(summaryBody) },
              }, ()=>{});
              req.write(summaryBody);
              req.end();

              console.log(`\n=== DONE: ${passed}/${R.length} passed ===`);
            })();
            VERIFYEOF

            node verify.js
