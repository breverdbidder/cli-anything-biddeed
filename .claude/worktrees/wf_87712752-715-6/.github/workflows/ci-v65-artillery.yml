name: ci-v65-artillery

# CI V6.5 Artillery Workflow
# Replaces deprecated claude-code-direct.yml (denylisted 2026-05-06).
# Triggers only via explicit repository_dispatch (no push, no schedule)
# to prevent runaway scenarios. Self-hosted Hetzner runner.
# 25-minute hard timeout to stay under the r5 watchdog (30min).

on:
  repository_dispatch:
    types:
      - ci_v65_phase_run
  workflow_dispatch:
    inputs:
      dossier_id:
        description: 'ci_v65_dossiers.id (uuid)'
        required: true
        type: string
      phase:
        description: 'Phase to run (P1_RECON, P2_TECH_FOOTPRINT, P5_API_CAPTURE, etc.)'
        required: true
        type: string
        default: P1_RECON
      mode:
        description: 'canary | full'
        required: false
        type: string
        default: canary

concurrency:
  group: ci-v65-${{ github.event.inputs.dossier_id || github.event.client_payload.dossier_id }}-${{ github.event.inputs.phase || github.event.client_payload.phase }}
  cancel-in-progress: false

jobs:
  artillery:
    runs-on: ubuntu-latest  # was [self-hosted, hetzner] — Hetzner runner offline 2026-05-23, fallback to GH-hosted
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DOSSIER_ID: ${{ github.event.inputs.dossier_id || github.event.client_payload.dossier_id }}
      PHASE: ${{ github.event.inputs.phase || github.event.client_payload.phase || 'P1_RECON' }}
      MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'canary' }}
      DISPATCH_ID: ${{ github.event.client_payload.dispatch_id || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pre-flight credential leak scan.
      # Scans ONLY code/config files (skips markdown docs that legitimately mention
      # credential pattern names for explanation). Patterns require either a length
      # qualifier (>=20 alphanumeric chars after prefix) OR a JWT-shaped signature
      # (eyJ...eyJ...) so bare mentions of "service_role" or "AIza" don't false-fire.
      - name: Pre-flight credential leak scan
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='ghp_[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9]{30,}|eyJ[A-Za-z0-9_=-]{10,}\.eyJ[A-Za-z0-9_=-]{20,}\.[A-Za-z0-9_=-]{20,}'
          if grep -REn \
              --include='*.py' \
              --include='*.yml' \
              --include='*.yaml' \
              --include='*.json' \
              --include='*.txt' \
              --include='*.sh' \
              "$PATTERN" ci/v65/ 2>/dev/null; then
            echo "::error::credential leak detected in ci/v65 (code/config files) — aborting"
            exit 1
          fi
          echo "credential scan clean (markdown and other docs intentionally skipped)"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        id: install-deps
        working-directory: ci/v65
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Checkpoint phase_start to Supabase
        if: steps.install-deps.outcome == 'success'
        env:
          STATUS: running
          NOTE: workflow ${{ github.run_id }} started
        run: |
          python ci/v65/runner.py checkpoint --status running --note "workflow run ${{ github.run_id }} started"

      - name: Execute phase
        id: phase
        if: steps.install-deps.outcome == 'success'
        run: |
          python ci/v65/runner.py execute --phase "${PHASE}" --mode "${MODE}"

      # Always-checkpoint, BUT gated on Python being set up — otherwise the
      # runner can't even import and the step cascades a misleading failure.
      # If install-deps was skipped (pre-flight scan failed), we instead emit
      # a minimal curl-based failure beacon so the dispatch row still learns.
      - name: Checkpoint phase_complete to Supabase
        if: always() && steps.install-deps.outcome == 'success'
        env:
          STATUS: ${{ job.status }}
        run: |
          python ci/v65/runner.py checkpoint --status "${STATUS}" --note "workflow run ${{ github.run_id }} ${{ job.status }}"

      - name: Failure beacon (curl-only fallback when Python unavailable)
        if: always() && steps.install-deps.outcome != 'success'
        env:
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "secrets missing — cannot emit beacon"
            exit 0
          fi
          PAYLOAD=$(printf '{"dossier_id":"%s","signal_kind":"other","source":"ci_v65_workflow_failure_beacon","payload":{"honesty_marker":"V","phase":"%s","mode":"%s","github_run_id":"%s","finding":"workflow failed before Python install — preflight or setup-python issue","status":"%s"},"triggers_phases":["%s"]}' \
            "${DOSSIER_ID}" "${PHASE}" "${MODE}" "${GITHUB_RUN_ID}" "${STATUS}" "${PHASE}")
          curl -sS -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "${PAYLOAD}" \
            "${SUPABASE_URL}/rest/v1/ci_v65_event_log" || echo "beacon post failed (non-fatal)"

      - name: Annotate dispatch row (if invoked via summit_chat_dispatch)
        if: always() && steps.install-deps.outcome == 'success' && env.DISPATCH_ID != ''
        run: |
          python ci/v65/runner.py annotate-dispatch \
            --dispatch-id "${DISPATCH_ID}" \
            --workflow-run-id "${{ github.run_id }}" \
            --status "${{ job.status }}"
