name: commit-artifact
on:
  workflow_dispatch:
    inputs:
      path:
        description: repo path to write
        required: true
      content_base64:
        description: base64 of file content
        required: true
      message:
        description: commit message
        required: true
jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write and commit file
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${{ github.event.inputs.path }}")"
          printf '%s' "${{ github.event.inputs.content_base64 }}" | base64 -d > "${{ github.event.inputs.path }}"
          git config user.name "everest-bot"
          git config user.email "bot@everestcapital.usa"
          git add "${{ github.event.inputs.path }}"
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "${{ github.event.inputs.message }}"
          git push
          echo "committed ${{ github.event.inputs.path }}"
