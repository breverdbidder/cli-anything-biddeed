name: "Calendar Parity Fix — 6 Certified Counties"
# One-shot: fills all 5 calendar gaps for the 6 certified counties.
#
# Gap 1: Duval FC        — fill opening_bid for 6 NULL rows (Jun 24-29)
# Gap 2: Palm Beach TD   — scrape + insert from palmbeach.realtaxdeed.com
# Gap 3: Sarasota FC     — scrape + insert from sarasota.realforeclose.com
# Gap 4: Volusia TD      — scrape + insert from volusia.realtaxdeed.com
# Gap 5: Brevard FC      — fill opening_bid for 117/163 NULL rows
#
# Constitutional rules enforced:
#   - source_platform never in ('propertyonion_orphan','po_api')
#   - trg_enforce_po_quarantine blocks PO inserts at DB level
#   - Only allowlist sources: realforeclose, realtaxdeed, clerk_brevard

on:
  workflow_dispatch: {}

concurrency:
  group: calendar-parity-fix
  cancel-in-progress: false

jobs:
  # ── Gaps 2/3/4: Calendar inserts (run in parallel) ───────────────────────────

  palm-beach-td:
    name: "Gap 2 — Palm Beach TD (palmbeach.realtaxdeed.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: "Scrape palmbeach.realtaxdeed.com → upsert MCA"
        env:
          COUNTY_SLUG:               palm_beach
          BASE_URL:                  https://palmbeach.realtaxdeed.com
          PLATFORM:                  realtaxdeed
          SALE_TYPE:                 tax_deed
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python .github/scripts/calendar_sweep_mca.py
          EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::palm_beach/tax_deed: zero future dates — county may be dark or blocked"
            exit 0
          fi
          exit $EXIT
      - name: "Verify Palm Beach rows"
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.palm_beach&sale_type=eq.tax_deed&auction_date=gte.${TODAY}&select=auction_date,case_number,opening_bid&limit=5")
          COUNT=$(echo "$RESP" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "::notice::palm_beach/tax_deed: $COUNT upcoming rows in MCA"
          echo "### SQL VERIFICATION — Gap 2: Palm Beach TD" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT auction_date,case_number,opening_bid FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE county='palm_beach' AND sale_type='tax_deed' AND auction_date >= '${TODAY}' LIMIT 5;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- rows: $COUNT  ts: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sarasota-fc:
    name: "Gap 3 — Sarasota FC (sarasota.realforeclose.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: "Scrape sarasota.realforeclose.com → upsert MCA"
        env:
          COUNTY_SLUG:               sarasota
          BASE_URL:                  https://sarasota.realforeclose.com
          PLATFORM:                  realforeclose
          SALE_TYPE:                 foreclosure
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python .github/scripts/calendar_sweep_mca.py
          EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::sarasota/foreclosure: zero future dates — county may be dark or blocked"
            exit 0
          fi
          exit $EXIT
      - name: "Verify Sarasota rows"
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.sarasota&sale_type=eq.foreclosure&auction_date=gte.${TODAY}&select=auction_date,case_number,opening_bid&limit=5")
          COUNT=$(echo "$RESP" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "::notice::sarasota/foreclosure: $COUNT upcoming rows in MCA"
          echo "### SQL VERIFICATION — Gap 3: Sarasota FC" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT auction_date,case_number,opening_bid FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE county='sarasota' AND sale_type='foreclosure' AND auction_date >= '${TODAY}' LIMIT 5;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- rows: $COUNT  ts: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  volusia-td:
    name: "Gap 4 — Volusia TD (volusia.realtaxdeed.com)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: "Scrape volusia.realtaxdeed.com → upsert MCA"
        env:
          COUNTY_SLUG:               volusia
          BASE_URL:                  https://volusia.realtaxdeed.com
          PLATFORM:                  realtaxdeed
          SALE_TYPE:                 tax_deed
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python .github/scripts/calendar_sweep_mca.py
          EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::volusia/tax_deed: zero future dates — county may be dark or blocked"
            exit 0
          fi
          exit $EXIT
      - name: "Verify Volusia rows"
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=eq.volusia&sale_type=eq.tax_deed&auction_date=gte.${TODAY}&select=auction_date,case_number,opening_bid&limit=5")
          COUNT=$(echo "$RESP" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "::notice::volusia/tax_deed: $COUNT upcoming rows in MCA"
          echo "### SQL VERIFICATION — Gap 4: Volusia TD" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT auction_date,case_number,opening_bid FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE county='volusia' AND sale_type='tax_deed' AND auction_date >= '${TODAY}' LIMIT 5;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- rows: $COUNT  ts: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Gaps 1 + 5: Fill opening bids (runs after calendar inserts) ──────────────

  fill-bids:
    name: "Gaps 1+5 — Fill opening_bids (Duval FC + Brevard FC)"
    needs: [palm-beach-td, sarasota-fc, volusia-td]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Run fill_opening_bids_brevard_duval.py (all passes)"
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL:       ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD:    ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: |
          set +e
          python scripts/fill_opening_bids_brevard_duval.py
          EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::Partial fill — some NULLs remain (likely Brevard blocked from datacenter IPs)"
            echo "::notice::Dispatch brevard-realforeclose-drain.yml for residential proxy fallback"
            exit 0
          fi
          exit $EXIT

  # ── Final Verification ────────────────────────────────────────────────────────

  verify:
    name: "SQL Verification — All 6 Counties"
    needs: fill-bids
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: "Constitutional check — PO sources must be 0"
        run: |
          set -euo pipefail
          PO_ROWS=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?source_platform=in.(propertyonion_orphan,po_api)&select=id&limit=10")
          PO_COUNT=$(echo "$PO_ROWS" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Constitutional check: PO source rows = $PO_COUNT (must be 0)"
          if [ "$PO_COUNT" -ne 0 ]; then
            echo "::error::CONSTITUTIONAL VIOLATION — $PO_COUNT PO-sourced rows detected!"
            exit 1
          fi
          echo "✅ Constitutional: 0 PO source rows"

      - name: "Parity report — 6 certified counties"
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          RESP=$(curl -sf \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/multi_county_auctions?county=in.(brevard,duval,hillsborough,palm_beach,sarasota,volusia)&auction_date=gte.${TODAY}&select=county,sale_type,opening_bid&limit=5000")

          REPORT=$(echo "$RESP" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          from collections import defaultdict
          stats = defaultdict(lambda: {'total': 0, 'with_bid': 0})
          for r in rows:
              k = (r['county'].lower(), r['sale_type'] or 'unknown')
              stats[k]['total'] += 1
              if r['opening_bid'] is not None:
                  stats[k]['with_bid'] += 1
          print()
          print(f'  {\"county\":<18} {\"sale_type\":<14} {\"total\":>7}  {\"with_bid\":>9}')
          print('  ' + '-'*55)
          for (county, st), v in sorted(stats.items()):
              pct = round(v[\"with_bid\"]/v[\"total\"]*100) if v[\"total\"] else 0
              flag = '' if v['total'] == 0 else ('✅' if pct >= 90 else '⚠️')
              print(f'  {county:<18} {st:<14} {v[\"total\"]:>7}  {v[\"with_bid\"]:>9}  ({pct}%) {flag}')
          print()
          ")
          echo "$REPORT"

          echo "### SQL VERIFICATION — Calendar Parity Fix" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          echo "SELECT lower(county), sale_type, COUNT(*), COUNT(*) FILTER (WHERE opening_bid IS NOT NULL) AS with_bid" >> "$GITHUB_STEP_SUMMARY"
          echo "FROM multi_county_auctions" >> "$GITHUB_STEP_SUMMARY"
          echo "WHERE lower(county) IN ('brevard','duval','hillsborough','palm_beach','sarasota','volusia')" >> "$GITHUB_STEP_SUMMARY"
          echo "AND auction_date >= CURRENT_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "GROUP BY lower(county), sale_type ORDER BY lower(county), sale_type;" >> "$GITHUB_STEP_SUMMARY"
          echo "-- Timestamp: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
