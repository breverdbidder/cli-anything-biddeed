name: Video Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-video
          path: zonewise-video-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: zonewise-video-src/package-lock.json

      - name: Install dependencies
        working-directory: zonewise-video-src
        run: npm ci

      - name: Install Chrome for Remotion
        working-directory: zonewise-video-src
        run: npx remotion browser ensure

      - name: Render full video
        working-directory: zonewise-video-src
        run: |
          mkdir -p out
          npx remotion render src/index.ts ZoneWiseDemo out/zonewise-demo.mp4 \
            --fps=30 --width=1920 --height=1080 --concurrency=4

      - name: Render hook clip (15s)
        working-directory: zonewise-video-src
        run: |
          npx remotion render src/index.ts ZoneWiseHook out/hook.mp4 \
            --fps=30 --width=1920 --height=1080

      - name: Install ffmpeg + convert hook to GIF
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -i zonewise-video-src/out/hook.mp4 \
            -vf "fps=15,scale=1280:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            zonewise-video-src/out/hook.gif || echo "GIF skipped"

      - name: Upload video to Supabase
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/edp-screenshots/video/zonewise-demo.mp4" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: video/mp4" \
            --data-binary @zonewise-video-src/out/zonewise-demo.mp4
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/edp-screenshots/video/hook.gif" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: image/gif" \
            --data-binary @zonewise-video-src/out/hook.gif || true

      - name: Comment on issue 196
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const base = '${{ secrets.SUPABASE_URL }}/storage/v1/object/public/edp-screenshots/video';
            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 196,
              body: `## 🎬 ZoneWise Demo Video — RENDERED\n\n**MP4 (1920×1080 @30fps):** ${base}/zonewise-demo.mp4\n\n**Hook GIF (15s):** ${base}/hook.gif\n\nSource: https://github.com/breverdbidder/zonewise-video\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zonewise-video-${{ github.sha }}
          path: |
            zonewise-video-src/out/zonewise-demo.mp4
            zonewise-video-src/out/hook.gif
          retention-days: 30
