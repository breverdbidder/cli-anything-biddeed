name: bcpao-folio-pin-harvest
# Drain 2713 unbridged Brevard folios: bcpao_fetch_jobs(queued) -> brevard_folio_pin_bridge
# Criterion I unblock: 53.9% -> 95% render-complete
# Uses Playwright Chromium to bypass Cloudflare on bcpao.us.
on:
  workflow_dispatch:
    inputs:
      apply_migration:
        description: "Apply SQL migration first? (yes/no)"
        required: false
        default: "yes"
  schedule:
    - cron: "0 10 * * *"   # daily 10:00 UTC until queue empty

concurrency:
  group: bcpao-folio-pin-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h ceiling per task spec
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          # npm ci respects package-lock.json exactly — ensures version parity between
          # the install binary and what require('@playwright/test') resolves to at runtime.
          npm ci
          echo "=== Installed playwright version ==="
          node -p "require('@playwright/test/package.json').version"
          node -p "require('playwright-core/package.json').version"
          echo "=== Installing Chromium ==="
          ./node_modules/.bin/playwright install chromium --with-deps
          echo "=== Installed browser paths ==="
          ls ~/.cache/ms-playwright/ 2>/dev/null || echo "no cache"

      - name: Apply migration (create tables + seed queue)
        if: ${{ github.event.inputs.apply_migration != 'no' }}
        run: |
          set -euo pipefail
          echo "=== 20260622_bcpao_folio_pin_bridge.sql ==="
          python3 -c "import json; print(json.dumps({'query': open('supabase/migrations/20260622_bcpao_folio_pin_bridge.sql').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"; cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::Migration failed HTTP $HTTP"; exit 1; }
          echo "Migration OK"

      - name: Verify queue has jobs
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, json

          sb_url = os.environ['SUPABASE_URL'].rstrip('/')
          sb_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          req = urllib.request.Request(
              f'{sb_url}/rest/v1/bcpao_fetch_jobs?status=eq.queued&select=count',
          )
          req.add_header('apikey', sb_key)
          req.add_header('Authorization', f'Bearer {sb_key}')
          req.add_header('Prefer', 'count=exact')
          with urllib.request.urlopen(req, timeout=15) as r:
              total = r.headers.get('content-range', '?/?').split('/')[-1]
              print(f'bcpao_fetch_jobs queued count: {total}')
          PYEOF

      - name: Run BCPAO folio->PIN harvest
        run: node scripts/bcpao_folio_pin_harvest.js

      - name: Verify results
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, json, sys

          sb_url = os.environ['SUPABASE_URL'].rstrip('/')
          sb_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def sb_count(table, params=''):
              url = f'{sb_url}/rest/v1/{table}?select=count'
              if params:
                  url += f'&{params}'
              req = urllib.request.Request(url)
              req.add_header('apikey', sb_key)
              req.add_header('Authorization', f'Bearer {sb_key}')
              req.add_header('Prefer', 'count=exact')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      hdr = r.headers.get('content-range', '?/?')
                      return hdr.split('/')[-1]
              except Exception as e:
                  return f'ERR({e})'

          queued  = sb_count('bcpao_fetch_jobs', 'status=eq.queued')
          done    = sb_count('bcpao_fetch_jobs', 'status=eq.done')
          failed  = sb_count('bcpao_fetch_jobs', 'status=eq.failed')
          empty   = sb_count('bcpao_fetch_jobs', 'status=eq.empty')
          bridge  = sb_count('brevard_folio_pin_bridge')

          print('=== VERIFICATION ===')
          print(f'bcpao_fetch_jobs  queued={queued}  done={done}  failed={failed}  empty={empty}')
          print(f'brevard_folio_pin_bridge total={bridge}')

          try:
              bridge_n = int(bridge)
              if bridge_n >= 5000:
                  print(f'DoD PASS: brevard_folio_pin_bridge >= 5000 rows ({bridge_n})')
              else:
                  print(f'DoD PENDING: bridge has {bridge_n} rows (need >= 5000)')
          except (ValueError, TypeError):
              print(f'WARNING: could not parse bridge row count: {bridge}')
          PYEOF
