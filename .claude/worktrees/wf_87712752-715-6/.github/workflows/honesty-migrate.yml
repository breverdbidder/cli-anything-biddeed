name: Deploy Honesty Protocol Tables
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install psql
        run: sudo apt-get install -y postgresql-client
      
      - name: Run migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -x
          # Force IPv4, show all errors
          export PGSSLMODE=require
          
          echo "=== Attempt 1: session pooler ==="
          psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" -c "SELECT 1" 2>&1 || true
          
          echo "=== Attempt 2: transaction pooler ==="
          psql "postgresql://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" -c "SELECT 1" 2>&1 || true
          
          echo "=== Attempt 3: direct IPv4 forced ==="
          DIRECT_IP=$(dig +short A db.mocerqjnksmhcjzxrewo.supabase.co | head -1)
          echo "Resolved to: $DIRECT_IP"
          psql "postgresql://postgres:${SUPABASE_DB_PASSWORD}@${DIRECT_IP}:5432/postgres?sslmode=require" -c "SELECT 1" 2>&1 || true
          
          echo "=== Attempt 4: use DATABASE_URL pattern from brevard-bidder-scraper ==="
          psql "postgres://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres" -c "SELECT 1" 2>&1 || true
          
          echo "=== DNS check ==="
          dig +short aws-0-us-east-1.pooler.supabase.com 2>&1 | head -3
          dig +short db.mocerqjnksmhcjzxrewo.supabase.co 2>&1 | head -3
