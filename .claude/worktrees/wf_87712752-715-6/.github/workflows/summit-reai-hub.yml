name: "SUMMIT: REAI Hub Deploy"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "full-deploy"
        type: choice
        options:
          - full-deploy
          - schema-only
          - seed-only

jobs:
  dispatch-reai-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Decode OAuth Token
        run: echo "${{ secrets.CLAUDE_OAUTH_B64 }}" | base64 -d > /tmp/claude-oauth-token

      - name: Deploy REAI Hub via Claude Code on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_B64 }}
        with:
          host: 87.99.129.125
          username: claude
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 280m
          envs: CLAUDE_CODE_OAUTH_TOKEN
          script: |
            set -e
            
            # Decode OAuth token
            echo "$CLAUDE_CODE_OAUTH_TOKEN" | base64 -d > /tmp/claude-oauth-token
            export CLAUDE_CODE_OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            
            # Ensure Claude Code available
            export PATH="/home/claude/.npm-global/bin:$PATH"
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            
            # Session workspace
            mkdir -p /home/claude/summit-sessions
            cd /home/claude/summit-sessions
            
            # Run Claude Code with full REAI Hub deploy spec
            claude --dangerously-skip-permissions -p "
            SUMMIT DISPATCH: REAI Hub Full Deployment
            ============================================
            
            OBJECTIVE: Create and deploy the REAI Knowledge Repository as a standalone Next.js app on Cloudflare Pages with Supabase backend.
            
            EXECUTION STEPS (IN ORDER):
            
            STEP 1: CREATE REPO
            - gh repo create breverdbidder/reai-hub --private --clone
            - cd reai-hub
            - git checkout -b main
            
            STEP 2: SCAFFOLD NEXT.JS APP
            - npx create-next-app@14 . --typescript --tailwind --app --no-src-dir --import-alias @/* --use-npm
            - npm install @supabase/supabase-js
            - Configure next.config.js for static export (output: export)
            - Configure tailwind with house brand colors (Navy #1E3A5F, Orange #F59E0B, bg #020617)
            
            STEP 3: SUPABASE SCHEMA
            - Target: mocerqjnksmhcjzxrewo.supabase.co
            - Get credentials from: brevard-bidder-scraper/docs/SUPABASE_CREDENTIALS.md
            - Create 4 tables: reai_knowledge, reai_notes, reai_data_points, reai_documents
            - Enable RLS with authenticated CRUD + anon read on knowledge
            - Create indexes on category columns
            
            SQL for tables:
            
            CREATE TABLE IF NOT EXISTS reai_knowledge (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              category TEXT NOT NULL,
              subcategory TEXT,
              key TEXT NOT NULL,
              value JSONB NOT NULL,
              source TEXT DEFAULT 'hardcoded',
              version TEXT DEFAULT '1.0.0',
              created_at TIMESTAMPTZ DEFAULT now(),
              updated_at TIMESTAMPTZ DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS idx_reai_knowledge_category ON reai_knowledge(category);
            
            CREATE TABLE IF NOT EXISTS reai_notes (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              title TEXT NOT NULL,
              content TEXT,
              category TEXT NOT NULL DEFAULT 'general',
              tags TEXT[] DEFAULT '{}',
              pinned BOOLEAN DEFAULT false,
              created_at TIMESTAMPTZ DEFAULT now(),
              updated_at TIMESTAMPTZ DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS idx_reai_notes_category ON reai_notes(category);
            
            CREATE TABLE IF NOT EXISTS reai_data_points (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              key TEXT NOT NULL,
              value TEXT NOT NULL,
              numeric_value NUMERIC,
              category TEXT NOT NULL DEFAULT 'metrics',
              unit TEXT,
              source TEXT,
              measured_at TIMESTAMPTZ DEFAULT now(),
              created_at TIMESTAMPTZ DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS idx_reai_data_category ON reai_data_points(category);
            
            CREATE TABLE IF NOT EXISTS reai_documents (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              title TEXT NOT NULL,
              doc_type TEXT NOT NULL,
              description TEXT,
              version TEXT DEFAULT '1.0',
              file_url TEXT,
              content_summary TEXT,
              created_at TIMESTAMPTZ DEFAULT now(),
              updated_at TIMESTAMPTZ DEFAULT now()
            );
            
            ALTER TABLE reai_knowledge ENABLE ROW LEVEL SECURITY;
            ALTER TABLE reai_notes ENABLE ROW LEVEL SECURITY;
            ALTER TABLE reai_data_points ENABLE ROW LEVEL SECURITY;
            ALTER TABLE reai_documents ENABLE ROW LEVEL SECURITY;
            
            CREATE POLICY auth_knowledge ON reai_knowledge FOR ALL TO authenticated USING (true) WITH CHECK (true);
            CREATE POLICY auth_notes ON reai_notes FOR ALL TO authenticated USING (true) WITH CHECK (true);
            CREATE POLICY auth_data ON reai_data_points FOR ALL TO authenticated USING (true) WITH CHECK (true);
            CREATE POLICY auth_docs ON reai_documents FOR ALL TO authenticated USING (true) WITH CHECK (true);
            CREATE POLICY anon_read_knowledge ON reai_knowledge FOR SELECT TO anon USING (true);
            
            STEP 4: SEED HARDCODED DATA
            Create scripts/seed.ts that inserts ALL the following into reai_knowledge as JSONB entries by category:
            
            - identity: name=REAI, fullName=Real Estate Artificial Intelligence, tagline=The intelligence layer for the entire real estate industry, oneLiner=REAI is building the AI21 of real estate, positioning=AI company IN real estate (20-30x multiple) NOT PropTech WITH AI (8.8x)
            - models: REAI-7B (7B edge, Qwen3.5-7B/Phi-4/Gemma-3, Q4_K_M, Ollama, <500ms), REAI-27B (27B server, Qwen3.5-27B, BF16, vLLM, <1s)
            - training: S1 Reasoning Distill (LoRA rank 64, Claude traces), S2 Domain SFT (LoRA rank 128, proprietary RE data), S3 Alignment (DPO/ORPO, human preferences)
            - smart_router: 5 tiers (REAI_LOCAL, FREE/Gemini, ULTRA_CHEAP/DeepSeek, QUALITY/Sonnet, FRONTIER/Opus)
            - domains: 8 domains with eval targets (Foreclosure Law >90%, Construction ±15%, Zoning >95%, Valuation ±10%, Title >90%, Demographics >85%, Legal >80%, Chat >4.0/5.0)
            - ai21_intel: Founded 2017 Tel Aviv, 636M funding, 1.4B valuation, 58M revenue, 227 employees, Jamba hybrid Mamba-Transformer-MoE, Maestro AIPOS orchestration
            - anthropic_intel: 380B valuation, 19B ARR, 27x multiple, 2.5B Claude Code ARR, 40% enterprise share
            - valuation: 7 drivers ranked (Model IP 40%, Revenue 25%, Data Moat 15%, Orchestration 10%, Market 5%, Alpha 3%, Network 2%), 5yr projections (450K→2M→9M→22M→45M ARR), fundraising path (Pre-seed 8M→Seed 15M→A 75M→B 250M→C 1.5B), expected value 271M
            - roadmap: Phase 0-5 (Foundation, Reasoning Distill, Domain SFT, Deployment, Scale, National)
            - market_data: Global RE 40T+, US residential 4.5T, PropTech spend 16.7B, PropTech CAGR 16%, LLM vendor multiple 65x, PropTech multiple 8.8x
            
            Also seed reai_documents with these entries:
            - REAI Foundation Model Spec v1.0 (doc_type: spec)
            - AI21 Labs 7-Phase CI Report (doc_type: ci_report)  
            - REAI Valuation Model v1.0 (doc_type: valuation)
            - REAI Hub Deploy Spec (doc_type: deploy_spec)
            
            STEP 5: BUILD UI
            - 8 pages: /, /models, /domains, /intel, /valuation, /roadmap, /notes, /documents, /login
            - Sidebar navigation (desktop), bottom tabs (mobile)
            - House brand: Navy #1E3A5F, Orange #F59E0B, Inter font, bg #020617 slate-950
            - Cards: rounded-lg border-slate-800 bg-slate-900
            - All data fetched from Supabase on page load
            - Notes page: CRUD with title, content, category selector, pin, delete
            - Data points page: CRUD with key, value, category, unit
            - Search/filter on notes and data tabs
            - Auth gate: redirect to /login if not authenticated
            - Login page: Supabase magic link for ariel@everestcapitalusa.com
            - Mobile responsive (used on phone)
            
            STEP 6: CLAUDE.MD
            Create CLAUDE.md with: Identity, Stack, Brand rules, Data persistence rules, Auth rules, Deploy rules.
            
            STEP 7: CLOUDFLARE PAGES
            - Create CF Pages project linked to breverdbidder/reai-hub
            - Set build command: npm run build
            - Set output: out
            - Set env vars: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
            - Add CNAME: reai.biddeed.ai → reai-hub.pages.dev (CF zone b32406b78aaaefd55557d77c843a5940)
            
            STEP 8: DEPLOY
            - git add -A
            - git commit -m 'feat: REAI Knowledge Hub v1.0 — full deploy'
            - git push origin main
            - Verify CF Pages build triggers
            - Verify reai.biddeed.ai resolves
            
            STEP 9: VERIFY
            - curl -I https://reai.biddeed.ai (expect 200)
            - Verify Supabase tables have seeded data
            - Log results
            
            CONSTRAINTS:
            - COST DISCIPLINE: Single attempt per approach. No retry loops.
            - 50% RULE: Kill session at 50% context.
            - Session hygiene: Context7 plugin, CC Status Line.
            - House brand MANDATORY on every component.
            - NO localStorage — Supabase only.
            - Static export only (output: export in next.config.js).
            "
            
            # Cleanup
            rm -f /tmp/claude-oauth-token
