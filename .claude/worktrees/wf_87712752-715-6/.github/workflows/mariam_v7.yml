name: Mariam Deeds v7

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Grantee or ALL'
        required: false
        default: 'MAXI DAY'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v7
          cd /tmp/mariam_v7

          cat > runner.py <<'PY'
          import asyncio, json, os, re
          from datetime import datetime

          async def search_grantee(party_name: str):
              from playwright.async_api import async_playwright
              result = {"party": party_name, "ts": datetime.utcnow().isoformat(),
                        "records": [], "success": False, "error": None,
                        "debug": [], "screenshots": []}

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (Windows NT 10.0) Chrome/120.0",
                  )
                  page = await ctx.new_page()
                  safe = party_name.replace(' ','_').replace(',','')

                  try:
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)
                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)

                      await page.wait_for_selector("input#SearchOnName", timeout=20000)
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                      await page.fill("input#SearchOnName", party_name)
                      await page.fill("input#RecordDateFrom", "1/1/2011")
                      await page.fill("input#RecordDateTo", "12/31/2022")
                      await page.click("input#btnSearch")
                      await asyncio.sleep(4)

                      # Wait for Name picker
                      await page.wait_for_selector("text=Select Names:", timeout=15000)
                      result["debug"].append("Name picker appeared")

                      # Find the VISIBLE Done button - use locator filter
                      all_done = page.locator("input[type='submit'][value='Done']")
                      cnt = await all_done.count()
                      result["debug"].append(f"Total Done buttons: {cnt}")

                      clicked = False
                      for i in range(cnt):
                          btn = all_done.nth(i)
                          try:
                              if await btn.is_visible():
                                  bbox = await btn.bounding_box()
                                  result["debug"].append(f"Done #{i} visible at {bbox}")
                                  await btn.click()
                                  result["debug"].append(f"clicked visible Done #{i}")
                                  clicked = True
                                  break
                          except Exception as e:
                              result["debug"].append(f"Done #{i} skipped: {e}")

                      if not clicked:
                          # Bigger hammer - force click through any
                          try:
                              await page.locator("input[type='submit'][value='Done']:visible").first.click(force=True)
                              result["debug"].append("force-clicked first visible")
                              clicked = True
                          except Exception as e:
                              result["debug"].append(f"force click fail: {e}")

                      if clicked:
                          try:
                              await page.wait_for_load_state("networkidle", timeout=60000)
                          except: pass
                          await asyncio.sleep(8)

                      ss = f"/tmp/mariam_v7/{safe}_after.png"
                      await page.screenshot(path=ss, full_page=True)
                      result["screenshots"].append(ss)

                      content = await page.content()
                      with open(f"/tmp/mariam_v7/{safe}_after.html","w") as f:
                          f.write(content[:1500000])
                      result["debug"].append(f"page len: {len(content)}")
                      result["debug"].append(f"url: {page.url}")

                      # Detect if results are now showing
                      tbl_count = await page.locator("table").count()
                      result["debug"].append(f"tables: {tbl_count}")

                      # Page 1 capture
                      async def capture():
                          recs = []
                          rows = await page.locator("tr").all()
                          for row in rows:
                              try:
                                  cells = await row.locator("td").all()
                                  if len(cells) < 5: continue
                                  texts = [(await c.inner_text()).strip() for c in cells]
                                  if any(re.fullmatch(r"\d{1,2}/\d{1,2}/\d{4}", t) for t in texts):
                                      recs.append(texts)
                              except: pass
                          return recs

                      result["records"] = await capture()
                      result["debug"].append(f"page 1: {len(result['records'])} rows")

                      # Pagination
                      for pn in range(2, 50):
                          next_btn = page.locator("a.t-arrow-end-right, a.t-arrow-next, a[title='Next page'], a[title='Go to the next page']")
                          got = False
                          for i in range(await next_btn.count()):
                              b = next_btn.nth(i)
                              try:
                                  if await b.is_visible() and 'disabled' not in (await b.get_attribute('class') or ''):
                                      await b.click()
                                      await asyncio.sleep(3)
                                      got = True
                                      break
                              except: pass
                          if not got: break
                          new_recs = await capture()
                          result["records"].extend(new_recs)
                          result["debug"].append(f"page {pn}: +{len(new_recs)}")

                      result["success"] = True
                      await browser.close()
                  except Exception as e:
                      result["error"] = str(e)
                      try:
                          await page.screenshot(path=f"/tmp/mariam_v7/{safe}_error.png", full_page=True)
                      except: pass
                      try: await browser.close()
                      except: pass

              return result

          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
          target = os.environ.get("GRANTEE","MAXI DAY").strip().upper()
          targets = GRANTEES_ALL if target == "ALL" else [target]

          async def main():
              all_out = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_grantee(g)
                  all_out[g] = r
                  print(f"  records={len(r['records'])} success={r['success']}", flush=True)
                  for d in r['debug']: print(f"  ! {d}", flush=True)
              with open("/tmp/mariam_v7/all_results.json","w") as f:
                  json.dump(all_out, f, indent=2, default=str)
          asyncio.run(main())
          PY

          pip install --quiet playwright 2>&1 | tail -1 || true
          python3 -m playwright install chromium 2>&1 | tail -1 || true
          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee /tmp/mariam_v7/run.log
          ls -la /tmp/mariam_v7/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v7/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v7_${{ inputs.grantee }}
          path: /tmp/results/
