name: Import Gemini Key to Biddeed Router Vault

on:
  workflow_dispatch:
    inputs:
      source_secret:
        description: 'Which GH secret to import'
        required: true
        default: 'GEMINI_API_KEY'
        type: choice
        options:
          - GEMINI_API_KEY
          - GOOGLE_API_KEY

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Import key to Supabase vault
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SOURCE_SECRET: ${{ inputs.source_secret }}
        run: |
          set -e
          # Pick the right key based on input
          if [ "$SOURCE_SECRET" = "GEMINI_API_KEY" ]; then
            KEY="$GEMINI_API_KEY"
          else
            KEY="$GOOGLE_API_KEY"
          fi
          
          if [ -z "$KEY" ]; then
            echo "::error::Source secret $SOURCE_SECRET is empty"
            exit 1
          fi
          
          # Mask the key in any subsequent log output
          echo "::add-mask::$KEY"
          
          # Sanity check (mask-safe)
          KEY_LEN=${#KEY}
          KEY_PREFIX=${KEY:0:4}
          echo "Source: $SOURCE_SECRET, length: $KEY_LEN, prefix: $KEY_PREFIX"
          
          # Call RPC to update vault — response is logged but key is masked
          RESPONSE=$(curl -sS -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/update_router_gemini_key" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"p_key\": \"${KEY}\"}")
          
          echo "Response: $RESPONSE"
          
          # Fail if response doesn't contain "ok":true
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::error::Vault update failed"
            exit 1
          fi
          
          echo "✅ Vault rotated. New key prefix in vault matches source."
