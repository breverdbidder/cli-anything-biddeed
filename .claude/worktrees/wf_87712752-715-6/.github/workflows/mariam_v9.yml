name: Mariam Deeds v9 (Both Sides)

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Entity or ALL'
        required: false
        default: 'ALL'
      date_from:
        description: 'Date from MM/DD/YYYY'
        required: false
        default: '1/1/2008'
      date_to:
        description: 'Date to MM/DD/YYYY'
        required: false
        default: '12/31/2026'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
          DATE_FROM:  ${{ inputs.date_from }}
          DATE_TO:    ${{ inputs.date_to }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' DATE_FROM='${DATE_FROM}' DATE_TO='${DATE_TO}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v9
          cd /tmp/mariam_v9

          cat > runner.py <<'PY'
          import asyncio, json, os, re
          from datetime import datetime
          from pathlib import Path

          async def search_party(name: str, dl_dir: Path, date_from: str, date_to: str):
              from playwright.async_api import async_playwright
              result = {"party": name, "ts": datetime.utcnow().isoformat(),
                        "csv_size": 0, "row_count": 0, "to_count": 0, "from_count": 0,
                        "success": False, "error": None, "debug": []}
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (Windows NT 10.0) Chrome/120.0",
                      accept_downloads=True,
                  )
                  page = await ctx.new_page()
                  safe = name.replace(' ','_').replace(',','')

                  try:
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)
                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)

                      await page.wait_for_selector("input#SearchOnName", timeout=20000)
                      # KEY DIFFERENCE FROM v8: do NOT click #Reverse radio
                      # PartyType stays at default "Both" - returns grantee AND grantor side
                      await page.fill("input#SearchOnName", name)
                      await page.fill("input#RecordDateFrom", date_from)
                      await page.fill("input#RecordDateTo", date_to)
                      await page.click("input#btnSearch")
                      await asyncio.sleep(4)

                      try:
                          await page.wait_for_selector("text=Select Names:", timeout=15000)
                          all_done = page.locator("input[type='submit'][value='Done']")
                          cnt = await all_done.count()
                          for i in range(cnt):
                              if await all_done.nth(i).is_visible():
                                  await all_done.nth(i).click()
                                  break
                      except Exception as e:
                          result["debug"].append(f"no name picker: {e}")

                      await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=30000)
                      await asyncio.sleep(2)

                      page_html = await page.content()
                      m = re.search(r'(\d+)\s*-\s*(\d+)\s*of\s*(\d+)', page_html)
                      if m:
                          result["debug"].append(f"page shows: {m.group(0)}")
                          result["total_records"] = int(m.group(3))

                      async with page.expect_download(timeout=60000) as dl_info:
                          await page.click("a.csvButton#btnCsvButton")
                      dl = await dl_info.value
                      csv_path = dl_dir / f"{safe}.csv"
                      await dl.save_as(str(csv_path))

                      result["csv_size"] = csv_path.stat().st_size
                      with open(csv_path, 'r', errors='replace') as f:
                          lines = f.readlines()
                      result["row_count"] = max(0, len(lines) - 1)
                      # Count To vs From
                      for line in lines[1:]:
                          if '"To"' in line: result["to_count"] += 1
                          elif '"From"' in line: result["from_count"] += 1
                      result["success"] = True
                      result["debug"].append(f"CSV: {result['csv_size']}b, rows={result['row_count']}, To={result['to_count']}, From={result['from_count']}")
                  except Exception as e:
                      result["error"] = str(e)
                  finally:
                      await browser.close()
              return result

          async def main():
              ENTITIES = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
              target = os.environ.get('GRANTEE','ALL').strip().upper()
              entities = ENTITIES if target == 'ALL' else [target]
              dl_dir = Path('/tmp/mariam_v9')
              dl_dir.mkdir(exist_ok=True)
              date_from = os.environ.get('DATE_FROM', '1/1/2008')
              date_to = os.environ.get('DATE_TO', '12/31/2026')
              all_results = {}
              for ent in entities:
                  print(f"\n##### {ent}  ({date_from} - {date_to}) #####", flush=True)
                  r = await search_party(ent, dl_dir, date_from, date_to)
                  all_results[ent] = r
                  print(f"  rows={r['row_count']}  To={r['to_count']}  From={r['from_count']}  success={r['success']}", flush=True)
                  for d in r.get('debug', []):
                      print(f"  ! {d}", flush=True)
                  if r.get('error'):
                      print(f"  ERROR: {r['error']}", flush=True)

              with open(dl_dir / 'all_results.json', 'w') as f:
                  json.dump(all_results, f, indent=2, default=str)
              total = sum(v.get('row_count', 0) for v in all_results.values())
              total_from = sum(v.get('from_count', 0) for v in all_results.values())
              print(f"\n>>> TOTAL: {total} rows, FROM={total_from} (sale-outs), TO={total - total_from} (acquisitions)")
          asyncio.run(main())
          PY

          GRANTEE="${GRANTEE}" DATE_FROM="${DATE_FROM}" DATE_TO="${DATE_TO}" python3 runner.py 2>&1 | tee run.log
          ls -la /tmp/mariam_v9/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v9/ /tmp/results/ || true
          ls -la /tmp/results/mariam_v9/ 2>/dev/null || echo "no results"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v9_${{ inputs.grantee }}
          path: /tmp/results/
          retention-days: 365
