name: Shapira Formula V2 — Migration + Backfill + Retrain
on:
  workflow_dispatch:

jobs:
  migrate-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Step 1: Run DDL migration (tries direct psql, falls back to Hetzner SSH) ──
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run migration (direct psql attempt)
        id: migrate_direct
        continue-on-error: true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          export PGSSLMODE=require
          PROJECT_REF="mocerqjnksmhcjzxrewo"
          SQL_FILE="migrations/20260331_shapira_formula_v2.sql"

          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_KEY}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_KEY}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE"
            if psql "$CONN" -c "SELECT 1" 2>&1; then
              echo "Connected! Running $SQL_FILE ..."
              psql "$CONN" -f "$SQL_FILE"
              psql "$CONN" -c "
                SELECT 'prediction_trajectories' AS tbl, COUNT(*) FROM prediction_trajectories
                UNION ALL SELECT 'learned_parameters', COUNT(*) FROM learned_parameters
                UNION ALL SELECT 'retrain_events', COUNT(*) FROM retrain_events;
              "
              echo "MIGRATION_SUCCESS=true" >> $GITHUB_ENV
              exit 0
            fi
          done
          echo "Direct psql failed — will try via Hetzner"
          exit 1

      # ── Step 1b: Fallback — run migration via Hetzner SSH ──
      - name: Run migration via Hetzner SSH (fallback)
        if: steps.migrate_direct.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            PROJECT_REF="mocerqjnksmhcjzxrewo"
            DB_PASS="${{ secrets.SUPABASE_DB_PASSWORD }}"
            SB_KEY="${{ secrets.SUPABASE_KEY }}"

            # Write migration SQL
            cat > /tmp/shapira_v2_migration.sql << 'SQLEOF'
            -- prediction_trajectories
            CREATE TABLE IF NOT EXISTS prediction_trajectories (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              created_at TIMESTAMPTZ DEFAULT now(),
              case_number TEXT,
              parcel_id TEXT,
              zip_code TEXT NOT NULL,
              auction_type TEXT NOT NULL DEFAULT 'foreclosure' CHECK (auction_type IN ('foreclosure', 'tax_deed')),
              property_type TEXT,
              arv_used NUMERIC,
              repairs_estimate NUMERIC DEFAULT 0,
              judgment_amount NUMERIC,
              predicted_max_bid NUMERIC,
              predicted_action TEXT CHECK (predicted_action IN ('BID', 'REVIEW', 'SKIP')),
              bid_ratio NUMERIC,
              parameters_version TEXT DEFAULT 'v1_default',
              actual_sold NUMERIC,
              winning_bidder_type TEXT,
              reward_score NUMERIC,
              outcome_notes TEXT,
              source_auction_id UUID
            );
            CREATE INDEX IF NOT EXISTS pt_zip_type_idx ON prediction_trajectories (zip_code, auction_type);
            CREATE INDEX IF NOT EXISTS pt_outcome_idx ON prediction_trajectories (actual_sold) WHERE actual_sold IS NOT NULL;
            CREATE INDEX IF NOT EXISTS pt_reward_idx ON prediction_trajectories (reward_score) WHERE reward_score IS NOT NULL;

            -- learned_parameters
            CREATE TABLE IF NOT EXISTS learned_parameters (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              created_at TIMESTAMPTZ DEFAULT now(),
              zip_code TEXT NOT NULL,
              auction_type TEXT NOT NULL CHECK (auction_type IN ('foreclosure', 'tax_deed')),
              parameters JSONB NOT NULL,
              sample_size INTEGER NOT NULL,
              avg_reward NUMERIC,
              retrained_at TIMESTAMPTZ DEFAULT now(),
              model_version TEXT DEFAULT 'shapira_v2',
              UNIQUE(zip_code, auction_type)
            );
            CREATE INDEX IF NOT EXISTS lp_zip_type_idx ON learned_parameters (zip_code, auction_type);

            -- retrain_events
            CREATE TABLE IF NOT EXISTS retrain_events (
              id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
              created_at TIMESTAMPTZ DEFAULT now(),
              total_trajectories INTEGER,
              groups_retrained INTEGER,
              groups_skipped INTEGER,
              model_version TEXT DEFAULT 'shapira_v2',
              accuracy_before NUMERIC,
              accuracy_after NUMERIC,
              duration_seconds NUMERIC(8, 2),
              notes TEXT
            );
            CREATE INDEX IF NOT EXISTS re_created_idx ON retrain_events (created_at DESC);

            -- RLS
            ALTER TABLE prediction_trajectories ENABLE ROW LEVEL SECURITY;
            ALTER TABLE learned_parameters ENABLE ROW LEVEL SECURITY;
            ALTER TABLE retrain_events ENABLE ROW LEVEL SECURITY;
            CREATE POLICY IF NOT EXISTS "service_role_all_prediction_trajectories" ON prediction_trajectories FOR ALL USING (auth.role() = 'service_role') WITH CHECK (auth.role() = 'service_role');
            CREATE POLICY IF NOT EXISTS "service_role_all_learned_parameters" ON learned_parameters FOR ALL USING (auth.role() = 'service_role') WITH CHECK (auth.role() = 'service_role');
            CREATE POLICY IF NOT EXISTS "service_role_all_retrain_events" ON retrain_events FOR ALL USING (auth.role() = 'service_role') WITH CHECK (auth.role() = 'service_role');
            CREATE POLICY IF NOT EXISTS "anon_read_learned_parameters" ON learned_parameters FOR SELECT USING (true);
            SQLEOF

            echo "=== Attempting DB connections from Hetzner ==="
            PGSSLMODE=require
            SUCCESS=0
            for CONN in \
              "postgresql://postgres.${PROJECT_REF}:${DB_PASS}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
              "postgresql://postgres.${PROJECT_REF}:${DB_PASS}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
              "postgresql://postgres:${DB_PASS}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
              "postgresql://postgres.${PROJECT_REF}:${SB_KEY}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
              "postgresql://postgres:${SB_KEY}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            ; do
              SAFE=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
              echo "Trying: $SAFE"
              if psql "$CONN" -c "SELECT 1" 2>&1; then
                echo "Connected via Hetzner!"
                psql "$CONN" -f /tmp/shapira_v2_migration.sql
                psql "$CONN" -c "SELECT 'prediction_trajectories' AS tbl, COUNT(*) FROM prediction_trajectories UNION ALL SELECT 'learned_parameters', COUNT(*) FROM learned_parameters UNION ALL SELECT 'retrain_events', COUNT(*) FROM retrain_events;"
                echo "MIGRATION COMPLETE via Hetzner"
                SUCCESS=1
                break
              fi
            done
            if [ "$SUCCESS" = "0" ]; then
              echo "ERROR: All Hetzner connection attempts failed too."
              exit 1
            fi

      # ── Step 2: Backfill + Retrain (REST API — no DB password needed) ──
      - name: Install Python deps
        run: pip install httpx

      - name: Backfill prediction_trajectories from multi_county_auctions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Backfilling prediction_trajectories ==="
          python scripts/retrain_shapira.py --backfill
          echo "Backfill complete."

      - name: Run initial parameter optimization
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Running initial retrain ==="
          python scripts/retrain_shapira.py
          echo "Retrain complete."

      # ── Step 3: Verify ──
      - name: Verify with curl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== CURL VERIFICATION ==="

          echo "--- prediction_trajectories ---"
          curl -s "${SUPABASE_URL}/rest/v1/prediction_trajectories?select=id" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Prefer: count=exact" -I | grep -i content-range

          echo "--- learned_parameters ---"
          curl -s "${SUPABASE_URL}/rest/v1/learned_parameters?select=zip_code,auction_type,sample_size,avg_reward,model_version" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}"

          echo "--- retrain_events (latest) ---"
          curl -s "${SUPABASE_URL}/rest/v1/retrain_events?select=*&order=created_at.desc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}"

          echo ""
          echo "VERIFIED."
