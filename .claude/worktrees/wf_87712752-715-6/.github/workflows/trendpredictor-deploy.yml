name: "Deploy TrendPredictor to Hetzner"

on:
  push:
    paths:
      - 'trendpredictor/**'
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test after deploy'
        required: false
        type: boolean
        default: true

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  deploy:
    name: "📈 Deploy TrendPredictor"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "1️⃣ Deploy to Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            if [ ! -d "${{ env.REPO_PATH }}/.git" ]; then
              cd /opt/biddeed
              git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git
            fi
            cd ${{ env.REPO_PATH }}
            git fetch origin main && git reset --hard origin/main
            echo "📦 $(git log --oneline -1)"
            test -f trendpredictor/agent.py && echo "✅ agent.py"
            test -f trendpredictor/CLAUDE.md && echo "✅ CLAUDE.md"
            pip install httpx --quiet --break-system-packages 2>/dev/null || true
            mkdir -p trendpredictor/eval_outputs
            echo "✅ TrendPredictor deployed"

      - name: "2️⃣ Smoke test"
        if: github.event.inputs.smoke_test != 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            export MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}"

            echo "🧪 Smoke: ZIP 32937 analysis"
            python3 -m trendpredictor.agent analyze --zip 32937 --horizon 12 --json 2>/dev/null \
              > trendpredictor/eval_outputs/smoke_test.json || true

            python3 -c "
            import json
            d = json.load(open('trendpredictor/eval_outputs/smoke_test.json'))
            pred = d.get('stages',{}).get('prediction',{})
            cyc = d.get('stages',{}).get('cycle',{})
            print(f'✅ Score: {pred.get(\"direction_score\",\"?\"):+.1f} → {pred.get(\"direction_label\",\"?\")}')
            print(f'   Action: {pred.get(\"timing_action\",\"?\")}')
            print(f'   Cycle: {cyc.get(\"current_phase\",\"?\")}')
            print(f'   Confidence: {pred.get(\"confidence\",0):.0%}')
            gj = pred.get('geojson_feature',{})
            print(f'   GeoJSON: {\"YES\" if gj else \"NO\"}')
            " 2>&1 || echo "⚠️ Smoke test failed"

      - name: "3️⃣ Status"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            export MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}"
            python3 -m trendpredictor.agent status 2>&1

      - name: "4️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            STATUS="${{ job.status }}"
            EMOJI=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )
            COMMIT=$(cd ${{ env.REPO_PATH }} && git log --oneline -1)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              -d "text=${EMOJI} <b>TrendPredictor Deploy</b>: ${STATUS}
            Commit: ${COMMIT}
            Server: Hetzner" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📈 TrendPredictor Deploy
          **Status:** ${{ job.status }}
          **Server:** Hetzner everest-dispatch
          EOF
