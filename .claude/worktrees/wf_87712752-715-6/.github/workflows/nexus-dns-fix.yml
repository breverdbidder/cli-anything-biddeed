name: Nexus DNS Fix

on:
  repository_dispatch:
    types: [nexus-dns-fix]

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Copy CF token from zonewise-web
        run: pip install pynacl

      - name: Get zonewise-web CF token and add CNAME
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Use a cross-repo workflow approach: dispatch to zonewise-web which has the right CF token
          # Actually simpler: copy the CF token from zonewise-web to here first
          echo "Dispatching DNS creation to zonewise-web..."

          # Create a temp workflow in zonewise-web that adds the CNAME
          python3 << 'PYEOF'
          import json, base64, urllib.request, os

          token = os.environ["GH_PAT"]

          # Just dispatch the CNAME creation as a separate workflow in zonewise-web
          # which already has the correct CLOUDFLARE_API_TOKEN

          workflow_content = """name: Add Nexus CNAME
on:
  repository_dispatch:
    types: [add-nexus-cname]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Add CNAME
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai" \\
            -H "Authorization: Bearer $CF_TOKEN" | \\
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NONE')")
          echo "Zone: $ZONE_ID"
          
          COUNT=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=nexus.zonewise.ai" \\
            -H "Authorization: Bearer $CF_TOKEN" | \\
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); print(len(r))")
          
          if [ "$COUNT" = "0" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \\
              -H "Authorization: Bearer $CF_TOKEN" \\
              -H "Content-Type: application/json" \\
              -d '{"type":"CNAME","name":"nexus","content":"cname.vercel-dns.com","ttl":1,"proxied":false}' | \\
              python3 -c "import json,sys; d=json.load(sys.stdin); print('CNAME CREATED' if d.get('success') else f'FAIL: {d}')"
          else
            echo "CNAME exists"
          fi
"""

          encoded = base64.b64encode(workflow_content.encode()).decode()

          # Check if file exists
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/breverdbidder/zonewise-web/contents/.github/workflows/add-nexus-cname.yml",
                  headers={"Authorization": f"token {token}"}
              )
              resp = json.loads(urllib.request.urlopen(req).read())
              sha = resp.get("sha", "")
              data = json.dumps({"message": "NEXUS: Add CNAME workflow", "content": encoded, "sha": sha})
          except:
              data = json.dumps({"message": "NEXUS: Add CNAME workflow", "content": encoded})

          req = urllib.request.Request(
              f"https://api.github.com/repos/breverdbidder/zonewise-web/contents/.github/workflows/add-nexus-cname.yml",
              data=data.encode(), method="PUT",
              headers={"Authorization": f"token {token}", "Content-Type": "application/json"}
          )
          resp = urllib.request.urlopen(req)
          print(f"Workflow push: HTTP {resp.status}")

          # Dispatch
          import time
          time.sleep(5)
          req = urllib.request.Request(
              f"https://api.github.com/repos/breverdbidder/zonewise-web/dispatches",
              data=json.dumps({"event_type": "add-nexus-cname"}).encode(),
              method="POST",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}
          )
          resp = urllib.request.urlopen(req)
          print(f"Dispatch: HTTP {resp.status}")
          PYEOF

      - name: Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=NEXUS DNS: ${{ job.status }} — dispatched CNAME creation to zonewise-web" || true
