name: "Wakulla Tax Deed Parcel Harvest"
# SHARD-6 (citrus/volusia/miami_dade/calhoun/wakulla) — dispatch_id: 530d7f14-0fb3-4f2f-ad90-62abafdc3cfe
# Wakulla criterion E (parcel linkage): wakullaclerk.org tax_deed_sales.php lists
# case numbers only, but each case links to a "Notice of Application for Tax Deed"
# PDF that carries the real Parcel #. This job harvests that PDF, extracts the
# parcel number, and backfills multi_county_auctions.parcel_id for wakulla
# tax_deed rows. Verified live 2026-07-10: moved wakulla E from 0% -> 76.7%
# (23/30; the 6 remaining rows are foreclosure cases with no parcel # on the
# public foreclosures.php page -- needs a different source, not this job).

on:
  schedule:
    - cron: '40 5 * * *'   # 05:40 UTC daily, ahead of the 05:30Z sweep cycle offset
  workflow_dispatch:

jobs:
  harvest:
    name: "Harvest wakulla tax deed parcels"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install deps"
        run: pip install --quiet requests pypdf

      - name: "Run harvester"
        run: |
          set -euo pipefail
          EXIT=0
          python3 scripts/wakulla_td_parcel_harvest.py || EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_STEP_SUMMARY"
          # exit 2 = nothing new to link (all caught up) -- not a failure
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "2" ]; then
            exit "$EXIT"
          fi

      - name: "Verify: E metric via evaluator RPC"
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/pencil_dod_evaluate_county" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_county": "wakulla"}')
          echo "### SQL VERIFICATION: wakulla E" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP"
