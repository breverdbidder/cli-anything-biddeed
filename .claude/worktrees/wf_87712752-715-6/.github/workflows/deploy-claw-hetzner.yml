name: Deploy Claw-Code CLI to Hetzner
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install claw-code on Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > /tmp/install.sh << 'SCRIPT'
          set -e
          echo "=== Installing claw-code ==="
          
          cd /opt
          if [ -d claw-code ]; then
            cd claw-code && git pull origin main
          else
            git clone https://github.com/breverdbidder/claw-code.git
            cd claw-code
          fi
          
          pip3 install httpx click 2>/dev/null || true
          
          echo "alias claw='python3 -m src.main'" >> /root/.bashrc
          ln -sf /opt/claw-code/src/main.py /usr/local/bin/claw-code 2>/dev/null || true
          
          echo "=== Testing CLI ==="
          cd /opt/claw-code
          python3 -m src.main --help 2>&1 || python3 src/main.py --help 2>&1 || echo "CLI needs debugging"
          
          echo "=== DONE ==="
          echo "Run: ssh root@$HOSTNAME then: cd /opt/claw-code && python3 -m src.main"
          SCRIPT

          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ConnectTimeout=15 /tmp/install.sh root@$HETZNER_IP:/tmp/install-claw.sh
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 root@$HETZNER_IP 'bash /tmp/install-claw.sh'
