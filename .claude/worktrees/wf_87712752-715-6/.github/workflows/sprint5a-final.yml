name: Sprint 5A — Backend + DNS
on:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy server.py + Coder restart
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H $HETZNER_IP >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > /tmp/deploy.sh << 'SCRIPT'
          set -e
          
          echo "=== Deploy server.py ==="
          cd /opt/claw-code
          git pull origin main
          pip3 install httpx 2>/dev/null || true
          
          cat > /etc/systemd/system/claw-code-api.service << 'SVC'
          [Unit]
          Description=Claw Code API Server
          After=network.target
          
          [Service]
          Type=simple
          WorkingDirectory=/opt/claw-code
          ExecStart=/usr/bin/python3 -m python.server
          Restart=always
          RestartSec=5
          Environment=PYTHONPATH=/opt/claw-code
          Environment=PORT=8000
          
          [Install]
          WantedBy=multi-user.target
          SVC
          
          systemctl daemon-reload
          systemctl enable claw-code-api
          systemctl restart claw-code-api
          sleep 3
          
          echo "API status: $(systemctl is-active claw-code-api)"
          curl -s http://127.0.0.1:8000/api/health --max-time 5 2>/dev/null || echo "health check pending"
          
          echo ""
          echo "=== Restart Coder ==="
          cd /root/coder 2>/dev/null || cd /opt/coder 2>/dev/null || true
          docker compose down 2>&1 || true
          sleep 3
          docker compose up -d 2>&1 || true
          
          sleep 10
          CODER_HTTP=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080 --max-time 5 2>/dev/null || echo "000")
          echo "Coder: HTTP $CODER_HTTP"
          
          echo ""
          echo "=== Status ==="
          echo "Claw API: $(systemctl is-active claw-code-api)"
          echo "Dify: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100 --max-time 5)"
          echo "Coder: $CODER_HTTP"
          docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1
          SCRIPT
          
          scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ConnectTimeout=15 /tmp/deploy.sh root@$HETZNER_IP:/tmp/deploy-all.sh
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=10 root@$HETZNER_IP 'bash /tmp/deploy-all.sh'

  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup claw.zonewise.ai via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          
          echo "=== Adding custom domain to CF Pages ==="
          wrangler pages project list 2>&1 | head -10
          
          echo ""
          echo "=== Try direct domain add ==="
          ACCT_ID="$CLOUDFLARE_ACCOUNT_ID"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCT_ID/pages/projects/claw-zonewise/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"name":"claw.zonewise.ai"}' | python3 -c "import json,sys; r=json.load(sys.stdin); print('DOMAIN ADDED' if r.get('success') else f'Result: {json.dumps(r, indent=2)}')"
          
          echo ""
          echo "=== Verify ==="
          sleep 10
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' https://claw.zonewise.ai --max-time 15 || echo "000")
          echo "claw.zonewise.ai: HTTP $HTTP"
          
          HTTP2=$(curl -s -o /dev/null -w '%{http_code}' https://claw-zonewise.pages.dev --max-time 15 || echo "000")
          echo "claw-zonewise.pages.dev: HTTP $HTTP2"
