name: "CC Auth Check"
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Check Claude auth
        run: |
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} << 'EOF'
          echo "=== Claude Code credentials ==="
          ls -la /root/.claude/.credentials.json 2>/dev/null && echo "CREDS_EXIST" || echo "NO_CREDS"
          ls -la /home/fakeroot/.claude/.credentials.json 2>/dev/null || true
          echo ""
          echo "=== Claude version ==="
          export PATH="/root/.local/bin:/root/.npm-global/bin:$PATH"
          claude --version 2>/dev/null || echo "claude not in path"
          echo ""
          echo "=== OAUTH secret test ==="
          if [ -n "$OAUTH" ]; then echo "OAUTH_SECRET_HAS_VALUE"; else echo "OAUTH_SECRET_EMPTY"; fi
          EOF
        env:
          OAUTH: ${{ secrets.CLAUDE_OAUTH_B64 }}
