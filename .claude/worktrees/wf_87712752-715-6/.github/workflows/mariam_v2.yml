name: Mariam Deeds Native v2

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Single grantee or ALL'
        required: false
        default: 'MAXI DAY'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run scraper v2 with correct selectors + screenshots
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          set -e
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v2
          cd /tmp/mariam_v2

          cat > runner.py <<'PY'
          import asyncio, json, os, sys
          from datetime import datetime

          async def search_grantee(party_name: str):
              from playwright.async_api import async_playwright
              result = {
                  "party": party_name,
                  "ts": datetime.utcnow().isoformat(),
                  "records": [],
                  "success": False,
                  "error": None,
                  "debug": [],
                  "screenshots": [],
              }

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1920, "height": 1080},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  )
                  page = await ctx.new_page()

                  try:
                      # Step 1: Disclaimer
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)
                      ss1 = f"/tmp/mariam_v2/{party_name.replace(' ','_')}_1_disclaimer.png"
                      await page.screenshot(path=ss1, full_page=True)
                      result["screenshots"].append(ss1)

                      # Click "I accept the conditions above."
                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)
                          result["debug"].append("accepted")

                      # Wait for search form fully loaded
                      try:
                          await page.wait_for_selector("input#GteeName", timeout=15000)
                          result["debug"].append("GteeName field present")
                      except:
                          result["debug"].append("GteeName field NOT found - screenshotting")

                      ss2 = f"/tmp/mariam_v2/{party_name.replace(' ','_')}_2_form.png"
                      await page.screenshot(path=ss2, full_page=True)
                      result["screenshots"].append(ss2)

                      # Inventory ALL form inputs for debug
                      inputs = await page.locator("input").all()
                      input_meta = []
                      for inp in inputs[:60]:
                          try:
                              name = await inp.get_attribute("name") or ""
                              id_a = await inp.get_attribute("id") or ""
                              type_a = await inp.get_attribute("type") or ""
                              if id_a or name:
                                  input_meta.append({"id": id_a, "name": name, "type": type_a})
                          except: pass
                      result["debug"].append({"inputs": input_meta})

                      # Step 2: Fill GteeName specifically
                      filled = False
                      try:
                          await page.fill("input#GteeName", party_name)
                          filled = True
                          result["debug"].append("filled #GteeName")
                      except Exception as e:
                          result["debug"].append(f"#GteeName fill failed: {e}")

                      if not filled:
                          # Backup selectors
                          for sel in ["input[name='GteeName']","input[id*='Gtee']","input[name*='Gtee']","input[id*='Grantee']"]:
                              try:
                                  if await page.locator(sel).count() > 0:
                                      await page.locator(sel).first.fill(party_name)
                                      filled = True
                                      result["debug"].append(f"filled via {sel}")
                                      break
                              except: pass

                      if not filled:
                          result["error"] = "no grantee field"
                          return result

                      # Set date range
                      for fld, val in [("input#FromDate", "01/01/2011"), ("input#ToDate", "12/31/2022")]:
                          try:
                              if await page.locator(fld).count() > 0:
                                  await page.locator(fld).fill(val)
                                  result["debug"].append(f"date {fld}={val}")
                          except: pass

                      ss3 = f"/tmp/mariam_v2/{party_name.replace(' ','_')}_3_filled.png"
                      await page.screenshot(path=ss3, full_page=True)
                      result["screenshots"].append(ss3)

                      # Step 3: Submit
                      btn2 = page.locator("input[value='Search']")
                      if await btn2.count() == 0:
                          btn2 = page.locator("button[type='submit']")
                      await btn2.first.click()
                      await page.wait_for_load_state("networkidle", timeout=60000)
                      await asyncio.sleep(5)

                      ss4 = f"/tmp/mariam_v2/{party_name.replace(' ','_')}_4_results.png"
                      await page.screenshot(path=ss4, full_page=True)
                      result["screenshots"].append(ss4)
                      result["debug"].append(f"results URL: {page.url}")

                      # Step 4: Detect / parse results
                      content = await page.content()
                      if "No records" in content or "no results" in content.lower():
                          result["success"] = True
                          result["debug"].append("no records returned")
                          await browser.close()
                          return result

                      # Look for results table — Acclaim renders results in #SearchResults or .GridResults
                      result_table_selectors = [
                          "table#SearchResults",
                          "table.GridResults",
                          "div#SearchResultsContainer table",
                          "#oltSearchResults table",
                      ]
                      table_found = None
                      for sel in result_table_selectors:
                          tbl = page.locator(sel)
                          if await tbl.count() > 0:
                              table_found = sel
                              break

                      result["debug"].append(f"results table selector: {table_found}")

                      if not table_found:
                          # Save HTML for forensic
                          html_path = f"/tmp/mariam_v2/{party_name.replace(' ','_')}_results.html"
                          with open(html_path, "w") as f: f.write(content[:100000])
                          result["debug"].append(f"saved html: {html_path}")
                          # Try generic any table with > 5 rows
                          tbls = await page.locator("table").all()
                          for ti, tbl in enumerate(tbls):
                              row_count = await tbl.locator("tr").count()
                              if row_count > 3:
                                  result["debug"].append(f"  table {ti}: {row_count} rows")

                      # Try to extract results via parsing visible td-rich rows
                      rows = await page.locator("tr").all()
                      for row in rows:
                          cols = await row.locator("td").all()
                          if len(cols) < 4: continue
                          try:
                              texts = [(await c.inner_text()).strip() for c in cols[:10]]
                          except: continue
                          # Look for date pattern in any column
                          import re
                          has_date = any(re.match(r"\d{1,2}/\d{1,2}/\d{4}", t) for t in texts)
                          has_doctype = any(re.match(r"^[A-Z]{2,5}$", t) for t in texts if len(t) <= 6)
                          if has_date and len(texts) >= 5:
                              result["records"].append({"cells": texts})

                      result["success"] = True
                      await browser.close()
                  except Exception as e:
                      result["error"] = str(e)
                      try: await browser.close()
                      except: pass

              return result

          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
          target = os.environ.get("GRANTEE","MAXI DAY").strip().upper()
          targets = GRANTEES_ALL if target == "ALL" else [target]

          async def main():
              all_out = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_grantee(g)
                  all_out[g] = r
                  print(f"  records={len(r['records'])} success={r['success']} error={r.get('error')}", flush=True)

              with open("/tmp/mariam_v2/all_results.json","w") as f:
                  json.dump(all_out, f, indent=2, default=str)
              total = sum(len(v["records"]) for v in all_out.values())
              print(f"\n>>> TOTAL: {total} records")
          asyncio.run(main())
          PY

          # Install playwright if needed
          pip install --quiet playwright 2>&1 | tail -1 || true
          python3 -m playwright install chromium 2>&1 | tail -1 || true

          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee /tmp/mariam_v2/run.log
          ls -la /tmp/mariam_v2/
          REMOTE

      - name: Pull results
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v2/ /tmp/results/ || true
          ls -la /tmp/results/mariam_v2/ 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v2_${{ inputs.grantee }}
          path: /tmp/results/
          retention-days: 90
