name: Chat Sessions Migration (Issue #30)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install psql + jq
        run: sudo apt-get install -y postgresql-client jq

      - name: Run chat_sessions migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          PROJECT_REF="mocerqjnksmhcjzxrewo"
          TABLE_EXISTS=0
          MIGRATION_SUCCESS=0

          # ─── Phase 0: Check if table exists via REST API ───
          echo "=== Phase 0: Check for existing chat_sessions ==="
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_KEY:-}" ]; then
            HTTP=$(curl -s -o /tmp/openapi.json -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" 2>/dev/null)
            echo "OpenAPI HTTP: $HTTP"
            if [ "$HTTP" = "200" ]; then
              # Count columns in OpenAPI spec for chat_sessions
              COL_COUNT=$(python3 -c "
          import json, sys
          spec = json.load(open('/tmp/openapi.json'))
          props = spec.get('definitions', {}).get('chat_sessions', {}).get('properties', {})
          print(len(props))
          " 2>/dev/null || echo "0")
              echo "chat_sessions columns in OpenAPI: $COL_COUNT"
              if [ "$COL_COUNT" -gt "0" ]; then
                TABLE_EXISTS=1
                echo "✅ Table exists with $COL_COUNT columns (need 33)"
              fi
            fi

            # Also verify via direct table check
            HTTP2=$(curl -s -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/chat_sessions?limit=0" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" 2>/dev/null)
            echo "Direct table check HTTP: $HTTP2"
            [ "$HTTP2" = "200" ] && TABLE_EXISTS=1
          fi

          # ─── Phase 1: psql (CREATE TABLE or ALTER TABLE) ───
          echo ""
          echo "=== Phase 1: psql migration ==="
          export PGSSLMODE=require

          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE"
            if psql "$CONN" -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ psql connected"
              if [ "$TABLE_EXISTS" = "1" ]; then
                echo "Running ALTER TABLE migration (table exists, adding missing columns)..."
                psql "$CONN" -f migrations/20260329_chat_sessions_alter.sql
              else
                echo "Running CREATE TABLE migration..."
                psql "$CONN" -f migrations/20260329_chat_sessions.sql
              fi
              echo ""
              echo "=== Column count (expect 33) ==="
              psql "$CONN" -c "
                SELECT COUNT(*) AS column_count
                FROM information_schema.columns
                WHERE table_name='chat_sessions' AND table_schema='public';"
              MIGRATION_SUCCESS=1
              break
            fi
          done

          # ─── Phase 2: Insert sample row via REST (works if all columns present) ───
          echo ""
          echo "=== Phase 2: Insert sample row via REST API ==="
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_KEY:-}" ]; then
            CHAT_ID="test-issue-30-$(date +%s)"
            HTTP=$(curl -s -o /tmp/insert_resp.json -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/rest/v1/chat_sessions" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "{
                \"chat_id\": \"${CHAT_ID}\",
                \"chat_url\": \"https://claude.ai/code/issue-30-verify\",
                \"chat_date\": \"$(date +%Y-%m-%d)\",
                \"chat_month\": $(date +%-m),
                \"domain_primary\": \"ECOSYSTEM\",
                \"title\": \"Issue #30 — chat_sessions migration verification\",
                \"summary_length\": 42
              }" 2>/dev/null)
            echo "Insert HTTP: $HTTP"
            cat /tmp/insert_resp.json | head -c 500; echo
            if [ "$HTTP" = "201" ]; then
              echo "✅ Sample row inserted (chat_id=${CHAT_ID})"
              INSERT_SUCCESS=1
            elif [ "$HTTP" = "400" ]; then
              ERR=$(cat /tmp/insert_resp.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("message",""))' 2>/dev/null)
              echo "⚠️ Insert failed: $ERR"
              echo "   Schema mismatch — ALTER TABLE migration needed via psql"
              INSERT_SUCCESS=0
            else
              echo "⚠️ Insert HTTP $HTTP"
              INSERT_SUCCESS=0
            fi
          fi

          # ─── Summary ───
          echo ""
          echo "=== SUMMARY ==="
          echo "Table exists: $TABLE_EXISTS"
          echo "Migration via psql: $MIGRATION_SUCCESS"
          echo "Sample row insert: ${INSERT_SUCCESS:-0}"

          if [ "$TABLE_EXISTS" = "0" ] && [ "$MIGRATION_SUCCESS" = "0" ]; then
            echo ""
            echo "❌ BLOCKER: Table doesn't exist and all migration paths failed."
            echo "   Fix SUPABASE_DB_PASSWORD:"
            echo "   1. Supabase Dashboard → Settings → Database → Reset Password"
            echo "   2. gh secret set SUPABASE_DB_PASSWORD --body 'newpass' --repo breverdbidder/cli-anything-biddeed"
            echo "   3. gh workflow run chat-sessions-migrate.yml --repo breverdbidder/cli-anything-biddeed"
            exit 1
          fi

          if [ "$TABLE_EXISTS" = "1" ] && [ "${INSERT_SUCCESS:-0}" = "0" ] && [ "$MIGRATION_SUCCESS" = "0" ]; then
            echo ""
            echo "⚠️  Table exists but has WRONG SCHEMA (missing columns from 26→33 feature upgrade)."
            echo "   ALTER TABLE migration in migrations/20260329_chat_sessions_alter.sql is ready."
            echo "   BLOCKER: Needs valid SUPABASE_DB_PASSWORD to apply ALTER TABLE."
            echo "   Fix: Reset DB password → re-run this workflow."
            exit 1
          fi

          echo "✅ chat_sessions migration: DONE"

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ chat_sessions — Complete" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ chat_sessions — Schema mismatch, ALTER TABLE needed" >> $GITHUB_STEP_SUMMARY
            echo "Run \`migrations/20260329_chat_sessions_alter.sql\` after fixing SUPABASE_DB_PASSWORD." >> $GITHUB_STEP_SUMMARY
          fi
