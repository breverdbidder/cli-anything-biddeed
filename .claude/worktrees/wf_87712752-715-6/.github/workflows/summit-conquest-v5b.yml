name: "Summit: Cocoa + Rockledge (Correct AGOL Endpoints)"
on:
  workflow_dispatch: {}

jobs:
  conquer:
    name: "Cocoa (AGOL) + Rockledge (correct subdomain)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx pyproj
      - name: "Execute V5B Conquest"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/summit_conquest_v5b.py
