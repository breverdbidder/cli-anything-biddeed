name: Mariam Deeds v3

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Grantee or ALL'
        required: false
        default: 'MAXI DAY'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run v3 with correct selectors
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v3
          cd /tmp/mariam_v3

          cat > runner.py <<'PY'
          import asyncio, json, os, re, sys
          from datetime import datetime

          async def search_grantee(party_name: str):
              from playwright.async_api import async_playwright
              result = {"party": party_name, "ts": datetime.utcnow().isoformat(),
                        "records": [], "success": False, "error": None,
                        "debug": [], "screenshots": []}

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  )
                  page = await ctx.new_page()
                  safe = party_name.replace(' ','_').replace(',','')

                  try:
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)

                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)
                          result["debug"].append("accepted")

                      await page.wait_for_selector("input#SearchOnName", timeout=20000)
                      result["debug"].append("form ready")

                      # Click Grantee radio (id=Reverse maps to "Grantee" label in OnCore)
                      try:
                          await page.click("input#Reverse")
                          result["debug"].append("clicked Grantee radio (#Reverse)")
                          await asyncio.sleep(1)
                      except Exception as e:
                          result["debug"].append(f"Reverse radio fail: {e}")

                      # Fill name
                      await page.fill("input#SearchOnName", party_name)
                      result["debug"].append(f"filled SearchOnName={party_name}")

                      # Date range — clear default and set 2011-2022
                      try:
                          await page.fill("input#RecordDateFrom", "")
                          await page.fill("input#RecordDateFrom", "1/1/2011")
                          await page.fill("input#RecordDateTo", "")
                          await page.fill("input#RecordDateTo", "12/31/2022")
                          result["debug"].append("set date range 2011-2022")
                      except Exception as e:
                          result["debug"].append(f"date range fail: {e}")

                      ss1 = f"/tmp/mariam_v3/{safe}_filled.png"
                      await page.screenshot(path=ss1, full_page=True)
                      result["screenshots"].append(ss1)

                      # Submit
                      await page.click("input#btnSearch")
                      result["debug"].append("clicked btnSearch")
                      try:
                          await page.wait_for_load_state("networkidle", timeout=90000)
                      except: pass
                      await asyncio.sleep(5)

                      ss2 = f"/tmp/mariam_v3/{safe}_results.png"
                      await page.screenshot(path=ss2, full_page=True)
                      result["screenshots"].append(ss2)
                      result["debug"].append(f"results URL: {page.url}")

                      # Parse results
                      content = await page.content()
                      no_match = ("No records found" in content or "No Records Found" in content
                                  or "no results" in content.lower())
                      if no_match:
                          result["success"] = True
                          result["debug"].append("server reports no records")
                          await browser.close()
                          return result

                      # Save HTML for forensic
                      html_path = f"/tmp/mariam_v3/{safe}_results.html"
                      with open(html_path, "w") as f: f.write(content[:300000])

                      # Look for the results grid — Acclaim uses specific structure
                      # Try multiple table candidates
                      tbl_count = await page.locator("table").count()
                      result["debug"].append(f"page has {tbl_count} tables")

                      # The results render in a Telerik grid (Acclaim/OnCore uses Telerik)
                      # Look for tr.k-master-row or any grid row class
                      grid_rows_selectors = [
                          "tr.k-master-row",
                          "tr.t-row",
                          "tbody tr.GridRow",
                          "table.k-grid-table tbody tr",
                          "table.t-grid tbody tr",
                          "div.k-grid-content tr",
                      ]
                      grid_rows = []
                      for sel in grid_rows_selectors:
                          rows = page.locator(sel)
                          n = await rows.count()
                          if n > 0:
                              result["debug"].append(f"found {n} rows via {sel}")
                              grid_rows = await rows.all()
                              break

                      if not grid_rows:
                          # Fallback: any tr containing typical date pattern
                          all_rows = await page.locator("tr").all()
                          for row in all_rows:
                              text = (await row.inner_text()).strip()
                              if re.search(r"\d{1,2}/\d{1,2}/\d{4}", text):
                                  grid_rows.append(row)
                          result["debug"].append(f"fallback found {len(grid_rows)} rows with dates")

                      for row in grid_rows:
                          try:
                              cells = await row.locator("td").all()
                              if len(cells) < 3: continue
                              texts = [(await c.inner_text()).strip() for c in cells]
                              # Expect date in one of the cells
                              has_date = any(re.search(r"\d{1,2}/\d{1,2}/\d{4}", t) for t in texts)
                              if has_date:
                                  result["records"].append({"cells": texts})
                          except: pass

                      result["success"] = True
                      await browser.close()
                  except Exception as e:
                      result["error"] = str(e)
                      try:
                          ssE = f"/tmp/mariam_v3/{safe}_error.png"
                          await page.screenshot(path=ssE, full_page=True)
                          result["screenshots"].append(ssE)
                      except: pass
                      try: await browser.close()
                      except: pass

              return result

          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
          target = os.environ.get("GRANTEE","MAXI DAY").strip().upper()
          targets = GRANTEES_ALL if target == "ALL" else [target]

          async def main():
              all_out = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_grantee(g)
                  all_out[g] = r
                  print(f"  records={len(r['records'])} success={r['success']} err={r.get('error')}", flush=True)
                  for d in r['debug']:
                      print(f"  ! {d}", flush=True)

              with open("/tmp/mariam_v3/all_results.json","w") as f:
                  json.dump(all_out, f, indent=2, default=str)
              total = sum(len(v["records"]) for v in all_out.values())
              print(f"\n>>> TOTAL: {total} records")
          asyncio.run(main())
          PY

          pip install --quiet playwright 2>&1 | tail -1 || true
          python3 -m playwright install chromium 2>&1 | tail -1 || true
          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee /tmp/mariam_v3/run.log
          ls -la /tmp/mariam_v3/
          REMOTE

      - name: Pull
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v3/ /tmp/results/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v3_${{ inputs.grantee }}
          path: /tmp/results/
