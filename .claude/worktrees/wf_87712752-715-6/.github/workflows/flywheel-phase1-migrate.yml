name: Flywheel Phase 1 Migration (Issue #122)
on:
  workflow_dispatch: {}

jobs:
  migrate:
    name: "Flywheel P1 — customer tables + RLS"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pg

      - name: Run flywheel phase 1 migration
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node - <<'EOF'
          const { Client } = require("pg");
          const fs = require("fs");

          // Try multiple password sources — whichever works
          const passwords = [
            process.env.SUPABASE_KEY,
            process.env.SUPABASE_DB_PASSWORD,
            process.env.SUPABASE_SERVICE_KEY,
          ].filter(Boolean);

          const hosts = [
            "aws-0-us-west-2.pooler.supabase.com",
            "aws-0-us-east-1.pooler.supabase.com",
          ];
          const ports = [6543, 5432];
          const user = "postgres.mocerqjnksmhcjzxrewo";

          async function main() {
            let client, connected = false;

            outer:
            for (const pw of passwords) {
              for (const host of hosts) {
                for (const port of ports) {
                  client = new Client({
                    host, port, user,
                    password: pw,
                    database: "postgres",
                    ssl: { rejectUnauthorized: false },
                    connectionTimeoutMillis: 8000,
                  });
                  try {
                    await client.connect();
                    console.log(`Connected: ${host}:${port}`);
                    connected = true;
                    break outer;
                  } catch (err) {
                    const msg = err.message.substring(0, 60);
                    if (msg.includes("password") || msg.includes("auth")) {
                      console.log(`AUTH FAIL ${host}:${port}`);
                    } else {
                      console.log(`FAIL ${host}:${port} => ${msg}`);
                    }
                    try { await client.end(); } catch(e) {}
                  }
                }
              }
            }

            if (!connected) {
              console.error("All connections failed");
              process.exit(1);
            }

            const sql = fs.readFileSync("migrations/20260331_flywheel_phase1.sql", "utf8");
            // Split on semicolons, skip comments, handle $$ blocks
            const stmts = sql
              .replace(/--[^\n]*/g, "")
              .split(";")
              .map(s => s.trim())
              .filter(s => s.length > 5);

            console.log(`Running ${stmts.length} statements...`);
            let ok = 0, skip = 0, fail = 0;

            for (const stmt of stmts) {
              const label = stmt.substring(0, 80).replace(/\n/g, " ");
              try {
                await client.query(stmt);
                console.log(`  OK: ${label}`);
                ok++;
              } catch (err) {
                const msg = err.message;
                if (msg.includes("already exists") || msg.includes("duplicate")) {
                  console.log(`  SKIP (exists): ${label.substring(0, 60)}`);
                  skip++;
                } else {
                  console.log(`  FAIL: ${label}`);
                  console.log(`    => ${msg.substring(0, 120)}`);
                  fail++;
                }
              }
            }

            console.log(`\nResult: ${ok} ok, ${skip} skipped, ${fail} failed`);

            // Verify tables exist
            const r = await client.query(`
              SELECT table_name, table_type
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name IN ('customer_buyboxes','customer_behavior','customer_alerts','customer_accuracy')
              ORDER BY table_name
            `);
            console.log("\nVerification:");
            if (r.rows.length === 0) {
              console.log("  ❌ No flywheel tables found!");
            } else {
              for (const row of r.rows) {
                console.log(`  ✅ ${row.table_name} (${row.table_type})`);
              }
            }

            // RLS check
            const rls = await client.query(`
              SELECT relname, relrowsecurity
              FROM pg_class
              WHERE relname IN ('customer_buyboxes','customer_behavior','customer_alerts')
                AND relnamespace = (SELECT oid FROM pg_namespace WHERE nspname = 'public')
            `);
            console.log("\nRLS status:");
            for (const row of rls.rows) {
              const status = row.relrowsecurity ? "✅ ENABLED" : "❌ DISABLED";
              console.log(`  ${row.relname}: ${status}`);
            }

            await client.end();
            process.exit(fail > 0 ? 1 : 0);
          }

          main().catch(e => { console.error(e.message); process.exit(1); });
          EOF

      - name: Summary
        if: always()
        run: |
          echo "## Flywheel Phase 1 Migration — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Tables: customer_buyboxes, customer_behavior, customer_alerts" >> $GITHUB_STEP_SUMMARY
          echo "View: customer_accuracy" >> $GITHUB_STEP_SUMMARY
          echo "Issue: #122" >> $GITHUB_STEP_SUMMARY
