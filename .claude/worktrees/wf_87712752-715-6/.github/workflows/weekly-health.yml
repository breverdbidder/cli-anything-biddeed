name: Weekly Health Check + Telegram Alert
on:
  schedule:
    - cron: '0 14 * * 0'  # Sunday 9 AM EST
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install all packages
        run: |
          pip install pytest click prompt-toolkit httpx python-docx pdfplumber
          pip install -e shared/
          pip install -e zonewise/agent-harness/
          pip install -e auction/agent-harness/
          pip install -e swimintel/agent-harness/
      - name: Run full test suite
        id: tests
        run: |
          RESULT=$(python3 -m pytest shared/tests/ \
            zonewise/agent-harness/cli_anything/zonewise/tests/ \
            auction/agent-harness/cli_anything/auction/tests/ \
            swimintel/agent-harness/cli_anything/swimintel/tests/ \
            -q --tb=no 2>&1)
          echo "$RESULT"
          PASSED=$(echo "$RESULT" | grep -oP '\d+ passed' | grep -oP '\d+')
          FAILED=$(echo "$RESULT" | grep -oP '\d+ failed' | grep -oP '\d+' || echo "0")
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
      - name: Verify CLIs callable
        id: clis
        run: |
          Z=$(cli-anything-zonewise --json county list | python3 -c "import sys,json; print(json.load(sys.stdin)['count'])")
          A=$(cli-anything-auction --json analyze case --case 2024-CA-001234 | python3 -c "import sys,json; print(json.load(sys.stdin)['recommendation'])")
          S=$(cli-anything-swimintel --version | grep -oP 'v[\d.]+')
          echo "zonewise_counties=$Z" >> $GITHUB_OUTPUT
          echo "auction_rec=$A" >> $GITHUB_OUTPUT
          echo "swimintel_ver=$S" >> $GITHUB_OUTPUT
      - name: LangGraph pipeline test
        id: pipeline
        run: |
          python3 -c "
          from cli_anything_shared.langgraph import run_pipeline
          s = run_pipeline('sample')
          print(f'stage={s.stage.value}')
          print(f'cases={len(s.cases)}')
          print(f'analyses={len(s.analyses)}')
          " | tee /tmp/pipeline.txt
          STAGE=$(grep stage= /tmp/pipeline.txt | cut -d= -f2)
          echo "pipeline_stage=$STAGE" >> $GITHUB_OUTPUT
      - name: Check last commit age
        id: freshness
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "days_since_commit=$DAYS" >> $GITHUB_OUTPUT
          if [ $DAYS -gt 7 ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
          else
            echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Repo Forensics health check
        id: forensics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check latest repo-forensics run status across all repos
          REPOS="brevard-bidder-scraper cli-anything-biddeed biddeed-ai biddeed-ai-ui zonewise-web zonewise-scraper-v4 everest-nexus"
          CLEAN=0
          WARN=0
          CRITICAL=0
          NO_RUN=0
          REPORT=""

          for SHORT in $REPOS; do
            REPO="breverdbidder/$SHORT"
            # Get latest push-triggered forensics run
            RUN=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/actions/workflows/repo-forensics.yml/runs?per_page=1&event=push" 2>/dev/null)

            CONCLUSION=$(echo "$RUN" | python3 -c "
          import sys,json
          try:
              runs=json.load(sys.stdin).get('workflow_runs',[])
              if runs: print(runs[0].get('conclusion','unknown'))
              else: print('none')
          except: print('error')
          " 2>/dev/null)

            DAYS_AGO=$(echo "$RUN" | python3 -c "
          import sys,json
          from datetime import datetime, timezone
          try:
              runs=json.load(sys.stdin).get('workflow_runs',[])
              if runs:
                  dt=datetime.fromisoformat(runs[0]['updated_at'].replace('Z','+00:00'))
                  delta=(datetime.now(timezone.utc)-dt).days
                  print(delta)
              else: print(-1)
          except: print(-1)
          " 2>/dev/null)

            case "$CONCLUSION" in
              success) CLEAN=$((CLEAN+1)); ICON="✅" ;;
              failure) WARN=$((WARN+1)); ICON="⚠️" ;;
              none)    NO_RUN=$((NO_RUN+1)); ICON="❓" ;;
              *)       WARN=$((WARN+1)); ICON="🔸" ;;
            esac

            REPORT="${REPORT}${ICON} ${SHORT} (${DAYS_AGO}d ago)\n"
          done

          echo "clean=$CLEAN" >> $GITHUB_OUTPUT
          echo "warn=$WARN" >> $GITHUB_OUTPUT
          echo "no_run=$NO_RUN" >> $GITHUB_OUTPUT
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


      - name: Dream skill health check
        id: dream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS="brevard-bidder-scraper cli-anything-biddeed biddeed-ai zonewise-web everest-nexus"
          DREAM_OK=0
          DREAM_MISS=0
          DREAM_REPORT=""
          for SHORT in $REPOS; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/breverdbidder/${SHORT}/contents/.claude/skills/dream/SKILL.md?ref=main")
            if [ "$HTTP" = "200" ]; then
              DREAM_OK=$((DREAM_OK+1))
              DREAM_REPORT="${DREAM_REPORT}✅ ${SHORT}\n"
            else
              DREAM_MISS=$((DREAM_MISS+1))
              DREAM_REPORT="${DREAM_REPORT}❌ ${SHORT}\n"
            fi
          done
          echo "dream_ok=$DREAM_OK" >> $GITHUB_OUTPUT
          echo "dream_miss=$DREAM_MISS" >> $GITHUB_OUTPUT
          echo "dream_report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DREAM_REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Telegram report
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PASSED="${{ steps.tests.outputs.passed }}"
          FAILED="${{ steps.tests.outputs.failed }}"
          COUNTIES="${{ steps.clis.outputs.zonewise_counties }}"
          REC="${{ steps.clis.outputs.auction_rec }}"
          SWIM="${{ steps.clis.outputs.swimintel_ver }}"
          STAGE="${{ steps.pipeline.outputs.pipeline_stage }}"
          DAYS="${{ steps.freshness.outputs.days_since_commit }}"
          STALE="${{ steps.freshness.outputs.stale }}"
          F_CLEAN="${{ steps.forensics.outputs.clean }}"
          F_WARN="${{ steps.forensics.outputs.warn }}"
          F_REPORT="${{ steps.forensics.outputs.report }}"
          D_OK="${{ steps.dream.outputs.dream_ok }}"
          D_MISS="${{ steps.dream.outputs.dream_miss }}"
          D_REPORT="${{ steps.dream.outputs.dream_report }}"

          if [ "$FAILED" != "0" ] || [ "$STALE" = "true" ]; then
            ICON="🚨"
            STATUS="NEEDS ATTENTION"
          else
            ICON="✅"
            STATUS="HEALTHY"
          fi

          MSG="${ICON} CLI-Anything Weekly Health

          ${STATUS}
          Tests: ${PASSED} passed, ${FAILED} failed
          ZoneWise: ${COUNTIES} counties
          Auction: ${REC}
          SwimIntel: ${SWIM}
          Pipeline: ${STAGE}
          Last commit: ${DAYS} days ago

          🛡️ Repo Forensics (${F_CLEAN}/7 clean)
          ${F_REPORT}
          🧠 Dream Skill (${D_OK}/5 deployed)
          ${D_REPORT}"

          if [ "$STALE" = "true" ]; then
            MSG="${MSG}
          ⚠️ STALE: No commits in ${DAYS} days (>7 day limit)."
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML" || true

