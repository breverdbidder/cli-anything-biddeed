name: cc creds apply claude
on: { workflow_dispatch: {} }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: write creds to claude user and verify
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SVC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          # fetch fresh tokens from supabase RPC (get_claude_oauth returns {access,refresh})
          OAUTH=$(curl -s -X POST "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/rpc/get_claude_oauth" \
            -H "apikey: $SVC" -H "Authorization: Bearer $SVC" -H "Content-Type: application/json" -d '{}')
          ACCESS=$(printf '%s' "$OAUTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access',''))" 2>/dev/null)
          REFRESH=$(printf '%s' "$OAUTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('refresh',''))" 2>/dev/null)
          echo "got_access=$([ -n "$ACCESS" ] && echo yes || echo no)"
          EXPMS=$(( ($(date +%s) + 28800) * 1000 ))
          $SSH "bash -s -- '$ACCESS' '$REFRESH' '$EXPMS'" <<"REMOTE"
          ACCESS="$1"; REFRESH="$2"; EXPMS="$3"
          mkdir -p /home/claude/.claude
          cat > /home/claude/.claude/.credentials.json <<JSON
          {"claudeAiOauth":{"accessToken":"$ACCESS","refreshToken":"$REFRESH","expiresAt":$EXPMS,"scopes":["user:inference"],"isMax":true,"subscriptionType":"max_20x"}}
          JSON
          chown claude:claude /home/claude/.claude/.credentials.json
          chmod 600 /home/claude/.claude/.credentials.json
          echo "creds_written=$(test -s /home/claude/.claude/.credentials.json && echo yes || echo no)"
          echo "=== ping as claude ==="
          su - claude -c 'timeout 60 claude -p "Reply with exactly: PONG" --output-format text 2>&1' | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | tail -5
          echo END
          REMOTE
