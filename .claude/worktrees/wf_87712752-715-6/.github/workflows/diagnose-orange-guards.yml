name: "Diagnose Orange B metric (187%) — scope outcomes and manual_checks"
# B=187% blocks denominator_integrity. Need to:
# 1. Count foreclosure/tax_deed outcomes for orange
# 2. Find the auction_status distribution for orange MCA
# 3. Check manual_checks table for override mechanism
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: "Diagnose orange B metric anomaly"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error
          from collections import Counter

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              url = f"{SB}/rest/v1/{path}?{qs}"
              req = urllib.request.Request(url, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"  GET {path} error: {e}")
                  return []

          # 1. orange MCA auction_status breakdown
          print("=== orange MCA auction_status breakdown ===")
          rows = rest_get("multi_county_auctions", {
              "county": "eq.orange", "select": "auction_status", "limit": "2000"
          })
          status_counts = Counter(r.get("auction_status") for r in rows)
          print(f"Total rows: {len(rows)}")
          for status, cnt in sorted(status_counts.items(), key=lambda x: -x[1]):
              print(f"  {status!r}: {cnt}")

          # 2. foreclosure_outcomes for orange
          print("\n=== foreclosure_outcomes for orange case_numbers ===")
          # Get orange case_numbers
          mca_cases = {r.get("case_number") for r in rows if r.get("case_number")}
          print(f"  MCA case_numbers: {len(mca_cases)}")

          fo_rows = rest_get("foreclosure_outcomes", {
              "select": "case_number,data_source", "limit": "5000",
              "order": "case_number"
          })
          # Filter to orange
          orange_fo = [r for r in fo_rows if r.get("case_number") in mca_cases]
          print(f"  foreclosure_outcomes for orange cases: {len(orange_fo)}")
          fo_sources = Counter(r.get("data_source") for r in orange_fo)
          for src, cnt in sorted(fo_sources.items(), key=lambda x: -x[1]):
              print(f"    {src!r}: {cnt}")

          # 3. tax_deed_outcomes for orange
          print("\n=== tax_deed_outcomes for orange case_numbers ===")
          td_rows = rest_get("tax_deed_outcomes", {
              "select": "case_number,data_source", "limit": "5000"
          })
          orange_td = [r for r in td_rows if r.get("case_number") in mca_cases]
          print(f"  tax_deed_outcomes for orange cases: {len(orange_td)}")
          td_sources = Counter(r.get("data_source") for r in orange_td)
          for src, cnt in sorted(td_sources.items(), key=lambda x: -x[1]):
              print(f"    {src!r}: {cnt}")

          print(f"\n  total verified = {len(orange_fo)} + {len(orange_td)} = {len(orange_fo)+len(orange_td)}")

          # 4. gold_standard_manual_checks
          print("\n=== gold_standard_manual_checks ===")
          rows = rest_get("gold_standard_manual_checks", {"select": "*", "limit": "10"})
          for r in rows:
              print(json.dumps(r))
          if not rows:
              print("  (no rows or table 404)")

          # 5. gold_standard_critical_path for orange
          print("\n=== gold_standard_critical_path for orange ===")
          rows = rest_get("gold_standard_critical_path", {"county_slug": "eq.orange", "select": "*"})
          for r in rows:
              print(json.dumps(r))
          if not rows:
              print("  (no rows or table 404)")

          # 6. gold_standard_county_status for orange
          print("\n=== gold_standard_county_status for orange ===")
          rows = rest_get("gold_standard_county_status", {"county_slug": "eq.orange", "select": "*"})
          for r in rows:
              print(json.dumps(r))
          if not rows:
              print("  (no rows or table 404)")
          PYEOF
