name: Allegra at Cocoa — Citizenserve Permit Scrape

on:
  workflow_dispatch:
    inputs:
      parcel_number:
        description: 'Citizenserve parcel number'
        default: '2407094'
      address:
        description: 'Street address fallback'
        default: '4300 FL 524'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firecrawl-py requests httpx

      - name: Scrape Citizenserve + extract permits
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PARCEL_NUMBER: ${{ github.event.inputs.parcel_number }}
          ADDRESS: ${{ github.event.inputs.address }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, time, sys
          from pathlib import Path
          import urllib.request

          FIRECRAWL_KEY = os.environ['FIRECRAWL_API_KEY'].strip()
          SUPABASE_URL = os.environ.get('SUPABASE_URL', '').strip()
          SUPABASE_KEY = os.environ.get('SUPABASE_SERVICE_KEY', '').strip()
          PARCEL = os.environ.get('PARCEL_NUMBER', '2407094').strip()
          ADDRESS = os.environ.get('ADDRESS', '4300 FL 524').strip()

          BASE_URL = "https://www6.citizenserve.com/Portal/PortalController?Action=showSearchPage&ctzPagePrefix=Portal_&installationID=331"

          def fc_scrape(url, actions):
              payload = json.dumps({
                  "url": url,
                  "formats": ["html", "markdown"],
                  "actions": actions,
                  "waitFor": 18000,
                  "timeout": 120000,
                  "onlyMainContent": False,
                  "proxy": "stealth",
              }).encode()
              req = urllib.request.Request(
                  "https://api.firecrawl.dev/v1/scrape",
                  data=payload,
                  headers={
                      'Content-Type': 'application/json',
                      'Authorization': f'Bearer {FIRECRAWL_KEY}',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=130) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body = e.read()
                  print(f"FC HTTP {e.code}: {body[:500]}", flush=True)
                  return None

          print("=== ATTEMPT 1: Parcel Number search ===", flush=True)
          result1 = fc_scrape(BASE_URL, [
              {"type": "wait", "milliseconds": 4000},
              {"type": "select", "selector": "#filetype", "value": "Permit"},
              {"type": "wait", "milliseconds": 2000},
              {"type": "click", "selector": "#parcelNumberBar"},
              {"type": "fill", "selector": "#parcelNumber", "value": PARCEL},
              {"type": "wait", "milliseconds": 2000},
              {"type": "click", "selector": "button.btn.btn-default"},
              {"type": "wait", "milliseconds": 20000},
          ])

          if result1:
              html1 = result1.get('data', {}).get('html', '') or ''
              md1   = result1.get('data', {}).get('markdown', '') or ''
              print(f"Parcel result HTML size: {len(html1)}", flush=True)
              print(f"Parcel result MD size:   {len(md1)}", flush=True)

              permit_matches = re.findall(r'BP-\d{4,}-\d+|permit_ID=(\d+)', html1 + md1)
              print(f"Permit refs found (parcel): {permit_matches}", flush=True)

              with open('/tmp/citizenserve_parcel.html', 'w') as f:
                  f.write(html1)
              with open('/tmp/citizenserve_parcel.md', 'w') as f:
                  f.write(md1)
          else:
              print("Parcel search returned no data", flush=True)

          print("\n=== ATTEMPT 2: Address search ===", flush=True)
          time.sleep(3)
          result2 = fc_scrape(BASE_URL, [
              {"type": "wait", "milliseconds": 4000},
              {"type": "select", "selector": "#filetype", "value": "Permit"},
              {"type": "wait", "milliseconds": 2000},
              {"type": "fill", "selector": "#address", "value": ADDRESS},
              {"type": "wait", "milliseconds": 2000},
              {"type": "click", "selector": "button.btn.btn-default"},
              {"type": "wait", "milliseconds": 20000},
          ])

          if result2:
              html2 = result2.get('data', {}).get('html', '') or ''
              md2   = result2.get('data', {}).get('markdown', '') or ''
              print(f"Address result HTML size: {len(html2)}", flush=True)
              print(f"Address result MD size:   {len(md2)}", flush=True)

              permit_matches2 = re.findall(r'BP-\d{4,}-\d+|permit_ID=(\d+)', html2 + md2)
              print(f"Permit refs found (address): {permit_matches2}", flush=True)

              with open('/tmp/citizenserve_address.html', 'w') as f:
                  f.write(html2)
              with open('/tmp/citizenserve_address.md', 'w') as f:
                  f.write(md2)
          else:
              print("Address search returned no data", flush=True)

          # Parse and display results
          combined_html = (result1 or {}).get('data', {}).get('html', '') + (result2 or {}).get('data', {}).get('html', '')
          combined_md   = (result1 or {}).get('data', {}).get('markdown', '') + (result2 or {}).get('data', {}).get('markdown', '')

          print("\n=== PERMIT EXTRACTION ===", flush=True)

          # Find permit IDs from links
          permit_ids = list(set(re.findall(r'permit_ID=(\d+)', combined_html)))
          bp_numbers = list(set(re.findall(r'BP-\d[\d-]+', combined_html + combined_md)))
          doc_urls   = list(set(re.findall(r'Action=getFileOrAttachment[^"\'&\s]+', combined_html)))

          print(f"Permit IDs: {permit_ids}", flush=True)
          print(f"BP numbers: {bp_numbers}", flush=True)
          print(f"Doc URLs:   {doc_urls[:10]}", flush=True)

          # Show 500 chars of the markdown result for context
          snippet = (combined_md or combined_html)[:2000]
          print(f"\n--- Content snippet ---\n{snippet}\n---", flush=True)

          # Upsert to Supabase if we have results and creds
          if (permit_ids or bp_numbers) and SUPABASE_URL and SUPABASE_KEY:
              import urllib.parse
              records = []
              for pid in permit_ids:
                  records.append({
                      "parcel_number": PARCEL,
                      "permit_id_raw": pid,
                      "source": "citizenserve_331",
                      "address": "4300 SR 524, Cocoa FL",
                      "project_name": "Allegra at Cocoa",
                  })

              if records:
                  upsert_payload = json.dumps(records).encode()
                  upsert_req = urllib.request.Request(
                      f"{SUPABASE_URL}/rest/v1/cocoa_clerk_filings",
                      data=upsert_payload,
                      headers={
                          'Content-Type': 'application/json',
                          'apikey': SUPABASE_KEY,
                          'Authorization': f'Bearer {SUPABASE_KEY}',
                          'Prefer': 'resolution=merge-duplicates',
                      },
                      method='POST',
                  )
                  try:
                      with urllib.request.urlopen(upsert_req, timeout=30) as r:
                          print(f"Supabase upsert: {r.status}", flush=True)
                  except Exception as e:
                      print(f"Supabase upsert error: {e}", flush=True)
          else:
              print("No permit IDs found or missing Supabase creds — skipping upsert", flush=True)

          # Exit with error if nothing found at all
          if not permit_ids and not bp_numbers:
              print("\nWARNING: No permits extracted from either search attempt", flush=True)
              sys.exit(1)
          else:
              print(f"\nSUCCESS: Found {len(permit_ids)} permit IDs, {len(bp_numbers)} BP numbers", flush=True)
          PYEOF

      - name: Upload HTML results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citizenserve-results
          path: |
            /tmp/citizenserve_parcel.html
            /tmp/citizenserve_parcel.md
            /tmp/citizenserve_address.html
            /tmp/citizenserve_address.md
          retention-days: 7
          if-no-files-found: ignore
