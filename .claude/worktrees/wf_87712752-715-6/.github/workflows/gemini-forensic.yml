name: Gemini Forensic — what's on Hetzner (zero cost)
on:
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH forensic
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== A: existing gemini tooling on Hetzner ==="
          $SSH '
            echo "-- which binaries --"
            for bin in gemini gemini-cli google-generativeai aichat llm gpt opencode aider cliproxy; do
              which $bin 2>/dev/null && echo "  FOUND: $bin" || echo "  miss: $bin"
            done
            echo "-- node global list --"
            npm list -g --depth=0 2>/dev/null | grep -iE "gemini|google|anthropic|aider|opencode|llm" || echo "  no matching npm globals"
            echo "-- python packages --"
            pip list 2>/dev/null | grep -iE "gemini|google.genai|google.generativeai|anthropic|aider|litellm" || echo "  no matching pip packages"
          '

          echo
          echo "=== B: network reachability to Gemini API ==="
          $SSH "curl -sS -o /dev/null -w 'HTTP %{http_code}\n' https://generativelanguage.googleapis.com/v1beta/models 2>&1 | head -5"

          echo
          echo "=== C: test GEMINI_API_KEY against live API (1-token call) ==="
          KEY_LEN=${#GEMINI_API_KEY}
          echo "key length: $KEY_LEN chars"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY empty in repo secrets"
            exit 1
          fi

          # Test call direct from GHA runner (not Hetzner — key doesn't need to leave GHA)
          RESP=$(curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"reply with only the word OK"}]}]}' 2>&1)
          echo "RESPONSE_LENGTH: ${#RESP}"
          # Extract text without echoing key
          echo "$RESP" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
              if 'error' in d:
                  print(f\"ERROR: {d['error'].get('code','?')} {d['error'].get('message','?')}\")
              elif 'candidates' in d:
                  txt = d['candidates'][0]['content']['parts'][0]['text'].strip()
                  print(f'SUCCESS: text={txt!r}')
              else:
                  print('UNKNOWN RESPONSE SHAPE:', list(d.keys())[:5])
          except Exception as e:
              print(f'PARSE_ERR: {e}')
          "

          echo
          echo "=== D: model list — which Gemini models are accessible with this key ==="
          curl -sS "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" | \
            python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
              if 'error' in d:
                  print(f\"ERROR: {d['error'].get('message','?')}\")
              else:
                  models = d.get('models', [])
                  print(f'total models: {len(models)}')
                  # Filter to 2.x/1.5 latest gen + pro/flash tiers
                  for m in models:
                      name = m.get('name','?').replace('models/','')
                      if any(x in name for x in ['gemini-2.', 'gemini-1.5']):
                          methods = m.get('supportedGenerationMethods', [])
                          if 'generateContent' in methods:
                              print(f'  {name:45s} in={m.get(\"inputTokenLimit\",\"?\")} out={m.get(\"outputTokenLimit\",\"?\")}')
          except Exception as e:
              print(f'PARSE_ERR: {e}')
          "

          echo "=== END ==="
