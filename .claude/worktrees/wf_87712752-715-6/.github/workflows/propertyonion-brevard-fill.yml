name: "Track1 — PropertyOnion Brevard opening_bid fill"
# Dispatch: 895e6ae7-fdfd-4dde-a85f-b636b498f49f
# Mission: Fill opening_bid for 112 Brevard courthouse FC auctions via Firecrawl + PropertyOnion.
# Trigger: manual dispatch (or scheduled ahead of courthouse auctions).

on:
  workflow_dispatch:
    inputs:
      pass_b_cap:
        description: "Max individual lookups in Pass B (default 30 to control cost)"
        required: false
        default: "30"
  schedule:
    # Run Mon–Fri at 06:00 UTC (2AM ET) — ahead of courthouse 11AM auctions
    - cron: "0 6 * * 1-5"

concurrency:
  group: propertyonion-brevard-fill
  cancel-in-progress: false

jobs:
  fill:
    name: "Fill Brevard NULL opening_bids via PropertyOnion"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PropertyOnion fill script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PASS_B_CAP: ${{ github.event.inputs.pass_b_cap || '30' }}
        run: |
          python3 scripts/propertyonion_brevard_fill.py
        continue-on-error: true  # exit 2 (partial) is expected; don't fail the job

      - name: SQL verification (always)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          from datetime import date

          SB  = os.environ['SUPABASE_URL']
          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}"}

          def count_null(county):
              url = (f"{SB}/rest/v1/multi_county_auctions"
                     f"?county=eq.{county}&auction_date=gte.{date.today().isoformat()}"
                     f"&opening_bid=is.null&select=id&limit=500")
              req = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return len(json.load(r))

          brevard = count_null("brevard")
          duval   = count_null("duval")
          print(f"### SQL VERIFICATION — {date.today().isoformat()}")
          print(f"Brevard NULL opening_bids: {brevard}")
          print(f"Duval   NULL opening_bids: {duval}")
          gate2 = (brevard == 0)
          print(f"Gate 2 (Brevard COUNT=0): {'PASS' if gate2 else 'FAIL'}")
          PYEOF

      - name: Report summary
        if: always()
        run: |
          echo "=== Track1 PropertyOnion Fill Complete ==="
          echo "Dispatch: 895e6ae7-fdfd-4dde-a85f-b636b498f49f"
          echo "Check SQL verification step above for final counts."
