name: "Envelope Conquest — Parallel All Brevard"

on:
  workflow_dispatch:
    inputs:
      min_gap_pct:
        description: 'Minimum gap % to trigger processing (0-100). Default 10 = only process prefixes with >10% gap'
        required: false
        default: '10'
        type: string
      force_prefixes:
        description: 'Force specific prefixes (comma-separated, e.g. "20,22,30"). Empty = auto-discover gaps'
        required: false
        default: ''
        type: string
      timeout:
        description: 'Timeout per city in minutes'
        required: false
        default: '90'
        type: string
  schedule:
    # Nightly at 2 AM EST (7 AM UTC)
    - cron: '0 7 * * *'

env:
  GH_PAT: ${{ secrets.GH_PAT }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  # ─────────────────────────────────────────────
  # PHASE 1: Discover gaps in envelope_cache
  # ─────────────────────────────────────────────
  discover:
    name: "Scout: Discover Coverage Gaps"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gaps.outputs.matrix }}
      total_gap: ${{ steps.gaps.outputs.total_gap }}
      report: ${{ steps.gaps.outputs.report }}
    steps:
      - name: Query Supabase for gaps
        id: gaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          MIN_GAP_PCT: ${{ inputs.min_gap_pct || '10' }}
          FORCE_PREFIXES: ${{ inputs.force_prefixes || '' }}
        run: |
          cat > discover_gaps.py << 'PYTHON'
          import os, json, urllib.request

          sb_url = os.environ['SUPABASE_URL']
          sb_key = os.environ['SUPABASE_SERVICE_KEY']
          min_gap_pct = float(os.environ.get('MIN_GAP_PCT', '10'))
          force_prefixes = [p.strip() for p in os.environ.get('FORCE_PREFIXES', '').split(',') if p.strip()]
          base = f"{sb_url}/rest/v1"

          # BCPAO section prefix → municipality mapping
          PREFIX_MAP = {
              '20': {'muni': 'satellite_beach', 'city': 'SATELLITE BEACH'},
              '21': {'muni': 'titusville', 'city': 'TITUSVILLE'},
              '22': {'muni': 'cocoa', 'city': 'COCOA'},
              '23': {'muni': 'rockledge', 'city': 'ROCKLEDGE'},
              '24': {'muni': 'cocoa_beach', 'city': 'COCOA BEACH'},
              '25': {'muni': 'melbourne', 'city': 'MELBOURNE'},
              '26': {'muni': 'palm_bay', 'city': 'PALM BAY'},
              '27': {'muni': 'unincorporated_27', 'city': 'UNINCORPORATED'},
              '28': {'muni': 'unincorporated_28', 'city': 'UNINCORPORATED'},
              '29': {'muni': 'palm_bay_29', 'city': 'PALM BAY'},
              '30': {'muni': 'unincorporated_30', 'city': 'UNINCORPORATED'},
          }

          def count_rows(table, prefix):
              url = f'{base}/{table}?select=parcel_id&parcel_id=like.{prefix}*&limit=0'
              req = urllib.request.Request(url, headers={
                  'apikey': sb_key,
                  'Authorization': f'Bearer {sb_key}',
                  'Prefer': 'count=exact'
              })
              resp = urllib.request.urlopen(req)
              cr = resp.getheader('content-range')
              return int(cr.split('/')[-1]) if cr else 0

          targets = []
          report_lines = []
          total_gap = 0

          for prefix, info in sorted(PREFIX_MAP.items()):
              zones = count_rows('parcel_zones', prefix)
              cached = count_rows('envelope_cache', prefix)
              gap = zones - cached
              pct = (cached / zones * 100) if zones > 0 else 100
              gap_pct = 100 - pct
              total_gap += gap

              icon = '✅' if gap_pct < 5 else '🔴' if cached == 0 else '🟡'
              report_lines.append(f"{icon} {prefix} {info['muni']:25s} {zones:>7d} {cached:>7d} {gap:>7d} {pct:5.1f}%")

              # Decide if this prefix needs processing
              should_process = False
              if force_prefixes and prefix in force_prefixes:
                  should_process = True
              elif not force_prefixes and gap > 0 and gap_pct >= min_gap_pct:
                  should_process = True

              if should_process:
                  targets.append({
                      'prefix': prefix,
                      'municipality': info['muni'],
                      'city_filter': info['city'],
                      'zones': zones,
                      'cached': cached,
                      'gap': gap
                  })

          # Build matrix
          matrix = {"include": targets} if targets else {"include": []}

          # Write outputs
          import subprocess
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"total_gap={total_gap}\n")
              report = "\\n".join(report_lines)
              f.write(f"report={report}\n")

          print("=== BREVARD ENVELOPE COVERAGE ===")
          print(f"{'Prefix':6s} {'Municipality':25s} {'Zones':>7s} {'Cached':>7s} {'Gap':>7s} {'Cov%':>6s}")
          print("-" * 60)
          for line in report_lines:
              print(line)
          print(f"\nTotal gap: {total_gap:,d} parcels")
          print(f"Targets for this run: {len(targets)} prefixes")
          for t in targets:
              print(f"  → {t['prefix']} {t['municipality']} ({t['gap']:,d} gap)")
          PYTHON

          python3 discover_gaps.py

      - name: Notify discovery
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT: ${{ steps.gaps.outputs.report }}
          TOTAL_GAP: ${{ steps.gaps.outputs.total_gap }}
          MATRIX: ${{ steps.gaps.outputs.matrix }}
        run: |
          TARGETS=$(echo "$MATRIX" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('include',[])))")
          MSG="🏔️ Envelope Conquest — Discovery%0A%0AGap: ${TOTAL_GAP} parcels%0ATargets: ${TARGETS} prefixes%0A%0ADispatching parallel runners..."
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" > /dev/null 2>&1 || true

  # ─────────────────────────────────────────────
  # PHASE 2: Parallel envelope computation
  # ─────────────────────────────────────────────
  conquest:
    name: "Conquest: ${{ matrix.municipality }} (prefix ${{ matrix.prefix }})"
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' && needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3

      - name: Clone repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email "claude@biddeed.ai"
          git config --global user.name "Claude-Code"
          git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git" workspace
          cd workspace
          git config user.email "claude@biddeed.ai"
          git config user.name "Claude-Code"
          mkdir -p .claude
          cat > .claude/settings.json << 'S'
          {
            "permissions": {
              "allow": ["Bash(*)", "Write(*)", "Edit(*)", "Read(*)"],
              "deny": []
            }
          }
          S

      - name: "Run Envelope Squad: ${{ matrix.municipality }}"
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PREFIX: ${{ matrix.prefix }}
          MUNICIPALITY: ${{ matrix.municipality }}
          CITY_FILTER: ${{ matrix.city_filter }}
          ZONES_COUNT: ${{ matrix.zones }}
          CACHED_COUNT: ${{ matrix.cached }}
          GAP_COUNT: ${{ matrix.gap }}
          TIMEOUT_MIN: ${{ inputs.timeout || '90' }}
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
          cd workspace

          PROMPT="SUMMIT: Envelope Squad — ${MUNICIPALITY} (section prefix ${PREFIX})

          cd workspace/envelope/agent-harness

          Run the full Envelope Squad pipeline for ${MUNICIPALITY} ONLY:
          1. node agents/scout/zoning_scout.js --municipality \"${MUNICIPALITY}\" --output data/envelope-3d/zoning_${PREFIX}.jsonl
          2. node agents/surveyor/parcel_surveyor.js --municipality \"${MUNICIPALITY}\" --output data/envelope-3d/geometry_${PREFIX}.jsonl
          3. node agents/architect/envelope_compute.js --zoning data/envelope-3d/zoning_${PREFIX}.jsonl --geometry data/envelope-3d/geometry_${PREFIX}.jsonl --output data/envelope-3d/envelopes_${PREFIX}.jsonl
          4. node agents/inspector/qa_inspector.js --envelopes data/envelope-3d/envelopes_${PREFIX}.jsonl
          5. node agents/loader/supabase_loader.js --envelopes data/envelope-3d/envelopes_${PREFIX}.jsonl
          6. node agents/analyst/cma_analyst.js --envelopes data/envelope-3d/envelopes_${PREFIX}.jsonl

          CRITICAL CONTEXT:
          - Section prefix \"${PREFIX}\" = ${MUNICIPALITY}
          - BCPAO CITY filter: \"${CITY_FILTER}\"
          - parcel_zones has ${ZONES_COUNT} parcels for this prefix
          - envelope_cache currently has ${CACHED_COUNT} (gap: ${GAP_COUNT})
          - For the Scout: filter parcel_zones WHERE parcel_id LIKE '${PREFIX}%'
          - For the Surveyor: filter BCPAO by CITY = '${CITY_FILTER}' or situs city

          If a script doesn't support exact flags, READ the source and adapt.
          Known fixes from prior runs: table is parcel_zones (not parcel_zoning), BCPAO field mapping from Satellite Beach run.
          Flags may be: --zoning/--geometry (Architect), --envelopes (Inspector/Loader/Analyst).

          After pipeline: query SELECT COUNT(*) FROM envelope_cache WHERE parcel_id LIKE '${PREFIX}%' and report the result.

          DO NOT git push. Data goes to Supabase only. Skip any git operations at the end."

          timeout $((60 * TIMEOUT_MIN)) claude --print --dangerously-skip-permissions "$PROMPT" 2>&1 || EXIT=$?
          exit ${EXIT:-0}

      - name: "Report: ${{ matrix.municipality }}"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREFIX: ${{ matrix.prefix }}
          MUNICIPALITY: ${{ matrix.municipality }}
          JOB_STATUS: ${{ job.status }}
        run: |
          ICON="✅"
          [ "$JOB_STATUS" = "failure" ] && ICON="❌"
          MSG="${ICON} Envelope: ${MUNICIPALITY} (${PREFIX}) — ${JOB_STATUS}%0AJob: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" > /dev/null 2>&1 || true

  # ─────────────────────────────────────────────
  # PHASE 3: Final report
  # ─────────────────────────────────────────────
  report:
    name: "Final Coverage Report"
    needs: [discover, conquest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate final report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > final_report.py << 'PYTHON'
          import os, json, urllib.request

          sb_url = os.environ['SUPABASE_URL']
          sb_key = os.environ['SUPABASE_SERVICE_KEY']
          base = f"{sb_url}/rest/v1"

          PREFIX_MAP = {
              '20': 'satellite_beach', '21': 'titusville', '22': 'cocoa',
              '23': 'rockledge', '24': 'cocoa_beach', '25': 'melbourne',
              '26': 'palm_bay', '27': 'unincorporated_27', '28': 'unincorporated_28',
              '29': 'palm_bay_29', '30': 'unincorporated_30',
          }

          def count_rows(table, prefix):
              url = f'{base}/{table}?select=parcel_id&parcel_id=like.{prefix}*&limit=0'
              req = urllib.request.Request(url, headers={
                  'apikey': sb_key, 'Authorization': f'Bearer {sb_key}', 'Prefer': 'count=exact'
              })
              resp = urllib.request.urlopen(req)
              cr = resp.getheader('content-range')
              return int(cr.split('/')[-1]) if cr else 0

          lines = ["🏔️ ENVELOPE CONQUEST — FINAL REPORT\n"]
          total_zones = total_cached = 0
          for prefix, muni in sorted(PREFIX_MAP.items()):
              zones = count_rows('parcel_zones', prefix)
              cached = count_rows('envelope_cache', prefix)
              pct = (cached / zones * 100) if zones > 0 else 0
              total_zones += zones
              total_cached += cached
              icon = '✅' if pct >= 90 else '🟡' if pct > 0 else '🔴'
              lines.append(f"{icon} {prefix} {muni}: {cached:,d}/{zones:,d} ({pct:.0f}%)")

          pct = (total_cached / total_zones * 100) if total_zones > 0 else 0
          lines.append(f"\n📊 TOTAL: {total_cached:,d}/{total_zones:,d} ({pct:.1f}%)")

          report = "\n".join(lines)
          print(report)

          # Send to Telegram
          tg_token = os.environ.get('TELEGRAM_BOT_TOKEN')
          tg_chat = os.environ.get('TELEGRAM_CHAT_ID')
          if tg_token and tg_chat:
              msg = report.replace('\n', '%0A')
              url = f"https://api.telegram.org/bot{tg_token}/sendMessage"
              data = f"chat_id={tg_chat}&text={msg}".encode()
              try:
                  urllib.request.urlopen(urllib.request.Request(url, data=data))
              except: pass
          PYTHON

          python3 final_report.py

