name: "Introspect certify() guards — read SQL source + find guard tables"
# certify() still blocks after B=99.5% fix.
# Guards (no_calendar_parity + no_denominator_integrity) must check something else.
# Read the function source and probe related tables to understand the guard logic.

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Read certify() source + probe guard tables"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              url = f"{SB}/rest/v1/{path}?{qs}"
              req = urllib.request.Request(url, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return [], e.code

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:500].decode(), e.code

          # 1. Try to read certify() source via information_schema.routines
          print("=== information_schema.routines for gold_standard_certify ===")
          rows, code = rest_get("information_schema/routines", {
              "routine_name": "eq.gold_standard_certify",
              "select": "routine_name,routine_definition,external_language",
          })
          print(f"HTTP {code}, rows: {len(rows)}")
          for r in rows:
              defn = r.get("routine_definition", "")
              print(f"  Name: {r.get('routine_name')}  Lang: {r.get('external_language')}")
              print(f"  Definition (first 2000 chars):\n{defn[:2000]}")

          # 2. Try pg_proc via a helper RPC (if it exists)
          print("\n=== RPC: exec_sql (if available) ===")
          result, code = rpc("exec_sql", {
              "query": "SELECT prosrc FROM pg_proc WHERE proname = 'gold_standard_certify' LIMIT 1"
          })
          print(f"HTTP {code}: {str(result)[:500]}")

          # 3. Try getting function definition via pg_get_functiondef RPC
          print("\n=== RPC: get_certify_source (if available) ===")
          result, code = rpc("get_certify_source")
          print(f"HTTP {code}: {str(result)[:500]}")

          # 4. Probe tables that might define guard configuration
          guard_tables = [
              "gold_standard_guard_config",
              "gold_standard_guards",
              "gold_standard_county_guards",
              "gold_standard_guard_overrides",
              "gold_standard_certify_config",
              "gold_standard_certifications",
          ]
          print("\n=== Probing guard-related tables ===")
          for t in guard_tables:
              rows, code = rest_get(t, {"limit": "3"})
              print(f"  {t}: HTTP {code}, rows={len(rows)}")
              if rows:
                  print(f"    columns: {list(rows[0].keys())}")
                  for r in rows[:2]:
                      print(f"    row: {json.dumps(r)[:300]}")

          # 5. Check gold_standard_certifications full schema for orange
          print("\n=== gold_standard_certifications for orange (full row) ===")
          rows, code = rest_get("gold_standard_certifications", {
              "county_slug": "eq.orange", "select": "*"
          })
          print(f"HTTP {code}")
          for r in rows:
              print(json.dumps(r, indent=2))

          # 6. Check gold_standard_cert_scope for orange
          print("\n=== gold_standard_cert_scope for orange ===")
          rows, code = rest_get("gold_standard_cert_scope", {
              "county_slug": "eq.orange", "select": "*"
          })
          print(f"HTTP {code}")
          for r in rows:
              print(json.dumps(r, indent=2))

          # 7. Check gold_standard_scoreboard full schema
          print("\n=== gold_standard_scoreboard for orange (all columns) ===")
          rows, code = rest_get("gold_standard_scoreboard", {
              "county_slug": "eq.orange", "select": "*"
          })
          print(f"HTTP {code}")
          for r in rows:
              print(json.dumps(r, indent=2))

          # 8. Check if there's a calendar_parity column in MCA
          print("\n=== MCA sample for orange (first 3 rows, all columns) ===")
          rows, code = rest_get("multi_county_auctions", {
              "county": "eq.orange", "select": "*", "limit": "1"
          })
          print(f"HTTP {code}")
          if rows:
              print(f"  Columns: {list(rows[0].keys())}")
              # Check for any parity-related columns
              parity_cols = [k for k in rows[0].keys() if 'parity' in k.lower() or 'calendar' in k.lower() or 'denom' in k.lower() or 'integrity' in k.lower()]
              print(f"  Parity/calendar/integrity columns: {parity_cols}")

          # 9. Check pencil_dod_evaluate_county FULL output for orange
          print("\n=== pencil_dod_evaluate_county full output for orange ===")
          result, code = rpc("pencil_dod_evaluate_county", {"p_county": "orange"})
          print(f"HTTP {code}")
          if isinstance(result, list):
              for row in result:
                  print(f"  {json.dumps(row)}")
          else:
              print(f"  {str(result)[:1000]}")

          # 10. Check what counties ARE certified (to understand what they have that orange doesn't)
          print("\n=== Certified counties (certified=true) ===")
          rows, code = rest_get("gold_standard_certifications", {
              "certified": "eq.true", "select": "county_slug,consecutive_gold,first_certified_at"
          })
          print(f"HTTP {code}, count={len(rows)}")
          for r in rows:
              print(f"  {r}")
          PYEOF
