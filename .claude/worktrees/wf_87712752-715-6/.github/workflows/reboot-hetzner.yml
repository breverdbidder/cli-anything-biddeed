name: "Reboot Hetzner"
on:
  workflow_dispatch:
jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try Cloud API
        run: |
          echo "Checking Hetzner Cloud API..."
          RESP=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.HETZNER_PASSWORD }}" "https://api.hetzner.cloud/v1/servers")
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP"
          echo "$BODY" | python3 -m json.tool 2>/dev/null | head -30 || echo "$BODY" | head -20
      - name: Try SSH reboot
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Attempting SSH connection..."
          timeout 15 ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@${{ secrets.HETZNER_IP }} "uptime && echo SSH_OK" || echo "SSH_FAILED - server is down"
      - name: Try password SSH
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq sshpass 2>/dev/null
          echo "Trying password auth..."
          timeout 15 sshpass -p "${{ secrets.HETZNER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@${{ secrets.HETZNER_IP }} "uptime && echo PASSWORD_SSH_OK" || echo "PASSWORD_SSH_FAILED"
      - name: Summary
        run: echo "If all SSH failed, server needs manual reboot at robot.hetzner.com"
