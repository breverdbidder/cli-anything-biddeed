name: Robinhood Photos v4

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/rh_v4
          mkdir -p /tmp/rh_v4
          cd /tmp/rh_v4

          cat > scrape.py <<'PY'
          import asyncio, json, os, re, hashlib, csv
          from pathlib import Path
          import urllib.request

          OUT = Path('/tmp/rh_v4')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          async def search_clerk(page, party_name, role, date_from, date_to, label):
              try:
                  await page.goto(
                      "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                      wait_until="networkidle", timeout=60000,
                  )
                  await asyncio.sleep(2)
                  btn = page.locator("input[value='I accept the conditions above.']")
                  if await btn.count() > 0:
                      await btn.click()
                      await page.wait_for_load_state("networkidle")
                      await asyncio.sleep(3)
                  await page.wait_for_selector("input#SearchOnName", timeout=20000)
                  if role == "GRANTEE":
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                  await page.fill("input#SearchOnName", party_name)
                  await page.fill("input#RecordDateFrom", date_from)
                  await page.fill("input#RecordDateTo", date_to)
                  await page.click("input#btnSearch")
                  await asyncio.sleep(4)
                  try:
                      await page.wait_for_selector("text=Select Names:", timeout=10000)
                      done = page.locator("input[type='submit'][value='Done']")
                      cnt = await done.count()
                      for i in range(cnt):
                          if await done.nth(i).is_visible():
                              await done.nth(i).click()
                              break
                  except: pass
                  try:
                      await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=20000)
                      await asyncio.sleep(2)
                      async with page.expect_download(timeout=60000) as dl_info:
                          await page.click("a.csvButton#btnCsvButton")
                      download = await dl_info.value
                      csv_path = OUT / f"{label}.csv"
                      await download.save_as(str(csv_path))
                      return csv_path
                  except Exception as e:
                      print(f"    no csv export ({label}): {e}", flush=True)
                      return None
              except Exception as e:
                  print(f"  err: {e}", flush=True)
                  return None

          def parse_csv(p):
              if not p or not p.exists(): return []
              with open(p, 'r', encoding='utf-8-sig') as f:
                  return list(csv.DictReader(f))

          async def try_bcpao(page):
              urls = set()
              info = {}
              try:
                  # Direct property search URL
                  await page.goto(
                      "https://www.bcpao.us/PropertySearch/#/parcel?searchType=address",
                      wait_until="domcontentloaded", timeout=30000,
                  )
                  await asyncio.sleep(4)
                  # Try the address search input
                  try:
                      await page.fill("input[placeholder*='Address'], input[name*='address'], input#address", "4087 Robinhood")
                      await page.keyboard.press("Enter")
                      await asyncio.sleep(5)
                  except: pass
                  html = await page.content()
                  Path('/tmp/rh_v4/bcpao_search.html').write_text(html, errors='replace')
                  print(f"  BCPAO search: {len(html)} bytes", flush=True)

                  # Look for parcel ID in HTML
                  m = re.search(r'(\d{2}-\d{2}-\d{2}-\d{2}-[A-Z0-9*\-]+)', html)
                  if m:
                      info['parcel'] = m.group(1)
                      print(f"  Parcel: {m.group(1)}", flush=True)

                  # Try direct parcel page URL pattern
                  await page.goto(
                      "https://www.bcpao.us/PropertySearch/#/parcel/2832226DY*M*2",
                      wait_until="domcontentloaded", timeout=30000,
                  )
                  await asyncio.sleep(5)
                  html2 = await page.content()
                  Path('/tmp/rh_v4/bcpao_parcel.html').write_text(html2, errors='replace')

                  # Pull all image URLs
                  for pat in [
                      r'https://[a-z0-9.\-]*bcpao\.us/[^"\\\']+?\.(?:jpg|png|jpeg)',
                      r'src="(/[^"]+?\.(?:jpg|png|jpeg))"',
                  ]:
                      for u in re.findall(pat, html2):
                          if u.startswith('/'):
                              u = 'https://www.bcpao.us' + u
                          urls.add(u)

                  # Direct API query
                  try:
                      api_url = "https://www.bcpao.us/PropertySearch/api/parcel/2832226DY*M*2"
                      req = urllib.request.Request(api_url, headers={'User-Agent': UA, 'Accept':'application/json'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          api_data = r.read().decode('utf-8', errors='replace')
                      Path('/tmp/rh_v4/bcpao_api.json').write_text(api_data)
                      print(f"  BCPAO API: {len(api_data)} bytes", flush=True)
                      # Pull image URLs from JSON
                      for u in re.findall(r'"https://[^"]+?\.(?:jpg|png|jpeg)"', api_data):
                          urls.add(u.strip('"'))
                  except Exception as e:
                      print(f"  BCPAO API err: {e}", flush=True)

                  print(f"  BCPAO URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  BCPAO error: {e}", flush=True)
              return list(urls), info

          async def try_zillow_via_search(page, address):
              urls = set()
              try:
                  # Use Zillow's search URL pattern (might not be as bot-blocked)
                  search_url = f"https://www.zillow.com/homes/{address.replace(' ', '-')}_rb/"
                  await page.goto(search_url, wait_until="domcontentloaded", timeout=30000)
                  await asyncio.sleep(5)
                  html = await page.content()
                  Path('/tmp/rh_v4/zillow_search.html').write_text(html, errors='replace')
                  print(f"  Zillow: {len(html)} bytes", flush=True)
                  # Find ZPID
                  m = re.search(r'(\d{8,})_zpid', html)
                  if m:
                      zpid = m.group(1)
                      print(f"  ZPID: {zpid}", flush=True)
                      detail = f"https://www.zillow.com/homedetails/{zpid}_zpid/"
                      await page.goto(detail, wait_until="domcontentloaded", timeout=30000)
                      await asyncio.sleep(5)
                      html = await page.content()
                      Path('/tmp/rh_v4/zillow_detail.html').write_text(html, errors='replace')
                  for pat in [
                      r'https://photos\.zillowstatic\.com/[^"\\\']+?\.jpg',
                  ]:
                      for u in re.findall(pat, html):
                          urls.add(u)
                  print(f"  Zillow URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Zillow err: {e}", flush=True)
              return list(urls)

          async def try_homes_dot_com(page, address):
              urls = set()
              try:
                  # Homes.com search
                  await page.goto(
                      f"https://www.homes.com/search/?q={address.replace(' ','+')}",
                      wait_until="domcontentloaded", timeout=30000,
                  )
                  await asyncio.sleep(4)
                  html = await page.content()
                  Path('/tmp/rh_v4/homes_search.html').write_text(html, errors='replace')
                  print(f"  Homes.com search: {len(html)} bytes", flush=True)
                  # Find property link
                  m = re.search(r'(/property/4087-robinhood[^"\\\']+/)', html, re.I)
                  if m:
                      detail = f"https://www.homes.com{m.group(1)}"
                      await page.goto(detail, wait_until="domcontentloaded", timeout=30000)
                      await asyncio.sleep(5)
                      html = await page.content()
                      Path('/tmp/rh_v4/homes_detail.html').write_text(html, errors='replace')
                  for pat in [
                      r'https://images\.homes\.com/[^"\\\']+?\.(?:jpg|jpeg)',
                      r'https://[a-z0-9.\-]+homes\.com/listings/[^"\\\']+?\.(?:jpg|jpeg)',
                  ]:
                      for u in re.findall(pat, html):
                          urls.add(u)
                  print(f"  Homes.com URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Homes.com err: {e}", flush=True)
              return list(urls)

          async def main():
              from playwright.async_api import async_playwright
              all_urls = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                      accept_downloads=True,
                  )
                  page = await ctx.new_page()

                  # 1. Find McKenzie's resale
                  print("=== Step 1: MCKENZIE,RASHEDA outgoing 2015-2026 ===", flush=True)
                  csv1 = await search_clerk(
                      page, "MCKENZIE, RASHEDA", "GRANTOR",
                      "1/1/2015", "12/31/2026", "mckenzie_outgoing"
                  )
                  rows = parse_csv(csv1)
                  print(f"  Total: {len(rows)}", flush=True)
                  resale_buyer = None
                  resale_date = None
                  resale_inst = None
                  for r in rows:
                      legal = (r.get('DocLegalDescription','') + ' ' + r.get('Comments','')).upper()
                      if 'BLK M' in legal and 'SHERWOOD PARK SEC D' in legal:
                          print(f"  *** RESALE: {r.get('RecordDate')} {r.get('DocTypeDescription')} ${r.get('Consideration')} -> {r.get('CrossPartyName')}", flush=True)
                          print(f"      Legal: {r.get('DocLegalDescription','')[:120]}", flush=True)
                          print(f"      Inst: {r.get('InstrumentNumber')}", flush=True)
                          if r.get('DocTypeDescription','').upper() in ('DEED','WD','SWD','QCD','CT'):
                              resale_buyer = r.get('CrossPartyName','').strip()
                              resale_date = r.get('RecordDate','')
                              resale_inst = r.get('InstrumentNumber','')

                  # 2. If found resale, search that buyer too
                  current_buyer = resale_buyer
                  if resale_buyer:
                      print(f"\n=== Step 2: {resale_buyer} outgoing ===", flush=True)
                      csv2 = await search_clerk(
                          page, resale_buyer, "GRANTOR",
                          "1/1/2015", "12/31/2026", "resale_buyer_outgoing"
                      )
                      rows2 = parse_csv(csv2)
                      print(f"  Total: {len(rows2)}", flush=True)
                      for r in rows2:
                          legal = (r.get('DocLegalDescription','') + ' ' + r.get('Comments','')).upper()
                          if 'BLK M' in legal and 'SHERWOOD PARK SEC D' in legal:
                              print(f"  *** SECOND RESALE: {r.get('RecordDate')} -> {r.get('CrossPartyName')}", flush=True)
                              if r.get('DocTypeDescription','').upper() in ('DEED','WD','SWD','QCD','CT'):
                                  current_buyer = r.get('CrossPartyName','').strip()

                  # 3. BCPAO
                  print("\n=== Step 3: BCPAO ===", flush=True)
                  bcpao_urls, bcpao_info = await try_bcpao(page)
                  all_urls += bcpao_urls

                  # 4. Zillow
                  print("\n=== Step 4: Zillow ===", flush=True)
                  all_urls += await try_zillow_via_search(page, "4087 Robinhood Dr Melbourne FL 32935")

                  # 5. Homes.com
                  print("\n=== Step 5: Homes.com ===", flush=True)
                  all_urls += await try_homes_dot_com(page, "4087 Robinhood Dr Melbourne FL")

                  await browser.close()

              uniq = list(dict.fromkeys(all_urls))
              print(f"\n=== Total URLs: {len(uniq)} ===", flush=True)
              for u in uniq[:50]:
                  print(f"  {u[:160]}", flush=True)

              downloaded = []
              for i, url in enumerate(uniq[:30], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_{h}.jpg"
                      fpath = OUT / fname
                      req = urllib.request.Request(url, headers={'User-Agent': UA})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data = r.read()
                      if len(data) > 5000:
                          fpath.write_bytes(data)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                          print(f"  [{i}] {len(data)} -> {fname}", flush=True)
                  except Exception as e:
                      print(f"  [{i}] FAIL: {str(e)[:80]}", flush=True)

              with open(OUT / 'manifest.json', 'w') as f:
                  json.dump({
                      'mckenzie_resale_buyer': resale_buyer,
                      'mckenzie_resale_date': resale_date,
                      'mckenzie_resale_inst': resale_inst,
                      'current_buyer': current_buyer,
                      'urls': uniq,
                      'downloaded': downloaded,
                  }, f, indent=2)
              print(f"\n>>> Downloaded {len(downloaded)} photos", flush=True)

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          ls -la /tmp/rh_v4/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/rh_v4/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos_v4
          path: /tmp/results/
          retention-days: 90
