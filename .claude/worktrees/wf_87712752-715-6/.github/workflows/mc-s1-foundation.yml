name: MC S1 Foundation

on:
  repository_dispatch:
    types: [mc-s1]

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 80m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID
          script: |
            set -e
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN'
              export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID'
              cd /home/claude/repos/cli-anything-biddeed && git pull origin main
              claude -p 'MISSION: Mission Control S1 Foundation. Read docs/plans/MISSION-CONTROL-SPEC.md and docs/plans/MISSION-CONTROL-PLAN.md for full context.

S1.1 SUPABASE MIGRATION:
Create harnesses/watch/migrations/002_mission_control.sql with these tables:
- repo_status: id UUID PK, repo_name TEXT UNIQUE, tier TEXT CHECK (core/active/monitored), last_push_at TIMESTAMPTZ, last_push_by TEXT, last_ci_status TEXT CHECK (success/failure/pending/none), last_ci_url TEXT, last_ci_at TIMESTAMPTZ, open_prs INT DEFAULT 0, open_issues INT DEFAULT 0, default_branch TEXT DEFAULT main, stale_days INT DEFAULT 0, health_score INT DEFAULT 100, topics JSONB DEFAULT [], updated_at TIMESTAMPTZ DEFAULT NOW(). Indexes on tier, stale_days DESC.
- chat_sessions: id UUID PK, session_id TEXT UNIQUE, title TEXT, source TEXT CHECK (claude_ai/claude_code/telegram), started_at TIMESTAMPTZ DEFAULT NOW(), ended_at TIMESTAMPTZ, tasks_created INT DEFAULT 0, tasks_completed INT DEFAULT 0, key_decisions JSONB DEFAULT [], summary TEXT, chat_url TEXT. Indexes on source, started_at DESC.
- notifications_log: id UUID PK, task_id TEXT, repo_name TEXT, priority TEXT, notification_type TEXT CHECK (task_created/task_completed/task_blocked/escalation/accountability/digest/ci_failure/repo_stale/override), message TEXT NOT NULL, telegram_msg_id BIGINT, sent_at TIMESTAMPTZ DEFAULT NOW(), delivered BOOLEAN DEFAULT false. Indexes on notification_type, sent_at DESC.
- ALTER task_registry ADD COLUMNS: priority TEXT DEFAULT P2 CHECK (P0/P1/P2/P3), project TEXT, owner TEXT DEFAULT Claude Code, sla_deadline TIMESTAMPTZ, escalation_count INT DEFAULT 0, last_escalated_at TIMESTAMPTZ, source_chat_id TEXT, auto_priority BOOLEAN DEFAULT true.
Enable RLS on all new tables (anon SELECT, service_role ALL).
Run migration via Supabase REST API at https://mocerqjnksmhcjzxrewo.supabase.co.

S1.2 SEED REPOS:
Create harnesses/watch/mc/seed_repos.py. Fetch ALL repos from GitHub API for user breverdbidder (paginate, there are 50). Insert into repo_status with tiers: CORE=[cli-anything-biddeed, zonewise-web, biddeed-ai, biddeed-ai-ui, claude-code-telegram-control, life-os, cliproxy-gateway], ACTIVE=[zonewise, goviralbitch, superpowers, zonewise-landing, biddeed-landing, brevard-bidder-landing, zonewise-desktop], MONITORED=all others. Compute stale_days from pushed_at. Run it.

S1.3 GITHUB WEBHOOK EDGE FUNCTION:
Create supabase/functions/gh-webhook/index.ts. Handles push, pull_request, workflow_run, issues events. Updates repo_status accordingly. If CI failure on core tier repo, creates notification_log entry with type ci_failure.

S1.4 PG_CRON JOBS:
Create harnesses/watch/migrations/003_cron_jobs.sql with 5 cron jobs:
- mc_staleness_scan: every 5 min, update stale_days
- mc_p0_escalation: every 2 hours, find P0 tasks past SLA, send Telegram escalation
- mc_morning_digest: 14:00 UTC (9AM EST), build and send digest
- mc_evening_digest: 22:00 UTC (5PM EST), build and send digest
- mc_repo_sync: every 6 hours, fetch repos and update

S1.5 REPO SYNC WORKFLOW:
Create .github/workflows/mc-repo-sync.yml scheduled every 6 hours. Fetches all repos, upserts repo_status, detects new repos.

COMMIT: git config user.email ci@biddeed.ai, prefix MC:, push to main after each task. Telegram notify when S1 complete.' --dangerously-skip-permissions
            "
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=MC S1 Foundation: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
