name: "Summit: RentCast + DealCheck CI V6.5 Dossier"

on:
  workflow_dispatch:
    inputs:
      rentcast_v65_id:
        description: "ci_v65_dossiers UUID for RentCast"
        required: true
        default: "c2c2b95c-0cfc-4d0f-a96c-6f5b0126a668"
      dealcheck_v65_id:
        description: "ci_v65_dossiers UUID for DealCheck"
        required: true
        default: "d08d32b7-9159-4842-859b-d6bf87d47373"
      summit_id:
        description: "summit_chat_dispatch UUID"
        required: true
        default: "05f7873d-09b7-41ac-8724-99e0b4ec9983"

concurrency:
  group: rentcast-dealcheck-dossier-${{ github.event.inputs.summit_id }}
  cancel-in-progress: false

jobs:
  dossier:
    name: "Build dossier · ${{ matrix.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: rentcast
            dossier_id_var: rentcast_v65_id
          - target: dealcheck
            dossier_id_var: dealcheck_v65_id
    steps:
      - name: "Execute SUMMIT-E on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_REFRESH_TOKEN: ${{ secrets.CLAUDE_CODE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOSSIER_TARGET: ${{ matrix.target }}
          DOSSIER_ID: ${{ github.event.inputs[matrix.dossier_id_var] }}
          SUMMIT_ID: ${{ github.event.inputs.summit_id }}
        with:
          host: 87.99.129.125
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 350m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_CODE_OAUTH_TOKEN,CLAUDE_CODE_REFRESH_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,FIRECRAWL_API_KEY,DEEPSEEK_API_KEY,GEMINI_API_KEY,DOSSIER_TARGET,DOSSIER_ID,SUMMIT_ID
          script: |
            set -e
            echo "=== [1/5] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/5] Claude Code + Playwright ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            npm install -g playwright 2>&1 | tail -3
            su - claude -c "playwright install chromium" || true

            echo "=== [3/5] Auth (name-only secrets, no value echoes) ==="
            test -n "$CLAUDE_CODE_OAUTH_TOKEN"   || { echo "FATAL: CLAUDE_CODE_OAUTH_TOKEN empty";   exit 1; }
            test -n "$CLAUDE_CODE_REFRESH_TOKEN" || { echo "FATAL: CLAUDE_CODE_REFRESH_TOKEN empty"; exit 1; }
            mkdir -p /home/claude/.claude
            EXPIRES_MS=$(( $(date +%s) * 1000 + 28800000 ))
            printf '{"claudeAiOauth":{"accessToken":"%s","refreshToken":"%s","expiresAt":%s,"scopes":["user:inference","user:profile"],"subscriptionType":"max"}}\n' "$CLAUDE_CODE_OAUTH_TOKEN" "$CLAUDE_CODE_REFRESH_TOKEN" "$EXPIRES_MS" > /home/claude/.claude/credentials.json
            chown -R claude:claude /home/claude/.claude
            chmod 600 /home/claude/.claude/credentials.json
            test -s /home/claude/.claude/credentials.json || { echo "FATAL: credentials.json empty"; exit 1; }
            echo "credentials.json written ($(wc -c < /home/claude/.claude/credentials.json) bytes, expires in 8h)"

            echo "=== [4/5] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed

            echo "=== [5/5] Claude Code — SUMMIT-E ${DOSSIER_TARGET} ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$CLAUDE_CODE_OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'
              export FIRECRAWL_API_KEY='$FIRECRAWL_API_KEY'
              export DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY'
              export GEMINI_API_KEY='$GEMINI_API_KEY'
              export DOSSIER_TARGET='$DOSSIER_TARGET'
              export DOSSIER_ID='$DOSSIER_ID'
              export SUMMIT_ID='$SUMMIT_ID'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'MISSION: SUMMIT-E CI V6.5 dossier for \$DOSSIER_TARGET.

                STEP 0 — READ MISSION BRIEF
                cat docs/ci-v65/RENTCAST-DEALCHECK-MISSION-V1.md
                cat CLAUDE.md

                STEP 1-6 — Execute every phase in the brief.

                FINAL — Update SUMMIT-E only IF \$DOSSIER_TARGET == rentcast (last to finish):
                  PATCH summit_chat_dispatch id=\$SUMMIT_ID set state=closed, delivery_proof={...}
                Telegram final summary.'
            "

      - name: "Annotate SUMMIT on failure"
        if: failure()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS -X PATCH "${SUPABASE_URL}/rest/v1/summit_chat_dispatch?id=eq.${{ github.event.inputs.summit_id }}" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"last_error":"workflow run ${{ github.run_id }} job ${{ matrix.target }} failed"}'


  gate-rentcast:
    name: "Output Gate · rentcast"
    needs: dossier
    if: ${{ always() }}
    uses: ./.github/workflows/_ci-output-gate.yml
    with:
      dossier_slug: rentcast
      dossier_date: '2026-05-27'
      v65_dossier_id: c2c2b95c-0cfc-4d0f-a96c-6f5b0126a668
      summit_id: ${{ github.event.inputs.summit_id }}
      min_storage_files: 8
      gate_mode: warn
    secrets: inherit

  gate-dealcheck:
    name: "Output Gate · dealcheck"
    needs: dossier
    if: ${{ always() }}
    uses: ./.github/workflows/_ci-output-gate.yml
    with:
      dossier_slug: dealcheck
      dossier_date: '2026-05-27'
      v65_dossier_id: d08d32b7-9159-4842-859b-d6bf87d47373
      summit_id: ${{ github.event.inputs.summit_id }}
      min_storage_files: 8
      gate_mode: warn
    secrets: inherit
