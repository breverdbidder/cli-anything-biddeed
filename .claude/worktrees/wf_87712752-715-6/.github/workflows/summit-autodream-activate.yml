name: "Summit: AutoDream Activation"

on:
  workflow_dispatch: {}

jobs:
  activate-autodream:
    name: "Enable AutoDream on all 5 repos"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Activate AutoDream via Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 55m
          envs: CLAUDE_OAUTH_B64,GH_PAT
          script: |
            echo "=== [1/3] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null

            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            REPOS=(
              "brevard-bidder-scraper"
              "cli-anything-biddeed"
              "biddeed-ai"
              "zonewise-web"
              "zonewise-scraper-v4"
            )

            echo "=== [2/3] Clone/Pull Repos ==="
            mkdir -p /opt/biddeed
            for REPO in "${REPOS[@]}"; do
              if [ ! -d "/opt/biddeed/$REPO" ]; then
                cd /opt/biddeed
                git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/$REPO.git" 2>&1 | tail -1
              fi
              cd "/opt/biddeed/$REPO"
              git fetch origin main 2>/dev/null
              git checkout main 2>/dev/null
              git reset --hard origin/main 2>/dev/null
              chown -R claude:claude "/opt/biddeed/$REPO"
              echo "  Ready: $REPO"
            done

            echo "=== [3/3] Activate AutoDream ==="
            for REPO in "${REPOS[@]}"; do
              echo ""
              echo ">>> $REPO"
              su - claude -c "
                export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
                export NPM_CONFIG_PREFIX=/home/claude/.npm-global
                export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin

                cd /opt/biddeed/$REPO

                claude --print --auto-mode \
                  'Enable autodream. Go to /memory, turn autodream ON if not already on. Then run /dream to execute the first dream cycle. Report which memory files were created or updated. If autodream is not available as a feature yet, report that clearly.' \
                  2>&1 | tail -30
              "
              echo "--- Done: $REPO ---"
            done

            echo "=== ALL REPOS COMPLETE ==="
