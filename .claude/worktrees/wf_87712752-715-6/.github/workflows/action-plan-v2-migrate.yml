name: Action Plan V2 Migration
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run action-plan-v2 migration
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -uo pipefail
          export PGSSLMODE=require
          PROJECT_REF="mocerqjnksmhcjzxrewo"

          echo "=== ACTION-PLAN-V2 Migration: artifact_vault, task_carryforward, daily_digest ==="
          SUCCESS=0

          for CONN in \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_KEY}@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            "postgresql://postgres:${SUPABASE_KEY}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require" \
          ; do
            SAFE_CONN=$(echo "$CONN" | sed 's|:[^:@]*@|:***@|g')
            echo "Trying: $SAFE_CONN"
            if psql "$CONN" -c "SELECT 1" 2>&1; then
              echo "Connected! Running migration..."
              psql "$CONN" -f migrations/20260329_action_plan_v2.sql
              echo "=== Verifying tables ==="
              psql "$CONN" -c "
                SELECT 'artifact_vault' AS tbl, COUNT(*) FROM artifact_vault
                UNION ALL
                SELECT 'task_carryforward', COUNT(*) FROM task_carryforward
                UNION ALL
                SELECT 'daily_digest', COUNT(*) FROM daily_digest;
              "
              echo "=== Artifact vault seeded ==="
              psql "$CONN" -c "SELECT title, domain, status, importance FROM artifact_vault ORDER BY importance DESC;"
              echo "Migration complete. VERIFIED."
              SUCCESS=1
              break
            fi
          done

          if [ "$SUCCESS" = "0" ]; then
            echo "ERROR: All connection attempts failed."
            echo "BLOCKER: SUPABASE_DB_PASSWORD secret is stale."
            echo "Fix: Supabase Dashboard → Settings → Database → Reset password"
            echo "Then: gh secret set SUPABASE_DB_PASSWORD --body 'new_password' --repo breverdbidder/cli-anything-biddeed"
            exit 1
          fi
