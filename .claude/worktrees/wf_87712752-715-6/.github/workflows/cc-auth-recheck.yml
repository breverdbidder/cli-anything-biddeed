name: cc auth recheck
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: recheck
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          echo "claude_creds=$(test -f /home/claude/.claude/.credentials.json && echo yes || echo no)"
          echo "root_creds=$(test -f /root/.claude/.credentials.json && echo yes || echo no)"
          echo "ping=$(su - claude -c 'timeout 45 claude -p "say PONG" --output-format text 2>&1' | tr "\n" " " | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | tail -c 120)"
          echo END
          REMOTE
