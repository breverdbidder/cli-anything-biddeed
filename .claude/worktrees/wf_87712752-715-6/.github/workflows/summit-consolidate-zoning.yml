name: "Summit: Consolidate Zoning → Single Source of Truth"
on:
  workflow_dispatch: {}
env:
  PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  DB: "postgresql://postgres.mocerqjnksmhcjzxrewo:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require"
  TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client -qq

      - name: Find working connection
        id: conn
        run: |
          for CS in \
            "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres?sslmode=require" \
            "postgresql://postgres.mocerqjnksmhcjzxrewo:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"; do
            if psql "$CS" -c "SELECT 1;" > /dev/null 2>&1; then
              echo "cs=$CS" >> $GITHUB_OUTPUT
              echo "✅ Connected: ${CS:0:70}..."
              exit 0
            fi
          done
          echo "❌ All failed"
          exit 1

      - name: BEFORE count
        run: |
          psql "${{ steps.conn.outputs.cs }}" -c "
            SELECT COUNT(*) as total, COUNT(zone_code) as with_zone,
              ROUND(COUNT(zone_code)::numeric / COUNT(*) * 100, 1) as pct
            FROM sample_properties;" 2>&1 | tee /tmp/before.txt
          MSG=$(cat /tmp/before.txt)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=📊 BEFORE: ${MSG}" > /dev/null

      - name: Add columns
        run: |
          psql "${{ steps.conn.outputs.cs }}" -c "
            ALTER TABLE sample_properties
              ADD COLUMN IF NOT EXISTS zone_source TEXT,
              ADD COLUMN IF NOT EXISTS zone_confidence TEXT,
              ADD COLUMN IF NOT EXISTS zone_synced_at TIMESTAMPTZ;" 2>&1 | tee /tmp/alter.txt

      - name: Create ims_permits
        run: |
          psql "${{ steps.conn.outputs.cs }}" -c "
            CREATE TABLE IF NOT EXISTS ims_permits (
              id SERIAL PRIMARY KEY, record_number TEXT UNIQUE NOT NULL,
              permit_type TEXT, permit_subtype TEXT, milestone TEXT,
              address TEXT, city TEXT DEFAULT 'Palm Bay', county TEXT DEFAULT 'Brevard',
              applicant TEXT, description TEXT, scraped_at TIMESTAMPTZ DEFAULT now());
            CREATE INDEX IF NOT EXISTS idx_ims_address ON ims_permits(address);
            CREATE INDEX IF NOT EXISTS idx_ims_type ON ims_permits(permit_type);" 2>&1 | tee /tmp/ims.txt
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=🗃️ ims_permits: $(cat /tmp/ims.txt)" > /dev/null

      - name: Merge zone_codes
        run: |
          psql "${{ steps.conn.outputs.cs }}" <<'EOSQL' 2>&1 | tee /tmp/merge.txt
          WITH clean_za AS (
            SELECT DISTINCT ON (parcel_id)
              parcel_id,
              CASE
                WHEN zone_code LIKE '% - %' THEN TRIM(split_part(zone_code, ' - ', 1))
                WHEN zone_code LIKE '% (%' THEN TRIM(split_part(zone_code, ' (', 1))
                WHEN length(zone_code) > 20 THEN NULL
                ELSE TRIM(zone_code)
              END AS clean_zone,
              photo_url
            FROM zoning_assignments
            WHERE county = 'brevard' AND zone_code IS NOT NULL AND length(zone_code) <= 20
            ORDER BY parcel_id, zone_updated_at DESC NULLS LAST
          )
          UPDATE sample_properties sp SET
            zone_code = cza.clean_zone,
            zone_source = 'gis_conquest',
            zone_confidence = 'HIGH',
            zone_synced_at = NOW(),
            photo_url = COALESCE(sp.photo_url, cza.photo_url)
          FROM clean_za cza
          WHERE sp.parcel_id = cza.parcel_id AND cza.clean_zone IS NOT NULL;
          EOSQL
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=💾 Merge result: $(cat /tmp/merge.txt)" > /dev/null

      - name: AFTER count
        run: |
          psql "${{ steps.conn.outputs.cs }}" -c "
            SELECT COUNT(*) as total, COUNT(zone_code) as with_zone,
              ROUND(COUNT(zone_code)::numeric / COUNT(*) * 100, 1) as pct,
              COUNT(zone_source) as with_source
            FROM sample_properties;" 2>&1 | tee /tmp/after.txt
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=📊 AFTER: $(cat /tmp/after.txt)" > /dev/null

      - name: City breakdown
        run: |
          psql "${{ steps.conn.outputs.cs }}" -c "
            SELECT TRIM(city) as city, COUNT(*) as total,
              COUNT(zone_code) as zoned,
              ROUND(COUNT(zone_code)::numeric / COUNT(*) * 100, 1) as pct
            FROM sample_properties GROUP BY TRIM(city) ORDER BY total DESC LIMIT 20;" 2>&1 | tee /tmp/cities.txt
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=🏘️ BY CITY: $(cat /tmp/cities.txt)" > /dev/null
