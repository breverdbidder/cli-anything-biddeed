name: "Compare parity data — orange vs certified counties to find guard cause"
# certify() guards no_calendar_parity + no_denominator_integrity block orange.
# B fix (99.5%) didn't clear them → guards check something OTHER than B ratio.
# Compare orange MCA parity columns vs brevard/duval to find the difference.
# Also: check if there's a gold_standard_calendar or audit_scope table.

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: "Compare parity data and probe scope tables"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error
          from collections import Counter

          SB  = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          H   = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              req = urllib.request.Request(f"{SB}/rest/v1/{path}?{qs}", headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return [], e.code

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:500].decode(), e.code

          # 1. Orange MCA parity columns breakdown
          print("=== ORANGE MCA parity_source distribution ===")
          rows, _ = rest_get("multi_county_auctions", {
              "county": "eq.orange",
              "select": "parity_source,parity_scope,parity_status,auction_status",
              "limit": "1000",
          })
          parity_source = Counter(r.get("parity_source") for r in rows)
          parity_scope  = Counter(r.get("parity_scope") for r in rows)
          parity_status = Counter(r.get("parity_status") for r in rows)
          print(f"Total: {len(rows)}")
          print(f"parity_source: {dict(parity_source)}")
          print(f"parity_scope:  {dict(parity_scope)}")
          print(f"parity_status: {dict(parity_status)}")

          # Cross-tab: parity_source × auction_status
          print("\nparity_source × auction_status:")
          cross = Counter((r.get("parity_source"), r.get("auction_status")) for r in rows)
          for (src, status), cnt in sorted(cross.items(), key=lambda x: -x[1])[:15]:
              print(f"  {src!r} × {status!r}: {cnt}")

          # 2. Brevard MCA parity columns
          print("\n=== BREVARD MCA parity_source distribution ===")
          brev_rows, _ = rest_get("multi_county_auctions", {
              "county": "eq.brevard",
              "select": "parity_source,parity_scope,parity_status",
              "limit": "1000",
          })
          brev_src    = Counter(r.get("parity_source") for r in brev_rows)
          brev_scope  = Counter(r.get("parity_scope") for r in brev_rows)
          brev_status = Counter(r.get("parity_status") for r in brev_rows)
          print(f"Total: {len(brev_rows)}")
          print(f"parity_source: {dict(brev_src)}")
          print(f"parity_scope:  {dict(brev_scope)}")
          print(f"parity_status: {dict(brev_status)}")

          # 3. Duval MCA parity columns
          print("\n=== DUVAL MCA parity_source distribution ===")
          duval_rows, _ = rest_get("multi_county_auctions", {
              "county": "eq.duval",
              "select": "parity_source,parity_scope,parity_status",
              "limit": "1000",
          })
          duval_src    = Counter(r.get("parity_source") for r in duval_rows)
          duval_scope  = Counter(r.get("parity_scope") for r in duval_rows)
          duval_status = Counter(r.get("parity_status") for r in duval_rows)
          print(f"Total: {len(duval_rows)}")
          print(f"parity_source: {dict(duval_src)}")
          print(f"parity_scope:  {dict(duval_scope)}")
          print(f"parity_status: {dict(duval_status)}")

          # 4. Sample orange row with all parity fields (including parity_divergences)
          print("\n=== ORANGE — sample row parity fields ===")
          rows2, _ = rest_get("multi_county_auctions", {
              "county": "eq.orange",
              "select": "case_number,auction_status,parity_status,parity_source,parity_scope,parity_confidence,parity_checked_at,parity_divergences,tier1_authoritative,tier1_sale_status",
              "limit": "5",
          })
          for r in rows2:
              print(json.dumps(r))

          # 5. Sample brevard row
          print("\n=== BREVARD — sample row parity fields ===")
          rows3, _ = rest_get("multi_county_auctions", {
              "county": "eq.brevard",
              "select": "case_number,auction_status,parity_status,parity_source,parity_scope,parity_confidence,parity_checked_at,parity_divergences,tier1_authoritative,tier1_sale_status",
              "limit": "3",
          })
          for r in rows3:
              print(json.dumps(r))

          # 6. Probe tables related to calendar or scope
          probe_tables = [
              "gold_standard_audit_scope",
              "gold_standard_calendar",
              "gold_standard_parity_audit",
              "gold_standard_denominator_audit",
              "audit_scope",
              "calendar_parity",
          ]
          print("\n=== Probing calendar/scope tables ===")
          for t in probe_tables:
              rows, code = rest_get(t, {"limit": "3"})
              if code == 200:
                  print(f"  {t}: EXISTS, rows={len(rows)}")
                  if rows:
                      print(f"    columns: {list(rows[0].keys())}")
              else:
                  print(f"  {t}: {code}")

          # 7. Query gold_standard_certify() with explicit debug — call it again and watch output
          print("\n=== gold_standard_certify() current result ===")
          result, code = rpc("gold_standard_certify")
          print(f"HTTP {code}: {result}")

          # 8. Check gold_standard_autopilot or related
          print("\n=== gold_standard_autopilot (if exists) ===")
          result, code = rpc("gold_standard_autopilot")
          print(f"HTTP {code}: {str(result)[:300]}")

          # 9. Check if there's a gold_standard_denominator_check function
          print("\n=== Probing RPC functions ===")
          for fn_name in ["gold_standard_denominator_check", "gold_standard_calendar_check",
                          "gold_standard_guard_status", "certify_orange"]:
              result, code = rpc(fn_name)
              print(f"  {fn_name}: HTTP {code}: {str(result)[:200]}")
          PYEOF
