name: "Summit: Install Playwright MCP"
on:
  workflow_dispatch: {}
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Install Playwright MCP on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            echo "=== Installing Playwright MCP ==="
            export NPM_CONFIG_PREFIX=/home/claude/.npm-global
            export PATH="/home/claude/.npm-global/bin:$PATH"
            npm install -g @playwright/mcp@latest 2>&1 | tail -5
            npx playwright install chromium --with-deps 2>&1 | tail -10
            su - claude -c "claude mcp add --scope user playwright npx @playwright/mcp@latest" 2>&1 || true
            CLAUDE_JSON="/home/claude/.claude.json"
            python3 -c "
            import json,os
            p='$CLAUDE_JSON'
            d = json.load(open(p)) if os.path.exists(p) else {}
            if 'mcpServers' not in d: d['mcpServers'] = {}
            d['mcpServers']['playwright'] = {'type':'stdio','command':'npx','args':['-y','@playwright/mcp@latest']}
            json.dump(d, open(p,'w'), indent=2)
            print('Added Playwright MCP to .claude.json')
            "
            chown claude:claude "$CLAUDE_JSON"
            echo "=== Verify ==="
            npx playwright --version 2>&1
            cat "$CLAUDE_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'MCP servers: {list(d.get(\"mcpServers\",{}).keys())}')"
            echo "✅ Done"
      - name: "Notify"
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" -d "parse_mode=Markdown" \
            --data-urlencode "text=🎭 *Playwright MCP Install*: ${{ job.status }}" || true
