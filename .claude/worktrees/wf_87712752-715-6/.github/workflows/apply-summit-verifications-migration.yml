name: Apply summit_verifications migration (SUMMIT 277)
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Hetzner SSH
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== Apply summit_verifications migration ==="
          $SSH "cd /root/summit-395/cli-anything-biddeed && git pull && \
            psql \"\$(cat /root/.supabase_db_url 2>/dev/null || echo 'postgresql://postgres.mocerqjnksmhcjzxrewo:\$(cat /root/.supabase_db_password 2>/dev/null)@aws-0-us-west-2.pooler.supabase.com:5432/postgres')\" \
            -f supabase/migrations/20260408_summit_verifications.sql 2>&1" || true

          echo "=== Fallback: apply via supabase CLI ==="
          $SSH "cd /root/summit-395/cli-anything-biddeed && \
            export SUPABASE_ACCESS_TOKEN=\$(cat /root/.supabase_access_token 2>/dev/null || echo '') && \
            npx supabase db push --linked 2>&1 || true"

          echo "=== Verify table exists ==="
          $SSH "cd /root/summit-395/cli-anything-biddeed && \
            python3 -c \"
import httpx
SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vY2VycWpua3NtaGNqenhyZXdvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NDUzMjUyNiwiZXhwIjoyMDgwMTA4NTI2fQ.fL255mO0V8-rrU0Il3L41cIdQXUau-HRQXiamTqp9nE'
r = httpx.get('https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/summit_verifications?select=*&limit=0',
  headers={'apikey': SB_KEY, 'Authorization': f'Bearer {SB_KEY}'}, timeout=10)
print(f'Table check: HTTP {r.status_code}')
\" 2>&1"
