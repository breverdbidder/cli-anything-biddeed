name: Shard3 Hernando FC Scrape

on:
  workflow_dispatch:
    inputs:
      months_ahead:
        description: "Months ahead to scrape (default 2)"
        required: false
        default: "2"
      dry_run:
        description: "Dry run only (no insert)"
        required: false
        default: "false"
  schedule:
    # Daily at 6:00 AM UTC (2 AM ET) — clerk posts new PDFs weekly
    - cron: "0 6 * * *"

jobs:
  scrape:
    name: Hernando Foreclosure PDF Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pymupdf

      - name: Run hernando FC scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          MONTHS="${{ github.event.inputs.months_ahead }}"
          MONTHS="${MONTHS:-2}"
          python3 scripts/shard3_hernando_fc_scraper.py \
            --months-ahead "${MONTHS}" \
            ${DRY_RUN_FLAG}

      - name: Verify Criterion A passes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          supabase_url = os.environ.get("SUPABASE_URL", "https://mocerqjnksmhcjzxrewo.supabase.co")
          supabase_key = os.environ.get("SUPABASE_KEY", "")

          url = (
              f"{supabase_url}/rest/v1/multi_county_auctions"
              "?county=eq.hernando&sale_type=eq.foreclosure&auction_status=eq.upcoming"
              "&select=case_number"
          )
          req = urllib.request.Request(url, headers={
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
          })
          with urllib.request.urlopen(req) as resp:
              rows = json.loads(resp.read())

          fc_count = len(rows)
          print(f"Hernando upcoming foreclosure rows: {fc_count}")
          if fc_count == 0:
              print("FAIL: Criterion A still broken — no foreclosure rows")
              import sys; sys.exit(1)
          else:
              print(f"PASS: Criterion A satisfied ({fc_count} foreclosure rows)")
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### Hernando FC Scraper Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Source: hernandoclerk.com foreclosure sale PDFs" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: in-person (Hernando County Courthouse, Room 245)" >> $GITHUB_STEP_SUMMARY
          echo "- Schedule: Tuesday and Thursday 11:00 AM ET" >> $GITHUB_STEP_SUMMARY
          echo "- Criterion A target: hernando foreclosure>0 AND tax_deed>0" >> $GITHUB_STEP_SUMMARY
