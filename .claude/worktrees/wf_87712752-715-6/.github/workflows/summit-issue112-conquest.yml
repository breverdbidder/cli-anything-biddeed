name: "SUMMIT #112: Fix Envelope Conquest Gaps — 68% → 85%+"

on:
  workflow_dispatch: {}

jobs:
  # ── Step 1: 85% conquest for 7 under-covered jurisdictions ──────────────────
  conquest-85:
    name: "Conquest: 7 jurisdictions below 85%"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx shapely
      - name: "85% Conquest V2 (Cocoa Beach 9%, Titusville 39%, Cocoa 41%, etc.)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: python scripts/brevard_85_percent_v2.py

  # ── Step 2: CDP spatial join for unincorporated + Merritt Island ─────────────
  conquest-cdp:
    name: "Conquest: CDPs (Merritt Island, Barefoot Bay, Micco, unincorporated)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: conquest-85
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx shapely
      - name: "CDP Spatial Join (Merritt Island 19K, Barefoot Bay 4K, Micco 1K, Mims, Grant)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cdp_zoning_fix.py

  # ── Step 3: Populate quality metadata (zone_source + zone_confidence) ────────
  quality-metadata:
    name: "Quality: Backfill zone_source + zone_confidence"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: conquest-cdp
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: "Backfill zone_source and zone_confidence for all Brevard rows"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/quality_metadata_backfill.py

  # ── Step 4: Fill photo URLs (BCPAO pattern) ──────────────────────────────────
  photo-fill:
    name: "Photos: Fill bcpao.us photo URLs for all parcels"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality-metadata
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: "Fill photo_url field from BCPAO GIS TaxAcct → URL pattern"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/photo_url_fill.py

  # ── Step 5: Final NEVER-LIE audit report ────────────────────────────────────
  audit:
    name: "Audit: Final coverage report (NEVER-LIE)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: photo-fill
    if: always()
    steps:
      - name: "Query exact coverage counts from Supabase"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYTHON'
          import os, urllib.request, json

          sb_url = os.environ['SUPABASE_URL']
          sb_key = os.environ['SUPABASE_KEY']
          tg_bot = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          tg_chat = os.environ.get('TELEGRAM_CHAT_ID', '')

          def count(filter_str):
              url = f"{sb_url}/rest/v1/zoning_assignments?select=id&limit=0&{filter_str}"
              req = urllib.request.Request(url, headers={
                  'apikey': sb_key, 'Authorization': f'Bearer {sb_key}', 'Prefer': 'count=exact'
              })
              resp = urllib.request.urlopen(req)
              cr = resp.getheader('content-range', '')
              return int(cr.split('/')[-1]) if '/' in cr else 0

          # Key jurisdictions from issue #112
          targets = [
              ('cocoa_beach',        'Cocoa Beach (was 9%)'),
              ('titusville',         'Titusville (was 39%)'),
              ('cocoa',              'Cocoa (was 41%)'),
              ('merritt_island',     'Merritt Island (was missing)'),
              ('unincorporated_30',  'Unincorporated 30 (was missing)'),
              ('unincorporated_27',  'Unincorporated 27'),
              ('unincorporated_28',  'Unincorporated 28'),
              ('rockledge',          'Rockledge (was 58%)'),
              ('palm_bay_29',        'Palm Bay 29 (was 71%)'),
              ('melbourne',          'Melbourne (was 82%)'),
          ]

          lines = ['🏔️ SUMMIT #112 — FINAL COVERAGE AUDIT (VERIFIED FROM DB)\n']
          for jurisdiction, label in targets:
              n = count(f'county=eq.brevard&jurisdiction=eq.{jurisdiction}')
              lines.append(f"  {label}: {n:,} parcels")

          total = count('county=eq.brevard')
          zoned = count('county=eq.brevard&zone_code=not.is.null')
          with_source = count('county=eq.brevard&zone_source=not.is.null')
          with_photo = count('county=eq.brevard&photo_url=not.is.null')
          pct = (zoned / total * 100) if total > 0 else 0

          lines.append(f'\n📊 TOTAL BREVARD: {total:,} parcels')
          lines.append(f'📈 With zone_code: {zoned:,} ({pct:.1f}%)')
          lines.append(f'📋 With zone_source: {with_source:,}')
          lines.append(f'📷 With photo_url: {with_photo:,}')
          lines.append(f'\n{"✅ TARGET REACHED 85%+" if pct >= 85 else "⚠️ BELOW 85% TARGET"}')

          report = '\n'.join(lines)
          print(report)

          if tg_bot and tg_chat:
              msg = report.replace('\n', '%0A').replace(' ', '%20')
              url = f"https://api.telegram.org/bot{tg_bot}/sendMessage?chat_id={tg_chat}&text={msg}"
              try: urllib.request.urlopen(url)
              except: pass
          PYTHON
