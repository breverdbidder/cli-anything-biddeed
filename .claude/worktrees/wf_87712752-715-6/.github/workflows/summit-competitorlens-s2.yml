name: "Summit: CompetitorLens S2 — Analyze + Generate"
on:
  workflow_dispatch: {}

jobs:
  s2-analyze-generate:
    name: "S2: UX Analysis + JSX Generation + BrandGuard"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute S2 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,FIRECRAWL_API_KEY,DEEPSEEK_API_KEY
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed
            echo "Last 5 commits:"
            git log --oneline -5

            echo "=== [5/6] Claude Code — CompetitorLens S2 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'
              export FIRECRAWL_API_KEY='$FIRECRAWL_API_KEY'
              export DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'MISSION: CompetitorLens Agent #14 — Sprint 2 (Analyze + Generate).

              STEP 0 — READ CONTEXT
              cat docs/plans/COMPETITORLENS-SPEC.md
              cat CLAUDE.md
              ls -la harnesses/competitorlens/
              cat harnesses/competitorlens/SKILL.md 2>/dev/null || echo \"No SKILL.md yet\"

              PREREQUISITE: Sprint 1 should have created the harness with crawl.py and extract.py.
              Verify S1 artifacts exist before proceeding.

              SPRINT 2 TASKS (from spec Section 5):

              S2.1 — UX Pattern Analyzer (analyze.py)
              - Input: ComponentBlueprint JSON (from S1 extract.py)
              - Use Sonnet 4.5 via Claude API (free on Max plan)
              - Identify: navigation flow, filter/search mechanics, data display patterns
                (cards, tables, calendar grids), CTA placement + copy, mobile approach
              - Output: UXPatternReport JSON
              - Store extracted patterns in ux_pattern_library Supabase table

              S2.2 — JSX Generator (generate.py)
              - Input: UXPatternReport + house brand rules
              - Use Sonnet 4.5 to generate BidDeed.AI branded .jsx component
              - HOUSE BRAND (MANDATORY):
                Navy: #1E3A5F (primary)
                Orange: #F59E0B (accent/CTA)
                Font: Inter
                Background: #020617 (slate-950)
                Tailwind utility classes only
              - Include Supabase data hooks (useEffect + fetch from auctions view)
              - Output: .jsx file in components/competitor-lens/

              S2.3 — Data Binding Layer
              - Create Supabase hooks for auction data
              - Use auctions_free or auctions_pro views (already exist)
              - Calendar component: fetch auctions by date range
              - Search component: fetch with filters (county, type, price range)

              S2.4 — BrandGuard Integration (validate.py)
              - Check generated JSX against brand rules programmatically:
                - All color values match house brand palette
                - Font family is Inter
                - Background uses slate-950 or approved shades
                - No off-brand colors (especially no purple gradients)
              - Return PASS/BLOCK with violation list
              - Store result in competitor_analyses.brand_guard_status

              S2.5 — First Real Output: PropertyOnion Calendar
              - Run full pipeline against PropertyOnion calendar URL
              - Crawl -> Extract -> Analyze -> Generate -> Validate
              - Output: harnesses/competitorlens/output/AuctionCalendar.jsx
              - Must pass BrandGuard on first attempt (target >90%)

              S2.6 — Tests
              - Add 10+ assertions to eval/eval.json
              - Test: pattern detection accuracy, brand compliance, JSX renders without errors
              - Run tests and report results

              RULES:
              1. Commit after EACH task — messages: feat(competitorlens): S2.{N} - {description}
              2. git config user.email ci@biddeed.ai and user.name BidDeed-CI
              3. Git remote: https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              4. Push to main after each commit
              5. NEVER claim complete if BrandGuard validation fails
              6. If PropertyOnion blocks Firecrawl, use cached HTML from S1 or a static snapshot
              7. If context hits 50%, commit + push what you have, send partial Telegram
              8. COST DISCIPLINE: \$10 session max
              9. Send Telegram on completion:
                 curl -s -X POST \"https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage\" \
                   -d chat_id=\"\${TELEGRAM_CHAT_ID}\" \
                   -d text=\"CompetitorLens S2 DONE: UX analyzer + JSX generator + BrandGuard. AuctionCalendar.jsx generated. BrandGuard status: [PASS/BLOCK]. Commits pushed.\"

              GO. Execute S2.1 through S2.6.'
            "

            echo "=== [6/6] Done ==="
