name: "Read certify() source via management API + compare orange vs certified"
# Try management API with SUPABASE_ACCESS_TOKEN (sbp_) to read certify() source.
# Also compare orange vs brevard on every MCA field to find the guard condition.

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: "Try management API + compare orange vs brevard"
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error
          from collections import Counter

          SB   = os.environ["SUPABASE_URL"].rstrip("/")
          KEY  = os.environ["SUPABASE_KEY"]
          PAT  = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          H    = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}
          H_PAT = {"Authorization": f"Bearer {PAT}", "Content-Type": "application/json"}

          def rest_get(path, params=None):
              qs = urllib.parse.urlencode(params or {})
              req = urllib.request.Request(f"{SB}/rest/v1/{path}?{qs}", headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return [], e.code

          def rpc(fn, body=None):
              req = urllib.request.Request(
                  f"{SB}/rest/v1/rpc/{fn}",
                  data=json.dumps(body or {}).encode(),
                  headers=H, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"null"), r.status
              except urllib.error.HTTPError as e:
                  return e.read()[:500].decode(), e.code

          # 1. Try management API with PAT (sbp_ token)
          print("=== Management API — get certify() source ===")
          mgmt_url = "https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query"
          query = {"query": "SELECT pg_get_functiondef(oid) AS src FROM pg_proc WHERE proname = 'gold_standard_certify' LIMIT 1"}
          req_mgmt = urllib.request.Request(
              mgmt_url,
              data=json.dumps(query).encode(),
              headers=H_PAT, method="POST",
          )
          try:
              with urllib.request.urlopen(req_mgmt, timeout=30) as r:
                  result = json.loads(r.read())
                  print(f"HTTP {r.status}: {result}")
          except urllib.error.HTTPError as e:
              body = e.read()
              print(f"HTTP {e.code}: {body[:500]}")

          # 2. Compare orange vs brevard on key fields
          print("\n=== ORANGE MCA sample — all fields ===")
          rows_orange, _ = rest_get("multi_county_auctions", {
              "county": "eq.orange", "select": "*", "limit": "1"
          })
          if rows_orange:
              o = rows_orange[0]
              # Show fields that might be NULL/missing
              null_fields = {k: v for k, v in o.items() if v is None}
              non_null = {k: v for k, v in o.items() if v is not None}
              print(f"  NULL fields: {sorted(null_fields.keys())}")
              print(f"  Key values:")
              for k in ['source_url', 'source_platform', 'scrape_timestamp', 'scraped_at',
                        'auction_venue', 'auction_url', 'realforeclose_url', 'is_operational',
                        'parity_status', 'parity_source', 'parity_scope', 'parity_confidence',
                        'data_source', 'provenance', 'import_batch',
                        'tier1_authoritative', 'tier1_sale_status', 'case_number',
                        'po_market_value', 'content_hash']:
                  print(f"    {k}: {o.get(k)}")

          print("\n=== BREVARD MCA sample — same fields ===")
          rows_brevard, _ = rest_get("multi_county_auctions", {
              "county": "eq.brevard", "select": "*", "limit": "1"
          })
          if rows_brevard:
              b = rows_brevard[0]
              for k in ['source_url', 'source_platform', 'scrape_timestamp', 'scraped_at',
                        'auction_venue', 'auction_url', 'realforeclose_url', 'is_operational',
                        'parity_status', 'parity_source', 'parity_scope', 'parity_confidence',
                        'data_source', 'provenance', 'import_batch',
                        'tier1_authoritative', 'tier1_sale_status', 'case_number',
                        'po_market_value', 'content_hash']:
                  print(f"    {k}: {b.get(k)}")

          # 3. Check gold_standard_cert_scope for ALL counties (to see if certified counties have it)
          print("\n=== gold_standard_cert_scope all rows ===")
          rows, _ = rest_get("gold_standard_cert_scope", {"select": "county_slug,active,snapshot_at,rationale"})
          for r in rows:
              print(f"  {r['county_slug']}: active={r['active']}, snapshot_at={r['snapshot_at']}")

          # 4. Check orange data_source distribution
          print("\n=== ORANGE data_source distribution ===")
          rows, _ = rest_get("multi_county_auctions", {
              "county": "eq.orange", "select": "data_source,is_operational,source_platform", "limit": "1000"
          })
          ds = Counter(r.get("data_source") for r in rows)
          op = Counter(r.get("is_operational") for r in rows)
          sp = Counter(r.get("source_platform") for r in rows)
          print(f"  data_source: {dict(ds)}")
          print(f"  is_operational: {dict(op)}")
          print(f"  source_platform: {dict(sp)}")

          # 5. Check brevard data_source
          print("\n=== BREVARD data_source distribution ===")
          rows, _ = rest_get("multi_county_auctions", {
              "county": "eq.brevard", "select": "data_source,is_operational,source_platform", "limit": "1000"
          })
          ds = Counter(r.get("data_source") for r in rows)
          op = Counter(r.get("is_operational") for r in rows)
          sp = Counter(r.get("source_platform") for r in rows)
          print(f"  data_source: {dict(ds)}")
          print(f"  is_operational: {dict(op)}")
          print(f"  source_platform: {dict(sp)}")

          # 6. certify() with detailed guard output
          print("\n=== gold_standard_certify() ===")
          result, code = rpc("gold_standard_certify")
          print(f"HTTP {code}: {result}")
          PYEOF
