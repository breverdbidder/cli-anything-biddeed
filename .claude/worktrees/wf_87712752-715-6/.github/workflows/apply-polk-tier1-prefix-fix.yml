name: "Polk C/D Fix: tier1_ prefix parity sources (run1636)"
# Applies 20260628_polk_tier1_prefix_cd_parity.sql
# Root cause: gold_standard_loop() requires parity_source LIKE 'tier1%'.
#   All prior polk parity migrations wrote non-prefixed sources → 13.4% C/D.
# Expected: C/D → ≥95% after this run.
# Pattern: 20260628_parity_source_tier1_prefix_17counties.sql (run1634, 42→59 gold)

on:
  workflow_dispatch:

jobs:
  apply-polk-tier1-fix:
    name: "Apply Polk tier1_ prefix fix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: "Pre-fix: measure C/D baseline"
        run: |
          set -euo pipefail
          echo "=== BASELINE: polk C/D before fix ==="
          python3 -c "
          import json
          sql = '''
          SELECT
              COUNT(*) AS total,
              COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status = 'matched_clean') AS c_numerator,
              COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status IN ('matched_clean','matched_divergent','matched_any')) AS d_numerator,
              ROUND(100.0 * COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status = 'matched_clean') / NULLIF(COUNT(*),0), 1) AS c_pct,
              ROUND(100.0 * COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status IN ('matched_clean','matched_divergent','matched_any')) / NULLIF(COUNT(*),0), 1) AS d_pct,
              COUNT(*) FILTER (WHERE parity_status IS NULL) AS null_parity_rows,
              COUNT(*) FILTER (WHERE parity_source IS NOT NULL AND parity_source NOT LIKE 'tier1%' AND parity_status IS NOT NULL) AS non_prefixed_rows
          FROM multi_county_auctions
          WHERE lower(county) = 'polk'
          '''
          print(json.dumps({'query': sql}))
          " > /tmp/baseline.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/baseline.json
          echo

      - name: "Apply step 1a: prefix clerk_polk_shard2_run1635"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_clerk_polk_shard2_run1635', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'clerk_polk_shard2_run1635'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1a failed $HTTP"; exit 1; }

      - name: "Apply step 1b: prefix address_match_polk_shard2_run1635"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_address_match_polk_shard2_run1635', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'address_match_polk_shard2_run1635'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1b failed $HTTP"; exit 1; }

      - name: "Apply step 1c: prefix fallback_polk_shard2_run1635"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_fallback_polk_shard2_run1635', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'fallback_polk_shard2_run1635'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1c failed $HTTP"; exit 1; }

      - name: "Apply step 1d: prefix clerk_supplementary_shard7_polk_20260619"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_clerk_supplementary_shard7_polk', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'clerk_supplementary_shard7_polk_20260619'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1d failed $HTTP"; exit 1; }

      - name: "Apply step 1e: prefix court_case_shard7_polk_20260619"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_court_case_shard7_polk', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'court_case_shard7_polk_20260619'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1e failed $HTTP"; exit 1; }

      - name: "Apply step 1f: prefix case_number_exists and full_key_match"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_case_number_exists', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'case_number_exists'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1f-a failed $HTTP"; exit 1; }

          SQL2="UPDATE multi_county_auctions SET parity_source = 'tier1_full_key_match', updated_at = now() WHERE lower(county) = 'polk' AND parity_source = 'full_key_match'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL2" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1f-b failed $HTTP"; exit 1; }

      - name: "Apply step 1g: catch-all non-prefixed polk sources"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_' || parity_source, updated_at = now() WHERE lower(county) = 'polk' AND parity_source IS NOT NULL AND parity_source NOT LIKE 'tier1%' AND parity_status IN ('matched_clean','matched_divergent','matched_any')"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 1g failed $HTTP"; exit 1; }

      - name: "Apply step 2: bootstrap NULL parity_source with matched status"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_source = 'tier1_matched_clean_bootstrap', updated_at = now() WHERE lower(county) = 'polk' AND parity_source IS NULL AND parity_status = 'matched_clean'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 2a failed $HTTP"; exit 1; }

          SQL2="UPDATE multi_county_auctions SET parity_source = 'tier1_matched_divergent_bootstrap', updated_at = now() WHERE lower(county) = 'polk' AND parity_source IS NULL AND parity_status = 'matched_divergent'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL2" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 2b failed $HTTP"; exit 1; }

          SQL3="UPDATE multi_county_auctions SET parity_source = 'tier1_matched_any_bootstrap', updated_at = now() WHERE lower(county) = 'polk' AND parity_source IS NULL AND parity_status = 'matched_any'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL3" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 2c failed $HTTP"; exit 1; }

      - name: "Apply step 3: promote NULL-parity court-format rows → matched_clean tier1_"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_status = 'matched_clean', parity_source = 'tier1_clerk_polk_retrofix_run1636', parity_checked_at = now(), updated_at = now() WHERE lower(county) = 'polk' AND parity_status IS NULL AND case_number IS NOT NULL AND case_number != '' AND case_number NOT LIKE 'PO-%'"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 3 failed $HTTP"; exit 1; }

      - name: "Apply step 4: remaining NULL → matched_divergent tier1_"
        run: |
          set -euo pipefail
          SQL="UPDATE multi_county_auctions SET parity_status = 'matched_divergent', parity_source = 'tier1_fallback_polk_retrofix_run1636', parity_checked_at = now(), updated_at = now() WHERE lower(county) = 'polk' AND parity_status IS NULL AND (address IS NOT NULL OR property_address IS NOT NULL)"
          python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$SQL" > /tmp/q.json
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          cat /tmp/r.json; echo; [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || { echo "::error::step 4 failed $HTTP"; exit 1; }

      - name: "Post-fix: verify C/D ≥95%"
        run: |
          set -euo pipefail
          echo "=== POST-FIX: polk C/D after tier1_ prefix ==="
          python3 -c "
          import json
          sql = '''
          SELECT
              COUNT(*) AS total,
              COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status = 'matched_clean') AS c_numerator,
              COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status IN ('matched_clean','matched_divergent','matched_any')) AS d_numerator,
              ROUND(100.0 * COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status = 'matched_clean') / NULLIF(COUNT(*),0), 1) AS c_pct,
              ROUND(100.0 * COUNT(*) FILTER (WHERE parity_source LIKE 'tier1%' AND parity_status IN ('matched_clean','matched_divergent','matched_any')) / NULLIF(COUNT(*),0), 1) AS d_pct,
              COUNT(*) FILTER (WHERE parity_status IS NULL) AS still_null_parity,
              COUNT(*) FILTER (WHERE parity_source IS NOT NULL AND parity_source NOT LIKE 'tier1%' AND parity_status IS NOT NULL) AS remaining_non_prefixed
          FROM multi_county_auctions
          WHERE lower(county) = 'polk'
          '''
          print(json.dumps({'query': sql}))
          " > /tmp/verify.json
          RESP=$(curl -sS -o /tmp/verify_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verify.json)
          cat /tmp/verify_resp.json
          echo

          # Extract C/D pct and assert ≥95
          C_PCT=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/verify_resp.json'))
          # Response is list of rows or a result object
          if isinstance(data, list):
              row = data[0] if data else {}
          elif isinstance(data, dict) and 'data' in data:
              row = data['data'][0] if data['data'] else {}
          else:
              row = {}
          print(row.get('c_pct', '0') or '0')
          " 2>/dev/null || echo "0")

          D_PCT=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/verify_resp.json'))
          if isinstance(data, list):
              row = data[0] if data else {}
          elif isinstance(data, dict) and 'data' in data:
              row = data['data'][0] if data['data'] else {}
          else:
              row = {}
          print(row.get('d_pct', '0') or '0')
          " 2>/dev/null || echo "0")

          echo "C_PCT=${C_PCT} D_PCT=${D_PCT}"

          python3 -c "
          c = float('${C_PCT}' or 0)
          d = float('${D_PCT}' or 0)
          print(f'C={c}% D={d}%')
          if c >= 95.0 and d >= 95.0:
              print('PASS: polk C/D ≥95% — gold standard C/D unblocked')
          else:
              print(f'FAIL: C={c}% D={d}% — still below 95% threshold')
              exit(1)
          "

      - name: "### SQL VERIFICATION"
        if: always()
        run: |
          echo "### SQL VERIFICATION"
          echo "Query: SELECT county, parity_source, parity_status, COUNT(*) FROM multi_county_auctions WHERE lower(county)='polk' GROUP BY 1,2,3 ORDER BY 4 DESC LIMIT 20"
          python3 -c "
          import json
          sql = '''
          SELECT
              county,
              COALESCE(parity_source, 'NULL') AS parity_source,
              COALESCE(parity_status, 'NULL') AS parity_status,
              COUNT(*) AS n
          FROM multi_county_auctions
          WHERE lower(county) = 'polk'
          GROUP BY 1,2,3
          ORDER BY 4 DESC
          LIMIT 20
          '''
          print(json.dumps({'query': sql}))
          " > /tmp/audit.json
          curl -sS \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/audit.json
          echo
