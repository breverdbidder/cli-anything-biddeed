name: Robinhood Mapbox

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Geocode + Mapbox satellite/3D tile
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          mkdir -p /tmp/mb && cd /tmp/mb
          if [ -z "$MAPBOX_TOKEN" ]; then echo "MAPBOX_TOKEN missing"; exit 1; fi

          # Geocode the address
          curl -s "https://api.mapbox.com/geocoding/v5/mapbox.places/4087%20Robinhood%20Dr%20Melbourne%20FL%2032935.json?access_token=${MAPBOX_TOKEN}" -o geo.json
          echo "=== Geocode ==="
          cat geo.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('features'):
              f = d['features'][0]
              print(f\"  Place: {f.get('place_name')}\")
              print(f\"  Center (lng,lat): {f['center']}\")
              with open('coords.txt','w') as fp:
                  fp.write(f\"{f['center'][0]},{f['center'][1]}\")
          else:
              print('  No geocode result')
              sys.exit(1)
          "
          COORDS=$(cat coords.txt)
          echo "Coords: $COORDS"

          # 1) Tight satellite view (zoom 19 = building-level)
          curl -s "https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/static/${COORDS},19,0/1280x720@2x?access_token=${MAPBOX_TOKEN}" -o "01_aerial_close.jpg"
          # 2) Wider satellite (zoom 17 = lot context)
          curl -s "https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/static/${COORDS},17,0/1280x720@2x?access_token=${MAPBOX_TOKEN}" -o "02_aerial_wide.jpg"
          # 3) Pure satellite (no street labels) tight
          curl -s "https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/${COORDS},19,0/1280x720@2x?access_token=${MAPBOX_TOKEN}" -o "03_aerial_pure.jpg"
          # 4) 3D pitched view
          curl -s "https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/static/${COORDS},18.5,0,60/1280x720@2x?access_token=${MAPBOX_TOKEN}" -o "04_aerial_3d.jpg"
          # 5) Neighborhood context
          curl -s "https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/static/${COORDS},15,0/1280x720@2x?access_token=${MAPBOX_TOKEN}" -o "05_neighborhood.jpg"

          echo ""
          echo "=== Files ==="
          ls -la *.jpg
          for f in *.jpg; do
            SIZE=$(stat -c %s "$f")
            HEAD=$(file "$f")
            echo "  $f: ${SIZE}b | $HEAD"
          done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_mapbox
          path: /tmp/mb/
          retention-days: 365
