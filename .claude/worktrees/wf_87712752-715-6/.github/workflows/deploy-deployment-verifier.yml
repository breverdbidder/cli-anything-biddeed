name: Deploy deployment-verifier to Hetzner
# Issue: breverdbidder/cli-anything-biddeed#101
#
# Deploys the Dify custom tool (server.py) to Hetzner 87.99.129.125:8318
# Installs Playwright + Chromium, runs as systemd service.
# Registers OpenAPI schema (dify_tool.yaml) with Dify on port 3100.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - restart
          - status
          - test
        default: deploy
  push:
    paths:
      - 'tools/deployment-verifier/**'
    branches:
      - main

env:
  HETZNER_HOST: 87.99.129.125
  DEPLOY_PATH: /opt/deployment-verifier
  SERVICE_PORT: 8318

jobs:
  deploy:
    name: Deploy deployment-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H ${{ env.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Status check
        if: inputs.action == 'status'
        run: |
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }} << 'EOF'
            echo "=== Service Status ==="
            systemctl status deployment-verifier --no-pager || true
            echo ""
            echo "=== Health Check ==="
            curl -sf http://localhost:8318/health || echo "Service not responding"
          EOF

      - name: Restart service
        if: inputs.action == 'restart'
        run: |
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }} << 'EOF'
            systemctl restart deployment-verifier
            sleep 3
            curl -sf http://localhost:8318/health && echo "✅ Restarted OK" || echo "❌ Restart failed"
          EOF

      - name: Test chat-v2
        if: inputs.action == 'test'
        run: |
          ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }} << 'EOF'
            echo "=== Testing zonewise.ai/chat-v2 ==="
            curl -sf -X POST http://localhost:8318/verify/chat-v2 \
              -H "Content-Type: application/json" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'Status: {d[\"status\"]}')
          print(f'HTTP: {d[\"http_code\"]}')
          print(f'Load: {d[\"load_ms\"]}ms')
          print(f'Checks passed: {d[\"checks_passed\"]}')
          print(f'Checks failed: {d[\"checks_failed\"]}')
          for s in d['signals']:
              icon = '✅' if s['severity'] == 'info' else '❌'
              print(f'  {icon} [{s[\"severity\"]}] {s[\"signal_type\"]}: {s[\"message\"]}')
          sys.exit(0 if d['status'] == 'pass' else 1)
          "
          EOF

      - name: Deploy to Hetzner
        if: inputs.action == 'deploy' || github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SSH="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"
          SCP="scp -i ~/.ssh/hetzner -o StrictHostKeyChecking=no"

          echo "=== Deploying deployment-verifier to Hetzner ==="

          # Create deploy dir
          $SSH "mkdir -p ${{ env.DEPLOY_PATH }}"

          # Copy files
          $SCP tools/deployment-verifier/server.py root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/
          $SCP tools/deployment-verifier/verify_deployment.py root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/
          $SCP tools/deployment-verifier/signal_detector.py root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/
          $SCP tools/deployment-verifier/auto_repair.py root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/
          $SCP tools/deployment-verifier/requirements.txt root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/
          $SCP tools/deployment-verifier/dify_tool.yaml root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/
          $SCP migrations/20260330_deployment_checks.sql root@${{ env.HETZNER_HOST }}:${{ env.DEPLOY_PATH }}/

          # Install + configure on Hetzner
          $SSH << 'REMOTE'
          set -e
          cd /opt/deployment-verifier

          echo "=== Python deps ==="
          pip install -q -r requirements.txt

          echo "=== Playwright Chromium ==="
          playwright install chromium --with-deps 2>&1 | tail -5

          echo "=== Write .env ==="
          cat > .env << ENV
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
          PORT=8318
          ENV

          echo "=== Systemd service ==="
          cat > /etc/systemd/system/deployment-verifier.service << SERVICE
          [Unit]
          Description=deployment-verifier Dify Custom Tool
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/deployment-verifier
          EnvironmentFile=/opt/deployment-verifier/.env
          ExecStart=/usr/bin/python3 /opt/deployment-verifier/server.py
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable deployment-verifier
          systemctl restart deployment-verifier

          echo "=== Waiting for startup ==="
          sleep 5
          curl -sf http://localhost:8318/health && echo "✅ Service healthy" || echo "❌ Health check failed"
          REMOTE

      - name: Run DB migration
        if: inputs.action == 'deploy' || github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - << 'EOF'
          import os, httpx

          url = os.getenv("SUPABASE_URL", "")
          key = os.getenv("SUPABASE_SERVICE_KEY", "")
          if not url or not key:
              print("⚠️  SUPABASE creds not set — skipping migration")
              exit(0)

          # Use Supabase SQL API to run migration
          import pathlib
          sql = pathlib.Path("migrations/20260330_deployment_checks.sql").read_text()

          # Split by semicolons and run each statement
          statements = [s.strip() for s in sql.split(";") if s.strip() and not s.strip().startswith("--")]
          for stmt in statements:
              if not stmt:
                  continue
              resp = httpx.post(
                  f"{url}/rest/v1/rpc/query",
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                  },
                  json={"query": stmt + ";"},
                  timeout=30,
              )
              print(f"Migration statement: {resp.status_code}")

          print("✅ Migration complete (CREATE IF NOT EXISTS — idempotent)")
          EOF

      - name: Smoke test
        if: inputs.action == 'deploy' || github.event_name == 'push'
        run: |
          SSH="ssh -i ~/.ssh/hetzner -o StrictHostKeyChecking=no root@${{ env.HETZNER_HOST }}"

          echo "=== Smoke test: /health ==="
          $SSH "curl -sf http://localhost:8318/health" && echo "✅ Health OK" || echo "❌ Health failed"

          echo ""
          echo "=== Smoke test: verify zonewise.ai/chat-v2 ==="
          $SSH "curl -sf -X POST http://localhost:8318/verify/chat-v2 -H 'Content-Type: application/json'" | \
            python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(f'URL: {d[\"url\"]}')
              print(f'Status: {d[\"status\"]}')
              print(f'HTTP: {d[\"http_code\"]}')
              print(f'Checks passed: {d[\"checks_passed\"]}')
              for s in d['signals']:
                  print(f'  Signal [{s[\"severity\"]}]: {s[\"message\"]}')
          except Exception as e:
              print(f'Parse error: {e}')
              sys.exit(1)
          " || echo "⚠️  smoke test response parse issue (service may still be running)"

      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ACTION="${{ inputs.action || 'push-deploy' }}"
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          MSG="${EMOJI} deployment-verifier: ${ACTION} ${STATUS}%0AHetzner 87.99.129.125:8318%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" > /dev/null 2>&1 || true
