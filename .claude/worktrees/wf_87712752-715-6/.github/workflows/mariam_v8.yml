name: Mariam Deeds v8 (CSV Export)

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Grantee or ALL'
        required: false
        default: 'ALL'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v8
          cd /tmp/mariam_v8

          cat > runner.py <<'PY'
          import asyncio, json, os, re
          from datetime import datetime
          from pathlib import Path

          async def search_grantee(party_name: str, downloads_dir: Path):
              from playwright.async_api import async_playwright
              result = {"party": party_name, "ts": datetime.utcnow().isoformat(),
                        "csv_path": None, "csv_size": 0, "row_count": 0,
                        "success": False, "error": None, "debug": []}

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (Windows NT 10.0) Chrome/120.0",
                      accept_downloads=True,
                  )
                  page = await ctx.new_page()
                  safe = party_name.replace(' ','_').replace(',','')

                  try:
                      # Disclaimer + accept
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)
                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)

                      # Search form
                      await page.wait_for_selector("input#SearchOnName", timeout=20000)
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                      await page.fill("input#SearchOnName", party_name)
                      await page.fill("input#RecordDateFrom", "1/1/2011")
                      await page.fill("input#RecordDateTo", "12/31/2022")
                      await page.click("input#btnSearch")
                      await asyncio.sleep(4)

                      # Name picker — click first visible Done
                      await page.wait_for_selector("text=Select Names:", timeout=15000)
                      all_done = page.locator("input[type='submit'][value='Done']")
                      cnt = await all_done.count()
                      for i in range(cnt):
                          btn = all_done.nth(i)
                          if await btn.is_visible():
                              await btn.click()
                              break

                      # Wait for results grid
                      await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=30000)
                      await asyncio.sleep(2)

                      # Read total record count from the page
                      page_html = await page.content()
                      m = re.search(r'(\d+)\s*-\s*(\d+)\s*of\s*(\d+)', page_html)
                      if m:
                          result["debug"].append(f"page shows: {m.group(0)}")
                          result["total_records"] = int(m.group(3))

                      # Click CSV export — captures download
                      async with page.expect_download(timeout=60000) as dl_info:
                          await page.click("a.csvButton#btnCsvButton")
                      download = await dl_info.value
                      csv_path = downloads_dir / f"{safe}.csv"
                      await download.save_as(str(csv_path))

                      result["csv_path"] = str(csv_path)
                      result["csv_size"] = csv_path.stat().st_size
                      # Count rows
                      with open(csv_path, 'r', errors='replace') as f:
                          lines = f.readlines()
                      result["row_count"] = max(0, len(lines) - 1)  # minus header
                      result["success"] = True
                      result["debug"].append(f"CSV: {result['csv_size']} bytes, {result['row_count']} rows")

                  except Exception as e:
                      result["error"] = str(e)
                      try:
                          await page.screenshot(path=f"/tmp/mariam_v8/{safe}_error.png", full_page=True)
                      except: pass
                  finally:
                      await browser.close()
              return result

          async def main():
              GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
              target = os.environ.get('GRANTEE','ALL').strip().upper()
              targets = GRANTEES_ALL if target == 'ALL' else [target]

              dl_dir = Path('/tmp/mariam_v8')
              dl_dir.mkdir(exist_ok=True)

              all_results = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_grantee(g, dl_dir)
                  all_results[g] = r
                  print(f"  rows={r['row_count']}  csv_size={r['csv_size']}  success={r['success']}", flush=True)
                  if r.get('error'):
                      print(f"  ERROR: {r['error']}", flush=True)
                  for d in r.get('debug', []):
                      print(f"  ! {d}", flush=True)

              with open(dl_dir / 'all_results.json', 'w') as f:
                  json.dump(all_results, f, indent=2, default=str)

              total = sum(v.get('row_count', 0) for v in all_results.values())
              print(f"\n>>> TOTAL: {total} rows across {len(all_results)} grantees")

          asyncio.run(main())
          PY

          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee run.log
          ls -la /tmp/mariam_v8/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v8/ /tmp/results/ || true
          ls -la /tmp/results/mariam_v8/ 2>/dev/null || echo "no results"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v8_${{ inputs.grantee }}
          path: /tmp/results/
          retention-days: 365
