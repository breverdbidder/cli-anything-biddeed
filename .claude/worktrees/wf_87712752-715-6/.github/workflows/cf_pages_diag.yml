name: CF Pages Diagnostic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT:  ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          mkdir -p /tmp/cf
          
          echo "=== List all CF Pages projects ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/pages/projects" \
            -o /tmp/cf/projects.json
          
          python3 <<'PY'
          import json
          with open('/tmp/cf/projects.json') as f:
              data = json.load(f)
          if not data.get('success'):
              print("ERROR:", data.get('errors'))
              exit(1)
          for p in data.get('result', []):
              print(f"\n=== {p['name']} ===")
              print(f"  domain: {p.get('domains', [])}")
              print(f"  subdomain: {p.get('subdomain')}")
              print(f"  source: {p.get('source', {}).get('type', 'none')}")
              if p.get('source'):
                  cfg = p.get('source', {}).get('config', {})
                  print(f"    repo: {cfg.get('owner')}/{cfg.get('repo_name')}")
                  print(f"    branch: {cfg.get('production_branch')}")
                  print(f"    deploy on commit: {cfg.get('deployments_enabled')}")
              print(f"  build: cmd='{p.get('build_config', {}).get('build_command', '')}', dir='{p.get('build_config', {}).get('destination_dir', '')}'")
              print(f"  created: {p.get('created_on')}")
              print(f"  latest deployment: {p.get('latest_deployment', {}).get('created_on', '—')}")
              print(f"  latest sha: {p.get('latest_deployment', {}).get('deployment_trigger', {}).get('metadata', {}).get('commit_hash', '—')[:10]}")
          PY

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf_pages_inspect
          path: /tmp/cf/
