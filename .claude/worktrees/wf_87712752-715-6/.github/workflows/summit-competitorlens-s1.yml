name: "Summit: CompetitorLens S1 — Foundation"
on:
  workflow_dispatch: {}

jobs:
  s1-foundation:
    name: "S1: Crawl + Extract + Supabase + Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Execute S1 on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 110m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY,GH_PAT,CLAUDE_OAUTH_B64,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,FIRECRAWL_API_KEY,DEEPSEEK_API_KEY
          script: |
            set -e
            echo "=== [1/6] Setup ==="
            id claude 2>/dev/null || useradd -m -s /bin/bash claude
            mkdir -p /home/claude/.npm-global
            chown -R claude:claude /home/claude

            echo "=== [2/6] Claude Code ==="
            npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3
            claude --version 2>/dev/null || echo "Claude Code installed"

            echo "=== [3/6] Auth ==="
            echo "$CLAUDE_OAUTH_B64" | base64 -d > /tmp/claude-oauth-token
            OAUTH_TOKEN=$(cat /tmp/claude-oauth-token)
            rm -f /tmp/claude-oauth-token

            echo "=== [4/6] Repo ==="
            mkdir -p /opt/biddeed
            if [ ! -d "/opt/biddeed/cli-anything-biddeed" ]; then
              cd /opt/biddeed
              git clone "https://x-access-token:${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git"
            fi
            cd /opt/biddeed/cli-anything-biddeed
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chown -R claude:claude /opt/biddeed/cli-anything-biddeed
            echo "Last 3 commits:"
            git log --oneline -3

            echo "=== [5/6] Claude Code — CompetitorLens S1 ==="
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_SERVICE_KEY='$SUPABASE_SERVICE_KEY'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
              export GH_PAT='$GH_PAT'
              export TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN'
              export TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID'
              export FIRECRAWL_API_KEY='$FIRECRAWL_API_KEY'
              export DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY'

              cd /opt/biddeed/cli-anything-biddeed

              claude --print --dangerously-skip-permissions \
                'MISSION: Build CompetitorLens Agent #14 — Sprint 1 (Foundation).

              STEP 0 — READ SPEC FIRST
              cat docs/plans/COMPETITORLENS-SPEC.md
              cat CLAUDE.md

              CONTEXT: CompetitorLens is DesignWise Agent #14. It reverse-engineers
              competitor UX patterns (PropertyOnion, Foreclosure.com) and rebuilds them
              as BidDeed.AI branded JSX components with live Supabase data binding.

              SPRINT 1 TASKS (from spec Section 5):
              1. Create harness: harnesses/competitorlens/ following HARNESS.md 7-phase pipeline
                 - Fork structure from an existing harness (e.g., zonewise)
                 - Create SKILL.md, cli_anything.competitorlens.py
              2. Firecrawl integration (crawl.py): scrape URL -> raw HTML + screenshot
                 - Use FIRECRAWL_API_KEY env var
                 - Output: raw HTML, screenshot URL, metadata
              3. DeepSeek V3.2 layout extractor (extract.py): HTML -> ComponentBlueprint JSON
                 - Use CLIProxyAPI at 127.0.0.1:8317 OR direct DeepSeek API
                 - DEEPSEEK_API_KEY available as env var
                 - ComponentBlueprint schema: sections[], navigation, filters, dataDisplayPatterns, ctaPlacement
              4. Supabase tables: competitor_analyses + ux_pattern_library + RLS
                 - Use SUPABASE_URL and SUPABASE_SERVICE_KEY
                 - Standard RLS: authenticated users only
              5. Unit tests: eval/eval.json with 5+ assertions per stage

              VALIDATION: After completing, test crawl against https://propertyonion.com/property_search/Brevard%20county?view_type=calendar
              If Firecrawl returns valid HTML, Sprint 1 is DONE.

              RULES:
              1. Commit after EACH task — never batch
              2. git config user.email ci@biddeed.ai and user.name BidDeed-CI
              3. Git remote: https://x-access-token:\${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git
              4. Push to main after each commit
              5. Commit messages: feat(competitorlens): S1.{N} - {description}
              6. If context hits 50%, commit and push what you have
              7. Send Telegram notification when done:
                 curl -s -X POST \"https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage\" \
                   -d chat_id=\"\${TELEGRAM_CHAT_ID}\" \
                   -d text=\"CompetitorLens S1 DONE: harness created, Firecrawl+DeepSeek pipeline, Supabase tables, tests passing.\"
              8. NEVER claim complete if validation fails — report exact error
              9. COST DISCIPLINE: \$10 session max. No unnecessary installs.

              GO. Execute S1.1 through S1.5.'
            "

            echo "=== [6/6] Done ==="
