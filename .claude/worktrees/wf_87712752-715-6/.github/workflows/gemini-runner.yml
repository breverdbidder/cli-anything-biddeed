name: Gemini Runner — T2/T3 grunt lane (no Hetzner, no Claude Code)
on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers (REQUIRED) — T2/T3 grunt tasks only'
        required: true
        type: string
concurrency:
  group: gemini-ghonly-${{ inputs.issues }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Reject empty issues input
        run: |
          if [ -z "${{ inputs.issues }}" ]; then echo "::error::Empty issues input"; exit 1; fi
          echo "::notice::Gemini lane for issues: ${{ inputs.issues }}"
  run-gemini:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        issue: ${{ fromJson(format('[{0}]', inputs.issues)) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FULL }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch issue brief
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          gh issue view ${{ matrix.issue }} --repo ${{ github.repository }} --json title,body \
            -q '"# " + .title + "\n\n" + .body' > /tmp/prompt.md
          echo "----- BRIEF -----"; cat /tmp/prompt.md
      - name: Run Gemini task engine (vault key, never persisted to disk)
        id: gemini
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python3 scripts/gemini_task_runner.py /tmp/prompt.md > /tmp/gemini.log 2>&1
          GEMINI_EXIT=$?
          cat /tmp/gemini.log
          echo "exit=$GEMINI_EXIT"
          echo "$GEMINI_EXIT" > /tmp/gemini_exit.txt
          exit $GEMINI_EXIT
      - name: Guard rail — reject protected-path changes (billing/MCP-server/launcher)
        if: always() && steps.gemini.outcome == 'success'
        run: |
          BLOCKED='^(supabase/functions/(claude-router|stripe|mcp)|src/mcp|src/launcher|\.github/workflows/cc-runner)'
          HITS="$(git status --porcelain | awk '{print $2}' | grep -E "$BLOCKED" || true)"
          if [ -n "$HITS" ]; then
            echo "::error::Gemini lane touched protected path(s), discarding: $HITS"
            git checkout -- .
            git clean -fd
            exit 1
          fi
      - name: Commit changes
        if: always() && steps.gemini.outcome == 'success'
        run: |
          git config user.name "gemini-lane-bot"
          git config user.email "gemini-lane@biddeed.ai"
          git add -A
          if git diff --cached --quiet; then echo "No file changes"; exit 0; fi
          git commit -m "Gemini lane: issue ${{ matrix.issue }} (run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "push OK on attempt $attempt"; exit 0; fi
            echo "push rejected (attempt $attempt) — likely concurrent shard push to main; rebasing and retrying"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebase conflict — aborting rebase, work stays committed locally only (will be lost when runner is torn down)"
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::push failed after 5 attempts — commit not persisted to origin/main"
          exit 1
      - name: Record evidence in fleet_lane_pilot
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STATUS="failure"
          if [ "${{ steps.gemini.outcome }}" = "success" ]; then STATUS="success"; fi
          TASK="$(head -1 /tmp/prompt.md | sed 's/^# //' | cut -c1-200)"
          PAYLOAD="$(jq -n --arg run_id "${{ github.run_id }}" --arg task "$TASK" --arg status "$STATUS" \
            '{run_id: $run_id, task: $task, lane: "gemini", status: $status}')"
          curl -sS -X POST "${SUPABASE_URL}/rest/v1/fleet_lane_pilot" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD"
      - name: Post run breadcrumb to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FULL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment ${{ matrix.issue }} --repo ${{ github.repository }} \
            --body "Gemini lane run finished — lane **gemini**, conclusion **${{ job.status }}**, run: ${RUN_URL}"
