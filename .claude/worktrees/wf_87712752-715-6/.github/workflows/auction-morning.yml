name: Auction Morning Analysis

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 7 AM ET weekdays
  workflow_dispatch:
    inputs:
      date:
        description: 'Auction date (MM/DD/YYYY or YYYY-MM-DD). Leave blank for next upcoming.'
        required: false
        default: ''
      skip_enrich:
        description: 'Skip BCPAO enrichment (faster)'
        required: false
        default: 'false'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install click prompt-toolkit httpx python-docx
          pip install -e shared/
          pip install -e auction/agent-harness/

      - name: Discover next auction date
        id: discover
        run: |
          NEXT=$(cli-anything-auction --json discover upcoming | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('next_date', d.get('date', 'sample')))
          ")
          echo "next_date=$NEXT" >> $GITHUB_OUTPUT
          echo "Discovered next auction date: $NEXT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Set target date
        id: target
        run: |
          # Use workflow input if provided, otherwise use discovered next date
          INPUT="${{ github.event.inputs.date }}"
          DISCOVERED="${{ steps.discover.outputs.next_date }}"
          if [ -n "$INPUT" ]; then
            echo "date=$INPUT" >> $GITHUB_OUTPUT
          else
            echo "date=$DISCOVERED" >> $GITHUB_OUTPUT
          fi

      - name: Analyze auction cases
        run: |
          TARGET="${{ steps.target.outputs.date }}"
          echo "Analyzing auction date: $TARGET"

          ENRICH_FLAG=""
          if [ "${{ github.event.inputs.skip_enrich }}" = "true" ]; then
            ENRICH_FLAG="--no-enrich"
          fi

          cli-anything-auction --json analyze batch \
            --date "$TARGET" \
            $ENRICH_FLAG \
            --notify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFY: "1"

      - name: Generate DOCX reports
        run: |
          TARGET="${{ steps.target.outputs.date }}"
          mkdir -p reports/
          cli-anything-auction report batch \
            --date "$TARGET" \
            -o reports/ \
            --format docx || \
          cli-anything-auction report batch \
            --date "$TARGET" \
            -o reports/ \
            --format text
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: auction-reports-${{ steps.target.outputs.date }}-${{ github.run_number }}
          path: reports/
          retention-days: 30
