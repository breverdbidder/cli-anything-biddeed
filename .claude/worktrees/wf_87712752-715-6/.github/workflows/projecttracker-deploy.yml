name: "Deploy ProjectTracker to Hetzner"

on:
  push:
    paths: ['projecttracker/**']
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test'
        required: false
        type: boolean
        default: true

env:
  HETZNER_HOST: 87.99.129.125
  REPO_PATH: /opt/biddeed/cli-anything-biddeed

jobs:
  deploy:
    name: "📊 Deploy ProjectTracker"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "1️⃣ Deploy"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            mkdir -p /opt/biddeed
            [ -d "${{ env.REPO_PATH }}/.git" ] || { cd /opt/biddeed; git clone https://${{ secrets.GH_PAT }}@github.com/breverdbidder/cli-anything-biddeed.git; }
            cd ${{ env.REPO_PATH }} && git fetch origin main && git reset --hard origin/main
            echo "📦 $(git log --oneline -1)"
            test -f projecttracker/agent.py && echo "✅ agent.py"
            test -f projecttracker/CLAUDE.md && echo "✅ CLAUDE.md"
            pip install httpx --quiet --break-system-packages 2>/dev/null || true
            mkdir -p projecttracker/eval_outputs
            echo "✅ ProjectTracker deployed"

      - name: "2️⃣ Smoke test"
        if: github.event.inputs.smoke_test != 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            echo "🧪 Smoke: report for test project"
            python3 -m projecttracker.agent report --project PRJ-TEST01 --budget 85000 --json 2>/dev/null \
              > projecttracker/eval_outputs/smoke_report.json || true
            python3 -c "
            import json
            d = json.load(open('projecttracker/eval_outputs/smoke_report.json'))
            print(f'✅ Project: {d.get(\"project_id\")}'  )
            print(f'   Health: {d.get(\"project_health_score\",\"?\")}/100 ({d.get(\"health_label\")})')
            print(f'   Budget: {d.get(\"budget\",{}).get(\"budget_health\")} | CPI: {d.get(\"budget\",{}).get(\"cpi\")}')
            print(f'   Schedule: {d.get(\"milestones\",{}).get(\"schedule_status\")} | {d.get(\"milestones\",{}).get(\"overall_pct\")}%')
            print(f'   Actions: {d.get(\"action_count\")} | Risks: {d.get(\"risk_count\")}')
            " 2>&1 || echo "⚠️ Smoke test failed"

      - name: "3️⃣ Status"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            cd ${{ env.REPO_PATH }}
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
            python3 -m projecttracker.agent status 2>&1

      - name: "4️⃣ Telegram"
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 1m
          script: |
            COMMIT=$(cd ${{ env.REPO_PATH }} && git log --oneline -1)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "parse_mode=HTML" \
              -d "text=$( [ '${{ job.status }}' = 'success' ] && echo '✅' || echo '❌' ) <b>ProjectTracker Deploy</b>: ${{ job.status }}
            Commit: ${COMMIT}" > /dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: echo "## 📊 ProjectTracker Deploy — ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
