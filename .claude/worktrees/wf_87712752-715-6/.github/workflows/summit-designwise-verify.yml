name: "Summit: Visual Verify v2"
on:
  workflow_dispatch: {}

jobs:
  verify:
    name: "Playwright Screenshots → Telegram"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Run on Hetzner"
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 30s
          command_timeout: 8m
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e
            cd /tmp && rm -rf dwv && mkdir dwv && cd dwv

            # Use existing playwright or install minimal
            if ! command -v npx &> /dev/null; then
              echo "npx not found"
              exit 1
            fi

            # Check if playwright already cached
            if [ -d "/root/.cache/ms-playwright" ]; then
              echo "Playwright cached, skipping install"
            else
              npm init -y > /dev/null 2>&1
              npm install playwright@latest > /dev/null 2>&1
              npx playwright install chromium --with-deps 2>&1 | tail -3
            fi

            # Write minimal verify script
            cat > v.js << 'EOF'
            const { chromium } = require('playwright');
            const fs = require('fs');
            const r = [];
            function c(a,n,p,d) { r.push({a,n,p,d}); }

            (async () => {
              const b = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
              const p = await b.newPage({ viewport: { width: 1280, height: 900 } });

              // Home
              await p.goto('https://zonewise.ai', { timeout: 40000, waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(8000);
              await p.screenshot({ path: 'home.png' });
              let t = await p.textContent('body');
              c('A11y','SkipToContent', !!(await p.$('a[href="#main-content"]')), '');
              c('Content','Stats', /parcels/i.test(t), '');
              c('SEO','GSC', !!(await p.$('meta[name="google-site-verification"]')), '');
              c('SEO','OG', !!(await p.$('meta[property="og:title"]')), '');

              // Help
              await p.goto('https://zonewise.ai/help', { timeout: 20000, waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(4000);
              await p.screenshot({ path: 'help.png' });
              c('Support','/help', (await p.$$('button')).length >= 3, '');

              // Docs
              await p.goto('https://zonewise.ai/docs', { timeout: 20000, waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(4000);
              await p.screenshot({ path: 'docs.png' });
              t = await p.textContent('body');
              c('Support','/docs', /API|endpoint/i.test(t), '');

              // Explorer
              await p.goto('https://zonewise.ai/explorer', { timeout: 30000, waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(7000);
              await p.screenshot({ path: 'explorer.png' });
              c('A11y','ARIA', (await p.evaluate(() => document.querySelectorAll('[aria-label]').length)) > 0, '');
              c('QA','ChatInput', !!(await p.$('input, textarea')), '');

              // Pricing
              await p.goto('https://zonewise.ai/pricing', { timeout: 20000, waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(4000);
              await p.screenshot({ path: 'pricing.png' });
              t = await p.textContent('body');
              c('Content','Pricing', /\$39|\$99/i.test(t), '');

              // Mobile
              await p.setViewportSize({ width: 375, height: 812 });
              await p.goto('https://zonewise.ai', { timeout: 20000, waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(4000);
              await p.screenshot({ path: 'mobile.png' });
              c('QA','Mobile', !(await p.evaluate(() => document.documentElement.scrollWidth > 380)), '');

              // Health
              const h = await p.goto('https://zonewise.ai/api/health', { timeout: 10000 });
              const j = await h.json().catch(()=>({}));
              c('Deploy','Health', j.status==='ok', '');

              await b.close();

              const pass = r.filter(x=>x.p).length;
              const fail = r.filter(x=>!x.p).length;
              let s = `DESIGNWISE VISUAL VERIFY\n${pass}/${r.length} passed\n\n`;
              r.forEach(x => { s += `${x.p?'✅':'❌'} ${x.a}: ${x.n}\n`; });
              fs.writeFileSync('sum.txt', s);
              console.log(s);
            })();
            EOF

            node v.js 2>&1 || true

            # Telegram summary
            if [ -f sum.txt ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$(cat sum.txt)" > /dev/null 2>&1 || true
            fi

            # Telegram screenshots
            for img in home.png help.png docs.png explorer.png pricing.png mobile.png; do
              [ -f "$img" ] && curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                -F chat_id="${TELEGRAM_CHAT_ID}" -F photo=@"$img" -F caption="$img" > /dev/null 2>&1 || true
            done
            echo "DONE"
