name: "SHARD-7 Columbia County Daily Scraper"
# Dedicated daily scraper for Columbia County.
#
# Platform: columbiaclerk.com (clerk_html) -- NOT RealAuction. Columbia has no
# RealAuction tenant; columbia.realforeclose.com/realtaxdeed.com just redirect to
# the generic marketing splash (confirmed by multiple prior sessions). The real
# source is columbiaclerk.com/upcoming-foreclosure-sales/ and
# columbiaclerk.com/clerk-services/tax-deeds/upcoming-tax-deed-sales/, both
# Cloudflare-protected (403 to plain requests). scripts/columbia_clerk_html_harvest.py
# bypasses this with a real headless Chromium/Chrome binary (ubuntu-latest GHA
# runners ship google-chrome-stable pre-installed) -- no Firecrawl key or
# Playwright install needed.
#
# SHARD-2 run 2753 (2026-07-05): re-wired from the old credential-gated
# RealAuction jobs (which could never fire -- COLUMBIA_REALFORECLOSE_AUTH_CONFIGURED
# / COLUMBIA_REALTAXDEED_AUTH_CONFIGURED were never set, correctly, since no such
# tenant exists) to this real clerk_html scraper. First live run wrote 9 real
# foreclosure rows (columbia had 0 rows before). Tax deed page currently lists
# zero upcoming sales ("There are no properties on the list of tax deeds at this
# time.") -- genuinely empty, not a scraper gap; this cron will pick up tax deed
# listings automatically once the county schedules one.

on:
  schedule:
    # Daily at 07:30 UTC
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no DB writes)'
        required: false
        default: 'false'

jobs:
  columbia-clerk-html:
    name: "Columbia County clerk_html scraper (foreclosure + tax deed)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Verify a Chromium/Chrome binary is available"
        run: |
          set -euo pipefail
          which google-chrome-stable || which google-chrome || which chromium-browser || which chromium

      - name: "Scrape columbiaclerk.com (foreclosure + tax deed)"
        run: |
          set -euo pipefail
          python3 scripts/columbia_clerk_html_harvest.py

  # NOTE: the former "columbia-realforeclose" / "columbia-realtaxdeed" credential-gated
  # jobs were REMOVED 2026-07-05 (SHARD-2 run 2753) -- columbia has no RealAuction
  # tenant (confirmed by multiple prior sessions: both subdomains redirect to the
  # generic marketing splash, 0 rows all-time). Those jobs could never fire since
  # their gating repo vars were never set, correctly. Do not reintroduce a
  # RealAuction path for columbia without first confirming a real tenant exists.
  #
  # NOTE: the former "columbia-j-generator" job (ran scripts/shard7_columbia_bootstrap.py
  # unconditionally, if: always()) was REMOVED 2026-07-02 (shard-8) -- that script wrote
  # 100% fabricated placeholder auctions into production every day regardless of whether
  # the real scrapers above succeeded. See public.honesty_violations
  # (domain=GOLD_STANDARD_CAMPAIGN). Do not reintroduce a bootstrap/seed step here.

  summary:
    name: "Columbia County Pipeline Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [columbia-clerk-html]
    if: always()
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - name: "Count columbia auctions and bid_decisions"
        run: |
          set -euo pipefail
          python3 -c "
          import json, os, urllib.request

          KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          URL = os.environ['SUPABASE_URL']

          req = urllib.request.Request(
            f'{URL}/rest/v1/multi_county_auctions?select=id&county=eq.columbia',
            method='HEAD'
          )
          req.add_header('apikey', KEY)
          req.add_header('Authorization', f'Bearer {KEY}')
          req.add_header('Prefer', 'count=exact')
          with urllib.request.urlopen(req, timeout=15) as resp:
            cr = resp.getheader('Content-Range', '*/0')
            print(f'Columbia auctions: {cr}')

          req2 = urllib.request.Request(
            f'{URL}/rest/v1/bid_decisions?select=id&county_slug=eq.columbia',
            method='HEAD'
          )
          req2.add_header('apikey', KEY)
          req2.add_header('Authorization', f'Bearer {KEY}')
          req2.add_header('Prefer', 'count=exact')
          with urllib.request.urlopen(req2, timeout=15) as resp2:
            cr2 = resp2.getheader('Content-Range', '*/0')
            print(f'Columbia bid_decisions: {cr2}')
          "
