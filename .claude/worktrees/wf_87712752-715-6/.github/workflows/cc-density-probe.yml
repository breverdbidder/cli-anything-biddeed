name: cc density probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: grounded extraction probe
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          cat > /tmp/cal_prompt.txt <<'PROMPT'
          You are extracting the maximum permitted residential density for ONE Florida zoning district, working strictly from the real municipal code.

          District: county=Brevard, jurisdiction=City of Titusville, zone_code=R-1AAA, district_name=Single Family Residential.

          Method: Use WebSearch to find the City of Titusville Land Development / Zoning Code section that defines the R-1AAA district (Municode is the usual host). Then use WebFetch to open the actual code section and read it. Quote the governing text verbatim.

          Rules (follow exactly):
          - Report a number in dwelling units per acre ONLY if the code LITERALLY states a maximum density in units/dwellings per acre. Copy that figure.
          - NEVER derive density from minimum lot size, lot width, or FAR. If intensity is governed only by minimum lot size or dimensional standards, basis = lot_governed and density = null.
          - If there is no maximum residential density standard at all, basis = not_stated and density = null.
          - If you cannot reach the actual code text, basis = review and density = null. Never guess.

          Output ONLY one line of JSON and nothing else:
          {"zone":"R-1AAA","basis":"stated_max_density|lot_governed|not_stated|review","density_du_acre":null,"quote":"verbatim sentence","citation":"section","source_url":"fetched url"}
          PROMPT
          echo "=== run ==="
          timeout 230 claude -p "$(cat /tmp/cal_prompt.txt)" --allowedTools "WebSearch" "WebFetch" --output-format text 2>&1 | tail -30
          echo "RC=${PIPESTATUS[0]}"
          echo "END"
          REMOTE
