name: Robinhood Street View

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Google Street View shots
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir -p /tmp/sv
          cd /tmp/sv
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY missing — exiting"; exit 1
          fi

          # First: check if Street View imagery exists for this exact address
          curl -sG --data-urlencode "location=4087 Robinhood Dr Melbourne FL 32935" \
                  --data-urlencode "key=${GOOGLE_API_KEY}" \
                  "https://maps.googleapis.com/maps/api/streetview/metadata" \
                  -o metadata.json
          echo "=== Metadata ==="
          cat metadata.json
          echo ""

          STATUS=$(python3 -c "import json; print(json.load(open('metadata.json')).get('status','?'))")
          if [ "$STATUS" != "OK" ]; then
            echo "Street View not available — status=$STATUS"
            exit 1
          fi

          # Pull 6 angles around the property — front, sides, with slight pitch
          declare -a SHOTS=(
            "01_front:heading=0&pitch=0&fov=80"
            "02_front_left:heading=315&pitch=0&fov=80"
            "03_front_right:heading=45&pitch=0&fov=80"
            "04_front_wide:heading=0&pitch=0&fov=110"
            "05_above:heading=0&pitch=15&fov=90"
            "06_drive_by:heading=270&pitch=0&fov=90"
          )

          for SHOT in "${SHOTS[@]}"; do
            NAME="${SHOT%%:*}"
            PARAMS="${SHOT#*:}"
            URL="https://maps.googleapis.com/maps/api/streetview?size=1280x720&location=4087+Robinhood+Dr+Melbourne+FL+32935&${PARAMS}&key=${GOOGLE_API_KEY}"
            curl -sL "$URL" -o "${NAME}.jpg"
            SIZE=$(stat -c %s "${NAME}.jpg")
            echo "  ${NAME}.jpg = ${SIZE} bytes"
          done

          # Aerial via Static Maps as a bonus
          curl -sG --data-urlencode "center=4087 Robinhood Dr Melbourne FL 32935" \
                  --data-urlencode "zoom=20" \
                  --data-urlencode "size=1280x720" \
                  --data-urlencode "maptype=satellite" \
                  --data-urlencode "key=${GOOGLE_API_KEY}" \
                  "https://maps.googleapis.com/maps/api/staticmap" \
                  -o "07_aerial.jpg"
          echo "  07_aerial.jpg = $(stat -c %s 07_aerial.jpg) bytes"

          ls -la

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_streetview
          path: /tmp/sv/
          retention-days: 365
