name: CC Login TTY → Telegram
on:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force TTY login and capture URL
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          
          echo "=== Force TTY login ==="
          LOGIN_OUTPUT=$(ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -tt root@${HETZNER_IP} "script -qec 'timeout 15 claude /login 2>&1' /dev/null" 2>&1 || true)
          echo "$LOGIN_OUTPUT"
          
          URL=$(echo "$LOGIN_OUTPUT" | grep -oP 'https://[^\s\x1b]+' | head -1)
          
          if [ -z "$URL" ]; then
            echo "Trying alternate TTY approach..."
            LOGIN_OUTPUT2=$(ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -tt root@${HETZNER_IP} "export TERM=xterm && timeout 15 claude /login 2>&1" 2>&1 || true)
            echo "$LOGIN_OUTPUT2"
            URL=$(echo "$LOGIN_OUTPUT2" | grep -oP 'https://[^\s\x1b]+' | head -1)
          fi

          if [ -n "$URL" ]; then
            echo "FOUND URL: $URL"
            MSG="🔐 Claude Code Login — Tap to authenticate Hetzner:%0A%0A${URL}%0A%0AOnce you tap, SUMMIT #263 fires automatically."
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="$MSG"
            echo "Sent to Telegram!"
          else
            echo "No URL captured. Full output:"
            echo "$LOGIN_OUTPUT"
            echo "---"
            echo "$LOGIN_OUTPUT2"
          fi
