name: register-mcps

# Registers MCP servers with Claude on Hetzner using GH secrets.
# Idempotent: re-run after adding any missing secret to register more.
# Bypasses claude-runner.sh / OAuth / cliproxy entirely.

on:
  workflow_dispatch: {}

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH to Hetzner + register MCPs
        env:
          HETZNER_IP:             ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY:        ${{ secrets.HETZNER_SSH_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== List MCPs currently registered for summit user ==="
          $SSH "sudo -u summit claude mcp list 2>&1 || true" | tee /tmp/before.txt

          echo ""
          echo "=== Register MCPs (idempotent — skip if already present) ==="

          # Helper: check if name already registered
          has_mcp() {
            grep -q "^$1\b\|^$1:" /tmp/before.txt
          }

          # 1. Supabase MCP
          if has_mcp supabase; then
            echo "SKIP: supabase (already registered)"
          else
            $SSH "sudo -u summit env SUPABASE_ACCESS_TOKEN='${SUPABASE_ACCESS_TOKEN}' \
              claude mcp add --scope user supabase \
              -e SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN} \
              -- npx -y @supabase/mcp-server-supabase@latest --project-ref mocerqjnksmhcjzxrewo" \
              && echo "REG: supabase" || echo "ERR: supabase"
          fi

          # 2. Nano Banana Pro MCP (Gemini 3 Pro Image, 4K, $0.39/img)
          if has_mcp nano-banana-pro; then
            echo "SKIP: nano-banana-pro"
          else
            $SSH "sudo -u summit mkdir -p /home/summit/ai-outputs/nano-banana-pro && \
              sudo -u summit claude mcp add --scope user nano-banana-pro \
              -e GEMINI_API_KEY=${GEMINI_API_KEY} \
              -e GEMINI_OUTPUT_DIR=/home/summit/ai-outputs/nano-banana-pro \
              -- npx -y @rafarafarafa/nano-banana-pro-mcp" \
              && echo "REG: nano-banana-pro" || echo "ERR: nano-banana-pro"
          fi

          # 3. Nano Banana Flash MCP ($0.039/img, iterative)
          if has_mcp nano-banana-flash; then
            echo "SKIP: nano-banana-flash"
          else
            $SSH "sudo -u summit claude mcp add --scope user nano-banana-flash \
              -e GEMINI_API_KEY=${GEMINI_API_KEY} \
              -- npx nano-banana-mcp" \
              && echo "REG: nano-banana-flash" || echo "ERR: nano-banana-flash"
          fi

          # 4. Gemini CLI MCP Tool (1M-context delegation via @file syntax)
          if has_mcp gemini-cli; then
            echo "SKIP: gemini-cli"
          else
            $SSH "sudo -u summit claude mcp add --scope user gemini-cli \
              -e GEMINI_API_KEY=${GEMINI_API_KEY} \
              -- npx -y gemini-mcp-tool" \
              && echo "REG: gemini-cli" || echo "ERR: gemini-cli"
          fi

          echo ""
          echo "=== Post-register MCP list ==="
          $SSH "sudo -u summit claude mcp list 2>&1 || true"

          echo ""
          echo "=== SUMMARY ==="
          echo "Registered in this run: see REG: lines above"
          echo ""
          echo "Still blocked (need Ariel):"
          echo "  - google-drive: needs Google service account JSON (not in GH secrets)"
          echo "  - notebooklm:   needs one-time 'nlm auth login' on Hetzner (Chrome cookie)"
