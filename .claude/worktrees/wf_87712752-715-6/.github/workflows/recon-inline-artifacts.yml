name: "RECON: inline artifacts to SUMMIT row"
on:
  workflow_dispatch:
    inputs:
      summit_id:
        required: true
        type: string

jobs:
  inline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUMMIT_ID: ${{ inputs.summit_id }}
        run: |
          python <<'PYEOF'
          import os, json
          from supabase import create_client
          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_KEY"])
          PREFIX = "manufact-pricing-2026-05-27"
          files = [
              ("manufact_text", f"{PREFIX}/manufact-pricing-text.md"),
              ("manufact_pricing_json", f"{PREFIX}/manufact-pricing-pricing-extracted.json"),
              ("mcpuse_text", f"{PREFIX}/mcp-use-docs-home-text.md"),
          ]
          inlined = {}
          for key, path in files:
              raw = sb.storage.from_("ci-evidence").download(path)
              inlined[key] = raw.decode("utf-8", errors="replace")
              print(f"loaded {key}: {len(raw)} bytes")

          # Patch the SUMMIT row's delivery_proof to embed text
          row = sb.postgrest.from_("summit_chat_dispatch").select("delivery_proof").eq("id", os.environ["SUMMIT_ID"]).single().execute()
          proof = row.data.get("delivery_proof") or {}
          proof["inlined_text"] = inlined
          sb.postgrest.from_("summit_chat_dispatch").update({"delivery_proof": proof}).eq("id", os.environ["SUMMIT_ID"]).execute()
          print("inlined into delivery_proof.inlined_text")
          PYEOF
