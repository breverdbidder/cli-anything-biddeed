name: close-stale-203
on:
  workflow_dispatch:
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 203,
              body: `## Root Cause Fixed (commit \`2c5b9cc0\`)

**GHA tracking ID**: GHA-950854
**Workflow**: \`.github/workflows/deploy-paperclip.yml\` (SHIP-001: Deploy Paperclip → ops.biddeed.ai)

**Root cause:**
YAML syntax error in \`deploy-paperclip.yml\` — bare quotes at column 0 in SSH heredoc blocks caused GitHub Actions to reject the workflow file, producing 0-second "workflow file issue" failures.

**Fix applied:**
Commit \`2c5b9cc0\` (2026-03-29 14:11 UTC): repaired YAML syntax across 8 broken workflows including \`deploy-paperclip.yml\` — collapsed multi-line blocks with bare quotes to properly escaped single lines.

**Verification (VERIFIED):**
- YAML parse: \`python3 -c "import yaml; yaml.safe_load(open('.github/workflows/deploy-paperclip.yml'))"\` → YAML VALID ✅
- Workflow trigger: \`workflow_dispatch\` only (no automated triggers, no recurrence) ✅
- 10 fix commits applied to deploy-paperclip.yml since initial creation ✅
- Failing run GHA-950854 predates all fixes — stale pre-fix failure ✅

Stale issue — closing.`
            });
            await github.rest.issues.update({
              owner: 'breverdbidder',
              repo: 'cli-anything-biddeed',
              issue_number: 203,
              state: 'closed'
            });
