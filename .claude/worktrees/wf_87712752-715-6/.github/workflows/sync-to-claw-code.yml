name: Sync Secrets to Claw-Code

on:
  workflow_dispatch:

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install dependencies
        run: pip install pynacl

      - name: Sync DIFY_API_KEY to claw-code
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DIFY_KEY: ${{ secrets.DIFY_API_KEY }}
          HETZNER_IP_VAL: "87.99.129.125"
        run: |
          python3 << 'PYEOF'
          import base64, json, os, urllib.request
          from nacl import encoding, public

          TOKEN = os.environ["GH_TOKEN"]
          REPO = "breverdbidder/claw-code"

          def get_public_key():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/public-key",
                  headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.v3+json"}
              )
              return json.loads(urllib.request.urlopen(req).read())

          def encrypt_secret(public_key_b64, secret_value):
              pk = public.PublicKey(public_key_b64.encode("utf-8"), encoding.Base64Encoder())
              box = public.SealedBox(pk)
              encrypted = box.encrypt(secret_value.encode("utf-8"))
              return base64.b64encode(encrypted).decode("utf-8")

          def set_secret(name, value):
              key_data = get_public_key()
              encrypted = encrypt_secret(key_data["key"], value)
              data = json.dumps({"encrypted_value": encrypted, "key_id": key_data["key_id"]}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  data=data, method="PUT",
                  headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json"}
              )
              urllib.request.urlopen(req)
              print(f"✅ Set {name}")

          # Sync secrets
          dify_key = os.environ.get("DIFY_KEY", "")
          if dify_key:
              set_secret("DIFY_API_KEY", dify_key)
          set_secret("HETZNER_IP", os.environ["HETZNER_IP_VAL"])
          print("All secrets synced.")
          PYEOF

      - name: Trigger claw-code verification
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/claw-code/actions/workflows/sprint4-verify.yml/dispatches" \
            -d '{"ref":"main"}' && echo "✅ Triggered sprint4-verify.yml"
