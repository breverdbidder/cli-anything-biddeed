name: SSOT Consolidation (Sequential)
on:
  workflow_dispatch:

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Consolidate all 67 counties sequentially
        env:
          SB_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 SSOT Consolidation — 67 counties sequential"
          echo "================================================"
          
          SUCCESS=0
          FAILED=0
          TOTAL=0
          
          for CO in $(seq 11 77); do
            echo -n "co=$CO: "
            RESULT=$(curl -s --max-time 300 "$SB_URL/rest/v1/rpc/consolidate_county" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_co_no\": $CO}" 2>&1)
            
            if echo "$RESULT" | grep -q '"inserted"'; then
              COUNTY=$(echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{d[\"county\"]:20} {d[\"inserted\"]:>8} ins | {d[\"zoned\"]:>6} zoned | {d[\"luse\"]:>6} luse')" 2>/dev/null)
              INS=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)['inserted'])" 2>/dev/null)
              TOTAL=$((TOTAL + INS))
              SUCCESS=$((SUCCESS + 1))
              echo "✅ $COUNTY"
            else
              FAILED=$((FAILED + 1))
              echo "❌ $(echo $RESULT | head -c 80)"
            fi
            
            sleep 30
          done
          
          echo ""
          echo "================================================"
          echo "✅ SUCCESS: $SUCCESS counties"
          echo "❌ FAILED:  $FAILED counties"
          echo "📊 TOTAL PARCELS: $TOTAL"
