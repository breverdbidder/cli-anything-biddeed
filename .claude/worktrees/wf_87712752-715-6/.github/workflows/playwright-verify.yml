name: "Playwright Verify — Hetzner SSH (generic)"
# Issue: breverdbidder/cli-anything-biddeed#105
#
# Enterprise-grade Playwright verification workflow that SSHes to Hetzner and runs
# browser automation against any URL with configurable CSS selector checks.
#
# Checks performed:
#   1. http_status        — no HTTP 500 errors
#   2. content_length     — smart threshold: 100 chars for chat UIs, 500 for standard pages
#   3. selectors          — all provided CSS selectors found
#   4. desktop_render     — screenshot at 1280×800 viewport → Supabase upload
#   5. mobile_render      — screenshot at 375×812 viewport (no horizontal overflow) → Supabase upload
#   6. console_errors     — zero JavaScript errors in browser console
#   7. functional_test    — fill textarea, submit, wait 20s, validate keyword response
#   8. functional_screenshot — post-response screenshot → Supabase upload
#
# Screenshots uploaded to Supabase storage bucket deployment-screenshots/ with public URLs.
# Results posted as GitHub issue comment with screenshot URLs and ENTERPRISE-GRADE verdict.
#
# Auto-repair loop: if checks fail, triggers workflow_dispatch on the repair_workflow
# input (if provided) and re-runs up to max_attempts times.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to verify (e.g. https://zonewise.ai/chat-v2)"
        required: true
        default: "https://zonewise.ai"
      selectors:
        description: "Comma-separated CSS selectors that must exist (e.g. h1,.nav,#app)"
        required: false
        default: ""
      repair_workflow:
        description: "Workflow filename to trigger on failure for auto-repair (e.g. deploy-landing-pages.yml)"
        required: false
        default: ""
      max_attempts:
        description: "Max verify+repair loop iterations (default 3)"
        required: false
        default: "3"
      issue_number:
        description: "GitHub issue number to post results to (optional)"
        required: false
        default: ""
      enable_functional_test:
        description: "Enable functional test — fill textarea + submit + validate response (true/false)"
        required: false
        default: "true"
      test_address:
        description: "Address to submit in textarea for functional test"
        required: false
        default: "1600 Orlando Ave Cocoa Beach FL"
      response_keywords:
        description: "Comma-separated keywords to validate in functional test response"
        required: false
        default: "parcel,zone,residential,zoning"

jobs:
  playwright-verify:
    name: "Playwright verify — ${{ inputs.url }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── SSH to Hetzner — Playwright verify + auto-repair loop ─────────────────
      - name: "Run Playwright verify loop on Hetzner"
        id: playwright
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_URL: ${{ inputs.url }}
          CSS_SELECTORS: ${{ inputs.selectors }}
          REPAIR_WORKFLOW: ${{ inputs.repair_workflow }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '3' }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: "breverdbidder/cli-anything-biddeed"
          ENABLE_FUNCTIONAL_TEST: ${{ inputs.enable_functional_test || 'true' }}
          TEST_ADDRESS: ${{ inputs.test_address || '1600 Orlando Ave Cocoa Beach FL' }}
          RESPONSE_KEYWORDS: ${{ inputs.response_keywords || 'parcel,zone,residential,zoning' }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          timeout: 60s
          command_timeout: 80m
          envs: TARGET_URL,CSS_SELECTORS,REPAIR_WORKFLOW,MAX_ATTEMPTS,ISSUE_NUMBER,SUPABASE_URL,SUPABASE_KEY,TG_TOKEN,TG_CHAT,GH_PAT,REPO,ENABLE_FUNCTIONAL_TEST,TEST_ADDRESS,RESPONSE_KEYWORDS
          script: |
            set -euo pipefail
            WORK_DIR="/tmp/pw-verify-$(date +%s)"
            mkdir -p "$WORK_DIR" && cd "$WORK_DIR"

            # ── Install / cache node_modules ────────────────────────────────────
            CACHE_DIR="/tmp/pw-verify-cache"
            if [ -d "$CACHE_DIR/node_modules" ]; then
              cp -r "$CACHE_DIR/node_modules" ./node_modules
              echo "[cache] Using cached node_modules"
            else
              npm init -y > /dev/null 2>&1
              npm install playwright > /dev/null 2>&1
              npx playwright install chromium --with-deps > /dev/null 2>&1
              mkdir -p "$CACHE_DIR"
              cp -r ./node_modules "$CACHE_DIR/" || true
              echo "[deps] Installed playwright + chromium"
            fi

            # ── Write verify script ─────────────────────────────────────────────
            cat > verify.js << 'VERIFYEOF'
            'use strict';
            const { chromium } = require('playwright');
            const fs   = require('fs');
            const http  = require('http');
            const https = require('https');
            const { execSync } = require('child_process');

            const TARGET          = process.env.TARGET_URL             || '';
            const SELECTORS       = (process.env.CSS_SELECTORS || '').split(',').map(s => s.trim()).filter(Boolean);
            const SUPA_URL        = process.env.SUPABASE_URL            || '';
            const SUPA_KEY        = process.env.SUPABASE_KEY            || '';
            const TG_TOKEN        = process.env.TG_TOKEN                || '';
            const TG_CHAT         = process.env.TG_CHAT                 || '';
            const GH_PAT          = process.env.GH_PAT                  || '';
            const ISSUE_NUM       = process.env.ISSUE_NUMBER            || '';
            const REPO            = process.env.REPO                    || '';
            const FUNC_ENABLED    = (process.env.ENABLE_FUNCTIONAL_TEST || 'true') === 'true';
            const TEST_ADDRESS    = process.env.TEST_ADDRESS            || '1600 Orlando Ave Cocoa Beach FL';
            const RESP_KEYWORDS   = (process.env.RESPONSE_KEYWORDS || 'parcel,zone,residential,zoning').split(',').map(s => s.trim());

            const DESKTOP_SS  = '/tmp/verify-desktop.png';
            const MOBILE_SS   = '/tmp/verify-mobile.png';
            const FUNC_SS     = '/tmp/verify-functional.png';
            const RESULTS     = [];

            function log(name, passed, detail) {
              RESULTS.push({ name, passed, detail });
              console.log(`${passed ? '✅' : '❌'} [${name}]: ${detail}`);
            }

            // ── HTTP helpers ──────────────────────────────────────────────────
            function httpReq(options, body) {
              return new Promise((resolve, reject) => {
                const lib = (options.hostname || '').includes('localhost') ? http : https;
                const req = lib.request(options, res => {
                  const chunks = [];
                  res.on('data', c => chunks.push(c));
                  res.on('end', () => resolve({ status: res.statusCode, body: Buffer.concat(chunks).toString() }));
                });
                req.on('error', reject);
                if (body) {
                  const buf = Buffer.isBuffer(body) ? body : Buffer.from(typeof body === 'string' ? body : JSON.stringify(body));
                  req.write(buf);
                }
                req.end();
              });
            }

            async function sendTelegram(text, photoPath) {
              if (!TG_TOKEN || !TG_CHAT) return;
              try {
                if (photoPath && fs.existsSync(photoPath)) {
                  const photo    = fs.readFileSync(photoPath);
                  const boundary = `----Boundary${Date.now()}`;
                  const bodyBuf  = Buffer.concat([
                    Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n${TG_CHAT}\r\n`),
                    Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="caption"\r\n\r\n${text.slice(0,1024)}\r\n`),
                    Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="parse_mode"\r\n\r\nMarkdown\r\n`),
                    Buffer.from(`--${boundary}\r\nContent-Disposition: form-data; name="photo"; filename="screenshot.png"\r\nContent-Type: image/png\r\n\r\n`),
                    photo,
                    Buffer.from(`\r\n--${boundary}--\r\n`),
                  ]);
                  await httpReq({
                    hostname: 'api.telegram.org',
                    path: `/bot${TG_TOKEN}/sendPhoto`,
                    method: 'POST',
                    headers: {
                      'Content-Type': `multipart/form-data; boundary=${boundary}`,
                      'Content-Length': bodyBuf.length,
                    },
                  }, bodyBuf);
                } else {
                  const msgBody = JSON.stringify({ chat_id: TG_CHAT, text: text.slice(0,4096), parse_mode: 'Markdown' });
                  await httpReq({
                    hostname: 'api.telegram.org',
                    path: `/bot${TG_TOKEN}/sendMessage`,
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(msgBody) },
                  }, msgBody);
                }
              } catch (e) {
                console.error('[telegram] send failed:', e.message);
              }
            }

            async function uploadToSupabase(screenshotPath, filename) {
              if (!SUPA_URL || !SUPA_KEY || !fs.existsSync(screenshotPath)) return null;
              try {
                const data = fs.readFileSync(screenshotPath);
                const host = new URL(SUPA_URL).hostname;
                const remotePath = `playwright-verify/${filename}`;
                const res = await httpReq({
                  hostname: host,
                  path: `/storage/v1/object/deployment-screenshots/${remotePath}`,
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${SUPA_KEY}`,
                    apikey: SUPA_KEY,
                    'Content-Type': 'image/png',
                    'Content-Length': data.length,
                    'x-upsert': 'true',
                  },
                }, data);
                if (res.status >= 200 && res.status < 300) {
                  return `${SUPA_URL}/storage/v1/object/public/deployment-screenshots/${remotePath}`;
                }
                console.error(`[supabase] upload HTTP ${res.status}: ${res.body}`);
                return null;
              } catch (e) {
                console.error('[supabase] upload error:', e.message);
                return null;
              }
            }

            async function persistCheck(payload) {
              if (!SUPA_URL || !SUPA_KEY) return;
              try {
                const body = JSON.stringify(payload);
                await httpReq({
                  hostname: new URL(SUPA_URL).hostname,
                  path: '/rest/v1/deployment_checks',
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${SUPA_KEY}`,
                    apikey: SUPA_KEY,
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body),
                    Prefer: 'return=minimal',
                  },
                }, body);
              } catch (e) {
                console.error('[supabase] persist error:', e.message);
              }
            }

            async function commentOnIssue(body) {
              if (!GH_PAT || !ISSUE_NUM || !REPO) return;
              try {
                const [owner, repo] = REPO.split('/');
                const msgBody = JSON.stringify({ body });
                await httpReq({
                  hostname: 'api.github.com',
                  path: `/repos/${owner}/${repo}/issues/${ISSUE_NUM}/comments`,
                  method: 'POST',
                  headers: {
                    Authorization: `token ${GH_PAT}`,
                    Accept: 'application/vnd.github.v3+json',
                    'User-Agent': 'playwright-verify-workflow',
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(msgBody),
                  },
                }, msgBody);
                console.log('[github] comment posted on issue #' + ISSUE_NUM);
              } catch (e) {
                console.error('[github] comment failed:', e.message);
              }
            }

            // ── Check 1: HTTP status (no 500) ─────────────────────────────────
            async function checkHttpStatus() {
              try {
                const url = new URL(TARGET);
                const lib = url.protocol === 'https:' ? https : http;
                const status = await new Promise((resolve, reject) => {
                  const req = lib.request({ hostname: url.hostname, path: url.pathname + url.search, method: 'HEAD' }, res => resolve(res.statusCode));
                  req.on('error', reject);
                  req.end();
                });
                log('http_status', status < 500, `HTTP ${status}`);
              } catch (e) {
                log('http_status', false, `Request error: ${e.message}`);
              }
            }

            // ── Main verify ───────────────────────────────────────────────────
            (async () => {
              await checkHttpStatus();

              const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });

              // Desktop viewport
              const desktop = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const dPage   = await desktop.newPage();

              // ── Console error monitoring ───────────────────────────────────────
              const consoleErrors = [];
            const IGNORED_404_PATTERNS = ['/favicon', '/manifest', '/sw.js', '/service-worker', '/icon', '/_next/static', '/robots.txt', '/sitemap'];
              dPage.on('console', msg => {
                if (msg.type() === 'error' && !IGNORED_404_PATTERNS.some(p => msg.text().includes(p)) && !msg.text().includes('404')) {
                  const text = msg.text();
                  // Exclude net::ERR_* — these are external resource load failures,
                  // not JS application errors (e.g. ERR_NAME_NOT_RESOLVED from broken CDN URLs)
                  if (!text.includes('net::ERR_')) consoleErrors.push(text);
                }
              });
              dPage.on('pageerror', err => consoleErrors.push(err.message));

              try {
                const resp = await dPage.goto(TARGET, { waitUntil: 'networkidle', timeout: 60000 });
                if (resp && resp.status() >= 500) {
                  log('desktop_render', false, `HTTP ${resp.status()} on navigation`);
                } else {
                  await dPage.screenshot({ path: DESKTOP_SS, fullPage: false });
                  log('desktop_render', true, `Screenshot saved → ${DESKTOP_SS}`);
                }

                // ── Smart content length check ─────────────────────────────────
                const bodyText = await dPage.evaluate(() => document.body ? document.body.innerText : '');
                const hasTextarea = (await dPage.locator('[aria-label="Message input"], .aui-composer-input, textarea').count()) > 0;
                // assistant-ui Composer uses contenteditable, not textarea — detect both
                const hasContentEditable = (await dPage.locator('[contenteditable="true"], [role="textbox"]').count()) > 0;
                const hasComposerInput = hasTextarea || hasContentEditable;
                const contentThreshold = hasComposerInput ? 100 : 500;
                log('content_length', bodyText.length > contentThreshold,
                  `${bodyText.length} chars visible text (threshold: ${contentThreshold} — ${hasComposerInput ? 'chat UI detected' : 'standard page'})`);

                // ── CSS selector checks ────────────────────────────────────────
                for (const sel of SELECTORS) {
                  const count = await dPage.locator(sel).count();
                  log(`selector:${sel}`, count > 0, count > 0 ? `found ${count} element(s)` : 'NOT FOUND');
                }

                // ── Console error check ────────────────────────────────────────
                log('console_errors', consoleErrors.length === 0,
                  consoleErrors.length === 0
                    ? 'No JavaScript errors detected'
                    : `${consoleErrors.length} error(s): ${consoleErrors.slice(0, 3).join(' | ')}`);

                // ── Functional test: fill composer input + submit + validate ────
                // Supports textarea (standard) and contenteditable/role="textbox" (assistant-ui)
                if (FUNC_ENABLED && hasComposerInput) {
                  try {
                    const inputSel = hasTextarea
                      ? '[aria-label="Message input"], .aui-composer-input, textarea'
                      : '[contenteditable="true"], [role="textbox"]';
                    const ta = dPage.locator(inputSel).first();
                    await ta.click({ force: true, timeout: 15000 }).catch(() => {});
                    await dPage.keyboard.type(TEST_ADDRESS, { delay: 30 });
                    await ta.press('Enter');
                    console.log(`[functional] Submitted "${TEST_ADDRESS}" — waiting 20s for response...`);
                    await dPage.waitForTimeout(20000);

                    const responseText = await dPage.evaluate(() => document.body ? document.body.innerText : '');
                    const matchedKw = RESP_KEYWORDS.find(k => responseText.toLowerCase().includes(k.toLowerCase()));
                    log('functional_test', !!matchedKw,
                      matchedKw
                        ? `Response contains keyword "${matchedKw}"`
                        : `No keywords found (${RESP_KEYWORDS.join(',')}) in ${responseText.length}-char response`);

                    await dPage.screenshot({ path: FUNC_SS, fullPage: false });
                    log('functional_screenshot', true, `Post-response screenshot saved → ${FUNC_SS}`);
                  } catch (fe) {
                    log('functional_test', false, `Functional test error: ${fe.message}`);
                  }
                } else if (FUNC_ENABLED && !hasComposerInput) {
                  log('functional_test', true, 'SKIPPED — no textarea or contenteditable found on page');
                }
              } catch (e) {
                log('desktop_render', false, `Error: ${e.message}`);
              }

              await desktop.close();

              // Mobile viewport — check no horizontal overflow
              const mobile  = await browser.newContext({ viewport: { width: 375, height: 812 }, isMobile: true });
              const mPage   = await mobile.newPage();

              try {
                await mPage.goto(TARGET, { waitUntil: 'networkidle', timeout: 60000 });
                const scrollWidth = await mPage.evaluate(() => document.documentElement.scrollWidth);
                const clientWidth = await mPage.evaluate(() => document.documentElement.clientWidth);
                log('mobile_render', scrollWidth <= clientWidth + 5,
                  `scrollWidth=${scrollWidth} clientWidth=${clientWidth}${scrollWidth > clientWidth + 5 ? ' — HORIZONTAL OVERFLOW' : ''}`);
                await mPage.screenshot({ path: MOBILE_SS, fullPage: false });
              } catch (e) {
                log('mobile_render', false, `Error: ${e.message}`);
              }

              await mobile.close();
              await browser.close();

              // ── Upload screenshots ─────────────────────────────────────────
              const ts = Date.now();
              const desktopUrl  = await uploadToSupabase(DESKTOP_SS, `desktop-${ts}.png`);
              const mobileUrl   = await uploadToSupabase(MOBILE_SS,  `mobile-${ts}.png`);
              const funcUrl     = await uploadToSupabase(FUNC_SS,    `functional-${ts}.png`);
              log('supabase_desktop_upload', !!desktopUrl, desktopUrl ? `Uploaded → ${desktopUrl}` : 'Upload failed — check SUPABASE_URL/KEY');
              log('supabase_mobile_upload',  !!mobileUrl,  mobileUrl  ? `Uploaded → ${mobileUrl}`  : 'Upload failed — check SUPABASE_URL/KEY');
              log('supabase_func_upload',    !!funcUrl,    funcUrl    ? `Uploaded → ${funcUrl}`    : 'Upload failed or functional screenshot not taken');

              // Pre-log results_posted intent (ISSUE_NUM known at this point)
              log('results_posted', !!ISSUE_NUM, ISSUE_NUM ? `Will post comment on issue #${ISSUE_NUM}` : 'SKIPPED — no issue_number provided');

              // ── Compute allPassed AFTER all checks logged ──────────────────
              const allPassed = RESULTS.every(r => r.passed);

              // ── Persist results ────────────────────────────────────────────
              await persistCheck({
                url: TARGET,
                checks: RESULTS,
                all_passed: allPassed,
                desktop_screenshot_url: desktopUrl,
                mobile_screenshot_url: mobileUrl,
                created_at: new Date().toISOString(),
              });

              // ── Build result summary ───────────────────────────────────────
              const rows = RESULTS.map(r => `| ${r.passed ? '✅' : '❌'} | \`${r.name}\` | ${r.detail} |`).join('\n');
              const enterpriseChecks = ['http_status','desktop_render','mobile_render','content_length','console_errors','functional_test','supabase_desktop_upload','supabase_mobile_upload','supabase_func_upload','results_posted'];
              const enterprisePassed = enterpriseChecks.every(c => {
                const r = RESULTS.find(x => x.name === c);
                return !r || r.passed;
              }) && allPassed;
              const verdict = enterprisePassed ? '🏆 ENTERPRISE-GRADE' : '⚠️  NOT ENTERPRISE-GRADE';
              const summary = [
                `## Playwright Verify — ${allPassed ? '✅ ALL PASS' : '❌ FAILURES DETECTED'}`,
                `**URL:** ${TARGET}`,
                `**Timestamp:** ${new Date().toISOString()}`,
                `**Verdict:** ${verdict}`,
                '',
                '| Status | Check | Detail |',
                '|--------|-------|--------|',
                rows,
                '',
                desktopUrl  ? `**Desktop screenshot:** [view](${desktopUrl})`    : '**Desktop screenshot:** saved to /tmp/verify-desktop.png on Hetzner',
                mobileUrl   ? `**Mobile screenshot:** [view](${mobileUrl})`     : '**Mobile screenshot:** saved to /tmp/verify-mobile.png on Hetzner',
                funcUrl     ? `**Functional screenshot:** [view](${funcUrl})`   : '',
              ].filter(l => l !== '').join('\n');

              console.log('\n' + summary);

              // Post to GitHub issue if configured
              if (ISSUE_NUM) {
                await commentOnIssue(summary);
              }

              // Send Telegram notification
              const tgText = `*Playwright Verify* — ${allPassed ? '✅ PASS' : '❌ FAIL'}\n${verdict}\nURL: ${TARGET}\n${RESULTS.map(r => `${r.passed ? '✅' : '❌'} ${r.name}`).join('\n')}`;
              await sendTelegram(tgText, allPassed ? null : DESKTOP_SS);

              // Exit 1 if any check failed so the loop can detect it
              if (!allPassed) process.exit(1);
            })();
            VERIFYEOF

            # ── Verify + repair loop ────────────────────────────────────────────
            ATTEMPT=0
            ALL_PASSED=false

            while [ "$ATTEMPT" -lt "${MAX_ATTEMPTS}" ]; do
              ATTEMPT=$((ATTEMPT + 1))
              cd "$WORK_DIR"
              echo ""
              echo "═══════════════════════════════════════════════════════════════"
              echo "  Playwright verify — attempt ${ATTEMPT}/${MAX_ATTEMPTS}  │  $(date -u)"
              echo "  Target: ${TARGET_URL}"
              echo "═══════════════════════════════════════════════════════════════"

              if node verify.js; then
                ALL_PASSED=true
                echo ""
                echo "✅ All checks passed on attempt ${ATTEMPT}."
                break
              else
                echo ""
                echo "❌ Checks failed on attempt ${ATTEMPT}."

                if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then
                  echo "  Running autorepair-loop.py on failure results..."
                  cd /opt/biddeed/cli-anything-biddeed 2>/dev/null && git pull --ff-only 2>/dev/null || true
                  if [ -f "/opt/biddeed/cli-anything-biddeed/scripts/autorepair-loop.py" ]; then
                    GH_PAT="${GH_PAT}" python3 /opt/biddeed/cli-anything-biddeed/scripts/autorepair-loop.py /tmp/verify-results.json                       && echo "  ✅ Autorepair applied fix(es)"                       || echo "  ⚠️ Autorepair found no fix"
                    echo "  Waiting 120s for deploy-prod to complete..."
                    sleep 120
                  fi
                  if [ -n "${REPAIR_WORKFLOW}" ] && [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then
                    echo "  Triggering repair workflow: ${REPAIR_WORKFLOW}"
                  DISPATCH_BODY="{\"ref\":\"main\"}"
                  curl -s -X POST \
                    -H "Authorization: token ${GH_PAT}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    -H "Content-Type: application/json" \
                    -d "${DISPATCH_BODY}" \
                    "https://api.github.com/repos/${REPO}/actions/workflows/${REPAIR_WORKFLOW}/dispatches" \
                    && echo "  Repair workflow dispatched." || echo "  ⚠️  Repair dispatch failed (continuing)."

                  echo "  Waiting 90s for repair to take effect..."
                  sleep 90
                  fi
                fi
              fi
            done

            if [ "$ALL_PASSED" = "false" ]; then
              echo ""
              echo "❌ FAILED after ${MAX_ATTEMPTS} attempt(s). Manual intervention required."
              exit 1
            fi
