name: "Diagnose Firecrawl valid action types"
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet httpx
      - name: Probe valid action types
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import httpx, json, os

          FC = os.environ['FIRECRAWL_API_KEY']
          H  = {"Authorization": f"Bearer {FC}", "Content-Type": "application/json"}

          def try_action(label, action):
              payload = {
                  "url": "https://example.com",
                  "formats": ["html"],
                  "actions": [action],
              }
              r = httpx.post("https://api.firecrawl.dev/v1/scrape", headers=H, json=payload, timeout=30.0)
              print(f"\n=== {label} ===")
              print(f"HTTP {r.status_code}: {r.text[:500]}")

          # Probe different wait action type names
          try_action("wait with milliseconds", {"type": "wait", "milliseconds": 500})
          try_action("delay with milliseconds", {"type": "delay", "milliseconds": 500})
          try_action("pause with ms", {"type": "pause", "ms": 500})
          try_action("sleep", {"type": "sleep", "milliseconds": 500})

          # Probe if click alone works (to confirm click is valid)
          try_action("click alone (expect valid)", {"type": "click", "selector": "body"})

          # Probe type (should still be valid)
          try_action("type alone", {"type": "type", "selector": "body", "text": "test"})

          # Probe navigate (should be valid)
          try_action("navigate alone", {"type": "navigate", "url": "https://example.com"})

          # Try getting API docs / schema
          print("\n=== GET /v1 API info ===")
          r = httpx.get("https://api.firecrawl.dev/", headers=H, timeout=10.0)
          print(f"HTTP {r.status_code}: {r.text[:300]}")
          PYEOF
