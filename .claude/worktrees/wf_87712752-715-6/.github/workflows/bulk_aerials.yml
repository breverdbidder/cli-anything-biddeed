name: Bulk Aerials — 9 Properties

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          MAPBOX:     ${{ secrets.MAPBOX_TOKEN }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "echo MAPBOX_TOKEN=${MAPBOX} > /tmp/mb.env" 2>/dev/null || true

          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/bulk && mkdir -p /tmp/bulk
          cd /tmp/bulk

          cat > scrape.py <<'PY'
          import json, os, time
          from pathlib import Path
          import urllib.request, urllib.parse

          OUT = Path('/tmp/bulk')
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127"

          # 9 properties needing aerials
          PROPERTIES = [
              {"id": "lakewood",   "addr": "1581 Lakewood Drive NE, Palm Bay, FL 32905"},
              {"id": "mims",       "addr": "4050 US Highway 1, Mims, FL 32754"},
              {"id": "rainsville", "addr": "1548 Rainsville Street SE, Palm Bay, FL 32909"},
              {"id": "district",   "addr": "211 District Street SE, Palm Bay, FL 32909"},
              {"id": "fillmore",   "addr": "478 Fillmore Avenue NE, Palm Bay, FL 32907"},
              {"id": "copenhaver", "addr": "342 Copenhaver Avenue NE, Palm Bay, FL 32907"},
              {"id": "eldron",     "addr": "3120 Eldron Boulevard SE, Palm Bay, FL 32909"},
              {"id": "kirkland",   "addr": "1107 Kirkland Drive, Cocoa, FL 32922"},
              {"id": "pompano",    "addr": "1036 Pompano Drive, Rockledge, FL 32955"},
          ]

          def http_get(url, timeout=25):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              return urllib.request.urlopen(req, timeout=timeout)

          def geocode(addr, token):
              q = urllib.parse.quote(addr)
              url = f"https://api.mapbox.com/geocoding/v5/mapbox.places/{q}.json?access_token={token}&limit=1&country=us"
              try:
                  with http_get(url, timeout=15) as r:
                      data = json.loads(r.read())
                  if data.get('features'):
                      lng, lat = data['features'][0]['center']
                      return lat, lng
              except Exception as e:
                  print(f"    geocode err: {e}", flush=True)
              return None

          def fetch_aerial(lat, lng, prop_id, view, token):
              configs = {
                  "close": (f"{lng},{lat},19,0", "satellite-streets-v12"),
                  "wide":  (f"{lng},{lat},17,0", "satellite-streets-v12"),
                  "neighborhood": (f"{lng},{lat},16,0", "satellite-streets-v12"),
                  "pure":  (f"{lng},{lat},18,0", "satellite-v9"),
                  "3d":    (f"{lng},{lat},18.5,15,60", "satellite-streets-v12"),
              }
              cfg, style = configs[view]
              url = f"https://api.mapbox.com/styles/v1/mapbox/{style}/static/{cfg}/1280x720?access_token={token}"
              try:
                  with http_get(url, timeout=25) as r:
                      data = r.read()
                  if len(data) < 5000:
                      return None
                  fname = f"{prop_id}_{view}.jpg"
                  (OUT / fname).write_bytes(data)
                  return fname, len(data)
              except Exception as e:
                  print(f"    {view} err: {str(e)[:60]}", flush=True)
                  return None

          token = os.environ.get('MAPBOX_TOKEN','').strip()
          if not token:
              print("ERROR: NO MAPBOX_TOKEN", flush=True)
              raise SystemExit(1)
          print(f"Token loaded ({len(token)} chars)", flush=True)

          results = {}
          for p in PROPERTIES:
              print(f"\n=== {p['id']}: {p['addr']} ===", flush=True)
              geo = geocode(p['addr'], token)
              if not geo:
                  print(f"  GEOCODE FAILED", flush=True)
                  continue
              lat, lng = geo
              print(f"  lat={lat}, lng={lng}", flush=True)
              prop_results = {"lat": lat, "lng": lng, "files": []}
              for view in ["close", "3d", "wide", "pure", "neighborhood"]:
                  res = fetch_aerial(lat, lng, p['id'], view, token)
                  if res:
                      fname, size = res
                      prop_results["files"].append({"view": view, "file": fname, "size": size})
                      print(f"    {view}: {size}b -> {fname}", flush=True)
                  time.sleep(0.3)
              results[p['id']] = prop_results

          with open(OUT / 'manifest.json', 'w') as f:
              json.dump(results, f, indent=2, default=str)
          total = sum(len(r['files']) for r in results.values())
          print(f"\n>>> Total: {total} aerials across {len(results)} properties", flush=True)
          PY

          [ -f /tmp/mb.env ] && export $(cat /tmp/mb.env | xargs) || true
          python3 scrape.py 2>&1 | tee run.log
          echo "---"
          ls -la /tmp/bulk/ | head -60
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/bulk/ /tmp/results/ || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk_aerials
          path: /tmp/results/
          retention-days: 90
