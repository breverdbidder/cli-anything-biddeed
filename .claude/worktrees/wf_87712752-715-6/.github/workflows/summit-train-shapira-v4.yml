# summit-train-shapira-v4.yml
# Target repo path: breverdbidder/cli-anything-biddeed/.github/workflows/summit-train-shapira-v4.yml
# Trains the Shapira V4 stacked-ensemble CANDIDATE (is_production=false). Promotion is a separate gated step.
# Mirrors the V14 trainer pattern. UNTESTED until first green run.

name: "SUMMIT-B · Train Shapira V4 Ensemble (CANDIDATE)"

on:
  workflow_dispatch:
    inputs:
      training_rows_target:
        description: "Target labeled rows from multi_county_auctions"
        type: string
        default: "204000"
      candidate_only:
        description: "Write is_production=false only (never auto-promote)"
        type: boolean
        default: true
      reconciled_against_v14:
        description: "Confirm feature transforms reconciled vs xgboost_model_v14.py (set true to proceed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shapira-train-v4
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — require reconciliation flag
        if: ${{ inputs.reconciled_against_v14 != true }}
        run: |
          echo "::error::reconciled_against_v14=false — V4 feature transforms not yet confirmed vs V14 source."
          echo "Set the input to true only after parity is verified. Halting to avoid an invalid candidate."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install xgboost lightgbm catboost scikit-learn pandas numpy psycopg2-binary

      - name: Train V4 candidate
        env:
          SUPABASE_DB_DSN: ${{ secrets.SUPABASE_DB_DSN }}     # secret NAME only
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python brevard-bidder-scraper/src/models/ensemble_model_v4.py 2>&1 | tee v4_train.log

      - name: Upload training log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapira-v4-train-log
          path: v4_train.log

# After a green run: a NEW shapira_models row exists with model_version='v4.0', is_production=false.
# Compare its auc/cv_auc vs V14 (0.7834 / 0.7785). PROMOTE only on a validated win + EG14 + Ariel sign-off.
