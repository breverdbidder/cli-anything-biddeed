name: UTCC Batch Dispatcher

on:
  repository_dispatch:
    types: [utcc-batch-dispatch]

jobs:
  prepare:
    name: "Resolve Batch Tasks"
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.query.outputs.tasks }}
      batch_id: ${{ steps.query.outputs.batch_id }}
      count: ${{ steps.query.outputs.count }}
    steps:
      - name: Query task_registry for batch
        id: query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
        run: |
          BATCH_ID="${BATCH_ID:-${{ github.event.client_payload.batch_id }}}"

          if [ -z "$BATCH_ID" ]; then
            echo "❌ No batch_id in client_payload"
            exit 1
          fi

          echo "batch_id=$BATCH_ID" >> $GITHUB_OUTPUT

          # Fetch all queued tasks for this batch
          # Use -s not -sf so we can handle table-not-found gracefully (migration may be pending)
          TASKS=$(curl -s \
            "${SUPABASE_URL}/rest/v1/task_registry?batch_id=eq.${BATCH_ID}&status=eq.queued&order=batch_index.asc" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json")
          # Check for table-not-found or empty response
          if echo "$TASKS" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if isinstance(d, list) else 1)" 2>/dev/null; then
            echo "✅ task_registry query OK"
          else
            echo "⚠️ task_registry table not found (migration pending) — batch $BATCH_ID deferred"
            echo "count=0" >> $GITHUB_OUTPUT
            echo "tasks=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT=$(echo "$TASKS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          TASKS_JSON=$(echo "$TASKS" | python3 -c "import sys,json; d=json.load(sys.stdin); out=[{'task_id':t.get('task_id',''),'task':t.get('description',''),'platform':t.get('platform','gha'),'task_type':t.get('task_type','claude')} for t in d]; print(json.dumps(out))" 2>/dev/null || echo '[]')
          {
            echo 'tasks<<TASKS_EOF'
            printf '%s\n' "$TASKS_JSON"
            echo 'TASKS_EOF'
          } >> $GITHUB_OUTPUT

          echo "=== Batch $BATCH_ID: $COUNT tasks ==="

  dispatch-hetzner:
    name: "Dispatch Hetzner Tasks"
    needs: prepare
    if: needs.prepare.outputs.count > 0
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{ fromJson(needs.prepare.outputs.tasks) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Skip non-Hetzner tasks
        if: matrix.task.platform != 'hetzner'
        run: echo "Skipping ${{ matrix.task.task_id }} — platform=${{ matrix.task.platform }}"

      - name: Update status to dispatching
        if: matrix.task.platform == 'hetzner'
        run: |
          curl -sf -X PATCH \
            "${{ secrets.SUPABASE_URL }}/rest/v1/task_registry?task_id=eq.${{ matrix.task.task_id }}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"dispatching"}' || true

      - name: Dispatch to utcc-executor-ssh
        if: matrix.task.platform == 'hetzner'
        env:
          TASK_ID: ${{ matrix.task.task_id }}
          TASK: ${{ matrix.task.task }}
          BATCH_ID: ${{ needs.prepare.outputs.batch_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg task_id "$TASK_ID" \
            --arg task "$TASK" \
            --arg batch_id "$BATCH_ID" \
            '{"event_type":"utcc-dispatch","client_payload":{"task_id":$task_id,"task":$task,"batch_id":$batch_id}}')
          curl -sf -X POST \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "✅ Dispatched ${TASK_ID} to Hetzner executor"

  dispatch-gha:
    name: "Dispatch GHA Tasks"
    needs: prepare
    if: needs.prepare.outputs.count > 0
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{ fromJson(needs.prepare.outputs.tasks) }}
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Skip non-GHA tasks
        if: matrix.task.platform != 'gha'
        run: echo "Skipping ${{ matrix.task.task_id }} — platform=${{ matrix.task.platform }}"

      - name: Update status to dispatching
        if: matrix.task.platform == 'gha'
        run: |
          curl -sf -X PATCH \
            "${{ secrets.SUPABASE_URL }}/rest/v1/task_registry?task_id=eq.${{ matrix.task.task_id }}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"dispatching"}' || true

      - name: Dispatch to GHA runner
        if: matrix.task.platform == 'gha'
        env:
          TASK_ID: ${{ matrix.task.task_id }}
          TASK: ${{ matrix.task.task }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg prompt "$TASK" \
            --arg repo "$REPO" \
            '{"ref":"main","inputs":{"prompt":$prompt,"repo":$repo}}')
          curl -sf -X POST \
            "https://api.github.com/repos/${REPO}/actions/workflows/dispatch-gha.yml/dispatches" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "✅ Dispatched ${TASK_ID} to GHA runner"

  notify-batch:
    name: "Batch Telegram Notification"
    needs: [prepare, dispatch-hetzner, dispatch-gha]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: |
          BATCH_ID="${{ needs.prepare.outputs.batch_id }}"
          COUNT="${{ needs.prepare.outputs.count }}"
          STATUS="${{ job.status }}"
          H_STATUS="${{ needs.dispatch-hetzner.result }}"
          G_STATUS="${{ needs.dispatch-gha.result }}"
          EMOJI=$( [ "$H_STATUS" = "success" ] && [ "$G_STATUS" = "success" ] && echo "✅" || echo "⚠️" )
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="${EMOJI} UTCC Batch Dispatched\nBatch: ${BATCH_ID}\nTasks: ${COUNT}\nHetzner: ${H_STATUS} | GHA: ${G_STATUS}\n${RUN_URL}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.BIDDEED_BOT_CHAT_ID }}\",\"text\":\"${MSG}\"}" \
            >/dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          echo "## UTCC Batch Dispatch — ${{ needs.prepare.outputs.count }} tasks" >> $GITHUB_STEP_SUMMARY
          echo "- **Batch ID**: ${{ needs.prepare.outputs.batch_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Hetzner**: ${{ needs.dispatch-hetzner.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GHA**: ${{ needs.dispatch-gha.result }}" >> $GITHUB_STEP_SUMMARY
