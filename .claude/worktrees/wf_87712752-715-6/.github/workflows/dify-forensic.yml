name: Dify forensic — check if Dify on Hetzner can execute agent tasks
on:
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and probe Dify
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "=== A: Dify process / docker containers ==="
          $SSH 'docker ps 2>/dev/null | grep -iE "dify|langgenius" || echo "no dify containers"; echo "---"; ps aux | grep -iE "dify" | grep -v grep | head -5 || echo "no dify processes"'

          echo
          echo "=== B: Dify exposed ports ==="
          $SSH 'ss -tlnp 2>/dev/null | grep -E ":(80|443|3000|5001|5002|8080|8081)" | head -20 || netstat -tlnp 2>/dev/null | grep -E ":(80|443|3000|5001|5002|8080|8081)" | head -20'

          echo
          echo "=== C: Dify health endpoint (local) ==="
          $SSH 'for port in 80 443 3000 5001 8080; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -m 3 "http://localhost:${port}/health" 2>/dev/null || echo "conn_fail")
            echo "  localhost:${port}/health → ${CODE}"
          done'

          echo
          echo "=== D: chat.zonewise.ai reachability ==="
          $SSH 'curl -sS -o /dev/null -w "chat.zonewise.ai/health: %{http_code}\n" -m 5 https://chat.zonewise.ai/health 2>&1 | head -3'

          echo
          echo "=== E: DIFY_API_KEY format check ==="
          if [ -z "$DIFY_API_KEY" ]; then
            echo "empty"
          else
            echo "len=${#DIFY_API_KEY} first6=${DIFY_API_KEY:0:6}..."
          fi

          echo
          echo "=== F: Dify API call via chat.zonewise.ai ==="
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer ${DIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"inputs":{},"query":"reply with only the word OK","response_mode":"blocking","user":"summit-smoke-test"}' \
            -m 20 https://chat.zonewise.ai/v1/chat-messages 2>&1)
          echo "len: ${#RESP}"
          echo "$RESP" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
              if 'answer' in d:
                  print(f\"  SUCCESS: {d['answer'][:100]!r}\")
              elif 'code' in d:
                  print(f\"  ERROR: {d.get('code','?')} — {d.get('message','?')[:200]}\")
              else:
                  print(f'  keys={list(d.keys())[:10]}')
          except Exception as e:
              print(f'  RAW (first 300): {\"$RESP\"[:300]}')"

          echo "=== END ==="
