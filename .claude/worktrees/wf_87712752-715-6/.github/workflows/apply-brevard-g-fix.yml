name: "fix(brevard-G): Apply kpi_auction view fix"
# Applies supabase/migrations/20260623_brevard_g_kpi_auction_fix.sql
# Root cause: v_zoning_gold_standard_kpi_auction returns 0 rows for brevard
# because Pass E SYN- stubs have zone_code='UNKNOWN', breaking INNER JOINs.
# Fix: rewrite view as wrapper over v_zoning_gold_standard_kpi_v3.
#
# DoD:
#   SELECT pct_zoning_known FROM v_zoning_gold_standard_kpi_auction WHERE county='brevard'
#   → row with pct_zoning_known ≥ 95
#   SELECT crit_g_pass FROM v_pencil_brevard_dod WHERE county='brevard' → true

on:
  workflow_dispatch: {}

jobs:
  apply-fix:
    name: "Apply brevard G kpi_auction fix"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: mocerqjnksmhcjzxrewo
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SB_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: "Apply migration via Management API"
        run: |
          set -euo pipefail
          MIGRATION="supabase/migrations/20260623_brevard_g_kpi_auction_fix.sql"
          echo "=== Applying $MIGRATION ==="
          python3 -c "import json; print(json.dumps({'query': open('$MIGRATION').read()}))" > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json; echo
          [[ "$HTTP" == "200" || "$HTTP" == "201" ]] || {
            echo "::error::Migration failed HTTP $HTTP"
            exit 1
          }
          echo "Migration applied OK"

      - name: "### SQL VERIFICATION — DoD check"
        if: always()
        run: |
          set -uo pipefail
          rq() {
            local label="$1"; local endpoint="$2"; local params="$3"
            echo "=== $label ==="
            curl -sS \
              "${SB_URL}/rest/v1/${endpoint}?${params}" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              -H "Accept: application/json"
            echo; echo
          }

          rq "DoD #1: v_zoning_gold_standard_kpi_auction brevard" \
            "v_zoning_gold_standard_kpi_auction" \
            "county=eq.brevard&select=county,pct_zoning_known,pct_density,pct_far"

          rq "DoD #2: v_pencil_brevard_dod G criterion" \
            "v_pencil_brevard_dod" \
            "county=eq.brevard&select=county,crit_g_pass,zoning_density_pct,zoning_far_pct&limit=1"

          rq "DoD #3: gold_standard_scoreboard brevard" \
            "gold_standard_scoreboard" \
            "county_slug=eq.brevard&select=county_slug,g_zoning,pass_count,gold_standard&limit=1"

          rq "DoD #4: sanity — duval still returns row" \
            "v_zoning_gold_standard_kpi_auction" \
            "county=eq.duval&select=county,pct_zoning_known"
