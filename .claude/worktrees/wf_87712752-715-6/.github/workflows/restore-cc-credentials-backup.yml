name: Restore CC Credentials Backup on Hetzner

# One-shot: restores the freshest /root/.claude/.credentials.json.pre-refresh.* backup
# to /root/.claude/.credentials.json so that hetzner-oauth-refresh.yml can read the
# refresh_token and attempt a fresh token exchange from GHA runner IP.
#
# Safety: never cats the credential file. Only inspects structural shape via jq
# field selectors (key names + value lengths/types, never values).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry_run = inspect only, do not copy'
        type: choice
        options: ['true', 'false']
        default: 'true'
      target_backup:
        description: 'Specific backup filename (or "auto" for freshest pre-refresh.*)'
        required: false
        default: 'auto'

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH + restore
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_BACKUP: ${{ inputs.target_backup }}
        run: |
          set -eo pipefail
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i $HOME/.ssh/key -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"

          echo "::group::A. Enumerate backups (size + mtime only, NO content)"
          $SSH "find /root/.claude /home/summit/.claude -maxdepth 2 -name '*credential*' -size +0 -printf '%T+ %s %p\n' 2>/dev/null | sort -r"
          echo "::endgroup::"

          echo "::group::B. Pick target backup"
          if [ "$TARGET_BACKUP" = "auto" ]; then
            # Freshest non-empty pre-refresh file under root (these have full claudeAiOauth shape)
            CHOSEN=$($SSH "ls -1t /root/.claude/.credentials.json.pre-refresh.* /root/.claude/.credentials.json.bak.* 2>/dev/null | while read f; do [ -s \"\$f\" ] && echo \"\$f\" && break; done")
          else
            CHOSEN="$TARGET_BACKUP"
          fi
          if [ -z "$CHOSEN" ]; then
            echo "::error::No non-empty backup found"
            exit 1
          fi
          echo "chosen_backup=$CHOSEN"
          $SSH "stat -c 'size=%s mtime=%y' '$CHOSEN'"
          echo "::endgroup::"

          echo "::group::C. Inspect token shape of chosen backup (keys + lengths only)"
          $SSH "jq '
            if has(\"claudeAiOauth\") then
              {
                wrapper: \"claudeAiOauth\",
                fields: (.claudeAiOauth | keys),
                access_token_len: (.claudeAiOauth.accessToken // \"\" | length),
                refresh_token_len: (.claudeAiOauth.refreshToken // \"\" | length),
                expires_at_ms: .claudeAiOauth.expiresAt,
                scopes: .claudeAiOauth.scopes,
                subscription: .claudeAiOauth.subscriptionType,
                rate_limit_tier: .claudeAiOauth.rateLimitTier
              }
            else
              {
                wrapper: \"flat\",
                fields: keys,
                access_token_len: (.accessToken // .access_token // \"\" | length),
                refresh_token_len: (.refreshToken // .refresh_token // \"\" | length),
                expires_at_ms: (.expiresAt // .expires_at)
              }
            end
          ' '$CHOSEN'"
          echo "::endgroup::"

          echo "::group::D. Expiry analysis"
          $SSH "
            EXP=\$(jq -r '.claudeAiOauth.expiresAt // .expiresAt // empty' '$CHOSEN')
            NOW_MS=\$((\$(date +%s) * 1000))
            if [ -n \"\$EXP\" ] && [ \"\$EXP\" != 'null' ]; then
              if [ \"\$EXP\" -gt \"\$NOW_MS\" ]; then
                REM=\$(((\$EXP - \$NOW_MS) / 1000))
                echo \"access_token: STILL VALID for \$REM seconds (about \$((REM/60)) min)\"
              else
                AGE=\$(((\$NOW_MS - \$EXP) / 1000 / 86400))
                echo \"access_token: EXPIRED \$AGE days ago (need refresh)\"
              fi
            else
              echo 'access_token: no expiry field — unknown state'
            fi
            # Refresh tokens commonly live 30-90 days. Show file age.
            BACKUP_MTIME=\$(stat -c %Y '$CHOSEN')
            BACKUP_AGE_DAYS=\$(((\$(date +%s) - \$BACKUP_MTIME) / 86400))
            echo \"backup_file_age: \$BACKUP_AGE_DAYS days\"
            echo \"if refresh_token TTL is 30 days: \$([ \$BACKUP_AGE_DAYS -lt 30 ] && echo PROBABLY_VALID || echo PROBABLY_EXPIRED)\"
            echo \"if refresh_token TTL is 60 days: \$([ \$BACKUP_AGE_DAYS -lt 60 ] && echo PROBABLY_VALID || echo PROBABLY_EXPIRED)\"
            echo \"if refresh_token TTL is 90 days: \$([ \$BACKUP_AGE_DAYS -lt 90 ] && echo PROBABLY_VALID || echo PROBABLY_EXPIRED)\"
          "
          echo "::endgroup::"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — not copying. Re-run with dry_run=false to perform the restore."
            exit 0
          fi

          echo "::group::E. Restore: cp $CHOSEN → /root/.claude/.credentials.json"
          $SSH "cp -fv '$CHOSEN' /root/.claude/.credentials.json && chmod 600 /root/.claude/.credentials.json"
          $SSH "stat -c 'after restore: size=%s mtime=%y' /root/.claude/.credentials.json"
          echo "::endgroup::"

          echo "::group::F. Post-restore sanity (structural only)"
          $SSH "jq '.claudeAiOauth | keys' /root/.claude/.credentials.json"
          echo "::endgroup::"

          echo "::notice::Restore complete. Next step: dispatch hetzner-oauth-refresh.yml to exchange the refresh_token for a fresh access_token from GHA-IP."
