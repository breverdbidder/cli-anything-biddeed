name: Fix BidDeed.AI DNS + Custom Domain
# Issue #18: biddeed.ai returns HTTP 000 — no DNS records
# brevard-bidder-landing.pages.dev is LIVE (HTTP 200)
# Fix: wire CF DNS + add custom domain to CF Pages project

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check only, no changes)'
        required: false
        type: boolean
        default: false

jobs:
  fix-dns:
    name: "Fix biddeed.ai DNS → CF Pages"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose current state
        run: |
          echo "=== DNS Lookup ==="
          dig biddeed.ai A +short || echo "No A record"
          dig www.biddeed.ai CNAME +short || echo "No CNAME"
          echo ""
          echo "=== HTTP status ==="
          echo -n "biddeed.ai: "
          curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://biddeed.ai 2>/dev/null || echo "000"
          echo ""
          echo -n "www.biddeed.ai: "
          curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://www.biddeed.ai 2>/dev/null || echo "000"
          echo ""
          echo -n "brevard-bidder-landing.pages.dev: "
          curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://brevard-bidder-landing.pages.dev 2>/dev/null || echo "000"
          echo ""

      - name: Get CF Zone ID for biddeed.ai
        id: zone
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ZONE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=biddeed.ai" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")

          echo "Zone response: $(echo $ZONE | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f"success={d[\"success\"]}, count={len(d[\"result\"])}")')"

          ZONE_ID=$(echo $ZONE | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d["result"] else "NOT_FOUND")')
          echo "zone_id=$ZONE_ID" >> $GITHUB_OUTPUT
          echo "Zone ID: $ZONE_ID"

          if [ "$ZONE_ID" = "NOT_FOUND" ]; then
            echo "ERROR: biddeed.ai zone not found in Cloudflare account"
            exit 1
          fi

      - name: Check existing DNS records
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          echo "=== Existing DNS records for biddeed.ai ==="
          RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          records = d.get('result') or []
          if not records:
              print('No DNS records found (empty zone — expected, this is why HTTP 000)')
          else:
              for r in records:
                  print(f\"  {r['type']:6} {r['name']:40} -> {r.get('content','')}\")
          print(f'Total: {len(records)} records')
          print(f'API success: {d.get(\"success\")}')
          " || echo "Note: $RESP"

      - name: Add CNAME for apex biddeed.ai
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: apex_cname
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          echo "Adding CNAME: biddeed.ai → brevard-bidder-landing.pages.dev"

          # Check if record already exists
          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=biddeed.ai" \
            -H "Authorization: Bearer $CF_API_TOKEN" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else 'NONE')")

          if [ "$EXISTING" != "NONE" ]; then
            echo "Record exists (id=$EXISTING), updating..."
            RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"biddeed.ai","content":"brevard-bidder-landing.pages.dev","ttl":1,"proxied":true}')
          else
            echo "Creating new CNAME record..."
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"biddeed.ai","content":"brevard-bidder-landing.pages.dev","ttl":1,"proxied":true}')
          fi

          echo $RESULT | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d['result']
              print(f'✅ CNAME apex: {r[\"name\"]} -> {r[\"content\"]} (proxied={r[\"proxied\"]})')
          else:
              print(f'❌ Failed: {d.get(\"errors\")}')
              exit(1)
          "

      - name: Add CNAME for www.biddeed.ai
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          echo "Adding CNAME: www.biddeed.ai → brevard-bidder-landing.pages.dev"

          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=www.biddeed.ai" \
            -H "Authorization: Bearer $CF_API_TOKEN" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else 'NONE')")

          if [ "$EXISTING" != "NONE" ]; then
            RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"www","content":"brevard-bidder-landing.pages.dev","ttl":1,"proxied":true}')
          else
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"www","content":"brevard-bidder-landing.pages.dev","ttl":1,"proxied":true}')
          fi

          echo $RESULT | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d['result']
              print(f'✅ CNAME www: {r[\"name\"]} -> {r[\"content\"]} (proxied={r[\"proxied\"]})')
          else:
              print(f'❌ Failed: {d.get(\"errors\")}')
          "

      - name: Add biddeed.ai as custom domain on CF Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== Adding biddeed.ai custom domain to CF Pages project ==="

          # List existing custom domains
          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/brevard-bidder-landing/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN")

          echo "Existing custom domains:"
          echo $EXISTING | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for domain in d.get('result', []):
              print(f\"  {domain.get('name','?')} — status: {domain.get('status','?')}\")
          " 2>/dev/null || echo "  (could not parse)"

          # Add biddeed.ai
          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/brevard-bidder-landing/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"biddeed.ai"}')

          echo $RESULT | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d.get('result', {})
              print(f'✅ Custom domain added: {r.get(\"name\")} — status: {r.get(\"status\")}')
          else:
              errs = d.get('errors', [])
              # Domain already exists = not a failure
              if any('already' in str(e).lower() or '10000' in str(e) for e in errs):
                  print(f'ℹ️  biddeed.ai already registered as custom domain')
              else:
                  print(f'⚠️  Pages domain: {errs}')
          "

          # Add www.biddeed.ai
          RESULT2=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/brevard-bidder-landing/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"www.biddeed.ai"}')

          echo $RESULT2 | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d.get('result', {})
              print(f'✅ Custom domain added: {r.get(\"name\")} — status: {r.get(\"status\")}')
          else:
              errs = d.get('errors', [])
              if any('already' in str(e).lower() or '10000' in str(e) for e in errs):
                  print(f'ℹ️  www.biddeed.ai already registered as custom domain')
              else:
                  print(f'⚠️  Pages www domain: {errs}')
          "

      - name: Wait for DNS propagation + verify
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Waiting 15s for DNS to propagate..."
          sleep 15

          echo "=== Post-fix DNS check ==="
          dig biddeed.ai A +short 2>/dev/null || echo "Still propagating..."
          dig www.biddeed.ai CNAME +short 2>/dev/null || echo "Still propagating..."

          echo ""
          echo "=== HTTP status check ==="
          APEX=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://biddeed.ai 2>/dev/null || echo "000")
          WWW=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://www.biddeed.ai 2>/dev/null || echo "000")

          echo "biddeed.ai: $APEX"
          echo "www.biddeed.ai: $WWW"

          if [ "$APEX" = "200" ] || [ "$APEX" = "301" ] || [ "$APEX" = "302" ]; then
            echo "✅ biddeed.ai is LIVE (HTTP $APEX)"
          else
            echo "⚠️ biddeed.ai still returning $APEX — DNS may still be propagating (can take 30-300s)"
            echo "Re-run verify step in 5 minutes to confirm"
          fi

      - name: Verify biddeed.ai pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== CF Pages projects ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/brevard-bidder-landing" \
            -H "Authorization: Bearer $CF_API_TOKEN" | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d['result']
              print(f'Project: {r[\"name\"]}')
              print(f'  Subdomain: {r.get(\"subdomain\",\"?\")}')
              print(f'  Production URL: {r.get(\"canonical_deployment\",{}).get(\"url\",\"?\")}')
              domains = r.get('domains', [])
              print(f'  Custom domains: {domains}')
          else:
              print(f'Not found or error: {d.get(\"errors\")}')
          "
