name: "Summit: Deploy Palm Bay Conquest to Hetzner"
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and start on Hetzner
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get install -y sshpass -qq
          
          # Create env file
          cat > /tmp/zonewise.env << ENVEOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_KEY=$SUPABASE_KEY
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          ENVEOF
          
          # Deploy script + env to Hetzner
          sshpass -p "$HETZNER_PASSWORD" ssh -o StrictHostKeyChecking=no root@$HETZNER_IP "mkdir -p /opt/zonewise"
          sshpass -p "$HETZNER_PASSWORD" scp -o StrictHostKeyChecking=no scripts/palm_bay_hetzner.py root@$HETZNER_IP:/opt/zonewise/
          sshpass -p "$HETZNER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/zonewise.env root@$HETZNER_IP:/opt/zonewise/.env
          
          # Install deps + set up cron
          sshpass -p "$HETZNER_PASSWORD" ssh -o StrictHostKeyChecking=no root@$HETZNER_IP << 'SSHEOF'
          cd /opt/zonewise
          pip3 install httpx -q 2>/dev/null || pip install httpx -q
          
          # Source env for cron
          echo '#!/bin/bash' > /opt/zonewise/run.sh
          echo 'set -a; source /opt/zonewise/.env; set +a' >> /opt/zonewise/run.sh
          echo 'cd /opt/zonewise && python3 palm_bay_hetzner.py' >> /opt/zonewise/run.sh
          chmod +x /opt/zonewise/run.sh
          
          # Add cron: every 10 min
          (crontab -l 2>/dev/null | grep -v palm_bay; echo "*/10 * * * * /opt/zonewise/run.sh >> /var/log/palm_bay.log 2>&1") | crontab -
          
          # Run first batch now
          /opt/zonewise/run.sh
          
          echo "✅ Deployed + first batch running + cron set"
          SSHEOF
