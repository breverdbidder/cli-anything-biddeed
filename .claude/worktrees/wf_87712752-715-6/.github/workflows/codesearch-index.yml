name: CodeSearch Index

on:
  schedule:
    # Nightly incremental index of Tier 1 repos at 3AM EST
    - cron: '0 8 * * *'
    # Weekly full reindex Sunday 4AM EST
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Specific repo to index (leave empty for all Tier 1)'
        required: false
        default: ''
      full:
        description: 'Force full reindex (true/false)'
        required: false
        default: 'false'

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r skills/codesearch/requirements.txt

      - name: Run CodeSearch Index
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODESEARCH_REPOS_DIR: /tmp/codesearch-repos
        run: |
          set -euo pipefail

          REPO_ARG=""
          FULL_ARG=""

          if [ -n "${{ github.event.inputs.repo }}" ]; then
            REPO_ARG="--repo ${{ github.event.inputs.repo }}"
          fi

          if [ "${{ github.event.inputs.full }}" = "true" ] || [ "$(date +%u)" = "7" ]; then
            FULL_ARG="--full"
            echo "=== Full reindex mode ==="
          else
            echo "=== Incremental index mode ==="
          fi

          python -m skills.codesearch.codesearch index $REPO_ARG $FULL_ARG

      - name: Verify stats
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODESEARCH_REPOS_DIR: /tmp/codesearch-repos
        run: |
          echo "=== Post-index verification ==="
          python -m skills.codesearch.codesearch stats

      - name: Check minimum chunk threshold
        env:
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODESEARCH_REPOS_DIR: /tmp/codesearch-repos
        run: |
          # NEVER-LIE: verify actual chunk count, fail if below threshold
          python3 -c "
          import httpx, os, sys
          url = os.environ['SUPABASE_URL'] + '/rest/v1/code_chunks'
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}
          r = httpx.get(url, headers={**headers, 'Prefer': 'count=exact'}, params={'select': 'id', 'limit': '1'})
          count = int(r.headers.get('content-range', '0/0').split('/')[1])
          print(f'Total chunks in DB: {count}')
          if count < 1000:
            print(f'FAIL: Expected >1000 chunks, got {count}')
            sys.exit(1)
          print(f'PASS: {count} chunks indexed (threshold: 1000)')
          "
