name: SUMMIT - File Writer (plain b64 -> repo)

on:
  workflow_dispatch:
    inputs:
      summit_id:
        description: summit_chat_dispatch.id (UUID)
        required: true
        type: string

permissions:
  contents: write

env:
  SUPA_URL: ${{ secrets.SUPABASE_URL }}
  SUPA_SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUMMIT_ID: ${{ inputs.summit_id }}

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SUMMIT picked_up
        run: |
          set -e
          NOW=$(date -u +%FT%TZ)
          curl -fsS -X PATCH \
            "$SUPA_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID" \
            -H "apikey: $SUPA_SR" -H "Authorization: Bearer $SUPA_SR" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"state\":\"picked_up\",\"picked_up_at\":\"$NOW\",\"workflow_run_id\":$GITHUB_RUN_ID,\"workflow_run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Fetch dispatch_inputs
        run: |
          set -e
          mkdir -p /tmp/summit
          curl -fsS \
            "$SUPA_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID&select=dispatch_inputs" \
            -H "apikey: $SUPA_SR" -H "Authorization: Bearer $SUPA_SR" \
            > /tmp/summit/raw.json
          jq -c '.[0].dispatch_inputs' /tmp/summit/raw.json > /tmp/summit/inputs.json
          echo "target_repo=$(jq -r '.target_repo' /tmp/summit/inputs.json)" >> $GITHUB_ENV

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.target_repo }}
          token: ${{ secrets.EVEREST_GH_PAT }}
          path: repo
          fetch-depth: 1

      - name: Write files (plain base64 + md5 verify)
        working-directory: repo
        run: |
          set -eo pipefail
          {
            COUNT=$(jq '.files | length' /tmp/summit/inputs.json)
            echo "writing $COUNT file(s)"
            for i in $(seq 0 $((COUNT-1))); do
              P=$(jq -r ".files[$i].path" /tmp/summit/inputs.json)
              EXPECT=$(jq -r ".files[$i].md5 // \"\"" /tmp/summit/inputs.json)
              mkdir -p "$(dirname "$P")"
              # plain base64; strip any whitespace before decode (newline-tolerant)
              jq -r ".files[$i].b64" /tmp/summit/inputs.json | tr -d '[:space:]' > "/tmp/b64_$i.txt"
              echo "  [$i] path=$P b64_chars=$(wc -c < /tmp/b64_$i.txt)"
              base64 -d "/tmp/b64_$i.txt" > "$P"
              GOT=$(md5sum "$P" | cut -d' ' -f1)
              echo "  [$i] wrote $P html_bytes=$(wc -c < "$P") md5=$GOT expect=$EXPECT"
              if [ -n "$EXPECT" ] && [ "$GOT" != "$EXPECT" ]; then
                echo "  [$i] MD5 MISMATCH — aborting, will not commit corrupt content"
                exit 1
              fi
            done
          } 2>&1 | tee /tmp/step5.log

      - name: Commit + push to main
        working-directory: repo
        run: |
          set -e
          git config user.name "breverdbidder-bot"
          git config user.email "bot@everestcapital.usa"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "SUMMIT ${SUMMIT_ID:0:8}: write $(jq -r '.commit_label // "files"' /tmp/summit/inputs.json)"
          git push origin HEAD:main

      - name: SUMMIT awaiting_verification (success)
        if: success()
        run: |
          set -e
          HEAD=$(cd repo && git rev-parse HEAD)
          PATHS=$(jq -c '[.files[].path]' /tmp/summit/inputs.json)
          PROOF=$(jq -nc --arg sha "$HEAD" --arg rid "$GITHUB_RUN_ID" --argjson paths "$PATHS" \
            '{commit_sha:$sha, run_id:$rid, files:$paths, render_verified:false}')
          curl -fsS -X PATCH \
            "$SUPA_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID" \
            -H "apikey: $SUPA_SR" -H "Authorization: Bearer $SUPA_SR" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"state\":\"awaiting_verification\",\"delivery_proof\":$PROOF}"

      - name: SUMMIT failed
        if: failure()
        run: |
          ERR=$(tail -c 800 /tmp/step5.log 2>/dev/null | tr -d '\r' | jq -Rsa . || echo '"no step5 log"')
          curl -fsS -X PATCH \
            "$SUPA_URL/rest/v1/summit_chat_dispatch?id=eq.$SUMMIT_ID" \
            -H "apikey: $SUPA_SR" -H "Authorization: Bearer $SUPA_SR" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"state\":\"failed\",\"last_error\":$ERR}"
