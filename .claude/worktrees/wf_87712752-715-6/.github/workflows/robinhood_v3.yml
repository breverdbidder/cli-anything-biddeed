name: Robinhood Photos v3 - Resale Chain

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} bash <<'REMOTE'
          set -e
          rm -rf /tmp/rh_v3
          mkdir -p /tmp/rh_v3
          cd /tmp/rh_v3

          cat > scrape.py <<'PY'
          import asyncio, json, os, re, hashlib, csv
          from pathlib import Path
          import urllib.request, urllib.error
          from io import StringIO

          OUT = Path('/tmp/rh_v3')
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36")

          # ===== STEP 1: find Robinhood sale-out from Maxi Day =====
          # Approach: re-run the v8 scrape with role=GRANTOR for MAXI DAY 2015-2016
          # then filter to records mentioning ROBIN or 4087

          async def search_brevard_clerk(page, party_name, role, date_from, date_to, label):
              """Returns the downloaded CSV path or None"""
              try:
                  await page.goto(
                      "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                      wait_until="networkidle", timeout=60000,
                  )
                  await asyncio.sleep(2)
                  btn = page.locator("input[value='I accept the conditions above.']")
                  if await btn.count() > 0:
                      await btn.click()
                      await page.wait_for_load_state("networkidle")
                      await asyncio.sleep(3)
                  await page.wait_for_selector("input#SearchOnName", timeout=20000)
                  if role == "GRANTOR":
                      # Default search is grantor (SearchOnName + Direct)
                      pass
                  else:
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                  await page.fill("input#SearchOnName", party_name)
                  await page.fill("input#RecordDateFrom", date_from)
                  await page.fill("input#RecordDateTo", date_to)
                  await page.click("input#btnSearch")
                  await asyncio.sleep(4)
                  # Name picker - click first visible Done
                  try:
                      await page.wait_for_selector("text=Select Names:", timeout=10000)
                      done = page.locator("input[type='submit'][value='Done']")
                      cnt = await done.count()
                      for i in range(cnt):
                          if await done.nth(i).is_visible():
                              await done.nth(i).click()
                              break
                  except: pass
                  # Wait for results grid
                  try:
                      await page.wait_for_selector("a.csvButton#btnCsvButton", timeout=20000)
                      await asyncio.sleep(2)
                      async with page.expect_download(timeout=60000) as dl_info:
                          await page.click("a.csvButton#btnCsvButton")
                      download = await dl_info.value
                      csv_path = OUT / f"{label}.csv"
                      await download.save_as(str(csv_path))
                      return csv_path
                  except Exception as e:
                      print(f"    No results grid for {label}: {e}", flush=True)
                      return None
              except Exception as e:
                  print(f"  Search error {label}: {e}", flush=True)
                  return None

          def parse_csv(csv_path):
              rows = []
              if not csv_path or not csv_path.exists():
                  return rows
              with open(csv_path, 'r', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      rows.append(row)
              return rows

          def find_robinhood(rows):
              hits = []
              for r in rows:
                  legal = (r.get('DocLegalDescription','') + ' ' + r.get('Comments','')).upper()
                  cross = r.get('CrossPartyName','').upper()
                  # Robin Hood lots are in Sherwood Forest plat
                  if 'ROBIN' in legal or 'SHERWOOD' in legal or '4087' in legal:
                      hits.append(r)
              return hits

          # ===== STEP 2: try Realtor.com sold-history endpoint via direct API =====
          # Realtor's autocomplete and sold-history sometimes work without bot challenges

          async def try_realtor_sold(page, address):
              urls = set()
              try:
                  # Try the search-by-address endpoint
                  q = address.replace(' ', '+')
                  search_url = f"https://www.realtor.com/realestateandhomes-search/{q}"
                  await page.goto(search_url, wait_until="domcontentloaded", timeout=30000)
                  await asyncio.sleep(4)
                  html = await page.content()
                  Path('/tmp/rh_v3/realtor_search.html').write_text(html, errors='replace')
                  print(f"  Realtor search: {len(html)} bytes", flush=True)
                  # Find any property_id pattern
                  m = re.search(r'/realestateandhomes-detail/[^"\\\']+?M(\d{8,})', html)
                  if m:
                      detail_url = "https://www.realtor.com" + m.group(0).split('"')[0]
                      print(f"  Realtor detail: {detail_url[:120]}", flush=True)
                      await page.goto(detail_url, wait_until="domcontentloaded", timeout=30000)
                      await asyncio.sleep(4)
                      html = await page.content()
                      Path('/tmp/rh_v3/realtor_detail.html').write_text(html, errors='replace')
                      for pat in [r'https://[a-z]+\.rdcpix\.com/[^"\\\']+?\.jpg']:
                          for u in re.findall(pat, html):
                              urls.add(u)
                  print(f"  Realtor URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  Realtor error: {e}", flush=True)
              return list(urls)

          # ===== STEP 3: BCPAO parcel page (gov, no bot block) =====
          async def try_bcpao(page, address):
              urls = set()
              try:
                  await page.goto(
                      "https://www.bcpao.us/PropertySearch/#/search",
                      wait_until="domcontentloaded", timeout=30000,
                  )
                  await asyncio.sleep(3)
                  # Search by address
                  await page.fill("input#searchAddress, input[name='Address']", "4087 Robinhood")
                  await page.keyboard.press("Enter")
                  await asyncio.sleep(5)
                  html = await page.content()
                  Path('/tmp/rh_v3/bcpao.html').write_text(html, errors='replace')
                  print(f"  BCPAO: {len(html)} bytes", flush=True)
                  # Look for parcel ID and photo
                  for pat in [
                      r'https://[a-z0-9.\-]*bcpao\.us/[^"\\\']+?\.jpg',
                      r'https://[a-z0-9.\-]*bcpao\.us/[^"\\\']+?\.png',
                      r'(/PropertySearch/api/[^"\\\']+?\.(?:jpg|png))',
                  ]:
                      for u in re.findall(pat, html):
                          if u.startswith('/'):
                              u = 'https://www.bcpao.us' + u
                          urls.add(u)
                  print(f"  BCPAO URLs: {len(urls)}", flush=True)
              except Exception as e:
                  print(f"  BCPAO error: {e}", flush=True)
              return list(urls)

          # ===== STEP 4: Realtor sold-history archive (M-id approach) =====

          async def main():
              from playwright.async_api import async_playwright
              all_image_urls = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent=UA,
                      accept_downloads=True,
                  )
                  page = await ctx.new_page()

                  # 1. Maxi Day OUTGOING 2015-2017 → find Robinhood sale-out
                  print("=== Step 1: Maxi Day GRANTOR 2015-2017 ===", flush=True)
                  csv_path = await search_brevard_clerk(
                      page, "MAXI DAY", "GRANTOR",
                      "1/1/2015", "12/31/2017", "maxi_grantor_2015_2017"
                  )
                  rows = parse_csv(csv_path)
                  print(f"  Total outgoing deeds: {len(rows)}", flush=True)
                  rh_hits = find_robinhood(rows)
                  print(f"  Robinhood matches: {len(rh_hits)}", flush=True)
                  for r in rh_hits:
                      print(f"    {r.get('RecordDate')} {r.get('Name')} -> {r.get('CrossPartyName')} ${r.get('Consideration')} | {r.get('DocLegalDescription','')[:60]}", flush=True)

                  # Identify the post-Everest buyer
                  post_buyer = None
                  for r in rh_hits:
                      if r.get('DocTypeDescription','').upper() in ('DEED','WD','SWD','QCD'):
                          post_buyer = r.get('CrossPartyName','').strip()
                          if post_buyer:
                              print(f"  Post-Everest buyer: {post_buyer}", flush=True)
                              break

                  # 2. If found, search that buyer's outgoing deeds → find any resale
                  resale_buyer = None
                  if post_buyer:
                      print(f"\n=== Step 2: {post_buyer} GRANTOR 2015-2026 ===", flush=True)
                      csv2 = await search_brevard_clerk(
                          page, post_buyer, "GRANTOR",
                          "1/1/2015", "12/31/2026", "post_buyer_grantor"
                      )
                      rows2 = parse_csv(csv2)
                      print(f"  Total outgoing deeds: {len(rows2)}", flush=True)
                      rh2 = find_robinhood(rows2)
                      print(f"  Robinhood resales: {len(rh2)}", flush=True)
                      for r in rh2:
                          print(f"    {r.get('RecordDate')} -> {r.get('CrossPartyName')} ${r.get('Consideration')}", flush=True)
                          if r.get('DocTypeDescription','').upper() in ('DEED','WD','SWD','QCD'):
                              resale_buyer = r.get('CrossPartyName','').strip()

                  if resale_buyer:
                      print(f"\n*** Resale buyer: {resale_buyer} ***", flush=True)

                  # 3. Try Realtor for current/past listings
                  print("\n=== Step 3: Realtor.com search ===", flush=True)
                  all_image_urls += await try_realtor_sold(page, "4087 Robinhood Dr Melbourne FL 32935")

                  # 4. Try BCPAO
                  print("\n=== Step 4: BCPAO parcel page ===", flush=True)
                  all_image_urls += await try_bcpao(page, "4087 Robinhood Dr")

                  await browser.close()

              # Dedupe and save
              uniq = list(dict.fromkeys(all_image_urls))
              print(f"\n=== Total image URLs: {len(uniq)} ===", flush=True)
              for u in uniq[:30]:
                  print(f"  {u[:160]}", flush=True)

              # Download
              downloaded = []
              for i, url in enumerate(uniq[:25], 1):
                  try:
                      h = hashlib.md5(url.encode()).hexdigest()[:8]
                      fname = f"{i:02d}_{h}.jpg"
                      fpath = OUT / fname
                      req = urllib.request.Request(url, headers={'User-Agent': UA})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data = r.read()
                      if len(data) > 5000:
                          fpath.write_bytes(data)
                          downloaded.append({'url': url, 'file': fname, 'size': len(data)})
                          print(f"  [{i}] {len(data)} -> {fname}", flush=True)
                  except Exception as e:
                      print(f"  [{i}] FAIL: {str(e)[:80]}", flush=True)

              with open(OUT / 'manifest.json', 'w') as f:
                  json.dump({
                      'address': '4087 Robinhood Dr Melbourne FL 32935',
                      'post_everest_buyer': post_buyer if 'post_buyer' in dir() else None,
                      'resale_buyer': resale_buyer if 'resale_buyer' in dir() else None,
                      'image_urls': uniq,
                      'downloaded': downloaded,
                  }, f, indent=2)

          asyncio.run(main())
          PY

          python3 scrape.py 2>&1 | tee run.log
          ls -la /tmp/rh_v3/
          REMOTE

      - env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/rh_v3/ /tmp/results/ || true
          ls -la /tmp/results/rh_v3/ 2>/dev/null || echo "no results"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood_photos_v3
          path: /tmp/results/
          retention-days: 90
