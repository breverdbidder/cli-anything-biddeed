name: Summit UTCC SSH Executor

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Max session minutes
        required: false
        default: '60'

jobs:
  summit-utcc:
    name: UTCC SSH Executor Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy via Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 80m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID
          script: |
            set -e
            REPO_PATH=/home/claude/repos/cli-anything-biddeed
            # Pull/clone first so idempotency check reflects current git state
            if [ -d "$REPO_PATH" ]; then
              git -C "$REPO_PATH" pull origin main --ff-only 2>&1 | tail -3 || true
            else
              mkdir -p /home/claude/repos
              git clone "https://${GH_PAT}@github.com/breverdbidder/cli-anything-biddeed.git" "$REPO_PATH"
            fi
            # Idempotency check: UTCC is already built if utcc/registry.py exists
            if [ -f "$REPO_PATH/utcc/registry.py" ]; then
              echo "UTCC infrastructure already built — skipping rebuild"
              exit 0
            fi
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN'
              export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID'
              cd /home/claude/repos/cli-anything-biddeed
              git pull origin main
              claude -p \"MISSION: Build UTCC SSH Executor and Foundation for cli-anything-biddeed repo. PHASE 1 - SSH EXECUTOR WORKFLOW: Create .github/workflows/utcc-executor-ssh.yml triggered by repository_dispatch type utcc-dispatch. Uses appleboy/ssh-action to SSH into Hetzner (HETZNER_IP secret). Passes task from client_payload.task. Runs claude -p with the task using --dangerously-skip-permissions. Posts Telegram notification on completion using BIDDEED_BOT_TOKEN to BIDDEED_BOT_CHAT_ID. PHASE 2 - SUPABASE MIGRATION: Create utcc/migrations/001_task_registry.sql with: task_registry table (id UUID PK, task_id TEXT UNIQUE, description TEXT, task_type TEXT, platform TEXT, triggered_by TEXT, status TEXT DEFAULT queued, gha_run_id BIGINT, gha_run_url TEXT, result_summary TEXT, error_message TEXT, tokens_used INT DEFAULT 0, cost_usd NUMERIC DEFAULT 0, created_at TIMESTAMPTZ DEFAULT NOW(), dispatched_at TIMESTAMPTZ, completed_at TIMESTAMPTZ, batch_id UUID, batch_index INT) and task_logs table (id UUID PK, task_id TEXT REFERENCES task_registry, timestamp TIMESTAMPTZ DEFAULT NOW(), level TEXT, message TEXT, metadata JSONB). Add indexes on status, batch_id, created_at DESC, platform. Enable RLS with anon SELECT and service_role INSERT/UPDATE. Then run the migration using curl to Supabase REST API at https://mocerqjnksmhcjzxrewo.supabase.co using the SUPABASE_KEY secret. PHASE 3 - PYTHON MODULES: Create utcc/__init__.py, utcc/registry.py (Supabase CRUD for task_registry), utcc/classifier.py (keyword routing: conquer to modal_conquest, transcript/youtube to transcript, sentinel/health to sentinel, default to gha_executor), utcc/notifier.py (Telegram helper using BIDDEED_BOT_TOKEN). PHASE 4 - DISPATCHER WORKFLOW: Create .github/workflows/utcc-dispatcher.yml triggered by repository_dispatch type utcc-batch-dispatch. Reads batch_id, queries task_registry, matrix strategy per task, routes to correct executor, updates status, sends Telegram notification. COMMIT RULES: git config user.email ci@biddeed.ai, git config user.name BidDeed-CI, prefix commits with UTCC:, push to main. Send Telegram when done.\" --dangerously-skip-permissions
            "
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}

      - name: Notify completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=Summit UTCC: ${STATUS} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
