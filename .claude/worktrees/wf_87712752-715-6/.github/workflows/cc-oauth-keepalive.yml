name: cc oauth keepalive
on: { workflow_dispatch: {} }
jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: ping and record auth health
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SVC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          RAW=$($SSH 'su - claude -c "timeout 60 claude -p \"Reply with exactly the single word: PONG\" --output-format text 2>&1"; echo "RC=$?"')
          echo "----- raw -----"; echo "$RAW"; echo "---------------"
          RC=$(printf '%s' "$RAW" | grep -o 'RC=[0-9]*' | tail -1 | cut -d= -f2)
          DET=$(printf '%s' "$RAW" | tr -d '\r' | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | tr '\n' ' ' | tail -c 350)
          OK=false
          if [ "$RC" = "0" ] && printf '%s' "$RAW" | grep -qi 'PONG'; then OK=true; fi
          echo "OK=$OK RC=$RC"
          BODY=$(jq -nc --argjson ok $OK --arg det "$DET" '{ok:$ok, detail:$det}')
          curl -s -o /dev/null -w "health_post=%{http_code}\n" -X POST \
            "https://mocerqjnksmhcjzxrewo.supabase.co/rest/v1/cc_oauth_health" \
            -H "apikey: $SVC" -H "Authorization: Bearer $SVC" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$BODY"
          echo "DONE"
