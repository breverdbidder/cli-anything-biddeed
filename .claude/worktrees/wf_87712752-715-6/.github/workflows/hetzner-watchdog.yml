name: "Hetzner Watchdog"

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    name: "Ping Hetzner SSH"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check SSH and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          # Try SSH connection with 10s timeout
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner

          if timeout 10 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
            -i ~/.ssh/hetzner root@87.99.129.125 "echo ALIVE" 2>/dev/null; then
            echo "SERVER IS BACK!"
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=✅ Hetzner everest-dispatch (87.99.129.125) is BACK ONLINE! SSH working. You can disable this watchdog now." \
              >/dev/null 2>&1
          else
            echo "Still down. Will check again in 15 min."
          fi

          rm -f ~/.ssh/hetzner
