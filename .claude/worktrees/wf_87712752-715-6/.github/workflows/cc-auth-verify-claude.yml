name: cc auth verify claude
on: { workflow_dispatch: {} }
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: verify claude-user auth
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          echo "creds_present=$(test -f /home/claude/.claude/.credentials.json && echo yes || echo no)"
          echo "token_env=$(su - claude -c 'echo ${CLAUDE_CODE_OAUTH_TOKEN:+set}' 2>&1)"
          echo "=== claude -p ping as claude user ==="
          su - claude -c 'timeout 60 claude -p "Reply with exactly: PONG" --output-format text 2>&1' | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | tail -8
          echo "RC=$?"
          echo "END"
          REMOTE
