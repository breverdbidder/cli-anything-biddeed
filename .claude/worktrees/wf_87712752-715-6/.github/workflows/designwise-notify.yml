name: "DesignWise Squad — Telegram Notify"
on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Send S1 Complete Notification"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=✅ *DESIGNWISE SPRINT 1 — 100% COMPLETE*

          📦 *S1.1 Scaffold:* CLI (13 cmds) + setup.py + 3 utils
          🤖 *Agents:* 13/13 deployed (32 Python files)
          🛡️ *S1.2:* brandguard-pr-check.yml active
          🎖️ *S1.3:* Commander dispatch operational
          🗄️ *S1.4:* 11/11 Supabase tables CREATED + RLS ✅
          📊 *S1.6:* eval.json (25 assertions) + autoloop cron
          🧪 *Tests:* 55+ across 8 test files

          _7 commits · 14.5 min · \$0 spent_
          _Sprint 2 ready for dispatch._"

