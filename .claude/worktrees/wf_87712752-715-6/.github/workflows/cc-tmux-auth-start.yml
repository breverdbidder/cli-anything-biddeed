name: cc tmux auth start
on: { workflow_dispatch: {} }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: start setup-token in tmux and capture url
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          $SSH 'bash -s' <<"REMOTE"
          command -v tmux >/dev/null 2>&1 || { apt-get update -y >/dev/null 2>&1; apt-get install -y tmux >/dev/null 2>&1; }
          echo "tmux=$(command -v tmux)"
          su - claude -c 'tmux -L authsock kill-server 2>/dev/null; true'
          su - claude -c 'tmux -L authsock new-session -d -s auth -x 240 -y 50 "claude setup-token"'
          sleep 14
          echo "=== pane ==="
          su - claude -c 'tmux -L authsock capture-pane -t auth -p -J' 2>&1 | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v '^[[:space:]]*$'
          echo "=== url ==="
          su - claude -c 'tmux -L authsock capture-pane -t auth -p -J' 2>&1 | grep -oE 'https://[^ ]+' | head -5
          echo END
          REMOTE
