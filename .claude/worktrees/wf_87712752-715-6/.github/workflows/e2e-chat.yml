name: "E2E: chat-v2 Playwright tests"
# Issue: breverdbidder/cli-anything-biddeed#97
#
# 7 test cases targeting https://zonewise.ai/chat-v2:
#   1. Page load — Thread component visible
#   2. Composer input renders and accepts focus
#   3. Message submission + response within 30 seconds
#   4. Response contains parcel/zone keywords
#   5. Split-screen layout detected (graceful fallback)
#   6. Mobile viewport 375×812 — no horizontal overflow
#   7. Empty submission does not crash the page

on:
  push:
    paths:
      - "tests/e2e/chat-v2**"
      - "playwright.config.ts"
      - ".github/workflows/e2e-chat.yml"
  pull_request:
    paths:
      - "tests/e2e/chat-v2**"
      - "playwright.config.ts"
  workflow_dispatch:

jobs:
  e2e:
    name: "Playwright E2E — chat-v2"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test tests/e2e/chat-v2.spec.ts
        env:
          CI: "true"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ github.run_id }}
          path: test-results/
          retention-days: 7
