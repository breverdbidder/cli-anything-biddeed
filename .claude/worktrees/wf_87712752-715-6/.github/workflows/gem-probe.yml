name: gem probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: probe
        shell: bash
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SVC: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          SB_URL="https://mocerqjnksmhcjzxrewo.supabase.co"
          mkdir -p ~/.ssh && echo "$HETZNER_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          KEY=$(curl -s -X POST "$SB_URL/rest/v1/rpc/get_router_gemini_key" -H "apikey: $SVC" -H "Authorization: Bearer $SVC" -H "Content-Type: application/json" -d '{}' | tr -d '"')
          echo "=== PLAIN (direct from hetzner) ==="
          $SSH "curl -sS -w '\nHTTP:%{http_code}' -X POST -H 'x-goog-api-key: $KEY' -H 'Content-Type: application/json' -d '{\"contents\":[{\"parts\":[{\"text\":\"reply OK\"}]}],\"generationConfig\":{\"maxOutputTokens\":5}}' 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent'" | sed -E 's/(AQ\.[A-Za-z0-9]{3})[A-Za-z0-9._-]+/\1***/g' | head -c 500
          echo
          echo "=== GROUNDED (direct from hetzner) ==="
          $SSH "curl -sS -w '\nHTTP:%{http_code}' -X POST -H 'x-goog-api-key: $KEY' -H 'Content-Type: application/json' -d '{\"tools\":[{\"google_search\":{}}],\"contents\":[{\"parts\":[{\"text\":\"reply OK\"}]}],\"generationConfig\":{\"maxOutputTokens\":20}}' 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent'" | head -c 500
          echo
          echo "=== END ==="
