name: "Fill opening_bid NULLs — Duval + Brevard"
# Runs fill_opening_bids_brevard_duval.py via GHA.
# Passes:
#   0:  RPC flush (existing aids → MCA)
#   0b: direct-patch Duval FC from realforeclose_aids by case_number
#   1:  AJAX login → PREVIEW scrape duval.realforeclose.com
#   1b: unauth zoom-page per AID
#   1c: or.duvalclerk.com AcclaimWeb case-number search (new, 2026-06-23)
#   2:  duval.realtaxdeed.com scrape
#   3:  Brevard AcclaimWeb
#   4:  brevard.realforeclose.com PREVIEW (unauth)
# DoD: COUNT(*)=0 for upcoming Duval realforeclose NULL opening_bids

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 8 * * 1-5"    # Mon-Fri 08:15Z — after both drain workflows

jobs:
  fill:
    name: "fill_opening_bids_brevard_duval (all passes)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fill script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALFORECLOSE_EMAIL: ${{ secrets.REALFORECLOSE_EMAIL }}
          REALFORECLOSE_PASSWORD: ${{ secrets.REALFORECLOSE_PASSWORD }}
        run: python scripts/fill_opening_bids_brevard_duval.py
