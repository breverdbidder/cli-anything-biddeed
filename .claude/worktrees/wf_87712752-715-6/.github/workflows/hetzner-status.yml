name: Hetzner Status Check
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag or fix'
        default: 'diag'
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH="ssh -i ~/.ssh/key -o ConnectTimeout=90 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes root@${HETZNER_IP}"
          retry_ssh() {
            for i in 1 2 3 4 5; do
              OUT=$($SSH "$1" 2>&1) && { echo "$OUT"; return 0; }
              echo "[retry $i] $OUT" >&2
              sleep 10
            done
            return 1
          }
          echo "=== UPTIME ==="; retry_ssh "uptime; w | head -3"
          echo "=== TOP CPU ==="; retry_ssh "ps -eo pid,etime,pcpu,pmem,user,cmd --sort=-pcpu | head -25"
          echo "=== TMUX ==="; retry_ssh "tmux ls 2>&1 || echo none"
          echo "=== CLAUDE ==="; retry_ssh "ps -eo pid,etime,pcpu,pmem,cmd | grep -E 'claude|node|summit' | grep -v grep | head -30 || echo none"
          echo "=== DOCKER ==="; retry_ssh "docker ps --format 'table {{.Names}}	{{.Status}}	{{.Size}}' 2>&1 | head -20 || echo none"
          echo "=== DISK ==="; retry_ssh "df -h / /var 2>&1 | tail -5; du -sh /root/summit-* 2>/dev/null | tail -10"
          echo "=== MEM ==="; retry_ssh "free -h; cat /proc/loadavg"
          echo "=== ZOMBIE LOGINS ==="; retry_ssh "who; last -n 5"

          if [ "$MODE" = "fix" ]; then
            echo ""
            echo "=== CLEANUP MODE ==="
            # Kill zombie/stale claude processes >2h old, dead tmux sessions, prune docker
            retry_ssh "ps -eo pid,etime,cmd | awk '/claude/ && !/grep/ { split(\$2,a,\"-\"); if (length(a)>1) print \$1 }' | xargs -r kill -TERM 2>&1 || true"
            sleep 5
            retry_ssh "ps -eo pid,etime,cmd | awk '/claude/ && !/grep/ { split(\$2,a,\"-\"); if (length(a)>1) print \$1 }' | xargs -r kill -KILL 2>&1 || true"
            retry_ssh "tmux ls 2>/dev/null | grep -E '\(detached\)' | awk -F: '{print \$1}' | head -20" | while read s; do
              [ -n "$s" ] && retry_ssh "tmux kill-session -t '$s' 2>&1 || true"
            done
            retry_ssh "docker container prune -f 2>&1 | tail -3; docker image prune -f 2>&1 | tail -3"
            echo "=== POST-CLEANUP UPTIME ==="
            sleep 10
            retry_ssh "uptime; cat /proc/loadavg"
          fi
