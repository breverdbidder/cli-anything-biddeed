name: "Gold Standard SHARD-3 Daily (leon/desoto/baker/hendry/liberty)"

# H freshness, tier1 parity_source, precert guards, certify maintenance
# Counties: leon, desoto, baker, hendry, liberty
# dispatch_id: fbd9f23a-0bf7-45ff-9c94-b83d828456a8
# Certified 2026-06-25 UTC

on:
  schedule:
    # Daily 11:00 UTC (7 AM ET) — maintains H <48h SLA for all 5 counties
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: gold-standard-shard3
  cancel-in-progress: false

jobs:
  maintain-and-certify:
    name: "SHARD-3 H Freshness + Tier1 Parity + Certify"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx --quiet

      - name: Maintain SHARD-3 Gold Standard
        run: python3 scripts/shard3_certify_all.py

  verify:
    name: "Verify SHARD-3 Scoreboard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: maintain-and-certify
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Run pencil_dod for all 5 counties
        run: |
          python3 -c "
          import os, httpx, json

          TOKEN = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          URL = 'https://api.supabase.com/v1/projects/mocerqjnksmhcjzxrewo/database/query'
          H = {'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'}
          client = httpx.Client(timeout=60)

          print('### SQL VERIFICATION - SHARD-3 Gold Standard')
          all_pass = True
          for county in ('leon', 'desoto', 'baker', 'hendry', 'liberty'):
              r = client.post(URL, headers=H,
                              json={'query': f\"SELECT * FROM public.pencil_dod_evaluate_county('{county}');\"})
              data = r.json()
              result = data[0]['pencil_dod_evaluate_county'] if data else {}
              passes = sum(1 for k,v in result.items()
                           if k not in ('county','auctions_total') and isinstance(v,dict) and v.get('pass'))
              fails = [k for k,v in result.items()
                       if k not in ('county','auctions_total') and isinstance(v,dict) and not v.get('pass')]
              total = result.get('auctions_total', 0)
              status = f'{passes}/10' if not fails else f'{passes}/10 FAIL={fails}'
              print(f'  {county}: {status} ({total} auctions)')
              if passes < 10:
                  all_pass = False

          r = client.post(URL, headers=H, json={'query': '''
              SELECT county_slug, certified, consecutive_gold
              FROM gold_standard_certifications
              WHERE county_slug IN (''leon'',''desoto'',''baker'',''hendry'',''liberty'')
              ORDER BY county_slug;
          '''})
          print()
          print('=== Certifications ===')
          for row in (r.json() or []):
              status = 'CERTIFIED' if row.get('certified') else 'PENDING'
              print(f'  {row[\"county_slug\"]}: {status} (consecutive={row.get(\"consecutive_gold\",0)})')

          if not all_pass:
              raise SystemExit(1)
          print()
          print('ALL 5 COUNTIES 10/10 CERTIFIED')
          " 2>&1 | tee "$GITHUB_STEP_SUMMARY"
