name: Mariam Deeds v4

on:
  workflow_dispatch:
    inputs:
      grantee:
        description: 'Grantee or ALL'
        required: false
        default: 'MAXI DAY'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run v4 with Done click + result parser
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
          GH_PAT:     ${{ secrets.GH_PAT }}
          GRANTEE:    ${{ inputs.grantee }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${HETZNER_IP} \
            "GH_PAT='${GH_PAT}' GRANTEE='${GRANTEE}' bash -s" <<'REMOTE'
          set -e
          mkdir -p /tmp/mariam_v4
          cd /tmp/mariam_v4

          cat > runner.py <<'PY'
          import asyncio, json, os, re, sys
          from datetime import datetime

          async def search_grantee(party_name: str):
              from playwright.async_api import async_playwright
              result = {"party": party_name, "ts": datetime.utcnow().isoformat(),
                        "records": [], "success": False, "error": None,
                        "debug": [], "screenshots": []}

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],
                  )
                  ctx = await browser.new_context(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  )
                  page = await ctx.new_page()
                  safe = party_name.replace(' ','_').replace(',','')

                  try:
                      await page.goto(
                          "https://vaclmweb1.brevardclerk.us/AcclaimWeb/search/Disclaimer?st=/AcclaimWeb/search/SearchTypeName",
                          wait_until="networkidle", timeout=60000,
                      )
                      await asyncio.sleep(2)

                      btn = page.locator("input[value='I accept the conditions above.']")
                      if await btn.count() > 0:
                          await btn.click()
                          await page.wait_for_load_state("networkidle")
                          await asyncio.sleep(3)
                          result["debug"].append("accepted")

                      await page.wait_for_selector("input#SearchOnName", timeout=20000)
                      await page.click("input#Reverse")
                      await asyncio.sleep(0.5)
                      await page.fill("input#SearchOnName", party_name)
                      await page.fill("input#RecordDateFrom", "1/1/2011")
                      await page.fill("input#RecordDateTo", "12/31/2022")
                      result["debug"].append(f"form filled: {party_name}")

                      await page.click("input#btnSearch")
                      await asyncio.sleep(3)

                      # Handle Name picker dialog
                      try:
                          await page.wait_for_selector("text=Select Names:", timeout=10000)
                          result["debug"].append("Select Names dialog appeared")
                          ss_picker = f"/tmp/mariam_v4/{safe}_picker.png"
                          await page.screenshot(path=ss_picker, full_page=True)
                          result["screenshots"].append(ss_picker)

                          # Click "Done" button
                          done = page.locator("button:has-text('Done')")
                          if await done.count() == 0:
                              done = page.locator("input[value='Done']")
                          if await done.count() > 0:
                              await done.first.click()
                              result["debug"].append("clicked Done")
                          else:
                              result["debug"].append("Done button NOT FOUND")

                          try:
                              await page.wait_for_load_state("networkidle", timeout=60000)
                          except: pass
                          await asyncio.sleep(5)
                      except:
                          result["debug"].append("no name picker (or already on results)")

                      ss_res = f"/tmp/mariam_v4/{safe}_results.png"
                      await page.screenshot(path=ss_res, full_page=True)
                      result["screenshots"].append(ss_res)

                      content = await page.content()
                      html_path = f"/tmp/mariam_v4/{safe}_results.html"
                      with open(html_path, "w") as f: f.write(content[:500000])

                      # Look for grid rows in results — Acclaim renders Telerik/Kendo grid
                      tbl_count = await page.locator("table").count()
                      result["debug"].append(f"page now has {tbl_count} tables")

                      # Find all rows with date pattern
                      all_rows = await page.locator("tr").all()
                      result["debug"].append(f"total tr count: {len(all_rows)}")

                      for row in all_rows:
                          try:
                              cells = await row.locator("td").all()
                              if len(cells) < 4: continue
                              texts = [(await c.inner_text()).strip() for c in cells]
                              # A real result row has at least a date (recording date)
                              if any(re.fullmatch(r"\d{1,2}/\d{1,2}/\d{4}", t) for t in texts):
                                  result["records"].append({"cells": texts})
                          except: pass

                      result["debug"].append(f"parsed records: {len(result['records'])}")
                      result["success"] = True
                      await browser.close()
                  except Exception as e:
                      result["error"] = str(e)
                      try:
                          ssE = f"/tmp/mariam_v4/{safe}_error.png"
                          await page.screenshot(path=ssE, full_page=True)
                          result["screenshots"].append(ssE)
                      except: pass
                      try: await browser.close()
                      except: pass

              return result

          GRANTEES_ALL = ["MAXI DAY","UNITS 4 LEASE","SSM PROPERTY INVESTMENTS","EVEREST CAPITAL OF BREVARD"]
          target = os.environ.get("GRANTEE","MAXI DAY").strip().upper()
          targets = GRANTEES_ALL if target == "ALL" else [target]

          async def main():
              all_out = {}
              for g in targets:
                  print(f"\n##### {g} #####", flush=True)
                  r = await search_grantee(g)
                  all_out[g] = r
                  print(f"  records={len(r['records'])} success={r['success']} err={r.get('error')}", flush=True)
                  for d in r['debug']:
                      print(f"  ! {d}", flush=True)

              with open("/tmp/mariam_v4/all_results.json","w") as f:
                  json.dump(all_out, f, indent=2, default=str)
              print(f"\n>>> TOTAL: {sum(len(v['records']) for v in all_out.values())} records")
          asyncio.run(main())
          PY

          pip install --quiet playwright 2>&1 | tail -1 || true
          python3 -m playwright install chromium 2>&1 | tail -1 || true
          GRANTEE="${GRANTEE}" python3 runner.py 2>&1 | tee /tmp/mariam_v4/run.log
          ls -la /tmp/mariam_v4/
          REMOTE

      - name: Pull
        env:
          SSHPASS:    ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          mkdir -p /tmp/results
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            root@${HETZNER_IP}:/tmp/mariam_v4/ /tmp/results/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariam_v4_${{ inputs.grantee }}
          path: /tmp/results/
