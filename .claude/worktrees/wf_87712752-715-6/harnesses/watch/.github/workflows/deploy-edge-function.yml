name: Deploy Watch Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'harnesses/watch/supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Deploy watch-ingest edge function
        run: |
          supabase functions deploy watch-ingest \
            --project-ref mocerqjnksmhcjzxrewo \
            --import-map harnesses/watch/supabase/functions/watch-ingest/deno.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
