deviation_log:
  - what: "Scope grew from the two HTML files named in the brief to also include two CI
      workflow files (deploy-winnerdata-lms.yml, mirror-deploy.yml) and one test file
      (adminAuthHandler.test.ts) not mentioned in the ticket."
    why: "All three hard-coded the literal old string 'Forgot password?' as a pass/fail
      assertion. Leaving them unfixed would have broken every subsequent deploy of both
      Workers/Pages -- confirmed live when the intermediate LMS deploy failed on exactly
      this before the fix landed. This is the direct, unavoidable consequence of the
      requested rename, not scope creep."
    downstream_impact: "None negative -- both CI pipelines are green again and now assert
      the correct current copy instead of stale copy."

