      (required dropdown: CA/CC/CP/CF/etc.), Sequence# (required), Party Identifier
      (optional), Branch Location (optional). Putnam's tax-deed case_number format
      (YYYY-NNNNNNN, e.g. 2019-0014724) decomposes cleanly into Year=2019, Seq=0014724 --
      query surface IS structurally compatible with our residual case numbers. VERIFIED.
