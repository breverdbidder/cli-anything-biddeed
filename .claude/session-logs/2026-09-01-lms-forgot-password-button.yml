residual_gaps:
  - "winnerdataai-mvp's /admin gate reads LMS_AUTH_USER/LMS_AUTH_PASS as STATIC Cloudflare Pages
    secrets, set once by mirror-deploy.yml from that repo's own GH Actions repo secrets -- not
    read live from the vault per-request. This means after a credential rotation (via this button
    or the Actions UI), /admin will keep accepting the OLD Basic Auth credentials until someone
    re-runs mirror-deploy.yml with winnerdataai-mvp's LMS_AUTH_USER/PASS repo secrets updated to
    match. Confirmed this session by reading mirror-deploy.yml directly (not previously verified --
    the prior session flagged this as UNVERIFIED). Out of scope for this ticket (adding the button,
    not fixing cross-repo secret sync) but a real follow-up: either (a) point winnerdataai-mvp's
    LMS_AUTH_USER/PASS repo secrets at the same vault entries with a sync step, or (b) have
    lms-credential-reset.yml also rewrite winnerdataai-mvp's repo secrets + dispatch its
    mirror-deploy.yml, the same way it already rewrites cli-anything-biddeed's own repo secrets."
  - "This session's live end-to-end test rotated the real LMS_AUTH_USER/LMS_AUTH_PASS a second time
    today (also rotated once in the prior same-day session) -- current live credentials are
    whatever run 33566209165 generated and emailed to everestcapital8@gmail.com. No action needed;
    noting for continuity since two rotations happened in one day."
