session:
  task: "P1 real Forgot Password button on /admin (winnerdataai-mvp) and the LMS 401 page
    (cli-anything-biddeed) -- triggers the #19701 credential-reset workflow directly, no
    GitHub Actions navigation needed"
  date: 2026-09-01
  mode: headless claude -p, no direct psql (SUPABASE_DB_PASSWORD known-broken per prior
    sessions), Supabase Management API (curl, not urllib -- same Cloudflare TLS-fingerprint
    block documented in the prior LMS session) for the migration apply, PostgREST for RPC
    reads/writes, gh CLI for cross-repo commits/dispatch/inspection

decisions:
  - step: 1
    action: "Read the prior same-day session log (.claude/session-logs/2026-09-01-lms-credential-reset.yml)
      and issue #19701 to confirm exactly what 'the #19701 reset workflow' is
      (.github/workflows/lms-credential-reset.yml, workflow_dispatch-only, already live) before
      building anything new. Cloned breverdbidder/winnerdataai-mvp (private, not local to this
      repo) to inspect the real /admin gate: functions/admin.ts + server/adminAuthHandler.ts,
      which mirror workers/winnerdata-lms/src/index.js's checkAuth()/unauthorized() byte-for-byte
      per its own header comment."
    result: "Confirmed the residual gap flagged in the prior session (whether #14/#15's Pages
      Function reads the same vault secrets) resolves differently than assumed: LMS_AUTH_USER/PASS
      for winnerdataai-mvp are set as static Cloudflare Pages secrets by mirror-deploy.yml from
      THAT repo's own GH Actions secrets, not read live from the vault at request time -- so a
      credential rotation does not auto-propagate to /admin until mirror-deploy.yml is re-run with
      updated repo secrets. Documented as a residual gap below; out of scope for this ticket (the
      button here reuses the existing #19701 rotation as-is, doesn't fix cross-repo secret sync)."
    reason: "SEARCH-FIRST MANDATE + K1 think-before-coding -- confirm the actual mechanism instead
      of assuming the brief's premise ('winnerdataai-mvp reads the same vault secrets')."
    tag: VERIFIED

  - step: 2
    action: "Added supabase/migrations/20260901h_lms_reset_request_rate_limit.sql: singleton table
      public.lms_reset_request_state + SECURITY DEFINER function lms_reset_request_trigger()
      enforcing a 1-per-rolling-hour rate limit atomically (SELECT ... FOR UPDATE lock, so two
      near-simultaneous requests can't both pass). EXECUTE revoked from public/anon/authenticated,
      granted only to service_role (same role as the Worker's existing SUPABASE_SERVICE_KEY),
      matching the anon-EXECUTE-revocation pattern already established by
      20260901c_winnerdata_lms_revoke_anon_execute.sql for this same Worker's other RPCs."
    result: "Applied live via Supabase Management API database/query endpoint (curl, not urllib --
      urllib hit the same 403/1010 Cloudflare TLS-fingerprint block documented for Resend in the
      prior session; curl worked first try). HTTP 201. Verified live: RPC returns {ok:true} on
      first call, {ok:false, reason:rate_limited, retry_after_seconds:~3595} on immediate second
      call, then reset the state row back to null via the Management API before doing the real
      end-to-end test below (so that test would exercise the true first-trigger path)."
    reason: "Non-destructive DDL (CREATE TABLE/FUNCTION, zero-HITL per CLAUDE.md Supabase CLI
      section). Chose DB-atomic check-and-set over a Worker-side read-then-write to avoid a TOCTOU
      race between concurrent requests."
    tag: VERIFIED

  - step: 3
    action: "Edited workers/winnerdata-lms/src/index.js: unauthorized() now returns a styled 401
      page (Navy/Amber/Void brand shell) with a 'Forgot password?' button instead of bare
      'Authentication required' text -- the WWW-Authenticate header and 401 status are unchanged,
      only the body a browser shows after the user clicks Cancel. Added POST /admin/reset-request,
      routed BEFORE the checkAuth() gate in fetch() (deliberately unauthenticated -- it IS the
      recovery path). Handler: call lms_reset_request_trigger() (fail closed with a sanitized
      500 on RPC error, 429 + human-readable retry time on rate limit) -> fetch everest_gh_pat via
      cli_anything_get_secret RPC (already-sanctioned accessor per CLAUDE.md CREDENTIAL HANDLING,
      EXECUTE restricted to postgres+service_role, which SUPABASE_SERVICE_KEY satisfies) -> POST
      GitHub's workflow_dispatch API for lms-credential-reset.yml on breverdbidder/cli-anything-biddeed
      @ main -> render a confirmation page. All catch blocks return static, sanitized error text
      only -- never err.message -- so a thrown error can't leak a secret into the HTTP response."
    result: "node --check passed. Committed + pushed (cfefc7e5); deploy-winnerdata-lms.yml
      (push-triggered) ran and succeeded."
    reason: "K3 surgical -- new route added as an early-return special case rather than
      restructuring the existing auth/routing flow; reused the existing rpc() helper and esc()
      unchanged."
    tag: VERIFIED

  - step: 4
    action: "Edited winnerdataai-mvp's server/adminAuthHandler.ts: added LMS_RESET_REQUEST_URL
      (the LMS Worker's live workers.dev URL, same DNS-pending caveat already documented for
      LMS_ORG_URL) and rewrote unauthorizedResponse() to return the identical styled 401 page,
      with the form's action pointing cross-origin at that URL -- a plain form POST full-page
      navigation, not a fetch/XHR, so no CORS wiring needed (simplest of the two options the brief
      offered). Updated adminAuthHandler.test.ts with 2 new assertions (button text + form action)
      and 1 new URL-constant test. Ran the full suite locally (13/13 pass) and tsc --noEmit (clean)
      before pushing."
    result: "Committed + pushed (a9b5fdf) to winnerdataai-mvp. mirror-deploy.yml is
      workflow_dispatch-only (no push trigger) -- manually dispatched it (run 33566036805),
      watched to completion, all steps green including the existing live /admin auth-behavior
      checks in that workflow."
    reason: "TDD -- extended the existing test file rather than skipping coverage, since this repo
      already has vitest infrastructure exercising exactly this function. Did not touch functions/admin.ts
      (unchanged import of unauthorizedResponse()) or LMS_ORG_URL -- out of scope."
    tag: VERIFIED

  - step: 5
    action: "Live DoD verification, in order: (a) curl both 401 pages, confirmed styled body +
      working button HTML on both cli-anything-biddeed's LMS Worker and winnerdataai-mvp's /admin;
      (b) recorded the baseline lms-credential-reset.yml run list (latest prior run 33544968066,
      from the earlier same-day session); (c) POST /admin/reset-request for real -> 200 + reset
      page; (d) confirmed a genuinely NEW run (33566209165, event=workflow_dispatch) appeared
      within 6s; (e) immediately POSTed a second time -> 429 + 'try again in about 60 minutes',
      and confirmed via gh run list that no second run was created; (f) watched run 33566209165 to
      completion -- all 13 steps passed including the real Resend send (id
      1a3600f9-0575-4508-9446-82fdb9fe3b56); (g) independent post-rotation check with zero
      credentials involved: both /healthz (LMS Worker) and /admin (winnerdataai-mvp) still return
      401; (h) grepped the full run log for unmasked secret-shaped tokens -- zero hits (35 '***'
      mask occurrences); grepped both repos' committed diffs for secret VALUES -- only the secret
      NAME string 'everest_gh_pat' appears (the RPC parameter), never a value."
    result: "All 6 DoD bullets satisfied with live evidence, not static file review."
    reason: "SHIP GATE -- VERIFIED-tier: execute, don't just commit; live DB/HTTP proof pasted
      here, not inferred."
    tag: VERIFIED

