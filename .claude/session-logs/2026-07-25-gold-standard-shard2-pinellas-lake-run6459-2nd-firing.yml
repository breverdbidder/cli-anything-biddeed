      zoning districts at all -- confirmed verbatim on eustis.org's own Planning
      Dept page ('Please note the City of Eustis does not have zoning districts').
      Eustis uses Future Land Use (FLU) districts (AG/RR/SR/UR/MH/CBD/GC/GI/MCI/MCR/
