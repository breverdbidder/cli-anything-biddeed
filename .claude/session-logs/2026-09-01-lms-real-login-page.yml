    proof: "curl (no auth) https://winnerdata-lms.brevardbidderai.workers.dev/login
      returns HTTP 200, no WWW-Authenticate header, body contains
      <form method=\"POST\" action=\"/login\"> with name=\"username\" and
      name=\"password\" fields. Root path/other routes 302-redirect here
      instead of sending a 401 challenge (confirmed live in GHA run
      33568690693: '/healthz (no session) returned 302')."
    status: CONFIRMED
  - check: "Forgot password link visible on that same page without any
      Cancel/dismiss action"
    proof: "Same curl response body contains the literal text
      'Forgot password?' inside a second <form method=\"POST\"
      action=\"/admin/reset-request\">, present on first load."
    status: CONFIRMED
  - check: "Correct credentials log in and grant access; session persists
      across at least 2 page navigations"
    proof: "GHA run 33568690693 step 'Verify live - correct credentials...':
      POST /login with real LMS_AUTH_USER/LMS_AUTH_PASS -> 303 + Set-Cookie:
      lms_session=...; same cookie then used for GET /healthz -> 200
      {\"ok\":true,...} and GET /orgs -> 200, two separate curl invocations
      with no credentials re-sent."
    status: CONFIRMED
  - check: "Incorrect credentials show an inline error, not a popup"
    proof: "GHA run 33568690693: POST /login with wrong username/password ->
      HTTP 401, response body contains 'Incorrect username or password.' on
      the same page (no redirect, no WWW-Authenticate)."
    status: CONFIRMED
  - check: "Clicking Forgot password still correctly triggers the
      rate-limited #19702 reset"
    proof: "POST /admin/reset-request handler (handleResetRequest) was not
      modified this session -- still routed before the session-gate check
      in fetch(), still calls lms_reset_request_trigger() then dispatches
      lms-credential-reset.yml exactly as verified live in the prior
