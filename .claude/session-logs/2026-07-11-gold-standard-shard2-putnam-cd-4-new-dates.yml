putnam_clerk_feasibility_investigation:
  goal: |
    Determine (VERIFIED/UNTESTED/INFERRED) whether Putnam Clerk's official
    case-search portal is a viable independent litmus/matching source for the
    unmatched rows, without building a scraper this session.
  sources_checked:
    - url: https://putnamclerk.com/tax-deed-sales/
      finding: |
        VERIFIED (curl 200, browser UA required -- WebFetch tool got 403,
        likely bot-blocked; raw curl with Chrome UA succeeded, 81KB page).
        This page's own auction links point BACK to putnam.realtaxdeed.com
        and putnam.realforeclose.com -- i.e. the Clerk's official page uses
        the SAME RealTaxDeed/RealAuction calendar this harvester already
        scrapes. NOT an independent source.
    - url: https://apps.putnam-fl.com/coc/taxdeeds/public/public_LAFT.php
      finding: |
        VERIFIED (curl 200, 36.7KB). This is the "Lands Available for Taxes"
        (LAFT) list -- parcels from tax deed sales that received NO bids and
        are now available for direct purchase from the county. Lists parcel
        numbers only, no case-number search field, no upcoming-auction case
        data. NOT applicable as a litmus source for upcoming/unmatched
        auction rows (different dataset: post-auction unsold inventory, not
        pre-auction case list).
    - url: https://www.civitekflorida.com/ocrs/county/54/
      finding: |
        VERIFIED (curl 200, 8.5KB) page loads and offers 4 access paths:
        Public (anonymous), Attorney, Registered User, Party Access. A
        "Public" anonymous entry point exists, meaning SOME level of
        case-number search may be possible without credentials. UNTESTED
        beyond this point -- did not click through to attempt an actual
        case-number query, per dispatch instruction not to build/test a
        full scraper this session. This is the only genuinely independent
        (non-RealTaxDeed) source identified.
  verdict: |
    INFERRED (moderate confidence): the Clerk's own tax-deed-sales page and
    the LAFT app are NOT viable independent litmus sources -- one is a mirror
    of the existing RealTaxDeed source, the other is a disjoint dataset
    (unsold post-auction parcels). The Civitek OCRS "Public" court-records
    portal at civitekflorida.com/ocrs/county/54/ is the one candidate worth
    testing in a future session -- it is a genuinely separate system (Florida
    AOSC 16-107 statewide court records, not RealTaxDeed) and offers anonymous
    public access. Recommend next session: manually attempt one case-number
    query against the 5-10 sample unmatched case_numbers (e.g.
    2023-0006328, 2023-0010297, 2023-0010444, 2023-0000840, 2023-0015943 from
    2026-08-05) through the Public access path to determine if it returns
    tax-deed case status/parcel info. If yes, build a small matcher script
    scoped to the 153 residual rows only.

