openapi: 3.0.0
info:
  title: zonewise-agent
  description: >
    ZoneWise zoning lookup tools for the Dify agent.
    Provides parcel lookup (Supabase), zoning regulation lookup,
    and address normalization for Florida county zoning queries.
    Issue: breverdbidder/cli-anything-biddeed#108
  version: 1.0.0

servers:
  - url: http://87.99.129.125:8319
    description: Hetzner zonewise-agent service

paths:
  /address_normalize:
    post:
      operationId: addressNormalize
      summary: Normalize a raw address for database matching
      description: >
        Standardizes address format: expands abbreviations (St→Street, Ave→Avenue,
        Blvd→Boulevard), handles two-word Florida cities (Satellite Beach, Cocoa Beach),
        extracts zip code and state. Returns normalized form and URL-encoded version.
        Call this FIRST before parcel_lookup to maximize match accuracy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Raw address string from user input
                  example: "123 Ocean Blvd, Satellite Beach FL"
                state:
                  type: string
                  description: State abbreviation (default FL)
                  default: FL
      responses:
        "200":
          description: Normalized address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressNormalizeResponse"

  /parcel_lookup:
    post:
      operationId: parcelLookup
      summary: Look up parcel details by address
      description: >
        Queries Supabase sample_properties with a street address to find matching
        parcels. Returns parcel ID, address, zone code, owner, and market value.
        Use this to find the parcel ID and current zone code for an address.
        Pair with zoning_lookup to get full zoning regulations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Street address to look up (use normalized form from addressNormalize)
                  example: "123 Ocean Boulevard, Satellite Beach, FL, 32937"
                county:
                  type: string
                  description: Florida county name (default brevard)
                  default: brevard
                  example: brevard
                limit:
                  type: integer
                  description: Max parcels to return (default 5)
                  default: 5
      responses:
        "200":
          description: Matching parcels with zone codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParcelLookupResponse"

  /zoning_lookup:
    post:
      operationId: zoningLookup
      summary: Retrieve zoning regulations by zone code or parcel ID
      description: >
        Returns zoning district info, development standards (setbacks, height,
        density, lot size), and permitted uses for a given zone code or parcel ID.
        Use this after parcel_lookup to get detailed zoning rules for a parcel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_code:
                  type: string
                  description: Zoning code from parcel_lookup result (e.g. "R-1A", "BU-1", "AU")
                  example: "R-1A"
                parcel_id:
                  type: string
                  description: Parcel ID from parcel_lookup (alternative to zone_code)
                  example: "24-37-15-00-00235-0000.00"
                county:
                  type: string
                  description: Florida county name (default brevard)
                  default: brevard
      responses:
        "200":
          description: Zoning regulations with standards and permitted uses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoningLookupResponse"
        "404":
          description: Zone code not found for the given zone_code or parcel_id

  /health:
    get:
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service is running

components:
  schemas:
    AddressNormalizeResponse:
      type: object
      properties:
        original:
          type: string
          description: Raw input address
        normalized:
          type: string
          description: Normalized address with expanded abbreviations
        city:
          type: string
          nullable: true
          description: Detected Florida city name
        state:
          type: string
          description: State abbreviation (FL)
        zip_code:
          type: string
          nullable: true
          description: 5-digit zip code if present
        street:
          type: string
          nullable: true
          description: Street portion only (number + name)
        encoded:
          type: string
          description: URL-encoded normalized address for API calls

    ParcelResult:
      type: object
      properties:
        parcel_id:
          type: string
          nullable: true
          description: Unique parcel identifier
        address:
          type: string
          nullable: true
          description: Full address from database
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
        zone_code:
          type: string
          nullable: true
          description: Current zoning code (from zoning_assignments)
        zone_source:
          type: string
          nullable: true
          description: Source of zone code (fl_gio, county_gis, use_code_crosswalk)
        county:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
          description: Property owner name
        dor_use_code:
          type: string
          nullable: true
          description: Florida DOR use code
        market_value:
          type: integer
          nullable: true
          description: Just market value in dollars

    ParcelLookupResponse:
      type: object
      properties:
        query:
          type: string
          description: Original address query
        county:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ParcelResult"
        count:
          type: integer
          description: Number of matching parcels found
        queried_at:
          type: string
          format: date-time

    ZoneStandard:
      type: object
      properties:
        standard_type:
          type: string
          nullable: true
          description: Type of standard (e.g. front_setback, max_height, max_density)
        value:
          type: string
          nullable: true
          description: Standard value (numeric or text)
        unit:
          type: string
          nullable: true
          description: Unit of measure (ft, du/ac, etc.)

    ZoningLookupResponse:
      type: object
      properties:
        zone_code:
          type: string
          description: Zoning classification code
        zone_name:
          type: string
          nullable: true
          description: Full name of the zoning district
        category:
          type: string
          nullable: true
          description: Zoning category (Residential, Commercial, Agricultural, etc.)
        description:
          type: string
          nullable: true
          description: District description from ordinance
        standards:
          type: array
          items:
            $ref: "#/components/schemas/ZoneStandard"
          description: Development standards (setbacks, height, density)
        permitted_uses:
          type: array
          items:
            type: string
          description: Permitted and conditional land uses
        county:
          type: string
        queried_at:
          type: string
          format: date-time
